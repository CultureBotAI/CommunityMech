id: https://w3id.org/communitymech
name: communitymech
title: Microbial Community Mechanisms Knowledge Base Schema
description: Schema for modeling microbial community structure, function, and ecological interactions
license: BSD-3-Clause
see_also:
  - https://github.com/CultureBotAI/CommunityMech

imports:
  - linkml:types
  # Shared, byte-identical Mech module: Discussion (knowledge gaps) + Dataset
  # (+ DatasetTypeEnum/DatasetRepositoryEnum). Replaces the former local
  # AssociatedDataset + Dataset enums. Vendored + sha-pinned — claw#7.
  - mech_shared

prefixes:
  linkml: https://w3id.org/linkml/
  communitymech: https://w3id.org/communitymech/
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  GO: http://purl.obolibrary.org/obo/GO_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  CL: http://purl.obolibrary.org/obo/CL_
  OBI: http://purl.obolibrary.org/obo/OBI_
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  doi: https://doi.org/
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#

default_prefix: communitymech

types:
  PMID:
    base: str
    uri: xsd:string

enums:
  EvidenceItemSupportEnum:
    description: >-
      How the cited reference relates to the curated claim. Distinct from the
      validity of the claim itself: REFUTE means the cited paper actively
      contradicts the claim, while WRONG_STATEMENT means the cited paper is
      misattributed (it does not address the claim).
    permissible_values:
      SUPPORT:
        description: >-
          The cited reference directly supports the claim; the snippet is a
          substring of the reference and the surrounding context endorses
          the interaction or property as stated.
      REFUTE:
        description: >-
          The cited reference actively contradicts the claim (e.g., reports
          the opposite effect, or shows the proposed mechanism does not occur
          under the cited conditions).
      PARTIAL:
        description: >-
          The cited reference supports part but not all of the claim. Common
          cases: snippet supports the mechanism but not the specific site,
          taxa, or quantitative figure asserted; or the reference supports a
          related but weaker version of the claim.
      NO_EVIDENCE:
        description: >-
          The cited reference does not contain a passage that addresses the
          claim. Used when the paper is on-topic and a reference is required
          by the schema, but the curator could not locate a supporting (or
          contradicting) excerpt; the snippet records the closest on-topic
          excerpt examined. Stronger than WRONG_STATEMENT (which signals
          misattribution) and weaker than REFUTE.
      WRONG_STATEMENT:
        description: >-
          The cited reference is misattributed - the paper does not address
          the curated claim at all (e.g., wrong DOI/PMID, paper about a
          different system). Distinct from REFUTE, which is reserved for
          references that actively contradict the claim.

  EvidenceSourceEnum:
    description: The provenance/source of the evidence
    permissible_values:
      IN_VITRO:
        description: In vitro experiments (batch culture, bioreactor, etc.)
      IN_VIVO:
        description: In vivo experiments (field studies, host-associated, etc.)
      COMPUTATIONAL:
        description: In silico modeling, simulation, or prediction
      REVIEW:
        description: Review article or meta-analysis
      OTHER:
        description: Other evidence type

  EcologicalStateEnum:
    description: The ecological or health state of the community
    permissible_values:
      STABLE:
        description: Stable, equilibrium community
      PERTURBED:
        description: Recently perturbed (e.g., antibiotic treatment)
      ENGINEERED:
        description: Synthetic or engineered community
      TRANSIENT:
        description: Transient or developing community

  CommunityOriginEnum:
    description: The origin or source of the community
    permissible_values:
      NATURAL:
        description: Naturally occurring community from environment
      ENGINEERED:
        description: Deliberately engineered or synthetic community
      SYNTHETIC:
        description: Fully synthetic community designed in laboratory

  MediaRelationshipEnum:
    description: >-
      Type of relationship between a microbial community and a growth medium.
      Distinguishes actual cultivation media from environmentally related media.
    permissible_values:
      CULTIVATION_MEDIUM:
        description: Medium actually used for cultivation of community members
      ISOLATION_MEDIUM:
        description: Medium used for initial isolation of community members from the environment
      ENVIRONMENT_ANALOG:
        description: Medium designed to mimic the community's natural environment
      REFERENCED_IN_STUDY:
        description: Medium referenced in a study of this community but not necessarily used for cultivation
      SELECTIVE_ENRICHMENT:
        description: Medium used for selective enrichment of specific functional groups within the community

  CommunityCategoryEnum:
    description: Broad functional/ecological category of the community
    permissible_values:
      BIOMINING:
        description: Metal extraction and bioleaching systems
      AMD:
        description: Acid mine drainage communities
      SYNTROPHY:
        description: Syntrophic metabolic cooperation
      PHYTOPLANKTON:
        description: Algae-bacteria associations
      RHIZOSPHERE:
        description: Plant root-associated communities
      ORAL:
        description: Oral microbiome and dental biofilm communities
      LIGNOCELLULOSE:
        description: Lignocellulose degradation systems
      METHANOGENESIS:
        description: Methane-producing communities
      DIET:
        description: Direct interspecies electron transfer
      METAL_REDUCTION:
        description: Metal-reducing communities
      BIOREMEDIATION:
        description: Pollutant degradation and remediation
      CARBON_SEQUESTRATION:
        description: Carbon fixation and storage
      EXTREME_ENVIRONMENT:
        description: Communities from extreme conditions
      BIOTECHNOLOGY:
        description: Industrial biotechnology applications
      OTHER:
        description: Other or uncategorized communities

  InteractionTypeEnum:
    description: Type of ecological interaction between organisms
    permissible_values:
      MUTUALISM:
        description: Both organisms benefit (+/+)
      COMMENSALISM:
        description: One benefits, other unaffected (+/0)
      CROSS_FEEDING:
        description: Metabolite exchange between organisms
      COMPETITION:
        description: Both negatively affected (-/-)
      PREDATION:
        description: One benefits, other harmed (+/-)
      SYNTROPHY:
        description: Obligate metabolic cooperation
      NICHE_PARTITIONING:
        description: Strains/species occupy distinct ecological niches, reducing competition through spatial or temporal separation
        comments: >-
          Examples include compartment partitioning (rhizosphere vs endosphere), temporal succession,
          or substrate specialization. Common in intraspecific strain dynamics where closely related
          organisms coexist by utilizing different resources or microhabitats.
      STRAIN_COMPETITION:
        description: Intraspecific competition between closely related strains of the same species
        comments: >-
          Distinct from interspecific COMPETITION, this captures strain-level competitive dynamics
          within a single species. May involve allelopathy, resource competition, or interference
          competition between genetically similar organisms.
      COLONIZATION_FACILITATION:
        description: One organism facilitates the colonization or establishment of another through priority effects or niche modification
        comments: >-
          Includes priority effects where early colonizers modify the environment to enable subsequent
          colonization, cross-feeding that supports establishment, or metabolic cooperation during
          initial colonization phases. Can be inter- or intraspecific.

  InteractionScopeEnum:
    description: Whether an interaction is a pairwise organism-to-organism edge or a community-level phenomenon
    permissible_values:
      PAIRWISE:
        description: Standard pairwise interaction between a source organism and (usually) a target. Requires source_taxon.
      COMMUNITY_LEVEL:
        description: >-
          Community-wide or emergent phenomenon (e.g., division of labor, host-microbiota
          colonization patterns, abiotic-input-driven processes such as electrolysis-supplied H2).
          source_taxon may be omitted because no single organism is the source.

  AbundanceEnum:
    description: Relative abundance categories
    permissible_values:
      DOMINANT:
        description: Greater than 1% relative abundance
      ABUNDANT:
        description: 0.1-1% relative abundance
      COMMON:
        description: 0.01-0.1% relative abundance
      RARE:
        description: Less than 0.01% relative abundance

  FunctionalRoleEnum:
    description: Functional role in the community
    permissible_values:
      PRIMARY_PRODUCER:
        description: Fixes carbon (autotroph)
      PRIMARY_DEGRADER:
        description: Degrades complex substrates
      SECONDARY_FERMENTER:
        description: Ferments products from primary degraders
      SYNTROPHIC_PARTNER:
        description: Engages in syntrophic metabolism
      CROSS_FEEDER:
        description: Utilizes metabolites from other taxa
      ELECTRON_DONOR:
        description: >-
          Donates electrons in interspecies or extracellular electron transfer
          (e.g. the electron-donating partner in DIET).
      ELECTRON_ACCEPTOR:
        description: >-
          Accepts electrons in interspecies or extracellular electron transfer
          (e.g. the electron-accepting methanogen in DIET).
      ELECTROGEN:
        description: >-
          Exoelectrogen; transfers electrons to an extracellular solid acceptor
          such as an anode or a metal (Fe/Mn) oxide.
      ELECTROTROPH:
        description: >-
          Takes up electrons from an extracellular donor such as a cathode
          (electrotrophy / extracellular electron uptake).

  AtmosphereEnum:
    description: Atmospheric/oxygen requirements for growth
    permissible_values:
      AEROBIC:
        description: Requires oxygen for growth
      ANAEROBIC:
        description: Growth only in absence of oxygen (strict anaerobe)
      MICROAEROBIC:
        description: Requires low oxygen levels (typically 2-10%)
      FACULTATIVE_ANAEROBIC:
        description: Can grow with or without oxygen
      FACULTATIVE_AEROBIC:
        description: Preferentially aerobic but can grow anaerobically
      CAPNOPHILIC:
        description: Requires elevated CO2 levels

  ExternalResourceRepositoryEnum:
    description: External repositories and platforms that host community model resources
    permissible_values:
      BIOMODELS:
        description: BioModels database
      KBASE:
        description: KBase Narrative platform
      BIGG:
        description: BiGG Models
      VMH:
        description: Virtual Metabolic Human
      MODELSEED:
        description: ModelSEED resources
      GITHUB:
        description: GitHub repository
      OTHER:
        description: Other resource repository

  CultureCollectionEnum:
    description: Major microbial culture collections worldwide
    permissible_values:
      ATCC:
        description: American Type Culture Collection (USA)
      DSM:
        description: Deutsche Sammlung von Mikroorganismen (DSMZ, Germany)
      JCM:
        description: Japan Collection of Microorganisms (Japan)
      NCTC:
        description: National Collection of Type Cultures (UK)
      CCUG:
        description: Culture Collection University of Gothenburg (Sweden)
      PCC:
        description: Pasteur Culture Collection of Cyanobacteria (France)
      NCIMB:
        description: National Collection of Industrial Marine Bacteria (UK)
      LMG:
        description: BCCM/LMG Bacteria Collection (Belgium)
      KCTC:
        description: Korean Collection for Type Cultures (Korea)
      CIP:
        description: Collection de l'Institut Pasteur (France)
      NBRC:
        description: NITE Biological Resource Center (Japan)
      VKM:
        description: All-Russian Collection of Microorganisms (Russia)
      CGMCC:
        description: China General Microbiological Culture Collection (China)
      BCRC:
        description: Bioresource Collection and Research Center (Taiwan)
      CBS:
        description: Westerdijk Fungal Biodiversity Institute (Netherlands)
      OTHER:
        description: Other culture collection not listed

  MetalElementEnum:
    description: Metal elements relevant to microbial communities
    permissible_values:
      COPPER:
        meaning: CHEBI:29036
        description: Copper(2+) cation
      IRON:
        meaning: CHEBI:29033
        description: Iron(2+) cation
      ZINC:
        meaning: CHEBI:27363
        description: Zinc(2+) cation
      NICKEL:
        meaning: CHEBI:49786
        description: Nickel(2+) cation
      COBALT:
        meaning: CHEBI:48828
        description: Cobalt(2+) cation
      VANADIUM:
        meaning: CHEBI:27698
        description: Vanadium cation
      URANIUM:
        meaning: CHEBI:27214
        description: Uranium atom
      CHROMIUM:
        meaning: CHEBI:28073
        description: Chromium atom
      LEAD:
        meaning: CHEBI:25016
        description: Lead(2+) cation
      LITHIUM:
        meaning: CHEBI:49713
        description: Lithium(1+) cation
      GOLD:
        meaning: CHEBI:29287
        description: Gold atom
      SILVER:
        meaning: CHEBI:30512
        description: Silver(1+) cation
      PALLADIUM:
        meaning: CHEBI:33373
        description: Palladium atom
      GALLIUM:
        meaning: CHEBI:49631
        description: Gallium(3+) cation
      INDIUM:
        meaning: CHEBI:49464
        description: Indium(3+) cation
      TITANIUM:
        meaning: CHEBI:33341
        description: Titanium atom
      MERCURY:
        meaning: CHEBI:16793
        description: Mercury(2+) cation

  RareEarthElementEnum:
    description: Rare earth elements (lanthanides + Y, Sc)
    permissible_values:
      LANTHANUM:
        meaning: CHEBI:32359
        description: Lanthanum(3+) cation
      CERIUM:
        meaning: CHEBI:32998
        description: Cerium(3+) cation
      PRASEODYMIUM:
        meaning: CHEBI:49648
        description: Praseodymium(3+) cation
      NEODYMIUM:
        meaning: CHEBI:33372
        description: Neodymium(3+) cation
      SAMARIUM:
        meaning: CHEBI:33376
        description: Samarium(3+) cation
      EUROPIUM:
        meaning: CHEBI:30688
        description: Europium(3+) cation
      GADOLINIUM:
        meaning: CHEBI:33375
        description: Gadolinium(3+) cation
      TERBIUM:
        meaning: CHEBI:33374
        description: Terbium(3+) cation
      DYSPROSIUM:
        meaning: CHEBI:49782
        description: Dysprosium(3+) cation
      HOLMIUM:
        meaning: CHEBI:49649
        description: Holmium(3+) cation
      ERBIUM:
        meaning: CHEBI:49650
        description: Erbium(3+) cation
      THULIUM:
        meaning: CHEBI:33377
        description: Thulium(3+) cation
      YTTERBIUM:
        meaning: CHEBI:33378
        description: Ytterbium(3+) cation
      LUTETIUM:
        meaning: CHEBI:33382
        description: Lutetium(3+) cation
      YTTRIUM:
        meaning: CHEBI:49976
        description: Yttrium(3+) cation
      SCANDIUM:
        meaning: CHEBI:33330
        description: Scandium(3+) cation

  MetalRelevanceEnum:
    description: Relevance of metals/REE to community function
    permissible_values:
      PRIMARY:
        description: Primary function involves metal/REE extraction or cycling
      SIGNIFICANT:
        description: Significant metal/REE metabolism but not primary function
      INCIDENTAL:
        description: Incidental metal/REE interaction
      NOT_APPLICABLE:
        description: No significant metal/REE relevance

  CultivationModeEnum:
    description: >-
      Operating mode / approach used to cultivate the community. Standardized
      terms maintained in vocab/cultivation_terms.yaml (kept in sync by
      tests/test_cultivation_vocab_sync.py) and staged for a METPO proposal.
    permissible_values:
      BATCH:
        description: Closed culture with no nutrient addition or removal after inoculation.
      FED_BATCH:
        description: Nutrients fed during the run, with no removal of culture broth.
      CONTINUOUS:
        description: >-
          Fresh medium added and culture withdrawn continuously, typically at
          steady state.
      SEMI_CONTINUOUS:
        description: Periodic partial harvest and replacement of medium (draw-and-fill).
      CHEMOSTAT:
        description: >-
          Continuous culture held at steady state by a fixed dilution rate and a
          growth-limiting nutrient.
      TURBIDOSTAT:
        description: >-
          Continuous culture controlled to hold constant turbidity / cell density.
      PERFUSION:
        description: >-
          Continuous medium exchange with biomass retention (cells retained while
          spent medium is removed).
      SEQUENCING_BATCH:
        description: Repeated fill / react / settle / draw cycles in a single vessel.
      RETENTOSTAT:
        description: >-
          Continuous culture with complete biomass retention, approaching
          near-zero growth rate.
      OTHER:
        description: Other cultivation mode not covered by the listed values.

  CultivationSystemEnum:
    description: >-
      Instrumentation / vessel system used to grow the community. Standardized
      terms maintained in vocab/cultivation_terms.yaml (kept in sync by
      tests/test_cultivation_vocab_sync.py) and staged for a METPO proposal.
    permissible_values:
      STIRRED_TANK_BIOREACTOR:
        description: Mechanically stirred tank reactor (CSTR-type).
      PHOTOBIOREACTOR:
        description: Light-driven reactor for cultivating phototrophic organisms.
      MICROBIAL_FUEL_CELL:
        description: >-
          Bioelectrochemical system that generates electric current from
          microbial metabolism.
      BIOELECTROCHEMICAL_SYSTEM:
        description: >-
          Electrode-coupled reactor (broader than a microbial fuel cell), e.g.
          microbial electrolysis or electrosynthesis cells.
      CHEMOSTAT_VESSEL:
        description: A vessel configured for chemostat (dilution-rate-controlled) continuous culture.
      MEMBRANE_BIOREACTOR:
        description: Reactor coupling cultivation with a membrane for biomass/liquid separation.
      SERUM_BOTTLE:
        description: Sealed serum bottle, commonly used for anaerobic cultivation.
      FLASK:
        description: Erlenmeyer / shake flask.
      GAS_LIFT_REACTOR:
        description: Pneumatically mixed reactor (airlift / gas-lift).
      PACKED_BED_REACTOR:
        description: Reactor with a fixed packed support matrix for biofilm growth.
      MICROFLUIDIC_DEVICE:
        description: Microfluidic cultivation chip / device.
      HOLLOW_FIBER_REACTOR:
        description: Hollow-fiber membrane cultivation system.
      BIOREACTOR_UNSPECIFIED:
        meaning: OBI:0001046
        description: Bioreactor of unspecified type.
      OTHER:
        description: Other cultivation system not covered by the listed values.

classes:
  Term:
    description: An ontology term with ID and label
    attributes:
      id:
        description: The ontology term ID (e.g., NCBITaxon:1140, CHEBI:17992)
        required: true
      label:
        slot_uri: rdfs:label
        description: >-
          The CANONICAL ontology label for `id` (e.g. "activated sludge" for
          ENVO:00002046). Verified against the ontology by the id↔label gate;
          free/project names belong in the sibling `preferred_term`, not here.
        required: true

  EvidenceItem:
    description: An evidence item linking a claim to a publication
    attributes:
      reference:
        description: The publication reference (PMID:12345678 or doi:10.1038/... format required)
        required: true
        pattern: "^(PMID:|doi:|bioproject:).*"
        implements:
          - linkml:authoritative_reference
      supports:
        description: Level of support this evidence provides
        range: EvidenceItemSupportEnum
        required: true
      evidence_source:
        description: Type of evidence (in vitro, computational, etc.)
        range: EvidenceSourceEnum
        required: true
      snippet:
        description: Exact quote from the publication supporting the claim (required for proper evidence)
        required: true
        minimum_value: 10
        implements:
          - linkml:excerpt
      explanation:
        description: How this evidence supports or refutes the claim
      confidence_score:
        description: Confidence in this evidence (0.0-1.0), based on snippet validation
        range: float
        minimum_value: 0.0
        maximum_value: 1.0

  TaxonDescriptor:
    description: Describes an organism with NCBITaxon term
    attributes:
      preferred_term:
        description: Human-readable organism name
        required: true
      term:
        description: NCBITaxon ontology term
        range: Term
        required: true
        # id↔label gate (range-less binding → label check, no enum expansion)
        bindings:
          - binds_value_of: id
            obligation_level: REQUIRED
      notes:
        description: Additional notes about this organism

  MetaboliteDescriptor:
    description: Describes a metabolite with CHEBI term
    attributes:
      preferred_term:
        description: Human-readable metabolite name
        required: true
      term:
        description: CHEBI ontology term
        range: Term
        required: true
        bindings:
          - binds_value_of: id
            obligation_level: REQUIRED
      concentration:
        description: Measured concentration or amount
      notes:
        description: Additional notes

  BiologicalProcessDescriptor:
    description: Describes a biological process with GO term
    attributes:
      preferred_term:
        description: Human-readable process name
        required: true
      term:
        description: GO biological process term
        range: Term
        required: true
        bindings:
          - binds_value_of: id
            obligation_level: REQUIRED
      notes:
        description: Additional notes

  EnvironmentDescriptor:
    description: Describes an environment with ENVO term
    attributes:
      preferred_term:
        description: Human-readable environment name
        required: true
      term:
        description: ENVO ontology term
        range: Term
        required: true
        bindings:
          - binds_value_of: id
            obligation_level: REQUIRED
      notes:
        description: Additional notes

  CultureCollectionID:
    description: A culture collection identifier with accession number
    attributes:
      collection:
        description: The culture collection name
        range: CultureCollectionEnum
        required: true
      accession:
        description: The accession number in this collection
        required: true
      url:
        description: Direct URL to the strain in the collection catalog
      notes:
        description: Additional information about this collection entry

  StrainDesignation:
    description: Detailed strain-level information for reproducibility
    attributes:
      strain_name:
        description: The formal strain designation (e.g., "DSM 8584", "PCC 7942", "ATCC 12345")
      culture_collections:
        description: Culture collection identifiers for this strain
        range: CultureCollectionID
        multivalued: true
      type_strain:
        description: Whether this is the nomenclatural type strain for the species
        range: boolean
      genome_accession:
        description: NCBI Assembly accession (e.g., GCF_000203695.1)
      genome_url:
        description: Direct URL to NCBI Assembly
      genetic_modification:
        description: Description of genetic modifications (for engineered strains)
      isolation_source:
        description: Original isolation source of the strain
      notes:
        description: Additional strain-specific information

  TaxonomicComposition:
    description: A taxon present in the community with abundance and role
    attributes:
      taxon_term:
        description: The organism
        range: TaxonDescriptor
        required: true
      strain_designation:
        description: Strain-level identification and culture collection info
        range: StrainDesignation
      abundance_level:
        description: Relative abundance category
        range: AbundanceEnum
      abundance_value:
        description: >-
          DEPRECATED free-text quantitative abundance. Prefer the typed
          absolute_abundance / relative_abundance fields below; retained for
          back-compatibility with records that used a single combined value.
      absolute_abundance:
        description: >-
          Absolute abundance of this taxon (e.g. cell count, CFU/mL, read count,
          gene copies). Optional and independent of relative_abundance; pair with
          absolute_abundance_unit.
        range: float
        required: false
      absolute_abundance_unit:
        description: >-
          Unit/basis for absolute_abundance (e.g. cells/mL, CFU/mL, reads,
          copies/g).
        required: false
      relative_abundance:
        description: >-
          Relative abundance of this taxon within the community. Optional and
          independent of absolute_abundance. Interpreted as a fraction in [0, 1]
          unless relative_abundance_unit says otherwise (e.g. percent).
        range: float
        required: false
        minimum_value: 0
      relative_abundance_unit:
        description: >-
          Unit/basis for relative_abundance (e.g. "fraction", "percent",
          "16S rRNA reads", "metagenome relative abundance"). Defaults to a
          fraction in [0, 1] when omitted.
        required: false
      common_taxon:
        description: >-
          Reference to a reusable CommonTaxon record (kb/taxa/) that holds the
          genome and gene annotations for this organism, so the same curated gene
          set can be shared across community records.
        required: false
        pattern: "^CommunityMech:taxon:\\d{6}$"
      functional_role:
        description: Role(s) in the community
        range: FunctionalRoleEnum
        multivalued: true
      evidence:
        description: Evidence for this organism's presence and role
        range: EvidenceItem
        multivalued: true

  InteractionDownstream:
    description: A downstream target in a causal interaction graph
    attributes:
      target:
        description: Name of the downstream interaction
        required: true
      description:
        description: Description of the causal link

  EcologicalInteraction:
    description: An interaction between organisms or metabolic processes
    attributes:
      name:
        description: Name of this interaction
        required: true
      description:
        description: Detailed description of the interaction
      interaction_type:
        description: Type of ecological interaction
        range: InteractionTypeEnum
      scope:
        description: Whether this interaction is a pairwise organism-to-organism edge
          or a community-level/emergent phenomenon. PAIRWISE interactions require a
          source_taxon. COMMUNITY_LEVEL interactions describe behaviors that emerge
          from the whole consortium (or are driven by abiotic inputs such as
          electrolysis-supplied H2) and need not have source_taxon set.
        range: InteractionScopeEnum
        ifabsent: string(PAIRWISE)
      source_taxon:
        description: Source organism (if applicable; required for PAIRWISE interactions,
          omitted for COMMUNITY_LEVEL interactions)
        range: TaxonDescriptor
      target_taxon:
        description: Target organism (if applicable)
        range: TaxonDescriptor
      metabolites:
        description: Metabolites involved in the interaction
        range: MetaboliteDescriptor
        multivalued: true
      biological_processes:
        description: Biological processes involved
        range: BiologicalProcessDescriptor
        multivalued: true
      downstream:
        description: Downstream effects in causal graph
        range: InteractionDownstream
        multivalued: true
      evidence:
        description: Evidence for this interaction
        range: EvidenceItem
        multivalued: true

  EnvironmentalFactor:
    description: An environmental condition or parameter
    attributes:
      name:
        description: Name of the environmental factor
        required: true
      value:
        description: Measured or specified value
      unit:
        description: Unit of measurement
      description:
        description: Description of this factor
      evidence:
        description: Evidence for this condition
        range: EvidenceItem
        multivalued: true

  GrowthMediaComponent:
    description: A component of growth media (nutrient, salt, buffer, etc.)
    attributes:
      name:
        description: Name of the component
        required: true
      media_ingredient_mech_id:
        description: Identifier in MediaIngredientMech database (e.g., MediaIngredientMech:000001)
        pattern: "^MediaIngredientMech:\\d{6}$"
      media_ingredient_mech_url:
        description: URL to MediaIngredientMech ingredient entry
      concentration:
        description: Concentration value
      unit:
        description: Unit of measurement for concentration
      chebi_term:
        description: CHEBI term for the component
        range: MetaboliteDescriptor
      from_source:
        description: Source of this ingredient (e.g., "CultureMech", "community_curated")

  GrowthMedia:
    description: Growth media used for cultivation of the community or its members
    attributes:
      name:
        description: Name of the growth medium
        required: true
      culturemech_id:
        description: Identifier in CultureMech media database (e.g., CultureMech:000001)
        pattern: "^CultureMech:\\d{6}$"
      culturemech_url:
        description: URL to CultureMech media entry
      composition:
        description: Components of the growth medium
        range: GrowthMediaComponent
        multivalued: true
      ph:
        description: pH of the medium
      ph_range:
        description: pH range for growth (e.g., "5.5-7.0")
      temperature:
        description: Incubation temperature
      temperature_unit:
        description: Unit for temperature (e.g., °C, K)
      temperature_range:
        description: Temperature range for growth (e.g., "25-37")
      atmosphere:
        description: Atmospheric/oxygen requirements
        range: AtmosphereEnum
      headspace_gas:
        description: Gas composition in headspace (e.g., "N2/CO2 80:20", "H2/CO2 80:20")
      salinity:
        description: Salinity of the medium (NaCl equivalent)
      salinity_unit:
        description: Unit for salinity (%, M, g/L, ppt)
      pressure:
        description: Pressure for cultivation (relevant for extremophiles)
      pressure_unit:
        description: Unit for pressure (atm, bar, MPa, psi)
      light_regime:
        description: Light/dark cycle (e.g., "16h/8h", "continuous", "dark")
      light_intensity:
        description: Light intensity value
      light_intensity_unit:
        description: Unit for light intensity (μmol photons/m²/s, lux, W/m²)
      redox_potential:
        description: Oxidation-reduction potential
      redox_potential_unit:
        description: Unit for redox (mV vs SHE, Eh)
      inoculum_source:
        description: Source of inoculum
      inoculum_size:
        description: Initial cell density or transfer percentage
      inoculum_unit:
        description: Unit for inoculum (cells/mL, OD600, %v/v, CFU/mL)
      incubation_time:
        description: Duration of incubation
      incubation_time_unit:
        description: Unit for incubation time (hours, days, weeks)
      shaking_speed:
        description: Shaking/agitation speed for liquid cultures
      shaking_speed_unit:
        description: Unit for shaking (rpm, oscillations/min)
      vessel_type:
        description: Type of cultivation vessel (flask, tube, bioreactor, plate, etc.)
      preparation_notes:
        description: Additional preparation details or modifications
      protocol_url:
        description: URL to detailed protocol (e.g., protocols.io, dx.doi.org)
      evidence:
        description: Evidence for this growth medium
        range: EvidenceItem
        multivalued: true

  RelatedMedia:
    description: >-
      A CultureMech medium relevant to this community through shared environment,
      organism overlap, or study context. Complements GrowthMedia (which captures
      media actually used for cultivation) by enabling environment-based discovery
      of potentially useful media across the CultureMech repository.
    attributes:
      preferred_term:
        description: Human-readable media name (should match CultureMech record name)
        required: true
        range: string
      culturemech_id:
        description: CultureMech identifier for this medium
        required: false
        range: string
        pattern: "^CultureMech:\\d{6}$"
      relationship_type:
        description: How this medium relates to the community
        range: MediaRelationshipEnum
        required: false
      shared_environment_term:
        description: >-
          ENVO term for the shared environment linking this medium to the community.
          Enables SPARQL joins between CommunityMech environment_term and
          CultureMech source_environment.
        range: Term
        required: false
        bindings:
          - binds_value_of: id
            obligation_level: REQUIRED
      relevance_notes:
        description: Why this medium is relevant to the community
        range: string
        required: false
      evidence:
        description: Evidence supporting the media-community relationship
        range: EvidenceItem
        multivalued: true

  RelatedIngredient:
    description: >-
      A MediaIngredientMech ingredient relevant to this community's environment
      or metabolism. Complements GrowthMediaComponent (which captures ingredients
      in actual cultivation media) by linking to environmentally significant
      compounds that may not be in any currently used medium.
    attributes:
      preferred_term:
        description: Human-readable ingredient name (should match MediaIngredientMech record)
        required: true
        range: string
      mediaingredientmech_id:
        description: MediaIngredientMech identifier
        required: false
        range: string
        pattern: "^MediaIngredientMech:\\d{6}$"
      chebi_term:
        description: CHEBI ontology term for the ingredient compound
        range: Term
        required: false
        bindings:
          - binds_value_of: id
            obligation_level: REQUIRED
      relevance:
        description: Why this ingredient is relevant to the community
        required: false
        range: string
      evidence:
        description: Evidence supporting the ingredient-community relationship
        range: EvidenceItem
        multivalued: true

  ExternalResource:
    description: An external model or narrative resource linked to the community
    attributes:
      name:
        description: Human-readable name for this resource
        required: true
      repository:
        description: Repository or platform where this resource is hosted
        range: ExternalResourceRepositoryEnum
        required: true
      resource_id:
        description: Repository identifier (e.g., MODEL2405300001, ws.73218.obj.75)
        required: true
      url:
        description: Direct URL to the resource
        required: true
      description:
        description: Description of the resource and its relevance
      evidence:
        description: Evidence linking this resource to the community
        range: EvidenceItem
        multivalued: true

  CommunityEngineeringDesign:
    description: Design intent and implementation details for engineered or synthetic communities
    attributes:
      objective:
        description: Primary design objective or experimental hypothesis
      assembly_strategy:
        description: How member strains were selected and assembled
      inoculation_strategy:
        description: How the initial inoculum was composed and introduced
      passaging_regimen:
        description: Serial transfer or cultivation regimen used for stabilization and selection
      perturbation_design:
        description: Planned perturbations applied to probe or tune community behavior
      measurement_endpoints:
        description: Primary readouts used to evaluate design outcomes
        multivalued: true
      protocol_url:
        description: URL to an assembly or cultivation protocol, if available
      notes:
        description: Additional engineering-design details
      evidence:
        description: Evidence supporting the engineering-design description
        range: EvidenceItem
        multivalued: true

  CultivationSetup:
    description: >-
      Hardware/instrumentation and cultivation mode used to grow or sustain the
      community. Optional — not all communities have a defined setup. Captures
      both the system (e.g. stirred-tank bioreactor, photobioreactor, microbial
      fuel cell) and the operating approach (batch, fed-batch, continuous, …).
      Complements GrowthMedia (medium composition/conditions); the controlled
      cultivation_mode/system_type values are the preferred standardized home for
      vessel/reactor information going forward (vs the legacy free-text
      GrowthMedia.vessel_type).
    attributes:
      cultivation_mode:
        description: Operating mode / approach used to cultivate the community.
        range: CultivationModeEnum
      system_type:
        description: Instrumentation / vessel system used.
        range: CultivationSystemEnum
      instrument_detail:
        description: Distinguishing detail about the system not captured by system_type.
      manufacturer_model:
        description: Manufacturer and/or model designation of the instrument.
      working_volume:
        description: Working (culture) volume.
        range: float
      working_volume_unit:
        description: Unit for working_volume (e.g. mL, L).
      operating_temperature:
        description: Operating/setpoint temperature of the cultivation system.
        range: float
      operating_temperature_unit:
        description: Unit for operating_temperature (e.g. C, K).
      feed_or_dilution_rate:
        description: >-
          Feed rate (fed-batch) or dilution rate (continuous/chemostat); disambiguated
          by cultivation_mode.
        range: float
      feed_or_dilution_rate_unit:
        description: Unit for feed_or_dilution_rate (e.g. h^-1, mL/h).
      retention_time:
        description: Hydraulic or solids retention time (see retention_time_type).
        range: float
      retention_time_unit:
        description: Unit for retention_time (e.g. h, d).
      retention_time_type:
        description: Which retention time is reported (e.g. "HRT" or "SRT").
      applied_potential:
        description: Applied electrode potential (bioelectrochemical / fuel-cell systems).
        range: float
      applied_potential_unit:
        description: Unit/reference for applied_potential (e.g. "mV vs SHE", V).
      electrode_detail:
        description: >-
          Electrode configuration/materials for bioelectrochemical systems
          (anode/cathode material, surface area, etc.).
      ph_controlled:
        description: Whether pH was actively controlled.
        range: boolean
      do_controlled:
        description: Whether dissolved oxygen was actively controlled.
        range: boolean
      temperature_controlled:
        description: Whether temperature was actively controlled.
        range: boolean
      controls_notes:
        description: Free-text notes on process control not captured by the boolean flags.
      protocol_url:
        description: URL to the cultivation protocol.
      notes:
        description: Additional notes about the cultivation setup.
      evidence:
        description: Evidence supporting the cultivation-setup description.
        range: EvidenceItem
        multivalued: true

  MicrobialCommunity:
    tree_root: true
    description: A microbial community with composition and interactions
    attributes:
      id:
        description: Unique identifier for this community (e.g., CommunityMech:000001)
        identifier: true
        required: true
        pattern: "^CommunityMech:\\d{6}$"
      name:
        description: Community name
        required: true
      description:
        description: Overview of the community
      ecological_state:
        description: State of the community (stable, engineered, etc.)
        range: EcologicalStateEnum
      community_origin:
        description: Origin of the community (natural, engineered, or synthetic)
        range: CommunityOriginEnum
      community_category:
        description: Broad functional or ecological category
        range: CommunityCategoryEnum
      engineering_design:
        description: Explicit engineering design and implementation details for this community
        range: CommunityEngineeringDesign
      environment_term:
        description: Environment where community exists
        range: EnvironmentDescriptor
      taxonomy:
        description: Organisms present in the community
        range: TaxonomicComposition
        multivalued: true
      ecological_interactions:
        description: Interactions between organisms and processes
        range: EcologicalInteraction
        multivalued: true
      environmental_factors:
        description: Environmental conditions
        range: EnvironmentalFactor
        multivalued: true
      growth_media:
        description: Growth media used for cultivation
        range: GrowthMedia
        multivalued: true
      cultivation_setup:
        description: >-
          Hardware setup and cultivation mode(s) used to grow/sustain the
          community. Optional; not all communities have a defined setup.
        range: CultivationSetup
        multivalued: true
        required: false
        inlined_as_list: true
      related_media:
        description: >-
          CultureMech media relevant to this community through shared environment,
          organism overlap, or study context. For media actually used in cultivation,
          use the growth_media field instead.
        range: RelatedMedia
        multivalued: true
        required: false
        inlined_as_list: true
      related_ingredients:
        description: >-
          MediaIngredientMech ingredients relevant to this community's environment
          or metabolism. For ingredients in actual cultivation media, see
          growth_media.composition instead.
        range: RelatedIngredient
        multivalued: true
        required: false
        inlined_as_list: true
      associated_datasets:
        description: Omics and other datasets associated with this community
        range: Dataset
        multivalued: true
      external_resources:
        description: External model and narrative resources linked to this community
        range: ExternalResource
        multivalued: true
      metals_present:
        description: Metals present or processed by this community
        range: MetalElementEnum
        multivalued: true
      rare_earth_elements_present:
        description: Rare earth elements present or processed by this community
        range: RareEarthElementEnum
        multivalued: true
      metal_relevance:
        description: Overall relevance of this community for metal/REE processing
        range: MetalRelevanceEnum
      metal_notes:
        description: Additional context on metal/REE processing mechanisms or significance
        range: string
      curation_history:
        description: >-
          Append-only audit trail of curation actions that modified this
          community record. Populated by ``record_curation_event()`` from
          ``communitymech.curate.curation_event``.
        range: CurationEvent
        multivalued: true
        inlined_as_list: true

  CurationEvent:
    description: >-
      A timestamped curator action on a MicrobialCommunity. Mirrors the
      shape used by sibling Mech repos (CultureMech, MediaIngredientMech,
      TraitMech) so cross-repo tooling can read curation events uniformly.
    attributes:
      timestamp:
        range: datetime
        required: true
        description: When this action occurred (ISO-8601 UTC).
      curator:
        required: true
        description: Who performed this action (script name or human identifier).
      action:
        range: string
        required: true
        pattern: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
        description: >-
          SCREAMING_SNAKE_CASE action label minted by the curation tool
          that produced this event (e.g. ``"ADD_COMMUNITY_IDS"``,
          ``"FIX_NETWORK_INTEGRITY"``).
      changes:
        description: Description of what changed.
      llm_assisted:
        range: boolean
        description: Whether LLM assistance was used.

  # -- Reusable per-taxon gene records ------------------------------------
  # CommonTaxon records live as standalone YAML files under kb/taxa/ and are
  # referenced from MicrobialCommunity.taxonomy[].common_taxon, so a curated set
  # of genome + gene annotations for an organism can be shared across community
  # records instead of being duplicated in each one. Validate these files with
  # ``just validate-taxa`` (linkml-validate --target-class CommonTaxon).
  CommonTaxon:
    description: >-
      A reusable taxon record: an NCBITaxon-grounded organism together with its
      reference genome(s) and the genes known to support its community role(s) or
      specific ecological interactions. Maintained once and referenced by many
      community records.
    attributes:
      id:
        description: Unique identifier for this common-taxon record.
        identifier: true
        required: true
        pattern: "^CommunityMech:taxon:\\d{6}$"
      taxon_term:
        description: NCBITaxon-grounded organism this record describes.
        range: TaxonDescriptor
        required: true
      genomes:
        description: Reference genome assembly(ies) for this taxon.
        range: GenomeRecord
        multivalued: true
        inlined_as_list: true
      genes:
        description: >-
          Genes known to support this taxon's community role(s) or specific
          interactions, with standardized gene/genome ids and evidence.
        range: GeneAnnotation
        multivalued: true
        inlined_as_list: true
      notes:
        description: Additional notes about this taxon record.
      curation_history:
        description: Append-only audit trail of curation actions on this record.
        range: CurationEvent
        multivalued: true
        inlined_as_list: true

  GenomeRecord:
    description: A reference genome assembly for a taxon.
    attributes:
      id:
        description: >-
          NCBI Assembly accession for the genome (RefSeq GCF_ or GenBank GCA_),
          e.g. GCF_000005845.2.
        required: true
        pattern: "^GC[AF]_[0-9]{9}\\.[0-9]+$"
      label:
        description: Human-readable assembly name (e.g. "ASM584v2").
      strain_designation:
        description: Strain this assembly corresponds to.
        range: StrainDesignation
      notes:
        description: Notes about this assembly (assembly level, source, etc.).

  GeneAnnotation:
    description: >-
      A gene that supports a taxon's community role or a specific ecological
      interaction, with standardized identifiers and supporting evidence.
    attributes:
      gene_id:
        description: >-
          Primary standardized gene/protein identifier, as a CURIE. Accepted
          prefixes: NCBIGene (e.g. NCBIGene:948242), UniProtKB
          (e.g. UniProtKB:P0A6F5), or KEGG gene (e.g. KEGG:eco:b3987). For genes
          best identified per-assembly, give locus_tag; for the orthologous
          function, give kegg_ortholog.
        required: true
      gene_symbol:
        description: Gene symbol / short name (e.g. dsrA, nifH, mtrC).
      locus_tag:
        description: >-
          Genome locus tag tying the gene to a specific assembly
          (e.g. b3987, SO_1776).
      product:
        description: Gene product or functional description.
      genome:
        description: >-
          NCBI Assembly accession (GCF_/GCA_) of the genome this gene is annotated
          in; should match one of the parent CommonTaxon.genomes[].id.
        pattern: "^GC[AF]_[0-9]{9}\\.[0-9]+$"
      kegg_ortholog:
        description: KEGG Orthology id for the gene's function (e.g. K00370).
        pattern: "^K[0-9]{5}$"
      go_terms:
        description: >-
          GO molecular-function / biological-process terms describing this gene's
          activity (canonical id↔label, checked by the term gate).
        range: Term
        multivalued: true
        inlined_as_list: true
      supports_roles:
        description: Community functional role(s) this gene supports.
        range: FunctionalRoleEnum
        multivalued: true
      supports_interaction:
        description: >-
          Specific community interaction(s) this gene mediates, as a free-text
          description (may name an EcologicalInteraction from a community record).
      evidence:
        description: Evidence linking this gene to the role/interaction.
        range: EvidenceItem
        multivalued: true
        inlined_as_list: true
