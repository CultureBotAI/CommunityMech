  summary: Add cultivated-meat six-contaminant SynCom
  details: Created CommunityMech:000366 for the six-contaminant SynCom assembled from microbial contaminants originating in the
    cultivated-meat cell-culture environment in PMID:42425643. Curated the WGS-predicted potential metabolic complementarity,
    the 11 antimicrobial peptide/protein SynCom screen, the 1018-k6 MIC and 14-day high-load inhibition assay, the cell-growth
    and resazurin compatibility readouts, a broad bacterial aggregate taxonomy entry for the six unresolved contaminants, and
    the Food Microbiology DOI. Kept the exact contaminant species/strains and full medium/vessel/dosing details as open
    discussion gaps because the PubMed abstract does not provide those details.
