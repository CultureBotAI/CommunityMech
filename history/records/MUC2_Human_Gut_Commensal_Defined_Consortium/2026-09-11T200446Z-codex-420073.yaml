  summary: Curate the MUC2 human gut commensal consortium
  details: >-
    Added a new evidence-backed CommunityMech record for the 14-member
    synthetic human gut consortium tested under vehicle and porcine MUC2
    supplementation in anaerobic ZMB1 bioreactors. The record captures all
    source-reported commercial strains, the 0.5 mg/mL porcine MUC2
    perturbation, the 150 mL semi-continuous anaerobic cultivation regime, the
    Akkermansia/Prevotella qPCR community shift, and the MUC2-dependent
    short-chain fatty-acid remodeling while keeping inferred cross-feeding at
    community level because the study measured broad qPCR groups and bulk
    extracellular metabolites. Kept the source-reported S. thermophilus ATCC
    491, E. coli Nissle 1917, and A. muciniphila ATCC BAA-83 text without
    promoting likely catalog typos to verified collection accessions, and
    linked the seed PMID as an external resource.
