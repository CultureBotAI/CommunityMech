  summary: Create the cellulose-to-methane combinatorial SynCom panel
  details: >-
    Created CommunityMech:000394 from PMID:40937471 /
    doi:10.1093/ismeco/ycaf142 for the 2025 Ruminiclostridium-centered
    cellulose-to-methane combinatorial SynCom panel. The record captures
    Ruminiclostridium cellulolyticum H10, Methanospirillum hungatei JF-1,
    Methanosaeta concilii GP6, and Desulfovibrio vulgaris Hildenborough,
    describes the mono-, bi-, tri-, and quad-culture modified-VM cellulose
    panel, curates acetate/lactate/hydrogen interaction interpretations from
    the proteogenomics and stoichiometric-modeling paper, caches the PubMed
    abstract plus Europe PMC full text, and regenerates the CommunityMech HTML
    page for the new YAML record.
