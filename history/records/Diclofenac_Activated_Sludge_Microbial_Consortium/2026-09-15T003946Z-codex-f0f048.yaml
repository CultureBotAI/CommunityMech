  summary: Add the diclofenac activated-sludge MC
  details: Created CommunityMech:000379 for the PMID:41718267 / doi:10.3390/jox16010024 microbial
    consortium enriched from San Jerónimo WWTP activated sludge with DCF and glucose. Captured
    the glucose-amended 10 mg/L DCF batch assay, complete parent-DCF disappearance by day
    5, detected 4-OH-DCF, 5-OH-DCF, and putative NO2-DCF products, before/after 16S and ITS
    metabarcoding of the Burkholderia/Talaromyces-dominated 28-day community, ENA PRJEB98466
    raw-read deposition, flask/MSM cultivation setup, diclofenac sodium selective pressure,
    and an open direct-degrader assignment discussion because the amplicon data identify enriched
    taxa but not which members directly cleave DCF.
