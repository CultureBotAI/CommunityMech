  summary: Curate the BL6 chicken anti-Salmonella SynCom
  details: >-
    Added a new evidence-backed CommunityMech record for the defined six-member
    BL6 synthetic consortium assembled from Bacillus velezensis CMLH125,
    Ligilactobacillus salivarius CMLH112, Bacillus sp. CMLH124, Lactobacillus
    johnsonii CMLH106, Lactobacillus crispatus CMLH109, and Lactobacillus
    gallinarum CMLH110. The record captures in vitro anti-Salmonella strain
    selection, 72 h BL6 inoculum preparation with equal-proportion pooling, and
    early oral gavage before Salmonella Typhimurium challenge in chicks.
