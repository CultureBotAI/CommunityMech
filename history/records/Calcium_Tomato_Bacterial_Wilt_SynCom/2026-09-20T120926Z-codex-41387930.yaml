  summary: Create the calcium-tomato bacterial wilt SynCom
  details: >-
    Created CommunityMech:000393 for the four-member tomato-root SynCom from
    PMID:41387930. The record curates Dyella japonica, Rhodanobacter glycinis,
    Paenibacillus polymyxa, and Pseudomonas aeruginosa as a 1:1:1:1
    LB-grown inoculum, records the CaCl2, salicylic acid, sucrose, trehalose,
    and whole-root-exudate selection regime, captures the Ralstonia
    solanacearum co-culture and low-dose-calcium tomato pot suppression
    endpoints, links PRJNA1125171, and leaves exact interstrain mechanisms as
    an explicit discussion rather than asserting unresolved pairwise edges.
