  summary: Add baijiu pit-mud G4 hexanoic acid SynCom
  details: Created CommunityMech:000365 for the ethanol-based, hexanoic-acid-producing G4
    SynCom constructed from Chinese baijiu fermentation pit mud in PMID:42442429. Curated
    the resolved dominant Clostridium kluyveri and Pseudoclavibacter taxa, the community-level
    reverse beta-oxidation association, optimized G4 pH/temperature/inoculum/loading-volume/yield
    factors, ethanol and hexanoic acid related ingredients, and the Bioresource Technology
    DOI. Kept Clostridium sensu stricto 18 and full medium/vessel details as open discussion
    gaps because the PubMed abstract did not provide NCBITaxon-resolvable or method-level
    detail.
