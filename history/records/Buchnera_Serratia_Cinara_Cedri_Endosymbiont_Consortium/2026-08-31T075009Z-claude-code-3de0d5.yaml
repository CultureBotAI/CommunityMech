  summary: Repair evidence snippets to verbatim contiguous spans
  details: '''both bacteria are involved in the synthesis of tryptophan'' was a paraphrase.
    The source states it as ''the biosynthesis of tryptophan is shared with the endosymbiont
    Serratia symbiotica SCc'', which names the partner and is stronger evidence for the interaction.
    Found by splitting #596''s MISMATCH bucket by whether the cited source is cached as full
    text. Of 117 mismatches, 104 sit on an abstract-only cache (absence proves nothing there,
    per the #605 rule) and 13 were against real cached full text -- the only ones where absence
    is evidence. All 13 had a long contiguous fragment (23-113 characters) already present
    in the source, so none was a fabrication: each was a real quote carrying a wrong span.
    Repaired to a verbatim contiguous span, verified by re-running the audit: full-text mismatches
    went 13 -> 0. Contiguous on purpose -- CLAUDE.md forbids combining non-contiguous text,
    so an elision was repaired rather than taught to the tool.'
