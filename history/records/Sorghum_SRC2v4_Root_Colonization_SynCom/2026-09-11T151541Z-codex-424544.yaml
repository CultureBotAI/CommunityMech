  summary: Curate the sorghum SRC2v4 root-colonization SynCom
  details: >-
    Added a new evidence-backed CommunityMech record for the 15-member SRC2v4
    synthetic Sorghum bicolor root community rationally reduced from the
    57-member SRC1 consortium. The record captures the exact SRC2v4 formulation,
    root-colonization-based assembly strategy, 1-month gnotobiotic microbox
    assays, live versus heat-killed plant growth promotion, stable root and
    rhizosphere colonization, host flavonoid transcriptomic and metabolomic
    responses, and the linked NCBI BioProject, MassIVE, and GitHub resources.
    Adversarial review of PR #781 removed assay-order downstream edges, split
    normalized supplementary table excerpts out of the article cache, and added
    exact evidence for the MassIVE accession.
