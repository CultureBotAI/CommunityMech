  details: 'Built from Ding et al. 2026 Nat Commun (PMID:42660928, doi:10.1038/s41467-026-76211-1); OA
    full text PMC13522444 cached with just cache-fulltext. Membership is the 16 strains named in Methods;
    NCBITaxon/GTDB grounding and strain designations reused from CommunityMech:000025 (paper''s Burkholderia
    OAS925 = Paraburkholderia; Bacillus OAE603 = Gottfriedia, noted on the taxa). Interactions: exudate-dopamine
    correlations with six members (Spearman, unadjusted), monoculture dopamine growth stimulation of five
    isolates and inhibition of OAS925, and SynCom-associated reduction of exudate dopamine (cause unresolved).
    The dopamine-amended native soil microcosm (Actinobacteria enrichment) is a different community and
    was excluded, noted in a knowledge-gap discussion. Session id and file name were generated by script
    because just new-history needs the culturebotai-claw checkout, which is absent here.'
