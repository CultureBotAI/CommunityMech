  summary: Drop an unsupported functional role from CommunityMech:000337
  details: 'Third adversarial review pass on PR #747. The ciliate host carried PRIMARY_DEGRADER,
    which FunctionalRoleEnum defines as degrades complex substrates. PMID:42475569 establishes
    that the host ferments and releases H2 through hydrogenosomal Fe-hydrogenases and says
    nothing about what it degrades; a ciliate''s diet is not in evidence anywhere in the paper.
    Removed, leaving SYNTROPHIC_PARTNER and ELECTRON_DONOR, which the H2 transfer does support,
    and the taxon notes now record why the role is absent so a later curator does not re-add
    it. SYNTROPHY is kept on the two H2 edges here, unlike CommunityMech:000336 where it was
    retyped under issue #752: these partners are intracellular endosymbionts and the methanogen
    MAGs show the genome reduction typical of them, so obligacy is at least plausible, and
    the source''s own title is tripartite syntrophy. No evidence, snippet or grounding changed.'
