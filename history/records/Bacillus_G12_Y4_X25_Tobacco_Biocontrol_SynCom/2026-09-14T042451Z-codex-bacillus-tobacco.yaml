  summary: Add the Bacillus G12-Y4-X25 tobacco biocontrol SynCom
  details: >-
    Created CommunityMech:000373 for the PMID:42388034 three-member Bacillus
    SynCom composed of Bacillus amyloliquefaciens G12, Bacillus pumilus Y4, and
    Bacillus velezensis X25; cached the open PubMed Central article text; used
