  details: 'During Cycle 12 Stage 3 (protein_examples), added three verified full-text
    EvidenceItem entries from cached community literature to kb/taxa/Shewanella_oneidensis_MR1.yaml
    (CommunityMech:taxon:000001, NCBITaxon:211586, GCF_000146165.2): (1) on mtrB (UniProtKB:Q8EG34,
    SO_1776; SUPPORT, COMPUTATIONAL, PMID:34986141, primary reference for CommunityMech:000134)
    identifying the beta-barrel/decaheme cytochrome c outer-membrane complex MtrCAB
    as a core extracellular electron-transfer conduit; (2) on mtrA (UniProtKB:Q8EG35,
    SO_1777; SUPPORT, IN_VITRO, PMID:40845095, cited in CommunityMech:000134 and CommunityMech:000276)
    establishing the multi-hundred-millivolt redox-active window of periplasmic decaheme
    cytochrome MtrA enabling electron transfer to AQDS and flavins; and (3) on cymA
    (UniProtKB:Q8E945, SO_4591; SUPPORT, COMPUTATIONAL, PMID:37747940, cited in CommunityMech:000134
    and CommunityMech:000276) identifying CymA as a canonical inner-membrane electron
    donor to EET conduits in Shewanella. Validated with write_validated_community(...,
    target_class="CommonTaxon"), linkml-validate, linkml-term-validator, linkml-reference-validator,
    and pytest.'
