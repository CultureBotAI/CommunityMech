  summary: Add verified PMID:32849356 and PMID:34986141 evidence to mtrA (SO_1777) and cymA (SO_4591) on Shewanella oneidensis MR-1 CommonTaxon record
  details: 'During Cycle 7 Stage 3 (protein_examples), added two verified full-text COMPUTATIONAL EvidenceItem
    entries to kb/taxa/Shewanella_oneidensis_MR1.yaml (CommunityMech:taxon:000001, NCBITaxon:211586,
    GCF_000146165.2): (1) PMID:32849356 (SUPPORT, COMPUTATIONAL; Arbour et al. 2020, primary reference
    for CommunityMech:000241) on mtrA (UniProtKB:Q8EG35, SO_1777) documenting the Figure 4A comparative
    multiheme c-type cytochrome sequence alignment using Shewanella oneidensis MR-1 MtrA as the reference
    amino-acid sequence length and heme-packing benchmark; and (2) PMID:34986141 (SUPPORT, COMPUTATIONAL;
    Chadwick et al. 2022, primary reference for CommunityMech:000134) on cymA (UniProtKB:Q8E945, SO_4591)
    documenting functional rescue of CymA knockouts in Shewanella oneidensis MR-1 by suppressor mutations
    activating alternative quinol oxidoreductase complexes. Validated with linkml-validate --target-class
    CommonTaxon, linkml-term-validator, linkml-reference-validator, and pytest.'
