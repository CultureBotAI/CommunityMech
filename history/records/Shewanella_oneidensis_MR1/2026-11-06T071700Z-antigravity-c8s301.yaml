    deletion of mtrC and omcA in wild-type Shewanella oneidensis MR-1 followed by transformation with
    pHG13-Ptac-ribADEHC-irrE to construct mutant strains SO3∆mtrC, SO3∆omcA, and SO3∆mtrC∆omcA for
    extracellular electron-transfer and NCM bioleaching perturbation assays. Validated with
    linkml-validate --target-class CommonTaxon, linkml-term-validator, linkml-reference-validator,
    and pytest.'
