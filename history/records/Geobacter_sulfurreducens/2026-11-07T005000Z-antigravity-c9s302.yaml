  summary: Add verified PMID:37747940 and PMID:34986141 evidence to omcS (GSU2504) and omcZ (GSU2076) on Geobacter sulfurreducens CommonTaxon record
  details: 'During Cycle 9 Stage 3 (protein_examples), added two verified full-text COMPUTATIONAL EvidenceItem
    entries to kb/taxa/Geobacter_sulfurreducens.yaml (CommunityMech:taxon:000002, NCBITaxon:35554,
    GCF_000007985.2): (1) PMID:37747940 (SUPPORT, COMPUTATIONAL; Murali et al. 2023, primary reference
    for CommunityMech:000134 and CommunityMech:000276) on omcS (UniProtKB:Q749X9, GSU2504) establishing
    that omcX and omcS-like multiheme cytochrome c genes in syntrophic SRB oet extracellular electron
    transfer gene cassettes occupy a conserved genomic position analogous to omcS and omcT in Geobacter
    sulfurreducens; and (2) PMID:34986141 (SUPPORT, COMPUTATIONAL; Chadwick et al. 2022, primary reference
    for CommunityMech:000134) on omcZ (UniProtKB:Q74A90, GSU2076) documenting extracellular cytochrome c
    OmcZ alongside OmcS filaments in the Geobacter sulfurreducens extracellular space as the reference
    electron-transfer conduit compared with ANME-SRB syntrophic consortia. Validated with
    linkml-validate --target-class CommonTaxon, linkml-term-validator, linkml-reference-validator,
    and pytest.'
