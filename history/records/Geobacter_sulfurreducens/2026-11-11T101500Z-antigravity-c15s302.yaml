  details: 'During Cycle 15 Stage 3 (protein_examples), added two verified full-text
    COMPUTATIONAL EvidenceItem entries from cached community literature to kb/taxa/Geobacter_sulfurreducens.yaml
    (CommunityMech:taxon:000002, NCBITaxon:35554, GCF_000007985.2; SHA-256 cdde2dcc8804f32aea582cd32f6e0933923bf70a2909aaa0aa0cccf008502730
    -> 2996d4084951c5135e243db3c61f3cbf9a7b61bcfd9013c66805f80ed7edd3d7): (1) on omcS
    (UniProtKB:Q749X9, GSU2504; SUPPORT, COMPUTATIONAL, PMID:32849356, primary reference
    for CommunityMech:000241) documenting identification of 22 true OmcS homologs
    across five of six Rifle bioanode Geobacter genomes using the canonical G. sulfurreducens
    PCA OmcS sequence (WP_119334099.1) as query; and (2) on omcZ (UniProtKB:Q74A90,
    GSU2076; SUPPORT, COMPUTATIONAL, PMID:34986141, Figure 10, cited in CommunityMech:000134)
    demonstrating that sequence conservation between G. sulfurreducens octaheme cytochrome
    OmcZ and ANME-2a/2b/2c homologs extends beyond the 8 CxxCH heme-binding motifs
    across extensive N- and C-terminal regions with completely conserved residues.
    Validated with write_validated_community(..., target_class="CommonTaxon"), linkml-validate,
    linkml-term-validator, linkml-reference-validator, and pytest.'
