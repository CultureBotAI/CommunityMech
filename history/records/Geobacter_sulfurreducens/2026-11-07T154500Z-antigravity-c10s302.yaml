  summary: Add verified PMID:41876513 e-pilin reference sequence and PCC gene organization evidence to pilA (GSU1496) and omcB (GSU2737) on Geobacter sulfurreducens CommonTaxon record
  details: 'During Cycle 10 Stage 3 (protein_examples), added two verified full-text COMPUTATIONAL EvidenceItem
    entries from PMID:41876513 (SUPPORT, COMPUTATIONAL; primary reference for CommunityMech:000462) to
    kb/taxa/Geobacter_sulfurreducens.yaml (CommunityMech:taxon:000002, NCBITaxon:35554, GCF_000007985.2): (1) on
    pilA (UniProtKB:Q74BW5, GSU1496) documenting use of the canonical Geobacter sulfurreducens PCA conductive
    e-pilin protein sequence (GenBank accession AAR34870.1) as the reference sequence for identifying putative
    electrically conductive e-pili; and (2) on omcB (UniProtKB:Q74A86, GSU2737) documenting that Candidatus
    Geosyntrophus porin-cytochrome-cytochrome (PCC) conduits mirror the conserved Geobacter sulfurreducens PCC
    gene organization culminating in an outer-membrane dodecaheme MHC (OmcB). Validated with
    write_validated_community(..., target_class="CommonTaxon"), linkml-validate, linkml-term-validator,
    evidence_snippet_audit.py, and pytest.'
