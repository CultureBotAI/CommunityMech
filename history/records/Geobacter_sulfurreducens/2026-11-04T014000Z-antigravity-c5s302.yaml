  details: 'During Cycle 5 Stage 3 (protein_examples), added verified full-text EvidenceItem entries to
    kb/taxa/Geobacter_sulfurreducens.yaml (CommunityMech:taxon:000002, NCBITaxon:35554, GCF_000007985.2):
    (1) PMID:28287150 (PARTIAL, IN_VITRO; primary reference for CommunityMech:000031, which links to
    CommunityMech:taxon:000002) on pilA (UniProtKB:Q74BW5, GSU1496) citing prior proteomic characterization
    of Geobacter sulfurreducens DSM 12127 (= PCA = ATCC 51573, GCF_000007985.2) showing increased synthesis
    of PilA involved in nanowire conductivity under long-term electron-acceptor limitation; and
    (2) PMID:32849356 (SUPPORT, COMPUTATIONAL; primary reference for CommunityMech:000241) on omcS
    (UniProtKB:Q749X9, GSU2504) documenting the canonical G. sulfurreducens PCA OmcS reference sequence
    (RefSeq WP_119334099.1) used as the BLASTP query to identify extracellular electron-transfer cytochrome
    filament homologs in the Rifle bioanode community. Validated with linkml-validate --target-class
    CommonTaxon, linkml-term-validator, linkml-reference-validator, and pytest.'
