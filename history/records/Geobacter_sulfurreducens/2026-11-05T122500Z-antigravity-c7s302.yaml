  summary: Add verified PMID:32265334 and PMID:34986141 evidence to pilA (GSU1496) and omcS (GSU2504) on Geobacter sulfurreducens CommonTaxon record
  details: 'During Cycle 7 Stage 3 (protein_examples), added two verified full-text EvidenceItem entries to
    kb/taxa/Geobacter_sulfurreducens.yaml (CommunityMech:taxon:000002, NCBITaxon:35554, GCF_000007985.2):
    (1) PMID:32265334 (PARTIAL, IN_VITRO; Tremblay et al. 2020, primary reference for CommunityMech:000032)
    on pilA (UniProtKB:Q74BW5, GSU1496) documenting adaptively evolved PilA-deficient mutants of Geobacter
    sulfurreducens DL-1 (= PCA) across 13 serial transfers in NB(formate + fumarate) medium as a pure-culture
    control for Pseudomonas aeruginosa coculture selection; and (2) PMID:34986141 (SUPPORT, COMPUTATIONAL;
    Chadwick et al. 2022, primary reference for CommunityMech:000134) on omcS (UniProtKB:Q749X9, GSU2504)
    characterizing the Geobacter sulfurreducens hexaheme cytochrome c protein OmcS as forming conductive
    extracellular nanowires that imbue biofilms with conductive properties. Validated with linkml-validate
    --target-class CommonTaxon, linkml-term-validator, linkml-reference-validator, and pytest.'
