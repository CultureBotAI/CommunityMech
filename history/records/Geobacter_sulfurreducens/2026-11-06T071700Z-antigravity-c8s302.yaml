  summary: Add verified PMID:37650614 and PMID:34986141 evidence to pilA (GSU1496) and omcZ (GSU2076) on Geobacter sulfurreducens CommonTaxon record
  details: 'During Cycle 8 Stage 3 (protein_examples), added two verified full-text EvidenceItem entries to
    kb/taxa/Geobacter_sulfurreducens.yaml (CommunityMech:taxon:000002, NCBITaxon:35554, GCF_000007985.2):
    (1) PMID:37650614 (SUPPORT, IN_VITRO; primary reference for CommunityMech:000249,
    Geobacter_Metallireducens_Sulfurreducens_DIET_Coculture.yaml) on pilA (UniProtKB:Q74BW5, GSU1496)
    identifying PilA as the pilin monomer assembled into electrically conductive pili required for Fe(III)
    oxide reduction and direct interspecies electron transfer (DIET); and (2) PMID:34986141 (SUPPORT,
    COMPUTATIONAL; Chadwick et al. 2022, primary reference for CommunityMech:000134,
    ANME_SRB_Methane_Oxidation_Consortium.yaml) on omcZ (UniProtKB:Q74A90, GSU2076) documenting
    polymerization of Geobacter sulfurreducens OmcZ into conductive extracellular nanowires as the
    reference benchmark for evaluating ANME OmcZ homologs. Validated with linkml-validate --target-class
    CommonTaxon, linkml-term-validator, linkml-reference-validator, and pytest.'
