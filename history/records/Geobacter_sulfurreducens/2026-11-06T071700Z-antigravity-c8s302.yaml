    (UniProtKB:Q749X9, GSU2504) documenting self-assembly of Geobacter sulfurreducens cytochrome OmcS
    into conductive extracellular filaments (nanowires) as the rationale for searching all 86 bioanode
    genomes for OmcS homologs; and (2) PMID:34986141 (SUPPORT, COMPUTATIONAL; Chadwick et al. 2022,
    primary reference for CommunityMech:000134, kb/communities/ANME_SRB_Marine_Methane_Seep_Consortium.yaml)
    on omcZ (UniProtKB:Q74A90, GSU2076) documenting polymerization of Geobacter sulfurreducens OmcZ
    into conductive extracellular nanowires as the reference benchmark for evaluating ANME OmcZ homologs.
    Validated with linkml-validate --target-class CommonTaxon, linkml-term-validator,
    linkml-reference-validator, and pytest.'
