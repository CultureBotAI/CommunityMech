  details: 'During Cycle 8 Stage 3 (protein_examples), added two verified full-text COMPUTATIONAL EvidenceItem
    entries to kb/taxa/Geobacter_sulfurreducens.yaml (CommunityMech:taxon:000002, NCBITaxon:35554,
    GCF_000007985.2): (1) PMID:32849356 (SUPPORT, COMPUTATIONAL; Arbour et al. 2020, primary reference
