  summary: Curate the Bothnian Bay GAC-dependent CIET-SAO consortium
  details: >-
    Added a new evidence-backed CommunityMech record for the coastal
    sediment-derived Bothnian Bay enrichment that was serially propagated for
    about a decade on granular activated carbon. The record captures the
    GAC-dependent syntrophic acetate oxidation from Candidatus Geosyntrophus
    acetoxidans to a Methanosarcina MAG, the inferred auxiliary
    Lentimicrobium, Sedimentibacter, and Desulforhopalus MAGs, the anaerobic
    10 mM acetate and 10 g/L GAC cultivation setup, and BioProject
    PRJNA1140524 for the metagenome reads and assemblies.
