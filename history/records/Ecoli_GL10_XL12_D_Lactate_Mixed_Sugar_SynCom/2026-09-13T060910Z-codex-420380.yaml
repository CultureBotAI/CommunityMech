  summary: Add E. coli GL10-XL12 mixed-sugar D-lactate SynCom
  details: >-
    Curated CommunityMech:000357 from PMID:42038008 /
    doi:10.1016/j.bidere.2026.100072 using the cached PubMed abstract,
    Europe PMC open-access full text, and extractable supplementary text. Added
    E. coli GL10 and XL12 as BL21 (DE3)-derived engineered knockout members,
    recorded their exact GL10 and XL12 deletion targets, represented the
    community mechanism as glucose/xylose niche partitioning rather than
    pairwise cross-feeding because no direct GL10-to-XL12 metabolite was
    reported, and captured M9 glucose/xylose batch co-fermentation plus
    activated-carbon-detoxified corn straw hydrolysate diluted into M9. Reused
    the validated species-level E. coli GTDB grounding block from existing
    records because the local kg-microbe NCBI2GTDB table was unavailable.
