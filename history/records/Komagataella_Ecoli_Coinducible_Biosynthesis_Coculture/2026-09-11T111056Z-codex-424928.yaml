  summary: Curate the K. phaffii-E. coli co-inducible biosynthesis coculture
  details: >-
    Added a new evidence-backed CommunityMech record for a defined
    Komagataella phaffii and Escherichia coli engineered coculture that rebuilds
    glucose-responsive and blue-light-responsive transcriptional systems in the
