  summary: Add Methylomicrobium-Arthrospira Biogas Conversion Coculture (CommunityMech:000496)
  details: 'Created CommunityMech:000496 for the defined Methylomicrobium buryatense 5GB1
    - Arthrospira platensis biogas conversion coculture from cached open-access sources PMID:35295538
    (doi:10.1016/j.mex.2022.101652) and doi:10.20517/mrr.2023.70, which were previously separated
