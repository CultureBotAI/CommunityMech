    during #1608 remediation (PR #1975). Curated taxonomy (NCBITaxon:675511 Methylotuvimicrobium buryatense
    5G strain 5GB1 and NCBITaxon:118562 Limnospira platensis), engineering_design, environment_term
    (ENVO:01001405), three pairwise ecological interactions (in situ O2 provision, reciprocal
    CO2 provision and synergistic growth, and SteadyCom/DynamiCom-predicted emergent nitrogen
    and metabolite cross-feeding marked HYPOTHESIZED), environmental_factors, growth_media
    (90% Zarrouk plus 10% NMS2 medium, pH 8.7-9, 60% CH4/30% CO2/10% N2 refed every 24 h),
    cultivation_setup (100 mL photobioreactor), related_ingredients, external_resources (GitHub
    semi-structured kinetic model), and KNOWLEDGE_GAP discussion. Validated with linkml-validate,
    validate_strict.py, validate_gtdb_coherence.py, validate_yaml_scalars.py, linkml-term-validator,
    and linkml-reference-validator.'
