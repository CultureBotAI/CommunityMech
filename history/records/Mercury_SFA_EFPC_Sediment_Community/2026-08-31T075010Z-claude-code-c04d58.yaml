  details: '''27 of the 28 MAGs..contained'' elided the parenthetical naming the exception.
    Replaced with the contiguous sentence, which keeps the exception (MAG 124) rather than
    hiding it. Found by splitting #596''s MISMATCH bucket by whether the cited source is cached
