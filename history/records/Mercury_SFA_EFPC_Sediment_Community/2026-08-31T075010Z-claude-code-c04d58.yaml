    present in the source, so none was a fabrication: each was a real quote carrying a wrong
    span. Repaired to a verbatim contiguous span, verified by re-running the audit: full-text
    mismatches went 13 -> 0. Contiguous on purpose -- CLAUDE.md forbids combining non-contiguous
    text, so an elision was repaired rather than taught to the tool.'
