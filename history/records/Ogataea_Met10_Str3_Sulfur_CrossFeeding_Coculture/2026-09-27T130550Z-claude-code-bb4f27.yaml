  summary: Create Ogataea met10-str3 sulfur cross-feeding coculture
  details: Created CommunityMech:000450 for the Ogataea polymorpha FY34 met10Δ-mCherry and
    FY31 str3Δ-EGFP sulfur-auxotroph coculture from PMID:42318495 and DOI 10.1016/j.synbio.2026.05.008.
