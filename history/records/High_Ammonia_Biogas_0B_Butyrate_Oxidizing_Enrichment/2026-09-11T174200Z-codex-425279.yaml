  summary: Curate the high-ammonia 0B syntrophic butyrate enrichment
  details: >-
    Added a new evidence-backed CommunityMech record for the thermophilic,
    high-ammonia 0B enrichment culture derived from a propionate-fed biogas
    reactor. The record captures MAG1 as the putative Candidatus
    Syntrophothermus ammoniitolerans syntrophic butyrate oxidizer, MAG2 as a
    putative Candidatus Thermosyntrophaceticus-like syntrophic acetate oxidizer,
