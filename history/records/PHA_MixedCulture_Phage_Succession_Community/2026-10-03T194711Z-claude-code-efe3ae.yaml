  summary: Created PHA-producing mixed-culture community under phage kill-the-winner succession
  details: 'Created CommunityMech:000468 from PMID:40152616 / doi:10.1128/msystems.00200-25 (Yao et al.
    2025, mSystems), the N-N phage-bacteria case and companion to CommunityMech:000467. Cached the PubMed
    abstract and appended Europe PMC open-access full text (PMC12013262), and verified all 17 snippets
    as exact substrings of that cache before writing them. Verified NCBITaxon ids and canonical labels:
    Azoarcus 12960, Azomonas 69961, Thauera 33057, Brevundimonas 41275, Viruses 10239 for the 4,294-pOTU
    phage population, and Paracoccus 265 — the term gate required the disambiguated canonical label ''Paracoccus
    <a-proteobacteria>'', since NCBITaxon:249411 is a metazoan homonym. Curated kill-the-winner succession
    of dominant producers, coupled bacterial/phage turnover, SEM-resolved suppression of alpha diversity
    and activity, transcribed phage-encoded PHA auxiliary metabolic genes, and the host antiviral defence
    repertoire. Marked the SEM-derived causal direction PARTIAL because it rests on a fitted correlational
    model over observational time series rather than a manipulation, and recorded it under STATISTICAL_INFERENCE
    rather than the new POPULATION_DYNAMIC_MODEL value. Did not curate the per-reactor phage-host linkages:
    the pOTU labels are study-local and the linkages hold only at some time points, so unqualified pairwise
    edges would assert a stability the source denies — captured as a discussion instead, alongside the
    question of whether five reactors should be one record or five. Corrected ENVO:01000905 (shrimp pond)
    and ENVO:00002129 (anaerobic sludge) to ENVO:00002123 and ENVO:00002046 after the term gate reported
    label mismatches. Validated with just validate, validate-strict, validate-terms, and validate-references-explained,
    all green.'
