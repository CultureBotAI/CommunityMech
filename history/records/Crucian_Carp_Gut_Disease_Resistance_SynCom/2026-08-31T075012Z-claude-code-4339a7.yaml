  summary: Repair evidence snippets to verbatim contiguous spans
  details: 'Both snippets were mangled -- ''Paraclostridium (p Pseudomonas (p A. hydrophila
    (p < 0.05)'' is what remains after parenthetical content is lost. The two uses need DIFFERENT
    spans and had been given the same one: the ecological_interactions evidence is about suppression
    of A. hydrophila and gets that sentence verbatim, while the taxonomy evidence must support
    Pseudomonas MEMBERSHIP and now quotes ''Further microbial analysis identified Cetobacterium,
    Paraclostridium, and Pseudomonas as key differential taxa''. An intermediate version of
    this fix gave both the suppression sentence, which named no Pseudomonas at all -- the
    #713 shape, caught before commit. Found by splitting #596''s MISMATCH bucket by whether
    the cited source is cached as full text. Of 117 mismatches, 104 sit on an abstract-only
    cache (absence proves nothing there, per the #605 rule) and 13 were against real cached
    full text -- the only ones where absence is evidence. All 13 had a long contiguous fragment
    (23-113 characters) already present in the source, so none was a fabrication: each was
    a real quote carrying a wrong span. Repaired to a verbatim contiguous span, verified by
    re-running the audit: full-text mismatches went 13 -> 0. Contiguous on purpose -- CLAUDE.md
    forbids combining non-contiguous text, so an elision was repaired rather than taught to
    the tool.'
