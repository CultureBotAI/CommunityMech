  summary: Repair evidence snippets to verbatim contiguous spans
  details: 'One preposition: the record said data are available ''in'' the European Nucleotide
    Archive, the source says ''from''. Found by splitting #596''s MISMATCH bucket by whether
    the cited source is cached as full text. Of 117 mismatches, 104 sit on an abstract-only
