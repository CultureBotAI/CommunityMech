  summary: Add Mediterranean AM fungal six-species SynCom
  details: Created CommunityMech:000367 for the six-species arbuscular mycorrhizal fungal
    SynCom assembled from southern-Spain isolates in PMID:42661004. Curated the six NCBITaxon-grounded
    Glomeromycota members, the semi-arid Mediterranean rhizosphere/soil mesocosm context,
    the four-host plant-cover design, quarterly root and rhizosphere-spore monitoring over
    three years, the abstract-level Septoglomus constrictum persistence result, and the Mycorrhiza
    DOI. Kept exact isolate designations, initial inoculum proportions, and full mesocosm
    protocol details as open discussion gaps because the PubMed abstract does not provide
    those details.
