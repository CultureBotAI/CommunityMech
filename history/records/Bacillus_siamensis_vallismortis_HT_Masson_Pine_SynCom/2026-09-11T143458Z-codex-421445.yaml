  summary: Curate the HT Masson pine anti-Fusarium SynCom
  details: >-
    Added a new evidence-backed CommunityMech record for the two-member HT
    synthetic PGPR community assembled from Trichoderma
    koningiopsis-conditioned Pinus massoniana rhizosphere isolates. The record
    captures the Bacillus siamensis RW5 and Bacillus vallismortis RW8
    membership, HT in vitro suppression of Fusarium oxysporum, reduction of
    damping-off disease incidence in Masson pine seedlings, increased seedling
    height, enhanced protective enzyme activity, reduced membrane damage, and
    PR1, FLS2, and CAT1 defense-gene activation.
