id: CommunityMech:000488
name: Bacillus licheniformis Tannery Effluent Chromate Biosorption Isolate
description: An indigenous single-species bacterial isolate of Bacillus licheniformis recovered from Marrakech chrome-tanning
  effluent (Bab Dbagh industrial district, Morocco) and evaluated in monoculture for hexavalent chromium (Cr6+) biosorption
  and reduction to Cr(III) in Luria-Bertani broth at 30 C and pH 7 over 96 h, where SEM-EDX, FTIR, and zetametry demonstrate
  cell-surface Cr binding via phosphate/phosphoryl, amide, and carboxyl functional groups and a zeta-potential shift from
  -10.63 mV to -39.53 mV up to an adsorption limit of 100 mg/L Cr6+ (doi:10.3389/fmicb.2024.1423741).
ecological_state: PERTURBED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
environment_term:
  preferred_term: waste water
  term:
    id: ENVO:00002001
    label: waste water
  notes: Isolated from raw chrome-tanning effluent at Bab Dbagh and the industrial district in Marrakech, Morocco, and assayed
    in Cr(VI)-amended Luria-Bertani broth monoculture at 30 C and pH 7 (doi:10.3389/fmicb.2024.1423741).
