    notes: Indigenous tannery-effluent Bacillus licheniformis isolate achieving 1.10 wt.% (0.30 at.%) surface Cr loading at
      5 mg/L Cr6+ and 0.29 wt.% (0.08 at.%) at 50 mg/L Cr6+ with phosphoryl deprotonation and zeta-potential shift to -39.53
      mV at 100 mg/L Cr6+ (doi:10.3389/fmicb.2024.1423741).
  functional_role:
  - PRIMARY_DEGRADER
  abundance_level: DOMINANT
  evidence:
  - reference: doi:10.3389/fmicb.2024.1423741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this work, scanning electron microscopy, energy-dispersive X-ray spectrophotometry, Fourier transform infrared
      spectroscopy, and zeta potential measurements were used to investigate the ability of chromium adsorption by Bacillus
      licheniformis, Bacillus megaterium, Byssochlamys sp., and Candida maltosa strains isolated from tannery wastewater.
    explanation: Identifies the tannery-wastewater Bacillus licheniformis isolate characterized for Cr(VI) biosorption.
  - reference: doi:10.3389/fmicb.2024.1423741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After treatment of the microorganisms with 5 mg/L Cr6+, the EDX analyses reveal Cr weight percentages of 1.1,
      0.52, 0.51, and 0.62 and atomic percentages of 0.30, 0.14, 0.13, and 0.17 for Bacillus licheniformis, Bacillus megaterium,
      Byssochlamys sp., and Candida maltosa, respectively.
    explanation: Quantifies surface chromium biosorption on Bacillus licheniformis (1.1 wt.%, 0.30 at.% at 5 mg/L Cr6+) by
      EDX.
  - reference: doi:10.3389/fmicb.2024.1423741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After exposure to chromium, the zeta potential of Bacillus licheniformis strains undergoes a significant change
      from −10.63 ± 0.38 (0 mg/L Cr6+) to −39.53 ± 1 mV (100 mg/L Cr6+), indicating that the cells in contact with Cr6+ have
      experienced an increase in negative charge.
    explanation: Demonstrates electrostatic surface modification and Cr(VI) adsorption limit at 100 mg/L Cr6+ in Bacillus
      licheniformis monoculture.
