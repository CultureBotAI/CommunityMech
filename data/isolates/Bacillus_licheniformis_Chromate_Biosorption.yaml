- name: Cell-Surface Functional-Group Chromate Complexation and Deprotonation
  description: Tannery-effluent Bacillus licheniformis binds hexavalent chromium (Cr6+) in Luria-Bertani broth (5-50 mg/L
    Cr6+, 30 C, pH 7) via cell-surface phosphate/phosphoryl, amide, and carboxyl functional groups with deprotonation of surface
    phosphoryl sites.
