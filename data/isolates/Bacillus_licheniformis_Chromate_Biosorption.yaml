  - target: Electrostatic Surface-Charge Shift and Chromium Biosorption Saturation
    description: Deprotonation of cell-surface phosphoryl and carboxyl groups upon Cr(VI) exposure shifts the cellular zeta
      potential from -10.63 mV to -39.53 mV and drives surface Cr loading up to a 100 mg/L Cr6+ adsorption limit.
  evidence:
  - reference: doi:10.3389/fmicb.2024.1423741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In order to determine the impact of Cr6+ on the functional groups of the microbial cell surface, 100 μL of preculture
      (24 h) of each strain was introduced into Luria-Bertani (LB) broth containing 50 mg/L Cr6+ (30 °C, pH 7).
    explanation: Documents FTIR characterization of cell-surface functional group interactions with 50 mg/L Cr6+ in LB broth.
  - reference: doi:10.3389/fmicb.2024.1423741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After exposure to chromium, the zeta potential of Bacillus licheniformis strains undergoes a significant change
      from −10.63 ± 0.38 (0 mg/L Cr6+) to −39.53 ± 1 mV (100 mg/L Cr6+), indicating that the cells in contact with Cr6+ have
      experienced an increase in negative charge.
    explanation: Links Cr6+ surface interaction to the increase in negative cell-surface charge.
- name: Electrostatic Surface-Charge Shift and Chromium Biosorption Saturation
  description: Increased negative surface charge on Cr(VI)-exposed Bacillus licheniformis cells supports chromium accumulation
    on the cell wall (1.10 wt.% / 0.30 at.% Cr at 5 mg/L Cr6+) until reaching a surface adsorption saturation limit at 100
    mg/L Cr6+.
