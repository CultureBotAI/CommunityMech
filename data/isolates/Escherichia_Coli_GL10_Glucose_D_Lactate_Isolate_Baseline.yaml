id: CommunityMech:000542
name: Escherichia coli GL10 Glucose-Specialized D-Lactate Isolate Baseline
description: Single-strain engineered bacterial isolate baseline Escherichia coli GL10 (E. coli BL21(DE3) Δpps ΔpoxB ΔpflB
  Δpta ΔfrdABC ΔadhE Δdld ΔmgsA; NCBITaxon:562; GTDB:s__Escherichia_coli) constructed via CRISPR/Cas9 and characterized in
  single-sugar (5 g/L glucose or 5 g/L xylose) and mixed-sugar (5 g/L glucose + 5 g/L xylose) M9 medium at 37 °C and 150 rpm
  (initial OD600 = 0.1) alongside the xylose-specialized partner E. coli XL12 (CommunityMech:000543), intermediate knockout
  strain E. coli XL5 (CommunityMech:000544), and the GL10-XL12 synthetic consortium (CommunityMech:000357) by Tan et al. 2026
  (PMID:42038008). In single-sugar M9 fermentation (Fig. 5), GL10 fully consumed 5 g/L glucose within 12 h and produced 3.15
  g/L D-lactate at 36 h (63% conversion rate, 0.09 g/L/h productivity, 3.92-fold higher conversion rate than on sole xylose
  at 0.64 g/L and 0.018 g/L/h). In mixed-sugar fermentation (5 g/L glucose + 5 g/L xylose, Fig. 6), GL10 fully consumed 5
  g/L glucose within 12 h with negligible xylose utilization due to preserved PTS-mediated carbon catabolite repression, producing
  3.45 g/L D-lactate at 36 h (8.32-fold over wild-type E. coli, 34.5% conversion rate, 0.10 g/L/h productivity, 100% optical
  purity) with no detectable succinate, formate, acetate, or ethanol.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct and benchmark a glucose-specialized, byproduct-free Escherichia coli BL21(DE3) knockout chassis (GL10)
    for optically pure D-lactate synthesis in single-sugar and mixed glucose-xylose fermentation prior to co-culture assembly
    with XL12.
  assembly_strategy: Delete eight competing and D-lactate-degrading genes (pps, poxB, pflB, pta, frdABC, adhE, dld, and mgsA)
    in E. coli BL21(DE3) via CRISPR/Cas9 while retaining native PTS glucose uptake (ptsI and glk intact).
  perturbation_design: Compare E. coli GL10 monoculture against wild-type E. coli BL21(DE3), XL5, and XL12 in M9 medium supplemented
    with 5 g/L glucose alone, 5 g/L xylose alone, or mixed 5 g/L glucose + 5 g/L xylose at 37 °C and 150 rpm from an initial
    OD600 of 0.1.
  measurement_endpoints:
  - bacterial growth by OD600
  - glucose and xylose consumption kinetics
  - D-lactate titer, conversion rate, and productivity at 36 h
  - byproduct accumulation (succinate, formate, acetate, ethanol)
  - chiral optical purity of D-lactate
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a glucose-specialized strain, designated GL10, was constructed by deleting pps, poxB, pflB, pta, frdABC, adhE,
      dld, and mgsA genes
    explanation: Documents the exact eight-locus knockout genotype of glucose-specialized E. coli strain GL10.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 36 h, GL10 produced 3.45 g/L D-lactate in mixed sugars, representing an 8.32-fold increase over WT, with
      a conversion rate of 34.5% and productivity of 0.10 g/L/h
    explanation: Summarizes the 36-h mixed-sugar monoculture performance of E. coli GL10 relative to wild-type E. coli.
