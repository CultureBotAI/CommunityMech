discussions:
- discussion_id: gl10_xylose_d_lactate_conversion_bottleneck
  prompt: Why does E. coli GL10 convert 5 g/L sole xylose into only 0.64 g/L D-lactate (0.018 g/L/h) despite exhibiting growth
    and xylose consumption rates nearly identical to wild-type E. coli?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#PTS-Mediated Glucose Specialization, CCR-Driven Xylose Exclusion, and Homofermentative D-Lactate
    Production by E. coli GL10 Monoculture
  rationale: In sole-xylose medium, GL10 exhibited growth and xylose consumption kinetics nearly identical to WT (Fig. 5A)
    but yielded 3.92-fold lower D-lactate conversion (0.64 g/L) than on sole glucose (3.15 g/L), whereas deleting ptsI and
    glk in the same eight-gene knockout background (strain XL12) increased sole-xylose D-lactate to 2.66 g/L (53.2% conversion).
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When xylose was used as the sole carbon source, GL10 produced 0.64 g/L D-lactate with a productivity of 0.018
      g/L/h at 36 h ( Fig. 5 B).
    explanation: Documents low D-lactate yield (0.64 g/L, 0.018 g/L/h) in GL10 sole-xylose monoculture.
