      label: fermentation
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under single carbon source conditions, GL10 produced 3.15 g/L D-lactate from glucose with a 63% conversion rate
      and productivity of 0.09 g/L/h after 36 h, whereas no D-lactate was detected in WT.
    explanation: Quantifies GL10 monoculture D-lactate synthesis (3.15 g/L, 63% conversion, 0.09 g/L/h) on sole glucose.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When xylose was used as the sole carbon source, GL10 produced 0.64 g/L D-lactate with a productivity of 0.018
      g/L/h at 36 h ( Fig. 5 B). These results indicates that GL10 exhibits superior D-lactate synthesis capability in glucose,
      with a 3.92-fold higher conversion rate compared to xylose.
    explanation: Quantifies GL10 monoculture D-lactate output (0.64 g/L, 0.018 g/L/h) in sole-xylose medium and the 3.92-fold
      higher conversion rate on glucose.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In mixed sugar medium, GL10 exhibited improved growth over WT, with consistently higher OD600 values throughout
      fermentation. Both WT and GL10 fully consumed 5 g/L glucose within 12 h. Whereas WT and GL10 showed negligible xylose
      utilization ( Fig. 6 A).
    explanation: Demonstrates complete glucose depletion within 12 h and CCR-mediated exclusion of xylose utilization by GL10
      in mixed glucose-xylose medium.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 36 h, GL10 produced 3.45 g/L D-lactate in mixed sugars, representing an 8.32-fold increase over WT, with
      a conversion rate of 34.5% and productivity of 0.10 g/L/h ( Fig. 6 B). As expected, the optical purity of D-lactate
      generated from GL10 also reached 100% ( Table S4 ). No detectable succinate, formate, acetate, or ethanol was observed
      ( Fig. S9 ).
    explanation: Quantifies 36-h mixed-sugar D-lactate production (3.45 g/L, 100% optical purity) and complete byproduct elimination
      in GL10 monoculture.
