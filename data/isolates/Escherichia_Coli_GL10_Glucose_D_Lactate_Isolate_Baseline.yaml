ecological_interactions:
- name: PTS-Mediated Glucose Specialization, CCR-Driven Xylose Exclusion, and Homofermentative D-Lactate Production by E.
    coli GL10 Monoculture
  description: In single-sugar M9 batch fermentations (37 °C, 150 rpm, Fig. 5), Escherichia coli GL10 retained rapid native
    PTS glucose uptake, consuming 5 g/L glucose completely within 12 h and producing 3.15 g/L D-lactate at 36 h (63% conversion
    rate, 0.09 g/L/h productivity), whereas in sole-xylose medium GL10 produced only 0.64 g/L D-lactate at 36 h (0.018 g/L/h
    productivity; 3.92-fold lower conversion rate than on glucose). In mixed-sugar medium (5 g/L glucose + 5 g/L xylose, Fig.
    6), intact PTS-mediated carbon catabolite repression (CCR) in GL10 restricted xylose consumption to negligible levels
    after 5 g/L glucose was depleted within 12 h, yielding 3.45 g/L D-lactate at 36 h (8.32-fold over WT, 34.5% conversion
    rate, 0.10 g/L/h productivity, 100% optical purity) with no detectable succinate, formate, acetate, or ethanol.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Escherichia coli GL10
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  - preferred_term: xylose
    term:
      id: CHEBI:18222
      label: xylose
