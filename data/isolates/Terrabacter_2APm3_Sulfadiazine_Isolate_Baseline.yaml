id: CommunityMech:000532
name: Terrabacter sp. 2APm3 Sulfadiazine Axenic Isolate Baseline
description: Single-strain axenic bacterial isolate baseline Terrabacter sp. 2APm3 (DSMZ 28514; NCBITaxon:1472881; GTDB:g__Terrabacter)
  evaluated in vitamin-supplemented Mineral Salts Medium (MSM Brunner) containing 1 mM 13C,15N-diazine-labeled sulfadiazine
  (SDZ) at 28 degrees C alongside axenic Microbacterium sp. BR1 (CommunityMech:000531) and the Microbacterium-Terrabacter
  coculture (CommunityMech:000462) by Xue et al. 2026 (PMID:42598292). Although isolated for its ability to mineralize 2-aminopyrimidine
  (2-AP), axenic Terrabacter sp. 2APm3 left parent sulfadiazine completely unaltered after 4 days (1.0 ± 0.1 mM SDZ and 0.0
  mM 2-AP at Day 0, Day 2, and Day 4, Table 1), flow-cytometric cell counts declined from 775 ± 10 cells/μL (Day 0) to 474
  ± 44 cells/μL (Day 2), and no Raman shift was observed in the axenic culture, proving that the ipso-substitution reaction
  carried out by Microbacterium sp. BR1 is a prerequisite to the biodegradation of 2-AP by Terrabacter.
