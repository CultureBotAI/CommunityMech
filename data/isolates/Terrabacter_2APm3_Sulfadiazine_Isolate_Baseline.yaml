ecological_interactions:
- name: Inability of Axenic Terrabacter sp. 2APm3 to Cleave Intact Sulfadiazine Without Upstream Ipso-Substitution
  description: When incubated as an axenic monoculture in vitamin-supplemented MSM Brunner containing 1.0 ± 0.1 mM 13C,15N-diazine-labeled
    sulfadiazine as the sole carbon source, Terrabacter sp. 2APm3 (DSMZ 28514) left SDZ unaltered after 4 days (1.0 ± 0.1
    mM SDZ and 0.0 mM 2-AP at Day 0, Day 2, and Day 4, Table 1). Based on the stable isotope probing approach, no Raman shift
    was observed in the axenic cultures, whereas in coculture with Microbacterium BR1 the Raman band of Terrabacter shifted
    from 1000 to 988 cm-1 (Figure 2c), demonstrating that the ipso-substitution reaction carried out by Microbacterium is
    a prerequisite to the biodegradation of 2-AP by Terrabacter.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Terrabacter sp. 2APm3
    term:
      id: NCBITaxon:1472881
      label: Terrabacter sp. 2APm3
  metabolites:
  - preferred_term: sulfadiazine
    term:
      id: CHEBI:9328
      label: sulfadiazine
  - preferred_term: 2-aminopyrimidine
    term:
      id: CHEBI:38618
      label: pyrimidin-2-amine
  biological_processes:
  - preferred_term: xenobiotic catabolic process
    term:
      id: GO:0042178
      label: xenobiotic catabolic process
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Axenic cultures of Microbacterium led to the entire degradation of sulfadiazine with concomitant accumulation
      of 2-AP within 2 days, while axenic cultures of Terrabacter left SDZ unaltered after 4 days. This showed that ipso-substitution
      reaction carried out by Microbacterium is a prerequisite to the biodegradation of 2-AP by Terrabacter.
    explanation: Establishes that axenic Terrabacter sp. 2APm3 leaves SDZ unaltered after 4 days and requires upstream ipso-substitution
      by Microbacterium sp. BR1.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The faster decrease in the population of Terrabacter than that of Microbacterium can be explained by the fact
      that Terrabacter alone was not able to feed on SDZ molecule, while Microbacterium BR1 subsisted on 4-AP moiety of SDZ.
    explanation: Explains why Terrabacter cell abundance decreases more rapidly in axenic SDZ culture.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on the stable isotope probing approach, no Raman shift was observed in the axenic cultures.
    explanation: Confirms by single-cell Raman microspectroscopy that axenic Terrabacter sp. 2APm3 incorporates no 13C/15N
      from labeled SDZ.
