ecological_interactions:
- name: 2′-FL Proportion-Dependent Growth, Lactate/Acetate Fermentation, and Absence of Butyrate Synthesis in B. bifidum JCM1254
    Monoculture
  description: In 24-h anaerobic YCFA− monocultures supplemented with 0.5% (w/v) total carbohydrate across varying 2′-FL/FOS
    weight ratios (Figure 2), Bifidobacterium bifidum JCM1254 growth (OD600) increased progressively with the proportion of
    2′-fucosyllactose (2′-FL), reaching its highest level under 100% 2′-FL (Figure 2a). Extracellular lactate and acetate
    concentrations followed the same progressive increase and peaked under 100% 2′-FL (Figure 2b,c), consistent with bifidobacterial
    phosphoroketolase fermentation of 2′-FL, whereas butyrate was not detected under any tested 2′-FL/FOS ratio (Figure 2d).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium bifidum JCM1254
    term:
      id: NCBITaxon:1681
      label: Bifidobacterium bifidum
  metabolites:
  - preferred_term: 2′-fucosyllactose
    term:
      id: CHEBI:147155
      label: 2'-fucosyllactose
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: carbohydrate fermentation
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth of B. bifidum increased progressively as the proportion of 2′-FL in the substrate mixture increased
      (Figure 2a).
    explanation: Demonstrates progressive OD600 increase of B. bifidum JCM1254 monoculture with increasing 2′-FL fraction,
      peaking at 100% 2′-FL.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lactate and acetate production showed a similar trend, increasing with the proportion of 2′-FL and reaching maximal
      levels under 100% 2′-FL conditions (Figure 2b,c).
    explanation: Demonstrates that lactate and acetate accumulation in B. bifidum JCM1254 monoculture increase with 2′-FL
      proportion and peak at 100% 2′-FL.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, butyrate production was not detected under any of the tested conditions (Figure 2d).
    explanation: Confirms that B. bifidum JCM1254 monoculture produces no detectable butyrate across all tested 2′-FL/FOS
      ratios.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, B. bifidum showed a stronger growth response as the proportion of 2′-FL increased, supporting earlier
      studies reporting that B. bifidum can degrade fucosylated oligosaccharides
    explanation: Supports the progressive 2′-FL-dependent monoculture growth response of B. bifidum JCM1254 via fucosylated
      oligosaccharide degradation.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cultures were prepared either as co-cultures containing both strains or as monocultures containing either F.
      prausnitzii or B. bifidum. After anaerobic incubation at 37 °C for 24 h, OD600 was measured. The cultures were then
      centrifuged at 15,000 rpm for 5 min at 4 °C, and the supernatants and cell pellets were collected separately for SCFA
      analysis and DNA extraction, respectively.
    explanation: Documents the 24-h 37 °C anaerobic monoculture protocol and supernatant collection for organic acid quantification
      in B. bifidum JCM1254.
