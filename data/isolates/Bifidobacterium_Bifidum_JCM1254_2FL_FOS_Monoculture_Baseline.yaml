discussions:
- discussion_id: bbifidum_jcm1254_fucose_and_12propanediol_fate
  prompt: How much liberated L-fucose or 1,2-propanediol accumulates alongside lactate and acetate during B. bifidum JCM1254
    monoculture fermentation of 2′-FL across 0–100% 2′-FL ratios?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#2′-FL Proportion-Dependent Growth, Lactate/Acetate Fermentation, and Absence of Butyrate Synthesis
    in B. bifidum JCM1254 Monoculture
  rationale: The HPLC assay in PMID:42655156 quantified lactate, acetate, and butyrate after 24 h (Figure 2b–d), but did not
    measure residual 2′-FL, liberated L-fucose, or fucose-derived metabolites such as 1,2-propanediol.
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Third, residual 2′-FL and FOS concentrations after 24 h were not quantified.
    explanation: Documents that residual carbohydrate and cleavage-product levels at 24 h were not measured.
