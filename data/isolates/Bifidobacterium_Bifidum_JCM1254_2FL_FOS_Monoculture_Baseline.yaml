id: CommunityMech:000545
name: Bifidobacterium bifidum JCM1254 2'-FL/FOS Anaerobic Monoculture Baseline
description: Single-strain anaerobic gut bacterial monoculture baseline Bifidobacterium bifidum JCM1254 (NCBITaxon:1681; GTDB:s__Bifidobacterium_bifidum)
  evaluated across 2′-fucosyllactose (2′-FL) and fructooligosaccharide (FOS) weight ratios at a fixed total carbohydrate concentration
  of 0.5% (w/v) in sugar- and volatile-fatty-acid-free YCFA− broth (808 μL final volume in 48-well plates, 37 °C, 24 h anaerobic
  incubation) alongside Faecalibacterium prausnitzii A2-165 monoculture (CommunityMech:000546) and the B. bifidum–F. prausnitzii
  coculture (CommunityMech:000401) by Iguchi et al. 2026 (PMID:42655156). In monoculture (Figure 2), B. bifidum JCM1254 growth
  (OD600), lactate production, and acetate production increased progressively as the proportion of 2′-FL in the substrate
  mixture increased, reaching maximal levels under the 100% 2′-FL condition (Figure 2a–c), whereas butyrate production was
  not detected under any tested condition (Figure 2d).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Determine the monoculture growth and organic-acid fermentation response of the human milk oligosaccharide-utilizing
    gut symbiont Bifidobacterium bifidum JCM1254 across varying 2′-FL/FOS weight ratios as a baseline for interpreting two-species
    cross-feeding with Faecalibacterium prausnitzii A2-165.
  assembly_strategy: Revive B. bifidum JCM1254 on glucose-supplemented YCFA medium, wash twice in sugar- and VFA-free YCFA−
    medium, adjust OD600 to 1.0, and inoculate 8 μL into 800 μL of 2′-FL/FOS-supplemented YCFA− medium in 48-well microplates.
  perturbation_design: Vary the weight ratio of 2′-fucosyllactose (2′-FL) to fructooligosaccharides (FOS) from 0:100 to 100:0
    while maintaining total carbohydrate at 0.5% (w/v), alongside a no-substrate negative control, under 24-h anaerobic incubation
    at 37 °C.
  measurement_endpoints:
  - OD600 at 600 nm after 24 h anaerobic incubation
  - lactate, acetate, and butyrate concentrations by 2-nitrophenylhydrazine derivatization HPLC at 400 nm (YMC-Pack FA column)
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth of B. bifidum increased progressively as the proportion of 2′-FL in the substrate mixture increased
      (Figure 2a).
    explanation: Documents the monoculture experimental design and progressive 2′-FL growth response of B. bifidum JCM1254.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lactate and acetate production showed a similar trend, increasing with the proportion of 2′-FL and reaching maximal
      levels under 100% 2′-FL conditions (Figure 2b,c). In contrast, butyrate production was not detected under any of the
      tested conditions (Figure 2d).
    explanation: Documents the lactate, acetate, and zero-butyrate fermentation profile of B. bifidum JCM1254 monoculture
      across 2′-FL/FOS ratios.
