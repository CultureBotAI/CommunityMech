id: CommunityMech:000547
name: Ramichloridium apiculatum CMS-1 Wollastonite Bioleaching Isolate Baseline
description: Single-strain fungal isolate baseline Ramichloridium apiculatum CMS-1 (NCBITaxon:470080) isolated from mineral-rich
  soil and evaluated as the 100% CMS-1 pure-culture wollastonite bioleaching control (1 mL of 10^6 spores/mL suspension inoculated
  into 100 mL modified Czapek liquid medium with 0.5 g wollastonite in 250 mL conical flasks at 30 °C and 150 rpm over 14
  days) alongside Talaromyces pseudofuniculosus hzt-3′ pure culture (CommunityMech:000548) and the 20% CMS-1 + 80% hzt-3′
  mixed fungal consortium (CommunityMech:000404) by Chang et al. 2026 (PMID:42478817). In pure culture (100% CMS-1), R. apiculatum
  CMS-1 exhibited weak broth acidification (lowest suspension pH approximately 6.9 ± 0.12, Fig. 3c) and achieved only 2.65%
  (2.46% in Results text) Ca2+ leaching efficiency but 13.70% Si4+ leaching efficiency via organic-acid anion complexation
  (Fig. 3a,b). Metabolic profiling showed net extracellular polysaccharide accumulation between days 6 and 10 (Fig. 4a), 13.21
  ± 0.66 µg/mL extracellular protein at day 14 (Fig. 4b), oxalic acid (0.66 ± 0.033 mg/mL) as the dominant organic acid over
  malic (0.050 ± 0.0022 mg/mL), glycolic (0.046 ± 0.0016 mg/mL), and gluconic (0.045 ± 0.0013 mg/mL) acids (Fig. 5), and 9.63
  ± 0.46 µg/mL L-glutamic acid with low L-glutamine (0.56 ± 0.028 µg/mL) and L-(-)-tyrosine (0.80 ± 0.035 µg/mL) accumulation
  (Fig. 6).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Quantify the pure-culture wollastonite Ca2+ and Si4+ bioleaching efficiency, broth pH trajectory, and extracellular
    metabolite profile (polysaccharides, proteins, organic acids, and amino acids) of Ramichloridium apiculatum CMS-1 as the
    100% CMS-1 baseline for mixed-fungus silicate weathering.
  assembly_strategy: Activate R. apiculatum CMS-1 on Czapek solid medium at 30 °C, harvest spores in 0.1% Tween 80 to 10^6
    spores/mL, and inoculate 1 mL of 100% CMS-1 spore suspension into 100 mL autoclaved modified Czapek liquid medium containing
    0.5 g wollastonite powder.
  perturbation_design: Compare the 100% CMS-1 pure culture against 100% hzt-3′ pure culture and four mixed CMS-1:hzt-3′ inoculation
    ratios (80:20, 60:40, 40:60, and 20:80) over 14 days at 30 °C and 150 rpm with sampling every 2 days.
  measurement_endpoints:
  - Ca2+ and Si4+ leaching efficiencies over 14 days
  - leaching suspension pH
  - extracellular polysaccharide and protein concentrations
  - organic acid and amino acid profiles by LC-ESI-MS/MS
  - FT-IR and XRD characterization of wollastonite leaching residues
  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The mixed-strain proportions were set to six ratios: 100% CMS-1, 80% CMS-1 + 20% hzt-3′, 60% CMS-1 + 40% hzt-3′,
      40% CMS-1 + 60% hzt-3′, 20% CMS-1 + 80% hzt-3′, and 100% hzt-3′.'
    explanation: Defines the 100% CMS-1 pure-culture baseline alongside the mixed-strain ratios and 100% hzt-3′ pure culture.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strain CMS-1 primarily produced oxalic acid (0.66 ± 0.033 mg/mL), while strain hzt-3′ mainly generated gluconic
      acid (1.60 ± 0.0798 mg/mL).
    explanation: Quantifies oxalic acid (0.66 ± 0.033 mg/mL) as the dominant organic acid in R. apiculatum CMS-1 pure culture.
