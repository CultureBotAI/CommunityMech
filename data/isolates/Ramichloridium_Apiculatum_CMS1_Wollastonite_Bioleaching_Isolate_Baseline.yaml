  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Comparing the leaching results of Ca2+ and Si4+ from wollastonite in the 100% CMS-1 system reveals a significant
      difference: the Ca2+ leaching efficiency was only 2.46%, while the Si4+ leaching efficiency reached 13.70%.'
    explanation: Quantifies the divergent Ca2+ (2.46%, or 2.65% in Abstract) and Si4+ (13.70%) leaching efficiencies of pure
      R. apiculatum CMS-1.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain CMS-1 exhibited a relatively weak acid-producing capacity, with the lowest pH reaching approximately 6.9
      ± 0.12.
    explanation: Quantifies the minimum suspension pH (~6.9 ± 0.12) in the 100% CMS-1 pure-culture leaching system.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In the 100% CMS-1 system, the primary organic acids and their concentrations were as follows: oxalic acid (0.66
      ± 0.033 mg/mL) > malic acid (0.050 ± 0.0022 mg/mL) > glycolic acid (0.046 ± 0.0016 mg/mL) > gluconic acid (0.045 ± 0.0013
      mg/mL).'
    explanation: Quantifies the organic-acid profile of R. apiculatum CMS-1 pure culture dominated by oxalic acid.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, the increase in polysaccharide content in the pure strain CMS-1 leaching system between days 6 and
      10 was due to the higher production of polysaccharides by the strain compared to their metabolic consumption.
    explanation: Documents net extracellular polysaccharide accumulation between days 6 and 10 in the 100% CMS-1 system.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This significant discrepancy can be attributed to the fact that strain CMS-1 can produce a substantial amount
      of L-glutamic acid (9.63 ± 0.46 µg/mL) from the substrate; however, due to its own regulatory mechanisms, its glutamine
      synthetase is either deficient or exhibits low activity, making it difficult to synthesize L-glutamine ( 52 ).
    explanation: Quantifies 9.63 ± 0.46 µg/mL L-glutamic acid accumulation and low L-glutamine conversion in the 100% R. apiculatum
      CMS-1 pure-culture leaching system.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The organic acids produced by the metabolism of strain CMS-1 dissociate into H+ and R-COO−. The H+ is consumed
      in neutralizing OH−, while the R-COO− complexes with Si4+, thereby promoting its leaching ( 43 ).
    explanation: 'Explains the mechanistic basis for selective Si4+ leaching (13.70%) over Ca2+ leaching (2.46%–2.65%) in
      100% R. apiculatum CMS-1 pure culture: protons neutralize alkaline OH− while organic-acid anions complex Si4+.'
