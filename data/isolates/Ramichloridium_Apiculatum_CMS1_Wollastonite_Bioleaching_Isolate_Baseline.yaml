ecological_interactions:
- name: Oxalic Acid-Dominated Organic Acid Secretion, Extracellular Polymer Accumulation, and Selective Si4+ Complexation
    Leaching by R. apiculatum CMS-1 Pure Culture
  description: In the 100% CMS-1 pure-culture wollastonite bioleaching system (30 °C, 150 rpm, 14 days), Ramichloridium apiculatum
    CMS-1 produced oxalic acid (0.66 ± 0.033 mg/mL) as its predominant organic acid followed by malic acid (0.050 ± 0.0022
    mg/mL), glycolic acid (0.046 ± 0.0016 mg/mL), and gluconic acid (0.045 ± 0.0013 mg/mL) with trace isocitric acid (≈3 ×
    10−4 mg/mL, Fig. 5). Because total acid output was modest and wollastonite silicate ions hydrolyze to OH−, the lowest
    broth pH reached only approximately 6.9 ± 0.12 (Fig. 3c), restricting proton-exchange Ca2+ leaching to 2.46% (reported
    as 2.65% in the Abstract) while carboxylate anion complexation achieved 13.70% Si4+ leaching efficiency (Fig. 3a,b). Between
    days 6 and 10, pure CMS-1 exhibited net extracellular polysaccharide accumulation (Fig. 4a), reached 13.21 ± 0.66 µg/mL
    extracellular protein at day 14 (Fig. 4b), and accumulated 9.63 ± 0.46 µg/mL L-glutamic acid alongside 17.32 ± 0.87 µg/mL
    L-(+)-arginine, 0.56 ± 0.028 µg/mL L-glutamine, and 0.80 ± 0.035 µg/mL L-(-)-tyrosine (Fig. 6).
  scope: COMMUNITY_LEVEL
