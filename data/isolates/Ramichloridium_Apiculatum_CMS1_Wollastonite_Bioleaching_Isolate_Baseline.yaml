discussions:
- discussion_id: cms1_abstract_vs_results_ca_leaching_discrepancy
  prompt: Why does the Abstract of PMID:42478817 report 2.65% Ca2+ leaching efficiency for R. apiculatum CMS-1 pure culture
    (consistent with 79.95% / 30.17 = 2.65% at day 12), whereas the Results text states 2.46% Ca2+ leaching efficiency alongside
    13.70% Si4+ leaching efficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Oxalic Acid-Dominated Organic Acid Secretion, Extracellular Polymer Accumulation, and Selective
    Si4+ Complexation Leaching by R. apiculatum CMS-1 Pure Culture
  rationale: The Abstract states that the 20% CMS-1 + 80% hzt-3′ Ca2+ leaching efficiency (79.95% ± 6.37%) represents a 30.17-fold
    increase over CMS-1 pure culture (2.65% Ca2+ leaching efficiency), whereas the Results section comparing Ca2+ and Si4+
    in the 100% CMS-1 system reports 2.46% Ca2+ and 13.70% Si4+ (potentially reflecting day-12 vs day-14 timepoints in Fig.
    3a).
  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The 20% CMS-1 + 80% hzt-3′ ratio achieved leaching efficiency of 79.95% ± 6.37% for Ca2+ and 18.59% ± 0.11% for
      Si4+, representing an approximately 30.17-fold increase over CMS-1 pure culture (2.65% Ca2+ leaching efficiency).
    explanation: Reports 2.65% Ca2+ leaching efficiency for CMS-1 pure culture in the Abstract.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Comparing the leaching results of Ca2+ and Si4+ from wollastonite in the 100% CMS-1 system reveals a significant
      difference: the Ca2+ leaching efficiency was only 2.46%, while the Si4+ leaching efficiency reached 13.70%.'
    explanation: Reports 2.46% Ca2+ leaching efficiency for the 100% CMS-1 system in Results.
