id: CommunityMech:000549
name: Bacillus paramycoides B8-1 PAH Biodegradation Isolate Baseline
description: Single-strain PAH-degrading bacterial isolate baseline Bacillus paramycoides B8-1 (NCBITaxon:2026194) enriched
  from petroleum-contaminated subsurface soil from General Petroleum Company, Ras Gharib, Egypt on mineral salt medium (MSM,
  pH 7.0 +/- 0.2) with 1000 mg/L phenanthrene or naphthalene and characterized in both planktonic and glass-tube biofilm modes
  alongside Bacillus paranthracis A1 (CommunityMech:000550), Bacillus licheniformis A3 (CommunityMech:000551), and Consortia
  1-4 (CommunityMech:000502, CommunityMech:000503, CommunityMech:000358, CommunityMech:000504) by Ashraf et al. 2026 (PMID:42587276).
  Isolate B8-1 achieved the highest single-strain planktonic degradation efficiency at 37 °C, 150 rpm, and pH 7 (200 mg/L
  initial PAH, 7 days), removing 77.94% of phenanthrene and 98.43% of naphthalene, maintained >50% phenanthrene removal across
  pH 6-8 and >55% naphthalene removal across pH 5-8 (92.09%, 98.43%, 95.73%, and 71.36% naphthalene degradation at 30, 37,
  40, and 50 °C), and degraded 60.72% of phenanthrene in 7-day static glass-tube biofilm mode, outperforming all four multi-strain
  consortia on phenanthrene.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Isolate, optimize, and benchmark indigenous Bacillus paramycoides strain B8-1 in planktonic and glass-attached
    biofilm modes for 7-day biodegradation of 200 mg/L phenanthrene and naphthalene as a single-strain baseline for Consortia
    1, 2, and 4.
  assembly_strategy: Enrich 5.0 g petroleum-contaminated subsurface soil in 100 mL MSM with 1000 mg/L phenanthrene or naphthalene
    across three successive 7-day transfers at 37 °C and 150 rpm, screen purified colonies by DCPIP reduction and HPLC at
    200 mg/L PAH, and select isolate B8-1.
  inoculation_strategy: Standardize washed overnight Nutrient Broth cells in 0.9% NaCl to OD600 = 1.0 (1 mL into 50 mL MSM
    for screening; overnight inoculum in 7 mL MSM tubes for planktonic comparison) or dilute fresh cultures to OD550 = 0.2
    in TSB for 48-h static biofilm formation.
  perturbation_design: Optimize pH (5-9 at 37 °C, 150 rpm, 7 days) and temperature (25, 30, 37, 40, and 50 °C at pH 7, 150
    rpm, 7 days) for isolate B8-1, and compare planktonic versus 48-h preformed glass-tube biofilm degradation of 200 mg/L
    phenanthrene and naphthalene.
  measurement_endpoints:
  - DCPIP redox indicator reduction at OD600
  - HPLC quantification of residual phenanthrene and naphthalene at 254 nm
  - biofilm formation by crystal violet OD595 assay
  - 16S rRNA phylogenetic identification
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among them, isolate B8-1 showed the highest degradation efficiency, with 77.94% phenanthrene degradation and
      98.43% naphthalene degradation.
    explanation: Establishes the single-strain planktonic degradation rates of isolate B8-1 at 200 mg/L PAH.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On the contrary, the isolate B8-1 exhibited a biodegradation rate, in the planktonic mode, of 77.94% that relatively
      higher than that obtained in its biofilm mode, 60.72% (see Fig. 8 a).
    explanation: Compares planktonic (77.94%) versus biofilm (60.72%) phenanthrene biodegradation for isolate B8-1.
