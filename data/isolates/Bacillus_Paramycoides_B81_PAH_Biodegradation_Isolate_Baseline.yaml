ecological_interactions:
- name: Planktonic and Biofilm Phenanthrene and Naphthalene Biodegradation by Isolate B8-1
  description: In 7-day MSM monoculture assays at 200 mg/L PAH (37 °C, pH 7, 150 rpm), Bacillus paramycoides B8-1 degraded
    77.94% of phenanthrene and 98.43% of naphthalene, maintaining >50% phenanthrene degradation across pH 6-8, >55% naphthalene
    degradation across pH 5-8, and 92.09%, 98.43%, 95.73%, and 71.36% naphthalene degradation at 30, 37, 40, and 50 °C. In
    7-day static glass-tube biofilm mode, B8-1 degraded 60.72% of phenanthrene (lower than its 77.94% planktonic rate, attributed
    to delayed phenanthrene diffusion across the EPS matrix) while outperforming all four multi-strain consortia on phenanthrene.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paramycoides B8-1
    term:
      id: NCBITaxon:2026194
      label: Bacillus paramycoides
  metabolites:
  - preferred_term: phenanthrene
    term:
      id: CHEBI:28851
      label: phenanthrene
  - preferred_term: naphthalene
    term:
      id: CHEBI:16482
      label: naphthalene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The degradation results showed that phenanthrene degradation exceeded 50% within the pH range of 6–8, with the
      maximum degradation rate (77.94%) observed at pH 7 (Fig. 4 ). Similarly, naphthalene degradation exceeded 55% between
      pH 5–8, reaching a maximum degradation rate of 98.43% at pH 7 (Fig. 4 ).
    explanation: Quantifies the pH range and pH 7 maxima for phenanthrene (77.94%) and naphthalene (98.43%) removal by B8-1.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the case of naphthalene, isolate B8-1 showed a great biodegradation rate of 92.09%, 98.43%, and 95.73% of
      naphthalene at temperatures of 30, 37, and 40 °C, respectively (see Fig. 6 ). Moreover, at a high temperature of 50
      °C, the isolate B8-1 has displayed a naphthalene biodegradation rate of 71.36%.
    explanation: Quantifies naphthalene biodegradation by isolate B8-1 across 30, 37, 40, and 50 °C.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On the contrary, the isolate B8-1 exhibited a biodegradation rate, in the planktonic mode, of 77.94% that relatively
      higher than that obtained in its biofilm mode, 60.72% (see Fig. 8 a).
    explanation: Documents the higher planktonic (77.94%) than biofilm (60.72%) phenanthrene removal in isolate B8-1.
