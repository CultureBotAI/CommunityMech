    evidence_source: IN_VITRO
    snippet: The isolation process involved inoculating 10.0 mL aliquots of liquid samples into modified 9 K medium (pH 1.6)
      supplemented with 22.4 g/L FeSO4·7H2O and 0.02% (w/v) yeast extract. Cultivation was conducted at 40 °C under aerobic
      conditions using a rotary shaker at 170 rpm.
    explanation: Confirms aerobic cultivation of F. acidiphilum ZJ at pH 1.6 and 40 degrees C in ferrous-sulfate-supplemented
      modified 9K medium.
  - reference: PMID:40722006
