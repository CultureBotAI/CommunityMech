    evidence_source: IN_VITRO
    snippet: To better understand the environmental adaptability of archaea in AMD, the GIs of an archaeal Ferroplasma acidiphilum
      ZJ isolated from AMD of Zijin Mine and 25 other acidophilic archaeal strains collected from NCBI were predicted.
    explanation: Establishes the isolation of Ferroplasma acidiphilum strain ZJ from acid mine drainage of Zijin Mine.
  - reference: PMID:40722006
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: One hundred thirty-one genes total amongst 5 GIs were predicted in F. acidiphilum ZJ. A total of 171 GIs were
      identified across the genomes of other 25 acidophilic archaea.
    explanation: Quantifies the 5 predicted genomic islands containing 131 genes in Ferroplasma acidiphilum ZJ.
  - reference: PMID:40722006
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: There was also a group of Cas proteins in the 3rd GI of F. acidiphilum ZJ and 4th GI of F. acidiphilum Y, which,
      constituted a specific immune defense system known as the CRISPR/Cas system along with CRISPR (Fig. 7 a and b). Cas2
      and Cas4 genes were predominantly identified, arranged adjacent to CRISPR loci, and encode Cas proteins possessing nuclease,
      helicase, integrase, and other enzymatic activities.
    explanation: Identifies the CRISPR/Cas immune defense locus (Cas2 and Cas4 adjacent to CRISPR repeats) on the 3rd genomic
      island of F. acidiphilum ZJ.
