id: CommunityMech:000495
name: Ferroplasma acidiphilum ZJ Acid Mine Drainage Isolate
description: Acidophilic iron-oxidizing archaeal isolate Ferroplasma acidiphilum strain ZJ recovered from acid mine drainage
  (AMD) of Zijin Mine in modified 9K medium (pH 1.6, 22.4 g/L FeSO4.7H2O, 0.02% w/v yeast extract) at 40 degrees C and 170
  rpm. Complete PacBio RS and Illumina HiSeq genome analysis (36.9% average GC content) predicted 131 genes across 5 genomic
  islands (GIs; GC content 32.3-38.9%), including a CRISPR/Cas immune defense locus (Cas2 and Cas4 adjacent to CRISPR repeats
  in the 3rd GI) alongside horizontal gene transfer (HGT)-derived heavy-metal metabolism, iron oxidation, mercury reduction,
  and toxin-antitoxin systems that enhance adaptation to extremely acidic heavy-metal-rich AMD environments (PMID:40722006).
