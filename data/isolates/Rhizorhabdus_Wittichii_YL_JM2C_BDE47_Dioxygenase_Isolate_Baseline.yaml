ecological_interactions:
- name: TcsAaAb-Catalyzed BDE-47 Angular Dioxygenation, 3,5-DBC Ortho-Cleavage, and Dead-End 2,4-DBP Accumulation in Strain
    YL-JM2C
  description: In aerobic pH 7.0 MSM assays at 30 °C and 180 rpm, Rhizorhabdus wittichii YL-JM2C initiated BDE-47 catabolism
    via the two-component NAD(P)H-dependent Rieske dioxygenase TcsAaAb, cleaving the diphenyl ether bond to generate 3,5-dibromocatechol
    (3,5-DBC) and 2,4-dibromophenol (2,4-DBP). While 3,5-DBC was rapidly mineralized via adjacent chlorocatechol 1,2-dioxygenase
    TcsC, TcsDEF, PcaIJ, and PcaF into the beta-ketoadipate/TCA pathway, 2,4-DBP accumulated stoichiometrically as a dead-end
    product (LC-MS retention time 12.0 min, m/z 250.8514 [M-H]-) because the native flavin monooxygenase homolog RwTfdB (>50%
    identity to TfdB) is active on 2-bromophenol and 2-hydroxybiphenyl but has no catalytic activity toward 2,4-DBP.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Rhizorhabdus wittichii YL-JM2C
    term:
      id: NCBITaxon:160791
      label: Rhizorhabdus wittichii
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Taken together, these results demonstrate that TcsAaAb is responsible for the initial step of BDE-47 degradation,
      catalyzing its conversion into 3,5-DBC and 2,4-DBP. The intermediate 3,5-DBC can be further catabolized, whereas 2,4-DBP
      accumulates as a dead-end metabolic product in strain YL-JM2C.
    explanation: Establishes TcsAaAb-mediated BDE-47 cleavage to 3,5-DBC and dead-end 2,4-DBP in strain YL-JM2C.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TcsC converted 3,5-DBC into the corresponding muconic acid ( Fig. S4 ), which was further catabolized by TcsDEF
      ( Fig. S5 ) and subsequently channeled into the TCA cycle via the β-ketoadipate pathway catalyzed by PcaIJ and PcaF
      ( Fig. S6 ).
    explanation: Demonstrates complete enzymatic catabolism of 3,5-DBC via TcsC, TcsDEF, PcaIJ, and PcaF in strain YL-JM2C.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results demonstrated that RwTfdB was indeed active but towards 2-bromophenol (2BP) and 2-hydroxybiphenyl
      (2HBP), rather than 2,4-DBP ( Fig. 2 ). This observation further confirms inability of the strain to degrade 2,4-DBP,
      resulting in its accumulation.
    explanation: Explains the biochemical basis of 2,4-DBP accumulation in YL-JM2C via the substrate specificity of purified
      RwTfdB.
environmental_factors:
- name: Triclosan pre-induction of BDE-47 degradation in strain YL-JM2C
  value: 10 uM triclosan (TCS) vs glucose pre-cultivation in R2A
  description: Pre-treating strain YL-JM2C with 10 uM triclosan significantly accelerated subsequent BDE-47 biotransformation
    compared with glucose-pretreated cells.
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the degradation rate of BDE-47 was significantly accelerated when strain YL-JM2C was pretreated with
      TCS compared with glucose-pretreated cells ( Fig. S2 ), further supporting the involvement of TCS catabolic genes in
      BDE-47 degradation.
    explanation: Documents accelerated BDE-47 degradation following 10 uM triclosan induction in strain YL-JM2C.
