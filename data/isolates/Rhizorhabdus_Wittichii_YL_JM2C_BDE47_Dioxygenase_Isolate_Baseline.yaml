id: CommunityMech:000554
name: Rhizorhabdus wittichii YL-JM2C BDE-47 Dioxygenase Isolate Baseline
description: Single-strain aerobic organobromine-degrading bacterial isolate baseline Rhizorhabdus wittichii YL-JM2C (NCBITaxon:160791;
  complete hybrid Nanopore/Illumina genome assembly BioProject PRJNA1397584, ~97% ANIb with R. wittichii RW1) isolated from
  a wastewater treatment plant as a triclosan degrader and characterized in pure culture and whole-cell biotransformation
  assays alongside Cupriavidus necator JMP134 (CommunityMech:000555) and the YL-JM2C/JMP134 synthetic consortium (CommunityMech:000388)
  by Pan and Zhou 2026 (PMID:42364169). In MSM containing 18 uM BDE-47 and 0.04% (w/v) yeast extract (pH 7.0, 30 °C, 180 rpm),
  strain YL-JM2C grew from OD600 0.05 to 0.15 within 24 h while depleting BDE-47 from 18 uM to 4 uM (Fig. 1b); in resting-cell
  assays (OD600 = 4.0, 50 uM BDE-47), YL-JM2C depleted BDE-47 within 20 h via the two-component Rieske dioxygenase TcsAaAb
  (forming 3,5-dibromocatechol, catabolized via TcsC, TcsDEF, PcaIJ, and PcaF, plus 2,4-dibromophenol), but accumulated stoichiometric
  2,4-dibromophenol (LC-MS retention time 12.0 min, m/z 250.8514) as a dead-end product because its native TfdB homolog RwTfdB
  is active on 2-bromophenol and 2-hydroxybiphenyl but inactive toward 2,4-dibromophenol.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Characterize the aerobic BDE-47 degradation kinetics, whole-genome taxonomy, and enzymatic pathway (TcsAaAb,
    TcsCDEF, PcaIJ/PcaF, and RwTfdB substrate specificity) of Rhizorhabdus wittichii strain YL-JM2C in pure culture as the
    donor baseline for the YL-JM2C/JMP134 metabolic-relay consortium.
  assembly_strategy: Pre-grow wastewater isolate R. wittichii YL-JM2C to exponential phase in R2A (with optional 10 uM triclosan
    or glucose induction), wash in 50 mM Tris-HCl (pH 7.4), and assay growth-coupled degradation (18 uM BDE-47 + 0.04% w/v
    yeast extract) and resting-cell biotransformation (OD600 = 4.0, 50 uM BDE-47) in pH 7.0 MSM.
  inoculation_strategy: Inoculate 1% (v/v) exponential-phase R2A washed cells into MSM (pH 7.0) with 18 uM BDE-47 and 0.04%
    (w/v) yeast extract, or resuspend harvested cells to OD600 = 4.0 in MSM with 50 uM BDE-47.
  perturbation_design: Compare BDE-47 dissipation and 2,4-DBP accumulation in YL-JM2C monoculture versus uninoculated controls
    and versus the YL-JM2C + JMP134 coculture, compare triclosan- versus glucose-pretreated cells, and functionally verify
    recombinant TcsAaAb, TcsC, TcsDEF, PcaIJ, PcaF, and purified RwTfdB.
  measurement_endpoints:
  - hybrid Nanopore/Illumina whole-genome assembly (PRJNA1397584) and ANIb phylogeny
  - OD600 growth and HPLC quantification of BDE-47 (226 nm) and 2,4-DBP (280 nm)
  - LC-MS and GC-MS identification of 2,4-DBP and 3,5-DBC intermediates
  - in vitro NADPH consumption assays (340 nm) of purified His-tagged RwTfdB
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When strain YL-JM2C was cultivated in yeast extract (0.04%, w/v)-containing MSM supplemented with BDE-47, its
      biomass concentration (OD600) increased from 0.05 to 0.15 within the first 24 h and then slightly declined to 0.14 at
      the end of cultivation ( Fig. 1b ). Concurrently, the concentration of BDE-47 decreased from 18 to 4 μM
    explanation: Quantifies pure-culture growth (OD600 0.05 to 0.15) and BDE-47 removal (18 to 4 uM) by strain YL-JM2C.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, when strain YL-JM2C was inoculated alone, BDE-47 disappeared within 20 h but accompanying by stoichiometric
      accumulation of 2,4-DBP.
    explanation: Demonstrates 20-h BDE-47 depletion accompanied by stoichiometric 2,4-DBP accumulation in YL-JM2C monoculture.
