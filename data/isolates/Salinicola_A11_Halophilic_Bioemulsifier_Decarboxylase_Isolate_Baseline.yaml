id: CommunityMech:000553
name: Salinicola sp. A11 Halophilic Bioemulsifier and Decarboxylase Isolate Baseline
description: Single-strain halophilic bacterial isolate baseline Salinicola sp. A11 (NCBITaxon:404432; SRA accession SRR38848454;
  4.37 Mb draft genome, 18 contigs, 64.29% GC, 100.0% CheckM2 completeness) isolated on 5% sea-salt defined medium agar with
  100 mg/L yeast extract (SSDM-Y) from the halophilic PAH-degrading consortium 5H and characterized in pure culture alongside
  Pelagerythrobacter sp. N7 (CommunityMech:000552) and the two-member PES synthetic consortium (CommunityMech:000340) by Wen
  et al. 2026 (PMID:42666409). In axenic culture, strain A11 grew on 5% SSDM with 100 mg/L yeast extract (30 °C, 120 rpm)
  and secreted an extracellular Emulsan-like glycoprotein bioemulsifier (encoded by the wza/wzb/wzc/wzx/wzy/weeABGJ/galUE/mip
  gene cluster, Table 2) achieving a 24-h soybean-oil emulsification index (E24) of 68% with FTIR peaks at 3419.9, 2924.3,
  2854.7, 1631.1, and 1128.4 cm-1, showed no direct pyrene degradation when incubated with 50 mg/L pyrene alone (Fig. 2C),
  and encoded the candidate 4,5-dicarboxyphenanthrene decarboxylase hphtC-5 (596.99 A3 binding pocket, His109-His111-His172
  zinc triad) plus salicylate hydroxylase and catechol 1,2-dioxygenase (C12O).
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Isolate, genome-sequence, and functionally characterize Salinicola sp. strain A11 in pure culture to establish
    its axenic PAH-non-degrading baseline, extracellular Emulsan-like bioemulsifier production (E24 = 68%), and candidate
    hphtC-5 decarboxylase/C12O genetic repertoire prior to pairing with Pelagerythrobacter sp. N7 in consortium PES.
  assembly_strategy: Spread phenanthrene-enriched consortium 5H onto 5% SSDM agar supplemented with 100 mg/L yeast extract
    (SSDM-Y), isolate pure colony A11, sequence its whole genome on Illumina PE150 (SRR38848454), and assay pure-culture pyrene
    degradation and bioemulsifier synthesis.
  inoculation_strategy: Cultivate pure strain A11 in 20 mL (genome sequencing, 4 days) or 5% SSDM supplemented with 100 mg/L
    yeast extract (bioemulsifier assay, 5 days) or 50 mg/L pyrene (7-day monoculture control, Fig. 2C) at 30 °C and 120 rpm
    in darkness.
  perturbation_design: Compare axenic A11 growth and residual pyrene in 5% SSDM with 50 mg/L pyrene versus 100 mg/L yeast
    extract (Fig. 2C), assay 24-h soybean-oil emulsification (E24) of A11 cell-free supernatant versus washed cells, characterize
    ethanol/dichloromethane-extracted bioemulsifier by FTIR, and model HphtC-5 active-site structure with AlphaFold and DoGSiteScorer.
  measurement_endpoints:
  - Illumina whole-genome shotgun sequencing (SRR38848454), Unicycler assembly, and CheckM2 QC
  - HPLC residual pyrene and OD600 growth curves in 5% SSDM with pyrene vs yeast extract
  - 24-h emulsification index (E24) against soybean oil and FTIR spectroscopy (4000-400 cm-1)
  - AlphaFold and DoGSiteScorer structural modeling of candidate decarboxylase HphtC-5
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain A11 was detected to be unable to degrade PAHs ( Figure 2C ).
    explanation: Establishes that Salinicola sp. A11 pure culture cannot directly degrade pyrene on its own.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: An emulsification test verified the high efficiency and prolonged stability of the bioemulsifier synthesized
      by strain A11 ( Figure 6A ). The cell-free fermentation broth achieved a 24-h emulsification index of 68% against soybean
      oil.
    explanation: Quantifies the 68% 24-h emulsification index (E24) of the extracellular bioemulsifier produced by strain
      A11 pure culture.
