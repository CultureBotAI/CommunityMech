ecological_interactions:
- name: Extracellular Emulsan-Like Bioemulsifier Secretion and Candidate hphtC-5 Decarboxylase / C12O Repertoire in Strain
    A11 Pure Culture
  description: When cultivated axenically in 5% salinity SSDM supplemented with 100 mg/L yeast extract (30 °C, 120 rpm in
    darkness for 5 days), Salinicola sp. A11 secreted an extracellular Emulsan-like glycoprotein bioemulsifier into the cell-free
    supernatant (24-h soybean-oil emulsification index E24 = 68%; FTIR absorption bands at 3419.9, 2924.3, 2854.7, 1631.1,
    and 1128.4 cm-1; Wza-Wzb-Wzc export gene cluster FPDNJMPM_01274 to FPDNJMPM_01306, galU FPDNJMPM_01143, galE FPDNJMPM_00824,
    and mip FPDNJMPM_03717). In 5% SSDM with 50 mg/L pyrene as sole carbon source, A11 showed no direct PAH degradation, while
    its 4.37 Mb genome encoded six candidate decarboxylases (hphtC 1-6, notably hphtC-5 with a 596.99 A3 binding pocket and
    His109-His111-His172 catalytic triad) plus salicylate hydroxylase and catechol 1,2-dioxygenase (C12O).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Salinicola sp. A11
    term:
      id: NCBITaxon:404432
      label: Salinicola
  metabolites:
  - preferred_term: pyrene
    term:
      id: CHEBI:39106
      label: pyrene
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The cell-free fermentation broth achieved a 24-h emulsification index of 68% against soybean oil. Notably, a
      clear aqueous phase remained at the bottom, accompanied by a distinct white flocculent polymer network at the oil–water
      interface.
    explanation: Quantifies the 68% 24-h emulsification index of the A11 cell-free fermentation broth.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In contrast, the catalytic residues of A11 were integrated into the primary binding pocket, which has a significantly
      expanded volume of 596.99 Å3, which is consistent with the spatial expansion predicted from the Glu90 to Gly90 substitution.
    explanation: Characterizes the 596.99 A3 primary active-site binding pocket of candidate decarboxylase HphtC-5 in strain
      A11.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The presence of genes encoding salicylate hydroxylase and C12O indicated that strain A11 is able to degrade salicylic
      acid through the C12O pathway, which is an important PAH downstream degradation pathway
    explanation: Identifies the salicylate hydroxylase and catechol 1,2-dioxygenase (C12O) downstream pathway genes in the
      A11 genome.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the peaks at 3419.9 cm−1 (O–H/N–H stretching) and 1128.4 cm−1 (C–O stretching) indicated a polysaccharide
      backbone, whereas the twin peaks at 2924.3 and 2854.7 cm−1 (aliphatic C–H stretching) confirm the presence of hydrophobic
      fatty acid chains. Furthermore, the prominent amide I band at 1631.1 cm−1 (C=O stretching) revealed the presence of
      a glycoprotein complex structure
    explanation: Characterizes the polysaccharide, aliphatic fatty-acid chain, and glycoprotein amide I FTIR absorption bands
      of the Emulsan-like bioemulsifier extracted from strain A11.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Microscopic active site analysis ( Figures 5B–D ) revealed that strain A11 formed a catalytic triad via His109,
      His111, and His172, with internal atomic distances of 3.01 Å, 2.85 Å, and 3.50 Å, respectively.
    explanation: Characterizes the His109-His111-His172 zinc-coordinating catalytic triad geometry of candidate 4,5-dicarboxyphenanthrene
      decarboxylase HphtC-5 in strain A11.
