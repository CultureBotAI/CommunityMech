ecological_interactions:
- name: Biofilm-Enhanced Phenanthrene and Naphthalene Biodegradation by Isolate A1 in Liquid and Soil Microcosms
  description: In 7-day MSM assays at 200 mg/L PAH (37 °C, pH 7), Bacillus paranthracis A1 increased phenanthrene biodegradation
    from 31.82% in planktonic culture to 70.22% in 48-h preformed glass-tube biofilm culture (the highest biofilm phenanthrene
    degradation among all tested isolates and consortia) and increased naphthalene biodegradation more than 2-fold from 41.01%
    (planktonic) to 87.72% (biofilm). In artificially contaminated soil microcosms (5 g soil with 200 mg/g phenanthrene incubated
    over a 48-h preformed flask biofilm for 7 days at 37 °C), the isolate A1 biofilm degraded 60.98% of phenanthrene.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  metabolites:
  - preferred_term: phenanthrene
    term:
      id: CHEBI:28851
      label: phenanthrene
  - preferred_term: naphthalene
    term:
      id: CHEBI:16482
      label: naphthalene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In addition, planktonic cultures of A1, A3, consortium 1, consortium 2, consortium 3, and consortium 4 displayed
      degradation rates of 31.82, 28.40, 4.26, 21.25, 15.05, and 16.47%, respectively. Whereas in the biofilm mode, the biodegradation
      rates were 70.22, 63.29, 53.51, 48.66, 47.77, and 20.79%, respectively.
    explanation: Quantifies planktonic (31.82%) and biofilm (70.22%) phenanthrene biodegradation for isolate A1.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the result displayed that the biofilm cultures of isolates A1 and consortium 2 showed an increase in
      the naphthalene biodegradation rates from 41.01 to 87.72% and from 44.71 to 86.88%, respectively.
    explanation: Quantifies the >2-fold increase in naphthalene biodegradation from 41.01% (planktonic) to 87.72% (biofilm)
      in isolate A1.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The HPLC results exhibited that the biofilm of isolate A1 degraded 60.98% of phenanthrene, and the biofilm of
      the consortium 3 degraded 81.47% of naphthalene in soil samples, as shown in Fig.  11 .
    explanation: Quantifies 60.98% phenanthrene biodegradation by the preformed biofilm of isolate A1 in artificially contaminated
      soil.
