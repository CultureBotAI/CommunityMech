growth_media:
- name: Mineral salt medium and TSB biofilm PAH degradation assays
  composition: []
  ph: '7.0'
  temperature: '37'
  temperature_unit: °C
  shaking_speed: '150'
  shaking_speed_unit: rpm
  incubation_time: '7'
  incubation_time_unit: d
  vessel_type: glass tubes and 100 mL conical flasks
  preparation_notes: Planktonic assays used 7 mL MSM with 200 mg/L PAH at 37 °C and 150 rpm for 7 days; biofilm assays used
    48-h static TSB biofilms in glass tubes (overlaid with 7 mL MSM + 200 mg/L PAH) or 100 mL flasks (50 mL TSB, followed
    by 5 g soil with 200 mg/g phenanthrene) for 7 days at 37 °C.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The selected isolate-developed biofilm was developed in advance at 37 °C for 48 h under static conditions in
      100 mL conical flasks containing 50 mL of TSB medium.
    explanation: Specifies the 48-h static TSB flask biofilm setup prior to soil contamination testing.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A 5 g sample of the soil was artificially contaminated with 200 mg/g of phenanthrene or naphthalene. Then the
      flasks were tightly closed and incubated at 37 °C for 7 days.
    explanation: Specifies the 5 g soil microcosm protocol with 200 mg/g PAH incubated for 7 days at 37 °C.
