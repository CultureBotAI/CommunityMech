id: CommunityMech:000550
name: Bacillus paranthracis A1 PAH Biofilm Isolate Baseline
description: Single-strain PAH-degrading and biofilm-forming bacterial isolate baseline Bacillus paranthracis A1 (NCBITaxon:2026186)
  enriched from petroleum-contaminated subsurface soil from General Petroleum Company, Ras Gharib, Egypt and characterized
  in planktonic MSM, static glass-tube biofilm, and artificially contaminated soil microcosm assays alongside Bacillus paramycoides
  B8-1 (CommunityMech:000549), Bacillus licheniformis A3 (CommunityMech:000551), and Consortia 1-4 (CommunityMech:000502,
  CommunityMech:000503, CommunityMech:000358, CommunityMech:000504) by Ashraf et al. 2026 (PMID:42587276). In 7-day MSM assays
  at 200 mg/L PAH (37 °C, pH 7), isolate A1 degraded 31.82% of phenanthrene and 41.01% of naphthalene in planktonic culture,
  but its 48-h preformed glass-tube biofilm increased phenanthrene degradation to 70.22% (the highest biofilm phenanthrene
  degradation among all tested isolates and consortia) and more than doubled naphthalene degradation to 87.72%, and its preformed
  flask biofilm degraded 60.98% of phenanthrene in artificially contaminated soil (200 mg/g, 7 days at 37 °C).
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Characterize Bacillus paranthracis isolate A1 in planktonic, glass-tube biofilm, and artificially contaminated
    soil biofilm modes for phenanthrene and naphthalene biodegradation as a single-strain baseline for Consortia 1, 3, and
    4.
  assembly_strategy: Enrich petroleum-contaminated subsurface soil in MSM with 1000 mg/L phenanthrene or naphthalene over
    three 7-day passages, screen colonies by DCPIP reduction and HPLC at 200 mg/L PAH, and induce 48-h static TSB biofilms
    in glass tubes and 100 mL conical flasks.
  inoculation_strategy: Use 1 mL of washed OD600 = 1.0 cells in 50 mL MSM for screening, overnight culture in 7 mL MSM tubes
    for planktonic assays, OD550 = 0.2 in TSB for 48-h static glass-tube biofilm induction, and 50 mL TSB in 100 mL flasks
    for soil biofilm remediation assays.
  perturbation_design: Compare planktonic versus 48-h preformed glass-tube biofilm degradation of 200 mg/L phenanthrene and
    naphthalene over 7 days at 37 °C, and test preformed A1 flask biofilm on 5 g soil artificially contaminated with 200 mg/g
    phenanthrene.
  measurement_endpoints:
  - DCPIP redox indicator reduction at OD600
  - HPLC quantification of residual phenanthrene and naphthalene in liquid and soil extracts
  - biofilm formation by crystal violet OD595 assay
  - 16S rRNA phylogenetic identification
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolates A1 and A3 exhibited moderate degradation abilities, with phenanthrene degradation rates of 31.82% and
      28.40%, respectively, and naphthalene degradation rates of 41.01% and 38.92%, respectively (Fig.  2 ).
    explanation: Quantifies 7-day planktonic phenanthrene (31.82%) and naphthalene (41.01%) removal by isolate A1.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The HPLC results exhibited that the biofilm of isolate A1 degraded 60.98% of phenanthrene, and the biofilm of
      the consortium 3 degraded 81.47% of naphthalene in soil samples, as shown in Fig.  11 .
    explanation: Quantifies 60.98% phenanthrene removal in artificially contaminated soil by the preformed biofilm of isolate
      A1.
