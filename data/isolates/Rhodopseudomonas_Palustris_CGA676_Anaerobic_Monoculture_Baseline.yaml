ecological_interactions:
- name: High Siderophore Expression, Cheater Selection, and H2 Oxidation in Evolved R. palustris CGA676 Monoculture
  description: Across 803 generations of anaerobic phototrophic evolution in MDC medium supplemented with organic acids, ethanol,
    and 25 mM glucose (10 replicate lineages), Rhodopseudomonas palustris CGA676 monocultures accumulated 167 differentially
    enriched mutations across 19 commonly mutated genes and intergenic regions (Figure 2A, C). Because monocultures lacked
    the iron facilitation present in coculture, ancestral R. palustris CGA676 expressed the siderophore synthesis gene RPA2390
    at 5-fold higher levels in monoculture than in coculture (coculture RPA2390 transcript was 20% of monoculture, Figure
    5C) and purH at 2-fold higher levels (coculture purH transcript was 50% of monoculture, Figure 3D), driving enrichment
    of siderophore synthesis cluster RPA2382-90 cheater mutants in monoculture (Figure 5A). In parallel, seven replicate monocultures
    acquired a 5-bp deletion in the hoxJ sensor kinase gene (reconstructed as strain CGA4065), relieving HoxJ repression of
    HoxA and activating uptake hydrogenase so that no H2 accumulated in stationary phase (Figure 7A, C, D).
  scope: COMMUNITY_LEVEL
