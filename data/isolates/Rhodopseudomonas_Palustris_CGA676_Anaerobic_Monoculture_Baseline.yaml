discussions:
- discussion_id: cga676_monoculture_vs_coculture_hoxj_selection_asymmetry
  prompt: Why were 5-bp hoxJ deletions enabling H2 oxidation enriched in seven replicate R. palustris CGA676 monocultures
    but not in cocultures, even though reconstructed ΔhoxJ and hupV+ mutants actively oxidize H2 in both monoculture and coculture
    (Figure 7E)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#High Siderophore Expression, Cheater Selection, and H2 Oxidation in Evolved R. palustris CGA676
    Monoculture
  rationale: PMID:42117636 proposes that unexhausted organic acids at transfer time or competition with E. coli for trace
    nickel required for uptake hydrogenase activity may have prevented low-frequency hoxJ mutants from sweeping in coculture.
  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: First, consumable organic acids, which remained available at the time of transfer in cocultures, could have allowed
      the general R. palustris population to remain competitive against hoxJ mutants, preventing their enrichment. A second
      possibility is that E. coli outcompeted R. palustris for nickel, which is required for hydrogenase activity.
    explanation: Documents the two mechanistic hypotheses proposed by the authors for monoculture-specific hoxJ enrichment.
  posed_by: antigravity
  posed_date: '2026-11-09'
