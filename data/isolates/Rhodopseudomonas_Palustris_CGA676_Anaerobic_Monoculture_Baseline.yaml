  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These criteria resulted in a list of 167 mutations from R. palustris monocultures, 31 from E. coli monocultures,
      43 from R. palustris in cocultures, and 132 from E. coli in cocultures ( Fig. 2A ; Tables S1 through S5 ).
    explanation: Quantifies the 167 differentially enriched mutations in evolved R. palustris monocultures.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When considering commonly mutated genes and intergenic regions, 19 were mutated in monoculture vs. five in coculture
      for R. palustris ( Fig. 2C ), and six were mutated in monoculture vs. 19 in coculture for E. coli ( Fig. 2D ).
    explanation: Quantifies the 19 commonly mutated genes and intergenic regions in R. palustris monocultures vs 5 in cocultures.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A frequently mutated gene cluster in R. palustris monocultures was RPA2382-90 for siderophore synthesis ( Fig.
      2C, 5A and B ). We speculate that these mutations gave rise to a subpopulation of “cheaters” of varying frequencies
      ( Fig. 5A ) that scavenged siderophores from the siderophore-producing subpopulation.
    explanation: Documents the frequent mutation of siderophore synthesis cluster RPA2382-90 and emergence of siderophore
      cheater subpopulations in R. palustris monocultures.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We verified that this trend was also true for R. palustris in coculture with E. coli PFM2; RT-qPCR analysis showed
      that the RPA2390 transcript level in coculture was 20% of that in monoculture ( Fig. 5C ). Adding soluble iron to monocultures
      decreased RPA2390 expression to 3% of that observed without added iron, suggesting that the low expression in coculture
      was in response to higher iron availability ( Fig. 5C ).
    explanation: Demonstrates that RPA2390 transcript levels are 5-fold higher in monoculture than in coculture (20% of monoculture)
      and are repressed to 3% by soluble iron addition.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on the above, we hypothesized that our hoxJ mutants also permitted H2 oxidation. To test this hypothesis,
      we introduced a 5-bp hoxJ deletion, observed in seven replicate monocultures, into the NifA* ancestor. Indeed, the mutant
      did not accumulate H2 ( Fig. 7D ). Thus, we reason that hoxJ mutations that were enriched in monoculture allowed R.
      palustris to use H2 as an electron source.
    explanation: Proves that the 5-bp hoxJ deletion observed across seven replicate R. palustris monocultures enables H2 oxidation
      and prevents H2 accumulation.
