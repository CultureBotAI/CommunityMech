id: CommunityMech:000539
name: Rhodopseudomonas palustris CGA676 Anaerobic Monoculture Baseline
description: Long-term evolved anaerobic phototrophic bacterial monoculture baseline Rhodopseudomonas palustris NifA* strain
  CGA676 (NCBITaxon:1076; derived from CGA0092 and carrying a nifA* mutation that causes NH4+ excretion under N2-fixing conditions
  alongside wild-type adenine excretion) evolved across 10 replicate serial-transfer lineages for 803 generations in M9-derived
  coculture medium (MDC) supplemented with 25 mM glucose, cation solution, 8 mM disodium succinate, 7.3 mM sodium acetate,
  0.25 mM sodium formate, 1.4 mM sodium lactate, and 6.3 mM ethanol under N2 headspace and constant illumination at 30 degrees
  C by Chuang et al. 2026 (PMID:42117636; BioProject PRJNA1079325). Benchmarked alongside evolved Escherichia coli PFM2 monoculture
  (CommunityMech:000540), the obligate cross-feeding coculture (CommunityMech:000469), and the three-strain adenine mutual-invasion
  competition coculture (CommunityMech:000541), evolved R. palustris CGA676 monocultures accumulated 167 differentially enriched
  mutations across 19 commonly mutated genes and intergenic regions (Figure 2A, C), exhibited 5-fold higher siderophore synthase
  RPA2390 transcript levels (coculture levels were 20% of monoculture, Figure 5C) and 2-fold higher purH transcript levels
  (coculture levels were 50% of monoculture, Figure 3D), enriched siderophore synthesis cluster RPA2382-90 cheater mutants
  (Figure 5A), and evolved parallel 5-bp hoxJ deletions in seven replicate monocultures (reconstructed as strain CGA4065)
  that derepress HoxA to enable H2 oxidation (Figure 7A, C, D).
