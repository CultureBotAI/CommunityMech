ecological_interactions:
- name: High-Cadmium Induced Immobilization and Amide C=O Surface Binding by Enterobacter sp. SL12 Monoculture
  description: In 7-day liquid LB batch assays at 30 degrees C and 200 rpm, single-strain Enterobacter sp. SL12 (Cd(II) MIC
    = 400 mg/L, Table 2) achieved cadmium removal efficiencies (RE-Cd) of 63.4% at 50 mg/L Cd2+ and 70.8% at 100 mg/L Cd2+,
    exhibiting an 11.6% increase in removal efficiency as initial Cd2+ doubled from 50 to 100 mg/L. Under 100 mg/L Cd2+, SL12
    cells preserved an intact cell wall morphology without membrane rupture (TEM, Fig. 4D) and immobilized Cd2+ via amide
    C=O functional groups (FTIR, Fig. 5), broth alkalinization from pH 6.5 to 8.0-8.5, and CdS bioprecipitation.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Enterobacter sp. SL12
    term:
      id: NCBITaxon:547
      label: Enterobacter
  metabolites:
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After a 7-day incubation period, RE-Cd values reached 82.6% and 69.55% for SL8, 63.4% and 70.8% for SL12, and
      82.6% and 80.9% for the co-cultured strains at initial Cd concentrations of 50 mg/L and 100 mg/L, respectively.
    explanation: Quantifies the 7-day Cd2+ removal efficiencies of Enterobacter sp. SL12 monoculture at 50 mg/L (63.4%) and
      100 mg/L (70.8%).
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Conversely, SL12 demonstrated an 11.6% improvement in RE-Cd with increasing Cd concentration, suggesting an adaptive
      energy conservation strategy that enhances activity against metal toxicity.
    explanation: Documents the 11.6% increase in SL12 monoculture Cd removal efficiency from 50 to 100 mg/L Cd2+.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SEM ( Fig. 3A, C, and E ) and TEM analyses ( Fig. 4 ) showed no significant differences in cell size, cell wall
      thickness, or cellular outlines between control and Cd-exposed systems for strain SL12.
    explanation: Confirms by SEM/TEM (Fig. 3, Fig. 4) that SL12 monoculture preserves intact cell wall thickness and cellular
      outlines under 100 mg/L Cd2+.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, the involvement of N-H bonds in SL8 and amide C=O bonds in SL12 in Cd adsorption highlighted strain-specific
      responses, while the combined “SL8 + SL12” system exhibited a broadened response spectrum, indicating synergistic effects
      ( Fig. 5 ).
    explanation: Identifies amide C=O functional groups as the primary FTIR-detected surface binding moiety in Enterobacter
      sp. SL12.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The pH increased sharply from approximately 6.5 to 8.0–8.5 within the first 2 days of incubation and then stabilized
      ( Fig. 2G through I ). This pH elevation is instrumental in enhancing the competitiveness of metal ions for bacterial
      binding sites and promoting hydroxide precipitation, thereby facilitating Cd 2+ removal ( 20 ).
    explanation: Documents the sharp medium alkalinization from pH ~6.5 to 8.0-8.5 within 2 days that promotes Cd2+ binding
      and hydroxide precipitation in SL12 cultures.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of Cd removal mechanisms revealed a predominance of bioprecipitation in Cd detoxification, consistent
      under both individual and co-cultured conditions ( Fig. 2C ).
    explanation: Demonstrates that bioprecipitation is the predominant Cd2+ immobilization mechanism in Enterobacter sp. SL12
      monoculture as well as in co-culture (Figure 2C).
