id: CommunityMech:000534
name: Enterobacter sp. SL12 Cadmium Immobilization Isolate Baseline
description: Single-strain bacterial isolate baseline Enterobacter sp. SL12 (submitted to GenBank as Enterobacter cancerogenus
  SL12 under 16S rRNA accession PZ429301 with 99.31% sequence homology; NCBITaxon:547; GTDB:g__Enterobacter) isolated from
  Cd-contaminated mine-area soil in Liuyang, Hunan Province, China, and evaluated in Cd2+-supplemented liquid LB medium alongside
  Achromobacter sp. SL8 monoculture (CommunityMech:000533) and the SL8-SL12 coculture (CommunityMech:000374) by Tao et al.
  2026 (PMID:42307251). Strain SL12 exhibited a minimum inhibitory concentration (MIC) of 400 mg/L Cd(II) in LB medium (Table
  2) and achieved 7-day Cd2+ removal efficiencies (RE-Cd) of 63.4% at 50 mg/L Cd2+ and 70.8% at 100 mg/L Cd2+ (an 11.6% improvement
  with increasing Cd concentration), preserving intact cell wall morphology under 100 mg/L Cd2+ (TEM, Fig. 4D) and immobilizing
  Cd via amide C=O functional groups (FTIR, Fig. 5), broth alkalinization to pH 8.0-8.5, and CdS bioprecipitation, with dedicated
  Group B proteomic (iProX IPX0017179000) and metabolomic (MetaboLights MTBLS14477) profiles.
