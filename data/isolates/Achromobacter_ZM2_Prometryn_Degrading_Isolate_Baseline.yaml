ecological_interactions:
- name: Axenic Liquid and Soil Microcosm Prometryn Catabolism by Achromobacter sp. ZM-2
  description: In axenic basal salt medium (BSM) containing 100 mg/L prometryn as the sole carbon source, Achromobacter sp.
    ZM-2 exhibits the fastest biomass growth among the three cornfield soil isolates, reaching stationary phase at 28 h with
    a maximum OD600 of 0.91, and achieves 85.1 ± 1.5% 48-h prometryn degradation efficiency (first-order rate constant k =
    0.040 h^-1, half-life t1/2 = 17.3 h, R^2 = 0.956, Table 2). Optimal degradation occurs at 30 degrees C, pH 7, and 5% inoculum
    (Table 2 and Figure 3), with only 24% of maximum degradation efficiency retained at 40 degrees C. In soil microcosms spiked
    with 20 mg/kg prometryn, single-strain ZM-2 bioaugmentation reduces the herbicide half-life from 58.2 days to 14.1 days
    (k = 0.0492 d^-1, R^2 = 0.95, 17.6 ± 2.3% residual at 30 days, Table 6).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Achromobacter sp. ZM-2
    term:
      id: NCBITaxon:222
      label: Achromobacter
  biological_processes:
  - preferred_term: xenobiotic catabolic process
    term:
      id: GO:0042178
      label: xenobiotic catabolic process
