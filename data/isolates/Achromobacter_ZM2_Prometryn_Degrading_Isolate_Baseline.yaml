id: CommunityMech:000537
name: Achromobacter sp. ZM-2 Prometryn-Degrading Isolate Baseline
description: Single-strain axenic bacterial isolate baseline Achromobacter sp. strain ZM-2 (NCBITaxon:222; GTDB:g__Achromobacter;
  16S rRNA GenBank accession PV643982, 99.8% sequence similarity to Achromobacter xylosoxidans) isolated from long-term prometryn-contaminated
  cornfield soil in Harbin, China and evaluated alongside axenic Pseudomonas sp. ZM-1 (CommunityMech:000536), axenic Stenotrophomonas
  sp. ZM-3 (CommunityMech:000538), and the 1:1:1 ZM-1/ZM-2/ZM-3 synthetic consortium (CommunityMech:000470) by Liang et al.
  2026 (PMID:42795638). In liquid basal salt medium (BSM) with 100 mg/L prometryn as the sole carbon source (30 degrees C,
  pH 7, 5% optimal inoculum), monoculture ZM-2 exhibits the fastest biomass accumulation among the three isolates (reaching
  stationary phase at 28 h with maximum OD600 = 0.91) and degrades 85.1 ± 1.5% of 100 mg/L prometryn within 48 h (first-order
  rate constant k = 0.040 h^-1, half-life t1/2 = 17.3 h, R^2 = 0.956, Table 2), while retaining only 24% of maximum degradation
  efficiency at 40 degrees C (Figure 3A). In prometryn-spiked agricultural soil microcosms (20 mg/kg), single-strain ZM-2
  bioaugmentation reduces the herbicide half-life from 58.2 days to 14.1 days (k = 0.0492 d^-1, R^2 = 0.95) with 17.6 ± 2.3%
  residual prometryn after 30 days (Table 6 and Figure 5A).
