  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We added 10 g of contaminated soil to 100 mL of basal salt medium (BSM) with 100 mg·L −1 prometryn as the only
      carbon source. The BSM contained (per liter) NH 4 NO 3 1.0 g, MgSO 4 ·7H 2 O 0.2 g, K 2 HPO 4 1.0 g, KH 2 PO 4 1.0 g,
      NaCl 0.2 g, and 1 mL of trace element solution, pH 7.0. The culture was shaken at 30 °C and 160 rpm for 7 days.
    explanation: Specifies the BSM composition and prometryn supplementation.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biomass of all strains rose with increasing inoculum size and then plateaued, with optimal inoculum levels of
      7% for ZM-1, and 5% for both ZM-2 and ZM-3.
    explanation: Specifies the optimal 5% inoculum level for ZM-2.
