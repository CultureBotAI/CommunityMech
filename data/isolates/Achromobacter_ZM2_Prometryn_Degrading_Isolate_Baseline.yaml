    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Growth curves ( Figure 2 A) showed that ZM-2 grew the fastest, reaching stationary phase at 28 h with an OD 600
      of 0.91. ZM-1 peaked at 36 h with an OD 600 of 0.86. ZM-3 grew more slowly but kept going longer, reaching its highest
      OD 600 of 0.79 at 44 h.
    explanation: Quantifies the rapid biomass growth (stationary phase at 28 h with OD600 = 0.91) of axenic Achromobacter
      sp. ZM-2.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Looking at the degradation curves ( Figure 2 B), ZM-1 broke down 97.3% of prometryn in 48 h (k = 0.075 h −1 ,
      half-life = 9.2 h). ZM-2 degraded 85.1% in 48 h (k = 0.040 h −1 , half-life = 17.3 h). ZM-3 degraded 92.8% in 48 h (k
      = 0.055 h −1 , half-life = 12.6 h).
    explanation: Quantifies the 48-h liquid prometryn degradation kinetics (85.1%, k = 0.040 h^-1, t1/2 = 17.3 h) of axenic
      ZM-2.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, strain ZM-1 retained only 21% of its maximum degradation efficiency at 40 °C, compared with 24%
      for ZM-2.
    explanation: Documents the thermal sensitivity (24% retention at 40 °C) of axenic ZM-2.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Treatment k (d − 1) Half-Life (d) R 2 Residual at 30 d (%) Natural control 0.0119 58.2 0.96 67.6 ± 2.1 ZM-1 0.0564
      12.3 0.94 11.4 ± 1.8 ZM-2 0.0492 14.1 0.95 17.6 ± 2.3 ZM-3 0.073 9.5 0.97 7.9 ± 1.5 Synthetic consortium 0.0889 7.8
      0.98 3.7 ± 1.2
    explanation: Quantifies the soil microcosm prometryn half-life reduction to 14.1 days (k = 0.0492 d^-1, R^2 = 0.95, 17.6
      ± 2.3% residual at 30 d) by single-strain ZM-2 bioaugmentation.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ZM-2 30 7 5 0.91 (28 h) 85.1 ± 1.5 (48 h) 0.040 17.3 0.956
    explanation: Documents the single-factor optimized culture parameters (30 °C, pH 7, 5% inoculum) and first-order kinetic
      fit (R2 = 0.956) for Achromobacter sp. ZM-2 monoculture prometryn degradation.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: pure-culture growth curves showed that strain ZM-2 enters the logarithmic phase earliest and reaches stationary
      phase at 28 h, allowing it to rapidly initiate prometryn transformation in the early stage
    explanation: Directly links ZM-2 early logarithmic growth entry and 28 h stationary phase peak to its early-stage prometryn
      transformation role.
