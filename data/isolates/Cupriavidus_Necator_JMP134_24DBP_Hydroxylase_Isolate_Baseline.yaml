id: CommunityMech:000555
name: Cupriavidus necator JMP134 2,4-Dibromophenol Hydroxylase Isolate Baseline
description: Single-strain chloro-/bromoaromatic-mineralizing bacterial isolate baseline Cupriavidus necator JMP134 (canonical
  NCBI strain taxon Cupriavidus pinatubonensis JMP134, NCBITaxon:264198) harboring plasmid pJP4 (tfdA, tfdBI, tfdCIDIEIFI,
  tfdBII, tfdDIICIIEIIFII) and characterized in pure culture and purified-enzyme assays alongside Rhizorhabdus wittichii YL-JM2C
  (CommunityMech:000554) and the YL-JM2C/JMP134 synthetic consortium (CommunityMech:000388) by Pan and Zhou 2026 (PMID:42364169).
  Purified FAD/NADPH-dependent hydroxylases TfdBI and TfdBII (15 ug protein, 200 uM NADPH, 10 uM FAD, 200 uM substrate in
  pH 7.4 Tris-HCl) and recombinant cells (BL21-TfdBI, BL21-TfdBII) hydroxylated 2,4-dibromophenol (2,4-DBP) to 3,5-dibromocatechol
  (3,5-DBC) and were active across all tested halophenol substrates except 2-hydroxybiphenyl (Fig. 2, Fig. S8-S9), and axenic
  strain JMP134 utilized 2,4-DBP as a sole carbon and energy source for growth via TfdBI/TfdBII and the downstream pJP4-encoded
  tfdCDEF ortho-cleavage pathway (Fig. 3a, Fig. S10).
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Validate the 2,4-dibromophenol hydroxylase activities of plasmid pJP4-encoded TfdBI and TfdBII and the axenic
    2,4-DBP growth capability of Cupriavidus necator JMP134 as the downstream metabolic-relay partner for Rhizorhabdus wittichii
    YL-JM2C.
  assembly_strategy: Clone and purify His-tagged TfdBI and TfdBII from C. necator JMP134 in E. coli BL21(DE3) for in vitro
    NADPH-oxidation and whole-cell biotransformation assays, and cultivate axenic strain JMP134 in R2A and in minimal salts
    medium (MSM, pH 7.0) with 2,4-DBP as sole carbon source.
  inoculation_strategy: Pre-grow C. necator JMP134 in R2A at 30 °C to exponential phase, harvest and wash cells into pH 7.0
    MSM (OD600 = 4.0 for resting-cell assays or OD600 = 1.0 at 5% v/v for wastewater microcosms) or inoculate into MSM containing
    2,4-DBP as sole carbon source.
  perturbation_design: Compare substrate specificity of purified TfdBI and TfdBII against YL-JM2C RwTfdB across 2,4-DBP, 2BP,
    2HBP, and chlorinated/brominated phenols at 340 nm, verify 3,5-DBC product formation by HPLC, and test axenic growth of
    JMP134 on 2,4-DBP as sole carbon source.
  measurement_endpoints:
  - spectrophotometric NADPH oxidation assay at 340 nm (epsilon = 6220 M-1 cm-1) for purified TfdBI and TfdBII
  - HPLC detection of 2,4-DBP conversion to 3,5-DBC at 280 nm
  - axenic growth of strain JMP134 on 2,4-DBP as sole carbon source (Fig. S10)
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, TfdBI and TfdBII from strain JMP134 were active against all tested substrates except 2HBP. Furthermore,
      strain JMP134 was able to utilize 2,4-DBP as the sole carbon source for growth ( Fig. S10 ), indicating that TfdB is
      active in vivo and that the downstream catabolic pathway is functional.
    explanation: Establishes purified TfdBI/TfdBII activity on 2,4-DBP and axenic growth of strain JMP134 on 2,4-DBP as sole
      carbon source.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The HPLC chromatogram revealed the appearance of a new peak in the reaction mixtures of BL21-TfdBI and BL21-TfdBII,
      corresponding to the retention time of authentic 3,5-DBC ( Fig. S8 ).
    explanation: Confirms conversion of 2,4-DBP into 3,5-dibromocatechol (3,5-DBC) by JMP134 TfdBI and TfdBII.
