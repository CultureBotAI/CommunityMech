ecological_interactions:
- name: Plasmid pJP4-Encoded TfdBI/TfdBII Hydroxylation of 2,4-Dibromophenol and Sole-Carbon-Source Growth by Strain JMP134
  description: Cupriavidus necator JMP134 harbors plasmid pJP4 encoding two FAD/NADPH-dependent halophenol hydroxylases (TfdBI
    and TfdBII) and two downstream ortho-cleavage modules (tfdCIDIEIFI and tfdDIICIIEIIFII). In purified enzyme assays (15
    ug TfdBI or TfdBII, 200 uM NADPH, 10 uM FAD, 200 uM substrate in pH 7.4 Tris-HCl) and whole-cell biotransformations, both
    TfdBI and TfdBII hydroxylated 2,4-dibromophenol (2,4-DBP) into 3,5-dibromocatechol (3,5-DBC) and showed broad activity
    across halophenols (excluding 2-hydroxybiphenyl), enabling axenic strain JMP134 to grow on 2,4-DBP as a sole carbon and
    energy source.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Cupriavidus necator JMP134
    term:
      id: NCBITaxon:264198
      label: Cupriavidus pinatubonensis JMP134
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Enzyme assays of TfdB homologs were conducted in Tris–HCl buffer (pH 7.4) containing 15 μg purified TfdB, 200
      μM NADPH, and 10 μM flavin adenine dinucleotide (FAD), and the reaction was initiated by adding 200 μM substrate.
    explanation: Specifies the in vitro enzyme assay conditions for purified TfdBI and TfdBII.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, TfdBI and TfdBII from strain JMP134 were active against all tested substrates except 2HBP. Furthermore,
      strain JMP134 was able to utilize 2,4-DBP as the sole carbon source for growth ( Fig. S10 ), indicating that TfdB is
      active in vivo and that the downstream catabolic pathway is functional.
    explanation: Demonstrates TfdBI/TfdBII catalytic activity and axenic growth of strain JMP134 on 2,4-DBP.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To evaluate their possible catalytic capabilities toward 2,4-DBP, whole-cell biotransformation assays were performed
      using E. coli cells expressing TfdBI (BL21-TfdBI), TfdBII (BL21-TfdBII), or RwTfdB (BL21-RwTfdB). The HPLC chromatogram
      revealed the appearance of a new peak in the reaction mixtures of BL21-TfdBI and BL21-TfdBII, corresponding to the retention
      time of authentic 3,5-DBC ( Fig. S8 ).
    explanation: Demonstrates by whole-cell biotransformation and HPLC that both TfdBI and TfdBII from C. necator JMP134 convert
      2,4-DBP into authentic 3,5-dibromocatechol (3,5-DBC).
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Because both strains possess downstream gene clusters responsible for 3,5-DBC degradation (tcsCDEF in strain
      YL-JM2C and tfdCDEF in strain JMP134), their combined catabolic capacities enabled the complete mineralization of BDE-47.
    explanation: Identifies the plasmid pJP4-encoded tfdCDEF downstream ortho-cleavage gene cluster responsible for 3,5-DBC
      catabolism in C. necator JMP134.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The cooperative action of TfdB in JMP134 efficiently funneled this toxic intermediate 2,4-DBP into the 3,5-DBC
      catabolic pathway, thereby preventing its accumulation and ensuring complete degradation.
    explanation: Confirms that JMP134 TfdB funnels 2,4-DBP into the 3,5-DBC ortho-cleavage pathway.
