id: CommunityMech:000551
name: Bacillus licheniformis A3 PAH Biofilm Isolate Baseline
description: Single-strain PAH-degrading and biofilm-forming bacterial isolate baseline Bacillus licheniformis A3 (NCBITaxon:1402;
  GTDB:s__Bacillus_licheniformis) enriched from petroleum-contaminated subsurface soil from General Petroleum Company, Ras
  Gharib, Egypt and characterized in planktonic MSM and static glass-tube biofilm assays alongside Bacillus paramycoides B8-1
  (CommunityMech:000549), Bacillus paranthracis A1 (CommunityMech:000550), and Consortia 1-4 (CommunityMech:000502, CommunityMech:000503,
  CommunityMech:000358, CommunityMech:000504) by Ashraf et al. 2026 (PMID:42587276). In 7-day MSM assays at 200 mg/L PAH (37
  °C, pH 7), isolate A3 degraded 28.40% of phenanthrene and 38.92% of naphthalene in planktonic culture, while its 48-h preformed
  glass-tube biofilm increased phenanthrene degradation more than 2-fold to 63.29% (outperforming all four multi-strain consortia
  on phenanthrene) and increased naphthalene degradation to 64.57%.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Characterize Bacillus licheniformis isolate A3 in planktonic and glass-attached biofilm modes for 7-day biodegradation
    of 200 mg/L phenanthrene and naphthalene as a single-strain baseline for Consortia 2, 3, and 4.
  assembly_strategy: Enrich petroleum-contaminated subsurface soil in MSM with 1000 mg/L phenanthrene or naphthalene over
    three 7-day passages, screen colonies by DCPIP reduction and HPLC at 200 mg/L PAH, and induce 48-h static TSB biofilms
    in glass tubes.
  inoculation_strategy: Inoculate 1 mL washed OD600 = 1.0 cells into 50 mL MSM for quantitative screening, overnight culture
    into 7 mL MSM tubes for planktonic assays, or OD550 = 0.2 in TSB for 48-h static glass-tube biofilm formation.
  perturbation_design: Evaluate growth across pH 5-9 and temperature 25-50 °C, and compare 7-day planktonic versus 48-h preformed
    glass-tube biofilm degradation of 200 mg/L phenanthrene and naphthalene at 37 °C and pH 7.
  measurement_endpoints:
  - DCPIP redox indicator reduction at OD600
  - HPLC quantification of residual phenanthrene and naphthalene at 254 nm
  - biofilm formation by crystal violet OD595 assay
  - 16S rRNA phylogenetic identification
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolates A1 and A3 exhibited moderate degradation abilities, with phenanthrene degradation rates of 31.82% and
      28.40%, respectively, and naphthalene degradation rates of 41.01% and 38.92%, respectively (Fig.  2 ).
    explanation: Quantifies 7-day planktonic phenanthrene (28.40%) and naphthalene (38.92%) removal by isolate A3.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The result demonstrated that the naphthalene biodegradation rates of 41.01, 38.92, 75.54, 44.71, 92.43, and 64.47%
      for the planktonic cultures, whereas were 87.72, 64.57, 77.45, 86.88, 94.69, and 79.74% for the biofilm cultures of
      isolates A1, A3, consortium 1, consortium 2, consortium 3, and consortium 4, respectively.
    explanation: Quantifies planktonic (38.92%) and biofilm (64.57%) naphthalene biodegradation for isolate A3.
