growth_media:
- name: Mineral salt medium and TSB biofilm PAH degradation assays
  composition: []
  ph: '7.0'
  temperature: '37'
  temperature_unit: °C
  shaking_speed: '150'
  shaking_speed_unit: rpm
  incubation_time: '7'
  incubation_time_unit: d
  vessel_type: glass tubes
  preparation_notes: Planktonic assays used 7 mL MSM with 200 mg/L phenanthrene or naphthalene at 37 °C and 150 rpm for 7
    days; biofilm assays used 48-h static TSB biofilms in glass tubes overlaid with 7 mL MSM + 200 mg/L PAH for 7 days at
    37 °C.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For quantifying biofilm-mediated degradation of phenanthrene, both individual isolates and consortiums were grown
      as a biofilm on glass tubes containing 3 mL TSB medium at 37 °C at a static condition.
    explanation: Specifies the 48-h static TSB glass-tube biofilm protocol prior to 7 mL MSM PAH challenge.
