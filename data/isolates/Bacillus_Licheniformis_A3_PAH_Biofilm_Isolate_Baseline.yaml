ecological_interactions:
- name: Biofilm-Enhanced Phenanthrene and Naphthalene Biodegradation by Isolate A3
  description: In 7-day MSM assays at 200 mg/L PAH (37 °C, pH 7), Bacillus licheniformis A3 degraded 28.40% of phenanthrene
    and 38.92% of naphthalene in planktonic culture, whereas its 48-h preformed glass-tube biofilm increased phenanthrene
    biodegradation to 63.29% (exceeding all four multi-strain consortia at 20.79-53.51%) and increased naphthalene biodegradation
    to 64.57%.
  scope: COMMUNITY_LEVEL
  participating_taxa:
