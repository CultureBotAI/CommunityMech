ecological_interactions:
- name: Rothia KRP GAM Agar Isolation
  description: >-
    Rothia kefirresidentii KRP was recovered from ground kefir grains after serial
    dilution and two days of growth on GAM agar at 30 degrees C. That isolate is
    the biological input for the genome sequencing and model-building steps
    represented downstream.
  scope: COMMUNITY_LEVEL
  participating_taxa:
