      id: GO:0040007
      label: growth
  downstream:
  - target: Rothia KRP Whole-Genome Assembly
    description: The cultured KRP isolate supplied genomic DNA for draft genome sequencing.
  evidence:
  - reference: PMID:28963201
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: R. kefirresidentii KRP (ISC 156) was isolated from ground kefir grains, plated
      in serial dilutions on GAM agar and grown for 2 days at 30°C
    explanation: Establishes the strain code and the GAM agar isolation condition for KRP.
- name: Rothia KRP Whole-Genome Assembly
  description: >-
    Genome sequencing and assembly of the Rothia KRP isolate produced an 81-contig
    draft genome of 2,522,693 bp with 58.47% GC, then deposited the assembly at
    DDBJ/ENA/GenBank under accession NDFM00000000. The accession ties the recovered
    isolate to the genome-scale reconstruction archived in BioModels.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Rothia kefirresidentii KRP
    term:
      id: NCBITaxon:32207
      label: Rothia <high G+C Gram-positive bacteria>
  metabolites:
  - preferred_term: deoxyribonucleic acid
    term:
      id: CHEBI:16991
      label: deoxyribonucleic acid
  downstream:
  - target: Rothia KRP Genome-Scale Amino-Acid Flux Model
    description: The deposited KRP genome supported strain-specific metabolic reconstruction.
  evidence:
  - reference: PMID:28963201
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The draft genome sizes are 5,057,314 bp (GC content, 45.62%) for
      B. kefirresidentii Opo, 2,522,693 bp (GC content, 58.47%) for
      R. kefirresidentii KRP
    explanation: Reports the Rothia KRP draft genome size and GC content.
  - reference: PMID:28963201
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: NDFM00000000 for R. kefirresidentii KRP
    explanation: Reports the DDBJ/ENA/GenBank accession for the KRP WGS assembly.
- name: Rothia KRP Genome-Scale Amino-Acid Flux Model
  description: >-
    The Blasche kefir workflow reconstructed bacterial genome-scale metabolic
    models with CarveMe and used flux balance analysis to simulate expected
    amino-acid uptake and secretion rates through fermentation time. BioModels
    MODEL2204300002 archives the Rothia kefirresidentii KRP SBML model from that
    workflow.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Rothia kefirresidentii KRP
    term:
      id: NCBITaxon:32207
      label: Rothia <high G+C Gram-positive bacteria>
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  biological_processes:
