engineering_design:
  objective: BioModels record MODEL2204300002 contains a genome-scale metabolic model for Rothia kefirresidentii KRP, a kefir-grain isolate used in kefir community amino-acid flux modeling.
  assembly_strategy: Engineered single-member platform represented in community schema for interoperability with multi-member systems.
  measurement_endpoints:
  - Genome-scale metabolic model reconstruction
  - Flux balance analysis of amino-acid uptake and secretion
  notes: >-
    BioModels single-member genome-scale metabolic model represented in the community
    schema for interoperability with multi-member systems.
  evidence:
