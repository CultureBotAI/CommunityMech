    term:
      id: GO:0006520
      label: amino acid metabolic process
  - preferred_term: amino acid transport
    term:
      id: GO:0006865
      label: amino acid transport
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Genome-scale metabolic models were reconstructed for all bacterial species
    explanation: Supports reconstruction of bacterial kefir genome-scale metabolic models.
    computational_provenance:
      prediction_type: GENOME_SCALE_METABOLIC_MODEL
      tools:
      - tool_name: CarveMe
        role: draft genome-scale metabolic model reconstruction
      model_name: MODEL2204300002
      model_source: Rothia kefirresidentii KRP genome-scale metabolic model
      input_accession: NDFM00000000
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The models were used to simulate the expected uptake/secretion rates of amino
      acids using flux balance analysis
    explanation: Supports the FBA step that predicted amino-acid exchange potential.
    computational_provenance:
      prediction_type: FLUX_BALANCE_ANALYSIS
