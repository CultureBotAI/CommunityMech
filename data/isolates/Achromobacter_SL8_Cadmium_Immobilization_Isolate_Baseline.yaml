ecological_interactions:
- name: Cadmium Immobilization, Alkalinization, and N-H Surface Coordination by Achromobacter sp. SL8 Monoculture
  description: In 7-day liquid LB batch assays at 30 degrees C and 200 rpm, single-strain Achromobacter sp. SL8 (Cd(II) MIC
    = 600 mg/L, Table 2) achieved cadmium removal efficiencies (RE-Cd) of 82.6% at 50 mg/L Cd2+ and 69.55% (69.5%) at 100
    mg/L Cd2+ (representing a 15.8% reduction in removal efficiency at the higher Cd concentration). Monoculture Cd immobilization
    was driven by rapid broth alkalinization from pH 6.5 to 8.0-8.5 within the first 2 days, bioprecipitation of CdS, N-H
    functional group surface coordination (FTIR, Fig. 5), and adaptive cell-membrane thinning and blurring under 100 mg/L
    Cd2+ (TEM, Fig. 4B).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Achromobacter sp. SL8
    term:
      id: NCBITaxon:222
      label: Achromobacter
  metabolites:
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After a 7-day incubation period, RE-Cd values reached 82.6% and 69.55% for SL8, 63.4% and 70.8% for SL12, and
      82.6% and 80.9% for the co-cultured strains at initial Cd concentrations of 50 mg/L and 100 mg/L, respectively.
    explanation: Quantifies the 7-day Cd2+ removal efficiencies of Achromobacter sp. SL8 monoculture at 50 mg/L (82.6%) and
      100 mg/L (69.55%).
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, SL8 exhibited a decrease in RE-Cd under higher Cd stress, consistent with previous reports that
      elevated Cd levels enhance cellular toxicity and reduce biosorption capacity
    explanation: Documents the decrease in SL8 monoculture Cd removal efficiency when Cd2+ increased from 50 to 100 mg/L.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, SL8 exhibited notable morphological changes. In particular, the thinning and blurring of the cell membrane
      under Cd stress suggest a stress response that could be pivotal for microorganisms to adapt to toxic environments.
    explanation: Describes the TEM morphological response of SL8 monoculture to 100 mg/L Cd2+ stress.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, the involvement of N-H bonds in SL8 and amide C=O bonds in SL12 in Cd adsorption highlighted strain-specific
      responses, while the combined “SL8 + SL12” system exhibited a broadened response spectrum, indicating synergistic effects
      ( Fig. 5 ).
    explanation: Identifies N-H functional groups as the primary FTIR-detected surface binding moiety in Achromobacter sp.
      SL8.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The pH increased sharply from approximately 6.5 to 8.0–8.5 within the first 2 days of incubation and then stabilized
      ( Fig. 2G through I ). This pH elevation is instrumental in enhancing the competitiveness of metal ions for bacterial
      binding sites and promoting hydroxide precipitation, thereby facilitating Cd 2+ removal ( 20 ).
    explanation: Documents the sharp medium alkalinization from pH ~6.5 to 8.0-8.5 within 2 days that promotes Cd2+ binding
      and hydroxide precipitation in SL8 cultures.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of Cd removal mechanisms revealed a predominance of bioprecipitation in Cd detoxification, consistent
      under both individual and co-cultured conditions ( Fig. 2C ).
    explanation: Demonstrates that bioprecipitation is the predominant Cd2+ immobilization mechanism in Achromobacter sp.
      SL8 monoculture as well as in co-culture (Figure 2C).
