id: CommunityMech:000533
name: Achromobacter sp. SL8 Cadmium Immobilization Isolate Baseline
description: Single-strain bacterial isolate baseline Achromobacter sp. SL8 (submitted to GenBank as Achromobacter insuavis
  SL8 under 16S rRNA accession PZ429300 with 99.79% sequence homology; NCBITaxon:222; GTDB:g__Achromobacter) isolated from
  Cd-contaminated mine-area soil in Liuyang, Hunan Province, China, and evaluated in Cd2+-supplemented liquid LB medium alongside
  Enterobacter sp. SL12 monoculture (CommunityMech:000534) and the SL8-SL12 coculture (CommunityMech:000374) by Tao et al.
  2026 (PMID:42307251). Strain SL8 exhibited a minimum inhibitory concentration (MIC) of 600 mg/L Cd(II) in LB medium (Table
  2) and achieved 7-day Cd2+ removal efficiencies (RE-Cd) of 82.6% at 50 mg/L Cd2+ and 69.55% (69.5%) at 100 mg/L Cd2+ (30
  degrees C, 200 rpm), mediated by rapid broth alkalinization from pH 6.5 to 8.0-8.5 within 2 days, CdS bioprecipitation,
  N-H functional group surface binding (FTIR, Fig. 5), and adaptive cell-membrane thinning under 100 mg/L Cd2+ (TEM, Fig.
  4B), with dedicated Group A proteomic (iProX IPX0017179000) and metabolomic (MetaboLights MTBLS14477) profiles.
