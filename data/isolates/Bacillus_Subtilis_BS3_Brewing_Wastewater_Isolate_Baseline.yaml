ecological_interactions:
- name: IrrE-Mediated DNA Repair, ROS Scavenging, and Growth Recovery under Ni2+ and Co2+ Stress in BS3
  description: Overexpressing the global transcriptional regulator IrrE from Deinococcus radiodurans R1 (P43::irrE on pCE2)
    in B. subtilis 168 BS3 protected cells against 6 mg L^-1 Ni2+ and 3 mg L^-1 Co2+ toxicity by activating SOS DNA repair
    and scavenging intracellular ROS, reducing comet-assay DNA tail length by 54.2% (from 31.0 to 14.2 um, Figure 4c), decreasing
    CM-H2DCFDA ROS fluorescence intensity by 67.4% (Figure 4d), reducing dead-cell red fluorescence in live-dead staining
    (Figure 4g), and increasing maximum cell density (OD600,max) from 0.830 (in parental strain BS2) to 1.175 (Figure 4f).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus subtilis 168 BS3
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  metabolites:
  - preferred_term: nickel(2+)
    term:
      id: CHEBI:49786
      label: nickel(2+)
  - preferred_term: cobalt(2+)
    term:
      id: CHEBI:48828
      label: cobalt(2+)
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results revealed that irrE overexpression significantly relieved DNA damage, reducing DNA tail lengths by
      63.9% (from 13.3 to 4.8 µm) in S. oneidensis and 54.2% (from 31.0 to 14.2 µm) in B. subtilis (Figure 4c and Figure S3
      ).
    explanation: Quantifies the 54.2% reduction in DNA tail length (31.0 to 14.2 um) in IrrE-expressing B. subtilis BS3 under
      Ni2+/Co2+ stress.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: demonstrated that irrE overexpression effectively scavenged intracellular ROS, decreasing fluorescence intensity
      by 67.8% and 67.4% in S. oneidensis and B. subtilis, respectively (Figure 4d ).
    explanation: Quantifies the 67.4% reduction in intracellular ROS fluorescence in B. subtilis BS3 under Ni2+/Co2+ exposure.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Likewise, strain BS2 experienced growth inhibition under 6 mg L−1 Ni2+ and 3 mg L−1 Co2+ stress, whereas the
      introduction of IrrE into strain BS3 relieved the cytotoxicity of Ni2+ and Co2+, increasing the maximum cell density
      of strain BS3 to 1.175 from 0.830 (strain BS2 exposed to Ni2+(6 mg L−1) and Co2+(3 mg L−1); Figure 4f ).
    explanation: Demonstrates that IrrE expression increases B. subtilis BS3 maximum OD600 from 0.830 (BS2) to 1.175 under
      6 mg L^-1 Ni2+ and 3 mg L^-1 Co2+.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consequently, the presence of IrrE significantly enhanced the resistance of strains SO3 and BS3 to Ni2+‐ and
      Co2+‐induced cytotoxicity (Figure 4b,c ).
    explanation: Confirms that IrrE overexpression confers Ni2+ and Co2+ cytotoxicity resistance in Bacillus subtilis BS3.
- name: Sole-Strain BS3 Monoculture NCM Metal Oxide Leaching Baseline
  description: When incubated as a sole-strain monoculture in Moutai brewing wastewater with 0.2 g L^-1 spent NCM cathode
    black mass for 14 days, Bacillus subtilis 168 BS3 catalyzed 13.4 mg L^-1 total dissolved Li, Ni, Co, and Mn leaching (Figure
    5d). This standalone yield exceeded first-generation B. subtilis BS1 monoculture (3.8 mg L^-1, Figure 2d) and matched
    the MtrC/OmcA-double-mutant SO3ΔmtrCΔomcA-BS3 consortium (13.4 mg L^-1), but remained 7.64-fold lower than the complete
    SO3-BS3 consortium (102.4 mg L^-1) because efficient NCM reduction requires outer-membrane c-type cytochromes MtrC and
    OmcA in S. oneidensis SO3.
  scope: COMMUNITY_LEVEL
