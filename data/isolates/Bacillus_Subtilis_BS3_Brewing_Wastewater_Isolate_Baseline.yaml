  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, the leached metal ions catalyzed by the SO3∆mtrC∆omcA‐BS3 consortium (13.4 mg L−1) exhibited negligible
      difference from that catalyzed by the sole strain BS3 (13.4 mg L−1), suggesting that MtrC and OmcA in S. oneidensis
      were essential for NCM reduction in metal oxide leaching.
    explanation: Quantifies the 13.4 mg L^-1 total leached metal ion yield of sole strain BS3 monoculture in Figure 5d.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Concentrations of total leached metal ions from NCM catalyzed by strain BS3, and consortia of SO3∆mtrC‐BS3, SO3∆omcA‐BS3,
      SO3∆mtrC∆omcA‐BS3, and SO3‐BS3.
    explanation: Documents the Figure 5d experimental assay comparing sole strain BS3 monoculture NCM leaching against the
      SO3-BS3 and cytochrome-mutant consortia.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Correspondingly, compared with the total leached metal ions catalyzed by the SO3‐BS3 microbial consortium (102.4
      mg L−1), the contents of leached metal ions catalyzed by the SO3∆mtrC‐BS3 consortium (16.7 mg L−1), the SO3∆omcA‐BS3
      microbial consortium (18.7 mg L−1), and the SO3∆mtrC∆omcA‐BS3 consortium (13.4 mg L−1) were dramatically decreased by
      6.13‐, 5.48‐, and 7.64‐fold, respectively (Figure 5d ).
    explanation: Provides the Figure 5d quantitative comparison context for the 13.4 mg L^-1 background NCM metal leaching
      level matched by sole strain BS3 monoculture.
