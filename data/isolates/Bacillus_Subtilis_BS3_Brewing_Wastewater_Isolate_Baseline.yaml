id: CommunityMech:000529
name: Bacillus subtilis 168 BS3 Brewing-Wastewater Metal-Resistant Isolate Baseline
description: Single-strain engineered bacterial isolate baseline Bacillus subtilis 168 BS3 (strain BS2 carrying the P43::irrE
  gene from Deinococcus radiodurans R1 integrated on plasmid pCE2, Cmr, in the mutation-bred high-riboflavin BSG3 background
  with P43::adh-aldH) evaluated as a standalone monoculture control for Ni2+/Co2+ cytotoxicity resistance (Figure 4c-g) and
  spent LiNixCoyMn1-x-yO2 (NCM) cathode bioleaching in Moutai brewing wastewater (Figure 5d) by Zhang et al. 2026 (PMID:42733304).
  Under 6 mg L^-1 Ni2+ and 3 mg L^-1 Co2+ challenge, IrrE overexpression in strain BS3 reduced comet-assay DNA tail length
  by 54.2% (from 31.0 to 14.2 um), decreased intracellular ROS fluorescence by 67.4%, and increased maximum cell density (OD600,max)
  from 0.830 (in parental strain BS2) to 1.175. In 14-day anaerobic NCM bioleaching without Shewanella oneidensis, sole strain
  BS3 leached 13.4 mg L^-1 total dissolved metal ions (identical to the MtrC/OmcA-null SO3ΔmtrCΔomcA-BS3 consortium at 13.4
  mg L^-1 and 7.64-fold lower than SO3-BS3 at 102.4 mg L^-1).
