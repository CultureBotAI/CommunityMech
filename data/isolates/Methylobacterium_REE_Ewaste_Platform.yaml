ecological_interactions:
- name: Citrate-Supplemented REE Leaching
  description: Externally supplied citrate increased chemical REE leaching from magnet swarf and subsequent cellular accumulation.
    Gluconate and oxalate at the tested concentrations did not increase REE leaching relative to the control. Citrate was
    a supplied reagent, not a demonstrated AM1 secretion; its growth and uptake effects depended on concentration and culture
    scale.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: citrate(3-)
    term:
      id: CHEBI:16947
      label: citrate(3-)
    concentration: 5 or 15 mM citrate supplementation
    notes: Supplied as trisodium citrate dihydrate; effects depend on assay conditions.
  - preferred_term: neodymium(3+)
    term:
      id: CHEBI:229785
      label: neodymium(3+)
    notes: Nd is one component of the leached REE mixture; 58.7 ppm was total REE, not an Nd-specific concentration.
  downstream:
  - target: Lanthanophore-Mediated REE Bioaccumulation
    description: PARTIAL - citrate supplementation increased leaching and cellular REE accumulation, supplying more accessible
      metal. The study did not isolate mll as the mediator of that citrate-associated increment.
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: addition of citrate greatly improved REE leaching
    explanation: Identifies the supplied-citrate intervention and its measured leaching effect.
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: did not increase REE leaching as compared to the negative control condition
    explanation: The source identifies 55 mM gluconate and 5 mM oxalate, not citrate, as the ineffective tested
      additions.
- name: Lanthanophore-Mediated REE Bioaccumulation
  description: Expression of the methylolanthanin biosynthetic mll cluster increased REE accumulation from magnet swarf in
    the tested delta-mxaF/pAZ1 background. Nd, Pr, and Dy accumulation increased more than threefold, reaching 80, 15, and
    8 mg/g dry biomass, respectively. Bioreactor selectivity percentages measured under other conditions are not attributed
    to this mll perturbation.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Methylobacterium extorquens
    term:
      id: NCBITaxon:408
      label: Methylorubrum extorquens
  metabolites:
  - preferred_term: neodymium(3+)
    term:
      id: CHEBI:229785
      label: neodymium(3+)
    concentration: 80 mg Nd/g dry biomass with mll expression in the tested background
  - preferred_term: praseodymium(3+)
    term:
      id: CHEBI:229784
      label: praseodymium(3+)
    concentration: Up to 15 mg/g DW from magnet swarf
  - preferred_term: dysprosium(3+)
    term:
      id: CHEBI:33377
      label: dysprosium atom
    concentration: Up to 8 mg/g DW from magnet swarf
    notes: 'Grounded to the atom, not the trivalent cation: CHEBI has no dysprosium(3+) term, carrying only dysprosium atom
      and dysprosium molecular entity. Its neighbours here are exact cations (CHEBI:229785 neodymium(3+), CHEBI:229784 praseodymium(3+)),
      so this one is coarser than the block around it, and preferred_term keeps the species the paper reports. Two CHEBI terms
      could have taken it - CHEBI:37295 dysprosium molecular entity does subsume the cation by is_a, which dysprosium atom
      does not - and CHEBI:33377 is chosen because it is what the rest of the repo means by DYSPROSIUM: the schema enum, kgx_export,
      the reverse map in metal_extraction.py, and the identical triple in Ion_Adsorption_REE_Indigenous_Community.yaml. Grounding
      this record to 37295 alone would drop its dysprosium out of every enum-driven analysis. The id this replaced, CHEBI:49782,
      exists in no CHEBI release - it was part of the rare-earth mis-grounding block in NEXT_TASKS.md and the correction was
      already recorded in scripts/chebi_fix_apply.py, which only ever swept kb/communities (#471).'
  biological_processes:
  - preferred_term: metal ion transport
    term:
      id: GO:0030001
      label: metal ion transport
  downstream:
  - target: Polyphosphate Granule REE Sequestration
    description: PARTIAL - uptake supplies intracellular REE associated with polyphosphate storage. The separate mll and ppx
      experiments do not directly trace mll-delivered metal into granules or establish a combined mediation effect.
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Nd, Pr, and Dy accumulation increased by more than 3-fold with mll expression
    explanation: Directly supports increased accumulation after mll expression in the magnet-swarf experiment.
- name: Polyphosphate Granule REE Sequestration
  description: The paper relates intracellular REE storage to polyphosphate granules and tests reduced exopolyphosphatase
    activity. The ppx deletion strain accumulated 202 mg Nd/g dry biomass, about 5.5-fold above its experimental comparison.
    This supports a phosphate-metabolism link, not measured irreversible retention, covalent bonding, or detoxification rescue.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Methylobacterium extorquens
    term:
      id: NCBITaxon:408
      label: Methylorubrum extorquens
  metabolites:
  - preferred_term: neodymium(3+)
    term:
      id: CHEBI:229785
      label: neodymium(3+)
    concentration: 202 mg/g DW with ppx deletion
  - preferred_term: polyphosphate
    term:
      id: CHEBI:16838
      label: polyphosphate
    notes: Intracellular storage polymer for REE sequestration
  biological_processes:
  - preferred_term: polyphosphate catabolic process
    term:
      id: GO:0006798
      label: polyphosphate catabolic process
    notes: ppx deletion reduces capacity for exopolyphosphatase-mediated polyphosphate breakdown; retention kinetics were
      not measured by the reported endpoint.
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: REEs are stored intracellularly in polyphosphate granules, and genetic engineering to eliminate exopolyphosphatase
      activity increases metal accumulation, confirming the link between phosphate metabolism and biological REE use
    explanation: Provides storage context and the phosphate-metabolism link; does not establish bond chemistry or retention
      duration.
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A ppx (encoding exopolyphosphatase) deletion strain was generated and assessed for REE bioaccumulation, showing
      a ∼5.5-fold increase in Nd levels reaching 202 mg Nd/g DW
    explanation: Quantifies ppx knockout enhancement of bioaccumulation.
- name: Methanol-Powered REE Acquisition Metabolism
  description: The study's growth experiments used M. extorquens AM1 delta-mxaF, lacking the large subunit of the calcium-dependent
    methanol dehydrogenase. This engineered background requires REE for methanol-supported growth through alternative dehydrogenases.
    It does not establish obligate REE dependence of wild-type AM1 or quantify an uptake energy gradient.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Methylobacterium extorquens
    term:
      id: NCBITaxon:408
      label: Methylorubrum extorquens
  metabolites:
  - preferred_term: methanol
    term:
      id: CHEBI:17790
      label: methanol
    notes: Carbon and energy source for methylotrophic growth
  - preferred_term: neodymium(3+)
    term:
      id: CHEBI:229785
      label: neodymium(3+)
    notes: Nd is present in the magnet-swarf REE source; the growth experiment uses a REE-dependent engineered background.
  biological_processes:
  - preferred_term: methanol metabolic process
    term:
      id: GO:0015945
      label: methanol metabolic process
    notes: Methanol oxidation coupled to energy generation
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Deletion of this gene ensures REE dependency for growth with methanol
    explanation: The strain-methods paragraph identifies the deleted gene as mxaF, distinguishing the engineered growth dependency
      from wild-type physiology.
environmental_factors:
- name: pH
  value: '6.9'
  unit: pH units
  description: 'Near-neutral pH (6.9) maintained with 1 M NaOH in bioreactors, representing a major environmental advantage
    over conventional acidic REE extraction (pH <2). Neutral pH eliminates corrosion issues, reduces energy consumption, minimizes
    hazardous waste generation, and enables biological processing incompatible with extreme acidity. The pH 6.9 optimum balances
    REE solubility (citrate chelation prevents precipitation) with bacterial physiology (optimal for M. extorquens growth).

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Bioreactor parameters were as follows: agitation, 500 rpm; air flow, 200–2000 sccm; temperature,
      29.5 °C; and pH, 6.9. The pH of the bioreactor was maintained by using 1 M NaOH'
    explanation: Documents the controlled pH used in bioreactor cultivation.
- name: Temperature
  value: 29-30
  unit: °C
  description: 'Mesophilic temperature range optimal for M. extorquens growth and REE bioaccumulation. Mesophilic operation
    (near-ambient temperature) minimizes energy costs for heating compared to thermophilic processes, contributing to overall
    sustainability and economic viability of the bioplatform. The 29-30°C range supports robust growth kinetics and high REE
    loading rates.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Bioreactor parameters were as follows: agitation, 500 rpm; air flow, 200–2000 sccm; temperature,
      29.5 °C; and pH, 6.9'
    explanation: Documents the cultivation temperature used in bioreactor runs.
- name: Bioreactor Scale
  value: '10'
  unit: liters
  description: 'The platform scales to 10-liter stirred bioreactors, demonstrating industrial feasibility beyond laboratory
    shake flasks. Successful scale-up to 10 L represents a critical milestone toward commercial REE recovery from electronic
    waste streams. The bioreactor configuration provides controlled agitation, aeration, pH control, and nutrient dosing,
    enabling reproducible high-efficiency REE bioaccumulation. Further scale-up to pilot (100-1000 L) and industrial (>10,000
    L) scales is technically feasible using standard bioprocess engineering principles.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we assessed process performance at a 10 L scale using optimized media and 1% Nd magnet swarf pulp density
    explanation: Documents the 10 L scale-up test condition.
- name: Medium Composition
  value: HyphoMOD minimal medium
  description: 'HyphoMOD minimal medium with reduced phosphate concentration to enhance REE bioaccumulation. High phosphate
    levels cause extracellular REE-phosphate precipitation that reduces bioavailability, so phosphate is limited to favor
    intracellular polyphosphate-REE sequestration. The minimal medium contains methanol (carbon/energy source), nitrogen source,
    trace metals, and vitamins required for M. extorquens growth. Organic acids (citrate, gluconate) are supplemented for
    REE leaching from e-waste substrates.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a modified formulation of Hypho (HyphoMOD) containing 1.27 g/L of K2HPO4 and 1.30 g/L of NaH2PO4.H2O was used
    explanation: Describes the HyphoMOD medium used for the reported cultures.
- name: REE Bioaccumulation Capacity
  value: '202'
  unit: mg Nd/g dry cell weight
  description: 'The ppx deletion strain achieved 202 mg neodymium per gram dry weight, a ∼5.5-fold increase in Nd accumulation
    for the tested strain background. This higher loading followed the hypothesis that limiting exopolyphosphatase-catalyzed
    polyphosphate depolymerization would increase REE bioaccumulation.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A ppx (encoding exopolyphosphatase) deletion strain was generated and
      assessed for REE bioaccumulation, showing a ∼5.5-fold increase in Nd
      levels reaching 202 mg Nd/g DW
    explanation: Quantifies the ppx deletion strain's Nd bioaccumulation capacity.
- name: REE Selectivity and Purity
  value: 98%
  unit: '% REE purity'
  description: 'The bioplatform achieves 98% REE purity (98% of accumulated metals are REE) and 96.8% neodymium specificity
    (96.8% of REE is Nd), demonstrating exceptional selectivity for target critical materials. This high selectivity eliminates
    the need for extensive downstream purification and enables direct recovery of magnet-grade neodymium from complex e-waste
    matrices containing iron, cobalt, nickel, copper, and other competing metals. The lanthanophore-mediated bioaccumulation
    selectively targets REE over non-REE metals, while the inherent biochemistry of methanol dehydrogenase favors light REE
    (particularly Nd) that serve as optimal cofactors.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In cell samples, 98.0% of the accumulated metal was REE, 96.8% of which was Nd
    explanation: Quantifies REE selectivity and Nd specificity.
- name: Substrate E-waste Composition
  value: Nd-Fe-B magnet swarf
  description: 'The primary substrate is permanent magnet swarf (grinding/machining waste from Nd-Fe-B magnet production),
    which contains high concentrations of neodymium (~30%), praseodymium (~5%), dysprosium (~1%), iron (~65%), and boron.
    Nd-Fe-B magnets are critical components in electric vehicle motors, wind turbines, and electronics, making their recycling
    strategically important for circular economy and critical materials supply chains. The bioplatform also processes phosphor
    powders (containing Y, Eu, Tb) and other REE-bearing e-waste components. Global e-waste generation exceeds 50 million
    tons annually, representing a massive "urban ore" reservoir for REE recovery.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Iron was the primary metal component of Nd magnet swarf (68.0% Fe), rendering nonselective leaching and uptake
      mechanisms insufficient for effective REE bioaccumulation. Nd was the second most abundant metal measured
      (26.7% Nd)
    explanation: Documents the dominant Fe and Nd composition of the magnet-swarf feedstock.
- name: Citrate Leaching Efficiency
  value: '58.7'
  unit: ppm REE leached
  description: 'Supplementation with 15 mM trisodium citrate dihydrate leaches 58.7 ± 0.6 ppm REE from electronic waste substrates
    after 28 hours, representing effective non-acidic bioleaching. This compares favorably to 5 mM citrate (8.2 ppm leached),
    demonstrating dose-dependent REE mobilization. The citrate-mediated leaching operates at pH 6.9 (versus pH <2 for conventional
    acid leaching), reducing corrosion, energy consumption, and environmental impact while maintaining high REE extraction
    efficiency.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 28 h of incubation, 8.2 ± 0.1 and 58.7 ± 0.6 ppm of REE were leached into the
      supernatant supplemented with 5 mM and 15 mM citrate, respectively
    explanation: Quantifies dose-dependent REE leaching by citrate.
- name: Genetic Engineering Strategy
  value: ppx deletion
  description: 'Deletion of ppx, which encodes exopolyphosphatase, was used to reduce polyphosphate depolymerization and increase
    intracellular Nd storage in the tested M. extorquens strain background. The deletion raised Nd bioaccumulation ∼5.5-fold
    to 202 mg Nd/g dry weight.

    '
  evidence:
  - reference: PMID:38150661
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A ppx (encoding exopolyphosphatase) deletion strain was generated and
      assessed for REE bioaccumulation, showing a ∼5.5-fold increase in Nd
      levels reaching 202 mg Nd/g DW
    explanation: Describes the engineered ppx deletion used to increase Nd bioaccumulation.
