  term:
    id: ENVO:00002116
    label: contaminated soil
  notes: 'Electronic waste (e-waste) substrate containing REE-rich components including permanent magnet swarf (Nd-Fe-B magnets),
    phosphor powders, and circuit boards. The platform processes electronic waste under controlled bioreactor conditions with
    HyphoMOD minimal medium (reduced phosphate to enhance REE bioaccumulation), supplemented with organic acids (citrate 5-15
    mM, gluconate 55 mM) for REE leaching. The system operates at pH 6.9 (maintained with 1 M NaOH), temperature 29-30°C,
    and scales from shake flasks to 10 L stirred bioreactors. This represents an engineered bioprocessing environment distinct
    from natural habitats, designed for sustainable critical materials recovery from waste streams.

    '
