discussions:
- discussion_id: ree_intervention_integration
  prompt: How do citrate supply, mll expression, and phosphate storage jointly control REE recovery?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Citrate-Supplemented REE Leaching
  - ecological_interactions#Lanthanophore-Mediated REE Bioaccumulation
  - ecological_interactions#Polyphosphate Granule REE Sequestration
  - ecological_interactions#Methanol-Powered REE Acquisition Metabolism
  rationale: PMID:38150661 reports separate chemical and genetic interventions. Their gains and baseline values cannot be
    multiplied or read as one strain-condition series. Uptake-to-storage mediation, retention kinetics, and a combined mll/ppx
    phenotype were not established by the reviewed experiments. Reusing swarf across recovery runs is not evidence of retention
    in the same biomass. Exact ppx genotype details require the unread supplement; non-graph environmental and commercial-purity
    claims remain outside this review.
