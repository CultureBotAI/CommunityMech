id: CommunityMech:000552
name: Pelagerythrobacter sp. N7 Halophilic Pyrene Oxidation Isolate Baseline
description: Single-strain halophilic bacterial isolate baseline Pelagerythrobacter sp. N7 (NCBITaxon:2800685) isolated on
  solid 5% sea-salt defined medium with 10 mg phenanthrene (SSDM-P) from the halophilic PAH-degrading consortium 5H (enriched
  from PAH-polluted saline soil in Shanxi Province, China) and characterized in 5% salinity SSDM with 50 mg/L pyrene alongside
  Salinicola sp. A11 (CommunityMech:000553) and the two-member PES synthetic consortium (CommunityMech:000340) by Wen et al.
  2026 (PMID:42666409). In 14-day pure-culture flask assays (200 mL 5% SSDM, 50 mg/L pyrene, initial OD600 = 0.015, 30 °C,
  120 rpm in darkness), strain N7 initiated upstream pyrene oxidation via ring-hydroxylating dioxygenase (pahA/RHD), pahB,
  and pahC, but pyrene removal plateaued at 49.95% after 14 days while accumulating 4,5-dihydroxypyrene (GC-MS peak 40.25
  min) and 12.17 mg/L of the dead-end intermediate 4,5-dicarboxyphenanthrene (GC-MS peak 38.10 min) after 9 days due to the
  lack of 4,5-dicarboxyphenanthrene decarboxylase and extracellular bioemulsifier synthesis.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Isolate and benchmark the upstream halophilic pyrene-oxidizing bacterium Pelagerythrobacter sp. N7 in pure culture
    to identify the metabolic bottleneck (4,5-dicarboxyphenanthrene accumulation) resolved by Salinicola sp. A11 in the PES
    consortium.
  assembly_strategy: Enrich consortium 5H in 5% SSDM with 100 mg/L phenanthrene at 30 °C and 120 rpm for 72 h, plate onto
    solid SSDM containing 10 mg phenanthrene (SSDM-P), and select colony N7 forming a clear phenanthrene degradation zone.
  inoculation_strategy: Wash pure-culture N7 cells in fresh 5% SSDM to OD600 = 0.2 and inoculate 200 mL of 5% salinity SSDM
    containing 50 mg/L pyrene at an initial OD600 of 0.015.
  perturbation_design: Monitor 14-day residual pyrene, OD600 growth, and 4,5-dicarboxyphenanthrene accumulation in N7 monoculture
    (30 °C, 120 rpm in darkness), profile day-5/day-10 intracellular and extracellular intermediates by GC-MS, and compare
    24-h soybean-oil emulsification of N7 cell-free supernatant and washed cells against A11 and PES.
  measurement_endpoints:
  - HPLC quantification of residual pyrene and accumulated 4,5-dicarboxyphenanthrene at 254 nm
  - bacterial growth by OD600
  - GC-MS identification of TMS-derivatized pyrene transformation intermediates
  - 24-h soybean-oil emulsification index (E24) assay and HADEG genome mining
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain N7 was selected from SSDM-P plate with clear degradation zone around the colony.
    explanation: Documents the isolation of Pelagerythrobacter sp. N7 on phenanthrene-containing SSDM-P agar.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 14 days of cultivation, the degradation rate plateaued at 49.95%, and a low value of cell growth, indicating
      that strain N7 was not able to complete remove pyrene. Moreover, intermediate 4,5-dihydroxypyrene were also detected
      accumulated in the degradation process. After 9 days degradation, the concentration of 4,5-dicarboxyphenanthrene was
      riched to 12.17 mg/L, indicating the limited ability of strain N7 in the degradation of pyrene.
    explanation: Quantifies the 14-day 49.95% pyrene removal plateau and 9-day 12.17 mg/L 4,5-dicarboxyphenanthrene accumulation
      in N7 pure culture.
