ecological_interactions:
- name: Upstream Pyrene Dioxygenation and 4,5-Dicarboxyphenanthrene Bottleneck in Strain N7 Pure Culture
  description: In 200 mL 5% salinity SSDM containing 50 mg/L pyrene (initial OD600 = 0.015, 30 °C, 120 rpm in darkness), Pelagerythrobacter
    sp. N7 pure culture oxidized pyrene via ring-hydroxylating dioxygenase (pahA/RHD), pahB, and pahC to 4,5-dihydroxypyrene
    (GC-MS retention time 40.25 min; m/z 380, 365, 290, 218, 147, 73) and 4,5-dicarboxyphenanthrene (GC-MS retention time
    38.10 min; m/z 411, 381, 294, 205, 177, 73), reaching a 49.95% pyrene removal plateau at day 14 and accumulating 12.17
    mg/L 4,5-dicarboxyphenanthrene by day 9 without detectable downstream 4-carboxyphenanthrene, phthalate, salicylic acid,
    or gentisate or extracellular soybean-oil emulsification.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pelagerythrobacter sp. N7
    term:
      id: NCBITaxon:2800685
      label: Pelagerythrobacter
  metabolites:
  - preferred_term: pyrene
    term:
      id: CHEBI:39106
      label: pyrene
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Owing to the inability to further transfer 4,5-dicarboxyphenanthrene, the metabolic pathway was disrupted, leading
      to the significant accumulation of 4,5-dicarboxyphenanthrene during pyrene degradation by the pure culture of strain
      N7.
    explanation: Establishes the 4,5-dicarboxyphenanthrene decarboxylation bottleneck in strain N7 pure culture.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, no comparable stable emulsification was observed in the N7 supernatant, any of the washed-cell suspensions,
      or fresh SSDM.
    explanation: Demonstrates that neither N7 cell-free supernatant nor washed cells produced stable emulsification in the
      24-h soybean-oil assay.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Using the HADEG database ( Dams-Kozlowska et al., 2008 ), no relevant bioemulsifier-producing genes were annotated
      in the genome of strain N7.
    explanation: Confirms the absence of annotated bioemulsifier biosynthesis genes in the genome of strain N7.
