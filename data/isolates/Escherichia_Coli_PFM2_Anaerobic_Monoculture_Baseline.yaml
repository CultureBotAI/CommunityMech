discussions:
- discussion_id: pfm2_monoculture_rpoc_polyauxotrophy_and_subpopulation_crossfeeding
  prompt: Did the six non-adenine auxotrophic E. coli PFM2 isolates and four adenine auxotrophs recovered at generation 650
    in monoculture arise from rpoC RNA polymerase β'-subunit mutations and survive via intraspecific cross-feeding between
    E. coli subpopulations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#High De Novo Purine Expression and Emergent Adenine Auxotrophy in Evolved E. coli PFM2 Monoculture
  rationale: PMID:42117636 observes 10 auxotrophic isolates among 40 generation-650 E. coli monoculture clones (4 rescued
    by adenine, 6 unknown) and notes that rpoC mutations (enriched in monocultures) are known to cause polyauxotrophy, while
    leaving the exact metabolite identities of the 6 non-adenine auxotrophs open.
  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although we did not investigate these possible E. coli monoculture cross-feeding relationships, we speculate
      that a source of the auxotrophies could be mutations in rpoC, encoding the RNA polymerase β'-subunit. RpoC mutations
      are known to result in polyauxotrophs ( 42 ).
    explanation: Documents the authors' rpoC hypothesis for the monoculture auxotrophies.
  posed_by: antigravity
  posed_date: '2026-11-09'
