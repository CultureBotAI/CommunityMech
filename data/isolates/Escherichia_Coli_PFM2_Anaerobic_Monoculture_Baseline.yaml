  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These criteria resulted in a list of 167 mutations from R. palustris monocultures, 31 from E. coli monocultures,
      43 from R. palustris in cocultures, and 132 from E. coli in cocultures ( Fig. 2A ; Tables S1 through S5 ).
    explanation: Quantifies the 31 differentially enriched mutations in evolved E. coli PFM2 monocultures.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, no E. coli PFM2 purine biosynthesis gene (pur) mutations were observed in cocultures ( Fig. 3A ) nor
      were adenine auxotrophs observed among 40 coculture isolates screened ( Fig. 3B ). Unexpectedly, four E. coli monoculture
      isolates, two in each of replicates 18 and 20, appeared to be adenine auxotrophs, showing similar growth trends to the
      ΔpurH auxotroph control ( Fig. 3B ).
    explanation: Demonstrates that four E. coli PFM2 monoculture isolates in replicates 18 and 20 evolved adenine auxotrophy,
      whereas 0 of 40 coculture isolates did.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Perhaps similar to R. palustris siderophore mutant enrichment in monocultures, several E. coli PFM2 evolved isolates
      with unknown dependencies were observed in monoculture but not in coculture; 10 of the 40 evolved monoculture PFM2 isolates
      that we screened could not grow in a minimal medium ( Fig. 3B ). Four isolates were rescued by adenine, but the rest
      were not ( Fig. 3B ).
    explanation: Quantifies the 10 of 40 evolved monoculture E. coli PFM2 isolates unable to grow in minimal medium (4 adenine-rescued
      and 6 non-adenine auxotrophs).
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We verified that the same is true for E. coli PFM2 by RT-qPCR quantification of purH transcript; coculture PFM2
      purH levels were 20% of those in monoculture ( Fig. 3C ). Adding adenine to monocultures resulted in a purH transcript
      level that was 12% of that observed without adenine, suggesting that the low expression in coculture was due to adenine
      availability ( Fig. 3C ).
    explanation: Proves that E. coli purH transcript levels in coculture are 20% of monoculture levels (5-fold higher in monoculture)
      and are repressed to 12% by exogenous adenine.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In support of this idea, the E. coli PFM2 siderophore entF transcript level was 3.3-fold higher in coculture
      than in monoculture ( Fig. 5D ), perhaps in response to iron loss to R. palustris.
    explanation: Quantifies the 3.3-fold difference in E. coli PFM2 entF transcript levels between monoculture and coculture.
