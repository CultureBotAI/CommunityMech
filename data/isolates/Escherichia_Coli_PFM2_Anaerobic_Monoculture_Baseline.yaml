ecological_interactions:
- name: High De Novo Purine Expression and Emergent Adenine Auxotrophy in Evolved E. coli PFM2 Monoculture
  description: Across 650 generations of anaerobic glucose fermentation in MDC medium supplemented with 10 mM glucose, 25
    mM NaCl, and 2.3 mM NH4Cl (10 replicate lineages), Escherichia coli PFM2 monocultures accumulated 31 differentially enriched
    mutations across 6 commonly mutated genes and intergenic regions (Figure 2A, D). Because E. coli monocultures lacked partner-supplied
    extracellular adenine, ancestral E. coli PFM2 expressed purH at 5-fold higher transcript levels in monoculture than in
    coculture (coculture purH levels were 20% of monoculture, and exogenous adenine reduced monoculture purH expression to
    12%, Figure 3C). Under this high biosynthetic expression cost, 10 of 40 screened generation-650 monoculture E. coli isolates
    failed to grow in minimal medium (vs 0 of 40 coculture isolates), including four adenine-rescued auxotrophs from replicates
    18 and 20 and six unknown auxotrophs (Figure 3B). Conversely, E. coli PFM2 entF siderophore transcript levels were 3.3-fold
    lower in monoculture than in coculture (Figure 5D).
  scope: COMMUNITY_LEVEL
  participating_taxa:
