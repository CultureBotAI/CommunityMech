id: CommunityMech:000540
name: Escherichia coli PFM2 Anaerobic Monoculture Baseline
description: Long-term evolved anaerobic fermentative bacterial monoculture baseline Escherichia coli strain PFM2 (NCBITaxon:562;
  GTDB:s__Escherichia_coli; MG1655 derivative with repaired rpoS and rph genes) evolved across 10 replicate serial-transfer
  lineages for 650 generations in M9-derived coculture medium (MDC) supplemented with 10 mM glucose, cation solution, 25 mM
  NaCl, and 2.3 mM NH4Cl under N2 headspace at 30 degrees C by Chuang et al. 2026 (PMID:42117636; BioProject PRJNA1079325).
  Benchmarked alongside evolved Rhodopseudomonas palustris CGA676 monoculture (CommunityMech:000539), the obligate cross-feeding
  coculture (CommunityMech:000469), and the three-strain adenine mutual-invasion competition coculture (CommunityMech:000541),
  evolved E. coli PFM2 monocultures accumulated 31 differentially enriched mutations across 6 commonly mutated genes and intergenic
  regions (Figure 2A, D), exhibited 5-fold higher purH transcript levels (coculture PFM2 purH levels were 20% of monoculture,
  Figure 3C) and 3.3-fold lower entF enterobactin siderophore transcript levels than cocultures (Figure 5D), and uniquely
  evolved emergent metabolic dependencies (10 of 40 screened generation-650 monoculture isolates unable to grow in minimal
  medium vs 0 of 40 coculture isolates, including 4 adenine-rescued auxotrophs in replicates 18 and 20 and 6 non-adenine auxotrophs,
  Figure 3B).
