discussions:
- discussion_id: xl5_to_xl12_glucose_lactate_switch_mechanism
  prompt: Why did deleting pta, frdABC, adhE, dld, and mgsA in E. coli XL5 (to generate XL12) increase sole-xylose D-lactate
    12.7-fold (from 0.21 to 2.66 g/L) while simultaneously reducing sole-glucose D-lactate 8.9-fold (from 2.66 to 0.30 g/L)
    despite higher 36-h glucose biomass (OD600 = 2.89 vs 1.46)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Delayed Non-PTS Glucose Utilization and Low Sole-Xylose D-Lactate Yield in Intermediate E. coli
    XL5 Monoculture
  rationale: 'Comparing Figure 2 (XL5) with Figure 3 (XL12) reveals a complete inversion of substrate-specific D-lactate yield
    between the 5-gene and 10-locus knockouts: XL5 produced 2.66 g/L on glucose and 0.21 g/L on xylose, whereas XL12 produced
    0.30 g/L on glucose and 2.66 g/L on xylose.'
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When glucose was used as the sole carbon source, WT produced 0.03 g/L D-lactate, while XL12 produced 0.30 g/L
      D-lactate with a conversion rate of 6%.
    explanation: Documents the decrease in sole-glucose D-lactate from 2.66 g/L in XL5 to 0.30 g/L in XL12.
  posed_by: antigravity
  posed_date: '2026-11-10'
