ecological_interactions:
- name: Delayed Non-PTS Glucose Utilization and Low Sole-Xylose D-Lactate Yield in Intermediate E. coli XL5 Monoculture
  description: In sole-glucose M9 fermentation (5 g/L glucose, 37 °C, 150 rpm, Fig. 2), deletion of ptsI and glk in E. coli
    XL5 delayed the exponential growth phase by 24 h (reaching OD600 = 1.46 at 36 h, 24 h later than WT, via alternative GalP/Mgl
    transport), while deletion of pps, poxB, and pflB elevated 36-h D-lactate production on sole glucose to 2.66 g/L (53.2%
    conversion yield, 0.07 g/L/h productivity; 28.56-fold higher than wild-type E. coli at 0.09 g/L). In sole-xylose M9 fermentation
    (5 g/L xylose, Fig. 2), XL5 reached a maximum biomass 0.46-fold higher than in glucose-grown cultures and fully consumed
    5 g/L xylose within 48 h, but produced only 0.21 g/L D-lactate (4.2% conversion rate) because competing byproduct pathways
    (pta, frdABC, adhE, mgsA) and D-lactate dehydrogenase (dld) remained intact.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Escherichia coli XL5
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  - preferred_term: xylose
    term:
      id: CHEBI:18222
      label: xylose
  - preferred_term: D-lactic acid
    term:
