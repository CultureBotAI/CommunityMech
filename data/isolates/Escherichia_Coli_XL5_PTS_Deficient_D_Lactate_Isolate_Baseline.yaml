    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: With glucose as the sole carbon source, XL5 exhibited a significantly delayed exponential growth phase, reaching
      an OD600 of 1.46 at 36 h–24 h later than WT. WT consumed most glucose within 12 h and leaving 0.67 g/L residual glucose.
      XL5 initiated glucose utilization after 24 h and depleted it by 36 h.
    explanation: Documents the 24-h delayed exponential phase, glucose depletion between 24 and 36 h, and 36-h OD600 (1.46)
      of XL5 in sole-glucose medium.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When glucose as the sole carbon source, WT produced 0.09 g/L D-lactate after 36 h. XL5 produced 2.66 g/L of D-lactate,
      corresponding to a 53.2% conversion yield and a productivity of 0.07 g/L/h, which was 28.56-fold higher than that of
      the WT.
    explanation: Quantifies 36-h sole-glucose D-lactate synthesis by XL5 (2.66 g/L, 53.2% conversion, 0.07 g/L/h; 28.56-fold
      over WT).
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: With xylose as the sole carbon source, XL5 reached a maximum biomass 0.46-fold higher than in glucose-grown cultures.
      Both WT and XL5 fully consumed 5 g/L xylose within 36 h and 48 h, respectively ( Fig. 2 A).
    explanation: Quantifies XL5 biomass increase and 48-h xylose depletion in sole-xylose medium.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When xylose was used as the sole carbon source, D-lactate was not detected in the WT culture, while XL5 produced
      0.21 g/L D-lactate, achieving a conversion rate of 4.2% ( Fig. 2 B).
    explanation: Quantifies the low 36-h D-lactate titer (0.21 g/L, 4.2% conversion) of XL5 in sole-xylose medium.
