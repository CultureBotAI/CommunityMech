id: CommunityMech:000544
name: Escherichia coli XL5 PTS/Glucokinase-Deficient Intermediate Isolate Baseline
description: Single-strain engineered bacterial isolate baseline Escherichia coli XL5 (E. coli BL21(DE3) Δglk ΔptsI Δpps ΔpoxB
  ΔpflB; NCBITaxon:562; GTDB:s__Escherichia_coli) constructed via CRISPR/Cas9 as the 5-gene knockout intermediate preceding
  E. coli XL12 (CommunityMech:000543) and evaluated alongside E. coli GL10 (CommunityMech:000542) and wild-type E. coli BL21(DE3)
  by Tan et al. 2026 (PMID:42038008). In sole-glucose M9 medium (5 g/L glucose, 37 °C, 150 rpm, initial OD600 = 0.1, Fig.
  2), deletion of ptsI and glk delayed the exponential growth phase of XL5 by 24 h (reaching OD600 = 1.46 at 36 h via alternative
  GalP/Mgl transport), while deletions of pps, poxB, and pflB redirected carbon flux to produce 2.66 g/L D-lactate at 36 h
  (53.2% conversion yield, 0.07 g/L/h productivity, 28.56-fold higher than wild-type E. coli at 0.09 g/L). In sole-xylose
  M9 medium (5 g/L xylose, Fig. 2), XL5 achieved 0.46-fold higher maximum biomass than in glucose-grown cultures and fully
  consumed 5 g/L xylose within 48 h, but produced only 0.21 g/L D-lactate (4.2% conversion rate), motivating the subsequent
  deletion of pta, frdABC, adhE, dld, and mgsA to generate strain XL12.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Test whether disabling PTS glucose uptake (ptsI), glucokinase (glk), phosphoenolpyruvate synthase (pps), pyruvate
    oxidase (poxB), and pyruvate formate-lyase (pflB) in E. coli BL21(DE3) is sufficient to redirect xylose flux into D-lactate.
  assembly_strategy: Delete glk, ptsI, pps, poxB, and pflB in E. coli BL21(DE3) via CRISPR/Cas9 to create the five-gene knockout
    intermediate strain XL5.
  perturbation_design: Compare E. coli XL5 monoculture against wild-type E. coli BL21(DE3) in M9 medium containing either
    5 g/L glucose or 5 g/L xylose at 37 °C and 150 rpm (initial OD600 = 0.1) over 72 h.
  measurement_endpoints:
  - bacterial growth curves (OD600) on 5 g/L glucose and 5 g/L xylose
  - glucose and xylose depletion kinetics
  - D-lactate titer, conversion rate, and productivity at 36 h
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Prior to XL12 construction, XL5 was constructed as an intermediate step to investigate whether the deletion of
      glk, ptsI, pps, poxB, and pflB could disrupt glucose metabolism and boost carbon flux to D-lactate. Strain XL5 (ΔglkΔptsIΔppsΔpoxBΔpflB)
      was successfully constructed via CRISPR/Cas9 ( Fig. S3 ).
    explanation: Documents the CRISPR/Cas9 construction and five-gene knockout genotype of intermediate strain XL5.
