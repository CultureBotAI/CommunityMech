  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When glucose was used as the sole carbon source, WT produced 0.03 g/L D-lactate, while XL12 produced 0.30 g/L
      D-lactate with a conversion rate of 6%. When xylose was used as the sole carbon source, D-lactate was not detected in
      the WT culture, whereas XL12 produced 2.66 g/L of D-lactate, representing a 53.2% conversion yield and a productivity
      of 0.07 g/L/h–a 7.87-fold increase over its own performance in glucose medium ( Fig. 3 B).
    explanation: Quantifies XL12 monoculture 36-h D-lactate production on sole glucose (0.30 g/L, 6% conversion) and sole
      xylose (2.66 g/L, 53.2% conversion, 0.07 g/L/h; 7.87-fold over sole glucose).
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The genes pgi, ppc and ackA in strain XL12 was down-regulated by 70.95%, 37.52% and 59.75% respectively compared
      to the wild-type (WT) ( Fig. S2 ).
    explanation: Documents the qRT-PCR down-regulation of pgi, ppc, and ackA in XL12 relative to wild-type E. coli.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On the contrary, XL12 co-utilized glucose and xylose simultaneously in the mixed sugar medium. Although XL12
      consumed glucose slowly in comparison with WT, XL12 utilized 56.57% of xylose at 72 h ( Fig. 4 A). More importantly,
      the optical purity of D-lactate reached 100% ( Table S4 ).
    explanation: Demonstrates relieved CCR, simultaneous glucose/xylose co-utilization (56.57% xylose consumption at 72 h),
      and 100% D-lactate optical purity in XL12 monoculture.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In mixed sugars, WT produced 0.17 g/L D-lactate when the fermentation proceeded for 36 h, while XL12 produced
      1.27 g/L D-lactate with a conversion rate of 12.7% and productivity of 0.04 g/L/h ( Fig. 4 B). Formate, acetate, and
      ethanol were not detected in XL12 culture but 0.72 g/L succinate was detected at 36 h ( Fig. S6 ).
    explanation: Quantifies 36-h mixed-sugar D-lactate production (1.27 g/L) and byproduct profile (0.72 g/L succinate; zero
      formate, acetate, ethanol) in XL12 monoculture.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When glucose was used as the sole carbon source, XL12 demonstrated improved growth compared to the WT. XL12 reached
      an OD600 of 2.89 at 36 h. WT depleted 5 g/L of glucose within 12 h, whereas XL12 began utilizing glucose at 12 h and
      completed consumption by 36 h. When xylose was used as the sole carbon source, XL12 exhibited slower growth compared
      to WT. WT consumed 5 g/L of xylose within 36 h, while XL12 initiated xylose utilization at 12 h ( Fig. 3 A).
    explanation: Quantifies the single-sugar growth (OD600 = 2.89 at 36 h on glucose) and substrate uptake onset (12 h for
      both glucose and xylose) of E. coli XL12.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results demonstrates that the knockout of the glk and ptsI genes successfully reprogrammed XL12 into a
      xylose-preferring D-lactate producer. Meanwhile, deletion of competing pathway genes reduced byproducts such as succinate,
      formate, acetate, and ethanol ( Fig. S4 and S5 ), enhancing carbon flux from xylose to D-lactate.
    explanation: Confirms that glk/ptsI deletion and competing-pathway knockouts reprogrammed XL12 into a xylose-preferring
      D-lactate producer with reduced acid/alcohol byproducts.
