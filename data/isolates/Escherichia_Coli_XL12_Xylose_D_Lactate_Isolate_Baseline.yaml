id: CommunityMech:000543
name: Escherichia coli XL12 Xylose-Specialized D-Lactate Isolate Baseline
description: Single-strain engineered bacterial isolate baseline Escherichia coli XL12 (E. coli BL21(DE3) Δglk ΔptsI Δpps
  ΔpoxB ΔpflB Δpta ΔfrdABC ΔadhE Δdld ΔmgsA; NCBITaxon:562; GTDB:s__Escherichia_coli) constructed from intermediate strain
  XL5 (CommunityMech:000544) by deleting pta, frdABC, adhE, dld, and mgsA and evaluated alongside glucose-specialized E. coli
  GL10 (CommunityMech:000542) and the GL10-XL12 consortium (CommunityMech:000357) by Tan et al. 2026 (PMID:42038008). Relative
  to wild-type E. coli, XL12 down-regulated pgi, ppc, and ackA expression by 70.95%, 37.52%, and 59.75% (Fig. S2). In single-sugar
  M9 fermentation (Fig. 3), XL12 began utilizing glucose at 12 h and completed consumption by 36 h (OD600 = 2.89 at 36 h)
  but produced only 0.30 g/L D-lactate (6% conversion), whereas on sole xylose XL12 initiated consumption at 12 h (12 h earlier
  than XL5) and produced 2.66 g/L D-lactate at 36 h (53.2% conversion, 0.07 g/L/h productivity, 7.87-fold increase over its
  glucose performance). In mixed-sugar medium (5 g/L glucose + 5 g/L xylose, Fig. 4), XL12 co-utilized glucose and xylose
  simultaneously (56.57% xylose utilization at 72 h) and produced 1.27 g/L D-lactate at 36 h (12.7% conversion, 0.04 g/L/h
  productivity, 100% optical purity, with 0.72 g/L residual succinate and zero formate, acetate, or ethanol).
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Eliminate competing fermentation and D-lactate degradation pathways in the PTS/glucokinase-deficient E. coli
    XL5 chassis to generate a xylose-specialized strain (XL12) relieved of carbon catabolite repression for optically pure
    D-lactate production.
  assembly_strategy: Delete pta, frdABC, adhE, dld, and mgsA via CRISPR/Cas9 in E. coli XL5 (Δglk ΔptsI Δpps ΔpoxB ΔpflB)
    to construct the 10-locus knockout strain XL12.
  perturbation_design: Evaluate E. coli XL12 monoculture in M9 medium containing 5 g/L glucose, 5 g/L xylose, or 5 g/L glucose
    + 5 g/L xylose at 37 °C and 150 rpm (initial OD600 = 0.1), and measure qRT-PCR expression of pgi, ppc, and ackA relative
    to wild-type E. coli BL21(DE3).
  measurement_endpoints:
  - bacterial growth by OD600
  - glucose and xylose consumption kinetics
  - D-lactate titer, conversion rate, and productivity at 36 h
  - succinate, formate, acetate, and ethanol byproduct concentrations
  - qRT-PCR transcript levels of pgi, ppc, and ackA
  - chiral optical purity of D-lactate
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further knockout of pta, frdABC, adhE, dld, and mgsA in XL5 generated strain XL12
    explanation: Documents the step-wise construction of strain XL12 from XL5.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In mixed sugars, WT produced 0.17 g/L D-lactate when the fermentation proceeded for 36 h, while XL12 produced
      1.27 g/L D-lactate with a conversion rate of 12.7% and productivity of 0.04 g/L/h
    explanation: Summarizes mixed-sugar D-lactate output by XL12 monoculture relative to WT.
