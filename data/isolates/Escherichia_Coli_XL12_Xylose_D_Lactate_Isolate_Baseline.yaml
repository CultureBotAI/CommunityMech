ecological_interactions:
- name: PTS/Glk Deletion-Mediated Xylose Specialization, Relieved Carbon Catabolite Repression, and D-Lactate Synthesis by
    E. coli XL12 Monoculture
  description: In Escherichia coli XL12 (Δglk ΔptsI Δpps ΔpoxB ΔpflB Δpta ΔfrdABC ΔadhE Δdld ΔmgsA), qRT-PCR analysis showed
    that expression of pgi, ppc, and ackA was down-regulated by 70.95%, 37.52%, and 59.75% relative to wild-type E. coli (Fig.
    S2). In sole-glucose M9 medium (Fig. 3), XL12 began utilizing glucose at 12 h and completed consumption by 36 h (OD600
    = 2.89 at 36 h) and produced 0.30 g/L D-lactate (6% conversion). In sole-xylose M9 medium (Fig. 3), XL12 initiated xylose
    utilization at 12 h (12 h earlier than XL5) and produced 2.66 g/L D-lactate at 36 h (53.2% conversion yield, 0.07 g/L/h
    productivity, a 7.87-fold increase over its own performance in glucose medium). In mixed-sugar medium (5 g/L glucose +
    5 g/L xylose, Fig. 4), relieved CCR allowed XL12 to co-utilize glucose and xylose simultaneously (56.57% xylose utilization
    at 72 h) and produce 1.27 g/L D-lactate at 36 h (12.7% conversion, 0.04 g/L/h productivity, 100% optical purity, 0.72
    g/L succinate, and zero formate, acetate, or ethanol).
  scope: COMMUNITY_LEVEL
