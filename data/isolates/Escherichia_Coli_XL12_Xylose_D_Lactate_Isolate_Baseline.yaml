discussions:
- discussion_id: xl12_residual_glucose_uptake_and_succinate_leak
  prompt: Which alternative hexose transporters (e.g., GalP or MglBAC) and fumarate/succinate pathways (e.g., glyoxylate shunt
    or glutamate catabolism) sustain residual glucose consumption and 0.72 g/L succinate accumulation in E. coli XL12 (Δglk
    ΔptsI ΔfrdABC) during mixed-sugar fermentation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#PTS/Glk Deletion-Mediated Xylose Specialization, Relieved Carbon Catabolite Repression, and D-Lactate
    Synthesis by E. coli XL12 Monoculture
  rationale: Despite deleting ptsI, glk, and frdABC, XL12 still consumed glucose in single-sugar medium, co-utilized glucose
    alongside xylose in mixed-sugar medium, and accumulated 0.72 g/L succinate at 36 h (Fig. S6), indicating activity of non-PTS
    hexose transport/phosphorylation and non-FrdABC succinate formation.
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Formate, acetate, and ethanol were not detected in XL12 culture but 0.72 g/L succinate was detected at 36 h (
      Fig. S6 ).
    explanation: Documents the residual 0.72 g/L succinate produced by XL12 in mixed-sugar fermentation.
