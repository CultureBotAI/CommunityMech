ecological_interactions:
- name: Axenic Liquid and Soil Microcosm Prometryn Catabolism by Pseudomonas sp. ZM-1
  description: In axenic basal salt medium (BSM) containing 100 mg/L prometryn as the sole carbon source, Pseudomonas sp.
    ZM-1 peaks at 36 h with a maximum OD600 of 0.86 and achieves the highest 48-h liquid degradation rate among the three
    single isolates (97.3 ± 1.2% removal, first-order rate constant k = 0.075 h^-1, half-life t1/2 = 9.2 h, R^2 = 0.978, Table
    2). Optimal single-strain degradation occurs at 30 degrees C, pH 7, and 7% inoculum (Table 2 and Figure 3), whereas ZM-1
    exhibits narrow thermal and pH tolerance (retaining 21% of maximum degradation efficiency at 40 degrees C, 21.5% at pH
    5.0, and 34.2% at pH 9.0). In soil microcosms spiked with 20 mg/kg prometryn, ZM-1 monoculture bioaugmentation reduces
    the prometryn half-life from 58.2 days to 12.3 days (k = 0.0564 d^-1, R^2 = 0.94, 11.4 ± 1.8% residual at 30 days, Table
    6).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. ZM-1
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  biological_processes:
  - preferred_term: xenobiotic catabolic process
    term:
      id: GO:0042178
      label: xenobiotic catabolic process
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Growth curves ( Figure 2 A) showed that ZM-2 grew the fastest, reaching stationary phase at 28 h with an OD 600
      of 0.91. ZM-1 peaked at 36 h with an OD 600 of 0.86. ZM-3 grew more slowly but kept going longer, reaching its highest
      OD 600 of 0.79 at 44 h.
    explanation: Quantifies the pure-culture peak biomass (OD600 = 0.86 at 36 h) of Pseudomonas sp. ZM-1.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Looking at the degradation curves ( Figure 2 B), ZM-1 broke down 97.3% of prometryn in 48 h (k = 0.075 h −1 ,
      half-life = 9.2 h). ZM-2 degraded 85.1% in 48 h (k = 0.040 h −1 , half-life = 17.3 h). ZM-3 degraded 92.8% in 48 h (k
      = 0.055 h −1 , half-life = 12.6 h).
    explanation: Quantifies the 48-h liquid prometryn degradation efficiency (97.3%), first-order rate constant (k = 0.075
      h^-1), and half-life (9.2 h) of axenic ZM-1.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Looking at temperature effects first ( Figure 3 A), all three strains worked best at 30 °C. ZM-3 still managed
      58% degradation at 20 °C and 55% at 40 °C. In contrast, strain ZM-1 retained only 21% of its maximum degradation efficiency
      at 40 °C, compared with 24% for ZM-2. Regarding pH effects ( Figure 3 B), ZM-3 maintained 68.3% and 72.5% degradation
      at pH 5.0 and pH 9.0, respectively, whereas ZM-1 achieved only 21.5% and 34.2% under the same conditions, demonstrating
      that ZM-3 had a substantially broader tolerance to both pH and temperature fluctuations. For inoculum size, the optimal
      degradation inoculation ratios were 7% for ZM-1, 5% for ZM-2, and 5–6% for ZM-3 ( Table 2 ).
    explanation: Specifies the optimal conditions (30 °C, pH 7.0, 7% inoculum) and thermal/pH sensitivity (21% at 40 °C, 21.5%
      at pH 5.0, 34.2% at pH 9.0) of axenic ZM-1.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Treatment k (d − 1) Half-Life (d) R 2 Residual at 30 d (%) Natural control 0.0119 58.2 0.96 67.6 ± 2.1 ZM-1 0.0564
      12.3 0.94 11.4 ± 1.8 ZM-2 0.0492 14.1 0.95 17.6 ± 2.3 ZM-3 0.073 9.5 0.97 7.9 ± 1.5 Synthetic consortium 0.0889 7.8
      0.98 3.7 ± 1.2
    explanation: Reports the Table 6 soil microcosm kinetic parameters for single-strain ZM-1 (k = 0.0564 d^-1, t1/2 = 12.3
      d, R^2 = 0.94, 11.4 ± 1.8% residual at 30 d).
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain Optimal Temp (°C) Optimal pH Optimal Inoculum (%) Max OD600 Max Degradation Rate (%) k (h − 1) t1/2 (h)
      R 2 ZM-1 30 7 7 0.86 (36 h) 97.3 ± 1.2 (48 h) 0.075 9.2 0.978
    explanation: Reports the single-factor optimized culture parameters (30 °C, pH 7, 7% inoculum) and first-order kinetic
      fit (R2 = 0.978) for Pseudomonas sp. ZM-1 monoculture prometryn degradation.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: strain ZM-1 dominates mid-stage degradation with its high specific degradation activity; while the slower-growing
      but longer-persisting strain ZM-3 maintains degradation function into the late stage, extending the effective degradation
      window and avoiding intense resource competition that would occur if all strains grew synchronously.
    explanation: Establishes the mid-stage high specific prometryn degradation functional niche of Pseudomonas sp. ZM-1 that
      motivates its pairing with early-stage ZM-2 and late-stage ZM-3 in CommunityMech:000470.
