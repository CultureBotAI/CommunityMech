growth_media:
- name: Basal salt medium (BSM) supplemented with 100 mg/L prometryn
  temperature: '30'
  temperature_unit: °C
  ph: '7.0'
  shaking_speed: '160'
  shaking_speed_unit: rpm
  inoculum_size: 7%
  inoculum_unit: v/v (OD600 = 1.0 suspension, ~1 x 10^8 CFU/mL)
  incubation_time: '48'
  incubation_time_unit: h
  preparation_notes: BSM containing (per liter) NH4NO3 1.0 g, MgSO4·7H2O 0.2 g, K2HPO4 1.0 g, KH2PO4 1.0 g, NaCl 0.2 g, and
    1 mL trace element solution (pH 7.0) spiked with 100 mg/L prometryn as sole carbon source; 5% v/v standard inoculum (7%
    optimal for ZM-1) incubated at 30 °C and 160 rpm for 48 h.
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We added 10 g of contaminated soil to 100 mL of basal salt medium (BSM) with 100 mg·L −1 prometryn as the only
      carbon source. The BSM contained (per liter) NH 4 NO 3 1.0 g, MgSO 4 ·7H 2 O 0.2 g, K 2 HPO 4 1.0 g, KH 2 PO 4 1.0 g,
      NaCl 0.2 g, and 1 mL of trace element solution, pH 7.0. The culture was shaken at 30 °C and 160 rpm for 7 days.
    explanation: Specifies the BSM composition, pH 7.0, 30 °C, and 160 rpm shaking.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cell suspensions of each strain were prepared at OD 600 = 1.0 (approximately 1 × 10 8 CFU·mL −1 ), and 5% ( v
      / v ) was inoculated into BSM without prometryn for growth curves, with incubation at 30 °C and 160 rpm for 48 h and
      OD 600 measured every 4 h in triplicate; for degradation tests, BSM was spiked with prometryn to 100 mg·L −1 and inoculated
      with the same 5% inoculum, while uninoculated controls were included to assess abiotic degradation.
    explanation: Specifies the OD600 = 1.0 (~1 x 10^8 CFU/mL) inoculum preparation and 48-h degradation assay in BSM with
      100 mg/L prometryn.
