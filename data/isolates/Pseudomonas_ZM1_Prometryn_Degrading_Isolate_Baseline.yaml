id: CommunityMech:000536
name: Pseudomonas sp. ZM-1 Prometryn-Degrading Isolate Baseline
description: Single-strain axenic bacterial isolate baseline Pseudomonas sp. strain ZM-1 (NCBITaxon:286; GTDB:g__Pseudomonas;
  16S rRNA GenBank accession PV643981, 99.6% sequence similarity to Pseudomonas monteilii) isolated from long-term prometryn-contaminated
  cornfield soil in Harbin, China and evaluated alongside axenic Achromobacter sp. ZM-2 (CommunityMech:000537), axenic Stenotrophomonas
  sp. ZM-3 (CommunityMech:000538), and the 1:1:1 ZM-1/ZM-2/ZM-3 synthetic consortium (CommunityMech:000470) by Liang et al.
  2026 (PMID:42795638). In liquid basal salt medium (BSM) with 100 mg/L prometryn as the sole carbon source (30 degrees C,
  pH 7, 7% optimal inoculum), monoculture ZM-1 reaches a maximum OD600 of 0.86 at 36 h and achieves 97.3 ± 1.2% prometryn
  degradation within 48 h (first-order rate constant k = 0.075 h^-1, half-life t1/2 = 9.2 h, R^2 = 0.978, Table 2), while
  exhibiting sharp activity losses under thermal or pH extremes (retaining 21% of maximum degradation efficiency at 40 degrees
  C, 21.5% at pH 5.0, and 34.2% at pH 9.0, Figure 3). In prometryn-spiked agricultural soil microcosms (20 mg/kg), single-strain
  ZM-1 bioaugmentation reduces the herbicide half-life from 58.2 days to 12.3 days (k = 0.0564 d^-1, R^2 = 0.94) with 11.4
  ± 1.8% residual prometryn after 30 days (Table 6 and Figure 5A).
