discussions:
- discussion_id: zm1_specific_prometryn_transformation_enzymes_unresolved
  prompt: Which specific oxidoreductase or hydrolase genes in Pseudomonas sp. ZM-1 catalyze the initial transformation of
    prometryn in liquid BSM, and why does ZM-1 outperform ZM-3 in liquid culture (t1/2 = 9.2 h vs 12.6 h) yet underperform
    ZM-3 in soil microcosms (t1/2 = 12.3 d vs 9.5 d)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Axenic Liquid and Soil Microcosm Prometryn Catabolism by Pseudomonas sp. ZM-1
  rationale: PMID:42795638 demonstrates that ZM-1 achieves the fastest 48-h liquid degradation (97.3%, t1/2 = 9.2 h) under
    optimal laboratory conditions (30 °C, pH 7.0) whereas ZM-3 achieves faster soil microcosm removal (t1/2 = 9.5 d vs 12.3
    d) alongside broader temperature and pH tolerance, but targeted intermediate detection and genomic functional analysis
    were deferred to follow-up work.
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It should be explicitly noted that this pathway model remains a literature-based inference and has not been experimentally
      verified in this study; targeted intermediate detection and genomic functional analysis will be performed in our follow-up
      work.
    explanation: Explicitly notes that prometryn transformation intermediates and catabolic genes in ZM-1 remain uncharacterized.
