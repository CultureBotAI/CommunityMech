id: CommunityMech:000490
name: Ferrimicrobium acidiphilum Acidophilic Extracellular Iron Respiration Isolate
description: A single-species acidophilic actinobacterial isolate of Ferrimicrobium acidiphilum characterized by noninvasive
  in situ integrating-cavity absorption spectroscopy during aerobic respiration on extracellular ferrous ions at acidic pH,
  resolving live whole-cell cytochrome electron transfer kinetics and rates in intact turbid bacterial suspensions (doi:10.1128/aem.01906-20).
