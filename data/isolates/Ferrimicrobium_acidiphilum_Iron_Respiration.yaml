  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Intact turbid suspension of acidophilic Ferrimicrobium acidiphilum respiring aerobically on extracellular Fe(II)
    at acidic pH inside an integrating cavity absorption meter (doi:10.1128/aem.01906-20).
