    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In situ absorbance measurements were conducted on Fm. acidiphilum as it respired on extracellular iron using
      an integrating cavity absorption meter that permitted accurate optical measurements in turbid suspensions of the intact
      bacterium under physiological conditions.
    explanation: Establishes whole-cell aerobic respiration of Ferrimicrobium acidiphilum on extracellular ferrous iron.
  - reference: doi:10.1128/aem.01906-20
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The significance of these measurements is that they permitted a direct spectrophotometric examination of the
      extents and rates of biological electron transfer events in situ under noninvasive physiological conditions without
      disrupting the complexity of the live cellular environment.
    explanation: Documents direct in situ quantification of extracellular iron-respiratory electron transfer extents and rates
      in live Fm. acidiphilum.
ecological_interactions:
- name: Extracellular Ferrous Iron Oxidation and Whole-Cell Cytochrome Reduction
  description: Intact Ferrimicrobium acidiphilum cells oxidize extracellular ferrous ions (Fe2+) to ferric ions (Fe3+) at
    acidic pH via direct electron transfer into redox-active cellular cytochromes.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
