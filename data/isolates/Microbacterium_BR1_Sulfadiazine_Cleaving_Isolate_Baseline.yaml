ecological_interactions:
- name: Ipso-Substitution Sulfadiazine Cleavage and Dead-End 2-Aminopyrimidine Accumulation by Axenic Microbacterium BR1
  description: In axenic MSM Brunner culture containing 1.0 ± 0.1 mM 13C,15N-diazine-labeled sulfadiazine, Microbacterium
    sp. strain BR1 completely degraded sulfadiazine within 2 days (0.0 mM SDZ at Day 2 and Day 4, Table 1) by subsisting on
    the 4-AP moiety released via ipso-substitution, while accumulating 1.0 ± 0.1 mM 2-aminopyrimidine (2-AP) as a dead-end
    metabolite that persisted through Day 4. Single-cell Raman microspectroscopy confirmed that no isotope-induced Raman band
    shift was detected for Microbacterium BR1 (Figure 2b), showing that BR1 does not assimilate carbon from the labeled 2-AP
    ring.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Microbacterium sp. BR1
    term:
      id: NCBITaxon:1070896
      label: Microbacterium sp. BR1
  metabolites:
  - preferred_term: sulfadiazine
    term:
      id: CHEBI:9328
      label: sulfadiazine
  - preferred_term: 2-aminopyrimidine
    term:
      id: CHEBI:38618
      label: pyrimidin-2-amine
  biological_processes:
  - preferred_term: xenobiotic catabolic process
    term:
      id: GO:0042178
      label: xenobiotic catabolic process
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Axenic cultures of Microbacterium led to the entire degradation of sulfadiazine with concomitant accumulation
      of 2-AP within 2 days, while axenic cultures of Terrabacter left SDZ unaltered after 4 days.
    explanation: Demonstrates complete SDZ degradation within 2 days and concomitant 2-AP accumulation in the axenic Microbacterium
      BR1 culture.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although, the sulfadiazine biodegradation kinetics was faster in Microbacterium cultures, there was accumulation
      of 2-AP as dead-end product.
    explanation: Confirms that 2-AP accumulates as an unassimilated dead-end product in axenic Microbacterium BR1 culture.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No isotope-induced Raman band shift was detected for Microbacterium BR1
    explanation: Provides single-cell Raman isotope evidence that Microbacterium BR1 does not assimilate carbon from the [13C,15N3]-labeled
      2-AP ring.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microbacterium is capable of degrading SDZ and accumulating 2-amino-5-pyrimidine (2-AP) as a dead-end metabolite,
      while Terrabacter further hydroxylates, cleaves the aromatic ring, and mineralizes 2-AP.
    explanation: Contrasts Microbacterium sp. BR1 ipso-substitution cleavage of sulfadiazine (SDZ) with dead-end accumulation
      of 2-AP against downstream ring cleavage and mineralization by Terrabacter.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The faster decrease in the population of Terrabacter than that of Microbacterium can be explained by the fact
      that Terrabacter alone was not able to feed on SDZ molecule, while Microbacterium BR1 subsisted on 4-AP moiety of SDZ.
    explanation: Demonstrates that axenic Microbacterium sp. BR1 subsists on the cleaved 4-aminophenol (aniline) moiety of
      sulfadiazine while leaving 2-aminopyrimidine unmineralized.
