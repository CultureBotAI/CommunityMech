    Microbacterium BR1
  rationale: PMID:42598292 observed that Microbacterium abundance declined more slowly from Day 2 to Day 4 in coculture than
    in axenic Microbacterium culture, suggesting a potential protective effect of Terrabacter through removal of accumulated
    2-AP.
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, from day 2 to day 4, Microbacterium abundance declined more slowly in the coculture than in the axenic
      Microbacterium culture, suggesting a potential protective effect of Terrabacter through the removal of 2-AP.
    explanation: Documents the faster decline of Microbacterium abundance in axenic culture where 2-AP accumulates compared
      with coculture.
