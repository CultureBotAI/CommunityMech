id: CommunityMech:000531
name: Microbacterium sp. BR1 Sulfadiazine-Cleaving Isolate Baseline
description: Single-strain axenic bacterial isolate baseline Microbacterium sp. strain BR1 (NCBITaxon:1070896; GTDB:s__Microbacterium_lacus)
  evaluated in vitamin-supplemented Mineral Salts Medium (MSM Brunner) containing 1 mM 13C,15N-diazine-labeled sulfadiazine
  (SDZ) at 28 degrees C alongside axenic Terrabacter sp. 2APm3 (CommunityMech:000532) and the Microbacterium-Terrabacter coculture
  (CommunityMech:000462) by Xue et al. 2026 (PMID:42598292). In axenic BR1 culture, 1.0 ± 0.1 mM SDZ was completely degraded
  within 2 days (0.0 mM SDZ at Day 2 and Day 4) via ipso-substitution cleavage and assimilation of the 4-AP aniline moiety,
  with concomitant accumulation of 1.0 ± 0.1 mM 2-aminopyrimidine (2-AP) as a dead-end metabolite at Day 2 and Day 4 (Table
  1). Single-cell Raman microspectroscopy confirmed that no isotope-induced Raman band shift was detected for Microbacterium
  BR1 (Figure 2b) while flow cytometry measured a cell count change from 1067 ± 206 cells/μL (Day 0) to 832 ± 89 cells/μL
  (Day 2).
