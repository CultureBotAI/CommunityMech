  - target: Acetate-Stimulated Resting-Cell Chromate Reduction
    description: Intrinsic aerobic Cr(VI) resistance (MIC 17 mmol/L) and chromate reductase activity enable non-growing resting
      cells of strain Q5-1 to reduce Cr(VI) across multiple carbon sources, maximally stimulated by 1 mmol/L acetate.
  evidence:
  - reference: PMID:21441371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A gram-positive, aerobic actinobacterium with high chromate [Cr(VI)]-reducing ability, designated strain Q5-1(T),
      was isolated from manganese mining soil in Hunan Province, central-south China.
    explanation: Establishes the isolation and high aerobic Cr(VI)-reducing activity of Intrasporangium chromatireducens strain
      Q5-1(T).
  - reference: doi:10.1007/s11274-009-0047-x
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This bacterium has high Cr(VI) resistance with a MIC of 17 mmol l⁻¹ and is able to reduce Cr(VI) aerobically.
      The best condition of Cr(VI) reduction for Q5-1 is pH 8.0 at 37°C.
    explanation: Quantifies Cr(VI) resistance (MIC 17 mmol/L) and optimal aerobic Cr(VI) reduction conditions (pH 8.0 at 37
      degrees C) in free Q5-1 cells.
  - reference: doi:10.1007/s11274-009-0047-x
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain Q5-1 is also able to reduce Cr(VI) in resting (non-growth) conditions using a variety of carbon sources
      as well as in the absence of a carbon source. Acetate (1 mmol l⁻¹) is the most efficient carbon source for stimulating
      Cr(VI) reduction.
    explanation: Supports the downstream transition from aerobic free-cell Cr(VI) reduction to acetate-stimulated resting-cell
      Cr(VI) reduction.
- name: Acetate-Stimulated Resting-Cell Chromate Reduction
  description: Non-growing resting cells of Intrasporangium chromatireducens Q5-1 reduce toxic Cr(VI) into insoluble Cr(III)
    both without an exogenous carbon source and across multiple carbon substrates, with 1 mmol/L acetate serving as the most
    efficient electron donor for stimulating Cr(VI) reduction.
