  downstream:
  - target: Immobilized Compounding-Bead Chromate Bioremediation in Continuous Systems
    description: Sustained resting-cell Cr(VI) reduction activity allows Q5-1 cells to be embedded in PVA-alginate-carbon-diatomite
      compounding beads that retain free-cell Cr(VI) reduction rates for reusable continuous-system wastewater treatment.
  evidence:
  - reference: doi:10.1007/s11274-009-0047-x
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain Q5-1 is also able to reduce Cr(VI) in resting (non-growth) conditions using a variety of carbon sources
      as well as in the absence of a carbon source. Acetate (1 mmol l⁻¹) is the most efficient carbon source for stimulating
      Cr(VI) reduction.
    explanation: Demonstrates resting-cell Cr(VI) reduction and maximal stimulation by 1 mmol/L acetate.
  - reference: doi:10.1007/s11274-009-0047-x
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Q5-1 cells embedded with compounding beads containing 4% PVA, 3% sodium alginate, 1.5% active carbon and 3% diatomite
      showed a similar Cr(VI) reduction rates to that of free cells. In addition, the immobilized Q5-1 cells have the advantages
      over free cells in being more stable, easier to re-use and minimal clogging in continuous systems.
    explanation: Supports the downstream application of non-growing Q5-1 cells immobilized in compounding beads for continuous-system
      Cr(VI) removal.
