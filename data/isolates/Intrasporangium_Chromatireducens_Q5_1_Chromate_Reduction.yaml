id: CommunityMech:000492
name: Intrasporangium chromatireducens Q5-1 Chromate Reduction Isolate
description: Gram-positive, aerobic chromate-reducing actinobacterium Intrasporangium chromatireducens sp. nov. strain Q5-1
  isolated from manganese/chromium-contaminated mining soil in Hunan Province, central-south China. Strain Q5-1 exhibits high
  hexavalent chromium resistance (MIC of 17 mmol/L) and reduces toxic Cr(VI) into insoluble trivalent Cr(III) aerobically
  (optimal at pH 8.0 and 37 degrees C), in resting cells with 1 mmol/L acetate stimulation, and when immobilized in compounding
  beads containing 4% PVA, 3% sodium alginate, 1.5% active carbon, and 3% diatomite (PMID:21441371, doi:10.1007/s11274-009-0047-x).
ecological_state: STABLE
community_origin: NATURAL
community_category: BIOREMEDIATION
environment_term:
  preferred_term: contaminated soil
  term:
    id: ENVO:00002116
    label: contaminated soil
  notes: Manganese and chromium-contaminated mining soil in Hunan Province, central-south China, from which chromate-reducing
    strain Q5-1 was isolated (PMID:21441371, doi:10.1007/s11274-009-0047-x).
