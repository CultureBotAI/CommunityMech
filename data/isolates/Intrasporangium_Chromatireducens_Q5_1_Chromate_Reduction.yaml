  description: Immobilization of Intrasporangium chromatireducens Q5-1 in compounding beads (4% PVA, 3% sodium alginate, 1.5%
    active carbon, and 3% diatomite) maintains Cr(VI) reduction rates comparable to free cells while improving stability and
    reuse in continuous wastewater treatment.
