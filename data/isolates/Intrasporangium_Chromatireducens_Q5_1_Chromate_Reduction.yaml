    notes: Gram-positive, aerobic chromate-reducing actinobacterium isolated from manganese mining soil in Hunan Province,
      China; reduces Cr(VI) aerobically with a MIC of 17 mmol/L and optimal activity at pH 8.0 and 37 degrees C (PMID:21441371,
