  prompt: What molecular targets in the S. oneidensis MR-1 membrane or MtrCAB/OmcA pathway account for the 61.62-fold drop
    in MFC power density under 1.8% (v/v) ethanol while retaining 15.4 mg L^-1 baseline NCM leaching over 14 days?
