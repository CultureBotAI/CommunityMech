id: CommunityMech:000524
name: Shewanella oneidensis MR-1 SO1 Brewing-Wastewater NCM Bioleaching Isolate Baseline
description: Single-strain electrogenic bacterial isolate baseline Shewanella oneidensis MR-1 SO1 (wild-type S. oneidensis
  MR-1 carrying empty vector pHG13, Cmr) evaluated as the monoculture metal-reducing baseline alongside Bacillus subtilis
  BS1 monoculture (CommunityMech:000525) and the engineered SO1-BS1 division-of-labor consortium (CommunityMech:000519) for
  spent LiNixCoyMn1-x-yO2 (NCM) lithium-ion battery cathode bioleaching in Moutai brewing wastewater by Zhang et al. 2026
  (PMID:42733304). Because raw Moutai brewing wastewater contains 1.8% (v/v) residual ethanol alongside lactate as electron
  donor, S. oneidensis EET maximum power density was inhibited 61.62-fold in the presence of 1.8% (v/v) ethanol (2.08 mW m^-2
  vs 128.20 mW m^-2 without ethanol); in 14-day anaerobic brewing-wastewater NCM bioleaching assays (0.2 g L^-1 black mass,
  30 degrees C), strain SO1 alone achieved a maximum power density of 3.10 mW m^-2 and catalyzed 15.4 mg L^-1 total dissolved
  Li, Ni, Co, and Mn leaching (compared with 3.4 mg L^-1 for cell-free brewing wastewater, 3.8 mg L^-1 for BS1 monoculture,
  and 50.7 mg L^-1 for the ethanol-detoxifying SO1-BS1 coculture).
