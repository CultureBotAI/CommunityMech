  - ecological_interactions#Baseline Brewing-Wastewater NCM Cathode Metal Oxide Leaching by SO1 Monoculture
  rationale: PMID:42733304 quantified the 61.62-fold reduction in S. oneidensis MFC power density in 1.8% (v/v) ethanol (2.08
    vs 128.20 mW m^-2) and the 15.4 mg L^-1 monoculture NCM leaching yield of SO1 in brewing wastewater (3.10 mW m^-2), motivating
    co-cultivation with ethanol-oxidizing B. subtilis BS1, but did not dissect the intracellular vs membrane-level mechanism
    of ethanol toxicity in SO1.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results revealed that the EET rate, as measured by the maximum power density of a microbial fuel cell, was
      only 2.08 mW m−2 in the presence of ethanol (1.8% v/v) (Figure 1b ).
    explanation: Documents the severe ethanol inhibition of S. oneidensis EET in monoculture.
