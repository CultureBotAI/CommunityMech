ecological_interactions:
- name: Ethanol-Inhibited Extracellular Electron Transfer of S. oneidensis SO1 in Brewing Wastewater
  description: 'Although Moutai brewing wastewater contains lactate as electron donor for Shewanella oneidensis MR-1, its
    1.8% (v/v) residual ethanol strongly inhibits S. oneidensis growth and extracellular electron transfer: in microbial fuel
    cell assays, 1.8% (v/v) ethanol lowered S. oneidensis maximum power density 61.62-fold to 2.08 mW m^-2 compared with 128.20
    mW m^-2 in ethanol-free medium (Figure 1b), and strain SO1 monoculture in brewing wastewater achieved a maximum power
    density of only 3.10 mW m^-2 (34.47-fold lower than the SO1-BS1 coculture at 116.15 mW m^-2, Figure 2c).'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Shewanella oneidensis MR-1 SO1
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
  metabolites:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results revealed that the EET rate, as measured by the maximum power density of a microbial fuel cell, was
      only 2.08 mW m−2 in the presence of ethanol (1.8% v/v) (Figure 1b ). In contrast, in the absence of ethanol, the maximum
      power density of S. oneidensis was 128.20 mW m−2 (Figure 1b ), which was 61.62‐fold higher than the maximum power density
      observed in the presence of ethanol.
    explanation: Quantifies the 61.62-fold inhibition of S. oneidensis EET maximum power density by 1.8% (v/v) ethanol (2.08
      vs 128.20 mW m^-2).
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, the maximum power density of the SO1‐BS1 consortium reached 116.15 mW m−2, representing 34.47‐ and
      92.92‐fold increases compared to that observed in strain SO1 (3.10 mW m−2) and BS1 (1.25 mW m−2), respectively (Figure
      2c )
    explanation: Quantifies the 3.10 mW m^-2 maximum power density of strain SO1 monoculture in Moutai brewing wastewater.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings clearly demonstrated that the residual ethanol in the brewing wastewater dramatically hindered
      EET of S. oneidensis, which would constrain its capacity to catalyze the brewing wastewater‐mediated reduction of NCM
      for the purpose of metal oxide leaching.
    explanation: Directly links residual ethanol inhibition of S. oneidensis EET to its constrained monoculture NCM bioleaching
      capacity.
- name: Baseline Brewing-Wastewater NCM Cathode Metal Oxide Leaching by SO1 Monoculture
  description: In 14-day anaerobic bottle bioleaching assays with 0.2 g L^-1 spent NCM cathode black mass in Moutai brewing
    wastewater at 30 degrees C, strain SO1 monoculture catalyzed 15.4 mg L^-1 total dissolved Li, Ni, Co, and Mn leaching,
    exceeding cell-free brewing wastewater (3.4 mg L^-1) and BS1 monoculture (3.8 mg L^-1) but remaining 3.29-fold lower than
    the ethanol-detoxifying SO1-BS1 coculture (50.7 mg L^-1, Figure 2d).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Shewanella oneidensis MR-1 SO1
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
  metabolites:
  - preferred_term: lithium(1+)
    term:
      id: CHEBI:49713
      label: lithium(1+)
  - preferred_term: nickel(2+)
    term:
      id: CHEBI:49786
      label: nickel(2+)
  - preferred_term: cobalt(2+)
    term:
      id: CHEBI:48828
      label: cobalt(2+)
  - preferred_term: manganese(2+)
    term:
      id: CHEBI:29035
      label: manganese(2+)
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In comparison to the other groups, including treating NCM using the brewing wastewater only (3.4 mg L−1 total
      leached metal ion), the brewing wastewater‐mediated reduction of NCM catalyzed by strain SO1 alone (15.4 mg L−1 total
      leached metal ion), and the brewing wastewater‐mediated reduction of NCM catalyzed by strain BS1 alone (3.8 mg L−1 total
      leached metal ion) (Figure 2d ), the total leached metal ions by the SO1‐BS1 consortium increased by 14.91‐, 3.29‐,
      and 13.34‐fold, respectively.
    explanation: Quantifies the 15.4 mg L^-1 total leached metal ion yield of strain SO1 alone relative to cell-free brewing
      wastewater (3.4 mg L^-1), BS1 alone (3.8 mg L^-1), and SO1-BS1 (50.7 mg L^-1).
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The presence of S. oneidensis resulted in an increase in the concentration of total leached metal ions to 15.4
      mg L−1 (Figure  1a ), a 4.53‐fold increase compared to the control group, which involved metal oxide leaching from NCM
      using only the brewing wastewater (3.4 mg L−1).
    explanation: Quantifies the 4.53-fold increase in total leached metal ions (15.4 vs 3.4 mg L^-1) achieved by S. oneidensis
      SO1 monoculture over abiotic brewing wastewater.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings revealed that S. oneidensis overcame reaction barriers and thus initiated and enhanced the reduction
      of NCM by the brewing wastewater, facilitating metal oxide leaching.
    explanation: Confirms that S. oneidensis SO1 monoculture overcomes reaction barriers to initiate and enhance brewing-wastewater-mediated
      reduction of NCM.
environmental_factors:
- name: Moutai brewing wastewater lactate electron donor and 1.8% (v/v) residual ethanol
  value: lactate electron donor and 1.8% (v/v) ethanol
  description: Raw Moutai brewing wastewater used as the bioleaching medium contained lactate as the electron donor for S.
    oneidensis and 1.8% (v/v) residual ethanol, which lowered S. oneidensis EET maximum power density 61.62-fold (to 2.08
    mW m^-2) and limited SO1 monoculture NCM leaching to 15.4 mg L^-1.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Principal component analysis determined that the brewing wastewater used in this study contained 1.8% ethanol
      by volume.
    explanation: Quantifies the 1.8% (v/v) residual ethanol content in the Moutai brewing wastewater medium.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To verify this hypothesis, the metal‐reducing bacterium S. oneidensis MR‐1 was adopted to catalyze the reduction
      of NCM using brewing wastewater as the reductant, in which S. oneidensis consumed lactate as the electron donor and
      reduced NCM anaerobically via extracellular electron transfer (EET).
    explanation: Establishes that S. oneidensis MR-1 consumes lactate in the brewing wastewater as the electron donor to reduce
      NCM via EET.
