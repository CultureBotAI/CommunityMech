id: CommunityMech:000530
name: Bacillus subtilis 168 BS0 Brewing-Wastewater Wild-Type Isolate Baseline
description: Single-strain bacterial isolate baseline Bacillus subtilis 168 BS0 (wild-type B. subtilis 168 ATCC33234 carrying
  empty vector plasmid pCE2, Cmr) evaluated as the unengineered parental control for growth and residual ethanol removal in
  Moutai brewing wastewater (containing 1.8% v/v ethanol) against P43::adh-aldH-engineered strain BS1 (CommunityMech:000525)
  and the SO1-BS1 consortium (CommunityMech:000519) by Zhang et al. 2026 (PMID:42733304). Over 48 h in Moutai brewing wastewater
  at 30 degrees C, strain BS0 reached a maximum cell density (OD600,max) of 0.641 (compared with 0.884 for engineered strain
  BS1, Figure 2a) and removed only approximately 35.6% of residual ethanol, lowering ethanol from 1.8% to 1.16% (v/v) (compared
  with 99.4% removal to 0.01% v/v by BS1 and 97.6% removal by SO1-BS1, Figure 2b).
