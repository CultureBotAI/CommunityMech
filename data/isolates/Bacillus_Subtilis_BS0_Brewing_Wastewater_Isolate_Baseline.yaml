discussions:
- discussion_id: bs0_unengineered_consortium_leaching_omission
  prompt: What would be the residual EET power density and 14-day NCM metal leaching yield of an unengineered SO1-BS0 co-culture
    in Moutai brewing wastewater when ethanol is only lowered from 1.8% to 1.16% (v/v) by wild-type B. subtilis BS0?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Incomplete Native Ethanol Catabolism and Growth of Wild-Type B. subtilis BS0 in Brewing Wastewater
  rationale: Section 2.2 of PMID:42733304 benchmarked BS0 against BS1 for 48-h growth and ethanol removal (Figure 2a,b), and
    then proceeded directly to assemble the engineered SO1-BS1 consortium without testing an unengineered SO1-BS0 co-culture
    in MFC or NCM leaching assays.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, the wild‐type strain BS0 removed only approximately 35.6% of ethanol within 48 h, lowering the ethanol
      concentration from 1.8% to 1.16% (v/v) (Figure 2b ).
    explanation: Shows that BS0 leaves 1.16% (v/v) ethanol in brewing wastewater after 48 h, motivating direct progression
      to BS1 for consortium assembly.
