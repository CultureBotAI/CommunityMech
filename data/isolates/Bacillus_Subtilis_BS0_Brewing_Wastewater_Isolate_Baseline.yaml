ecological_interactions:
- name: Incomplete Native Ethanol Catabolism and Growth of Wild-Type B. subtilis BS0 in Brewing Wastewater
  description: When cultivated as a single-strain monoculture in Moutai brewing wastewater containing 1.8% (v/v) residual
    ethanol, wild-type Bacillus subtilis 168 strain BS0 reached a lower maximum cell density (OD600,max of 0.641 vs 0.884
    in P43::adh-aldH-engineered strain BS1, Figure 2a) and removed only approximately 35.6% of ethanol within 48 h, lowering
    the ethanol concentration from 1.8% to 1.16% (v/v) (compared with 99.4% removal to 0.01% v/v by strain BS1 and 97.6% removal
    by the SO1-BS1 consortium, Figure 2b).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus subtilis 168 BS0
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  metabolites:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When cultivated with the brewing wastewater, strain BS1 achieved a higher maximum cell density (OD600, max of
      0.884), while the wild‐type B. subtilis (BS0, Table 1 ) exhibited OD600, max of 0.641 (Figure 2a ).
    explanation: Quantifies the maximum cell density (OD600,max = 0.641) of wild-type B. subtilis BS0 in brewing wastewater.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, the wild‐type strain BS0 removed only approximately 35.6% of ethanol within 48 h, lowering the ethanol
      concentration from 1.8% to 1.16% (v/v) (Figure 2b ).
    explanation: Quantifies the 35.6% ethanol removal (from 1.8% to 1.16% v/v over 48 h) by wild-type strain BS0.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cell growth profiles of the wild‐type strain B. subtilis 168 (BS0) and the recombinant B. subtilis 168 (BS1)
      that overexpressed alcohol dehydrogenase Adh and aldehyde dehydrogenase AldH.
    explanation: Documents the Figure 2a experimental comparison of wild-type Bacillus subtilis 168 (BS0) cell growth in brewing
      wastewater against Adh-AldH strain BS1.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Volume fraction of ethanol in brewing wastewater treated with the strain BS0, strain BS1, and the SO1‐BS1 consortium.
    explanation: Documents the Figure 2b experimental measurement of residual ethanol volume fraction in brewing wastewater
      treated with wild-type strain BS0.
