ecological_interactions:
- name: FOS-Dependent Growth and Butyrate/Lactate Fermentation Without Direct 2′-FL Utilization by F. prausnitzii A2-165 Monoculture
  description: In 24-h anaerobic YCFA− monocultures supplemented with 0.5% (w/v) total carbohydrate across varying 2′-FL/FOS
    weight ratios (Figure 1), Faecalibacterium prausnitzii A2-165 did not grow when 2′-fucosyllactose (100% 2′-FL) was supplied
    as the sole carbohydrate source and produced no detectable lactate or butyrate (Figure 1a,b,d). In contrast, across FOS-containing
    mixtures (0–90% 2′-FL, corresponding to 100–10% FOS), F. prausnitzii A2-165 grew and produced both butyrate and lactate
    (Figure 1a,b,d), while acetate production was limited under all the conditions (Figure 1c) in the VFA-free YCFA− basal
    medium.
