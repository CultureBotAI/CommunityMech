  rationale: Although F. prausnitzii is classically stimulated by exogenous acetate, Figure 1d shows that F. prausnitzii A2-165
    monoculture produced measurable butyrate and lactate from 0–90% 2′-FL (100–10% FOS) in VFA-free YCFA− medium with limited
    net acetate accumulation (Figure 1c), prior to receiving B. bifidum-derived acetate in coculture.
