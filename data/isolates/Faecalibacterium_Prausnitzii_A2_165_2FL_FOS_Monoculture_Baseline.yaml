id: CommunityMech:000546
name: Faecalibacterium prausnitzii A2-165 2'-FL/FOS Anaerobic Monoculture Baseline
description: Single-strain anaerobic gut bacterial monoculture baseline Faecalibacterium prausnitzii A2-165 (JCM31915; NCBITaxon:853)
  evaluated across 2′-fucosyllactose (2′-FL) and fructooligosaccharide (FOS) weight ratios at a fixed total carbohydrate concentration
  of 0.5% (w/v) in sugar- and volatile-fatty-acid-free YCFA− broth (808 μL final volume in 48-well plates, 37 °C, 24 h anaerobic
  incubation) alongside Bifidobacterium bifidum JCM1254 monoculture (CommunityMech:000545) and the B. bifidum–F. prausnitzii
  coculture (CommunityMech:000401) by Iguchi et al. 2026 (PMID:42655156). In monoculture (Figure 1), F. prausnitzii A2-165
  did not grow when 2′-FL was provided as the sole carbohydrate source (100% 2′-FL), whereas growth (OD600), lactate production,
  and butyrate production occurred across mixed substrates containing 0–90% 2′-FL (100–10% FOS, Figure 1a,b,d) with limited
  acetate production under all conditions (Figure 1c).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Determine the monoculture growth and butyrate/lactate/acetate fermentation profile of the human gut commensal
    Faecalibacterium prausnitzii A2-165 across varying 2′-FL/FOS weight ratios to establish its direct FOS utilization and
    inability to grow on sole 2′-FL.
  assembly_strategy: Revive F. prausnitzii A2-165 (JCM31915) on glucose-supplemented YCFA medium, wash twice in sugar- and
    VFA-free YCFA− medium, adjust OD600 to 1.0, and inoculate 8 μL into 800 μL of 2′-FL/FOS-supplemented YCFA− medium in 48-well
    microplates.
  perturbation_design: Vary the weight ratio of 2′-fucosyllactose (2′-FL) to fructooligosaccharides (FOS) from 0:100 to 100:0
    while maintaining total carbohydrate at 0.5% (w/v), alongside a no-substrate negative control, under 24-h anaerobic incubation
    at 37 °C.
  measurement_endpoints:
  - OD600 at 600 nm after 24 h anaerobic incubation
  - lactate, acetate, and butyrate concentrations by post-column bromothymol blue HPLC
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: F. prausnitzii did not grow when 2′-FL was provided as the sole carbohydrate source (100% 2′-FL). In contrast,
      growth was observed in media containing mixed substrates with 0–90% 2′-FL, corresponding to 100–10% FOS (Figure 1a).
    explanation: Documents the monoculture assay and the inability of F. prausnitzii A2-165 to grow on 100% 2′-FL vs growth
      on 0–90% 2′-FL (100–10% FOS).
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lactate and butyrate were detected only under substrate conditions containing 0–90% 2′-FL, in which growth of
      F. prausnitzii was also observed ( Figure 1 b,d).
    explanation: Documents FOS-dependent lactate and butyrate synthesis across 0–90% 2′-FL (100–10% FOS) in F. prausnitzii
      A2-165 monoculture.
