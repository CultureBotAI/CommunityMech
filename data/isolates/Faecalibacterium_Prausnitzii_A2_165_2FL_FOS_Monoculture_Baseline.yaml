    snippet: Acetate production was limited under all the conditions ( Figure 1 c). Lactate and butyrate were detected only
      under substrate conditions containing 0–90% 2′-FL, in which growth of F. prausnitzii was also observed ( Figure 1 b,d).
    explanation: Documents monoculture butyrate and lactate formation alongside limited acetate in VFA-free YCFA− medium.
