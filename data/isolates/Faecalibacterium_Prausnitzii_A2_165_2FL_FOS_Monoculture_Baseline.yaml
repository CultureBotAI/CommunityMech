  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: F. prausnitzii did not grow when 2′-FL was provided as the sole carbohydrate source (100% 2′-FL). In contrast,
      growth was observed in media containing mixed substrates with 0–90% 2′-FL, corresponding to 100–10% FOS (Figure 1a).
    explanation: Demonstrates absence of F. prausnitzii A2-165 monoculture growth on 100% 2′-FL and growth across 0–90% 2′-FL
      (100–10% FOS).
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lactate and butyrate were detected only under substrate conditions containing 0–90% 2′-FL, in which growth of
      F. prausnitzii was also observed ( Figure 1 b,d).
    explanation: Demonstrates lactate and butyrate synthesis by F. prausnitzii A2-165 monoculture across 0–90% 2′-FL (100–10%
      FOS) and zero synthesis on 100% 2′-FL.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Acetate production was limited under all the conditions ( Figure 1 c).
    explanation: Documents limited acetate accumulation across all 2′-FL/FOS ratios in F. prausnitzii A2-165 monoculture.
environmental_factors:
- name: 2′-FL/FOS carbohydrate ratio response of F. prausnitzii A2-165 monoculture
  value: No growth or butyrate on 100% 2′-FL; active growth, butyrate, and lactate across 0–90% 2′-FL (100–10% FOS)
  description: F. prausnitzii A2-165 monoculture required at least 10% FOS (0–90% 2′-FL within 0.5% w/v carbohydrate) for
    growth and butyrate/lactate formation, and was unable to grow on sole 2′-FL.
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In monoculture, F. prausnitzii grew under FOS-containing conditions, and B. bifidum growth increased as the proportion
      of 2′-FL increased.
    explanation: Summarizes the FOS requirement for F. prausnitzii A2-165 monoculture growth.
