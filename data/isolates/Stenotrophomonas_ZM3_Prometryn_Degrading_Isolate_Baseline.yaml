growth_media:
- name: Basal salt medium (BSM) supplemented with 100 mg/L prometryn
  temperature: 30-32
  temperature_unit: °C
  ph: 6.5-7.5
  shaking_speed: '160'
  shaking_speed_unit: rpm
  inoculum_size: 5-6%
  inoculum_unit: v/v (OD600 = 1.0 suspension, ~1 x 10^8 CFU/mL)
  incubation_time: '48'
  incubation_time_unit: h
  preparation_notes: BSM supplemented with 100 mg/L prometryn as sole carbon source; optimal ZM-3 degradation at 30–32 °C,
    pH 6.5–7.5, and 5–6% inoculum, maintaining >55% activity across 20–40 °C and >68% across pH 5.0–9.0.
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We added 10 g of contaminated soil to 100 mL of basal salt medium (BSM) with 100 mg·L −1 prometryn as the only
      carbon source. The BSM contained (per liter) NH 4 NO 3 1.0 g, MgSO 4 ·7H 2 O 0.2 g, K 2 HPO 4 1.0 g, KH 2 PO 4 1.0 g,
      NaCl 0.2 g, and 1 mL of trace element solution, pH 7.0. The culture was shaken at 30 °C and 160 rpm for 7 days.
    explanation: Specifies the BSM composition and prometryn supplementation.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For inoculum size, the optimal degradation inoculation ratios were 7% for ZM-1, 5% for ZM-2, and 5–6% for ZM-3
      ( Table 2 ).
    explanation: Specifies the optimal 5–6% inoculum condition for ZM-3.
