id: CommunityMech:000538
name: Stenotrophomonas sp. ZM-3 Prometryn-Degrading Isolate Baseline
description: Single-strain axenic bacterial isolate baseline Stenotrophomonas sp. strain ZM-3 (NCBITaxon:40323; GTDB:g__Stenotrophomonas;
  16S rRNA GenBank accession PZ433558, 99.5% sequence similarity to Stenotrophomonas maltophilia), reported by Liang et al.
  2026 (PMID:42795638) as the first pure-culture Stenotrophomonas isolate with confirmed prometryn-degrading capability and
  evaluated alongside axenic Pseudomonas sp. ZM-1 (CommunityMech:000536), axenic Achromobacter sp. ZM-2 (CommunityMech:000537),
  and the 1:1:1 ZM-1/ZM-2/ZM-3 synthetic consortium (CommunityMech:000470). In liquid basal salt medium (BSM) with 100 mg/L
  prometryn as the sole carbon source (30–32 degrees C, pH 6.5–7.5, 5–6% optimal inoculum), monoculture ZM-3 reaches a maximum
  OD600 of 0.79 at 44 h and degrades 92.8 ± 1.1% of prometryn within 48 h (first-order rate constant k = 0.055 h^-1, half-life
  t1/2 = 12.6 h, R^2 = 0.969, Table 2) while displaying markedly broader temperature and pH adaptability than ZM-1 or ZM-2
  (retaining 58% and 55% degradation at 20 degrees C and 40 degrees C, and 68.3% and 72.5% at pH 5.0 and pH 9.0, Figure 3A-B).
  Consistent with its broad environmental tolerance, ZM-3 achieves the strongest single-strain prometryn removal in spiked
  agricultural soil microcosms (20 mg/kg), reducing the herbicide half-life from 58.2 days to 9.5 days (k = 0.073 d^-1, R^2
  = 0.97) with 92.1 ± 1.5% removal (7.9 ± 1.5% residual) after 30 days (Table 6 and Figure 5A).
