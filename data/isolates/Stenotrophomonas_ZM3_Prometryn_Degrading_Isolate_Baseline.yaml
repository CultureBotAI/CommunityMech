  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain ZM-3 degrades 92.8% of prometryn within 48 h and maintains high activity across pH 5.0–9.0 and 20–40 °C.
    explanation: Summarizes the 92.8% 48-h prometryn degradation efficiency and broad pH (5.0–9.0) and temperature (20–40
      °C) tolerance of axenic Stenotrophomonas sp. ZM-3.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Looking at temperature effects first ( Figure 3 A), all three strains worked best at 30 °C. ZM-3 still managed
      58% degradation at 20 °C and 55% at 40 °C. In contrast, strain ZM-1 retained only 21% of its maximum degradation efficiency
      at 40 °C, compared with 24% for ZM-2. Regarding pH effects ( Figure 3 B), ZM-3 maintained 68.3% and 72.5% degradation
      at pH 5.0 and pH 9.0, respectively, whereas ZM-1 achieved only 21.5% and 34.2% under the same conditions, demonstrating
      that ZM-3 had a substantially broader tolerance to both pH and temperature fluctuations.
    explanation: Quantifies the temperature (58% at 20 °C; 55% at 40 °C) and pH (68.3% at pH 5.0; 72.5% at pH 9.0) tolerance
      of axenic ZM-3.
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In soil with 20 mg·kg −1 of prometryn, the natural control broke down very slowly. Its half-life was 58.2 days,
      and only 32.4% ± 2.1% was gone after 30 days. Adding single strains speeded things up, with ZM-3 working the best—half-life
      dropped to 9.5 days, and 92.1% ± 1.5% was removed.
    explanation: Demonstrates that ZM-3 achieves the fastest single-strain soil microcosm prometryn degradation (t1/2 = 9.5
      d, 92.1 ± 1.5% removal at 30 d).
