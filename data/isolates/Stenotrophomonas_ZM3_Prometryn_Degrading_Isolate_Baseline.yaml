ecological_interactions:
- name: Broad-Tolerance Axenic Liquid and Soil Microcosm Prometryn Catabolism by Stenotrophomonas sp. ZM-3
  description: In axenic basal salt medium (BSM) containing 100 mg/L prometryn as the sole carbon source, Stenotrophomonas
    sp. ZM-3 reaches a maximum OD600 of 0.79 at 44 h and degrades 92.8 ± 1.1% of prometryn within 48 h (first-order rate constant
    k = 0.055 h^-1, half-life t1/2 = 12.6 h, R^2 = 0.969, Table 2). Unlike ZM-1 and ZM-2, ZM-3 maintains high degradation
    activity across wide temperature and pH ranges (58% and 55% degradation at 20 degrees C and 40 degrees C; 68.3% and 72.5%
    at pH 5.0 and pH 9.0, Figure 3A-B). In soil microcosms spiked with 20 mg/kg prometryn, single-strain ZM-3 bioaugmentation
    outperforms both ZM-1 and ZM-2, reducing the prometryn half-life from 58.2 days to 9.5 days (k = 0.073 d^-1, R^2 = 0.97)
    and achieving 92.1 ± 1.5% removal (7.9 ± 1.5% residual) at 30 days (Table 6 and Figure 5A).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Stenotrophomonas sp. ZM-3
    term:
      id: NCBITaxon:40323
      label: Stenotrophomonas
