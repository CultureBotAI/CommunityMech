id: CommunityMech:000320
name: Aspergillus Indium LCD Recovery Platform
description: >
  An engineered Aspergillus niger monoculture bioplatform for recovering
  indium from waste liquid crystal display panels by indirect fungal
  bioleaching. The 2021 study compared three bioleaching approaches from
  general and optimized fermentation systems, showed that fermentation-method
  optimization improved indium bioleaching efficiency from 12.3% to 100%, and
  identified carboxy groups from organic acids and proteins as the critical
  proton donors for indium leaching. The abstract also reports that optimized
  fermentation increased dissociative H+, effective carboxyl groups for metal
  oxide leaching, and oxalic acid output, whereas A. niger biomass interfered
  with indium recovery by blocking H+ access to the oxide phase and adsorbing
  In3+.
