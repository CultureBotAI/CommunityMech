id: CommunityMech:000525
name: Bacillus subtilis 168 BS1 Brewing-Wastewater Ethanol-Detoxifying Isolate Baseline
description: Single-strain engineered bacterial isolate baseline Bacillus subtilis 168 BS1 (BS0 carrying P43::adh from Saccharomyces
  cerevisiae BY4341 and aldH from Issatchenkia terricola XJ-2 integrated on pCE2, Cmr) evaluated as the monoculture ethanol-detoxifying
  partner control alongside wild-type B. subtilis BS0, Shewanella oneidensis SO1 monoculture (CommunityMech:000524), and the
  SO1-BS1 (CommunityMech:000519) and SO2-BS1 (CommunityMech:000523) consortia in Moutai brewing wastewater by Zhang et al.
  2026 (PMID:42733304). Whereas wild-type BS0 removed only ~35.6% of residual ethanol over 48 h (lowering ethanol from 1.8%
  to 1.16% v/v), engineered BS1 oxidized ethanol via acetaldehyde to acetate through the heterologous Adh-AldH cascade. In
  monoculture without S. oneidensis, however, strain BS1 generated only 1.25 mW m^-2 maximum microbial fuel cell power density
  (92.92-fold lower than SO1-BS1 at 116.15 mW m^-2) and leached only 3.8 mg L^-1 total dissolved Li, Ni, Co, and Mn from 0.2
  g L^-1 spent NCM cathode black mass over 14 days (nearly identical to cell-free brewing wastewater at 3.4 mg L^-1 and 13.34-fold
  lower than SO1-BS1 at 50.7 mg L^-1), demonstrating that BS1 functions as the ethanol-detoxifying syntrophic partner rather
  than an independent electrogenic NCM reducer.
