discussions:
- discussion_id: bs1_acetate_cross_feeding_versus_ethanol_detoxification
  prompt: In the SO1-BS1 and SO2-BS1 consortia, does the acetate generated from 1.8% (v/v) ethanol by B. subtilis BS1 P43::adh-aldH
    serve purely as a detoxification product or also as a secondary carbon/electron donor alongside the native lactate in
    Moutai brewing wastewater?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Heterologous Adh-AldH Dual-Enzyme Oxidation of Brewing-Wastewater Ethanol by BS1
  - ecological_interactions#Minimal Standalone Electrogenic Power Density and NCM Metal Leaching by BS1 Monoculture
  rationale: PMID:42733304 showed that BS1 monoculture had negligible standalone EET (1.25 mW m^-2) and NCM metal leaching
    (3.8 mg L^-1 vs 3.4 mg L^-1 abiotic control) while removing 97.6% of ethanol in SO1-BS1 via Adh-AldH oxidation to acetate,
    but did not isotopically trace whether BS1-derived acetate is co-respired by S. oneidensis alongside the native lactate
    in Moutai brewing wastewater.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using this engineered B. subtilis strain BS1, the residual ethanol in the brewing wastewater was oxidized to
      acetaldehyde by alcohol dehydrogenase (Adh), which was subsequently converted into acetate catalyzed by aldehyde dehydrogenase
      (AldH)
    explanation: Documents the conversion of ethanol to acetate by BS1 without quantifying downstream acetate consumption
      by S. oneidensis.
