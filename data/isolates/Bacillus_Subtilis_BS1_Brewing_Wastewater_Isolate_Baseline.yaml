ecological_interactions:
- name: Heterologous Adh-AldH Dual-Enzyme Oxidation of Brewing-Wastewater Ethanol by BS1
  description: To overcome the incomplete ethanol removal of wild-type B. subtilis 168 BS0 (which removed only ~35.6% of residual
    ethanol within 48 h in Moutai brewing wastewater, lowering ethanol from 1.8% to 1.16% v/v, Figure 2b), engineered B. subtilis
    BS1 expresses P43-driven alcohol dehydrogenase (adh from Saccharomyces cerevisiae BY4341) and aldehyde dehydrogenase (aldH
    from Issatchenkia terricola XJ-2) on plasmid pCE2, oxidizing residual ethanol to acetaldehyde and acetate.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus subtilis 168 BS1
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  metabolites:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using this engineered B. subtilis strain BS1, the residual ethanol in the brewing wastewater was oxidized to
      acetaldehyde by alcohol dehydrogenase (Adh), which was subsequently converted into acetate catalyzed by aldehyde dehydrogenase
      (AldH), constituting a dual‐enzyme cascade reaction that efficiently removed ethanol, thus eliminating ethanol inhibition
      on the EET efficiency of S. oneidensis.
    explanation: Describes the heterologous Adh-AldH dual-enzyme ethanol-to-acetate oxidation cascade in engineered B. subtilis
      BS1.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, the wild‐type strain BS0 removed only approximately 35.6% of ethanol within 48 h, lowering the ethanol
      concentration from 1.8% to 1.16% (v/v) (Figure 2b ).
    explanation: Establishes the wild-type B. subtilis BS0 ethanol removal baseline (~35.6% removal over 48 h) against which
      engineered BS1 is compared.
- name: Minimal Standalone Electrogenic Power Density and NCM Metal Leaching by BS1 Monoculture
  description: When evaluated alone in Moutai brewing wastewater without Shewanella oneidensis, B. subtilis BS1 monoculture
    generated a microbial fuel cell maximum power density of only 1.25 mW m^-2 (92.92-fold lower than the SO1-BS1 consortium
    at 116.15 mW m^-2, Figure 2c) and catalyzed only 3.8 mg L^-1 total dissolved Li, Ni, Co, and Mn leaching from 0.2 g L^-1
    spent NCM cathode black mass over 14 days (compared with 3.4 mg L^-1 for cell-free brewing wastewater, 15.4 mg L^-1 for
    SO1 alone, and 50.7 mg L^-1 [13.34-fold higher] for SO1-BS1, Figure 2d), confirming that BS1 alone cannot effectively
    reduce NCM metal oxides without its electrogenic S. oneidensis partner.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus subtilis 168 BS1
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  metabolites:
