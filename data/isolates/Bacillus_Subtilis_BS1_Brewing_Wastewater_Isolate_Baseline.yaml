growth_media:
- name: Moutai brewing wastewater with spent NCM black mass (BS1 monoculture)
  composition:
  - name: brewing wastewater
  - name: LiNixCoyMn1-x-yO2 black mass
    concentration: '0.2'
    unit: g/L
  - name: isopropyl beta-D-thiogalactopyranoside
    concentration: '0.5'
    unit: mM
  temperature: '30'
  temperature_unit: degrees Celsius
  atmosphere: ANAEROBIC
  inoculum_size: '1'
  inoculum_unit: '% v/v overnight culture'
  incubation_time: '14'
  incubation_time_unit: d
  vessel_type: anaerobic bottle
  preparation_notes: Strain BS1 was precultured overnight in LB medium with 0.2 g L^-1 chloramphenicol, inoculated at 1% (v/v)
    into Moutai brewing wastewater with 0.5 mM IPTG, transferred to anaerobic bottles with 0.2 g L^-1 spent NCM black mass,
    and incubated anaerobically at 30 degrees C for 14 days.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Overnight cultures of each strain were subsequently inoculated into a medium formulated with brewing water collected
      from a brewing factory in Moutai Town (Guizhou) at a 1% (v/v) ratio, induced by the isopropyl‐β‐d‐thiogalactoside (IPTG,
      0.5 mm, Heowns, Tianjin) for gene expression. Following a brief period of subculturing, the culture was transferred
      into anaerobic bottles, supplemented with 0.2 g L−1 of black mass
    explanation: Supports the 1% v/v inoculation into Moutai brewing wastewater, 0.5 mM IPTG addition, and 0.2 g L^-1 NCM
      black-mass loading.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Anaerobic fermentation was then conducted at 30°C for a period of 14 days to facilitate the dissolution of LIBs.
    explanation: Supports the anaerobic 30 degrees C, 14-day bioleaching incubation.
