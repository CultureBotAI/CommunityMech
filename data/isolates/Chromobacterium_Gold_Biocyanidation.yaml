id: CommunityMech:000273
name: Chromobacterium Gold Biocyanidation Platform
description: >
  An engineered single-member bioleaching platform using the cyanide-generating
  bacterium Chromobacterium violaceum to leach gold from waste printed circuit
  boards (PCBs) in a culture medium containing yeast extract, peptone, and
  glycine. In the primary study (doi:10.1007/s10163-014-0276-4), separate
  biooxidation pretreatment of waste PCBs with Acidithiobacillus ferrooxidans
  removed more than 80% of copper and other base metals, increasing the ratio
  of gold to copper; subsequent C. violaceum bioleaching of the biooxidized
  e-waste at an optimum particle size of 200 mesh with sterile oxygen
  supplementation and nutrient supply increased gold bioleaching efficiency from
  45.5% (direct bioleaching) to 70.6%.

ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Evaluate and improve Chromobacterium violaceum bioleaching of gold from
    waste printed circuit boards across particle size, dissolved oxygen
    supplementation, nutrient addition, and separate Acidithiobacillus
    ferrooxidans biooxidation pretreatment.
  assembly_strategy: Engineered single-member platform represented in community schema for interoperability with multi-member systems.
  measurement_endpoints:
  - Gold bioleaching efficiency from waste printed circuit boards
  - Dissolved oxygen consumption during bioleaching
  notes: Bounded to the waste-PCB bioleaching study (doi:10.1007/s10163-014-0276-4).
  perturbation_design: 'Designed condition space included: PCB particle size, separate biooxidation pretreatment, sterile oxygen supplementation, and nutrient supply.'
  evidence:
  - reference: doi:10.1007/s10163-014-0276-4
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Gold leaching efficiency is affected by many factors
    explanation: Establishes that C. violaceum gold bioleaching was optimized
      across multiple process factors

