        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Chromobacterium violaceum, a cyanide-generating bacterium
        explanation: Establishes C. violaceum as the cyanogenic platform
          organism.
      - reference: doi:10.1007/s10163-014-0276-4
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Bioleaching of gold from waste printed circuit boards by Chromobacterium violaceum
        explanation: Documents application to e-waste gold recovery
