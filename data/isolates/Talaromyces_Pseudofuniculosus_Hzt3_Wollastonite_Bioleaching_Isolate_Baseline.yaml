ecological_interactions:
- name: Gluconic Acid-Driven Broth Acidification, Wollastonite Ca2+/Si4+ Dissolution, and Secondary Weddellite Precipitation
    by T. pseudofuniculosus hzt-3′ Pure Culture
  description: In the 100% hzt-3′ pure-culture wollastonite bioleaching system (30 °C, 150 rpm, 14 days), Talaromyces pseudofuniculosus
    hzt-3′ rapidly consumed sucrose between days 0 and 2 (Fig. 4a), peaked in extracellular protein at day 10 and reached
    27.68 ± 1.38 µg/mL at day 14 (Fig. 4b), and secreted gluconic acid (1.60 ± 0.0798 mg/mL; ~35.35 times higher than CMS-1)
    as its dominant organic acid alongside succinic acid (0.033 ± 0.0017 mg/mL), malonic acid (0.031 ± 0.0015 mg/mL), and
    glycolic acid (0.026 ± 0.013 mg/mL, Fig. 5), plus 22.65 ± 1.08 µg/mL L-(+)-arginine, 9.26 ± 0.46 µg/mL L-glutamine (with
    zero detected L-glutamic acid), and 2.71 ± 0.13 µg/mL L-(-)-tyrosine (Fig. 6). This organic-acid production reduced suspension
    pH below 4 (Fig. 3c), driving strong Ca2+ and Si4+ leaching (surpassed by the optimal 20% CMS-1 + 80% hzt-3′ mixed culture
    at day 12, which reached 79.95% ± 6.37% Ca2+ and 18.59% ± 0.11% Si4+, 1.11 times and 1.30 times higher than in 100% hzt-3′,
    Fig. 3a,b), eliminated the 1,428 cm−1 carbonate FT-IR band, and formed secondary weddellite (calcium oxalate dihydrate,
    PDF#17-0541) XRD peaks at 2θ = 14.32°, 20.07°, and 32.23° in the leaching residue (Fig. 7a,b).
  scope: COMMUNITY_LEVEL
