id: CommunityMech:000548
name: Talaromyces pseudofuniculosus hzt-3' Wollastonite Bioleaching Isolate Baseline
description: Single-strain fungal isolate baseline Talaromyces pseudofuniculosus hzt-3′ (NCBITaxon:2015341) isolated from
  mineral-rich soil and evaluated as the 100% hzt-3′ pure-culture wollastonite bioleaching control (1 mL of 10^6 spores/mL
  suspension inoculated into 100 mL modified Czapek liquid medium with 0.5 g wollastonite in 250 mL conical flasks at 30 °C
  and 150 rpm over 14 days) alongside Ramichloridium apiculatum CMS-1 pure culture (CommunityMech:000547) and the 20% CMS-1
  + 80% hzt-3′ mixed fungal consortium (CommunityMech:000404) by Chang et al. 2026 (PMID:42478817). In pure culture (100%
  hzt-3′), T. pseudofuniculosus hzt-3′ rapidly consumed medium sucrose during days 0–2 (Fig. 4a), acidified the leaching suspension
  to below pH 4 (Fig. 3c), accumulated 27.68 ± 1.38 µg/mL extracellular protein at day 14 (peaking at day 10, Fig. 4b), and
  primarily secreted gluconic acid (1.60 ± 0.0798 mg/mL, ~35.35-fold higher than CMS-1) followed by succinic (0.033 ± 0.0017
  mg/mL), malonic (0.031 ± 0.0015 mg/mL), and glycolic (0.026 ± 0.013 mg/mL) acids (Fig. 5), plus 22.65 ± 1.08 µg/mL L-(+)-arginine,
  9.26 ± 0.46 µg/mL L-glutamine (with complete depletion of L-glutamic acid), and 2.71 ± 0.13 µg/mL L-(-)-tyrosine (Fig. 6),
  driving strong Ca2+ and Si4+ leaching accompanied by secondary weddellite (calcium oxalate dihydrate, PDF#17-0541) formation
  in the leaching residue (Fig. 7b).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Quantify the pure-culture wollastonite Ca2+ and Si4+ bioleaching performance, broth acidification, organic/amino
    acid secretion, and residue mineral phase evolution of Talaromyces pseudofuniculosus hzt-3′ as the acidogenic fungal baseline
    for mixed-culture silicate weathering.
  assembly_strategy: Activate T. pseudofuniculosus hzt-3′ on Czapek solid medium at 30 °C, harvest spores in 0.1% Tween 80
    to 10^6 spores/mL, and inoculate 1 mL of 100% hzt-3′ spore suspension into 100 mL autoclaved modified Czapek liquid medium
    containing 0.5 g wollastonite powder.
  perturbation_design: Compare the 100% hzt-3′ pure culture against 100% CMS-1 pure culture and four mixed CMS-1:hzt-3′ inoculation
    ratios (80:20, 60:40, 40:60, and 20:80) over 14 days at 30 °C and 150 rpm with sampling every 2 days.
  measurement_endpoints:
  - Ca2+ and Si4+ leaching efficiencies over 14 days
  - leaching suspension pH
  - extracellular polysaccharide and protein concentrations
  - organic acid and amino acid profiles by LC-ESI-MS/MS
  - FT-IR and XRD phase analysis of wollastonite leaching residues
  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The mixed-strain proportions were set to six ratios: 100% CMS-1, 80% CMS-1 + 20% hzt-3′, 60% CMS-1 + 40% hzt-3′,
      40% CMS-1 + 60% hzt-3′, 20% CMS-1 + 80% hzt-3′, and 100% hzt-3′.'
    explanation: Defines the 100% hzt-3′ pure-culture baseline alongside the mixed-strain ratios and 100% CMS-1 pure culture.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the pure hzt-3′ strain system, gluconic acid (1.60 ± 0.0798 mg/mL) was the most abundant organic acid, followed
      by succinic acid (0.033 ± 0.0017 mg/mL), malonic acid (0.031 ± 0.0015 mg/mL), and glycolic acid (0.026 ± 0.013 mg/mL).
    explanation: Quantifies the organic-acid profile of T. pseudofuniculosus hzt-3′ pure culture dominated by gluconic acid.
