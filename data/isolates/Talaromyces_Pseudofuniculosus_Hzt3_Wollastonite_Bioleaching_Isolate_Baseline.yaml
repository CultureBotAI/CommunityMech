  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the pure hzt-3′ strain system, gluconic acid (1.60 ± 0.0798 mg/mL) was the most abundant organic acid, followed
      by succinic acid (0.033 ± 0.0017 mg/mL), malonic acid (0.031 ± 0.0015 mg/mL), and glycolic acid (0.026 ± 0.013 mg/mL).
      Gluconic acid, a representative metabolite common to both strains, was produced at approximately 35.35 times higher
      levels in hzt-3′ than in CMS-1.
    explanation: Quantifies the organic-acid profile of pure T. pseudofuniculosus hzt-3′ dominated by 1.60 ± 0.0798 mg/mL
      gluconic acid.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, while no L-glutamic acid was detected in the strain hzt-3′ solution, the expression level of L-glutamine
      was 9.26 ± 0.46 µg/mL, indicating high GS activity that completely converted L-glutamic acid into L-glutamine
    explanation: Quantifies complete conversion of L-glutamic acid to 9.26 ± 0.46 µg/mL L-glutamine in pure T. pseudofuniculosus
      hzt-3′.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the residue from the pure hzt-3′ culture system, characteristic peaks of weddellite (PDF#17-0541) appeared
      at 2θ = 14.32°, 20.07°, and 32.23°, indicating the formation of the secondary mineral calcium oxalate dihydrate.
    explanation: Documents secondary weddellite (calcium oxalate dihydrate) precipitation in the wollastonite residue from
      pure hzt-3′ culture.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, the addition of strain hzt-3′ significantly enhanced the acidification, reducing the suspension
      pH to below 4. The period between days 3 and 6 represented the phase of lowest and most stable pH values.
    explanation: Documents strong broth acidification below pH 4 driven by T. pseudofuniculosus hzt-3′ with lowest and most
      stable pH between days 3 and 6.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When strain hzt-3′ was present, the polysaccharide content in the bioleaching system gradually decreased as the
      process proceeded, with the most significant reduction occurring between days 0 and 2. This is attributed to the rapid
      growth of strain hzt-3′ during this phase, which led to substantial consumption of sucrose from the culture medium,
      resulting in a marked decrease in polysaccharide content.
    explanation: Documents rapid days 0–2 growth and sucrose consumption by T. pseudofuniculosus hzt-3′ during wollastonite
      bioleaching.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The peak at 1,428 cm−1 corresponds to the asymmetric stretching (v₃) of carbonate ions (CO32−) ( 57 ), which
      almost completely disappeared in the leaching residues of systems containing strain hzt-3′ but remained present in the
      pure CMS-1 system. This observation is consistent with the generally higher calcium ion concentration in cultures containing
      hzt-3′.
    explanation: Demonstrates disappearance of the 1,428 cm−1 carbonate FT-IR band and enhanced calcium dissolution in wollastonite
      residues leached by T. pseudofuniculosus hzt-3′.
