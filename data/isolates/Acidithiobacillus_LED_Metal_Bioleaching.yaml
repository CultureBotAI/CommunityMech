  preferred_term: laboratory environment
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Laboratory shake-flask direct and step-wise indirect biogenic ferric leaching of waste light-emitting diode (WLED)
    powder at 20 g/L pulp density (PMID:30343816, PMID:31203122).
