  - PRIMARY_DEGRADER
  abundance_level: DOMINANT
  evidence:
  - reference: PMID:30343816
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the presence of 20 g/l of LED powder, adapted Acidithiobacillus ferrooxidans exhibits higher Fe3+ level, cell
      amount, ORP, and lower pH than the non-adapted cells.
    explanation: Demonstrates enhanced Fe3+ generation, cell density, ORP, and acidification by adapted A. ferrooxidans at
      20 g/L LED powder.
  - reference: PMID:30343816
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The adapted A. ferrooxidans leached approximately 84%, 96%, and 60%, copper, nickel, and gallium, respectively.
    explanation: Quantifies Cu (84%), Ni (96%), and Ga (60%) bioleaching efficiency by adapted A. ferrooxidans in direct leaching.
  - reference: PMID:31203122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A novel step-wise indirect bioleaching process has been developed in this study for recycling valuable metals
      from WLEDs using adapted Acidithiobacillus ferrooxidans. The ferric ion concentration was controlled at 4-5 g/L with
      step-wise addition of biogenic ferric for faster bioleaching rate.
    explanation: Documents the step-wise indirect biogenic Fe3+ (4-5 g/L) WLED bioleaching process using adapted A. ferrooxidans.
environmental_factors:
- name: Serial LED Powder Adaptation Regime
  value: 5, 10, 15, 20, and 25
  unit: g/L
  description: Five-step serial acclimatization regime used to adapt Acidithiobacillus ferrooxidans to waste LED powder toxicity.
  evidence:
  - reference: PMID:30343816
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The adaptation of Acidithiobacillus ferrooxidans to LED powder was done through a serial acclimatisation procedure
      in five steps of 5, 10, 15, 20, and 25 g/l.
    explanation: Specifies the five-step serial acclimatization concentrations from 5 to 25 g/L LED powder.
- name: Step-Wise Indirect Biogenic Ferric Leaching Regime
  value: 4-5 g/L Fe3+ at 20 g/L WLED pulp density for 15 days
  unit: g/L
  description: Controlled biogenic ferric concentration and pulp density in step-wise indirect WLED bioleaching achieving
    83% Cu, 97% Ni, and 84% Ga recovery.
  evidence:
  - reference: PMID:31203122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At a pulp density of 20 g/L, the copper, nickel, and gallium recovery efficiency was 83%, 97%, 84%, respectively.
      In addition, leaching time was reduced to 15 days from 30 days.
    explanation: Reports the 20 g/L pulp density, metal recovery efficiencies (83% Cu, 97% Ni, 84% Ga), and 15-day leaching
      time.
