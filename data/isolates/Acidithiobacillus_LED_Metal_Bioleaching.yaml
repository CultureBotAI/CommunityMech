    notes: Heavy-metal-adapted Acidithiobacillus ferrooxidans monoculture acclimatized up to 25 g/L LED powder that generates
      biogenic Fe3+ (4-5 g/L) and sulfuric acid to leach Cu, Ni, and Ga from waste LEDs (PMID:30343816, PMID:31203122).
  functional_role:
