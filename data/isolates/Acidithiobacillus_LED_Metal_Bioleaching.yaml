id: CommunityMech:000489
name: Adapted Acidithiobacillus ferrooxidans Waste LED Metal Bioleaching Isolate
description: A serially adapted single-species isolate of Acidithiobacillus ferrooxidans acclimatized to light-emitting diode
  (LED) waste powder in five steps from 5 to 25 g/L and applied in direct and step-wise indirect ferric bioleaching (4-5 g/L
  biogenic Fe3+ at 20 g/L pulp density), achieving 83-84% copper, 96-97% nickel, and 60-84% gallium recovery while halving
  leaching time from 30 days to 15 days (PMID:30343816, PMID:31203122).
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOMINING
