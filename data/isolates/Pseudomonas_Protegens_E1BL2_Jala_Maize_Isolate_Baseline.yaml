ecological_interactions:
- name: In Vitro ACC Deaminase, Auxin, and Metallophore Production by E1BL2
  description: In single-strain in vitro functional screens (Table 2), Pseudomonas protegens E1BL2 showed zero cross-inhibition
    across the 9-isolate Mueller-Hinton compatibility matrix (unlike P. protegens E2HL9, which was inhibited by Pantoea sp.
    E2AD2 and P. ananatis E2HD8), was the sole tested strain positive for 1-aminocyclopropane-1-carboxylate (ACC) deaminase
    activity (whereas P. protegens E2HL9 was negative), produced 4.33 +- 0.4 ug/mL Salkowski-reactive indole-3-acetic acid
    (IAA) equivalents, and chelated metal ions in plate and liquid CAS metallophore assays (including 3.3 +- 0.6% Ca2+ chelation).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas protegens E1BL2
    term:
      id: NCBITaxon:380021
      label: Pseudomonas protegens
  metabolites:
  - preferred_term: 1-aminocyclopropanecarboxylic acid
    term:
      id: CHEBI:18053
      label: 1-aminocyclopropanecarboxylic acid
    notes: Sole nitrogen substrate in the in vitro ACC deaminase screen.
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Measured colorimetrically with Salkowski reagent (4.33 +- 0.4 ug/mL).
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aminocyclopropane-1-carboxylate (ACC) deaminase production was only detected in P. protegens E1BL2; the other
      P. protegens E2HL9 did not express this enzymatic activity.
    explanation: Demonstrates strain-specific ACC deaminase activity in P. protegens E1BL2.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas protegens E1BL2 - 1 ± 0.2 - 4.33 ± 0.4 3 ± 0.3 - 3 ± 0.5 - 3 ± 0.4 - 4 ± 0.4 - 4 ± 0.6 - 3 ± 0.5
      3.3 ± 0.6 3 ± 0.7 - +
    explanation: Reports the quantitative Table 2 values for P. protegens E1BL2 including IAA production (4.33 +- 0.4 ug/mL),
      metallophore halos, Ca2+ chelation (3.3 +- 0.6%), and ACC deaminase (+).
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Antagonistic interactions were only detected for Pantoea sp. E2AD2 on Burkholderia sp. Z1AL11, P. protegens E2HL9,
      P. ananatis E2HD8, and K. pseudosacchari Z2WD1; and for P. ananatis E2HD8 on P. protegens E2HL9 and K. pseudosacchari
      Z2WD1.
    explanation: Establishes that P. protegens E1BL2 (unlike P. protegens E2HL9) neither inhibited nor was inhibited by any
      other Jala maize isolate in the Mueller-Hinton compatibility assay, qualifying it as the core member of SynComs 1-3
      and the single-strain positive control.
- name: Dual-Culture Fungal Phytopathogen Inhibition and Root PAL Activity Assay
  description: In dual-culture radial growth inhibition assays against five maize phytopathogenic fungi (Fusarium oxysporum,
    Pestalotia sp., Curvularia sp., Colletotrichum sp., and Helminthosporium sp.), P. protegens E1BL2 and SynCom 3 achieved
    the highest fungal inhibition percentages (up to 80%), although Pestalotia sp. was hardly inhibited by E1BL2. In inoculated
    maize roots, E1BL2 increased phenylalanine ammonia-lyase (PAL) activity relative to untreated controls, but unlike SynCom
    3 this increase was not statistically significant by Tukey's test (p <= 0.05).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas protegens E1BL2
    term:
      id: NCBITaxon:380021
      label: Pseudomonas protegens
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. protegens E1BL2 and SynCom 3 exhibited the highest inhibition percentages reaching 80% of inhibition. Pestalotia
      sp. and Helminthosporium sp. were hardly inhibited by P. protegens E1BL2 and SynCom 3, respectively.
    explanation: Quantifies the dual-culture antifungal inhibition profile of P. protegens E1BL2 (up to 80% inhibition, with
      weak inhibition of Pestalotia sp.).
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The treatments of the plants with P. protegens E1BL2 and SynCom 3 increased the PAL enzymatic activity of the
      corn root tissues. However, as shown in Figure 3 , only the effect of SynCom 3 was statistically significant as it tripled
      the activity of the enzyme of the untreated control.
    explanation: Preserves the distinction that E1BL2 elevated root PAL activity numerically but only SynCom 3 reached statistical
      significance.
- name: Gnotobiotic, Greenhouse, and Open-Field Maize Yield Enhancement by E1BL2
  description: As a standalone seed bioinoculant (1 x 10^8 CFU/mL with carboxymethylcellulose adherent), P. protegens E1BL2
    served as the positive-control baseline alongside sterile-water negative control and SynComs 1-3 in Conejo landrace gnotobiotic
    and 60-day greenhouse assays and in the open-field hybrid CPL9105W maize trial, where E1BL2 increased grain productivity
    yield from 11 Tons/ha (untreated control) to 14 Tons/ha (compared with 16 Tons/ha for SynCom 3) without resolving which
    specific in vitro PGP trait mediated the in planta response.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas protegens E1BL2
    term:
      id: NCBITaxon:380021
      label: Pseudomonas protegens
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: FIELD_STUDY
    snippet: As shown in Figure 6 , the productivity yield of the control treatment was 11 Tons/ha, but P. protegens E1BL2
      and the SynCom 3 treatments resulted in yields of 14 and 16 Tons/ha, respectively.
    explanation: Quantifies the open-field hybrid CPL9105W maize grain yield increase from 11 Tons/ha (control) to 14 Tons/ha
      with P. protegens E1BL2.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'The treatments were as follows: seeds inoculated with SynCom 1, SynCom 2, SynCom 3, P. protegens E1BL2 (positive
      control), and sterile water (negative control).'
    explanation: Documents the experimental design in which P. protegens E1BL2 served as the single-strain positive control
      benchmark against SynComs 1-3 and sterile water.
  - reference: PMID:37275168
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: The set of experiments proposed in this study did not allow us to determine the contribution of each of the bacteria
      and their phenotypic traits in the observed PGP at the gnotobiotic, greenhouse, or open field levels.
    explanation: Explicitly bounds why in vitro auxin, ACC deaminase, metallophore, and antifungal traits (Nodes 0-1) are
      not connected by directed causal edges to in planta growth and grain-yield promotion (Node 2).
