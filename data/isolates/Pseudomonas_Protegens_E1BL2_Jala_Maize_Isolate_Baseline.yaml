discussions:
- discussion_id: e1bl2_single_strain_versus_syncom3_synergy
  prompt: Which specific biochemical interactions between Pseudomonas protegens E1BL2 and the five other SynCom 3 members
    explain why SynCom 3 tripled root PAL activity and reached 16 Tons/ha field yield whereas E1BL2 alone yielded 14 Tons/ha
    without statistically significant PAL induction?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#In Vitro ACC Deaminase, Auxin, and Metallophore Production by E1BL2
  - ecological_interactions#Dual-Culture Fungal Phytopathogen Inhibition and Root PAL Activity Assay
  - ecological_interactions#Gnotobiotic, Greenhouse, and Open-Field Maize Yield Enhancement by E1BL2
  rationale: PMID:37275168 evaluated P. protegens E1BL2 across in vitro PGP/antifungal screens, root PAL activity, Conejo
    seedling growth, and CPL9105W open-field yield, but did not perform gene knockouts in E1BL2 (e.g., acdS or biosynthesis
    loci) to establish causal mediation between in vitro traits and field yield. The three assay nodes are therefore kept
    without directed causal edges.
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: FIELD_STUDY
    snippet: the productivity yield of the control treatment was 11 Tons/ha, but P. protegens E1BL2 and the SynCom 3 treatments
      resulted in yields of 14 and 16 Tons/ha, respectively.
    explanation: Highlights the quantitative gap between the single-strain E1BL2 baseline (14 Tons/ha) and SynCom 3 (16 Tons/ha).
  posed_by: antigravity
  posed_date: '2026-11-06'
