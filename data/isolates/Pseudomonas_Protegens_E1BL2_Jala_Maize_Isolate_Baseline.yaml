id: CommunityMech:000521
name: Pseudomonas protegens E1BL2 Jala Maize Seed-Endophyte Isolate Baseline
description: Single-strain seed-endophyte bacterial isolate baseline Pseudomonas protegens E1BL2 (GenBank MK855121) recovered
  from the native giant Jala maize landrace (Zea mays) in Nayarit, Mexico, and evaluated as the individual-strain positive-control
  baseline alongside multi-strain PGPB synthetic communities (SynCom 1, SynCom 2, and SynCom 3) by De la Vega-Camarillo et
  al. 2023 (PMID:37275168). Across in vitro and in planta assays, P. protegens E1BL2 uniquely expressed 1-aminocyclopropane-1-carboxylate
  (ACC) deaminase activity among the two tested P. protegens strains, produced indole-related auxins (4.33 +- 0.4 ug/mL) and
  metallophores, inhibited radial growth of maize fungal phytopathogens by up to 80% in dual culture, promoted Conejo maize
  seedling growth in gnotobiotic and greenhouse assays, and increased open-field hybrid CPL9105W maize grain productivity
  from 11 to 14 Tons/ha.
