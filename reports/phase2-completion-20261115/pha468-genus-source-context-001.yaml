  exact_short_quote: Azoarcus, Paracoccus, Azomonas, Thauera, and Brevundimonas were the dominant genera
  judgment: >-
    These five descriptors summarize genera across five different enrichments,
    not a defined five-isolate inoculum or five co-dominant populations in one
    vessel. Municipal activated sludge seeded five 2 L sequencing batch
    reactors. Reactors A-E used acetate, propionate, butyrate, valerate and
    lactate respectively, with 12-hour aerobic dynamic feeding at 26 degrees
    Celsius over 145 days. Dominance varies by reactor. The study recovered
    963 MAGs and obtained 711 unique MAGs after dereplication; the methods
    report GTDB-Tk 2.1.1 for MAG classification. That study method is distinct
    from the present NCBI-to-GTDB descriptor crosswalk: this pass neither
    reconstructs study MAG placement nor assigns exact genomes to the five
    genus descriptors.
