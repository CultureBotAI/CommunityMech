preservation_contract:
  - Only the five selected native GTDB blocks/statuses and append-only native provenance may change. Preserve all genus descriptors, absent formal stock fields, quotes, discussions and old history.
  - Preserve the sixth Viruses descriptor, its NO_GTDB_EQUIVALENT status and its explicitly broad uncultivated-assemblage scope. The 4,294 pOTUs and predicted lifestyles are distinct from bacterial reference genome populations.
  - Preserve five COMMUNITY_LEVEL nodes and no directed causal edges. Fitted SEM and correlated turnover do not establish phage-induced lysis, causal direction or a controlled kill-the-winner mechanism.
  - Preserve predicted host links and DefenseFinder annotations as predictions. AMG transcripts do not establish translated function, productive infection or increased PHA yield.
  - Preserve reactor-specific dominance and the five-reactors-one-record discussion. Reference fractions are not inoculum ratios or reactor abundance measurements.
  - Preserve the separate 400 mL PHA-accumulation assay versus 2 L enrichment setup; the assay oxygen-control value must not migrate into enrichment claims.
  - Preserve the historical crosswalk-unavailability notes as historical prose, without claiming the taxa are absent from GTDB. Do not infer an upstream crosswalk release from file mtime or from the paper's GTDB-Tk version.
