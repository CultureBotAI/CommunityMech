verdict: needs_curation
summary: >-
  Every populated field of the current Methods-defined sixteen-stock collection was
  reassessed against the retained main article, exact Table S1 cells, relevant figures,
  related-study Methods and retained taxonomic authority observations. The three added
  source locators change quotation routing only. Earlier 18/17-member experiments are
  not promoted to effects in the final sixteen stocks. The Methods/Table S1 stock
  correspondence remains unresolved under #1548. Two inaccurate statements in the
  prior review are corrected here under #2938 without changing that immutable review.
scope_description: >-
  Full current record: identity and design, all sixteen stock/deposit/taxon assertions,
  environment, both media contexts, related-community claims, all five discussions and
  quotations, absence of a causal graph, and provenance. Technical checks and measured
  quotation coverage are bound separately to their actual execution artifacts.
independence_basis: >-
  The review author reread the complete retained primary article, complete current
  record, Table S1 stock columns and Figures 2, 3 and 5. A peer independently challenged
  the current stock, assay and culture boundaries and read both related-study Methods.
  These reads do not constitute new experimental replication or an audit of all raw data.
sections:
  - id: identity
    area: identity
    topic: Methods-defined final collection and source-panel disagreement
    outcome: concern
    fields: [id, name, description, ecological_state, community_origin, community_category, engineering_design, taxonomy]
    evidence: [record, primary, table-s1, prior-review]
    summary: >-
      The deposited final Methods roster contains sixteen individually named stocks.
      An engineered, synthetic soil/rhizosphere model is supported by the isolation and
      bottom-up assembly description. Earlier eighteen- and seventeen-member panels
      have different or incompletely reconciled membership. Table S1 has eighteen stock
      rows, names Methylobacterium OAE516 and Bacillus OAE603, and lacks Marmoricola,
      whereas final Methods names OAE515 and Marmoricola OAE513. The canonical record
      states that conflict; similar names do not establish aliases or stock equivalence.
  - id: environment
    area: grounding
    topic: Physical assay setting versus source and modeled environment
    outcome: supported
    fields: [environment_term, modeled_environment, environmental_factors]
    evidence: [record, primary, grounding]
    summary: >-
      ENVO:01001405 laboratory environment describes liquid cultures and fabricated
      plant assays. ENVO:00001998 soil describes isolation origin and the modeled
      ecological context, not soil as the substrate for every experiment. The source
      isolates came from soil/rhizosphere surrounding one switchgrass plant; this does
      not establish independent field replication. The represented-collection factor
      correctly identifies the final sixteen deposited stocks rather than a pooled assay.
  - id: media
    area: scope
    topic: Separate isolate, community, plant and preservation protocols
    outcome: supported
    fields: [growth_media, engineering_design.perturbation_design]
    evidence: [record, primary]
    summary: >-
      Isolate precultures used 3–5 mL 1x R2A in 14 mL tubes, aerobic at 30°C without
      shaking for 5–7 days. Individual growth curves instead used starting OD600 0.05
      and 200 microliters of 0.1x R2A. Community cultures used 200 microliters in plates
      at 30°C without shaking, with assay-specific dilution and harvest. Seed germination
      at 24°C on 0.1x MS plates is not a member cultivation condition; the cited Methods
      does not separately specify the post-transfer EcoFAB temperature. Preservation used separate
      20% glycerol/DMSO or lyophilized treatments, three days at -80°C and assay-specific
      regrowth; the record makes no long-term stability or universal 72-hour claim.
  - id: nutrient
    area: scope
    topic: Earlier eighteen-member nutrient experiment
    outcome: supported
    fields: ['discussions[1]']
    evidence: [record, primary, figure2]
    summary: >-
      The earlier eighteen-member experiment compared 1x, 0.2x and 0.1x R2A after
      three days. Lower nutrient concentration reduced bulk growth while increasing
      reported diversity/evenness. Relative taxonomic profiles are not absolute viable
      abundances, and this observation is not assigned to all final sixteen stocks.
      The source's figure/table labels do not resolve the remaining stock correspondence.
  - id: ratios
    area: scope
    topic: Starting ratios and time-dependent community profiles
    outcome: supported
    fields: ['discussions[2]']
    evidence: [record, primary, figure3]
    summary: >-
      The source tests twenty-two starting combinations in the with/without-Pseudomonas
      panels and reports two- and six-day profiles. The source's 3x cutoff is an FSR-based
      three-tier allocation: FSR below 0.05, between 0.05 and 1, and above 1 receive
      2000, 200 and 2 drops, respectively. It is not a threefold starting-density factor.
      The source reports the highest alpha-diversity among tested starting compositions
      for that allocation without Pseudomonas, not a universal biological optimum.
      Current prose preserves panel identity and temporal dependence instead of asserting
      one initial ratio, stable final abundance or a final-sixteen interaction mechanism.
  - id: host
    area: scope
    topic: Earlier seventeen/eighteen-member EcoFAB experiment
    outcome: supported
    fields: ['discussions[3]']
    evidence: [record, primary, figure5, prior-review]
    summary: >-
      The earlier EcoFAB comparison is with versus without Pseudomonas, not without
      Burkholderia. Twelve-day-old plants received inoculum and were harvested seven
      days later. The source qualifies before/after taxon significance because the
      inoculant was one batch; relative enrichment does not establish member-specific
      growth, host benefit or reciprocal fitness. Neither panel is silently equated
      with the final Methods collection. This corrects the prior assessment's wrong
      omitted genus under #2938 while leaving the correct canonical discussion intact.
  - id: mechanisms
    area: evidence
    topic: Dropout hypotheses, profile measurements and open mechanism discussion
    outcome: concern
    fields: ['discussions[0]', engineering_design, ecological_interactions]
    evidence: [record, primary, figure2, figure3, figure5]
    summary: >-
      The source's isolate/dropout observations motivate hypotheses such as Lysobacter
      facilitation and fast-grower competition; they do not identify exchanged compounds,
      selective pathways or pairwise mechanisms in the final collection. PMA/relic-DNA
      tests and E. coli DNA spike-ins do not establish absolute viable-cell counts for
      every stock. The open mechanism discussion is appropriate. There are zero current
      ecological nodes and zero arrows, so no measured profile or workflow is promoted
      to a causal interaction. No gene/regulator assertion requires iModulonDB evidence.
  - id: source-locators
    area: evidence
    topic: Exact Table S1 quotations and unaltered scientific assertions
    outcome: supported
    fields: ['discussions[4]']
    evidence: [record, primary, table-s1, locator-application]
    summary: >-
      The three locators select the retained published DOCX, table 1, row 12 cell 2
      (OAE516), row 18 cell 1 (Bacillus) and row 18 cell 2 (OAE603), counting the header
      row. The source asset and extracted stock cells support those exact quotations.
      Every original quotation, taxon, discussion rationale and biological field is
      unchanged. Successful routing cannot decide whether OAE515 and OAE516 are the
      same stock or reconcile Marmoricola and Bacillus; #1548 remains open.
  - id: relations
    area: consistency
    topic: Two populated relations use exact shared strain designations
    outcome: supported
    fields: [related_communities]
    evidence: [record, primary, ring-primary, dopamine-primary]
    summary: >-
      Ring-trial Methods SynCom17 contains the final Coker sixteen plus Gottfriedia
      (formerly Bacillus) OAE603. The ring trial's own SynCom16 treatment instead omits
      OAS925 and must not be confused with Coker's final sixteen. The dopamine Methods
      roster contains the other fifteen Coker stocks plus OAE603, without OAE829, so
      overlap of fifteen is supported. The related sources explicitly preserve OAE515,
      Marmoricola OAE513 and same-stock genus renamings. Neither relation establishes
      Table S1 aliases, equivalent experimental protocols or full scientific approval
      of the neighboring records.
  - id: taxonomy-populations
    area: grounding
    topic: Genus authority and retained reference populations
    outcome: supported
    fields: [taxonomy]
    evidence: [record, primary, grounding]
    summary: >-
      All sixteen terms are genus-level source grounding. Thirteen retained GTDB blocks
      describe aggregate named-species reference populations, not study-stock genomes.
      Arthrobacter retains eleven alternatives; Paenibacillus retains thirty-three;
      neither has a selected GTDB block. Allobosea 85413 remains UNRESOLVED with no GTDB
      classification in both current bytes and retained native result. The old review's
      Bosea 34/34 claim was inaccurate and is corrected under #2938. The crosswalk hash
      identifies bytes, not an established upstream release or chronology.
