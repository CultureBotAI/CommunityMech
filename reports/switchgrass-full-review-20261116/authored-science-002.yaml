stock_scope: >-
  Each DSM number is an individual-stock deposit reported in final Methods, not a new
  current culture-collection catalogue verification. Original isolation notes, source
  names, exact quotations and genus-only uncertainty remain intact. A reference
  population cannot establish the genomic identity or ecological function of a stock.
limitations:
  - Full scientific assessment means every current field was assessed; it does not mean every scientific uncertainty is resolved or that aggregate corpus QC passed.
  - The Methods/Table S1 and earlier-panel correspondence remains open under issue1548; no similar-name alias, inferred membership, or stock-genome assignment is introduced.
  - Native source matching establishes lexical correspondence with selected retained bytes. It does not independently validate experimental interpretation, lineage assignments or causal mechanisms.
  - The actual full retained main article, Table S1 stock cells and Figures2/3/5 were read. Other supplementary cells and all raw numerical data were not comprehensively reanalyzed.
  - Current catalogue availability, sequences, assembly quality, species identity, source statistics and experimental reproducibility were not independently recertified.
  - Related-paper checks support the two populated stock-set relations only, not full scientific completion of the related records or equivalence of their protocols.
  - Old reviews, failed matcher outputs, runtime revisions and application receipts remain immutable. The new review corrects its own current statements rather than rewriting historical evidence.
