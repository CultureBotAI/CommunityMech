correction_notes:
  - Issue 2944 records the first actual builder refusal before inspection or draft output. Its copied network type subset omitted the native community-level UNKNOWN_TARGET warning override. The repaired builder uses the captured maintained issue_severity function on the unchanged raw audit; true errors still refuse, the corpus command remains failed with exit 1, and no target network finding is promoted to a global pass. Executed config 003 and the failed raw run remain unchanged.
  - Issue 2938 records two inaccurate statements in the immutable prior assessment. Actual plant comparison omits Pseudomonas, not Burkholderia; current Allobosea 85413 has no GTDB block, rather than a Bosea 34/34 assignment. The new primary, figure 5, grounding and record assessments correct the interpretation without modifying canonical biology or historical evidence. There was no corresponding prior saved finding to close.
  - Issues 2940 and 2941 record rejected unsaved authored 001 wording. Additive authored 002 states the 2000/200/2-drop FSR tiers, highest tested alpha-diversity without Pseudomonas, and 24 C seed-germination scope. The exact rejected draft is captured as provenance; no authoritative saved review or canonical record used it, and no prior finding occurrence is invented.
  - Issue 2942 records pre-execution config 001's missing ownership metadata and invalid terminal finding lineage. Additive config 002 retains only the genuine prior roster and routing findings, with maintained owners, and moves draft/prose corrections into these notes. The original config remains captured unchanged.
  - Issue 2943 records the unexecuted builder's measurement-counter acceptance gap. The repaired guard requires actual per-assertion comparison and validity, exact calls/text/reference bindings, complete per-record processing, empty errors/drift and reconciled aggregate counts. Actual current 37/37 measurement bytes remain unchanged.
