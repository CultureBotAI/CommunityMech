adversarial_checks:
- 'Every original node and direction has a disposition: six nodes and four directions retained, one node renamed.
  No added topology; all targets and discussion anchors resolve.'
- 'Overcorrection check: retain demonstrated acetate-linked methanogenesis, hydrogen-removal growth benefits and
  formate involvement supported by the 2001 partner-comparison literature. Qualification of the detailed energy-conservation
  model does not erase these results or imply universal obligacy.'
- 'Acetate/formate: enzyme assays with artificial acceptors and proteomic abundance support component activities,
  not the entire reverse-electron-transport pathway. Proton-gradient coupling and physiological acetate reduction
  were not demonstrated in 2019. Both methanogenesis arrows distinguish overall coupling from carrier partition
  and measured flux.'
- 'Methanogenesis: preserve exact 2002 TM/PB hydrogen conditions and the mcr/MRI-versus-mrt/MRII result, not universal
  activation of all genes. TM can use formate; hydrogenotrophic does not mean hydrogen-only. The separate DeltaH/butyrate
  system is not silently imported.'
- 'Thermotoga: the dialysis and size-fraction observations support proximity, not proven directional colonization,
  mandatory contact or a specific adhesion mechanism. The original proximity-to-transfer direction remains PARTIAL.'
- 'Phenotype: 292 versus 24 describes within-culture mid-log-to-early-stationary-phase contrasts, not 292 genes
  in a coculture-versus-monoculture contrast. Aggregation declines in stationary phase. Hydrogen removal supports
  physiology without isolating every EPS/transcript mediator; growth phase, density and gas handling remain relevant.'
- 'Source scope: six fresh primary abstracts, 2019 full main-body XML, three complete existing cached primary main
  bodies and the 2001 publisher abstract read. Fresh older full XML retrieval failed; no bypass. Original figure
  pixels, supplements, raw data and incomplete cached table cells not audited. All 18 graph/discussion quotes match
  fresh primary texts and existing caches; no new publication bodies or cache files.'
- Two guarded records and append-only histories preserve 458 other records, 923 caches, all non-graph raw blocks
  and prior history/decision artifacts. One explicit participant-list user added. Measured census is 413 community-level,
  137 mixed, 276 community-only, 1565 taxa and 1273 solely credited; the added pair already has pairwise credit.
  Connectivity logic and share guards unchanged.
- Five real in-memory control/mutation/restored-control probes reject formate SUPPORT inflation, colonization typing,
  the wrong 292 contrast, unqualified hydrogen mediation and exclusion of TM formate use. Actual mutations and rejecting
  assertions recorded; canonical hashes unchanged; not additional pytest tests.
- 'Nine focused tests and 1033 combined regressions pass. Both records pass schema, strict, terms, full-record references,
  snippets, history and rank. The 56 network warnings are unchanged, with zero structural defects. Deterministic
  rendering and exact HTML-description coverage: 456 pages, 1366 nodes, 531 arrows, not UI screenshots. Local reference
  passes do not certify Linux; full-corpus snippets remain informational.'
- 'Graph repairs #1888/#1889 await protected-main merge; non-graph #1890/#1891 remain open. No Edison invocation
  or new topology. Prior Ruegeria extension #1883 and other needs_research records remain incomplete. Self-review
  is not independent approval; exact-head publication and postcommit docs-current are separate gates. Root CI blocker
  #1836 is not bypassed; dependent branches are not deleted.'
- 'Corpus: 366 reviewed, 40 pending, 54 needs_research across 460 records. The overall goal remains incomplete.'
adversarial_regression_proof:
  report:
    cases:
    - mutation: Formate transfer interpretation promoted to fully established coupling
      test: test_formate_support_survives_without_proving_the_energy_coupling_model
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 52
      assertion: assert node["evidence"][0]["supports"] == "PARTIAL"
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/2/evidence/0/supports
        before: PARTIAL
        after: SUPPORT
    - mutation: Proximity retyped as directional colonization
      test: test_proximity_is_not_colonization_or_obligatory_direct_contact
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 71
      assertion: assert "interaction_type" not in node
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/1/interaction_type
        before: null
        after: COLONIZATION_FACILITATION
    - mutation: 292 genes reassigned to the between-culture contrast
      test: test_292_is_a_within_culture_growth_phase_contrast
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 82
      assertion: assert "within coculture, versus 24" in node["description"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/2/description
        before: T. maritima aggregation and transcription changed with growth phase in methanogenic coculture. In
          the 2006 study, 292 genes changed at least twofold from mid-log to early stationary phase within coculture,
          versus 24 for that transition within monoculture; these are not 292 genes in a direct coculture-versus-monoculture
          contrast. EPS-based aggregates were prominent during mid-log growth and diminished during stationary phase.
          Proposed sigma-factor, ppGpp and EPS-remodeling mechanisms are interpretations, not demonstrated regulatory
          necessity. The phenotype is not an additional measured metabolite-transfer event from bacterium to archaeon.
        after: 292 genes differ directly between coculture and monoculture.
    - mutation: Hydrogen transfer promoted to selective mediation of every phenotype
      test: test_hydrogen_to_phenotype_mediation_is_partial
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 91
      assertion: assert edge["description"].startswith("PARTIAL:")
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/0/downstream/0/description
        before: 'PARTIAL: hydrogen removal relieves growth inhibition and enables the higher-density coculture context
          in which aggregation and altered growth-phase transcription were observed. Hydrogen-removal comparisons
          support a contribution to physiology, but do not selectively demonstrate mediation of every EPS or transcript
          response by hydrogen transfer alone. Growth phase, population density and culture/gas-handling conditions
          remain part of this causal interpretation.'
        after: Hydrogen transfer alone demonstrably causes every EPS and transcript response.
    - mutation: TM formate use excluded from methanogenesis interpretation
      test: test_tm_expression_is_not_all_genes_or_the_deltah_system
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 37
      assertion: assert "does not exclude formate-supported electron transfer" in node["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/1/description
        before: M. thermautotrophicus TM consumes hydrogen during acetate-fed coculture with T. phaeum PB, supporting
          product removal and methane formation. The 2002 TM/PB experiment maintained 20 to 80 Pa hydrogen and detected
          mcr/MRI rather than mrt/MRII expression in coculture; other assayed methanogenesis genes were expressed
          in both culture modes. This is not a universal activation of all methanogenesis genes or evidence of obligate
          dependence on PB. TM can also use formate; the hydrogenotrophic designation does not exclude formate-supported
          electron transfer. The separate DeltaH/butyrate coculture is not the PB/TM system.
        after: M. thermautotrophicus TM consumes hydrogen during acetate-fed coculture with T. phaeum PB, supporting
          product removal and methane formation. The 2002 TM/PB experiment maintained 20 to 80 Pa hydrogen and detected
          mcr/MRI rather than mrt/MRII expression in coculture; other assayed methanogenesis genes were expressed
          in both culture modes. This is not a universal activation of all methanogenesis genes or evidence of obligate
          dependence on PB. TM can also use formate; the hydrogenotrophic designation excludes formate-supported
          electron transfer. The separate DeltaH/butyrate coculture is not the PB/TM system.
