adversarial_checks:
- Fresh both-root baseline preceded papers. Five previous reviews rechecked, three records changed and two unchanged.
  All14nodes7arrows retained with identical arrow wording/endpoints and participant assignments. No new direction,
  topology or inflated completed-review count.
- Current schema explicitly does not assert obligacy for SYNTROPHY. Its additional criterion is product-removal
  feedback making the first partner metabolism favourable. Cross-feeding and cooperative outcomes do not automatically
  demonstrate that feedback.
- UFMP primary main text supports an inferred producer-consumer connection. The existing transfer node receives
  CROSS_FEEDING with PARTIAL COMPUTATIONAL evidence; heterogeneous donor/substrate roles and both hypothesized arrows
  remain. No direct flux, stereochemistry, complete conversion or additional species assignment is claimed.
- Digestion retains reported methane increases, propionate reduction and function/stability trade-off. Metagenomic
  association is not transcript abundance or measured electron transfer. Its untyped mechanism node is justified
  by unresolved feedback, not unproven obligacy; primary access is abstract-only.
- Pleuromutilin retains its positive community endpoint and proposed-products evidence. These nodes do not resolve
  product-removal feedback and remain untyped; existing needs_research status and issue1715 remain. A discussion
  reference to nonexistent engineering_design is corrected to the record description. No new antibiotic-selection,
  growth optimization, genetic design, pathway or protocol details.
- MFC and Crystal Geyser already distinguished substrate provision from product-removal feedback, so their record
  bytes remain unchanged. MFC current/CMC outcomes and spatial observations stay separate; Crystal Geyser lipid/genome/isotope
  associations do not isolate a donor-recipient route. Missing fresh MFC full text is not absence of controls.
- Two complete main bodies, embedded table text and captions read, plus four other primary abstracts. No original
  figure pixels, raw data or complete supplement audit. Earlier pleuromutilin supplement notes/boundary rows reread,
  not newly downloaded or visually rendered; inconsistent S3 scale/subset/table labels are recorded in existing
  research1715, not reconciled.
- An initial PMID33125214 lookup was unrelated and explicitly excluded. Correct exact-system PMID42133144 was retrieved
  and read before edits. Target proofs reference only six correct primary sources; unrelated lookup artifacts remain
  for transparency, not evidence.
- Inventory previously rejected any repeated record review. Explicit parent ledger, record hash, original hash and
  ID links now select one linear tip independent of ordering. Tests reject duplicate, missing, self, mismatched,
  unlinked, forked, cyclic and disconnected histories. Current record hash and node/edge coverage checks remain
  mandatory; needs_research is not promoted.
- All previous tracked history and decision artifacts are byte-identical to the parent commit. Three append-only
  histories, eight record regressions and sixteen new inventory cases. All921caches457unchangedrecords/raw non-graph
  blocks preserved. Coverage280reviewed132pending48research;1420nodes584arrows, all56oldwarnings, zero structural
  defects and unchanged legacy census.
- No Edison dry run, provider submission or spend. Executed gates and deterministic HTML parser checks are not browser
  screenshots or generated-model loader certification; loader1703 remains open. Repair1744 awaits protected-main
  merge; research1715 and metadata183/1327/1366/1716 stay open. Source-based self-review is not independent approval
  or corpus completion.
