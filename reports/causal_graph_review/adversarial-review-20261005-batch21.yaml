adversarial_checks:
- 'Every original node and arrow accounted for: ten nodes and seven arrows retained, five exact renames, no new
  structure or Edison spend.'
- Challenge excessive skepticism with the glucose-addition and extracellular-cellobiase controls. Preserve their
  positive support without asserting selective consortium regulation or polymer conversion in cellobiose-fed experiments.
- Keep both necromass growth effects, with aerobic E. coli and anaerobic C. phytofermentans assays distinct. Retain
  positive CFU support while bounding specific peptide mediation and endogenous consortium turnover.
- Use both existing canonical participants for reciprocal necromass effects; do not encode only the opposite donor-recipient
  direction or classify the aerobic assay as fermentation.
- Oxygen microprofiles support biological oxygen removal after anoxic biofilm establishment. Fully oxic inoculation
  and genomic qPCR prevent unqualified establishment or viable-cell claims.
- Biofilm total biomass includes extracellular material. Cellobiose consumption and ethanol were measured in planktonic
  cultures, not directly in biofilms; retain the outcomes and qualify all three causal arrows.
- 'Remove aggregate syntrophy typing: measured products alone are not a separate mechanism of product removal making
  upstream metabolism favorable.'
- Keep yeast respiratory protection and reciprocal sugar benefit as condition-dependent MUTUALISM. The actual enum
  does not require universal obligacy; do not erase the supported positive controls.
- The approximately 22 g/L ethanol comparison used added endoglucanase. It cannot establish the same productivity
  improvement in unsupplemented coculture.
- Long-term maintenance used 25 mL and 150 g/L cellulose, with viable counts at 30, 40 and 50 days. This is a separate
  arm from enzyme-assisted production, not continuous monitoring or an unconditional mutualism endpoint.
- 'Do not claim ethanol cannot be exchanged in all oxygen regimes: the sugar/output distinction is limited to the
  low-oxygen ethanol-production regime.'
- LQRI-to-X514 sugar transfer is a supported proposal, not directly traced flux. Higher ethanol does not imply greater
  cellulose utilization under every process condition.
- Represent ethanol output with both existing canonical participants, not ethanol donation to LQRI; the 194-440%
  range spans multiple coculture comparisons. Keep the species-level 2011 abstract distinct from the LQRI-specific
  fed-batch study rather than claiming abstract strain resolution.
- B12 genomic capacity and the positive 39E supplementation response support a hypothesis, not selective X514 causality
  or vitamin donation. The vitamin-supplemented fed-batch study does not demonstrate biosynthetic autonomy.
- 'Challenge the initial draft against the actual schema: intrinsic B12 capacity retains X514 as its single source
  with no recipient, rather than community-level scope. The hypothesized downstream contribution targets community
  ethanol output. No invented donor-recipient relation or commensalism sign is retained.'
- 'All four reference caches and unrelated YAML blocks remain byte-identical. Unrelated metadata is not certified;
  #1338 and existing #746 remain open.'
- Three primary main bodies with Methods and tables/captions plus the complete 2011 mechanism abstract reviewed.
  No image or supplementary-file inspection, independent approval, or corpus completion claimed.
