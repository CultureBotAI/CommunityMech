adversarial_checks:
- challenge: Does the repair delete every unproven mechanism instead of representing uncertainty?
  resolution: No. Twelve arrows remain, including source-proposed California allocation, Caragana preservation,
    CeMbio assembly and cellulose H2 routes. Partial cross-feeding and syntrophy types remain where the source proposes
    them.
- challenge: Can a fitted zero flux establish eradication or complete biological shutdown?
  resolution: No. The cellulose quad retains its measured culture outcomes and competition interpretation while
    qualifying fitted fluxes and alternative solutions. Persistent methanogen protein is not silently equated with
    zero activity.
- challenge: Is the removed feedback arrow a valid general enabling relationship?
  resolution: The source calculation concerns H2 production and does not establish acetate-specific mediation. Feedback
    remains as a partial node; the directly supported acetate-to-methane direction remains.
- challenge: Are genomic and transcript measurements being demoted merely because they are not interventions?
  resolution: No. Those observations are retained in their actual measurement scope. Model capacities, gene abundance,
    ribosomal transcripts, functional annotations and relative composition are not substituted for flux, growth
    or reciprocal fitness.
- challenge: Are distinct inocula or assay memberships accidentally combined?
  resolution: SynCom15 remains separate from SynCom5 mechanisms; individual-member CeMbio odor tests remain separate
    from gut and mixed-community assays. Cheese assay memberships remain explicitly unresolved, not silently expanded.
- challenge: Do the chemical substitutions invent newly identified exchanged metabolites?
  resolution: No. Cellulomonas is reduced to the source-supported organic-acid class rather than representative
    acetate. PMSX CMC is corrected to the derivative actually named in the source, not a new exchange or hydrogel
    mechanism.
- challenge: Did optional interaction-type removal erase measured results?
  resolution: Outcomes remain. Co-detection, colonization, spatial architecture, succession, host developmental
    timing and genotype-dependent yield do not by themselves establish the previously assigned ecological categories.
- challenge: Are earlier corrections and unresolved hypotheses preserved?
  resolution: Canonical taxa, the SynCom5 membership gap, the open Dv-to-Mc gap, PMSX modeling provenance and prior
    acetate/lactate snippets remain. Previously removed reciprocal/workflow arrows are not restored.
- challenge: Can green tests or a completed graph review certify unread evidence or non-graph metadata?
  resolution: No. Each ledger entry records source scope, hashes and excluded material. Non-graph findings have
    separate issues, cheese remains needs_research, and the full-corpus goal remains incomplete.
- challenge: Should the record be changed to satisfy a stale local label cache?
  resolution: No. NCBITaxon:5480 remains Lodderomyces parapsilosis as in issue 1217. NCBI and the unmodified validator
    with --no-cache agree; the original cached-label failure stays in the validation report.
