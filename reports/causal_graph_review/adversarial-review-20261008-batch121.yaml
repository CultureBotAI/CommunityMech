adversarial_checks:
- 'All 14 original nodes and two arrows accounted for: 12 nodes and both directions retained, two inoculum-preparation
  nodes removed, six renames, no new topology. Targets and discussion anchors resolve. Prior C1/C6 workflow-arrow
  deletions are not undone.'
- Tomato complementary biofilm/host-defense functions are not reciprocal microbial fitness. Keep positive protection
  comparable to the 38-member precursor and intensified host oxylipin responses. Biofilm mediation remains PARTIAL.
  Biosynthesis inhibition abolishes protection and SlLOX5/SlDES1 overexpression increases resistance; do not erase
  these stronger causal experiments or promote separate necessity of each divinyl ether.
- C1 retains 37.00% plate inhibition and positive greenhouse root-rot/root-weight effects. Equal-ratio assembly
  is preparation, not colonization facilitation. No demonstrated superiority over the best single strain; persistence
  was explicitly unassessed. Whole-mixture cell-free and volatile results are not inferred from individual members.
- C6 retains 34.48% direct plate inhibition and 11.76 ug/mL IAA-calibrated Salkowski output. Colorimetry is not
  resolved compound identity or plant delivery. Arabidopsis primary-root shortening is not growth promotion or significant
  wheat protection. The source negative-r-squared notation is not copied as a valid statistic.
- C6 individual members have positive cell-free and volatile results, but assembled-mixture supernatants are null
  and C6 is absent from the significant volatile-mixture list. Both positive members and null mixture observations
  stay together. No universal inefficacy claim and no new assay-to-assay causal arrows.
- Crown-rot SMC retains positive disease reduction from 86.45% to 25.93% and challenged TKW +10.39%. Relative DNA
  profiles and correlation networks are not viability, colonization, nutrient flux, reciprocal cooperation or ecological
  necessity. Added allantoin/dihydrodaidzein positive host assays and negative direct fungal assays remain explicit,
  not erased or promoted to intact-SMC necessity.
- 'Twenty-four graph and 10 discussion quotes match fresh primary and caches. Three unique studies: complete wheat
  C1/C6 and crown-rot main bodies, methods, results, discussion, tables and captions read; tomato abstract-bounded.
  No original figure pixels, external supplements, raw data or code audit. Crown-rot license CC BY-NC-ND 4.0, not
  unrestricted CC BY. Three short excerpts, 21 words, appended with verified Zhou attribution; old cache prefix
  preserved. Cache/source wording and treatment-assignment discrepancies remain #1945.'
- 'Four guarded writes and append-only histories preserve 456 other records, 922 unchanged caches, unrelated raw
  YAML blocks and previous histories/decisions. Canonical taxa, participant lists and scopes unchanged. Shared evidence
  aliases detached. Non-graph member/role, metal/abundance and provenance/timing findings remain #1943-#1945.'
- Fifteen focused tests and 12 control/mutation/restored-control probes pass. Mutations reject tomato mutualism,
  unique-biofilm promotion, erased biosynthesis/overexpression positives, restored C1 assembly, best-single superiority,
  C6 auxin mutualism, root-growth promotion, erased supernatant/volatile nulls, erased crown-rot grain benefit and
  profile-to-colonization promotion. No canonical writes in probes.
- 'All four records pass schema, strict, terms, full-record references, snippets, rank and history. 1146 selected
  tests including palette pass; not full Linux CI certification. Network: 57 unchanged warnings, zero structural
  defects. Exact descriptions on 456 pages, 1359 nodes and 522 arrows and deterministic rendering verified, not
  screenshot QA.'
- 'Participant lists and scopes unchanged: 299 list users, 414 community-level, 136 mixed, 278 community-only, 1568
  taxa, 1281 solely credited. Scope credit is not certification of actual participant coverage. Connectivity logic
  and thresholds unchanged.'
- 'Issues #1939-#1942 addressed pending protected-main merge; #1943-#1945 remain open. No Edison extension or credits.
  Prior Ruegeria #1883 configured-authentication blocker not retried unchanged. Source-based self-review is not
  independent approval; root #1836 and actual exact-head protected checks still required.'
- 'Corpus: 392 reviewed, 14 pending, 54 needs_research across 460 records. Overall goal, protected merge and branch
  deletion remain incomplete. Postcommit docs-current and exact-head publication are separate gates, not preasserted
  here.'
- The initial 1146-test run passed, then lint identified two SIM300 assertion-operand-order violations. Only operand
  order was corrected. Original gate/probe outputs are preserved; focused tests, all1146selected tests, all12mutation
  probes and lint were rerun successfully against the corrected file. No assertion or canonical-data weakening.
