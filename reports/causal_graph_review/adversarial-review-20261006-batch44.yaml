adversarial_checks:
- All three whole records, nine original nodes and four original arrows reviewed. Primary main bodies/Methods/tables/captions
  read for all three. UFMP cache has appended full text despite stale abstract_only front matter; that
  front matter is preserved, not treated as an accurate reading-scope label. No figure images, separate
  supplementary files, raw data or analysis code audited.
- 'UFMP: preserve measured reactor substrate/product changes while marking member roles and both retained
  arrows HYPOTHESIZED with PARTIAL COMPUTATIONAL evidence. CLOS1 lactate/butyrate, LCO1 direct lactose
  and inconclusive ACID1 ethanol assignments must not become universal lactate dependence or terminal-chain-length
  diagnostics.'
- 'UFMP: six Actinobacteriota and three Firmicute MAGs retain exact canonical preferred names, not guessed
  species or representative pair attribution. The five-member proposed lactate-transfer subset is not
  measured flux. Existing #486/#624 taxonomy and grounding notes remain intact. Remove unsupported stereospecific
  CHEBI:422 from graph nodes without claiming the non-graph ingredient block is fixed.'
- 'UFMP: SPH2 is deliberately outside these existing nodes. Its proposed ethanol role does not justify
  automatically crediting it to the lactate network. The audit exposes exactly one new disconnected warning;
  no link is invented to hide it.'
- 'GOM: positive n-alkane and PAH measurements remain. GC-MS uses an abiotic baseline; n-alkane time points
  and PAH panel heterogeneity are not replaced by generic total-oil percentages. Remove unsupported representative
  dodecane and generic phenanthrene assertions. The gross endpoint is a crude-oil mixture measurement,
  not an identified polycyclic-arene concentration.'
- 'GOM: gross ~62% versus ~25-39% removal does not subtract abiotic loss. Each strain starts at 1e8 CFU/mL,
  so consortium and monoculture are not matched on total starting CFUs. Higher removal is not a selectively
  demonstrated synergy or niche-partitioning mechanism. Both class-to-comparative-endpoint arrows are
  removed. Relative population stability after day7 and MetaMIS directions are predictions, not newly
  added causal nodes.'
- 'GOM: the existing cache includes an abstract and one Methods sentence despite its FULL TEXT marker.
  Separately downloaded publisher main body is hash-identified in the ledger; source caches are not expanded
  to silence validation. Abstract snippets support broad observations, with body-based restrictions and
  source locations in explanations.'
- 'Garlic: selection and equal-proportion assembly are removed as workflow nodes, not converted into symbiosis.
  Preserve earlier 2026-10-02 arrow-removal history. The remaining two-day radish length result is IN_VIVO
  host evidence, not garlic yield, proven six-member synergy or necessity. B8-7 alone lacks growth promotion
  and does not significantly change M when added.'
- 'Garlic: retain the unresolved canonical Pseudomonas umbrella, explicitly not a strain-resolved roster
  or a claim of one species. Do not promote tentative 16S names to invented species CURIEs.'
- All current graph diffs inspected. Exactly three guarded records, three append-only history artifacts
  and three regenerated pages. 457 other records, all 920 caches, non-graph raw blocks and prior history
  artifacts preserved; old inline history is semantically unchanged.
- Schema, strict, terms, reference, snippet, rank and history checks passed. Existing 33 audit warnings
  preserved exactly plus one justified SPH2 warning; no structural errors. Repeat renders deterministic
  and published node/arrow descriptions parser-checked across all 456 pages; no browser screenshot claim.
- Six focused tests plus historical-batch and shared regressions passed. Reference-validator positive/negative
  canaries included. Three participant-registry additions (190 to 193), unchanged corrected connectivity
  census and unchanged numeric bounds. Production auditor and ranker semantics unchanged.
- Verification helper initially treated the network JSON object as a list; its assertion failed after
  all per-record gates passed. The helper was corrected without changing curated bytes, completed command
  logs were hash-checked and reused, and remaining verification completed. Failure and correction are
  explicitly retained; not a data-gate failure or a false pass.
- Dedup included 790 all-state issue titles/bodies and ignored/hidden local files. Five relevant issue
  bodies and prior UFMP/Garlic histories read. Existing render/audit logs naming candidates were not mistaken
  for completed source reviews. Not all comments or PR reviews inspected.
- Self-adversarial review is not independent approval. Exact-head COMMENT and actual post-commit docs-current
  are publication steps; protected main checks and dependent-parent merges remain mandatory. Full-corpus
  completion is not claimed.
