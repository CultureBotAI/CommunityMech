adversarial_checks:
- Baseline before research; read all four whole records and every original node/arrow, including the one-node zero-edge
  mineral-litter graph. Signaling, urea and mineral-litter primary main bodies, captions and embedded tables read.
  No separate supplements, raw-data or figure-pixel audit claimed. Native-cyanosphere context was retrieved but
  not used to expand the exact pair.
- Retain demonstrated selective carbon-for-nitrogen growth rather than erasing mutualism because the carrier is
  unresolved. CO2 is a fixation substrate, not the asserted transferred organic-carbon molecule.
- Urea evidence includes increased extracellular release, coordinated exact-pair expression and supplied-urea growth
  at5 but not2micromolar. The primary explicitly acknowledges unresolved absolute donor attribution; rates use total
  coculture biomass. Do not convert pool measurements into isotope-traced transfer or exclusive-carrier proof.
- 'The signaling source experimentally perturbs compounds and cyanosphere abundance. Preserve direct cyanobacterial
  motility/bundling causality. Correct the arrow that previously implied Massilia recruitment: the observed responding
  organism is Microcoleus. Remove true-chemotaxis annotation because PCC9802 showed no true Glu chemotaxis.'
- Distinguish natural bundles from the long-cultured strain with diminished reversal response. Retain concentration-dependent
  GABA effects, including high-GABA destabilization, rather than asserting monotonic improvement. Nutrient-exchange
  optimization remains a mechanistic interpretation. No untested feedback self-loop is added.
- 'Mineral-litter graph is already appropriately aggregate: net respiration/MBC, four canonical participants, unpartitioned
  carbonate CO2 and unmeasured enzyme-sorption/stabilization mechanisms. Preserve the record byte-for-byte and closed1011/1012
  fixes; no fabricated missing edge or gratuitous curation event.'
- Preserve Miscanthus positive AN reductions24.8% alone,32.6% with plants and25.5% plants alone. Preserve shoot/root
  gains39.8%/49.7% relative to dead SynCom. Nitrogen-cycle capability supports a contribution, but no quantitative
  partition or selective removal-to-growth mediation follows from the abstract.
- Plant growth can also increase nitrogen uptake; enrichment of seven strains is not a direct causal mediation experiment.
  Name the five canonical grouped entries without claiming ten resolved strain identities or equal member activity.
  Preserve the Sinomonas taxon mismatch for metadata1618.
- Gallium2019 source is an adapted A.ferrooxidans-only system at20g/L, not the2025 three-member15g/L system. Remove
  it from exact-consortium graph support. Use existing2025 component excerpts with PARTIAL provenance boundaries;
  do not equate a full-labeled cache with a complete primary article.
- Preserve joint acid/ferric production and the direct production-to-non-contact-recovery link. Remove unbalanced
  GaN/Cu equations, pH niche partition, untested synergistic/optimal ratios, mutualism/commensalism and continuous
  recycling. Move the terminal node from procedural design to its already-reported recovery endpoint, without adding
  topology.
- Preserve99.5% non-contact and45.59% contact gallium recovery and reported adsorption up to21.43%. Existing correct
  CHEBI84043 resolves the graph atom/ion confusion without asserting measured aqueous speciation. Separate B-EPS
  component roles and total-Ga accounting remain research1617.
- One-community Edison LITERATURE dry run completed, zero provider calls or credits. Scoped authorization question
  remains pending; do not treat a preselected answer or earlier generic permission as this run authorization. No
  new adsorption structure. Gallium remains needs_research.
- Guarded dry run caught a capitalized This where the primary abstract has lowercase this; corrected only the graph
  snippet and revalidated. Other raw sections and YAML anchors remain byte-preserved. Three append-only curation
  events/histories;457 records and920 caches unchanged. Canonical taxonomy and auditor rules unchanged.
- Actual schema, strict, term, references, snippets, history, both-root inventory/network/rank, repeat rendering,
  regression and lint outputs are retained with digests. Connectivity census unchanged. All44 pre-existing warnings
  preserved exactly; zero structural defects. Exact descriptions parsed across456 generated pages, not browser screenshots.
- Dedup901 all-state issue titles/bodies and ignored/hidden scoped local search; read1011,1012,596. Broader source-filename
  search had permission errors and truncated output, so it does not establish global absence. Scoped repository
  filename/PDF search included ignored files. No exhaustive historical PR-comment audit claimed.
- Tasks1614-1616 remain OPEN until protected-main merge; research1617 and metadata1618 remain OPEN afterward. Self-adversarial
  COMMENT is not independent approval. Postcommit docs-current is a separate publication gate; full corpus remains
  unfinished.
- 'The gallium full-record reference gate is NOT green: the untouched duration quotation at environmental_factors[2].evidence[0].snippet
  raises one identical error on parent and repaired records. Preserve the initial failed check, explicit baseline
  comparison and issue1618 follow-up. No graph reference errors and no new validator regression. Do not edit a faithful
  quoted snippet merely to satisfy a cache extraction boundary.'
