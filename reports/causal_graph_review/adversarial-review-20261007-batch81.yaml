adversarial_checks:
- Fresh both-root baseline and whole-record reads preceded paper-based curation. Every13existing node and4arrow
  has a retained decision; sparse graphs also reviewed. No new topology or paid provider job.
- PPCP retains aggregate aerobic/anoxic and simulated/real-wastewater removal, with8h tied only to aerobic SW. No
  complete mineralization, universal strain-specific transformation or metabolite handoff follows from removal.
  Preserve prior1048-1050roles/ranks/ARG evidence fixes.
- Abstract transformation and ARG statements are genuine research leads, not dismissed as nonexistent because full
  text was inaccessible. Authorized full-text follow-up1672is required before extending mechanistic topology. Genus
  read fractions do not prove strain persistence or a shared bacterial/fungal denominator.
- PPHET integration is a real composition manipulation, supported by main-text microscopy/plating/propagation/PCR
  reports, not merely a workflow step. Preserve its high-PHB contribution arrow and48%hybrid versus50%axenic versus10%WCRM
  comparison. Avoid adding unsupported colonization facilitation.
- PHB HPLC quantifies the bulk culture; BODIPY localization suggests additional cell contributors, not individual
  flux. Dark acetate38%/~23mg/L differs from light55%/~250mg/L. Distinct production conditions do not prove reduced
  competition through niche partitioning. Prior cross-feeding and workflow removals remain.
- High-light and38Cheat perturbations support positive community-associated resilience. Nonsterility alone had minor
  small-scale effects; scaled PPT1 collapse followed increased illumination. Keep4L33%/~250mg/L versus8L22%/~70mg/L
  separate. Neither non-aerated nor the authors fermentation word establishes measured anaerobiosis. Oxygen scavenging
  is proposed, and OTHER/PARTIAL repairs the discussion provenance without claiming a validator failure.
- Rice whole-exudate addition experimentally lowers CH4 for PSY1/PSY2 compared with Kitaake, with water controls.
  Do not erase that positive evidence while qualifying the specific amino-acid/H2 route. The plant is living, and
  hydroponic seedling exudate composition is distinct from mature soil-grown root flux.
- Rice microbial omics/modeling focuses PSY1, while the methane phenotype includes PSY2. Cumulative CH4 is integrated
  per tub because plants are destructively sampled. Preserve38/58%reductions without implying all pots/timepoints
  are independent repeated samples.
- H2-producing/consuming gene transcripts, genomic substrate preference and individual dFBA models are not directly
  measured H2 pools or an experimentally isolated pairwise competition. Models show oxygen-sensitive H2 consumption
  and exudate-associated biomass/production effects; do not state that exudate enrichment itself strongly raises
  H2 oxidation. Keep all3existing arrows explicitly partial/hypothesized.
- The direct exudate-to-methane arrow is still missing;1673tracks extension with the scoped15422character dry run.
  No provider submission, actual report or scoped approval exists. This record remains needs_research, despite its
  repaired existing arrows passing structural checks.
- Panax initial56%and LP2follow-up61%are distinct positive disease assays. The single-strain comparison does not
  by itself establish formal synergy or -/-competition. Mixed filtrates were produced separately and combined1:1;
  the100%application is surface-spread unlike2.5/40%PDA incorporation. Preserve24/30/38%inhibition without induced
  coculture biosynthesis.
- Panax root biomarkers support antioxidant response, not a proven distal systemic pathway or disease mediator.
  Results assign POD133/173%and SOD155/62%, differing from the abstract. Explicitly disclose the conflict rather
  than silently treating one abstract enzyme value as universal.
- Fungal richness, relative abundances and correlation-network complexity remain real outcomes, not direct cooperation,
  absolute abundance, strain-resolved colonization or experimentally tested resilience. Remove the unsupported symbiotic
  GO annotation. No new arrows between separate endpoints; prior1184-1186scope/type fixes remain.
- All28graph quotations match fresh primaries and unchanged caches. Three main texts/captions and PPCP abstract
  read; separate supplements/raw data/original figure pixels uninspected. Bounded reads resolve the initial truncated
  output without using it for absence claims.947all-state issue titles/bodies and10matched bodies plus622read; local
  ignored/hidden search is bounded by declared exclusions.
- Four append-only histories;456other records,920caches, canonical taxa and raw non-graph blocks preserved. No scope-count
  or auditor-rule change. Full schema/strict/term/reference/snippet/history, both-root inventory/network/rank and
  related regressions have actual output hashes. Deterministic repeat rendering and description checks across456pages
  are not browser screenshots.
- The first combined regression run passed, but Ruff caught twoB023locations in the loop-local test helper. Bind
  its rename mapping as a default argument; do not suppress the rule. Rerun the combined suite, Black and Ruff,
  preserving all3superseded outputs including the lint failure. Record/schema/history/source contents are unchanged
  by this test-only fix.
- Repairs1668-1671await protected-main merge. Research1672/1673and metadata1674remain open after repair merge. Self-adversarial
  COMMENT is not independent approval. Require exact remote head/tree/parent, postcommit docs-current and protected
  stack lifecycle; move dependents before deleting parents.
