adversarial_checks:
- 'Read all four whole records and every original node/arrow, including the empty peptide graph. Baseline
  preceded paper research. Seven primary sources: two exact-pair abstracts, three other exact-system main
  texts and two modeling main texts. Quantification accepted manuscript included supplement text; equation
  pages10-11 visually inspected. Other figure pixels, separate supplements and raw data not audited.'
- Retain Chlorella mutual growth enhancement, methane removal and nearly order-of-magnitude biomass carbon.
  Do not demote demonstrated positive mutual growth merely because its mediator is unresolved. Growth/removal-to-carbon
  arrow remains PARTIAL, not wholly unsupported.
- Chlorella biomass carbon and pH are culture-level endpoints, not measured partner carbon flux or colonization.
  The pH-to-carbon arrow remains explicitly HYPOTHESIZED. Abstract scope does not establish absence of
  selective controls in inaccessible full Methods.
- Both models actually study M.buryatense5GB1/A.platensis, not a generic validated model of either reviewed20Z
  pair. Remove their graph evidence but retain bounded discussion context. DynamiCom nitrogen exchange
  is an unvalidated mechanism prediction and cannot establish Chlorella pH recovery. No new nitrogen-exchange
  graph is minted.
- Retain experimentally supported photosynthetic oxygen supply and gas-fed biomass conversion. An O2-depleted
  reactor with no fedCH4/O2 mixture does not imply anaerobic methanotrophy. Directed benefit or net community
  biomass does not by itself establish reciprocal fitness enhancement.
- 'Read quantitative-follow-up equations3-9 and visually verify pages10-11: methane uptake and growth
  stoichiometry estimate methanotroph biomass/O2/CO2, then measured overall gas/TIC changes give photoautotroph
  rates. DissolvedO2 is neglected. Flow cytometry and OD comparisons validate biomass estimates, not independent
  gas-flux measurements.'
- Preserve20ZR/PCC7002 follow-up versus20z original continuous reactor. The separate M.capsulatus/C.sorokiniana
  freshwater pair shows oxygen-limited inoculum response; the saltwater pair is interpreted as methane-mass-transfer-limited.
  Do not import freshwater results or transfer its organisms into the canonical pair.
- The peptide record is a panel of two separately produced lyophilized biomasses, not a five-member community.
  Commercial Alcalase processing, chemical assays and in silico peptides do not justify ecological nodes
  or workflow arrows. Preserve the empty graph, positive assay endpoints, C1/C2 membership, PRIDE identifiers
  and prior flat-photobioreactor/extraction fixes.
- 'Peptide activity is assay-dependent: C1 ABTS decreases after hydrolysis while ORAC increases, and phenolics
  can contribute. Predicted peptides are not measured exchanged products. Absence of a supported graph
  here is not evidence that no living interaction exists; discussion remains OPEN.'
- Sulfadiazine primary supports causal donor release, recipient assimilation and complementary intermediate
  removal, not mere correlation. Retain all3 nodes and both supported arrows. First arrow now states how
  donor release enables recipient assimilation rather than restating its endpoint.
- The dual-labeled substrate does not establish independent nitrogen incorporation. The primary explicitly
  attributes the1000-to988cm-1 phenylalanine shift to13C, not15N. Retain42.8+/-1.8% and45.9+/-3.2% labeled
  recipient fractions and allow below-threshold activity; do not make every cell active.
- Preserve initial population decline and subsequent Terrabacter recovery rather than uninterrupted mutual
  growth. Parent disappears byday2 inBR1 alone andday4 in coculture. The benefit is2-AP removal, not faster
  parent loss. Nondetection is atdays0,2,4, not continuous absence or measured closed-carbon-balance mineralization.
- Donor protection by intermediate scavenging is proposed, not selectively demonstrated feedback. No new
  return arrow is added. Preserve prior dual-label coculture snippet1196 and BrunnerMSM discussion1195;
  blanket axenic-label protocol and stock provenance remain metadata1612.
- Guarded dry run matched all17 retained graph snippets to selected caches and fresh primary. New peptide
  discussion excerpt separately checked against primary. Four append-only events and history artifacts;456
  other records,920 caches and all non-graph raw blocks preserved. Canonical taxa are unchanged, not recertified.
- Census adds one mixed/community-scope Chlorella record and its two existing taxa to the community-scope-only
  denominator. This is not new taxonomy or equal causal credit. Synechococcus remains community-level;
  the peptide graph remains empty. All44 baseline warnings preserved exactly; zero structural defects.
- Actual schema,strict,terms,references,snippets,history, inventory,rank,network, repeat rendering, regressions
  and lint outputs retained with digests. A new-test lambda assignment failed an exploratory lint check
  and was replaced by a set comprehension; final lint and focused16-test run verify the corrected file.
  Exact HTML descriptions parsed across456 pages, not browser screenshots. Postcommit docs-current is
  a separate publication gate.
- Dedup included all896 issue titles/bodies and ignored/hidden local search, with four matching prior
  bodies read. Tasks1608-1611 remain OPEN until protected-main merge; metadata1612 remains OPEN afterward.
  This exact-head self-review is COMMENT, not independent approval. Full corpus remains unfinished.
