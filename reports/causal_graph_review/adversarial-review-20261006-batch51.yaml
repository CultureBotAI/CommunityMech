adversarial_checks:
- Whole661-line ammonia,475-line switchgrass and192-line Core-20 records and all nine nodes/six arrows
  reviewed. Complete cached primary main bodies, Methods and embedded figure captions read, plus ammonia
  Table1. No original figure images, supplements, raw data or code audited.
- 0B positive single-culture butyrate-to-methane conversion remains SUPPORT/IN_VITRO, separate from PARTIAL
  MAG-resolved syntrophy. Canonical source/target directions and three SYNTROPHY hypotheses retained.
  Do not transfer YB replication, carbon balance or yeast-extract results to 0B.
- MAG2 incomplete Wood-Ljungdahl annotation is not filled using its relative. MAG-specific flux, carrier
  partition and partner necessity remain unresolved. Relative Methanothermobacter succession is not rate
  improvement; proposed MAG5 acetate assimilation is not acetoclastic methane formation. Existing gap/evidence
  extended, not duplicated or erased.
- Switchgrass maintains positive bulk solubilization and methane outcomes; one sequential reactor and
  changed vitamins, medium, mixing and adaptation do not isolate a solids-only mechanism. Protein abundance
  is not catalytic activity, and hydrogenotrophic protein dominance is not a measured methane-flux share.
- Fraction-associated CAZyme profiles remain positive observations supporting the authors' suggested niches,
  not demonstrated competitive partitioning or a Chloroflexota-to-Thermotogota pair. Explicit participants
  are the canonical five-member subset for the community phenotype, two profile groups and the archaeal
  capacity group. All three nodes remain community-scoped.
- Core-20 preserves positive qPCR immune transcripts and the reported78-fold pathogen-load reduction.
  Transcript abundance is not AMP protein activity, qPCR load is not viable-cell count, and composition
  differences do not isolate richness. Rename the terminal outcome and qualify proposed immune mediation
  without falsely claiming that the original incoming edge lacked interpretation wording.
- Core-20 W8131 non-detection was already bounded and remains so. Four passages with changed diversity
  and relative abundance do not prove unchanged composition or protective efficacy in every passage. Existing
  broad Bacteria participant remains a placeholder, not a complete strain/host/pathogen roster or newly
  minted CURIE.
- 'Structural completeness considered explicitly: proposed direct MAG1 carrier routes, alternative MAG9
  functions, AA6/Fenton accessibility and PTS/nutrient competition remain acknowledged gaps. This batch
  repairs existing claims, not exhaustive mechanism expansion. No new node, arrow or paid Edison job;
  no speculative route represented as experimentally established.'
- Inspected complete record diffs and focused tests. Nine nodes retained and all six existing arrows explicitly
  PARTIAL. Three guarded writes and append-only history artifacts; all457 other records and920 caches
  unchanged. Non-graph raw blocks and canonical taxonomy preserved, not certified. One participant registry
  entry added; measured connectivity census unchanged.
- Actual schema, strict, terms, references, snippets, rank and history gates passed. Network equals baseline
  with34 prior findings and zero structural errors. Deterministic renders and exact node/arrow descriptions
  across456 pages parser-checked, not browser screenshots. Actual post-commit docs-current is a separate
  publication gate.
- Dedup checked806 all-state issue titles/bodies and25 ignored/hidden local files, not every comment or
  PR review. Closed401/366 concern taxonomy tooling, not these graph repairs. Issues1497/1498/1499 stay
  open until protected main merge. Self-adversarial review is not independent approval.
