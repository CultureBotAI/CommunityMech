      composition shift of AtSC6 on Col-0 roots.
  - source: DAPG/Pyoverdine-Dependent AtSC6 Remodeling
    target: R401 Root Invasion of AtSC6-Precolonized Arabidopsis
    description: R401-induced AtSC6 remodeling is the community shift required for R401 to invade and dominate Arabidopsis
      roots.
  edges_after:
