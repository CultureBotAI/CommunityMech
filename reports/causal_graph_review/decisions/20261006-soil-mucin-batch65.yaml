  renamed_nodes: {}
  node_decisions:
  - node: Primary Chitin Polymer Degradation
    rationale: Retain conditional monoculture chitin use without assigning exclusive mixed-community donor roles.
  - node: Chitin Breakdown Product Sharing
    rationale: Retain proposed product sharing with pellet-metabolite and mixed-bag modeling limits.
  - node: Community-Responsive Streptomyces Chitin Phenotype
    rationale: Retain community-responsive Streptomyces observations without equating temporal transcripts with
      induction or enzyme flux.
  removed_node_decisions: []
  edges_before:
  - source: Primary Chitin Polymer Degradation
    target: Chitin Breakdown Product Sharing
    description: Primary chitin degradation releases soluble decomposition products that other MSC-2 members can
      consume in the mixed community.
  - source: Chitin Breakdown Product Sharing
    target: Community-Responsive Streptomyces Chitin Phenotype
    description: Initial community chitin breakdown provides products that let Streptomyces grow and express a chitin-decomposition
      phenotype not seen during monoculture growth on chitin.
  edges_after:
  - source: Primary Chitin Polymer Degradation
    target: Chitin Breakdown Product Sharing
    description: HYPOTHESIZED - chitin degradation by community members releases assimilable products that could
      support other members. Monoculture growth, community transcripts and cell-pellet metabolites support this
      model, but they do not measure donor-to-recipient extracellular flux or prove that the five monoculture-positive
      isolates are the exclusive initial donors.
  - source: Chitin Breakdown Product Sharing
    target: Community-Responsive Streptomyces Chitin Phenotype
    description: HYPOTHESIZED - products supplied by other community members could relieve an initial resource limitation
      and allow Streptomyces to grow and express chitin-associated machinery. The primary Discussion proposes this
      explanation, while noting possible NAG repression during preconditioning. No selective product rescue, partner-removal
      test or matched mono-versus-community enzyme assay establishes this causal route.
