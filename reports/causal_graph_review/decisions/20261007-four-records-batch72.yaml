limitations:
- All9 original nodes and6 arrows retained with bounded evidence and scope. One existing empty graph independently
  reviewed and preserved. No new structure or provider submissions.
- Exact Chlorella/20Z and original20z/PCC7002 papers are primary-abstract-supported; publisher and PNNL full text
  respectively returned403. This does not prove absent controls. Search highlights were leads, not additional graph
  evidence.
- Complete primary main texts/captions and embedded tables read for peptides, sulfadiazine and both modeling papers.
  Public quantitative-follow-up accepted manuscript main text/tables/captions and included supplement text read;
  equation pages10-11 visually checked. Other figure pixels, separate supplements and raw data not audited.
- Both modeling studies concern M.buryatense5GB1/A.platensis, not either reviewed20Z pair. Their nitrogen-exchange
  predictions are contextual hypotheses, removed from direct graph evidence. Positive Chlorella mutual growth, methane
  removal and whole-biomass carbon are preserved.
- Photosynthetic O2 support and positive gas conversion remain. Individual gas fluxes are inferred from overall
  gas/TIC measurements and growth coefficients; flow cytometry supports biomass estimation, not independent gas-flux
  validation. Preserve20ZR derivative and separate freshwater pair.
- Peptide C1/C2 are separate lyophilized biomass panels; commercial Alcalase treatment and predicted peptides do
  not establish a living ecological chain. Empty graph is justified by this source, not a universal no-interaction
  claim.
- Sulfadiazine donor-to-recipient cross-feeding remains supported. Raman supports13C incorporation, not independent15N
  assimilation. Preserve heterogeneous activity and sampled intermediate nondetection; parent disappears faster
  in BR1 alone. No closed carbon-balance mineralization or selective donor-protection test asserted.
- All920 caches and raw non-graph blocks unchanged, not recertified. Canonical taxa unchanged. Non-graph gas-rate/protocol,
  axenic isotope-label and medium/stock follow-up1612 remains OPEN; prior952/953/1195/1196 fixes preserved.
- Dedup covered896 all-state issue titles/bodies and ignored/hidden-inclusive local search with40 matching files.
  Four matching issue bodies952,953,1195,1196 read. No exhaustive PR-comment or local historical report audit claimed.
- Self-adversarial review is not independent approval. Tasks1608-1611 remain OPEN until protected-main merge. Reviewed
  status is bounded existing-graph review, not complete corpus or whole-record certification.
