  not independently recomputed.
- MUCC core occupancy and genus networks are observational; MAG annotations are potential. Cross-site flux prediction
  and transcription do not establish causal syntrophy. Methanol specificity removed from graph; temporal input alignment
  remains unresolved.
- MWF001 retains supported cross-feeding with exact-metabolite and residual-resource limits. Generic models do not
  resolve exact strains; finite persistence has no-carbon/high-malate exceptions. Candidate causal structure remains
  unfinished, not denied.
- Magnetite bulk methane response is partial moderate-sulfate improvement. Abiotic sulfide removal does not isolate
  biotic mediation or DIET. Single-replicate relative MAG abundance is not replicated absolute growth; role-curated
  output-constrained GEMs provide feasible, nonunique flux hypotheses.
- 'Canonical taxonomy and raw non-graph blocks preserved, not recertified. #1574 remains OPEN for metadata/source
