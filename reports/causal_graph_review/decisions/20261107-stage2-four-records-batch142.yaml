        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Using this engineered B. subtilis strain BS1, the residual ethanol
        in the brewing wastewater was oxidized to acetaldehyde by alcohol dehydrogenase
        (Adh), which was subsequently converted into acetate catalyzed by aldehyde
        dehydrogenase (AldH), constituting a dual‐enzyme cascade reaction that efficiently
        removed ethanol, thus eliminating ethanol inhibition on the EET efficiency
        of S. oneidensis.
      explanation: Describes the heterologous Adh-AldH dual-enzyme ethanol-to-acetate
        oxidation cascade in engineered B. subtilis BS1.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In contrast, the wild‐type strain BS0 removed only approximately 35.6%
        of ethanol within 48 h, lowering the ethanol concentration from 1.8% to 1.16%
        (v/v) (Figure 2b ).
      explanation: Establishes the wild-type B. subtilis BS0 ethanol removal baseline
        (~35.6% removal over 48 h) against which engineered BS1 is compared.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: When cultivated with the brewing wastewater, strain BS1 achieved a
        higher maximum cell density (OD600, max of 0.884), while the wild‐type B.
        subtilis (BS0, Table  1 ) exhibited OD600, max of 0.641 (Figure  2a ). Following
        48‐h fermentation, ethanol in the brewing wastewater was effectively consumed
        by strain BS1, with the ethanol concentration dropping from 1.8% to 0.01%
        (v/v), corresponding to an ethanol removal efficiency of 99.4% (Figure  2b
        ).
      explanation: Quantifies BS1 maximum cell density (OD600,max 0.884 vs 0.641 in
        BS0) and 99.4% ethanol removal efficiency (1.8% to 0.01% v/v in 48 h) in brewing
        wastewater.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These findings demonstrated that the Adh‐AldH dual‐enzyme cascade reaction
        conferred on strain BS1 with an outstanding ethanol catabolic capacity, enabling
        strain BS1 to rapidly proliferate in the ethanol‐containing brewing wastewater
        and to efficiently remove the residual ethanol.
      explanation: Confirms that the P43::adh-aldH dual-enzyme cascade drives rapid
        BS1 proliferation and 99.4% ethanol removal in brewing wastewater.
