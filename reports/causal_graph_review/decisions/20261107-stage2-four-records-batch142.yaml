      by BS1
    rationale: Supported by primary source (PMID:42733304, Fig. 2a-b, Table 1, Section
      2.1-2.2) with COMMUNITY_LEVEL scope for the single-strain isolate baseline (B.
      subtilis 168 BS1).
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
