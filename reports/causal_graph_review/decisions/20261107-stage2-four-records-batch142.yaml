  summary: Reviewed and enriched the 2-node, 1-edge COMMUNITY_LEVEL causal interaction
    graph for the engineered S. oneidensis SO2 + B. subtilis BS1 brewing-wastewater
    NCM bioleaching consortium in PMID:42733304 with 2 additional non-overlapping
    verbatim snippets (5 -> 7 interaction EvidenceItems) while retaining the directed
    downstream edge.
  node_decisions:
  - node: SO2 Ptac::ribADEHC Riboflavin Overproduction and BS1 Ethanol Detoxification
    rationale: Supported by primary source (PMID:42733304, Fig. 3a-c, Table 1, Section
      2.3) with COMMUNITY_LEVEL scope covering S. oneidensis SO2 and B. subtilis BS1.
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Shewanella oneidensis MR-1 SO2
        term:
          id: NCBITaxon:70863
          label: Shewanella oneidensis
      - preferred_term: Bacillus subtilis 168 BS1
        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: When fed with the brewing wastewater, riboflavin synthesized by the
        SO2‐BS1 consortium reached 3.65 µm, 13.22‐fold higher than that synthesized
        by the SO1‐BS1 consortium (0.276 µm, Figure 3b ). Correspondingly, the maximum
        power density achieved by the SO2‐BS1 consortium rose to 243.71 mW m−2, 2.10‐fold
        increase relative to the SO1‐BS1 consortium (116.15 mW m− 2, Figure 3c ),
        demonstrating an improved EET rate of the SO1‐BS1 consortium via enhanced
        riboflavin synthesis.
      explanation: Demonstrates the 13.22-fold increase in riboflavin (3.65 uM) and
        2.10-fold increase in EET power density (243.71 mW m^-2) in SO2-BS1.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Using this engineered B. subtilis strain BS1, the residual ethanol
        in the brewing wastewater was oxidized to acetaldehyde by alcohol dehydrogenase
        (Adh), which was subsequently converted into acetate catalyzed by aldehyde
        dehydrogenase (AldH), constituting a dual‐enzyme cascade reaction that efficiently
        removed ethanol, thus eliminating ethanol inhibition on the EET efficiency
        of S. oneidensis.
      explanation: Documents the Adh-AldH ethanol-to-acetate detoxification function
        contributed by B. subtilis BS1.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: To this end, a riboflavin biosynthesis pathway containing GTP cyclohydrolase
        II/ 3,4‐dihydroxy‐2‐butanone 4‐phosphate synthase (RibA), pyrimidine deaminase/reductase
        (RibD), riboflavin synthase (RibE), 6,7‐dimethyl‐8‐ribityllumazine synthase
        (RibH), and riboflavin kinase (RibC) was first overexpressed in SO1 driven
        by the promotor of Ptac, resulting in the recombinant strain SO2 (Ptac‐ribA‐ribD‐ribE‐ribH‐ribC)
        (Figure  3a and Table  1 ).
      explanation: Documents the construction of recombinant S. oneidensis SO2 overexpressing
        the Ptac-driven ribADEHC riboflavin biosynthesis operon to boost EET in SO2-BS1.
  - node: SO2-BS1 Riboflavin-Accelerated NCM Metal Oxide Leaching and Late-Stage Rate
      Decline
    rationale: Supported by primary source (PMID:42733304, Fig. 3d-h, Fig. 4a, Fig.
      S2, Section 2.3-2.4) with COMMUNITY_LEVEL scope covering S. oneidensis SO2 and
      B. subtilis BS1.
    field_path: ecological_interactions[1]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Shewanella oneidensis MR-1 SO2
        term:
          id: NCBITaxon:70863
          label: Shewanella oneidensis
      - preferred_term: Bacillus subtilis 168 BS1
        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The results showed 64.1 mg L−1 of the metal ions were leached when
        catalyzed by the SO2‐BS1 consortium, representing a 1.26‐fold increase compared
        to that catalyzed by the SO1‐BS1 consortium (50.7 mg L−1, Figure 3d ). Furthermore,
        the maximal metal oxide leaching rate was 16.4 mg L−1·day−1 (the SO2‐BS1 consortium),
        1.33 times higher than that catalyzed by SO1‐BS1 biocatalyst (12.3 mg L−1·day−1,
        Figure S2 ).
      explanation: Quantifies the 64.1 mg L^-1 total metal leaching and 16.4 mg L^-1
        day^-1 maximal leaching rate of the SO2-BS1 consortium.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Specifically, the leached concentrations of Li, Ni, Co, and Mn catalyzed
        by the SO2‐BS1 consortium reached 53.1, 4.7, 1.9, and 4.4 mg L−1, respectively,
        achieving leaching efficiencies of 66.5%, 18.6%, 20.2%, and 33.3% (Figure
        3e–h ).
      explanation: Quantifies element-resolved Li, Ni, Co, and Mn concentrations and
        leaching efficiencies for SO2-BS1.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Specifically, the average leaching rates decreased from 7.222 mg L−1·day−1
        to 0.921 mg L−1·day−1 for the SO1‐BS1 consortium, from 9.867 to 0.617 mg L−1·day−1
        for the SO2‐BS1 biocatalyst, and from 10.033 to 1.171 mg L−1·day−1 for the
        SO2‐BS2 consortium, as shown in Figure 4a .
      explanation: Quantifies the drop in SO2-BS1 average metal leaching rate from
        9.867 mg L^-1 day^-1 (days 1-6) to 0.617 mg L^-1 day^-1 (days 7-14).
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These findings indicated that the improvement of EET in the dual‐species
        microbial consortium through the promotion of riboflavin synthesis enhanced
        its performance in catalyzing the brewing wastewater‐mediated reduction of
        NCM, thereby further facilitating metal oxide leaching.
      explanation: Directly supports the causal relationship from riboflavin-boosted
        EET in SO2-BS1 to enhanced brewing-wastewater-mediated NCM reduction and metal
        oxide leaching.
