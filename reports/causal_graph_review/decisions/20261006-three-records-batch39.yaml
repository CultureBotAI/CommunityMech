  renamed_nodes: {}
  node_decisions:
  - node: Ferrous Iron Oxidation for Metal Dissolution
    rationale: Retain culture iron oxidation without syntrophy or inappropriate transport/carbon-fixation annotations.
  - node: Base Metal Exposure in PCB Leachate
    rationale: Retain actual ferric/ferrous feedback with assay-specific metal concentrations and no faster-dissolution
      claim.
  - node: PCB Toxicity and Microbial Adaptation
    rationale: Retain operational adaptation and its oxidation-lag effect without a universal threshold or resolved
