- All21 graph quotations match selected existing caches;17 also match fresh primary XML with whitespace-only normalization
  and4 moss quotations visually match the publisher-indexed abstract. Cache matching is not entailment. No complete
  primary articles added to the repository; all920 caches preserved.
- Core microbiome is operational, not universal or independent of host/inoculum; plasmid content and genomic function
  support hypotheses, not measured exchange or fitness. Preserve positive replicated enrichment and stabilization.
- Preserve formaldehyde lowering and positive growth assays; PCA control retains inhibition. Selected CM4744 methionine
  rescue requires added producer substrate, and C.fimi-supported methylotroph growth is a separate assay. Canonical
  species IDs preserved; strain metadata remains separate.
- Preserve moss treatment gains and reported facilitation. Remove shared-outcome direction and reciprocal-fitness
  labels, not positive growth. Retain mucin substrate effects, conditional composition mediation, O/N-glycan distinction
  and measured profiles without inferred donor-recipient flux.
- Scanned906 all-state issue titles/bodies for dedup with31 ignored/hidden local matches under explicit git/docs/site/cache
