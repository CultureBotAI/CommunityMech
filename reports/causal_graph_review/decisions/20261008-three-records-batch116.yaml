    source: Cellulose Hydrolysis to Soluble Sugars
    target: Lactic Acid Fermentation and Oxygen Depletion
    description: Soluble carbohydrates released by T. reesei are funneled by lactic-acid bacteria to lactate, the
      central intermediate of the short-chain-fatty-acid platform.
  - &id007
    source: Lactic Acid Fermentation and Oxygen Depletion
    target: Butyric Acid Production from Lactate
    description: Lactate produced by L. pentosus supplies the central fermentation intermediate that C. tyrobutyricum
