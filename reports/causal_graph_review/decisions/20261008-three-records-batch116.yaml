    commensalism.; Preserve LAB redox evidence alongside continuing fungal oxygen consumption, without reciprocal
    syntrophy or LAB-alone anoxia.; Restore experimentally supported co-substrate dependence and distinguish recipient
    production, alternative arms and pretreated three-member benchmark.
  node_decisions:
