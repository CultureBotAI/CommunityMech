  scope: Whole record and every existing node/arrow reviewed; graph repair, not whole-record certification.
  summary: Retain phase-specific hydrolysate cross-feeding without erasing the initial glucose phase or overgeneralizing
    cellulolytic incapacity.; Make recipient growth explicit, retain conditional commensalism interpretation, and
    remove dependence-as-mediator of all treatment responses.; Retain observed competition with viability, relative-growth
    and fluorescence-proxy limits; pigment mediation remains unresolved.
  node_decisions:
  - node: Cellulase-Driven Hydrolysate Cross-Feeding
    rationale: Retain phase-specific hydrolysate cross-feeding without erasing the initial glucose phase or overgeneralizing
      cellulolytic incapacity.
  - node: Streptomyces Growth on Fungal Hydrolysate
    rationale: Make recipient growth explicit, retain conditional commensalism interpretation, and remove dependence-as-mediator
      of all treatment responses.
  - node: Tunable Filamentous Population Dynamics
    rationale: Retain observed competition with viability, relative-growth and fluorescence-proxy limits; pigment
      mediation remains unresolved.
  removed_node_decisions: []
  renamed_nodes:
    Noncellulolytic Partner Dependency: Streptomyces Growth on Fungal Hydrolysate
  edges_before:
  - &id009
    source: Cellulase-Driven Hydrolysate Cross-Feeding
    target: Noncellulolytic Partner Dependency
    description: 'Cellulase-driven hydrolysis by T. reesei is the upstream source of the hydrolysate sugars that
      noncellulolytic S. coelicolor depends on.

      '
  - &id011
    source: Noncellulolytic Partner Dependency
    target: Tunable Filamentous Population Dynamics
    description: 'Streptomyces coelicolor dependency on Trichoderma reesei cellulase products makes the initial
      two-member population balance determine later cellulose-supported growth, cellulase formation, and pigment
      production.

      '
  edges_after:
  - &id010
    source: Cellulase-Driven Hydrolysate Cross-Feeding
    target: Streptomyces Growth on Fungal Hydrolysate
    description: After initial glucose-supported growth, fungal cellulase activity supplies hydrolysate sugars that
      enable continued S. coelicolor growth on the cellulose-containing medium. This resource dependence is phase-specific,
      not the sole cause of inoculum or abiotic treatment responses.
  retained_edge_decisions:
  - before: *id009
    after: *id010
    rationale: After initial glucose-supported growth, fungal cellulase activity supplies hydrolysate sugars that
      enable continued S. coelicolor growth on the cellulose-containing medium. This resource dependence is phase-specific,
      not the sole cause of inoculum or abiotic treatment responses.
  removed_edge_decisions:
