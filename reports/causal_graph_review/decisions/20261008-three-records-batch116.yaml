    source: Cellulose Hydrolysis to Soluble Sugars
    target: Lactate Supply and Redox Facilitation
    description: Fungal hydrolysis supplies fermentable carbohydrates that L. pentosus converts to lactate. This
      substrate route enables LAB metabolism in the membrane reactor; it does not make fungal hydrolysis alone sufficient
      for the observed redox state.
  - &id008
