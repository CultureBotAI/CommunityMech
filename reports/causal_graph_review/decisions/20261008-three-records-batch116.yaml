    rationale: Retain carbohydrate cross-feeding while separating cellulose hexoses from supplied pentoses and unsupported
      commensalism.
  - node: Lactate Supply and Redox Facilitation
    rationale: Preserve LAB redox evidence alongside continuing fungal oxygen consumption, without reciprocal syntrophy
      or LAB-alone anoxia.
  - node: Butyrate Production by Lactate-Acetate Co-fermentation
    rationale: Restore experimentally supported co-substrate dependence and distinguish recipient production, alternative
      arms and pretreated three-member benchmark.
