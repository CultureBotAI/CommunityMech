  and embedded captions. Ammonia main Table1 read. No original figure images, supplements, raw data or code audited.
- 'Existing-structure repair only: nine nodes and six arrows retained; all arrows explicitly PARTIAL. No new causal
  structure or paid Edison job. Unrepresented proposed MAG1 carrier routes, AA6/Fenton chemistry and PTS/nutrient
  competition are acknowledged gaps, not new demonstrated mechanisms or an exhaustive expansion.'
