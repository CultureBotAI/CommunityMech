  node_decisions:
  - node: Core-20 Gut Colonization
    rationale: Retain positive colonization and prior W8131 caveat; distinguish passage persistence from unchanged
      composition and passage-specific protective efficacy.
  - node: Core-20 Immune Priming
    rationale: Preserve positive measured immune transcripts, not protein activity; qualify protective mediation.
  - node: Core-20-Associated Hafnia alvei Load Reduction
    rationale: Rename to the observed positive load endpoint without asserting immune mediation, eradication or
      a richness-only effect.
  removed_node_decisions: []
  edges_before:
  - source: Core-20 Gut Colonization
    target: Core-20 Immune Priming
    description: In vivo Core-20 gut colonization provides the defined community context that stimulates antimicrobial
      peptide expression before Hafnia alvei challenge.
  - source: Core-20 Immune Priming
    target: Immune-Mediated Hafnia alvei Reduction
    description: Core-20 immune-gene induction coincided with reduced H. alvei loads after oral challenge and was
      interpreted as part of the protective mechanism.
  edges_after:
  - source: Core-20 Gut Colonization
    target: Core-20 Immune Priming
    description: PARTIAL - experimental Core-20 inoculation and establishment provide the microbial exposure that
      induces host immune-gene expression before challenge. The positive treatment response supports this link,
      but the separate serial-passage result does not establish persistent colonization as the necessary mediator
      or protection at every passage.
