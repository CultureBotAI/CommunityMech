    Hydrogenotrophic Methanogenic Sink: Methane Production and Inferred Hydrogenotrophic Route
  node_decisions:
  - node: High-Solids Switchgrass Carbohydrate Solubilization
    rationale: Preserve positive bulk solubilization with the sequential-reactor and catalytic-mediation limits;
      remove unqualified NICHE_PARTITIONING.
  - node: Fraction-Associated CAZyme Protein Profiles
    rationale: Retain measured fraction-associated protein profiles and author interpretation without pairwise exchange
      or proven competitive niche partitioning.
  - node: Methane Production and Inferred Hydrogenotrophic Route
    rationale: Retain positive gas production and PARTIAL hydrogenotrophic-route inference without quantitative
      pathway dominance or universal partner assignment.
  removed_node_decisions: []
  edges_before:
  - source: High-Solids Switchgrass Carbohydrate Solubilization
    target: Hydrogenotrophic Methanogenic Sink
    description: High-solids carbohydrate solubilization and downstream fermentation provide the reducing equivalents
      and carbon flow that support methane and carbon dioxide as the main steady-state reactor products.
  - source: Fraction-Specific CAZyme Functional Niches
    target: High-Solids Switchgrass Carbohydrate Solubilization
    description: Spatially partitioned Chloroflexi and Thermotogae CAZyme contributions are part of the bacterial
      enzyme strategy that maintains fractional carbohydrate solubilization as switchgrass solids increase.
  edges_after:
  - source: High-Solids Switchgrass Carbohydrate Solubilization
    target: Methane Production and Inferred Hydrogenotrophic Route
    description: PARTIAL - carbohydrate solubilization followed by fermentation can supply carbon and reducing equivalents
      to methanogenesis, connecting the measured reactor outcomes. The broad trophic model is supported by bulk
      products and protein profiles, but the hydrogenotrophic contribution and exact donor-to-methanogen flux were
      not selectively quantified.
  - source: Fraction-Associated CAZyme Protein Profiles
    target: High-Solids Switchgrass Carbohydrate Solubilization
    description: PARTIAL - fraction-associated CAZyme proteins could contribute complementary hydrolysis functions
      that maintain carbohydrate solubilization. Protein abundance and localization profiles support this interpretation,
      not selective perturbation establishing that spatial partitioning causes the maintained phenotype.
