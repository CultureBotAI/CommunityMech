  actual_read_scope:
  - All four fresh EuropePMC abstracts and Crossref identities checked. Biomethanation and tobacco complete main-body
    XML texts read including methods,results,discussion,table text and captions. No original figure pixels,separate
    supplementary files,raw data or analysis code audited. Figure alt text is not independent experimental evidence.
  - Arsenic and compost changes are abstract-bounded. Neither EuropePMC metadata exposed a PMC article; DOI searches
    found publisher pages whose opens returned403. No exhaustive full-text absence claim,access bypass or author
    contact. Existing caches retained; no article-body import. Tobacco source license is CC BY-NC-ND4.0,not unrestricted
    CC BY.
  - Arsenic retains direct NanoSIMS carbon transfer and reciprocal-growth mutualism. Supplemented heterotroph culture
    and genomic complementarity do not independently establish oxygen-source necessity,nitrogen transfer or the
    identity of exchanged carbon compounds. Existing culture-conditions discussion remains open.
  - Biomethanation preserves measured methane and VFA outcomes from a single sequential CSTR. External gas supply
    is not microbial cross-feeding. Taxon-specific routes and thermodynamic cooperation remain interpretations;
    qPCR counts are not activity or viability. Washout affects pools,phase1sampling wording is not assigned to phase4.
    Non-graph roles/viability claims remain1935.
  - Compost retains reported maturation,transient ARG rebound and later attenuation. KEGG and potential host-gene
    networks are not expression,actual motility or transfer-frequency measurements. Maturation-to-attenuation remains
    PARTIAL; no maturation-to-profile causation is inferred from shared inoculation. Non-graph overview/role/access
    wording remains1936.
  - Tobacco keeps positive strain-specific broth and combined field-treatment results,including the Y878 null enhancement.
    cheA positivity is potential,not measured root migration; authors call for non-chemotactic controls. Source
    species/strain rows,resource-count discrepancies and tomato caption wording remain1937. The graph does not certify
    the current merged two-row taxonomy.
