  scope: Whole record and every existing node/arrow assessed. Non-graph fields preserved, not certified.
  summary: Retain nutrient-supported growth without a generic-to-specific workflow arrow or direct photosynthesis-flux
    claim.; Retain precursor availability, added-tryptophan conversion and attachment responses without a complete
    traced endogenous loop.; Retain observed promotion and late death with HYPOTHESIZED IAA mediation, not categorical
    predation or unique death mechanism.
  renamed_nodes:
    IAA-Mediated Algal Growth Promotion And Killing: Algal Growth Promotion and Late Killing with Proposed IAA Mediation
  node_decisions:
  - node: Algal Nutrient Provisioning Supports Bacterial Growth
    rationale: Retain nutrient-supported growth without a generic-to-specific workflow arrow or direct photosynthesis-flux
      claim.
  - node: Tryptophan-Enhanced Bacterial Attachment And IAA Production
    rationale: Retain precursor availability, added-tryptophan conversion and attachment responses without a complete
      traced endogenous loop.
  - node: Algal Growth Promotion and Late Killing with Proposed IAA Mediation
    rationale: Retain observed promotion and late death with HYPOTHESIZED IAA mediation, not categorical predation
      or unique death mechanism.
  removed_node_decisions: []
  edges_before:
  - source: Algal Nutrient Provisioning Supports Bacterial Growth
    target: Tryptophan-Enhanced Bacterial Attachment And IAA Production
    description: Algal nutrient provisioning sustains P. inhibens growth in the non-permissive L1-Si medium, putting
      the heterotroph in the phycosphere where algal tryptophan stimulates attachment and IAA production.
  - source: Tryptophan-Enhanced Bacterial Attachment And IAA Production
    target: IAA-Mediated Algal Growth Promotion And Killing
    description: Algal tryptophan stimulates P. inhibens indole-3-acetic acid production, and that bacterially produced
      IAA drives the downstream algal growth-promotion and killing response.
  edges_after:
  - source: Tryptophan-Enhanced Bacterial Attachment And IAA Production
    target: Algal Growth Promotion and Late Killing with Proposed IAA Mediation
    description: 'HYPOTHESIZED: Tryptophan-enhanced IAA production could contribute to initial algal promotion and
      late killing. Added tryptophan accelerated coculture bleaching, but also changed attachment; bulk coculture
      IAA was undetectable and pathway mutants retained production. The experiment therefore does not isolate IAA
      mediation or show that measured bacterial IAA reached the exogenous toxic dose.'
  retained_edge_decisions:
  - source: Tryptophan-Enhanced Bacterial Attachment And IAA Production
    target: Algal Growth Promotion and Late Killing with Proposed IAA Mediation
    rationale: 'HYPOTHESIZED: Tryptophan-enhanced IAA production could contribute to initial algal promotion and
      late killing. Added tryptophan accelerated coculture bleaching, but also changed attachment; bulk coculture
      IAA was undetectable and pathway mutants retained production. The experiment therefore does not isolate IAA
      mediation or show that measured bacterial IAA reached the exogenous toxic dose.'
  removed_edge_decisions:
  - source: Algal Nutrient Provisioning Supports Bacterial Growth
    target: Tryptophan-Enhanced Bacterial Attachment And IAA Production
    rationale: Generic nutrient support enables bacterial growth but does not selectively establish the specific
      tryptophan/IAA response; a workflow/enabling-context link is not sufficient.
