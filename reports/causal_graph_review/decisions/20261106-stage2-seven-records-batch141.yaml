      snippet: In two of the three sets (sets 1 and 2), D-lactate levels in tri-cultures were significantly
        higher than those detected in the corresponding Ld monocultures (p < 0.05)
      explanation: Supports significantly higher D-lactate accumulation in the set 1 triculture than in
        the T1104 monoculture.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In monoculture, Lh strains produced a racemic mixture of lactic acid, whereas Ld strains
        produced exclusively D-lactate, as expected ( Figure 8 ). However, the limited growth of Ld strain
        T1104 resulted in a very low level of D-lactate. St strains RBC06 and C001.27 predominately produced
        L-lactate, which accounted for 67.2 and 83% of total lactate, respectively.
      explanation: Establishes the single-strain D- and L-lactate enantiomer baselines (racemic Lh C001.15,
        D-lactate-exclusive but slow-growing Ld T1104, and 67.2% L-lactate St RBC06), bounding why bulk
        triculture D-lactate cannot be attributed exclusively to T1104.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Although absolute lactate concentrations varied among inoculation sets, D-lactate and L-lactate
        were produced in comparable amounts in all tri-cultures, indicating that Ld strains remained viable
        and metabolically active.
      explanation: Documents comparable D- and L-lactate accumulation at the 160 h triculture endpoint.
