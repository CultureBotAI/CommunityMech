  scope: Whole record read; every graph node, PAIRWISE/COMMUNITY_LEVEL scope, participant, and directed
    downstream causal edge verified against cached open-access full text and abstract (PMID:42733304,
    PMC13572860, doi:10.1002/advs.202506035) and sibling consortium record CommunityMech:000520.
  summary: Reviewed and enriched the 2-node, 1-edge causal interaction graph for the engineered S. oneidensis
    SO1 + B. subtilis BS1 brewing-wastewater NCM bioleaching consortium in PMID:42733304 with verbatim
    evidence for the 61.62-fold ethanol inhibition of S. oneidensis EET (2.08 vs 128.20 mW m^-2), the
    wild-type BS0 partial ethanol removal control (35.6% to 1.16% v/v), the 51.14% S. oneidensis relative
    abundance on the NCM surface, and the late-stage leaching rate decline (7.222 to 0.921 mg L^-1 day^-1),
    while retaining and bounding the directed downstream edge.
  node_decisions:
  - node: BS1 Adh-AldH ethanol detoxification relieving SO1 EET inhibition
    rationale: Supported by primary source (PMID:42733304, Fig. 1b, Fig. 2b-c) with PAIRWISE scope (Bacillus
      subtilis 168 BS1 -> Shewanella oneidensis MR-1 SO1); captures P43::adh-aldH removal of 97.6% of
      inhibitory ethanol (vs 35.6% by wild-type BS0) and restoration of MFC maximum power density from
      2.08 mW m^-2 in ethanol and 3.10 mW m^-2 in SO1 alone to 116.15 mW m^-2.
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
    scope: PAIRWISE
    participants:
      source_taxon:
        preferred_term: Bacillus subtilis 168 BS1
        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
      target_taxon:
        preferred_term: Shewanella oneidensis MR-1 SO1
        term:
          id: NCBITaxon:70863
          label: Shewanella oneidensis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: It was found that 97.6% of ethanol in the brewing wastewater could be removed by the SO1‐BS1
        microbial consortium within 48 h (Figure 2b ). Moreover, the maximum power density of the SO1‐BS1
        consortium reached 116.15 mW m−2, representing 34.47‐ and 92.92‐fold increases compared to that
        observed in strain SO1 (3.10 mW m−2) and BS1 (1.25 mW m−2), respectively (Figure 2c ), confirming
        that the ethanol inhibition of the EET of the SO1‐BS1 consortium was significantly alleviated.
      explanation: Demonstrates 97.6% ethanol removal and 34.47-fold EET power-density restoration in
        the SO1-BS1 consortium.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The results revealed that the EET rate, as measured by the maximum power density of a microbial
        fuel cell, was only 2.08 mW m−2 in the presence of ethanol (1.8% v/v) (Figure 1b ). In contrast,
        in the absence of ethanol, the maximum power density of S. oneidensis was 128.20 mW m−2 (Figure
        1b ), which was 61.62‐fold higher than the maximum power density observed in the presence of ethanol.
      explanation: Quantifies the 61.62-fold inhibition of S. oneidensis SO1 EET maximum power density
        by 1.8% (v/v) ethanol (2.08 vs 128.20 mW m^-2).
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In contrast, the wild‐type strain BS0 removed only approximately 35.6% of ethanol within
        48 h, lowering the ethanol concentration from 1.8% to 1.16% (v/v) (Figure 2b ).
      explanation: Establishes the wild-type B. subtilis BS0 control baseline (only ~35.6% ethanol removal
        to 1.16% v/v in 48 h) against which engineered BS1 97.6% ethanol removal is compared.
  - node: SO1-BS1 extracellular electron transfer reduction of NCM metal oxides
    rationale: Supported by primary source (PMID:42733304, Fig. 2d-f, Fig. 4a, Fig. 5b, Fig. S1-S2) with
      COMMUNITY_LEVEL scope covering SO1 (51.14% of NCM-attached cells) and BS1; captures EET-catalyzed
      reduction of solid NCM Mn4+/Mn3+, Co3+, and Ni3+ and leaching of 50.7 mg L^-1 total metal ions before
      Ni2+/Co2+ accumulation lowers the daily leaching rate from 7.222 to 0.921 mg L^-1 day^-1.
    field_path: ecological_interactions[1]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Shewanella oneidensis MR-1 SO1
        term:
          id: NCBITaxon:70863
          label: Shewanella oneidensis
      - preferred_term: Bacillus subtilis 168 BS1
        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: When applying the SO1‐BS1 consortium to catalyze the brewing wastewater‐mediated reduction
        of NCM, 50.7 mg L−1 of the total leached metal ions (including Li, Ni, Co, and Mn) was leached
        over 2 week period (Figure 2d ), in which the ionic concentrations of Li, Ni, Co, and Mn were
        45.6, 2.4, 1.0, and 1.7 mg L−1, respectively (Figure S1 ), and the leaching efficiencies of Li,
        Ni, Co, and Mn were 57.7%, 9.5%, 11.1%, and 13.1%, respectively.
      explanation: Quantifies total and element-specific metal leaching by the SO1-BS1 consortium over
        14 days.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Following treatment using brewing wastewater catalyzed by the SO1‐BS1 consortium, the levels
        of Mn4+ and Mn3+ decreased to 45.40% and 6.80%, whereas the level of Mn2+ increased to 47.80%,
        respectively, indicating that a substantial fraction of Mn4+ and Mn3+ in NCM was reduced.
      explanation: Provides XPS confirmation of solid-phase NCM metal-oxide reduction by the SO1-BS1 consortium.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Specifically, the average leaching rates decreased from 7.222 mg L−1·day−1 to 0.921 mg
        L−1·day−1 for the SO1‐BS1 consortium, from 9.867 to 0.617 mg L−1·day−1 for the SO2‐BS1 biocatalyst,
        and from 10.033 to 1.171 mg L−1·day−1 for the SO2‐BS2 consortium, as shown in Figure 4a .
      explanation: Quantifies the decline in SO1-BS1 average metal leaching rate from 7.222 to 0.921 mg
        L^-1 day^-1 between days 1-6 and days 7-14.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This study showed that the relative abundance of S. oneidensis on the NCM surface was 51.14%
        for the SO1‐BS1 consortium, 63.28% for the SO2‐BS2 consortium, and 69.38% for the SO3‐BS3 consortium,
        as illustrated in Figure 5b .
      explanation: Documents the 51.14% relative abundance of S. oneidensis on the NCM cathode surface
        in the SO1-BS1 consortium.
