  id: CommunityMech:000517
  original_sha256: c29477e83756f32bef49c1e54a7420d7f084039e644e8df32442985470fd2118
  record_sha256: 4e7b3ede948c94c55e73ea88c428e23368af66a92642940ef89f4d95157af74e
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261106-stage2-seven-records-batch141.yaml
  scope: Whole record read; every graph node, COMMUNITY_LEVEL scope, participating_taxa, and zero-edge
    boundary verified against cached open-access full text and abstract (PMID:41859451, PMC12996222, doi:10.3389/fmicb.2026.1755652).
  summary: Reviewed and enriched the 4-node, 0-edge COMMUNITY_LEVEL representation for Parmigiano Reggiano
    natural-whey-starter inoculation set 1 (L. helveticus C001.15, S. thermophilus RBC06, and L. delbrueckii
    subsp. lactis T1104) in PMID:41859451 with verbatim Section 3.7/3.8 evidence for maximum fermentative
    efficiency (Delta pHmax, Fig. 7B), positive St+Lh/St+Ld versus negative Lh+Ld pairwise interactions,
    C001.15 metabolic dominance in the 67.42% L-lactate Lh+Ld co-culture, and monoculture/triculture D-/L-lactate
    enantiomer baselines, while preserving 0 downstream edges.
  node_decisions:
  - node: Set 1 triculture milk acidification and total lactate enhancement
    rationale: Supported by primary source (PMID:41859451, Fig. 7A-B, Fig. 8) with COMMUNITY_LEVEL scope
      covering all 3 set 1 strains; documents superior umax, Delta pHmax, and total lactic acid production
      in the 1:1:1 triculture without fabricating per-strain CFU or metabolite-exchange edges.
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:41859451, PMC12996222)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Lactobacillus helveticus C001.15
        term:
          id: NCBITaxon:1587
          label: Lactobacillus helveticus
      - preferred_term: Streptococcus thermophilus RBC06
        term:
          id: NCBITaxon:1308
          label: Streptococcus thermophilus
      - preferred_term: Lactobacillus delbrueckii subsp. lactis T1104
        term:
          id: NCBITaxon:29397
          label: Lactobacillus delbrueckii subsp. lactis
    evidence:
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Across all inoculation sets, tri-cultures consistently displayed the highest μmax values
        (p < 0.05), followed by the co-cultures St + Lh and St + Ld.
      explanation: Supports the highest maximum milk acidification rate in the set 1 C001.15/RBC06/T1104
        triculture.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Across all three strain combinations, total lactic acid production was highest in tri-cultures,
        followed by St + Lh and St + Ld co-cultures (p < 0.05)
      explanation: Supports the highest total lactic acid production in the set 1 triculture relative
        to monocultures and 1:1 co-cultures.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Statistical analysis of the maximum acidification efficiency (ΔpHmax) largely confirmed
        the trends described for μmax, with the exception of Ld strain T1104 in inoculation set 1 ( Figure
        7B ).
      explanation: Confirms that maximum fermentative efficiency (Delta pHmax) in the set 1 triculture
        followed the same superior trend as umax relative to monocultures and binary pairs.
  - node: RBC06-containing pairwise acidification and lactate stimulation
    rationale: Supported by primary source (PMID:41859451, Fig. 7A-B, Fig. 8) with COMMUNITY_LEVEL scope;
      documents enhanced umax and total lactate in both RBC06-containing 1:1 co-cultures (RBC06+T1104
      and RBC06+C001.15, 86.73% L-lactate) relative to monocultures.
    field_path: ecological_interactions[1]
    source_locator: Cached full text and abstract (PMID:41859451, PMC12996222)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Lactobacillus helveticus C001.15
        term:
          id: NCBITaxon:1587
          label: Lactobacillus helveticus
      - preferred_term: Streptococcus thermophilus RBC06
        term:
          id: NCBITaxon:1308
          label: Streptococcus thermophilus
      - preferred_term: Lactobacillus delbrueckii subsp. lactis T1104
        term:
          id: NCBITaxon:29397
          label: Lactobacillus delbrueckii subsp. lactis
    evidence:
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: By contrast, in St + Ld co-cultures, μmax values were significantly higher than those observed
        in the corresponding Ld and St monocultures (p < 0.05) ( Figure 7A ), indicating a mutual benefit
        from co-cultivation. A similar enhancement was observed in Lh + St co-cultures, where all strain
        combinations exhibited significantly higher acidification rates than their respective monocultures
        (p < 0.05)
      explanation: Supports higher maximum acidification rates in both St + Ld (RBC06 + T1104) and Lh
        + St (C001.15 + RBC06) co-cultures relative to monocultures.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Under St + Lh conditions, L-lactate predominates, accounting for 86.73% of total lactate
        in the co-culture of strains RBC06 and C001.5 and 74.08% in the co-culture of strains C001.27
        and LBB04. Similarly, in St + Ld co-cultures, total lactate concentrations also exceeded those
        of the respective monocultures, with production dominated by D-lactate
      explanation: Quantifies the 86.73% L-lactate share in the set 1 RBC06 + C001.15 co-culture (printed
        as C001.5 in this sentence) and D-lactate predominance in St + Ld co-cultures.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Overall, the findings support the presence of negative interactions between L. helveticus
        and L. delbrueckii subsp. lactis and positive interactions between L. delbrueckii subsp. lactis
        and S. thermophilus, as well as between S. thermophilus and L. helveticus.
      explanation: Summarizes the positive pairwise interactions in both S. thermophilus-containing pairs
        (St + Ld and St + Lh) in contrast to the Lh + Ld binary pair.
  - node: C001.15-T1104 reduced acidification rate and Set 1 Delta pHmax/lactate exception
    rationale: Supported by primary source (PMID:41859451, Fig. 7A-B, Fig. 8) with COMMUNITY_LEVEL scope
      covering C001.15 and T1104; documents reduced umax alongside the set 1 exception in Delta pHmax
      and total lactate (67.42% L-lactate driven by higher metabolic activity of C001.15 relative to slow-acidifying
      T1104).
    field_path: ecological_interactions[2]
    source_locator: Cached full text and abstract (PMID:41859451, PMC12996222)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Lactobacillus helveticus C001.15
        term:
          id: NCBITaxon:1587
          label: Lactobacillus helveticus
      - preferred_term: Lactobacillus delbrueckii subsp. lactis T1104
        term:
          id: NCBITaxon:29397
          label: Lactobacillus delbrueckii subsp. lactis
    evidence:
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Remarkably, in all strain combinations tested, co-inoculation of milk with Lh and Ld resulted
        in reduced acidification rates compared with the corresponding monocultures, regardless of the
        specific Ld and Lh strains used
      explanation: Supports the lower maximum acidification rate (umax) of the C001.15 + T1104 co-culture
        relative to monocultures.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Strain T1104 showed lower ΔpHmax than the conspecific strain C5I3 and exhibited a such
        limited acidification ability in monoculture that co-cultivation with Lh strain C001.15 resulted
        in lower final pH values and, consequently, a higher ΔpHmax compared with the T1104 monoculture
        (p < 0.05). Nonetheless, even under these conditions, Lh + Ld co-cultures remained less effective
        in acidification than Lh monoculture (p < 0.05).
      explanation: Documents the set 1 Delta pHmax exception where C001.15 + T1104 exceeded the slow T1104
        monoculture while remaining below the C001.15 monoculture.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Consistent with ΔpHmax values, an exception was observed in inoculation set 1, where the
        Lh + Ld co-culture, represented by C001.15 and T1104, produced total lactate amount comparable
        to those of St + Lh and St + Ld co-cultures (p > 0.05) ( Figure 8 ), but significantly lower than
        the corresponding tri-culture (p < 0.05) ( Figure 8 ). In this Lh + Ld combination, L-lactate
        represented 67.42% of total lactate
      explanation: Quantifies the set 1 C001.15 + T1104 total lactate exception and its 67.42% L-lactate
        composition.
    - reference: PMID:41859451
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In this Lh + Ld combination, L-lactate represented 67.42% of total lactate, suggesting
        that Lh was more metabolically active than Ld. This result is likely attributable to the very
        slow acidification phenotype of Ld strain T1104.
      explanation: Attributes the 67.42% L-lactate share in the set 1 C001.15 + T1104 co-culture to higher
        metabolic activity of L. helveticus C001.15 relative to the very slow acidification phenotype
        of L. delbrueckii subsp. lactis T1104.
