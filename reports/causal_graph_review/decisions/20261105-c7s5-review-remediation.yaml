  scope: Whole record and every existing node/direction reviewed; Stage 5 taxonomy abundance_level remediation preserves all four-records causal graph decisions.
  summary: Add DOMINANT abundance_level and verbatim PMID:30038609 transcriptomic evidence to Pelotomaculum thermopropionicum SI and Methanocella conradii HZ254 while preserving four-records causal graph decisions.
  node_decisions:
  - node: Propionate Oxidation Coupled to Methanogenesis
    rationale: Retain exact-system syntrophy, but qualify the transcript comparison for substrate and growth-rate confounding.
  - node: Catabolism and Methanogenesis Upregulation in Coculture
    rationale: Retain measured expression differences; remove two part-of/parallel-response arcs to formate and signaling.
  - node: Formate and Electron Bifurcation Strategy
    rationale: Combine duplicate pair as a conditional link preserving formate-transfer inference, 20 mM formate inhibition, 5 mM BES inhibition and H2 contrast.
  - node: Signal Transduction and Amino Acid Exchange
    rationale: Mark exchange/signaling mechanisms hypothesized; remove the unsupported single bacteria-to-archaea direction using community scope and both participants.
  removed_node_decisions: []
  renamed_nodes: {}
  edges_before:
  - source: Propionate Oxidation Coupled to Methanogenesis
    target: Catabolism and Methanogenesis Upregulation in Coculture
    description: PARTIAL - the propionate-fed coculture showed increased catabolic and methanogenesis transcripts relative
      to the monocultures. The source warns that substrate, hydrogen availability and growth rate differ, so this comparison
      does not isolate the effect of the partner interaction alone.
  - source: Formate and Electron Bifurcation Strategy
    target: Propionate Oxidation Coupled to Methanogenesis
    description: 'PARTIAL - formate turnover is inferred to support syntrophic electron transfer. Its effect depends on conditions:
      adding 20 mM formate immediately halted propionate oxidation, which resumed after formate consumption; adding 5 mM 2-BES
      abolished propionate oxidation and methane production. The source did not find comparable inhibition after H2/CO2 addition,
      so this edge does not assert a measured low-H2 requirement in that experiment.'
  edges_after:
  - source: Propionate Oxidation Coupled to Methanogenesis
    target: Catabolism and Methanogenesis Upregulation in Coculture
    description: PARTIAL - the propionate-fed coculture showed increased catabolic and methanogenesis transcripts relative
      to the monocultures. The source warns that substrate, hydrogen availability and growth rate differ, so this comparison
      does not isolate the effect of the partner interaction alone.
  - source: Formate and Electron Bifurcation Strategy
    target: Propionate Oxidation Coupled to Methanogenesis
