limitations:
- 'All10 original nodes and2 arrows reviewed;9 bounded observations remain,1 redundant workflow node removed and2
  arrows qualified. No new causal structure; qSIP and A22ED9 remain needs_research under #1592/#1593.'
- Three complete fresh public primary main texts, embedded captions and available main tables read. Fungal source
  is complete abstract/subscription preview only, not full methods. Separate supplements, original figure pixels,
  raw data and executable analyses not independently audited.
- Medicago retains positive strain traits and plant benefits with trait exceptions, endpoint specificity and unisolated
  antioxidant mediation. Tissue nitrogen does not directly measure N2 flux. Broad oxidative-stress and nodulation
  context retained where supported.
- 'Fungal initial six-member inoculum is not equal persistence. Root occurrence and spore counts differ; pooled
  PCR-TTGE is qualitative. Undetectable spores are not extinction. Preserve existing inoculum/protocol gaps and
  #862/#863 fixes.'
- qSIP uses rewetted eight-day laboratory soil incubations. DNA incorporation, predicted flagella and genomic carbon
  capacities are distinct measurements; historical rainfall association is not isolated selection. Missing phage-host
  structure is explicitly deferred, not forgotten.
- 'A22ED9 retains positive single-metal depletion and #1009 labels, not exclusive biosorption, redox flux or field
  performance. Source reports cell-free controls while acknowledging missing abiotic partitioning; preserve this
  tension rather than claiming controls were absent. Missing filtrate stimulation awaits supplement/report review.'
- 'Canonical taxonomy and non-graph raw blocks unchanged, not recertified. #1594 remains OPEN. Preserve strain identities
  despite shared IDs, fungal graph-owned evidence anchors and prior qSIP workflow-arrow deletion.'
- All920 caches unchanged;19 graph excerpts independently primary-matched after whitespace normalization. This is
  not historical cache/non-graph provenance certification. Full public sources remain scratch-only.
- Two one-record Edison causal dry runs completed at zero provider submissions/credits; real-run price not quoted
  and scoped authorization pending. A dry run is not a research report or grounds for adding structure.
- All-state issue titles/bodies and ignored/hidden local files searched before filing; four matching issue bodies
