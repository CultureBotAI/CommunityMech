- path: kb/communities/Chlorella_Azospirillum_Synthetic_Mutualism.yaml
  id: CommunityMech:000191
  original_sha256: 16c7ab273dbb54c80ad6403abc07ae1244511f757950708068c7db11f7275f11
  record_sha256: 8debe22be0e21c034886b7e6e616bd3cc2a940a8bcdb7276c4235435c499e381
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-two-records-batch12.yaml
  scope: Whole record and every existing graph node/arrow reviewed to explicit source limits; unchanged non-graph
    metadata is not certified.
  summary: Separate Chlorella nutrient mutualism, inferred transfer, proximity and IAA-linked starch assays
  node_decisions:
  - node: Nutrient-Modulated Synthetic Mutualism
    rationale: Retain supported mutualism with time/nutrient exceptions and illuminated assay context.
  - node: Tryptophan, Thiamine, and IAA Exchange
    rationale: Retain cross-feeding interpretation and existing starch arrow with exudate, cofactor and exact-strain
      limits.
  - node: Co-Immobilization and Cell Aggregation
    rationale: Remove colonization-facilitation typing from engineered proximity; retain the source-proposed growth
      arrow as hypothetical.
  - node: IAA-Linked Starch Accumulation Response
    rationale: Untype starch as mutualism; distinguish comparator lineage, growth tradeoffs and partial IAA mediation.
  edges_before:
  - source: Tryptophan, Thiamine, and IAA Exchange
    target: IAA-Linked Starch Accumulation Response
    description: 'Microalgal tryptophan and thiamine release supports bacterial IAA production, which the follow-up
      exact-pair experiments linked to C. sorokiniana starch metabolism.

      '
  - source: Co-Immobilization and Cell Aggregation
    target: Nutrient-Modulated Synthetic Mutualism
    description: 'Co-immobilized alginate beads and algal-bacterial aggregation spatially organize the two partners,
      supporting the population increases observed during nutrient-modulated synthetic mutualism.

      '
  edges_after:
  - source: Tryptophan, Thiamine, and IAA Exchange
    target: IAA-Linked Starch Accumulation Response
    description: PARTIAL - bacterial IAA can promote algal starch/AGPase responses in the separate dark, glucose-fed
      assay. Synthetic IAA and wild-type versus IAA-attenuated strain comparisons support mediation, but SpM7918
      is an Sp6-derived comparator, not a Cd mutant; exact-strain IAA necessity and the contribution of local resource
      transfer remain unresolved.
  - source: Co-Immobilization and Cell Aggregation
    target: Nutrient-Modulated Synthetic Mutualism
    description: HYPOTHESIZED - close proximity could facilitate exchange of growth-supporting resources. The studies
      propose this link, but aggregation was not selectively disrupted to demonstrate that it causes the nutrient-dependent
      population benefits.
  references:
  - doi:10.1007/s00248-018-1282-1
  - doi:10.1016/j.resmic.2016.02.005
  - doi:10.1093/femsec/fiw077
  source_review:
    sources:
    - doi: 10.1007/s00248-018-1282-1
      pmid: '30397795'
      pdf: 'temporary source (not committed): communitymech-chlorella-nutrients.pdf'
      pdf_sha256: 842f2157f5286bed5fc7a468fe8ad6e2a8767b41e08ce66805e5bf44ca11f1b8
      url: https://firebasestorage.googleapis.com/v0/b/bashan-foundation.appspot.com/o/pdfs%2F10.1007%40s00248-018-1282-1.pdf?alt=media&token=b0f2ca3e-b5d4-413d-bb9b-fdc28d1ec336
      cache_sha256: e5dd25e85b7833da8ee1a4c8df58f924c89ddcc98896b52c1c0f12691050b001
      read: Main text through conclusion, pages 1-11; cached abstract.
      figures_inspected:
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      limits: Supplementary material and raw data not read; Fig. 1 caption read but image not inspected.
      findings:
      - First 12 hours compare diluted nutrient broth, N-free OAB and C-free SGM; all subsequently transfer to SGM
        under illumination.
      - Reciprocal population benefits depend on time and medium. Following nutrient broth, bacterial counts did
        not differ significantly between single and paired cultures.
      - IAA was undetected in N-free/C-free-start treatments. Short-distance transfer is proposed, not directly
        quantified there.
      - Aggregation varies independently of a universal growth response. N-free-start attachment weakens later;
        C-free cultures form large clusters at 83 hours.
      - Greatest starch concentration occurs in algae alone under continuous C-free conditions. Do not generalize
        starch enhancement across assays.
    - doi: 10.1093/femsec/fiw077
      pmid: '27090758'
      url: https://academic.oup.com/femsec/article/92/6/fiw077/2470072
      accessible_primary_url: https://oup.silverchair-cdn.com/article-minimal/2470072
      cache_sha256: 972e21a3abd0201d38bd67ac41da969c486d5ba7a09a64ab4f0980f953293302
      read: Abstract, introduction, methods, results, discussion and all main figure captions via publisher HTML.
      figures_inspected: []
      limits: Images not inspected. DOI resolver and signed PDF search URL failed; publisher HTML succeeded.
      rights: Page says Open Access but footer says all rights reserved; no explicit reuse license found in this
        page. Do not publish the body based on access alone.
      findings:
      - Bacterial IAA appears in algal exudates or with tryptophan plus thiamine diphosphate supplementation, not
        with tryptophan alone.
      - Bulk co-immobilized medium has no detectable tryptophan or IAA; enzyme and gene-expression assays support
        the proposed exchange. IAA detection limit is 195 ng/mL.
      - IPDC activity is not uniquely bacterial or IAA-specific; algal activity and other substrates complicate
        attribution.
      - Current cache is marked abstract_only but concatenates abstract and methods excerpts. Its scope/provenance
        needs correction or a separate issue.
    - doi: 10.1016/j.resmic.2016.02.005
      pmid: '26924113'
      pdf: 'temporary source (not committed): communitymech-chlorella-starch.pdf'
      pdf_sha256: 1eed1c4dda89c0d3e9d7f091dd166b75e47558498683c37095082e8b006c71fb
      url: https://firebasestorage.googleapis.com/v0/b/bashan-foundation.appspot.com/o/pdfs%2F3310a2d9ff21e7cc1d24df64047b11ef680893ef.pdf?alt=media&token=cc7f75bb-e4b2-4946-9ed8-3623fdd15d05
      cache_sha256: fe965f8411f7d365d8340afbd92e78d1fb92aff4c3b231c0c291311d66625236
      read: Main text through conclusion, pages 1-11; cached abstract excerpt.
      figures_inspected:
      - 3
      - 4
      - 5
      tables_inspected:
      - 1
      limits: Figures 1-2 captions/text read, images not inspected; supplements and raw data not read.
      rights: All rights reserved; keep PDF/body outside repository.
      findings:
      - Dark, glucose-fed, nitrogen-replete/starved assays compare Cd, Sp6 and the Sp6-derived IAA-attenuated SpM7918,
        not a Cd mutant.
      - Wild-type pairs increase starch and AGPase relative to controls; synthetic IAA gives a transient response.
        Mutant retains small starch effects.
      - Most paired treatments reduce algal population growth. Starch accumulation is not reciprocal fitness benefit.
      - Cd tryptophan/IAA correlation under N starvation is nonsignificant despite generalized discussion wording.
      - Direct AGPase regulation versus glucose transport remains unresolved; do not elevate proposed molecular
        details to proven mechanisms.
