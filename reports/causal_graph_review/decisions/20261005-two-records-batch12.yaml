  scope: Whole record and every existing graph node/arrow reviewed to explicit source limits; unchanged non-graph
    metadata is not certified.
  summary: Bound Avena expression guilds and carbon hypotheses; remove two modeling-relevance arrows
  node_decisions:
  - node: Functional Succession Outpaces Compositional Change
    rationale: Retain relative transcript/composition timing; remove its noncausal modeling-utility arrow.
  - node: Four Decomposition-Gene Expression Response Groups
    rationale: Correct the four expression groups and retain niche partitioning only as a partial interpretation.
  - node: Rhizosphere Upregulates Carbohydrate Depolymerization Transcripts
    rationale: Retain measured transcription; qualify its existing carbon-transformation arrow as hypothetical.
  - node: Proposed Niche-Differentiated Guild Coexistence
    rationale: Bound diversity contrasts and coexistence inference; remove the second modeling-utility arrow.
  - node: Predicted Soil Carbon Cycling Consequences of Guild Succession
    rationale: Retain a predicted carbon endpoint, not a measured carbon-fate result.
  edges_before:
  - source: Functional Succession Outpaces Compositional Change
    target: Soil Carbon Cycling Consequences of Guild Succession
    description: Faster functional turnover makes the metatranscriptome-defined guilds a framework for modeling
      rhizosphere succession and its carbon cycling consequences.
  - source: Four Guilds with Substrate-Specific Specialization
    target: Rhizosphere Guild Coexistence by Niche Differentiation
    description: Substrate-specialized guilds partition fresh-root, detrital, mixed-root, and aging-root resources,
      allowing multiple decomposer guilds to coexist across the paired habitats.
  - source: Rhizosphere Upregulates Carbohydrate Depolymerization
    target: Soil Carbon Cycling Consequences of Guild Succession
    description: Consistent rhizosphere carbohydrate depolymerization acts on plant polymer inputs that are precursors
      of soil organic matter.
  - source: Rhizosphere Guild Coexistence by Niche Differentiation
    target: Soil Carbon Cycling Consequences of Guild Succession
    description: Niche-differentiated coexistence connects habitat-specific decomposer guilds to rhizosphere succession
      models.
  edges_after:
  - source: Four Decomposition-Gene Expression Response Groups
    target: Proposed Niche-Differentiated Guild Coexistence
    description: HYPOTHESIZED - differing expression responses to root resources could reduce resource overlap and
      permit guild coexistence. Clustering and diversity patterns do not directly test resource partitioning or
      its necessity for coexistence.
  - source: Rhizosphere Upregulates Carbohydrate Depolymerization Transcripts
    target: Predicted Soil Carbon Cycling Consequences of Guild Succession
    description: HYPOTHESIZED - increased expression could increase enzyme-mediated processing of root polymers
      and thereby alter soil-carbon transformations. Transcript abundance alone does not establish this flux or
      its downstream persistence and mineral-association consequences.
  references:
  - PMID:31953507
  source_review:
    reference: PMID:31953507
    doi: 10.1038/s41396-019-0582-x
    published_pdf:
      path: 'temporary source (not committed): communitymech-avena-published.pdf'
      url: https://sydneyglassman.wordpress.com/wp-content/uploads/2020/02/nuccioetal_isme_2020.pdf
      sha256: 8316bde2ce9eafd97f971c846d430f155b6e59394477803769fe49fe2a1b820f
      pages: 16
      provenance_warning: Earlier eScholarship download is a preprint with different counts; do not substitute it.
      repository_policy: Do not add the publication PDF to the repository.
    reading:
      complete:
      - current_record
      - cached_abstract
      - published_main_text_through_conclusions
      figures_inspected:
      - 1
      - 2
      - 3
      - 4
      - 5
      figure_method: Local pypdfium2 render, pages 6, 7, 8 and 10; web screenshots returned no visible image.
      not_inspected:
      - supplementary_figures
      - supplementary_tables
      - raw_data
      failed_access_paths:
      - EuropePMC_XML_HTTP_500
      - publisher_redirect
      - PMC_captcha
      absence_inference: None; the published PDF was accessible.
    source_findings:
    - Four groups are Rhizosphere, Detritusphere, Aging Root and Low Response; the last has no discernible habitat
      preference (Fig. 4).
    - Transcript mapping at 80 percent identity yields aggregated populations, not strain-specific readouts; 24
      of 282 references meet the response criterion.
    - Functional change is transcriptomic; drying covaries with the final timepoint.
    - Fig. 2 shows the highest numerical taxonomic diversity in combined treatment, with shared significance letters
      for bulk plus detritus. Rhizosphere functional diversity does not significantly increase with detritus.
    - Gene expression is not measured enzyme flux; gyrase transcription is an abundance proxy. Synergist is a transcription
      category, not demonstrated partner facilitation.
    - Coexistence through niche differentiation and cross-feeding are source interpretations. Soil-carbon persistence
      and mineral-association consequences require experimental tests.
