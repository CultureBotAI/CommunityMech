  edges_before:
  - source: Biodetoxification-mediated commensalism (DSM1-25280 to CC17B-1)
    target: Competitive exclusion in the dual Bacillus coagulans consortium
    description: 'Phenolic-acid biodetoxification defines the early commensal phase of the niche-succession model
      before the system transitions to competitive exclusion between the Bacillus coagulans strains.

      '
  - source: Aromatic scavenging by P. putida KT2440 ZL reinforces LA fermentation
    target: Biodetoxification-mediated commensalism (DSM1-25280 to CC17B-1)
    description: 'P. putida KT2440 ZL eliminates recalcitrant aromatic toxicity without consuming fermentation substrates,
      preparing the hydrolysate for the downstream Bacillus coagulans detoxification and production relay.

      '
  edges_after:
  - source: Biodetoxification-Mediated Facilitation of CC17B-1
    target: CC17B-1 Dominance and Hypothesized Exclusion of DSM1-25280
    description: HYPOTHESIZED - detoxification may remove the selective advantage of the stress-tolerant DSM1-25280
      strain and permit CC17B-1 dominance. CFU succession supports the proposed trade-off model but does not isolate
      resource competition from lactic-acid inhibition or loss of culturability.
  - source: Aromatic scavenging by P. putida KT2440 ZL reinforces LA fermentation
    target: Biodetoxification-Mediated Facilitation of CC17B-1
    description: PARTIAL - aerobic ZL pretreatment may reduce recalcitrant aromatic toxicity and facilitate the
      subsequent anaerobic Bacillus relay. The staged treatment improves fermentation, but does not selectively
