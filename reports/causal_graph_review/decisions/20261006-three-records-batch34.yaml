    mediation.; Retain nitrite inhibition and N2O endpoints with a qualified negative causal arrow, not N2O toxicity.
  renamed_nodes: {}
  node_decisions:
  - node: Pathway-Partitioned Denitrification Cooperation
    rationale: Represent complementary exchange at community scope and distinguish measured growth from modeled
      reverse NO transfer.
  - node: High-Nitrate Destabilization of Cooperation
    rationale: Retain nitrate/composition perturbations without categorical competition; qualify modeled nitrite
      mediation.
  - node: Toxic Nitrite Accumulation and N2O Off-Gassing
    rationale: Retain nitrite inhibition and N2O endpoints with a qualified negative causal arrow, not N2O toxicity.
  removed_node_decisions: []
  edges_before:
  - source: High-Nitrate Destabilization of Cooperation
    target: Toxic Nitrite Accumulation and N2O Off-Gassing
    description: 'High nitrate unbalances the two-member exchange, drives toxic nitrite accumulation, and disrupts
      cooperative denitrification with increased N2O off-gassing.

      '
  - source: Toxic Nitrite Accumulation and N2O Off-Gassing
    target: Pathway-Partitioned Denitrification Cooperation
    description: Toxic NO2- accumulation disrupts the nitrite and nitric oxide exchange that normally completes
      denitrification across the two partners.
  edges_after:
  - source: High-Nitrate Destabilization of Cooperation
    target: Toxic Nitrite Accumulation and N2O Off-Gassing
    description: PARTIAL - faster 3H11 nitrate reduction relative to R12 nitrite removal can increase toxic nitrite
      exposure. Across varied nitrate and inoculum ratios, kinetic-model predictions of nitrite exposure correlate
      with measured endpoint N2O; selective SynCom nitrite mediation was not isolated.
  - source: Toxic Nitrite Accumulation and N2O Off-Gassing
    target: Pathway-Partitioned Denitrification Cooperation
    description: PARTIAL - accumulated nitrite can inhibit partner growth and thereby impair completion of the shared
      denitrification pathway. Monoculture inhibition and model-to-N2O correspondence support this negative effect,
      not selective proof that NO exchange fails in the SynCom or that N2O is the inhibitory agent.
