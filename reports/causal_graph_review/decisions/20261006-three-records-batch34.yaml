  node_decisions:
  - node: Biodetoxification-Mediated Facilitation of CC17B-1
    rationale: Retain early detoxification benefit without donor-neutrality or direct PAD-vanillin claims.
  - node: CC17B-1 Dominance and Hypothesized Exclusion of DSM1-25280
    rationale: Correct the proposed excluding strain and distinguish CFU succession from demonstrated competitive
      extinction.
  - node: Aromatic scavenging by P. putida KT2440 ZL reinforces LA fermentation
    rationale: Represent the staged three-strain treatment with canonical strain-specific participants and qualified
