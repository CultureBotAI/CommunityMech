batch: 20261108-stage2-five-records-batch144
review_date: '2026-11-08'
reviewer: antigravity
criteria:
- Every reviewed record was checked against committed references_cache full-text evidence.
- Single-strain axenic isolate baselines (CommunityMech:000531, CommunityMech:000532, CommunityMech:000533,
  CommunityMech:000534) and the screening-stage cross-pathway Ogataea polymorpha str3Δ-leu2Δ co-culture
  (CommunityMech:000535) are represented as single COMMUNITY_LEVEL nodes with 0 downstream edges and enriched
  with non-overlapping, bracket-free verbatim snippets.
- Source-backed experimental and evidence boundaries are preserved in record-level discussions and source_backed_gaps
  without inventing unsupported intermediate nodes or edges.
records:
- id: CommunityMech:000531
  path: data/isolates/Microbacterium_BR1_Sulfadiazine_Cleaving_Isolate_Baseline.yaml
  review_file: reports/causal_graph_review/decisions/20261108-stage2-five-records-batch144.yaml
  status: reviewed
  original_sha256: 149a6ab7149a19719ff9e73f58a650b744327ec2306350af2f495cbd85e81531
  record_sha256: 5965fcdc4339472b062db3e80b73f336c75328591666049a1ce05e6df94be7c7
  references:
  - PMID:42598292
  scope: Axenic Microbacterium sp. strain BR1 monoculture baseline in mineral salt medium (MSM Brunner)
    supplemented with vitamins and 1.0 mM pyrimidine-13C,15N3-labeled sulfadiazine at 28 C on an orbital
    shaker for 4 days (Xue et al. 2026, PMID:42598292 / doi:10.1021/acs.estlett.6c00474).
  node_decisions:
  - node: Ipso-Substitution Sulfadiazine Cleavage and Dead-End 2-Aminopyrimidine Accumulation by Axenic
      Microbacterium BR1
    decision: amended
    rationale: PMID:42598292 Table 1, Figure 1, Figure 2b, and Figure 3a characterize axenic Microbacterium
      sp. strain BR1 as a single COMMUNITY_LEVEL monoculture baseline that completely cleaves 1.0 +- 0.1
      mM sulfadiazine within 2 days to 0.0 mM, assimilates the released 4-aminophenol (aniline) moiety
      for maintenance (sustaining 1067 +- 206 to 832 +- 89 cells/uL by Day 2 with no 13C/15N-pyrimidine
      Raman shift at 1000 cm-1), and accumulates 1.0 +- 0.1 mM 2-aminopyrimidine as an unmineralized dead-end
      metabolite through Day 4; enriched node evidence from 3 to 5 non-overlapping verbatim snippets without
      adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - No downstream causal edges are curated on CommunityMech:000531 because PMID:42598292 measures axenic
    Microbacterium sp. BR1 sulfadiazine cleavage (1.0 +- 0.1 mM to 0.0 mM by Day 2), dead-end 2-aminopyrimidine
    accumulation (1.0 +- 0.1 mM on Days 2 and 4), and flow-cytometric cell counts (1067 +- 206 to 832
    +- 89 cells/uL) as co-occurring monoculture endpoints without resolving sequential multi-step intracellular
    enzyme kinetics or inter-taxon cross-feeding (which requires Terrabacter sp. 2APm3 in co-culture CommunityMech:000371).
  - 4-aminophenol (4-AP) transient intermediate concentrations and day-4 axenic flow-cytometric cell count
    numeric tables were not separately tabulated in the main text of PMID:42598292; recorded in the EVIDENCE_GAP
    discussion.
- id: CommunityMech:000532
  path: data/isolates/Terrabacter_2APm3_Sulfadiazine_Isolate_Baseline.yaml
  review_file: reports/causal_graph_review/decisions/20261108-stage2-five-records-batch144.yaml
  status: reviewed
  original_sha256: 677193069c629cbbecdaad6e13fb53881e3ead1c644725acab370fe1cfdd2b5c
  record_sha256: 1f8686e5878cea0ab2f49f34bf3964dc23bafab6814ee9048a0301d5a735713a
  references:
  - PMID:42598292
  scope: Axenic Terrabacter sp. strain 2APm3 (DSM 28514) monoculture negative control baseline in mineral
    salt medium (MSM Brunner) supplemented with vitamins and 1.0 mM pyrimidine-13C,15N3-labeled sulfadiazine
    at 28 C on an orbital shaker for 4 days (Xue et al. 2026, PMID:42598292 / doi:10.1021/acs.estlett.6c00474).
  node_decisions:
  - node: Inability of Axenic Terrabacter sp. 2APm3 to Cleave Intact Sulfadiazine Without Upstream Ipso-Substitution
    decision: amended
    rationale: PMID:42598292 Table 1, Figure 1, and Figure 3a establish that axenic Terrabacter sp. 2APm3
      (DSM 28514) leaves 1.0 +- 0.1 mM sulfadiazine completely unaltered at Days 0, 2, and 4 with 0.0
      mM 2-aminopyrimidine formed, exhibits no 13C/15N-induced Raman shift at 1000 cm-1 in axenic culture,
      and undergoes a rapid population decline from 775 +- 10 cells/uL (Day 0) to 474 +- 44 cells/uL (Day
      2) due to nutrient limitation and antibiotic stress; enriched node evidence from 3 to 5 non-overlapping
      verbatim snippets without adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - No downstream causal edges are curated on CommunityMech:000532 because axenic Terrabacter sp. 2APm3
    catalyzes zero sulfadiazine transformation in monoculture; downstream hydroxylation and pyrimidine-ring
    cleavage of 2-aminopyrimidine to 2-amino-4-hydroxypyrimidine, guanidine, malonate, and CO2 occur only
    when upstream ipso-substitution by Microbacterium sp. BR1 supplies free 2-AP (curated in co-culture
    CommunityMech:000371).
  - Axenic growth kinetics on exogenous free 2-aminopyrimidine are cited from Tappe et al. 2015 rather
    than re-tabulated in PMID:42598292; recorded in the EVIDENCE_GAP discussion.
- id: CommunityMech:000533
  path: data/isolates/Achromobacter_SL8_Cadmium_Immobilization_Isolate_Baseline.yaml
  review_file: reports/causal_graph_review/decisions/20261108-stage2-five-records-batch144.yaml
  status: reviewed
  original_sha256: 9570a1bcd8115e59d8dedd2a31760f6acccdbb030f0d98f5670cd0af203c556f
  record_sha256: 106192c3aff58a26aca56f6d42ca90054dc0e6ae03bbc0a6dea29eaebd2d58e8
  references:
  - PMID:42307251
  scope: Axenic Achromobacter sp. SL8 (curated as Achromobacter insuavis SL8, GenBank PZ429300) monoculture
    baseline in liquid LB medium supplemented with 50 mg/L or 100 mg/L Cd2+ at 30 C and 200 rpm for 7
    days (Tao et al. 2026, PMID:42307251 / doi:10.1128/spectrum.01081-26).
  node_decisions:
  - node: Cadmium Immobilization, Alkalinization, and N-H Surface Coordination by Achromobacter sp. SL8
      Monoculture
    decision: amended
    rationale: PMID:42307251 Table 2 and Figures 2-5 characterize axenic Achromobacter sp. SL8 as a single
      COMMUNITY_LEVEL monoculture baseline exhibiting a Cd(II) MIC of 600 mg/L, medium alkalinization
      from pH ~6.5 to 8.0-8.5 within 2 days, 82.6% Cd2+ removal at 50 mg/L declining to 69.55% (69.5%
      in abstract) at 100 mg/L Cd2+ over 7 days, FTIR-resolved N-H, phosphate, and hydroxyl surface coordination,
      predominant bioprecipitation, and TEM cell-membrane thinning and blurring; enriched node evidence
      from 4 to 6 non-overlapping verbatim snippets without adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - No downstream causal edges are curated on CommunityMech:000533 because PMID:42307251 explicitly notes
    that proteomic and metabolomic profiles of Cd-exposed SL8 (Group A) are correlative without gene-knockout
    causal validation, and monoculture pH elevation, FTIR surface binding, and bioprecipitation were assayed
    as parallel 7-day endpoints rather than a resolved multi-step causal chain.
  - Greenhouse Chinese cabbage pot experiments in PMID:42307251 evaluated only the combined SL8 + SL12
    consortium (CommunityMech:000526), not single-strain SL8 inoculation; recorded in the EVIDENCE_GAP
    discussion.
