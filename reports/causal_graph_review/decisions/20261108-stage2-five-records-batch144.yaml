- id: CommunityMech:000535
  path: kb/communities/Ogataea_Str3_Leu2_Auxotrophic_CrossFeeding_Coculture.yaml
  review_file: reports/causal_graph_review/decisions/20261108-stage2-five-records-batch144.yaml
  status: reviewed
  original_sha256: cf4a1289c42b61654ff9fa1407a55cad4bf9b22f0c829235b26c8705c2ffe282
  record_sha256: ee3d60ffa29820d717dcb8a7f60e855d04cefb85fd71e580c57cf14a466a2637
  references:
  - PMID:42318495
  scope: Synthetic 1:1 co-culture of Ogataea polymorpha str3Δ (cystathionine beta-lyase deletion) and
    leu2Δ (beta-isopropylmalate dehydrogenase deletion) auxotrophic mutants in Delft minimal medium containing
    20 g/L glucose at 37 C and 220 rpm (Fan et al. 2026, PMID:42318495 / doi:10.1016/j.synbio.2026.05.008).
  node_decisions:
  - node: STR3-LEU2 Cross-Pathway Auxotrophic Complementation and Biomass Restoration on Glucose
    decision: amended
    rationale: PMID:42318495 Section 3.2 and Figure 2a-d demonstrate that co-culturing Ogataea polymorpha
      str3Δ and leu2Δ at a 1:1 ratio (initial total OD600 = 0.2) in minimal glucose medium achieves strong
      reciprocal complementation (Recovery Index >= 0.8) and reproducible shake-flask maximum biomass
      (OD600 = 27.3-28.5 vs prototrophic FY00 OD600 = 26.8, p > 0.1, n = 4) after an extended lag phase
      (p < 10^-4) required for metabolite exchange; because PMID:42318495 did not perform single-intermediate
      cross-supplementation or fluorescent ratio tracking on str3Δ-leu2Δ (which were conducted exclusively
      for met10Δ-str3Δ in Sections 3.3-3.5), representing str3Δ-leu2Δ as a single COMMUNITY_LEVEL mutualism
      node with 0 downstream edges and 6 non-overlapping verbatim snippets avoids fabricating unverified
      directional metabolite-transfer steps.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - No downstream causal edges are curated on CommunityMech:000535 because PMID:42318495 Section 3.2 measured
    96-well Recovery Index and shake-flask glucose growth curves (maximum OD600 27.3-28.5 and lag phase)
    for str3Δ-leu2Δ as an emergent co-culture endpoint without separately resolving directional secretion
    vs uptake kinetics of homocysteine/methionine vs leucine/alpha-ketoisocaproate between str3Δ and leu2Δ.
  - Individual FY-series strain numbers for str3Δ and leu2Δ lie in uncached Supplementary Table 1, and
    methanol growth, initial ratio sweeps, and sulfur-intermediate supplementation were only performed
    on met10Δ-str3Δ (CommunityMech:000527); recorded in the EVIDENCE_GAP discussion.
