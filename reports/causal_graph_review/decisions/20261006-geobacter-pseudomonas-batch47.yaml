  scope: Whole record and all original nodes/arrows; measured phenotypes separated from proposed causal mechanisms.
  summary: Correct Pseudomonas-to-Geobacter electron direction; retain positive mutant/growth evidence; remove the
    chronology arrow; separate population adaptation and added-PHZ-1-CA response from unproven competition.
  renamed_nodes:
    Direct Interspecies Electron Transfer Establishment: Cytochrome-Associated Interspecies Electron Transfer
    Adaptation Toward Geobacter-Dominated Competition: Geobacter-Dominated Coculture Adaptation
    Phenazine-Associated Inhibition Pressure: Inhibitory Response to Added Phenazine-1-Carboxylic Acid
  node_decisions:
  - node: Restricted-Medium Cooperative Growth
    rationale: Retain the measured initial coculture growth contrast with both canonical participants; no all-stage
      dependence or chronology-causation claim.
  - node: Cytochrome-Associated Interspecies Electron Transfer
    rationale: Correct donor/recipient using canonical endpoints and primary direction; retain positive cytochrome-mutant
      evidence and SYNTROPHY while bounding DIET route exclusivity.
  - node: Geobacter-Dominated Coculture Adaptation
    rationale: Retain community dominance, variant/protein observations and bounded HybA/FdnG interpretations; remove
      categorical competition and irrelevant PHZ-1-CA assignment.
  - node: Inhibitory Response to Added Phenazine-1-Carboxylic Acid
    rationale: Retain measured added-compound response as Geobacter intrinsic capacity, not demonstrated endogenous
      Pseudomonas antagonism; preserve compound-specific negative selection evidence.
  removed_node_decisions: []
  edges_before:
  - source: Restricted-Medium Cooperative Growth
    target: Adaptation Toward Geobacter-Dominated Competition
    description: 'The restricted formate-fumarate coculture established Geobacter-Pseudomonas syntrophy as the starting
      state for serial transfers that later selected Geobacter dominance and a shift toward competition.

      '
  - source: Direct Interspecies Electron Transfer Establishment
    target: Restricted-Medium Cooperative Growth
    description: 'Upregulation of DIET-associated cytochromes in the initial cocultures helps establish the syntrophic
      electron transfer needed for growth in restricted formate-fumarate medium.

      '
  edges_after:
  - source: Cytochrome-Associated Interspecies Electron Transfer
    target: Restricted-Medium Cooperative Growth
    description: 'PARTIAL: Pseudomonas-to-Geobacter electron transfer could couple Pseudomonas formate use to Geobacter
      fumarate respiration and thereby support initial cooperative growth. Cytochrome-deficient cocultures showed
      impaired growth and initial cytochrome abundance was elevated, supporting this direction; the accessible evidence
      does not selectively establish an exclusive DIET route or exclude pleiotropic mutant effects. This is not
      a causal claim that protein upregulation itself creates electron transfer.'
  retained_edge_decisions:
  - source: Cytochrome-Associated Interspecies Electron Transfer
    target: Restricted-Medium Cooperative Growth
    description: 'PARTIAL: Pseudomonas-to-Geobacter electron transfer could couple Pseudomonas formate use to Geobacter
      fumarate respiration and thereby support initial cooperative growth. Cytochrome-deficient cocultures showed
      impaired growth and initial cytochrome abundance was elevated, supporting this direction; the accessible evidence
      does not selectively establish an exclusive DIET route or exclude pleiotropic mutant effects. This is not
      a causal claim that protein upregulation itself creates electron transfer.'
    rationale: Positive growth perturbation plus abundance evidence supports electron supply enabling growth; precise
      route mediation remains PARTIAL.
  removed_edge_decisions:
