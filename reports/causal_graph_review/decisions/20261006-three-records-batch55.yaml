  - node: Teichoic Acid-Mediated HREE Selective Biosorption
    rationale: Preserve positive separate-isolate and cell-wall interventions without active transport or reciprocal
      benefit.
  - node: Proposed Microbial REE Mineral Dissolution
    rationale: Bound literature-informed weathering as a proposed community contribution, not traced cross-feeding.
  - node: Observed B-Horizon HREE Enrichment
    rationale: Preserve observed elemental enrichment separately from unquantified biological mediation.
  - node: Proposed Fungal REE Bioweathering
    rationale: Bound fungal weathering as a hypothesis without phylum-level mutualism or measured acceleration.
