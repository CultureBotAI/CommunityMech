    primary_url: https://link.springer.com/content/pdf/10.1186/s40168-026-02470-1_reference.pdf
    primary_file: /private/tmp/communitymech-batch15/synlav-primary.pdf
    primary_sha256: be76c47721e845e2269d6e49415c1388aa5549d637cdb5f2b8d5ae35fb778cb4
    primary_license: CC BY-NC-ND 4.0, verified on publisher page; accepted unedited manuscript, not final Version
      of Record.
    supplement_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1186%2Fs40168-026-02470-1/MediaObjects/40168_2026_2470_MOESM1_ESM.docx
    supplement_file: /private/tmp/communitymech-batch15/synlav-supplement.docx
    supplement_sha256: b2bb1b0ef8add159b8e4d542e419cdd6c8442edd37633ecb6661fae9091ae937
    reading:
      record: Whole record and selected-excerpt reference caches read.
      primary: Main text pages 1-21 read across web and local extraction; Figures 4/5 visually inspected. Figures
        3-6 captions read; bibliography not exhaustively read.
      supplement: ZIP CRC passed; Text S1-S3 and captions read, complete Table S2 read structurally. Other tables
        were partially displayed in a truncated read and are not certified; supplemental images not yet inspected.
    findings:
    - Two existing nodes and one duplicate-outcome arrow; no new structure proposed.
    - Table S2 confirms L11/L29/L75/L44/L115 and isolate-level 72-hour residual-DEHP disappearance of 22/46/37/54/42
      percent, respectively.
    - Original Table S2 itself assigns incorrect phyla to Flavobacterium and Sphingomonas. Existing cache faithfully
      quotes it; do not introduce incorrect phylum groundings or silently alter quotations.
    - Triplicate isolate assays use 100 mg/L DEHP in MSM, 28 C, 180 rpm, 72 hours, measured by residual GC-MS; not
      a mineralization assay or proof of community complementarity.
    - Non-antagonism is pairwise LB agar screening, not positive mutualism or synergy.
    - Mixture strains normalized to OD600 0.5 and equally combined; inoculum diluted to OD600 0.2, approximately
      10^5 CFU/mL, 5 mL per seedling in 100 mg/kg soil; triplicate PBS controls.
    - Cross-inoculation Methods specify sampling after 10 days; Results say colonization measured after two weeks.
      Preserve discrepancy rather than silently resolving it.
    - V3-V4 ASV matching above 99 percent identity is an indicator, not unique viable strain detection. Only three
      SynLAV targeted ASVs reported in LAV, none in HAV; all five inoculum members are not proven to persist.
    - Figure 4 visually corroborates reduced soil residue and plant DEHP concentration under SynLAV in both varieties.
      Plant ordinate is mg/kg, not total accumulated mass.
    - Figure 4 volcano plots show differential community taxa, not direct proof of five-isolate colonization.
    - Figure 5 OLS associations are not mediation or causation; lower soil exposure as cause of lower plant concentration
      remains inferential, alongside host uptake/detoxification processes.
    - Root-exudate chemotaxis is measured, but no root-exudate metabolomics identifies mediators; source acknowledges
      this limitation.
    possible_nongraph_followup: All five taxonomy entries say DOMINANT despite lack of endpoint persistence/dominance
      evidence.
