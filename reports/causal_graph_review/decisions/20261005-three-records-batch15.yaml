  source_review:
    reading:
      record: Whole record read.
      primary: Full XML body and all main captions read; Table 1 also read by structured rows and cells, no numerical
        curation planned.
      unavailable_or_unread: Main figures and supplementary figures/tables not visually inspected. 1998 physiology
        abstract only; subscription body not read.
    primary_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4053972/fullTextXML
    primary_file: /private/tmp/communitymech-batch15/chlorochromatium-primary.xml
    primary_sha256: 7e2b832c29f67f0c5c66d5732b18e11d2de20c4dd62c8b792769fda4852596e2
    primary_license: CC BY 2.0, verified in XML.
    physiology_url: https://link.springer.com/article/10.1007/s002030050552
    findings:
    - Three existing nodes and two edges; no new structure proposed.
    - Genome reconstruction supports metabolic dependency but does not directly trace carbon/nitrogen/sulfur/vitamin
      transfer.
    - Photosynthetic CO2 and sulfide inputs are not established transferred metabolites.
    - Epibiont can grow axenically; central bacterium has not been grown independently. Do not imply mutual obligate
      growth.
    - External 2-oxoglutarate was required in the 1998 intact-consortium growth assay; no self-sufficient carbon
      economy demonstrated.
    - The central bacterium supplies the polar flagellum; consortium taxis is physiological evidence, not colonization
      facilitation.
    - 1998 abstract infers epibiont photosensing and rapid signaling. 2013 work proposes central sensory proteins
      and does not entirely exclude epibiont signaling.
    - Recombinant central-bacterium Cenrod_2641 photoswitching was measured in E. coli; Cenrod_2642 heme oxygenase
      function was tested under oxic versus anoxic conditions. This is stronger than computational prediction but
      not an in-consortium sensory knockout.
    - Sulfide sensory proteins were not identified; indirect sensing through epibiont excretion remains possible.
    - HPLC detected MK-7 and no ubiquinone in intact consortia and central-bacterium-enriched fractions, not purified
      central cells. Source Methods report fraction contamination assessment.
    - Quinone/intermediate transfer, bidirectional electron shuttling and shared protonmotive force are explicitly
      hypotheses requiring experimental testing; HPLC presence is not a transfer/flux assay.
    - Main text cites Figure S3 for quinones, but supplement list identifies quinone analysis as S4; do not silently
      certify figure numbering.
    possible_nongraph_followup: Environmental factor assigns light/sulfide sensing directly to the central bacterium
      without the source's mechanistic qualification.
