    primary_url: https://pubs.acs.org/doi/10.1021/acs.est.8b05053
    primary_abstract_url: https://pubmed.ncbi.nlm.nih.gov/30776217/
    supplement_metadata_url: https://api.figshare.com/v2/articles/7772975
    supplement_url: https://ndownloader.figshare.com/files/14470946
    supplement_expected_bytes: 6309634
    supplement_expected_md5: a9189a5e718b6dbcbaeb3614f3cdb94b
    supplement_sha256: bf0193cb49e0be62269fe34441e6accf45419cee49a1b584c66cf30f40284156
    supplement_file: /private/tmp/communitymech-batch15/chromium-support.pdf
    supplement_license: CC BY-NC 4.0 per primary Figshare metadata.
    reading:
      record: Whole record and abstract cache read.
      primary: Complete PubMed/publisher abstract read; subscription main text unavailable. Do not claim full-text
        review.
      supplement: Resumed after a partial-download timeout; final byte count and MD5 match publisher metadata. All
        11 pages text-read; Table S2 and Figures S1/S2/S5 visually inspected. Remaining images not inspected.
    findings:
    - Three existing nodes and two edges; no new structure proposed.
    - Separate S(0) and Fe(0) sludge systems; not a demonstrated three-member defined consortium shared by both
      reactors.
    - Abstract reports 60-day removal 92.9 plus/minus 1.1 and 98.1 plus/minus 1.2 percent, respectively; XPS identifies
      deposited Cr(III).
    - Abstract's taxon-to-VFA-to-reducer model is inferred from 16S composition and author interpretation, not taxon-resolved
      flux evidence in the accessible text.
    - Abstract only specifies VFAs as a class; acetate identity is not established by that evidence.
    - Elemental sulfur node incorrectly uses sulfur atom CHEBI:26833; existing related ingredient uses CHEBI:33403.
      Verify canonical term before changing.
    - Cr(III) deposition is an outcome, not cross-feeding; free chromium(3+) is not demonstrated deposited chemical
      speciation.
    - Removal of environmental chromate does not establish cellular detoxification GO function.
    - Ferrovibrio is mentioned by the source but absent from curated taxonomy; avoid inventing participant mappings.
    - Supplement Table S2 separates this study's S(0)/Fe(0) systems from acetate-fed literature comparators. Those
      comparator rows do not establish acetate in this system.
    - Figure S1 shows early C-Fe Cr(VI) loss diminishing across cycles; the source has abiotic/biotic comparisons,
      not evidence that abiotic Fe removal never occurs.
    - Figure S2 EDS distinguishes abiotic/biotic solids; it does not alone assign chromium oxidation state. XPS
      identification remains from the primary abstract.
    - Figure S5 shows bulk bicarbonate and pH dynamics; no taxon-to-taxon carbon tracing is provided in these supplemental
      panels.
    - Official ChEBI page independently verifies elemental sulfur CHEBI:33403.
    possible_nongraph_followup: Description asserts VFA generation, taxonomy roles overstate exact membership, and
      related ingredient names acetate without exact molecular evidence.
