  record_sha256: c6b526dc6a76ffb307bdd56cc43df3b3365fc2def4fe027d53924869f5746d78
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-three-records-batch19.yaml
  scope: Whole record and all three original nodes plus both original arrows; source scope bounded below.
  summary: Retain cellulose-derived precursor supply and methane link; distinguish measured pools from resolved
    flux and exclude other VFAs from blanket uptake.; Preserve coculture-specific multisubstrate findings and negative
    controls; qualify pathway/feedback inference without inventing reverse donation.; Preserve improved cellulose
    degradation and pH, while qualifying mediation and retaining unchanged fermenter growth rather than categorical
    mutualism.
  renamed_nodes:
    Multi-Substrate Methanogenesis by M. barkeri: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
    Methanogen-Enabled Cellulose Degradation and pH Stabilization: Coculture-Associated Cellulose Degradation and
      pH Stabilization
  node_decisions:
  - node: Cellulose Fermentation to Methanogenesis Precursors
    rationale: Retain cellulose-derived precursor supply and methane link; distinguish measured pools from resolved
      flux and exclude other VFAs from blanket uptake.
  - node: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
    rationale: Preserve coculture-specific multisubstrate findings and negative controls; qualify pathway/feedback
      inference without inventing reverse donation.
  - node: Coculture-Associated Cellulose Degradation and pH Stabilization
    rationale: Preserve improved cellulose degradation and pH, while qualifying mediation and retaining unchanged
      fermenter growth rather than categorical mutualism.
  edges_before:
  - source: Cellulose Fermentation to Methanogenesis Precursors
    target: Multi-Substrate Methanogenesis by M. barkeri
    description: 'Hydrogen, formate, and acetate released during C. cellulovorans cellulose fermentation supply
      the substrates consumed by M. barkeri for multi-substrate methanogenesis.

      '
  - source: Multi-Substrate Methanogenesis by M. barkeri
    target: Methanogen-Enabled Cellulose Degradation and pH Stabilization
    description: 'M. barkeri consumption of cellulose-fermentation products lowers hydrogen and volatile fatty acid
      accumulation, stabilizing pH and improving cellulose degradation by C. cellulovorans.

      '
  edges_after:
  - source: Cellulose Fermentation to Methanogenesis Precursors
    target: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
    description: Cellulose fermentation supplies hydrogen, formate and acetate for coculture-associated methanogenesis
      by M. barkeri. Exact-pair gas/product profiles and controls support this relationship, but do not resolve
      each precursor contribution; formate use is condition-dependent rather than evidence that formate alone supports
      the methanogen.
  - source: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
    target: Coculture-Associated Cellulose Degradation and pH Stabilization
    description: HYPOTHESIZED - M. barkeri consumption of formate and acetate, together with hydrogen removal and
      a changed C. cellulovorans fermentation pattern, reduces accumulated acid products and could help stabilize
      pH and sustain cellulose degradation. The measured coculture outcomes support this model, but do not isolate
      product removal or pH as the unique mediator. Lower butyrate/lactate pools are not evidence that the methanogen
      consumed those acids.
  retained_edge_decisions:
  - source: Cellulose Fermentation to Methanogenesis Precursors
    target: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
    rationale: Cellulose fermentation supplies hydrogen, formate and acetate for coculture-associated methanogenesis
      by M. barkeri. Exact-pair gas/product profiles and controls support this relationship, but do not resolve
      each precursor contribution; formate use is condition-dependent rather than evidence that formate alone supports
      the methanogen.
  - source: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
    target: Coculture-Associated Cellulose Degradation and pH Stabilization
    rationale: HYPOTHESIZED - M. barkeri consumption of formate and acetate, together with hydrogen removal and
