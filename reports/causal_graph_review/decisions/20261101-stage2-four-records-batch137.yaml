    rationale: Supported by primary source (PMID:42726284) with explicit COMMUNITY_LEVEL scope and participating_taxa
      covering both coculture partners; documents measurable 1-butanol production via the oxygen-tolerant
      TPC4 pathway with peaks on days 10 and 14, plateau behavior, and the ATP/NAD(P)H redox constraint
      of acetate assimilation.
