      snippet: When E. coli_Pem7_ButOH was cultivated with WT_PKPa_RBS_BsPta_Δacs, very few cells were
        observed on days 2 and 4. On days 6 and 8, the system still showed instability. However, after
        day 10, the cell numbers started to increase (with a drop on day 24) and slowly decreased after
        day 30.
