    -> Escherichia coli BL21(DE3) Pem7_ButOH) and adding the oxygen-tolerant fatty-acid-synthesis-derived
    TPC4 pathway (Pásztor et al. 2015) plus the ATP/NAD(P)H acetate-assimilation redox constraint to Acetate-Coupled
    1-Butanol Production (COMMUNITY_LEVEL), while retaining the HYPOTHESIZED/PARTIAL downstream edge and
    open carbon-source specificity knowledge gap.'
  node_decisions:
  - node: Photosynthetic Acetate Supply To Escherichia coli
    rationale: Supported by primary source (PMID:42726284) with explicit PAIRWISE CROSS_FEEDING scope
      and taxon grounding (Synechocystis sp. PCC 6803 WT_PKPa_RBS_BsPta_Δacs -> Escherichia coli BL21(DE3)
      Pem7_ButOH); lower extracellular acetate relative to axenic Synechocystis, sharper post-day-22 acetate
      depletion, and post-day-10 E. coli CFU recovery support acetate supply while PARTIAL bounding preserves
      the authors' caveat regarding secreted carbohydrates and EPS.
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:42726284)
