      target_taxon:
        preferred_term: Escherichia coli BL21(DE3) Pem7_ButOH
        term:
          id: NCBITaxon:562
          label: Escherichia coli
    evidence:
    - reference: PMID:42726284
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: where no additional carbon source was used
    - reference: PMID:42726284
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: Compared to the production of acetate in the axenic culture, less amount of acetate was
        measured in the co-culture with E. coli indicating acetate consumption.
    - reference: PMID:42726284
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: When it comes to the synthetic consortia, the consortium based on E. coli_Pem7_ButOH and
        WT_PKPa_RBS_BsPta_Δacs showed higher acetate than the one based on P. taiwanensis_Pem7_ButOH until
        day 14, and then the values are similar and eventually, after day 22 has a lower acetate concentration.
