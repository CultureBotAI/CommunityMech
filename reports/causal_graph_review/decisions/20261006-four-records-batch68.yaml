limitations:
- All11 original nodes and6 arrows reviewed;11 nodes retained/qualified and renamed where needed,4 arrows qualified,2
  workflow arrows removed. No new causal structure or provider submission.
- Four complete primary main texts/captions and both main tables read. No original figure-pixel, separate supplement,
  raw-data or executable-analysis audit. Numerical results not independently recomputed. Source statements about
  other papers are not independent reviews of those papers.
- 'SC2 positive inhibition, plant growth and Salkowski/CAS outputs retained without competition, immune activation,
  reciprocal benefit or selectively established mediator. Preserve external participants and prior #887-#889 repairs.'
- 'Mangrove whole-biofilm removal/electrochemistry remain positive. Relative genus response is not member activity
  or isolated mediation; DET/MET, partner exchange and carbon balance unresolved. Preserve #1124 Bacillus role removal.
  Named genera are a partial roster.'
- 'Both Mars records remain separate-organism panels, not cocultures. Existing COMMUNITY_LEVEL containers preserve
  shared abiotic/assay observations but do not settle #573 model placement or prove emergent interactions. Do not
  count this repair as resolution of that open modeling issue.'
- Meteorite hydration, unequal inocula and different viable-recovery assays bound persistence comparisons; E.coli
  water-only survival and late Planococcus loss at most ratios retained. Regolith composition is not universal Mars
  habitability or resolved uptake.
- MGS-1 growth is optical/photophysiological, not direct N2 or O2 flux; inoculum/carryover and undetected extract
  phosphorus matter. Processed-culture Lemna benefits are treatment/endpoint specific, not live commensalism or
  equivalence. Worst phototroph growth does not preclude positive material benefit.
- 'Canonical taxonomy and raw non-graph blocks preserved, not recertified; #1586 remains OPEN and coordinates #1580
  and #573. No new taxon mappings or experimental roles inferred. Preserve graph-owned benzene anchors required
  by unchanged non-graph aliases.'
- All920 caches unchanged;17 graph excerpts match fresh primary text after whitespace normalization. Not historical
  cache/non-graph provenance certification. Public primary XML available without access bypass; full sources remain
  scratch-only.
- Dedup874 all-state issue titles/bodies and47 scoped ignored/hidden local matches; seven matching issue bodies
  and prior PR574, relevant histories and graph-adding commit read, not every PR/comment/local match. Self-review
  is not independent approval. Repair issues remain OPEN pending protected-main merge.
