        bytes: 644065
        v4_citation_dom: <p>From these enrichments, we established a strain collection that reflects the taxonomic
          and functional diversity of the community (Fig. <a data-track="click" data-track-action="figure anchor"
          data-track-label="link" href="/articles/s41586-026-10980-z#Fig1">1b</a>). We isolated 5 exploiters, 16
          scavengers and 7 degraders, namely V25 (<i>Luteolibacter</i>), V69 (<i>Roseibacillus</i>), G88 (<i>Pseudocolwellia</i>)
          and four members of the Flavobacteriia (F12, F40, F56 and F94). We additionally included the previously
          characterized degrader <i>Lentimonas</i> sp. CC4 as strain V4<sup><a aria-label="Reference 3" data-test="citation-ref"
          data-track="click" data-track-action="reference anchor" data-track-label="link" href="/articles/s41586-026-10980-z#ref-CR3"
          id="ref-link-section-d369084562e757" title="Sichert, A. et al. Verrucomicrobia use hundreds of enzymes
          to digest the algal polysaccharide fucoidan. Nat. Microbiol. 5, 1026–1039 (2020).">3</a></sup>. Isolate
          classification was experimentally validated by confirming that degraders grow on fucoidan, exploiters
          grow on fucose (but not fucoidan), and scavengers are unable to utilize either substrate (Supplementary
          Fig. <a data-track="click" data-track-action="supplementary material anchor" data-track-label="link" href="/articles/s41586-026-10980-z#MOESM1">1</a>).
          Although several degraders were not previously described, we found that in particular V69 and V4 co-occur
          across many macroalgae-associated coastal habitats (Supplementary Fig. <a data-track="click" data-track-action="supplementary
          material anchor" data-track-label="link" href="/articles/s41586-026-10980-z#MOESM1">2</a> and Supplementary
          Note <a data-track="click" data-track-action="supplementary material anchor" data-track-label="link" href="/articles/s41586-026-10980-z#MOESM1">2</a>),
          highlighting the ecological relevance of this strain collection. Collectively, these 29 strains provide
          a foundation for dissecting the mechanisms of fucoidan degradation in microbial communities.</p>
