      description: A defined seven-member marine bacterial SynCom assembled from the fucoidan degraders F12, F40,
        F56, F94, V25, V69, and V4 to quantify complementary fucose- and rare-sugar-monomer degradation of Fucus
        vesiculosus fucoidan. Sichert et al. constructed all 127 possible non-empty combinations of these degraders
        at equal OD600 in MBL medium with 0.2% fucoidan, measured total and monomer-specific degradation by liquid
        chromatography mass spectrometry, and resolved a functionally synergistic community landscape in which specialized
        degrader combinations reached up to 97.1% total degradation.
      source_summary: ''
      environment_summary: laboratory environment | ENVO:01001405 | The curated entity is a defined laboratory SynCom
        grown on purified brown-algal fucoidan in MBL medium.
