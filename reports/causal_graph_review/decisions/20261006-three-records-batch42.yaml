        specialist. | Algibacter lectus AS40 (Algibacter lectus) - PRIMARY_DEGRADER - Equal-OD seven-degrader SynCom
        member F40; rare-sugar specialist and member of the highest-degradation five-strain community. | Mariniflexile
        sp. AS56 - PRIMARY_DEGRADER - Equal-OD seven-degrader SynCom member F56; generalist and member of the highest-degradation
        five-strain community. | Zobellia laminariae AS94 (Zobellia laminariae) - PRIMARY_DEGRADER - Equal-OD seven-degrader
        SynCom member F94; rare-sugar specialist and member of the highest-degradation five-strain community. |
        Luteolibacter sp. AS25 - PRIMARY_DEGRADER - Equal-OD seven-degrader SynCom member V25; fucose specialist.
        | Roseibacillus persicicus AS69 (Roseibacillus persicicus) - PRIMARY_DEGRADER - Equal-OD seven-degrader
        SynCom member V69; generalist and member of the highest-degradation five-strain community. | Lentimonas
        sp. CC4 - PRIMARY_DEGRADER - Equal-OD seven-degrader SynCom member V4; fucose specialist and member of the
        highest-degradation five-strain community.
      interaction_summary: Complementary fucoidan monomer degradation - The SynCom's community-level degradation
        emerges from combining fucose specialists, rare-sugar specialists, and generalists whose enzyme repertoires
        unlock distinct fractions of the sulfated F. vesiculosus fucoidan substrate. | Seven-degrader synergistic
        function landscape - The complete non-empty panel of seven fucoidan degraders produced a smooth community-function
        landscape in which synergism remained common even among combinations approaching nearly complete degradation.
