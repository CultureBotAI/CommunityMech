- path: kb/communities/ANME_SRB_Anaerobic_Methanotrophic_Syntrophic_Consortia.yaml
  id: CommunityMech:000276
  record_sha256: 33b202bc07eceb38a47c560434734e8b21f1b251bf20433964af97aef3568b6b
  status: reviewed
  review_file: reports/causal_graph_review/decisions/20261005-seven-records.yaml
  scope: Whole record read; every existing causal node and edge checked against cited primary-source passages. Other
    metadata is not certified by this graph review.
  outcome: no_change
  summary: Retain the existing source-bounded causal graph after review
  node_decisions:
  - node: ANME methane oxidation supplies syntrophic electrons
    rationale: Retain the methane-derived electron source within the three characterized enrichment types. The source
      places this upstream of interpartner electron transport; the graph does not assert a newly isolated molecular
      methane-oxidation catalyst.
  - node: Redox-Conduction Direct Interspecies Electron Transport
    rationale: Retain measured redox conduction. Generator-collector assays across a 5-micrometer gap in live biomass,
      PBS/Gelrite/sulfide controls, and heat/oxygen/fixation responses support biomolecular redox conduction. The
      node correctly says consistent with multiheme cytochrome c instead of claiming an identified protein conduit.
  - node: SRB sulfate reduction accepts methane-derived electrons
    rationale: Retain the receiving sulfate-reduction process in the identified ANME/SRB enrichment pairs. This
      completes the source-supported syntrophic electron-flow chain without adding a reciprocal feedback arrow.
  edges_before:
  - source: ANME methane oxidation supplies syntrophic electrons
    target: Redox-Conduction Direct Interspecies Electron Transport
    description: Methane-derived electrons are conducted from ANME cells to SRB partners to support the interspecies
      syntrophy.
  - source: Redox-Conduction Direct Interspecies Electron Transport
    target: SRB sulfate reduction accepts methane-derived electrons
    description: Redox-conduction electron transfer links archaeal methane oxidation to SRB sulfate reduction in
      the sediment-free enrichments.
  edges_after:
  - source: ANME methane oxidation supplies syntrophic electrons
    target: Redox-Conduction Direct Interspecies Electron Transport
    description: Methane-derived electrons are conducted from ANME cells to SRB partners to support the interspecies
      syntrophy.
  - source: Redox-Conduction Direct Interspecies Electron Transport
    target: SRB sulfate reduction accepts methane-derived electrons
    description: Redox-conduction electron transfer links archaeal methane oxidation to SRB sulfate reduction in
      the sediment-free enrichments.
  references:
  - PMID:40845095
  review_notes:
  - Measurements demonstrate conduction capacity and redox potentials, not identification of individual multiheme
    proteins.
  - The source disfavors metallic conduction by pili and does not fully exclude alternative redox-active molecules.
    Current wording does not assert metallic pili or an exact cytochrome.
  - Three enrichment types are kept distinct in the record description and taxa notes; their members are not presented
    as one obligatory six-member culture.
