    rationale: Qualify inference; remove niche-partitioning label.
  - node: Flanking-Community Substrate Provision To PAOs
    rationale: Remove unsupported acetate specificity; qualify transfer.
  - node: Sludge Floc and Biofilm Formation
    rationale: Separate genetic potential from colonization facilitation.
