- path: kb/communities/AMD_Nitrososphaerota_Archaeal.yaml
  id: CommunityMech:000002
  record_sha256: 4ec75078d1c9fcd32e5fbac218c3d4c48af25be5a0cb76887cc650c570c95e22
  status: reviewed
  review_file: reports/causal_graph_review/decisions/20261005-seven-records.yaml
  scope: Whole record read; every existing causal node and edge checked against cited primary-source passages. Other
    metadata is not certified by this graph review.
  outcome: changed
  summary: Separate AMD nitrifier potential from unmeasured transfers and cross-system attribution
  node_decisions:
  - node: Archaeal Ammonia Oxidation to Nitrite
    rationale: Separate measured acidic-soil isolate physiology from AMD gene potential; retain only a hypothesized
      nitrite-supply edge and remove unsupported urea attribution.
  - node: Nitrite Oxidation to Nitrate by Nitrospira
    rationale: Retain nxrB-supported potential, remove the unmeasured detoxification feedback and the ammonia-oxidation
      GO term.
  - node: Putative Ferroplasma Organic Matter Turnover
    rationale: Rename to avoid asserting detoxification; distinguish the Leptospirillum culture partner from AOA
      and remove the unsupported benefit classification.
  - node: Archaeal Ammonia-Oxidizer Diversity
    rationale: Retain lineage diversity but remove an untested pH-partitioning mechanism and classification.
  edges_before:
  - source: Archaeal Ammonia Oxidation to Nitrite
    target: Nitrite Oxidation to Nitrate by Nitrospira
    description: Nitrite produced by AOA can be consumed by nitrite-oxidizing bacteria.
  - source: Nitrite Oxidation to Nitrate by Nitrospira
    target: Archaeal Ammonia Oxidation to Nitrite
    description: Prevention of nitrite toxicity enables continued AOA activity
  - source: Urea-Mediated Ammonia Provision
    target: Archaeal Ammonia Oxidation to Nitrite
    description: Urea hydrolysis can supply ammonia for downstream archaeal ammonia oxidation.
  edges_after:
  - source: Archaeal Ammonia Oxidation to Nitrite
    target: Nitrite Oxidation to Nitrate by Nitrospira
    description: HYPOTHESIZED - ammonia oxidation could supply nitrite to Nitrospira-related NOB. The AMD gene survey
      supports the potential sequence, but did not measure nitrite flux between these populations.
  references:
  - PMID:21896746
  - PMID:22592820
  - PMID:24909965
  - PMID:26896134
  - PMID:27535541
  - PMID:29209281
  - PMID:33388792
  removed_node_decisions:
  - node: Urea-Mediated Ammonia Provision
    rationale: Acid-soil urea stimulation does not identify the named participant or establish this AMD process.
      Preserve the research gap instead of an unsupported node.
  renamed_nodes:
    Organic Matter Detoxification by Ferroplasma: Putative Ferroplasma Organic Matter Turnover
    Complementary Archaeal Nitrification Across pH Gradient: Archaeal Ammonia-Oxidizer Diversity
  limitations:
  - Non-graph descriptions, taxon notes, and environmental numbers remain outside this review's validation scope.
  history_file: history/records/AMD_Nitrososphaerota_Archaeal/2026-10-05T055158Z-codex-ce2f0a.yaml
- path: kb/communities/Aerobic_Denitrification_QQ_SynCom.yaml
  id: CommunityMech:000115
  record_sha256: 91bebb0e6765cb47335cb04931e7b62995b04a900d2cf7a9b296e9033c236980
  status: reviewed
  review_file: reports/causal_graph_review/decisions/20261005-seven-records.yaml
  scope: Whole record read; every existing causal node and edge checked against cited primary-source passages. Other
    metadata is not certified by this graph review.
  outcome: changed
  summary: Qualify quorum-quenching mediator edges and remove unsupported ecological classifications
  node_decisions:
  - node: Aeromonas quorum quenching of 3OC12-HSL
    rationale: Retain the author-reported sequence with abstract-scope uncertainty; remove the unestablished mutual-benefit
      label.
  - node: Pyocyanine-stimulated electron transfer
    rationale: Preserve the proposed nitrite-reduction contribution as PARTIAL; do not equate redox mediation with
      nutritional exchange.
  - node: Efficient nitrate reduction by the three-member SMC
    rationale: Retain the measured nitrate-removal endpoint without asserting thermodynamic syntrophy.
  edges_before:
  - source: Aeromonas quorum quenching of 3OC12-HSL
    target: Pyocyanine-stimulated electron transfer
    description: The 3OC12-HSL decline caused by quorum quenching stimulates pyocyanine excretion and downstream
      electron transfer.
  - source: Pyocyanine-stimulated electron transfer
    target: Efficient nitrate reduction by the three-member SMC
    description: Pyocyanine-enhanced electron transfer supports efficient nitrate and nitrite reduction by the full
      synthetic community.
  edges_after:
  - source: Aeromonas quorum quenching of 3OC12-HSL
    target: Pyocyanine-stimulated electron transfer
    description: PARTIAL - the abstract reports that Aeromonas-associated 3OC12-HSL decline stimulates pyocyanin
      excretion, but does not describe mediator-specific disruption or rescue controls.
  - source: Pyocyanine-stimulated electron transfer
    target: Efficient nitrate reduction by the three-member SMC
    description: PARTIAL - pyocyanin-associated electron transfer could support the nitrite-reduction component
      of the community endpoint. The abstract also describes nitrate-reduction and energy-metabolism routes, so
      this is not a sole explanation of nitrate removal.
  references:
  - PMID:38277828
  limitations:
  - Only the abstract was available for this source review; the Europe PMC lookup did not supply full text.
  history_file: history/records/Aerobic_Denitrification_QQ_SynCom/2026-10-05T055159Z-codex-a94738.yaml
