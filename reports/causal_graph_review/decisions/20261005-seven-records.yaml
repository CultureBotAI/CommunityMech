    target: PAO Phosphate Storage Under EBPR Selection
    description: HYPOTHESIZED - flanking bacteria supply PAO substrates; this study does not measure that transfer.
  - source: Sludge Floc and Biofilm Formation
    target: Stable Full-Scale EBPR Phosphorus Removal
