    target: Stable Full-Scale EBPR Phosphorus Removal
    description: 'Polyphosphate-accumulating organisms provide the phosphate-storage metabolism that removes phosphorus
      from wastewater in the stable full-scale EBPR process.

      '
  - source: Flanking-Community Substrate Provision To PAOs
    target: PAO Phosphate Storage Under EBPR Selection
    description: 'Substrate release by fermenting and hydrolytic flanking bacteria supplies PAOs, linking community
      trophic support to the phosphorus-storage process selected in the full-scale EBPR plant.

      '
  - source: Sludge Floc and Biofilm Formation
    target: Stable Full-Scale EBPR Phosphorus Removal
    description: 'Activated-sludge floc and biofilm formation retain biomass in the plant, sustaining the phosphorus-removing
      community selected by EBPR operation.

      '
