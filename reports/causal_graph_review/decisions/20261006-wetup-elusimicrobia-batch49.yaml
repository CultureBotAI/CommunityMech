  review_file: reports/causal_graph_review/decisions/20261006-wetup-elusimicrobia-batch49.yaml
  scope: Whole record and every original node/arrow; bounded current structure, not all possible mechanisms.
  summary: Bound wet-up viral mortality and inferred carbon mediation.
  renamed_nodes:
    Lytic Virus Activity Dominates Wet-Up Response: Lytic-Dominated Viral Response Inferred After Wet-Up
    Viral Lysis Drives Microbial Death: Estimated Viral Contribution to Microbial Death
    Lysis-Coupled Biomass Turnover and CO2 Efflux: Inferred Lysis Contribution to Biomass Turnover and CO2 Efflux
  node_decisions:
  - node: Lytic-Dominated Viral Response Inferred After Wet-Up
    rationale: Retain positive laboratory viral time-course and replication observations; distinguish biomass proxies
      and lifestyle inference from resolved infection events.
  - node: Estimated Viral Contribution to Microbial Death
    rationale: Retain aggregate virus-to-bacterium predation as a model-bounded mortality estimate, not a directly
      measured fixed 46% effect.
  - node: Inferred Lysis Contribution to Biomass Turnover and CO2 Efflux
    rationale: Retain the authors' ecosystem carbon interpretation as a community-level hypothesis, not pairwise
      predation or isolated CO2 mediation.
  removed_node_decisions: []
  edges_before:
  - source: Lytic Virus Activity Dominates Wet-Up Response
    target: Viral Lysis Drives Microbial Death
    description: Wet-up lytic viral activity produces measurable host-cell lysis by one week after rewetting.
  - source: Viral Lysis Drives Microbial Death
    target: Lysis-Coupled Biomass Turnover and CO2 Efflux
    description: Virus-driven bacterial death contributes to microbial biomass turnover and the post-wet-up CO2
      efflux from seasonally dry soil.
  edges_after:
  - source: Lytic-Dominated Viral Response Inferred After Wet-Up
    target: Estimated Viral Contribution to Microbial Death
    description: PARTIAL - productive lytic infection would cause host death. Viral replication, particle dynamics
      and lifestyle markers support this contribution, but the magnitude is inferred using burst-size and recovery
      assumptions rather than directly resolved infection-to-death events.
  - source: Estimated Viral Contribution to Microbial Death
    target: Inferred Lysis Contribution to Biomass Turnover and CO2 Efflux
    description: HYPOTHESIZED - lysis-released cellular carbon could support turnover and community respiration.
      The study does not isolate the viral share of CO2 efflux or selectively establish this carbon-transfer mediation.
  retained_edge_decisions:
  - source: Lytic-Dominated Viral Response Inferred After Wet-Up
    target: Estimated Viral Contribution to Microbial Death
    description: PARTIAL - productive lytic infection would cause host death. Viral replication, particle dynamics
      and lifestyle markers support this contribution, but the magnitude is inferred using burst-size and recovery
