    Novel Nitrogenase Paralog and Radical SAM Cluster: Nitrogenase-Paralog Loci with Predicted Tetrapyrrole Function
  node_decisions:
  - node: Comparative Elusimicrobia Genomic Metabolic Repertoires
    rationale: Retain multi-habitat genomic comparison without niche partitioning or assumed co-occurrence; remove
      all three inclusion arrows.
  - node: Predicted Lineage-Specific Respiratory Capacities
    rationale: Retain conditional intrinsic respiratory potential without demonstrated cross-feeding or a universal
      complete route.
  - node: Predicted Rnf-Associated Acetogenesis from H2 and CO2
    rationale: Retain predicted intrinsic acetogenesis without measured flux, Rnf necessity or partner exchange.
  - node: Nitrogenase-Paralog Loci with Predicted Tetrapyrrole Function
    rationale: Separate observed gene neighborhoods from predicted function; do not equate the paralog with nitrogen
      fixation or commensalism.
