  references:
  - PMID:42038008
  scope: Axenic Escherichia coli XL5 (E. coli BL21(DE3) Δglk ΔptsI Δpps ΔpoxB ΔpflB; NCBITaxon:562 -> GTDB:s__Escherichia_coli,
    GROUNDED) 5-gene knockout intermediate monoculture baseline in single-sugar M9 medium (5 g/L glucose or 5 g/L xylose)
    at 37 °C and 150 rpm (initial OD600 = 0.1) over 72 h (PMID:42038008 / PMC13109302).
  node_decisions:
  - node: Delayed Non-PTS Glucose Utilization and Low Sole-Xylose D-Lactate Yield in Intermediate E. coli XL5 Monoculture
    decision: amended
    rationale: PMID:42038008 Section 3.2.1 and Figure 2A-B characterize axenic E. coli XL5 as a single COMMUNITY_LEVEL intermediate
      monoculture baseline in which ptsI and glk deletion delays exponential growth on 5 g/L glucose by 24 h (OD600 = 1.46
      at 36 h via alternative GalP/Mgl transport) while pps, poxB, and pflB deletion yields 2.66 g/L D-lactate at 36 h on
      sole glucose (53.2% conversion, 0.07 g/L/h; 28.56-fold over WT at 0.09 g/L) but only 0.21 g/L D-lactate (4.2% conversion)
      on sole xylose despite 48-h complete xylose consumption; enriched node evidence from 4 to 6 non-overlapping verbatim
      snippets without adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42038008 does not resolve why deleting pta, frdABC, adhE, dld, and mgsA in E. coli XL5 (to generate XL12) inverted
    single-sugar D-lactate conversion from 2.66 g/L on glucose and 0.21 g/L on xylose in XL5 to 0.30 g/L on glucose and 2.66
    g/L on xylose in XL12 (documented in KNOWLEDGE_GAP discussion xl5_to_xl12_glucose_lactate_switch_mechanism).
  - Step-wise genetic derivation from XL5 to XL12 (CommunityMech:000543) is a strain-construction lineage relation rather
    than an ecological interaction edge.
