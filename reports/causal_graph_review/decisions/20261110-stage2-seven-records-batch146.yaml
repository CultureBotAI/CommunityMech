  references:
  - PMID:42038008
  scope: Axenic Escherichia coli GL10 (E. coli BL21(DE3) Δpps ΔpoxB ΔpflB Δpta ΔfrdABC ΔadhE Δdld ΔmgsA; NCBITaxon:562 ->
    GTDB:s__Escherichia_coli, GROUNDED) glucose-specialized monoculture baseline in single-sugar (5 g/L glucose or 5 g/L xylose)
    and mixed-sugar (5 g/L glucose + 5 g/L xylose) M9 medium at 37 °C and 150 rpm (initial OD600 = 0.1) over 72 h (PMID:42038008
    / PMC13109302).
  node_decisions:
  - node: PTS-Mediated Glucose Specialization, CCR-Driven Xylose Exclusion, and Homofermentative D-Lactate Production by E.
      coli GL10 Monoculture
    decision: amended
    rationale: PMID:42038008 Sections 3.3.1-3.3.2, Figures 5-6, Figures S7-S9, and Table S4 characterize axenic E. coli GL10
      as a single COMMUNITY_LEVEL monoculture baseline that depletes 5 g/L glucose within 12 h to produce 3.15 g/L D-lactate
      at 36 h on sole glucose (63% conversion, 0.09 g/L/h; 3.92-fold higher conversion than 0.64 g/L on sole xylose) and 3.45
      g/L optically pure (100%) D-lactate on mixed 5 g/L glucose + 5 g/L xylose (34.5% conversion, 0.10 g/L/h, 8.32-fold over
      WT) with CCR-mediated exclusion of xylose and zero detectable succinate, formate, acetate, or ethanol; enriched node
      evidence from 4 to 6 non-overlapping verbatim snippets without adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42038008 reports that E. coli GL10 exhibits growth and xylose consumption kinetics nearly identical to wild-type
    E. coli on sole xylose (Figure 5A) yet produces 3.92-fold less D-lactate (0.64 g/L vs 3.15 g/L on glucose) without resolving
    the intracellular flux split on sole xylose (documented in KNOWLEDGE_GAP discussion gl10_xylose_d_lactate_conversion_bottleneck).
  - Division-of-labor sugar co-utilization with xylose-specialized E. coli XL12 (CommunityMech:000543) occurs only in the
    two-strain co-culture (CommunityMech:000357), so no inter-taxon downstream causal edge belongs on this single-strain isolate
    baseline.
