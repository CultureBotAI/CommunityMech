  node_decisions:
  - node: PTS/Glk Deletion-Mediated Xylose Specialization, Relieved Carbon Catabolite Repression, and D-Lactate Synthesis
      by E. coli XL12 Monoculture
    decision: amended
    rationale: PMID:42038008 Sections 3.1 and 3.2.2-3.2.3, Figures 3-4, Figures S2 and S4-S6, and Table S4 characterize axenic
      E. coli XL12 as a single COMMUNITY_LEVEL monoculture baseline with down-regulated pgi (70.95%), ppc (37.52%), and ackA
      (59.75%) expression that produces 2.66 g/L D-lactate at 36 h on sole xylose (53.2% conversion, 0.07 g/L/h; 7.87-fold
      over 0.30 g/L on sole glucose) and co-utilizes glucose and xylose simultaneously in mixed sugars (56.57% xylose utilization
      at 72 h) to yield 1.27 g/L D-lactate at 36 h (100% optical purity, 0.72 g/L succinate, and zero formate, acetate, or
      ethanol); enriched node evidence from 4 to 6 non-overlapping verbatim snippets without adding unsupported downstream
      edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42038008 detects residual glucose consumption and 0.72 g/L succinate at 36 h in E. coli XL12 mixed-sugar fermentation
    (Figure S6) despite deletion of ptsI, glk, and frdABC without experimentally identifying the responsible alternative hexose
    transporters/kinases or oxidative TCA/glyoxylate succinate route (documented in KNOWLEDGE_GAP discussion xl12_residual_glucose_uptake_and_succinate_leak).
  - Division-of-labor co-fermentation with glucose-specialized E. coli GL10 (CommunityMech:000542) is represented on the two-strain
    synthetic consortium record (CommunityMech:000357).
- id: CommunityMech:000544
  path: data/isolates/Escherichia_Coli_XL5_PTS_Deficient_D_Lactate_Isolate_Baseline.yaml
