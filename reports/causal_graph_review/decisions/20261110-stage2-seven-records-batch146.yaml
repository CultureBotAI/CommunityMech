    -> GTDB:s__Escherichia_coli, GROUNDED) xylose-specialized monoculture baseline in single-sugar (5 g/L glucose or 5 g/L
    xylose) and mixed-sugar (5 g/L glucose + 5 g/L xylose) M9 medium at 37 °C and 150 rpm (initial OD600 = 0.1) over 72 h
