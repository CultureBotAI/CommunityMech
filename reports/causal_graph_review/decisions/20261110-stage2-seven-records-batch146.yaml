criteria:
- Every reviewed record was checked against committed references_cache full-text evidence (PMID_42038008.txt / PMC13109302,
  PMID_42655156.txt / PMC13515949, and PMID_42478817.txt / PMC13426707).
- Single-strain axenic isolate baselines (CommunityMech:000542, CommunityMech:000543, CommunityMech:000544, CommunityMech:000545,
