  actual_read_scope:
  - 'Fresh EuropePMC metadata/abstracts for eight PubMed papers and Crossref identities checked. Yarrowia bioRxivAPI
    and version1 XML retrieved; not certified peer-reviewed. XML failures for four PMC articles did not imply absent
    full text: their PMC HTML bodies were retrieved and read. TCP publisher403; only its abstract supports this
    review.'
  - Algae primary Methods2.1-2.9,Results/Discussion3.1-3.4,Conclusion andTables1-4 read. Algae-only controls bound
    faster or universally better remediation; phosphate reaches detection limits in both and early nitrogen removal
    is slower in AM-AB. Correlations and theoretical methane yield are not transfer or production measurements.
    Available HRAP metadata deferred to1969; outdoor conditions must not inherit indoor stock settings.
  - Yarrowia full Methods,Results3.3-3.6,Discussion4.1-4.2 andConclusions read. Exact pair is YBGL3/YBXT-XR; shared
    glucose use and lack of simultaneous glucose/xylose consumption rule out exclusive niches. Higher fraction in1:5
    is not higher titer or all-ratio benefit. Methods/Results ratio ambiguity and existing member metadata remain1970.
    Earlier enzyme-characterization Results not fully read.
  - Yogurt19114510 strain Methods,growth/nitrogen Results andBCAA/purine Discussion;20889781 strain/compound/metabolite
    Methods,addition andnitrogen/CO2 Results/Table1 andDiscussion;24936380 main mechanism Results/Discussion andMethods;30594386
    abstract read. Distinct pairs and stage-specific recipients kept separate. Positive knockout/supplementation
    outcomes retained without flux or universal mutualism. Non-graph19395564 dataset not researched; urease summary
    deferred1971.
  - Zymomonas accepted manuscript abstract/introduction,Results andrescue controls throughpage8 andstrain Methods
    start read via UCweb PDF extraction. Direct curl/urllib PDF downloads were empty and not evidence. Positive
    spent-medium,individual metabolite andspecies-resolved growth results retained. Glutathione is not the exclusive
    necessary mediator; three pairs are separate andlong-term stability untested. Remaining protocol Methods not
    fully read.
  - hCom2 construction,augmentation,resilience,architecture,EHECchallenge Results,Discussion/limitations and relevant
    strain-preparation/augmentation/challenge Methods read. Donor dependence anddropout architecture confounding
    bound niche-filling causality. Three facilitation labels removed andoutcomes re-evidenced with existing abstract
    text; non-graph debt765 remains. No restricted full body restored.
  - All graph anddiscussion quotes checked against caches and fresh primary artifacts by normalized contiguous matching,not
    entailment proof. Four caches gain short provenance-labeled excerpts; missingTCPabstract restored from an unchanged
    user file andindependently matched.919originalcaches unchanged;924total. No full-body import,figure-pixel inspection,external-supplement/raw-data/code
    audit or whole-record certification.
