- path: kb/communities/Chlamydomonas_Methylobacterium_Mutualism.yaml
  id: CommunityMech:000015
  original_sha256: a83ebbce5327be00d163cd40d3313446dad50eb903153362f72ca9090a6d929d
  record_sha256: dd3b4dcd34d3fd452e895b325226ee0528fbde269d1e2e53af5666631849b295
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-four-records-batch11.yaml
  scope: Whole record and every existing graph node/arrow reviewed to explicit source-reading limits; preserved
    non-graph metadata is not certified.
  summary: Re-evidence Chlamydomonas-Methylobacterium IAA cooperation without conflating the proline assay
  node_decisions:
  - node: Algal Glycerol Provision in Proline-Dependent Mutualism
    rationale: Retain 2018 reciprocal glycerol/ammonium exchange, not oxygen benefit or demonstrated IAA mediation.
  - node: Cooperative IAA Degradation
    rationale: Correct IAA roles with the later primary source; retain demonstrated reciprocal growth and cooperative
      depletion.
  - node: IAA-Associated Algal Cell Division and Chlorophyll Responses
    rationale: Retain measured cell-division/chlorophyll responses without broad stress or bacterial-production
      claims.
  edges_before:
  - source: Photosynthetic Carbon Fixation and Oxygen Production
    target: IAA Production and Degradation
    description: Algal photosynthate supports bacterial growth and IAA metabolism
  - source: IAA Production and Degradation
    target: Nitrogen Stress Response Modulation
    description: IAA signaling influences algal stress physiology
  edges_after:
  - source: Algal Glycerol Provision in Proline-Dependent Mutualism
    target: Cooperative IAA Degradation
    description: HYPOTHESIZED - algal photosynthates could support the bacterial carbon/nitrogen balance needed
      for cooperative IAA removal, as proposed in the 2024 study. Its mediator is unresolved; the 2018 glycerol
      result in CYB/proline does not prove this connection in acetate-containing T-N medium.
  - source: Cooperative IAA Degradation
    target: IAA-Associated Algal Cell Division and Chlorophyll Responses
    description: PARTIAL - cooperative IAA removal can relieve the inhibition of algal cell multiplication and chlorophyll
      degradation. IAA addition and coculture comparisons support this connection, while the exact catabolic pathway,
      necessity of particular metabolites and assay specificity remain unresolved.
  references:
  - PMID:29385570
  - PMID:38269098
  source_review:
    sources:
    - reference: PMID:29385570
      cache:
        path: references_cache/PMID_29385570.md
        sha256: e3d8bd5fa24730abb5ec84ca4694c1d0964d122a676e3b2b83031ed5cbce8952
      pdf:
        temporary_filename_not_committed: communitymech-provisional-calatrava18.pdf
        sha256: 4cddfcf7f5a4768cb6f9d5ad9047e7af73e943aac6c9933a2623c95a0592ef06
      url: https://www.darwinsdaemon.com/Pubs/Calatrava18_FEMSMicrobioLett.pdf
      scope: Complete abstract and PDF text pages 1-7 through main Discussion and funding, methods, Table 1 and
        figure captions. Images, supplements and references not certified. Poppler unavailable; pypdf extraction
        issued fontTools warnings but main prose readable.
      rights: FEMS all rights reserved; downloaded outside repository, do not add publication body or PDF to repo.
      findings:
      - Cited paper establishes condition-dependent glycerol/ammonium exchange and reciprocal growth, not the graph's
        IAA mechanism.
      - M. aquaticum GR16T and algal CC-1690 grow together on proline when neither monoculture grows; preserve supported
        mutualism. Glycerol rescue and supernatant measurements support carbon provision, not an experimentally
        established oxygen benefit.
      - Abstract overgeneralizes hydroxyproline use; main results found no assayed methylobacterium rescued growth
        on free hydroxyproline. Do not repeat the abstract as universal substrate rescue.
      - CYB test medium differs from TAP preculture; natural freshwater origin of this constructed pair is not demonstrated.
    - reference: PMID:38269098
      doi: 10.1016/j.isci.2023.108762
      xml:
        temporary_filename_not_committed: communitymech-provisional-auxin2024.xml
        sha256: 4fc9862bf561f624bc10f62481e89349c81eda5a0983e6e44cf443ed2afec46b
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10805672/
      scope: XML Introduction, Results, complete Discussion/Conclusions/Limitations and STAR Methods including resource
        table and captions read. Images, supplementary files and deposited raw data not inspected.
      rights: CC BY 4.0 per primary XML.
      findings:
      - Exact later study supports algal LAO1-dependent IAA production and cooperative IAA degradation with M. aquaticum;
        current bacterial-production direction and old citation are wrong.
      - High IAA inhibits cell multiplication and chlorophyll breakdown under nitrogen limitation. Coculture relieves
        these effects and increases both populations, supporting mutualism.
      - IAA degradation requires both organisms; enzyme pathway and algal contribution remain unknown. Photosynthate
        support is explicitly hypothetical, with alternative metabolites/proteins possible.
      - Degradation assays use Salkowski indole signal, not the production assay's HPLC/MS specificity. No detected
        bacterial-monoculture ammonium is not proof of zero coculture mineralization.
      - Auxin assays use TAP-derived acetate-containing medium and CC-5325; do not collapse with 2018 CYB/proline/CC-1690
        experiments.
