  summary: Retain intrinsic iron oxidation and its mineral-oxidation link; no recipient, CBB attribution or density-control
    proof.; Retain sulfur physiology and qualified dispersal interpretation, not demonstrated passivation-removal
    mutualism.; Retain dual substrate capacity with condition-specific results and the actual 2020 comparator; no
    universal cooperation.; Retain consortium dissolution and the physical iron-recycling feedback, not pairwise
    mutualism or isolated QS mediation.; Separate externally dosed consortium responses from directly measured biogenic
    DSF in the 2021 study and hypothetical natural niche defense.; Separate added DL-AHL/transcript responses from
    endogenous production, direct motility measurement and unsupported compound stereochemistry.
  node_decisions:
  - node: Ferrous Iron Oxidation by Leptospirillum
    rationale: Retain intrinsic iron oxidation and its mineral-oxidation link; no recipient, CBB attribution or
      density-control proof.
  - node: Sulfur Oxidation by Acidithiobacillus caldus
    rationale: Retain sulfur physiology and qualified dispersal interpretation, not demonstrated passivation-removal
      mutualism.
  - node: Dual Iron and Sulfur Oxidation by Sulfobacillus
    rationale: Retain dual substrate capacity with condition-specific results and the actual 2020 comparator; no
      universal cooperation.
  - node: Pyrite and Chalcopyrite Dissolution
    rationale: Retain consortium dissolution and the physical iron-recycling feedback, not pairwise mutualism or
      isolated QS mediation.
  - node: Responses to Added DSF and BDSF
    rationale: Separate externally dosed consortium responses from directly measured biogenic DSF in the 2021 study
      and hypothetical natural niche defense.
  - node: Responses to Added AHL Mixture
    rationale: Separate added DL-AHL/transcript responses from endogenous production, direct motility measurement
      and unsupported compound stereochemistry.
