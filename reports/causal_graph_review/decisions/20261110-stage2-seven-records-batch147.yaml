  edges_after: []
  source_backed_gaps:
  - PMID:42364169 demonstrates that both purified TfdBI and TfdBII convert 2,4-DBP to 3,5-DBC in vitro
    and in recombinant E. coli, but does not quantify the relative in vivo expression or flux contributions
    of the two pJP4 paralogs (tfdBI vs tfdBII) during 2,4-DBP growth by strain JMP134 (documented in KNOWLEDGE_GAP
    discussion jmp134_tfdbi_vs_tfdbii_in_vivo_contribution).
  - Upstream BDE-47 diphenyl ether cleavage by Rhizorhabdus wittichii YL-JM2C (CommunityMech:000554) and
    interspecies 2,4-DBP cross-feeding are represented on the two-strain synthetic consortium record (CommunityMech:000388).
