- id: CommunityMech:000552
  path: data/isolates/Pelagerythrobacter_N7_Halophilic_Pyrene_Oxidation_Isolate_Baseline.yaml
  review_file: reports/causal_graph_review/decisions/20261110-stage2-seven-records-batch147.yaml
  status: reviewed
  original_sha256: 114c68f88dd909ca39612f3b4929585abad575a980eecdf98f14d74ed10f683f
  record_sha256: 16d14ed3792a286afedaa4f17ba1c1773ebb04c6a7e8fc622cb7d946ce4c9610
  references:
  - PMID:42666409
  scope: Axenic Pelagerythrobacter sp. N7 (NCBITaxon:2800685, UNRESOLVED GTDB grounding) halophilic pyrene
    monoculture baseline in 200 mL 5% salinity SSDM with 50 mg/L pyrene (initial OD600 = 0.015, 30 °C,
    120 rpm in darkness, 14 days; PMID:42666409 / PMC13522185).
  node_decisions:
  - node: Upstream Pyrene Dioxygenation and 4,5-Dicarboxyphenanthrene Bottleneck in Strain N7 Pure Culture
    decision: amended
    rationale: PMID:42666409 Sections 3.2-3.3 and 3.5-3.7, Figures 2A, 4, 6A, and 8, and Table 1 characterize
      axenic Pelagerythrobacter sp. N7 as a single COMMUNITY_LEVEL monoculture baseline that oxidizes
      pyrene via pahA (RHD), pahB, and pahC to 4,5-dihydroxypyrene (40.25 min) and 4,5-dicarboxyphenanthrene
      (38.10 min), reaching a 49.95% pyrene removal plateau after 14 days and accumulating 12.17 mg/L
      4,5-dicarboxyphenanthrene by day 9 without detectable downstream decarboxylation products or extracellular
      bioemulsifier synthesis; enriched node evidence from 3 to 5 non-overlapping verbatim snippets without
      adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42666409 annotates downstream phenanthrene/salicylate ring-cleavage genes (pahA/pahB, G12O, C12O)
    in Pelagerythrobacter sp. N7, but in axenic culture its pathway is completely arrested at 4,5-dicarboxyphenanthrene
    due to the absence of 4,5-dicarboxyphenanthrene decarboxylase (documented in KNOWLEDGE_GAP discussion
    n7_downstream_pathway_expression_without_a11).
  - Syntrophic 4,5-dicarboxyphenanthrene decarboxylation and Emulsan-mediated pyrene solubilization with
    Salinicola sp. A11 (CommunityMech:000553) occur only in the two-member PES consortium (CommunityMech:000340),
    so no inter-taxon downstream edge belongs on this single-strain isolate baseline.
