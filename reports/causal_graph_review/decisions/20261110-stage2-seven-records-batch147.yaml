  node_decisions:
  - node: Extracellular Emulsan-Like Bioemulsifier Secretion and Candidate hphtC-5 Decarboxylase / C12O
      Repertoire in Strain A11 Pure Culture
    decision: amended
    rationale: PMID:42666409 Sections 3.1-3.2 and 3.4-3.6, Figures 1, 2C, 5, and 6, and Table 2 characterize
      axenic Salinicola sp. A11 as a single COMMUNITY_LEVEL monoculture baseline that shows no direct
      pyrene degradation alone (Figure 2C), secretes an extracellular Emulsan-like glycoprotein bioemulsifier
