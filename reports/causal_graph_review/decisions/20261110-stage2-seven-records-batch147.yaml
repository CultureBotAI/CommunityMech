  scope: Axenic Bacillus paramycoides B8-1 (NCBITaxon:2026194, UNRESOLVED GTDB grounding) planktonic (50
    mL or 7 mL MSM, 200 mg/L phenanthrene or naphthalene, pH 5-9, 25-50 °C, 150 rpm, 7 days) and 48-h
    TSB-preformed static glass-tube biofilm monoculture baseline (PMID:42587276 / PMC13471667).
  node_decisions:
  - node: Planktonic and Biofilm Phenanthrene and Naphthalene Biodegradation by Isolate B8-1
    decision: amended
    rationale: PMID:42587276 Figures 2, 4, 6, and 8a-b characterize axenic B. paramycoides B8-1 as a single
      COMMUNITY_LEVEL monoculture baseline that achieves 77.94% phenanthrene removal (>50% across pH 6-8;
      37 °C optimum) and 98.43% naphthalene removal (>55% across pH 5-8; 92.09%, 98.43%, 95.73%, and 71.36%
      at 30, 37, 40, and 50 °C) in planktonic culture and 60.72% phenanthrene removal in 7-day static
      glass-tube biofilm mode, outperforming all four multi-strain consortia on phenanthrene; enriched
      node evidence from 3 to 5 non-overlapping verbatim snippets without adding unsupported downstream
      edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42587276 states that planktonic naphthalene degradation by isolate B8-1 (98.43%) exceeded its
    biofilm naphthalene degradation (Figure 8b) without reporting the exact inline numeric percentage
    for B8-1 biofilm naphthalene removal (documented in KNOWLEDGE_GAP discussion b81_biofilm_naphthalene_numeric_value).
  - Antagonistic phenanthrene interactions and synergistic naphthalene interactions with Bacillus paranthracis
    A1 (CommunityMech:000550) and Bacillus licheniformis A3 (CommunityMech:000551) occur only in multi-strain
    Consortia 1, 2, and 4 (CommunityMech:000502, 000503, 000504), so no inter-taxon downstream causal
    edge belongs on this single-strain isolate baseline.
