  - PMID:42666409 proposes HphtC-5 as a candidate 4,5-dicarboxyphenanthrene decarboxylase based on AlphaFold/DoGSiteScorer
    modeling and RT-qPCR in PES coculture, but did not test axenic incubation of Salinicola sp. A11 with
    purified exogenous 4,5-dicarboxyphenanthrene (documented in KNOWLEDGE_GAP discussion a11_axenic_45dcp_growth_and_decarboxylation).
  - Syntrophic pyrene mineralization with Pelagerythrobacter sp. N7 (CommunityMech:000552) is represented
    on the two-member PES consortium record (CommunityMech:000340).
