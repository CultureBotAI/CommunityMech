  references:
  - PMID:42364169
  scope: Axenic Rhizorhabdus wittichii YL-JM2C (NCBITaxon:160791, UNRESOLVED GTDB grounding; complete
    genome BioProject PRJNA1397584) aerobic BDE-47 monoculture (18 uM BDE-47 + 0.04% w/v yeast extract
    in pH 7.0 MSM) and resting-cell biotransformation (OD600 = 4.0, 50 uM BDE-47, 30 °C, 180 rpm) baseline
    (PMID:42364169 / PMC13440307).
  node_decisions:
  - node: TcsAaAb-Catalyzed BDE-47 Angular Dioxygenation, 3,5-DBC Ortho-Cleavage, and Dead-End 2,4-DBP
      Accumulation in Strain YL-JM2C
    decision: amended
    rationale: PMID:42364169 Figures 1-3 and Figures S1-S6 and S8-S9 characterize axenic R. wittichii
      YL-JM2C as a single COMMUNITY_LEVEL monoculture baseline that initiates BDE-47 cleavage via the
      two-component Rieske dioxygenase TcsAaAb into 3,5-dibromocatechol (mineralized via TcsC, TcsDEF,
      PcaIJ, and PcaF) and stoichiometric dead-end 2,4-dibromophenol (2,4-DBP) because its native flavin
      monooxygenase RwTfdB is active on 2-bromophenol and 2-hydroxybiphenyl but inactive toward 2,4-DBP;
      enriched node evidence from 3 to 5 non-overlapping verbatim snippets without adding unsupported
      downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42364169 demonstrates that purified RwTfdB (>50% identity to JMP134 TfdB) is catalytically active
    on 2-bromophenol and 2-hydroxybiphenyl but inactive toward 2,4-dibromophenol without resolving the
    active-site structural determinants responsible for para-bromine exclusion (documented in KNOWLEDGE_GAP
    discussion yl_jm2c_rwtfdb_structural_determinants).
  - Diffusible 2,4-DBP cross-feeding and TfdBI/TfdBII-mediated metabolic relay with Cupriavidus necator
    JMP134 (CommunityMech:000555) occur only in the two-strain synthetic consortium (CommunityMech:000388),
    so no inter-taxon downstream edge belongs on this single-strain isolate baseline.
