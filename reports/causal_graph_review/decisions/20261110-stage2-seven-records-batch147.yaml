      decarboxylase HphtC-5 (596.99 A3 binding pocket; His109-His111-His172 triad) plus salicylate hydroxylase
      and C12O; enriched node evidence from 3 to 5 non-overlapping verbatim snippets without adding unsupported
      downstream edges.
