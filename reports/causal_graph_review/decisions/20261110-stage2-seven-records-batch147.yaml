  - node: Plasmid pJP4-Encoded TfdBI/TfdBII Hydroxylation of 2,4-Dibromophenol and Sole-Carbon-Source
      Growth by Strain JMP134
    decision: amended
    rationale: PMID:42364169 Figures 2-3 and Figures S7-S10 characterize axenic C. necator JMP134 as a
      single COMMUNITY_LEVEL monoculture baseline whose plasmid pJP4-encoded flavin monooxygenases TfdBI
      and TfdBII hydroxylate 2,4-dibromophenol (2,4-DBP) to 3,5-dibromocatechol (3,5-DBC) across all tested
      halophenols except 2-hydroxybiphenyl and enable axenic growth on 2,4-DBP as sole carbon source via
      downstream tfdCDEF ortho-cleavage; enriched node evidence from 2 to 5 non-overlapping verbatim snippets
      without adding unsupported downstream edges.
