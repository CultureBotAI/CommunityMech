        buryatense (M. buryatense) 5GB1 - Arthrospira platensis (A. platensis), the enhanced growth
        observed for both species in the coculture cannot be fully explained by the in-situ exchange
        of O2 and CO2, confirming the existence of other unknown metabolic interactions for the coculture
