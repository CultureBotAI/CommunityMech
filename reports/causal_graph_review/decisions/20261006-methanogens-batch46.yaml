- path: kb/communities/Geobacter_Methanosarcina_DIET.yaml
  id: CommunityMech:000033
  original_sha256: 3c1a692277d402834b3acc3d529d8abe87a2afe7a0ae03027aae66eff187a543
  record_sha256: b6b5f1714e6692936ca408e74dba44df4cbb9518a258c7c7203425998c2979e0
  status: needs_research
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261006-methanogens-batch46.yaml
  scope: Every original node/arrow assessed and repaired; source-supported missing acetate branch explicitly incomplete.
  summary: Retain donor-to-partner DIET and condition-dependent pili/GAC evidence; correct the donor carbon reaction.;
    Bound the existing methane node to CO2 reduction without universal uniqueness or DIET-only growth.; Retain the
    exact hcp-lag phenotype and hypothetical negative arrow without niche partitioning, secretion or killing claims.
  renamed_nodes:
    Direct Electron Acceptance and Methanogenesis: DIET-Linked Carbon Dioxide Reduction to Methane
    T6SS-Associated Delay of DIET Establishment: Hcp-Associated Delay of DIET Establishment
  node_decisions:
  - node: Ethanol Oxidation and Direct Electron Transfer
    rationale: Retain donor-to-partner DIET and condition-dependent pili/GAC evidence; correct the donor carbon
      reaction.
  - node: DIET-Linked Carbon Dioxide Reduction to Methane
    rationale: Bound the existing methane node to CO2 reduction without universal uniqueness or DIET-only growth.
  - node: Hcp-Associated Delay of DIET Establishment
    rationale: Retain the exact hcp-lag phenotype and hypothetical negative arrow without niche partitioning, secretion
      or killing claims.
  removed_node_decisions: []
  edges_before:
  - source: Ethanol Oxidation and Direct Electron Transfer
    target: Direct Electron Acceptance and Methanogenesis
    description: Electrons transferred via DIET are accepted by M. barkeri for methanogenesis
  - source: T6SS-Associated Delay of DIET Establishment
    target: Ethanol Oxidation and Direct Electron Transfer
    description: NEGATIVE edge - the wild-type T6SS-expressing state of G. metallireducens delays establishment
      of the DIET partnership (>30 d lag vs very little lag for the Hcp-deficient mutant). Demonstrated by knockout
      phenotype in this exact coculture, but the mutant is pleiotropic, so the causal attribution to the T6SS specifically
      is HYPOTHESIZED rather than proven.
  edges_after:
  - source: Ethanol Oxidation and Direct Electron Transfer
    target: DIET-Linked Carbon Dioxide Reduction to Methane
    description: DIET delivers ethanol-derived electrons to M. barkeri for CO2 reduction. This electron-supply arrow
      supports the CO2 route, not an attribution of all bulk methane to that route; acetate conversion is a separate
      missing branch.
  - source: Hcp-Associated Delay of DIET Establishment
    target: Ethanol Oxidation and Direct Electron Transfer
    description: 'HYPOTHESIZED NEGATIVE: The wild-type Hcp/T6SS-associated state may delay DIET establishment relative
      to the hcp deletion strain. The exact coculture demonstrates a lag difference, but altered electron-transfer
      physiology prevents assigning the delay selectively to T6SS antagonism. The sign refers to establishment timing,
      not proven archaeal killing.'
  retained_edge_decisions:
  - source: Ethanol Oxidation and Direct Electron Transfer
    target: DIET-Linked Carbon Dioxide Reduction to Methane
    description: DIET delivers ethanol-derived electrons to M. barkeri for CO2 reduction. This electron-supply arrow
      supports the CO2 route, not an attribution of all bulk methane to that route; acetate conversion is a separate
      missing branch.
    rationale: Retain the bounded source-backed electron-supply direction; the hcp-associated negative direction
      remains explicitly HYPOTHESIZED and pleiotropy-limited.
  - source: Hcp-Associated Delay of DIET Establishment
    target: Ethanol Oxidation and Direct Electron Transfer
    description: 'HYPOTHESIZED NEGATIVE: The wild-type Hcp/T6SS-associated state may delay DIET establishment relative
      to the hcp deletion strain. The exact coculture demonstrates a lag difference, but altered electron-transfer
      physiology prevents assigning the delay selectively to T6SS antagonism. The sign refers to establishment timing,
      not proven archaeal killing.'
    rationale: Retain the bounded source-backed electron-supply direction; the hcp-associated negative direction
      remains explicitly HYPOTHESIZED and pleiotropy-limited.
