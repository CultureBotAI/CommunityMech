    from CPR location and untested host dependency.; Retain srdA-based selenate-reduction potential without flux
    or water-quality claims.
  renamed_nodes:
    Groundwater and Weathered Shale Niche Filtering: Hypothesized Groundwater and Weathered Shale Filtering
    Riparian Carbon Nitrogen and Sulfur Functional Zone: Riparian Carbon Nitrogen and Sulfur Genomic Potential
    Weathered Shale and Saturated Sediment Selenium Reduction: Deep Shale and Riparian Selenate Reduction Potential
  node_decisions:
  - node: Hypothesized Groundwater and Weathered Shale Filtering
    rationale: Retain environmental filtering as a source-proposed causal hypothesis.
  - node: Riparian Carbon Nitrogen and Sulfur Genomic Potential
    rationale: Retain DNA-based compartment differentiation without activity or niche-partitioning claims.
  - node: Depth-Enriched Uncultivated Bacterial Lineages
    rationale: Distinguish candidate-phylum depth enrichment from CPR location and untested host dependency.
  - node: Deep Shale and Riparian Selenate Reduction Potential
    rationale: Retain srdA-based selenate-reduction potential without flux or water-quality claims.
  removed_node_decisions: []
  edges_before:
  - source: Groundwater and Weathered Shale Niche Filtering
    target: Riparian Carbon Nitrogen and Sulfur Functional Zone
    description: Groundwater saturation and weathered shale stratify the transect into floodplain niches where carbon,
      nitrogen, and sulfur pathway genes differentiated riparian communities from hillslope communities.
  - source: Groundwater and Weathered Shale Niche Filtering
    target: Depth-Enriched Uncultivated Bacterial Lineages
    description: The same depth and saturation gradient that separates PLM4 water-table samples localizes CPR bacteria
      primarily to floodplain and groundwater-saturated sediments.
  - source: Groundwater and Weathered Shale Niche Filtering
    target: Weathered Shale and Saturated Sediment Selenium Reduction
    description: Weathered shale and saturated sediments expose communities to mobilized selenium and the below-water-table
      redox conditions where srdA selenate-reductase genes were enriched.
  edges_after:
  - source: Hypothesized Groundwater and Weathered Shale Filtering
    target: Riparian Carbon Nitrogen and Sulfur Genomic Potential
    description: HYPOTHESIZED - groundwater-associated low-redox conditions may favor organisms carrying anaerobic
      carbon, nitrogen and sulfur pathway genes, producing the observed riparian-versus-hillslope differences. Spatial
      gene abundance supports the model but does not isolate redox as the mediator or demonstrate flux.
  - source: Hypothesized Groundwater and Weathered Shale Filtering
    target: Depth-Enriched Uncultivated Bacterial Lineages
    description: HYPOTHESIZED - depth and water-table conditions may select compatible microorganisms and possible
      hosts, influencing candidate-phylum distributions. Observational detections support environmental filtering,
      but no host dependence or exclusive groundwater requirement was tested; deep hillslope exceptions remain.
  - source: Hypothesized Groundwater and Weathered Shale Filtering
    target: Deep Shale and Riparian Selenate Reduction Potential
    description: HYPOTHESIZED - shale-derived selenium availability together with periodically reducing groundwater
      conditions may select selenate-respiring organisms and enrich srdA. Gene abundance and incomplete chemistry
      support this proposed mechanism, not experimentally demonstrated selenium reduction or export control.
