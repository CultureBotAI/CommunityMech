  summary: Separate supplied citrate, engineered REE dependence, and distinct uptake-storage perturbations
  node_decisions:
  - node: Citrate-Supplemented REE Leaching
    rationale: Retain citrate-associated supply while removing ineffective-acid and secretion claims; ground the
      supplied citrate anion and avoid relabeling total REE as Nd.
  - node: Lanthanophore-Mediated REE Bioaccumulation
    rationale: Retain the direct mll accumulation effect, distinguish its tested background, and remove cross-condition
      selectivity attribution.
  - node: Polyphosphate Granule REE Sequestration
    rationale: Retain the ppx accumulation result and storage context, not unmeasured irreversible retention or
      bond chemistry.
  - node: Methanol-Powered REE Acquisition Metabolism
    rationale: Describe delta-mxaF REE-dependent growth rather than obligate wild-type physiology.
  edges_before:
  - source: Organic Acid-Mediated REE Bioleaching
    target: Lanthanophore-Mediated REE Bioaccumulation
    description: Leached REE become bioavailable for cellular uptake
  - source: Lanthanophore-Mediated REE Bioaccumulation
    target: Polyphosphate Granule REE Sequestration
    description: Lanthanophore-delivered REE are stored in polyphosphate granules
  edges_after:
  - source: Citrate-Supplemented REE Leaching
    target: Lanthanophore-Mediated REE Bioaccumulation
    description: PARTIAL - citrate supplementation increased leaching and cellular REE accumulation, supplying more
      accessible metal. The study did not isolate mll as the mediator of that citrate-associated increment.
  - source: Lanthanophore-Mediated REE Bioaccumulation
    target: Polyphosphate Granule REE Sequestration
    description: PARTIAL - uptake supplies intracellular REE associated with polyphosphate storage. The separate
      mll and ppx experiments do not directly trace mll-delivered metal into granules or establish a combined mediation
      effect.
