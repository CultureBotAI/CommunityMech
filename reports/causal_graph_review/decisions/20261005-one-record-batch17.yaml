  source_review:
    primary_transcriptome:
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12090709/fullTextXML
      path: /private/tmp/communitymech-batch17/fusion-transcriptome.xml
      sha256: 673cfd527ec15c8194097ba339486d53396a8116b6b6ed87cc0f6c91b7d1ca01
      license: CC BY 4.0 verified in primary XML.
      sections_read:
      - Overview of genes strongly upregulated by direct interspecies contact
      - Arginine, histidine, and tryptophan biosynthesis genes and metabolism
      - Does the differential expression of ribosomal proteins support the notion that the coculture benefits C.
        acetobutylicum growth?
      - Introduction
      - Experimental design and global gene-expression summary
      - Cell motility genes
      - Wood-Ljungdahl and autotrophic energy metabolism
      - Conclusions
      - All Materials and Methods subsections
      - All seven main figure captions
      findings:
      - Do not label this as transcript-only evidence. Primary work measures supernatant amino acids, glutamate
        profiles, and C. ljungdahlii autotrophic growth with amino-acid supplementation.
      - Supplementation is C. ljungdahlii monoculture, not direct donor-to-recipient tracing; histidine-WLP pathway
        and cross-feeding remain proposed.
      - Measured early glucose-consumption rates compare coculture against C. acetobutylicum monoculture under N2
        or 80 percent H2 / 20 percent CO2. Small consistent differences support the H2-feedback hypothesis, not
        direct hydrogenase activity measurement.
      - Contact-associated ribosomal/pyrimidine expression is interpreted as growth stimulation; avoid substituting
        transcript abundance for directly measured species-specific growth.
      - Type I C. ljungdahlii monocultures differed in pressure, agitation and absence of glucose; do not call them
        identical conditions to the coculture.
      - Type I pH WAS manually adjusted at 11 hours; current record says pH uncontrolled based on absent apparatus.
        This is a separate non-graph metadata defect requiring an issue.
      - Population ratios were estimated from aligned mRNA reads, not direct cell counts.
      - No detectable isopropanol at the Type II 11-hour endpoint is phase-specific and does not refute later wild-type
        production.
      - Entire primary body and seven main figure captions read by structured XML. References and supplements not
        exhaustively read; no primary figure visually inspected yet.
      - Heat shock is specifically in the C. acetobutylicum preculture protocol, not both organisms; current shared
        growth_media preparation note needs non-graph clarification.
      - Approximately 25 percent C. ljungdahlii in the library-depth rationale cites prior work, whereas Figure
        1 population profiles use mRNA reads; distinguish both evidence origins when reviewing abundance metadata.
      - Amino-acid supplementation Figure 6 uses two biological replicates, unlike the three-replicate Type I/II
        transcriptome experiments.
    primary_structure:
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7468208/fullTextXML
      path: /private/tmp/communitymech-batch17/fusion-structure.xml
      sha256: d7a2480f551f28dd40e766be8a53f3315def3c82da087d0a08bd74b4824caa6a
      license: CC BY 4.0 verified in primary XML.
      reading: Whole main body, Methods and eight main figure captions read. Main images, supplements and bibliography
        not exhaustively inspected. Public image download returned 403; no image inspection claimed.
      findings:
      - Wild-type electron microscopy and tomography demonstrate cell-wall and membrane fusion. Chemical protein
        dyes also support wild-type protein exchange.
      - Many protein images use reporters; the RNA experiment pairs WT C. ljungdahlii with C. acetobutylicum-Halo.
        Do not describe every assay as an unmodified pair.
      - RNASelect is not mRNA-specific; the stable signal is interpreted largely as rRNA/tRNA.
      - The structural study uses 100 nm protein-exchange transwells, distinct from the 2025 0.4 micrometer transcriptome
        transwells.
      - C. ljungdahlii can in principle produce 2,3-butanediol alone, but did not in the reported monoculture controls.
        Bound emergence to those conditions.
      - Membrane separation supports contact dependence, not a selective perturbation establishing that fusion itself
        is necessary for metabolite production.
    primary_dna:
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10865971/fullTextXML
      path: /private/tmp/communitymech-batch17/fusion-dna.xml
      sha256: 68696172fa04c38aed633529884a2fad1c56822122912185774bf171e5b8b22b
      license: CC BY 4.0 verified in primary XML.
      reading: Whole main body, Methods and five main figure captions read. Table 1 not separately inspected; images
        and supplements not visually inspected.
      findings:
      - WT recipient C. acetobutylicum was paired with plasmid-bearing C. ljungdahlii-ptaHalo, followed by selective
        passages; not the wild-type pairing curated here.
      - Selected P4.5 cells have integrated plasmid DNA supported by PCR and long reads; this real result must not
        be relabeled as unsupported biology.
      - Fusion is the authors' most-likely route, not directly established by DNA imaging or fusion-specific perturbation.
        Other route exclusions are mechanistic arguments.
      - Mixed or hybrid populations and methylation evidence do not establish universal stable clonal hybrids. No
        such claim will be added.
    primary_founding:
      url: https://pubmed.ncbi.nlm.nih.gov/30391511/
      reading: Fresh primary abstract and complete selected-snippet cache read; full body not obtained. No new numerical
        claim curated from inaccessible body.
