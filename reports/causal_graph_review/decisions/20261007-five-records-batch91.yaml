schema_definition: 'Metabolic cooperation in which one partner''s product is another''s substrate, and removing
  that product is what makes the first partner''s metabolism favourable.

  **Obligacy is not asserted.** This value used to read "Obligate metabolic cooperation", which the corpus''s 135
  uses do not honour and which a single record can rarely establish: showing that neither partner grows alone needs
  a monoculture arm, and where sources have one they often disprove obligacy. CommunityMech:000336 is the worked
  case - every paper calls that pairing a syntrophy and its seed paper grows both species as monocultures in the
  same experiment (#752).

  Where the distinction matters, state it in the interaction''s `description` with the evidence for it. METPO:1007200
  obligate syntrophy interaction and METPO:1007201 facultative syntrophy interaction are proposed in `proposals/metpo_communitymech_interaction_semantics_v1/`
  so it can eventually be typed rather than narrated.'
