    target: Enhanced Colonization Through Community Cooperation
    description: Suppression of MAMP-triggered immunity gates microbial access to Arabidopsis roots, allowing robust
      suppressors to improve the root colonization capacity of otherwise nonsuppressive commensals.
  - source: Type II Secretion-Mediated Immune Modulation
    target: MAMP-Triggered Immunity Suppression
    description: Type II secretion provides an extracellular suppressor mechanism that prevents full activation
      of Arabidopsis MAMP-triggered immunity.
  edges_after:
  - source: Root flg22 Immune Suppression
    target: Suppression-Associated Root Colonization Facilitation
    description: Suppression can facilitate nonsuppressor root colonization under the tested conditions. MF79 wild-type
      retentate, unlike T2SS-mutant material, countered the flg22-associated reduction in Ochrobactrum MF370 colonization.
      This does not establish universal facilitation by every suppressor or reciprocal benefit.
  - source: MF79 Type II Secretion-Dependent Immune Modulation
    target: Root flg22 Immune Suppression
    description: MF79 T2SS function enables its extracellular suppressive activity in the root reporter assay. This
      arrow applies to the MF79 component of the suppression node, not necessity of T2SS for the entire SynCom35
      phenotype.
