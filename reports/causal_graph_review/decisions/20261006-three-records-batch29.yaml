    rationale: The cited colonization snippet does not measure Microbacterium/Stenotrophomonas nutrient exchange,
      amino-acid supply or siderophore public goods.
  - node: Negative Control Strain Baseline Response
    rationale: The cited background snippet and reviewed primary main body do not establish the asserted E. coli
      control phenotype or E. coli/Dyella competition; supplements were not inspected.
