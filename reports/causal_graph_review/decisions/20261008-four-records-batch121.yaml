  actual_read_scope:
  - Four fresh EuropePMC abstract/metadata and Crossref retrievals cover three unique primary studies. Complete
    wheat C1/C6 and crown-rot main bodies read including methods,results,discussion,tables and captions. C1/C6 XML/body
    hashes are identical. No original figure pixels,separate supplementary files,raw data or analysis code audited.
  - Tomato changes are abstract-bounded. EuropePMC has no PMC identifier and lists subscription-required DOI access;
    DOI open was unavailable and ScienceDirect PII S0981942823004527 returned403. No exhaustive full-text absence
    claim,access bypass or author contact. No full article-body import.
  - Tomato retains positive complementary community functions,leaf oxylipin activation,biosynthesis-inhibition loss
    of protection,and SlLOX5/SlDES1 overexpression benefit. This supports pathway-level causality,not reciprocal
    bacterial fitness,unique biofilm mediation or independent necessity of each divinyl ether. Exact member/role
    metadata remains1943.
  - Wheat C1/C6 primary is CC BY4.0. Equal-ratio assembly is preparation,not ecological colonization; prior workflow-arrow
    removals remain intact. C1 retains significant greenhouse benefits but no demonstrated superiority over the
    best single strain. C6 retains positive dual-plate inhibition and Salkowski output but Arabidopsis root shortening
    is not growth promotion. Positive individual-member secretion/volatile assays do not override whole-mixture
    nulls. Persistence explicitly was not assessed. Negative r-squared notation is not silently repaired. Non-graph
    abundance/metal scope remains1944.
  - Crown-rot primary is CC BY-NC-ND4.0,not unrestricted CC BY. Preserve measured pot disease and grain benefits.
    Relative DNA profiles are not viable-cell colonization or functional flux; correlation networks do not establish
    cooperation or ecological necessity. Added allantoin/dihydrodaidzein have positive plant outcomes and negative
    direct fungal assays; do not erase these positives or infer intact-SMC necessity. Old cache wording differs
    from fresh abstract and bacterial-treatment assignments; timing and provenance remain1945.
  - Exactly three short crown-rot discussion excerpts,21quoted words,are appended with source/license attribution.
    Old cache bytes remain an unchanged prefix. No protocol addition or full-body import. All24graph and10discussion
    quotes independently matched to fresh primary and authoritative local caches; literal matches are not entailment
    proof. Existing selected caches and primary text read; no claim to manual whole-reading of the very long C1
    markdown cache.
