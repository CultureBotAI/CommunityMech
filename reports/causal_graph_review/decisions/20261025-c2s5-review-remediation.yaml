    nutrient CROSS_FEEDING.; Retain light-driven oxidation and both existing directions,
    correcting discharge terminology.; Retain reduction and both existing directions,
    correcting charge terminology and removing transport misannotation.; Retain the
    observed reusable reservoir without SYNTROPHY or perpetual-cycle claims; remove
    secondary editorial evidence.
  node_decisions:
  - node: Magnetite-Mediated Electron Sharing
    rationale: Retain mineral-mediated electron storage without direct donor-recipient
      nutrient CROSS_FEEDING.
  - node: Phototrophic Magnetite Fe(II) Oxidation
    rationale: Retain light-driven oxidation and both existing directions, correcting
      discharge terminology.
  - node: Anaerobic Magnetite Fe(III) Reduction
    rationale: Retain reduction and both existing directions, correcting charge terminology
      and removing transport misannotation.
  - node: Biogeochemical Battery Function
    rationale: Retain the observed reusable reservoir without SYNTROPHY or perpetual-cycle
      claims; remove secondary editorial evidence.
  removed_node_decisions: []
