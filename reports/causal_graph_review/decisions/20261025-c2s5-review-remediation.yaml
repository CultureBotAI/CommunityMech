  edges_before:
  - &id001
    source: Magnetite-Mediated Electron Sharing
    target: Biogeochemical Battery Function
    description: 'Magnetite-mediated electron sharing between the phototrophic Fe(II)
      oxidizer and the anaerobic Fe(III) reducer manifests as the emergent, reusable
      mineral electron-storage system (the "battery").

      '
  - &id003
    source: Phototrophic Magnetite Fe(II) Oxidation
    target: Anaerobic Magnetite Fe(III) Reduction
    description: 'Light-driven oxidation of magnetite Fe(II) to Fe(III) supplies the
      oxidized Fe(III) that G. sulfurreducens subsequently uses as its anaerobic electron
      acceptor.

      '
  - &id005
    source: Phototrophic Magnetite Fe(II) Oxidation
    target: Biogeochemical Battery Function
    description: 'TIE-1 phototrophic Fe(II) oxidation is one half of the reversible
      redox cycling that charges magnetite toward its oxidized state.

      '
  - &id007
    source: Anaerobic Magnetite Fe(III) Reduction
    target: Phototrophic Magnetite Fe(II) Oxidation
    description: 'G. sulfurreducens reduction of magnetite Fe(III) regenerates the
      reduced Fe(II) electron donor for TIE-1, closing the reversible redox loop (the
      process is reversible in co-cultures).

      '
  - &id009
    source: Anaerobic Magnetite Fe(III) Reduction
    target: Biogeochemical Battery Function
    description: 'Fe(III) reduction is the complementary half-reaction that restores
      the mineral''s reduced electron-storage capacity, making the magnetite store
      reusable.

      '
  edges_after:
