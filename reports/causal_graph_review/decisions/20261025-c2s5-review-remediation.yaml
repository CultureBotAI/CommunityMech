    target: Biogeochemical Battery Function
    description: Opposed microbial electron withdrawal and supply allow magnetite
      to function as the shared redox reservoir under the tested externally controlled
      conditions.
  - &id004
    source: Phototrophic Magnetite Fe(II) Oxidation
    target: Anaerobic Magnetite Fe(III) Reduction
    description: Oxidation regenerates magnetite Fe(III) that Geobacter can subsequently
