  summary: Separate conditional sponge model mechanisms from host mutualism and summary
    arrows
  node_decisions:
  - node: Coupled Nitrification in Stylissa Holobiont
    rationale: Retain modeled nitrite cross-feeding and conditional growth-support
      arrow, not thermodynamic syntrophy.
  - node: Nutrient-Responsive Cross-Feeding Network
    rationale: Retain input-dependent modeled exchange; remove component and common-input
      summary arrows.
  - node: Sponge-Derived Nutrient Provisioning to Microbiome
    rationale: Retain candidate-input mechanism without measured secretion or reciprocal
      host fitness.
  - node: Stable Ammonia-Supported Nitrifying Consortium
    rationale: 'Retain operational simulated composition endpoint: the normalized
      final/initial AOA:NOB population ratio is bounded, not absolute population size.
      No syntrophy or universal threshold claim.'
  - node: Deltaporibacter Nitrogen-Linked Cross-Feeding
    rationale: Retain conditional Deltaporibacter cross-feeding without active coordinator
      language.
  - node: Nutrient-Dependent Symbiont Trophic Balance
    rationale: Retain microbial net carbon endpoint, not whole-host balance or a separate
      exchange.
  edges_before:
  - source: Coupled Nitrification in Stylissa Holobiont
    target: Stable Ammonia-Supported Nitrifying Consortium
    description: Model simulations used AOA nitrite production to test how ammonia
      flux can maintain an actively growing AOA-NOB community.
  - source: Nutrient-Responsive Cross-Feeding Network
    target: Deltaporibacter Nitrogen-Linked Cross-Feeding
    description: Nutrient-responsive cross-feeding is centered on the newly described
      Deltaporibacter symbiont.
  - source: Nutrient-Responsive Cross-Feeding Network
    target: Nutrient-Dependent Symbiont Trophic Balance
    description: Organic-input-dependent exchange changes whether the modeled symbiont
      community is net heterotrophic or net autotrophic.
  - source: Sponge-Derived Nutrient Provisioning to Microbiome
    target: Nutrient-Responsive Cross-Feeding Network
    description: Sponge-derived nutrients define the model boundary conditions that
      drive symbiont cross-feeding and community stability.
  edges_after:
  - source: Coupled Nitrification in Stylissa Holobiont
    target: Stable Ammonia-Supported Nitrifying Consortium
    description: COMPUTATIONAL - nitrite generated by archaeal ammonia oxidation supplies
      the modeled nitrite oxidizer and can enable joint growth, conditional on imposed
      ammonia supply and cell removal. This substrate-support mechanism does not establish
      in-vivo stability or thermodynamic syntrophy.
  - source: Sponge-Derived Nutrient Provisioning to Microbiome
    target: Nutrient-Responsive Cross-Feeding Network
    description: COMPUTATIONAL - supplying candidate host-derived organic substrates
      changes the resources available for modeled microbial exchange. This conditional
      input-to-exchange mechanism does not prove host secretion, reciprocal fitness
      or the same fluxes in vivo.
