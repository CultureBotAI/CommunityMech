- path: kb/communities/Coniochaeta_Sphingobacterium_Citrobacter_Wheat_Straw_Consortium.yaml
  id: CommunityMech:000195
  original_sha256: 008d639e3e8fcff7fd48e7aee126798987fc4dabbf475c90bdc8bab5e83b0b92
  record_sha256: eb6927ba0ac59c0884bc3f479f20606ca4ae1f80b0855c415759db879a03fd2f
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-three-records-batch23.yaml
  scope: Whole record and every original node/arrow; primary access scope bounded below.
  summary: Represent intrinsic fungal transcript-based capacity with its canonical source only.; Represent the two
    bacterial inferred roles as a subset, preserving vitamin supplementation and nonexclusive ribE expression.;
    Attribute the reported fungal response to the tested bacterial pair, not solely w15 or reciprocal harm.; Preserve
    measured shaking-speed-dependent community mass loss while qualifying proposed mediators.
  renamed_nodes:
    Fungal Cellulose-Xylan-Lignin Modification Role: Fungal Lignocellulose-Associated Transcript Profile
    Bacterial Hemicellulose And Oligosaccharide Partitioning: Bacterial Carbohydrate And Support Transcript Profiles
    Inter-Kingdom Interaction And Amensalism Signal: Bacterial-Pair-Associated Fungal Response
  node_decisions:
  - node: Fungal Lignocellulose-Associated Transcript Profile
    rationale: Represent intrinsic fungal transcript-based capacity with its canonical source only.
  - node: Bacterial Carbohydrate And Support Transcript Profiles
    rationale: Represent the two bacterial inferred roles as a subset, preserving vitamin supplementation and nonexclusive
      ribE expression.
  - node: Bacterial-Pair-Associated Fungal Response
    rationale: Attribute the reported fungal response to the tested bacterial pair, not solely w15 or reciprocal
      harm.
  - node: Community Wheat-Straw Degradation
    rationale: Preserve measured shaking-speed-dependent community mass loss while qualifying proposed mediators.
  edges_before:
  - source: Fungal Cellulose-Xylan-Lignin Modification Role
    target: Community Wheat-Straw Degradation
    description: Fungal cellulose, xylan, and lignin-modification activity contributes to the tripartite consortium's
      wheat-straw degradation output.
  - source: Bacterial Hemicellulose And Oligosaccharide Partitioning
    target: Community Wheat-Straw Degradation
    description: Bacterial hemicellulose, oligosaccharide, and sugar-dimer partitioning contributes to wheat-straw
      degradation by the full consortium.
  edges_after:
  - source: Fungal Lignocellulose-Associated Transcript Profile
    target: Community Wheat-Straw Degradation
    description: PARTIAL - expression of fungal lignocellulose-associated genes is consistent with a contribution
      to measured wheat-straw loss. Protein activity, partner-resolved flux and selective enzyme perturbations are
      needed to assign the fungal share or show that transcript differences mediate the shaking-speed effect.
  - source: Bacterial Carbohydrate And Support Transcript Profiles
    target: Community Wheat-Straw Degradation
    description: PARTIAL - the inferred bacterial carbohydrate and support functions could contribute to whole-consortium
      wheat-straw loss. Transcript patterns and observed growth support this contribution, but do not selectively
      establish enzyme activity, detoxification, exchanged-carbon flux or the bacterial share of degradation.
  retained_edge_decisions:
  - source: Fungal Lignocellulose-Associated Transcript Profile
    target: Community Wheat-Straw Degradation
