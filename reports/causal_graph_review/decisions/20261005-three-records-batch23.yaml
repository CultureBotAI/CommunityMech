  node_decisions:
  - node: Native Microbiome Response To SynCom Inoculation
    rationale: Retain native-community enrichment without establishment or inoculant-roster inference.
  - node: Metagenomic CAZyme Repertoire Enrichment
    rationale: Distinguish metagenomic potential from enzyme activity and qualify proposed mediation.
  - node: Enriched lignocellulose degradation and humus accumulation
    rationale: Preserve measured treatment benefits without assigning them selectively to a taxon, gene or precursor.
  edges_before:
  - source: SynCom-driven restructuring and enrichment of native degraders
    target: Carbohydrate-active enzyme repertoire expansion
    description: Enrichment of native Thermobifida and Actinomadura is linked to a larger cellulase, hemicellulase,
      and lignin-modifying auxiliary-activity enzyme repertoire in SynCom-treated compost.
  - source: Carbohydrate-active enzyme repertoire expansion
    target: Enriched lignocellulose degradation and humus accumulation
    description: The expanded cellulase, hemicellulase, and lignin-modifying enzyme repertoire enables higher lignin,
      cellulose, and hemicellulose degradation in SynCom-treated compost.
  edges_after:
  - source: Native Microbiome Response To SynCom Inoculation
    target: Metagenomic CAZyme Repertoire Enrichment
    description: HYPOTHESIZED - a compositional shift toward native degraders could contribute to the enriched CAZyme
      gene repertoire. The abstract links community and functional profiles, but does not establish gene ownership
      or selective mediation by Thermobifida and Actinomadura.
  - source: Metagenomic CAZyme Repertoire Enrichment
    target: Enriched lignocellulose degradation and humus accumulation
    description: HYPOTHESIZED - the enriched gene repertoire could support polymer hydrolysis and supply humification
      precursors, contributing to the measured degradation and humus outcomes. Metagenomic, metabolomic and correlation
      analyses support this model, not a selective enzyme or precursor perturbation establishing mediation.
