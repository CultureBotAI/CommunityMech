limitations:
- 'Fresh both-root baseline precedes source reads: 460 records, 923 caches, 56 existing warnings, zero structural
  defects. Whole four records and all 14 original nodes/seven directions reviewed. Retain 12 nodes/three qualified
  existing directions; remove two workflow nodes/four context or coincidence arrows; rename seven nodes. No new
  topology or Edison spend.'
- Tobacco and Artemisia whole indexed publisher abstracts/highlights read; MetG2 whole indexed abstract/Introduction
  and the displayed bounded experimental-design, metagenome, discussion/conclusion previews read. Chlorella whole
  independently retrieved EuropePMC abstract read, plus an indexed publisher preview lead. These are not complete
  papers. Direct ScienceDirect requests returned HTTP403; Crossref-advertised public API links for the two CC-licensed
  articles returned HTTP400. No bypass or whole-paper/supplement/figure-pixel/raw-data certification. Publisher
  index was crawled earlier; retrieval is fresh, not a claim that the publisher page was fetched live.
- Crossref version-of-record metadata identifies tobacco as CC BY4.0 and Artemisia as CC BY-NC4.0 despite local
  historical paywall wording. That metadata does not mean their complete bodies were retrieved. No cache or license949
  repair is claimed. The four cited Markdown caches were read whole; Artemisia contains two trait/design sentences,
  not its full abstract. Existing cache content is unchanged and sufficient for every retained/new literal quotation.
- 'Tobacco: preserve measured substrate loss, community shifts and volatile/sensory outcomes. Remove mutualism and
  niche partitioning, qualify the existing directions and preserve PLS-PM mediation as a statistical hypothesis.
  No invented software/version, taxon-specific mediator or monoculture-synergy claim. Endpoint process annotations
  are removed because they describe upstream degradation, not volatile/sensory measurement.'
- 'Chlorella: preserve 60-day removal, algal biomass/protein versus BG11 and transcript responses. Remove construction/duration
  nodes and three remaining noncausal arrows while preserving prior October2 repairs. No demonstrated cross-feeding,
  neutral bacterial fitness, isolated medium effect or measured metabolic flux. Only the algal observations gain
  canonical identity-only participant scope; unnamed bacterial membership remains existing issue183.'
- 'MetG2: preserve microbial and host molecular responses and one qualified source-proposed functional contribution.
  Remove the context-only arrow, unestablished interaction types and redundant community-level source/target links.
  The indexed source names four inoculant strains and has a Chiliseed2/Chileseed2 spelling discrepancy; broad native
  rhizosphere Proteobacteria is not a resolved inoculant identity. Generic sugarcane is not verified as the canonical
  species. Record remains needs_research under1847; no new identifiers or canonical-taxonomy edits.'
- 'Artemisia: preserve the pair-level tolerance, complementarity and PGP/carbon-fixation capacity. Remove niche
  partitioning and mutualism; source assay setting is not specified in the reviewed abstract, so OTHER replaces
  unsupported IN_VIVO assignment on these trait/design items. Preserve previous removal of screening-order arrows.
