  edges_before:
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: SynCom17 inoculation supplied the 17-member community from which the OAS925-dominated
      root profile developed by 22 DAI. The SynCom16 omission comparison supports an inoculum-composition
      effect, not identification of the molecular mechanism or absolute loss of the other members.
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: Treatment-Structured Rhizosphere Exometabolites
    description: SynCom17 inoculation altered the plant-microbe system and thereby changed the measured
