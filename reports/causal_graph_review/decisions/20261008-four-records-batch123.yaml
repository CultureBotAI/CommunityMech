  actual_read_scope:
  - Fresh EuropePMC metadata/abstracts and Crossref identities checked for all four papers. Three complete OA main
    bodies and five-species publisher Results/Discussion/Methods/Table1 plus captions inspected. Publisher web access
    succeeded despite independent direct-HTTP403. Original figure pixels,external supplements,raw data and analysis
    code not audited.
  - Five-species positive drop-out and strain-substitution effects retained. Competition is a phenotypic inference,not
    resolved molecular or complete pairwise causality; ARISA is relative DNA-based succession. All consortia complete
    fermentation and S.cerevisiae effects remain detectable. Table1/Methods information is available; separate metadata1958
    remains.
  - Three-species direct-contact growth and indirect-contact Torulaspora shifts retained. Medium-mediated suppression
    and toxin identity remain untested; expression differences are not necessary-gene perturbations. Preserve the5h
    amino-acid effect,the9h null and supplied histidine/methionine/tryptophan. Recirculation-versus-feed metadata1959
    remains.
  - Wolffia compartment associations do not establish selectively tested host filtering or microbial niche partitioning.
    MAG gene-content complementarity and minimum-three-intermediate edges are potential,not flux/FBA/abundance correlation.
    Operational endosphere fractions and non-strain-matched cultured comparators limit localization and adaptive-loss
    claims; cross-feeder role metadata1960 remains.
  - Wollastonite positive day12Ca/Si leaching and bulk metabolite changes retained. CMS-1-to-hzt transfer is hypothesized;
    medium sucrose also explains carbohydrate consumption. Selected metabolites increase,not every acid. Both existing
    arrows remain qualified; no necessary individual mediator,isolated hyphal force or measured net CO2 sequestration
    inferred. Non-graph role metadata1961 remains.
  - All22graph and4discussion quotes matched to fresh primary artifacts and caches. One17-word CC BY4 publisher
    Discussion excerpt appended with provenance to the five-species cache;922othercaches unchanged. No full-body
    cache import. Wolffia is CC BY-NC-ND4; no new verbatim excerpts added from that source.
