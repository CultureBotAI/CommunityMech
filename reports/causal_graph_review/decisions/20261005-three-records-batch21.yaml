- path: kb/communities/Clostridium_Thermoanaerobacter_Cellulosic_Bioethanol_Coculture.yaml
  id: CommunityMech:000168
  original_sha256: 4b15f63df86a441462b92e2edc669c7f2c53d39aa31af98335b613267c612871
  record_sha256: 0b2e76d94c5f2eb1d40c8505f71e811b3b4784ed0322a278f4b27628a37e7e63
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-three-records-batch21.yaml
  scope: Whole record and every original node/arrow; primary access scope bounded below.
  summary: Retain the proposed sugar-supply direction with flux and condition bounds, not direct cellulose or ethanol
    donation.; Retain comparative community ethanol production without an unsupported donor-recipient output relation.
    Keep the abstract-level C. thermocellum comparison separate from the LQRI-specific fed-batch study.; Retain
    biosynthetic capacity and the 39E intervention as support for an explicitly hypothesized X514 contribution,
    not vitamin donation or commensalism. Retain X514 as the source of its intrinsic capacity with no recipient,
    rather than using community-level scope.
  renamed_nodes:
    X514-Enhanced Ethanolic Fermentation: Enhanced Ethanol Output in X514 Cocultures
    Vitamin B12-Linked Fermentation Robustness: X514 B12 Biosynthesis and Proposed Fermentation Support
  node_decisions:
  - node: Cellulose Hydrolysis Supporting Coculture Fermentation
    rationale: Retain the proposed sugar-supply direction with flux and condition bounds, not direct cellulose or
      ethanol donation.
  - node: Enhanced Ethanol Output in X514 Cocultures
    rationale: Retain comparative community ethanol production without an unsupported donor-recipient output relation.
      Keep the abstract-level C. thermocellum comparison separate from the LQRI-specific fed-batch study.
  - node: X514 B12 Biosynthesis and Proposed Fermentation Support
    rationale: Retain biosynthetic capacity and the 39E intervention as support for an explicitly hypothesized X514
      contribution, not vitamin donation or commensalism. Retain X514 as the source of its intrinsic capacity with
      no recipient, rather than using community-level scope.
  edges_before:
  - source: Cellulose Hydrolysis Supporting Coculture Fermentation
    target: X514-Enhanced Ethanolic Fermentation
    description: 'C. thermocellum cellulose hydrolysis supplies the recalcitrant cellulosic substrate conversion
      that X514-containing cocultures redirect toward higher ethanol output.

      '
  - source: Vitamin B12-Linked Fermentation Robustness
    target: X514-Enhanced Ethanolic Fermentation
    description: 'X514 cobalamin biosynthesis is associated with the partner''s stronger ethanolic-fermentation
      enhancement in C. thermocellum cocultures.

      '
  edges_after:
  - source: Cellulose Hydrolysis Supporting Coculture Fermentation
    target: Enhanced Ethanol Output in X514 Cocultures
    description: PARTIAL - access to LQRI-derived soluble sugars can support X514 fermentation and higher community
      ethanol output. Partner flux and the separate contributions of sugar removal and operating conditions remain
      unresolved.
  - source: X514 B12 Biosynthesis and Proposed Fermentation Support
    target: Enhanced Ethanol Output in X514 Cocultures
    description: HYPOTHESIZED - B12 biosynthesis may support X514 fermentation and thereby contribute to coculture
      ethanol output. Comparative genomes and the 39E supplementation response support this proposal, but do not
      selectively establish the causal contribution in X514.
  retained_edge_decisions:
