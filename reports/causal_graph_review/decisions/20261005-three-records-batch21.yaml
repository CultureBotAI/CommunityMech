  scope: Whole record and every original node/arrow; primary access scope bounded below.
  summary: Preserve glucose cross-feeding and positive inhibition/enzyme controls while bounding feedback and cellobiose-versus-polymer
    scope.; Represent reciprocal necromass assays with both existing participants; retain growth and CFU support
    without isolating peptides or asserting anaerobic metabolism in the aerobic assay.; Preserve oxygen consumption
    and spatial partitioning after anoxic establishment; remove unsupported colonization typing and bound qPCR interpretation.;
    Separate directly measured planktonic products from biofilm mass and unmeasured biofilm product flux; remove
    aggregate endpoint syntrophy.
  renamed_nodes:
    Reciprocal Necromass Catabolism: Reciprocal Necromass-Supported Partner Growth
    Enhanced Cellulosic-Sugar Conversion and Biofilm Productivity: Measured Planktonic Conversion and Biofilm Biomass
      Outcomes
  node_decisions:
  - node: Cellobiose Hydrolysis And Glucose Scavenging Feedback
    rationale: Preserve glucose cross-feeding and positive inhibition/enzyme controls while bounding feedback and
      cellobiose-versus-polymer scope.
  - node: Reciprocal Necromass-Supported Partner Growth
    rationale: Represent reciprocal necromass assays with both existing participants; retain growth and CFU support
      without isolating peptides or asserting anaerobic metabolism in the aerobic assay.
  - node: Biofilm Oxygen Partitioning
    rationale: Preserve oxygen consumption and spatial partitioning after anoxic establishment; remove unsupported
      colonization typing and bound qPCR interpretation.
  - node: Measured Planktonic Conversion and Biofilm Biomass Outcomes
    rationale: Separate directly measured planktonic products from biofilm mass and unmeasured biofilm product flux;
      remove aggregate endpoint syntrophy.
  edges_before:
  - source: Cellobiose Hydrolysis And Glucose Scavenging Feedback
    target: Enhanced Cellulosic-Sugar Conversion and Biofilm Productivity
    description: Glucose scavenging by E. coli relieves feedback inhibition of C. phytofermentans cellulolytic-enzyme
      synthesis and increases cellulose-derived sugar flux through the consortium.
  - source: Reciprocal Necromass Catabolism
    target: Enhanced Cellulosic-Sugar Conversion and Biofilm Productivity
    description: Reciprocal necromass catabolism transfers nutrients and energy between the two trophic levels,
      increasing C. phytofermentans and E. coli biomass accumulation.
  - source: Biofilm Oxygen Partitioning
    target: Enhanced Cellulosic-Sugar Conversion and Biofilm Productivity
    description: E. coli oxygen consumption maintains an anoxic biofilm zone that lets the obligate anaerobe C.
      phytofermentans persist during oxic perturbation.
  edges_after:
  - source: Cellobiose Hydrolysis And Glucose Scavenging Feedback
    target: Measured Planktonic Conversion and Biofilm Biomass Outcomes
    description: PARTIAL - glucose scavenging can relieve inhibition and sustain cellobiose conversion, consistent
      with glucose-addition, extracellular-enzyme and coculture comparisons. This supports the planktonic conversion
      model, not a direct measurement of biofilm ethanol output.
  - source: Reciprocal Necromass-Supported Partner Growth
    target: Measured Planktonic Conversion and Biofilm Biomass Outcomes
    description: PARTIAL - necromass-addition controls support resource recovery as a contributor to partner growth
      and consortium biomass. They do not isolate its contribution to all planktonic products or establish biofilm
      ethanol production.
  - source: Biofilm Oxygen Partitioning
    target: Measured Planktonic Conversion and Biofilm Biomass Outcomes
    description: PARTIAL - biological oxygen consumption helps preserve an anoxic region after the anoxic-to-oxic
      transition and supports the biofilm biomass response. It is not a demonstrated driver of biofilm ethanol output,
      which was not directly measured.
