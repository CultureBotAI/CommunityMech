  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-three-records-batch21.yaml
  scope: Whole record and every original node/arrow; primary access scope bounded below.
  summary: Retain soluble-sugar cross-feeding with enzyme-assisted output context, distinguishing feedstock, exchange
    and product.; Retain the positive respiratory-protection and conditional mutualism evidence, not universal partner
    dependence.; Represent oxygen-dependent viable population maintenance as a two-member outcome and keep the separate
    long-term assay conditions.
  renamed_nodes:
    Long-Term Symbiotic Population Maintenance: Oxygen-Dependent Long-Term Population Maintenance
  node_decisions:
  - node: Cellulose Hydrolysis Feeds Yeast Fermentation
    rationale: Retain soluble-sugar cross-feeding with enzyme-assisted output context, distinguishing feedstock,
      exchange and product.
  - node: Oxygen Protection of Anaerobic Cellulolytic Partner
    rationale: Retain the positive respiratory-protection and conditional mutualism evidence, not universal partner
      dependence.
  - node: Oxygen-Dependent Long-Term Population Maintenance
    rationale: Represent oxygen-dependent viable population maintenance as a two-member outcome and keep the separate
      long-term assay conditions.
  edges_before:
  - source: Cellulose Hydrolysis Feeds Yeast Fermentation
    target: Long-Term Symbiotic Population Maintenance
    description: 'C. phytofermentans cellulose hydrolysis supplies soluble sugars that support yeast fermentation
      during the maintained bacterium-yeast population pairing.

      '
  - source: Oxygen Protection of Anaerobic Cellulolytic Partner
    target: Long-Term Symbiotic Population Maintenance
    description: 'Yeast oxygen removal protects the anaerobic cellulolytic partner under controlled oxygen transfer,
      allowing both populations to persist in the long-term symbiosis.

      '
  edges_after:
  - source: Cellulose Hydrolysis Feeds Yeast Fermentation
    target: Oxygen-Dependent Long-Term Population Maintenance
    description: Bacterial cellulose hydrolysis provides soluble carbon that can sustain yeast in the oxygen-controlled
      culture. PARTIAL - the long-term viable-count comparison supports this cooperation but does not directly partition
      carbon transfer or isolate every stabilizing mechanism.
  - source: Oxygen Protection of Anaerobic Cellulolytic Partner
    target: Oxygen-Dependent Long-Term Population Maintenance
    description: PARTIAL - yeast respiratory protection together with oxygen-supported yeast growth and bacterial
      sugar supply can stabilize the pairing. Oxygen-positive versus oxygen-negative viable-count controls support
      the conditional cooperation, without selectively measuring every mediator.
  retained_edge_decisions:
  - source: Cellulose Hydrolysis Feeds Yeast Fermentation
