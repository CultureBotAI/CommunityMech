  actual_read_scope:
  - Four fresh EuropePMC metadata/abstract and Crossref identities checked. Complete open TB,DT and SASW main-body
    text,methods,results,discussion and available table/caption text read. SASW Figure4 caption additionally checked
    via PubMed. No original figure pixels,separate supplementary files,raw data or analysis code audit.
  - Straw repairs are abstract-bounded. EuropePMC lists no PMCID; ACS primary search result gives abstract and supporting-information
    listing,but publisher article access returned403 and the attempted SI endpoint was inaccessible. No full text
    or supplement inspected,no access bypass or exhaustive absence claim.
  - TB retains positive pot disease control,70.97%biocontrol efficacy and growth traits. No in-vivo single-member
    arms identify necessity or synergy. Relative DNA profiles are not viable-strain persistence; network robustness
    used simulated removal. Soil metabolites are not directly sampled root exudates,QS/volatiles remain hypotheses,and
    metabolite validation from the separate six-strain paper is not transferred.
  - DT retains43.3%barley disease-assay fluorescence reduction,selective pre-challenge measured RNA changes and
    broad-profile nulls. No significant inoculant pairwise differences or assigned JA/ET/SA pathway dependence.
    Similarity-based annotations do not identify inoculant transcripts;99%OTU matching does not establish unique
    viable strains. Prior1070and dated BioProject discussion preserved; access status not rechecked.
  - Straw retains both process directions and39.85/36.99/19.21%polymer degradation and801.16mL/gTS total biogas.
    Crude enzymes rather than living producers mediate pretreatment; no reciprocal-fitness evidence or four-isolate
    methanogenesis inferred. Removed methane annotation does not assert that methane was absent.
  - SASW retains positive combined BCC outcomes with coating matrix distinct from SynCom-only effects. EPS mediation
    remains HYPOTHESIZED/PARTIAL; relative16S profiles,100%ASV matching,PICRUSt2 and Mantel/RDA do not establish
    viable-strain identity,priority-effect causality,BCAA transfer or keystone necessity. Prior1016/1017 removals
    and S1/S2 knowledge gap preserved.
