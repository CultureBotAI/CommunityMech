        term:
          id: NCBITaxon:1224
          label: Pseudomonadota
    source_locator: doi:10.1016/j.rhisph.2025.101142; Abstract
    evidence:
    - reference: doi:10.1016/j.rhisph.2025.101142
      supports: PARTIAL
      evidence_source: IN_VIVO
      snippet: an up-regulation of genes related to flagellar assembly, chemotaxis, quorum sensing, and
        biofilm formation, particularly within Proteobacteria, indicating active microbial movement toward
        root surfaces
      explanation: Supports gene upregulation and the authors colonization interpretation; it does not
        directly observe root movement or establish facilitation.
  - node: Rhizosphere enrichment of plant-associated functional genes
    rationale: Retain the bounded native-rhizosphere gene enrichment and existing HYPOTHESIZED/PARTIAL
      contribution to host expression. It is not exclusive to one phylum or all inoculants; unchanged
      unresolved aggregate participant scope is not recertified.
    field_path: ecological_interactions[1]
    participants: {}
    source_locator: doi:10.1016/j.rhisph.2025.101142; Abstract
    evidence:
    - reference: doi:10.1016/j.rhisph.2025.101142
      supports: SUPPORT
      evidence_source: IN_VIVO
      snippet: genes associated with nutrient acquisition, hormone synthesis, siderophore production,
        and volatile organic compound (VOC) synthesis were enriched, suggesting stimulated beneficial
        microbial activities
      explanation: Supports functional gene enrichment and its proposed beneficial interpretation, not
        demonstrated mutualism or metabolite transfer.
  - node: Sugarcane hormone and nutrient-transporter response
    rationale: Retain positive sugarcane molecular responses, not measured stress tolerance or reciprocal
      benefit. Name the study plant only, using an explicit parent-only Saccharum anchor rather than an
      unsupported species or genus-wide generalization.
    field_path: ecological_interactions[2]
    participants:
      participating_taxa:
      - preferred_term: sugarcane (Saccharum; species unresolved)
        term:
          id: NCBITaxon:4546
          label: Saccharum
    source_locator: doi:10.1016/j.rhisph.2025.101142; Abstract
    evidence:
    - reference: doi:10.1016/j.rhisph.2025.101142
      supports: SUPPORT
      evidence_source: IN_VIVO
      snippet: Sugarcane plants also exhibited dynamic responses, including the up-regulation of hormone-related
        genes (auxin, cytokinin, salicylic acid) and nutrient transporter genes
      explanation: Supports the sugarcane hormone and nutrient-transporter gene response after MetG2 inoculation.
    - reference: doi:10.1016/j.rhisph.2025.101142
      supports: SUPPORT
      evidence_source: IN_VIVO
      snippet: Stress resistance genes such as trehalose 6-phosphate phosphatase, phenylalanine ammonia-lyase,
        expansin, and antioxidant-related genes were also induced.
      explanation: Supports host stress-response transcription, not a direct stress-challenge performance
        measurement.
