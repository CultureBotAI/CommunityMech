  review_file: reports/causal_graph_review/decisions/20261006-lbnl-batch61.yaml
  scope: Whole record and every original node/arrow.
  summary: Preserve modeled gut coexistence feedback and remove unsupported acetate and inference-workflow claims.
  renamed_nodes:
    Pairwise Interaction-Dominated Community Dynamics: Pairwise Model Prediction Of Community Dynamics
    Positive-Negative Ecological Network Topology: Inferred Positive-Negative Ecological Network Topology
    Robust Coexistence Feedback: Modeled Pairwise Coexistence Feedback
  node_decisions:
  - node: Pairwise Model Prediction Of Community Dynamics
    rationale: Retain predictive pairwise-model result with measured-context and higher-order limits.
  - node: Inferred Positive-Negative Ecological Network Topology
    rationale: Retain effective signed topology without mechanistically unsupported ecological types.
  - node: Modeled Pairwise Coexistence Feedback
    rationale: Retain model-supported negative feedback and experimental coexistence context without universal stability
      claims.
  removed_node_decisions: []
  edges_before:
  - source: Pairwise Interaction-Dominated Community Dynamics
    target: Positive-Negative Ecological Network Topology
    description: Pairwise inference resolved both negative and positive interactions that together define the ecological
      network topology of the synthetic gut community.
  - source: Positive-Negative Ecological Network Topology
    target: Robust Coexistence Feedback
    description: The mixed positive and negative topology enables feedback that balances differences in monospecies
      fitness and supports robust coexistence.
  edges_after:
  - source: Inferred Positive-Negative Ecological Network Topology
    target: Modeled Pairwise Coexistence Feedback
    description: PARTIAL - in the fitted pairwise gLV models, coupled positive and negative effects create negative
      feedback that limits the higher-fitness partner and permits coexistence with the lower-fitness partner across
      a broader tested growth-rate range than mutual inhibition. This preserves the source-supported model mechanism,
      not proof of a universal or molecularly resolved feedback in the entire gut community.
  retained_edge_decisions:
  - source: Inferred Positive-Negative Ecological Network Topology
    target: Modeled Pairwise Coexistence Feedback
    rationale: Preserve negative-feedback coexistence as a source-supported mechanism within fitted pairwise gLV
      models.
  removed_edge_decisions:
  - source: Pairwise Interaction-Dominated Community Dynamics
    target: Positive-Negative Ecological Network Topology
    rationale: Inference produces an analytical network representation; this is a workflow transition, not biological
      causal mediation.
