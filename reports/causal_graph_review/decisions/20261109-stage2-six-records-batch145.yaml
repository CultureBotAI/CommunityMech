  references:
  - PMID:42117636
  scope: Axenic Rhodopseudomonas palustris CGA676 (NifA*, derived from CGA0092; NCBITaxon:1076, AMBIGUOUS
    GTDB candidates) anaerobic photoheterotrophic monoculture baseline evolved for 650 generations in
    minimal medium with 20 mM sodium acetate under N2 headspace at 30 °C (PMID:42117636 / PMC13274399).
  node_decisions:
  - node: High Siderophore Expression, Cheater Selection, and H2 Oxidation in Evolved R. palustris CGA676
      Monoculture
    decision: amended
    rationale: PMID:42117636 Figures 2A/C, 3D, 5A-C, and 7C-D characterize anaerobic photoheterotrophic
      R. palustris CGA676 monoculture evolution across 20 replicate lines (167 mutations across 19 commonly
      mutated targets vs 43 mutations across 5 targets in coculture), demonstrating 5-fold higher RPA2390
      siderophore expression and 2-fold higher purH expression in monoculture than coculture, frequent
      RPA2382-2390 siderophore cheater mutations, and 5-bp hoxJ deletions in 7 replicate monocultures
      that relieve HoxA repression to enable H2 oxidation; enriched node evidence from 5 to 7 non-overlapping
      verbatim snippets without adding unsupported downstream edges.
  edges_before: []
  edges_after: []
  source_backed_gaps:
  - PMID:42117636 shows that 5-bp hoxJ deletions enabling H2 oxidation swept in seven replicate R. palustris
    CGA676 monocultures but not in cocultures despite active H2 oxidation by reconstructed ΔhoxJ mutants
    in both regimes, leaving open whether unexhausted organic acids or trace nickel competition with E.
    coli prevented coculture sweep (documented in KNOWLEDGE_GAP discussion cga676_monoculture_vs_coculture_hoxj_selection_asymmetry).
  - Bidirectional NH4+/adenine and organic-acid cross-feeding interactions with E. coli occur only in
    coculture (CommunityMech:000370 and CommunityMech:000541), so no inter-taxon downstream causal edge
    belongs on this axenic monoculture baseline.
