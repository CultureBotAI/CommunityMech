- id: CommunityMech:000541
  path: kb/communities/Rhodopseudomonas_CGA676_Ecoli_PFM2_DeltaPurH_Adenine_Competition_Coculture.yaml
  review_file: reports/causal_graph_review/decisions/20261109-stage2-six-records-batch145.yaml
  status: reviewed
  original_sha256: f9225d426a29b1ed835f59723f18ab950e21c6ba210605c344319b361f303895
  record_sha256: 19eb2a05854e12882277cdc6646edf9f9c5fc91f4392cc080fc2b09bcb9b0382
  references:
  - PMID:42117636
  scope: Defined three-strain anaerobic mutual-invasion competition coculture pairing nitrogen-fixing,
    adenine-excreting Rhodopseudomonas palustris CGA676 (NifA*, ~10^6 CFU/mL) with mixtures of prototrophic
    Escherichia coli PFM2 WT and engineered adenine-auxotrophic E. coli PFM2 ΔpurH across initial frequencies
    0.01-0.99 (~10^6 total E. coli CFU/mL) in anaerobic MDC medium with 25 mM glucose under N2 for 5 days
    (PMID:42117636 / PMC13274399).
  node_decisions:
  - node: Ammonium and Adenine Cross-Feeding from R. palustris CGA676 to Prototrophic E. coli PFM2 and
      Auxotrophic PFM2 ΔpurH
    decision: amended
    rationale: PMID:42117636 establishes that R. palustris CGA676 fixes N2 into excreted NH4+ and externalizes
      sufficient adenine to support an obligate E. coli ΔpurH adenine auxotroph alongside prototrophic
      E. coli PFM2 while both E. coli strains ferment glucose into organic acids; enriched Node 1 from
      2 to 4 non-overlapping verbatim snippets including the mutual-invasion inoculation design and RT-qPCR
      quantification showing coculture adenine represses E. coli PFM2 purH transcript to 20% of monoculture
      levels.
  - node: Repression of Prototrophic E. coli purH Expression Eliminating Fitness Advantage of PFM2 ΔpurH
      in Mutual-Invasion Competition
    decision: amended
    rationale: PMID:42117636 Figure 3C, Figure 4, and Figure S1A-C demonstrate that because R. palustris-excreted
      adenine represses purH transcription 5-fold in prototrophic E. coli PFM2 (saving de novo purine
      expression cost without gene loss) and PFM2 carries a repaired rph+ allele that avoids adenine toxicity,
      the engineered PFM2 ΔpurH auxotroph neither grows faster than WT with adenine nor increases in frequency
      across 0.01-0.99 initial ratios over 5 days; enriched Node 2 from 3 to 5 non-overlapping verbatim
      snippets.
  edges_before:
  - source: Ammonium and Adenine Cross-Feeding from R. palustris CGA676 to Prototrophic E. coli PFM2 and
      Auxotrophic PFM2 ΔpurH
    target: Repression of Prototrophic E. coli purH Expression Eliminating Fitness Advantage of PFM2 ΔpurH
      in Mutual-Invasion Competition
    description: Extracellular adenine externalized by R. palustris CGA676 represses purH transcription
      in prototrophic E. coli PFM2 to 20% of monoculture levels, removing the biosynthetic expression
      cost advantage of PFM2 ΔpurH during competition.
  edges_after:
  - source: Ammonium and Adenine Cross-Feeding from R. palustris CGA676 to Prototrophic E. coli PFM2 and
      Auxotrophic PFM2 ΔpurH
    target: Repression of Prototrophic E. coli purH Expression Eliminating Fitness Advantage of PFM2 ΔpurH
      in Mutual-Invasion Competition
    description: Extracellular adenine externalized by R. palustris CGA676 represses purH transcription
      in prototrophic E. coli PFM2 to 20% of monoculture levels, removing the biosynthetic expression
      cost advantage of PFM2 ΔpurH during competition.
  retained_edge_decisions:
  - edge: Ammonium and Adenine Cross-Feeding from R. palustris CGA676 to Prototrophic E. coli PFM2 and
      Auxotrophic PFM2 ΔpurH -> Repression of Prototrophic E. coli purH Expression Eliminating Fitness
      Advantage of PFM2 ΔpurH in Mutual-Invasion Competition
    action: keep_edge
    support_status: DIRECTLY_SUPPORTED
    reason: PMID:42117636 Figure 3C and Figure S1C directly demonstrate that adenine cross-fed from R.
      palustris CGA676 represses E. coli PFM2 purH transcription to 20% of monoculture levels (12% when
      exogenous adenine is added to monoculture), eliminating the biosynthetic gene-expression cost that
      would otherwise give E. coli PFM2 ΔpurH a competitive advantage in mutual-invasion coculture.
    evidence:
    - reference: PMID:42117636
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We verified that the same is true for E. coli PFM2 by RT-qPCR quantification of purH transcript;
        coculture PFM2 purH levels were 20% of those in monoculture ( Fig. 3C ). Adding adenine to monocultures
        resulted in a purH transcript level that was 12% of that observed without adenine, suggesting
        that the low expression in coculture was due to adenine availability ( Fig. 3C ).
      explanation: Proves that adenine availability in coculture represses E. coli PFM2 purH transcript
        levels 5-fold relative to monoculture.
  source_backed_gaps:
  - PMID:42117636 evaluates the engineered E. coli PFM2 ΔpurH auxotroph in 5-day mutual-invasion competition
    assays (Figure S1C) and contrasts it against E. coli MG1655 ΔpurH (where an rph frameshift causes
    adenine toxicity that purH deletion relieves, Figure 4A-B), without performing 650-generation experimental
    evolution on the three-strain mixture (documented in EMERGING_HYPOTHESIS discussion rph_frameshift_adenine_toxicity_vs_bqh_cost_saving_in_ecoli).
