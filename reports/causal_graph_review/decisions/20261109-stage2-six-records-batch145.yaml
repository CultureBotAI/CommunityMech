criteria:
- Every reviewed record was checked against committed references_cache full-text evidence (PMID_42795638.txt
  / PMC13609637 and PMID_42117636.txt / PMC13274399).
- Single-strain axenic isolate baselines (CommunityMech:000536, CommunityMech:000537, CommunityMech:000538,
  CommunityMech:000539, CommunityMech:000540) are represented as single COMMUNITY_LEVEL nodes with 0 downstream
  edges and enriched with non-overlapping, bracket-free verbatim snippets.
- The three-strain mutual-invasion competition coculture (CommunityMech:000541) is represented as a 2-node,
  1-edge causal graph (COMMUNITY_LEVEL CROSS_FEEDING -> COMMUNITY_LEVEL COMPETITION) with direct RT-qPCR
  and competition-assay support in PMID:42117636.
- Source-backed experimental and evidence boundaries are preserved in record-level discussions and source_backed_gaps
  without inventing unsupported intermediate nodes or edges.
