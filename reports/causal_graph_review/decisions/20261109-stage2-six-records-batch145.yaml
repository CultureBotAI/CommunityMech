    rationale: PMID:42117636 Figures 2A/D, 3A-C, 5D, and S1A-B characterize anaerobic E. coli PFM2 monoculture
      evolution across 20 replicate lines (31 total mutations across 6 commonly mutated targets vs 132
      mutations across 19 targets in coculture), demonstrating 5-fold higher purH expression in monoculture
