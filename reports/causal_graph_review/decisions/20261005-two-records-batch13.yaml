    source_findings:
    - UTEX 2341 and E. coli ATCC 25922, five-day separate-substrate airlift assays.
    - Bulk organic-carbon consumption is not donor-recipient transfer; remove directed CROSS_FEEDING assertion.
    - Reciprocal algal biomass and bacterial viable-CFU benefits support partial mutualism interpretation, not neutral
      bacterium.
    - Lipid/starch are bulk combined-culture assays; bacterial contribution is small but nonzero.
    - Axenic algal controls used kanamycin. Matched controls show starch suppression at 10 g/L glucose; starch differences
      are not wholly bacterial causation.
    - Existing arrows require qualification; gas, hormone and carbon-transfer mediators were not isolated.
    - Cache has primary body appended but abstract_only metadata.
