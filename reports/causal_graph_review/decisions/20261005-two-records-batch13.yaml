    metadata is not certified.
  summary: Bound Ecoli-Chlorella mutualism, bulk carbon use and antibiotic-confounded product assays
  node_decisions:
  - node: Bacterial Enhancement of Algal Biomass
    rationale: Keep concentration-dependent algal benefit and partial mutualism supported by bacterial viability,
      not neutral bacteria or uniform biomass benefit.
  - node: Enhanced Mixotrophic Carbon Substrate Consumption
    rationale: Untype bulk carbon disappearance and remove unsupported donor-recipient direction; qualify the existing
      product arrow.
  - node: Increased Biofuel-Precursor Productivity
    rationale: Untype the product endpoint and distinguish combined biomass, antibiotic suppression and persistent
      growth/lipid benefits.
  edges_before:
  - source: Bacterial Enhancement of Algal Biomass
    target: Increased Biofuel-Precursor Productivity
    description: Faster algal growth and higher Chlorella biomass provide the cell material that underlies higher
      lipid and starch productivity in coculture.
  - source: Enhanced Mixotrophic Carbon Substrate Consumption
    target: Increased Biofuel-Precursor Productivity
    description: Enhanced mixotrophic carbon use increases carbon flow through the coculture and feeds the lipid
      and starch productivity endpoint.
  edges_after:
  - source: Bacterial Enhancement of Algal Biomass
    target: Increased Biofuel-Precursor Productivity
    description: PARTIAL - greater algal biomass can increase volumetric lipid and starch yield. The bulk product
      assays include both partners, and kanamycin suppressed starch in axenic glucose controls; biomass enhancement
      does not establish that every product-content difference is bacteria-mediated.
  - source: Enhanced Mixotrophic Carbon Substrate Consumption
    target: Increased Biofuel-Precursor Productivity
    description: HYPOTHESIZED - additional consumed substrate could supply carbon for increased lipid and starch
      production. Bulk uptake and product measurements do not trace carbon into either partner or separate this
      contribution from altered biomass and antibiotic-sensitive starch accumulation.
  references:
  - PMID:24805253
