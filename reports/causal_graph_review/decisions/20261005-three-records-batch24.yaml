    flux and causal mediation.; Preserve distinct parent-strain and K1 intervention outcomes without assigning parent
    results to the engineered derivative.
  renamed_nodes:
    Riboflavin-Mediated Redox Coupling: Riboflavin-Supplemented Coculture Response
    Reprogrammed Corynebacterium Reductive TCA Flux: Corynebacterium Coculture Transcript Response
  node_decisions:
  - node: Riboflavin-Supplemented Coculture Response
    rationale: Retain the measured external-additive response at coculture scope without asserting directed exchange
      or syntrophy.
  - node: Corynebacterium Coculture Transcript Response
    rationale: Represent Corynebacterium transcript response with its canonical source only and qualify inferred
      flux and causal mediation.
  - node: Enhanced Succinic Acid Production
    rationale: Preserve distinct parent-strain and K1 intervention outcomes without assigning parent results to
      the engineered derivative.
  edges_before:
  - source: Riboflavin-Mediated Redox Coupling
    target: Reprogrammed Corynebacterium Reductive TCA Flux
    description: Coculture redox coupling leads into the transcriptome-level reinforcement of the C. glutamicum
      electron transport system and reductive TCA flux.
  - source: Reprogrammed Corynebacterium Reductive TCA Flux
    target: Enhanced Succinic Acid Production
    description: Redistribution toward the reductive TCA pathway and suppression of succinic-acid-consuming pathways
      provide the immediate metabolic basis for higher succinic acid yield.
  edges_after:
  - source: Riboflavin-Supplemented Coculture Response
    target: Corynebacterium Coculture Transcript Response
    description: HYPOTHESIZED - altered coculture redox conditions could contribute to the Corynebacterium transcript
      response. Additive screening and the transcriptomic interpretation support this candidate link, but the accessible
      abstract does not selectively establish riboflavin-dependent electron transfer as its cause.
  - source: Corynebacterium Coculture Transcript Response
    target: Enhanced Succinic Acid Production
    description: PARTIAL - the transcript-based interpretation is consistent with metabolic changes contributing
      to increased succinic acid yield. Positive coculture, riboflavin and ldhA-deletion outcomes support the production
      strategy, but do not selectively establish this transcript response or inferred flux redistribution as the
      mediator of each yield comparison.
