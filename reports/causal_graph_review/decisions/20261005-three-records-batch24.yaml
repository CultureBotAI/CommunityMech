    and from reciprocal microbial competition.
  renamed_nodes:
    SynCom activation of intestinal immune responses: SynCom-associated intestinal immune responses
    SynCom reinforcement of epithelial barrier defenses: SynCom-associated intestinal barrier markers
  node_decisions:
  - node: SynCom-associated intestinal immune responses
    rationale: Retain measured enzyme/transcript responses while distinguishing pathway annotation from direct IgA
      measurement or microbial fitness.
  - node: SynCom-associated intestinal barrier markers
    rationale: Retain transcript/pathway and DAO observations without promoting them to protein, permeability or
      selective mediation evidence.
  - node: SynCom-mediated suppression of Aeromonas hydrophila
    rationale: Preserve SynCom survival and calibrated qPCR endpoints, separate from FMT and from reciprocal microbial
      competition.
  edges_before:
  - source: SynCom activation of intestinal immune responses
    target: SynCom-mediated suppression of Aeromonas hydrophila
    description: Immune activation by the simplified gut SynCom is a reported mechanism for the subsequent increase
      in resistance to A. hydrophila challenge.
  - source: SynCom reinforcement of epithelial barrier defenses
    target: SynCom-mediated suppression of Aeromonas hydrophila
    description: Gut-barrier reinforcement cooperates with immune activation to improve host resistance and reduce
      A. hydrophila abundance after challenge.
  edges_after:
  - source: SynCom-associated intestinal immune responses
    target: SynCom-mediated suppression of Aeromonas hydrophila
    description: PARTIAL - prechallenge immune-associated responses could contribute to the improved survival and
      reduced pathogen DNA loads after SynCom feeding. The treatment comparison supports protection, but no selective
      immune blockade or rescue establishes these responses as necessary or sufficient mediators.
  - source: SynCom-associated intestinal barrier markers
    target: SynCom-mediated suppression of Aeromonas hydrophila
    description: PARTIAL - altered barrier-associated transcripts could contribute to lower intestinal and kidney
      pathogen DNA loads and improved survival after challenge. The SynCom treatment effect is measured, but marker
      changes and ambiguous DAO activity do not isolate epithelial barrier function as the necessary mediator.
