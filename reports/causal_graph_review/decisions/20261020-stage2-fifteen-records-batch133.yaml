        term:
          id: NCBITaxon:222
          label: Achromobacter
      target_taxon:
        preferred_term: Stenotrophomonas sp. ZM-3
        term:
          id: NCBITaxon:40323
          label: Stenotrophomonas
    evidence:
    - reference: PMID:42795638
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: High-throughput 16S rRNA gene sequencing revealed directional succession
        of the soil bacterial community, enrichment of core degrading taxa, and predicted
        enrichment of xenobiotic biodegradation pathways during remediation.
    - reference: PMID:42795638
      supports: SUPPORT
      evidence_source: IN_VIVO
