    evidence:
    - reference: PMID:42795638
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The 1:1:1 synthetic consortium removed 96.8% of prometryn in 15 h,
        showing markedly superior degradation efficiency compared with single strains,
        and its 12-h degradation rate reached 96.87% with a half-life of 2.2 h following
        response surface optimization.
