      snippet: Here, we compared mutations that were differentially enriched in bacterial
        monocultures versus cocultures pairing phototrophic Rhodopseudomonas palustris
        with fermentative Escherichia coli in an obligate cross-feeding relationship
        based on the exchange of nitrogen and carbon for 650-800 generations.
