  id: CommunityMech:000154
  original_sha256: 774000556eeff1dbbdb5e1890c5de7d6ee0f0f9e56e40973f2e40b5c61d06960
  record_sha256: 9df19ae1add5269721799ee3a8328edf0531e314c15e3a3abc71a2e4e659fa40
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261006-kz-kmc-komagataella-batch60.yaml
  scope: Whole record and every original node/arrow, including empty-graph assessment.
  summary: Qualify KMC pellicle cooperation and remove the unsupported recruitment-to-mutualism arrow.
  renamed_nodes:
    Yeast-Acetobacter Mutualistic Fermentation: Proposed Yeast-Acetobacter Metabolic Cooperation
    Growth-Condition Dependent Accessory Recruitment: Growth-Condition Dependent Community Composition
  node_decisions:
  - node: Proposed Yeast-Acetobacter Metabolic Cooperation
    rationale: Retain the authors' cooperation model as hypothetical, not measured reciprocal benefit.
  - node: Cellulose Pellicle Community Structuring
    rationale: Retain observed pellicle structuring and the explicitly hypothetical spatial-facilitation arrow.
  - node: Growth-Condition Dependent Community Composition
    rationale: Retain condition-associated composition and accessory persistence without niche-partitioning or mutualism
      inference.
  removed_node_decisions: []
  edges_before:
  - source: Cellulose Pellicle Community Structuring
    target: Yeast-Acetobacter Mutualistic Fermentation
    description: The cellulose pellicle encloses the mixed yeast-acetobacter culture at the liquid surface, facilitating
      the close biochemical interplay that maintains kombucha fermentation.
  - source: Growth-Condition Dependent Accessory Recruitment
    target: Yeast-Acetobacter Mutualistic Fermentation
    description: Growth-condition shifts can recruit accessory bacteria such as lactobacilli that may contribute
      to the broader KMC fermentative capacity.
  edges_after:
  - source: Cellulose Pellicle Community Structuring
    target: Proposed Yeast-Acetobacter Metabolic Cooperation
    description: HYPOTHESIZED - pellicle enclosure could facilitate bacteria-yeast biochemical cooperation through
      spatial association, as explicitly proposed in the source Introduction. Microscopy supports association, not
      a selective test that pellicle formation mediates reciprocal benefit.
  retained_edge_decisions:
  - source: Cellulose Pellicle Community Structuring
    target: Proposed Yeast-Acetobacter Metabolic Cooperation
    rationale: The source explicitly states spatial facilitation; retain the existing arrow as HYPOTHESIZED, not
      experimentally isolated mediation.
  removed_edge_decisions:
  - source: Growth-Condition Dependent Accessory Recruitment
    target: Yeast-Acetobacter Mutualistic Fermentation
    rationale: Possible accessory fermentation capacity does not establish reciprocal benefit among the canonical
      core genera; preserve the hypothesis in prose, not this causal endpoint.
