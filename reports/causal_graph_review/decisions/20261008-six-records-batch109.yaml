limitations:
- Fresh both-root baseline precedes source reads:460 records,923 caches,56 existing warnings,zero structural defects.
  Whole six records and all19 original nodes/12 arrows reviewed;retain16 nodes/nine existing directions,remove three
  nodes/three arrows,rename three. No new topology or Edison spend.
- Whole independently retrieved primary Sesame,SynComY and SPC abstract/main text/methods/results/discussion/captions
  read from EuropePMC XML;Azotobacter primary abstract read independently and checked against publisher index. Exact
  DOI metadata cross-checked. Azotobacter full article and supplements were not retrieved;bounded publisher/repository
  search is not proof of absence. No access bypass or author contact.
- Public SPC supplement retrieved through EuropePMC after CDN DNS failure. CaptionsS1-S12 read and pixelsS2/S4/S5/S8
  inspected. S2/S5 confirm3610 growth/stimulation scope;S4 identifies168 inhibition;S8 long-duration yeast cultures
  used constant light,not the separate diurnal assay. Remaining images,mathematical framework and raw datasets were
  not reviewed. No separate Sesame/SynComY supplements or main-figure pixels inspected.
- Cache headers inspected and all graph quotations literal-checked against the three large caches;contextual reading
  used fresh primary text. Azotobacter cache read whole. Not a whole-cache audit. Every retained/new graph and discussion
  quotation matches fresh primary text and unchanged committed cache. Sesame/SynComY headers still say abstract_only
  despite additional text;metadata policy949/1093 is not repaired here.
- Sesame preserves comparator-specific flavor outcomes and source-proposed bacterial-fungal synergy,not exchange/niche
  partitioning/reciprocal growth. Remove two assembly nodes/arrows. No cultivation,optimization,organism identity
  or experimental design changes.
- SynComY retains positive reciprocal biofilm-associated qPCR abundance,EPS/activity,FA tolerance and pot outcomes.
  Positive forward supplementation is not direct transfer;negative reverse supplementation is not proof of no exchange.
  Correct RNA-seq-as-genome-input and unsupported COBRA version;do not invent model identifiers or genome accessions.
  Rhizosphere mediation remains explicitly unresolved.
- Azotobacter preserves abstract-supported exporter dependence and omission-context mutualism. PHB is a community
  endpoint;carbon/nitrogen-to-PHB mediation stays hypothetical. Dinitrogen is substrate,not a specified transfer
  product. Initial glutamate model and potential alginate are not promoted to omission-assay or demonstrated-production
  claims.
- SPC records retain positive partner-specific growth and conditional mutualism without universal stability. Bacillus168
  production evidence cannot inherit3610 trajectories or other-partner weeks/months persistence. Ecoli early growth
  is not sucrose-exclusive and85% background export is not a concentration. W303Clump remains distinct from parentalW303
  and no yeast bioproduct is invented. Reverse-benefit mechanism is source-proposed,not identified transfer.
- Repair issues[1849, 1850, 1851, 1852, 1853, 1854] stay open until protected-main merge;non-graph follow-up1855
  stays open. Fresh all-state title/body dedup matched757,714,605,310;all read plus related529. Ignored/hidden local
  index inspected,not every matching report read;PRs/comments not exhaustively searched. No reusable taxon match
  in ignored/hidden kb/taxa name/identifier search. Whole reviewed B12 Syn7002 neighbor read for modeling patterns,not
  used as evidence for these targets.
- Only graph/discussions/events change. Other454 records,923 caches,non-graph raw blocks and prior histories/decisions
  preserved. Canonical identities reused as preferred_term+term only;no GTDB copies into graph. General growth metadata
  and narrative claims are not recertified. No schema,validator,configuration or runtime change. Participant census
  must be measured;any census test update must reflect actual scoped changes,not a relaxed connectivity rule. Loader1703,DOI-case1091,stub1093
  and license949 remain separate. Self-review is not independent approval or corpus completion. Denied/unanswered
  Edison scopes remain untouched.
