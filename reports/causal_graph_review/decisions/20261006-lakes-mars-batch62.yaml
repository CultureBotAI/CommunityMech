      the methane-oxidizing guild partners.

      '
  - source: Oxygen-Tension Specific Partnerships
    target: Modeled Methylobacter-Methylomonas Exchange
    description: 'Lake Washington methanotroph models tested carbon, oxygen, and nitrogen limitation, making oxygen
      availability a condition that modulates predicted metabolite exchange within the methane-cycling community.

      '
  edges_after:
  - source: Oxygen-Regime Dependent Guild Composition
