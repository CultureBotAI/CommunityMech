  - node: Methanotroph-Methylotroph Guild Coupling
    rationale: Retain inferred family-level carbon coupling without identifying methanol or reciprocal benefit.
  - node: Oxygen-Regime Dependent Guild Composition
    rationale: Retain experimentally selected guild composition, not constant oxygen or exclusive partner pairs.
  - node: Modeled Methylomonas-To-Methylobacter Formaldehyde Transfer
    rationale: Correct the reported conditional model-transfer direction and distinguish imposed ratios from predictions.
  removed_node_decisions: []
