limitations:
- 'Fresh both-root baseline before source reads: 460 records, 923 caches, 56 existing warnings, zero structural
  defects. Four whole records and all19 original nodes/10 directions reviewed;18 nodes and five qualified existing
  directions retained, one workflow node and five arrows removed, eight renames. No new topology or Edison submission/spend.'
- 'Eleven primary sources independently retrieved. All nine abstract-only retrievals were read whole, including
  the six Staphylococcus-Candida studies, 2018 mire catalog, 2026 pesticide study and aquifer study. Available full-text
  leads were not fetched for Staphylococcus-Candida: fresh PMCID leads exist for three and the pre-existing copper
  cache lists PMC13306210 despite missing fresh PMCID metadata. This is an abstract-bounded metadata correction,
  not an assertion of full-text absence.'
- Fresh EuropePMC full-body XML retrieved for mire2023 and pesticide2013. Mire abstract1-33, results/discussion238-477
  and methods528-676 read; pesticide2013 results182-246 read. Other spans were indexed or not read, not whole-paper
  review. No figure-pixel, supplement, raw-data or full-pipeline certification. Mire CC BY4.0 and pesticide2013
  CC BY3.0 metadata retained.
- Existing six Staphylococcus-Candida caches, pesticide2026, both aquifer caches and both lindane abstract caches
  read whole. Large mire2023, mire2018 and pesticide2013 caches used for bounded context and normalized claim matching,
  not exhaustive duplicated full-text review. Wiley aquifer and Elsevier pesticide2026 web requests returned Internal
  Error with no HTTP code reported; no bypass or global full-text-absence assertion. No cache imports, license949/loader1703/DOI-case1091
  certification.
- 'Staphylococcus-Candida: retain six separate-study observations; remove cross-study arrows and categorical reciprocal
  competition/universal mutualism. Preserve the copper authors mutualism interpretation as HYPOTHESIZED/PARTIAL
  and source-supported scaffold facilitation. Transcript/ontology associations are not demonstrated virulence, genotype
  change or colonization. No new growth, biofilm, survival, resistance, virulence or colonization enhancement procedures,
  genetic designs, strain-selection advice or partner mechanisms.'
- 'Mire: preserve encoded potential, transcripts and metabolite observations with canonical identity-only archaeal/bacterial
  scope and computational provenance. Remove unestablished syntrophic product-removal feedback and traced cross-feeding.
  Acetate supports an acetoclastic route, not the removed methylotrophic target; no replacement mechanism/node added.
  Preserve source-proposed fen niche partitioning and its existing direction as HYPOTHESIZED/PARTIAL; no measured
  substrate flux or competition reduction. Remove redundant habitat arrows and unrelated catalog support for specific
  syntrophy.'
- 'Pesticide: retain the exact four-member non-antagonism, aggregate growth, gene detection, removal and phytotoxicity
  results. Remove reciprocal-mutualism typing and qualify both existing directions; gene presence is not expression/flux,
  removal is not mineralization or an isolated toxicity mediator. Do not transfer six-member immobilized-culture
  results or claim universal consortium superiority. Existing22840534/31430718 caches requested by open764 are present;
  no duplicate cache issue/import.'
- 'Aquifer: remove only the genome-resolution workflow node and preserve prior2026-10-02 analysis-edge removal.
  Retain field perturbation and relative-abundance observation without absolute loss or fitness claims. Gene-based
  CO-oxidation potential and carbon/electron-flow implications receive computational provenance and HYPOTHESIZED/PARTIAL
  causal descriptions. No invented methods or measured flux.'
- Graph issues1829-1832 addressed here and remain open until protected-main merge; non-graph1833 remains open. Fresh
  all-state title/body dedup matches294/691/763/764. Hidden/ignored local search excludes.git/docs/site/references_cache
  with relevant caches separately covered. PRs/comments not exhaustively searched. Non-graph role, abundance, placeholder
  taxonomy, habitat-note and substrate extrapolations remain separately scoped and byte-preserved, not certified.
- Four guarded writes and append-only histories;456 other records and all923 caches unchanged. Every unrelated raw
  block preserved. No schema/runtime/audit rule changes. Self-adversarial review is not independent approval or
  corpus completion. DeniedAM_AB000444 and unanswered Edison scopes untouched. Validation/publication not preasserted.
