  source_review:
    primary_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13066648/fullTextXML
    primary_sha256: ca96fc4005031c536003dd108a5ada7a025c1938cecc2f2f11a480c0ff867fda
    supplementary_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13066648/supplementaryFiles
    supplementary_zip_sha256: f9431aa901bc878ffacbbe6469162b8d4f2cad05fb030e2dbbc8bb62c41ba779
    supplementary_pdf_sha256: eff63583669bc008020e404023e6b657049bbc0df61e3b1c384ef39d4b70b84a
    reading: Full main text and structured Tables 1/2; all five main captions; Figure 4/5 images; all 22 supplement
      pages text-extracted, with Tables S2/S3 and Figures S4/S7 visually inspected. Precursor abstract only. Other
      supplement images and raw data not inspected.
    findings:
    - Actual full bacterial SynCom has FOUR isolates, not three members.
    - Pseudomonas 8C3D12 (PQ555449), Pseudoduganella rivuli FT92W (KACC21474), Pseudomonas 6C7F4 (PQ555450), Brevibacterium
      renqingii REN4 (KCTC49366).
    - Duganella is a network ASV genus label, not the correct exact FT92W isolate identity. Canonical taxonomy
      and all affected graph participants were repaired together before graph certification.
    - Official NCBI taxonomy page confirms Pseudoduganella rivuli at 2666085; BioSample SAMN13220418 confirms FT92W,
      stream-water origin, and type strain of historical Massilia rivuli.
    - Microbiome fraction culture is in vitro, not in-plant recruitment. Only Pseudomonas among selected network
      groups detected in fraction.
    - Mannitol increased relative Pseudomonas; live/killed Chlorella decreased it. Neither is absolute abundance
      or proof of algal mannitol secretion.
    - PGP screens are isolate proxies, not colonization facilitation, direct nitrogen flux, chemical IAA identity
      or in-plant necessity.
    - Plant disease index is host symptoms, not fungal burden or direct antagonism. No formal community synergy
      demonstrated.
    - Treatment 8 is four bacteria plus pathogen, treatment 9 adds Chlorella; SynCom-only means without alga, not
      without pathogen.
    - Strawberry week-specific values are distinguished from overall means; Figure 4 was inspected before retaining
      an approximate week-5 value.
    - All six existing nodes retain measured-endpoint interpretations. Both arrows were removed as duplicate outcome
      statements, and the previously removed workflow arrows were not restored.
    - Figure 4 corroborates approximate week-5 Treat8 response; source week-7 body wording conflicts with the plot.
    - Table S2 includes a positive FT92W IAA screen; actual plate/color-screen figure is S7, not S5 as cited in
      the body.
    - Growth Methods sample three plants while Tables S3/S4 label n=10; no precision re-estimated.
