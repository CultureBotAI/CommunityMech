    target: Fermenter-Stimulated Butyrate Oxidation and Methane Production
    description: "HYPOTHESIZED \u2014 ES5 co-aggregation with S. wolfei and M. hungatei may spatially facilitate\
      \ the improved butyrate oxidation and methane production, but the aggregation is an observed correlate of\
      \ the ES5 effect and was NOT demonstrated to causally mediate the rate increases.\n"
  - &id032
    source: Proteome Response in the Syntrophic Partners
    target: Fermenter-Stimulated Butyrate Oxidation and Methane Production
    description: "HYPOTHESIZED \u2014 the ES5-associated proteomic changes (activation of additional butyryl-CoA\
