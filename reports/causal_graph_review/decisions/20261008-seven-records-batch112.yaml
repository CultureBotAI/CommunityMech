  renamed_nodes: {}
  edges_before:
  - &id026
    source: Minimum Energy Threshold for Syntrophic Growth
    target: Methanogenic Benzoate Degradation
    description: Accumulated acetate and hydrogen thermodynamically inhibit the syntrophic reaction, lowering benzoate-degradation
      rates when products build up.
  - &id028
    source: Product Inhibition of Benzoate Degradation
    target: Minimum Energy Threshold for Syntrophic Growth
    description: Hydrogen and acetate product accumulation constrain the free energy remaining to the benzoate-fermenting
      Syntrophus partner.
  edges_after:
  - &id027
    source: Minimum Energy Threshold for Syntrophic Growth
    target: Methanogenic Benzoate Degradation
    description: 'DIRECTLY IMPLIED: the fermenter must conserve sufficient energy to sustain growth-associated benzoate
      conversion. The observed endpoint correlates with residual substrate and calculated free energy; the inferred
      approximate growth threshold is not an independently manipulated universal constant.'
  - &id029
    source: Product Inhibition of Benzoate Degradation
    target: Minimum Energy Threshold for Syntrophic Growth
    description: Product accumulation changes the free energy available to the fermenter, bringing growth-associated
      benzoate conversion toward its energetic limit. Acetate also partly uncouples substrate degradation from energy
      conservation, so this does not assert that product addition changes a fixed intrinsic threshold.
