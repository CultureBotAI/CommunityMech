  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-two-records-batch25.yaml
  scope: Whole record and every original node/arrow; primary access and cache limits below.
  summary: Separate measured intrinsic iron oxidation from early-heap association and failed recovery under SX reagent.;
    Retain observed succession with correct abundance scale and species boundaries, without competition or resolved
    field flux.; Distinguish sulfur-oxidation capacity and RNA activity from stable DNA counts, constant acid flux
    and selective passivation removal.; Retain conditional mineral/redox feedback and direct laboratory outcomes
    without a closed five-member consortium claim.; Preserve laboratory Sulfobacillus oxidation/leaching and low-ORP
    advantage; bound field genus-to-species and thermal inference.
  renamed_nodes:
    Ferrous Iron Oxidation in Early Heaps: Acidithiobacillus Iron Oxidation and Early-Heap Association
    Ferrous Iron Oxidation in Aged Heaps: Aged-Heap Iron-Oxidizer Association
    Thermophilic Iron and Sulfur Oxidation: Sulfobacillus Iron and Sulfur Oxidation Capacity
  node_decisions:
  - node: Acidithiobacillus Iron Oxidation and Early-Heap Association
    rationale: Separate measured intrinsic iron oxidation from early-heap association and failed recovery under
      SX reagent.
  - node: Aged-Heap Iron-Oxidizer Association
    rationale: Retain observed succession with correct abundance scale and species boundaries, without competition
      or resolved field flux.
  - node: Sulfur Oxidation to Sulfuric Acid
    rationale: Distinguish sulfur-oxidation capacity and RNA activity from stable DNA counts, constant acid flux
      and selective passivation removal.
  - node: Copper Sulfide Dissolution
    rationale: Retain conditional mineral/redox feedback and direct laboratory outcomes without a closed five-member
      consortium claim.
  - node: Sulfobacillus Iron and Sulfur Oxidation Capacity
    rationale: Preserve laboratory Sulfobacillus oxidation/leaching and low-ORP advantage; bound field genus-to-species
      and thermal inference.
  edges_before:
  - source: Ferrous Iron Oxidation in Early Heaps
    target: Copper Sulfide Dissolution
    description: Fe³⁺ oxidizes chalcopyrite to release Cu²⁺ and regenerate Fe²⁺
  - source: Ferrous Iron Oxidation in Aged Heaps
    target: Copper Sulfide Dissolution
    description: Sustained Fe³⁺ generation maintains copper leaching in aged heaps
  - source: Sulfur Oxidation to Sulfuric Acid
    target: Copper Sulfide Dissolution
    description: Sulfuric acid production sustains the low pH needed for ferric-iron attack on chalcopyrite
  - source: Copper Sulfide Dissolution
    target: Ferrous Iron Oxidation in Early Heaps
    description: Released Fe²⁺ is re-oxidized to regenerate Fe³⁺ oxidant
  - source: Copper Sulfide Dissolution
    target: Ferrous Iron Oxidation in Aged Heaps
    description: Released Fe²⁺ also feeds the acid-tolerant iron oxidizers in aged heap strips
  - source: Copper Sulfide Dissolution
    target: Sulfur Oxidation to Sulfuric Acid
    description: Released reduced inorganic sulfur compounds feed sulfur oxidation to sulfuric acid
  - source: Copper Sulfide Dissolution
    target: Thermophilic Iron and Sulfur Oxidation
    description: Chalcopyrite-associated Fe²⁺ and sulfur substrates feed Sulfobacillus activity in hotter bioleaching
      niches
  - source: Thermophilic Iron and Sulfur Oxidation
    target: Copper Sulfide Dissolution
    description: Sulfobacillus iron and sulfur oxidation can maintain copper extraction in thermophilic chalcopyrite
      bioleaching
  edges_after:
  - source: Acidithiobacillus Iron Oxidation and Early-Heap Association
    target: Copper Sulfide Dissolution
    description: PARTIAL - A. ferrooxidans iron oxidation can replenish ferric oxidant for mineral attack. The chemical
      cycle and laboratory oxidation support this direction, but the SX assay shows that retained iron oxidation
      need not sustain copper recovery, and the field contribution is not taxon-resolved.
  - source: Aged-Heap Iron-Oxidizer Association
    target: Copper Sulfide Dissolution
    description: PARTIAL - iron oxidation by the aged-heap associated taxa could replenish ferric oxidant for dissolution.
      Field succession and separate L. ferriphilum cultures support the proposed contribution without measuring
      their individual heap fluxes or proving displacement-driven leaching.
  - source: Sulfur Oxidation to Sulfuric Acid
    target: Copper Sulfide Dissolution
    description: PARTIAL - sulfur oxidation can generate acidity and limit reduced-sulfur accumulation, helping
      sustain mineral attack under suitable conditions. A. thiooxidans-specific acid flux and passivation removal
      were not selectively established in the field survey.
  - source: Copper Sulfide Dissolution
    target: Acidithiobacillus Iron Oxidation and Early-Heap Association
    description: PARTIAL - mineral attack releases ferrous iron that can supply A. ferrooxidans oxidation, regenerating
      ferric oxidant. This is a chemically grounded substrate feedback, not a measured taxon-resolved closed loop
      in the industrial heap.
  - source: Copper Sulfide Dissolution
    target: Aged-Heap Iron-Oxidizer Association
    description: PARTIAL - released ferrous iron can supply the iron-oxidizing taxa associated with older strips.
      Their individual uptake and feedback fluxes were not traced by the field abundance and RNA assays.
  - source: Copper Sulfide Dissolution
    target: Sulfur Oxidation to Sulfuric Acid
    description: PARTIAL - mineral dissolution generates reduced inorganic sulfur substrates that can feed A. thiooxidans
      sulfur oxidation. The reaction-cycle context supports direction, not selective proof of its share of field
      acid generation or passivation control.
  - source: Copper Sulfide Dissolution
    target: Sulfobacillus Iron and Sulfur Oxidation Capacity
    description: PARTIAL - chalcopyrite-associated ferrous iron and reduced sulfur can feed Sulfobacillus oxidation
      in the tested cultures. This substrate feedback does not demonstrate exact-species transfer or activity in
      hotter industrial heap niches.
  - source: Sulfobacillus Iron and Sulfur Oxidation Capacity
    target: Copper Sulfide Dissolution
    description: PARTIAL - Sulfobacillus iron/sulfur oxidation can support leaching in the tested laboratory systems,
      subject to redox potential and SX inhibition. The lower-ORP advantage contradicts a universal more-iron-oxidation
      benefit; exact field-species and hot-zone contributions remain unresolved.
