- path: kb/communities/Coscinodiscus_Synthetic_Community.yaml
  id: CommunityMech:000020
  original_sha256: f92a79a6011428899eba0cc8e8de5bbd1410bb2e2e7e13b10593869ad1fd3b32
  record_sha256: 96bf155c9e47de5f8934bbf367f392bfcee5073098125c841db171fd0b9dda1a
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-two-records-batch25.yaml
  scope: Whole record and every original node/arrow; primary access and cache limits below.
  summary: Retain candidate diatom resource provision and actual Crocei1 promotion without universal dependence
    or measured metabolite donation.; Keep DMSP homology potential computational, distinct from consumption, product
    flux and a negative carbon-only growth assay.; Preserve distinct reciprocal growth signs and control-relative
    algal recovery rather than global mutualism.; Preserve real pooled nutrient responses and the CS4 negative control
    without individual-vitamin rescue or exact B12-form claims.; Retain empirical community inhibition and phase-specific
    model success without reciprocal harm or universal exclusion of higher-order interactions.
  renamed_nodes:
    Diatom Primary Production and Carbon Release: Candidate Diatom Resource Provision
    Bacterial DMSP Metabolism: Bacterial DMSP Catabolic Potential
    Bacterial Auxotrophy and Nutrient Dependence: Bacterial Nutrient Supplement Responses
    Community-Level Emergent Effects: Community Growth and Pairwise Model
  node_decisions:
  - node: Candidate Diatom Resource Provision
    rationale: Retain candidate diatom resource provision and actual Crocei1 promotion without universal dependence
      or measured metabolite donation.
  - node: Bacterial DMSP Catabolic Potential
    rationale: Keep DMSP homology potential computational, distinct from consumption, product flux and a negative
      carbon-only growth assay.
  - node: Growth Phase-Dependent Bacterial Effects
    rationale: Preserve distinct reciprocal growth signs and control-relative algal recovery rather than global
      mutualism.
  - node: Bacterial Nutrient Supplement Responses
    rationale: Preserve real pooled nutrient responses and the CS4 negative control without individual-vitamin rescue
      or exact B12-form claims.
  - node: Community Growth and Pairwise Model
    rationale: Retain empirical community inhibition and phase-specific model success without reciprocal harm or
      universal exclusion of higher-order interactions.
  edges_before:
  - source: Diatom Primary Production and Carbon Release
    target: Bacterial DMSP Metabolism
    description: Diatom-released DMSP and organic compounds support bacterial growth
  - source: Growth Phase-Dependent Bacterial Effects
    target: Community-Level Emergent Effects
    description: Pairwise C. radiatus-bacterium effects vary across partners and growth phases and combine into
      an all-member culture whose net effect on algal growth is inhibitory without requiring bacterial-bacterial
      synergy.
  edges_after:
  - source: Candidate Diatom Resource Provision
    target: Bacterial DMSP Catabolic Potential
    description: HYPOTHESIZED - diatom-derived DMSP could provide substrate for the genomic catabolic potential
      of CS4 and Rose1. No partner-resolved release, consumption or flux was measured, and added DMSP as the carbon-only
      supplement did not promote growth under the tested minimal-medium conditions.
  - source: Growth Phase-Dependent Bacterial Effects
    target: Community Growth and Pairwise Model
    description: PARTIAL - the measured partner- and phase-specific effects combine into the observed predominantly
      inhibitory all-member algal trajectory. A generalized Lotka-Volterra model fitted to monocultures and pairwise
      cultures reproduces that trajectory with separate early/late parameter sets; this supports the proposed contribution
      without isolating chemical mediators or proving higher-order interactions universally absent.
  retained_edge_decisions:
  - source: Candidate Diatom Resource Provision
    target: Bacterial DMSP Catabolic Potential
    rationale: HYPOTHESIZED - diatom-derived DMSP could provide substrate for the genomic catabolic potential of
      CS4 and Rose1. No partner-resolved release, consumption or flux was measured, and added DMSP as the carbon-only
      supplement did not promote growth under the tested minimal-medium conditions.
  - source: Growth Phase-Dependent Bacterial Effects
    target: Community Growth and Pairwise Model
    rationale: PARTIAL - the measured partner- and phase-specific effects combine into the observed predominantly
      inhibitory all-member algal trajectory. A generalized Lotka-Volterra model fitted to monocultures and pairwise
