  review_file: reports/causal_graph_review/decisions/20261005-ten-records-batch10.yaml
  scope: Whole record and every graph node/arrow reviewed to the explicit source-reading limits; non-graph metadata
    is preserved, not certified.
  summary: Separate California precipitation-legacy observations from proposed carbon-allocation mechanisms
  node_decisions:
  - node: Necromass Recycling at High Community Growth Efficiency
    rationale: Retain partial necromass interpretation and explicitly bounded pathway annotations.
  - node: Plant Detritus Degradation at Low Community Growth Efficiency
    rationale: Retain partial allocation hypothesis, not measured detritus or repair flux.
  - node: Precipitation-Legacy Turnover Suppression
    rationale: Retain treatment-associated turnover and two qualified mechanisms with the source metric defined.
  edges_before:
  - source: Precipitation-Legacy Turnover Suppression
    target: Necromass Recycling at High Community Growth Efficiency
    description: Reduced winter precipitation suppresses microbial mortality, limiting the high-turnover, N-rich
      necromass pool that otherwise supports high-CGE biosynthesis after rewetting.
  - source: Precipitation-Legacy Turnover Suppression
    target: Plant Detritus Degradation at Low Community Growth Efficiency
    description: The lower-growth, lower-mortality legacy shifts the community toward low-CGE plant-detritus degradation
      and lipid repair or maintenance instead of new biomass production.
  edges_after:
  - source: Precipitation-Legacy Turnover Suppression
    target: Necromass Recycling at High Community Growth Efficiency
    description: HYPOTHESIZED - lower mortality could reduce necromass supply and recycling after rewetting. This
      source interpretation is not traced transfer or experimentally isolated mediation.
  - source: Precipitation-Legacy Turnover Suppression
    target: Plant Detritus Degradation at Low Community Growth Efficiency
    description: HYPOTHESIZED - reduced turnover and associated transcription could shift resource allocation toward
      detritus use and maintenance. Shared treatment responses do not establish this pathway as the cause.
  references:
  - PMID:41964077
  source_review:
    source:
      reference: PMID:41964077
      url: https://doi.org/10.1186/s40168-026-02395-9
      full_text_url: https://europepmc.org/articles/PMC13188737
      cache: references_cache/PMID_41964077.md
      sha256: 3e02992e16bdbcf65e7ca6bb8afbd49af326525f3a8710fc4c63003a71042b0e
      scope: Complete abstract, cached full-text Introduction through Conclusions, Table 1 linearized text, main
        and supplementary captions; no figure images, supplementary files, raw data or referenced secondary articles
        inspected.
      note: Cache header incorrectly says abstract_only although an appended Europe PMC full text is present; do
        not infer absence from header.
    abstract_cache:
      path: references_cache/PMID_41964077.txt
      sha256: 4786227083311c7398a05b9beacf68ae58fb65b40543d7daf4f6ceccd4129a66
      scope: complete
    essential_scope:
    - One October 2017-May 2018 rainfall-treatment season, not multiple experimental winters. August 2018 collection;
      assays use equal wet-up moisture after dry-down.
    - Growth/mortality are interval-average qSIP estimates from bacterial/archaeal 16S copies; linear growth assumption,
      DNA-water fraction 0.60, copy-number/extraction/amplicon biases. Fungal turnover and sub-three-hour transients
      not directly measured.
    - CGE is cumulative new biomass divided by cumulative CO2, scaled to the maximum observed ratio. It is not conventional
      absolute CUE or a carbon tracer-flux balance; fungi may contribute respiration.
    - CO2 comparison p=0.4 is nonsignificant, not an equivalence test or increased measured total CO2. Reduced turnover
      does not establish observed multiyear SOC stock loss.
    - FTICR-MS formula classes are semiquantitative presence/absence estimates, not identified chemicals or absolute
      pool sizes. Distinguish treatment-unique formula composition from all SOC.
    - PLSR-selected and correlated gene transcripts do not demonstrate expression-driven mediation, enzyme activity
      or metabolite flux. Full text explicitly separates community composition and physiological legacy.
  non_graph_followups:
    outside_scope_followups:
    - Preserved description/environmental wording about multiple winters, taxonomy breadth and cultivation working_volume=15
      mL (vessel capacity rather than soil-slurry volume) need whole-record review.
    - Existing cultivation comments cite issues 622 and 646; inspect them before any follow-up to avoid reverting
      earlier fixes.
