  summary: Bound Candida succession and transcript associations without workflow or fitness inference
  node_decisions:
  - node: Repeated Candida-Enterococcus Co-Detection
    rationale: Retain cohort co-detection without species-specific or facilitation overreach.
  - node: Relative Candida-Enterococcus Succession
    rationale: Retain relative succession without reciprocal-negative effects or eradication.
  - node: Candida-Positive Enterococcus Mannitol-PTS Response
    rationale: Retain the explicit source-proposed cross-feeding hypothesis with partial evidence.
  - node: In Situ Candida Biofilm- and Respiration-Associated Transcripts
    rationale: Retain transcript differences, not directly measured phenotypes or partitioning.
  edges_before: []
  edges_after: []
  references:
  - PMID:34154658
  source_review:
    source:
      reference: PMID:34154658
      url: https://doi.org/10.1186/s40168-021-01085-y
      full_text_url: https://europepmc.org/articles/PMC8215838
      cache: references_cache/PMID_34154658.md
      sha256: 22ec8ae3b96152bbe0df909fbeaf1ac4f17db66e00d031f98e9cd3d9182f5683
      scope: Complete abstract and appended full-text Background, Results, Discussion, Conclusions and Methods,
        with linearized Table 1 and figure captions. Images, supplementary files, raw data and referenced secondary
        studies not inspected.
      note: Cache header says abstract_only despite appended full text; no cache edit made.
    critical_limits:
    - In situ Candida omics are one strain in one infant, with hospital antifungal treatment and host changes; comparison
      samples are different infants and include variable strains/conditions.
    - Source specifically allows E. faecalis transcript differences to reflect between-infant variance; S. epidermidis
      separation is clearer. Do not generalize the latter strength to Enterococcus.
    - Ribosomal transcripts are not direct growth-rate measurements; discussion includes ribosomal heterogeneity/homeostasis
      and nontranslation alternatives.
    - Mannitol-1-phosphate dehydrogenase reaction is phosphorylated mannitol to phosphorylated fructose; avoid repeating
      free-mannitol-to-free-fructose shorthand as precise biochemistry.
    - Biofilm comparison uses orthologs of characterized C. albicans genes; distinguish C. parapsilosis expression
      associations from demonstrated virulence changes or cross-species mechanisms.
    preserve:
    - Current canonical Lodderomyces parapsilosis NCBITaxon:5480, notwithstanding the old history text that had
      normalized labels in the other direction.
    - All non-graph blocks; existing taxonomy roster has only two members despite other infant-06 organisms in prose,
      so consider whole-record follow-up rather than scope expansion.
  non_graph_followups: {}
