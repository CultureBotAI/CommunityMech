  summary: Retain exact-system supported C2 supply and downstream chain-elongated acid conversion; distinguish growth
    from ongoing activity.; Bound batch emergence and retain monoculture alcohol capacity; correct the existing
    hexanoate chemical identity using official ChEBI.; Describe measured engineered staging with covarying pH/CO/flow/residence
    time; retain causal substrate supply without ecological niche typing.
  renamed_nodes:
