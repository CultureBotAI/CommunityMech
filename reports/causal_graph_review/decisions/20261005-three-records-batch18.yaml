      formation
  node_decisions:
  - node: Acetogen-Chain Elongator Product Coupling
    rationale: Retain exact-system supported C2 supply and downstream chain-elongated acid conversion; distinguish
      growth from ongoing activity.
  - node: Organic Acid Reduction to Longer-Chain Alcohols
    rationale: Bound batch emergence and retain monoculture alcohol capacity; correct the existing hexanoate chemical
      identity using official ChEBI.
  - node: Engineered CO and pH staging of chain elongation and alcohol formation
    rationale: Describe measured engineered staging with covarying pH/CO/flow/residence time; retain causal substrate
      supply without ecological niche typing.
  edges_before:
  - source: Acetogen-Chain Elongator Product Coupling
    target: Organic Acid Reduction to Longer-Chain Alcohols
    description: 'C. carboxidivorans C2-product fermentation feeds C. kluyveri chain elongation, whose organic acid
      products are then reduced back by C. carboxidivorans to longer-chain alcohols.

      '
  - source: Two-Stage CO Partial Pressure Division of Labor
    target: Organic Acid Reduction to Longer-Chain Alcohols
    description: 'Partitioning the cascade into lower-CO chain elongation and higher-CO acid-reduction stages favors
      the C. carboxidivorans reduction of chain-elongated acids into C2-C6 alcohols.

      '
  edges_after:
  - source: Acetogen-Chain Elongator Product Coupling
    target: Organic Acid Reduction to Longer-Chain Alcohols
    description: 'C. carboxidivorans C2-product fermentation feeds C. kluyveri chain elongation, whose organic acid
      products are then reduced back by C. carboxidivorans to longer-chain alcohols.

      '
  - source: Engineered CO and pH staging of chain elongation and alcohol formation
    target: Organic Acid Reduction to Longer-Chain Alcohols
    description: The first stage supplies chain-elongated organic acids to the second, whose combined pH-5.0/high-CO
      conditions support C. carboxidivorans reduction to alcohols. Product balances also indicate de novo alcohol
      synthesis, so downstream alcohol output is not all explained by reduction of incoming acids; the design does
      not isolate the contribution of CO from the other changed operating conditions.
