- path: kb/communities/Dehalococcoides_Desulfovibrio_Pelosinus_Corrinoid_Triculture.yaml
  id: CommunityMech:000200
  original_sha256: 9e9caf7e8dfeeca85868d3bc7509eacd27686582f0090bfbd88af2675248d8bf
  record_sha256: 2d771dc7df594f59d55d100bdf4e7ed6bbc571dfea0a4e37a774583e831910dc
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261006-three-records-batch30.yaml
  scope: Whole record and all original nodes/arrows reviewed at the documented primary-source access scope. Non-graph
    fields preserved, not certified.
  summary: Retain syntrophic hydrogen support with the required cofactor context.; Retain corrinoid cross-feeding
    without assigning DMB production or an exclusive cofactor route.; Assign salvaging/remodeling to Dhc195 and
    classify measured transcript evidence correctly.; Make the complete canonical triculture and DMB-dependent outcome
    explicit.
  renamed_nodes: {}
  node_decisions:
  - node: Hydrogen Provision By Desulfovibrio
    rationale: Retain syntrophic hydrogen support with the required cofactor context.
  - node: Corrinoid Provision By Pelosinus
    rationale: Retain corrinoid cross-feeding without assigning DMB production or an exclusive cofactor route.
  - node: Dhc195 Corrinoid Salvaging And Remodeling
    rationale: Assign salvaging/remodeling to Dhc195 and classify measured transcript evidence correctly.
  - node: Hydrogen- and Corrinoid-Supported TCE Dechlorination
    rationale: Make the complete canonical triculture and DMB-dependent outcome explicit.
  removed_node_decisions: []
  edges_before:
  - source: Hydrogen Provision By Desulfovibrio
    target: Hydrogen- and Corrinoid-Supported TCE Dechlorination
    description: 'DvH-supplied hydrogen provides the electron donor input that Dhc195 needs, together with PfR7-derived
      corrinoids, for sustainable reductive dechlorination in the defined triculture.

      '
  - source: Corrinoid Provision By Pelosinus
    target: Dhc195 Corrinoid Salvaging And Remodeling
    description: 'PfR7 corrinoid production supplies the phenolic corrinoids that Dhc195 imports and remodels into
      cobalamin when DMB is present.

      '
  - source: Dhc195 Corrinoid Salvaging And Remodeling
    target: Hydrogen- and Corrinoid-Supported TCE Dechlorination
    description: 'Dhc195 corrinoid salvaging and remodeling turns PfR7-produced corrinoids into cobalamin cofactors
      that support sustainable TCE dechlorination when DvH also supplies hydrogen.

      '
  edges_after:
  - source: Hydrogen Provision By Desulfovibrio
    target: Hydrogen- and Corrinoid-Supported TCE Dechlorination
    description: DvH-supplied hydrogen supports the electron-donor requirement of Dhc195 in the lactate-fed triculture,
      together with partner corrinoids and externally supplied DMB. Hydrogen provision alone does not make the cobalamin-free
      two-member coculture sustainable.
  - source: Corrinoid Provision By Pelosinus
    target: Dhc195 Corrinoid Salvaging And Remodeling
    description: PfR7 supplies corrinoid substrates that Dhc195 can salvage and remodel in the presence of externally
      supplied DMB. This does not exclude donor guided cobalamin biosynthesis or establish that all functional cofactor
      passes through recipient remodeling.
  - source: Dhc195 Corrinoid Salvaging And Remodeling
    target: Hydrogen- and Corrinoid-Supported TCE Dechlorination
    description: Recipient salvaging and remodeling contributes compatible cofactor for sustainable TCE dechlorination
      in the DMB-amended triculture when DvH supplies hydrogen. The source supports this route but does not selectively
      separate its contribution from cobalamin formed by the donor in the presence of DMB.
  retained_edge_decisions:
  - source: Hydrogen Provision By Desulfovibrio
    target: Hydrogen- and Corrinoid-Supported TCE Dechlorination
    rationale: DvH-supplied hydrogen supports the electron-donor requirement of Dhc195 in the lactate-fed triculture,
      together with partner corrinoids and externally supplied DMB. Hydrogen provision alone does not make the cobalamin-free
      two-member coculture sustainable.
  - source: Corrinoid Provision By Pelosinus
