  record_sha256: fbf9a3612c04d172cd46cc210b069e03e627b5dcec722682651abfe6e0e6afb7
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261006-three-records-batch30.yaml
  scope: Whole record and all original nodes/arrows reviewed at the documented primary-source access scope. Non-graph
    fields preserved, not certified.
  summary: Retain conditional DMB-associated cofactor support without assigning an exclusive route.; Retain the
    negative compatibility result without commensalism or toxicity.; Represent BAV1 dechlorination as a recipient
    phenotype without reverse cross-feeding.
  renamed_nodes: {}
  node_decisions:
  - node: DMB-Guided Cobalamin Support
    rationale: Retain conditional DMB-associated cofactor support without assigning an exclusive route.
  - node: Factor III Is Insufficient Without DMB
    rationale: Retain the negative compatibility result without commensalism or toxicity.
  - node: Cobalamin-Dependent Reductive Dechlorination
    rationale: Represent BAV1 dechlorination as a recipient phenotype without reverse cross-feeding.
  removed_node_decisions: []
  edges_before:
  - source: DMB-Guided Cobalamin Support
    target: Cobalamin-Dependent Reductive Dechlorination
    description: 'DMB-guided biosynthesis converts the Methanosarcina cobamide supply into a cobalamin compatible
      with the Dehalococcoides reductive dechlorination machinery.

      '
  - source: Factor III Is Insufficient Without DMB
    target: Cobalamin-Dependent Reductive Dechlorination
    description: 'Unguided factor III production leaves the Dehalococcoides corrinoid requirement unsatisfied, so
      organohalide respiration remains constrained unless DMB enables compatible cobalamin production.

      '
  edges_after:
  - source: DMB-Guided Cobalamin Support
    target: Cobalamin-Dependent Reductive Dechlorination
    description: With externally supplied DMB, the partner-associated corrinoid system supplies compatible cofactor
      and enables BAV1 dechlorination and growth. This does not assign an exclusive donor-versus-recipient remodeling
      route or imply that DMB is required when compatible cobalamin is supplied directly.
  - source: Factor III Is Insufficient Without DMB
    target: Cobalamin-Dependent Reductive Dechlorination
    description: Failure to supply an adequate compatible cofactor leaves BAV1 dechlorination constrained in the
      unamended coculture. This denotes a missing nutritional input, not active inhibition by factor III. DMB-associated
      cofactor production or direct compatible-cobalamin supplementation can overcome that limitation.
  retained_edge_decisions:
  - source: DMB-Guided Cobalamin Support
    target: Cobalamin-Dependent Reductive Dechlorination
    rationale: With externally supplied DMB, the partner-associated corrinoid system supplies compatible cofactor
      and enables BAV1 dechlorination and growth. This does not assign an exclusive donor-versus-recipient remodeling
      route or imply that DMB is required when compatible cobalamin is supplied directly.
  - source: Factor III Is Insufficient Without DMB
