    fields preserved, not certified.
  summary: Retain positive fermentation support with cofactor and ancillary-mechanism limits.; Represent measured
    recipient activity without a duplicate transfer claim.; Retain the conditional negative arrow while separating
    sulfide toxicity from hydrogen competition.
  renamed_nodes:
    Sulfate-Reduction Perturbation Of Dechlorination: Sulfide-Associated Inhibition Of Dechlorination
  node_decisions:
  - node: Lactate Fermentation Supports Dehalococcoides Growth
    rationale: Retain positive fermentation support with cofactor and ancillary-mechanism limits.
  - node: Enhanced TCE Dechlorination By Syntrophic Support
    rationale: Represent measured recipient activity without a duplicate transfer claim.
  - node: Sulfide-Associated Inhibition Of Dechlorination
    rationale: Retain the conditional negative arrow while separating sulfide toxicity from hydrogen competition.
  removed_node_decisions: []
  edges_before:
  - source: Lactate Fermentation Supports Dehalococcoides Growth
    target: Enhanced TCE Dechlorination By Syntrophic Support
    description: H2 and acetate from DvH lactate fermentation feed the obligately H2-consuming D. mccartyi strain
      195, enabling and accelerating reductive TCE dechlorination (the community's bioremediation function).
  - source: Sulfate-Reduction Perturbation Of Dechlorination
    target: Enhanced TCE Dechlorination By Syntrophic Support
    description: Under high sulfate, DvH sulfate reduction diverts reducing equivalents and generates sulfide, whose
      toxicity suppresses reductive TCE dechlorination — opposing the syntrophic support edge.
  edges_after:
  - source: Lactate Fermentation Supports Dehalococcoides Growth
    target: Enhanced TCE Dechlorination By Syntrophic Support
    description: DvH-derived hydrogen and acetate support strain-195 growth and reductive dechlorination in the
      tested coculture. The faster dechlorination comparison does not isolate every proposed ancillary benefit;
      proton translocation, amino-acid supply and corrinoid-related effects are not separately demonstrated by this
      arrow.
  - source: Sulfide-Associated Inhibition Of Dechlorination
    target: Enhanced TCE Dechlorination By Syntrophic Support
    description: Under the tested high-sulfate, electron-donor-excess conditions, accumulated sulfide suppresses
      strain-195 dechlorination despite available hydrogen. Electron allocation to sulfate reduction is not sufficient
      evidence that hydrogen competition caused this inhibition. The arrow qualifies the recipient phenotype under
      this perturbation, not its unperturbed coculture rate.
  retained_edge_decisions:
  - source: Lactate Fermentation Supports Dehalococcoides Growth
    target: Enhanced TCE Dechlorination By Syntrophic Support
    rationale: DvH-derived hydrogen and acetate support strain-195 growth and reductive dechlorination in the tested
      coculture. The faster dechlorination comparison does not isolate every proposed ancillary benefit; proton
      translocation, amino-acid supply and corrinoid-related effects are not separately demonstrated by this arrow.
  - source: Sulfide-Associated Inhibition Of Dechlorination
    target: Enhanced TCE Dechlorination By Syntrophic Support
