limitations:
- Fresh pre-paper baseline covered460 records and920 caches across both roots including ignored/hidden YAML. All11
  original nodes and6 arrows reviewed;11 nodes and2 arrows retained. Three records repaired with three histories;
  NDC6 byte-for-byte unchanged.
- Full primary main bodies, embedded tables and captions read for undermat, bioflocculation and Naica. Diel and
  NDC6 fresh primary abstracts read; diel indexed publisher view was only partially read through early Results.
  Diel XML returned500, PMC challenge and normal publisher403; NDC publisher is a subscription preview. No access-barrier
  bypass or full-Methods claim for those two. Separate supplements, raw data and original figure pixels not audited.
- All graph quotations match fresh primary and existing caches with whitespace-only normalization. Three case-inexact
  Naica graph quotes corrected to source text, and a misleadingly truncated negative-PCR quote shortened. This is
  not entailment proof or recertification of920 unchanged caches. Original search using two incorrect cache suffixes
  errored and truncated; corrected structured exact-reference matching supersedes it. No complete paper uploaded.
- Mushroom measured diel transcripts and uneven overlapping mat populations retained. Polymer flux remains the explicitly
  proposed model; Thermodesulfovibrio nitrogen fixation is putative, not Synechococcus-to-Thermodesulfovibrio transfer.
  nifHDK alone and partial-genome absence are insufficient. Distinct sampling campaigns are not merged into a simultaneous
  experiment.
- Biofloc microcolonies and positive mixed macroclusters retained with calcium-rich resuspension and centrifugation
  conditions. Release alone did not suffice; FISH preparation caused separate artefacts. Calcium versus centrifugation
  remains unresolved. Model utility is not a second biological causal event; no full-scale performance equivalence
  or isolated EPS mechanism inferred.
- NDC6 aggregate removal and functional complementation retained unchanged. Existing1197/1198 fixes preserve no
  unsupported mutualism and the distinction between three-day10C performance and separate10.2C optimization. Gene-expression
  evidence is actually reported, not reclassified as metagenomics. Sparse valid graph does not require invented
  topology.
- Naica high-GC thermophily and AamoA capacity remain positive but inferred, not growth/flux measurements. Correct
  GO0019676 assimilation to GO0019329 oxidation, confirmed against AmiGO. Negative dsrA PCR is not absence; donor
  scarcity is proposed, not competition or causal promotion of oxidation. No taxonomy edits, including396 near-tie
  and curated groundings.
- Dedup scanned916 all-state issue titles/bodies and27 local matching files with ignored/hidden-inclusive search
  excluding git/docs/site/cache. Matching1197/1198/939/396 bodies read and preserved. No exhaustive PR-comment audit
  or global source-absence claim.
- 'No new topology: repairs and evidence qualification require no Edison extension. Zero provider submissions/credits.
  Earlier scoped paid questions and the AM_AB denial are not overridden.'
- Three repair issues stay OPEN until protected-main merge; separate metadata issue stays OPEN afterward. Non-graph
  blocks are preserved, not certified. Self-adversarial review is not independent approval; corpus review remains
  unfinished.
- 'Self-adversarial review corrected an intermediate endpoint rename: the retained polymer link targets putative
  carbon fixation, not gene expression. Measured RNA remains positive evidence; no new node or arrow, no second
  curation event, and initial validation outputs are retained as superseded.'
