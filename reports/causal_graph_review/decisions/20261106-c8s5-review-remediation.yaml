  edges_before:
  - source: Engineered Phototroph Integration
    target: Nitrate-Limited Photoautotrophic PHB Production
    description: 'Replacing the native phototroph with PHB-optimized PPT1 gives the hybrid community high PHB-production capacity:
      PPHET reached 48% PHB/CDW, compared with 50% for axenic PPT1 and about 10% for WCRM under the matched small-scale regime.
      This supports the engineered phototroph contribution, not proof that every increment arises exclusively in PPT1 or from
      colonization facilitation.'
