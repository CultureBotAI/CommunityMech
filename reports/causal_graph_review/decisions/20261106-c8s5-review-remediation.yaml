  node_decisions:
  - node: Engineered Phototroph Integration
    rationale: Preserve stable phototroph integration and its demonstrated high-PHB contribution without a priority-effect claim.
  - node: Nitrate-Limited Photoautotrophic PHB Production
    rationale: Preserve matched small-scale production and distinguish bulk quantification from cell localization.
  - node: Dark Acetate PHB Accumulation
    rationale: Preserve dark acetate flexibility while separating PHB fraction, biomass and titer.
  - node: PPHET Stress Resilience and Scaled PHB Production
    rationale: Preserve stress protection and scaled production with reactor-specific yields and unresolved oxygen mediation.
  removed_node_decisions: []
