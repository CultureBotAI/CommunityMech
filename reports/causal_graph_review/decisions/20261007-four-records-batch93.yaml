limitations:
- Reference CLI checks were executed on macOS, not Linux. Existing issue1091 documents the pinned validator's
  DOI-cache casing mismatch on case-sensitive filesystems. The new DOI cache follows repository convention;
  this graph repair does not resolve or certify that cross-platform reader contract.
- The first combined regression run passed855tests and failed the exact participating_taxa record-set assertion.
  Rammelsberg intentionally adds explicit community participants; the measured census supports updating the
  expected set. The failed output is retained separately from the corrected rerun.
- All four whole records, nine original nodes and six original arrows reviewed. Eight nodes and three qualified
  existing arrows remain; RAMC unchanged. No new node/direction, experimental protocol, provider submission or paid
  Edison job.
- Three fresh EuropePMC main bodies and the complete public Rammelsberg author pre-proof text read, including captions
  and available table text. No figure-pixel, raw-data or complete supplement review. Rammelsberg browser extraction
  is not a downloaded final PDF; repository challenge and direct403 were not bypassed. The official publisher API
  returned identifying metadata only.
- Rammelsberg105443 is the exact study;105484 is a different Finnish study and its caches remain unchanged. PMID39770610
  is a background review, with only abstract/sections1-2 read. The corrected graph includes dominant recorded taxa
  without claiming they exhaust the enrichment. Non-graph source/community/industrial-scale errors remain issue1753.
- BDE-47 cross-feeding, functional pathway and removal remain positive. Parent disappearance alone does not need
  JMP134; the demonstrated contribution is clearing2,4-DBP. Current SYNTROPHY does not assert obligacy; donor feedback,
  reverse transfer, reciprocal fitness and closed carbon balance are not established by this comparison. The retained
  bromide quote matches the existing appended FigureS16 caption, read but not freshly retrieved or visually inspected.
  Thus21of22graph/new-discussion quotations have fresh independent primary matches, one is existing-caption-only.
  Non-graph partner roles remain issue1753.
- RAMC remains supported without asserting the proposed succinate cross-feed; WT versus RAMC-P distinctions and
  previous non-graph fixes stay intact. Its selected appended cache is not independent evidence, but both graph
  quotes separately match the fresh complete main body.
- PPOW retains a HYPOTHESIZED/PARTIAL complementarity model and the SUPPORT bulk-removal observation. Methods/control
  claims conflict with the conclusion; neither control adequacy nor total absence is certified. Abstract versus
  main-text concentration-unit conflict and non-graph member-role evidence remain issue1753.
- All921baselinecaches and457otherrecord files preserved; two new exact-source caches added with browser-extraction
