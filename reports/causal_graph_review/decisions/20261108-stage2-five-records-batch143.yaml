  node_decisions:
  - node: BS3 Ethanol Detoxification and Riboflavin Shuttle Supply with SO3ΔmtrC
    rationale: Supported by primary source (PMID:42733304, Fig. 5f, Section 2.5, Section 3) with COMMUNITY_LEVEL
      scope covering S. oneidensis SO3ΔmtrC and B. subtilis BS3.
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Shewanella oneidensis MR-1 SO3ΔmtrC
        term:
          id: NCBITaxon:70863
          label: Shewanella oneidensis
      - preferred_term: Bacillus subtilis 168 BS3
        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: When catalyzing the brewing wastewater‐mediated reduction of NCM for metal oxide leaching,
        strain BS3 in the SO3‐BS3 consortium eliminated the ethanol inhibition on EET of S. oneidensis
        by converting residual ethanol in the brewing wastewater into acetate via the Adh‐AldH dual enzyme
        cascade reaction. Also, strain BS3 synthesized riboflavin, which was employed as an electron shuttle
        for promoting the EET of S. oneidensis.
      explanation: Establishes the ethanol-to-acetate detoxification and riboflavin shuttle supply performed
        by strain BS3 in the SO3-series consortia.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The deletion of the genes mtrC and omcA was performed in the wild‐type strain S. oneidensis
        MR‐1, which was subsequently transformed with the plasmid pHG13‐Ptac‐ribADEHC‐irrE, resulting
        in the mutant strains SO3∆mtrC, SO3∆omcA, and SO3∆mtrC∆omcA.
      explanation: Confirms that SO3ΔmtrC retains the pHG13-Ptac-ribADEHC-irrE riboflavin and IrrE expression
        module while lacking outer-membrane decaheme c-type cytochrome gene mtrC.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In the process of the brewing wastewater‐mediated reduction of NCM catalyzed by the SO3‐BS3
        consortium, strain BS3 eliminated the ethanol inhibition on the EET of S. oneidensis by removing
        residual ethanol and synthesized riboflavin as the electron shuttle.
      explanation: Confirms the upstream division-of-labor function of Bacillus subtilis BS3 in eliminating
        ethanol inhibition and supplying riboflavin as an electron shuttle.
  - node: Attenuated EET and NCM Metal Oxide Leaching in SO3ΔmtrC-BS3 Consortium
    rationale: Supported by primary source (PMID:42733304, Fig. 5c-d, Section 2.5, Section 5.12) with
      COMMUNITY_LEVEL scope covering S. oneidensis SO3ΔmtrC and B. subtilis BS3.
    field_path: ecological_interactions[1]
    source_locator: Cached full text and abstract (PMID:42733304, PMC13572860)
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Shewanella oneidensis MR-1 SO3ΔmtrC
        term:
          id: NCBITaxon:70863
          label: Shewanella oneidensis
      - preferred_term: Bacillus subtilis 168 BS3
        term:
          id: NCBITaxon:1423
          label: Bacillus subtilis
    evidence:
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The results showed that the SO3∆mtrC‐BS3 consortium (47.67 mW m−2), the SO3∆omcA‐BS3 consortium
        (50.01 mW m−2), and the SO3∆mtrC∆omcA‐BS3 consortium (28.39 mW m−2) showed 9.50‐, 9.05‐, and 15.95‐fold
        decreases in the EET rate compared to the SO3‐BS3 consortium (452.90 mW m−2), respectively (Figure
        5c ), confirming that the disruption of MtrC and OmcA significantly inhibited the EET process
        in strain SO3.
      explanation: Quantifies the 47.67 mW m^-2 maximum power density (9.50-fold decrease vs SO3-BS3)
        of the SO3ΔmtrC-BS3 consortium.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Correspondingly, compared with the total leached metal ions catalyzed by the SO3‐BS3 microbial
        consortium (102.4 mg L−1), the contents of leached metal ions catalyzed by the SO3∆mtrC‐BS3 consortium
        (16.7 mg L−1), the SO3∆omcA‐BS3 microbial consortium (18.7 mg L−1), and the SO3∆mtrC∆omcA‐BS3
        consortium (13.4 mg L−1) were dramatically decreased by 6.13‐, 5.48‐, and 7.64‐fold, respectively
        (Figure 5d ).
      explanation: Quantifies the 16.7 mg L^-1 total leached metal ion yield (6.13-fold decrease vs SO3-BS3)
        of the SO3ΔmtrC-BS3 consortium.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Notably, the leached metal ions catalyzed by the SO3∆mtrC∆omcA‐BS3 consortium (13.4 mg
        L−1) exhibited negligible difference from that catalyzed by the sole strain BS3 (13.4 mg L−1),
        suggesting that MtrC and OmcA in S. oneidensis were essential for NCM reduction in metal oxide
        leaching.
      explanation: Demonstrates that deleting both MtrC and OmcA reduces consortium metal leaching to
        the 13.4 mg L^-1 sole-strain BS3 baseline.
    - reference: PMID:42733304
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The deletion of the genes mtrC and omcA was performed in the wild‐type strain S. oneidensis
        MR‐1, which was subsequently transformed with the plasmid pHG13‐Ptac‐ribADEHC‐irrE, resulting
        in the mutant strains SO3∆mtrC, SO3∆omcA, and SO3∆mtrC∆omcA.
      explanation: Documents the homologous-recombination construction of strain SO3ΔmtrC carrying pHG13-Ptac-ribADEHC-irrE
        for the downstream MtrC-deficient EET node.
