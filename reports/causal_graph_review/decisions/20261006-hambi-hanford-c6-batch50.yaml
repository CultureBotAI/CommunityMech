limitations:
- Whole 511-line HAMBI,270-line Hanford and386-line C6 records and every original node/arrow reviewed. HAMBI/C6
  complete cached main bodies/Methods/embedded captions read; C6 main tables read. Hanford primary abstract and
  selected excerpts only, not full body. No original figure images, supplements, raw data or code audited.
- 'Existing-structure repairs only: six nodes retained, two Hanford arrows removed, no new causal nodes/arrows or
  paid Edison job. Positive findings and author interpretations retained with limits; review does not claim all
  possible mechanisms represented.'
- HAMBI competition and trait/pH mediation remain interpretations, with positive controlled carbon responses and
  OD-scaled abundance retained. Explicit participants are the input roster, not demonstrated endpoint persistence
  or alternative stable states.
- Hanford selected-cache provenance/full-body access limits persist. Putative guild profiles are not metabolic flux
  or demonstrated niche partitioning; four broad taxa are not a complete or guild-resolved roster. Top-down-control
  proposal is not a new curated predation branch. The extracted guild-enrichment sentence lacks its precise spatial
  comparator; no contact-specific enrichment is certified.
- C6 bulk removal is not mineralization, ammonia production is not consortium removal and nonsignificance is not
  formal equivalence. Community recovery does not prove every-strain survival or EPS/quorum-sensing mechanism. Main-text/figure-caption
  irradiation-feed discrepancy remains unresolved.
- All non-graph raw blocks and920 cache files preserved, not certified. SupportingReference coverage (#476), Linux
  DOI-cache lookup (#1091), selected-cache provenance (#1362) and unrelated writer-audit artifact issue (#1095)
  remain outside scope. Reference CLI Total checks counts reported issues, not executed checks.
- Dedup checked803 all-state issue titles/bodies and19 ignored/hidden local files, not all comments or PR reviews.
