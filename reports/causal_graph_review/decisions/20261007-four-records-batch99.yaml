  node_decisions:
  - node: Yeast Carbon Dioxide Provisioning
    rationale: Retain yeast-to-alga carbon supply without requiring fermentation as its sole route.
  - node: Algal Reduced Nitrogen Provisioning
    rationale: Retain algal reduced-nitrogen supply and the conditional reciprocal resource loop; mediation strength
      remains PARTIAL.
  removed_node_decisions:
  - node: Algal Oxygen Provisioning
    rationale: Figure1 depicts algal oxygen release, but the reviewed main text does not isolate an oxygen-mediated
      yeast benefit. Remove that asserted pairwise transfer, not the established carbon/nitrogen mutualism.
  renamed_nodes: {}
  edges_before:
  - &id001
    source: Yeast Carbon Dioxide Provisioning
    target: Algal Reduced Nitrogen Provisioning
    description: Yeast-derived carbon dioxide is fixed photosynthetically by C. reinhardtii, sustaining the algal
      partner that reduces nitrite to ammonia for S. cerevisiae.
  - &id003
    source: Algal Reduced Nitrogen Provisioning
    target: Yeast Carbon Dioxide Provisioning
    description: Algal reduction of nitrite to ammonia supplies the nitrogen source that lets S. cerevisiae proliferate
      and keep producing carbon dioxide from glucose.
  edges_after:
  - &id002
    source: Yeast Carbon Dioxide Provisioning
    target: Algal Reduced Nitrogen Provisioning
    description: 'PARTIAL: yeast-derived carbon dioxide sustains the alga that supplies reduced nitrogen to yeast,
      closing the resource-dependence loop. Coculture and resource-availability comparisons support this reciprocal
      mechanism, but do not separately quantify how a change in carbon transfer changes ammonia release.'
  - &id004
    source: Algal Reduced Nitrogen Provisioning
    target: Yeast Carbon Dioxide Provisioning
    description: 'PARTIAL: algal reduced nitrogen sustains yeast growth and therefore the yeast partner supplying
      carbon dioxide. This reciprocal support is consistent with the reported dependence, not a measured feedback
      gain or a separate temporal causal experiment.'
