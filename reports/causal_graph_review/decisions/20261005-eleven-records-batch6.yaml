  summary: Bound infant HMO routes to inferred lactose mediation and measured donor response
  node_decisions:
  - node: B. breve 2'FL Transporter Constraint
    rationale: Keep measured substrate constraint and genomic explanation; remove reversed constraint-to-donor arrow/type.
  - node: R. gnavus Extracellular Fucosidase Capacity
    rationale: Keep computational fucosidase capacity and two PARTIAL routes, not cross-feeding measured by gene
      presence.
  - node: R. gnavus 2'FL Hydrolysis Feeds B. breve
    rationale: Keep the explicit cross-feeding model and two PARTIAL mediation arrows, preserving growth evidence.
  - node: B. breve Coculture Dominance and Lactose Growth
    rationale: Rename to separate observed dominance from lactose-control results; remove endpoint-only cross-feeding.
  - node: Individualized HMO Utilization Capacity
    rationale: Retain individualized responses without imposing FT-1 identities on all infant systems.
  - node: R. gnavus PT-1 2'FL Rescue
    rationale: Retain measured donor-supplementation response without typing the endpoint as resolved molecular
      exchange.
  edges_before:
  - source: B. breve 2'FL Transporter Constraint
    target: R. gnavus 2'FL Hydrolysis Feeds B. breve
    description: 'Because the FT-1 B. breve isolate could not directly use 2''FL, growth on this HMO required extracellular
      cleavage by R. gnavus.

      '
  - source: R. gnavus Extracellular Fucosidase Capacity
    target: R. gnavus 2'FL Hydrolysis Feeds B. breve
    description: 'The predicted extracellular fucosidase activity is the genomic route through which R. gnavus can
      hydrolyze 2''FL and release lactose.

      '
  - source: R. gnavus Extracellular Fucosidase Capacity
    target: R. gnavus PT-1 2'FL Rescue
    description: 'Adding the extracellular-fucosidase producer supplied the 2''FL-opening capacity missing from
      the unsupplemented PT-1 community.

      '
  - source: R. gnavus 2'FL Hydrolysis Feeds B. breve
    target: B. breve Lactose-Driven Coculture Dominance
    description: 'R. gnavus extracellular 2''FL hydrolysis supplies the lactose that lets B. breve dominate the
      2''FL co-culture.

      '
  - source: R. gnavus 2'FL Hydrolysis Feeds B. breve
    target: R. gnavus PT-1 2'FL Rescue
    description: 'The same R. gnavus-to-B. breve lactose cross-feeding explains why R. gnavus supplementation enriches
      B. breve in PT-1.

      '
  edges_after:
  - source: R. gnavus Extracellular Fucosidase Capacity
    target: R. gnavus 2'FL Hydrolysis Feeds B. breve
    description: PARTIAL - predicted extracellular fucosidases could release lactose from 2'FL, providing the proposed
      route for B. breve substrate access. Localization, cleavage products and enzyme necessity were not directly
      resolved in the inspected main paper.
  - source: R. gnavus Extracellular Fucosidase Capacity
    target: R. gnavus PT-1 2'FL Rescue
    description: PARTIAL - FT-1 R. gnavus supplies a candidate 2'FL-cleaving capacity to PT-1. Supplementation enriches
      B. breve, but the specific fucosidase-dependent route is inferred rather than selectively perturbed.
  - source: R. gnavus 2'FL Hydrolysis Feeds B. breve
    target: B. breve Coculture Dominance and Lactose Growth
    description: PARTIAL - proposed lactose supply could favor B. breve, whose lactose controls show faster growth
      and higher final density. This explains observed coculture composition as a candidate mechanism, not measured
      lactose flux or proof of molecular necessity.
  - source: R. gnavus 2'FL Hydrolysis Feeds B. breve
    target: R. gnavus PT-1 2'FL Rescue
    description: PARTIAL - the proposed lactose-release route could mediate B. breve enrichment after R. gnavus
      supplementation to PT-1. The donor intervention is measured; lactose-specific mediation of enrichment, pH
      and diversity remains unresolved.
