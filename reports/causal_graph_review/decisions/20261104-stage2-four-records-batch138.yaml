      snippet: The result demonstrated that the naphthalene biodegradation rates of 41.01, 38.92, 75.54,
        44.71, 92.43, and 64.47% for the planktonic cultures, whereas were 87.72, 64.57, 77.45, 86.88,
        94.69, and 79.74% for the biofilm cultures of isolates A1, A3, consortium 1, consortium 2, consortium
        3, and consortium 4, respectively.
