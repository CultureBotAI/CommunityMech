    Robustness to Transient Perturbation: Condition-Specific Biofilm Response to Perturbation
  node_decisions:
  - node: Biofilm Community Composition and Growth Interactions
    rationale: Retain distinct controlled growth and composition findings without generic niche partitioning or
      all-member cooperation.
  - node: Thiocillin-Biosynthesis-Dependent Kocuria Suppression
    rationale: Retain positive thiocillin-biosynthesis genetic evidence with Bacillus/Kocuria participants and molecular-route
      limits.
