  summary: Separate Caldicellulosiruptor outcomes from hypothesized growth-mediated coexistence
  node_decisions:
  - node: Stable Chemostat Coexistence
    rationale: Retain persistence untyped; remove the unsupported yield-mediation arrow.
  - node: C. saccharolyticus Growth-Supernatant Enhancement
    rationale: Retain measured growth response and the explicitly hypothetical coexistence explanation.
  - node: Enhanced Glucose-Limited Hydrogen Yield
    rationale: Rename the endpoint for its measured quantity and condition; remove reciprocal-benefit typing.
  edges_before:
  - source: Stable Chemostat Coexistence
    target: Synergistic Biohydrogen Production
    description: 'Stable coexistence of the two sugar-fermenting Caldicellulosiruptor strains maintains the continuous
      mixed-sugar conversion regime that yielded more hydrogen than either monoculture under glucose limitation.

      '
  - source: C. saccharolyticus Growth-Supernatant Enhancement
    target: Stable Chemostat Coexistence
    description: 'Growth enhancement of C. kristjanssonii by C. saccharolyticus conditioned supernatant provides
      a facilitative interaction that helps explain stable coexistence instead of simple shared-sugar competition.

      '
  edges_after:
  - source: C. saccharolyticus Growth-Supernatant Enhancement
    target: Stable Chemostat Coexistence
    description: HYPOTHESIZED - growth stimulation could help maintain coexistence. The model assumes rate and biomass-yield
      enhancement; the batch assay supports only part of that mechanism, not its necessity in the chemostat.
