  status: reviewed
  review_file: reports/causal_graph_review/decisions/20261004-four-records.yaml
  scope: Whole record read; all causal nodes and existing downstream claims reviewed against the cited source passages.
  summary: Separate transcript associations from causal and conditional formate effects
  node_decisions:
  - node: Propionate Oxidation Coupled to Methanogenesis
    rationale: Retain exact-system syntrophy, but qualify the transcript comparison for substrate and growth-rate
      confounding.
  - node: Catabolism and Methanogenesis Upregulation in Coculture
    rationale: Retain measured expression differences; remove two part-of/parallel-response arcs to formate and
      signaling.
  - node: Formate and Electron Bifurcation Strategy
    rationale: Combine duplicate pair as a conditional link preserving formate-transfer inference, 20 mM formate
      inhibition, 5 mM BES inhibition and H2 contrast.
  - node: Signal Transduction and Amino Acid Exchange
    rationale: Mark exchange/signaling mechanisms hypothesized; remove the unsupported single bacteria-to-archaea
      direction using community scope and both participants.
  edges_before:
  - source: Propionate Oxidation Coupled to Methanogenesis
    target: Catabolism and Methanogenesis Upregulation in Coculture
    description: "Establishing the syntrophic coculture (versus monoculture) drives the concerted transcriptional\
      \ upregulation of catabolic genes \u2014 the methylmalonyl-CoA pathway in P. thermopropionicum and methanogenesis\
      \ genes in M. conradii.\n"
  - source: Catabolism and Methanogenesis Upregulation in Coculture
    target: Formate and Electron Bifurcation Strategy
    description: 'The catabolic upregulation includes formate dehydrogenase and flavin-based electron bifurcation/confurcation
      genes in both partners, activating formate as an alternate interspecies electron carrier alongside H2.

      '
  - source: Catabolism and Methanogenesis Upregulation in Coculture
    target: Signal Transduction and Amino Acid Exchange
    description: 'The same coculture transcriptional shift upregulates flagellum-induced signal transduction and
      amino-acid exchange that accompany syntrophic growth.

      '
  - source: Formate and Electron Bifurcation Strategy
    target: Propionate Oxidation Coupled to Methanogenesis
    description: 'Interspecies formate and H2 transfer to M. conradii sustains hydrogenotrophic methanogenesis,
      keeping the shared electron-carrier partial pressure low and thermodynamically pulling P. thermopropionicum
      propionate oxidation; inhibiting methanogenesis with 2-BES abolished both methane production and propionate
      oxidation.

      '
  - source: Formate and Electron Bifurcation Strategy
    target: Propionate Oxidation Coupled to Methanogenesis
    description: "NEGATIVE (product inhibition) \u2014 accumulation of excess formate inhibits syntrophic activity\
      \ and halts propionate oxidation, so formate transfer must stay balanced by continuous methanogenic consumption.\n"
  edges_after:
  - source: Propionate Oxidation Coupled to Methanogenesis
    target: Catabolism and Methanogenesis Upregulation in Coculture
    description: PARTIAL - the propionate-fed coculture showed increased catabolic and methanogenesis transcripts
      relative to the monocultures. The source warns that substrate, hydrogen availability and growth rate differ,
      so this comparison does not isolate the effect of the partner interaction alone.
  - source: Formate and Electron Bifurcation Strategy
    target: Propionate Oxidation Coupled to Methanogenesis
    description: 'PARTIAL - formate turnover is inferred to support syntrophic electron transfer. Its effect depends
      on conditions: adding 20 mM formate immediately halted propionate oxidation, which resumed after formate consumption;
      adding 5 mM 2-BES abolished propionate oxidation and methane production. The source did not find comparable
      inhibition after H2/CO2 addition, so this edge does not assert a measured low-H2 requirement in that experiment.'
