  scope: Whole record read; all causal nodes and existing downstream claims reviewed against the cited source passages.
  summary: Qualify mediator-to-stability edges in disturbance-stable denitrification
  node_decisions:
  - node: AHL-mediated interspecific communication under disturbance
    rationale: 'Retain the observed communication node; qualify its causal contribution to the endpoint as PARTIAL
      at abstract scope. Remove the +/+ classification: communication alone does not establish both partners benefit.'
  - node: DBP-stimulated phenazine electron transfer
    rationale: Retain explicit DBP-to-phenazine-to-electron-transfer claim; omit cross-feeding classification because
      a donor/recipient metabolite transfer is not established.
  - node: Disturbance-stable aerobic denitrification
    rationale: 'Retain the measured approximately 93% denitrification endpoint under DBP or LOFX; do not generalize
      the DBP mediator to LOFX. Remove the syntrophy classification: the abstract does not establish product removal
      making partner metabolism favorable.'
  edges_before:
  - source: AHL-mediated interspecific communication under disturbance
    target: Disturbance-stable aerobic denitrification
    description: AHL-mediated communication is part of the disturbed SMC state that maintains high aerobic denitrification
      efficiency.
  - source: DBP-stimulated phenazine electron transfer
    target: Disturbance-stable aerobic denitrification
    description: Phenazine-stimulated electron transfer is a redox route into the maintained denitrification phenotype.
  edges_after:
  - source: AHL-mediated interspecific communication under disturbance
    target: Disturbance-stable aerobic denitrification
    description: PARTIAL - the authors attribute disturbance stability in part to interspecific communication and
      identify C4-HSL/3OC12-HSL in the corresponding treatments. The accessible abstract does not report signal-blocking
      or rescue experiments that isolate an AHL effect on denitrification.
  - source: DBP-stimulated phenazine electron transfer
    target: Disturbance-stable aerobic denitrification
    description: PARTIAL - DBP-induced phenazine-1-carboxylic acid accelerates electron transfer, a route the authors
      associate with maintained SMC function under DBP. The abstract does not quantify its independent contribution
      to the approximately 93% denitrification endpoint or extend this phenazine mechanism to LOFX.
