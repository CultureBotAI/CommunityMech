- path: kb/communities/PHA_MixedCulture_Phage_Succession_Community.yaml
  id: CommunityMech:000468
  original_sha256: aebd6497b6d5a6f49e9e9ef956d4ec0847960acc0fd2413dce5e0960ed748488
  record_sha256: aebd6497b6d5a6f49e9e9ef956d4ec0847960acc0fd2413dce5e0960ed748488
  status: reviewed
  outcome: no_change
  review_file: reports/causal_graph_review/decisions/20261014-phage-graphs-batch130.yaml
  scope: Whole record read; every graph node and existing arrow compared with primary evidence. Related
    descriptions and discussions checked; unrelated assertions not recertified.
  summary: Retain five bounded observational/model/prediction nodes without arrows.
  node_decisions:
  - node: Hypothesized Kill-the-Winner Succession of Dominant PHA Producers
    rationale: Retain explicitly HYPOTHESIZED kill-the-winner with PARTIAL computational evidence. Observed
      succession and fitted SEM do not independently demonstrate phage-mediated lysis; no arrow is justified.
    field_path: ecological_interactions[0]
    source_locator: 'Abstract; Results: succession and structural equation model; computational Methods'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:40152616
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: Structural equation modeling analysis showed that phages could infect and lyse dominant
        species to vacate ecological niches for other species, resulting in a community succession state
        in which dominant species alternated.
    - reference: PMID:40152616
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: Sample points in each reactor did not cluster together during the late stages of maintenance
        (days 65, 68, and 145), suggesting that the bacterial community structure reached alternative
        states during maintenance, even when deterministic selection pressure was applied
  - node: Coupled Turnover of Phage and Bacterial Community Structure
    rationale: Retain correlated turnover as association without mechanistic typing or causal direction.
      Reactor-specific correlations do not establish predation.
    field_path: ecological_interactions[1]
    source_locator: 'Results: temporally adjacent community turnover and Spearman correlations'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:40152616
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: There was a significant positive relationship between the bacterial and phage communities
        shifts
    - reference: PMID:40152616
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: the dynamics of bacterial community structure could be mirrored in phage communities
  - node: Modeled Association of Phage Abundance with Bacterial Diversity and Activity
    rationale: Retain SEM-estimated negative associations with explicit observational limits. No manipulation
      establishes killing or excludes host-driven explanations; keep arrow-free.
    field_path: ecological_interactions[2]
    source_locator: 'Results: structural equation model diversity and activity associations; computational
      Methods'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:40152616
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: 'significant negative correlation (r: −0.43, P ≤ 0.05) between phage abundance and the
        alpha diversity (Chao1) index of the bacterial community'
    - reference: PMID:40152616
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: the SEM was used to discern the causality and quantify the effects of the drivers
  - node: Phage-Encoded Auxiliary Metabolic Genes for PHA Synthesis Are Transcribed
    rationale: Retain predicted AMGs and observed transcripts with distinct computational and experimental
      modalities. Neither establishes productive infection, translated activity or increased PHA yield.
    field_path: ecological_interactions[3]
    source_locator: 'Results: predicted AMGs and metatranscriptomic expression; annotation Methods'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:40152616
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Seven key auxiliary metabolic genes (AMGs), phaC, fadJ, acs, ackA, phbB, acdAB, and fadD,
        potentially contributing to PHA synthesis were identified from phage sequences
    - reference: PMID:40152616
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: these AMGs were transcribed, indicating that they were in an active expression state
  - node: Predicted Host Antiviral Defence Repertoire
    rationale: Retain encoded defense predictions without functional resistance claims. Community context
      does not justify a new pairwise infection or competition relation.
    field_path: ecological_interactions[4]
    source_locator: 'Results: encoded antiviral systems; DefenseFinder Methods'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:40152616
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: The RM and CRISPR-Cas systems were the predominant antiviral systems in 10 of the 12 bacterial
        phyla
