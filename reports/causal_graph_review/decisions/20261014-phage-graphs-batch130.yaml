  node_decisions:
  - node: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    rationale: Retain the directly reported phage-host infection as PAIRWISE LYTIC_INFECTION. The description
      distinguishes study host framing from unperformed alternative-host assays.
    field_path: ecological_interactions[0]
    source_locator: 'Results: phage densities and host specificity; Fig 3 caption'
    scope: PAIRWISE
    participants:
      source_taxon:
        preferred_term: Pseudomonas phage DMS3vir
        term:
          id: NCBITaxon:389469
          label: Casadabanvirus DMS3
      target_taxon:
        preferred_term: Pseudomonas aeruginosa PA14
        term:
          id: NCBITaxon:287
          label: Pseudomonas aeruginosa
    evidence:
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Phage DMS3vir targets P. aeruginosa’s Type IV pilus (T4P)
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: phage DMS3vir initially reached high titres due to replication on sensitive P. aeruginosa
        hosts, followed by a rapid decline in phage densities due to the evolution of phage resistance
  - node: Competitive Release of Acinetobacter baumannii
    rationale: Retain phage-associated release of the previously suppressed competitor and both named
      bacterial participants. Do not equate observed replacement with an independently established diversity
      mediator.
    field_path: ecological_interactions[1]
    source_locator: 'Results: competitive release; Fig 5 caption; Discussion'
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Acinetobacter baumannii FZ21
        term:
          id: NCBITaxon:470
          label: Acinetobacter baumannii
      - preferred_term: Pseudomonas aeruginosa PA14
        term:
          id: NCBITaxon:287
          label: Pseudomonas aeruginosa
    evidence:
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the presence of phage caused microbial communities to no longer be dominated by P. aeruginosa
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the competitive release of A. baumannii occurred in all treatments and was virtually independent
        of whether P. aeruginosa had a functional CRISPR-Cas immune system or not
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: P. aeruginosa outcompetes the other species in the absence of phage
  - node: Type IV Pilus Mutation Dominates Realised Resistance
    rationale: Retain resistance observations using the authors' phenotype-based mutation terminology,
      explicitly not sequenced genotypes. Cost interpretation remains PARTIAL; omit COMPETITION because
      reciprocal negative effects are not established by this observation.
    field_path: ecological_interactions[2]
    source_locator: 'Results: resistance routes and qualified cost interpretation; Fig 4 caption; Methods:
      absence of receptor-mutant sequencing'
    scope: COMMUNITY_LEVEL
    participants:
      participating_taxa:
      - preferred_term: Pseudomonas aeruginosa PA14
        term:
          id: NCBITaxon:287
          label: Pseudomonas aeruginosa
      - preferred_term: Acinetobacter baumannii FZ21
        term:
          id: NCBITaxon:470
          label: Acinetobacter baumannii
    evidence:
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: mutation of the Type IV pilus became the dominant resistance mechanism even if P. aeruginosa
        has a functional CRISPR system
    - reference: PMID:38648198
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: which might in part be why P. aeruginosa did not recover in the microbial community post
        phage exposure due to the associated fitness costs
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Further sequencing of receptor mutants was not done
  - node: Phage-Associated Maintenance of Community Diversity
    rationale: Retain the diversity treatment outcome without relabeling it as infection or repeated kill-the-winner
      turnover. Mediation by the released competitor remains unresolved and PARTIAL.
    field_path: ecological_interactions[3]
    source_locator: 'Results: community diversity; Fig 8 caption; Discussion'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: very few to none of the experimental repeats had 1 or more bacterial species go extinct
    - reference: PMID:38648198
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: phage targeting a dominant species allows for the competitive release of the strongest
        competitor while also contributing to community diversity maintenance
  - node: Model-Inferred Context Dependence of Community Interactions
    rationale: Retain computationally inferred context dependence, bounded to the tested models. Separate
      quantitative improvement without phage from quantitative failure with phage and qualitative release
      prediction; neither a measured reciprocal-competition relation nor a general impossibility theorem.
    field_path: ecological_interactions[4]
    source_locator: 'Results and Discussion: fitted gLV comparisons; Figs 9-10 captions; computational
      Methods'
    scope: COMMUNITY_LEVEL
    participants: {}
    evidence:
    - reference: PMID:38648198
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: fitting gLV models with pairwise only datasets led to predictive failures when applied
        to 3- or 4-species datasets
    - reference: PMID:38648198
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: pairwise data alone is insufficient when modelling our microbial community
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: reasonably fit the data in the absence of phage
    - reference: PMID:38648198
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: the interaction coefficients did not generalise quantitatively to 4-species data
  edges_before:
  - source: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    target: Competitive Release of Acinetobacter baumannii
    description: Lysis of the otherwise dominant competitor is what frees the niche that A. baumannii
      expands into.
  - source: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    target: Type IV Pilus Mutation Dominates Realised Resistance
    description: Targeting the pilus is what makes receptor loss an available resistance route, and what
      gives that route its fitness cost.
  - source: Competitive Release of Acinetobacter baumannii
    target: Phage-Associated Maintenance of Community Diversity
    description: Releasing a subordinate competitor into dominance, rather than letting one species exclude
      the rest, is the mechanism by which phage keeps the assembly diverse.
  edges_after:
  - source: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    target: Competitive Release of Acinetobacter baumannii
    description: Lysis of the otherwise dominant competitor is what frees the niche that A. baumannii
      expands into.
  - source: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    target: Type IV Pilus Mutation Dominates Realised Resistance
    description: 'PARTIAL: Phage exposure provided the selection context in which surface-based resistance
      became dominant. This links infection to the observed resistance response, but does not show that
      receptor targeting itself causes a measured fitness cost or establishes the proposed cost-mediated
      explanation for continued host non-recovery.'
  - source: Competitive Release of Acinetobacter baumannii
    target: Phage-Associated Maintenance of Community Diversity
    description: 'PARTIAL: Competitive release is a proposed component of the phage-associated community
      shift and diversity maintenance. Phage addition altered both outcomes, but the experiment does not
      isolate expansion of A. baumannii alone as a necessary or sufficient mediator of the diversity effect.'
  retained_edge_decisions:
  - source: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    target: Competitive Release of Acinetobacter baumannii
    description: Lysis of the otherwise dominant competitor is what frees the niche that A. baumannii
      expands into.
    rationale: The phage-addition comparison supports host loss and competitive release. Retain this study-specific
      direction without broadening host-range or therapeutic claims.
    reference: PMID:38648198
  - source: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
    target: Type IV Pilus Mutation Dominates Realised Resistance
    description: 'PARTIAL: Phage exposure provided the selection context in which surface-based resistance
      became dominant. This links infection to the observed resistance response, but does not show that
      receptor targeting itself causes a measured fitness cost or establishes the proposed cost-mediated
      explanation for continued host non-recovery.'
    rationale: Retain PARTIAL exposure-to-resistance response, not receptor-targeting as a measured cost
      mechanism for non-recovery.
    reference: PMID:38648198
  - source: Competitive Release of Acinetobacter baumannii
    target: Phage-Associated Maintenance of Community Diversity
    description: 'PARTIAL: Competitive release is a proposed component of the phage-associated community
      shift and diversity maintenance. Phage addition altered both outcomes, but the experiment does not
      isolate expansion of A. baumannii alone as a necessary or sufficient mediator of the diversity effect.'
    rationale: Retain PARTIAL mediation of a joint diversity outcome; the released competitor was not
      isolated as a necessary or sufficient mediator.
    reference: PMID:38648198
