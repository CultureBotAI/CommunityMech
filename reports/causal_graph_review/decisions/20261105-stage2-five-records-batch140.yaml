  scope: Whole record read; every graph node, scope, participant, and directed downstream causal edge
    verified against cached open-access full text and abstract (PMID:29611893, PMC5947623, doi:10.1111/1462-2920.14119)
    and sibling S. fumaroxidans records CommunityMech:000068 and CommunityMech:000069.
  summary: Reviewed and enriched the 2-node, 1-edge PAIRWISE causal interaction graph for the Syntrophobacter
    fumaroxidans MPOB (DSM 10017) + Desulfovibrio desulfuricans G11 (DSM 7057) coculture on 20 mM propionate
    and 20 mM sulfate in PMID:29611893 by adding verbatim proteomic evidence for S. fumaroxidans simultaneous
    sulfidogenic (Sat, HppA, AprAB, DsrAB, DsrC, HdrABC/HdrL) and interspecies electron transfer (Fdh1,
    Fdh2, Hox, Hyn, FrdABEF) metabolism and D. desulfuricans G11 principal component separation (PC1 ~70%
    variance, 317 core proteins with AprA G11_01440, FDH3 G11_11530-11545, and Hyd-3 G11_06350-06355),
    while retaining and bounding the single directed downstream edge.
  node_decisions:
  - node: Syntrophic Propionate Oxidation with Interspecies Formate and Hydrogen Transfer
    rationale: Supported by primary source (PMID:29611893, Figs. 1-4) with explicit PAIRWISE SYN_TROPHY
      scope and taxon grounding (Syntrophobacter fumaroxidans MPOB -> Desulfovibrio desulfuricans G11);
      captures propionate oxidation via the methylmalonyl-CoA pathway alongside simultaneous expression
      of dissimilatory sulfate-reduction complexes (Sat, HppA, AprAB, DsrAB, DsrC, HdrABC/HdrL) and RET/IET
      enzymes (Fdh1, Fdh2, Hox, Hyn, FrdABEF) releasing formate and H2.
    field_path: ecological_interactions[0]
    source_locator: Cached full text and abstract (PMID:29611893, PMC5947623)
    scope: PAIRWISE
    participants:
      source_taxon:
        preferred_term: Syntrophobacter fumaroxidans
        term:
          id: NCBITaxon:119484
          label: Syntrophobacter fumaroxidans
      target_taxon:
        preferred_term: Desulfovibrio desulfuricans
        term:
          id: NCBITaxon:876
          label: Desulfovibrio desulfuricans
    evidence:
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The proteomic profiles of both bacteria in the coculture of S. fumaroxidans with D. desulfuricans
        give insight in the metabolic flexibility of S. fumaroxidans. Results showed a proteomic profile
        of S. fumaroxidans in which sulfate reduction took place, while energy conservation and IET mechanisms
        were also used similarly as in the syntrophic associations with methanogens. The proteomic analysis
        of the partner D. desulfuricans confirmed IET via formate and hydrogen carried on by S. fumaroxidans
        in a sulfate rich environment.
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Considering the high levels of Hyn and FrdABEF in the coculture with D. desulfuricans,
        we suggest that indeed Hyn is involved in RET with FrdABEF, whether reducing fumarate in fumarate
        conditions or reversibly oxidizing succinate in the coculture with D. desulfuricans (Fig. 4 ).
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The abundance of the proteins involved in sulfate reduction confirm that D. desulfuricans
        was actively reducing sulfate for which it certainly needed electron donors which could only come
        from S. fumaroxidans in such growth condition.
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Two of the three predicted heterodisulfide reductases‐like enzymes in S. fumaroxidans
        were detected in this study, one associated with a flavin oxidoreductase complex Hdr/Flox (Sfum_1970–1977)
        and the other with a multicomplex that includes an HdrL, a MvhD and an FeS electron transfer protein:
        HdrABC/HdrL (Sfum_0819–0824). The Flox section of Hdr/Flox is produced in all conditions. HdrABC/HdrL
        was abundant when sulfate was present whereas only the subunits containing FAD/NAD‐binding domains
        were detected in syntrophic cultures.'
  - node: Hydrogen- and Formate-Coupled Dissimilatory Sulfate Reduction
    rationale: Supported by primary source (PMID:29611893, Supporting Information Figs. S3-S5) with explicit
      PAIRWISE CROSS_FEEDING scope and taxon grounding (Syntrophobacter fumaroxidans MPOB -> Desulfovibrio
      desulfuricans G11); captures D. desulfuricans G11 growth at a 1:2 ratio with S. fumaroxidans (317
      core proteins, separated along PC1 ~70% of variance) coupling periplasmic FDH3 (G11_11530-11545)
      and Hyd-3 (G11_06350-06355) to sulfate reduction via AprA (G11_01440).
    field_path: ecological_interactions[1]
    source_locator: Cached full text and abstract (PMID:29611893, PMC5947623)
    scope: PAIRWISE
    participants:
      source_taxon:
        preferred_term: Syntrophobacter fumaroxidans
        term:
          id: NCBITaxon:119484
          label: Syntrophobacter fumaroxidans
      target_taxon:
        preferred_term: Desulfovibrio desulfuricans
        term:
          id: NCBITaxon:876
          label: Desulfovibrio desulfuricans
    evidence:
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Although fewer D. desulfuricans proteins were detected in cells grown in coculture with
        S. fumaroxidans, proteins required for sulfate reduction such as AprA (G11_01440) were found among
        the ten most abundant proteins along with a periplasmic formate dehydrogenase (FDH3; G11_11530–11545)
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: D. desulfuricans is a sulfate reducer that utilizes lactate, ethanol, hydrogen and formate
        in the presence of sulfate, but not acetate, propionate, butyrate or glucose (McInerney et al.,
        1979 ). Therefore, a syntrophic relationship with S. fumaroxidans, in which hydrogen and formate
        are produced, would be beneficial for D. desulfuricans.
    - reference: PMID:29611893
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The first principal component (PC1; ∼ 70% of total variance) clearly separates growth in
        coculture from axenic growth in formate or hydrogen. However, PC1 did not establish a difference
        between growth on hydrogen or on formate.
