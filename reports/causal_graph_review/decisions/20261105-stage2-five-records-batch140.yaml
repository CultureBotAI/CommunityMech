      SYN_TROPHY scope and taxon grounding (Syntrophomonas wolfei G311 -> Methanobacterium formicicum
      MF); documents syntrophic oxidation of 20 mM butyrate to acetate coupled to hydrogenotrophic methanogenesis
      with zero detectable extracellular formate accumulation and no fabricated sub-process edges.
