      electron donors for D. desulfuricans G11 dissimilatory sulfate reduction in the propionate-sulfate
      coculture.
  edges_after:
  - source: Syntrophic Propionate Oxidation with Interspecies Formate and Hydrogen Transfer
    target: Hydrogen- and Formate-Coupled Dissimilatory Sulfate Reduction
    description: Interspecies formate and hydrogen released during propionate oxidation by S. fumaroxidans
      MPOB supply the electron donors required for dissimilatory sulfate reduction by D. desulfuricans
      G11 in the propionate-plus-sulfate coculture; separate formate versus hydrogen flux partitioning
      and relative sulfate-reduction rates between the two sulfate reducers were not independently resolved.
  retained_edge_decisions:
  - edge: Syntrophic Propionate Oxidation with Interspecies Formate and Hydrogen Transfer -> Hydrogen-
      and Formate-Coupled Dissimilatory Sulfate Reduction
    action: keep_edge
    support_status: DIRECTLY_SUPPORTED
    reason: PMID:29611893 demonstrates that D. desulfuricans G11 cannot oxidize propionate directly and
      requires formate and H2 transferred from S. fumaroxidans MPOB propionate oxidation to drive dissimilatory
      sulfate reduction (confirmed by abundant periplasmic FDH3 G11_11530-11545, Hyd-3 G11_06350-06355,
      and AprA G11_01440 in the 2:1 coculture); bounded to note that formate versus H2 flux and relative
      sulfate reduction between the two partners were not quantitatively partitioned.
    evidence:
