    target: Drought Physiology Modulation
    description: 'SynCom inoculation modulated maize leaf temperature, turgor, and sap flow during drought across
      the commercial-hybrid treatment groups.

      '
  - source: Mature-Root SynCom Colonization
    target: Beneficial Resident Microbiota Recruitment
    description: 'Robust root colonization by the inoculated SynCom recruited and enriched beneficial microbes already
