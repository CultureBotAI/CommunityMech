limitations:
- All13 original nodes retained;11 original arrows reviewed,8 retained/qualified and3 removed. No new causal structure;
  existing root workflow-edge removals preserved.
- Three complete primary main texts and captions read, plus root embedded SI methods and Table S1. No original figure-pixel,
  separate supplementary-dataset, raw-data or executable-analysis audit; numerical results not independently recomputed.
  BioProtoc.2885 and the drought paper cited prior genomic study not independently reviewed.
- 'MBOA: preserve dropout, paired-culture and extracellular AMP evidence. Pooled main profiles are qualitative n=1;
  transport, acetylase, HMPAA toxicity and member-specific carbon use remain unresolved. Relative composition does
  not isolate growth mediation.'
- Drought:53-day relative root OTUs are not all-strain viable persistence. Prior genomic transporter enrichment
  is not induced activity or demonstrated exchange. Resident benefits and physiological mediation remain hypotheses.
  Late-drought temperature is higher; recovery and sensor/yield experiments differ, and yield benefits two hybrids,
  not SX.
- 'Root: absolute CFUs and unplanted controls establish a host-dependent community keystone effect, not direct pairwise
  competition. Fungal biocontrol is positive but colonization differences converge by day10; molecular, immune and
  competition mechanisms are untested.'
- 'Canonical taxonomy and raw non-graph blocks preserved, not recertified. Incomplete MBOA/drought rosters and missing
  drought host remain explicit; #1580 metadata follow-up stays OPEN and coordinates with #615. Prior #529 cultivation
  distinction preserved.'
- All920 caches unchanged;16 retained graph excerpts independently match fresh primary text after whitespace normalization.
  This does not certify historical cache/non-graph provenance. Public primary XML/HTML read without access bypass;
  root copyright license not asserted and full text remains scratch-only.
- 'Dedup870 all-state issue titles/bodies and26 scoped ignored/hidden local files; relevant #615/#276/#529 full
  bodies and graph histories read. Additional alias search done, not every PR/comment/local match. Self-review is
  not independent approval; repair issues stay OPEN until protected-main merge.'
- Adversarial diff refinement retains existing broad GO:0044419 interspecies-process context on MBOA and the first
  four drought nodes; it does not assert a specific resolved mechanism. Unsupported growth/immune-specific process
  annotations remain removed. Initial validation pass superseded by a complete final rerun; one event/history per
  record retained.
