  node_decisions:
  - node: Commercial Maize SynCom Inoculation
    rationale: Retain inoculation intervention and distinguish two experiments and an incomplete canonical roster.
  - node: Mature-Root SynCom Colonization
    rationale: Retain condition-specific relative root OTUs, not viable persistence of all isolates; remove gene-content
      causation.
  - node: Beneficial Resident Microbiota Recruitment
    rationale: Retain resident compositional shifts and hypothesized function without certifying beneficial taxa.
  - node: ABC Osmolyte Transporter Enrichment
    rationale: Retain prior genomic osmolyte-uptake potential and authors hypothesis, not in-vivo transfer.
  - node: Drought Physiology Modulation
    rationale: Retain measured physiology with late-drought warming and unisolated mediation.
  - node: Faster Rehydration Recovery
    rationale: Retain qualitative recovery with genotype exceptions; remove cross-assay temporal arrow to yield.
  - node: Reduced Maize Yield Loss
    rationale: Retain drought grain-yield benefit in two hybrids, not universal benefit or proven physiological
      mediation.
