  scope: Whole record and every original node/arrow; primary access scope bounded below.
  summary: Retain the controlled four-arm perturbation without unsupported niche-partitioning or single-ion attribution.;
    Bound the sulfate feature null to the measured relative abundances and week; preserve sulfate exposure and hydrogen-sulfide
    observations.; Keep relative DNA functional-potential measurements distinct from transcription, activity and
    causal mediation.; Preserve gas-specific factorial and pairwise outcomes without converting net emissions into
    individual pathway flux.
  renamed_nodes:
    Non-Sulfate Seawater Ions Drive Community And Emission Responses: Experimental Seawater-Ion Exposure
    Sulfate Alone Does Not Enrich Sulfate-Reduction Features: Week-12 Sulfate-Reduction Feature Response
    Artificial Seawater Alters Carbon Nitrogen And Phosphorus Gene Response: Relative Carbon Nitrogen And Phosphorus
      Gene Abundances
    Seawater-Ion Perturbation Of Greenhouse Gas Outputs: Week-12 Greenhouse-Gas Flux Response
  node_decisions:
  - node: Experimental Seawater-Ion Exposure
    rationale: Retain the controlled four-arm perturbation without unsupported niche-partitioning or single-ion
      attribution.
  - node: Week-12 Sulfate-Reduction Feature Response
    rationale: Bound the sulfate feature null to the measured relative abundances and week; preserve sulfate exposure
      and hydrogen-sulfide observations.
  - node: Relative Carbon Nitrogen And Phosphorus Gene Abundances
    rationale: Keep relative DNA functional-potential measurements distinct from transcription, activity and causal
      mediation.
  - node: Week-12 Greenhouse-Gas Flux Response
    rationale: Preserve gas-specific factorial and pairwise outcomes without converting net emissions into individual
      pathway flux.
  edges_before:
  - source: Non-Sulfate Seawater Ions Drive Community And Emission Responses
    target: Artificial Seawater Alters Carbon Nitrogen And Phosphorus Gene Response
    description: 'The non-sulfate seawater-ion treatment, rather than sulfate alone, drove the broader response
      of carbon, nitrogen, and phosphorus cycling genes.

      '
  - source: Non-Sulfate Seawater Ions Drive Community And Emission Responses
    target: Seawater-Ion Perturbation Of Greenhouse Gas Outputs
    description: 'Artificial seawater changed carbon dioxide, methane, and nitrous oxide emissions even when sulfate
      was omitted, linking non-sulfate ions to the greenhouse-gas response.

      '
  edges_after:
  - source: Experimental Seawater-Ion Exposure
    target: Relative Carbon Nitrogen And Phosphorus Gene Abundances
    description: The controlled ion mixtures altered relative DNA gene abundances at week 12, supporting a treatment
      effect on measured functional potential. PARTIAL - the responsible ions and biological mediators remain unresolved;
      this is not evidence of gene expression or activity changes.
  - source: Experimental Seawater-Ion Exposure
    target: Week-12 Greenhouse-Gas Flux Response
    description: Controlled seawater-ion exposure changed week-12 whole-core net gas fluxes in treatment-specific
      comparisons. PARTIAL - factorial mixture effects and individual pairwise contrasts differ, and community composition
      or gene correlations do not establish the mediators of each gas response.
