- path: kb/communities/Clostridium_Thermocellum_Saccharoperbutylacetonicum_Cellulosic_Butanol_Coculture.yaml
  id: CommunityMech:000208
  original_sha256: 368e5d952f21395ef6de9a0f39a8d95efb9926e67aa33ff832653e6c914e11b1
  record_sha256: 750b838217019c6d341bdb5d6e797acead41d051c49ba068e48bb58e1cff9f87
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261005-three-records-batch22.yaml
  scope: Whole record and every original node/arrow; primary access scope bounded below.
  summary: Retain proposed soluble-carbon cross-feeding and the positive staging control, with temperature and inoculum-carbon
    limits.; Represent selective solvent output with both participants, retaining the acetone and enzyme controls
    without inferred donation or pathway shutdown.; Retain lower hydrogen as a community association and an explicitly
    hypothesized redox contribution, not hydrogen transfer.
  renamed_nodes:
    Reduced Hydrogen Associated With Butanol Selectivity: Reduced Hydrogen Output and Proposed Redox Allocation
  node_decisions:
  - node: Staged Cellulose Hydrolysis Feeding Solventogenesis
    rationale: Retain proposed soluble-carbon cross-feeding and the positive staging control, with temperature and
      inoculum-carbon limits.
  - node: Selective Butanol Production With Low Acetone
    rationale: Represent selective solvent output with both participants, retaining the acetone and enzyme controls
      without inferred donation or pathway shutdown.
  - node: Reduced Hydrogen Output and Proposed Redox Allocation
    rationale: Retain lower hydrogen as a community association and an explicitly hypothesized redox contribution,
      not hydrogen transfer.
  edges_before:
  - source: Staged Cellulose Hydrolysis Feeding Solventogenesis
    target: Selective Butanol Production With Low Acetone
    description: 'C. thermocellum prehydrolysis of crystalline cellulose creates the substrate stream that feeds
      subsequent N1-4 solventogenesis and selective butanol production.

      '
  - source: Reduced Hydrogen Associated With Butanol Selectivity
    target: Selective Butanol Production With Low Acetone
    description: 'The exact-species coculture couples lower hydrogen evolution to a higher butanol ratio and low-acetone
      solvent profile.

      '
  edges_after:
  - source: Staged Cellulose Hydrolysis Feeding Solventogenesis
    target: Selective Butanol Production With Low Acetone
    description: PARTIAL - preincubation supplies hydrolysis products that can support N1-4 solventogenesis. The
      staged-versus-simultaneous comparison supports this process contribution, while coupled temperature changes
      and glucose carried in with the inoculum prevent selective flux attribution or a complete explanation of low
      acetone.
  - source: Reduced Hydrogen Output and Proposed Redox Allocation
    target: Selective Butanol Production With Low Acetone
    description: HYPOTHESIZED - reduced electron allocation to hydrogen could favor the butanol branch and contribute
      to solvent selectivity. The observed inverse association supports this redox proposal, not a selectively demonstrated
      causal effect or transfer of hydrogen between partners.
  retained_edge_decisions:
  - source: Staged Cellulose Hydrolysis Feeding Solventogenesis
    target: Selective Butanol Production With Low Acetone
    rationale: PARTIAL - preincubation supplies hydrolysis products that can support N1-4 solventogenesis. The staged-versus-simultaneous
      comparison supports this process contribution, while coupled temperature changes and glucose carried in with
      the inoculum prevent selective flux attribution or a complete explanation of low acetone.
  - source: Reduced Hydrogen Output and Proposed Redox Allocation
    target: Selective Butanol Production With Low Acetone
    rationale: HYPOTHESIZED - reduced electron allocation to hydrogen could favor the butanol branch and contribute
      to solvent selectivity. The observed inverse association supports this redox proposal, not a selectively demonstrated
      causal effect or transfer of hydrogen between partners.
