    rationale: SynCom17 inoculation altered the plant-microbe system and thereby changed the measured bulk spent-medium
      metabolite profile relative to the control treatments. This is a treatment-level effect; microbial versus
      plant production, uptake and extracellular enzyme activity were not separated.
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: SynCom17 Plant Biomass and Root Development Decrease
    rationale: The SynCom17 inoculation treatment reduced shoot biomass in the combined-laboratory comparison with
      axenic plants and reduced root development from 14 DAI onward. The experiment establishes a whole-treatment
      response, not OAS925-only toxicity, competition for a specific nutrient or one necessary member.
  - source: Paraburkholderia Acid-Tolerant Root Colonization Traits
    target: Paraburkholderia-Dominated SynCom17 Root Assembly
    rationale: HYPOTHESIZED - acid-tolerant motility, colonization traits and associated genomic modules may help
      OAS925 establish and expand on roots, contributing to its relative dominance. Separate isolate assays and
      gene annotation support candidate mechanisms, but none was selectively disrupted or rescued in the 17-member
      community.
  removed_edge_decisions:
