  summary: Retain three whole-treatment effects without colonization facilitation or symbiotic-process claims.;
    Retain intrinsic OAS925 traits with only a hypothesized contribution to dominance.; Retain relative community
    composition without competition or metabolome mediation.; Retain net spent-medium profiles without assigning
    direct cross-feeding.; Retain measured whole-treatment plant growth effects without a competition mechanism.
  renamed_nodes: {}
  node_decisions:
  - node: SynCom17 EcoFAB Ring-Trial Perturbation
    rationale: Retain three whole-treatment effects without colonization facilitation or symbiotic-process claims.
  - node: Paraburkholderia Acid-Tolerant Root Colonization Traits
    rationale: Retain intrinsic OAS925 traits with only a hypothesized contribution to dominance.
  - node: Paraburkholderia-Dominated SynCom17 Root Assembly
    rationale: Retain relative community composition without competition or metabolome mediation.
  - node: Treatment-Structured Rhizosphere Exometabolites
    rationale: Retain net spent-medium profiles without assigning direct cross-feeding.
  - node: SynCom17 Plant Biomass and Root Development Decrease
    rationale: Retain measured whole-treatment plant growth effects without a competition mechanism.
  removed_node_decisions:
  - node: Nitrogen-Status EcoFAB Root Exudation
    rationale: Separate sterile-plant nitrogen experiment and individual bacterial bioassays are not SynCom17 community
      evidence.
  edges_before:
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: 'The standardized SynCom17 treatment yielded root communities that reproducibly converged on high
      Paraburkholderia abundance across laboratories.

      '
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: Treatment-Structured Rhizosphere Exometabolites
    description: 'SynCom17 was one of the ring-trial treatments that drove reproducible, treatment-dependent changes
      in the spent EcoFAB medium metabolome.

      '
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: SynCom17 Plant Biomass and Root Development Decrease
    description: 'The standardized SynCom17 treatment caused reproducible B. distachyon root-development decreases
      across laboratories and reduced shoot biomass relative to axenic plants.

      '
  - source: Paraburkholderia Acid-Tolerant Root Colonization Traits
    target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: 'Acid-resistance genes, a unique T3SS module, biofilm formation, and rapid acidic-condition motility
      provided candidate mechanisms for Paraburkholderia dominance in the full SynCom17 root microbiome.

      '
  - source: Paraburkholderia-Dominated SynCom17 Root Assembly
    target: Treatment-Structured Rhizosphere Exometabolites
    description: 'The Paraburkholderia-dominated SynCom17 root community modulated the rhizosphere exometabolite
      profile relative to axenic and SynCom16 treatments, including decreased amino-acid relative concentrations.

      '
  edges_after:
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: SynCom17 inoculation supplied the 17-member community from which the OAS925-dominated root profile
      developed by 22 DAI. The SynCom16 omission comparison supports an inoculum-composition effect, not identification
      of the molecular mechanism or absolute loss of the other members.
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: Treatment-Structured Rhizosphere Exometabolites
    description: SynCom17 inoculation altered the plant-microbe system and thereby changed the measured bulk spent-medium
      metabolite profile relative to the control treatments. This is a treatment-level effect; microbial versus
      plant production, uptake and extracellular enzyme activity were not separated.
  - source: SynCom17 EcoFAB Ring-Trial Perturbation
    target: SynCom17 Plant Biomass and Root Development Decrease
    description: The SynCom17 inoculation treatment reduced shoot biomass in the combined-laboratory comparison
      with axenic plants and reduced root development from 14 DAI onward. The experiment establishes a whole-treatment
      response, not OAS925-only toxicity, competition for a specific nutrient or one necessary member.
  - source: Paraburkholderia Acid-Tolerant Root Colonization Traits
    target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: HYPOTHESIZED - acid-tolerant motility, colonization traits and associated genomic modules may help
      OAS925 establish and expand on roots, contributing to its relative dominance. Separate isolate assays and
      gene annotation support candidate mechanisms, but none was selectively disrupted or rescued in the 17-member
      community.
  retained_edge_decisions:
