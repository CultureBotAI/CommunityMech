- path: kb/communities/Ecoli_Bifidobacterium_bifidum_Infant_gut_HMO_Mutualism_Coculture.yaml
  id: CommunityMech:000296
  original_sha256: f4b35253c42baaaf97642de2cad0480f6bc362c0f10191c3e8317dd6cfbc1041
  record_sha256: 31e420e8e1553817b77ff5bde0d4229ee09eca2cbf62e5d6524a275801475627
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261006-three-records-batch36.yaml
  scope: Whole record and every existing node/arrow assessed against primary text at recorded access scope; non-graph
    fields preserved, not certified.
  summary: Retain cysteine-dependent support with mutant and viability controls and unresolved release route.; Retain
    measured fucose/galactose return with its pH constraint and partial donor-maintenance feedback.; Retain reciprocal
    mutualism as an in vitro summary, not an independently measured host endpoint.
  renamed_nodes: {}
  node_decisions:
  - node: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    rationale: Retain cysteine-dependent support with mutant and viability controls and unresolved release route.
  - node: Monosaccharide return sustaining E. coli growth
    rationale: Retain measured fucose/galactose return with its pH constraint and partial donor-maintenance feedback.
  - node: Cooperative Infant-Gut HMO Mutualism
    rationale: Retain reciprocal mutualism as an in vitro summary, not an independently measured host endpoint.
  removed_node_decisions: []
  edges_before:
  - source: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    target: Monosaccharide return sustaining E. coli growth
    description: 'Cysteine supplied by E. coli enables B. bifidum to cooperatively degrade 2''-fucosyllactose, liberating
      monosaccharides that return carbon to E. coli.

      '
  - source: Monosaccharide return sustaining E. coli growth
    target: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    description: 'Monosaccharides returned from B. bifidum sustain E. coli growth and close the cooperative loop
      that maintains cysteine provisioning to the auxotroph.

      '
  - source: Monosaccharide return sustaining E. coli growth
    target: Cooperative Infant-Gut HMO Mutualism
    description: 'Reciprocal cysteine and monosaccharide exchange completes the cooperative HMO-fed loop between
      E. coli and B. bifidum.

      '
  edges_after:
  - source: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    target: Monosaccharide return sustaining E. coli growth
    description: Cysteine-dependent support from E. coli permits the auxotrophic B. bifidum partner to grow and
      degrade 2-fucosyllactose under the tested nutrient limitation, releasing sugar substrates usable by E. coli.
      The mutant and killed-partner controls support the dependency; the sugar-consumption assay separately required
      spent-medium pH adjustment to 6.3.
  - source: Monosaccharide return sustaining E. coli growth
    target: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    description: PARTIAL - accessible HMO-derived sugars sustain E. coli growth and can maintain the donor population
      supporting the cysteine-dependent partner. Reciprocal nutrient dependence is experimentally supported, but
      a time-resolved sugar-to-cysteine feedback gain or isotope-resolved flux was not measured; the separate spent-medium
      assay required pH 6.3.
  retained_edge_decisions:
  - source: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    target: Monosaccharide return sustaining E. coli growth
    rationale: Cysteine-dependent support from E. coli permits the auxotrophic B. bifidum partner to grow and degrade
      2-fucosyllactose under the tested nutrient limitation, releasing sugar substrates usable by E. coli. The mutant
      and killed-partner controls support the dependency; the sugar-consumption assay separately required spent-medium
      pH adjustment to 6.3.
  - source: Monosaccharide return sustaining E. coli growth
    target: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
    rationale: PARTIAL - accessible HMO-derived sugars sustain E. coli growth and can maintain the donor population
      supporting the cysteine-dependent partner. Reciprocal nutrient dependence is experimentally supported, but
      a time-resolved sugar-to-cysteine feedback gain or isotope-resolved flux was not measured; the separate spent-medium
      assay required pH 6.3.
  removed_edge_decisions:
  - source: Monosaccharide return sustaining E. coli growth
    target: Cooperative Infant-Gut HMO Mutualism
    rationale: Mutualism summarizes the two exchange components; a part/whole restatement is not an independent
      causal consequence.
