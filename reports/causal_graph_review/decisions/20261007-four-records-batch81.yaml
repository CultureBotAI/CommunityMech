  edges_after:
  - source: Proposed H2 Oxidation Competition with Methanogenesis
    target: Reduced Methane Emissions and Proposed H2 Limitation
    description: HYPOTHESIZED - Greater bacterial H2 consumption could reduce substrate available for hydrogenotrophic
      methanogenesis and contribute to lower methane. Transcript patterns and individual metabolic models support
      this mechanism indirectly; H2 depletion, pairwise competition and the fraction of methane reduction mediated
      by this route were not directly isolated.
  - source: PSY Root Exudate Effects and Proposed Bacterial Substrate Preference
    target: Proposed H2 Oxidation Competition with Methanogenesis
    description: PARTIAL - Altered exudate composition may support biomass and activity of H2-consuming guilds enriched
      for gluconeogenic-acid use, indirectly contributing to the proposed H2 competition. The model predicts little
      direct effect of exudate enrichment on H2 oxidation itself; increased oxidation responds mainly to O2. Whole-exudate
      methane suppression is experimentally supported but does not resolve this specific mediator.
  - source: Reduced H2-Producing Transcripts and Modeled H2 Supply
    target: Reduced Methane Emissions and Proposed H2 Limitation
    description: HYPOTHESIZED - Lower H2-generating activity could restrict substrate supply for hydrogenotrophic
      methanogenesis. Gene-expression patterns and predicted H2 flux are consistent with this direction, but do
      not measure the shared H2 pool or isolate the causal contribution to greenhouse CH4 reduction.
