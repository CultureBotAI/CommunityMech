  - node: Dual-pathway Methanogenesis by M. barkeri
    rationale: Preserve positive methane and monoculture perturbation results while distinguishing pair mass balance
      from tri-culture pathway allocation.
  - node: Sulfate-mediated Competition
    rationale: Preserve sulfate-treatment phenotypes without selectively proven tri-culture competition mediation.
