  - source: Persistence Traits Encoded in Genomes
    target: Bacteroides and Bifidobacterium First-Year Persistence
    description: Genes for surface adhesion, iron acquisition, and carbohydrate degradation were enriched in persistent
      strains, providing functional traits that may explain their first-year retention.
  edges_after:
