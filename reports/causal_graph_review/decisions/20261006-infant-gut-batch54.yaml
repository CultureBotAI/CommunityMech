  review_file: reports/causal_graph_review/decisions/20261006-infant-gut-batch54.yaml
  scope: Whole record and every original node/arrow; primary-source-bounded existing structure repair.
  summary: Bound phage persistence to strain-resolved associations and partial maternal/recoding mechanisms.
  renamed_nodes:
    Maternal Phage Seeding and Long-Term Persistence: Maternal Phage Sharing and Persistence Association
    Stop-Codon Reassignment Promotes Phage Persistence: Stop-Codon Reassignment and Phage Persistence Association
    Stable Infant Viral Colonization: Persistent Infant Phage Strains
  node_decisions:
  - node: Maternal Phage Sharing and Persistence Association
    rationale: Preserve maternal sharing and persistence without universal predation or a wrong denominator.
  - node: Stop-Codon Reassignment and Phage Persistence Association
    rationale: Preserve recoding association while distinguishing heterogeneous trajectories from causal lysis effects.
  - node: Increasing Phageome Richness Toward Adulthood
    rationale: Preserve developmental community richness without conflating within-phage diversity or restoring
      an unsupported arrow.
  - node: Persistent Infant Phage Strains
    rationale: Preserve strain-defined persistence and cohort scope without a fully resolved joint mechanism.
  removed_node_decisions: []
  edges_before:
  - source: Maternal Phage Seeding and Long-Term Persistence
    target: Stable Infant Viral Colonization
    description: Maternal transfer of Bacteroides-infecting early phages is one of the determinants that lets a
      subset of infant gut phages colonize stably across early life.
  - source: Stop-Codon Reassignment Promotes Phage Persistence
    target: Stable Infant Viral Colonization
    description: Stop-codon reassignment marks phages that persist more often than non-recoded phages across the
      first 3 years of life.
  - source: Increasing Phageome Richness Toward Adulthood
    target: Stable Infant Viral Colonization
    description: Increasing early-life phageome richness supplies the diverse phage populations associated with
      stable infant gut viral colonization.
  edges_after:
  - source: Maternal Phage Sharing and Persistence Association
    target: Persistent Infant Phage Strains
    description: PARTIAL - maternally shared phages may be adapted to the gut or repeatedly introduced, supporting
      subsequent strain persistence. The longitudinal sharing association supports this model but does not isolate
      maternal transmission, reseeding or infection direction experimentally.
  - source: Stop-Codon Reassignment and Phage Persistence Association
    target: Persistent Infant Phage Strains
    description: PARTIAL - stop-codon reassignment could alter phage expression or lysis timing and thereby support
      persistence. Enrichment among persisters and heterogeneous sequence trajectories support the proposed mechanism,
      not a recoding perturbation demonstrating its necessity or sufficiency.
  retained_edge_decisions:
