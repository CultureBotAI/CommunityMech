  actual_read_scope:
  - All four whole canonical records and existing graph snippets read; fresh primary abstracts and Crossref identities
    checked. Tropidoatractus and Variovorax complete main-body XML text, methods/results/discussion and captions
    read. No original figure-pixel, supplementary-file or raw-data audit. Existing cache snippets independently
    match those fresh sources; not a claim that all unrelated cache furniture was read.
  - Tribromophenol and urine repairs are final-publication abstract-bounded. Publisher and institutional records
    provided abstracts; published urine PDF is institution-restricted. A public earlier thesis chapter was identified
    but not read or substituted for the final publication. Full texts were not read; no access bypass or exhaustive
    alternate-source search claimed.
  - Tribromophenol retains sequential assembly, enriched FTH1 identity and experimentally reported mineralization.
    The radiotracer was phenol,not labeled tribromophenol. No reciprocal benefit or exhaustive three-isolate membership
    is inferred.
  - Tropidoatractus retains physical magnetotaxis evidence while hydrogen flux,energetic benefit and survival dependence
    remain proposed. FISH failed; native polarity after Munich storage is unresolved. Optional type omitted instead
    of forcing MUTUALISM,consistent with existing issue749; no schema change.
  - Urine graph distinguishes R1 ammonium-fed pair,R2 urine-fed community and batch activity tests. No transfer
    of salt tolerance or rates between assays; no spaceflight or fertilizer-readiness claim. Individual heterotroph
    contributions are not quantified by the abstract.
  - Variovorax retains experimentally supported mutualism and vitamin evidence. The yeast was not a correlation-network
    node. Abstract/discussion,Fig6caption and Results densities disagree on fold changes; Results and Methods differ
    on spent-medium source. No corrected value/source invented. Exclusive vitamin mediation and native bioreactor
    pairing remain unresolved.
