  review_file: reports/causal_graph_review/decisions/20261006-clostridium-batch45.yaml
  scope: Whole record and every original node/arrow reviewed; measurements distinguished from inferred mediator.
  summary: Qualify growth-inferred electron transfer and its one retained arrow; restrict product yields to responding
    cultures; remove duplicate outcome and unsupported mutualism; correct controversy and exact anchors.
  renamed_nodes:
    Acetate Oxidation and Interspecies Electron Transfer: Proposed Acetate Oxidation and Interspecies Electron Transfer
    Glycerol Fermentation with Electron-Transfer-Induced Metabolic Shift: Coculture-Associated Glycerol Fermentation
      Product Shift
  node_decisions:
  - node: Proposed Acetate Oxidation and Interspecies Electron Transfer
    rationale: Retain only the HYPOTHESIZED growth-based acetate/IET model with both canonical participants; not
      measured uptake or demonstrated syntrophy.
  - node: Coculture-Associated Glycerol Fermentation Product Shift
    rationale: Retain conditional measured product yields, remove mutualism and unproven electron-chain annotation;
      incorporate duplicate outcome evidence.
  removed_node_decisions:
  - node: Increased 1,3-Propanediol and Butyrate Production
    rationale: Same product shift as the fermentation-response node, not a distinct downstream causal event; preserve
      its evidence in the surviving response.
  edges_before:
  - source: Acetate Oxidation and Interspecies Electron Transfer
    target: Glycerol Fermentation with Electron-Transfer-Induced Metabolic Shift
    description: Electrons taken up from G. sulfurreducens induce the metabolic shift in C. pasteurianum toward
      1,3-propanediol and butyrate. The transfer route is unresolved, so this edge asserts electron uptake causing
      the shift, not a contact-dependent mechanism.
  - source: Glycerol Fermentation with Electron-Transfer-Induced Metabolic Shift
    target: Increased 1,3-Propanediol and Butyrate Production
    description: The electron-transfer-induced metabolic shift redirects glycerol fermentation products toward higher
      1,3-propanediol and butyrate yields.
  edges_after:
  - source: Proposed Acetate Oxidation and Interspecies Electron Transfer
    target: Coculture-Associated Glycerol Fermentation Product Shift
    description: 'HYPOTHESIZED: Acetate-derived electron transfer could alter Clostridium redox regulation and thereby
      its glycerol-fermentation product profile. Growth/product associations and an assumed electron balance motivate
      this direction, but do not selectively establish electron uptake as the mediator. The follow-up proposes cobamides
      and possible electron entry as alternatives or contributors, not verified replacements.'
  retained_edge_decisions:
  - source: Proposed Acetate Oxidation and Interspecies Electron Transfer
    target: Coculture-Associated Glycerol Fermentation Product Shift
    description: 'HYPOTHESIZED: Acetate-derived electron transfer could alter Clostridium redox regulation and thereby
      its glycerol-fermentation product profile. Growth/product associations and an assumed electron balance motivate
      this direction, but do not selectively establish electron uptake as the mediator. The follow-up proposes cobamides
      and possible electron entry as alternatives or contributors, not verified replacements.'
    rationale: Explicit hypothesis of redox-mediated product regulation; association and assumed balance do not
      selectively prove the mediator.
  removed_edge_decisions:
  - source: Glycerol Fermentation with Electron-Transfer-Induced Metabolic Shift
    target: Increased 1,3-Propanediol and Butyrate Production
    description: The electron-transfer-induced metabolic shift redirects glycerol fermentation products toward higher
      1,3-propanediol and butyrate yields.
    rationale: A product-profile shift causing the same product-profile shift is a restatement, not a separate causal
      link.
