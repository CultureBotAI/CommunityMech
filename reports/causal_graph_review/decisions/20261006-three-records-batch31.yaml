  summary: Retain positive butyrate-fed hydrogen support with assay, cofactor and late-stage growth limits.; Represent
    recipient dechlorination without reverse transfer or growth-coupled vinyl-chloride respiration.; Keep joint
    aggregates and their conditional diffusion-model contribution while leaving new CO structure pending.
  renamed_nodes: {}
  node_decisions:
  - node: Butyrate Fermentation Supporting TCE Dechlorination
    rationale: Retain positive butyrate-fed hydrogen support with assay, cofactor and late-stage growth limits.
  - node: Reductive Dechlorination by Dehalococcoides
    rationale: Represent recipient dechlorination without reverse transfer or growth-coupled vinyl-chloride respiration.
  - node: Aggregation-Enhanced Hydrogen Flux
    rationale: Keep joint aggregates and their conditional diffusion-model contribution while leaving new CO structure
      pending.
  removed_node_decisions: []
  edges_before:
  - source: Butyrate Fermentation Supporting TCE Dechlorination
    target: Reductive Dechlorination by Dehalococcoides
    description: 'Hydrogen produced during syntrophic butyrate oxidation by S. wolfei supplies the electron donor
      D. mccartyi 195 uses for TCE dechlorination; the coupling is demonstrated by nanomolar aqueous H2 during dechlorination
      and the strain-195 minimum H2 threshold.

      '
  - source: Aggregation-Enhanced Hydrogen Flux
    target: Reductive Dechlorination by Dehalococcoides
    description: 'Cell aggregation shortens the interspecies distance and sustains the hydrogen flux required for
      the observed TCE dechlorination rates (supported by the reported need for aggregation; lower-confidence than
      the direct H2-threshold edge).

      '
  edges_after:
  - source: Butyrate Fermentation Supporting TCE Dechlorination
    target: Reductive Dechlorination by Dehalococcoides
    description: Hydrogen from S. wolfei butyrate oxidation supplies the electron donor for strain-195 TCE dechlorination,
      while recipient consumption maintains a favorable hydrogen sink. The separate donor-limited minimum-threshold
      assay is not the routine culture concentration. Later residual butyrate consumption and cometabolic vinyl-chloride
      conversion do not establish continued growth after the growth-supporting acceptors are depleted.
  - source: Aggregation-Enhanced Hydrogen Flux
    target: Reductive Dechlorination by Dehalococcoides
    description: PARTIAL - aggregation could shorten diffusion distances and thereby support hydrogen delivery to
      strain 195 at the measured dechlorination rate. This mechanistic contribution is inferred from the diffusion
      model together with observed aggregates, not from selective disruption and rescue of aggregation.
  retained_edge_decisions:
