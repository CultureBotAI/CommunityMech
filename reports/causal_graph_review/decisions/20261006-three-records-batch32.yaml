  - source: D. vulgaris Hydrogenase-Cytochrome Electron Transfer
    target: Interspecies Hydrogen Transfer and Methanogenesis
    description: PARTIAL - donor electron-transfer machinery supports hydrogen provision to the methanogen. Genetic
