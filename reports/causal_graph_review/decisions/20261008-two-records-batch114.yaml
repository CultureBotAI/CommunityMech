- path: kb/communities/Thermotoga_Methanocaldococcus_Hyperthermophilic_Syntrophy.yaml
  id: CommunityMech:000186
  original_sha256: d095e9932a413f4245883e31e174605d1a246e821a10945d4009c99517e99b89
  record_sha256: 05b09dc41d9f2e54eac83d1021d69d2ea733144e9e5386295dd99cc9cae6293c
  status: reviewed
  outcome: changed
  review_file: reports/causal_graph_review/decisions/20261008-two-records-batch114.yaml
  scope: Whole record and all existing nodes/arrows reviewed; existing-graph repair, not whole-record certification.
  summary: Retain supported hydrogen syntrophy and separate study-specific density effects; qualify the existing
    arrow as partial mediation through the higher-density context.; Recast proximity as an explicit two-participant
    community observation; retain a PARTIAL transport interpretation without colonization or mandatory-contact typing.;
    Recast growth-phase aggregation/transcription as a community phenotype, with the exact within-culture 292-versus-24
    contrast and no extra exchange claim.
  node_decisions:
  - node: Interspecies Hydrogen Transfer
    rationale: Retain supported hydrogen syntrophy and separate study-specific density effects; qualify the existing
      arrow as partial mediation through the higher-density context.
  - node: Spatially Proximate Methanogenic Coculture
    rationale: Recast proximity as an explicit two-participant community observation; retain a PARTIAL transport
      interpretation without colonization or mandatory-contact typing.
  - node: Coculture-Associated Aggregation and Transcriptome Shift
    rationale: Recast growth-phase aggregation/transcription as a community phenotype, with the exact within-culture
      292-versus-24 contrast and no extra exchange claim.
  removed_node_decisions: []
  renamed_nodes: {}
  edges_before:
  - &id005
    source: Interspecies Hydrogen Transfer
    target: Coculture-Associated Aggregation and Transcriptome Shift
    description: Sustained interspecies hydrogen transfer places T. maritima in the methanogenic coculture state
      that changes its transcriptome and promotes EPS-based aggregation.
  - &id007
    source: Spatially Proximate Methanogenic Coculture
    target: Interspecies Hydrogen Transfer
    description: Close spatial proximity allows transferred hydrogen to reach M. jannaschii and establish the methanogenic
      coculture.
  edges_after:
  - &id006
    source: Interspecies Hydrogen Transfer
    target: Coculture-Associated Aggregation and Transcriptome Shift
    description: 'PARTIAL: hydrogen removal relieves growth inhibition and enables the higher-density coculture
      context in which aggregation and altered growth-phase transcription were observed. Hydrogen-removal comparisons
      support a contribution to physiology, but do not selectively demonstrate mediation of every EPS or transcript
      response by hydrogen transfer alone. Growth phase, population density and culture/gas-handling conditions
      remain part of this causal interpretation.'
  - &id008
    source: Spatially Proximate Methanogenic Coculture
    target: Interspecies Hydrogen Transfer
    description: 'PARTIAL: proximity can reduce the transport distance for hydrogen from the fermenter to the methanogen,
      helping establish hydrogen-transfer syntrophy. Failure across a dialysis membrane and size-fraction association
      support this interpretation, but do not uniquely identify diffusion distance, direct contact or a specific
      attachment mechanism as the cause.'
  retained_edge_decisions:
  - before: *id005
    after: *id006
    rationale: 'PARTIAL: hydrogen removal relieves growth inhibition and enables the higher-density coculture context
      in which aggregation and altered growth-phase transcription were observed. Hydrogen-removal comparisons support
      a contribution to physiology, but do not selectively demonstrate mediation of every EPS or transcript response
