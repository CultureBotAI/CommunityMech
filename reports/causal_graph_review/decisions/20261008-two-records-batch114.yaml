  scope: Whole record and all existing nodes/arrows reviewed; existing-graph repair, not whole-record certification.
  summary: Retain acetate-linked syntrophy and the reversible pathway; distinguish extracellular carriers from cofactors
    and avoid all-substrate obligacy.; Retain hydrogen-removing methanogenesis with exact TM/PB expression and hydrogen-pressure
    context; do not exclude formate use or import DeltaH/butyrate results.; Retain indirectly supported formate
    transfer as PARTIAL, with the detailed ATP/proton-coupled mechanism HYPOTHESIZED rather than established.
  node_decisions:
  - node: Syntrophic Acetate Oxidation by Thermacetogenium
    rationale: Retain acetate-linked syntrophy and the reversible pathway; distinguish extracellular carriers from
      cofactors and avoid all-substrate obligacy.
  - node: Hydrogenotrophic Methanogenesis by Methanothermobacter
    rationale: Retain hydrogen-removing methanogenesis with exact TM/PB expression and hydrogen-pressure context;
      do not exclude formate use or import DeltaH/butyrate results.
  - node: Formate-Linked Syntrophic Electron Transfer
    rationale: Retain indirectly supported formate transfer as PARTIAL, with the detailed ATP/proton-coupled mechanism
      HYPOTHESIZED rather than established.
  removed_node_decisions: []
  renamed_nodes:
    Formate Transfer to the Methanogenic Partner: Formate-Linked Syntrophic Electron Transfer
  edges_before:
  - &id001
    source: Syntrophic Acetate Oxidation by Thermacetogenium
    target: Hydrogenotrophic Methanogenesis by Methanothermobacter
    description: 'T. phaeum acetate oxidation produces low-concentration reduced carriers that M. thermautotrophicus
      consumes during hydrogenotrophic methanogenesis.

      '
  - &id003
    source: Formate Transfer to the Methanogenic Partner
    target: Hydrogenotrophic Methanogenesis by Methanothermobacter
    description: 'Formate and reducing equivalents generated by T. phaeum are transferred to the methanogenic partner
      that completes syntrophic acetate oxidation.

      '
  edges_after:
  - &id002
    source: Syntrophic Acetate Oxidation by Thermacetogenium
    target: Hydrogenotrophic Methanogenesis by Methanothermobacter
    description: Acetate oxidation by T. phaeum supplies reduced products for the methanogenic partner, coupling
      acetate conversion to methane formation. Hydrogen consumption is supported by the TM/PB coculture experiments;
      PARTIAL for the partition of electron flow between hydrogen and formate and the specific formate-producing
      energy-conservation model. This is not direct acetate utilization by the methanogen.
  - &id004
    source: Formate-Linked Syntrophic Electron Transfer
    target: Hydrogenotrophic Methanogenesis by Methanothermobacter
    description: 'PARTIAL: formate produced by T. phaeum can supply reducing equivalents to the formate-utilizing
      TM partner for methanogenesis, while removal helps maintain favorable acetate oxidation. HYPOTHESIZED for
      the specific proton-coupled production mechanism; this arrow does not establish its in vivo flux or convert
      formate utilization into hydrogen-only metabolism.'
