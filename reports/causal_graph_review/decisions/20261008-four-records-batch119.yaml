  summary: Retain the abiotic enrichment design and its two selection arrows without asserting niche partitioning.;
    Preserve carbon-associated ASV sorting with representative participants and no inferred substrate flux.; Define
    fast/slow as operational abundance classes rather than growth-rate measurements or hub membership.; Keep transfer-specific
    hubs computational and distinguish centrality from ecological necessity.; Keep recurring hubs as statistical
    observations without assigning validated PGP or stability function.; Retain reproducible revival only for the
    five selected stocks and separate it from initial enrichment stability.
  node_decisions:
  - node: Root Exudate-Mimicking Enrichment Assembly
    rationale: Retain the abiotic enrichment design and its two selection arrows without asserting niche partitioning.
  - node: Carbon-Source ASV Sorting
    rationale: Preserve carbon-associated ASV sorting with representative participants and no inferred substrate
      flux.
  - node: Transfer-interval ASV abundance classification
    rationale: Define fast/slow as operational abundance classes rather than growth-rate measurements or hub membership.
  - node: Transfer-interval association-network hubs
    rationale: Keep transfer-specific hubs computational and distinguish centrality from ecological necessity.
  - node: Recurring association-network hubs
    rationale: Keep recurring hubs as statistical observations without assigning validated PGP or stability function.
  - node: 1/10 R2A Glycerol Stock Revival
    rationale: Retain reproducible revival only for the five selected stocks and separate it from initial enrichment
      stability.
