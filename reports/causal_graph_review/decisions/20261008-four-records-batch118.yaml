  actual_read_scope:
  - Fresh EuropePMC abstracts and Crossref identities checked for all four. Watermelon and wetland complete main-body
    XML text including methods/results/discussion,table text and captions read. No original figure pixels,separate
    supplementary files,raw data or wetland model code audited. Snippet matching does not establish entailment.
  - Viili and sludge repairs are abstract-bounded. DOI/publisher search yielded accessible abstracts; no open full
    text was inspected. No exhaustive absence claim,access bypass,publication-body import or cache change.
  - Viili retains experimental nutrient provision and AI-2 perturbation support; nitrogen-to-signaling mediation
    remains PARTIAL and regulation is not nutrient transfer. Prior tested-combination EPS and no-EPS-as-nitrogen
    fixes1014/1015 preserved.
  - Sludge compartment roles remain representative enrichments. EET arrows retain partial least squares model support
    without route-specific intervention or thermodynamic-dependency claims. Scientific observations are not discarded
    because causal mediation is inferred.
  - Watermelon retains seven positive spent-medium effects and three mutually beneficial pairs,not seven mutualisms.
    SSC8 growth assay used no added pathogen. Parent16-member disease/biofilm results are not SSC8 outcomes; candidate
    metabolites are not specific causal mediators or stereochemically resolved exchange. Missing SSC8 roster/non-graph
    fields remain issue1919.
  - Wetland measured gas effects remain; marker proteins/fitted fluxes are not pathway-resolved direct flux measurements.
    Removed arrows confused shared exposure with succession. Results/discussion contain differences about additivity
    and oxygen-linked routes; no silent resolution or universal-zero methane claim. Non-graph vessel/ingredient
    evidence issues remain1920.
