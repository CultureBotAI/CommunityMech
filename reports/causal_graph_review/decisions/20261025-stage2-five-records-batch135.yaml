  scope: Whole record read; every graph node, scope, participant, and directed downstream causal edge
    verified against cached primary source text.
  summary: Expanded the 2-node reactor graph into a 3-node, 2-edge causal mechanism separating (1) magnetite-driven
    Thiobacillus oxidation of elemental sulfur to sulfate (GO:0019417 sulfur oxidation; 6.85% vs 4.49%
    aggregate sulfur retention), (2) sulfur-cycle-coupled anaerobic phenol degradation (354.2 vs 1256.0
    mgCOD/L) and Cr(VI) reduction (18.0 vs 187.7 mg/L), and (3) dissimilatory Fe(II)-mediated dissolved
    oxygen scavenging that prevents Cr(III) re-oxidation in reactor aggregates.
  node_decisions:
  - node: Magnetite-Driven Thiobacillus Oxidation of Elemental Sulfur to Sulfate
    rationale: Supported by primary source (doi:10.1016/j.cej.2020.124801) with explicit COMMUNITY_LEVEL
      scope and taxon grounding.
    field_path: ecological_interactions[0]
    source_locator: Abstract and cached text (doi:10.1016/j.cej.2020.124801)
    scope: COMMUNITY_LEVEL
    participants:
      source_taxon:
        preferred_term: Thiobacillus
        term:
          id: NCBITaxon:919
          label: Thiobacillus
    evidence:
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The study presented here utilized magnetite as an Fe(III) source to enrich the chemolithotrophic
        sulphur-oxidizing bacteria to proceed the oxidation of the elemental sulphur, which further achieved
        the whole sulphur cycle.
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Conversely, with magnetite, the special enrichments, Thiobacillus species, proceeded the
        oxidation of the elemental sulphur to sulphate, lowering the loss of sulphur.
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The results showed that, under the low-concentration sulphate conditions, the effluent
        concentration of both Cr(VI) (18.0 mg/L vs 187.7 mg/L) and phenol (354.2 mgCOD/L vs 1256.0 mgCOD/L)
        in the reactor with magnetite was significantly lower than that without magnetite.
  - node: Sulfur-Cycle-Coupled Anaerobic Phenol Degradation and Cr(VI) Reduction
    rationale: Supported by primary source (doi:10.1016/j.cej.2020.124801) with explicit COMMUNITY_LEVEL
      scope and taxon grounding.
    field_path: ecological_interactions[1]
    source_locator: Abstract and cached text (doi:10.1016/j.cej.2020.124801)
    scope: COMMUNITY_LEVEL
    participants:
      source_taxon:
        preferred_term: Thiobacillus
        term:
          id: NCBITaxon:919
          label: Thiobacillus
    evidence:
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The results showed that, under the low-concentration sulphate conditions, the effluent
        concentration of both Cr(VI) (18.0 mg/L vs 187.7 mg/L) and phenol (354.2 mgCOD/L vs 1256.0 mgCOD/L)
        in the reactor with magnetite was significantly lower than that without magnetite.
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Further analysis by X-ray Diffraction (XRD) and X-ray photoelectron spectroscopy (XPS)
        observed the disappearance of the crystalline structure in magnetite as well as the loss of iron
        via the dissimilatory Fe(III) reduction in the aggregates.
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Considered that the re-oxidation of the reduced Cr(III) might occur in the aggregates without
        magnetite, the generated Fe(II) might react with the slight dissolved oxygen (DO) to reduce the
        re-oxidation of the reduced Cr(III), which further achieved the transformation of Fe(III)/Fe(II).
  - node: Dissimilatory Fe(II)-Mediated Dissolved Oxygen Scavenging and Cr(III) Stabilization
    rationale: Supported by primary source (doi:10.1016/j.cej.2020.124801) with explicit COMMUNITY_LEVEL
