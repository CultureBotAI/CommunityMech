      source_taxon:
        preferred_term: Thiobacillus
        term:
          id: NCBITaxon:919
          label: Thiobacillus
    evidence:
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Further analysis by X-ray Diffraction (XRD) and X-ray photoelectron spectroscopy (XPS)
        observed the disappearance of the crystalline structure in magnetite as well as the loss of iron
        via the dissimilatory Fe(III) reduction in the aggregates. However, under the sulphate-reducing
        conditions, the evident peaks of both Fe2O3 and FeO were detected in the aggregates.
    - reference: doi:10.1016/j.cej.2020.124801
      supports: SUPPORT
      evidence_source: IN_VITRO
