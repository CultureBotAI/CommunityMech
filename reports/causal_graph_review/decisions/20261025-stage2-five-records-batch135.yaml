        term:
          id: NCBITaxon:1386088
          label: Intrasporangium chromatireducens
    evidence:
    - reference: PMID:21441371
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: A gram-positive, aerobic actinobacterium with high chromate [Cr(VI)]-reducing ability,
        designated strain Q5-1(T), was isolated from manganese mining soil in Hunan Province, central-south
        China.
    - reference: doi:10.1007/s11274-009-0047-x
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This bacterium has high Cr(VI) resistance with a MIC of 17 mmol l⁻¹ and is able to reduce
        Cr(VI) aerobically. The best condition of Cr(VI) reduction for Q5-1 is pH 8.0 at 37°C.
    - reference: doi:10.1007/s11274-009-0047-x
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Strain Q5-1 is also able to reduce Cr(VI) in resting (non-growth) conditions using a variety
        of carbon sources as well as in the absence of a carbon source. Acetate (1 mmol l⁻¹) is the most
        efficient carbon source for stimulating Cr(VI) reduction.
