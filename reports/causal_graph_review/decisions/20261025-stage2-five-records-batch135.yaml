    high-tolerance aerobic Cr(VI) reduction by free cells (MIC 17 mmol/L, optimal pH 8.0 at 37 degrees
    C) to 1 mmol/L acetate-stimulated resting-cell Cr(VI) reduction and downstream to compounding-bead
    immobilization (4% PVA, 3% sodium alginate, 1.5% active carbon, 3% diatomite) for continuous-system
    Cr(VI) bioremediation, with verbatim source snippets on each upstream node directly backing its outgoing
    edge.
  node_decisions:
  - node: High-Tolerance Aerobic Chromate Reduction by Free Cells
    rationale: Supported by primary source (PMID:21441371, doi:10.1007/s11274-009-0047-x) with explicit
      COMMUNITY_LEVEL scope and taxon grounding.
    field_path: ecological_interactions[0]
    source_locator: Abstract and cached text (PMID:21441371, doi:10.1007/s11274-009-0047-x)
