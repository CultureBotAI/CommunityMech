adversarial_checks:
- Actual record diffs read against the primary-source access recorded in the ledger. All eleven nodes
  retained, six arrows retained, one unsupported common-intervention outcome arrow removed. No replacement
  connectivity or new structure invented.
- Pelobacter nutritional support remains positive. Exact strain-195 rescue is in primary Results/Figure
  2, while the cached rescue phrase concerns ANAS and is PARTIAL. ANAS methanogenesis and BAV1 complete
  dechlorination are not imported. Unchanged tceA expression is not induction-mediated rescue.
- Both source-only PAIRWISE entries use the established recipient-process convention, not self-edges or
  reverse nutrient exchange. The curated Pelobacter/Syntrophotalea GTDB pin is unchanged.
- Syntrophomonas butyrate-fed support, crotonate comparisons, cobalamin supplementation and donor-limited
  threshold assays remain distinct. Late VC cometabolism is not growth-coupled respiration. SEM aggregates
  and diffusion predictions have different evidence classifications; necessity was not selectively perturbed.
- 'CO consumption observations and proposed benefit are not silently added to the fermentation node. Open
  #1392 and needs_research status retain the missing-structure obligation. The Edison dry run made no
  provider job or charge; a failed LiteLLM pricing-map request is disclosed.'
- The 2016 exact-Dhc expression assay is distinguished from M. hungatei protein/complex experiments. Induction
  does not establish gene necessity or cell-specific flux.
- CWV2/D345 proof-only body access is explicit. Biochar sorption is not biological transformation; BC600
  is not claimed to sorb most. Lower-VC high-inoculum and higher-VC lower-inoculum comparisons are not
  conflated. Community profiles do not demonstrate DIET, flux, guild necessity or long-term field persistence.
- No final published CWV2 body, figure images or supplement files were inspected. Proof unit/concentration
  inconsistencies are not normalized. Existing non-graph metadata is not certified by graph correction.
- Three guarded writes, llm-assisted events and append-only histories. Prior history entries preserved
  semantically; all non-graph raw blocks, 457 other records and 920 caches unchanged. No article body/PDF
  committed.
- Exact participant registry changes only 174 to 175 users. Measured connectivity and all 31 baseline
  network warnings unchanged; no algorithms or numeric bounds altered.
- Repeat rendering deterministic, exact descriptions checked across all 456 pages. No browser screenshot
  QA claimed. All three reference-validator commands performed zero checks despite exit 0; this is no-op,
  not validation. Actual independent snippet counts and source review are separate; textual matching is
  not scientific support.
- 'Deduplication covers 717 all-state issue titles/bodies, broader synonyms and ignored/hidden scoped
  local files, not every issue comment. Metadata #765/#1391 and research #1392 remain open.'
