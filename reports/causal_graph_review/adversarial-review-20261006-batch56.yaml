adversarial_checks:
- Whole three records and every11 original nodes/9 arrows read. Full2013/2019 KB1 primary main texts;2019
  Tables1-2/Figures2-5 visually inspected,2002 field abstract only. No2013 original images or separate
  supplements/raw data inspected.
- Preserve positive field bioaugmentation, vitamin-free KB1 community support and controlled DMB-guided
  Sporomusa donor chemistry/partner growth. Neither missing exclusive-transfer perturbation nor missing
  field mediation negates these positive observations.
- Sporomusa KB1 donor cocultures used BAV1/GT/FL2 recipients, not established as the canonical KB1 recipient
  population. FL2 retained VC plus ethene. Remove only the unsupported cross-system downstream arrow,
  retain the conditional donor-support node and its positive evidence.
- Acetobacterium-associated cofactor support-to-dechlorination remains PARTIAL for donor-resolved/exclusive
  transfer and field generalization. Species grounding A.woodii is not established by comparison of biosynthetic
  genes. DMB and pH rescue are distinct perturbations. Non-graph taxonomy/conditions remain1526.
- Full RFMIA v1 PDF main text/captions read; selected equations, Methods, Table1, architecture and Figures7-9
  visually inspected. No independent mathematical derivation, external supplement/code/raw-simulation
  audit, or KBase/model execution.
- RFMIA Methods/Results use E.coli/B.theta; abstract names different pairs. All three retained nodes explicitly
  use the Methods pair, not a four-member culture. Two alternative canonical taxa are left visibly DISCONNECTED
  pending1527, not silently added as graph participants.
- Aerobic isolated B.theta MI/growth were manually zeroed. Preserve modeled dextrin growth and generally
  higher community/architecture-dependent MI, but do not call imposed contrasts independent partner rescue,
  measured molecular communication, reciprocal fitness or universal growth benefit. Two procedure nodes
  and all five workflow/co-occurrence arrows removed.
- ORT full publisher main text/Methods/Table1/captions read; no original images, external supplements,
  raw data/code or narrative execution. Neither denitrifier MAG encoded N2 production; terminal conversion
  was gapfilled. Distinct denitrifier names retained despite shared family CURIE.
- Retain two PARTIAL modeled nitrate/carbon substrate routes, not exclusive environmental nitrate supply,
  demonstrated syntrophy, per-denitrifier15-23 substrates or empirically identified field limits. Model
  rates were shared across stoichiometry comparisons; no high-resolution time series validation. Iterative
  coupling is proposed capability, not demonstrated feedback.
- All920 cache files byte-identical. Retained RFMIA/ORT graph fragments additionally verified against
  independently retrieved primary artifacts. Full mismatching cache abstracts and nongraph snippets are
  not certified;1528 remains unresolved. Source-text formatting and cache MATCH cannot prove provenance.
  Platform source scope corrected to title/header/opening paragraphs, not nonexistent indexed abstract.
- Actual schema/strict/term/reference/snippet/history/rank gates completed.457 other records and raw nongraph
  blocks preserved. Nine retained nodes use canonical explicit subsets;3 PARTIAL arrows remain. All34
  baseline network warnings preserved plus2 exposed RFMIA membership warnings, zero structural defects.
  No matching-rule or census-bound changes.
- All record diffs, regression assertions and every-node/arrow partitions inspected. Generated descriptions
  match source text across456 pages and repeat rendering is deterministic; no browser screenshot claim.
  Final ledger tests rerun after the metadata-only source-scope correction.
- 827 all-state issue titles/bodies and38 ignored/hidden local matches with declared exclusions inspected,
  not every historical comment/PR.1523-1525 addressed but open until protected-main merge;1526-1528 unresolved.
  No Edison dryrun, provider spend/report or new structure. Self-review is not independent approval.
