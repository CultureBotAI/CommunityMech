  and generated publication.
findings:
- issue: https://github.com/CultureBotAI/CommunityMech/issues/1244
  severity: high
  finding: Culture and plant graphs overstate reciprocal benefit, competition, or vitamin mediation; SynCom150 has
    two experimental-workflow arrows.
  resolution: Preserve direct outcomes, qualify unresolved mechanisms, remove unsupported optional types and follow-up-experiment
    arrows, and bound immune rescue to the tested bbc1 defect.
  status: addressed
- issue: https://github.com/CultureBotAI/CommunityMech/issues/1245
  severity: high
  finding: Five environmental graphs promote genomic and taxonomic inference into resolved flux or causation and
    include unsupported process annotations and aggregation arrows.
  resolution: Qualify retained source-proposed directions, correct computational evidence and nitrogen-retention
    semantics, remove iron-transport and full-denitrification overannotations, and remove seven unsupported Anabaena/Angelarchaeales
    arrows.
  status: addressed
- issue: https://github.com/CultureBotAI/CommunityMech/issues/1246
  severity: high
  finding: ASF has an unevidenced fermentation node, a measurement-workflow arrow, and overbroad oxygen and host-mediation
    claims.
  resolution: Restore a short primary isolate-culture excerpt to the existing node, remove the workflow arrow and
    unsupported types, retain measured spatial and general host effects, and qualify ASF-member attribution.
  status: addressed
additional_checks:
- All open issue bodies were searched for the affected record names and identifiers; related issues 596 and 765
  remain broader source-coverage work.
- The earlier SynCom150 issue 867 rejected colonization facilitation but did not establish reciprocal fitness or
  require mutualism.
- Official GO definitions distinguish iron ion transport from iron redox and complete denitrification from a nitrate-to-nitrite
  step.
- The indole record already uses candidate and inferred language with PARTIAL computational evidence and a full-text
  curation gap; no cosmetic edit or new structure was needed.
- Ten arrows were removed, none added, and all node counts were retained. Exact renamed targets and anchors were
  checked.
- The initial mutator pass stopped on a cross-block YAML-anchor assertion after a valid guarded write. Resume verified
  exact expected data, preserved prior events, reused ten history artifacts and created the one missing artifact.
  No duplicate event was appended.
