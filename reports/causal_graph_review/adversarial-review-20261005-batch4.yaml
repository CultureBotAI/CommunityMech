limitations:
- This is self-adversarial review, not independent reviewer approval; the whole-corpus semantic review remains incomplete.
- The short ASF fermentation quotation was checked against the primary article. The independent local cache retains
  only the abstract; selected_excerpts must not be promoted to independent full-text verification.
- The indole decision is abstract-bounded. Unread supplements, figure-layout limits and source-access notes are
  documented per record. Missing access does not establish that an unreviewed experiment was absent.
- Non-graph metadata is outside certification, including representative species groundings, the Angelarchaeales
  PRIMARY_PRODUCER role, and stale Anabaena source-access notes. No broader evidence-backlog issue is closed by
  this batch.
- No new graph nodes or arrows were added. Edison spending is authorized, but no paid job was submitted.
- Pre-existing untracked and ignored PDFs are preserved. The publication-file gate is additionally checked in a
  tracked-plus-batch-new-file snapshot, without weakening the test or claiming the entire personal working directory
  passes it.
- Publication text coverage and render determinism are checked automatically; no desktop/mobile screenshot QA was
  performed in this data-only batch.
