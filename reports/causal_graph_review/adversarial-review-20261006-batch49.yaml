adversarial_checks:
- Whole records and all seven original nodes/five arrows read. Wet-up complete cached main body/Methods/embedded
  captions; groundwater complete primary PMC main body/Methods/embedded captions plus local abstract.
  No figure images, supplements, raw data or code audited.
- Wet-up positive viral time-course and isotope-incorporation observations remain. Biomass is a viral-DNA
  proxy; lifestyle inference does not exclude nonintegrating temperate infection. Canonical virus-to-bacterium
  predation direction is preserved, not reversed or assigned to resolved strains.
- The cumulative mortality range depends on assumed burst size and conversion/recovery/rRNA-copy assumptions.
  Below 1% to 46.6% is not a directly counted fixed effect. The first arrow remains PARTIAL; no model
  equation or analysis-code reimplementation claimed.
- The ecosystem carbon node is community-level, with both canonical participants. Its incoming arrow remains
  HYPOTHESIZED because virus-specific CO2 mediation is not selectively resolved. No new causal structure
  or paid Edison research run occurred.
- 'The adversarial pass corrected an overstatement: different 24-hour and one-week richness summaries
  need not contradict each other. Initial actual validation receipts were retained as superseded, then
  every verification command rerun against corrected final wording. No history was removed or source cache
  changed.'
- Groundwater is a comparative multi-habitat genome survey, not a demonstrated coexisting community. The
  two habitat-specific labels remain distinct despite sharing NCBITaxon:641853. Three intrinsic source-only
  capacities cannot credit the animal-associated bin as a partner or create same-CURIE self-exchange.
- All four groundwater findings remain. Remove NICHE_PARTITIONING, CROSS_FEEDING and COMMENSALISM labels
  and three overview inclusion arrows. Genomic evidence is COMPUTATIONAL; gene-neighborhood support is
  distinguished from PARTIAL biochemical predictions. The paralog and Rnf name are not nitrogen-fixation
  proof.
- 'Measured census: 460 records, 389 with community scope, mixed126->127, community-only263->262, 1498
  taxa, solely credited1223->1222. Two participant-registry entries and only the measured mixed upper
  bound updated; no production matching changes.'
- Inspected record and test diffs. Seven nodes retained, two existing arrows qualified, three inclusion
  arrows removed. Six focused tests cover direction, participants, model bounds, evidence type, exact
  anchors and hash-bound all-node/arrow coverage. All458 other records and920 caches preserved, not certified;
  non-graph evidence/roles remain outside scope.
- Actual schema, strict, terms, references, snippets, rank and history gates passed. Network equals baseline
  with34 pre-existing findings and zero structural defects. Repeat HTML renders and exact descriptions
  across456 pages parser-checked; no browser screenshot claim. Post-commit docs-current remains a separate
  actual gate.
- Dedup checked801 all-state issue titles/bodies and ignored/hidden local review files, not every comment
  or PR review. Issues1490/1491 addressed here and remain open until protected main merge. This is source-based
  self-adversarial review, not independent approval.
