limitations:
- Whole 204-line wet-up and 304-line groundwater records and every original node/arrow reviewed. Wet-up
  complete cached main body/Methods/captions and groundwater complete primary PMC main body/Methods/captions
  read. No figure images, supplements, raw data or analysis code audited.
- Existing-structure repairs only; no new causal nodes/arrows, no paid Edison job or provider spend. Positive
  observations and genomic findings retained without claims that all possible mechanisms are represented.
- Wet-up mortality is burst-size/model dependent; biomass is a viral-DNA proxy, host links are coarse
  and lifestyle alternatives remain. Richness summaries cover different time windows and need not conflict;
  lower mortality bounds differ slightly across source sections. No equation or code reimplementation
  claimed; CO2 mediation remains a hypothesis.
- Groundwater is a comparative multi-habitat genome survey, not one demonstrated coexisting community.
  Same-CURIE habitat labels retained separately. Encoded loci are distinct from predicted function, and
  the nitrogenase paralog is not demonstrated nitrogen fixation.
- All non-graph raw blocks and 920 cache files preserved, not certified. This leaves non-graph broad functional
  roles and evidence classifications outside the present repair. Reference CLI Total checks counts reported
  issues, not executed checks; SupportingReference coverage (#476), Linux DOI-cache lookup (#1091) and
  selected-cache provenance (#1362) remain limitations.
- Dedup checked 801 all-state issue titles/bodies and ignored/hidden local review files, not every comment
