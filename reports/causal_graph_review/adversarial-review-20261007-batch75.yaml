adversarial_checks:
- Read all four whole records and every original node/arrow after the both-root baseline. Read full probiotic main
  body, embedded tables and captions, and primary abstracts for the other three. No separate-supplement, raw-data
  or original-figure-pixel audit. Abstract-only access is not evidence controls were absent.
- 'Sparse does not imply defective: mulberry retains its two correctly bounded nodes and no arrows. Earlier1103/1104
  recipe-panel and protein/ABTS fixes stay intact. Genus-level association does not justify a species-level causal
  edge or an extra curation history.'
- YSJ22% and J8% methane gains share a non-bioaugmented comparator; both reduce propionate1.6-fold. Correct the
  former YSJ-specific propionate comparison while preserving both positive outcomes and nearly absent YSJ lag.
- Do not convert metagenomic functional association into transcription, direct electrical transfer, electron flux
  or obligate syntrophy. Retain the proposed staged-processing and environmental-selection arrows as HYPOTHESIZED,
  not selectively isolated mediation; introduced and native activities remain unresolved.
- 'Selection does not establish competitive fitness effects. Preserve elevated acetate, reduced propionate and moderate
  non-inhibitory ammonia context, together with the source function/stability trade-off: J has the more robust network,
  YSJ greater methane output.'
- Corn cellulose34.91%, hemicellulose45.94%, lignin23.34% are distinct fractions, not additive whole-straw yield.
  Preserve three component-to-whole causal contributions. Joint conversion does not establish reciprocal fitness
  among eight strains, so MUTUALISM labels are removed.
- Corn proteomic enzyme association is PARTIAL, with a direct measured-fraction snippet added independently. Do
  not silently repair the unusual primary wording or call xylanases validated ligninases. Lignin contribution is
  supported; selective barrier-opening mediation remains HYPOTHESIZED.
- Probiotic cell-free-supernatant addition is a positive intervention, not merely a correlation. Preserve that evidence
  and elevated viable counts while distinguishing diffusible growth promotion from identified nutrient transfer
  or necessity. Methods give plate counting without member-resolved enumeration; do not equate total growth with
  universal absence of antagonism.
- 'Preserve the probiotic MsrA discussion and closed1065 category fix. The missing membrane-vesicle production/properties
  outcome is not dismissed because the graph is sparse: mark needs_research and track1629. No growth-to-vesicle-yield
  arrow, universal antioxidant superiority, MsrA necessity, microbiota mediation or human efficacy invented.'
- Full-source scrutiny found L-MV ABTS greater than M-MV, Nile Red proxy rather than direct luteolin uptake, no
  in-vivo biodistribution and a preventive male-mouse DSS model. Animal Results/Methods dosing chronology requires
  reconciliation in separate1630, not silent certainty in this graph-only patch.
- One-record Edison LITERATURE dry run completed with10231 query characters and zero calls/credits; no submitted
  response means no inspected report and no extension. Scoped authorization question remains unanswered, not permission.
  Earlier denied/pending scopes remain unchanged.
- All10 original nodes and5 arrows have decisions. Three records and histories change,457 records including reviewed
  mulberry remain byte-identical;920 caches and raw non-graph blocks preserved. No taxonomy or auditor-rule change.
  Zero structural defects and44 baseline warnings unchanged; connectivity census unchanged.
- Actual schema, strict, terms, references, snippets, histories, both-root inventory/network/rank, regression, lint
  and deterministic render gates retained with digests. Ruff caught a missing strict=True in a new test zip; fixed
  and reran full regressions plus lint, retaining three superseded outputs including the failed lint check. Exact
  descriptions parsed across456 pages, not browser screenshots. Postcommit docs-current is a separate publication
  gate.
- Dedup scanned911 all-state issue titles/bodies and26 ignored/hidden-inclusive local matches; matching1104/1103/1065/310/183
  bodies read. Existing183 membership work reused. No exhaustive historical PR-comment audit or global source-absence
  claim. Repairs1626-1628 stay OPEN until protected-main merge;1629 and1630 stay OPEN afterward. Self-review is
  not independent approval or corpus completion.
