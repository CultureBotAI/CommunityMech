adversarial_checks:
- Fresh both-root460record/920cache baseline preceded paper review. Four whole records,13nodes and9arrows assessed
  including missing structures. Twelve retained nodes/eight arrows and one removed workflow node/arrow all have
  dispositions. No new topology or paid provider submission.
- PES retains near-complete50mg/Lpyrene removal in10days at5%salinity and N7monoculture49.95%in14days. Removal is
  not complete carbon mineralization. Intermediate profiles and hphtC-5annotation/modeling/transcripts support a
  candidate handoff, not traced transfer or enzyme necessity. Published Figure8correction fixes reversed structures;
  the record already has the corrected chemical direction.
- A11-associated extracellular emulsification remains positive:68%soybean-oil index under assay-specific growth
  conditions. A11yeast-extract and N7/PESpyrene conditions differ. Emulsion phenotype and genomic capacity do not
  isolate pyrene mass-transfer mediation, export apparatus or reciprocal fitness. Both removal arrows remain explicitly
  hypothesized.
- Syntrophy retains growth on propionate and alternative substrates with the hydrogenotrophic partner and the directly
  implied donor-to-methanogen direction. Pure-culture pyruvate/fumarate growth and fumarate-to-succinate exception
  disallow universal obligate dependence. Alternative-substrate products are not assumed identical. A copied evidence
  explanation now explicitly includes propionate.
- The2005primary abstract/captions add real coaggregation and2-BEShydrogen-consumption inhibition evidence, not
  direct electron conduction. Stronger association on propionate and modeled diffusion limits are distinct findings.
  Full methods and missing feedback/coaggregation topology remain1689research; no fabricated negative control claim
  or uninspected full-text certification.
- Peppergrowth workflow node/arrow removed, while all three biological nodes and the authors proposed diversity-to-native-taxa-to-growth
  model remain. Both arrows are hypotheses, not inferred necessity from correlations/random-forest importance. Figure3visually
  confirms increased fungal AND bacterial Chao richness; same-letter Shannon/Simpson panels do not support a blanket
  evenness increase.
- Preserve fungalBray-Curtis increase and bacterialBray-Curtis decrease, measured plant/root outcomes and selected
  native relative-abundance changes. Scedosporium genus decreases while OTU451increases; do not collapse these resolutions
  or claim absolute expansion, inoculated-strain colonization, symbiosis or reciprocal microbial fitness. Prior
  taxonomy decisions1216/1217remain untouched.
- Biocontrol individual trait screens are heterogeneous. Table1places strongest pathogen inhibition withT14andA6at58.4%and17.6%;
  canonical participating taxa narrow to those two. Narrative/tableIAAandammonia rankings conflict. Separate siderophore/enzyme
  screens are not demonstrated inhibition mechanisms; oomyceteP.capsici does not establish a host antifungal-defense
  or chitin-wall-degradation claim.
- Preserve challenged-host growth and visible wilting/necrosis response. Section3.5explicitly says no direct disease
  severity/pathogen-load quantification and no SynCom-only control. Both trait/antagonism-to-host arrows remain
  hypotheses. Additional positive soil nitrate/K/Ca and community responses stay in discussion pending1690; predicted
  functions are not measured flux.
- PESindexed full main text/tables/captions, its correction and two pepper full main texts read. Fresh public primary
  PDFs inspected on growthpages6/7/8andbiocontrol3/4. Two syntrophy studies are abstract/caption limited. Other
  original figures, separate supplements and raw data remain uninspected. Failed/captcha downloads are not evidence;
  public source access respected.
- Eighteen graph quotations and new discussion quotations independently checked against fresh primary artifacts.
  One new cache has20quoted words from two primary excerpts, not full paper text. Full-corpus just audit-snippets
  executed with actual counts; its informational exit0 is not a clean-corpus claim. Four focused snippet gates contain
  no weak/mismatched/no-content/assembled evidence.
- Four guarded history events,456otherrecords920originalcaches and all raw non-graph blocks preserved. Final Chao/explanation
  fixes retain24superseded passing outputs;14unchanged record gates reused by hash, affected gates rerun. Forty-one
  final checks recorded. Deterministic rendering and exact descriptions across456pages are parser checks, not browser
  screenshots.47network warnings unchanged,zero new structural/connectivity findings; taxonomy/auditor rules and
  global connectivity census unchanged.
- Dedup searched962all-state issue titles/bodies,six matched bodies and62localfiles with ignored/hidden inclusion
  and declared exclusions. One13736character Edison causal dry run is not paid authorization or a report. Pending/denied
