adversarial_checks:
- challenge: Does the review erase genuine mutualism because its mechanism is incompletely resolved?
  resolution: No. M. forte nutrient complementation, the 2018 proline-dependent glycerol/ammonium exchange, and
    the 2024 reciprocal growth benefit on IAA remain MUTUALISM. Unresolved nutrient mediation of H2 and photosynthate
    support of IAA turnover stay explicit hypotheses.
- challenge: Are the 2018 and 2024 Chlamydomonas experiments silently collapsed?
  resolution: No. The graph distinguishes CYB/proline with CC-1690 from acetate-containing T-N with CC-5325; the
    earlier glycerol experiment does not prove the later IAA mediator. The two existing arrows remain bounded rather
    than being replaced with new mechanisms.
- challenge: Is the IAA producer direction and analytical specificity correct?
  resolution: Algal LAO1-dependent production replaces unsupported bacterial production. Cooperative depletion requires
    both organisms; its Salkowski indole readout is distinct from the production HPLC/MS assays. The catabolic pathway
    remains unresolved.
- challenge: Does high IAA reduce chlorophyll, or inhibit its degradation?
  resolution: The source reports inhibition of chlorophyll degradation and cell multiplication. The corrected endpoint
    preserves that direction and avoids a generic survival claim.
- challenge: Do hypoxic H2 enhancement and aerobic algal growth demonstrate one identical outcome?
  resolution: No. The M. forte pair did not support algal growth under H2-producing hypoxia; aerobic pair growth
    and full-community hypoxic growth are separate assays. Whole-inoculum support does not prove necessity of each
    bacterium.
- challenge: Does temporal omics staging establish abundance succession or traced cross-feeding?
  resolution: No. CDG niche partitioning remains a partial functional interpretation; the bulk degradation node
    is untyped. Canonical fungi, prior outcomes/design-intent corrections and the strains/conditions gap remain
    unchanged.
- challenge: Does BL6 protection establish reciprocal competition, pathogen eradication or direct permeability rescue?
  resolution: No. Host histology, transient barrier transcripts, serum markers and relative genus enrichment remain
    within their readout scope. Supplements and images were not inspected, and absence of a direct pathogen-load
    assay is limited to the read main text.
- challenge: Was accessible text treated as automatically redistributable?
  resolution: No. The 2024 XML contains an explicit CC BY 4.0 license; the new cache records attribution, source
    hash, license and selected-excerpt scope. The rights-restricted 2018 body/PDF stays outside the repository.
- challenge: Can green graph checks certify unchanged metadata or unread evidence?
  resolution: No. Three explicit follow-up issues retain non-graph debt; every source-reading limit is recorded.
    No new graph structure or Edison run is claimed.
