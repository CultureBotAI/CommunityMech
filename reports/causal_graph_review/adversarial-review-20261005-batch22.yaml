adversarial_checks:
- Account for all ten original nodes and six arrows, with six exact renames; no additions, deletions, new structure
  or Edison spend.
- Preserve increased JN4-GD17 fermentation products while retaining the negative overall cellulose-utilization result.
  The feedstock is not the exchanged soluble sugar or output.
- Challenge COMPETITION against its actual (-/-) enum. Faster GD17 monoculture rates and JN4 suppression support
  resource competition but do not establish both partners are harmed.
- Keep low coculture sugars, transcription and glucose-addition controls as positive mechanistic support without
  directly traced partner flux.
- JN4 biomass is estimated using protein and genomic proportions, not direct viable counts. Stimulants add carbon
  and sample different times; reduced cellulose use does not prove reduced total fermentation output.
- Preserve the positive staged-butanol comparison. Coupled temperature and glucose-containing inoculum prevent selective
  carbon-flux or solvent-selectivity attribution.
- Retain the acetone-addition control and crude-extract activities; these constrain removal and pathway-shutdown
  explanations without directly identifying the redox mediator.
- The 2013 abstract reports an inverse hydrogen/butanol association and proposes future hydrogenase selection. The
  2011 Discussion supplies the redox hypothesis; its cited separate mutant experiment is not an exact-coculture
  perturbation.
- Community products and hydrogen output name the existing two canonical participants, not inferred donation. The
  wetland whole-community assays do not invent discrete membership among overlapping guild placeholders (#524).
- Four wetland treatments support controlled mixture effects, not isolated sodium chloride causality, niche partitioning
  or universal coastal-field behavior.
- Week-12 relative sulfate-reducer and gene abundance nulls do not imply inactivity; verified sulfate exposure and
  day-14 hydrogen sulfide are distinct positive observations.
- DNA metagenomic relative abundance is functional potential, not expression, activity or selective mediation of
  net gas flux.
- Preserve the distinction between significant overall/factorial CO2 effects and nonsignificant individual contrasts;
  distinguish intermediate complete-seawater CH4 and the sulfate-only N2O difference from the nonsignificant factorial
  sulfate effect.
- 'Three graph records, three append-only histories and focused regressions only; unrelated YAML blocks, seven tracked
  cache artifacts and GTDB census bounds remain byte-identical. Nongraph #1343 and existing #746/#524 remain open.'
- Before/after both-root census proves exactly two new mixed records and no increase in taxa credited solely by
  community scope. Only the explained 120 -> 122 bound changes; no graph scope chosen to satisfy an old ceiling.
- Source-based self-adversarial review is not independent approval. Three primary main bodies and three additional
  abstracts reviewed; no images or supplementary files inspected, and no copyrighted full body added.
