adversarial_checks:
- Whole three records and all six original nodes/two arrows reviewed. HAMBI/C6 complete cached main texts,
  Methods and embedded captions read; C6 main Tables1-3 read. Hanford complete primary abstract and selected
  local excerpts only. No original figure images, supplements, raw data or code audited.
- HAMBI controlled carbon-dependent composition shifts remain positive SUPPORT/IN_VITRO observations.
  The authors' OD-scaled analysis is retained, not dismissed as purely compositional. Competitive sorting
  remains an interpretation; ancestral monoculture traits and pH associations do not selectively demonstrate
  the mediator or alternative within-condition stable states.
- HAMBI keeps all16 canonical input strains, including taxa not dominant at endpoints. Do not infer persistence/extinction
  from the roster. R2A is a limited resource-complexity proxy; no universal conclusion about complexity
  or new trait/pH arrow is added.
- Hanford preserves field observations and the authors' hydrologic structuring interpretation. Remove
  two arrows that imply community-to-flux and flux-to-depth causal directions. Putative guild annotation
  is distinct from measured metabolism, and environmental nitrate/uranium is not interspecies exchange.
- The Hanford cache says full_text but contains selected snippets; this was not misreported as complete
  primary-body review. PMC CAPTCHA was not bypassed. Broad four-taxon participants are an incomplete subset,
  not resolved physiological guilds; no new top-down-control/predation mechanism was invented from the
  abstract proposal.
- Self-adversarial review found that the selected Hanford guild sentence did not retain its spatial comparator.
  Removed the contact/redox-transition attribution, renamed the node to neutral depth-stratified sampling
  context and repaired its anchor and ledger. Prior actual checks were archived as superseded; every verification
  command was rerun against final text. No history or cache was erased.
- C6 retains the positive reported94.41/85.56/37.64percent 24-hour biofilm benchmark. Rich AS medium,
  bulk COD and chemical disappearance do not establish mineralization or reciprocal fitness. Table2 ammonia
  production is distinct from isolate-level ammonia removal.
- C6 retains all6 strain labels, including two pairs sharing taxon CURIEs. Bulk post-irradiation recovery
  during medium renewal does not prove every-strain survival, unchanged composition or an EPS/quorum-sensing
  mechanism. Nonsignificance is not formal equivalence, and suspended-culture recovery timing is not substituted
  for biofilm timing.
- 'Self-review corrected the issue1495 wording: the original record already said not significantly changed.
  That was not an unqualified no-effect assertion. These statistical and mineralization statements are
  explicit boundaries, not claims that the original graph asserted every excluded mechanism. The scientific
  record required no further correction.'
- C6 main-text50mg/L versus Fig4-caption100mg/L irradiation feed remains explicitly unresolved. The earlier
  review's chosen non-graph concentration is preserved without recertification. Existing gap author/date/evidence
  remain, with both nodes anchored; no duplicate gap or history deletion.
- Inspected all record diffs and focused test assertions. Six nodes retained, two arrows removed, three
  guarded writes and append-only history artifacts. All457 other records and920 caches preserved. Canonical
  taxonomy and other non-graph raw blocks unchanged. Three participant registry entries added; measured
  connectivity census unchanged, no production matching or census-bound change.
- Actual schema, strict, terms, references, snippets, rank and history gates passed. Network equals baseline
  with34 prior findings and zero structural defects. Deterministic repeat renders and exact descriptions
  across456 pages parser-checked, not browser screenshots. Actual post-commit docs-current remains a separate
  publication gate.
- Dedup checked803 all-state issue titles/bodies and19 ignored/hidden local files, not every comment/PR
  review. Existing1059/1060/1007 are closed non-graph repairs;1095 remains an unrelated open writer-audit
  issue. Issues1493/1494/1495 stay open until protected main merge. Source-based self-adversarial review
  is not independent approval.
