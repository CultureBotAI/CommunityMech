adversarial_checks:
- Read four whole records, all10 original nodes and2 arrows. Three complete fresh primary main texts/captions
  and five main tables read; fungal primary abstract and subscription preview only. No separate supplementary
  files, original figure pixels, raw data or external literature independently audited.
- Medicago retains four distinct strain names despite two shared genus IDs. Individual-strain PGP panels
  are not mixed-culture mutualism. Table1 and Methods support phosphate/IAA/ACC/biofilm/pectinase assays
  but biofilm signal declined and N10/N12 lost nitrogen-free growth under metals. Nitrogen-free growth
  is expressly a first approximation, not direct flux.
- Medicago plant gains are real and treatment-specific. Keep N10-alone comparator, salinity-associated
  shorter/thicker roots and low heat photosynthesis despite improvement. Keep nodulation and oxidative-stress
  context; remove misplaced nodulation on isolated traits and unmeasured fixation-process assignment on
  plant nitrogen. N2 remains a candidate source with a note, not a measured flux.
- Both Medicago arrows remain HYPOTHESIZED with a positive proposed biological route and explicit missing
  perturbation. Host enzyme induction does not by itself prove ROS clearance or growth mediation. Replace
  aim-only plant evidence with a plant outcome while preserving original upstream IN_VITRO alias used
  outside the graph. Host stays external, no invented canonical taxon.
- Fungal root colonization supports broad symbiotic-process context; do not erase it because competition/reciprocal
  benefit was untested. Six initial species does not establish equal persistence. Spore non-detection
  is not root extinction, and pooled PCR-TTGE is not quantitative intraradical abundance. Limited host-cover
  influence is not zero influence. Retain initial canonical roster and exact F.coronatum/F.coronatus distinction
  without remapping.
- 'Fungal graph-owned id004/id005 evidence anchors remain valid for untouched environmental aliases. Existing
  inoculum/protocol discussions remain OPEN and prior #862/#863 evidence/cultivation repairs survive.
  Public publisher page explicitly subscription-preview only; no paywall bypass or claim of full-body
  review.'
- qSIP retains positive DNA-incorporation growth observations, absorbs the redundant active-community-resolution
  evidence, and preserves the previous four-arrow deletion. Rewetted eight-day laboratory incubations
  are not in-field trajectories, AFE is not net growth and low activity is not death. Two Bacteria guild
  entries overlap and are not a resolved species roster.
- qSIP historical rainfall association is not randomized historical selection. Flagellar genomic capacity
  is not observed movement, and carbon pathway annotation plus organism growth is not substrate flux or
  sequestration. Preserve broad negative carbon-capacity selection result alongside Angelo/site/taxon
  exceptions; do not infer niche partitioning. Predicted motility process retained explicitly as potential.
- 'Missing qSIP labeled-phage/predicted-host activity deserves separate new-structure review, not a workflow
  edge. Account for prophage labeling and alternative mortality before any lysis-to-necromass arrow. One-record
  dry run9469chars is not a report. Its reviewed query contains the pre-repair record context; refresh
  and inspect the dry run before any later paid submission. #1592 remains OPEN and record needs_research.'
- 'A22ED9 preserves #1009 single-metal naming and positive92.08/74.15/97.587% averages at initialpH5 after24h.
  Residual ICP-OES after cell separation does not establish final metal speciation, intracellular uptake
  or unique biosorption. Chromium atom is element-level reporting, not metallic feed; dichromate challenge
  is explicit. Do not promote pH8 to a universal endpoint.'
- A22ED9 primary source reports cell-free controls while also acknowledging missing abiotic partitioning.
  Preserve reported little-loss controls and the unresolved pH-matched/live-dead comparison, not a false
  no-controls claim. SEM-EDX examples are individualSK22/SK18-4, not a uniquely consortium-resolved mechanism.
  Reported compatibility/stimulation is not higher removal; no field validation claimed.
- 'Missing KHED9-filtrate stimulation of SK22 is separate from metal depletion. Inspect supplementary
  FigS2/controls and exact strain assignments before extension; shared genus ID does not merge the two
  strains. One-record dry run9544chars is not a report. Its reviewed query contains the pre-repair record
  context; refresh and inspect the dry run before any later paid submission. #1593 remains OPEN and record
  needs_research.'
- Read complete biological diff; all unchanged top-level raw non-graph blocks,456 other records and920
  caches verified. Append-only record events/history, exact graph names/discussion anchors, and19 independently
  primary-matched excerpts checked. No new nodes/arrows or paid submissions.
- Measure the participant census before updating the exact USERS registry for the fungal and Bacillus
  records. Counts460/391/123/268/1507/1240 unchanged. All44 network warnings unchanged exactly, no structural
  defects and no auditor-rule changes. Named initial participants do not prove partner-resolved mechanisms.
- Actual focused schema/strict/terms/references/snippets/history checks, inventory/rank/network, repeat-render
  and full combined regression outputs retained with hashes. HTML descriptions parsed over456 pages, not
  browser screenshots; post-commit docs-current is a separate publication gate.
- 'Dedup879 all-state issue titles/bodies and22 scoped ignored/hidden local matches. Four matching issue
  bodies (#382/#862/#863/#1009), relevant history and prior A22ED9 review read, not every local match/PR/comment.
  #1588-#1591 addressed but OPEN pending protected-main merge; #1592/#1593/#1594 remain OPEN afterward.
  Self-review is not independent approval or corpus completion.'
