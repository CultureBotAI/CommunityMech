- 'Challenge removal versus lost evidence: corrinoid retains producer inference, measured pool and amendment responses;
  SRC2v4 retains composition/host biomass/flavonoid responses; salt pond retains associations and methanogenesis
  activity support. SRC1 parent observations are not rejected: attribution to an unverified subset is withheld pending
  identity1813, not replaced by another formulation.'
- 'Corrinoid: keep the full prediction qualifier, distinguish native predominantlycobalamin reservoir from diverse
  amendments, and distinguish total abundance from bioavailability. Producer release/replenishment and reservoir
  buffering are model hypotheses, not measured flux or isolated stability mechanisms. Both original directions are
  retained with these explicit limits; no new graph extension.'
- 'SRC1: the cached/fresh abstract does not identify the claimed16-20member subset. Indexed primary introduction
  and independently retrievedSRC2paper identify57member parent. Do not silently rename the record, assert absence
  of any subset globally, reintroduce removed assay-order arrows, assign reciprocal benefit, or interpret lignin
  correlation as mediation. Identity remainsneeds_research; no subset formulation is invented.'
- 'SRC2v4: relative compositional fidelity is not equivalence or universal stability. Source text/Fig2caption inconsistency
  is disclosed; no raw-data adjudication claimed. Preserve host biomass response without microbial fitness signs
  or field efficacy. Host flavonoid response does not establish recruitment/colonization or growth mediation; within-treatment
  correlations were nonsignificant. Prior782-790fixes remain. No new growth, colonization, infection or genetic-design
  procedures.'
- 'Salt pond: cross-site association is not an isolated restoration effect or niche partitioning. Gene/flux correlation
  is not syntrophic feedback or cross-feeding. Microcosm methylated-substrate responses support activity but do
  not apportion field flux or identify partner feedback. The explicitly bacterial node does not claim exclusivity;
  archaealphnJis acknowledged. Canonical participants use identity-only copies. Statistical tools are primary-method-supported,
  with no guessed versions. Prior652treatment separation remains.'
- Sixteen graph and four discussion quotations match fresh primary text and unchanged caches. SRC1 complete text
  was not independently persisted/read; other source-read spans are explicitly bounded. No figure pixels, raw data
  or supplementary files reviewed. Large caches not read exhaustively; literal matching is not entailment or whole-record
  certification. No new cache imports or validator exceptions.
- Four guarded writes/four append-only histories;456otherrecords/all923caches and all prior history/decision files
