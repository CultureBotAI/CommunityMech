  and six broadly credited taxa from the census; salt-pond participant scopes are added. No census-threshold, schema,
  runtime or audit-rule changes.
- Eight focused tests and935combined regressions pass. Four full-record schema/strict/term/reference/snippet checks
  and four histories validate. Network equals baseline56warnings/zero structural defects. Deterministic rendering
  and HTML parser cover456pages/1378descriptions/557arrows, not screenshots. Plain just-lint passed; explicit-runtime
  no-incremental mypy additionally checked.
- Repairs1809-1812 addressed and remainopen until protected-main merge; identity1813/non-graph1814 remainopen. Licensegate949,
