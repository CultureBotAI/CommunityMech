- Fresh both-root baseline preceded sources; four whole records and all nine original nodes/six arrows accounted
  for. Eight nodes/three directions retained, one intrinsic node/three feedback arrows removed, no new topology.
- Rammelsberg primary105443 is distinct from Finnish105484. Community chemistry and positive metal recovery remain;
  the dominant recorded taxa are not the entire enrichment or demonstrated pairwise beneficiaries. Correct iron-to-dissolution
  direction retained. Generic review chemistry cannot establish strain-specific recycling/passivation, and intrinsic
  carbon fixation is not exchange. Incorrect iron-transport annotation removed.
- BDE-47 retains supported forward intermediate CROSS_FEEDING, functional enzymes, transwell relay, sequential growth
  and wastewater endpoints. Both monoculture and mixed culture remove parent BDE-47; partner conversion prevents2,4-DBP
  accumulation. Reverse donor benefit/return transfer is not shown. SYNTROPHY does not require obligacy; feedback
  is the missing criterion. Pathway reconstruction/bromide release are not a closed carbon balance.
- 'RAMC graph and entire record remain unchanged: exact primary monoculture/pool comparisons support complementary
  utilization. Succinate exchange remains proposed, not an asserted arrow. WT and engineered RAMC-P claims remain
  separate; no protocol/design additions. Existing non-graph citation-marker omission yields one ASSEMBLED classification
  and one RENDERING; baseline/current counts measured equal, not silently called literal MATCH.'
- PPOW roles remain an explicit HYPOTHESIZED/PARTIAL model while bulk removal retains SUPPORT. Methods2.4 describes
  controls but the conclusion says they are lacking; this source conflict is not resolved by choosing one statement.
  No directional cross-feeding invented. Existing member-mechanism discussion preserved.
- Three fresh PMC main bodies and complete public Rammelsberg pre-proof text read, with captions/table text but
  no figure pixels, raw data or complete supplements. One retained BDE FigureS16 caption has existing-cache-only
  provenance. All other21graph/new-discussion quotes freshly matched; quote matching is not entailment. Publisher
  metadata independently verifies Rammelsberg DOI/title/OA license but is not full text. No security challenge bypass.
- 'All921baselinecaches preserved; two independent full-text caches added: the public Rammelsberg pre-proof and
  freshly retrieved PPOW PMC text. PPOW initial31NoContent CLI failure is separately retained, not counted as a
  pass.457otherrecords, non-graph raw blocks and prior histories/decisions remain unchanged. Canonical IDs/labels
  preserved; Rammelsberg COMMUNITY_LEVEL scope and BDE recipient-step participants intentionally repaired. Legacy
  community-level census changes are measured, not used to claim mechanistic connectivity.'
- Eight new regressions and focused schema/strict/term/reference/snippet/history checks executed, including the
  explicit RAMC baseline exception. Network remains56existingwarnings and zero structural defects. Deterministic
  rendering and exact HTML-description checks are not browser screenshots; generated-model loader1703 remains outside
  certification.
- Ignored-inclusive local and all-state issue dedup recorded with exclusions. Repairs1750-1752 remain open until
  protected-main merge; non-graph1753 remains unresolved. No provider spend, new wet-lab instructions, independent
  approval or corpus-completion claim. Prior denied/pending Edison scopes unchanged.
