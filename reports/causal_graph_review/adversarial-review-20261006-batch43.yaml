  finding: Relative community enrichment and a separate CF313 mutant result were overstated as competitive
    partitioning and interstrain facilitation.
  disposition: Three existing nodes bounded/renamed, both unsupported arrows removed, exact canonical
    participants, focused gap and history. No new graph structure. Close only after protected main merge.
- issue: 1472
  severity: P2
  status: addressed_in_this_change
  finding: Legacy test census credited every shared-genus strain to a precisely named single-strain endpoint.
  disposition: Reuse existing exact-name-aware ranker resolver; production auditor/ranker unchanged. Compare
    both algorithms on both corpus versions, retain synthetic shared-CURIE canaries and add live CF313
    test. Historical counts retained but not certified as exact strain counts. Close only after main merge.
adversarial_checks:
- Whole 1,210-line original record and all three nodes/two arrows read. All 28 canonical members retain
  their strain preferred names with the shared genus CURIE; no invented strain/species IDs or genus self-edge.
- Complete cached primary main body, Methods and embedded captions read despite stale abstract_only front
  matter. Primary public PMC request presented reCAPTCHA, with no bypass. No figure images, supplementary
  files, raw data, code or complementation rescue independently inspected.
- Compartment metagenomics measures relative DNA enrichment and normalized abundance, not absolute viable
  colonization or experimentally reduced competition. A draft absolute-read-abundance phrase was caught
  during self-review, corrected before commit and followed by fresh complete verification. Initial run
  and its hashes remain archived.
- Resource competition remains HYPOTHESIZED and evidence PARTIAL. The source proposes alternative metabolic/regulatory
  strategies but does not selectively measure resource-mediated partner harm. Shared genus is not proof
  of a single species; no intraspecific category retained.
- CF313 PMI12_01353 deletion abolishes sole-fucose growth and reduces recovered root CFUs in P. deltoides,
  reported P=0.0022. This existing node is source-only CF313; not partner facilitation, priority effects,
  whole-panel compartment causation or proven entry/flux mechanism. Other intact-pathway strains fail
  growth; pathway possession alone is not sufficient. Host fucose not quantified.
- Both downstream arrows removed because their targets represent relative community compartment profiles
  rather than the separate mutant root-recovery endpoint. No new causal nodes/arrows, no Edison job or
  provider spend. Canonical L-fucose grounding reused from this record.
- The historic all-community-level auditor fixture is now explicitly synthetic, preserving exact-name
  versus ambiguous-CURIE behavior tests without freezing scientific data. The live record has two full-panel
  observations and one intrinsic source. New test verifies one of 28 precise matches and no fan-out for
  ambiguous ID-only pairwise endpoints.
- 'Census legacy/current and corrected/baseline comparisons distinguish algorithm correction from biology.
  Mixed count changes 124 to 125 and CL-only 263 to 262; only that bound changes. Historical raw numeric
  outputs are not rewritten or represented as exact strain-aware counts. README and issue document correction;
  broader #524 remains open.'
- 459 other records, 920 source caches, taxonomy and all non-graph raw blocks preserved. Prior history
  artifacts byte-identical; one append-only event/artifact. Both initially selected UFMP/GOM records remain
  pending, not silently counted as reviewed.
- Schema, strict semantics, term correspondence, reference, snippet, history and rank checks passed on
  final bytes. No new audit findings; all 33 baseline warnings preserved, zero structural errors. Repeat
  renders deterministic and all published node/edge descriptions checked. No browser screenshot claimed.
- 'Five new focused tests plus the combined historical batch/shared suite pass. The initial run passed
  445 tests but failed Ruff on import ordering and dict-constructor style; fixes and its actual failure
  output are retained, followed by a fresh complete run. Positive/negative reference-validator canaries
  remain included. Total checks:0 is an issue count, not a no-op; SupportingReference #476 remains incomplete.
  Text matching is not source-grounding validation.'
- All-state 788 issue title/body snapshot and ignored/hidden local search used. Relevant biological and
  census matches read; initial mistaken data/history scan corrected to history/ before concluding dedup.
  Not every issue comment or PR review inspected.
- Self-adversarial review is not independent approval. Exact-head COMMENT and actual post-commit docs-current
  are publication steps; protected main checks and dependent-parent merges remain mandatory. Neither complete
  corpus review nor completed merge is asserted here.
