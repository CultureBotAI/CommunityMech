  \  enables / is required for / suppresses the downstream one (e.g. \"Hydrogen\n  consumption by a partner\
  \ lowers hydrogen partial pressure, enabling syntrophic\n  oxidation by the hydrogen-producing organism\"\
  ). Illustrative only; this\n  mechanism is not evidence for the target community.\n- **evidence** —\
  \ verbatim snippet + reference for the causal claim specifically\n  (not just for the two endpoints\
  \ existing).\n\nPrefer chains that a paper demonstrates by perturbation (knockout, substrate\nremoval,\
  \ inhibitor, co-culture vs mono-culture), and say which experiment shows\neach edge. Flag any edge that\
  \ is hypothesized rather than demonstrated.\n\n### 3. Grounding\n\n- CURIEs where available: NCBITaxon\
  \ (taxa), CHEBI (metabolites), GO (processes),\n  ENVO (environment), PMID / DOI (evidence).\n- Do not\
  \ invent taxa, ontology ids, snippets, accession ids, or citations. If a\n  node or edge lacks a citable\
  \ source, omit it or mark it UNVERIFIED.\n\n## Output Format\n\nReturn a curation-focused report with:\n\
  \n1. **Scope summary** — the consortium and the top-level function the causal graph\n   explains (1–3\
  \ sentences).\n2. **Node table** — the interaction nodes (§1 columns).\n3. **Edge table** — the directed\
  \ causal edges (§2 columns: from, to, causal\n   link, evidence).\n4. **Adjacency / DOT sketch** — a\
  \ compact `from -> to` edge list (or Graphviz DOT\n   snippet) so the graph can be eyeballed; annotate\
  \ edges with + / − sign.\n5. **Gaps & controversies** — edges the literature disputes, or plausible\
  \ edges\n   with no direct evidence (candidates for a `Discussion`/knowledge-gap note).\n6. **References**\
  \ — every PMID/DOI cited, once.\n\nEach biological claim (node and edge) must carry a verbatim snippet\
  \ and a\nreference. This report is reviewed by a curator before anything is written to\n`kb/communities/`.\n"
