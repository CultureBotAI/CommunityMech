    transfer to heterotrophs, with strong peptide coverage for Wenzhouxiangella MAG57 and Phycisphaerales
    MAG34. These populations lagged cyanobacterial labeling, consistent with use of macromolecular carbon;
    specific protein/glycogen transfer remains an interpretation. Planctomycetota is the existing broad
