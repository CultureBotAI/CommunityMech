    demonstrated photosynthetic flux. The study does not establish class-wide vitamin provision, siderophore
    delivery, nitrogen recycling or reciprocal cyanobacterial benefit; Figure 4 has much weaker peptide
    coverage for MAG58 than the major heterotrophs.
  environmental_factor_summary: "Alkaline pH - >11 - Extremely high pH is the defining environmental characteristic\
    \ of this consortium. The alkaline conditions permit direct CO2 capture from air, provide selective\
    \ pressure that reduces contamination by non-alkaliphilic organisms, and shape the community composition\
    \ toward specialized alkaliphiles. Multiple pH regimes were tested including low-pH ammonium (pH 8.3),\
