adversarial_checks:
- 'All 21 original nodes and 17 directions have dispositions: 21 nodes and 16 arrows retained, one misplaced reverse
  direction removed, and one conversion outcome renamed. No new biological topology or Edison submission.'
- 'Challenge overcorrection: preserve exact-pair propionate and butyrate syntrophy,thermodynamic carrier-removal
  feedback,reciprocal spatial attraction,benzoate conversion,energy/product constraints and positive ES5 lag stimulation.
  Qualified mechanisms do not erase measured effects.'
- 'Propionate: hydrogen pressure differs from formate concentration. Both exact pairings are present in the comparative
  proteomic study,where main-text Fdh1/Hox assignments remain qualified. Protein abundance and homology are not
  selective enzyme demonstrations or carrier-flux fractions. Cooperation is reciprocal without bidirectional carrier
  donation. Reuse and amend the existing formicicum source-attribution discussion.'
- 'Coordination: manipulated starting ratios differ from the converged ratio. The former reverse arrow described
  aggregation rather than its population source. Retain the forward growth-to-ratio inference as PARTIAL and retain
  reciprocal attraction as a community observation. Physical disturbance changed activity without detectable aggregation
  changes,so mediation is unresolved. The nanomaterial study explicitly withholds decisive DIET attribution.'
- 'Butyrate: the accessible1981abstract names M.hungatei and reports added-hydrogen inhibition. Preserve directly
  implied feedback,but remove an unsupported graph pressure threshold,duplicate evidence and substrate-wide obligacy.
  Do not certify detailed exact-pair perturbation conditions from the abstract.'
- 'Benzoate: acetate remains organic carbon,so conversion is not complete mineralization. The pure-culture experiment
  explicitly demonstrates partner-free benzoate metabolism with a different product balance. Other-partner enzymology
  is not imported into the methanogenic pair. Benzoate graph grounding uses officially verified CHEBI16150,not neutral
  benzoic acid.'
- 'Gentianae: fermenter energy is not a second directed exchange;product inhibition is not intertaxon competition.
  Preserve the source-supported constraint chain while distinguishing approximate growth energy,dense suspensions,propionate
  addition and expanded-community rescue. The product arrow changes available free energy,not a fixed intrinsic
  threshold.'
- 'ES5: preserve the exact M.hungatei lag response;Table1 marks lag significant,not fitted rate/final concentration,and
  Discussion reports similar butyrate slopes. Do not transfer abstract-wide120%/150% to exact-triculture increases.
  Three-member outcomes include both syntrophic partners;their proteomes,not ES5,are assayed. Candidate methanogen
  signaling proteins were often more abundant in biculture,not uniformly activated by ES5. Both existing mediation
  arrows remain hypothetical.'
- 'Source-access challenge: four fresh extracted main bodies plus five older primary abstracts were read. Two 2024
  transcription quotes remain grounded only in existing curator-supplied publisher text; fresh retrieval failed.
  All 53 quotes match unchanged caches; 51 match fresh primary artifacts. Matching is not entailment. No original
  pixels, separate supplements or raw data were certified; read spans and retrieval failures are explicit.'
- 'Seven guarded records and eight append-only histories preserve 453 other records, 923 caches, raw non-graph blocks
  and prior decision/history artifacts. The second benzoate history records a shorter contiguous quote after bracket-stripping
  issue #622; the compound-or-CoA qualification remains in its explanation. Initial ledger, failed output and mutation
  proof are preserved. Exact canonical identity-only participants are used. Measured census gains three community-level
  records, two mixed and one community-only; seven denominator taxa and three solely-credited ES5 members. Connectivity
  logic and share guard remain unchanged.'
- Five real in-memory control/mutation/restored-control probes reject enzyme certainty,reverse ratio causality,competition
  typing,inflated exact-triculture rates and proven proteomic mediation. Each logs actual changed values and the
  rejecting assertion. Canonical hashes remain unchanged;these probes do not inflate pytest counts.
- 'Eleven focused tests and 1014 combined regressions pass. Seven schema/strict/term/local-snippet checks and eight
  histories pass. Six full-record reference CLI checks pass; coordination has one unchanged bracket-stripping #622
  failure, proved byte-identical on parent and matched to fresh primary text. It is an exception, not a pass. The
  70 outputs include six superseded outputs: five from before the quote correction, plus the initial regression
  failure. The new bracket quote was corrected and revalidated; the exact participant-user test was updated for
  the three intentionally added records after the measured census. Neither failed run is counted as a pass. All
  56 existing network warnings are unchanged; zero structural defects. Deterministic rendering and exact HTML-description
  matching cover 456 pages, 1366 nodes and 535 arrows, not screenshots. Full-corpus snippets remain informational,
  not clean-corpus certification.'
- 'Graph repairs #1871-#1876 await protected-main merge; non-graph metadata follow-ups #1877-#1878 remain open.
  Source-based self-review is not independent approval. Reference-loader, DOI-case and preexisting snippet-rendering
  issues remain outside scope; macOS reference success is not Linux certification. No artificial CI, access/protection
  bypass or premature branch deletion.'
- 'Corpus status: 362 reviewed, 45 pending, 53 needs_research across 460 records. The overall goal is incomplete.
  Exact-head publication and postcommit docs-current remain separate gates, not preasserted in this report.'
- Plain just-lint passed;explicit-runtime no-incremental mypy additionally checked.
