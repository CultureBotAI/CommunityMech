adversarial_checks:
- Read all three whole records and fresh open-access primary main bodies, Methods, Results, Discussion
  and embedded captions/table text. Account for all15 original nodes and2 arrows. Original figure pixels,
  separate supplements, raw data and executable models not audited; flattened matrices not used to recurate
  exact gene-by-strain assignments.
- Brachypodium design and five-phylum assembly are procedures, not ecological causal nodes. Remove both
  while retaining design metadata and positive biological results. Retain genomic potential and member
  assay phenotypes as bounded context, not traced expression, transfer or host mediation.
- 'Brachypodium abstract stability is qualified by Results: six strains undetectable or below0.1% after
  three weeks in vitro, with more balanced host-associated profiles. Do not equate relative detection
  with viable counts or uniform15-member stability.'
- Adversarial diff review caught mixed host/liquid evidence classification after the initial candidate.
  Replace the broad stability excerpt with direct host Results labeled IN_VIVO and preserve separate IN_VITRO
  low-detection evidence. Retain the initial31 actual outputs/digests as superseded; rerun all31 final-state
  gates.
- Brachypodium significant plant outcomes occur after rewatering; sustained-drought endpoints were not
  significantly improved. Root-tip responses are strain/condition dependent; root exudate recruitment
  and metabolite return remain hypotheses. Correct live-host evidence classification without claiming
  universal tip preference or migration tracking.
- Gut model predictions and effective signed interactions are not universal acetate cross-feeding or demonstrated
  niche partitioning. The acetate passage is prior-literature context. Keep model/experimental evidence
  distinct, acknowledge imperfect prediction and higher-order/parameter uncertainty, and do not turn OD-scaled
  abundance into viable-cell counts.
- 'Drop the gut inference-to-topology workflow arrow only. Retain topology-to-coexistence: coupled positive
  and negative effects implement negative feedback in fitted pairwise gLV models over tested parameter
  ranges, with CH-ER as an experimentally coexisting example. Do not erase this positive model mechanism
  or generalize to every full-community condition.'
- Soil nutrient tests used18 starting strains; ratio panels and EcoFAB17/18 differ from the final16. Keep
  nutrient/ratio diversity and plant colonization as positive observations with correct variants/time
  bounds. Pseudomonas in-vitro effects do not transfer automatically to EcoFAB. Single inoculum batch
  and relic-DNA/relative-abundance limits remain explicit.
- Remove soil automated assembly and storage nodes while preserving their valid methodological outcomes
  in discussion. Taxon-dropout results remain described as context; proposed facilitation/competition
  is not silently minted into new causal structure. No new nodes/arrows; no paid Edison calls.
- Canonical taxa remain unchanged domain-level aggregate placeholders, explicitly named on all11 retained
  nodes. This is not resolved experimental membership. Non-graph taxonomy, ingredient and protocol defects
  remain separately OPEN under1548; raw non-graph blocks preserved, not recertified.
- Full biological diffs, participant registry and focused tests reviewed.457 other records and920 caches
  unchanged. Both-root participant census unchanged; no audit-rule changes.36 baseline network warnings
  preserved, no structural defects, deterministic rerenders and456-page exact description parser, not
  browser screenshots.
- 844 all-state issue titles/bodies plus41 scoped ignored/hidden local matches searched; all10 matching
  issue bodies read, not every comment/PR/local match.1545-1547 addressed but OPEN until protected-main
  merge. Exact-head self-review is COMMENT, not independent approval. Post-commit docs-current remains
  a separate publication gate.
