adversarial_checks:
- Pre-paper both-root baseline and whole-record reads preceded curation. Every17original node and10arrow has a retained/removed
  decision. Three protocol nodes removed,14biological-result nodes and6arrows retained; no new causal topology or
  provider spend.
- Vitamin complementation is experimentally demonstrated in both directions. Preserve cobalamin rescue, partial
  thiamine rescue and algal support of niacin/biotin/pABA needs. Do not downgrade physiological mutualism merely
  because transport and secretion flux were not measured.
- Vitamin ratio dynamics supplied thiamine/biotin, unlike the all-vitamin-omission experiment. Serial persistence
  and approximate1:1ratios survive; addback and convergence do not exclude competition for other nutrients or establish
  active regulation. Remove the fixed-carbon/persistence-to-vitamin arrow; the biologically motivated reciprocal
  rescue-to-persistence extension remains1664pending workflow.
- PET uses four strains in three species, with distinct canonical Bs_PETase and Bs_MHETase preferred names sharing1423.
  Extracellular enzyme division is not itself nutrient uptake by the MHETase producer. Both hydrolysis-product supply
  arrows remain.
- PET exogenous inhibition, standalone RHA1TPA consumption and consortium degradation are positive experiments.
  Replace31.2%film loss as a TPA-utilization quote with the28h standalone assay; use7days from Results rather than
  conflicting3day abstract. Preserve contribution to degradation with quantitative/mediator limits.
- KT2440EG utilization and EG inhibition are real, but BHET product nonaccumulation is not PET mass balance; PETTPA
  transiently increases. Different media/inocula and lower four-member film loss do not isolate EG-mediated improvement.
  No complete mineralization or zero-intermediate claim.
- Rich-medium P.putida dominance motivates Wn/inoculum control. Preserve23.2%seven-day optimized37C film loss and
  same-medium two-member comparison, not durable coexistence or unique resource-competition mediation.37C is actually
  supported for the community, not automatically preculture-only.
- 'PGM source identity matters: PMID31059950=DOI10.1016/j.jenvman.2019.04.081is one uncrushed refinery-column paper.
  Its Ni82.9%,Al33.4%,Mo22.7%at315h and V53.6%at105h are not Pd/Pt/Rh recovery or a two-step PGM exposure cascade.
  Abstract-only access is not proof that unseen experiments are absent.'
- The complete thiosulfate paper prepares synthetic metallic Pd on alpha-alumina. Separate activated-sludge thiosulfate
  is concentrated100C/filtered before60C,pH8leaching.93.22%solid depletion differs from63.53%dissolved recovery
  with precipitation; no exact unique complex stoichiometry or benign industrial viability asserted. Preserve prior605
  taxon removals and correct aluminium elemental label without inventing ionic state.
- Variovorax six hits are individually tested, not a co-inoculated consortium. Preserve CF31317%chlorophyll loss
  versus20.4%mock and9.3%thermopriming. Wells are experimental units; approximately10seedlings per well are pooled,
  not independent treatment replicates. Removed establishment/calibration/screen nodes preserve methods in surviving
  prose. Adversarial follow-up explicitly grounds the six-hit panel and limits both CF313 nodes to its exact canonical
  preferred name despite shared genus34072;17affected checks rerun with prior outputs retained.
- Live/killed/filtered-supernatant controls support a live-cell benefit, not a physically isolated contact requirement.
  The author contact inference remainsPARTIAL; ongoing/unstable/host-induced signals remain alternatives. ACC/ethylene
  is proposed, not tested. Prior workflow removals retained and final confirmation-to-contact workflow arrow removed.
- Three fresh main texts, thiosulfate tables/captions and cached vitamin main manuscript/captions read. Column abstract
