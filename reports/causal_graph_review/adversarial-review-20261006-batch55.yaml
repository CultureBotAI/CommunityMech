adversarial_checks:
- Whole787-line REE,410-line Jala and271-line Jiangshui records read, all13 nodes/10 arrows. Full cached
  primary main text and Methods for REE/Jala, Figures1-7/1-6 captions and Jala Tables1-2. Jiangshui abstract/indexed
  publisher fragments only, direct403; no primary full body. No original images, external supplements,
  raw data or code audited.
- REE fresh NCBI XML selected-claim spot-check, not a full second reading. Jala fresh Frontiers formulation/Discussion
  spot-checks only; duplicate pmc_full cache not independently read. Source scope is not inferred from
  misleading abstract-only cache headers. All920 caches unchanged;22 already-cached source words independently
  verified against XML with digest.
- REE Bacillus/Micrococcus isolate assays are separate cultures, not reciprocal commensalism. Teichoic-acid
  removal lowers total wall adsorption65.5to17.8percent and removes HREE preference but residual binding
  remains. Positive intervention preserved as SUPPORT/IN_VITRO, not downgraded merely because deposit
  mediation is unresolved.
- Freeze-dried binding is consistent with passive adsorption, not active metal-ion transport. Yb/P colocalization
  supports surface groups, not uniquely resolved geometry or exclusive ionic-radius cause. Multi-element
  adsorption and higher-doseYb imaging differ. Graph removes dysprosium atom mislabeled ion and free phosphate
  as bound wall groups; no guessed replacement CURIE.
- Field HREE56-184ppm is an elemental sum, not a single Y-ion concentration. TotalREE776ppm near6m and45mA/B/P
  profile retained. Profile microbial/geochemical correlations and laboratory fractionation support a
  PARTIAL contribution, not isolated deposit-scale magnitude. Non-graph40m/C-horizon and other inherited
  claims remain1520, not silently certified.
- Microbial/fungal weathering routes remain HYPOTHESIZED because the primary discussion uses prior-literature
  functions and community associations. No measured phylum-level complementarity, orders-of-magnitude
  acceleration or direct donor-recipient flux. Acidobacteria generally decrease with depth before the45m
  exception; neither abundance nor oligotrophic interpretation establishes ligand transfer to Proteobacteria.
- Jala actual SynCom3 has six strains. All four canonical entries are explicit subsets; no four-member
  experiment invented. Missing Achromobacter/Phytobacter, exact strain identity and E1BL2-versus-E2HL9
  primary-source inconsistency remain unresolved1521. Canonical IDs/labels unchanged.
- Positive maize assays remain SUPPORT, with Salkowski indole-reactivity, ACC-growth proxy, acetylene-reduction
  rather than plantN transfer, and CAS identity limits. These are not selective mediator perturbations.
  Up-to80percent inhibition is not every fungus; Helminthosporium hardly inhibited by3. PAL triples but
  fungal-challenge ISR test was not conducted.
- Conejo gnotobiotic/greenhouse growth and CPL9105W field effects are distinct experiments. Greenhouse
  shoot/root dry weights2.3/3 differ from root/shoot length ordering3.3/1.4. Field16vs11tons/ha and abstractrust12.5to8percent
  retained within one-site scope, not12.5percentagepoints or all-SynCom generality.
- Remove maize compatibility-assembly node and two workflow arrows, and the seedling-to-field selection
  arrow. Keep four biological nodes/two PARTIAL proposed routes with explicit mediating ideas and missing
  tests. Field defense arrow is scoped to rust component, not a demonstrated explanation of yield.
- Jiangshui screening/ratio design node and arrow removed, not the positive fermentation effect. Retain
  formulation-to-content intervention:2:3:1,phenols+72.20percent,flavonoids+61.13percent versus natural
  fermentation. Do not assert isolated ratio causation, specific compound flux or de-novo synthesis. Three
  differently named NCBITaxon2 strains stay distinct; existing taxonomy/protocol discussion and both histories
  preserved.
- Full record diffs, eight focused tests, ledger partitions and participant registry inspected. All11
  remaining nodes have explicit canonical participants. Two nodes/four arrows removed; two HYPOTHESIZED,
  three PARTIAL and one direct formulation-level arrow retained. Only graph/discussion/curation-history
  record fields change;457 other records and raw non-graph blocks unchanged.
- Actual focused schema/strict/term/reference/snippet/history/rank gates passed. All34 baseline network
  findings unchanged with zero structural errors. Repeat renders deterministic and descriptions parser-checked
  across456 pages, not browser screenshots. Measured both-root participant census is recorded, no production
  matching or census-bound change.
- Dedup searched822 all-state issue titles/bodies and14 ignored/hidden local matches; relevant contexts
  inspected, not every historical comment/review. Closed824 is prior wording fix.1517-1519 addressed but
  open until protected-main merge;1520-1521 unresolved. No Edison dry run, paid call or new graph structure.
  Self-review is not independent approval.
