adversarial_checks:
- 'Whole original targets and every changed graph/discussion diff reviewed. All11originalnodes/6directions have
  dispositions: retain6nodes, remove5workflow/unverified-attribution nodes and all6directions, rename6nodes. No
  new topology or provider spend.'
- 'Challenge removal versus lost evidence: preserve the soy-sauce flavor measurements, chlorophyll genotype/composition/host
  observations and soymilk succession/dropout response. sfSynCom positive helper and consortium results remain in
  the discussion; only their mapping to the assumed three-microbe formulation is withheld, not the published results.'
- 'Soy sauce: experimental scheduling is not demonstrated ecological niche partitioning. Preserve laboratory comparator
  scope without universal optimum, industrial efficacy or recalculated ambiguous fold changes. Existing compact-table
  history899 unchanged; no operational enhancements added.'
- 'Chlorophyll: genotype-pattern interpretation leaves selection pressures unresolved. Relative composition and
  co-occurrence do not establish niche partitioning, cooperation or IAA/siderophore mediation. Host phenotype is
  not reciprocal microbial benefit or direct nitrogen flux. Table1 shares significance letters with both controls
  for the three named endpoints; retain higher reported means without blanket significant superiority. Pot soil
  provenance is not field deployment. Previous formulation-arrow removal remains.'
- 'sfSynCom: exact community membership and source identity of ordinal helper slots are unverified from the abstract,
  not disproven globally. Do not silently equate two mentioned helper strains with the complete final consortium,
  assign reciprocal pairwise benefit or import another formulation. Keep needs_research and identity1820 open; retain
  positive abstract observations with partial attribution support.'
- 'Soymilk: succession does not isolate directional facilitation; dropout-associated transcription indirectly supports
  the authors'' nutrient-supply interpretation, not traced transfer or mediation of succession. Retain HYPOTHESIZED/PARTIAL
  qualifiers, abstract-bounded statistical provenance and two canonical identity-only succession participants. Do
  not invent tools, versions, exact compounds or recipient-specific exchange.'
- Nine graph and five discussion quotations match fresh primary text and unchanged caches. Primary body coverage
  is bounded for soy-sauce/chlorophyll (including extractedTable1); sfSynCom/soymilk independent evidence is abstract-only.
  HTTP403 access failures and lack of a PMCID are not proof that full texts or supporting details do not exist.
  No access bypass, cache imports, supplements/figure-pixel or raw-data certification.
- Four guarded writes and four append-only histories;456otherrecords/all923caches and prior history/decision files
  byte-identical. Alias-linked non-graph evidence preserved. sfSynCom previously had only pairwise nodes, so removing
  that graph does not change the community-level census; soymilk's succession scope is narrowed without audit-rule
  or threshold changes.
- Eight focused tests and943combined regressions pass. Four full-record schema/strict/term/reference/snippet checks
  and four histories validate. Network equals56baselinewarnings with zero structural defects. Deterministic rendering
  and exact HTML parser cover456pages/1373descriptions/551arrows, not screenshots. Plain just-lint passed; explicit-runtime
