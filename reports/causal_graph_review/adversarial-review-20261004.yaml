findings:
  - issue: https://github.com/CultureBotAI/CommunityMech/issues/1234
    severity: medium
    finding: A matching record hash could count an incomplete decision artifact as a completed review.
    resolution: Require matching IDs, known statuses, complete nonblank node rationales, an exact current edge snapshot, source references, and the actual decision-file pointer. Added positive and negative tests. Regenerated the TSV after the completed writer run to eliminate empty trailing fields.
    status: addressed
  - issue: https://github.com/CultureBotAI/CommunityMech/issues/1235
    severity: medium
    finding: Three optional ecological classifications remained stronger than their cited evidence.
    resolution: Removed COMMENSALISM from the AMD carbon-removal node and MUTUALISM/SYNTROPHY from the denitrification communication/endpoint nodes. Preserved measured processes, qualified edges, and knowledge gaps. Added guarded curation events and append-only follow-up histories.
    status: addressed
source_checks:
  - record: CommunityMech:000001
    result: Guild-level reviews and separate isolate physiology do not establish a measured six-member iron/carbon exchange network or a +/0 outcome. Retained only a qualified electron-acceptor-enabled carbon-oxidation edge.
  - record: CommunityMech:000134
    result: Comparative genomics and modeling motivate the DIET conduit; sulfur amendments directly support inhibitory edges. Consolidated the repeated DIET pair without treating proposed conduit details as measured.
  - record: CommunityMech:000116
    result: PMID:40020349 supports communication, DBP-induced phenazine electron transfer, and a stable denitrification endpoint. The accessible abstract does not isolate mediator contributions, paired fitness effects, or syntrophic product removal.
  - record: CommunityMech:000190
    result: Transcript comparisons are confounded by substrate and growth conditions. Preserved conditional formate/BES inhibition evidence while removing parallel-response arcs and the unsupported amino-acid transfer direction.
