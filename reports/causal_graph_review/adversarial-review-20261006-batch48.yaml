adversarial_checks:
- Whole CL95 and S11 records and every original node/arrow read. CL95 complete cached primary body, Methods,
  Tables1-2 and captions; selected cached S3/S5/S6/S7 text. S11 primary abstract only; full article unavailable.
  No original supplemental DOCX, figure images, raw data or code inspected.
- Positive CL95 73% plate inhibition, 66.67% field control and growth phenotypes remain. No resource-competition
  mechanism, reciprocal fitness or causal suppression-to-growth mediation is inferred from those measurements.
  The sole correlation-only arrow is removed rather than converted into a demonstrated link.
- Both Bacillus velezensis strains remain distinct by canonical strain labels despite sharing a species
  CURIE. All five CL95 members and the external pathogen or host are unchanged. No generic helper drops
  the host/pathogen or collapses the strain identities.
- 'Table S5 plate zones remain exact CL95 proxy endpoints, not nutrient transfer to ginseng. Preserve
  earlier phosphate-removal and broad-process fixes #892/#893 and the prior cache fix #894.'
- Labeled NJ13/NT35/FG14 recovery does not independently track every CL95 member or demonstrate directed
  movement of individual cells. Separate soil enzyme activity from its organism of origin and causal mediation;
  broaden symbiosis GO to the existing interspecies process. Preserve the abstract/main-text catalase
  percentage discrepancy rather than silently choosing a new value.
- Defense-gene transcription and microbiome associations are positive observations but not pathway-blockade,
  recruitment or nutrient-flux proof. Their unresolved mediation remains in the existing anchored knowledge
  gap, with no unsupported new causal structure or paid Edison run.
- S11 improved bulk removal remains positive. Retain authors HNAD isolate characterization while removing
  resolved graph-level oxidation/denitrification assignments and unmeasured MUTUALISM. Do not infer percentage-point
  improvement or confuse residual industrial nitrite with removal efficiency.
- 'Graph evidence aliases were deep-copied before changing explanations. Engineering-design and taxonomy
  aliases, non-graph raw blocks, prior history values and #1027 modeled_environment are unchanged. Six
  focused tests cover these risks and exact all-node/arrow ledger coverage.'
- Inspected record/test diff. All four nodes retained; one arrow removed. Two guarded records, two append-only
  histories and two regenerated pages. All 458 other records and 920 caches preserved, not certified.
  All participant scopes and measured connectivity census unchanged; no registry, range-bound or production
  matching changes.
- Initial472-regression pass and Ruff B905 failure retained with output digests. Corrected the new ledger
  test to zip(..., strict=True), then reran the regression suite, Black and Ruff. No scientific record,
  source cache or history was changed by this test-only correction.
- Actual schema, strict, labels, references, snippets, rank and history gates passed; network equals baseline
  with34 pre-existing findings and zero structural defects. Repeat HTML renders and all descriptions parser-checked
  without claiming browser screenshots. Actual post-commit docs-current remains a separate gate.
- Dedup includes799 all-state issue titles/bodies and ignored/hidden local files. Closed issues892/893/894/1027
  concern distinct earlier fixes; no duplicate found in inspected scope. Not every comment or PR review
  inspected. Source-based self-adversarial review is not independent approval.
