  - issue: https://github.com/CultureBotAI/CommunityMech/issues/1236
    severity: high
    finding: Some causal claims and ecological classifications exceeded the cited same-system evidence.
    resolution: Remove the unsupported AMD urea node and two arrows; qualify retained mechanisms and remove unsupported classifications across five records. Preserve measured endpoints and add anchored knowledge gaps. Record two justified no-change decisions.
    status: addressed
  - issue: https://github.com/CultureBotAI/CommunityMech/issues/1237
    severity: medium
    finding: A selected-excerpts cache could be promoted to independent source text solely by a Content or Abstract heading.
    resolution: Explicitly exclude selected-excerpts Markdown caches, including quoted and case-varied metadata. Preserve independently retrieved sibling text.
    mutation_test: Before the fix, three of four initial cases failed. After the fix and quoted/case-varied expansion, all ten cases passed.
    status: addressed
  - issue: https://github.com/CultureBotAI/CommunityMech/issues/1238
    severity: high
    finding: The active community template omitted causal node and edge descriptions, hiding uncertainty qualifiers in published pages.
    resolution: Render escaped optional descriptions in their corresponding node and downstream blocks. Allow long text to wrap. Regenerate community pages and compare their parsed descriptions with YAML.
    mutation_test: Before the fix, four of five focused publication tests failed. All five passed after the fix.
    status: addressed
