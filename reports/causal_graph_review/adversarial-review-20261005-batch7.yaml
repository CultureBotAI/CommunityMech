    and DOIs; matching bodies and issue 543 comments read. Not an exhaustive comment search.
limits:
- This is a critical second pass by the editing agent, not independent approval.
- Corpus-wide semantic review remains incomplete; this batch does not certify all 460 records.
- No new nodes or arrows and no paid Edison job. Spending authorization is recorded, but no configured credential
  was available in the checked project/ambient configuration.
- Source and unread-material scopes are recorded per record. Cache matching alone does not validate causation; no
  model reruns or figure/supplement certification are claimed.
- No PDF, source body or unrelated untracked research file is part of this patch.
- Deterministic HTML and exact description coverage are checked; no screenshot QA for this data-only batch.
- Local workspace PDF gate fails on unrelated ignored/untracked files; the publishable snapshot passes all three
  rights tests. No PDF/article body is part of this patch.
- Additional regression subprocesses encounter the pre-existing local llvmlite build failure. Original failure counts
  and an isolated-environment rerun are reported separately; only CI can certify the normal project environment.
