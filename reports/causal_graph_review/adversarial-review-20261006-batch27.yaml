findings:
- issue: 1365
  severity: P2
  status: addressed_in_this_change
  finding: The Crystal Geyser graph overstates lipid transfer and assigns syntrophy/commensalism without
    resolved exchange or fitness evidence.
  disposition: Keep the positive carbon-source and mixed-fraction lipid observations; qualify acquisition
    and both existing arrows, remove unsupported relationship types, preserve canonical participants,
    and add an anchored research gap.
- issue: 1365
  severity: P2
  status: caught_by_regressions_and_corrected
  finding: 'The first candidate omitted Crystal Geyser from the exact participating_taxa USERS registry:
    one failed and 329 passed.'
  disposition: Added exactly that record to the registry (167 to 168). Connectivity surveys remain identical,
    including 124 mixed-scope records; no numeric bound or production logic is loosened. Full verification
    rerun is retained.
- issue: 1366
  severity: P2
  status: open_nongraph_followup
  finding: Crystal Geyser non-graph metadata retains stronger lipid-dependence and pressure-adaptation
    wording.
  disposition: Tracked separately; all non-graph record blocks are preserved, not certified by this graph
    review.
- issue: 596
  severity: P2
  status: open_source_access_followup
  finding: DCPP has 19 snippets absent from independently retrieved abstract text and no reviewed complete
    primary body.
  disposition: Leave the record unchanged and mark needs_research; selected excerpts and a diagnostic
    exit zero do not certify its body-specific graph claims.
adversarial_checks:
- All seven original nodes and two original arrows have explicit decisions; three node renames propagate
  to exact edge targets and new discussion anchors.
- Carbon-source support is retained rather than discarded for lack of organism-resolved flux; fractionation
  assumptions and heterotrophic reuse remain explicit.
- The separate archaeal lipid proposal is not evidence for archaeal-to-CPR donation. The broad producer
  participant is contextual, not a resolved donor.
- Lack of known pathways does not exclude unknown ACP-independent synthesis. Scavenged biomass and direct
  host acquisition remain alternatives.
- Mixed size fractions, abundant Sulfurimonas in the initial fraction, and the separate CPR-rich FTIR
  sample do not establish purified-cell uptake, curvature benefit, or commensal fitness.
- Nitrifier abstract-level sequential conversion, selected organic-nitrogen conditions, nitrate and endpoint-nitrite
  limits are retained; relative-abundance associations do not justify extra arrows.
- DCPP exact strain comparisons, partner-specific detoxification and LC-MS details remain unresolved.
  Metabolite detection is not organism-resolved exchange flux.
- One guarded record edit has one llm-assisted curation event and one append-only history. Unchanged records
  receive no invented edit events or histories.
- Non-graph blocks, the other 459 records, and all 920 caches are byte-preserved. No primary full body,
  PDF, new graph structure or Edison output is introduced.
- Both corpus roots are inventoried. Issue deduplication includes ignored and hidden local files plus
  698 all-state issue titles/bodies, not every issue comment.
- All 456 community pages have node and arrow descriptions compared to source YAML by HTML parser, with
  deterministic repeat rendering. Browser screenshots were not performed.
