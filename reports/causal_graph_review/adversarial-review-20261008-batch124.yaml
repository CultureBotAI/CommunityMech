      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 102
      assertion: assert "final Streptococcus counts converged" in d["description"]
      restored_control: PASS
      changed_values:
      - path: records/3/ecological_interactions/3/description
        before: In the S. thermophilus 1131/L. bulgaricus 2038 pair, disrupting S. thermophilus nox reduced oxygen
          removal and slowed skim-milk acidification. Pre-fermentation deoxygenation mainly accelerated early S.
          thermophilus growth and formate/lactate accumulation, not L. bulgaricus growth; final Streptococcus counts
          converged. This is a fermentation phenotype, not colonization facilitation. A direct Nox-to-Pfl mechanism
          remains HYPOTHESIZED.
        after: In the S. thermophilus 1131/L. bulgaricus 2038 pair, disrupting S. thermophilus nox reduced oxygen
          removal and slowed skim-milk acidification. Pre-fermentation deoxygenation mainly accelerated early S.
          thermophilus growth and formate/lactate accumulation, not L. bulgaricus growth; final Streptococcus counts
          increased. This is a fermentation phenotype, not colonization facilitation. A direct Nox-to-Pfl mechanism
          remains HYPOTHESIZED.
    - mutation: Combine three separate mutualism pairs
      test: test_zymomonas_rescue_is_positive_and_pairs_are_separate
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 112
      assertion: assert "three separate pairs" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/4/ecological_interactions/2/description
        before: Each of three separate pairs containing the Z. mobilis ZMO0748 auxotroph and an E. coli proA, pheA
          or ilvA auxotroph grew in unsupplemented ZMMG, where the individual auxotrophs did not. Optical density
          and species-resolved flow cytometry support growth of both partners under those conditions. This does
          not establish long-term community stability or the absence of additional beneficial or inhibitory exchanges.
        after: Each of one four-member consortium containing the Z. mobilis ZMO0748 auxotroph and an E. coli proA,
          pheA or ilvA auxotroph grew in unsupplemented ZMMG, where the individual auxotrophs did not. Optical density
          and species-resolved flow cytometry support growth of both partners under those conditions. This does
          not establish long-term community stability or the absence of additional beneficial or inhibitory exchanges.
    - mutation: Erase alternative sulfur rescue
      test: test_zymomonas_sulfur_rescue_is_not_exclusive_glutathione
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 121
      assertion: '"Cysteine and glutathione supplementation independently supported rescue"'
      restored_control: PASS
      changed_values:
      - path: records/4/ecological_interactions/1/description
        before: E. coli spent medium rescued the Z. mobilis ZMO0748 cysteine-synthase-like mutant. Cysteine and
          glutathione supplementation independently supported rescue. Glutathione-related compounds were detected
          in spent medium, but free cysteine below detection was not excluded. Thus the phenotype is experimentally
          supported while the exact naturally transferred sulfur compound and release/uptake route remain PARTIAL.
        after: E. coli spent medium rescued the Z. mobilis ZMO0748 cysteine-synthase-like mutant. Only glutathione
          could rescue growth. Glutathione-related compounds were detected in spent medium, but free cysteine below
          detection was not excluded. Thus the phenotype is experimentally supported while the exact naturally transferred
          sulfur compound and release/uptake route remain PARTIAL.
    - mutation: Reclassify hCom resistance as facilitation
