- All15nodes and8arrows retained, six coherent renames, no new topology. Six canonical diffs and cache changes read.
  TCP graph-owned YAML anchors preserved so unrelated media/ingredient blocks remain byte-identical. No dangling
  targets or discussion anchors.
- 'Algae-only controls bound a future AM-AB graph: early nitrogen removal is slower, phosphate detection limits
  occur in both conditions, and BOD performance is not uniformly improved. Full Methods metadata is available, not
  an ongoing abstract-access gap. Extension1968 and metadata1969 stay open.'
- TCP metagenomic reconstruction is COMPUTATIONAL/PARTIAL, without invented tools, genus-specific roles or measured
  transfer. Positive substrate amendments and culture-wide removal remain. Prior1108/1109 repairs preserved; no
  new coupling-to-removal arrow.
- Yarrowia exact YBGL3/YBXT-XR pair, shared glucose use and substrate succession are distinct from exclusive niches.34%
  versus26.3% is a lipid-fraction comparison; best titer is comparable and1:2 performs worse. No polymer GO or demonstrated
  burden-relief claims. Version1 preprint and metadata1970 limits remain.
- Yogurt nutritional modeling, Nox perturbation and urease strain panels stay distinct. Positive interventions retained
  with early/final and Streptococcus/Lactobacillus recipients separated. Nitrogen sufficiency and universal return-flow
  mediation are not asserted. Both community-scoped outcomes name both original participants; metadata1971 remains.
- Zymomonas spent-medium and individual-metabolite rescue remain positive, not mere correlation. Cysteine and glutathione
  are sufficient alternatives; exact natural sulfur compound and release route remain unresolved. Three pairs remain
  separate, with species-resolved counts and no long-term stability assertion.
- hCom2 stability and resistance have direct endpoint evidence, not an assembly-only citation or colonization-facilitation
  labels. Donor dependence and dropout architecture confounding limit mechanism/individual-strain claims. Non-graph
  debt765 remains and no restricted full body is restored.
- Thirteen focused tests and twelve targeted in-memory control/mutation/restored-control probes pass. Probes reject
  specified scientific regressions, not every possible equivalent wording. Early test development failures included
  an incorrect test taxon identifier, corrected to unchanged canonical NCBITaxon1585.
