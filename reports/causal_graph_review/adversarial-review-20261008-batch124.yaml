      - path: records/5/ecological_interactions/2/interaction_type
        before: null
        after: COLONIZATION_FACILITATION
    - mutation: Erase hCom donor dependence
      test: test_hcom_donor_and_mediator_limits_remain
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 142
      assertion: assert "weaker resilience to unrelated fecal donors" in b["description"]
      restored_control: PASS
      changed_values:
      - path: records/5/ecological_interactions/1/description
        before: In gnotobiotic mice, hCom2 was more resilient than hCom1 to fecal challenge. The primary study also
          reports weaker resilience to unrelated fecal donors. Stability is therefore donor- and experiment-dependent,
          not complete exclusion or universal human-microbiome equivalence.
        after: In gnotobiotic mice, hCom2 was more resilient than hCom1 to fecal challenge. The primary study also
          reports equal resilience to all fecal donors. Stability is therefore donor- and experiment-dependent,
          not complete exclusion or universal human-microbiome equivalence.
