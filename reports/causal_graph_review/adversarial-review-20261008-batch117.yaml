adversarial_regression_proof:
  report:
    cases:
    - mutation: Replace enriched sequential assembly with pure simultaneous isolates
      test: test_tribromophenol_retains_enrichment_and_sequential_cross_feeding
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 22
      assertion: assert "highly enriched Dehalobacter FTH1 culture" in a["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/0/description
        before: Clostridium strain Ma13 ferments glucose to supply hydrogen for reductive debromination by the highly
          enriched Dehalobacter FTH1 culture. The abstract supports this functional cross-feeding, not purity of
          the FTH1 inoculum or a closed three-isolate community.
        after: Three pure isolates were inoculated simultaneously.
    - mutation: Invent labeled TBP tracer
      test: test_phenol_outcome_does_not_invent_reciprocal_benefit_or_tbp_tracer
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 35
      assertion: assert "ring-labeled phenol, not labeled tribromophenol" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/2/description
        before: Desulfatiglans parachlorophenolica strain DS mineralizes the phenol intermediate after its sequential
          introduction. This is a recipient degradation outcome, not an observed DS-to-FTH1 benefit. The radiotracer
          confirmation used ring-labeled phenol, not labeled tribromophenol.
        after: Labeled tribromophenol tracing demonstrates reciprocal benefit.
    - mutation: Promote expressed pathway to measured hydrogen transfer
      test: test_hydrogen_transfer_is_proposed_despite_expressed_pathways
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 45
      assertion: assert all(e["supports"] == "PARTIAL" for e in n["evidence"])
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/1/evidence/0/supports
        before: PARTIAL
        after: SUPPORT
    - mutation: Promote hydrogen model arrow to measured fitness
      test: test_host_energetics_arrows_do_not_upgrade_model_to_measured_fitness
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 56
      assertion: assert edge["target"] == d["name"] and edge["description"].startswith("PARTIAL:")
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/0/downstream/0/description
        before: 'PARTIAL: proposed host-product consumption by the sulfate reducer could lower hydrogen availability
          and thereby improve host fermentation energetics. This is the authors mechanistic model, not a measured
          transfer-to-fitness causal effect.'
        after: Hydrogen uptake demonstrably increases host fitness.
    - mutation: Force behavioral capability into mutualism
      test: test_observed_magnetotaxis_survives_without_forced_mutualism
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 64
      assertion: assert "interaction_type" not in c and c["scope"] == "PAIRWISE"
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/2/interaction_type
        before: null
        after: MUTUALISM
    - mutation: Transfer R1 salt tolerance into R2 outcome
      test: test_urine_reactor_roles_do_not_transfer_salt_challenge_conditions
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 81
      assertion: assert "not transferred to reactor 2" in b["downstream"][0]["description"]
      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/1/downstream/0/description
        before: The complementary ammonia- and nitrite-oxidation functions enable nitrate output from hydrolyzed
          urine nitrogen in the five-member reactor. The reactor-1 salt tolerance and removal benchmark are not
          transferred to reactor 2.
        after: R1 salt tolerance proves the five-member R2 performance.
    - mutation: Turn urine nitrate production into spaceflight readiness
      test: test_urine_outcome_distinguishes_batch_rates_and_application_motivation
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 89
      assertion: assert "15 +/- 6 mg nitrate-N/L/day" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/2/description
        before: The five-member urine-fed community in reactor 2 produced nitrate at 15 +/- 6 mg nitrate-N/L/day
          with 1 percent synthetic and 10 percent fresh real urine, respectively. Separate fresh-real-urine batch
          activity tests reached 29 +/- 3 mg N/L/day. These are distinct assay outcomes, not rates to combine with
          the reactor-1 salt challenge. The reported organic removal still required optimization; nitrate production
          is not proof of spaceflight performance or fertilizer readiness.
        after: The reactor proves spaceflight fertilizer readiness.
    - mutation: Restore untested community-wide vitamin recipients
      test: test_vitamin_recipient_and_production_assay_are_not_network_wide
      control: PASS
      mutation_applied: true
      mutation_rejected: true
