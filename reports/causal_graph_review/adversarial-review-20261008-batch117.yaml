        after: COMMUNITY_LEVEL
    - mutation: Erase experimentally supported mutual benefit
      test: test_vitamin_mutualism_preserves_evidence_without_exclusive_mediation
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 108
      assertion: assert c["interaction_type"] == "MUTUALISM" and c["evidence"][0]["supports"] == "SUPPORT"
      restored_control: PASS
      changed_values:
      - path: records/3/ecological_interactions/2/interaction_type
        before: MUTUALISM
        after: COMMENSALISM
    - mutation: Silently reconcile inconsistent primary fold changes
      test: test_source_discrepancies_are_not_silently_reconciled
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 119
      assertion: assert "no reconciled fold increase" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/3/ecological_interactions/2/description
        before: Both isolates achieve higher viable cell densities in coculture than in monoculture over the reported
          serial-passage assay, supporting MUTUALISM under those conditions. Auxotrophy, supplementation and extracellular
          vitamin measurements support a vitamin-exchange mechanism, without proving vitamin-only mediation or direct
