adversarial_checks:
- Fresh both-root baseline preceded papers; all11originalnodes6arrows have dispositions:10nodes4arrows retained,
  one assembly node and two outcome-to-expression directions removed. No new topology or reverse arrows.
- Propanotroph positive removal and genus-selection findings survive. Expression was not examined; gene content
  and abundance do not identify active enzymes or cross-feeding. Three existing directions remain with explicit
  partial/hypothesized mediation, not blanket deletion of selection findings.
- Prymnesium observed whole-community outcomes and expression responses remain. Correlation-like arrows do not establish
  outcome-to-transcription causality. Carbon reciprocity remains the authors hypothesis. No directly measured extracellular
  flux or competitive fitness cost is claimed.
- Prymnesium producer attribution is inconsistent across source sections. The disputed participant is omitted without
  substituting a new strain. Existing roles and proposed experiments remain outside certification; no new experimental
  procedures, genetic designs or growth-optimization details are added.
- Aniline retains the positive monoculture comparisons and previously corrected evidence. Analytical removal is
  not proof of complete mineralization or a named pathway; conclusions and main results differ in evidentiary scope.
  Supplements were not inspected, so source-exhaustive absence is not claimed.
- Factorial assembly is removed as a workflow. The existing statistical phenotype is preserved with illustrative-ranking
  and nonlinear-absorbance limits. The discussion no longer presupposes secreted or contact mechanisms. No biological
  mechanism or optimization procedure is invented.
- Five factorial panel members lose artificial connectivity supplied by the method node. Those warnings remain visible
  and exact-strain bounded, with metadata1729open. No taxonomy or auditor-rule change and no all-member credit assigned
  to a subset outcome.
- Two fresh main texts and two other fresh abstracts read. Factorial relevant cached results/discussion/method passages
  read after failed fresh retrieval, not a complete or independent full-text review. Three graph and one discussion
  matches are explicitly cache-only. No separate supplements, raw data or figure pixels audited.
- All921caches456otherrecords and raw non-graph blocks preserved; four append-only histories and ten focused tests.
  Legacy community-level census unchanged; all51oldwarnings retained with only five expected additions; zero structural
  defects.
- Executed local gates and deterministic HTML-description checks are not browser screenshots or generated-model
  loader certification. Loader1703remains open. Repairs1724-1727await protected-main merge;765/1728/1729remain open.
  No paid Edison job or inferred authorization. Self-review is not independent approval or corpus completion.
