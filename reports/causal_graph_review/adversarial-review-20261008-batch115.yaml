adversarial_checks:
- 'All 14 original nodes and seven directions have explicit dispositions: 13 nodes and four arrows retained, one
  unsupported fungal node and three arrows removed, four renames, no new topology. Targets and discussion anchors
  resolve.'
- 'Pyrite overcorrection check: retain measured biogenic DSF in 2021 and the mineral iron-recycling loop. Nanomolar
  culture concentrations differ from micromolar additions; natural consortium signal transfer and density protection
  are not demonstrated. Fatty-acid stress and signaling were not selectively separated. Intrinsic physiological
  roles remain in prose without treating broad process annotations as causal evidence.'
- 'AHL: 2025 methods specify an added DL mixture; remove incorrect exact-L/generic CURIE substitutions, not the
  compound names or doses. Flagellar transcripts support a motility interpretation, not direct motility-rate measurements
  or A. caldus AHL production. Non-graph compound identity remains follow-up #1896.'
- 'Sulfobacillus: the 2020 simultaneous-inoculation improvement uses the Sulfobacillus-alone comparator, not all
  monocultures; precolonization can impair leaching. The 2025 DSF biofilm relative distribution was unchanged at
  7/14 days in this mixed assay. No universal mutualism, partner-lysate feeding or species-optimum substitution.'
- 'SCN: Afipia pathway evidence is COMPUTATIONAL/PARTIAL; selection enriches genomic potential, not pathway induction
  or assigned flux. Remove the common-cause-as-mediation arrow. Preserve R2/R3 fixed 250 mg/L versus other ramps;
  stable R3 performance must not be conflated with R4/R5 high-loading instability. Biofilm, nitrogen and cofactor
  mediation remain hypothetical.'
- 'Tinto: 2003 Figure 6 and p4863 assign Acidiphilium ferric reduction with carbon respiration; the retained incoming
  link supplies ferric acceptor, not traced autotroph carbon. Eukaryotic/fungal presence and production do not establish
  specific carbon transfer. Hortaea ascomycete identity cannot justify Basidiomycota; primary fungal isolations
  support both phyla, so no absence claim.'
- 'Source scope: four fresh primary XML main bodies, complete 2003 Tinto PDF text and Figure 6 visual read, 2013
  review, and two eukaryote/fungal primary abstracts read. Other original figure pixels, supplements, raw data and
  detailed corrupted PDF table cells were not audited. All 25 quotations match fresh sources and caches: 23 primary,
  two review. No new publication bodies or caches.'
- 'Three guarded records and histories preserve 457 other records, 923 caches, all non-graph raw blocks and prior
  history/decision artifacts. Three participant-list users added. Measured survey: 414 community-level, 136 mixed,
  278 community-only, 1568 taxa and 1280 without pairwise nodes. That last survey count is not proof of actual coverage.
  Connectivity rules and share guard unchanged.'
- 'Network: 56 prior warnings preserved; one intentional DISCONNECTED warning for Basidiomycota exposed by removing
  unsupported exchange. Do not silence it with unrelated participant credit or call the corpus warning-free. Identity/functional-coverage
  follow-up #1898 remains open. Zero structural defects.'
- Seven real in-memory control/mutation/restored-control probes reject biogenic DSF erasure, AHL support inflation,
  the wrong dual-culture comparator, Afipia support inflation, the common-cause arrow, Acidiphilium redox reversal
  and untraced algal transfer. Mutations and rejecting assertions are recorded; canonical hashes unchanged; not
  additional pytest tests.
- 'Eleven focused tests and 1044 combined regressions pass. All three records pass schema, strict, terms, full references,
  snippets, history and rank. Deterministic rendering and exact HTML-description coverage: 456 pages, 1365 nodes,
  528 arrows, not UI screenshots. Local macOS reference passes do not certify Linux; the full-corpus snippet audit
  is informational.'
- 'Graph issues #1893-#1895 await protected-main merge; metadata #1896-#1898 remain open. No Edison invocation or
  new topology. Prior Ruegeria extension #1883 and other needs_research records remain incomplete. Self-review is
  not independent approval; postcommit docs-current and exact-head publication are separate gates. Root CI blocker
  #1836 is not bypassed; dependent branches are not deleted.'
- 'Corpus: 369 reviewed, 37 pending, 54 needs_research across 460 records. The overall goal remains incomplete.'
- 'CI exposed stale Synechococcus smoke expectations from batch109: names and single-evidence count. Issue #1899
  records the real failed batch114 run and local reproduction. The corrected test checks exact reviewed names, target
  resolution, pairwise taxa, qualified mediation, and SUPPORT/PARTIAL evidence. Dedicated pytest and seven additional
  counterfactual probes pass without changing the canonical record. Propagation through older affected PRs is still
  required; 1044 regressions plus the focused smoke run are not a new full-suite pass. #1703 loader work remains
  separate.'
adversarial_regression_proof:
  report:
    cases:
    - mutation: Erase experimentally measured biogenic DSF
      test: test_biogenic_dsf_survives_without_endogenous_consortium_overclaim
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 32
      assertion: assert "confirmed biogenic DSF" in node["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/4/description
        before: 'The 2025 mixed-culture experiments added DSF and BDSF at 2 uM each. Pyrite relative abundances
          and planktonic transcripts support A. caldus dispersal and relative L. ferriphilum enrichment on mineral
          surfaces, with context-dependent inhibition of growth and leaching. The separate 2021 study confirmed
          biogenic DSF in L. ferriphilum and L. ferrooxidans pyrite cultures by GC-MS at nanomolar concentrations.
          That production result is retained, but it does not prove the micromolar treatment phenotype arises from
          endogenous transfer within this three-species consortium. HYPOTHESIZED: natural niche defense and receptor-mediated
          regulation; fatty-acid stress can also contribute. Neither mutual benefit nor density-dependent protection
          against mineral overexploitation was demonstrated.'
        after: Only synthetic DSF has evidence.
    - mutation: Promote AHL transcript inference to demonstrated motility mechanism
      test: test_ahl_treatment_is_not_production_or_exact_l_reagents
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 48
      assertion: assert node["evidence"][0]["supports"] == "PARTIAL"
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/5/evidence/0/supports
        before: PARTIAL
        after: SUPPORT
    - mutation: Reverse the dual-culture comparator
      test: test_sulfobacillus_comparator_and_time_context_are_preserved
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 54
      assertion: assert "not relative to L. ferriphilum biofilms" in node["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/2/description
        before: S. thermosulfidooxidans DSM 9293 has both ferrous-iron and inorganic sulfur-oxidizing capacity and
          can grow mixotrophically. The 2025 consortium assays used 40 C, not the species growth optimum. Its biofilm
          relative distribution at 7 and 14 days was not significantly changed by DSF/BDSF, although other assay
          designs and time points showed inhibition. The separate 2020 two-species study found that co-inoculation
          improved leaching relative to S. thermosulfidooxidans alone but not relative to L. ferriphilum biofilms;
          precolonization could impair leaching. These condition-dependent findings do not establish universal mutualism
          or measured consumption of partner lysate or EPS.
        after: S. thermosulfidooxidans DSM 9293 has both ferrous-iron and inorganic sulfur-oxidizing capacity and
          can grow mixotrophically. The 2025 consortium assays used 40 C, not the species growth optimum. Its biofilm
          relative distribution at 7 and 14 days was not significantly changed by DSF/BDSF, although other assay
          designs and time points showed inhibition. The separate 2020 two-species study found that co-inoculation
          improved leaching relative to S. thermosulfidooxidans alone but also relative to L. ferriphilum biofilms;
          precolonization could impair leaching. These condition-dependent findings do not establish universal mutualism
          or measured consumption of partner lysate or EPS.
    - mutation: Promote predicted Afipia pathway to measured support
      test: test_afipia_pathway_is_predicted_not_measured_cross_feeding
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 76
      assertion: assert a["evidence"][0]["supports"] == "PARTIAL"
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/0/evidence/0/supports
        before: PARTIAL
        after: SUPPORT
    - mutation: Restore common-cause arrow as selective mediation
      test: test_selection_to_potential_does_not_mediate_biofilm_loss
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 85
      assertion: assert len(b["downstream"]) == 1 and b["downstream"][0]["target"] == a["name"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/1/downstream
        before:
        - target: Predicted Afipia Thiocyanate Metabolism and CO2 Fixation
          description: 'PARTIAL: selection increases the representation of Afipia carrying the predicted SCN-degradation
            and carbon-fixation machinery. This links composition to enriched functional potential, not induction
            of the pathway or demonstration of strain-specific SCN flux.'
        after:
        - target: Predicted Afipia Thiocyanate Metabolism and CO2 Fixation
          description: 'PARTIAL: selection increases the representation of Afipia carrying the predicted SCN-degradation
            and carbon-fixation machinery. This links composition to enriched functional potential, not induction
            of the pathway or demonstration of strain-specific SCN flux.'
        - target: Unstable High-Loading SCN Degradation Without Molasses
          description: Afipia dominance causes niche loss.
    - mutation: Reverse Acidiphilium iron reduction
      test: test_acidiphilium_is_ferric_reduction_not_ferrous_oxidation
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 97
      assertion: assert "ferric-iron reduction, producing ferrous iron" in b["description"]
      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/1/description
        before: 'PARTIAL: the 2003 model assigns Acidiphilium organic-carbon respiration coupled to ferric-iron
          reduction, producing ferrous iron, particularly under anoxic or microaerobic conditions. It does not assign
          ferrous-iron oxidation to this heterotrophic role. The survey combines taxon detection and physiological
          knowledge; it does not trace algal exudates, fungal products or autotroph biomass into Acidiphilium, quantify
          in situ carbon/iron flux, or establish a closed mutually beneficial nutrient cycle.'
        after: Acidiphilium oxidizes ferrous iron.
    - mutation: Restore untraced algal carbon-delivery arrow
      test: test_phototrophy_and_fungal_presence_do_not_prove_carbon_delivery
      control: PASS
      mutation_applied: true
      mutation_rejected: true
