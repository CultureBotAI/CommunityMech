adversarial_checks:
- Re-read the four complete target records and reviewed their full diffs. Every original node and direction has
  a ledger disposition. Retain14of20nodes/1of4directions; remove6workflow nodes and3membership/context arrows;8renames.
  No new node/direction/provider spend.
- 'Challenge removal versus loss of evidence: vinegar keeps all5production/outcome observations and the reported
  precursor route; SkinCom keeps composition, community-associated detection and concordance; soil records keep
  positive sequence/prediction/environment findings. Removed nodes were discovery procedures, not missing biological
  mechanisms.'
- 'Vinegar: different products do not establish resource niche partitioning. Membership in the selected trio is
  not a causal explanation of its output. Existing ethanol direction isPARTIAL because recipient isolation is not
  shown in the abstract and the selected trio excludesSaccharomyces. No universal optimum, pyruvate transfer or
  reciprocal benefit is inferred. Prior1042-1044 fixes remain.'
- 'SkinCom: both compared conditions contained intended isolates, so diversity difference cannot by itself justify
  the removed detection arrow. The authors interpret detection as proliferation but qualify oxygen mediation; no
  isolated partner mechanism is claimed.66%is directional differential-abundance agreement, not replicated significance
  or clinical efficacy; only one human comparison was significant and the source forbids interchangeable results.
  No new growth/colonization/infection instructions.'
- 'BGC: LAP and linaridin are not interchangeable labels. Retain the actualLAPprediction, canonicalCPRscope and
  verifiedantiSMASH4.0provenance. Genomic potential is not measured metabolite output/antibiotic activity. Environmental
  abundance associations do not establish ecological mediation. Grassland claim narrowed toKSdomains; Dormibacteria
  canonical grounding preserved.'
- 'CPR: concentration enrichment is technical, rarity estimates are coverage-based, and nondetection is not absence.
  Genomic deficits supportHYPOTHESIZEDresource dependence without an unaffected-host sign. Respiratory components
  scoped only toCPR; comparative-genomic/phylogenetic inference does not prove realized respiration, timing of lateral
  transfer or adaptive fitness. NoCPR-DPANNpair inferred.'
- Twenty-one graph and four discussion quotations match fresh primary text and unchanged caches. Vinegar independent
  access limited toabstract; other source-read scopes explicitly distinguished from whole supplements/figures/raw
  data. Large duplicate caches were not read exhaustively. Literal snippet matching is not entailment or complete-record
  certification. No cache imports or validation exceptions.
- Four guarded record writes and four append-only histories;456otherrecords/all923caches and prior history/decision
  files unchanged. Non-graph raw blocks/taxonomy preserved, not recertified. Participant-use set adds two soil records
  with identity-only copies. All census metrics unchanged; no threshold/schema/runtime/audit-rule change.
- Eight new tests and927combined regressions pass. Four full-record schema/strict/term/reference/snippet checks
  and four histories validate. Network exactly equals baseline56warnings/zero structural defects. Deterministic
  renderer and HTML-description parser cover456pages/1382descriptions/557arrows; these are not browser screenshots.
  Plain just-lint passed; explicit-runtime no-incremental mypy additionally checked.
- Repairs1803-1806 addressed locally and remain open until protected-main merge; non-graph1807 stays open. License-gate949,
  loader1703, DOI-cache1091 and denied/unansweredEdison scopes not certified/resolved. Self-review is not independent
  approval. No artificialCI, protection bypass, premature issue closure or branch deletion.
- Corpus324reviewed/88pending/48needs_research is not completion. Postcommit docs-current and exact-head publication
  require separate receipts and are not preasserted here.
