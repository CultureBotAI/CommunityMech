adversarial_checks:
- Read all four whole records and every original node/arrow; three complete primary main texts, captions
  and embedded tables, plus the Cupriavidus primary abstract. Supplements, original images, raw RNA-seq/data
  and earlier exact-pair publications were not audited. The fetched formate paper was not reread and is
  not graph support.
- Galdieria oxygen supply is a positive directed benefit, not reciprocal carbon transfer or obligatory
  mutualism. Preserve both physiological arrows and the ratio-dependent suppression evidence rather than
  demoting controlled physiological observations to wholly unsupported hypotheses.
- Galdieria daily CH4/CO2/O2 replenishment prevents chlorosis; a separate day4 methane-withdrawal recovery
  allows oxygen to accumulate without adding oxygen. Pigment recovery precedes resumed growth. HemF inhibition
  and porphyrin uptake are molecular interpretations, not enzyme/transport measurements.
- Net carbon fixation derives from system gas balances, not partner-resolved carbon assimilation. Preserve17-28%
  enhancement,66-100% growth suppression,44-62% carbon suppression and0.124+/-0.001mmol/L/h methane consumption.
  Methane depletion at0.15:1 prevents treating that rate as an unconstrained optimum; do not universalize
  the ratio threshold.
- Cupriavidus grew with S8, supporting nonmethanol carbon supply. The possibly-uses-acetate clause belongs
  to Gela4, not Cupriavidus. Remove the cross-system oxygen-window node and arrow while retaining S8 acetate
  excretion ranges and production-gene candidates as discussion context.
- Cupriavidus acetate identity, flux, recipient utilization and carryover controls remain unresolved at
  abstract scope. Retain a single explicitly hypothetical transfer-to-growth arrow and positive growth,
  without claiming the recipient itself was tested at both oxygen ranges or that absent full text proves
  no controls exist.
- Gela4 positive growth and source-supported acetate interpretation remain. RNA-seq compares methanol
  monoculture with methane coculture, so partner/substrate change together. Reference acetate-grown qRT-PCR
  supports but does not isolate the cross-fed substrate.
- Gela4 methanol below310nM does not exclude low-concentration/high-turnover transfer, explicitly acknowledged
  in the paper. Retain acetate concentrations and acsA log2FC3.57. Distinguish significant late-phase
  acsA/hpr from nonsignificant early-phase contrast.0.02/h coculture versus0.03/h methanol monoculture
  is not growth enhancement or reciprocal fitness.
- PHBV experimental assembly and starvation transfer are protocol, not cross-feeding or niche partitioning.
  Remove those two nodes/three arrows. Merge peak content into the mixed-VFA node and remove its duplicate
  arrow without deleting the quantitative positive result.
- Retain valerate PHBV maxima35.9+/-8.6% under air and68+/-7% with methane/oxygen. The separately tested
  mixed community produced PHV alone under air/valerate; it is not part of the defined pair. No matched
  pure-M.parvus removal/addback test for every PHBV condition is established by this paper.
- PHBV mixed-VFA contrast changes methane and oxygen together. Preserve73.7+/-2.5% by mass,94:6 PHB:PHV
  and the distinct49.6+/-13% mixed-community comparator without methane-only causality, biomass-yield
  or mutualism claims. VFAs were synthetic externally supplied substrates, not measured exchange or actual
  waste feed.
- Remove erroneous PHB-as-PHBV graph term. Schema requires grounded metabolite terms, so copolymer identity
  is retained in descriptions, without inventing an ID or introducing unsupported schema fields. The non-graph
  ingredient already names PHBV correctly without an ID; an erroneous follow-up-issue statement was corrected,
  not that preserved field. Canonical taxa, AMBIGUOUS Rhodococcus status and all non-graph blocks remain
  unchanged.
- Guarded dry run caught an existing ASCII-versus-primary dash mismatch; final snippet uses exact shared
  wording with quantitative result retained in description. A trial ungrounded-metabolite field failed
  schema validation and was removed before any record write. No failed trial is reported as a passing
  gate.
- Verify456 untouched records,920 untouched caches and one append-only event/history per changed record.
  Exact renamed targets and discussion anchors resolve. Both-root census adds one mixed/community-scope
  Galdieria record. Its two existing members enter the community-scope-only denominator (1507 to1509),
  not new taxonomy;1240 solely-rule count remains. An initially incorrect zero-denominator-change expectation
  was corrected after reading the survey. No auditor-rule change.
- Record actual schema/strict/terms/references/snippets/history, inventory/rank/network, deterministic
  repeat rendering, combined regressions and lint results. All44 baseline warnings preserved with zero
  structural defects. HTML description parsing covers456 pages, not browser screenshots; post-commit docs-current
  is separate.
- All891 all-state issue titles/bodies and ignored/hidden local search used for dedup; matching issue
  bodies1093,529,306 read. Four repairs remain OPEN until protected-main merge; metadata1606 remains OPEN
  afterward. Self-review is explicitly COMMENT, not independent approval or complete corpus review.
