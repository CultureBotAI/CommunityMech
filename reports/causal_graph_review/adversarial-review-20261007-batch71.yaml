limitations:
- 'All14 original nodes and10 arrows reviewed: retain10 nodes/5 arrows; remove4 cross-system, procedural
  or duplicate nodes and5 arrows. No new structure or paid provider submission.'
- Galdieria, Gela4 and PHBV complete primary main texts/captions and embedded tables read. Cupriavidus
  source is primary-abstract-only; publisher search confirms the abstract, not accessible full Methods.
  Separate supplements, figure pixels and raw data not audited.
- Galdieria physiological oxygen support/competition and positive carbon effects remain. Methane withdrawal
  without added oxygen is distinct from daily gas replenishment; molecular inhibition/reuptake and partner-specific
  carbon flux remain unresolved.
- Cupriavidus positive growth remains; acetate and exact delivery are candidates. The oxygen series and
  possibly-uses-acetate phrase belong to S8/Gela4, not a demonstrated Cupriavidus substrate pathway.
- Gela4 growth, acetate concentrations, RNA-seq and acetate-reference qRT-PCR remain positive. Transcript
  comparisons change partner/substrate; methanol nondetection does not exclude rapid flux, and early-phase
  qRT-PCR contrast was not significant.
- PHBV supplied-feed/gas outcomes and peak contents remain. Air versus methane/oxygen changes oxygen too;
  polymer content is not biomass yield or reciprocal benefit. Mixed consortium is separate; air/valerate
  gave it PHV alone. PHBV is not represented as PHB.
