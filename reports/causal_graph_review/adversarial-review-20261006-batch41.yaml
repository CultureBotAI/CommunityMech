adversarial_checks:
- Whole records and every existing graph node/arrow reviewed with explicit source-access limits. Six nodes
  retained, one HYPOTHESIZED arrow retained and one unsupported arrow removed. Five renames, exact targets
  and discussion anchors checked. No new causal structure.
- Ferroplasma abstract explicitly says hypothesis. Restore that qualifier in evidence and descriptions.
  Positive supernatant growth is not identified organic-carbon flux, detoxification thresholds, Calvin-cycle
  fixation or obligate syntrophy. Keep source-only intrinsic context and remove unsupported process/category
  annotations.
- The retained organic-supply-to-consumption arrow is hypothetical substrate availability. Consumption
  is not established mediation of both reciprocal supernatant assays, so its extension to the response
  node is removed. Growth rates supplied to FBA are not independent exchange measurements.
- Ferrer strain Y(T) and Wilson isolated rusticyanins are separate systems from BRL-115 with Leptospirillum.
  Similar redox potential does not imply similar transfer rates. Do not infer lower-oxygen niches, pair-specific
  membrane complexes, competition relief or stable coexistence. No retraction claim is made.
- Fomitopsis liquid glucose depletion, 34 mg fungal biomass and stress-related transcription support a
  PARTIAL competition interpretation. Inspected selected excerpts do not describe selective rescue, but
  the full preprint was not accessed in this review, so absence from the entire study is not claimed.
- Fomitopsis agar features are putative identities and acid mediation is HYPOTHESIZED. Piptamine nondetection
  is condition-specific, and BGC expression is not active-product identification. Preserve observed distal
  inhibition without unsupported resource-competition classification. Liquid bacterial endpoint counts
  were unchanged; do not connect distinct assay regimes or restore historical prose-target arrows.
- 'Closed Fomitopsis #1169/#1170/#1171 concern previously missing cache support and are not reopened or
  duplicated. The expanded selected cache now supports the assay facts. Preserve #1173 natural-partner
  caveat removal and the zero-arrow topology.'
- 'Lung main body is now openly available and read, including tables/captions and Methods. The zero-node
  graph is not certified complete: #1461 remains open and needs_research. One-community Edison dry run
  retained verbatim with query hash; no API submission or credit spend, and no blanket authorization inferred
  from an earlier unrelated job.'
- Lung vPCR persistence, total CFU, DNA-qPCR and protein-abundance fractions are distinct evidence. pH
  recovery is functional, not member-resolved compositional resilience. Siderophore uptake, partner-resolved
  acid/pyruvate exchange, ammonia mediation and AI-2 coordination remain proposed mechanisms. Agar nondetection
  is not universal antimicrobial absence. Challenge organisms are not the four canonical members.
- 'No protocol expansion, taxonomy replacement or full-text cache addition. Canonical taxon IDs/groundings,
  historical events and all non-graph raw blocks preserved. #1462/#1463 remain open. User workspace files
  untouched; edits isolated in the batch worktree.'
- 457 other records and 920 reference-cache files unchanged. Participant registry stays at 187 with unchanged
  connectivity census/numeric bounds. All 33 baseline warnings exactly preserved and zero structural defects;
  no links invented to suppress warnings.
- Repeat rendering deterministic and every published description checked by HTML parser across all 456
  pages. Eight new tests and the full combined regression suite pass on the recorded tested bytes. No
  browser screenshot review claimed.
- Reference validator 0.1.7 exits 0 with zero effective checks; explicitly a no-op. Snippet MATCH is textual,
  not scientific validation. Actual output tails/digests and pre-paper baseline retained. The ancestry-only
  restack is documented without falsifying the original baseline commit. Initial dry-run helper failure
  disclosed.
- 'Source access differs: Ferroplasma abstracts, Fomitopsis selected preprint excerpts with HTTP 429 on
  full PDF, lung primary main body. No figure images, equation rendering, separate supplements or raw
  data reviewed. No rate-control bypass.'
- Deduplication covered 778 all-state issue titles/bodies and ignored/hidden-inclusive local files; all
  seven matched bodies read, not every comment or PR review. This is source-based self-adversarial review,
  not independent approval, protected merge or full-corpus completion.
