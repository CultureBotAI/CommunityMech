adversarial_checks:
- Whole original targets and all changed graph/discussion diffs reviewed. All19 original nodes/12 arrows have dispositions:retain16
  nodes/nine existing directions,remove three nodes/three arrows,rename three. No new topology or Edison spend.
- 'Challenge overcorrection: retain measured flavor outcomes, reciprocal biofilm-associated abundance, FA tolerance/pot
  biocontrol, omission-context mutualism/PHB, photosynthate-supported growth and conditional cyanobacterial benefits.
  Qualification does not erase source-supported positive effects.'
- 'Fuqu: construction rationale is not measured niche separation or metabolite exchange. SC2 did not monotonically
  increase the flavor diversity metric; large-scale ethanol was not significantly different. Preserve SC3 comparator
  outcomes and source-proposed bacterial-fungal synergy without adding an organism-specific mechanism or any cultivation
  optimization.'
- 'SynComY: reciprocal biofilm growth has species-specific qPCR support and stays MUTUALISM, whereas the FA/pot
  endpoint is untyped. Forward additions support response,not direct transfer. Reverse additions were tested and
  did not significantly enhance LSQ16 biofilm; this does not refute all possible exchange. Keep both existing mediation
  arrows hypothetical. The SRA range belongs to RNA-seq,not verified genome input;source-named tools stay but unsupported
  versions are removed. Root-colonization synergy remains unverified.'
- 'Azotobacter: exporter dependence and failure of either partner alone under carbon/nitrogen omission support the
  growth-context mutualism. They do not quantify PHB mediation,identify a nitrogen transfer product or establish
  PHB assay conditions. Keep initial glutamate experiments separate. PHB is demonstrated;alginate is potential.
  Abstract-limited review is explicit,not a claim that full text does not exist.'
- 'Bacillus: main Figure4 plus supplementS2/S5/S9 identify3610 in growth/perturbation assays. Strain168 production
  and supplementS4 inhibition do not establish months-long persistence. Remove the unsupported stabilization node/arrow
  without adding a new alpha-amylase node;positive168 evidence remains as bounded context. The two remaining nodes
  retain PARTIAL strain-specific support.'
- 'Ecoli: early W and W delta-cscR growth is insensitive to induced sucrose export,so retain carbon support without
  sucrose exclusivity. Other photosynthates are inferred,not chemically identified.85% background carbon-export
  capability is not a concentration. Preserve more-than-two-week continuous persistence and conditional reciprocal
  benefit;carbon feeding alone is not product-removal syntrophy.'
- 'Yeast: preserve #605 corrected W303Clump identity,parentalW303 negative result,no yeast bioproduct,and batch
  decline. The two-month constant-light persistence is distinct from diurnal experiments;source supplementS8 confirmed
  this distinction. Uptake is an organism phenotype,not a reverse donor arrow. Metabolite return/byproduct absorption
  remains a proposed mediator of cyanobacterial stimulation.'
- All28 graph plus six discussion quotations match independently retrieved primary text and unchanged caches. Three
  primary main bodies/captions and one abstract read;SPC supplement captionsS1-S12 and pixelsS2/S4/S5/S8 additionally
  inspected. Other supplements/images,mathematical framework and raw data were not certified. Large cache headers
  and literal quotations checked,not a whole-cache audit;literal matching remains separate from entailment.
- Six guarded writes produce six append-only histories. Other454 records,all923 caches,non-graph raw blocks and
  prior history/decision files are unchanged. Four phenotype-scope changes add eight taxa to the community-level
  survey denominator but no additional solely-credited taxa. Observational census bounds update to the measured407/132
  counts with an exact regression;connectivity rules and the share guard are unchanged.
- Four in-memory control/mutation/restored-control probes reject transfer SUPPORT inflation,RNA-seq input misattribution,Bacillus168
  persistence-arrow restoration and diurnal duration inflation. Mutation application and rejection were explicitly
  checked at scientific assertions. Canonical files are unchanged and probes do not inflate the pytest count.
- Twelve focused tests and987 combined regressions pass. Six full-record schema/strict/term/reference/snippet checks
  and six histories validate. Network retains56 baseline warnings with zero structural defects. Deterministic rendering
  and exact HTML parsing cover456 pages,1367 node descriptions and536 arrows;this is not screenshot QA.
- Repair issues1849-1854 are addressed but remain open until protected-main merge;non-graph follow-up1855 remains
  open. Existing loader1703,DOI-case1091,stub1093 and license949 are not certified. Denied/unanswered Edison scopes
  remain untouched. Self-review is not independent approval;no artificial CI,protection bypass or premature branch
  deletion.
- Corpus status:350 reviewed,58 pending,52 needs_research. The whole goal is not complete. Postcommit docs-current
  and exact-head publication require separate receipts and are not preasserted here.
- Plain just-lint passed;explicit-runtime no-incremental mypy additionally checked.
