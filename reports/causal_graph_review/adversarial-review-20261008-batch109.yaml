  in ignored/hidden kb/taxa name/identifier search. Whole reviewed B12 Syn7002 neighbor read for modeling patterns,not
  used as evidence for these targets.
- Only graph/discussions/events change. Other454 records,923 caches,non-graph raw blocks and prior histories/decisions
  preserved. Canonical identities reused as preferred_term+term only;no GTDB copies into graph. General growth metadata
