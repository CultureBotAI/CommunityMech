adversarial_checks:
- Whole R2A record, all3 original nodes and2 arrows reviewed against the full extracted primary main text,
  Methods2.1-2.6, Results3.1-3.5, Tables1-2 and main captions. No original image pixels, supplements/raw
  data or independent KBase execution/model replication.
- R2A uses YR343,GM17,AP49 in the three-member model; CF313 belongs to the four-member MOPS model. Remove
  the transplanted CF313 cross-feeding node and Pantoea-to-CF313 arrow rather than silently moving MOPS
  predictions into R2A. Partial canonical participants explicitly exclude missing AP49; no invented CURIE.
- Preserve positive R2A exchange predictions and model-dependent Pantoea growth improvement. Gapfilling,
  final-passage16S ratios and calibrated uptake bounds are assumptions. Metaproteomics detects relevant
  enzymes but does not measure transferred flux or establish mutualism; 16S and protein abundance estimates
  differ.
- Preserve experimentally measured GM17-to-CF313 R2A-agar inhibition at25C/48h. It is a distinct pairwise
  assay, not evidence of CF313 membership in the R2A model. No inhibitory molecule or selective metabolic
  rescue was demonstrated.
- Remove the antagonism-to-cross-feeding arrow. Shared-metabolite compensation is proposed, while liquid-versus-static-agar
  conditions are an explicit alternative. Antagonistic pressure does not itself establish a causal cross-feeding
  response.
- Both removed arrows and the removed node have individual decisions; retained nodes carry exact OPEN
  knowledge-gap anchors. Broad metabolite classes remain without fictitious concentrations. GO and CHEBI
  preferred labels align with the retained canonical labels.
- All raw non-graph blocks remain byte-identical, not certified.1533 stays OPEN for canonical membership/strain
  grounding, CF313 role and ten-isolate assembly versus selected-member model. All920 caches and459 other
  records unchanged; four graph snippets independently matched to fresh primary and cache.
- Complete biological diff, test assertions and decision ledger reviewed. Both-root participant census
  unchanged;36 baseline network warnings preserved with zero structural defects. No connectivity matching
  rule or canonical membership change.
