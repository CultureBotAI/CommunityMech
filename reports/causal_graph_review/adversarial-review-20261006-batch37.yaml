adversarial_checks:
- Whole-record and complete graph diffs checked against primary sources at the recorded access scope.
  Eleven existing nodes retained, three arrows removed and two qualified; every original node and arrow
  has a disposition. No new connectivity.
- Arg/Met reciprocal genotypes retain distinct preferred labels despite NCBITaxon:511145. Growth dependence
  is conditional on nutrient limitation; fluorescence CV is not intrinsic transcriptional noise or a universal
  reporter effect. Same-species interaction loses interspecies GO annotation.
- 'Arg/Met expansion is not silently omitted: source-backed heterogeneity and reporter-sensitivity structure
  remains under #1436. Dry-run provenance recorded, no new provider job or spend; status remains needs_research.
  Different Arg-Trp and BL21/environmental-isolate systems are excluded.'
- VFA evidence does not justify a prediction-as-cause chain. Remove annotation-workflow and bulk-endpoint
  mediation arrows. Retain operational selection as PARTIAL and proposed architecture contribution as
  HYPOTHESIZED; do not imply selective proof of member exchange or autotrophic product fraction.
- 'Three canonical VFA participants identify a representative subset, not a complete roster or required
  contributors. Remove categorical interaction/process annotations. Non-graph protocol and role claims
  remain #1434; existing live grounding issue #373 reopened.'
- 'Toluene is abstract-only: preserve alternative methanogens and e-pili/acetate routes, MAG-specific
  evidence and zero arrows. Do not import unstated transfer direction or equate gene content and electrode
  enrichment with measured flux. All three mechanisms HYPOTHESIZED/PARTIAL, not categorical syntrophy.'
- 'Preserve #1120 recruitment and #1121 alternate evidence, distinct MAG116/MAG60 labels despite shared
  NCBITaxon:2, and corrected Desulfoprunum ID/label. No inaccessible full-text Methods/Results claimed;
  #1435 remains open.'
- VFA body was read from a public primary-preprint mirror; canonical retrieval failed. No visual figures,
  separate supplements or raw data reviewed. No source cache changed and no publisher body restored.
- Guarded writes, append-only history and llm-assisted events; old history/discussions semantically preserved,
  all non-graph raw blocks, 457 other records and 920 cache files byte-preserved. Seven new tests cover
  endpoint scope, identity, hypotheses, pending expansion, anchors and full disposition accounting.
- 'Participant registry changes only by the VFA record: 183 to 184 users. Connectivity census and numeric
  bounds unchanged. Exact baseline network comparison retains 33 warnings with zero errors, without invented
  links.'
- Repeat renders deterministic and all published descriptions checked by parser. Reference-validator 0.1.7
  exits 0 but performs zero checks; no-op disclosed. Independent textual MATCH is not scientific validation.
  Actual validation output tails and digests, including pre-research baseline, are committed.
- Deduplication searched 754 all-state issue titles/bodies and ignored/hidden-inclusive local files, not
  every comment. No independent reviewer, protected merge or full-corpus completion claimed.
