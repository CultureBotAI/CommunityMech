adversarial_checks:
- Whole records and all eight original nodes/two arrows reviewed. Seven nodes retained and one generic
  platform node removed; one PARTIAL arrow retained and one workflow arrow removed. Three GENIA renames
  and exact target/discussion anchors verified. No new structure.
- Fucoidan LC-MS specialization is experimental support for genomic predictions. Monomer depletion combines
  cleavage and uptake, not measured carbon mineralization. Residual-substrate and purified-enzyme assays
  support accessibility without obligatory contact/small-molecule exchange, not universal enzyme necessity.
- Fucoidan 97.1% is the five-member F40/F56/V69/F94/V4 result within all 127 combinations. The participants
  are the panel, not obligatory simultaneous partners. Functional null-model synergism is not reciprocal
  fitness benefit. G88 exclusion and its separate mutualistic V69 pair preserved; per-strain inoculum
  means total input covaries with richness.
- Fucoidan full publisher DOM resolves V4 plus superscript citation 3; V43 is a text-extraction artifact,
  not a distinct alias. Historical discussion retained as RESOLVED with DOM/hash receipt; original selected-excerpt
  cache unchanged. Original supplementary spreadsheet and model code were not audited; no independent
  train/test verification claimed.
- GENIA predicted roles and network agreement remain computational and HYPOTHESIZED. Remove design-to-removal
  causality and unsupported MUTUALISM/NICHE_PARTITIONING. Preserve distinct separate-treatment versus
  lower mixed-pollutant outcomes as source-reported observations, not independently certified mineralization.
- GENIA daily equal-ratio dilution/remixing is a reported intervention, so retain only its bounded PARTIAL
  management-effect arrow. Handling and ratios change together; DNA profiles do not establish viable absolute
  persistence, exact flux or hub necessity. Lignin p=0.092 is not a significant management comparison
  at p<0.05.
- 'GENIA main text reports fluoride and intermediates but has conflicting fluorine/nitrogen inventories
  and analytical-method descriptions. Arithmetic on stated inputs is preserved, not substituted for treatment-specific
  raw-data reconciliation. PFOA/PFOS mixture scope prevents a blanket impossibility claim; no misconduct
  allegation. #1468 stays open.'
- Transwell AHL reporter and three-member stationary-phase experiments remain separate. Remove generic
  capability node without restoring earlier workflow arrows. Replating/endpoint transcription support
  reporter response; 977 nonpolar features are not identified metabolite count or producer-consumer flux.
  Polar bactobolin accumulation does not selectively establish inhibition mediation.
- 'Transwell lower P. syringae live-cell counts with B. thailandensis are a candidate for new bounded
  structure, not a bactobolin arrow. Canonical Bacteria umbrella is not converted into invented species
  participants or a self-edge. Exact reporter/three-member strain identities and source SC11,368/SC11,378
  discrepancy remain pending with media/test-tube metadata under #1467.'
- 'Fucoidan #1465 and Transwell #1467 remain needs_research. Separate one-community dry runs retained
  verbatim with query hashes; specific credit authorization requested. No provider calls or credits. Existing-graph
  corrections and gap discussions do not count as completed expansion.'
- 457 other records and all 920 reference-cache files unchanged. Canonical taxonomy, non-graph raw blocks,
  existing curation events and prior history artifacts preserved. Participant registry grows only by the
  two explicit canonical panels, 187 to 189; connectivity census and numeric bounds unchanged. All 33
  network warnings preserved with zero structural defects.
- Repeat rendering deterministic; exact published descriptions checked across all 456 pages. Nine new
  regression tests plus combined suite passed on recorded bytes. No browser screenshot, original supplemental-table,
  raw-data or figure-image review claimed. Primary main bodies and Methods read for all three, with public
  access/cached source scopes explicit.
- The initial reference gate failed with 14 Fucoidan taxonomy findings. Identical failure reproduced on
  untouched baseline; every snippet matches the supplement sidecar which the installed fetcher does not
  combine with article text. A second batch-helper failure exposed 15 unchanged snippet-audit mismatches
  (the same taxonomy plus a discussion excerpt), also reproduced byte-for-byte at baseline. Preserve both
  failures, do not manufacture a clean/all-MATCH pass or merge supplemental text into the article cache.
- 'Historical no-op interpretation of Total checks: 0 is withdrawn under #1469. Installed CLI counts reported
  issues; five existing positive/negative/field-discovery canaries pass. SupportingReference #476 and
  selected-excerpt trust #1362 remain open. The separate snippet audit MATCH is textual, not scientific
  proof or independent provenance. Actual outputs, failure archive, source digests and pre-paper baseline
  retained; original historical reports remain byte-identical.'
- 'Dedup covered 783 all-state issue bodies plus ignored/hidden local files, all 17 biological matches
  read. Follow-up diagnosis read #257/#466/#476/#783/#785/#827; new #1469 is a reporting regression, not
  duplicate reopening of the CLI diagnosis. Not every comment/PR review was inspected.'
- This is source-based self-adversarial review, not independent approval, protected merge or full-corpus
  completion. Existing issue corrections remain open until main merge; research and source-evidence followups
  remain open afterward.
