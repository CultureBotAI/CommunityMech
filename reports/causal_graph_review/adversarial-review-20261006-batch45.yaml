adversarial_checks:
- Whole 653-line record and all three original nodes/two arrows read. 2017 primary main body, Methods,
  Table 1 and captions read; 2022 complete abstract only. No figure images, separate supplements, raw
  data or analysis code audited.
- Geobacter qPCR-derived growth and an acetate/biomass allocation model are not direct electron uptake
  or current. The <0.6% value depends on the acetate-only donor, 10% biomass and 90% transfer assumptions.
  Both the transfer node and its retained direction remain HYPOTHESIZED/PARTIAL.
- Preserve positive 72-h product measurements while exposing 2/4 initial responders and 8/12 follow-up
  responders. Regressions use responders; product percentages are not all-culture means or universal responses.
  Lower Clostridium biomass and useful chemical yields do not establish mutualism.
- Merge the duplicate product outcome into the measured response, preserve its evidence and remove the
  tautological second arrow. Remove unsupported electron-chain annotation, SYNTROPHY and MUTUALISM classifications
  from these nodes. Exact two canonical participants are explicit; no taxon IDs invented.
- Correct exact discussion anchors and stale DIET filename note. Nanowire heterogeneity remains an author
  hypothesis. The 2022 abstract supports a putative cobamide model only; no 0.22-um spent-medium assay
  is claimed verified, and no mediator is silently promoted to established fact.
- Graph diff inspected. Guarded writer, one append-only history and one regenerated page. All 459 other
  records, 920 caches, canonical taxonomy and non-graph raw blocks preserved; stronger non-graph uptake/connection/product
  claims remain outside this correction and are not certified.
- Both-root pre-paper baseline, schema/strict/terms/references/snippets/history/rank gates retained with
  actual outputs and hashes. All 34 existing network findings unchanged, zero structural errors. Repeated
  renders deterministic and descriptions parser-checked across 456 published pages, without a browser
  screenshot claim.
- Four new focused tests plus historical and shared regressions passed, including positive/negative reference-validator
  canaries. Participant registry 193 to 194; one new community-level-only two-member record. Census bounds
  and production matching logic unchanged.
- 'Dedup covered 793 all-state issue titles/bodies and ignored/hidden local files; #256/#295/#289/#306
  bodies read. Prior contact-route and generic-snippet fixes preserved, remaining broader uptake-causation
  and responder-scope claims addressed. Not all issue comments or PR reviews inspected.'
- Methanosaeta/Methanosarcina source work is deferred, not counted as reviewed in this one-record PR.
  A separate one-community Methanosaeta Edison dry run made no API calls and awaits specific spend authorization;
  no paid job is implied by this Clostridium repair.
- Self-adversarial review is not independent approval. Exact-head GitHub COMMENT and actual post-commit
  docs-current are separate publication gates. Protected main queue and dependent-parent merges remain
  required; full-corpus completion is not claimed.
