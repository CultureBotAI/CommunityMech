adversarial_checks:
- Read whole three records and all four fresh primary main bodies, Methods, Results, Discussion and embedded
  captions/table text. Account for all9 original nodes and6 arrows. Original figure pixels, separate supplements,
  raw data and executable models not audited; no invented supplementary-cell or reproduced-flux claims.
- 'Lac Pavin: preserve depth-associated genomic potential, not measured flux or expression. Drop both
  common-gradient arrows; oxygen co-varies with other geochemistry and is not isolated experimentally.
  Retain low-abundance anoxic methane oxidizers and anoxic mcr occurrence, without absolute spatial exclusion
  or absence inferred from incomplete genome recovery.'
- 'Lac Pavin: distinguish CPR/DPANN II/III and III RuBisCO nucleotide-associated incorporation from complete
  Calvin-cycle autotrophy. Weak CPR gene-repertoire differentiation and host-selection hypothesis remain
  explicit. Canonical Archaea/CPR/DPANN participants are a partial roster, not a substitute for missing
  non-CPR bacterial lineages.'
- 'Washington: positive guild carbon coupling is retained as inferred family-level CROSS_FEEDING with
  PARTIAL support. Remove untraced methanol assignment; supplied methane is external context, not direct
  donor transfer. Prior isotope findings are not newly measured in the 2015 experiment, and reciprocal
  benefit/mechanism is unresolved.'
- 'Washington: retain oxygen-feeding-regime selection of relative guild composition, including hypoxic
  periods, intermediate mixtures and replicate exceptions. Drop the bridge to a separate two-methanotroph
  model; those partners are not the two different functional guilds. Relative 16S does not prove absolute
  viable abundance.'
- 'Washington model: correct reported formaldehyde direction to Methylomonas -> Methylobacter. Preserve
  conditional synthetic uptake and lack of uptake under sediment constraints. MB:ML ratios0.05:1 and9.3:1
  are imposed, not recovered predictions. CO2 is environmental export; borrowed parameters, optimization
  and inhibition constraints bound interpretation.'
- 'Washington source contradictions are not silently resolved: nutrient-rich dominance and formaldehyde-export
  wording conflict. Keep reported conditional transfer with PARTIAL support and source uncertainty;1554
  requests S4/SBML/solution or author clarification. Public supplemental HTTP500 and blocked web access
  do not justify bypass or a claim that supplements were inspected.'
- 'Mars: living-host IN_VIVO evidence, alternative S. meliloti2011/S. medicaeWSM419 inoculations and S.
  meliloti1021-only reporter are distinct. Preserve nodule count exceptions, promoter activity and plant
  mass/lateral-root observations. Remove N2/ammonia mediator assignment and both anatomical/conclusion
  arrows; neither establishes flux, delivery, mutual benefit or causal induction.'
- 'Mars: Results lateral-root reductions qualify the abstract. Earth greenhouse and simulants without
  perchlorates are not Mars atmosphere experiments. Chemical mediation is hypothetical; host identity
  remains missing from the canonical roster and1553 tracks non-graph repairs.'
- Full biological diffs, participant registry and focused tests reviewed.457 other records and raw non-graph
  blocks,920 caches unchanged. Canonical roster/scope census unchanged; one newly exposed Methylosarcina
  connectivity warning is expected from omitting the misgrounded species, tracked1553. All36 prior warnings
  remain, no structural defects and no auditor-rule changes.
- Actual final-state schema, strict, terms, references, snippets, history, corpus audit, deterministic
  render and regression outputs captured. Exact descriptions parsed across456 pages, not browser screenshots.
  Post-commit docs-current is a separate publication gate.
- Deduplication:848 all-state issue titles/bodies and35 scoped ignored/hidden local matches.497 and related301
  issue bodies read, not every comment/PR/local file.1550-1552 addressed but OPEN until protected-main
  merge;1553/1554 remain unresolved afterward. Exact-head self-review is COMMENT, never independent approval.
  No new causal structure or paid Edison job.
