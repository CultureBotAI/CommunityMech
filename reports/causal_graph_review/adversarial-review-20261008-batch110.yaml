adversarial_checks:
- Whole original targets and all changed graph/discussion diffs reviewed. All ten nodes and six existing directions
  retained. No renamed, removed or new topology; no Edison job or spend.
- 'Challenge overcorrection: preserve photosynthetic carbon supply, PHB/PHA accumulation, DNT transformation, cyanobacterial
  growth benefits, anode current and device-compatibility benefits. Qualification distinguishes observed outcomes
  from isolated causal mediation, not positive from negative results.'
- 'Halomonas: abstract supports sucrose feeding, PHB up to 31% dry weight, productive persistence over five months
  and alginate-enhanced export/stability. It does not identify LC1, resolve all organic inputs or isolate encapsulation-to-PHB
  mediation. Preserve existing identities but mark graph needs_research and retain the mediation arrow as HYPOTHESIZED/PARTIAL.
  PHB output and alginate intervention are untyped community processes, not duplicate exchange or colonization facilitation.'
- 'Pseudomonas: distinguish cscAB PHA, cscRABY/nitrate-blind and EM173 DNT implementations. Measured medium-chain-length
  PHA is not PHB homopolymer; 8.8-fold final accumulation is not a rate comparison. DNT disappearance includes adsorption
  and reductive fates; oxidative intermediates support transformation, not measured complete mineralization. Preserve
  nitrogen-limited PHA outcome without importing polymer identity from a crotonic-acid assay.'
- 'Pseudomonas feedback: retain conditional carbon-supported partnership and positive cyanobacterial growth. The
  heterotroph does not gain growth rate over matched externally fed axenic controls. Mixed-cell omics and transporter
  responses do not establish a donor/recipient mediator or reverse sucrose donation. The unresolved mechanism remains
  PARTIAL with a discussion, not a new exchange node.'
- 'Shewanella: retain D-lactate contribution using lactate rather than acid grounding, without exclusive organic-carbon
  attribution. The anode is abiotic, not the cyanobacterium. Source Figure1 proposes CO2 return, so the existing
  reverse arrow remains explicitly hypothetical; positive cyanobacterial growth is retained separately. Temporal
  batch, spatial and replenished spatial-temporal devices are distinct. More-than-40-day output is qualified by
  medium replenishment and LB supplementation; no protocol optimization is added.'
- Twenty-four graph and three new discussion quotations match fresh primary text and unchanged caches under documented
  normalization. Five primary main texts were read in bounded spans and one primary abstract in full; remaining
  Methods, supplements, figure pixels and raw data were not certified. Halomonas full article was not retrieved
  in bounded searches, not declared globally unavailable.
- Initial reference failure came from a PDF word join. A replacement excerpt from the same primary paragraph passes
  CLI validation, with append-only correction history and the failed attempt retained. One remaining local snippet-audit
  MISMATCH is an exact, independently proven fi-ligature false positive; issue1863 stays open. No shared validator
  change, cache rewrite or claim that all snippet classifications are clean.
- Three guarded records and four append-only histories preserve all prior history and decision files, 457 other
  records, all 923 caches and non-graph raw blocks. Shewanella adds one community-level/mixed record and two taxa
  to the survey denominator, with no new taxa credited solely by the broad rule. Measurement-based census expectations
  are updated; connectivity and share logic are unchanged.
- Four in-memory control/mutation/restored-control probes reject PHA-to-PHB inflation, complete-mineralization inflation,
  a cyanobacterial anode recipient and unsupported growth-mediator certainty. Canonical files remain unchanged;
  probes are not added to the pytest count.
- Seven focused tests and 994 combined regressions pass. Three full-record schema/strict/term/reference validations
  and four histories pass. Local snippet checks retain the one explicitly documented ligature discrepancy. Network
  preserves 56 baseline warnings with zero structural defects. Deterministic rendering and exact HTML descriptions
  cover 456 pages, 1367 nodes and 536 arrows; this is not screenshot QA.
- Repairs1857-1859 await protected-main merge. Research1860, non-graph1861-1862 and validator1863 remain open. Existing
  loader1703, DOI-case1091 and cache-policy949/1093 are not certified. Denied/unanswered Edison scopes are untouched.
  Self-review is not independent approval, and no CI/protection bypass or premature branch deletion is allowed.
- Corpus status is 352 reviewed, 55 pending and 53 needs_research. The whole goal remains incomplete. Exact-head
  publication and postcommit docs-current are separate gates, not preasserted here.
- Plain just-lint passed;explicit-runtime no-incremental mypy additionally checked.
