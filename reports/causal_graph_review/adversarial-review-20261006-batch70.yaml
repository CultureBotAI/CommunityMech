adversarial_checks:
- Read all four whole records,18 original nodes and12 arrows. Read three complete public primary bodies/Methods/captions
  and the EFPC MAG table, plus complete primary abstracts for both methane studies. Public publisher requests
  failed; no access-control bypass. No separate supplements, original images, raw data or executable models
  audited.
- EFPC is two depths from one core and28 MAGs, not a controlled Hg-selection experiment or complete seven-phylum
  community. Preserve the sampled genomic observations and author selection interpretation but qualify
  its causal link to resistance capacity. Do not infer niche partitioning from functional annotations.
- 'EFPC methylation potential is explicit prior-study environmental background, not measured hgcAB or
  flux in the28 MAGs. The removed selection-to-methylation arrow is not retargeted to a invented pathway.
  The independent methanogen culture study remains positive comparative context: eight of nine strains
  methylated above matched controls, while fused-hgcAB M.methylutens did not. Do not silently credit canonical
  Thermoproteota with those external methanogen results.'
- Preserve27/28 putative metal-resistance/ATPase annotations and17/28 Se-assimilatory annotations without
  measured resistance, expression, uptake or community persistence. Eisenbacteria is an explicitly represented
  subset; Rokubacteria is source-mentioned but not added through an unverified canonical mapping. No selenium-to-mercury
  arrow invented.
- Syn7002 salinity-associated Microcystis disappearance and later relative sorting are real observations.
  They are not a tested interspecies competition mechanism, proof of PseTH extinction or absolute viable
  growth. Remove three assembly/analysis-order arrows without deleting the observations. Preserve source-inoculum
  versus stable-partner distinctions and prior genus grounding.
- Syn7002 coculture growth rescue and B12-positive controls remain positive results under B12-free BG11.
  Do not turn uncertainty about the mechanism into absence of benefit. Washed precultures do not by themselves
  establish zero carryover or intracellular stores. Growth/absorbance is not a direct photosynthetic-flux
  assay or reciprocal-fitness test.
- MesTH B12 provision, proximity-facilitated transfer and biosynthetic/transport contribution remain source-consistent
  hypotheses with direction and biological mechanism stated. The day20 pellet LC-MS/MS non-detection is
  not an extracellular measurement or proof of rapid uptake. SEM rods are not cell-resolved identity or
  a contact-requirement test. No donor perturbation or delivery route was selectively isolated.
- Figure4 transcript values are fold changes relative to an initial stage, not absolute cross-species
  B12 output or matched monoculture induction. Retain positive temporal transcriptional observations;
  nitrogen-related expression is not direct fixation/assimilation. Separate TableS1 was not read and its
  numerical assay limits are not invented.
- 'Methane MFC isotope results are stronger than ammonium accumulation alone: retain15N2-derived biomass13.55%,aqueous
  ammonium7.15%,0.22+/-0.01mg/L over30days. Retain1.17+/-0.18mA and78.1% Coulombic efficiency. Whole-enrichment
  outcomes are not six separately proven fixation or electrode-transfer phenotypes.'
- MFC DNA-SIP guild assignments remain attributed as reported. Qualify both guild-to-endpoint arrows rather
  than erasing positive isotope and inhibitor evidence. Raman15N in cytochrome shows incorporation, not
  a selective causal test that fixation increases current. No obligatory reciprocal dependence, exclusive
  route, new methane node or nitrogen-to-current arrow claimed.
- Methane-CrVI retains maximum20.63mg/L/d removal and the positive inhibition result linking methane oxidation
  to reduced CrVI reduction. MAG-assigned Methylocystis6.30% is not exclusive taxon flux. Hypoxic aerobic
  methanotrophy is not automatically oxygen-independent oxidation.
- CrVI source proposes cytochrome/pilus routes or partner-associated transfer, not one proven serial chain.
  Keep twoPARTIAL arrows; inhibitor specificity and route-specific controls remain unavailable. Differential
  quorum-sensing/ABC/porin expression is not selective mediation. Chromate is the preserved canonical
  representation, not exact challenge-salt validation. Three named genera are a subset, not a defined
  three-isolate consortium.
- All changed top-level fields are graph/discussions/curation_history only. Verify raw preservation of
  non-graph blocks,456 other records and920 caches. Preserve upstream id001 aliases for CrVI engineering/taxonomy/environment
  evidence while detaching changed graph evidence. Exactly one append-only history/event per record, all
  discussion anchors resolve.
- Measure both-root participant census unchanged460/391/123/268/1507/1240. Add EFPC to exact participant
  USERS registry only; no taxonomy or auditor-rule changes. All44 network warnings match baseline exactly.
  Coarse solely-rule counts are not proof of member-resolved mechanisms or precise participant credit.
- Actual schema/strict/terms/references/snippets/history, inventory/rank/network, repeat-render and combined
  regression outputs retained with hashes. Exact description parser covers456 pages, not browser screenshots.
  A preflight lint complaint about the new test lambda was fixed before the recorded full run; all recorded
  final gates refer to the corrected test. Post-commit docs-current remains a separate gate.
- Deduplication includes886 all-state issue titles/bodies and23 scoped ignored/hidden local matches. Matching
  issue bodies#713,#650,#583,#314,#16 read, not all PR comments/historical local matches. Repairs#1596-#1599
  addressed but OPEN until protected-main merge; metadata#1600 remains OPEN afterward. Self-review is
  not independent approval or whole-corpus completion.
