limitations:
- All18 original nodes and12 arrows reviewed. Retain18 bounded observations, qualify8 arrows and remove4
  unsupported cross-study/workflow arrows. No new nodes/arrows or paid research submission.
- Three complete public primary main bodies and captions read, including EFPC Table1. MFC and CrVI studies
  available only at primary-abstract scope after public publisher requests failed. Separate supplements,
  raw data/genomes, original images and executable analyses not audited.
- EFPC methylation is explicitly background potential from prior studies, not measured carriage/flux in
  the sampled MAGs. Separate methanogen culture results remain positive external context in a focused
  discussion. Resistance/selenium are annotation-based capacities.
- Syn7002 positive growth rescue remains; B12 delivery, contact facilitation and expression-to-provision
  are hypotheses. Pellet non-detection is not an extracellular assay or proof of rapid utilization. Relative
  PseTH decline is not extinction, competition or absolute viable growth.
- MFC positive 15N2 incorporation, current and cytochrome inhibitor/Raman results remain at enrichment
  scope. Reported guild assignments do not isolate each genus or establish nitrogen fixation as a cause
  of greater current.
- CrVI positive removal and methane-inhibition effects remain. MAG/multi-omics route alternatives do not
  establish an exclusive serial pathway, exact challenge species or quorum-sensing mediation.
- 'All920 caches and all non-graph raw blocks unchanged, not recertified. Canonical phylum/genera and
  unresolved Hyphomicrobium IDs remain unchanged. Follow-up #1600 stays OPEN after graph repairs; #583
  guidance and prior #314 grounding preserved.'
- 'Ignored/hidden-inclusive local search and all886 issue titles/bodies used for deduplication; matching
  issue bodies #713,#650,#583,#314,#16 read. No claim to exhaustive PR-comment or historical-local-match
  review.'
- 'Self-review is not independent approval. Repair issues #1596-#1599 remain OPEN until protected-main
