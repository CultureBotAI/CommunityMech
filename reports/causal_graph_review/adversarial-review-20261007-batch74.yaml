adversarial_checks:
- Read all four whole records and every original node/arrow after the both-root baseline. Read three complete primary
  main bodies, captions and embedded tables; no separate supplement, raw-data or figure-pixel audit. Moss scope
  is primary abstract only after full access403, not evidence of absent controls.
- Preserve108 retained cyanobacterial consortia and25 operational core species. Species occurrence18.5%-68.5% contradicts
  universal membership. Both host and source effects are significant; authors explicitly lack cyanobacteria-free
  controls. Repair the name, description and stale evidence explanation, not only the headline.
- Genomic and plasmid enrichment are positive observations. Putative plasmid cobinning,98% noncircularized contigs
  and bioinformatic removal do not prove biological plasmid dependence, metabolite exchange or reciprocal fitness.
  Remove analytical-workflow edges without deleting observed nodes.
- Retain formaldehyde generation0.6-0.8mM, C.fimi inhibition threshold0.5mM, and experimentally reduced accumulation
  with M.extorquens. The formaldehyde-free PCA control still inhibits C.fimi; do not claim detoxification completely
  restores growth or dominates inhibition.
- Preserve two positive exchange results under their actual conditions. Selected CM4744 supports C.fimi without
  supplied methionine only with added methanol/succinate; wild type does not. Separately C.fimi supports methylotroph
  growth. Correct methionine donor direction; no claim of autonomous mutual codependence.
- Iron/supplement rescue and spent-medium inhibition support multiple mechanisms, not an exclusive depleted resource.
  Remove competition-to-engineered-exchange arrow because investigator selection is not biological induction of
  overproduction. No new reverse edge or separate node added.
- Moss primary abstract supports reported colonization facilitation, growth/soil gains and altered metabolite pools.
  Preserve positive results while bounding endpoint comparators and colonization mediation. Shared-treatment outcomes
  do not establish growth causing metabolite accumulation; joint application is not measured reciprocal fitness.
- Mucin substrate changes directly affect composition, degradation and fermentation profiles. Retain composition-to-degradation
  as PARTIAL mechanism, not a composition-only intervention. Preserve BSM O-glycan limitation versus N-glycan degradation,
  residual added glycans and yeast-extract contribution. Do not infer A.muciniphila sialic-acid utilization from
  enrichment.
- Preserve existing MDSC pairwise-flux discussion and closed957/958/959 repairs. No taxonomy, strain identifier
  or non-graph change. Metadata1624 separately tracks remaining whole-record scope; no synthetic member-specific
  arrows invented.
- Adversarial diff review found a remaining host-independent evidence explanation. Corrected before commit, added
  explicit regression coverage and retained17 superseded outputs, then reran all affected and corpus gates. No stale
  pre-fix pass is presented as final verification.
- All13 nodes and7 original arrows have decisions;3 remain,4 noncausal links removed. All456 other records,920 caches
  and raw non-graph blocks verified unchanged. Four append-only record/history events. Structural defects zero;44
  baseline warnings unchanged, connectivity census unchanged.
- Actual schema, strict, terms, references, snippets, history, both-root inventory/network/rank, repeat renders,
  regression and lint results retained with digests. Exact descriptions parsed across456 pages, not browser screenshots.
  Postcommit docs-current remains a separate publication gate.
- Dedup scanned906 all-state issue titles/bodies and31 ignored/hidden local matches with explicit git/docs/site/cache
  exclusions; prior957/958/959 fixes inspected. No exhaustive PR-comment audit or global source-absence claim. Repair1620-1623
  stays OPEN until protected-main merge;1624 stays OPEN afterward.
- No new causal topology and no paid provider submission. Existing denied/pending scoped authorizations unchanged.
  Self-adversarial COMMENT is not independent approval and does not certify corpus completion.
