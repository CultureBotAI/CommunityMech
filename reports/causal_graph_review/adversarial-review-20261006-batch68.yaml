adversarial_checks:
- Verification also caught ruff B023 in the new mapping test helper after619 tests passed. Explicitly
  bind the per-record rename map, preserve pre-fix regression/formatting outputs and rerun the full suite
  on final content. No scientific record changed for these verification fixes.
- Read four whole records and all11 original nodes/six arrows, four complete fresh primary main texts/captions
  and both main tables. Retain11 nodes, qualifyfour arrows and remove two assay-order arrows. No new causal
  structure. Original figure pixels, separate supplements, raw data and external papers cited in the four
  studies were not independently audited.
- 'SC2: retain seven-day PDA inhibition comparable to C7 and14-day B73 height/fresh-root-mass improvement.
  The plate and plant assays do not isolate competition, pathogen-load mediation or host immunity. Keep
  the existing inhibition-to-growth hypothesis explicitly HYPOTHESIZED, not causal certainty or proof
  of no contribution.'
- 'SC2: Salkowski with pure-IAA calibration and CAS halo assays support the reported45/65ugmL and0.50cm
  outputs. Keep chemical interpretations with their assay limits, not exact siderophore identity, pathway
  perturbation, in-planta delivery or reciprocal benefit. Preserve host/pathogen as external participants
  and prior #887-#889 repairs; do not resolve strain aliases from species-list order.'
- 'MFC: retain positive98.7% benzene removal, product observations, sustained biotic voltage and higher
  power density than acetate.902.3mV belongs to250mgL cycleVI,899.9mV to330mgL cycleVII;390.1 versus238.8mWm2
  is not100fold. The awkward removal sentence is resolved against abstract, main Table1 and Conclusion,
  not interpreted as98.7% residual benzene.'
- 'MFC: relative genus enrichment does not resolve absolute expansion, niche partitioning or member catalytic
  necessity. Keep composition-to-output as the authors HYPOTHESIZED route, with confounded substrate/acclimation
  context. Four named genera are a partial roster. DET/MET and traced partner exchange remain unresolved.
  Preserve #1124 Bacillus role correction; existing Arcobacter role and Daphnia metadata remain follow-up.'
- 'Meteorite: shared abiotic substrate and separate growth/persistence results are not a coculture. Earlier
  leachate chemistry does not prove current ion-specific uptake or carbon source. Low-perchlorate meteorite
  and terrestrial conditions are not general Martian habitability. Water controls, unequal initial phototroph
  counts, MPN recovery and heterotroph CFUs bound inference.'
- 'Meteorite: preserve positive Chr20 persistence and early Planococcus growth while stating most Planococcus
  ratios lose late recoverability, E.coli survives in water-only controls, and below quantification is
  not extinction. Remove the assay-to-persistence workflow arrow, not the measured endpoint. Keep qualified
  substrate support rather than erase the positive resource hypothesis.'
- 'MGS-1: retain TXRF elemental chemistry, separate OD440/PSII growth and Nostoc/Anabaena performance
  with Anabaena late decline and Arthrospira clumping/mild-growth limits. Element totals are not speciation/uptake.
  No direct N2 or O2 flux measured; undetected extract phosphorus, inoculum and reserves/carryover matter.'
- 'Lemna: preserve seven-day positive dry-weight outcomes for Arthrospira filtered/sonicated and Chlorella
  filtered culture material. Lower frond yields, nonsignificant filtered/sonicated differences and nonequivalence
  caveat retained. Processed-material benefit is not live commensalism. Growth-advantage mediation of
  fertilizer advantage is not established: Nostoc grows well but supplies the weakest material treatment. Remove that workflow
  arrow while retaining resource-transfer observations.'
- 'Panel-model caveat remains unresolved, not hidden by graph status. Existing COMMUNITY_LEVEL is retained
  only as the current container for shared abiotic/panel observations; #573 is still OPEN for record-model
  placement. No new schema convention, coculture or emergent microbial community is certified. Prior PR574
  and graph-adding commit fa3f1a8c read.'
- 'Read complete biological diff. Remove unsupported specific interaction/process annotations but preserve
  supported growth/photosynthesis context, positive endpoints and author-proposed routes. Renames retarget
  every retained edge and prior discussion anchor. Detach graph aliases; preserve explicit benzene and
  benzene_term anchors needed by untouched non-graph references.456 other records and920 caches preserved;
  append one history/event per target. Initial regressions found one exact-registry failure with618 passing:
  add the two deliberately named Mars panel records to USERS after measuring the census. Retain all test
  logic, preserve the failed output/digest in superseded_checks, and rerun the complete suite.'
- Actual focused schema/strict/terms/references/snippets/history gates, network/rank, repeat rendering,
  regressions and formatting outputs recorded.17 graph excerpts independently primary-matched with whitespace
  normalization. Coarse scope census unchanged; network warnings46->44 because two observed MFC genera
  are now explicitly named in whole-biofilm nodes, not because their catalytic roles were established.
  Initial verifier no-delta assumption was corrected after inspecting actual output; no scientific edits
  made to satisfy the gate. Other44 warnings preserved exactly, no auditor-rule changes. Exact descriptions
  parsed over456 pages, not screenshots; postcommit docs-current is a separate gate.
- 'Dedup874 all-state issue titles/bodies and47 scoped ignored/hidden local files; matching issue bodies,
  relevant histories, prior PR574 and graph-adding commit read, not every PR/comment/local match. #1582-#1585
  addressed but OPEN until protected-main merge. #1586/#573 remain OPEN afterward. No provider spend;
  exact-head COMMENT self-review is not independent approval or corpus completion.'
