adversarial_checks:
- Fresh both-root baseline preceded papers. All12originalnodes4arrows have dispositions:10nodes4arrows retained;
  two infant analytical-method nodes removed; no new topology.
- Prairie genes, MAGs and predicted host links remain positive findings. Genomic potential is not measured flux
  or reaction direction. Alcohol-fueled methanogenesis remains hypothesized without invented producer-to-consumer
  cross-feeding.
- Prairie niche and viral arrows remain explicitly HYPOTHESIZED. The primary discussion warns of false-positive
  host links and opposing possible effects of host suppression versus substrate release. No established sign of
  ecosystem effect or measured lysis is claimed.
- Infant four-person observational oxygen-ratio signal is preserved, not direct oxygen measurement, NEC causation
  or diagnostic validation. Twenty repeated samples are not independent infants. Methods belong in context; NO/osmotic
  observations and source significance discrepancy remain explicit.
- Rice positive arsenic and host physiology endpoints survive. Transporter downregulation is retained as the primary
  authors explanation with PARTIAL mediation. Two bacteria and rice host receive canonical participant labels, without
  claiming reciprocal mutualism or drawing an unsupported endpoint-to-endpoint arrow.
- Helper peroxide detoxification and growth benefit survive as a supported direction. CO2 treatment results remain
  positive observations, including catalase transcription, sixfold peroxide-removal reduction and lag/apparent die-off.
  PARTIAL catalase mediation does not imply those measurements are merely hypothetical.
- Helper removes all-ROS, neutral-helper-fitness and colonization classifications unsupported by cited snippets.
  Separate thermal and CO2 assays remain distinct. Missing access is not evidence that perturbations were never
  performed. VOL4/strain/medium context is a non-graph follow-up, not silently edited.
- Two fresh main texts read, three other abstracts read; only initial helper thermal methods exposed by public browser
  extraction. No full helper main-text, separate supplement, raw-data or figure-pixel audit. Failed requests and
  discarded unrelated DOI/PMC guesses are disclosed; no paywall bypass.
- All921caches,456otherrecords and raw non-graph blocks preserved. Four append-only histories and ten focused tests.
  Three participant-list users added; census and all51warning entries unchanged; no structural defects or auditor-rule
  edits.
- Actual local gates and deterministic HTML-description checks ran; they are not browser screenshots or generated-model
  load certification. Loader1703 remains open. Repairs1718-1721await protected-main merge; metadata1722 staysopen.
  No paid Edison job or inferred spend authorization; self-review is not independent approval or corpus completion.
