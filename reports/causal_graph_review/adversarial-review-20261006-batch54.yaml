adversarial_checks:
- Whole219-line phage,209-line prebiotic and250-line maternal bacterial records read, including all10
  original nodes and7 arrows. Complete primary main texts/Methods and main captions/tables read for all3
  sources. No original figure pixels, external supplements, raw data or code audited. The prebiotic paper
  is version1 of a preprint, not peer reviewed.
- Phage155/1801 persistence denominator refers to40 eligible infants, not every maternally shared or Bacteroides-associated
  phage. Maternal/Bacteroides canonical entries represent a subset. Predicted host/lifestyle and sharing
  are not universal lytic predation or an isolated maternal-transfer experiment.
- Recoding persistence association remains positive. Three early recoded persisters have heterogeneous
  TAG trajectories including decreases; no universal increase or selectively demonstrated delayed-lysis
  effect. Community richness differs from within-phage nucleotide diversity; richness-to-persistence arrow
  removed.
- Phage population ANI99 percent/75 percent compared sequence is distinct from bacterial99.999 percent/50
  percent. Coverage and CRISPR correlations do not prove continuous infection of an unchanged host lineage.
  Both retained phage arrows are PARTIAL with actual proposed mechanisms.
- SynCom has six species and differs from donor-derived communities containing P. dorei/L. rhamnosus.
  Four canonical entries are an explicitly cross-experiment subset, not an exact four-member experiment.
  Roster/strain identifiers and missing R. gnavus structure remain1514; no guessed CURIE or invented member
  added.
- Positive omission/Raman-FISH result is higher E. coli metabolic activity with P. vulgatus PRESENT underGOS;
  direction verified against primary Results and a short exact excerpt. An interim continuation summary
  inverted this direction, caught before any record edit. Source notes, issues and final records have
  the correct direction. Abundance invariance belongs to this assay, not every substrate experiment.
- Succinate/propionate output is not demonstrated direct transfer to E. coli. Conditioned supernatants
  did not reproduce the GOS/glucose growth difference. Retain community intervention evidence with SUPPORT;
  remove the overview-to-component arrow, not the controlled result.
- Lactate-versus-acetate challenge supports species-dependent inhibition, while the main text discusses
  additive pH/acid effects. Exact challenge protocol is absent from inspected main Methods; no claim that
  an uninspected supplement lacks it, and no invented pH-clamped control. Fermentation-to-inhibition remains
  PARTIAL pending selective depletion/rescue.
- Bifidobacterium12 persisters/18 non-persisters CAZyme genomic association retained as positive computational
  evidence. E. coli3/25 iron, adhesion and toxin annotations are not transferred to Bacteroides/Bifidobacterium.
  Missing E. coli representation remains1515, with positive findings explicitly retained in discussion.
- Bacterial59/560 denominator and month8-or-later endpoint are explicit; maternal-sharing association
  is not a dominant cause applying uniformly to Bifidobacterium. Clinical/prematurity/antibiotic/feeding
  confounding remains explicit. Non-graph descriptions and taxonomy are preserved, not certified.
- 'Future ex-vivo motility structure must preserve negative controls: full and P. vulgatus-omitted supernatants
  both suppress mouse-colon motility, matching SCFAs do not reproduce it, and endogenous PEA was below
  detection. No infant in-vivo physiology or established endogenous PEA mediator is asserted.'
- Full record diffs, all8 focused tests, participant-registry and cache diff inspected.10 nodes retained;2
  arrows removed;5 PARTIAL arrows remain. Only graph/discussion/curation-history record fields change;457
  other records and raw non-graph blocks unchanged.919 caches unchanged; one exact-prefix appendix adds16
  XML-verified source words with attribution and digest.
- Actual focused schema/strict/term/reference/snippet/history/rank gates passed. All34 baseline network
  findings preserved with zero structural errors. Repeat render deterministic and exact descriptions parser-checked
  over456 pages, not browser screenshots. Two source-backed pairwise-to-community corrections yield measured
  mixed125, community-only264 and1226 solely community-credited taxa; no production matching or census-bound
  change.
- Dedup searched817 all-state issue titles/bodies and43 ignored/hidden local files; relevant contexts
  inspected, not every historical comment/review.1511-1513 addressed but open until protected main merge;1514-1515
  unresolved. Two separate Edison dry runs only, no provider call or spend. Self-adversarial review is
  not independent approval.
