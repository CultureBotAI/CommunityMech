limitations:
- Whole three records, all ten original nodes and seven arrows reviewed; ten nodes remain, two arrows
  removed and five partial mechanisms retained. No new graph structure.
- Full primary main texts and Methods read for all three studies, plus main embedded captions/tables.
  Phage captions/tables extracted separately and fully read. No original figure pixels, external supplements,
  raw data or code audited. Preprint version1 is not a peer-reviewed publication.
- Phage persistence and maternal bacterial sharing are observational. Host/lifestyle assignments, recoding
  and CAZymes include sequence-based inference. Community richness is not within-phage diversity; phage
  and bacterial strain thresholds differ.
- Positive E. coli activity under GOS is higher with P. vulgatus present. Omission affects a community;
  conditioned supernatants did not reproduce the GOS/glucose difference. Acid challenges support species
  dependence without a main-text pH-clamped protocol. Donor taxa differ from SynCom members.
- Bifidobacterium carbohydrate-genome association is preserved. E. coli iron/adhesion findings are not
  erased, but remain in discussion and unresolved1515 because the canonical roster lacks that organism.
  Three E. coli persisters came from preterm disease-enriched sampling.
- Prebiotic roster, R. gnavus availability and ex-vivo motility representation remain unresolved1514;
  maternal E. coli representation remains unresolved1515. Canonical taxonomy and all non-graph raw blocks
  preserved, not recertified.
- Two separate one-community Edison dry runs completed. No paid provider request/report, no credit spend
  and no new node/arrow; full-prompt review and specific payload/spend authorization remain prerequisites
  to submission.
- One preprint cache gains16 exact primary-verified words with XML digest and attribution, original exact
  prefix preserved.919 other caches unchanged. This is not certification of all historical cache provenance.
  Full primary texts remain outside the repository.
- Dedup searched817 all-state issue titles/bodies and43 ignored/hidden local matches; relevant contexts
