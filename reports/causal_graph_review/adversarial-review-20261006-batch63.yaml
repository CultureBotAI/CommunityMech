- Complete Lotus and lettuce primary main bodies and embedded captions read. No original figure pixels,
  linked lettuce table cells, separate supplements or raw data audited; author-reported numerical summaries
  were not recomputed.
- Mangrove complete primary abstract only; publisher subscription preview confirmed. Day6/day9 maxima,
  unresolved biomass attribution, metabolite production and physical association are not selective mediation
  or transfer proof.
- Public Europe PMC Lotus supplemental download actually timed out after90s with719804 bytes; incomplete
  archive not treated as inspected evidence. Publisher/PMC access limitations were not bypassed.
