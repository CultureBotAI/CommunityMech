adversarial_checks:
- Read the three whole records and account for every original node/arrow. Complete Lotus and lettuce fresh
  main bodies, Methods, Results, Discussion and embedded captions read; mangrove complete primary abstract
  only. No original figure pixels, linked lettuce table cells, separate supplements or raw data audited.
  Numerical summaries are author-reported, not recomputed.
- 'Mangrove: retain both positive observations and zero arrows. Compare day6 coculture and day9 axenic
  maxima, not matched-time biomass. Full Methods do not establish partner-resolved measurement because
  they were unavailable. Metabolite production and physical association are not traced transfer, selective
  growth mediation, contact necessity or reciprocal benefit. Preserve earlier1154/1155 repairs.'
- 'Lotus: distinguish SC3 living-host experiments from SC1 exudate and SC2 comparisons. Preserve mixed-community
  cognate-root preference and lack of preference in SC3 mono-associations. Neither implies that a specific
  member facilitates colonization or receives reciprocal benefit.'
- 'Lotus: preserve four-week establishment plus two-week reciprocal challenge, higher early-arrival relative
  proportions and no significant total-load increase after secondary inoculation. These are not absolute
  exclusion, invariant abundance, equilibrium or selective niche-preemption/host-feedback tests.'
- 'Lotus: preserve cognate-root invasion advantage and strain-index correlation, absent in rhizosphere.
  Remove the correlation and standing-community-context arrows without erasing the observed advantage.
  Causal mediator and later equilibrium remain unresolved.'
- 'Lotus roster: do not silently certify three nodule isolates and unspecified family-associated bacterium
  IDs as16 SC3 members. Only canonical Lotus host is securely grounded for these nodes; missing comparator
  host and unverified microbial roster remain under1559. Public supplementaryFiles download ended with
  actual90s timeout and incomplete719804-byte archive; no contents certified and no access control bypassed.'
- 'Lettuce: no inhibition zones establish assay-specific compatibility, not commensalism, universal non-antagonism
  or stable rhizosphere coexistence. Per-strain14L inoculum production is not a consortium-growth assay;543
  already addressed that wording. Remove the preparation-to-establishment arrow.'
- 'Lettuce: preserve amendment-conditioned nifH/phoD/BPP DNA-copy responses, not expression, nitrogen-fixation/phosphate
  flux, gene ownership or inoculant establishment. The paper expressly limits metabarcoding strain tracking.
  Four listed taxa are applied inoculants, not all rhizosphere members or missing host.'
- 'Lettuce: preserve overall35% dry-biomass and average26% nutrient-content benefits with substrate/nutrient
  variation. Significant concentration increases onlyP/K and nonsignificant overall extracted-availability
  effect qualify the outcome. Remove IAA process assertion, mutualism and gene-copy-to-benefit mediation
  arrow. Earth greenhouse simulants are not lunar/Martian environments.'
- Review full biological diff and focused tests.457 other records,920 caches and raw non-graph blocks
  unchanged. Canonical taxonomy preserved, not recertified. All37 baseline network warnings retained;9
  explicit omitted-roster connectivity warnings tracked1559, with no structural defects or audit-rule
  change. Coarse roster/scope census unchanged; it does not certify within-community membership.
- Actual schema, strict, term, reference, snippet, history, corpus audit, deterministic render and regression
  outputs captured. Exact descriptions parsed across456 pages, not browser screenshots. Post-commit docs-current
  remains a separate publication gate.
- Deduplication:853 all-state issue titles/bodies and22 scoped ignored/hidden local matches; full matching1155/1154/1093/1082/595/543/497
  bodies read, not every PR/comment/local match.1556-1558 addressed but OPEN until protected-main merge;1559
  and existing unrelated issues remain OPEN. Exact-head self-review is COMMENT, never independent approval.
  No new structure or paid Edison submission.
