limitations:
- This is self-adversarial review, not independent approval; whole-corpus semantic review remains incomplete.
- Avena_Rhizosphere_Detritusphere_Niche_Succession remains pending and byte-identical because its published results/discussion
  review is incomplete.
- BSFL is abstract-bounded; tobacco is selected-excerpt-bounded; Australian results/discussion and straw main text
  remain incompletely accessed. Figure and supplement limits are recorded per source.
- The LDSynCom source is a preprint. Its main text and captions were read; figure images, Table 1 and supplements
  were not reviewed.
- Non-graph membership, taxonomy, media and record-identity claims remain outside certification. Narrower graph
  participant lists must not be expanded just to suppress disconnected-taxon warnings.
- Edison spending is authorized, but no configured key or paid job is present. No extension structure is added or
  certified.
- No article body or PDF is added. Existing unrelated untracked and ignored files are preserved.
- Publication text coverage and deterministic rendering are checked; no desktop/mobile screenshot QA is claimed
  for this data-only batch.
- The local PDF gate fails on unrelated workspace files; the publishable snapshot passes all three rights tests.
  The unchanged Asgard reference-tool failure remains explicitly reported.
