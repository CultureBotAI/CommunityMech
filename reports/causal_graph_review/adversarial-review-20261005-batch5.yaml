scope:
- Eleven whole-record reviews and graph-only repairs; one additional provisional record deferred without edits.
- Every current and removed node, before/after arrows, exact renamed targets and discussion anchors.
- Evidence modality, assay context, community versus member fitness, measured endpoints versus inferred mechanisms,
  and source access.
- Guarded writes with whole-batch schema and YAML reassembly preflight; hash-bound ledger, appended history, unchanged
  non-graph fields and generated pages.
findings:
- issue: https://github.com/CultureBotAI/CommunityMech/issues/1248
  severity: high
  finding: Plant graphs overstate reciprocal interaction types, confuse assay contexts and retain experimental-workflow
    nodes.
  resolution: Preserve measured plant and inhibition outcomes; remove two phyllosphere workflow nodes, narrow participants
    and process groundings, distinguish root/in-vitro/computational evidence, and qualify mediation.
  status: addressed
- issue: https://github.com/CultureBotAI/CommunityMech/issues/1249
  severity: high
  finding: Environmental graphs promote genomic predictions, cross-site observations and isotope incorporation to
    resolved flux or host infection.
  resolution: Preserve phage isotope incorporation and source-proposed arrows with explicit uncertainty; correct
    predicted-host provenance, reversible Asgard metabolism and composite tailings scope.
  status: addressed
- issue: https://github.com/CultureBotAI/CommunityMech/issues/1250
  severity: high
  finding: Consortium output assays are represented as reciprocal fitness, direct structural lignin breakdown or
    resolved field mediation.
  resolution: Remove the BSFL selection node and associative ALDH arrow; qualify lignin proxies, HPLC removal, enzyme
    activity and field interpretation while preserving directly reported outcomes and explicit straw cross-feeding.
  status: addressed
existing_findings:
- issue: https://github.com/CultureBotAI/CommunityMech/issues/880
  finding: Tobacco IAA node previously used broad growth annotation.
  verification: Base and final records both use GO:0009684. This is verification of an existing repair, not a new
    fix; a regression assertion now protects it.
- issue: https://github.com/CultureBotAI/CommunityMech/issues/622
  finding: Reference validator strips bracketed chemical notation from a correct source quote.
  verification: Asgard related_ingredients[2] remains unchanged; reference check fails on stripped [NiFe], while
    the independent snippet audit matches all eleven record snippets. The upstream issue is not repaired by this
    graph batch.
additional_checks:
- All 605 open/closed issue bodies were searched using record stems, canonical IDs and cited identifiers before
  filing; related bodies were read. No comprehensive synonym search is claimed.
- Closed LDSynCom issues 929 and 932 remain resolved; neither mutualism nor the dangling assay-readout arrow is
  restored.
- Competition is not limited to resource depletion. Reciprocal tobacco plate inhibition remains classified as COMPETITION,
  while aggregate host outcomes do not.
- Syntrophy requires coupling through partner product removal, not merely obligatory association. Tailings observations
  do not establish that mechanism.
- Straw cross-feeding is explicitly reported by the source and is preserved despite main-text access limits; missing
  access is not evidence that an experiment was absent.
- Three workflow nodes and one associative arrow are removed; no new nodes or arrows are added. Removed-node rationales
  are retained in the ledger.
- Source and inference are separated without treating curated excerpts, stale cache completeness labels or generated
  pages as independent evidence.
