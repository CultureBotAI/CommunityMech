adversarial_checks:
- Complete graph diffs compared against four cached primary main bodies at recorded access scope. Nine
  nodes retained, one out-of-system node and two arrows removed. No added nodes or arrows; every original
  node/arrow has a disposition.
- EcoFAB nitrogen-status evidence concerns a separate sterile-plant experiment and 14 individual bacterial
  bioassays, not SynCom17 co-inoculation. Remove that node; three ring-trial treatment-to-measured-outcome
  arrows remain bounded to whole-treatment effects.
- OAS925 isolate phenotypes and surveyed genomic modules do not establish a selective mechanism for community
  dominance. Intrinsic source-only PAIRWISE node retains a HYPOTHESIZED arrow. Relative 16S dominance
  is not absolute suppression or competition, and OAS925 was sixth in the separate biofilm assay.
- 'Remove dominance-to-metabolome mediation: common treatment and net spent-medium abundance do not isolate
  root/microbial production, uptake or extracellular enzyme activity. Remove categorical cross-feeding,
  competition, colonization facilitation and unsupported symbiotic-process annotations. Canonical participants
  identify the inoculum, not universal flux or equal final abundance.'
- HMO cross-feeding is experimentally supported for laboratory K12 and an infant B. bifidum isolate under
  nutrient limitation. Delta-cysE and viable-partner controls support dependence, not isotope-resolved
  cysteine export, a release route or a quantified positive-feedback time course.
- Chromatography supports fucose/galactose consumption; spent-medium growth required pH readjustment from
  4.3 to 6.3. Return-to-cysteine maintenance remains PARTIAL. No control of E. coli abundance in infants
  is claimed. Remove the sugar-to-mutualism part/whole summary arrow while retaining both reciprocal links.
- GL10 and XL12 retain overlapping substrate capacities. The single existing NICHE_PARTITIONING node means
  engineered specialization, not exclusive sugar use, measured interstrain exchange or universal benefit.
  Preserve zero arrows and the earlier cross-feeding discussion. Abstract 53.21% xylose and Results 1.22
  g/L at 36 h are not silently reconciled.
- All three records were already in the 183-user participant registry. Registry and numeric bounds remain
  unchanged. Intrinsic OAS925 representation changes mixed-scope 122 to 123, community-only 265 to 264,
  and sole broad credit 1222 to 1221; this is not a new taxon.
- Three guarded writes, append-only history artifacts and llm-assisted events; old history/discussions
  semantically preserved, all non-graph raw blocks, 457 other records and 920 caches byte-preserved. Eight
  regression tests cover scope, reciprocal direction, partial feedback, source quantitative conflict,
  participants, anchors and full disposition accounting.
- Zero structural errors and all 33 prior warnings preserved exactly. Repeat renders deterministic with
  exact descriptions checked across 456 pages. Reference-validator 0.1.7 exits 0 with zero checks; explicitly
  a no-op, not evidence validation. Textual snippet MATCH is not scientific support.
- 'Deduplication includes 748 all-state titles/bodies and ignored/hidden-inclusive local files, not every
  issue comment. Existing #1264, #826, #827, #830, #365 and #442 distinguished and their repairs preserved.
  #1427-1429 remain open. No provider job, new causal structure, visual-source inspection, supplementary
  or raw-data review claimed.'
