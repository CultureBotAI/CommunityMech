limitations:
- Nine existing nodes retained; one out-of-system node and two unsupported mediation/summary arrows removed.
  No new connectivity or provider request.
- Four cached primary main bodies reviewed at the stated access scope, not visual figures, separate supplements
  or raw data. All source caches unchanged.
- 'Canonical taxonomy and non-graph raw blocks preserved, not certified; #1427-1429 remain open.'
- OAS925 dominance mechanism remains hypothesized; bulk medium is not direct cross-feeding. Separate sterile-plant
  nitrogen evidence is excluded from this community graph.
- HMO reciprocal exchange is supported in the tested in vitro pair. Its sugar-to-cysteine maintenance
  link is PARTIAL; cysteine release route, feedback gain and host regulation remain unresolved.
- GL10/XL12 specialization is overlapping, not exclusive. Zero arrows preserved; source quantitative disagreement
  is not silently reconciled.
- Self-adversarial review is not independent approval, protected main merge or full-corpus completion;
  textual snippet matching is not scientific validation.
