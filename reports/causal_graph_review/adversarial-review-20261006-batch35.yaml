limitations:
- Ten existing nodes retained; four arrows removed and three qualified. No new connectivity or provider
  request.
- Cached primary main-body text and stated captions reviewed, not visual figures, raw data or separate
  supplements. Source caches unchanged.
- 'Canonical taxonomy and non-graph raw blocks preserved, not certified. Partial participant lists deliberately
  expose unsupported connectivity; #1420-1422 remain open.'
- Floodplain L RNA snapshot is not all-three-site flux. Higher-level participant groups are not all-member
  pathway assignments; Nitrospira rank mismatch is not propagated.
- Hillslope compartment preferred terms remain distinct despite a shared broad ID; causal drivers and
  CPR dependency are untested hypotheses.
- Self-adversarial review is not independent approval, protected main merge or full-corpus completion;
  textual snippet matching is not scientific validation.
