adversarial_checks:
- Actual complete graph diffs compared with cached primary main bodies at the recorded access scope. Ten
  nodes retained, four arrows removed and three qualified; no new nodes or arrows. Every original arrow
  has a disposition and all renamed targets/anchors resolve.
- Dental coaggregation is measured physical association in separate planktonic assays, not directional
  colonization benefit or demonstrated pH mediation. Five-member glucose response is collective extracellular
  acidification, not niche partitioning, species-specific flux or enamel damage. Growth feed and challenge
  are distinct.
- Floodplain core is operationally 42 genomes detected in at least 89/94 samples, not every abundant lineage.
  Capacity enrichment is a part/whole description and does not predict one-time transcription. Both original
  arrows removed.
- Primary Methods restrict 2016 RNA to floodplain L despite broader abstract wording; retained abstract
  evidence is PARTIAL with the conflict explained. Transcript counts are not carbon perturbation or flux.
  Betaproteobacteria participant is only a higher-level CBB grouping and does not imply that every low-carbon
  function or whole-group expression is enriched.
- 'Core participants exclude non-core Acidobacteriota and do not propagate the Nitrospirae-to-Nitrospira
  rank mismatch. Two newly exposed DISCONNECTED warnings are explicit debt under #1418/#1421, not hidden
  or patched with invented interactions. Canonical taxonomy and GTDB withholding unchanged.'
- Hillslope functional data are DNA-based potential, not RNA activity or measured cycling. Three environmental-driver
  arrows remain HYPOTHESIZED with plausible source-proposed mechanisms, not categorical niche partitioning.
  Shared-ID compartments retain exact preferred terms.
- Non-CPR candidate-phylum depth enrichment is separated from CPR distributions, including near-water-table
  and two deep hillslope exceptions. Host dependency remains a literature-based hypothesis; unsupported
  interspecies-process annotation removed. No measured cross-feeding or syntrophy claimed.
- SrdA enrichment concerns selenate-reduction potential; missing selenium chemistry at deep high-srdA
  sites limits inference. No selenium-removal rate, selenite-reducing organism, growth benefit or water-quality
  improvement claimed.
- Three guarded writes, append-only histories and llm-assisted events; non-graph raw blocks, 457 other
  records and all 920 caches byte-identical. Eight new regressions cover scientific limits, participant
  identity, exact anchors, hashes and full arrow accounting.
- All 31 prior network warnings preserved exactly; two source-scope warnings added, zero structural errors.
  Participant registry adds only these three records, 180 to 183; broad census, taxonomy, algorithms and
  numeric bounds unchanged.
- Repeated renders deterministic and exact descriptions verified across 456 pages. Reference-validator
  0.1.7 returned zero checks despite exit 0; no-op and textual snippet MATCH are not scientific validation.
  No visual figures, raw data, browser screenshots or external supplement review claimed.
- 'Deduplication included 742 all-state titles/bodies and ignored/hidden-inclusive local files, not every
  issue comment. #1420-1422 remain open. Existing #401 GTDB policy was distinguished from source-rank
  mismatch. No provider job or charge.'
