adversarial_checks:
- challenge: Does the newly explicit participant list silently alter corpus connectivity or weaken its tests?
  resolution: The first cumulative run caught a missing exact-set registry entry (212 passed, one failed). The fix
    adds only this intentional user. Full network findings are unchanged, affected-record connectivity contributions
    are compared with the base, and the unchanged connectivity-credit bounds are rerun with the full regression
    set. The initial failure is retained in the validation report.
- challenge: Is Ecoli neutral, or does the study support reciprocal benefit?
  resolution: Primary bacterial viable counts support partial mutualism with enhanced algal productivity. Total
    bacterial dry biomass is not uniformly enhanced, and low-substrate effects differ. The record does not assert
    identical benefits across endpoints or doses.
- challenge: Does bulk substrate disappearance establish a directed algal-to-bacterial transfer?
  resolution: No. The consumption node is community-level and untyped, with canonical participants retained and
    no donor-recipient direction. Its existing product arrow is hypothetical rather than traced carbon flux.
- challenge: Does all increased starch follow from bacterial stimulation?
  resolution: No. Separate glucose controls reveal antibiotic suppression of starch in axenic algae. The graph records
    this confound without discarding supported biomass/lipid benefits or extrapolating the antibiotic factorial
    to untested substrates.
- challenge: Are product assays exclusively algal or reciprocal-fitness outcomes?
  resolution: No. They assay combined biomass; small bacterial lipid/glycogen contributions and productivity versus
    content are distinguished. The product node is not typed as mutualism.
- challenge: Could dropping the photosynthesis node wrongly imply that the alga cannot photosynthesize?
  resolution: No. Removal rejects an unsupported exact-system carbon-transfer claim, not the organism's general
    capability. The lipid/harvesting snippet did not establish bacterial substrate supply; the gap retains the unresolved
    mechanism.
- challenge: Is the Rhizobium harvesting endpoint over 90 percent, or a demonstrated energy-saving intervention?
  resolution: Neither follows from the accessible source. The graph uses the primary abstract range, retains the
    axenic baseline and leaves comparative costs and full assay methods unresolved. The contradictory top-level
    summary is explicitly tracked in issue 1301, not silently certified.
- challenge: Does F2 identity establish polysaccharide chemistry, bridging, biofilm formation or mutualism?
  resolution: No. Only source-reported bioflocculant association and a partial harvesting link remain. Specific
    chemical and fitness assertions were removed; the source-reported F2 name is retained without re-grounding taxonomy.
- challenge: Does the review certify UTEX 2341 taxonomy or all unchanged metadata?
  resolution: No. Existing canonical IDs are reused under the graph skill, with legacy identity uncertainty and
    a dedicated verification issue. All unrelated raw top-level blocks are preservation-checked, not scientifically
    approved.
- challenge: Do cache matches or passing structural checks prove causality or permission?
  resolution: No. Primary assay review supports the decisions. Ecoli's existing open-access body is unchanged and
    its explicit Attribution permission is recorded without guessing a version. Rhizobium receives only a short
    quantitative excerpt, not paywalled body text.
- challenge: Is this an independent review, a full-figure review, or corpus completion?
  resolution: No. This is self-adversarial source review. Ecoli main text and all six tables were read, not figure
    images or supplements; Rhizobium access is abstract/Significance only. Remaining records and metadata followups
    are not certified.
