              in Panzhihua tailings based on similar environmental conditions (circumneutral pH 6.5-7.5, moderate
              temperature, high vanadium concentrations). Polaromonas performs dissimilatory V(V) reduction to V(IV)
              using c-type cytochromes (cymA, omcA) and membrane-associated nitrate reductases (narG). The organism
