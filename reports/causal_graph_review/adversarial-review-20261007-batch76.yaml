adversarial_checks:
- All four whole records and every original node/arrow reviewed after fresh both-root baseline. Three complete main
  bodies plus tables/captions; two abstract-bounded sources and only partial indexed diel Methods. Access errors
  and subscription barriers respected, not bypassed. No claim that unseen controls are absent.
- Retain measured Mushroom Spring RNA patterns. The metabolic endpoint remains putative carbon fixation so the polymer-reserve
  arrow does not spuriously become a cause of gene expression. This intermediate self-review finding was corrected,
  and complete verification rerun with superseded outputs preserved. Polymer flux is the explicit source model,
  not a measured flux assay.
- Thermodesulfovibrio nitrogen fixation is putative even with accessory nif genes; prior Synechococcus activity
  is not transferred to it. Remove source/target implication and preserve canonical participants. Partial genomes
  limit absence conclusions; mat layers overlap and distinct sampling campaigns are not a simultaneous intervention.
  Remove spatial restatement arrow without discarding measured community structure.
- Preserve real stable nitrifier microcolonies and mixed macroclusters. Release alone did not suffice; centrifugation
  plus calcium-rich resuspension and their unresolved separation are explicit. FISH-induced aggregation is a separate
  artefact, not a reason to deny later suspended clusters. Remove only the model-utility causal stage, not biological
  assembly.
- 'NDC6 is valid unchanged: measured aggregate low-temperature removal and functional complementation need no arbitrary
  arrow. Preserve1197/1198 no-mutualism and optimization-versus-three-day boundaries. Do not falsely recast reported
  gene-expression evidence as metagenomics or assert unmeasured per-member fitness.'
- Naica thermophily is inferred from high GC in specified lineages, not universal OP3 growth measurements. AamoA
  detection supports putative oxidation but not flux or concentrations. Correct assimilation GO0019676 to oxidation
  GO0019329, verified against AmiGO, without taxonomy changes.
- Negative dsrA amplification does not establish absence. Preserve proposed donor scarcity and non-dominance interpretation
  with sampling/primer limits, unpublished H2S context and no claimed donor-rescue assay. Neither environmental
  context nor co-occurrence with AamoA creates a causal link. Unsupported competition label and two context arrows
  removed.
- Three case-inexact graph quotations corrected and the truncated negative-PCR quote shortened; all18 graph quotes
  match both fresh source and cache. Original erroneous cache-suffix search is not evidence of absence.920 caches
  and all raw non-graph blocks remain untouched; residual metadata claims tracked separately in1635.
- Every11 nodes and6 original arrows accounted for;11nodes2arrows remain. Three guarded writes and histories;457
  records including NDC6 unchanged. Zero structural defects and44 baseline warnings unchanged. Connectivity census
  unchanged, not evidence of member-level effects.
- Actual schema, strict, terms, full-record references, snippets, histories, both-root inventory/network/rank, regression,
  lint and deterministic rendering checks retained. Exact descriptions parsed across456 generated pages, not browser
  screenshots. Postcommit docs-current is separate.
- No new topology or paid provider call. Earlier Edison authorization scopes are unchanged.916 issue bodies and27
  ignored/hidden local matches deduplicated;1197/1198/939/396 preserved. No exhaustive PR-comment audit.1632-1634
  stay OPEN until protected-main merge;1635 stays OPEN afterward. Self-review is not independent approval or corpus
  completion.
