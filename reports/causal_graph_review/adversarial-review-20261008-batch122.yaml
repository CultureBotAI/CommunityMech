adversarial_checks:
- All nine nodes and both process directions retained,one rename,no new topology. No empty downstream lists,dangling
  targets or anchors. All four canonical diffs read after mutation; prior history entries and unrelated fields preserved.
- TB retains positive70.97%pot efficacy,growth and grain-related outcomes without bilateral competition or unique
  immune mediation. Challenge fungus is not a TB member. No single-member plant arms demonstrate individual necessity.
  Simulated network attacks are not biological removal; genus assignments do not prove functions. Soil metabolites
  are not root-exudate collections; no compound-intervention evidence transferred from the different six-member
  study.
- DT retains43.3%barley disease fluorescence reduction and no significant differences between inoculants. Specific
  JA/ET/SA dependence is not assigned. PEG-tolerant isolates are not whole-plant drought validation. Pre-challenge
  measured RNA changes retain the prior selective/not-broad evidence; contig similarity does not identify inoculant
  strain transcription.99%OTU matches do not establish unique viable strains.
- Straw retains crude enzyme production,enzyme transfer and subsequent substrate digestion,both arrows and39.85/36.99/19.21%polymer
  degradation.801.16mL/gTS is positive total biogas,not methane-only yield. Removing the methane annotation does
  not claim methane absence. Four enzyme producers are not assumed to be the downstream methanogenic community;
  no reciprocal fitness inferred.
- SASW retains combined BCC water and profile outcomes. EPS mediation remains HYPOTHESIZED with PARTIAL support;
  separate positive water evidence stays SUPPORT. BCC-versus-NC cannot isolate SynCom from coating. Relative profiles
  and ASV matching do not prove unique viable strains or priority effects; PICRUSt2 and correlations do not establish
  BCAA transfer or keystone necessity. Prior assembly/PICRUSt-node removals and uninspected-S1/S2 discussion preserved.
- All17graph and6discussion quotes match fresh sources and unchanged caches. Three open main bodies read; straw
  abstract-bounded. Original figure pixels,external supplements,raw data and code not audited. No new cache content
  or protocol optimization. Source timing/figure and yield inconsistencies remain separate1951/1952.
- Fifteen focused tests and12actual control/mutation/restored-control probes pass. Mutations reject restored competition/mutualism,erased
  TB efficacy,simulation-to-biological promotion,DT superiority and erased nulls,dropped straw arrow/degradation,methane
  annotation,erased coating confounding,EPS promotion and profile-to-colonization promotion. Canonical files unchanged
  by probes.
- Four records pass schema,strict,terms,full-record references,snippets,rank and history.1161selected tests pass,not
  full Linux CI certification.57unchanged network warnings and zero structural defects. Exact descriptions on456pages,1359nodes,522arrows
  and deterministic rendering verified,not screenshot QA.
- All456otherrecords,923caches and prior history/decision files unchanged. Participant lists and scopes unchanged:299list
  users,414community-level,136mixed,278community-only,1568taxa,1281solely credited. Scope credit is not actual-participant
  certification. No connectivity logic,threshold or schema changes.
- Repairs1947-1950 addressed pending protected-main merge;1951/1952 remain non-graph follow-ups. Self-review is
  not independent approval. No Edison invocation or spend; Ruegeria1883 authentication blocker not retried unchanged.
  Root1836 and actual protected exact-head checks remain required.
