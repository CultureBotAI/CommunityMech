        before: null
        after: COMPETITION
    - mutation: Erase TB positive efficacy
      test: test_tb_retains_positive_disease_control_without_competition
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 23
      assertion: assert "70.97%" in node["evidence"][1]["snippet"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/0/evidence/1/snippet
        before: with a biocontrol efficacy of 70.97%
        after: No efficacy occurred.
    - mutation: Promote simulation to biological removal
      test: test_tb_network_robustness_is_simulated_not_biological_removal
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 32
      assertion: assert "not biological removal experiments" in node["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/1/description
        before: TB treatment changed rhizosphere DNA-based community profiles, including relative enrichment of
          Mortierella and reduced pathogen-associated fungi. Relative sequence abundance does not establish absolute
          viable abundance or strain-resolved persistence of T19/PM16. Genus annotations and correlation networks
          do not establish beneficial function, nutrient exchange or microbial necessity. Network robustness was
          assessed by simulated node removal, not biological removal experiments. Remodeling is not isolated as
          the cause of the positive disease-control outcome.
        after: Biological removal proved robustness.
    - mutation: Assert DT superiority
      test: test_dt_protection_is_not_inoculant_superiority_or_drought_validation
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 50
      assertion: assert "pairwise differences were not significant" in node["description"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/0/description
        before: The wheat-origin, 16-member DT-SynCom reduced barley leaf powdery-mildew DAF fluorescence by 43.3%
          relative to mock treatment after Blumeria graminis f. sp. hordei challenge. All three inoculants protected
          plants; their pairwise differences were not significant. This supports ISR-like protection but does not
          assign necessity to JA, ethylene or SA signaling. PEG-tolerant isolate selection is not a test of whole-plant
          drought protection.
        after: 43.3% reduction establishes superior drought protection.
    - mutation: Erase DT broad-profile null
      test: test_dt_rna_changes_precede_challenge_and_keep_broad_null
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 61
      assertion: assert "not broad community changes" in node["evidence"][1]["snippet"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/1/evidence/1/snippet
        before: 'Overall, bioinoculants induced selective, function-specific shifts in rhizosphere microbial gene
          expression, not broad community changes.

          '
        after: Broad community changes were significant.
    - mutation: Restore straw mutualism
      test: test_straw_process_outputs_are_not_reciprocal_mutualism
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 77
