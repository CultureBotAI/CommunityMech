  nulls. No significant inoculant pairwise differences or assigned JA/ET/SA pathway dependence. Similarity-based
  annotations do not identify inoculant transcripts;99%OTU matching does not establish unique viable strains. Prior1070and
  dated BioProject discussion preserved; access status not rechecked.
- Straw retains both process directions and39.85/36.99/19.21%polymer degradation and801.16mL/gTS total biogas. Crude
  enzymes rather than living producers mediate pretreatment; no reciprocal-fitness evidence or four-isolate methanogenesis
  inferred. Removed methane annotation does not assert that methane was absent.
- SASW retains positive combined BCC outcomes with coating matrix distinct from SynCom-only effects. EPS mediation
  remains HYPOTHESIZED/PARTIAL; relative16S profiles,100%ASV matching,PICRUSt2 and Mantel/RDA do not establish viable-strain
