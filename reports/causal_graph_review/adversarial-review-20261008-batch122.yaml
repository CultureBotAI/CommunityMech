        before:
        - target: Lignocellulose Enzyme Pretreatment
          description: Fermentation supplies the crude enzyme solution applied to wheat straw, enabling the measured
            polymer-degradation pretreatment. This is an enzyme-mediated material-transfer step, not proof that
            the living four-member inoculum colonizes every subsequent process stage.
        after: []
    - mutation: Erase positive polymer degradation
      test: test_straw_preserves_positive_polymer_degradation_values
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 95
      assertion: assert all(v in node["description"] for v in ["39.85%", "36.99%", "19.21%"])
      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/1/description
