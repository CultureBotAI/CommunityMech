      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/0/interaction_type
        before: null
        after: MUTUALISM
    - mutation: Erase enzyme-transfer arrow
      test: test_straw_retains_both_material_transfer_directions
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 85
      assertion: assert len(a["downstream"]) == len(b["downstream"]) == 1
      restored_control: PASS
