adversarial_checks:
- Whole original targets and complete graph/discussion diffs reviewed. All 11 original nodes and three directions
  have dispositions. Ten nodes and all three directions remain; one assembly-only node is removed and three outcome
  nodes are renamed. No new topology or Edison job/spend.
- 'Challenge overcorrection: retain acetate-supported feeding and butanol production, sucrose feeding, conditional
  lichen mutualism, measured peroxide relief, catalase rescue, whole-culture fatty-acid increase, periphyton attachment,
  mature establishment and stress responses. Positive outcomes do not establish exclusive carbon attribution, obligate
  dependence or isolated mediation.'
- 'Butanol: lower extracellular acetate supports consumption, not isotope-resolved flux or sole-source attribution;
  the source explicitly permits other exudates. Production is not duplicate exchange. Fluctuating plateaued production
  in the 42-day replenished culture is not constant high productivity; earlier growth adaptation did not increase
  production above prior levels. The existing acetate-to-product arrow stays HYPOTHESIZED/PARTIAL and the existing
  carbon-specificity discussion is preserved verbatim.'
- 'Lichen: sucrose supports R. glutinis but not all tested yeast pairings. Peroxide measurements, catalase rescue
  and density controls support genuine context-dependent ROS protection, not universal partner dependence. Growth
  benefit beyond catalase is unresolved. Total fatty acids 54 percent higher in batch is whole-culture, not yeast-specific.
  Semi-continuous total includes removed culture, not only final biomass. ROS-to-lipid mediation remains hypothetical;
  no additional factor is invented.'
- 'Periphyton: preserve the source-attributed Sphingomonas EPS attachment role, qualified for the lack of an isolated
  effect-size or persistence measurement in the reviewed main text. Remove growth-balanced grouping as a niche-partitioning
  interaction. Early and AB outcomes name only the canonical diatom descriptor, not all phototrophs. Keep attachment/development
  without intergroup facilitation claims. No workflow arrows are added.'
- 'Periphyton maturity and stress: 26 introduced phototrophs are not a verified final 26-member roster; at least
  22 were detected and three introduced species were no longer detected. Aggregate taxonomy and nonaxenic source
  cultures remain a separate metadata follow-up. Preserve the explicit day-18 high-herbicide PSII exception. Functional
  redundancy requires further study; stable aggregate PSII does not demonstrate it. Discussion anchors match all
  retained names.'
- Three fresh primary XML extracted main texts were read completely, including abstracts, Methods, embedded captions
  and tables; displayed equation structure is omitted by extraction. No separate supplements, original image pixels
  or raw data were certified. Crossref exact DOIs were checked. All 27 graph and three discussion quotations match
  fresh primary text and unchanged caches under documented normalization. Two discussions are new and one preserved;
  literal matching is separate from entailment. Cache headers and quote matching are not a whole-cache review.
- Three guarded records and three append-only histories preserve prior history/decisions, 457 other records, 923
  caches and raw non-graph blocks. Butanol adds one community-level/mixed record and two taxa to the census denominator,
  with zero new solely-credited taxa. Two early periphyton nodes narrow to diatoms. Measured census tests were updated;
  connectivity and share rules are unchanged.
- Four isolated in-memory control/mutation/restored-control probes reject inflated acetate certainty, proven ROS-to-lipid
  mediation, all-phototroph early attachment and proven functional redundancy. An initial attachment probe duplicated
  a diatom; that local artifact is retained separately and the corrected probe actually includes diatoms, green
  algae and cyanobacteria. Canonical hashes are unchanged; probes do not inflate the pytest count.
- Nine focused tests and 1003 combined regressions pass. Three full-record schema/strict/term/reference/local-snippet
  validations and three history validations pass. All 56 baseline network warnings remain identical, with zero structural
  defects. Deterministic rendering and exact HTML-description parsing cover 456 pages, 1366 nodes and 536 arrows;
  not screenshot QA. The informational full-corpus snippet audit includes unrelated preexisting discrepancies, including
  ligature issue 1863; it is not clean-corpus certification.
- Repairs 1865-1867 await protected-main merge. Non-graph culture issue 1868 and membership issue 1869 remain open.
  No shared validator/cache changes; DOI-case 1091, bracket 622, ligature 1863, loader 1703 and cache-policy 949/1093
  are not certified. macOS reference success is not Linux certification. Denied/unanswered Edison scopes are untouched.
  Self-review is not independent approval; no artificial CI, protection bypass or premature branch deletion.
- Corpus status is 355 reviewed, 52 pending and 53 needs_research across 460 records. The full goal remains incomplete.
  Exact-head publication and postcommit docs-current are separate gates, not preasserted here.
- Plain just-lint passed;explicit-runtime no-incremental mypy additionally checked.
