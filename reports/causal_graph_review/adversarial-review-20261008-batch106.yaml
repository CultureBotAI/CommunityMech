adversarial_checks:
- 'Whole original targets and all changed graph/discussion diffs reviewed. All19 original nodes and10 directions
  have dispositions: retain18nodes and5qualified existing directions, remove1analysis-workflow node and5cross-study/wrong-route/restatement
  arrows, rename8nodes. No new topology or provider spend.'
- 'Challenge removal versus lost evidence: retain the six separate Staphylococcus-Candida observations, mire encoded
  potential/expression/metabolite findings, exact four-member pesticide outcomes and aquifer relative-abundance/genomic-potential
  findings. Retain qualified source hypotheses rather than deleting all topology or rejecting positive results.'
- 'Staphylococcus-Candida: species composition is not one fixed experimental system. Remove cross-study mechanism/requirement
  arrows; aggregate biomass and one-way inhibition do not demonstrate reciprocal competition. Preserve copper authors
  mutualism as HYPOTHESIZED/PARTIAL and direct scaffold facilitation. RNA/ontology associations do not establish
  virulence, altered genotype or colonization. No new pathogen enhancement procedures, genetic designs, strain-selection
  advice or partner mechanisms.'
- 'Mire: source distinguishes acetate-to-acetoclastic routing from methylotrophic methanogenesis. Remove the wrong-route
  arrow without importing another mechanism. Product-removal feedback and traced exchange are not established by
  omics co-occurrence. Retain source-proposed fen niche partitioning and its existing direction HYPOTHESIZED/PARTIAL,
  not reduced competition or direct uptake. Preserve genomic/transcript/metabolite support and canonical identity-only
  scope; the gradient remains an observation, not its own causal driver.'
- 'Pesticide: non-antagonism and greater mixed biomass do not establish reciprocal benefit. Preserve exact A2-A5-A11-M7
  observations without transferring six-member immobilized-culture results. Gene detection supports potential, not
  expression/flux; removal is not mineralization. Keep both existing directions HYPOTHESIZED/PARTIAL because the
  accessible abstract does not isolate gene activity or parent depletion as mediators. Positive phytotoxicity endpoints
  remain.'
- 'Aquifer: remove the genome-resolution workflow node and preserve prior analysis-edge repair. Field perturbation
  is the upstream abiotic input, not aggregate restructuring as a demonstrated mediator. Relative abundance is not
  absolute loss or fitness. CODH analysis supports inferred potential, not a physiological switch; carbon/electron
  flow is a source implication, not measured flux. Keep both existing directions qualified and do not invent methods.'
- 'Twenty-nine graph and seven discussion quotations match fresh primary text and unchanged caches. Eleven independent
  primary retrievals: nine whole abstracts plus bounded mire2023/pesticide2013 main-text coverage. Available Staphylococcus-Candida
  PMCID leads were not read; copper cache PMCID differs from fresh metadata. Failed aquifer/pesticide publisher
  requests were Internal Error, not verified HTTP403. No global full-text absence claim, bypass, cache import, supplement/figure-pixel
  or raw-data certification.'
- Four guarded writes and four append-only histories;456 other records/all923 caches and prior history/decision
  files byte-identical. Non-graph raw blocks unchanged. Identity-only mire scopes do not change the global census
  because the whole-community gradient observation remains. No census threshold, schema or runtime-rule changes.
  The pre-write guard rejected unsupported discussion provenance fields; provenance remains on interaction evidence
  without changing the shared schema.
- Eight focused tests and959 combined regressions pass. Four full-record schema/strict/term/reference/snippet checks
