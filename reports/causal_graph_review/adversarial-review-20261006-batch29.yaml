findings:
- issue: 1375
  severity: P2
  status: addressed_in_this_change
  finding: SynCom35 whole-community observations were assigned to a single pair; mutual benefit, nutrient
    exchange and control competition were unsupported.
  disposition: Keep four positive immune/colonization nodes, scope MF79 secretion and both existing arrows
    to the actual experiments, retain WRKY observation with partial snippet support, and remove three
    unsupported relationship nodes.
- issue: 1376
  severity: P2
  status: addressed_in_this_change
  finding: Deepwater oxygen-conservation duplicated the upstream outcome; laboratory pathway/floc hypotheses
    were represented as established field mechanisms.
  disposition: Consolidate the duplicate and restatement arrow, retain cold biodegradation and flocs,
    preserve experimental SIP evidence alongside genome predictions, and qualify two existing arrows with
    sample and laboratory/field limits.
- issue: 1377
  severity: P2
  status: addressed_in_this_change
  finding: Enamel assay-context arrows and relationship signs implied facilitation, cross-feeding and
    competition without corresponding measurements.
  disposition: Remove two workflow arrows and unsupported signs, keep all three positive observations,
    distinguish inoculated roster from persistence, and constrain viable-count and mineral endpoints.
- issue: 1378
  severity: P2
  status: open_nongraph_followup
  finding: SynCom35 non-graph strain/control identities, roles and assay-specific cultivation conditions
    require further source curation.
  disposition: Separate scoped follow-up. These blocks are byte-preserved, not certified by graph curation.
- issue: 1379
  severity: P2
  status: open_nongraph_followup
  finding: Deepwater non-graph Methylophaga/methane, oxygen and enrichment-context wording exceeds source
    support.
  disposition: Separate scoped follow-up. These blocks are byte-preserved, not certified by graph curation.
- issue: 1380
  severity: P2
  status: open_nongraph_followup
  finding: Enamel non-graph basal treatment arms and cultivation/strain details are incomplete; one source
    count comparison is internally inconsistent.
  disposition: Separate scoped follow-up. These blocks are byte-preserved, not certified by graph curation.
adversarial_checks:
- Every original node and arrow has a retain, repair or removal decision. Four unsupported/duplicate nodes
  and three duplicate/workflow arrows are removed; four arrows remain, two explicitly hypothetical. Exact
  renames and discussion anchors resolve.
- SynCom35 whole-community suppression is not attributed exclusively to MF79. The MF79 T2SS result is
  strain-specific; suppressor-community precolonization and MF79 retentate experiments are distinguished.
  No reciprocal fitness, resolved effector or universal colonization requirement is asserted.
- The WRKY observation was verified in the primary main body. Its cached abstract snippet is explicitly
  partial and does not independently validate that detail. Proposed regulatory roles are not converted
  into downstream causal edges.
- Removing unsupported E. coli competition and nutrient-exchange claims does not establish biological
  impossibility. The full strain/control roster remains a follow-up; canonical taxon blocks are untouched.
- Deepwater cold biodegradation remains a positive result. The potential oxygen outcome is retained without
  a separate conservation mechanism or syntrophy. Floc observations and the isolated-strain degradation
  assay are not treated as a selective aggregation perturbation.
- Deep-water HEX and surface-water PAH enrichments are not one five-member consortium. Room-temperature,
  dispersant-free SIP conditions and incomplete-genome/unknown-enzyme alternatives remain explicit. Positive
  assimilation evidence is not discarded or conflated with intertaxon flux.
- Enamel inoculation is not universal persistence, calcium does not alter every count, and material outcomes
  are not microbial competition. The disputed L. casei 1-versus-2 mM result is not silently resolved;
  proposed pH and EPS mechanisms are not asserted as demonstrated.
- Exactly three guarded edits, three llm-assisted events and three append-only histories. All non-graph
  raw blocks, 457 other records and all 920 reference caches remain byte-identical.
- Participant registry changes only 170 to 173 users. Connectivity surveys are measured and numeric bounds/algorithms
  unchanged. Six newly exposed DISCONNECTED warnings are explicitly retained, not hidden with invented
  relationships.
- 'Deduplication covered 706 all-state issue titles/bodies and ignored/hidden-inclusive scoped local searches,
  with #401 and #754 read; not every issue comment or the entire filesystem.'
- All 456 pages have exact node/arrow descriptions verified by parser and deterministic repeat rendering.
  No browser screenshot QA is claimed. Primary enamel Tables 1-2 and Dombrowski Figure 3 were inspected
  visually; other figures and supplements were not.
