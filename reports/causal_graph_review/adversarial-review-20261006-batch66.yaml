adversarial_checks:
- Read all three whole records and every original node. Nine nodes and zero original arrows retained,
  with one MUCC rename and intact discussion anchors. Earlier MUCC workflow and magnetite backward-edge
  deletions preserved. All three primary main texts and captions read; no original figure-pixel, separate-supplement,
  raw-data or executable-model audit. Extracted table artifacts contain no main-table cells.
- 'MUCC: eight core genera concern five marsh/swamp sites, not occupancy in every sample or all nine wetland
  sites. JLA is a swamp despite marsh shorthand. Canonical whole-community and Archaea/Bacteria guild
  entries are contextual placeholders, not a resolved eight-genus roster.'
- 'MUCC: 12 samples/site, positive Spearman genus associations, environmental covariates and genus-matched
  MAG potential do not demonstrate exchange, niche partitioning or syntrophy. Whole-community network
  structure did not have the methanogen-network association. Preserve observations, not a causal network
  from analytic workflow.'
- 'MUCC: Methanoregula relative dominance and transcription are not selectively tested drivers or methane
  flux. Methods describe 2018 expression and 2015 modeled production; temporal alignment and source counts
  need reconciliation. Candidate methylated-sulfide/methoxylated-substrate machinery is not demonstrated
  methanol use; graph methanol grounding removed while genomic potential remains.'
- 'MWF001: retain experimentally supported cross-feeding interpretation and explicit four source strains.
  Spent-medium growth plus carbon-source nonusers support the interpretation, but stationary OD does not
  chemically establish complete resource depletion. The residual-resource exclusion applies to simulated
  spent medium. Generic CRM species/resources and unequal affinities are not exact-strain pathways or
  measured exchanged compounds.'
- 'MWF001: finite eight-cycle persistence in 31 carbon-supplied conditions is not universal stability.
  Preserve the additional 5X-malate Ct loss, no-carbon Ml loss, citrate/inosine dilution exceptions and
  separate four-day chemostats. Pair effects are condition dependent, not universal reciprocity. Existing
  exact-byproduct gap and #1127/#1128 corrections preserved.'
- 'MWF001: the candidate PARTIAL cross-feeding-to-coexistence arrow is scientifically plausible and remains
  explicitly unfinished under #1575. Free one-target Edison dry run passed; no paid run/report was completed
  and no new structure added. needs_research prevents falsely declaring this sparse graph complete.'
- 'Magnetite: the 19% effect is relative to SULF_0.6, not full CTRL recovery or rescue at 1.2 g/L. Separate
  abiotic sulfide removal, unresolved sulfur species and no detected abiotic H2 do not selectively establish
  the biotic mediator or DIET. Keep the supported bulk outcome without an unsupported syntrophy type.'
- 'Magnetite: only one biological replicate per condition was sequenced. Relative abundance cannot establish
  replicated absolute growth. Four representative GEMs are not every MAG in four broad guilds; putative
  SRB status and #913 caveats remain. Gap filling, expected-role curation, reactor-output constraints,
  trade-off0.7 and nonunique solution sampling mean feasibility, not independent validation.'
- 'Magnetite: keep computational CROSS_FEEDING on acetate and amino-acid/organic-acid model nodes, explicitly
  HYPOTHESIZED. Mean sampled fluxes are not measured extracellular exchange or necessary mutualism. Existing
  direct-DIET gap, #914 arrow removal and #915 MAGN_0.6 medium restriction remain intact.'
- Review full biological diff and eight focused tests. Canonical taxonomy, pre-existing discussions and
  append-only curation events preserved semantically.457 other records,920 caches and all raw non-graph
  blocks unchanged. Coarse participant census unchanged; this does not verify identity or exact partner
  flux.46 baseline network findings retained exactly; no structural errors or audit-rule changes.
- Actual schema, strict, term, reference, snippet, history, network, deterministic render and regression
  outputs recorded. Exact descriptions parsed over456 pages, not browser screenshots. One primary match
  requires straight/curly apostrophe equivalence; no cache rewrite. Post-commit docs-current is a separate
  publication gate.
- 'Dedup865 all-state issue titles/bodies and24 scoped ignored/hidden local matches; five relevant full
  issue bodies and prior graph histories read, not every PR/comment/artifact. #1571-#1573 addressed but
  OPEN until protected-main merge; #1574 metadata and #1575 research stay OPEN. Exact-head COMMENT self-review
  is not independent approval; corpus work remains unfinished.'
