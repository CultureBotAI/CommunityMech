limitations:
- 'All9 original nodes retained;zero original arrows. No new causal structure. MWF001 candidate link remains
  #1575 and needs_research, not complete.'
- Three complete fresh primary main texts and captions read. Extracted main-table artifacts contain no
  table cells. Original figure pixels, separate supplements, raw data and executable models not audited;
  numerical summaries not independently recomputed.
- MUCC core occupancy and genus networks are observational; MAG annotations are potential. Cross-site
  flux prediction and transcription do not establish causal syntrophy. Methanol specificity removed from
  graph; temporal input alignment remains unresolved.
- MWF001 retains supported cross-feeding with exact-metabolite and residual-resource limits. Generic models
  do not resolve exact strains; finite persistence has no-carbon/high-malate exceptions. Candidate causal
  structure remains unfinished, not denied.
- Magnetite bulk methane response is partial moderate-sulfate improvement. Abiotic sulfide removal does
  not isolate biotic mediation or DIET. Single-replicate relative MAG abundance is not replicated absolute
  growth; role-curated output-constrained GEMs provide feasible, nonunique flux hypotheses.
- 'Canonical taxonomy and raw non-graph blocks preserved, not recertified. #1574 remains OPEN for metadata/source
  ambiguities. Prior #1127/#1128/#913/#914/#915 corrections and existing knowledge gaps preserved.'
- All920 caches unchanged;16 retained graph excerpts independently match fresh primary text after whitespace
  normalization and a straight/curly apostrophe equivalence in one MWF001 excerpt. This does not certify
  historical full-cache/non-graph provenance. Public OA XML used without access bypass; two sources are
  CC-BY-NC-ND, not all CC-BY.
- Deduplication covered865 all-state issue titles/bodies and24 scoped ignored/hidden local files;5 relevant
