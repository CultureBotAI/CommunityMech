adversarial_checks:
- 'All 10 original nodes and 4 arrows accounted for: 10 nodes and 3 arrows retained, one unsupported common-treatment
  arrow removed, six renames, no new topology. Targets and discussion anchors resolve. No direction invented.'
- Arsenic carbon transfer and reciprocal growth remain positive evidence, retaining CROSS_FEEDING and MUTUALISM.
  Genomic complementarity is not direct nitrogen/oxygen tracing. Oxygen-supplemented pure culture is not a demonstrated
  oxygen requirement. Exact strains and canonical identities unchanged.
- Biomethane 86% by day 69 remains observed; above 90% remains proposed. External cylinder gas is not microbial
  cross-feeding. qPCR/16S profiles are not viability or taxon-specific flux; positive plate recovery is separate.
  VFA pools and inferred routes do not establish thermodynamic syntrophy. Prewashout sampling quotation explicitly
  belongs to phase 1, not demonstrated phase 4 timing.
- Compost retains maturation, transient ARG rebound, later attenuation and reported pathogen elimination. Aggregate
  treatment benefit is not mutualism or bilateral competition. KEGG and potential host-gene network signals are
  not expression, motility or actual transfer events. 26.6% refers to potential associations. One environmental-mediation
  arrow stays PARTIAL; common-treatment maturation-to-HGT arrow removed.
- Tobacco retains isolate-specific positive resource responses, Y878 null enhancement, compatible antagonist isolates
  and positive combined field treatment. cheA PCR is not measured migration/colonization; cheA-negative isolates
  also antagonize. The resource library cites tomato exudates. Missing non-chemotactic controls are explicit future
  work. qPCR and Tax4Fun are not viability/activity. Results/Discussion counts and tomato-caption inconsistencies
  are not silently reconciled.
- Twenty-seven graph and six discussion quotes match fresh primary texts and all existing caches. Full main bodies,
  methods, results, discussion, table text and captions read for biomethane and tobacco; arsenic and compost review
  bounded to fresh primary abstracts. No original figure pixels, supplements, raw data or analysis-code audit. No
  cache edits or full-body imports. Tobacco license is CC BY-NC-ND 4.0, not unrestricted CC BY. Matching is not
  entailment certification.
- 'Four guarded writes and append-only histories preserve 456 other records, all 923 caches, unrelated raw blocks
  and previous histories/decisions. Canonical taxon identities/ranks unchanged. Metadata/composition/scope findings
  remain separate issues #1935-#1937. Shared evidence aliases detached before edits.'
- Fifteen focused tests and twelve control/mutation/restored-control probes pass. Mutations reject loss of positive
  carbon/field evidence, syntrophy overclaims, oxygen inference promotion, external-gas cross-feeding, compost mutualism,
  HGT proof promotion, loss of ARG rebound, restored common-treatment arrow, loss of Y878 null and unmeasured chemotaxis.
  No canonical writes during probes.
- The initial mutation harness removed a required dictionary key and stopped with KeyError before producing a report.
  It was changed to a wrong interaction-type value so the intended scientific assertion is exercised. All 12 cases
  then completed with restored controls; no test or canonical-record weakening.
- 'All four records pass schema, strict, terms, full-record references, snippets, rank and history. 1131 selected
  tests including palette pass; not full Linux CI certification. Network: 57 unchanged warnings, zero structural
  defects. Descriptions on 456 pages, 1361 nodes and 522 arrows exactly match descriptions with deterministic rendering,
  not screenshot QA.'
- 'All participant lists and scopes unchanged; 299 participant-list users. Census: 414 community-level, 136 mixed,
  278 community-only, 1568 taxa, 1281 solely credited unchanged. Scope credit is not actual participant coverage.
  Connectivity logic and thresholds unchanged.'
- 'Issues #1931-#1934 addressed pending protected-main merge; #1935-#1937 remain open. No Edison extension or credits.
  Prior Ruegeria #1883 still needs configured authentication and was not retried unchanged. Self-adversarial review
  is not independent approval; root #1836 and actual exact-head protected checks remain required.'
- 'Corpus: 388 reviewed, 18 pending, 54 needs_research across 460 records. Overall goal, protected merge and branch
  deletion incomplete. Postcommit docs-current and exact-head publication are separate gates, not preasserted here.'
