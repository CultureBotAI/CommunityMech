adversarial_checks:
- Account for all eight original nodes and four original arrows. Six exact renames and matching discussion anchors;
  no additions, removals or Edison spend.
- Challenge COMPETITION against the actual reciprocal-harm enum. GenX relative profiles and the wheat-straw bacterial-pair
  effect do not demonstrate harm to both partners.
- Preserve Community G chemical loss and fluoride release as positive community observations without assigning member
  functions, absolute viability or full carbon mineralization.
- 'GenX homology, docking and functional-guild interpretations are not catalytic validation. Keep the six canonical
  participants as a subset and preserve the existing full-roster gap and exact IDs from #946.'
- 'Do not restore the invalid GenX endpoint arrow removed by #947. Community G sterile-soil assays must not inherit
  GENIA indigenous-microbiome ecological-safety claims.'
- Keep native Thermobifida/Actinomadura separate from the five-member compost inoculant. Abstract-only access does
  not establish exact member identity, gene ownership or establishment.
- Metagenomic CAZyme families represent gene potential, not enzyme expression/activity. Retain both proposed causal
  arrows as HYPOTHESIZED rather than erase plausible mechanisms or assert selective mediation.
- Preserve positive compost degradation, humus and maturation outcomes without replacing treatment effects with
  a generic absence-of-evidence claim.
- Fungal transcript-based intrinsic capacity is source-only PAIRWISE with no target; bacterial roles are a canonical
  subset, and pair-response/output nodes identify all three tested members.
- Keep the historical w15 preferred label and canonical paramultivorum ID. No taxonomy or grounding changes are
  part of this patch.
- '2023 wheat-straw Methods supply riboflavin. All three members encode ribE and so4 late-60-rpm expression rises:
  no exclusive w15 donation, extracellular exchange or rescue asserted.'
- 2023 direct mass-loss and growth measurements support condition effects; they do not directly establish the enzyme,
  detoxification or partner-flux mediators. Both retained output arrows are PARTIAL.
- 2020 complete abstract supports lower consortium degradation and a bacterial-pair comparison, not w15-only causation
  or universal inhibition across conditions. Author PDF access failed after partial reading; full Methods/Results
  not claimed.
- Two complete primary main bodies, four complete additional abstracts and displayed primary tables/captions were
  reviewed. No visual images or supplementary files inspected; no copyrighted full body added to git.
- 'Six tracked cache artifacts and unrelated YAML blocks are byte-preserved. Unrelated metadata is not scientifically
  certified, and broader #746/#524 remain open.'
- Both-root census confirms unchanged connected taxa and mixed-scope counts. Exactly two bacterial taxa move from
  pairwise to community-only connectivity credit (1218 -> 1220); no bounds or registry changes.
- Source-based self-adversarial review is not independent approval, protected CI success or corpus completion.
