  a truncated meta file is not report inspection.
- Every22 graph quotations independently matches fresh primary text and existing cache. No cache changed or full
  publication uploaded. Literal matching is not entailment; full-record reference validators and source-based review
  remain distinct.
- Nitrifier positive aerobic removal after lag and anoxic ammonia accumulation are preserved. Introductory handoff
  background is not experimental pair flux; gene potential and amoC expression alone do not establish complete enzyme
  activity. Missing redox endpoints remain needs_research.
- OMM12 retains real but lower-than-conventional resistance. Expanded-community conventional-like resistance is
  not transferred to the12-member record. Repeat-dose improvement remains without all-strain detection guarantees
  or functional mediation; staged cohorts and qPCR units are explicit.
- ORNL trophic main text supersedes old access limitation. Bulk substrate and product measurements support both
  trophic arrows; species allocations and donor proportions remain model estimates. OptCom assumptions and modeled
  fourth-member extension are not measured three-species flux or membership.
- PD10 retains medium-dependent survivor selection and proposed R2A substrate support. Endpoint-conditioned FBA
  and pathway proteins do not independently validate assembly or exchange flux. Agar inhibition/promotion differs
  from liquid coexistence. Generic predicted metabolite classes do not justify purine-alkaloid or aromatase-inhibitor
  groundings. Missing MOPS exchange structure remains needs_research.
