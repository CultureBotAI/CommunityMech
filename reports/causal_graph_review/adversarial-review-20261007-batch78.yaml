adversarial_checks:
- Fresh both-root baseline preceded primary-source reading. All four whole records,13existing nodes and7arrows were
  inspected. One context arrow removed; six causal or explicitly hypothesized arrows retained. No topology invented
  to satisfy graph density.
- Nitrifier handoff background is not exact-system transfer measurement. Preserve late aerobic ammonia removal/nitrate
  accumulation and anoxic ammonia accumulation, with the early decrease/rebound sequence. Gene content and amoC
  alone do not demonstrate complete enzyme activity, exclusive donor-recipient flux or anoxic nitrification.
- Preserve the prior45.96% Nitrosospira starting-material abundance correction rather than replacing it with the
  different short-read week0 percentage. Aerobic guild decline and absent Nitrobacter nitrogen-gene RNA do not prove
  all nitrification absent; lower-abundance contributors remain possible. Canonical taxa preserved.
- OMM12 genuinely confers resistance but less than conventional microbiota. The conventional-like result is the
  expanded community, not the12-member record. Source abstract directly resolves this distinction; publisher subscription
  access was not bypassed.
- Retain the repeat-dose protocol-to-establishment arrow and improved YL27 detection. Staged facility cohorts are
  not a fully matched randomized experiment, every strain is not detected in every sample, and qPCR gene copies
  per extracted-DNA volume are not viable counts. Compositional similarity is not challenge-function mediation;
  remove that context arrow.
- The ORNL exact-system full text is now read, superseding stale access wording. Measured bulk substrate/product
  chemistry, qPCR and microscopy support the maintained trophic community and both donor-to-partner edges. Carbon/electron
  allocation, hydrogen/ethanol proportions and alternative transfer routes remain modeled or unresolved.
- Do not transfer the sulfate-free Desulfovibrio-methanogen syntrophy case or the separate fuel-cell system to this
  sulfate-supplied community. Cross-feeding does not prove reciprocal obligacy. Elevated-fumarate upset and succinate
  accumulation do not isolate selective succinate causation. OptCom biomass objectives and assumed hydrogen recipient
  are not new measured flux, and its fourth-member extension is not a community member.
- PD10 controlled medium comparison supports two selection-to-survivor arrows. Distinguish MOPS passage4 and R2A
  passage10 rather than treating the abstract five-cycle summary as exact for both. Maintain the ten-strain experimental
  inoculum and separate four-/three-member computational subsets.
- Retain both inhibition and positive pairwise R2A agar phenotypes. GM17-inhibited strains still persist in liquid;
  positive exchanges and culture-condition differences are alternatives rather than an isolated rescue. Preserve
  protein evidence for BC15 without claiming directly counted viable biomass or equal 16S/protein rankings.
- Retain the R2A exchange-support arrow as explicitly hypothesized. FBA is conditioned on endpoint proportions and
  proteins establish pathway capacity, not actual exchange flux or independent validation of temporal assembly.
  Include both other modeled partners, not exclusive AP49; remove two chemically incorrect descriptors while preserving
  generic classes in prose. The dry-run schema guard rejected ungrounded structured descriptors before any record
  writes.
- Fresh primary text and existing caches match all22 graph snippets. ChEBI fumarate(2-) was verified at the official
  entry. Separate supplements, original figure pixels, raw data and executable KBase models were not audited. Early
  oversized output truncation was not used as evidence of absence; primary main texts and structured tables were
  reread in bounded chunks.
- 'Four histories and all raw non-graph blocks,456 other records and920 caches are preserved. Graph-only scope does
  not certify metadata: OMM strain-name/table disagreements, ORNL medium detail and PD10 seed-culture/metal notes
  are tracked separately in1650. Prior416/1083/529/543 and the distinct1532/1533 record scope are respected.'
- Nitrifier endpoint and PD10 MOPS exchange omissions remain needs_research1648/1649. Two one-record Edison LITERATURE
  dry runs cost zero credits; no actual provider reports or submissions. Scoped questions are unanswered, preselection
  is not approval, and prior denied/pending scopes are unchanged.
- Full focused schema/strict/term/reference/snippet/history checks, both-root inventory/network/rank, regression/lint
  and deterministic rendering outputs are captured. Exact descriptions parsed across456 pages are not browser screenshots.
  Exact-head COMMENT self-review and postcommit docs-current are separate publication gates. Protected-main merge
  and branch cleanup are still required; self-review is not independent approval or corpus completion.
