limitations:
- All8 original nodes retained;3 original arrows reviewed,2 MSC2 biological hypotheses retained and1 MUC2
  common-treatment arrow removed. No new causal structure or Edison submission.
- Three complete fresh primary main bodies and main text tables read. Original figure pixels, separate
  supplements, raw data and executable models not audited; author-reported numerical summaries not independently
  recomputed.
- MSC1 persistence is not codependency; positive early total OD on soluble NAG does not establish late-phase
  or partner-resolved benefit. Pooled relative-abundance centrality is computational association, not
  causality. Rhizobiales is an order and the canonical roster is incomplete.
- MSC2 retains source-proposed sharing and resource-enablement mechanisms as hypotheses. Cell-pellet GC-MS
  is not extracellular transfer, temporal community DEGs are not matched induction, and mixed-bag FBA
  removes species boundaries. Distinct chitin concentrations, NAG preconditioning and ammonium supply
  matter.
- MUC2 group-qPCR calculated CFUs are not viable plating or fourteen-strain resolution. Net supernatant
  acid concentrations do not identify flux, producers or composition-mediated effects; pH was neither
  controlled nor measured and medium was replaced daily. CAZy species-genome percentages are not exact-strain
  enzyme measurements.
- Canonical taxonomy and raw non-graph blocks preserved, not recertified. Issue1569 remains OPEN for source/culture
  identity, roles, assay metadata and source reporting inconsistencies; prior corrections and existing497
  remain intact.
- All920 caches unchanged;12 retained graph excerpts independently match fresh primary text. This does
  not certify historical full-cache/non-graph provenance. Public OA XML was used without bypassing publisher
  access restrictions.
- Deduplication covered861 all-state issue titles/bodies and28 scoped ignored/hidden local files;8 matching
  full issue bodies read. Prior MSC1 workflow history and MUC2 curation history read, not every PR/comment/local
  match. Self-review is not independent approval; repair issues stay OPEN until protected-main merge.
