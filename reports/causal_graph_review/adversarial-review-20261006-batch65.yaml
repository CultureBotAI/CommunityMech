adversarial_checks:
- Read all three whole records and account for all8 original nodes and3 arrows. Three complete fresh primary
  main bodies and main text tables read; original figure pixels, separate supplements, raw data and executable
  models not audited. Numerical summaries remain author-reported, not independently recomputed.
- 'MSC1: retain compositional persistence with drift, not invariant membership or demonstrated codependency.
  Canonical nine-member roster is explicitly incomplete;31-versus-35 OTUs and Sect_C_4-versus-C2 source
  naming remain unresolved. Preserve prior workflow-arrow deletion and bacterial Bosea grounding.'
- 'MSC1: positive comparisons concern early-exponential total OD on supplied10mM soluble NAG against the
  average of corresponding monocultures. The source reports no significant late-exponential difference.
  This is not partner-resolved biomass, reciprocal benefit, obligate syntrophy or chitin-polymer turnover.
  Four named canonical participants omit the unresolved Rhizobium isolate; V4 does not separate Ensifer
  OTUs.'
- 'MSC1: pooled relative16S Pearson associations and betweenness hubs are computational, not experimentally
  demonstrated facilitation, niche partitioning or keystone necessity. Rhizobiales is an order. Soil chitin
  and liquid NAG assays must not be collapsed into one causal test. Source Table1 isolate mismatch, herbicide
  doses and conflicting Methods inequalities remain under1569.'
- 'MSC2: preserve five monoculture chitin-growth phenotypes without assigning exclusive initial mixed-community
  donor roles. Distinguish100ppm monocultures from500ppm community growth, chitin+NAG preconditioning
  and18mM ammonium supply. Do not rewrite supported Sinorhizobium chitin use as nitrogen fixation merely
  because of its genus or existing497.'
- 'MSC2: retain both existing biological arrows as HYPOTHESIZED. Primary Discussion proposes product sharing
  and resource-enablement of Streptomyces; lack of selective rescue/removal experiments limits certainty
  but does not justify deleting the source-supported model. Previously removed dangling outcome arrows
  stay absent.'
- 'MSC2: GC-MS measured cell-pellet metabolites after supernatant removal, despite extracellular-pool
  wording in Introduction. NAG accumulation is not directly measured extracellular transfer. Mixed-bag
  FBA removes species boundaries and cannot establish actual partner exchange. Transcript comparisons
  are70vs118h within the community, not matched mono/community induction or direct enzyme activity.'
- 'MSC2: preserve positive community-responsive Streptomyces observations and its approximately12% alignedRNA
  proportion at70h without treating RNA proportions as viable abundance or chitinase flux. NAG preconditioning
  can complicate repression/induction interpretation. Canonical source strain labels and genomes are preserved,
  not independently re-grounded.'
- 'MUC2: preserve increased Akkermansia and decreased Prevotella qPCR estimates with no significant totalOD
  difference. Six group assays and calculatedCFU equivalents are not live colony counts or fourteen-strain
  resolution. Explicit participants are the inoculated roster, not proven endpoint survival. CAZy capacity
  classes summarize species-genome sets, not exact-strain enzyme measurements.'
- 'MUC2: retain lower acetate and higher propionate/butyrate/formate as net72h extracellular concentrations.
  They are not production rates, traced mucin-carbon flux, identified producers or donor-recipient exchange.
  Remove the common-treatment composition-to-acid arrow without denying either positive endpoint. pH was
  not measured/controlled, daily medium replacement matters, and host effects were not tested.'
- Review full biological diff and eight focused tests. Retarget both anchors of the existing MUC2 qPCR
  gap without altering its rationale/evidence. Preserve culture-accession safeguards805/806/808 and grounding
  statuses807; ambiguous labels remain a separate issue.457 other records,920 caches and raw non-graph
  blocks unchanged;46 baseline warnings retained exactly and no structural defects or auditor changes.
- Actual schema, strict, terms, references, snippets, histories, corpus audit, deterministic renders and
  regression outputs captured. Exact descriptions parsed across456 pages, not browser screenshots. Coarse
  roster/scope census unchanged and does not certify identity or flux. Post-commit docs-current remains
  a separate publication gate.
- Deduplication covered861 all-state issue titles/bodies and28 scoped ignored/hidden local files;8 matching
  bodies read along with prior MSC1 workflow and MUC2 curation histories, not every PR/comment/local artifact.1566-1568
  addressed but OPEN until protected-main merge;1569 remains OPEN afterward. Exact-head self-review is
  COMMENT, not independent approval. No new causal structure or paid Edison submission.
