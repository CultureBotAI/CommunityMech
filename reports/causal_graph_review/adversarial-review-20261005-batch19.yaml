adversarial_checks:
- Read each complete record and account for every original node and arrow; preserve three supported or qualified
  arrows, remove three, add none.
- Preserve MFC binary current and 42%-to-64% CMC degradation; residual H2/acetate/ethanol do not show uptake of
  every listed molecule.
- 'Check the repository SYNTROPHY definition: product removal must favor the first partner. Use CROSS_FEEDING for
  the MFC supply model because the accessible evidence does not isolate that removal mechanism.'
- Preserve particulate and soluble-substrate localization comparisons without asserting spatial causality or resource-partitioning
  benefit.
- Preserve AECC sugar supply, acid formation and solvent output, while distinguishing mixed pools from traced donor-specific
  flux and butyrate necessity.
- Do not turn a cosubstrate arm into an upstream saccharification cause or product supply into an isolated competition
  mechanism.
- Record pH/inoculation interventions and RNA/cDNA abundance-assay scope; keep experimental provenance, without
  treating proportions as direct cell counts.
- Retain methane formate-only failure and limited mixed-substrate monoculture uptake, not unconditional formate
  growth or unmeasured pathway flux.
- Keep M. barkeri-to-fermenter direction explicitly as proposed product-removal feedback, not reverse substrate
  donation.
- Retain increased cellulose degradation and pH alongside unchanged fermenter growth; describe similar reported
  growth yields without inventing a significance test for yield.
- Distinguish consumption of formate/acetate from reduced butyrate/lactate production and qualify pH mediation.
- Preserve both exact-pair memberships and NCIMB 8052 withheld GTDB grounding; the M. mazei comparison is not an
  additional member.
- All five reference caches and unrelated top-level YAML blocks preserved; primary XML stays outside git.
- MFC sources abstract-bounded; two primary main bodies/Methods/tables/captions read, no visual images or supplements
  claimed.
- No new structure or Edison spend. Self-adversarial review is not independent approval or completion of all 460
  records.
