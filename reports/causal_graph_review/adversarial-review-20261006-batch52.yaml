adversarial_checks:
- Whole275-line URL,628-line Hualgayoc and353-line gut records reviewed, including every original node
  and arrow. Complete cached primary main texts, Methods and embedded captions read, with Hualgayoc Table1.
  No original figure images, supplementary files, raw data or code audited.
- URL site/lithology association is not an isolated causal driver. Genome-based functional potential remains
  positive SUPPORT/COMPUTATIONAL evidence, not measured pathway flux. The two overview-to-hydrogen arrows
  were context/inclusion, not established causal direction, and are removed without deleting the distinct
  findings.
- Both canonical URL habitat labels sharing NCBITaxon131567 remain distinct. Horonobe-only transfer/genotype
  claims use only its participant. Hydrogen transfer stays PARTIAL without implying simultaneous sulfate
  reduction and hydrogen export. Genotypic similarity and coverage-qualified iRep do not establish transport,
  absolute growth rates or mutation rates.
- Hualgayoc retains the already-present MAG003-only first participant under816, and both participants
  for proposed acetate coupling. Both genomes encode glycerol-to-acetate potential. Organism assignment,
  pH threshold, acetate-toxicity relief and mineral phase are hypotheses distinct from the positive bulk
  chemistry. Repeated inoculation is explicit; bulk16S rRNA transcripts were measured, not absent.
- 'Hualgayoc remains needs_research under1504: the removed positive remediation outcome requires new structure.
  A real one-community dry run succeeded; the14343-character query is hash-bound. No paid provider job,
  report or new outcome node/arrow. Existing minor-acidogen discussion is semantically unchanged; no unsupported
  enum is added to hide the rendering issue.'
- Gut partner-associated protein changes remain positive controlled findings, with abundance-matched mixed-isolate
  controls. Carbon effects are not denied. Detection thresholds and combined human/rumen scope prevent
  assigning all pooled results to every human member or condition.
- Annotated KO overlap is a proteomic metric, not measured competition, coexistence or metabolite flux.
  The exact Methods productivity denominator is mean monoculture qPCR abundance, not a sum or best-monoculture
  benchmark. Yield is not direct viable biomass or every-member mutualism. Both proposed directions stay
  PARTIAL without selective mediation.
- Full record diffs and focused tests inspected. Nine nodes retained, two contextual arrows removed, three
  arrows PARTIAL. Only graph, discussion and curation-history fields changed.457 other records,920 caches
  and non-graph raw blocks preserved, not certified. Two participant registry entries added; measured
  connectivity census unchanged.
- Actual schema, strict, terms, references, snippets, rank and history gates passed. Network equals baseline
  with34 existing findings and no structural errors. Repeat renders deterministic; exact node/arrow descriptions
  across456 pages parser-checked, not browser screenshots. Post-commit docs-current remains a separate
  publication gate.
- Dedup checked809 all-state titles/bodies and14 ignored/hidden local files; prior merged PR814 inspected,
  not every historical comment/review.1501/1502/1503 are repaired findings open until protected-main merge.1504
  remains unresolved; original815 rendering complaint was addressed by removal in PR814. Source-based
  self-adversarial review is not independent approval.
