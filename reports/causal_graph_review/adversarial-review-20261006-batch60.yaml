adversarial_checks:
- Whole three records read; all four original nodes and both arrows assessed, plus the absent Komagataella
  interaction field. Missing structure is not certified absence of biology.
- KZ retains positive consortium outcomes and complementary biomass-normalized assays. Community-level
  scope with both exact canonical strain labels removes unverified SZ-3-to-CW-D3T transfer direction without
  erasing the division-of-labor interpretation. No new node or arrow.
- KZ full Methods and linked correction body remain unread. PubMed identifies PMID41456976; official publisher
  API returns core metadata only and openaccessArticle=false. Third-party OA labels do not establish access
  or scientific correction content. Keep needs_research under1541; do not assume the correction is immaterial.
- KMC source Introduction explicitly states pellicle-supported biochemical interplay. Retain that existing
  arrow as HYPOTHESIZED, grounded by a primary-matched excerpt, while distinguishing observed pellicle/morphotype
  association from selective mediation of reciprocal benefit.
- Remove the accessory-composition-to-mutualism arrow because potential fermentation capacity is not measured
  reciprocal benefit among the four core genera. Preserve positive composition changes and probable cabbage-derived
  lactobacillus persistence; do not convert relative read proportions into absolute growth or niche partitioning.
- KMC four canonical genera are a partial core representation, not every organism in every treatment.
  No canonical taxonomy edit. Non-graph assertions about separately cultivating members, categorical shaking
  effects and ingredients remain separately unresolved under1543.
- Komagataella public abstract and publisher Introduction/section previews report compatible co-growth,
  common induction and biosynthetic relays. Lack of engineered population-balancing crosstalk is not biological
  neutralism; common induction is not cross-feeding. Exact host/construct assignments and full Methods
  remain unresolved; do not borrow unmatched monoculture titres as experimental controls.
- Komagataella stays needs_research under1542, with zero nodes/arrows and its originally absent interaction
  field preserved. The reviewed one-community LITERATURE dry-run query contains7457 characters; zero provider
  submissions or credits. No report or completed extension is claimed.
- KMC full extracted primary main text and main/supplement captions were read. Original figure pixels,
  Table1 numerical cells, supplementary PDF and raw sequences were not inspected. KZ/Komagataella complete
  abstracts plus selected public publisher previews were read, not complete primary bodies. No access-control
  workaround.
- Full biological diffs, exact participant registry and focused test assertions reviewed.457 other record
  hashes and920 cache hashes unchanged; raw non-graph blocks preserved. Both-root census explicitly measures
  KZ scope change, with no auditor-rule edit.36 network warnings preserved and zero structural defects.
- Actual per-record schema/strict/term/reference/snippet/rank/history gates and regression outputs/digests
  recorded. Repeat renders and456-page exact description parser passed, not browser screenshots. Post-commit
  docs-current is a separate publication gate.
- 839 all-state issue titles/bodies and19 scoped ignored/hidden local matches searched; all three matching
  issue bodies read, not every comment/PR or local file. Repair1539/1540 addressed but OPEN until protected-main
  merge; research1541/1542 and metadata1543 remain unresolved. Exact-head self-review is COMMENT, not
  independent approval.
