limitations:
- This is a self-adversarial review, not independent reviewer approval.
- This batch reviews six records; the whole-corpus semantic review remains incomplete.
- Non-graph descriptions, taxon notes, abundance values, and engineering numbers are outside certification. Some
  still require separate evidence review.
- Gold and alfalfa local caches are excerpts, not independent full sources. The publisher abstract and public primary
  preprint text were read separately; automated local coverage remains incomplete.
- Indium and gold are abstract-bounded. Missing full text does not establish that an unreviewed experiment was absent.
- The exact BioModels deposit and rare-earth supplement were not retrieved. No byte equivalence or unverified double-mutant
  genotype is claimed.
- The alfalfa preprint's extracted results and Table 1 text were read, but the PDF table layout was not visually
  inspected.
- Publication text coverage and render determinism are checked automatically; this data-only batch has no desktop/mobile
  screenshot QA.
- Edison spending is authorized, but no key is configured and no paid job has been submitted. No new nodes or arrows
  were added.
