adversarial_checks:
- 'Accounted for every original node and direction: 9 nodes retained, 5 of 6 arrows retained, 4 renames. Removed
  only the unisolated dependence-to-population-control mediation. No new topology; all target names and discussion
  anchors resolve.'
- 'Isobutanol overcorrection check: experimental model validation is explicitly preserved from the abstract. Hydrolysis
  provides a resource basis, not sufficient proof of unconditional coexistence. E. coli product formation is a recipient
  outcome, not another metabolite exchange. Full-paper assumptions remain an open knowledge gap.'
- 'Lactate overcorrection check: LAB-associated redox lowering is preserved alongside continued fungal oxygen consumption
  and membrane geometry. Neither LAB-alone anoxia nor reciprocal thermodynamic syntrophy is asserted. Cellulose
  hexoses are separated from pentose feedstock.'
- 'Co-substrate controls: acetate depletion/feed rescue and glucose alternatives prevent lactate-alone production
  claims. The 19-word quotation is from accepted-manuscript main p6, not SI. Acetate-feed, low-OTR and L. brevis
  arms remain distinct. Clear Fig4 supports the three-member steam-pretreated beechwood benchmark; not an untreated/four-member
  claim.'
- 'Filamentous controls: initial supplied glucose precedes hydrolysate dependence. The source conditional early
  competition/late commensalism interpretation is retained without universal neutral fungal fitness. Spore storage/viability
  is not fluorescence-tag causality. Relative osmolality advantage is not absolute bacterial stimulation; corrected
  fluorescence is not universal exact cell counting. Pigment mediation remains unresolved.'
- 'Source matching: all 16 graph and 3 discussion quotations have fresh primary and cache literal matches, not entailment
  certification. Abstract and accepted-manuscript wording are bound to their actual matching versions. Only one
  bounded 19-word main-text cache excerpt added with provenance; 922 other caches unchanged, no publication PDF/body
  imports.'
- 'Preservation: three guarded records and append-only histories; 457 other records, non-graph raw blocks and prior
  history/decisions unchanged. Canonical strain 1344414 is not replaced by species 51453. Three explicit participant-list
  users added. Measured census: 415 community-level, 137 mixed, 278 community-only, 1570 taxa, 1280 solely credited.
  Sole-credit survey is not actual coverage proof; logic and share guard unchanged.'
- Seven real in-memory control/mutation/restored-control probes reject loss of experimental validation, unconditional
  stability, loss of joint redox, lactate-only conversion, assay conflation, unisolated mediation and absolute/proxy
  overclaims. Changed values and rejecting assertions recorded; canonical hashes unchanged. These are not extra
  pytest tests.
- Eleven focused and 1056 combined tests pass, including tests/test_datamodel.py after issue1899. All 3 records
  pass schema, strict, terms, full-record references, snippets, rank and history. 57 network warnings preserved,
  zero structural defects. 456 rendered pages, 1365 nodes and 527 arrows match exact source descriptions; deterministic
  rendering, not UI screenshot certification. Local reference passes do not certify Linux and corpus snippet audit
  remains informational.
- Graph repairs1901-1903 await protected-main merge; metadata1904/1905 remain open. No Edison extension/spend. Prior
  Ruegeria research1883 still needs a configured authenticated provider. Self-review is not independent approval.
  Postcommit docs-current and exact-head publication are separate gates. No protection bypass, artificial CI or
  premature branch deletion.
- 'Corpus: 372 reviewed, 34 pending, 54 needs_research across 460 records. Overall goal remains incomplete.'
adversarial_regression_proof:
  report:
    cases:
    - mutation: Erase experimentally validated model evidence
      test: test_experimental_model_validation_survives_conditional_stability
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 32
      assertion: assert "mathematical model that was experimentally validated" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/2/description
        before: 'PARTIAL: the study reports cooperator-cheater dynamics and stable population equilibria using a
          comprehensive mathematical model that was experimentally validated. Fungal cellulase production and bacterial
          use of released sugars underlie the modeled interaction. The abstract supports this combined modeling/experimental
          framework, not stable coexistence under every starting ratio or environmental condition. Full-paper access
          was unavailable for checking the exact perturbations and model assumptions; experimental validation is
          not being reclassified as purely computational speculation.'
        after: Purely computational speculation without experimental validation.
    - mutation: Promote hydrolysis to sufficient coexistence mechanism
      test: test_experimental_model_validation_survives_conditional_stability
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 37
      assertion: assert edge["target"] == c["name"] and edge["description"].startswith("PARTIAL:")
      restored_control: PASS
      changed_values:
      - path: records/0/ecological_interactions/0/downstream/1/description
        before: 'PARTIAL: fungal saccharide release supplies the resource basis of the reported cooperator-cheater
          dynamics. Stable equilibria depend on the study conditions and model assumptions; hydrolysis alone is
          not sufficient evidence of coexistence. The abstract reports experimental model validation.'
        after: Hydrolysis guarantees stable coexistence in all conditions.
    - mutation: Erase LAB redox contribution
      test: test_lactate_link_keeps_fungal_and_lab_redox_contributions
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 45
      assertion: assert "Fungal oxygen consumption first lowers dissolved oxygen" in b["description"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/1/description
        before: 'L. pentosus funnels carbohydrates to lactate and supplies acetate when metabolizing pentoses. Fungal
          oxygen consumption first lowers dissolved oxygen; subsequent LAB inoculation lowers redox potential further,
          enabling the obligate anaerobe. The membrane configuration, continuing fungal activity and LAB contribution
          work jointly: LAB alone cannot maintain anoxia. This supports resource and redox facilitation, not demonstrated
          reciprocal thermodynamic syntrophy.'
        after: Only fungal oxygen uptake matters; LAB has no demonstrated redox contribution.
    - mutation: Allow lactate-only butyrate production
      test: test_butyrate_requires_co_substrate_and_preserves_rescue_evidence
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 57
      assertion: assert "Lactate alone is insufficient" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/2/description
        before: 'C. tyrobutyricum converts lactate with a co-substrate to butyrate. Lactate alone is insufficient:
          acetate depletion stops utilization, and acetate addition restores it; glucose can also serve as co-substrate.
          These experiments support the recipient conversion, not an exclusive source of every acetate molecule.
          Acetate feed, lower oxygen transfer and addition of L. brevis are separate experimental arms. The three-member
          consortium produced the reported beechwood yield after steam pretreatment; the four-member arm is not
          that benchmark.'
        after: Lactate alone supports butyrate production without another substrate.
    - mutation: Conflate untreated four-member and pretreated three-member arms
      test: test_lactate_arms_and_pretreated_benchmark_are_not_conflated
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 69
      assertion: assert "L. brevis are separate experimental arms" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/1/ecological_interactions/2/description
        before: 'C. tyrobutyricum converts lactate with a co-substrate to butyrate. Lactate alone is insufficient:
          acetate depletion stops utilization, and acetate addition restores it; glucose can also serve as co-substrate.
          These experiments support the recipient conversion, not an exclusive source of every acetate molecule.
          Acetate feed, lower oxygen transfer and addition of L. brevis are separate experimental arms. The three-member
          consortium produced the reported beechwood yield after steam pretreatment; the four-member arm is not
          that benchmark.'
        after: The four-member consortium produced the benchmark on untreated beechwood.
    - mutation: Restore unisolated dependence-to-population mediation
      test: test_dependence_does_not_mediate_all_treatment_responses
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 89
      assertion: assert "downstream" not in b
      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/1/downstream
        before: null
        after:
        - target: Tunable Filamentous Population Dynamics
          description: Dependence causes every treatment response.
    - mutation: Replace relative growth and corrected fluorescence with absolute claims
      test: test_viability_relative_advantage_and_fluorescence_limits_are_explicit
      control: PASS
      mutation_applied: true
      mutation_rejected: true
      assertion_line: 98
      assertion: assert "do not attribute that reversal to the tag" in c["description"]
      restored_control: PASS
      changed_values:
      - path: records/2/ecological_interactions/2/description
        before: Inoculation advantage, osmolality and shaking frequency alter relative growth and competition in
          the filamentous coculture. Spore storage in water versus PBS changes viability and growth order; matched
          tagged and wild-type controls do not attribute that reversal to the tag. Higher osmolality relatively
          favors S. coelicolor through stronger fungal inhibition, not absolute bacterial growth stimulation. Fluorescence
          requires autofluorescence correction and remains a growth proxy, not exact cell counts in every condition.
          Pigment and cellulase formation vary with population balance, but their causal mediation by hydrolysate
          dependence is unresolved.
        after: Osmolality stimulates bacterial growth and fluorescence counts cells exactly.
