adversarial_checks:
- Actual full record diffs inspected against cached primary main bodies, Methods, Results, Discussion,
  captions and table text. Nine existing nodes retained, four existing arrows qualified and two cross-assay
  arrows removed. Renamed targets and new discussion anchors resolve exactly.
- Drought metagenomic capacity distinguished from expression and microbial gene causality. Maize TOM1
  response is relative and principally under watered controls; Fe3+-EDTA uses separate single-isolate
  sorghum assays. No phylum-wide responder claim, field-to-chamber media import or causal cross-assay
  arrow retained.
- Bacillus proposed exclusion direction is CC17B-1 toward DSM1-25280, preserving distinct preferred terms
  despite one species ID. CFU is culturability; product inhibition remains an alternative to resource
  competition. PAD-associated vanillin removal is not direct PAD catalysis, and facilitation does not
  establish donor neutrality.
- Three-strain treatment retains aerobic 30 C pretreatment and anaerobic 50 C relay with two 12 h intervals.
  Three canonical participants remain distinct; measured LA improvement does not establish selective aromatic
  mediation or stable simultaneous coexistence.
- ENIGMA nitrite supply and reverse modeled NO handoff are represented as a joint process. Measured joint
  growth is separate IN_VITRO SUPPORT from COMPUTATIONAL PARTIAL NO exchange. Both isolates grow separately
  on nitrate; no obligate dependence or direct N2 measurement asserted.
- ENIGMA nitrate/composition context and monoculture nitrite inhibition retained. High-condition SynCom
  nitrite exposure is modeled and related to measured N2O, not selectively perturbed. Negative arrow refers
  to nitrite inhibition, not N2O toxicity; proteomic competition is not categorical fact.
- Three guarded writes, append-only histories and llm-assisted events. Prior non-graph raw blocks, 457
  other records and all 920 caches byte-identical. Eight focused tests cover scientific boundaries, strain
  identity, exact anchors, hashes and complete original-arrow accounting.
- Initial full regression run passed 376 tests, but Ruff B023 rejected the test helper closing over a
  loop variable. The closure now binds its mapping at definition time. Original failed lint output is
  retained under prior_test_attempts; the full regression suite and formatting/lint gates were rerun successfully.
- All 31 baseline network warnings exactly unchanged; zero structural errors. Registry adds Dual Bacillus
  and ENIGMA, 178 to 180 users. ENIGMA mixed-to-community-only scope accounts for two additional sole-rule
  taxa; no taxonomy, connectivity algorithm or numeric test bounds changed.
- Repeated render hashes identical; exact node/arrow descriptions checked across 456 pages. Reference-validator
  0.1.7 performed zero checks despite exit 0; independent snippet matching is not scientific validation.
  No browser screenshots, visual figures, raw-data analysis or supplement review claimed.
- 'Deduplication covers 736 all-state titles/bodies and ignored/hidden-inclusive target-local material,
  not every comment. #647 reused; #1413-1415 remain open. Cache abstract_only headers are stale, not treated
  as full-text absence. No new nodes/arrows, provider task or charge.'
