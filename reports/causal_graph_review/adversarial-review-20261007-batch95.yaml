adversarial_checks:
- Fresh both-root graph baseline preceded paper reads. All four whole records,18originalnodes and9arrows accounted
  for.12nodes6existingdirections retained;6nodes3analysis-order arrows removed;1node renamed. No new causal topology.
- FSQN is byte-for-byte unchanged. Its microbiome-composition response and explicit COMPUTATIONAL fungal-guild prediction
  remain distinct and unconnected. Zero arrows is appropriate here; no invented mediation to rice growth. Primary
  evidence remains abstract-bounded, not complete-text certification.
- Rice phosphorus SynCom has a positive pot biomass/P outcome, distinct from the negative field rice/soybean intercropping
  comparison. Root morphology, IAA, soil-P fractions and transporter expression do not separately establish necessary
  mediation. Two existing arrows and the transport pathway remain PARTIAL; plant benefit does not establish MUTUALISM.
  Graph evidence was detached from non-graph aliases before source-classification changes. Elemental-P grounding
  removed from the phenotype node.
- Richmond Fe/mineral feedback remains in its actual directions. Oxygen and mineral supply bound the cycle; mine-outflow
  dissolution estimates are not individual-biofilm or species rates. Iron oxidation is not iron-ion transport, direct
  nutrient CROSS_FEEDING or pairwise MUTUALISM. Leptospirillum group/sample identity is bounded; Ferroplasma isolate
  mixotrophy is not field autotrophy or competitive exclusion.
- Richmond generic ARMAN contact remains positive, without unsupported F. acidarmanus/subgroup identification. Duplicate
  Parvarchaeota contact is removed. Nitrogen-fixing isolate capacity is preserved in a discussion, not promoted
  to measured partner transfer; proteomic nondetection does not deny capacity. SYNTROPHY does not require obligacy,
  but contact is not metabolic feedback. Higher-pH A. ferrooxidans distribution is retained under a renamed observation
  node, not COMPETITION or reference-genome functional proof.
- Adversarial diff review caught copied taxon narratives and GTDB metadata inside seven newly populated participant
  objects, which reintroduced unsupported non-graph claims. These were removed, leaving only canonical preferred_term/term
  identities. Issue1762, an additional curation event/history, and an explicit regression assertion record the fix.
  Initial verification was deliberately interrupted after10recorded outputs; all final gates were rerun. Prior outputs
  are retained separately, not counted as final verification.
- Rifle community electroactivity/enrichment and Geobacter biofilm dominance remain. Four genomic inventory/conclusion
  nodes and three analysis-order arrows are removed. MHC/PCC/e-pilus/OmcS predictions do not prove niche partitioning,
  competition, universal EET, natural mineral flux or syntrophic partners. The candidate set does not exclude all
  other aquifer organisms. The source leaves the dominant organism environmental niche unresolved and conflicts
  in near-complete-genome denominators; no silent reconciliation. Cultivation setup remains unchanged.
- Two complete fresh primary main texts and their captions read, selected Richmond geochemical sections and five
  further Richmond primary abstracts read; FSQN abstract read. No supplement/raw-data/figure-pixel review. EuropePMC
  XML failures and PMC challenges do not count as access and were not bypassed. Background Ferroplasma review is
  not exact-system proof; downloaded Acidithiobacillus/Parvarchaeota main texts were not read or used as functional
  proof.21retained/new-discussion quotations freshly match primary text and unchanged caches; lexical matching is
  not entailment.
- Three changed records,457unchangedrecords and923unchangedcaches; four append-only histories including the adversarial
  participant repair. All non-graph raw blocks and canonical taxonomy remain unchanged, not recertified. Richmond
  participant-set fixture is updated. Unspecified contact participants still receive coarse legacy connectivity
  credit, which is not evidence for every member.
- Eight focused tests and872combined regressions pass, with four-record schema/strict/term/reference/snippet gates
  and four history gates.56network warnings unchanged,zero structural defects. Deterministic HTML rendering and
  exact description parsing are not screenshots. macOS reference passes do not certify Linux DOI-cache handling1091
  or loader1703.
- Ignored/hidden-inclusive local dedup and refreshed all-state issue titles/bodies have explicit exclusions; matching
  prior issues read, no exhaustive PR/comment claim. Repairs1761-1763 remain open until protected-main merge;1764
  remains non-graph follow-up. Exact-head COMMENT is self-adversarial review, not independent approval. No provider
  spend, new wet-lab protocol or branch-protection bypass; corpus remains incomplete.
