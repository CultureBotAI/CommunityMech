adversarial_checks:
- Fresh both-root baseline preceded papers; all10originalnodes6arrows retained with dispositions. One existing source
  endpoint corrected; its target and causal wording are unchanged. No new biological causal claim.
- Waxy-oil removal measurements and both existing directions survive. Proposed transfer and cooperation are PARTIAL;
  multi-omics and docking do not establish mediator necessity or reciprocal fitness. Unavailable methods are not
  evidence that perturbations were absent.
- Nitrogen preserves improved nitrate-N removal and reported abundance shifts. Metagenomic versus transcript wording
  is unresolved, not silently converted into verified expression or flux. Nitrate disappearance does not certify
  whole-system nitrogen loss or niche partitioning.
- Bifenthrin sequential transformations and positive consortium comparison remain. Intermediate coupling does not
  establish traced assimilation, growth dependence or reciprocal fitness. Hydrolase-specific mediation stays qualified.
- Social spreading, comigration and association requirement remain distinct positive findings. The existing initiation
  arrow text names contact, so its attachment changes from Comigration to the already-existing Contact-Dependent
  Initiation node. This repairs a mechanical source mismatch rather than extending the graph with a new claim.
- Primary membrane and adjacent-colony experiments support the association requirement; conditioned-medium and heat-killed-cell
  results do not identify a molecular trigger or motor. Follow-up differences among other isolate pairs do not override
  the canonical pair.
- Explicit canonical participants replace unsupported one-way inducer and mutual-fitness typing in social nodes.
  Non-graph temperature, timing and cross-feeder-role claims are preserved outside certification under1736.
- One fresh primary main text and four fresh abstracts read. Follow-up XML500 after bounded retries. No separate
  supplements, raw data or original figure pixels audited. No new growth-optimization details, strain combinations,
  genetic designs or experimental procedures added.
- All921caches456otherrecords and raw non-graph blocks preserved; four append-only histories and ten focused tests.
  Four explicit-participant users added, measured census updated, all56oldwarnings retained, zero structural defects.
  No taxonomy or auditor-rule change.
- Executed gates and deterministic HTML-description checks are not browser screenshots or generated-model loader
  certification. Loader1703remains open. Repairs1732-1735await protected-main merge;1736remains open. No paid Edison
  job or inferred authorization. Self-review is not independent approval or corpus completion.
