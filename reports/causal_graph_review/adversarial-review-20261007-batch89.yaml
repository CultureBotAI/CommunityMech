limitations:
- Fresh both-root baseline before papers:460records921caches1422nodes584arrows56warnings0structural defects. All10originalnodes6arrows
  retained; one existing arrow changes source endpoint with its target and causal wording unchanged.
- Fresh social-spreading primary abstract/main methods/results/discussion and embedded tables/captions read from
  EuropePMC XML. Four other fresh abstracts read. Follow-up XML500 after bounded retries. No separate supplements,
  raw data or original figure pixels audited.
- Waxy oil and bifenthrin retain positive treatment outcomes, proposed mechanisms and existing directions. Abstract-bounded
  mediation is explicit; multi-omics/docking do not themselves establish necessity, traced assimilation or reciprocal
  fitness. No new pathogenic-growth optimization or experimental designs were added.
- Nitrogen retains measured nitrate-N improvement and source-reported abundance shifts, without niche-partitioning
  or verified flux claims. The source mixes metagenomic analysis and transcript-abundance language; this ambiguity
  is recorded rather than silently resolved. Nitrate disappearance is not certified as whole-system nitrogen loss.
- Social spreading preserves joint movement, comigration and the experimentally supported association prerequisite.
  The existing contact-initiation edge was attached to Comigration. Reattaching its unchanged wording and target
  to the already-existing Contact-Dependent Initiation node repairs an endpoint, not a new biological mechanism
  or graph-extension research task. No Edison spend was needed for this mechanical repair.
- Social nodes use explicit canonical community participants rather than an untested one-way inducer or mutual-fitness
  classification. Other isolate-pair findings from the follow-up abstract do not override the canonical pair. The
  molecular trigger and motor remain unresolved.
- 456otherrecords, all921caches and raw non-graph blocks preserved. Four explicit-participant users added; social
  changes from pairwise-only to community-level-only. No taxonomy or auditor-rule changes. Non-graph social temperature/timing/cross-feeder
  follow-up remains open.
