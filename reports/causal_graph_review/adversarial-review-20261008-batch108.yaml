adversarial_checks:
- 'Whole original targets and changed graph/discussion diffs reviewed. All 14 original nodes and seven directions
  have dispositions: retain 12 nodes and three qualified existing directions, remove two workflow nodes and four
  context/coincidence arrows, rename seven nodes. No new topology or Edison spend.'
- 'Challenge deletion versus evidence loss: preserve measured tobacco substrate loss and sensory outcomes, Chlorella
  removal/growth/transcript responses, MetG2 microbial/host molecular responses, and Artemisia tolerance/compatibility/carbon-fixation
  capacity. Positive endpoints and source hypotheses remain.'
- 'Tobacco: the uninoculated comparator does not establish monoculture synergy or reciprocal bacterial fitness.
  Relative Bacillus abundance is not absolute growth or the beta-diversity path-model variable. Preserve PLS-PM
  as PARTIAL statistical inference without invented software. Keep the two existing outcome contributions hypothetical;
  remove degradation-process annotations from the volatile/sensory endpoint.'
- 'Chlorella: construction and 60-day duration are context, not separate biological causal nodes. Preserve all three
  removal percentages and the BG11-referenced algal response, without inferring exchanged nitrate, neutral bacterial
  fitness or an isolated bacterial conditioning effect. Transcript upregulation is not enzyme activity or measured
  flux. Preserve previous October2 edge repairs; give only algal observations canonical identity-only participant
  scope. Existing unnamed bacterial membership issue183 remains separate.'
- 'MetG2: distinguish inferred colonization from direct tracking, enriched genes from products/transfer, and stress-response
  transcription from measured stress-challenge performance. Retain one hypothetical functional contribution, remove
  the context arrow and redundant unverified community-level taxon links. The primary preview names four inoculant
  strains with a Chiliseed2/Chileseed2 discrepancy; responding native Proteobacteria is not the inoculant. Generic
  sugarcane does not verify the canonical species. Record remains needs_research under1847.'
- 'Artemisia: retain pair-level tolerance and PGP/carbon-fixation capacity, and the partial complementarity/minimal-antagonism
  design rationale. None proves niche partitioning, reciprocal fitness or sequestration flux. The abstract does
  not identify these trait-assay settings, so OTHER replaces unsupported IN_VIVO. Prior removal of screening-order
  arrows is preserved; no new topology is inferred from other positive plant/soil endpoints.'
- Fifteen graph and seven discussion quotations match independently retrieved primary abstracts/indexed publisher
  previews and unchanged caches. Literal matching is separate from entailment. Whole indexed tobacco/Artemisia abstracts,
  bounded MetG2 Introduction/section previews and the whole EuropePMC Chlorella abstract were read, not complete
  papers. Direct publisher403 and public API400 attempts are recorded; two source CC licenses do not imply full-body
  retrieval. No supplements, figure pixels or raw datasets were certified.
- Four guarded writes produce four append-only histories. All 456 other records, all 923 caches, non-graph raw blocks
  and prior history/decision files remain byte-identical. No schema, validator, census-threshold or runtime-rule
  changes. Chlorella identity scopes and removal of redundant MetG2 links leave the global participant census unchanged;
  canonical MetG2 identities are not certified.
- Three in-memory control/mutation/restored-control probes reject promoting statistical evidence to SUPPORT or restoring
  the Chlorella and MetG2 coincidence/context arrows at scientific assertions. No canonical files changed; these
  probes do not inflate the pytest count.
- Eight focused tests and 975 combined regressions pass. Four full-record schema/strict/term/reference/snippet checks
  and four histories validate. The network retains 56 baseline warnings and zero structural defects. Deterministic
  rendering and exact HTML parsing cover 456 pages, 1370 node descriptions and 539 arrows, not screenshots.
- Repair issues1843-1846 are addressed but remain open until protected-main merge. Identity1847 and non-graph membership183
  stay open. Existing license949, loader1703, DOI-cache case1091 and stub-policy1093 are not certified. Denied and
  unanswered Edison scopes remain untouched. Self-review is not independent approval; no artificial CI, protection
  bypass or premature branch deletion.
- Corpus status is 344 reviewed, 64 pending and 52 needs_research, not completion. Postcommit docs-current and exact-head
