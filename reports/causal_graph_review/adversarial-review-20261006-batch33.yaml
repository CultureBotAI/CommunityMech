adversarial_checks:
- Actual three record diffs inspected against primary access documented in the ledger. Seven nodes retained,
  one arrow retained as PARTIAL and one redundant endpoint-to-panel arrow removed. No new structure inserted.
- Diclofenac MC attribution corrected using exact-system primary Results, not the pooled abstract alone.
  Parent loss differs from mineralization and detoxification; partial-roster participation does not assign
  individual degraders. Relative marker denominators and prior workflow-arrow removal preserved.
- Dolichospermum cofactor predictions remain computational PARTIAL. Exchange and canonical cobalamin identity
  are not established. Recovered genomes are not a complete culture census. Existing discussion updated
  with exact anchors, not duplicated.
- Drosophila host outcomes use canonical microbial-group and host participants. Species-resolved expansion
  is still pending and no unsupported exchange mechanism is added. Host genotype context and null responses
  remain explicit.
- 'Incorrectly filed #1405 publicly corrected and closed NOT_PLANNED: related_ingredients contains only
  diclofenac sodium, not the asserted metabolite entry. Metadata unchanged and no fix falsely claimed.
  #765 evidence debt reused; #1406/#1407 and #1408 remain open.'
- Three guarded writes, llm-assisted events and append-only histories; prior history preserved semantically
  and all other non-graph raw blocks unchanged. 457 other records and 920 caches byte-identical. Eight
  new regression tests.
- All 31 baseline network warnings exactly unchanged, zero structural errors. Participant registry 176
  to 178 adds only Diclofenac MC and Drosophila; measured connectivity survey unchanged. No numeric bounds
  or survey algorithms changed.
- Repeat-render hashes match; exact descriptions checked across 456 pages. No browser screenshot or visual-figure
  QA claimed. Three reference-validator no-ops disclosed; independent literal snippet matching is not
  scientific truth.
- 'Access limits recorded per source: complete main bodies for the two cached OA papers and 2014 Drosophila;
  targeted 2015 PDF passages and source-taxonomy abstract only. No supplements or corrected erratum figure
  inspected; no publisher body/PDF cached.'
- Issue deduplication covers 729 all-state titles/bodies and ignored/hidden-inclusive exact-target local
  material, not every comment. One-community Edison dry run only; no job/charge, remote pricing-map DNS
  fallback disclosed.
