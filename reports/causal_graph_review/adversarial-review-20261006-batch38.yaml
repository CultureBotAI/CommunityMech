adversarial_checks:
- Whole records and complete graph diffs checked against primary sources at recorded access scope. Twelve
  existing nodes retained, three part/whole arrows removed and three remaining arrows qualified as HYPOTHESIZED.
  Every original node and arrow has a disposition. No added connectivity.
- Ensifer genomic complementarity is a conceptual donor/recipient model, not measured exchange, enzyme
  necessity or complete polymer mineralization. Comparative consortium output is not reciprocal fitness
  or formal additive synergy. Preserve AMBIGUOUS Ensifer grounding and exclude the MF1 comparator from
  membership.
- 'Ensifer publisher indexed text labels the paper open access. Retrieval failure does not establish a
  paywall; non-graph access and inferred role claims remain #1441. No full-body access claimed.'
- CPR/DPANN is an eight-site framework, not a defined three-member culture. Keep broad canonical categories
  without assigning all possible partner associations. Remove categorical colonization facilitation, niche
  partitioning and commensalism.
- Size fractions are attachment proxies and cell numbers are DNA/genome-size estimates. Cryo-TEM cell
  identity is inferred; pili-like morphology is not a necessary protein or measured resource flux. Figure
  captions and text were read, not images.
- CPR iRep measures average genome-replication state, not a single-cell growth rate. Archaea were excluded.
  The only attachment-to-replication arrow remains a hypothesis without selective intervention or host-fitness
  evidence. Earlier workflow-arrow removals remain intact.
- 'Separate Oak Ridge source is not the California framework. Secondary source read only through early
  Results for provenance. Non-graph roles/provenance and stale cache metadata remain #1442; no cache modified.'
- Euglena and Chlorella profiles are intrinsic source-only nodes under the existing PAIRWISE convention,
  not self-edges. Remove both profile-to-summary arrows and the unsupported Euglena-specific alpha-tocopherol
  donor assignment. Preserve the publication name plus canonical Auxenochlorella label.
- 'Multi-omics interpretations do not resolve exact transfer or selective mediation. Aggregate output
  is not reciprocal fitness; exogenous alpha-lipoic acid is a distinct treatment, not endogenous cross-feeding.
  Abstract-only protocol and underlying omics-assay gaps remain #1443.'
- Guarded writes and append-only history with llm-assisted events. Prior history semantically preserved;
  all non-graph raw blocks, 457 other records and 920 cache files byte-preserved. Eight new tests cover
  these distinctions, identities, histories, anchors and complete disposition accounting.
- All three records were already in the 184-user participant registry. Euglena intrinsic profiles change
  mixed-scope census from 123 to 124 and sole broad credit from 1221 to 1219; no taxonomy or numeric-bound
  changes. All 33 network warnings exactly preserved with zero errors.
- Repeated renders deterministic and all published descriptions parser-checked. Reference-validator 0.1.7
  performs zero checks despite exit 0; no-op disclosed. Textual MATCH is not scientific validation. Actual
  output tails and digests, including the pre-research baseline, are committed.
- Deduplication searched 760 all-state issue titles/bodies and ignored/hidden-inclusive local files, not
  every comment. No independent reviewer, protected merge or full-corpus completion claimed. No Edison
  job or charge was needed for these existing-structure repairs.
