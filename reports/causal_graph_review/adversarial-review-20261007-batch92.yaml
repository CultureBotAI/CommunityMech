limitations:
- Four complete records and all five existing nodes/one arrow reviewed; Pu'er unchanged, three bounded repairs.
  No new node, direction, experimental protocol or paid provider run.
- Two fresh primary main bodies read (QY2/RH1) including embedded table text/captions, existing Pu'er primary main-body
  extraction read, and two versions of the SCDY1 primary abstract read. No fresh Pu'er full text, complete SCDY1
  body, raw data, figure-pixel or complete supplement review. Missing access is not absence of controls.
- Pu'er remains association-only; temporal confounding and broader-pile bacterial predictors are not starter-member
  causal assignments. Existing cultivation and taxonomy fields are unchanged, not optimized or certified.
- SYNTROPHY explicitly does not assert obligacy. QY2 feedback is an authors hypothesis, not a resolved partner mechanism;
  measured transformation and inhibition remain outside the graph. The prior intrinsic-respiration node is not restored.
- SCDY1 plant benefit remains supported without asserting mutualism, commensalism or transcript/root-hair causal
  mediation. The selected_full_text cache is not independent validation; the graph quote matches the fresh official
  abstract. Non-graph source snippets remain subject to the independent-cache retrieval gap.
- RH1 endpoints and earlier single-strain comparisons remain; compatibility and aggregate growth are not member
  fitness. Processed-sample TOC is not a closed empirical carbon balance; predicted stoichiometry is not measured
  mineralization. The existing gene gap remains, with no new engineering details.
- All921caches and457otherrecord files preserved. Canonical participant assignments and non-graph blocks unchanged.
  Existing histories and decision ledgers are append-only. A sparse single-node outcome can be complete within reviewed
  scope; no graph density target is imposed.
- Ignored/hidden local dedup included, excluding .git/docs/site/references_cache, with relevant caches separately
  checked. All-state issue titles/bodies refreshed; ten matching closed issue bodies read. Comments and PRs were
  not exhaustively searched. Repair1746/1747/1748 close only after protected-main merge.
- Self-adversarial review is not independent approval, generated-model loader certification or corpus completion.
  Loader1703 and prior pending/denied Edison scopes remain unchanged. Validation and publication are subsequent
  gates, not preasserted.
