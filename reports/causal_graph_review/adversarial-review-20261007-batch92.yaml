adversarial_checks:
- Fresh both-root baseline preceded source reading; all four whole records and five original nodes/one arrow accounted
  for. One record unchanged and three scoped repairs. No density-driven invented graph structure.
- Pu'er remains an association-only community outcome. ROAV/VIP ranking, temporal metabolite correlations and broad-pile
  bacterial predictors do not establish member-specific production or cross-kingdom causal exchange. Its bytes,
  earlier removed succession node and cultivation fields remain untouched.
- QY2 keeps the authors support hypothesis with PARTIAL evidence. The exact primary discussion treats methanogens
  as potential hydrogen consumers; neither the broad donor sentence nor absolute16S establishes exchange or product-removal
  feedback. Current SYNTROPHY does not require obligacy. No intrinsic-organism node or extra topology restored.
- SCDY1 retains supported host growth without translating recoverability into reciprocal benefit or zero effect.
  No COMMENSALISM fallback, root-hair mediator arrow or previously removed nodes. The graph quote independently
  matches the official preprint API abstract; the accepted abstract corroborates the outcome but is not final formatted
  full text. No claim that unread controls are absent.
- RH1 retains compatibility, glyphosate/TOC endpoints and prior single-strain comparison context. Aggregate benefit
  is not member fitness. Methods2.4 processed the TOC samples, and the balanced reaction is predicted; neither resolves
  empirical carbon fate. Removing the direct arrow does not deny biodegradation, mineralization as a possibility,
  or the measured91.03% endpoint.
- QY2 and RH1 complete primary main bodies read; Pu'er main body read from existing primary extraction; SCDY1 abstract-only.
  No figure-pixel, raw-data or full supplement audit. Fresh source access and cache-only evidence explicitly differ.
  No access-control bypass, new wet-lab protocol, growth optimization, genetic design or paid Edison submission.
- All existing discussions and curation events preserved semantically; three new append-only histories. All prior
  tracked history and decision files byte-identical. Non-graph raw blocks,457otherrecords and921caches unchanged;
  canonical participant assignments and measured legacy census unchanged.
- Seven new regressions, four focused schema/strict/term/reference/snippet gates and three history validations.
  All56existingwarnings unchanged with zero structural defects. Deterministic HTML and exact description parsing
  are not browser screenshots; generated-model loader1703 remains outside certification.
- All-state issue dedup and ignored-inclusive local search recorded, with explicit exclusions. Repairs1746/1747/1748
  remain open until protected-main merge; no claim of independent approval or corpus completion. Prior unanswered/denied
  provider scopes are unchanged.
