limitations:
- Fresh post-schema before-paper two-root baseline:460records,921caches,1435nodes598arrows,48warnings and zero structural
  defects. Nine original nodes/six arrows reviewed; seven biological nodes remain and no arrows. Two empty graphs
  remain explicitly needs_research, not certified complete.
- Four independent primary abstracts and all four existing target caches read. Primary main texts remain inaccessible;
  publisher previews are not full texts. Open companion PMID37154752 main text read, but its all-Shewanella 60transfer/180day
  experiment cannot establish exact CR/DR primary methods. No paywall bypass.
- 'Both openly linked pine supplements read: all six PDF pages visually inspected after local rendering, XLSX tables
  S1/S2 parsed as cells. Phomopsis plates, cell-free urediniospore inhibition and pairwise compatibility are distinct
  assays. Small publisher main-figure previews were downloaded but not used for numerical claims; main figures/full
  methods not audited.'
- Preserve denitrification/productivity/stability positives and ecological decomposition, without dominance intervention
  or compound-resolved niche claims. Remove workflow nodes and noncausal directions; biological direction research1706remains
  open.
- Preserve pine compatibility, selected-isolate inhibition, pot growth and PPO/POD increases. Remove reciprocal
  mutualism, unsupported trait mediation and two isolate-to-host arrows. Explicit participants distinguish three
  screened final-community isolates from all five pot/compatibility members; species-sharing OB3/NA3 remain distinct
  labels. No disease-control or priming proof.
- Beverage/refinery discussion-only edits preserve positive endpoints without adding structure. Whole-beverage mouse
  response is not human benefit or specific-metabolite mediation. Pico monoculture wins oil/grease removal; ambiguous
  lipid/seed treatment arms remain unassigned. New structure1707/1708requires reviewed scoped Edison report.
- All921caches,456otherrecords and raw non-graph blocks unchanged. Four append-only histories and concrete curation
  events. Existing non-graph claims preserved, not certified; metadata1709remains open. Denitrifying YAML alias
  is preserved outside graph without mutation leakage.
- Dedup current all-state issue titles/bodies and ignored/hidden local searches with explicit .git/docs/site/references_cache
  exclusions; target caches separately read. Closed1116/1117/1118bodies read. Comments/PRs not exhaustive.
- Three single-community Edison causal dry runs:11340/7735/8529characters, zero provider jobs or credits. Scoped
  request unanswered; initial generic authorization and prior denied scopes do not authorize these jobs. Repair1704/1705close
  only after protected-main merge;1706-1709remainOPEN.
- Validation/rendering outputs are recorded separately, not preasserted. Self-adversarial review is not independent
  approval, whole-record certification or corpus completion. Protected merge and dependent-safe branch cleanup remain
