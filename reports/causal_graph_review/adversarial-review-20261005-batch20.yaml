adversarial_checks:
- 'Every original node and arrow accounted for: eleven nodes retained, five exact renames, three arrows retained/qualified,
  three removed, none added.'
- 'Challenge abstract-only hydrogen skepticism with the primary ammonium intervention: retain its positive support
  while not treating it as complete partner-resolved gas flux.'
- Keep enhanced hydrogen relative to C. cellulovorans; Methods use different monoculture carbon substrates. Nitrogenase-linked
  proton reduction is not measured N2 fixation under argon.
- Do not encode transcriptomic covariance itself as metabolite exchange or as an isolated output driver; keep supported
  VFA supply and qualified pH feedback.
- Distinguish engineered fluorescence-label assays from identified native nutrient transfer, shuttle necessity,
  and causal growth mediation.
- Keep the cell-free N. vulgaris/E. coli supernatant control; it supports a soluble effect without simultaneous
  contact with C. acetobutylicum, not complete independence from upstream partner interactions.
- 'Check the actual COMPETITION definition (-/-): the early E. coli phase is not measurably harmed in the reported
  comparison. Preserve authors'' passive-competition interpretation without asserting that type.'
- Retain supported lactate uptake in binary culture and filtered E. coli supernatant; do not erase the metabolic
  interaction when qualifying other mechanisms.
- Second-phase optical-density doubling estimates and genomic copies/ng DNA are not direct species-resolved live-cell
  doubling counts. Preserve the authors' growth-phase interpretation with these assay bounds.
- Keep both syngas metabolic links, making the C. kluyveri-to-C. ljungdahlii direction explicitly proposed acid
  supply, not reversed ethanol supply.
- Coculture alcohol output does not imply alcohol donation to C. kluyveri. The reducing-organism assignment remains
  inferred; discussion of C. kluyveri alcohol capability does not quantify its contribution in this reactor.
- The two-thirds ethanol figure comes from stoichiometric reconstruction; do not treat net products or calculated
  total production as directly traced interspecies flux.
- Correct named butyrate/hexanoate anions using official ChEBI conjugate relationships, while retaining pH-dependent
  undissociated acids in the mechanism discussion.
- One reactor, altered medium flow, phased pH values and operational disturbances are not independent replicated
  pH treatments or proof of reciprocal fitness competition.
- Participant list is exactly the two existing canonical syngas taxa; full connectivity tests and the exact registry
  guard run without weakening bounds.
- Unrelated metadata remains byte-preserved and not scientifically certified; issue1333 and existing746 remain open.
- Selected publisher primary sections plus two full primary main bodies reviewed. No figure-image/supplement review
  or independent approval is claimed. Caches unchanged, full copyrighted body not added.
