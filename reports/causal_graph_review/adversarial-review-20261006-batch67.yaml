adversarial_checks:
- Read all three whole records,13 original nodes and11 arrows, including the zero-arrow root graph. Retain13
  nodes, qualify8 arrows, remove3 unsupported links; no new structure. Previous root workflow-edge removals
  preserved. Read three complete fresh primary main texts/captions and root embedded SI methods/Table
  S1, not separate datasets, original figure pixels, raw data or executable analyses. Protocol BioProtoc.2885
  and the prior drought genomic paper not independently reviewed.
- 'MBOA conversion remains a positive experimentally supported result: LMB2 dropout blocks marked degradation;
  other single dropouts retain HMPAA; five of six pairs produce HMPAA with Bacillus exception. Extracellular
  AMP was detected in a separate replicated assay. Do not erase these findings because BxdA export/localization
  and partner acetylases remain unresolved.'
- Main MBOA metabolite profiles pool triplicates (n=1) and have instability/precipitation/unmeasured-product
  limits. They do not establish quantitative flux or carbon balance. HMPAA-specific detoxification was
  not selectively tested. Retain PARTIAL conversion-to-performance interpretation without certifying HMPAA
  toxicity, universal cross-feeding or all-member growth.
- MBOA relative 16S shifts include increased susceptible LMN1 and less LST17 decline in metSC. Relative
  fractions and extraction bias do not measure absolute member growth or establish the composition-to-performance
  mediator. Remove that arrow. Separate minimal-medium bulk OD from complex-medium OD/CFU; both communities
  are inhibited at higher MBOA. No field maize benefit inferred.
- Drought SynCom comprises17 community-based isolates/23 OTUs, with unresolved canonical Bacteria placeholder
  and missing host.53-day four-plant root profiles support condition-specific enrichment, not all-strain
  viable persistence to117-day harvest.632 resident OTU changes do not validate family-level literature-assigned
  benefits or mediation.
- ABC transporter enrichment is prior genomic potential reported in the Discussion, not current drought-induced
  gene expression, measured osmolytes or traced transfer. Remove colonization-to-gene-content causality
  but retain the authors candidate plant-osmolyte route as HYPOTHESIZED and COMPUTATIONAL/PARTIAL evidence.
- 'Temperature response is not universally cooling: late-drought72-79DAS inoculated plants are warmer
  across hybrids; sap-flow direction also varies. Retain treatment effects and qualified physiology-to-recovery/yield
  links without claiming measured stomatal aperture or selective mediation.'
- Severe-drought imaging withdraws water50-84DAS; sensor/yield assay uses reduced irrigation and rewaters80DAS.
  DKB never visibly bent before rewatering, SX recovers sooner but has no significant grain-yield benefit,
  and P3707 recovery is qualitative. Remove recovery-to-yield chronological arrow across assays. Retain
  significant DKB/P3707 drought grain yield, not universal three-hybrid benefit or generalized biomass
  promotion.
- Root E.cloacae dropout changes absolute CFUs of multiple taxa, with C.pusillum overgrowth and other-member
  loss. Unplanted agar does not show takeover. This is a strong conditional community keystone perturbation,
  not a demonstrated pairwise competition assay. Keep the seven bacteria and host explicit; do not infer
  a molecular route or universal stability from15 days.
- Root fungal biocontrol is supported by delayed seed colonization, reduced disease and separate agar
  inhibition. Colonization differences become nonsignificant at day10; all individual species protect
  less strongly, so retain community benefit without declaring each necessary, synergy, resource competition
  or immune activation. Add existing canonical host to participants, not new taxonomy.
- 'Review complete biological diff and eight focused tests; guard alias isolation so graph evidence changes
  do not alter engineering/taxonomy evidence. Retain broad supported GO:0044419 context even when a specific
  mechanism is unresolved; remove only ungrounded growth/immune-specific process annotations. Clarify
  that absent proof of compositional mediation is not proof that mediation is absent. Archive the completed
  initial validation pass and rerun all checks on final content. Preserve457 other records,920 caches
  and raw non-graph blocks. One curation event/history per target, previous events semantically preserved.
  Metadata #1580 remains unresolved, coordinated with existing #615 and prior #529 cultivation distinction.'
- Actual schema, strict, term, reference, snippet, history, network, deterministic rendering and regression
  outputs recorded.16 graph excerpts match fresh primary text with whitespace-only normalization; this
  does not certify historical cache/non-graph provenance. Root full text read as public PMC HTML after
  XML endpoint HTTP500, not access bypass or a CC-license claim; full primary sources remain scratch-only.
- 'Measure connectivity change, do not silently claim unchanged coverage: mixed124->123, community-only267->268,
  solely-rule credit1238->1240, canonical taxa1507 unchanged. All46 existing network findings remain exactly,
  with zero structural errors. No auditor-rule adjustment. Exact descriptions parsed over456 pages, not
  screenshots; post-commit docs-current is separate.'
- 'Dedup870 all-state issue titles/bodies and26 scoped ignored/hidden local matches; relevant full issues/histories
  and additional aliases checked, not every PR/comment/artifact. #1577-#1579 addressed but OPEN pending
  protected-main merge. #1580 stays OPEN after graph merge. No provider spend. Exact-head COMMENT self-review
  is not independent approval; corpus work remains unfinished.'
