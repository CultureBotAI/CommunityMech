  results not independently recomputed. BioProtoc.2885 and the drought paper cited prior genomic study
  not independently reviewed.
- 'MBOA: preserve dropout, paired-culture and extracellular AMP evidence. Pooled main profiles are qualitative
  n=1; transport, acetylase, HMPAA toxicity and member-specific carbon use remain unresolved. Relative
  composition does not isolate growth mediation.'
- Drought:53-day relative root OTUs are not all-strain viable persistence. Prior genomic transporter enrichment
  is not induced activity or demonstrated exchange. Resident benefits and physiological mediation remain
  hypotheses. Late-drought temperature is higher; recovery and sensor/yield experiments differ, and yield
  benefits two hybrids, not SX.
- 'Root: absolute CFUs and unplanted controls establish a host-dependent community keystone effect, not
  direct pairwise competition. Fungal biocontrol is positive but colonization differences converge by
  day10; molecular, immune and competition mechanisms are untested.'
- 'Canonical taxonomy and raw non-graph blocks preserved, not recertified. Incomplete MBOA/drought rosters
  and missing drought host remain explicit; #1580 metadata follow-up stays OPEN and coordinates with #615.
  Prior #529 cultivation distinction preserved.'
