adversarial_checks:
- Fresh baseline across kb/communities and data/isolates preceded papers. Whole records and every12existing node/4arrow
  were read. One cross-study arrow removed and three bounded arrows retained. Sparse graphs remain in scope; topology
  is not invented to satisfy density.
- Oak Ridge has real isolate perturbation evidence for field selection, not merely a correlation. Preserve eight
  resistant contaminated-well Rhodanobacter isolates and186uncontaminated-well comparator isolates, recognizing
  provenance confounding. Neutral-pH resistance of some Pseudomonas strains prevents a universal genus-susceptibility
  claim.
- Low pH plus seven metal ions is eight selective ions including protons. Nitrate is correlated/toxic but not selectively
  inhibitory in the assayed pair; it may be an electron acceptor. Organic carbon and speciation alter thresholds,
  and no direct in situ perturbation was done. Preserve the selection arrow with these limits.
- Correct uranyl to official ChEBI43515, not free uranium6+. Remove the unproved species-specific source annotation
  from genus enrichment while preserving canonical taxonomy. Field clone-library redox potential is not flux or
  cross-feeding; remove tolerance-to-redox-guild coupling between different studies. Do not transfer isolate R2A
  culture conditions to the field community.
- Ogataea growth complementation is a positive result on glucose and methanol. The27.3-28.5range covers two pairs
  and does not establish significant superiority over FY00; methanol remains below FY00. Distinguish fluorescent
  tracking derivatives FY31/FY34 from all screening strains, preserving canonical labels and OD600medium evidence.
- Retain the directed sulfur-exchange model as hypothesized. Single-strain supplement rescue proves differential
  use of the tested compounds, not secretion or transfer. No rescue by sodium sulfide is not proof of a particular
  toxicity mechanism. Figure1/5schematics do not override the explicit isotope/metabolomics research gap.
- 'Controlled initial ratios affect growth: low initial met10fraction gives higher biomass, high met10ratios grow
  weakly while remaining biased. Endpoint met10bias is not necessarily increasing fraction in every culture, identical
  final ratio, equal establishment or long-term stability. Keep ratio biology without an unisolated mutualism annotation.'
- Okeke isolate filter-paper cellulase, beta-glucosidase, xylanase and beta-xylosidase are positive measured results,
  and five-isolate consortium construction is retained. Accessible abstract proposes broad processing benefit rather
  than quantifying synergy. Keep both contribution arrows as hypotheses; no obligate syntrophy, lignin degradation
  or demonstrated product-inhibition relief inferred.
- Okeke normal publisher subscription preview and field publisher403 are respected. Inaccessible full text does
  not prove experiments absent. Three full primary main bodies, captions and three further abstracts read; no separate
  supplements, original figure pixels or raw datasets inspected. Whitespace-only primary/cache matching verifies21quotations
  but does not replace entailment review.
- Rumen Group41 preserves significant66.84%48hNDFD and20.56%reported relative improvement. Null DMD/gas in optimized
  five-member group must not inherit initial seven-member gas improvement. Concentrations are added-suspension descriptors,
  not final-bottle doses. Filtration-sterilized rumen fluid is not silently recast as a native living microbiota
  inoculum.
- Rumen CAZy/COG/KEGG annotations,47GH/19CBMfamily breadth and existing Fig7evidence survive. These predict function
  without measuring expression, metabolic exchange or pathway mediation. The in vitro-to-cattle workflow arrow stays
  removed.
- Cattle DM/NDF/ADF72htrends are nonsignificant despite broader source conclusions. Preserve early negative and
  later positive VFA effects, null propionate and lower NH3-N. Six cattle means three animals per treatment, not
  nine independent animals from three bags each. No durable engraftment or gene-to-outcome causality asserted.
- All456other records,920caches, canonical membership and raw non-graph blocks preserved; four new append-only histories.
  Prior258/650/981/1149/1150/1151repairs maintained. Metadata1658 remains open, including documented provenance-vocabulary
  inconsistency despite passing baseline gates; no nonexistent validation failure claimed.
- Ogataea missing topology remains1656with one11815character Edison LITERATURE dry run, zero provider submissions/credits
  and unanswered scoped approval. Okeke authorized full-text review remains1657. Repair1652-1655issues stay OPEN
  until protected-main merge; research/metadata remain afterward. Self-review is COMMENT, not independent approval
  or corpus completion.
- All focused gates, both-root inventory/network/rank, related regressions and deterministic rendering have actual
  logs/digests. Exact descriptions parsed across456pages are not browser screenshots. Postcommit docs-current and
  remote exact-head COMMENT are separate publication gates; protected lifecycle must preserve dependent branches.
