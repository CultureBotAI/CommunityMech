limitations:
- Fresh pre-paper baseline covers460 records and920 caches across both roots, including ignored/hidden files. Every12
  existing node and4arrow was reviewed;12nodes3arrows remain. Four guarded repairs/history events;456 other records
  and all920 caches unchanged.
- 'Three complete primary main bodies read from fresh Europe PMC XML: metal-tolerance, Ogataea and rumen papers.
  Captions read; no embedded main-text tables in these XML files. Field clone-library, Rhodanobacter taxonomy and
  Okeke sources read at primary-abstract scope. No separate supplements, raw datasets or original figure pixels
  audited.'
- Normal Okeke publisher access confirms subscription preview; field publisher403 and Microbiology Society full-text
  delivery failure respected. No access restriction bypass. Existing Okeke cache is abstract-only; inaccessible
  full text does not establish absence of experiments.
- All21 graph quotations independently match primary text and unchanged cache with whitespace-only comparison. Literal
  matching is not entailment. Early oversized combined/cache reads were truncated; fresh main texts were read in
  bounded chunks, and no absence finding relies on truncated output.
- Oak Ridge retains experimentally supported selection, not mere unqualified correlation. Isolate provenance, pH,
  mixture effects, organic matter and ion speciation bound transfer to field conditions. Nitrate toxicity was not
  selective in the strain comparison; genus enrichment is not species identity or redox flux. Official ChEBI confirms
  uranyl is43515, not free uranium6+.
- Ogataea retains cooperative growth, actual nutrient rescue and controlled ratio effects. Directed metabolite exchange
  is hypothesized, not measured. Two-pair OD range, methanol shortfall, distinct labeled tracking strains and weak-growth
  high-met10 ratios are explicit; endpoint bias is not identical convergence or long-term stability.
- Okeke positive isolate hydrolases and five-member construction remain. Both proposed hydrolytic-contribution arrows
  are retained as hypotheses; accessible abstract does not quantify synergy, product-inhibition relief or lignin
  degradation. Full-text acquisition remains needs_research, not a declaration of no experiments.
- Rumen significant optimized in vitro NDFD, predicted gene complement and time-dependent cattle fermentation are
  preserved. Initial seven-member gas effects differ from final five-member null gas result. Inoculum is not final
  bottle concentration; bags are subsamples of three cattle per group. Nonsignificant72h fiber trends are not proven
  improvement. No genome-to-outcome or workflow arrow added.
- One Ogataea Edison LITERATURE dry run used zero provider submissions/credits. Scoped paid question unanswered.
  Missing input/outcome and exchange-to-rescue structure stays1656; Okeke full-text follow-up1657 requires its own
  workflow if new topology becomes justified. Earlier denied/pending scopes unchanged.
- Dedup searched933 all-state issue titles/bodies and25 ignored/hidden-inclusive local matched files, excluding
  git/docs/site/cache. Matching258/650/981/1149/1150/1151 read; no exhaustive PR-comment audit. Prior field-community,
