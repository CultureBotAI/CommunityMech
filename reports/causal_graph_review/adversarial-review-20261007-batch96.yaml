adversarial_checks:
- Fresh both-root baseline preceded paper reads. All four whole records,16originalnodes and10arrows accounted for;14nodes6existingdirections
  retained,2nodes4arrows removed,4nodes renamed. No new topology.
- Rifle early uranium loss and Geobacter association are retained separately from later sulfate/sulfide observations
  and increasing groundwater uranium. The prior sulfide-to-continued-immobilization arrow is contradicted. No nanoparticle
  size/product, pairwise mutualism or species-resolved enzymatic flux survives in graph attributes.
- Rifle Anaeromyxobacter evidence points to a Geobacter uraniireducens transcriptome and another field site; two
  Oak Ridge sources, high-salinity enrichment and a D. hippei isolate are not exact Rifle membership or exchange
  evidence. Two unsupported nodes are removed without asserting these organisms/reactions can never occur. Succession
  is measured; Fe(III)/acetate mediation remains hypothetical. Unspecified participants do not certify all canonical
  taxa.
- Rumen composition, CMC core selection and xylan caproate remain positive evidence. Separate enrichment lines do
  not resolve within-community niche partitioning, reduced competition or hydrogen/methane flux. The existing direction
  remains PARTIAL. Earlier discussions and non-graph evidence are preserved.
- SF356 positive metabolite/oxygen feedback and its existing directions remain, as do FG4 acid-associated inhibition
  and Brevibacillus suppression. Reciprocal harm is not established by suppression alone, so COMPETITION is removed.
  Current SYNTROPHY requires product-removal metabolic feedback, not obligacy; oxygen facilitation is not automatically
  syntrophy. Aerotolerance prevents an absolute zero-oxygen assertion.
- Adversarial diff review caught the FG4 node retaining a CSK1 pairwise target despite a community-level endpoint.
  It is now COMMUNITY_LEVEL with FG4 source and no target. A second curation/history event records the fix, preserving
  the initial history. The initial validation was interrupted after23completed outputs; all final gates rerun. A
  focused regression protects the corrected scope.
- SIHUMIx small-protein expression, computational exchange and transit-study SCFA output remain separate observations.
  rxn15467 is a neighboring-enzyme perturbation, not a BP5 knockout. Genomic proximity does not establish BP5 mediation;
  remove both causal bridges. Exchange remains explicitly COMPUTATIONAL/PARTIAL, bulk SCFA is not measured cross-feeding,
  and community-only detection is confounded by cultivation conditions.
- The positive synthetic-CR2 lag/cell-size finding is acknowledged without claiming native-community action or colonization
  facilitation. No new CR2 graph node is added. Transit Results/abstract support the output direction; inconsistent
  discussion BCFA wording is explicitly recorded, not silently combined.
- Rumen complete fresh main text and captions, selected SIHUMIx/transit primary sections, cached Rifle main text
  and fresh primary abstracts read with explicit access limits. No figure-pixel, supplement or raw-data certification.28graph/new-discussion
  quotes match fresh primary text and unchanged caches; literal matches are not entailment. Rifle cached body is
  not fresh independent full-text verification; XML failures and PMC challenge were not bypassed.
- Four records changed;456unchangedrecords,923unchangedcaches and all non-graph raw blocks preserved. Five append-only
  histories including the scope correction. Canonical taxonomy not recertified. No participant-slot fixture change
  is needed. Actual connectivity census is recorded, not treated as ecological evidence.
- Eight focused tests and880combined regressions passed, all four whole-record gates and five history gates executed.56network
  warnings unchanged and zero structural defects. Deterministic rendering and exact HTML description checks are
  not screenshots; postcommit docs-current is a separate gate. macOS passes do not certify Linux DOI-cache casing1091
  or loader1703.
- Fresh all-state issue title/body and ignored/hidden-inclusive local dedup have stated exclusions; matching prior
  issues read, PRs/comments not exhaustive.1766-1769 stay open until protected-main merge;1770 remains separate
  non-graph work. No provider spend, new wet-lab protocol or protection bypass. Self-review COMMENT is not independent
  approval; corpus remains incomplete.
