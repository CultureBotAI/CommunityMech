adversarial_checks:
- Before papers, fresh two-root baseline covered460records/921caches,1438nodes600arrows,47warnings0structural. Every
  original node/arrow and missing structure reviewed in four whole records:12retained nodes/6arrows and3removed
  nodes/2arrows have dispositions. No new node or downstream arrow.
- Diatom SEM attachment remains positive. Filamentous EPS identity/source and attachment-mediated physiological
  damage were not established. Amino-acid competition is an author hypothesis from nutrient/pigment observations,
  not measured amino-acid exchange. Medium-matched HAC supports negative coculture physiology; broth enrichment
  is not a demonstrated bacterial growth benefit.
- Late physiological controls exist, while day8axenic transcriptomics does not. Diel gene counts do not prove endogenous
  clock disruption; transcript-constrained biomass flux and ICA modules are model/association outputs. No competition-to-clock-to-flux
  path is invented. Additional physiological/diel structure remains1698research.
- 'All three phenol arrows retain positive perturbation/conversion support: BES and highH2block degradation in the
  methanogenic culture. Hydrogen is supported without excluding formate. AQDS enables acetate production under methanogenic
  inhibition, but axenic isolation failed. The alternative Desulfovibrio culture is not added to the canonical pair.'
- Phenol intermediates support a proposed carboxylation/dehydroxylation route, not identified enzymes or aromatic-carbon
  transfer to the methanogen. Acetate remains an organic product and Table2has residual substrate at100days. Rename
  mineralization to conversion; do not downgrade the measured product phenotype. Existing CHEBI30746parent-acid
  grounding is explicitly labeled, not silently reassigned.
- Phormidium protein/SIP genuinely supports cyanobacterial carbon flow. Major heterotroph peptide coverage is WenzhouxiangellaMAG57andPhycisphaeralesMAG34;
  explicit canonical participants do not credit every member of their phyla. Lag supports a macromolecule-use interpretation,
  not identified protein/glycogen transfer or a trophic cascade. Do not assign all fermentation substrates to Wenzhouxiangella.
- Phormidium Figure3is explicitly gene-content inference. Verrucomicrobiota hydrolases/sulfatases support a polymer-use
  hypothesis, not Planctomycetota-to-Verruco transfer. MAG58isotope signal has lower peptide coverage, while alpha
  bacteriochlorophyll genes are capacity, not measured phototrophic flux. Canonical taxonomy is unchanged.
- Vitamin/cofactor delivery, ROS protection and nutrient return were unsupported exact-community nodes using general
  introductory examples. Their three nodes/two arrows are removed with rationale, not treated as negative experimental
  results. Unrelated tetrapyrrole nutrient-cycling GO and untested mutualism removed. Bacteroidota disconnection
  remains visible and tracked1699; no fabricated link for audit credit. Long-term crash-free culture does not establish
  static membership or redundancy mediation.
- Phosphite H2-mediated partnership and both donor-to-methane arrows survive. BES/highH2inhibition and G11rescue
  support lowH2sink dependence. HndABCD/Rnfdetails remain a metaproteomic/thermodynamic model, not an enzyme perturbation.
  Net oxidation is exergonic; the proposed bottleneck concerns intracellular energy conservation. Methanoculleus
  is the sink actor, not the donor. Acetate assimilation is distinct from methane carbon.
- Phosphite enrichment had seven taxa with acetate/sulfide and sixteen with cysteine, not a pure two-member culture.
  The physiology-supported sink-to-donor feedback candidate is recorded without adding unreviewed topology;1700remains
  research and1701tracks raw non-graph composition/identity claims.
- Three fresh full primary main texts and one cached phenol primary read, with actual access limits recorded. PhormidiumPDFpages8/11visually
  inspected for Figures3/4. Separate supplements/raw data and other original figures uninspected. Failed HTTP500/BioCNoresult/browser-check
  responses are not full text. Eleven graph quotations match fresh primary and seven use cached phenol; eight new
  discussion quotations also checked.
- All921caches,456otherrecords and raw non-graph blocks hash-verified unchanged; four guarded curation events and
  append-only histories. Schema/strict/terms/references/snippets/history pass; actual broad regressions, deterministic
  renders and exact published descriptions recorded. HTML parser checks are not browser screenshots.47priorwarnings
  preserved plus one Bacteroidota disconnection; no structural defect or auditor-rule change.
- Dedup969all-state issue titles/bodies and hidden/ignored local search with declared exclusions; comments/PRs not
  exhaustive. Three scoped one-community Edison dry runs, no provider job/credits; questions unanswered and prior
  denials unchanged. Repairs1694-1697close only after protected-main merge;1698-1701remainOPEN. Self-adversarial
  COMMENT is not independent approval. Move dependents before deleting parents.
