adversarial_checks:
- Whole records and complete graph diffs checked against cached primary main bodies. All nine existing
  nodes retained, five arrows retained with bounded descriptions, one unsupported workflow arrow removed.
  Three renames and all corresponding targets/anchors resolve. No new structure or Edison spend.
- Electrosynthetic AS and CS are alternative pairs, not a measured three-member consortium. Canonical
  Andreesenella acetica label preserved. The community-level output roster denotes the comparison set,
  not co-occurrence of both acetogens.
- Electrochemical/spectral readouts, riboflavin add-back and compartment removal support route models
  but do not uniquely establish contact-only DIET, specific cytochrome necessity or donor-resolved hydrogen/formate
  flux. Hydrogen is not exclusive to one pair. Apparent instantaneous fractions are not cumulative mass-balanced
  flux.
- 'Applied cell voltage is distinct from referenced cathode potential; open-circuit H2/CO2 differs from
  driven N2/CO2. Product enhancement does not establish obligatory syntrophy or reciprocal fitness. Do
  not transform DNA/gene-abundance readouts into transcription without the unread supplement. Non-graph
  wording remains #1455.'
- Emiliania nutrient support and CFU growth are not a selective cause of the specific tryptophan/IAA response;
  remove that workflow arrow. CFU may count rosettes. Exudate bioavailability plus isotope conversion
  of added precursor in bacterial culture does not trace the complete endogenous algal-bacterial-algal
  flux.
- 'IAA was undetectable in coculture; exogenous micromolar responses are not local exposure measurements.
  Mutants retained IAA and bleaching, so necessity is unresolved. Keep observed host promotion/death and
  a HYPOTHESIZED mediation arrow without predation or unique death-pathway claims. Preserve the two-member
  roster: E. coli reporter and CCMP372 comparator are not members. Non-graph IAA/cultivation wording remains
  #1456.'
- Gut consortium rescue is unequal, including absent B. fragilis rescue in tested supernatants despite
  growth in coculture. Keep measured nutritional dependence without a complete all-to-all flux map or
  dedicated transporter. Preserve canonical AMBIGUOUS grounding and do not add engineering procedures.
- In-vitro Bayesian network edges are net inferred effects, not direct molecular transfers; weaker support
  for negative interactions is not their absence. The interaction-shift-to-evenness link is PARTIAL in
  vitro and HYPOTHESIZED in vivo. Separate trajectory, supplementation and mouse-gut assays.
- 'Gut evenness is a day-10 fecal DNA-qPCR endpoint in a four-member gnotobiotic model. Low-protein comparisons
  were significant; standard-diet trend was not. Do not claim longitudinal stability, conventional microbiota,
  measured in-vivo flux or clinical benefit. Non-graph access note remains #1457; cache pointer/casing
  remain #1094/#1091.'
- Guarded writes, append-only histories and llm-assisted events. Canonical taxonomy, original Emiliania
  YAML anchor/alias, non-graph raw blocks, 457 other records and 920 caches unchanged. Two participant
  registry entries added, 185 to 187; connectivity census and numeric bounds unchanged.
- All 33 baseline network warnings exactly preserved, zero structural errors. Repeated rendering deterministic,
  with exact published descriptions checked across all 456 community pages. Eight new tests plus combined
  regression coverage pass on the final tested bytes.
- Actual validation outputs, digests and pre-research baseline retained. Reference validator 0.1.7 performs
  zero checks; explicitly a no-op. Snippet MATCH is textual, not scientific validation. The two preflight
  excerpt corrections and the initial test-key failure are disclosed.
- Deduplication covered 772 all-state issue titles/bodies and ignored/hidden-inclusive local files, not
  all comments or PRs. Full cached primary main bodies read; no figure images, separate supplements or
  raw data. Only selected Emiliania peer-review discussion read; DOI copy not independently fully read.
  Live challenges were not bypassed.
- This is source-based self-adversarial review, not independent approval, protected merge or full-corpus
  completion. Non-graph issues remain open. Exact-head eligible CI and protected main queue are still
  required.
