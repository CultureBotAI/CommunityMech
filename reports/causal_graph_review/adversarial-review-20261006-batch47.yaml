adversarial_checks:
- Whole 374-line record and all four original nodes/two arrows reviewed. Complete 2018 primary abstract;
  complete cached 2020 main body, Methods, Tables 1-2 and embedded captions. 2018 full text unavailable.
  No figure images, separate supplements, raw data or analysis code inspected; attempted PDF screenshots
  failed.
- Correct the existing electron donor direction to Pseudomonas-to-Geobacter using canonical endpoints
  and the explicit 2020 Results interpretation, not the common but wrong assumption that Geobacter must
  always be the donor. This is an inferred direction in the described system, not a quantified flux.
- Retain positive omcZ/omcS growth-perturbation and phz-mutant-growth evidence from the primary abstract,
  not protein association alone. Preserve SYNTROPHY in the transfer node. The retained growth-enabling
  arrow is PARTIAL because exclusive route mediation, complementation and pleiotropic mutant controls
  were not established by the accessible material.
- Remove the early-growth-to-later-dominance arrow as serial-transfer chronology. Retain observed dominance,
  variant selection and protein changes without categorical COMPETITION, killing, variant-caused dominance
  or complete partner independence. qPCR and FISH scope and failed isolation attempts remain explicit.
- Later HybA/FdnG observations and hydrogen/direct-formate interpretations remain in the existing adaptation
  node and a focused knowledge gap. No measured flux, resolved route switch or extra causal edge is invented;
  no Edison job or credit spend occurred for this existing-structure repair.
- Separate added commercial PHZ-1-CA inhibitory capacity from endogenous Pseudomonas antagonism. Coculture
  PHZ-1-CA was below detection; this exposure did not select the reported variants, and variants also
  arose with phz mutants. Neither all phenazine effects nor every alternative mediator is excluded. Remove
  the unsupported PHZ-1-CA assignment from the adaptation node.
- Schema review identified a remaining experimental sequencing evidence item mislabeled as COMPUTATIONAL.
  Corrected before verification through the guarded writer, without rerunning append-only history. SWATH-MS
  and sequence observations are IN_VITRO; they remain distinct from mechanistic predictions.
- Main Methods and Results/Table 2 disagree on MIC duration units. The record does not silently choose
  a precise duration. No source-cache change or invented snippet was used to hide this limitation.
- Graph and test diffs inspected. All four nodes retained; two arrows to one. One guarded record, one
  append-only history and one regenerated community page. All 459 other records, 920 caches, taxonomy
  and non-graph raw blocks preserved, not certified.
- Schema, strict, terms, references, snippets, rank and history gates passed with actual output digests.
  All 34 network findings unchanged, zero structural defects. Repeat renders deterministic and descriptions
  parser-checked across 456 pages without a browser screenshot claim.
- Five new tests plus historical/shared regressions passed. Actual connectivity survey changes 388 to389
  community-level, 125 to126 mixed and1496 to1498 taxa; community-level-only263 and solely-credited1223
  unchanged. Participant registry194 to195. Only the corresponding mixed upper bound increases by one
  with issue rationale; production matching logic and all other bounds unchanged.
- Dedup includes798 all-state issue titles/bodies and ignored/hidden local files; no matching issue found.
  Not every issue comment or PR review inspected. Self-adversarial review is not independent approval;
  exact-head COMMENT, actual post-commit docs-current and protected main merge remain separate gates.
