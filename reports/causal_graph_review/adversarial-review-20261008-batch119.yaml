adversarial_checks:
- All20original nodes/10arrows accounted for:17nodes/10arrows retained,three nodes removed,nine renames,no new topology.
  Targets and discussion anchors resolve; no shortcut edge invented.
- THOR2022Methods explicitly identify UW101,not founding CI04. Keep UW101 inhibition,locus-dependent expression
  and three-member protection. One-sided inhibition is not bilateral competition. Expression percentages describe
  greater-than-twofold pairwise DEGs,not whole genomes. CI04 biofilm stays positive contextual evidence,not a UW101
  node; chemical mediation remains PARTIAL.
- TYQ1 retains all seven positive biofilm pairings with the SX attraction exception. Cross-feeding is medium- and
  direction-specific,with the AS reverse-use exception and rich-medium negative result. Carrying-capacity weights
  are not flux. Real strain omission remains positive experimental evidence,distinct from Gephi node removal; specific
  biofilm/exchange mediation remains PARTIAL.
- Teosinte formulation/preparation nodes removed while non-graph protocol remains. Reported field-treatment effects
  and both treatment arrows retained; no field-statistics reproduction claimed. Soil relative abundance does not
  track inoculant strains. Bacillus centrality is computational correlation,not microbial mutualism,measured nitrogen
  fixation or necessary function.
- mCAFEs is multiple enrichment communities. Carbon and transfer-interval interventions retain two selection arrows.
  Fast/slow is an operational abundance comparison,not measured isolate growth rates. Hub membership is not growth-class
  membership. Statistical hubs are not experimental keystones or validated PGP functions. Positive revival is bounded
  to five selected stocks,not all initial enrichments.
- Thirty-eight graph and five discussion quotes match five fresh primary texts and caches. Five complete main-body
  XML texts read,including methods,tables and captions; no original pixels,supplements,raw data or analysis-code
  audit. Matching is not entailment certification. One CC-BY4.0 cache receives four missing selected excerpts append-only,not
  a full-body import.
- Four guarded writes and append-only histories preserve456otherrecords,922caches,unrelated raw blocks and previous
  histories/decisions. Canonical taxon identities/ranks unchanged; source-identity limitations remain separate issues1926-1929.
  Shared evidence aliases detached before edits.
- Fifteen focused tests and twelve control/mutation/restored-control probes pass. Mutations reject bilateral competition,unbounded
  molecular mediation,CI04-to-UW101 transfer,erasure of positive biofilm/cross-feeding/omission evidence,unmeasured
  nitrogen fixation,experimental hub necessity,loss of observed selection and universal stock revival. No canonical
  writes during probes.
- All four records pass schema,strict,terms,full-record references,snippets,rank and history.1116selected tests
  including palette pass; not full Linux CI certification. Network57unchanged warnings,zero structural defects.456pages/1361nodes/523arrows
  exactly match descriptions with deterministic rendering,not screenshot QA.
- Participant-list users rise298to299 for THOR protection. Record-scope census remains414community-level,136mixed,278community-only,1568taxa;
  sole credit rises1280to1281 because Bacillus leaves the incorrect pairwise node and is named in three-member protection.
  Initial verifier expectation corrected after inspecting this delta; no graph or threshold changed to pass. Scope
  credit is not actual participant coverage. Connectivity logic and all thresholds unchanged.
- Issues1922-1925 addressed pending protected-main merge;1926-1929 remain open. No Edison extension or credits.
  Prior Ruegeria1883 still needs configured authentication and was not retried unchanged. Self-adversarial review
  is not independent approval; root1836 and real exact-head protected checks remain required.
- Corpus384reviewed,22pending,54needs_research across460records. Overall goal,protected merge and branch deletion
  incomplete. Postcommit docs-current and exact-head publication are separate gates,not preasserted here.
