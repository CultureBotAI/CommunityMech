adversarial_checks:
- Whole796-line Iberian,1174-line industrial and373-line milk records reviewed, including every original
  node and arrow. Complete cached2013/2020 pit-lake and2021 milk primary main texts, Methods, embedded
  tables and captions read. Fresh2023 industrial primary XML main text, Methods, Tables1-5 and captions
  read. No original figure images, external supplements, raw data or code audited.
- Cueva de la Mora2022 and chalcopyrite2014 bodies remained inaccessible; their primary abstracts were
  read, not full texts. Separate2009/2019 consortia, Acidiplasma genome and borehole studies were read
  at abstract scope. The Cuniculiplasmataceae review is background, not primary reactor evidence.
- Iberian NSC/Concepcion, Cueva de la Mora, FC/La Zarza and borehole findings remain distinct. Measured
  geochemistry and observed FC mineral particles are retained as positive evidence; biosulfidogenesis
  and taxon assignments remain models. Precipitated sulfides are not described as dissolved sulfides.
  No exact concentrations or mineral identity are transferred across lakes.
- Active Coccomyxa dominance is preserved without a quantified carbon-export rate. FC/La Zarza findings
  do not establish universal carbon limitation. Rare methanogen reads are not measured methane flux. Sulfide
  oxidation is assigned to the predicted archaeal role, not sulfate reduction; unrelated iron-transport
  and TCA annotations removed.
- Three Iberian arrows represented coactivity, reversed carbon-consumption direction or an unmeasured
  archaeal donor route. All five nodes remain with explicit canonical participants. No new graph node
  or arrow is introduced.
- Industrial early A. caldus and middle S. acidophilus population observations remain positive findings.
  A. caldus is not assigned ferrous-iron oxidation or rusticyanin. The previously omitted rather-than
  negation is restored. Copper extraction of60.4 percent at20 percent pulp density after more than two
  years of adaptation remains, supported by the result rather than a Methods snippet.
- F. thermophilum in2014 is not substituted with2023 F. acidiphilum/Acidiplasma genomes. The retained
  copper-output participants are explicitly a supported subset, not the complete roster. Leptospirillum
  nondetection is not extinction or an isolated toxicity experiment. Genomic metabolic potential and Ferroplasma
  co-detection do not prove partner benefit or complementarity.
- The2023 reactor profiles retain positive temperature associations with single-run, relative-abundance
  and operating-condition limits. Three invalid/cross-study industrial arrows removed; nine nodes remain.
  Canonical taxonomy and non-graph claims preserved, not certified. Issue1509 remains unresolved for exact-system
  identity, roster and valid regeneration structure.
- Milk retains both positive causal arrows grounded in the tclE-H deletion and omission experiments. About50-fold
  Kocuria change is preserved. Genetic evidence is not purified-thiocillin rescue; activity was mainly
  pellet-associated or unstable. The72-hour establishment comparison is not a mature-biofilm recovery
  time course or universal resistance to strong continuous changes.
- 'Milk strain-label variation is not silently normalized: canonical CLL49 remains. The Bacillus reference-culture
  substitution and prior529 cultivation-arm repair are preserved. No unsupported pairwise interaction
  categories remain on community nodes.'
- Full record diffs, all eight new tests, cache appendix and participant-registry diff inspected. Seventeen
  nodes retained; six arrows removed and two retained. Only graph, discussion and curation-history record
  fields changed.457 other records and raw non-graph blocks preserved.919 caches unchanged; one abstract
  gains24 source-verified words with exact XML hash, context and CC BY attribution; its original bytes
  remain an exact prefix.
- Actual schema, strict, term, reference, snippet, rank and history gates passed. Network equals baseline
  with34 existing findings and no structural errors. Repeat renders deterministic; exact descriptions
  across456 pages parser-checked, not browser screenshots. One participant registry entry added; measured
  connectivity census unchanged. Post-commit docs-current is a separate publication gate.
- Dedup searched813 all-state issue titles/bodies and20 ignored/hidden local files, with relevant matching
  contexts inspected, not every historical comment/review.1506/1507/1508 addressed but remain open until
  protected-main merge.1509 remains unresolved. This source-based self-adversarial review is not independent
  approval.
