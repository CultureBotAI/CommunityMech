adversarial_checks:
- Both whole records, all six original nodes and all four arrows reviewed. Complete primary main bodies/Methods/captions
  read for the two2014 studies and2023 T6SS study. Selected2014 figures inspected as specified in the
  ledger; no2023 figure images, supplements, raw data or code audited.
- 'Methanosaeta: replace environmental Geobacter/Methanosaeta concilii expression excerpts with independently
  checked primary abstract excerpts about the defined G. metallireducens/M. harundinacea coculture. Preserve
  positive DIET rather than demote demonstrated electron transfer to a generic hypothesis.'
- 'Methanosaeta: distinguish the donor reaction, interspecies transfer and CO2 reduction. Pili-associated
  initiation evidence is not a selective test of aggregate formation or direct measurement of conductivity
  in these defined aggregates. Receiver proteins remain unresolved; both retained directions are bounded
  to electron supply, not acetate-carbon routing.'
- 'Methanosaeta: resolve the obsolete primary-access biological question using the primary figures, while
  separately keeping the missing acetate graph branch OPEN under#1482. Roughly one-third CO2-derived methane
  is a bounded stoichiometric/radiotracer interpretation, not an all-methane claim or an exact universal
  fraction.'
- 'Methanosarcina: retain the positive DIET and pilin/GAC evidence. Correct direct ethanol-carbon-to-CO2
  wording; distinguish bulk methane from its CO2 route. Historical first-report wording does not mean
  timeless uniqueness, and DIET-only growth without acetate was not established.'
- 'Methanosarcina: preserve the exact hcp genotype/lag comparison but remove NICHE_PARTITIONING and unmeasured
  secretion annotations. Discovery RNA-seq and GAC/AQDS controls involve G. sulfurreducens. Pleiotropic
  EET changes prevent a selective T6SS-antagonism attribution; the retained negative arrow is explicitly
  HYPOTHESIZED and refers to establishment timing, not killing.'
- Do not import Methanosaeta radiotracer evidence into Methanosarcina. The Pelobacter/H2 comparator uses
  a different medium, not a selective same-medium H2 switch. The inspected Gmet1868 curve has residual
  methane; no new absolute zero-activity claim is added.
- Both acetate branches remain incomplete, not silently absorbed into a CO2 node or declared unnecessary
  for an easier passing graph. Both records remain needs_research under#1482/#1483. Separate dry runs
  are hash-bound and cost0; no provider report, paid-job execution or authorization is fabricated.
- Both graph diffs inspected. Two guarded records, two append-only histories and two regenerated pages.
  All458 other records, all920 caches, taxonomy, non-graph raw blocks and prior histories preserved. Stronger
  non-graph claims and the composite cached Methanosaeta Content are not certified.
- All per-record gates passed;31 snippets match unchanged caches. Reference canaries included, but DOI
  case-sensitivity and SupportingReference/provenance limitations remain explicit. Zero structural errors
  and all34 prior network findings unchanged. Repeat renders deterministic and descriptions parser-checked
  across456 pages without a browser screenshot claim.
- Six focused tests plus historical/shared regressions passed. Canonical endpoints and explicit participants
  preserved; registry and corrected connectivity census unchanged. No production auditor, ranker or census-bound
  changes.
- Dedup includes794 all-state issue titles/bodies and ignored/hidden local files;#1091/#751/#306 bodies
  read. No duplication of existing cache/validator issues. Not every comment or PR review inspected.
- Pre-source batch45 baseline and fresh pre-edit batch46 baseline distinguished. Selected record and all
  cache hashes match across them. Self-adversarial review is not independent approval, graph expansion
  completion or full-corpus completion. Exact-head COMMENT and actual post-commit docs-current remain
  separate publication gates.
