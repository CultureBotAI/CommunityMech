adversarial_checks:
- Fresh both-root baseline preceded source reads. Four whole records and all11nodes/7directions accounted for; all
  retained,5nodes renamed. No new topology or provider spend.
- Candida mutualism and directional biofilm facilitation remain. EPS evidence is IN_VITRO; the rodent carriage/lesion
  endpoint is COMMUNITY_LEVEL. The existing lesion arrow is PARTIAL mediation, not a proven human causal effect.
- Selenomonas entrapment and structure evidence is IN_VITRO. Retain experimentally supported S. mutans-to-S. sputigena
  facilitation and the structural direction. The primary matrix-disruption and ex-vivo evidence must not be erased
  as mere association. Mixed acidogenesis and rodent lesions are not recipient colonization measurements.
- Veillonella gtf expression and EPS fluorescence remain, without independently quantified enzyme activity or species-resolved
  cell abundance. Correct the in-vitro source, use named community participants for composite outcomes, and distinguish
  rodent intervention from adult human association. Both mediator directions are PARTIAL.
- Battery detoxification, EET and leaching remain. Beneficial detoxification does not establish neutral fitness
  of BS3 in the exact pair, so COMMENSALISM is removed. Predecessor comparisons and the final-consortium interpretation
  are distinguished; perturbation and riboflavin evidence is not a quantitative partition of direct/shuttle flux.
  Earlier scale-up discussion preserved.
- Adversarial diff review found that two newly explicit interpretation statements lacked direct result quotations
  at the node. Added source-matched Selenomonas structural and SO3 perturbation quotations, with two new correction
  histories referencing and preserving the initial histories. Both fixes preceded final validation; no interrupted
  attempt.
- All16graph and4new-discussion quotations match fresh primary text and unchanged caches. Candida XML retrieval
  failed; fresh abstract/PubMed captions and selected primary sections for the other sources were read. Truncated
  flattened cache output is not a complete cache-body read. No figure pixels, supplements or raw-data certification.
- Four records changed;456otherrecords,923caches, canonical taxonomy and all non-graph raw blocks preserved. Six
  append-only histories. No culture procedures, genetic designs or pathogen-enhancement instructions added. Non-graph1776
  remains separate.
- 'Connectivity census: records with community scope399->402,mixed125->128,taxa1536->1542,solely credited1266 unchanged.
  Exactly named two-member participant lists explain the change; narrow bounds updated with dedicated scope tests.
  Initial regression found an incomplete participant allowlist (887passed/1failed). Added exactly the three intentional
  users; equality guard retained. Failed output and initial snapshot preserved, complete regression rerun; unchanged
  earlier gates digest-checked on resume.'
- Eight focused tests and888combined regressions passed;44output records and digests retained. Whole-record gates
  and six history gates ran.56network warnings unchanged,zero structural defects. Deterministic rendering and exact
  HTML description parsing are not screenshots; postcommit docs-current remains a separate gate.
