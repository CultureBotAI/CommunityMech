adversarial_checks:
- Every original node and arrow reviewed against whole records and cited primary sources. Retain ten nodes/ten arrows
  with seven exact renames; no new structure or Edison job.
- Copper field DNA/rRNA supports abundance/activity, not species-resolved oxidation flux or selective competition.
  Ferroplasma approximately 10^3 copies/mL differs from late L. ferriphilum approximately 10^5.
- The indigenous 2009 heap is an open community with a 400-day cycle and mixed copper sulfides, not a closed five-member
  culture. Preserve conditional substrate/regeneration feedback, not unsupported syntrophy or niche partitioning.
- Separate 2018 A. caldus/L. ferriphilum/S. thermosulfidooxidans cultures at 38 +/- 2 C from 2022 monocultures including
  L. ferrooxidans, and from field genus-level Sulfobacillus RNA. Remove iron-ion-transport overannotation.
- 'Preserve measured lower-redox leaching advantage and nonmonotonic response: A. ferrooxidans retains iron oxidation
  under SX reagent despite copper recovery falling to abiotic level; Sulfobacillus low-dose recovery differs from
  high-dose impairment.'
- Stable A. thiooxidans DNA counts do not measure constant acid flux; RNA supports activity. General chemistry quoted
  from the 2022 Introduction is OTHER/PARTIAL, not an in vivo five-member assay.
- Coscinodiscus has real pooled amino-acid/vitamin supplementation assays. Preserve the three responders and CS4
  negative control. Do not substitute a genome-only account, individual B12/B3 rescue or demonstrated diatom donation.
- DMSP pathway BLASTP is computational homology with provenance, not measured consumption or DMS release. Carbon-only
  supplementation failure does not prove no catabolism.
- Remove unsupported cob(I)alamin exact-form assignment from the pooled supplement node while retaining specific
  genome predictions in bounded prose. Use existing amino-acid and vitamin-role annotations for the tested mixture.
- Preserve Crocei1 promotion, CS1 suppression, CS4/Rose1 neutral bacterial effects, and control-relative algal recovery.
  Do not assert one global mutualism/commensalism or reciprocal competition sign.
- Retain empirical all-member inhibition with late-survival nuance and generalized Lotka-Volterra model success
  using separate days 1-17 and 17-41 parameter sets. No bacterial-bacterial terms needed for this fit does not prove
  universal absence of higher-order interactions.
- Three brief Results quotes total 15 words. They were verified in the ASM-provided primary preview and remain absent
  from the abstract-only cache. Reference exit 1 and three MISMATCH diagnostics are preserved, not mislabeled passed
  or repaired by circular cache text.
- Four complete primary main bodies and three contextual abstracts reviewed. No figure images or supplementary files
  inspected, no visually validated OCR equations, no new full copyrighted body or PDF in git.
- 'Eight tracked cache artifacts, canonical taxonomy and unrelated raw YAML blocks preserved. Metadata followups
  #1358/#1359 and broader cache/link issues remain open.'
- 'Four intrinsic source-only scopes move four taxa from solely community credit while total canonical/community
  coverage remains 1499. Both records become mixed-scope. Initial regressions: 292 pass and one stale ceiling failure.
  #1360 changes only the ceiling 122 -> 124 and its explanatory comment; all other bounds, participant checks and
  connectivity behavior remain unchanged. The complete suite is rerun successfully.'
- Coverage is 123/460, not completion. This is source-based self-adversarial review, not independent approval or
  protected CI success.
