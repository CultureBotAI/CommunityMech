findings:
- issue: 1382
  severity: P2
  status: addressed_in_this_change
  finding: Recipient dechlorination was duplicated as transfer; sulfate-related inhibition was conflated
    with hydrogen competition.
  disposition: Keep three nodes/two arrows; source-only Dhc phenotype and conditional sulfide inhibition,
    with donor-excess and donor-limited systems distinguished.
- issue: 1383
  severity: P2
  status: addressed_in_this_change
  finding: Recipient remodeling was assigned as donor transfer and the required external DMB condition
    was incompletely represented.
  disposition: Keep four nodes/three arrows; source-only Dhc remodeling, measured transcript evidence,
    explicit canonical triculture and DMB coinput, with donor cobalamin production retained as an alternative
    contribution.
- issue: 1384
  severity: P2
  status: addressed_in_this_change
  finding: BAV1 phenotype was reverse cross-feeding and native cofactor insufficiency was signed as commensalism.
  disposition: Keep three nodes/two arrows; recipient phenotype and conditional cofactor compatibility,
    without active toxicity or exclusive cell-resolved route claims.
- issue: 1385
  severity: P3
  status: open_nongraph_followup
  finding: Non-graph measured transcript evidence classifications and supplementation-arm prose need separate
    curation.
  disposition: Metadata blocks preserved, not certified by this graph review.
- issue: 1386
  severity: P2
  status: open_nongraph_followup
  finding: BAV1/Fusaro medium conflates the cobalamin control, DMB rescue and strain-specific substrates.
  disposition: Metadata blocks preserved; source-access and exact-system limitations retained.
adversarial_checks:
- Actual scientific diffs read against primary sources at the recorded access scope. All ten original
  nodes and seven arrows retained; the one rename and exact anchors resolve. No invented new causal structure
  or paid research.
- Source-only PAIRWISE entries encode recipient capabilities under the existing schema convention, not
  self-edges or reverse exchange. The DvH fermentation and PfR7 corrinoid transfer observations remain
  positive.
- The roughly threefold rate comparison is not extended to cell yield. Sulfide-associated inhibition under
  donor excess is not inferred from electron allocation alone; the donor-limited butyrate triculture is
  not the lactate coculture.
- DMB is an external coinput on all three triculture arrows. PfR7 can form some cobalamin when DMB is
  supplied; recipient remodeling is not claimed to be the sole route. Measured expression is IN_VITRO
  and does not establish genetic necessity.
- Native factor-III insufficiency is not active toxicity. DMB rescue is conditional partner support, and
  direct compatible cobalamin can bypass the missing input. BAV1, GT, FL2 and different donor populations
  are not pooled into the curated pair.
- No figure images or supplements inspected. The 2012 source remains abstract-only; the 2013 source includes
  partial indexed main-body excerpts, not a complete body. Primary 2014/2017 text access and failed local
  PDF download are explicit. Textual MATCH is not scientific validation.
- Exactly three guarded writes, llm-assisted events and append-only histories. All non-graph raw blocks,
  457 other records and 920 reference caches preserved. No full article/PDF is committed.
- Participant registry changes only 173 to 174 users. Measured connectivity survey and all 31 baseline
  network warnings are unchanged; no numeric bounds or algorithms changed.
- Deterministic repeated rendering and exact-description parser coverage across 456 pages; no browser
  screenshot QA claimed. Independent snippet audit and raw reference-validator diagnostics retained separately.
- 'Deduplication includes 712 all-state issue titles/bodies, broader synonyms and ignored/hidden scoped
  local files, not every issue comment. Non-graph issues #1385/#1386 remain open.'
