adversarial_checks:
- Fresh both-root baseline preceded source reads. Four whole records/all14nodes/6directions reviewed. Nine nodes/four
  existing directions remain; five unsupported nodes/two arrows removed, one rename. No new topology/provider spend.
- 'Yeast-alga: retain reciprocal carbon/nitrogen dependence and both directions with PARTIAL mediation bounds. Oxygen
  release alone does not establish a yeast benefit. Do not infer fermentation as the sole carbon-dioxide source.'
- 'Resveratrol: coauxotrophy remains MUTUALISM, pathway handoff remains CROSS_FEEDING, but aggregate titer is not
  mutualistic fitness. Retain controls, precursor accumulation and biomass tradeoff; the existing pathway-to-production
  direction is PARTIAL, not an isolated explanation of the FLO1 increment.'
- 'Atacama: retain the community composition comparison without lithium-only causation. Taxon presence is not demonstrated
  exchange, nutrient recycling, phototrophy or functional redundancy. Four functional nodes and both arrows removed;
  no claim that these processes are biologically impossible.'
- 'Sclerotia: retain laboratory treatment effects and the MC dropout contribution, but not resource competition,
  defense-process ontology, niche-partitioning or colonization-only causation. Preserve nonadditivity and time dependence.
  The fungal challenge remains external to the twelve-member consortium.'
- Adversarial preflight identified an UNKNOWN_TARGET error after initially assigning MC pairwise scope. Corrected
  to a one-participant community-contribution node; appended a fifth history, preserving the original four. Failed
  preflight exit3/output digest is recorded. Audit rules were not weakened.
- All12graph and4new-discussion quotations match maintained caches. Fourteen match fresh primary text after normalization.
  Two spatial excerpts have explicit accepted-manuscript/final-article wording equivalences, with final text separately
  checked; they are not mislabeled literal matches. No full-cache, figure-pixel, supplement or raw-data certification.
- Four records changed;456otherrecords,923caches and all non-graph raw blocks preserved. Exactly one participant-list
  user added. Community-level census402->403 reflects Atacama, with exactly six existing members; mixed128unchanged,
  community-only274->275, taxa1542->1548 and solely community-credited1268->1274. Only the community-level bound
  increases by one; no runtime connectivity rule changes.
- Eight focused tests and904combined regressions passed.43finalgate records/digests include five history validations.
  Network retains56pre-existing warnings and zero structural defects. HTML-description parsing/deterministic rendering
  is not screenshots; postcommit docs-current is separate.
- Six matching all-state issue bodies read after ignored/hidden-inclusive dedup with recorded exclusions. Graph1784-1787
  await protected-main merge; non-graph1788/provenance1789 and broader765 stay open. Access limits include XML500
  and direct403; normal public pages were used without bypass. Loader1703/Linux DOI-cache1091 not certified.
