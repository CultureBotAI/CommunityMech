adversarial_checks:
- Fresh both-root baseline preceded papers. All four whole records,15originalnodes and14arrows accounted for;14nodes13existingdirections
  retained, one assembly node/arrow removed. No new topology.
- E.coli-R.palustris reciprocal CROSS_FEEDING remains positive, with donor/recipient scope. Consumed organic acids
  are distinguished from formate and ethanol excretion. Initial dry-run quote proof encountered a PDF page/figure
  boundary; the replacement quote directly supports acid use and exclusion of formate, and passes independent primary/cache
  matching. No genetic design or feedback extension.
- Magnetite reduction charges and oxidation discharges. Preserve the real reversible coculture cycle, not just an
  acyclic simplification. External light/electron-donor conditions bound the cycle. Mineral redox is not direct
  nutrient transfer, iron-ion transport, a resource-competition experiment or demonstrated syntrophic metabolic/fitness
  feedback. Current SYNTROPHY does not require obligacy. Both recorded taxa remain explicit; primary PMID evidence
  replaces the secondary editorial quote.
- Acid-soil assembly is experimental design and remains in that section, not an interaction node. Root-carbon use,
  extracellular protonation/Al mitigation and26.36%field yield remain positive. The primary abstract describes legacyP
  as promising; keep phosphorus PARTIAL and four mediation directions explicitly uncertain. Complete main text was
  not read and commentary does not substitute for it.
- 'Rice-duckweed full-text limitations constrain the graph: positive greenhouse growth/disease endpoints remain,
  metabolite-to-phenotype mediation is PARTIAL. Dropout contributions are not bacterial abundance, reciprocal fitness,
  competition or colonization facilitation. Unqualified2,3-butanediol does not establish the existing specific stereoisomer,
  so that graph grounding is removed rather than replaced by a guessed CURIE. Source conflicts about auxin roles
  and duckweed-comparison outcomes remain unresolved; no field efficacy or general safety claim.'
- Two complete primary main texts and one fresh PMC main body read, plus primary acid-soil abstract/limited preview.
  Only E.coli page2/Figure1 visually inspected; no general supplement, raw-data or figure-pixel certification.21graph/new-discussion
  quotations freshly matched to independent source text and unchanged caches; lexical agreement is not entailment.
  Failed empty eScholarship/EuropePMC XML/pypdf attempts are not successful full-text access. No challenge bypass.
- All923baselinecaches,456otherrecords, prior histories/decisions and all non-graph raw blocks preserved. Four append-only
  histories record the changes. Explicit-participant fixture adds magnetite; legacy census changes are measured,
  not evidence for ecology. Existing source-cache licensing and provenance are not rewritten.
- Eight new tests and864combined regressions pass, plus focused schema/strict/term/reference/snippet/history gates.
  All56network warnings unchanged, zero structural defects. Exact HTML-description coverage and deterministic rendering
  are not browser screenshots. Reference checks ran on macOS, not Linux; issue1091 remains. Loader1703 remains outside
  certification.
- Ignored/hidden-inclusive local dedup and fresh all-state issue bodies recorded with exclusions; comments/PRs not
  exhaustive. Graph repairs1755-1758 remain open until protected-main merge;1759 remains a separate non-graph issue.
  Self-adversarial COMMENT is not independent approval. No Edison spend, new wet-lab protocol, branch-protection
  bypass or corpus-completion claim.
