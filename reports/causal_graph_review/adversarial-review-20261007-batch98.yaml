adversarial_checks:
- Fresh both-root baseline preceded source reads. Four whole records and all13nodes/8directions reviewed and retained,
  with4renames. No topology extension or provider spend.
- 'SPRUCE methane: retain organic-matter electron acceptor and acetate interpretations as hypotheses. Gene abundance
  is not flux; deep acetate accumulation does not prove transport to surface methanogens, and acetate is not the
  direct hydrogenotrophic substrate.'
- 'SPRUCE warming: retain measured root-zone community response and ECM colonization, but not fungal-bacterial mutualism,
  unmeasured compound exchange or enzyme activity. Existing directions are PARTIAL and cannot propagate a uniformly
  positive effect because warming and elevatedCO2 have contrasting saprotroph responses.'
- 'SPRUCE virus: keep computational bacterial host predictions and depth associations, not experimentally demonstrated
  predation, lysis or methane-cycler host links. Entire sampled peat column was saturated. No new infection mechanism
  is inferred.'
- 'Saanich: retain the calibrated model and its observational support, while distinguishing fitted nitrite leakage
  from direct transfer measurement. Complementary denitrification co-occurs at the transition zone; it is not demonstrated
  spatial separation or competition reduction.'
- 'Detox coculture: retain positive inhibitor conversion and lactic-acid productivity. The proposed mediator is
  PARTIAL; neutral ADP1 fitness is not established. Residual feedstock is distinct from secreted yeast carbon. Wax
  esters were reliably quantified in only one of four replicates; similar lactic-acid yield is not enhanced yield.'
- Adversarial diff review found residual stronger evidence explanations in Saanich and the coculture. Corrected
  competition-reduction and direct-carbon-transfer/isolated-mediation wording, preserving four initial histories
  and adding two correction histories before final gates.
- All24graph and4new-discussion quotations match fresh primary text and maintained caches. Primary access boundaries
  and exact read sections are recorded, including Saanich XML500/normal PMC HTML and Wiley direct403/public web-rendered
  text. No challenge solved. No full cache-body, figure-pixel, supplement or raw-data certification.
- Four records changed;456otherrecords,923caches and all non-graph raw blocks preserved. Scope-specific participant
  identities use only existing canonical labels/IDs. Two exact participant-list users added; existing connectivity
  bounds and equality checks unchanged. Census stays402community-level/128mixed/1542taxa; solely community-credited
  taxa1266->1268 after unsupported fungal-bacterial and viral pairwise claims are re-scoped. No runtime connectivity-rule
  change.
- Eight focused tests and896combined regressions passed.44gate output records/digests retained, including six history
  validations. Network comparison and measured census are recorded in validation. Deterministic HTML-description
  validation is not browser screenshots; postcommit docs-current is separate.
- Nine matching all-state issue bodies read after ignored/hidden-inclusive dedup with recorded exclusions. Graph1778-1781
  are addressed but await protected-main merge; non-graph1782 and ontology463 stay open. Linux DOI-cache1091 and
  loader1703 not certified.
- Self-adversarial COMMENT is not independent approval. No protection bypass, fabricated CI or premature issue closure.
  Corpus308reviewed/104pending/48needs_research is not complete.
