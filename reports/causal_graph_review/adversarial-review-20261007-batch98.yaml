limitations:
- Four whole records, all13originalnodes and8arrows retained, with4node renames. Four changed records. No new topology,
  Edison dryrun, submission or credits.
- Methane primary abstract/introduction/results/discussion/conclusions1-540 read. Process-specific flux and deep-to-surface
  acetate transfer are not established. Retained metabolic potential is not commensalism or reduced competition.
- Warming fresh abstract1-14 and Wiley web-rendered methods/results/discussion326-459 read. ECM colonization is
  measured; compound transfer and isolated root-trait mediation are not. Direct publisher fetch returned403 and
  was not bypassed; PubMed returned a browser challenge, not solved. Public web-rendered publisher text supplied
  the main-text sections.
- Virus primary abstract13-38,results/discussion97-245 and conclusions464-477 read. CRISPR host links are predictions
  to bacterial MAGs, not observed lysis or methane-cycler infection. The sampled column was saturated despite depth-dependent
  water content.
- Saanich fresh abstract1-19 and public PMC HTML construction/calibration/results115-257 and conclusions405-419
  read. EuropePMC XML returnedHTTP500; normal PMC HTML succeeded. Model predictions retain substantial observation-based
  support without equating fitted leakage with a direct transfer measurement.
- Detox fresh primary abstract and results350-412,discussion495-584,conclusion586-596 read. Wax esters were reliably
  quantified in one of four coculture replicates; productivity differs from yield. Residual feedstock differs from
  yeast byproducts. No new culture or strain-design instructions.
- Relevant cache abstracts and graph quotations checked; a combined flattened cache read was truncated, so complete
  cache-body review is not claimed. No figure-pixel, supplement or raw-data review. All923caches unchanged; fresh
  source bodies remain private local artifacts.
- All456otherrecords, canonical taxonomy and non-graph raw blocks preserved. Six append-only histories, including
  two evidence-explanation corrections. Identity-only participant lists name exact existing members or scoped groups.
  Non-graph1782 and ontology463 remain open.
- All-state issue title/body dedup and ignored/hidden-inclusive local search performed with .git/docs/site/references_cache
  excluded; relevant caches separately inspected. Nine matching issue bodies read and distinct. Comments and PRs
  not exhaustive. Repairs1778-1781 close only after protected-main merge.
- Self-adversarial review is not independent approval or corpus completion. Loader1703 and DOI-cache1091 not certified.
  Denied and unanswered Edison scopes unchanged. Validation and publication not preasserted.
