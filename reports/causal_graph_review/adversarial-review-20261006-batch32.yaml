adversarial_checks:
- Actual three record diffs read against recorded primary-source access. Ten nodes and seven arrows retained,
  no invented connectivity or new graph structure.
- Tomato host benefit is not reciprocal microbial benefit. Canonical five-member participants added without
  taxonomy changes. Sterile-sand single-strain validation, nonsterile combination screening and the larger
  tracking experiment stay distinct. Two mediation arrows are PARTIAL. Earlier workflow-arrow removal
  is preserved.
- 'Whole-host graph evidence is IN_VIVO. Engineering/environmental blocks retain their original IN_VITRO
  under open #1397; the shared anchor was detached only inside graph content. Raw non-graph blocks remain
  byte-identical.'
- DvH donor machinery uses source-only PAIRWISE convention without self-edge or exchange type. Coo/Hmc
  versus Hyd/Hyn effects and the respiratory Hmc phenotype are distinguished; detailed electron routing
  is qualified. Explicit partner directions preserve the physiological feedback cycle, not a reverse nutrient
  donation.
- 'M. barkeri acetate use is intrinsic recipient metabolism. Conditional hydrogen suppression is not resource
  competition or universal methanogenic toxicity; donor attribution is qualified. Coculture timing and
  pure-culture perturbation, YE/RV and exact strains stay distinct. New negative arrow is not silently
  inserted; #1400 and needs_research remain.'
- No figures visually inspected or supplement files read. A requested PDF screenshot did not produce a
  visually inspected image. Complete main-body, caption and table-text scope is documented. No article
  bodies/PDFs added.
- Three guarded writes, llm-assisted events and append-only histories. Prior history preserved semantically;
  every other non-graph raw block, 457 other records and 920 caches preserved. Six focused regression
  tests added.
- All 31 baseline network warnings remain exactly unchanged with zero structural errors. Registry 175
  to 176 users adds only tomato; one mixed community-level record and two CL-counted taxa removed by intrinsic
  recipient correction. No survey algorithms or numeric bounds changed.
- Repeat render hashes match and every description is checked across 456 pages. No screenshot QA claimed.
  Three reference-validator commands performed zero checks despite exit 0; independent snippet matching
  does not establish scientific truth.
- 'Deduplication covers 722 all-state issue titles/bodies and ignored/hidden-inclusive exact-target local
  material, not every issue comment. #1397-1399 metadata and #1400 research stay open. One-community Edison
  dry run only, no job/charge; pricing-map DNS fallback disclosed.'
