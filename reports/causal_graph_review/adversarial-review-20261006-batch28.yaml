findings:
- issue: 1368
  severity: P2
  status: addressed_in_this_change
  finding: Fahmy T4 prediction and parent-removal observations were labelled mutualism without reciprocal
    fitness evidence.
  disposition: Remove both types, preserve all six canonical participants and positive recovery-based
    HPLC outcome, and distinguish predicted enzyme coverage from measured activity, flux, detoxification
    or mineralization.
- issue: 1369
  severity: P2
  status: addressed_in_this_change
  finding: Cyprus recovery-context and general-to-specific arrows were not causal; plasmid annotations
    and CRISPR matches were overinterpreted as fitness and co-resident competition.
  disposition: Remove two arrows, keep positive composition observations, qualify plasmid functional potential
    and unresolved host assignments, and represent CRISPR as a hypothetical host-associated source-only
    capability.
- issue: 1370
  severity: P2
  status: addressed_in_this_change
  finding: DIETsimp donor routes were asserted as measured, the intrinsic methanogen step was community-scoped,
    and the knowledge gap incorrectly claimed no downstream arrows.
  disposition: Retain two parallel explicitly hypothesized donor arrows; qualify partner-specific flux
    and carrier uncertainty, preserve positive conductivity evidence, and repair exact names/anchors and
    contradictory gap wording.
- issue: 1371
  severity: P2
  status: open_nongraph_followup
  finding: Fahmy non-graph salinity and diamide-assay temperature statements conflict across primary sections.
  disposition: Tracked separately. Non-graph blocks are byte-preserved, not certified by this graph review.
- issue: 1372
  severity: P2
  status: open_nongraph_followup
  finding: Cyprus non-graph ingredient oxidation-state and Fe-specific attribution wording requires separate
    repair.
  disposition: Tracked separately. Non-graph blocks are byte-preserved, not certified by this graph review.
- issue: 1373
  severity: P2
  status: open_nongraph_followup
  finding: DIETsimp non-graph taxon roles and performance-versus-protocol language overstate what the
    abstract establishes.
  disposition: Tracked separately. Non-graph blocks are byte-preserved, not certified by this graph review.
adversarial_checks:
- All ten original nodes and four original arrows have decisions. Six renames propagate to exact targets
  and anchors; two Cyprus arrows are removed and two DIETsimp arrows retained as hypotheses.
- Cultivated-meat predicted complementarity is not measured exchange. The exogenous antimicrobial outcome
  is not member antagonism; MIC is not the unspecified effective long-term dose. The unchanged review
  invents no event or history.
- Fahmy T4 retains positive HPLC parent removal, the 57.79 mg/L starting recovery and native-community
  context. Prediction Table 8 wording does not establish enzyme expression, minimum-member necessity,
  reciprocal fitness or mineralization.
- Cyprus relative pooled-DNA profiles and mineral treatments do not isolate Fe or establish niche flux.
  The four named groups are an aggregate, not all twelve MAGs.
- Named plasmid participants are only a known-host subset. Alphaproteobacteria-linked copper-resistance
  candidates are not grounded to Rhodospirillales or archaea. CRISPR spacer matches do not demonstrate
  cleavage, exclusion, co-residence or microbial competition.
- DIETsimp positive pH-dependent conductivity and cytochrome-associated spectra are not discarded; the
  abstract explicitly proposes the mechanism. Donor-specific substrates, direct electron carriers and
  M. mazei-specific methane contribution remain unresolved.
- DIETsimp intrinsic methanogenesis uses the existing source-only PAIRWISE convention, not an invented
  enum or whole-community syntrophy. Neither retained arrow links one bacterial donor relationship causally
  to the other.
- Three guarded edits each have one llm-assisted event and one append-only history. All non-graph blocks,
  the other 457 records and all 920 caches are byte-preserved.
- The exact participating_taxa registry gains only Fahmy T4 and Cyprus, 168 to 170 users. Both connectivity
  surveys are measured; mixed scope remains 124 without changed numeric bounds or algorithms.
- Issue deduplication searched 700 all-state titles/bodies plus ignored/hidden local review/history scopes,
  not all comments or the whole filesystem. Earlier cultivated-meat and Fahmy fixes are preserved.
- All 456 community pages have exact node/arrow descriptions checked by HTML parser and repeat renders.
  Browser screenshots, figure images and supplements were not inspected.
