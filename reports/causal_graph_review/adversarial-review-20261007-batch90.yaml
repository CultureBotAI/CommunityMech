adversarial_checks:
- Fresh both-root baseline preceded papers. All14originalnodes7arrows have dispositions:12biologicalnodes and all7directions
  retained; two out-of-scope diatom nodes removed. No new node or direction and no arrow endpoint changes.
- Chloronitro preserves chemical identification, sequential transformations and reported conditional mineralization.
  The downstream Rhodococcus process no longer asserts metabolite provision back to Pseudomonas. Both original causal
  directions remain.
- Conditional mineralization is not silently downgraded to disappearance. The endpoint alone does not establish
  product-removal feedback making upstream metabolism favourable, so it is untyped. Local SYNTROPHY does not require
  obligacy. Full carbon balances were not inspected; unavailable methods do not prove absent controls.
- TPA retains all three competition nodes and both arrows. Dominance alone is not evidence for resource competition;
  the source-reported metabolism-loss comparison is added. Positive contact inhibition and relative-kinetics attribution
  remain; separate effect sizes are not invented.
- Naphthalene retains the authors DIET/circuit interpretation as PARTIAL SYNTROPHY on the first two nodes, electrochemical
  and multi-omics findings and separate untyped removal/mineralization endpoints. Specific interspecies route and
  mediator necessity remain qualified. Collective nodes use canonical participants.
- Diatom consortium resolution is a workflow, while coastal prevalence is broader environmental evidence already
  retained outside the pair graph. Removing those nodes does not erase the three signal/exchange nodes or existing
  positive causal arrow.
- Individual diatom signal/exchange processes are not categorical reciprocal fitness measurements. Canonical participants
  are preserved. H3 taxonomic evidence and another-system background citation do not certify the exact SA11 cultivation
  fields; metadata1742remains open.
- Four exact-system primary abstracts and two attribution abstracts read. No complete primary main text retrieved.
  Chloronitro XML500/PMC challenge/OA metadata404 and Nature redirect/subscription preview disclosed. Cached secondary
  background paragraphs are not independent fresh primary evidence. No figures, supplements or raw data audited.
- Adversarial schema reading caught an incorrect obligacy premise after the initial816-test pass. That report and
  tested inputs are archived as superseded with verified digests. Two appended correction histories preserve the
  original four histories. A schema-contract regression and fresh full validation bind the corrected state.
- All921caches456otherrecords and raw non-graph blocks preserved. Six append-only histories and eleven focused tests.
  Two new explicit-participant users, measured legacy census unchanged, all56oldwarnings retained and zero structural
  defects. No taxonomy or auditor-rule changes.
- No new genetic designs, resistance-selection details, harmful-algal optimization, toxin guidance or experimental
  protocols. No Edison dry run or provider submission. Executed gates and deterministic HTML checks are not browser
  screenshots or generated-model loader certification. Loader1703remains open. Repairs1738-1741await protected-main
  merge;1742remains open. Self-review is not independent approval or corpus completion.
