limitations:
- Fresh both-root baseline before papers:460records921caches1422nodes584arrows56warnings0structural defects. All14originalnodes7arrows
  accounted for;12biologicalnodes and all7directions retained. Two out-of-scope diatom nodes removed, with environmental
  evidence preserved outside the graph.
- Four fresh exact-system primary abstracts and two attribution abstracts read. No complete fresh primary main text.
  Chloronitro XML500 after bounded retries, PMC challenge and open-access metadata404. Nature public search-index
  preview read, with explicit subscription notice; direct publisher redirect failed. No challenges or paywalls bypassed.
  No figure pixels, supplements or raw data inspected.
- Chloronitro chemically supported upstream conversion, downstream degradation and conditional mineralization remain.
  The intermediate-degradation node no longer implies reverse metabolite provision. The endpoint itself does not
  demonstrate product-removal feedback on upstream metabolism; lack of obligacy is not a reason to reject SYNTROPHY.
- TPA preserves three competition nodes and both directions, including reported contact inhibition, relative kinetics
  and metabolism-loss comparison. Dominance is an outcome, not standalone evidence for resource competition. Full
  controls and separate effect sizes remain uninspected; positive causal findings are not removed.
- Naphthalene retains the authors SYNTROPHY classification on the PARTIAL electron-transfer/circuit model. The actual
  enum does not require obligacy. The measured removal/mineralization endpoint is kept distinct from the proposed
  coupling interaction; route-specific mediation remains qualified.
- Diatom workflow resolution and broad environmental prevalence are not pair-specific biological interactions. Three
  signal/exchange nodes and the existing positive signaling arrow remain. Individual processes are not categorical
  reciprocal fitness measurements. No new harmful-algal growth optimization, toxin guidance or experimental designs
  were added.
- The fresh H3 taxonomic abstract is not the exact SA11 study. PMID30228381 is another-system primary whose cached
  background discussion mentions SA11; only relevant background paragraphs were inspected, not independently fresh
  main text. Public Nature preview identifies the canonical pair. Non-graph citation, culture and metal claims remain
  the metadata issue, not silently corrected or certified.
- 456otherrecords, all921caches and raw non-graph blocks preserved. Two new explicit participant users; legacy community-level
  census is to be measured. No taxon IDs, taxonomy or auditor rules changed. No new genetic designs, resistance-selection
