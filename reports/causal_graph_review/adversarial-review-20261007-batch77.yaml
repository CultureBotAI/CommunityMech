adversarial_checks:
- Every whole record and original node/arrow reviewed after a fresh both-root baseline. Empty Nasal is explicitly
  needs_research, not omitted or reported complete. No topology invented to satisfy a sparse-graph heuristic.
- Preserve xylan utilization and extracellular enzyme gains with SUPPORT evidence and correct canonical pairwise
  directions. Enzyme activities are protein-normalized; increased biomass is not the entire explanation. Abstract
  maxima span fungi/time/substrates, not uniform PNK2 values.
- Xylan utilization is distinct from polymer depolymerization. Preserve both existing causal links with partial/hypothesized
  mediation. Replace shared-context wording by the actual source proposal involving sugar uptake and xylose repression;
  do not claim a selective hydrogen-removal or repression-rescue perturbation.
- Ngawha mer/hgc findings are positive sequence evidence. hgcA sequences could not be binned, no definitive methylator
  taxon is assigned, HMM MerA hits require paralog filtering and Tiger Bath nondetection is depth-bounded. Replace
  an abstract aim fragment with actual result excerpts, not false activity certainty.
- 'Ngawha atmospheric Hg(0) really was measured: retain the environmental outcome. Do not attribute the measurement
  solely to microorganisms because deep geological inputs and abiotic reactions were not isolated. Main manuscript
  Results and Methods and Table2 were checked; this is not a microbial flux assay.'
- Retain unexpectedly diverse sampled microbiomes without temporal-stability or niche-partitioning claims. Remove
  the last environment-to-diversity context arrow while preserving the earlier four-edge removal. Keep the sulfur/iron/cinnabar
  conceptual model without syntrophy or transport ontology overclaims.
- Z123 uses genomics plus proteomics, not merely gene prediction. Preserve reported polymer losses and recombinant
  enzyme assays. Putative GC-MS compounds are not traced assimilation/mineralization; half-dose comparators do not
  establish full-dose synergy or assign enzyme necessity to a live strain. Missing endpoint nodes remain research
  work.
- Nasal source read distinguishes experiment5 from swab experiments1-4, one control plus two reactors per challenge
  strain, nondetected residents from nine-member inoculum, and proposed tyrosine mechanism from isolated causal
  rescue. Prior969-972 fixes retained. Fresh full-text access failed; previous cache provenance is explicit.
- Only22 words of selected author-manuscript Results were appended to one cache, with URL, version and PDF SHA.
  Original abstract and919 other caches remain unchanged; no publication PDF or full manuscript body is committed.
  Three result snippets total22 words, verified by test.
- Nine nodes and three original arrows are accounted for; nine nodes/two arrows remain. Three histories,457 unchanged
  records and non-graph raw blocks preserved. Canonical taxonomy and auditor rules unchanged. Forty-four baseline
  warnings and connectivity census must be preserved exactly, not interpreted as resolved member activity.
- Two separate one-record Edison LITERATURE dry runs completed, with no provider submissions or credits. Scoped
  asynchronous questions are unanswered; preselection is not approval and earlier denied scopes are unchanged. Research1640/1641
  and metadata1642 stay OPEN after repairs1637-1639 merge.
- Schema, strict, terms, full-record references, snippets, histories, both-root inventory/network/rank, regression/lint
  and deterministic rendering outputs are captured. Exact descriptions are parsed across456 pages, not browser screenshots.
  Exact-commit review publication and postcommit docs-current remain separate gates. Self-review is not independent
  approval or corpus completion.
