post_edit_corrections:
- Expanded Eucalyptus endpoint snippet to include the severe-curvature criterion; classified the nursery
  functional-measurement limitation as IN_VIVO.
- Expanded e-waste snippet to include complete concentration units, all three metals and both solid-PCB
  assay levels; no truncated g L unit.
- Initial regression suite passed, but Ruff found SIM300 in a new assertion; corrected before the full
  post-refinement verification. Initial incomplete verification retained separately, not reported as a
  passed run.
adversarial_checks:
- Whole records, prior relevant histories and complete graph diffs reviewed against primary full main
  bodies. Nine existing nodes and all three arrows retained with explicit dispositions. No invented links
  or new structure.
- Eucalyptus prior trait screens do not measure nursery nitrogen fixation or specific IAA exchange. Remove
  colonization facilitation and mutualism; root compositional change does not prove member persistence
  or robust taxon displacement. Explicit participants name inoculant/host context, not the exhaustive
  root microbiome.
- Eucalyptus dead category includes severe stem curvature, not literal mortality alone. Outcomes are genotype-dependent;
  water control does not isolate the PBS carrier. Preserve the two workflow-arrow removals and AMBIGUOUS
  Paenibacillus grounding.
- E-waste FeIII dissolution and FeII regeneration constitute a real chemical-biological feedback. Rewrite
  both directions as oxidant/substrate coupling rather than a leachate-transfer workflow. Preserve all
  three existing arrows and remove syntrophy/competition categories.
- Redox-inferred iron oxidation does not assay iron transport or carbon fixation. Serial transfer shortens
  pre-oxidation lag, not the seven-day batch dissolution endpoint. Do not claim identified genetic resistance,
  altered membranes, specific toxins or a universal above-8% inhibition threshold.
- 'Separate 1/2% solid-PCB stirred-tank concentrations from equivalent-leachate toxicity flasks and continuous-startup
  regimes. Account for the storage pause, 25-day observation window and planktonic-count limitations.
  Preserve #596 vessel evidence. Non-graph acid-dosing/role claims remain #1448.'
- FOS bacterial counts are DNA-qPCR estimates, not CFU viability. Expression is RNA/cDNA-based and genes
  were homology-assigned; observed context differences do not establish selective gene causality or partner-resolved
  cross-feeding. The glucose and FOS conditions are not carbon-mass matched.
- Actual Figure 7 inspected, not publisher-generated alt text. Propionate peak 2 appears in minimal-core
  B but not separately in whole-community C. Remove the whole-specific assignment without inferring physiological
  absence. Retained acid identities are qualitative, not ionic-speciation, yield, flux or active-mediator
  measurements.
- 'The FOS host assay pretreated cells with extract, removed it, then challenged with palmitate. Cd36
  mRNA association is not mediation, protein change or a clinical effect. The missing endpoint remains
  #1450; FOS is needs_research, not a completed graph. One-community Edison dry run completed without
  API call or credit spend; specific job authorization requested.'
- 'Keep all seven FOS canonical strains and #1206 role corrections. Preserve the prior active-metabolite
  gap and proposed experiments semantically; do not present those proposals as performed work. Non-graph
  pretreatment/readout wording remains #1449.'
- Guarded writes and append-only histories with llm-assisted events. Prior history/discussions and all
  non-graph raw blocks preserved; 457 other records and 920 caches byte-identical. Eight new tests cover
  source boundaries, participants, topology, histories and pending research.
- Add only Eucalyptus to the participant registry (184 to 185). Connectivity census and numeric bounds
  unchanged. All 33 baseline warnings exactly preserved, zero structural errors. No topology invented
  to suppress sparse/disconnected warnings.
- Repeat renders deterministic and every published node/arrow description parser-checked. Reference-validator
  0.1.7 exits 0 with zero effective checks; explicitly a no-op. Textual snippet MATCH is not scientific
  validation. Actual output tails, digests, baseline and Edison dry-run output are retained.
- Issue deduplication searched 766 all-state titles/bodies and ignored/hidden-inclusive local files, not
  all comments. No other figure images, separate supplements or raw data reviewed. Self-adversarial review
  is not independent approval, protected merge or full-corpus completion.
