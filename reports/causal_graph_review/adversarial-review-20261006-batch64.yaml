adversarial_checks:
- Read all three whole records and account for9 original nodes and2 arrows. Three complete fresh primary
  main bodies and complete Nicotiana2026 correction read; embedded text tables inspected. MAMC image-only
  Table1 cells, original figure pixels, separate supplements and raw data were not audited. Numerical
  endpoints are author-reported, not independently recomputed.
- 'Nicotiana: separate five individual-strain flask treatments from the three-strain1:1:1 plant inoculum.
  Attached microbial biomass phosphorus is an operational pool, not direct biofilm imaging. Its regression
  with inferred dissociation and pH correlation do not selectively prove attachment or named-acid mediation.
  Retain these hypotheses in prose, not asserted arrows or GO biofilm activity.'
- 'Nicotiana: preserve increased phosphorus endpoints for three effective strains and limited activity
  of two comparators. Total available phosphorus pools include dissolved, biomass and adsorbed fractions
  and are not all freely dissolved inorganic phosphate. Remove unmeasured oxalate/citrate and CROSS_FEEDING
  assertions while retaining phosphate context.'
- 'Nicotiana: retain the18-day conditioning benefit, percentages of control rather than percent increases,
  and adverse day6 seedling response without pretreatment. Controls were not pre-cultured and MS supplied
  phosphorus from day6. Correct living-host evidence; these outcomes do not isolate exclusive phosphorus
  mediation or lunar-environment performance. The2026 correction only fixes particle-size labels.'
- 'Lupin: preserve positive SC7 growth in both systems and existing richness-versus-membership confounding.
  Main Table1 confirms twelve input strain codes; keep both Streptomyces strain names despite their shared
  genus CURIE. Input membership is not dominance, equal harvest abundance, complete host/background membership
  or independently verified genome identity.'
- 'Lupin: distinguish FlowPot root RNA-seq from non-sterile CAS-soil microbiome measurements. Expression/enrichment,
  leghemoglobin and genomic annotations are not hormone secretion, nitrogen-fixation rate or a demonstrated
  growth mediator. No transcription-to-growth or assembly-to-growth arrow is introduced.'
- 'Lupin: relative genus profiles are not absolute exclusion or exact inoculant persistence. In-silico
  ASV removal is not a biological knockout. Disclose conflicting PERMANOVA wording/p=.001 and preserve
  observational conclusions without certifying blanket significance. Source timing contradiction and missing-host/dominance
  metadata remain under1564.'
- 'MAMC: remove enrichment and reductive screening nodes as procedures; preserve earlier workflow-arrow
  deletion. Retain M48 study isolate IDs13/18/25/29/68 and its positive performance. FTIR estimates43.01/39.65/69.18%
  average50.6%, not50.6% each, gravimetric mass loss, mineralization or partner-resolved flux.'
- 'MAMC: metabolic functional groups and isolate secretome assays do not establish niche partitioning,
  directed exchange or division of labor in M48. Keep source-reported16S identification labels with identity
  caveats; canonical labels are not independently certified culture-strain equivalents. Approximately3e4
  cells/mL per strain is stated for the18-strain control; separate non-graph metadata repair stays open.'
- Review full biological diff and eight focused tests.457 other records,920 caches and raw non-graph blocks
  unchanged. Canonical taxonomy preserved, not recertified.46 baseline network warnings retained exactly
  with zero structural defects or auditor-rule changes. Coarse roster/scope census unchanged and does
  not resolve missing hosts or strain identity.
- Actual schema, strict, terms, references, snippets, histories, corpus audit, deterministic render and
  regression outputs captured. Exact descriptions parsed across456 pages, not browser screenshots. Post-commit
  docs-current remains a separate publication gate.
- Deduplication covered857 all-state issue titles/bodies with no exact matches and21 scoped ignored/hidden
  local files. Existing Lupinus review and MAMC workflow history read, not every PR/comment/local match.1561-1563
  addressed but OPEN until protected-main merge;1564 remains OPEN afterward. Exact-head self-review is
  COMMENT, not independent approval. No new graph structure or paid Edison submission.
