- issue: https://github.com/CultureBotAI/CommunityMech/issues/1295
  severity: P2
  disposition: addressed_and_locally_verified
  finding: Expression, diversity, proximity and physiological readouts exceed their causal or assay-specific support.
  resolution: Correct response-group identity, qualify coexistence and carbon predictions, remove modeling-utility
    arrows, separate illuminated growth from dark starch assays, preserve valid mutualism/cross-feeding interpretations
    and distinguish the Sp6 comparator from canonical Cd. Correct FEMS cache scope without adding article text.
