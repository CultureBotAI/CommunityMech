adversarial_checks:
- challenge: Are four expression groups equivalent to four directly demonstrated substrate niches?
  resolution: No. The Low Response group lacks clear habitat preference, and mapping aggregates populations. Niche
    partitioning remains a partial interpretation; canonical aggregate Bacteria is unchanged.
- challenge: Does the combined habitat have significantly greater diversity in every comparison?
  resolution: No. Shared significance groups and the nonsignificant rhizosphere functional-diversity response to
    detritus are explicit. Coexistence causation is not inferred from a numerical maximum alone.
- challenge: Can transcripts, gyrase expression or transcriptional synergy establish reaction flux or partner benefit?
  resolution: No. The graph separates transcript measurements from flux; its knowledge gap records proxy limitations
    and final-timepoint drying. Neither abundance proxies nor the synergist label proves partner facilitation.
- challenge: Do removed arrows represent unsupported new absences of biology?
  resolution: No. They describe usefulness for modeling, not a biological causal link. The existing resource-response
    to coexistence and transcript-to-carbon links remain explicit hypotheses, without new nodes or arrows.
- challenge: Does qualifying the Chlorella mechanism erase supported mutualism or cross-feeding?
  resolution: No. Nutrient/time-dependent population benefits and exudate-supported resource use retain their types.
    Mechanistic uncertainty does not negate measured effects; the rich-start bacterial exception remains explicit.
- challenge: Does bulk non-detection disprove local metabolite transfer?
  resolution: No. Local transfer remains plausible but unquantified. Exudate and supplementation experiments are
    distinguished from bead-local flux; IPDC activity is not uniquely bacterial or specific to IAA.
- challenge: Was free thiamine confused with the experimental cofactor supplement?
  resolution: The description names thiamine diphosphate supplementation and does not claim direct identification
    of the extracellular thiamine species. The existing canonical metabolite grounding is retained with that limit.
- challenge: Is starch accumulation a reciprocal fitness outcome or proof of Cd-specific IAA necessity?
  resolution: Neither. The starch node is untyped, retains reduced algal counts, and identifies the Sp6-derived
    mutant. Synthetic IAA and strain comparisons justify partial mediation rather than deletion of the existing
    arrow.
- challenge: Do observed aggregates prove partner-driven colonization or necessity for mutualism?
  resolution: No. Engineered immobilization and observed aggregation are retained without colonization-facilitation
    typing. The proximity-to-growth arrow is a source-proposed hypothesis, not a selective perturbation result.
- challenge: Does the FEMS cache represent a complete independent article or carry a redistribution license?
  resolution: No. It is labeled as normalized abstract/methods excerpts. Existing article text is unchanged and
    not expanded; accessible primary HTML is not treated as a reuse license. Primary PDFs/body remain outside the
    repository.
- challenge: Does this review certify unchanged metadata, uninspected supplements or the entire corpus?
  resolution: No. Separate metadata issues remain open. Source-specific main-figure limits, unread supplements/raw
    data and self-review provenance are explicit in the ledger.
