adversarial_checks:
- 'Every original node and direction has a disposition: ten nodes retained, six renamed, two existing directions
  qualified and four unsupported arrows removed. No new topology. Renamed targets and discussion anchors resolve
  exactly.'
- 'Overcorrection check: preserve positive 2011 aggregation, mutant attachment impairment, diatom-supported Ruegeria
  growth, the 2017 B12-limited growth rescue and conserved Trichodesmium association. Qualification does not erase
  observed benefits.'
- 'HP15: later null bacterial effects on total TEP, aggregate volume and the size-sinking relation constrain universal
  claims. Aggregate-free-water TEP and total TEP are different endpoints. Inactivation did not produce uniformly
  zero aggregation and may change surface chemistry. The caption documents chitin fibres, not all TEP chemistry
  or feeding. The two retained arrows remain conditional or hypothetical; ocean export is an extrapolation.'
- 'Ruegeria: recognition is inferred from gene homology and transcription, not a colonization benefit. Chitin/lipid
  transcription is not reverse feeding. Neither removed arrow demonstrates mediation. Structured 2020 Table 1 cells
  distinguish DMSP/GlcNAc expression from proline/guanosine net drawdown; neither is a traced compound-specific
  flux. Separate pair cultures are not a mixed consortium.'
- 'B12 check: the 2017 growth rescue must not be erased by later L1 assay results or substituted for the chitin
  node. Missing topology remains #1883 and needs_research. One authorized real invocation stopped at authentication
  before submission. No report, task or spend is claimed; previously denied scopes were not retried.'
- 'Trichodesmium: association is not commensal neutrality and genomic complementarity is not mutualistic fitness.
  The 2017 mechanism figure is a model; siderophore and DMSP measurements do not prove full interpartner fluxes.
  Proposed B12 provision runs host-to-epibiont, with facultative use in the 2017 genome. Preserve #297 ROS compound/process
  distinctions and proposed iron chemistry without treating Fe(II) as generic iron. Remove the two unsupported explanatory
  arrows.'
- 'Field identity: the 2018 host was not demonstrated to be IMS101, and Alteromonas genus transcripts are not automatically
  A. macleodii. The field node credits only the canonical microbiome guild. Laboratory association retains the canonical
  pair. Non-graph identity and medium issues remain #1886 and #765; restricted publication bodies are not restored.'
- 'Source scope: three fresh extracted main bodies, three complete primary PDF text extractions and selected figure
  images were reviewed. Diel main text came from existing curator text; chemotaxis is abstract-bounded and MEPS
  remains caption-only after HTTP 401. Of 24 quotations, 23 match fresh primary text and one matches the existing
  caption. No new publication bodies or caches. Supplements, raw data and other figure pixels were not reviewed.'
- Three guarded records and append-only histories preserve 457 other records, 923 caches, all non-graph blocks and
  prior history/decision artifacts. Two explicit participant-list users are added to the exact test expectation.
  Census remains 412 community-level, 136 mixed, 276 community-only, 1563 taxa and 1273 solely credited. Connectivity
  logic and share guards are unchanged.
- Five real in-memory control/mutation/restored-control probes reject TEP feeding, proven attachment mediation,
  reverse transcript feeding, genomic SUPPORT inflation and exact IMS101 field attribution. Actual mutations and
  rejecting assertions are recorded. Canonical hashes are unchanged; probes are not counted as additional pytest
  tests.
- Ten focused tests and 1024 combined regressions pass. All three edited records pass schema, strict, terms, full-record
  references, snippets and history checks. The 56 network warnings are unchanged, with zero structural defects.
  Deterministic rendering and exact HTML descriptions cover 456 pages, 1366 nodes and 531 arrows, not UI screenshots.
  Full-corpus snippets remain informational. Local reference passes are not Linux certification.
- 'Repairs #1880-#1882 await protected-main merge; research #1883 and metadata #1884-#1886 remain open. Self-review
  is not independent approval. Exact-head publication and postcommit docs-current are separate gates. Root CI blocker
  #1836 is not bypassed and dependent branches are not deleted.'
- 'Corpus: 364 reviewed, 42 pending and 54 needs_research across 460 records. The overall goal remains incomplete.'
