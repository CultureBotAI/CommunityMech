    '
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: G. sulfurreducens performs direct electron transfer (DET) via multiheme cytochromes C and type IV pili (e-pili)
      composed of the PilA protein.
    explanation: Identifies PilA as the structural subunit of conductive type IV pili (e-pili) mediating direct electron transfer
      in Geobacter sulfurreducens.
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Some studies propose that stacked π orbitals of aromatic residues in PilA facilitate conduction, while others
      suggest that micrometer-long filaments of polymerized hexaheme cytochrome OmcS are responsible for long-range electron
      transport.
    explanation: Supports the proposed role of PilA aromatic residues alongside OmcS filaments in long-range extracellular
      electron conduction.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The gene coding for the pilin monomer, PilA, which is assembled into electrically conductive pili ( 79 ), was
      also 63 times more highly expressed in DIET-grown cells.
    explanation: RNA-Seq differential expression in Geobacter sulfurreducens PCA (ATCC 51573, NC_002939 / GCF_000007985.2)
      DIET cocultures demonstrates 63-fold upregulation of pilA (GSU1496) during direct interspecies electron transfer.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In methanogenic environments, Geobacter spp.—particularly G. sulfurreducens—serve as canonical DIET performers,
      transferring electrons to methanogens such as Methanosaeta and Methanosarcina via conductive pili (microbial nanowires)
      and multiheme cytochromes like OmcS.
    explanation: Identifies Geobacter sulfurreducens conductive pili (microbial nanowires, PilA) alongside multiheme cytochrome
      OmcS as canonical direct interspecies electron transfer (DIET) conduits to methanogenic partners.
  - reference: PMID:28287150
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: In particular, this increased the synthesis of the pilA protein involved in nanowires conductivity 7 .
    explanation: PARTIAL - cites prior proteomic characterization of Geobacter sulfurreducens DSM 12127 (= PCA = ATCC 51573,
      GCF_000007985.2) showing increased synthesis of PilA (GSU1496, UniProtKB:Q74BW5) involved in nanowire conductivity under
      long-term electron-acceptor limitation; used as pre-culture background in CommunityMech:000031 where contact-dependent
      nanowire transfer in the Clostridium pasteurianum coculture itself was not established.
  - reference: PMID:32265334
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: we recently observed that adaptively evolved PilA-deficient mutants of G. sulfurreducens (via 13 serial transfers)
      in NB(formate + fumarate) medium do not acquire any mutations in tetR or fabI
    explanation: PARTIAL - adaptive laboratory evolution study of Geobacter sulfurreducens DL-1 (= PCA, GCF_000007985.2) in
      CommunityMech:000201 (Semenec et al. 2020, PMID:32265334) compares PilA-deficient (GSU1496, UniProtKB:Q74BW5) mutant
      serial transfers in NB(formate + fumarate) medium as a pure-culture control demonstrating that tetR and fabI adaptive
      variants arise specifically from Pseudomonas aeruginosa coculture selection.
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'To identify putative electrically conductive e-pili, we used the e-pilin protein sequence from Geobacter sulfurreducens
      PCA (GenBank accession: AAR34870.1 ) as a reference'
    explanation: Comparative genomic analysis of extracellular electron-transfer pathways in PMID:41876513 (CommunityMech:000349)
      uses the canonical Geobacter sulfurreducens PCA conductive e-pilin protein sequence (GenBank AAR34870.1, corresponding
      to locus GSU1496 / UniProtKB:Q74BW5 in reference assembly GCF_000007985.2) as the reference sequence to identify putative
      electrically conductive e-pili.
  - reference: PMID:41876513
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Also, deletion of the pilA gene abolished DIET between Geobacter and a type II Methanosarcina (M. acetivorans)
      and GAC could compensate for this loss suggesting that the role of pili in the interaction with GAC and the methanogenic
      partner is not crucial
    explanation: PARTIAL - comparative DIET discussion in PMID:41876513 (CommunityMech:000349) notes that deletion of pilA
      (GSU1496, UniProtKB:Q74BW5, GCF_000007985.2) abolishes unamended direct interspecies electron transfer between Geobacter
      and Methanosarcina acetivorans while granular activated carbon (GAC) can compensate for e-pili loss.
  - reference: PMID:32849356
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'Among the genomes with EET-related genes, 16/31 contained pili meeting the strict criteria used by Bray et al.
      (2020) : ≥9.8% aromatic amino acids (at least between residues 1 and 59 of the mature pilin sequence), no gap between
      aromatic residues greater than 22, and aromatic residues at positions 1, 24, 27, 50 and/or 51, and 32 and/or 57 that
      were found to be essential for conductivity in G. sulfurreducens e-pili by Walker et al. (2018 , 2020) ( Table 1 ).'
    explanation: Comparative metagenomic screening of Rifle bioanode genomes in PMID:32849356 (CommunityMech:000241, Table
      1) benchmarks aromatic residue density (≥9.8% between mature pilin residues 1–59) and conserved aromatic positions (1,
      24, 27, 50/51, 32/57) established as essential for conductivity in Geobacter sulfurreducens PCA conductive type IV e-pili
      (PilA, GSU1496, UniProtKB:Q74BW5, GCF_000007985.2).
