  - reference: PMID:34986141
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The sequence similarity shared between OmcZ and the proteins found in these ANME groups is not limited to CxxCH
      motifs, but also extensive N- and C-terminal regions with many completely conserved residues.
    explanation: Comparative sequence analysis in PMID:34986141 (CommunityMech:000134, Figure 10) demonstrates that sequence
      conservation between the Geobacter sulfurreducens octaheme c-type cytochrome OmcZ (GSU2076, UniProtKB:Q74A90, GCF_000007985.2)
      and ANME-2a/2b/2c homologs extends beyond the 8 CxxCH heme-binding motifs across extensive N- and C-terminal regions
      with completely conserved residues.
