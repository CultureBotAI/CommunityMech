  label: ASM798v2
  notes: RefSeq reference assembly for Geobacter sulfurreducens PCA.
genes:
- gene_id: UniProtKB:Q74BW5
  gene_symbol: pilA
  locus_tag: GSU1496
  product: Type IV pilin; structural subunit of conductive (electrically conductive) pili / e-pili
  genome: GCF_000007985.2
  kegg_ortholog: K02650
  go_terms:
  - id: GO:0009055
    label: electron transfer activity
  - id: GO:0009289
    label: pilus
  supports_roles:
  - ELECTRON_DONOR
  - SYNTROPHIC_PARTNER
  supports_interaction: >
    Conductive pili (e-pili) mediate long-range extracellular and direct
    interspecies electron transfer (DIET) to partner methanogens and to
    Fe(III) oxides/electrodes.
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: G. sulfurreducens performs direct electron transfer (DET) via multiheme cytochromes C and type IV pili (e-pili) composed of the PilA protein.
    explanation: Identifies PilA as the structural subunit of conductive type IV pili (e-pili) mediating direct electron transfer in Geobacter sulfurreducens.
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Some studies propose that stacked π orbitals of aromatic residues in PilA facilitate conduction, while others suggest that micrometer-long filaments of polymerized hexaheme cytochrome OmcS are responsible for long-range electron transport.
    explanation: Supports the proposed role of PilA aromatic residues alongside OmcS filaments in long-range extracellular electron conduction.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The gene coding for the pilin monomer, PilA, which is assembled into electrically conductive pili ( 79 ), was also 63 times more highly expressed in DIET-grown cells.
    explanation: RNA-Seq differential expression in Geobacter sulfurreducens PCA (ATCC 51573, NC_002939 / GCF_000007985.2) DIET cocultures demonstrates 63-fold upregulation of pilA (GSU1496) during direct interspecies electron transfer.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In methanogenic environments, Geobacter spp.—particularly G. sulfurreducens—serve as canonical DIET performers, transferring electrons to methanogens such as Methanosaeta and Methanosarcina via conductive pili (microbial nanowires) and multiheme cytochromes like OmcS.
    explanation: Identifies Geobacter sulfurreducens conductive pili (microbial nanowires, PilA) alongside multiheme cytochrome OmcS as canonical direct interspecies electron transfer (DIET) conduits to methanogenic partners.
- gene_id: UniProtKB:Q749X9
  gene_symbol: omcS
  locus_tag: GSU2504
  product: Outer-surface hexaheme c-type cytochrome associated with conductive pili
  genome: GCF_000007985.2
  go_terms:
  - id: GO:0009055
    label: electron transfer activity
  - id: GO:0020037
    label: heme binding
  supports_roles:
  - ELECTRON_DONOR
  - SYNTROPHIC_PARTNER
  supports_interaction: >
    Cytochrome filament/decoration required for extracellular electron transfer
    to Fe(III) oxides and for direct interspecies electron transfer to partners.
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Some studies propose that stacked π orbitals of aromatic residues in PilA facilitate conduction, while others suggest that micrometer-long filaments of polymerized hexaheme cytochrome OmcS are responsible for long-range electron transport.
    explanation: Identifies OmcS as the polymerized hexaheme c-type cytochrome forming filaments for long-range extracellular electron transport in Geobacter sulfurreducens.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These included genes for over 25 c-type cytochromes, including omcS, omcB, omcX, and omcI, which encode multi-heme, outer-surface c-type cytochromes.
    explanation: Transcriptomic profiling of Geobacter sulfurreducens PCA (ATCC 51573, NC_002939 / GCF_000007985.2) in DIET coculture identifies omcS (GSU2504) among outer-surface multiheme c-type cytochrome genes significantly upregulated during direct interspecies electron transfer.
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The syntrophy was not reliant on phenazine, since Δphz mutant strain cocultures grew, however appeared to rely on cytochromes as evidenced from the stunted growth G. sulfurreducens ΔomcZ and ΔomcS mutant cocultures.
    explanation: Deletion mutant coculture assay demonstrating stunted syntrophic growth of Geobacter sulfurreducens ΔomcS (GSU2504) in formate-fumarate electroactive coculture with Pseudomonas aeruginosa.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In methanogenic environments, Geobacter spp.—particularly G. sulfurreducens—serve as canonical DIET performers, transferring electrons to methanogens such as Methanosaeta and Methanosarcina via conductive pili (microbial nanowires) and multiheme cytochromes like OmcS.
    explanation: Identifies the multiheme cytochrome OmcS of Geobacter sulfurreducens as a canonical direct interspecies electron transfer (DIET) conduit transferring electrons to syntrophic partners.
  - reference: PMID:31537786
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The plasmid pSyn2973-omcS was constructed by inserting the Prbcl-omcS-Trbcs-Kan expression cassette, which consisted of the promoter Prbcl, the coding region of omcS from Geobacter sulfurreducens, the terminator TrbcS, and a kanamycin resistance gene (Kan), into the plasmid pBR322 flanked by the sequences homologous to the up- and downstream fragments of gene glcD1.
    explanation: Documents heterologous expression of the Geobacter sulfurreducens omcS coding region in the engineered cyanobacterial partner Syn2973-omcS-ldh of the D-lactate-mediated biophotovoltaic consortium (CommunityMech:000211), where Syn2973-omcS-ldh produced higher D-lactate concentrations than Syn2973-ldh without direct extra anodic current from omcS in the cyanobacterial host.
- gene_id: UniProtKB:Q74A90
  gene_symbol: omcZ
  locus_tag: GSU2076
  product: Outer-surface octaheme c-type cytochrome
  genome: GCF_000007985.2
  go_terms:
  - id: GO:0009055
    label: electron transfer activity
  - id: GO:0020037
    label: heme binding
  supports_roles:
  - ELECTRON_DONOR
  - SYNTROPHIC_PARTNER
  supports_interaction: >
    Cytochrome essential for high-density current production at electrodes
    (extracellular electron transfer to anodes) and required for normal
    syntrophic coculture growth during cytochrome-associated interspecies
    electron transfer.
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: G. sulfurreducens performs direct electron transfer (DET) via multiheme cytochromes C and type IV pili (e-pili) composed of the PilA protein.
    explanation: Supports multiheme c-type cytochrome-mediated direct electron transfer in Geobacter sulfurreducens; OmcZ (GSU2076, UniProtKB:Q74A90) is an outer-surface octaheme c-type cytochrome from the PCA reference assembly GCF_000007985.2.
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The syntrophy was not reliant on phenazine, since Δphz mutant strain cocultures grew, however appeared to rely on cytochromes as evidenced from the stunted growth G. sulfurreducens ΔomcZ and ΔomcS mutant cocultures.
    explanation: Deletion mutant coculture assay demonstrating stunted syntrophic growth of Geobacter sulfurreducens ΔomcZ (GSU2076) in formate-fumarate electroactive coculture with Pseudomonas aeruginosa.
- gene_id: UniProtKB:Q74A86
  gene_symbol: omcB
  locus_tag: GSU2737
  product: Outer-membrane dodecaheme c-type cytochrome of the OmbB-OmaB-OmcB porin-cytochrome conduit
  genome: GCF_000007985.2
  go_terms:
  - id: GO:0009055
    label: electron transfer activity
  - id: GO:0020037
    label: heme binding
  supports_roles:
  - ELECTRON_DONOR
  - SYNTROPHIC_PARTNER
  supports_interaction: >
    Outer-membrane multiheme c-type cytochrome subunit of the conserved OmbB-OmaB-OmcB
    porin-cytochrome-cytochrome (PCC) conduit that exports periplasmic electrons across
    the outer membrane for extracellular Fe(III), electrode, and DIET coculture electron transfer.
  evidence:
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Periplasmic electrons exit through two porin-cytochrome-cytochrome (PCC3 architecture) conduits conserved among Desulfuromonadales, OmbB-OmaB-OmcB and ExtEFG
    explanation: Identifies OmcB as the outer-membrane cytochrome component of the conserved OmbB-OmaB-OmcB porin-cytochrome conduit exporting periplasmic electrons across the outer membrane in Geobacter sulfurreducens and related Desulfuromonadales.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These included genes for over 25 c-type cytochromes, including omcS, omcB, omcX, and omcI, which encode multi-heme, outer-surface c-type cytochromes.
    explanation: Transcriptomic profiling of Geobacter sulfurreducens PCA (ATCC 51573, NC_002939 / GCF_000007985.2) in DIET coculture demonstrates significant upregulation of omcB (GSU2737) during direct interspecies electron transfer.
notes: >
  Reusable taxon record capturing the verified UniProtKB protein accessions for the
  conductive-pili and multiheme-cytochrome genes (pilA/Q74BW5, omcS/Q749X9,
  omcZ/Q74A90, omcB/Q74A86) in the Geobacter sulfurreducens PCA reference assembly
  (GCF_000007985.2) that underpin G. sulfurreducens' electron-transfer and
  syntrophic-partner roles in DIET cocultures, Fe(III)-reduction, and bioanode
  communities.
