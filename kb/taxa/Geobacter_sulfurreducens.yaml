  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Some studies propose that stacked π orbitals of aromatic residues in PilA facilitate conduction, while others
      suggest that micrometer-long filaments of polymerized hexaheme cytochrome OmcS are responsible for long-range electron
      transport.
    explanation: Identifies OmcS as the polymerized hexaheme c-type cytochrome forming filaments for long-range extracellular
      electron transport in Geobacter sulfurreducens.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These included genes for over 25 c-type cytochromes, including omcS, omcB, omcX, and omcI, which encode multi-heme,
      outer-surface c-type cytochromes.
    explanation: Transcriptomic profiling of Geobacter sulfurreducens PCA (ATCC 51573, NC_002939 / GCF_000007985.2) in DIET
      coculture identifies omcS (GSU2504) among outer-surface multiheme c-type cytochrome genes significantly upregulated
      during direct interspecies electron transfer.
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The syntrophy was not reliant on phenazine, since Δphz mutant strain cocultures grew, however appeared to rely
      on cytochromes as evidenced from the stunted growth G. sulfurreducens ΔomcZ and ΔomcS mutant cocultures.
    explanation: Deletion mutant coculture assay demonstrating stunted syntrophic growth of Geobacter sulfurreducens ΔomcS
      (GSU2504) in formate-fumarate electroactive coculture with Pseudomonas aeruginosa.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In methanogenic environments, Geobacter spp.—particularly G. sulfurreducens—serve as canonical DIET performers,
      transferring electrons to methanogens such as Methanosaeta and Methanosarcina via conductive pili (microbial nanowires)
      and multiheme cytochromes like OmcS.
    explanation: Identifies the multiheme cytochrome OmcS of Geobacter sulfurreducens as a canonical direct interspecies electron
      transfer (DIET) conduit transferring electrons to syntrophic partners.
  - reference: PMID:31537786
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The plasmid pSyn2973-omcS was constructed by inserting the Prbcl-omcS-Trbcs-Kan expression cassette, which consisted
      of the promoter Prbcl, the coding region of omcS from Geobacter sulfurreducens, the terminator TrbcS, and a kanamycin
      resistance gene (Kan), into the plasmid pBR322 flanked by the sequences homologous to the up- and downstream fragments
      of gene glcD1.
    explanation: Documents heterologous expression of the Geobacter sulfurreducens omcS coding region in the engineered cyanobacterial
      partner Syn2973-omcS-ldh of the D-lactate-mediated biophotovoltaic consortium (CommunityMech:000211), where Syn2973-omcS-ldh
      produced higher D-lactate concentrations than Syn2973-ldh without direct extra anodic current from omcS in the cyanobacterial
      host.
  - reference: PMID:32849356
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: A search for cytochrome OmcS homologs was performed as above for e-pili against the same internal BLASTP database,
      using the G. sulfurreducens OmcS sequence ( WP_119334099.1 ) as query, giving 47 sequences with default search parameters.
    explanation: Uses the canonical Geobacter sulfurreducens PCA OmcS protein sequence (RefSeq WP_119334099.1, corresponding
      to locus GSU2504 / UniProtKB:Q749X9 in reference assembly GCF_000007985.2) as the reference BLASTP query to identify
      extracellular electron-transfer cytochrome filament homologs in the Rifle bioanode community (CommunityMech:000241).
  - reference: PMID:34986141
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: A small 6 heme-binding cytochrome c protein OmcS was recently shown to form the conductive extracellular “nanowires”
      in G. sulfurreducens that are thought to imbue the biofilms with conductive properties
    explanation: Comparative EET pathway analysis in PMID:34986141 (CommunityMech:000134) characterizes the Geobacter sulfurreducens
      hexaheme cytochrome c protein OmcS (GSU2504, UniProtKB:Q749X9, GCF_000007985.2) as forming conductive extracellular
      nanowires that imbue biofilms with conductive properties.
  - reference: PMID:32849356
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We searched all genomes specifically for homologs to cytochrome OmcS in light of recent evidence that this protein
      self-assembles to form conductive filaments in G. sulfurreducens, which along with e-pili have been described as bacterial
      “nanowires”
    explanation: Comparative metagenomic analysis of extracellular electron-transfer pathways in PMID:32849356 (CommunityMech:000241)
      cites self-assembly of Geobacter sulfurreducens cytochrome OmcS (GSU2504, UniProtKB:Q749X9, GCF_000007985.2) into conductive
      extracellular filaments (nanowires) as the rationale for searching all 86 bioanode genomes for OmcS homologs.
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The omcX and omcS-like genes in the oet gene cassette are often found in an analogous position to omcS and omcT
      in G. sulfurreducens ( Fig 2 ).
    explanation: Establishes that the omcX and omcS-like multiheme cytochrome c genes in syntrophic SRB oet extracellular
      electron transfer gene cassettes occupy a conserved genomic position analogous to omcS (GSU2504) and omcT in Geobacter
      sulfurreducens (CommunityMech:000134, CommunityMech:000276).
  - reference: PMID:40845095
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In model electroactive bacteria such as Geobacter and Shewanella, cytochromes such as PpcA, OmcS, OmcZ, MtrA,
      and MtrC exhibit redox-active windows spanning several hundred millivolts ( Fig. 4, A and B ), enabling them to transfer
      electrons to acceptors with more negative midpoint potentials, such as anthraquinone-2,6-disulfonate (AQDS; −186 mV)
      and flavins (−210 mV) ( 52 – 57 ).
    explanation: Establishes that the outer-surface hexaheme cytochrome OmcS (GSU2504, UniProtKB:Q749X9, GCF_000007985.2)
      in Geobacter exhibits a broad multi-hundred-millivolt redox-active window enabling extracellular electron transfer to
      low-potential acceptors (CommunityMech:000134, CommunityMech:000276).
  - reference: PMID:32849356
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: A total of 22 sequences were deemed to be true OmcS homologs, with all but one of these found in five of the
      six Geobacter genomes (see Supplementary Table S2 and Supplementary File S6 ).
    explanation: BLASTP and alignment screening in PMID:32849356 (CommunityMech:000241) using the canonical Geobacter sulfurreducens
      PCA hexaheme cytochrome OmcS sequence (WP_119334099.1, locus GSU2504 / UniProtKB:Q749X9 in reference assembly GCF_000007985.2)
      as query identifies 22 true OmcS homologs distributed across five of the six Rifle bioanode Geobacter genomes.
