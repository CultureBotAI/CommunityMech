  - ELECTROGEN
  - SYNTROPHIC_PARTNER
  supports_interaction: 'Terminal reductase of the Mtr extracellular electron transfer pathway; transfers electrons to extracellular
    acceptors (e.g. Fe(III)/Mn(IV) oxides, NCM metal oxides, electrodes, and flavin electron shuttles), underpinning direct
    and mediated interspecies/electrode electron transfer interactions.

    '
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: MtrC and OmcA decaheme c‐Cyts, MtrB β‐barrel trans‐OM protein, MtrA periplasmic decaheme c‐Cyts, CymA inner membrane
      tetraheme c‐Cyts.
    explanation: Identifies MtrC as an outer-membrane decaheme c-type cytochrome component of the S. oneidensis MR-1 extracellular
      electron-transfer pathway.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: confirming that the disruption of MtrC and OmcA significantly inhibited the EET process in strain SO3.
    explanation: Genetic deletion evidence showing that MtrC and OmcA mediate extracellular electron transfer in S. oneidensis
      MR-1 derivative SO3.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cyclic voltammetry (CV) analysis of the co‐culture AS and CS consortia (Figure  2d ) revealed a reversible redox
      peak at ≈−0.32 and −0.37 V, attributed to the electron conversion of flavin‐bound MtrC/OmcA.
    explanation: Cyclic voltammetry of Shewanella oneidensis MR-1 electrosynthetic cocultures with Clostridium aceticum and
      Acetobacterium woodii demonstrates redox activity of flavin-bound MtrC (SO_1778, UniProtKB:Q8EG33) during interspecies
      electron transfer.
  - reference: PMID:39504696
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the electro-syntrophic consortium, the membrane-bound CymA-OmcA-MtrC protein complexes of S. oneidensis drive
      the generation, transfer and consumption of electrons, thus enabling modulation of microbial metabolic activity.
    explanation: Demonstrates that the membrane-bound CymA-OmcA-MtrC protein complex of Shewanella oneidensis drives electron
      harvest from Fe0 biocorrosion and interspecies electron transfer to Pseudomonas aeruginosa in the electro-syntrophic
      denitrifying consortium.
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'CymA: an inner membrane tetraheme cytochrome c; MtrA: a periplasmic decaheme cytochrome c; MtrB: a non-heme
      outer membrane porin protein; MtrC/OmcA: two outer membrane decaheme c-type cytochromes; NapA: periplasmic nitrate reductase'
    explanation: Identifies MtrC (SO_1778, UniProtKB:Q8EG33) as one of two outer-membrane decaheme c-type cytochromes in the
      Shewanella oneidensis MR-1 (ATCC 700550) extracellular electron-transfer pathway coupling D-lactate oxidation to anodic
      current production in the Synechococcus-Shewanella biophotovoltaic consortium.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The deletion of the genes mtrC and omcA was performed in the wild‐type strain S. oneidensis MR‐1, which was subsequently
      transformed with the plasmid pHG13‐Ptac‐ribADEHC‐irrE, resulting in the mutant strains SO3∆mtrC, SO3∆omcA, and SO3∆mtrC∆omcA.
    explanation: Documents targeted homologous-recombination deletion of mtrC (SO_1778, UniProtKB:Q8EG33, GCF_000146165.2)
      in wild-type Shewanella oneidensis MR-1 followed by transformation with pHG13-Ptac-ribADEHC-irrE to generate strains
      SO3∆mtrC and SO3∆mtrC∆omcA for extracellular electron-transfer and NCM bioleaching perturbation assays in CommunityMech:000385.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sucrose‐resistant and gentamycin‐sensitive colonies were screened, and the successful mtrC‐ and omcA‐deleted
      mutants were verified via colony PCR and subsequent Sanger sequencing.
    explanation: Documents sucrose-counterselection screening and colony PCR plus Sanger-sequencing verification of the targeted
      mtrC (SO_1778, UniProtKB:Q8EG33, GCF_000146165.2) gene deletion in Shewanella oneidensis MR-1 used to benchmark MtrC-mediated
      extracellular electron transfer across the SO1-BS1 / SO2-BS2 / SO3-BS3 lithium-battery bioleaching consortium series
      (CommunityMech:000519, CommunityMech:000520, CommunityMech:000385).
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cellular electrophysiology analyses reveal that S. oneidensis utilizes c‐type cytochromes MtrC and OmcA, and
      riboflavin to transfer electrons to NCM.
    explanation: Cellular electrophysiology analyses in PMID:42733304 demonstrate that Shewanella oneidensis MR-1 utilizes
      the outer-membrane decaheme c-type cytochrome MtrC (SO_1778, UniProtKB:Q8EG33, GCF_000146165.2) alongside OmcA and riboflavin
      to transfer electrons to spent NCM cathode particles across the SO1, SO1-BS1, SO2-BS1, SO2-BS2, and SO3-BS3 lithium-battery
      bioleaching series (CommunityMech:000524, CommunityMech:000519, CommunityMech:000523, CommunityMech:000520, CommunityMech:000385).
