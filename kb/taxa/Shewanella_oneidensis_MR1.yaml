  notes: >
    Type strain MR-1 (= ATCC 700550 = CIP 106686) of validly published species
    Shewanella oneidensis (Venkateswaran et al. 1999; LPSN species Shewanella
    oneidensis, phylum Pseudomonadota, class Gammaproteobacteria).
