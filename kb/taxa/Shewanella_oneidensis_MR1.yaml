    extracellular electron transfer.
- gene_id: KEGG:son:SO_4591
  gene_symbol: cymA
  locus_tag: SO_4591
  product: Inner-membrane tetraheme c-type cytochrome (menaquinol oxidase) feeding the Mtr pathway
