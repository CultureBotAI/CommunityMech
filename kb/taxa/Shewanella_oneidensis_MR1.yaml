  notes: RefSeq reference assembly for Shewanella oneidensis MR-1.
genes:
- gene_id: UniProtKB:Q8EG33
  gene_symbol: mtrC
  locus_tag: SO_1778
  product: Outer-membrane decaheme c-type cytochrome (terminal extracellular electron-transfer reductase)
  genome: GCF_000146165.2
  kegg_ortholog: K07234
  go_terms:
  - id: GO:0009055
    label: electron transfer activity
  - id: GO:0020037
    label: heme binding
  supports_roles:
  - ELECTRON_DONOR
  - ELECTROGEN
  - SYNTROPHIC_PARTNER
  supports_interaction: >
    Terminal reductase of the Mtr extracellular electron transfer pathway; transfers
    electrons to extracellular acceptors (e.g. Fe(III)/Mn(IV) oxides, NCM metal oxides,
    electrodes, and flavin electron shuttles), underpinning direct and mediated
    interspecies/electrode electron transfer interactions.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: MtrC and OmcA decaheme c‐Cyts, MtrB β‐barrel trans‐OM protein, MtrA periplasmic decaheme c‐Cyts, CymA inner membrane tetraheme c‐Cyts.
    explanation: Identifies MtrC as an outer-membrane decaheme c-type cytochrome component of the S. oneidensis MR-1 extracellular electron-transfer pathway.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: confirming that the disruption of MtrC and OmcA significantly inhibited the EET process in strain SO3.
    explanation: Genetic deletion evidence showing that MtrC and OmcA mediate extracellular electron transfer in S. oneidensis MR-1 derivative SO3.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cyclic voltammetry (CV) analysis of the co‐culture AS and CS consortia (Figure  2d ) revealed a reversible redox peak at ≈−0.32 and −0.37 V, attributed to the electron conversion of flavin‐bound MtrC/OmcA.
    explanation: Cyclic voltammetry of Shewanella oneidensis MR-1 electrosynthetic cocultures with Clostridium aceticum and Acetobacterium woodii demonstrates redox activity of flavin-bound MtrC (SO_1778, UniProtKB:Q8EG33) during interspecies electron transfer.
  - reference: PMID:39504696
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the electro-syntrophic consortium, the membrane-bound CymA-OmcA-MtrC protein complexes of S. oneidensis drive the generation, transfer and consumption of electrons, thus enabling modulation of microbial metabolic activity.
    explanation: Demonstrates that the membrane-bound CymA-OmcA-MtrC protein complex of Shewanella oneidensis drives electron harvest from Fe0 biocorrosion and interspecies electron transfer to Pseudomonas aeruginosa in the electro-syntrophic denitrifying consortium.
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'CymA: an inner membrane tetraheme cytochrome c; MtrA: a periplasmic decaheme cytochrome c; MtrB: a non-heme outer membrane porin protein; MtrC/OmcA: two outer membrane decaheme c-type cytochromes; NapA: periplasmic nitrate reductase'
    explanation: Identifies MtrC (SO_1778, UniProtKB:Q8EG33) as one of two outer-membrane decaheme c-type cytochromes in the Shewanella oneidensis MR-1 (ATCC 700550) extracellular electron-transfer pathway coupling D-lactate oxidation to anodic current production in the Synechococcus-Shewanella biophotovoltaic consortium.
- gene_id: UniProtKB:Q8EG34
  gene_symbol: mtrB
  locus_tag: SO_1776
  product: Outer-membrane beta-barrel that embeds the MtrA/MtrC cytochrome module
  genome: GCF_000146165.2
  go_terms:
  - id: GO:0015288
    label: porin activity
  supports_roles:
  - ELECTRON_DONOR
  - ELECTROGEN
  - SYNTROPHIC_PARTNER
  supports_interaction: >
    Forms the outer-membrane conduit of the MtrCAB porin-cytochrome complex enabling
    electron egress to extracellular acceptors.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: MtrC and OmcA decaheme c‐Cyts, MtrB β‐barrel trans‐OM protein, MtrA periplasmic decaheme c‐Cyts, CymA inner membrane tetraheme c‐Cyts.
    explanation: Identifies MtrB as the beta-barrel trans-outer-membrane protein of the S. oneidensis MR-1 Mtr extracellular electron-transfer conduit.
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Its porin-cytochrome complex MtrCAB spans the outer membrane, enabling electron flow through a 20-heme relay and can also release soluble flavins to transport electrons to electrodes or other microbes.
    explanation: Supports the role of the MtrCAB outer-membrane porin-cytochrome complex in direct and flavin-mediated electron transfer in S. oneidensis.
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'CymA: an inner membrane tetraheme cytochrome c; MtrA: a periplasmic decaheme cytochrome c; MtrB: a non-heme outer membrane porin protein; MtrC/OmcA: two outer membrane decaheme c-type cytochromes; NapA: periplasmic nitrate reductase'
    explanation: Identifies MtrB (SO_1776, UniProtKB:Q8EG34) as the non-heme outer-membrane porin protein of the Shewanella oneidensis MR-1 (ATCC 700550) extracellular electron-transfer pathway in the Synechococcus-Shewanella biophotovoltaic consortium.
