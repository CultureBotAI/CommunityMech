    evidence_source: IN_VITRO
    snippet: the electrons generated from strain SO3 could be either directly transferred to NCM via outer membrane c‐Cyts MtrC and OmcA, or first transferred to riboflavin molecules via MtrC and OmcA.
    explanation: Supports OmcA's function alongside MtrC in direct and riboflavin-mediated extracellular electron transfer.
  - reference: PMID:41236292
