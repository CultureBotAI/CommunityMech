    explanation: Characterizes the reference decaheme periplasmic cytochrome MtrA from Shewanella oneidensis MR-1 (SO_1777,
      UniProtKB:Q8EG35, GCF_000146165.2) as having 10 heme-binding motifs at 25.1 amino-acid residues per heme during comparative
      sequence analysis of extracellular electron-transfer multiheme cytochromes in CommunityMech:000241.
  - reference: PMID:32849356
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The decaheme cytochrome MtrA from Shewanella oneidensis MR-1 is shown using the same horizontal scale (amino-acid
      sequence length) as the three larger MHCs.
    explanation: Comparative multiheme c-type cytochrome sequence alignment in PMID:32849356 (CommunityMech:000241, Figure
      4A) uses the decaheme cytochrome MtrA from Shewanella oneidensis MR-1 (SO_1777, UniProtKB:Q8EG35, GCF_000146165.2) as
      the reference sequence length and heme-packing benchmark.
