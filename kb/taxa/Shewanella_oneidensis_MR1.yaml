  - reference: PMID:32849356
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'Four separate models were constructed based on the following porin proteins from Shewanella oneidensis MR-1
      and Geobacter sulfurreducens PCA: MtrB (SO_1776) ( Hartshorne et al., 2009 ), OmbB (GSU2733), ExtB (GSU2644)/ExtE (GSU2726),
      and ExtI (GSU2939) ( Liu et al., 2014 ; Chan et al., 2016 ).'
    explanation: Explicitly identifies Shewanella oneidensis MR-1 MtrB by its canonical locus tag SO_1776 (UniProtKB:Q8EG34,
      GCF_000146165.2) as the reference outer-membrane porin protein used to build profile HMMs for porin-cytochrome complex
      (PCC) extracellular electron-transfer conduits in CommunityMech:000241.
