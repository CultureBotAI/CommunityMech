    explanation: Identifies OmcA (SO_1779, UniProtKB:Q8EG32) as one of two outer-membrane decaheme c-type cytochromes in the Shewanella oneidensis MR-1 (ATCC 700550) extracellular electron-transfer pathway in the Synechococcus-Shewanella biophotovoltaic consortium.
