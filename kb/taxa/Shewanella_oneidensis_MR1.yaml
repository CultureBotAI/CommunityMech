    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'These MHCs display a remarkably high density of heme-binding motifs: the 24- and 49-heme cytochromes use only
      22.4 and 23.4 residues per heme, respectively (for reference, the decaheme periplasmic cytochrome MtrA from Shewanella
