notes: 'Reusable taxon record capturing the verified UniProtKB protein accessions for the Mtr extracellular-electron-transfer
  pathway genes (mtrC/Q8EG33, mtrB/Q8EG34, mtrA/Q8EG35, omcA/Q8EG32, cymA/Q8E945) in the Shewanella oneidensis MR-1 reference
  assembly (GCF_000146165.2) that underpin S. oneidensis MR-1''s electron-donor, electrogenic, and syntrophic-partner roles
  in microbial fuel cell, metal-reduction, bioleaching, and electrosyntrophic communities.

  '
