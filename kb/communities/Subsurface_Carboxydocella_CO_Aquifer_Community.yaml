- name: CODH-Associated CO-Oxidation Potential
  description: The source infers a before/after difference in Carboxydocella CO-oxidation potential from CODH gene
    analysis. Preserve this genomic interpretation, not a demonstrated physiological switch or a measured oxidation
    rate.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: carbon monoxide
    term:
      id: CHEBI:17245
      label: carbon monoxide
  downstream:
