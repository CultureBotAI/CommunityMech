ecological_interactions:
- name: scCO2 Injection Reshapes Subsurface Community
  description: The source reports community-structure changes following supercritical carbon dioxide injection into
    the deep aquifer. Retain the field perturbation as abiotic input context; the accessible abstract does not isolate
    the mechanism of the community response.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  downstream:
  - target: Post-Injection Carboxydocella Decline
    description: 'HYPOTHESIZED/PARTIAL: the injected supercritical carbon dioxide is the upstream field perturbation
      proposed to alter conditions underlying the subsequent Carboxydocella relative-abundance decrease. The temporal
      association does not establish that aggregate community restructuring itself caused the decline or isolate
      the physiological mediator.'
  evidence:
  - reference: PMID:32633030
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: changes to the microbial community structure of a deep aquifer (1.4 km) receiving 150 tons of injected
      supercritical CO2
    explanation: Supports the scCO2 injection effect on community structure.
- name: Post-Injection Carboxydocella Decline
  description: Carboxydocella decreased in relative abundance after the field injection. Relative abundance does
    not establish absolute cell loss, mortality or a measured fitness decrease, and the accessible abstract does
    not isolate the mechanism.
  scope: COMMUNITY_LEVEL
  metabolites:
