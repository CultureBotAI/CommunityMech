    description: 'HYPOTHESIZED/PARTIAL: a change in encoded CO-oxidation potential could alter carbon/electron flow
      through carbon monoxide. The source discusses this implication; the accessible abstract does not report a
      measured flux or isolate CODH variation as the causal mediator.'
