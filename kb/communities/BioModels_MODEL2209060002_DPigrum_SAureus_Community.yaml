ecological_interactions:
- name: D. pigrum Competitive Exclusion of S. aureus
  description: Dolosigranulum pigrum exhibits negative microbe-microbe interactions with Staphylococcus
    aureus in the human nasal habitat. Metabolic modeling reveals that D. pigrum competitively inhibits
    S. aureus growth through metabolic exchange factors. Epidemiological studies identify D. pigrum as
    a beneficial bacterium based on its positive association with health and negative associations with
    S. aureus colonization. This competitive exclusion mechanism suggests that D. pigrum may prevent disease-causing
    infections by inhibiting pathogen growth in the nasal microbiome.
  interaction_type: COMPETITION
  source_taxon:
    preferred_term: Dolosigranulum pigrum
    term:
      id: NCBITaxon:29394
      label: Dolosigranulum pigrum
  target_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    concentration: Potential inhibitory metabolite
  evidence:
  - reference: doi:10.3389/fcimb.2022.925215
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Multiple epidemiological studies identify Dolosigranulum pigrum as a likely beneficial bacterium
      based on its positive association with health, including negative associations with S. aureus.
    explanation: Demonstrates the negative association between D. pigrum and S. aureus, supporting competitive
      exclusion.
  - reference: doi:10.3389/fcimb.2022.925215
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: By this, we identify and characterize metabolic exchange factors involved in a specific interaction
      between D. pigrum and S. aureus as an in silico candidate factor for a deep insight into the associated
      species.
    explanation: Supports the identification of metabolic factors mediating the competitive interaction
      between D. pigrum and S. aureus.
  - reference: doi:10.3389/fcimb.2022.925215
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Its direct application suggests new ways to prevent disease-causing infections by inhibiting
      the growth of pathogens such as S. aureus through microbe–microbe interactions.
    explanation: Demonstrates the potential of D. pigrum to inhibit S. aureus pathogen growth through
      competitive interactions.
