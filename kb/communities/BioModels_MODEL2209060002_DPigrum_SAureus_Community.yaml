ecological_interactions:
- name: D. pigrum-S. aureus Exchange-Factor Prediction
  description: COMPUTATIONAL - compartmentalized community FBA predicts medium- and objective-dependent exchanges
    for D. pigrum and S. aureus. Cysteine uptake and D-serine secretion are candidate outputs, not demonstrated
    antimicrobial production. Figure 4 states that S. aureus growth does not depend on the highlighted cysteine/D-serine
    fluxes, so they are not established mediators of inhibition.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Dolosigranulum pigrum
    term:
      id: NCBITaxon:29394
      label: Dolosigranulum pigrum
  target_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.3389/fcimb.2022.925215
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: By this, we identify and characterize metabolic exchange factors involved in a specific interaction
      between D. pigrum and S. aureus as an in silico candidate factor for a deep insight into the associated species.
    explanation: 'Supports the computational exchange-factor predictions for the pairwise nasal model.

      '
- name: In Silico S. aureus Growth-Inhibition Hypothesis
  description: COMPUTATIONAL - S. aureus growth varies with model formulation, medium and imposed objective weights.
    Equal weights generally favor S. aureus, while sufficiently high D. pigrum weight can suppress modeled S. aureus
    growth. These weights are not measured inoculation dynamics. The paper's competition index is not automatically
    reciprocal negative fitness under the local schema; poor-medium forced-growth scenarios can instead require
    S. aureus-to-D. pigrum support. No clinical efficacy is established.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Dolosigranulum pigrum
    term:
      id: NCBITaxon:29394
      label: Dolosigranulum pigrum
  target_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.3389/fcimb.2022.925215
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Multiple epidemiological studies identify Dolosigranulum pigrum as a likely beneficial bacterium based
      on its positive association with health, including negative associations with S. aureus.
    explanation: Background epidemiological associations motivate this modeling study but do not validate its inhibitory
      mechanism.
  - reference: doi:10.3389/fcimb.2022.925215
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Its direct application suggests new ways to prevent disease-causing infections by inhibiting the growth
      of pathogens such as S. aureus through microbe–microbe interactions.
    explanation: An application proposed by the authors, not measured pathogen inhibition or clinical prevention.
  - reference: doi:10.3389/fcimb.2022.925215
    snippet: S. aureus failed to grow
    explanation: This occurs in the pooled model at a 10:1 objective weight favoring D. pigrum; it is a conditional
      computational outcome.
    evidence_source: COMPUTATIONAL
    supports: SUPPORT
