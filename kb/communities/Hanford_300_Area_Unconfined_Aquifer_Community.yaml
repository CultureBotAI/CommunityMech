ecological_interactions:
- name: Columbia River Intrusion Community Turnover
  description: Seasonal Columbia River water intrusion changes nitrate and groundwater elevation conditions,
    causing temporal turnover in aquifer microbial community composition, especially in shallow wells.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: intrusion-associated Actinobacteria
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  target_taxon:
    preferred_term: Hanford groundwater bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  evidence:
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The shift in community composition associated with the large dynamics in Actinobacteria
      ACK-M1 and other clades suggested that river water intrusion could have significant impacts on
      microbial community composition.
    explanation: Supports river-water intrusion as a driver of temporal community turnover.
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Here, we demonstrate that Columbia River water intrusion affects microbial community composition
      in the aquifer, 250 m from the shoreline.
    explanation: Supports hydrologic intrusion as a structuring mechanism for the aquifer community.
- name: Depth-Structured Redox Guilds
  description: Deeper groundwater near the Hanford-Ringold formation boundary and redox transition zone
    had higher proportions of putative ammonia oxidizers, methane oxidizers, and metal reducers, indicating
    spatial niche partitioning by electron-donor and electron-acceptor availability.
