id: CommunityMech:000138
name: Hanford 300 Area Unconfined Aquifer Community
description: A natural, contaminant-impacted groundwater microbial community from the Hanford Site 300
  Area Integrated Field Research Challenge site in eastern Washington. 16S rRNA gene pyrosequencing of
  groundwater bacteria and archaea across three well clusters and multiple depths showed strong temporal
  and spatial community dynamics linked to Columbia River water intrusion, depth, nitrate, uranium, and
  redox conditions. The community includes Proteobacteria, Bacteroidetes, Actinobacteria, Acidobacteria,
  OP3, low-abundance archaea, and functional guilds such as putative methane oxidizers, sulfur oxidizers,
  ammonia-oxidizing archaea, and metal reducers.
