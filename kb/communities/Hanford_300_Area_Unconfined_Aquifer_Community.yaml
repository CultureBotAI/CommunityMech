    evidence_source: IN_VIVO
    snippet: Spatial and temporal patterns for several 16S rRNA gene operational taxonomic units associated
      with particular physiological functions (for example, methane oxidizers and metal reducers) suggests
      dynamic changes in fluxes of electron donors and acceptors over an annual cycle.
    explanation: Supports annual redox dynamics affecting functional guilds.
environmental_factors:
- name: Columbia River water intrusion
  value: nitrate mixing signal from 0.4 mg nitrate/L river water and 25 mg nitrate/L groundwater
  description: Changes in nitrate concentration were used to estimate mixing of Columbia River water into
    the unconfined aquifer, with low-nitrate river-water intrusion affecting community composition.
  evidence:
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: River water intrusion was estimated from nitrate concentrations according to a simple mixing
      calculation, based upon the relative nitrate concentrations of 0.4 and 25 mg nitrate l-1 in river
      and ground water.
    explanation: Supports nitrate as an environmental indicator of river-water intrusion.
- name: Vertical aquifer sampling depth
  value: 10 m water-table, 13 m mid-Hanford formation, and 17 m near Hanford-Ringold contact
  description: Each well cluster sampled multiple depths in the Hanford formation, capturing vertical
    gradients that structured microbial composition and redox guilds.
  evidence:
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Each three-well cluster was completed at short (1 m) intervals within the Hanford formation:
      near the water table (10 m), at the middle of the Hanford formation (13 m) and near the contact
      with the underlying Ringold formation (17 m).
    explanation: Supports the vertical groundwater sampling design and depth gradient.
- name: Hanford 300 Area contaminant context
  value: uranium and inorganic contaminants from historical nuclear materials production
  description: The Hanford 300 Area unconfined aquifer is contaminated by historical nuclear-materials
    production activities, including uranium-relevant geochemistry.
  evidence:
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At the Hanford Site 300 Area, the unconfined subsurface aquifer is subject to intrusion
      of organic and inorganic contaminants from a variety of sources associated with historical nuclear
      materials production
    explanation: Supports the contaminant-impacted setting of this groundwater community.
metals_present:
- URANIUM
metal_relevance: SIGNIFICANT
metal_notes: Uranium is included because the Hanford 300 Area aquifer is a historically contaminated DOE
  site and the study measured uranium concentrations during groundwater sampling; the record does not
  assert direct uranium reduction without experimental evidence.
