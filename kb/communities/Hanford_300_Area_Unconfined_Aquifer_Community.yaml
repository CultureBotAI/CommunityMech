ecological_interactions:
- name: Columbia River Intrusion Community Turnover
  description: Field 16S profiles showed temporal community turnover associated with seasonal Columbia River intrusion,
    particularly near the water table. The authors identify intrusion as a structuring influence using hydrology
    and nitrate-based mixing estimates. These positive field observations do not isolate nitrate from transported
    cells or other covarying environmental changes, or show that community turnover causes electron-donor/acceptor
    flux. The four canonical broad taxon groups are a curated subset, not the complete sampled community.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    notes: Environmental context, not a demonstrated partner-to-partner transfer or guild-specific flux.
  evidence:
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The shift in community composition associated with the large dynamics in Actinobacteria ACK-M1 and
      other clades suggested that river water intrusion could have significant impacts on microbial community composition.
    explanation: Supports intrusion-associated composition dynamics, not a selectively identified chemical mediator
      or reverse community-to-flux causal effect.
  - reference: PMID:22456444
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Here, we demonstrate that Columbia River water intrusion affects microbial community composition in
      the aquifer, 250 m from the shoreline.
    explanation: Supports the authors' field-based hydrologic interpretation; it does not resolve a pairwise niche-partitioning
      mechanism.
  participating_taxa:
