- name: Putative Guild Patterns and Inferred Redox Resource Dynamics
  description: PARTIAL - spatial and temporal 16S OTU patterns assigned to putative methane-oxidizing and metal-reducing
    guilds suggest changing electron-donor and electron-acceptor availability. This is a functional and resource-dynamics
    inference from community profiles, not direct measurement of annual metabolic flux or demonstrated niche partitioning.
    The broad canonical taxon subset does not identify every guild member.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    notes: Environmental context, not a demonstrated partner-to-partner transfer or guild-specific flux.
  evidence:
  - reference: PMID:22456444
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Spatial and temporal patterns for several 16S rRNA gene operational taxonomic units associated with
      particular physiological functions (for example, methane oxidizers and metal reducers) suggests dynamic changes
      in fluxes of electron donors and acceptors over an annual cycle.
    explanation: Supports the authors' inference from physiological assignments of 16S OTUs, not measured annual
      donor/acceptor flux or a causal link from community turnover.
  participating_taxa:
