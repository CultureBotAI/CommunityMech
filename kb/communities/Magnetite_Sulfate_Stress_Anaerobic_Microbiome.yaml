    term:
      id: GO:0015948
      label: methanogenesis
  - preferred_term: dissimilatory sulfate reduction
    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: PMID:42231497
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      the presence of magnetite reversed the sulfate-induced inhibition at 0.6
      g/L sulfate, resulting in a 19% increase in CH4 production in MAGN_0.6
      compared to SULF_0.6
    explanation: >
      Supports the 19% methane-production rescue by magnetite at moderate
      sulfate stress.
  - reference: PMID:42231497
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Magnetite reduced dissolved sulfide species accumulation via
      precipitation and increased methane production by 19% at 0.6 g/L sulfate
      addition without limiting sulfate utilization.
    explanation: >
      Supports the combined sulfide-scavenging and methane-enhancing outcome.
- name: Acetate-centered four-guild redox cycling
  description: >
    Genome-scale metabolic models for the representative methanogen, SRB,
    homoacetogen, and SAOB MAGs supported acetate turnover in which the
    homoacetogen consumes H2 and CO2 to secrete acetate, and acetate is then
    oxidized back to H2 and CO2 by SAOB or used by SRB as an electron donor for
    sulfate reduction.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
