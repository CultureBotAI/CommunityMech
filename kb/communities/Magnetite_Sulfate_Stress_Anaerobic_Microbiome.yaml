ecological_interactions:
- name: Magnetite-enhanced methanogenesis under sulfate stress
  description: >
    Adding 10 g/L magnetite to the 0.6 g/L sulfate condition relieved the
    sulfate-associated methane-production penalty, reduced sulfide stress
    through precipitation, and increased CH4 production by 19% relative to the
    sulfate-only treatment without eliminating sulfate-reducer activity.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  - preferred_term: hydrogen sulfide
    term:
      id: CHEBI:16136
      label: hydrogen sulfide
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
