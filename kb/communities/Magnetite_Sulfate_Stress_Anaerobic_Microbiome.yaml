    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: PMID:42231497
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      The curated GEMs of the individual species were then integrated into
      multispecies community networks, one per condition, i.e., for CTRL,
      SULF_0.6, and MAGN_0.6.
    explanation: >
      Identifies the condition-specific four-member community GEMs behind the
      flux predictions.
  - reference: PMID:42231497
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      Solution-space sampling further identified acetate as a central
      intermediate, produced and consumed by multiple guilds, with its turnover
      redistributing carbon and reducing equivalents across the community and
      thereby influencing methane formation.
    explanation: >
      Supports acetate as the shared intermediate in the modeled four-guild
      redox cycle.
- name: Model-predicted amino-acid and organic-acid exchange
  description: >
    Flux-space sampling of the community GEMs predicted exchange of glucogenic
    amino acids and short-chain organic acids among the four modeled guilds,
    with the homoacetogen, SAOB, and methanogen acting as major exchange hubs
    and the SRB predicted to import several amino acids.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
