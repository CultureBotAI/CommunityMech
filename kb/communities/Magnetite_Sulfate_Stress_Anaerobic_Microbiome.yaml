id: CommunityMech:000380
name: Magnetite Sulfate-Stress Anaerobic Microbiome
description: >
  A H2/CO2-fed methanogenic mixed culture, inoculated from mesophilic
  anaerobic-digester sludge and cultivated in anoxic serum bottles, that was
  perturbed with sulfate and magnetite to test how a conductive Fe(II)/Fe(III)
  oxide reshapes sulfate-stressed anaerobic digestion. Vayena et al. (2026)
  compared a sulfate-free control with 0.6 and 1.2 g/L sulfate, with and
  without 10 g/L magnetite. At the moderate sulfate dose, magnetite increased
  methane production by 19% while retaining sulfate reduction and supporting a
  genome-resolved cooperative network among Methanoculleus methanogens,
  putative sulfate-reducing bacteria, Limnochordia homoacetogens, and
  Dethiobacteria syntrophic acetate oxidizers. Community genome-scale
  metabolic models for representative MAGs supported acetate, amino-acid, and
  carboxylate exchange among these guilds, but the paper explicitly leaves
  direct DIET validation for future experiments.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: METHANOGENESIS
engineering_design:
  objective: >
    Test whether magnetite can improve methanogenesis under elevated sulfate by
    scavenging H2S and modulating syntrophic interactions in a H2/CO2-fed mixed
    anaerobic-digestion culture.
  perturbation_design: >
    Compare sulfate-free controls with 0.6 and 1.2 g/L sulfate treatments in
    the presence or absence of 10 g/L magnetite.
  measurement_endpoints:
  - CH4 production
  - CO2 and H2 consumption
  - acetate accumulation
  - sulfate consumption
  - dissolved sulfide species
  - genome-centric metagenomic MAG abundances
  - community genome-scale metabolic model fluxes
  evidence:
  - reference: PMID:42231497
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      hydrogenotrophic methanogenesis by a mixed microbial culture fed with
      H2:CO2 was tested under two sulfate concentrations, with and without the
      addition of magnetite
    explanation: >
      Defines the mixed-culture sulfate-plus-magnetite experimental design.
  - reference: PMID:42231497
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      interplay with dissolved H2S was also examined in a dedicated abiotic
      experiment
    explanation: >
      Shows that the design separated magnetite's chemical H2S scavenging
      behavior from the live-community assays.
