    snippet: >
      Flux-space sampling of the community model further provided a
      comprehensive view of feasible interspecies exchange patterns, not easily
      measurable in vivo (Supplementary material 3), suggesting extensive
      exchange of amino acids and short-chain organic acids among the four
      functional groups
    explanation: >
      Supports predicted amino-acid and organic-acid exchange among the modeled
      methanogen, SRB, homoacetogen, and SAOB guilds.
