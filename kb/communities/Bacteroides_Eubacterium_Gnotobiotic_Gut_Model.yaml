id: CommunityMech:000158
name: Bacteroides-Eubacterium Gnotobiotic Gut Model
description: >
  A defined two-member gnotobiotic mouse gut model pairing the human gut Bacteroidetes member
  Bacteroides thetaiotaomicron VPI-5482 with the human gut Firmicutes member Eubacterium rectale
  ATCC 33656. The model was used to examine niche specialization and metabolic interaction between
  dominant human gut phyla under controlled host and diet conditions. B. thetaiotaomicron expands
  polysaccharide utilization and host mucin glycan foraging in the presence of E. rectale, while
  E. rectale shifts away from glycan-degrading enzymes toward amino acid and sugar transport,
  glycolytic support, and butyrate generation from acetate.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Test microbial niche specialization, metabolic interaction, and host response in a simplified
    representative of the two dominant human gut bacterial phyla.
  assembly_strategy: Colonize germ-free mice with B. thetaiotaomicron VPI-5482, E. rectale ATCC 33656,
    or the defined two-member combination, then compare microbial and host responses across diets.
  perturbation_design: Compare monoassociation and biassociation under three dietary conditions.
  measurement_endpoints:
  - microbial whole-genome transcriptional profiles
  - cecal protein measurements
  - cecal carbohydrate-metabolism assays
  - short-chain fatty acid concentrations
  - host gut transcriptional response
  evidence:
  - reference: PMID:19321416
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: performing whole-genome transcriptional profiling of each species after colonization of gnotobiotic mice with each organism alone, or in combination under 3 dietary conditions
    explanation: Supports the monoassociation, biassociation, diet-perturbation, and transcriptional measurement design.
