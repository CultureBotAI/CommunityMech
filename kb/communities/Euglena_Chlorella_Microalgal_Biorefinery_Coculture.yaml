    snippet: EG primarily enhanced light-harvesting capacity and antioxidative metabolite secretion
    explanation: Supports the organism-associated interpretation reported from multi-omics, without access to its
      underlying assay resolution or a demonstrated transfer flux.
  source_taxon:
    preferred_term: Euglena gracilis
    term:
      id: NCBITaxon:3039
      label: Euglena gracilis
- name: Chlorella Electron Transport and Lipid Metabolite Release
  description: PARTIAL - the abstract assigns enhanced electron transport, carbon-fixation capacity and lipid-associated
    metabolite release to the Chlorella member. This profile does not establish which compounds were transferred
    to Euglena or whether either member is required for the other's growth. Publication naming is retained alongside
    the canonical Auxenochlorella pyrenoidosa taxon label.
  scope: PAIRWISE
