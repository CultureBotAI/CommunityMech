  - ecological_interactions#Synergistic Biorefinery Production
  rationale: 'Remove the two profile-to-summary part/whole arrows; retain the complementarity-to-output arrow only
    as HYPOTHESIZED. Represent single-organism profiles as intrinsic source-only nodes, not self-edges. No alpha-tocopherol
    donor is assigned from the broad antioxidative profile. Total production does not demonstrate reciprocal fitness,
    and exogenous alpha-lipoic acid is not evidence of endogenous exchange. Primary abstract only: underlying Methods/Results
    and supplements were not acquired. Preserve NCBITaxon:3078 with its canonical Auxenochlorella label and the
    publication preferred name. Non-graph omics and protocol details remain #1443; no new microbial mechanism is
    inferred from the supplementation treatment.'
