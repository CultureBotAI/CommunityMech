- name: Complementary Microalgal Metabolic Division of Labor
  description: HYPOTHESIZED - the two reported functional profiles suggest complementary metabolism in the optimized
    coculture. This summary is not a separate experimental effect caused by listing its components, nor proof of
    resource partitioning, identified donor/recipient exchange or necessary biochemical cooperation.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Euglena gracilis
    term:
      id: NCBITaxon:3039
      label: Euglena gracilis
  - preferred_term: Chlorella pyrenoidosa
    term:
      id: NCBITaxon:3078
      label: Auxenochlorella pyrenoidosa
  downstream:
  - target: Synergistic Biorefinery Production
    description: HYPOTHESIZED - complementary photosynthetic and metabolic capacities could contribute to the aggregate
      production gains. The abstract links profiles and output, but does not resolve their selective mediation or
      demonstrate reciprocal species fitness.
  evidence:
  - reference: PMID:42248260
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Multi-omics analysis revealed a clear metabolic division of labor
    explanation: Supports the authors' multi-omics interpretation of complementarity, not a selectively established
      causal mechanism for the aggregate production gains.
  - reference: PMID:42248260
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: collectively driving process intensification in terms of biomass and lipid productivity
    explanation: Supports the authors' multi-omics interpretation of complementarity, not a selectively established
      causal mechanism for the aggregate production gains.
- name: Synergistic Biorefinery Production
  description: The optimized 3:7 coculture in TAP medium showed higher total biomass, lipid productivity and alpha-tocopherol
    output than the monocultures, with a shorter reported logarithmic phase. These aggregate endpoints do not establish
    that both species benefit. Separate exogenous alpha-lipoic acid supplementation further improved output; it
    is not proof of endogenous cross-feeding or the same baseline condition.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Euglena gracilis
    term:
      id: NCBITaxon:3039
      label: Euglena gracilis
  - preferred_term: Chlorella pyrenoidosa
    term:
      id: NCBITaxon:3078
      label: Auxenochlorella pyrenoidosa
  metabolites:
  - preferred_term: alpha-tocopherol
    term:
      id: CHEBI:22470
      label: alpha-tocopherol
  evidence:
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: corresponding to 1.18-1.52-fold, 1.58-2.81-fold, and 2.13-9.90-fold increases relative to monoculture
      systems
    explanation: Supports coculture production gains relative to monocultures.
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the logarithmic growth phase was reduced by 50% (3 days)
    explanation: Supports the shortened logarithmic growth phase.
