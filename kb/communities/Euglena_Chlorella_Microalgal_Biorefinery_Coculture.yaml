ecological_interactions:
- name: Euglena Light Harvesting and Antioxidative Secretion
  description: PARTIAL - the abstract assigns enhanced light harvesting and an antioxidative secretion profile to
    Euglena gracilis from multi-omics. This is an organism-associated profile, not by itself niche partitioning
    or evidence that alpha-tocopherol was exported by this member and taken up by its partner. The underlying assays
    and organism-specific flux resolution were not accessed.
  scope: PAIRWISE
  biological_processes:
