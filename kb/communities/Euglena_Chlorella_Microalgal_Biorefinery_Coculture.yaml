    explanation: Identifies E. gracilis as a coculture member.
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: EG primarily enhanced light-harvesting capacity and antioxidative metabolite secretion
    explanation: Supports the light-harvesting and metabolite-secretion role of E. gracilis.
