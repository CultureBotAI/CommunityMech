id: CommunityMech:000325
name: Euglena-Chlorella Microalgal Biorefinery Coculture
description: >
  A defined coculture of Euglena gracilis and Chlorella pyrenoidosa optimized
  for biomass, lipid, and alpha-tocopherol production. The two phototrophs show
  complementary light-harvesting, carbon-fixation, electron-transport, and
  metabolite-secretion functions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Maximize biomass, lipid, and alpha-tocopherol production in a two-member microalgal coculture.
  assembly_strategy: Coculture Euglena gracilis and Chlorella pyrenoidosa at an optimized 3:7 inoculation ratio in TAP medium.
  perturbation_design: Compare the optimized coculture with monocultures and test alpha-lipoic acid supplementation.
  measurement_endpoints:
  - biomass concentration
  - lipid productivity
  - alpha-tocopherol yield
  - logarithmic growth-phase duration
  evidence:
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: developed a synergistic co-culture system using Euglena gracilis (EG) and Chlorella pyrenoidosa (CP)
    explanation: Supports the exact two-species engineered coculture.
environment_term:
  preferred_term: microalgal laboratory coculture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Controlled TAP-medium coculture optimized for microalgal biorefinery outputs.
