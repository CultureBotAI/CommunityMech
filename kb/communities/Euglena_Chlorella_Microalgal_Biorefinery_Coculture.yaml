    snippet: biomass concentration of 1.23 g/L, lipid productivity of 163.7 mg/L/d, and alpha-tocopherol yield of 1976.28 mug/L
    explanation: Supports all three quantitative production endpoints.
- name: Alpha-lipoic acid supplementation
