    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culture system using Euglena gracilis (EG) and Chlorella pyrenoidosa (CP)
    explanation: Identifies C. pyrenoidosa as a coculture member.
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CP intensified electron transport activity, enhanced carbon fixation capacity, and released lipid-associated metabolites
    explanation: Supports the electron-transport, carbon-fixation, and metabolite-release role of C. pyrenoidosa.
ecological_interactions:
- name: Complementary Microalgal Metabolic Division of Labor
  description: >
    E. gracilis enhances light harvesting and antioxidative metabolite secretion,
    while C. pyrenoidosa enhances electron transport, carbon fixation, and release
    of lipid-associated metabolites.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Multi-omics analysis revealed a clear metabolic division of labor
    explanation: Supports community-level metabolic specialization.
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: collectively driving process intensification in terms of biomass and lipid productivity
    explanation: Supports the combined effect of complementary member functions.
- name: Synergistic Biorefinery Production
  description: >
    The coculture increased biomass, lipid productivity, and alpha-tocopherol
    yield relative to monocultures and shortened the logarithmic growth phase.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: corresponding to 1.18-1.52-fold, 1.58-2.81-fold, and 2.13-9.90-fold increases relative to monoculture systems
    explanation: Supports coculture production gains relative to monocultures.
  - reference: PMID:42248260
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the logarithmic growth phase was reduced by 50% (3 days)
    explanation: Supports the shortened logarithmic growth phase.
