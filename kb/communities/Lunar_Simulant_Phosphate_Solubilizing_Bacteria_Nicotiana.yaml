id: CommunityMech:000306
name: Lunar Regolith Simulant Phosphorus-Solubilizing Bacteria for Nicotiana benthamiana
description: >
  A defined set of phosphorus-solubilizing bacteria (PSBs) assembled to improve
  the fertility of lunar regolith simulant for in-situ resource utilization (ISRU)
  agriculture in bioregenerative life support systems. Five commonly used
  microbial-fertilizer strains were tested on a CAS-1 lunar soil simulant:
  Bacillus mucilaginosus (AS1.232), Bacillus megaterium (AS1.217), Bacillus
  subtilis (CMCC 63501), Bacillus licheniformis (ATCC 11946), and Pseudomonas
  fluorescens (ATCC 13525). In a 21-day bio-improving experiment followed by a
  24-day Nicotiana benthamiana cultivation experiment, three of the strains -
  Bacillus mucilaginosus, Bacillus megaterium, and Pseudomonas fluorescens -
  tolerated the lunar regolith simulant conditions and dissociated insoluble
  inorganic phosphorus from the simulant. The mechanism is chemolithoheterotrophic
  organic-acid production: the bacteria synthesize organic acids (e.g. oxalic,
  citric, tartaric acids) from carbon sources in the medium, lowering the pH and
  chelating metal ions in insoluble phosphates such as Ca3(PO4)2, FePO4, and
  AlPO4, thereby releasing available phosphate. PSB treatment raised the available
  phosphorus content of the simulant and promoted Nicotiana benthamiana growth,
  with the largest improvement when the simulant was pre-cultured with PSBs 18
  days before sowing. The work establishes a microbiological route to convert
  lunar regolith into a plant-cultivation substrate for future lunar bases.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Explore a microbiological method to transform lunar regolith simulant into a
    fertile substrate for higher-plant cultivation by using phosphorus-solubilizing
    bacteria to mobilize insoluble inorganic phosphorus, supporting self-sufficient
    bioregenerative life support for future lunar bases.
  assembly_strategy: >
    Screen five microbial-fertilizer PSB strains (Bacillus mucilaginosus, Bacillus
    megaterium, Bacillus subtilis, Bacillus licheniformis, Pseudomonas fluorescens)
    for tolerance to and phosphorus solubilization on CAS-1 lunar regolith simulant,
    then apply the effective strains to bio-improve the simulant before sowing.
  perturbation_design: >
    A 21-day bio-improving (regolith pre-culture) phase followed by a 24-day
    Nicotiana benthamiana cultivation phase, comparing PSB treatments (including a
    "pre-cultured for 18 days" treatment) against sterilized-control and
    horticultural-soil references.
  measurement_endpoints:
  - Bacterial tolerance and growth (OD600) on lunar regolith simulant
  - Available / soluble inorganic phosphorus content of the simulant and medium
  - Regolith and culture-medium pH
  - Nicotiana benthamiana growth (seedling length, fresh weight, chlorophyll content)
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In-situ utilization of lunar soil resources will effectively improve the self-sufficiency of bioregenerative life support systems for future lunar bases
    explanation: States the ISRU / bioregenerative-life-support objective motivating the community design.
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a 21-day bio-improving experiment with another 24-day Nicotiana benthamiana cultivation experiment are carried out on lunar regolith
    explanation: Documents the two-phase experimental design (bio-improving then plant cultivation) on lunar regolith simulant.
environment_term:
  preferred_term: lunar regolith simulant plant-cultivation laboratory experiment
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >
    Controlled laboratory experiment on a CAS-1 lunar soil simulant (a terrestrial
    copy of lunar regolith), not a sampled natural community. The simulant provides
    insoluble inorganic phosphorus (Ca3(PO4)2, FePO4, AlPO4) that the PSBs mobilize;
    the space / lunar-base ISRU context is captured in the description.
