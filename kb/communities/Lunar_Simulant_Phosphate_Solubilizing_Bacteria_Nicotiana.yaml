ecological_interactions:
- name: Phosphorus solubilization from lunar regolith simulant via organic-acid secretion
  description: >
    The phosphorus-solubilizing bacteria synthesize organic acids from carbon
    sources in the medium, lowering the pH and chelating metal ions in insoluble
    phosphate minerals (Ca3(PO4)2, FePO4, AlPO4), thereby dissociating insoluble
    inorganic phosphorus and increasing the soluble/available phosphorus available
    to plants. This microbe-mineral process, driven by the whole PSB treatment, is
    the core mechanism improving the fertility of the lunar regolith simulant.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:18367
      label: phosphate(3-)
  - preferred_term: oxalic acid
    term:
      id: CHEBI:16995
      label: oxalic acid
  - preferred_term: citrate
    term:
      id: CHEBI:16947
      label: citrate(3-)
  biological_processes:
  - preferred_term: organic acid biosynthetic process
    term:
      id: GO:0016053
      label: organic acid biosynthetic process
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PSBs to synthesize organic acids by using carbon sources in the medium to reduce regolith pH, thus activating insoluble inorganic phosphorus in lunar regolith simulant
    explanation: States the organic-acid / pH-reduction mechanism of phosphorus mobilization from the simulant.
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: organic acid ions also facilitate the dissolution of phosphate minerals through chelating with the metal ions in Ca 3 (PO 4 ) 2 , FePO 4 , AlPO 4
    explanation: Documents metal-ion chelation of insoluble phosphate minerals by secreted organic acids.
- name: Phosphorus-enabled promotion of Nicotiana benthamiana growth
  description: >
    By raising the available phosphorus content of the lunar regolith simulant,
    the PSB treatment promotes the growth of the higher plant Nicotiana benthamiana,
    a plant-beneficial outcome that is strongest when the simulant is pre-cultured
    with PSBs 18 days before sowing.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Nicotiana benthamiana
    term:
      id: NCBITaxon:4100
      label: Nicotiana benthamiana
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:18367
      label: phosphate(3-)
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The phosphorus-solubilizing bacteria treatment improves the available phosphorus content of the regolith simulant, promoting the growth of Nicotiana benthamiana
    explanation: Links PSB-driven available-phosphorus increase to promotion of Nicotiana benthamiana growth.
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the growth of Nicotiana benthamiana could be most improved by treating the regolith simulant with PSBs 18 days before sowing
    explanation: Documents the strongest plant-growth improvement from an 18-day pre-culture treatment.
environmental_factors:
- name: Lunar regolith simulant substrate
  value: CAS-1 lunar soil simulant
  description: >
    The cultivation substrate is a terrestrial copy of the CAS-1 lunar soil
    simulant, which supplies insoluble inorganic phosphorus that the PSBs mobilize.
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The simulant used in our study is a copy of the CAS-1 lunar soil simulant
    explanation: Identifies the CAS-1 lunar soil simulant as the experimental substrate.
- name: Available phosphorus increase in liquid medium
  value: soluble inorganic phosphorus increased by 212 percent
  description: >
    In the shaking-flask solubilization test, the concentration of soluble
    inorganic phosphorus in the liquid medium was significantly increased by the
    effective PSBs, indicating active dissociation of insoluble phosphorus.
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: soluble inorganic phosphorus in the liquid medium was significantly increased by 212
    explanation: Quantifies the increase in soluble inorganic phosphorus driven by PSB solubilization.
- name: Acidification as the phosphorus-dissolving factor
  value: bacterial acidic substances lower pH
  description: >
    Acidic substances secreted by the bacteria were identified as the key factor
    dissolving inorganic phosphorus from the simulant, consistent with the
    organic-acid solubilization mechanism.
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the acidic substances were the key factor in dissolving inorganic phosphorus from the simulant
    explanation: Identifies bacterial acidic substances as the controlling factor in phosphorus dissolution.
growth_media:
- name: PSB phosphorus-solubilization liquid medium (shaking-flask assay)
  temperature: '30'
  temperature_unit: °C
  ph: '7.0'
  atmosphere: AEROBIC
  shaking_speed: '180'
  shaking_speed_unit: rpm
  vessel_type: shaking flask
  preparation_notes: >
    Strains were cultured overnight in a shaking flask at 180 rpm and 30 C. The
    phosphorus-solubilization assay used a liquid medium containing glucose 10 g/L,
    (NH4)2SO4 0.5 g/L, Ca3(PO4)2 5 g/L (insoluble inorganic phosphorus source),
    NaCl 0.3 g/L, FeSO4 0.03 g/L, KCl 0.3 g/L, MgSO4 0.3 g/L, MnSO4 0.03 g/L, at
    pH 7.0.
  composition:
  - name: glucose
    concentration: '10'
    unit: g/L
  - name: Ca3(PO4)2 (insoluble inorganic phosphorus source)
    concentration: '5'
    unit: g/L
    chebi_term:
      preferred_term: phosphate
      term:
        id: CHEBI:18367
        label: phosphate(3-)
  evidence:
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultured overnight in a shaking flask at 180 rpm and 30 °C
    explanation: Documents the 30 C, 180 rpm shaking-flask cultivation conditions.
  - reference: PMID:37945659
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: glucose 10 g/L
    explanation: Documents glucose as the carbon source (10 g/L) in the solubilization assay medium.
