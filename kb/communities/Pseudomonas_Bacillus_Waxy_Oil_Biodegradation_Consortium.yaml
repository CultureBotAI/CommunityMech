ecological_interactions:
- name: Interfacial Remodeling and Precursor Cross-feeding
  description: >
    B. subtilis G1 uses lipopeptides and small molecules to remodel the oil-water
    interface, improve substrate accessibility, and supply precursors assimilated
    by P. aeruginosa PA12.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Bacillus subtilis G1
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  target_taxon:
    preferred_term: Pseudomonas aeruginosa PA12
