      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  evidence:
  - reference: PMID:41905048
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enhancing substrate accessibility and supplying precursors to PA12
    explanation: Supports substrate-access facilitation and precursor transfer from G1 to PA12.
- name: Multilayer Cooperative Hydrocarbon Degradation
  description: >
    The consortium combines interface remodeling, metabolic cross-feeding,
    signal exchange, and redox-energy homeostasis to outperform either monoculture.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41905048
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a multilayer cooperative mechanism integrating interfacial remodeling, metabolic cross-feeding, signal exchange, and redox-energy homeostasis
    explanation: Supports the reported community-level cooperative mechanism.
  - reference: PMID:41905048
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: monocultures showed lower degradation efficiencies, reaching 52.5% for PA12 and 42.0% for G1
    explanation: Supports performance beyond either monoculture.
