id: CommunityMech:000324
name: Pseudomonas-Bacillus Waxy Oil Biodegradation Consortium
description: >
  A defined two-member consortium of Pseudomonas aeruginosa PA12 and Bacillus
  subtilis G1 engineered to biodegrade waxy crude oil. Bacillus improves access
  to the oil-water interface and supplies metabolic precursors, while
  Pseudomonas performs deeper oxidation of long-chain alkanes and aromatics.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Improve microbial wax removal and hydrocarbon conversion from waxy crude oil.
  assembly_strategy: Combine Pseudomonas aeruginosa PA12 with Bacillus subtilis G1 in a two-member consortium.
  measurement_endpoints:
  - wax removal
  - monoculture and coculture degradation efficiency
  - multi-omics evidence of metabolic cooperation
  evidence:
  - reference: PMID:41905048
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a synergistic Pseudomonas aeruginosa PA12-Bacillus subtilis G1 consortium was applied to biodegrade waxy crude oil
    explanation: Supports the exact two-strain design and biodegradation objective.
