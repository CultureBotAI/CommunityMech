discussions:
- discussion_id: waxy-removal-versus-mechanistic-mediation
  prompt: Which reported cooperative processes actually mediate the removal advantage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  rationale: All three nodes and both existing directions remain. Positive removal measurements are distinct from
    multi-omics and docking interpretations. Only the fresh abstract was accessible; absence of full methods is
    not evidence that perturbations were absent. No new biological mechanisms, strain combinations, optimization
    parameters or experimental designs were added.
  attaches_to:
  - ecological_interactions#Interfacial Remodeling and Precursor Cross-feeding
  - ecological_interactions#Multilayer Cooperative Hydrocarbon Degradation
  - ecological_interactions#High-Efficiency Waxy Oil Removal
  evidence:
  - reference: PMID:41905048
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enhancing substrate accessibility and supplying precursors to PA12
    explanation: Supports the authors proposed substrate-access and precursor-transfer contribution, not independently
      verified transfer flux.
  - reference: PMID:41905048
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Molecular docking validated the aforementioned mechanism of action
    explanation: This is the authors wording; docking is computational support, not independent biological validation
      of the whole causal mechanism.
