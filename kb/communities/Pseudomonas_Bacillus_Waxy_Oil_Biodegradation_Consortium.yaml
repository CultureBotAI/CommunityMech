id: CommunityMech:000324
name: Pseudomonas-Bacillus Waxy Oil Biodegradation Consortium
description: >
  A defined two-member consortium of Pseudomonas aeruginosa PA12 and Bacillus
  subtilis G1 engineered to biodegrade waxy crude oil. Bacillus improves access
  to the oil-water interface and supplies metabolic precursors, while
  Pseudomonas performs deeper oxidation of long-chain alkanes and aromatics.
