- name: Cytochrome c-Mediated Electrogenesis
  description: The enrichment reached 1.17 +/- 0.18 mA peak current with 78.1% Coulombic efficiency. Electrochemical
    and inhibitor assays identified cytochrome c-mediated electron transfer as the dominant pathway, and Raman spectroscopy
    detected 15N incorporation into cytochrome c. Preserve these positive whole-system results; labeled cytochrome
    synthesis does not itself demonstrate that newly fixed nitrogen caused increased current, nor assign the entire
    pathway to the two EET genera. The abstract does not establish an exclusive route or identify all relevant controls.
  scope: COMMUNITY_LEVEL
