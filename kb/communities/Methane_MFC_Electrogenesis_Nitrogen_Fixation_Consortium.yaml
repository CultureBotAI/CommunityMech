discussions:
- discussion_id: methane_mfc_taxon_flux_and_control_resolution
  prompt: How are methane oxidation, fixed nitrogen and cytochrome current causally distributed among members?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Methane-Fed Syntrophic Division of Labor
  - ecological_interactions#Reported Extracellular Electron-Transfer Guild
  - ecological_interactions#Core Diazotroph Specialization
  - ecological_interactions#Nitrogen Fixation to Ammonium Accumulation
  - ecological_interactions#Cytochrome c-Mediated Electrogenesis
  rationale: 'Positive isotope, current and inhibitor results are retained; both guild-to-endpoint arrows remain
    PARTIAL. Whole-enrichment endpoints are distinct from DNA-SIP functional assignments. Label incorporation into
    cytochrome is not a selective test that nitrogen fixation improves current. Full Methods, inhibitor specificity,
    cross-feeding controls and exact taxon fluxes were unavailable: public publisher links failed, and only the
    primary abstract was read. #1598 bounds existing nodes/arrows; #1600 retains non-graph roles and protocol uncertainty.
    No new methane or nitrogen-to-current arrow is asserted.'
  posed_by: codex
  posed_date: '2026-10-06'
