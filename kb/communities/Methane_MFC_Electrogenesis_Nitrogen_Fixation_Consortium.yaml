ecological_interactions:
- name: Methane-Fed Syntrophic Division of Labor
  description: 'The methane-fed, nitrogen-limited enrichment generated current and fixed nitrogen. DNA-SIP/sequencing
    supported the authors'' division-of-labor interpretation: Methanobacterium for methane oxidation, Geobacter/Desulfovibrio
    for EET and Sulfurivermis/Desulfobulbus/Azoarcus for diazotrophy. These six reported functional groups are not
    a complete roster or a defined six-isolate test. The abstract does not resolve obligatory reciprocal dependence,
    exact partner exchanges or quantitative pathway shares.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: concurrent electrogenesis and BNF via a syntrophic division of labor mechanism
    explanation: Supports the reported community-level syntrophic organization.
  participating_taxa:
