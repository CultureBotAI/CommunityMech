- name: Reported Extracellular Electron-Transfer Guild
  description: DNA-SIP combined with sequencing assigned Geobacter and Desulfovibrio to EET in the enriched methane-fed
    fuel cell. Retain this reported functional assignment, not direct evidence that every member expresses the same
    cytochromes, that either genus is individually necessary, or that a measured limited-resource niche was partitioned.
    Taxon-resolved pathway and inhibitor-control details are unavailable at abstract scope.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Geobacter
    term:
      id: NCBITaxon:28231
      label: Geobacter
  - preferred_term: Desulfovibrio
    term:
      id: NCBITaxon:872
      label: Desulfovibrio
  downstream:
  - target: Cytochrome c-Mediated Electrogenesis
    description: PARTIAL - the assigned EET guild could contribute to the cytochrome c-associated current pathway.
      Community electrochemistry and inhibitor results support that pathway, but the accessible abstract does not
      isolate each genus' contribution or establish an exclusive partner-to-electrode route.
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Geobacter and Desulfovibrio specialized in EET
    explanation: Supports assignment of the EET function to these two genera.
- name: Core Diazotroph Specialization
  description: Sulfurivermis, Desulfobulbus and Azoarcus were reported as core diazotrophs based on DNA-SIP/sequencing.
    This preserves the study's assignment without equating community-level isotope incorporation with separately
    measured fixation by each genus or experimental proof of niche partitioning.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Sulfurivermis
