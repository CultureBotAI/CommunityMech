id: CommunityMech:000327
name: Methane-Fed MFC Electrogenesis and Nitrogen-Fixation Consortium
description: >
  A methane-fed, nitrogen-limited microbial fuel-cell enrichment that couples
  anaerobic methane oxidation, extracellular electron transfer, current
  generation, and biological nitrogen fixation through a reported division of
  labor. The six genera recorded here are the functional groups named by the
  source, not a claim that the enrichment contains only six taxa.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: SYNTROPHY
engineering_design:
  objective: Test whether anaerobic methane oxidation can support concurrent electrogenesis and biological nitrogen fixation in a microbial fuel cell.
  assembly_strategy: Operate methane-fed microbial fuel cells under nitrogen-limited conditions and characterize the enriched consortium with stable-isotope probing, sequencing, spectroscopy, electrochemistry, and inhibitor assays.
  measurement_endpoints:
  - electrical current and Coulombic efficiency
  - ammonium accumulation
  - nitrogen-15 incorporation into biomass, aqueous ammonium, and cytochrome c
  - extracellular electron-transfer pathway
  - functional specialization of enriched genera
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: methane-fed microbial fuel cells (M-MFCs) under nitrogen-limited conditions achieve concurrent electrogenesis and BNF via a syntrophic division of labor mechanism
    explanation: Supports the reactor design, operating constraint, and multifunctional objective.
