    description: PARTIAL - activity of the assigned diazotroph guild could account for fixed nitrogen accumulating
      in the medium. The 15N2 result demonstrates positive fixation at enrichment level, but contributions of individual
      genera, release routes and subsequent cross-feeding are not quantified in the abstract.
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sulfurivermis, Desulfobulbus and Azoarcus acted as the core diazotrophs
    explanation: Supports the reported diazotrophic functional group.
- name: Nitrogen Fixation to Ammonium Accumulation
  description: 'The whole enrichment incorporated supplied 15N2: reported 15N abundances reached 13.55% in biomass
    and 7.15% in aqueous ammonium. Ammonium accumulated to 0.22 +/- 0.01 mg/L over 30 days. These positive isotope
    results support biological nitrogen fixation, not merely ammonium accumulation. Participants denote the reported
    enrichment subset, not six individually proven fixers; the three assigned diazotrophs are distinguished in the
    guild node. Net accumulation does not equal gross fixation or resolved donor-to-recipient transfer.'
