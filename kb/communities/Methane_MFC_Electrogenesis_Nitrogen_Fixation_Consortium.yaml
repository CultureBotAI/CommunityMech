ecological_interactions:
- name: Methane-Fed Syntrophic Division of Labor
  description: The consortium partitions anaerobic methane oxidation, extracellular electron transfer, and nitrogen fixation while supporting current and ammonium production.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: concurrent electrogenesis and BNF via a syntrophic division of labor mechanism
    explanation: Supports the reported community-level syntrophic organization.
- name: Extracellular Electron-Transfer Specialization
  description: Geobacter and Desulfovibrio are the genera assigned to extracellular electron transfer in the methane-fed fuel cell.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Geobacter and Desulfovibrio specialized in EET
    explanation: Supports assignment of the EET function to these two genera.
- name: Core Diazotroph Specialization
  description: Sulfurivermis, Desulfobulbus, and Azoarcus form the reported nitrogen-fixing functional group.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sulfurivermis, Desulfobulbus and Azoarcus acted as the core diazotrophs
    explanation: Supports the reported diazotrophic functional group.
- name: Cytochrome c-Mediated Electrogenesis
  description: Cytochrome c-mediated electron transfer was identified as the dominant electrogenic pathway at community level.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42551599
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: electrochemical analyses and inhibitor assays identified cytochrome c-mediated electron transfer as the dominant pathway for electrogenesis
    explanation: Supports the experimentally identified electron-transfer mechanism.
