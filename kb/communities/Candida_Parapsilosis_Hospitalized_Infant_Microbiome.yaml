- name: In Situ Candida Biofilm Downshift and Aerobic Enrichment
  description: Compared with diverse pure-culture transcriptomes, in situ C.
    parapsilosis expression in the infant gut showed lower biofilm and
    polysaccharide-synthase expression but enrichment of aerobic-respiration
    features, including cytochrome c oxidase and bc1-complex genes.
