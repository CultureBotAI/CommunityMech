id: CommunityMech:000248
name: Candida parapsilosis Hospitalized Infant Gut Microbiome Community
description: >
  An in situ infant gut microbiome study of Candida parapsilosis colonization in
  hospitalized infants, combining metagenomics, metatranscriptomics, and
  metaproteomics. Infant-06 fecal samples recovered C. parapsilosis alongside
  Enterococcus faecalis, Lactobacillus gasseri, and Staphylococcus epidermidis;
  the time series placed Candida in an early low-complexity gut community,
  followed its replacement or outnumbering largely by E. faecalis, and linked
  Candida-positive samples to shifts in Enterococcus ribosomal and mannitol
  phosphotransferase-system transcript features.
