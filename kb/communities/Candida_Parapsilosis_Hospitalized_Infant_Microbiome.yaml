ecological_interactions:
- name: Infant 06 Candida-Bacterial Genome Recovery
  description: Metagenomic reconstruction from infant-06 fecal samples recovered
    C. parapsilosis strain C1_006 together with E. faecalis, L. gasseri, and
    S. epidermidis, defining a low-complexity community for in situ
    transcriptomic and proteomic analysis.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction
      between organisms
    term:
