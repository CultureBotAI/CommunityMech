ecological_interactions:
- name: Repeated Candida-Enterococcus Co-Detection
  description: E. faecalis was detected in seven Candida-positive infants. These include Candida species, not seven
    independently established C. parapsilosis-specific interactions. Co-detection alone is not colonization facilitation.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: in every infant where a Candida genome was assembled or detected through read mapping, E. faecalis
      was also present
    explanation: Supports repeated E. faecalis co-detection in Candida-positive infant gut datasets.
- name: Relative Candida-Enterococcus Succession
  description: In infant 06, early C. parapsilosis relative dominance gave way to E. faecalis predominance. This
    compositional change does not establish competition, absolute fungal decline or eradication; fungal transcripts
    and peptides remained detectable.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: C. parapsilosis is highly abundant relative to other organisms in the first 20 days of life
    explanation: Supports early Candida dominance in the infant-06 gut time series.
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: before quickly being replaced or outnumbered, largely by E. faecalis
    explanation: Supports later Enterococcus outnumbering of C. parapsilosis.
- name: Candida-Positive Enterococcus Mannitol-PTS Response
  description: HYPOTHESIZED - mannitol-associated E. faecalis transcription could reflect Candida-derived substrate
    use. Mannitol production was reported for another fungal strain, not traced from infant strain C1_006. Between-infant
    differences confound attribution, and ribosomal transcripts do not directly measure growth rate.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Candida parapsilosis
    term:
      id: NCBITaxon:5480
      label: Lodderomyces parapsilosis
  target_taxon:
    preferred_term: Enterococcus faecalis
    term:
      id: NCBITaxon:1351
