      label: biological process involved in interspecies interaction between
        organisms
  downstream:
  - target: Repeated Candida-Enterococcus Co-Detection
    description: The recovered infant-06 members anchor the broader observation
      that E. faecalis accompanied every Candida-containing infant sample set.
  evidence:
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: genomes were recovered for three bacterial species in infant 06
    explanation: Supports recovery of bacterial genomes alongside C.
      parapsilosis in the infant-06 gut community.
- name: Repeated Candida-Enterococcus Co-Detection
  description: E. faecalis was present in each infant in which Candida was
    assembled or detected by read mapping, making Enterococcus the recurring
    bacterial partner across the Candida-positive infant gut samples.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction
