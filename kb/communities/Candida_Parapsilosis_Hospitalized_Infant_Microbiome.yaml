    explanation: Supports repeated E. faecalis co-detection in
      Candida-positive infant gut datasets.
- name: Enterococcus Replacement of Early Candida Dominance
  description: In infant 06, C. parapsilosis was the dominant early community
    member during the first 20 days of life before being replaced or outnumbered
    largely by E. faecalis.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
