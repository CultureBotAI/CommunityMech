  downstream:
  - target: Candida-Positive Enterococcus Mannitol-PTS Response
    description: The abundance shift motivated Candida-positive versus
      Candida-negative transcriptome comparisons that identified
      E. faecalis transport and growth-response features.
  evidence:
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: C. parapsilosis is highly abundant relative to other organisms in
      the first 20 days of life
    explanation: Supports early Candida dominance in the infant-06 gut time
      series.
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: before quickly being replaced or outnumbered, largely by E.
      faecalis
    explanation: Supports later Enterococcus outnumbering of C. parapsilosis.
- name: Candida-Positive Enterococcus Mannitol-PTS Response
  description: E. faecalis transcriptomes from Candida-positive gut samples had
    higher ribosomal-protein expression and upregulated mannitol-specific PTS
    transport and D-mannitol-to-fructose conversion, consistent with a putative
    Enterococcus substrate switch in the presence of C. parapsilosis.
