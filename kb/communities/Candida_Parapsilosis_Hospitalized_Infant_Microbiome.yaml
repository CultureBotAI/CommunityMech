  evidence:
  - reference: PMID:34154658
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: ribosomal proteins all showed higher expression in situ, suggesting increased E. faecalis growth rate
      in the presence of C. parapsilosis
    explanation: Reports ribosomal transcription, not a direct growth-rate measurement or causal fungal effect.
  - reference: PMID:34154658
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: mannitol-specific phosphotransferase system (PTS) transporters upregulated in Candida-positive samples
    explanation: Supports an associated transport-gene response, not demonstrated metabolite transfer.
  - reference: PMID:34154658
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Mannitol-1-phosphate 5-dehydrogenase, an enzyme responsible for the conversion of D-mannitol to fructose
    explanation: Reports enzyme-associated transcription, not measured mannitol flux or free-sugar conversion.
- name: In Situ Candida Biofilm- and Respiration-Associated Transcripts
  description: Infant-strain transcripts differed from heterogeneous pure-culture comparisons in biofilm-associated
    and respiration-related annotations. These changes do not measure biofilm mass, oxygen tension, respiration
    flux, niche partitioning or virulence; ortholog annotations are not exact-system functional validation.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Candida parapsilosis
    term:
      id: NCBITaxon:5480
      label: Lodderomyces parapsilosis
  evidence:
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Biofilm formation showed lower expression overall in situ
    explanation: Supports lower Candida biofilm-gene expression in situ than in culture.
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Up in situ was enriched for KEGG families for LSM
    explanation: Anchors the functional-enrichment comparison of Candida in situ versus culture transcriptomes.
  - reference: PMID:34154658
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Cytochrome c oxidase and bc1 complex
    explanation: Supports enrichment of aerobic-respiration features in Candida's in situ gut expression profile.
