    notes: 'Gram-negative deltaproteobacteria performing dissimilatory sulfate reduction in the vanadium
      tailings. Desulfovibrio oxidizes organic acids (lactate, pyruvate, formate) and hydrogen coupled
      to sulfate reduction, producing hydrogen sulfide (H₂S) that chemically reduces V(V) to V(IV) and
      precipitates vanadium as sulfide minerals. Additionally, Desulfovibrio can enzymatically reduce
      V(V) through periplasmic and cytoplasmic reductases. The organism comprises 8-12% of the tailings
      community and increases under sulfate-rich, organic-amended conditions. Hydrogen sulfide generated
      by Desulfovibrio (concentrations reaching 50-200 µM) creates strongly reducing microenvironments
      (Eh < -200 mV) that favor vanadium immobilization. Desulfovibrio species are known to reduce multiple
      toxic metals including uranium, chromium, and technetium, contributing to polymetallic remediation
      in this system.

      '
