    notes: 'Deltaproteobacteria specialized in dissimilatory metal reduction, present at 5-8% relative
      abundance in vanadium tailings. Geobacter oxidizes acetate and other organic acids coupled to reduction
      of Fe(III), Mn(IV), and V(V). This genus possesses extensive arrays of c-type cytochromes enabling
      extracellular electron transfer to metal oxides and soluble metal ions. In vanadium tailings, Geobacter
      reduces co-occurring Fe(III) minerals, creating reducing conditions that facilitate V(V) reduction
      by other community members. Geobacter can directly reduce V(V) through outer membrane cytochromes
      (OmcB, OmcS, OmcZ) and periplasmic reductases. The organism is particularly important in zones with
      high Fe(III) content (common in vanadium titanomagnetite tailings), where Fe(III) reduction precedes
      and enhances V(V) reduction. Geobacter forms syntrophic relationships with Polaromonas, potentially
      exchanging electrons or metabolites.

      '
