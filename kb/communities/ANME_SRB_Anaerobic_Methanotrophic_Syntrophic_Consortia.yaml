  changes: 'Related record CommunityMech:000134 (ANME-SRB Marine Methane Seep Consortium, PMID:37747940)
    is the broader/canonical record for the same natural ANME-SRB marine methane-seep syntrophy; this
    record focuses on the redox-conduction / DIET mechanism (PMID:40845095) with resolved clades.
    Candidates for future consolidation.'
  llm_assisted: true
growth_media:
- name: anoxic artificial seawater medium (defined HEPES-buffered marine mineral medium)
  ph: '7.3'
  temperature_range: '10-50'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: N2-sparged (anoxic); NaHCO3 and NaHS added to 5 and 0.5 mM
  inoculum_source: marine methane-seep / mud-volcano sediments (multiyear sediment-free
    ANME/SRB enrichment cultures)
  vessel_type: sediment-free enrichment culture
  preparation_notes: 'Per liter Milli-Q water: 5.67 g MgCl2·6H2O, 0.22 g CaCl2·2H2O, 26.37
    g NaCl, 0.6 g KCl, 1.5 g Na2SO4, 0.174 g K2HPO4, 0.107 g NH4Cl, 25 mM HEPES; trace
    elements added, no vitamins. ANME-1/Desulfofervidus grown at 50°C, ANME-2a/Seep-SRB1
    at 10°C, ANME-2a+2c/Seep-SRB1+2 at 20°C.'
  evidence:
  - reference: PMID:40845095
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grown at 50°C, ANME-2a partnered with Seep-SRB1 (ANME-2a/Seep-SRB1 consortia)
      grown at 10°C, and ANME-2a and ANME-2c partnered with Seep-SRB1 and Seep-SRB2 grown
      at 20°C
    explanation: Gives the per-consortium enrichment temperatures spanning 10-50 °C.
  - reference: PMID:40845095
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the pH of the medium was adjusted to 7.3, filter sterilized through a 0.22-μm
      filter, and sparged anoxic using N2 gas for at least 20 min
    explanation: States the artificial seawater medium pH (7.3) and anoxic, N2-sparged
      preparation used for enrichment cultivation.
