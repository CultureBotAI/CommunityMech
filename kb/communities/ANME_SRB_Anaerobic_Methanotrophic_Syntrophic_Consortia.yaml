    snippet: >
      Anaerobic methanotrophic archaea (ANME) and sulfate-reducing bacteria
      (SRB) form syntrophic partnerships in marine sediments to consume
      greenhouse gas methane
    explanation: Establishes the methane-consuming ANME/SRB syntrophic
      partnership.
  - reference: PMID:40845095
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      methane-derived electrons are directly conducted from ANME to SRB to drive
      sulfate reduction
    explanation: Supports methane oxidation as the upstream source of electrons
      transferred to SRB partners.
