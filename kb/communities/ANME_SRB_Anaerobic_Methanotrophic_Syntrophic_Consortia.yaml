id: CommunityMech:000276
name: ANME/SRB Anaerobic Methanotrophic Syntrophic Consortia
description: Marine syntrophic consortia of anaerobic methanotrophic archaea (ANME) and
  sulfate-reducing bacteria (SRB) that couple the anaerobic oxidation of methane to sulfate
  reduction in marine sediments. Sediment-free enrichment cultures of three consortium types
  (ANME-1/Desulfofervidus, ANME-2a/Seep-SRB1, and ANME-2a+2c/Seep-SRB1+2) exhibited high dry
  conductance close to that of electrogenic biofilms. Cyclic voltammetry revealed redox activity
  and generator-collector measurements showed electron transport over micrometer-scale distances,
  establishing that the symbiosis uses redox conduction (consistent with multiheme cytochrome c)
  for direct interspecies electron transport between the archaeal and bacterial partners.
