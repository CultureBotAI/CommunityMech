id: CommunityMech:000346
name: Chicken BL6 Anti-Salmonella SynCom
description: >-
  A defined six-strain synthetic consortium, BL6, assembled from Wenchang and
  Danzhou chicken gut isolates with in vitro anti-Salmonella activity. The
  consortium contains Bacillus velezensis CMLH125, Ligilactobacillus
  salivarius CMLH112, novel Bacillus sp. CMLH124, Lactobacillus johnsonii
  CMLH106, Lactobacillus crispatus CMLH109, and Lactobacillus gallinarum
  CMLH110. The strains were normalized after 72 h of cultivation, combined in
  equal proportions, washed, and resuspended in PBS with 20% glycerol for oral
  gavage of 1-day-old chicks before Salmonella Typhimurium challenge. In the
  chick model, BL6 mitigated Salmonella-associated intestinal injury, helped
  maintain barrier and liver function, reduced systemic inflammatory responses,
  and favored sustained Lactobacillus enrichment in the ileal microbiota.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: >-
    Construct a simplified defined consortium from native-chicken gut isolates
    with high anti-Salmonella activity and test whether early-life intervention
    protects chicks from Salmonella Typhimurium challenge.
  assembly_strategy: >-
    Screen cecal isolates from Wenchang and Danzhou chickens for cell-free
    supernatant inhibition of Salmonella Typhimurium, Escherichia coli, and
    Clostridium perfringens, select six high-anti-Salmonella strains, then
    combine the normalized cultures in equal proportions into BL6.
  perturbation_design: >-
    Administer BL6 to newly hatched Arbor Acres chicks by daily oral gavage for
    four days and then challenge the BL6 and positive-control groups with
    Salmonella Typhimurium for two days.
  measurement_endpoints:
  - In vitro inhibition zones against Salmonella Typhimurium
  - BL6 strain genome content, antimicrobial peptide genes, and secondary metabolite clusters
  - Chick ileal histopathology after Salmonella Typhimurium challenge
  - Serum immunoglobulin, ALT, and AST responses
  - Intestinal barrier gene expression
  - Ileal microbiota composition after BL6 treatment and Salmonella challenge
  notes: >-
    The curated membership and BL6 pooling protocol come from the PMC full
    text. Predicted antimicrobial peptides and secondary metabolite clusters
    indicate a genetic basis for inhibition, but they are not curated as a
    direct molecular interaction because the paper did not experimentally map a
    metabolite-level BL6 to Salmonella mechanism.
  evidence:
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Six strains were then selected for further analyses, including Bacillus
      velezensis CMLH125, Ligilactobacillus salivarius CMLH112, Bacillus sp.
      CMLH124, Lactobacillus johnsonii CMLH106, Lactobacillus crispatus
      CMLH109, and Lactobacillus gallinarum CMLH110.
    explanation: >-
      Names the six strains selected from the in vitro anti-Salmonella screen
      for BL6 assembly and genome analysis.
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Subsequently, the cultures were combined in equal proportions,
      centrifuged, washed, and finally resuspended in PBS with 20% glycerol to
      a 10-fold volume.
    explanation: >-
      Supports the equal-proportion BL6 pooling and washed PBS-glycerol
      inoculum preparation.
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      chicks received daily oral gavage of BL6 for 4 d, followed by challenge
    explanation: >-
      Supports the early-life BL6 gavage followed by pathogen challenge as the
      in vivo design.
