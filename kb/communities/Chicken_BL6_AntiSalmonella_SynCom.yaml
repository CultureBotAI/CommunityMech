ecological_interactions:
- name: BL6 Anti-Salmonella Protection
  description: >-
    Early oral BL6 intervention protects newly hatched chicks from Salmonella
    Typhimurium challenge by mitigating intestinal damage, maintaining liver
    and gut-barrier physiology, and modulating the ileal microbiota toward
    sustained Lactobacillus enrichment.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  downstream:
  - target: Lactobacillus-enriched ileal microbiota
    description: >-
      BL6 treatment favored sustained Lactobacillus enrichment after Salmonella
      Typhimurium challenge in chicks.
  evidence:
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      BL6 confers multifaceted protection against Salmonella infection in chicks
    explanation: >-
      Supports the community-level anti-Salmonella protective phenotype in the
      chick challenge model.
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      BL6 can modulate the gut microbiota dysbiosis in chicks caused by
      Salmonella infection, particularly through enriching Lactobacillus.
    explanation: >-
      Supports Lactobacillus enrichment as a downstream microbiota shift after
      BL6 treatment.
environmental_factors:
- name: early-life BL6 gavage and Salmonella Typhimurium challenge
  value: >-
    BL6 was administered by oral gavage for four days to 1-day-old chicks before
    Salmonella Typhimurium challenge for two days.
  description: >-
    Early BL6 exposure was used to test whether the defined chicken-gut
    consortium could suppress subsequent Salmonella Typhimurium challenge.
  evidence:
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      chicks received daily oral gavage of BL6 for 4 d, followed by challenge
      with S . Typhimurium for 2 d.
    explanation: >-
      Supports the early BL6 intervention followed by Salmonella Typhimurium
      challenge.
growth_media:
- name: BL6 strain growth medium and PBS-glycerol inoculum preparation
  inoculum_source: >-
    Bacillus velezensis CMLH125, Ligilactobacillus salivarius CMLH112,
    Bacillus sp. CMLH124, Lactobacillus johnsonii CMLH106, Lactobacillus
    crispatus CMLH109, and Lactobacillus gallinarum CMLH110.
  incubation_time: '72'
  incubation_time_unit: h
  preparation_notes: >-
    Each BL6 strain was subcultured daily by 1:10 transfer into fresh medium.
    After 72 h, cultures were concentrated, normalized to OD600 1.3, combined
    in equal proportions, centrifuged, washed, and resuspended in PBS with 20%
    glycerol to prepare the BL6 gavage stock.
  evidence:
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      each strain in BL6 was subcultured daily by transferring a 1:10 inoculum
      into fresh growth medium.
    explanation: Supports daily 1:10 subculture of each BL6 member.
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After 72 h of cultivation, each bacterial culture was concentrated and
      normalized to an OD 600 of 1.3
    explanation: Supports the 72 h cultivation endpoint and OD normalization.
  - reference: PMID:42351244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cultures were combined in equal proportions, centrifuged, washed, and
      finally resuspended in PBS with 20% glycerol
    explanation: Supports the washed equal-proportion PBS-glycerol preparation.
