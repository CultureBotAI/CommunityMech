id: CommunityMech:000215
name: California Grassland Precipitation Legacy Soil Community
description: >
  A semiarid California Mediterranean-climate grassland soil microbial community
  studied under two field-imposed precipitation regimes (100 percent versus
  50 percent of mean annual precipitation) and assayed during the first autumn
  rewet. Quantitative H2-18O stable-isotope-probing, 16S rRNA amplicon
  sequencing, metagenomics, and metatranscriptomics revealed that reduced
  winter precipitation imposed a lasting legacy on community turnover:
  microbial growth declined by about one order of magnitude and mortality by
  about two orders of magnitude relative to ambient plots, lowering community
  growth efficiency (new biomass growth divided by respiration). Soil organic
  carbon shifted from microbial-necromass-derived lipid-, amino-sugar-, and
  protein-like compounds toward more oxidized lignin- and tannin-like plant
  detritus compounds. Meta-omics linked high-CGE communities to N-rich
  necromass consumption with elevated amino acid and peptidoglycan biosynthesis
  and aromatic compound degradation, while low-CGE communities had elevated
  carbohydrate metabolism and lipid turnover consistent with plant-detritus
  processing and membrane maintenance.
