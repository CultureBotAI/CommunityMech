    explanation: Supports the high-CGE metabolic strategy.
- name: Plant Detritus Degradation at Low Community Growth Efficiency
  description: At low community growth efficiency, communities exhibited elevated
    carbohydrate metabolism and lipid turnover consistent with increased
    investment in plant detritus degradation and membrane repair and maintenance
    rather than growth.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  evidence:
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: communities had elevated carbohydrate metabolism and lipid turnover
    explanation: Supports the low-CGE metabolic shift toward plant detritus and
      membrane maintenance.
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: increased investment in plant detritus degradation and membrane
      repair and maintenance rather than growth
    explanation: Supports the resource-allocation interpretation at low CGE.
- name: Precipitation-Legacy Turnover Suppression
  description: Reduced winter precipitation imposed a strong legacy effect on
    microbial turnover. Respiration rates remained similar, but microbial growth
    dropped by about one order of magnitude and mortality dropped by about two
    orders of magnitude, lowering community growth efficiency.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: microbial growth declined by ~1 order of magnitude, yielding
      decreased community growth efficiency
    explanation: Supports the precipitation-legacy effect on growth efficiency.
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: microbial mortality declined by ~2 orders of magnitude
    explanation: Supports the parallel decline in microbial mortality under
      reduced legacy precipitation.
environmental_factors:
- name: Imposed precipitation regime
  value: 100 percent vs 50 percent mean annual precipitation
  description: Field plots received either ambient or half of ambient annual
    precipitation across winters to impose a long-term legacy effect on the
    soil community.
  evidence:
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: two precipitation regimes (100% vs. 50% mean annual precipitation)
    explanation: Supports the precipitation perturbation design.
- name: Autumn rewetting with H2-18O
  value: laboratory rewet with isotopically labeled water
  description: After the dry season, soils were rewetted with H2-18O and sampled
    across a time course to quantify community growth and mortality.
  evidence:
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: soils were rewetted in the laboratory with H218O and sampled at 0
      h, 3 h, 24 h, 48 h, 72 h, and 168 h post rewet
    explanation: Supports the rewetting and time-course sampling design.
- name: Soil organic carbon composition shift
  value: necromass-like to plant-detritus-like compounds
  description: Soil organic carbon composition shifted from lipid-, amino-sugar-,
    and protein-like compounds indicative of microbial necromass to more
    oxidized lignin-like and tannin-like compounds indicative of decomposing
    plant detritus under reduced precipitation.
  evidence:
  - reference: PMID:41964077
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: shifted from lipid-like, amino-sugar-like, and protein-like compounds
      (indicative of microbial necromass) to more oxidized lignin-like and
      tannin-like compounds (indicative of decomposing plant-derived compounds)
    explanation: Supports the SOC compositional shift driven by the precipitation
      legacy.
