id: CommunityMech:000193
name: Clostridium-Caldicellulosiruptor Minimal Medium Coculture
description: >
  A thermophilic, anaerobic, two-member laboratory coculture pairing
  Clostridium thermocellum ATCC 27405 with Caldicellulosiruptor bescii DSM
  6725. The system was used to test whether low-ionic-strength defined medium
  with reduced nitrogen, sulfur, phosphate, and vitamin supplements could
  maintain both cellulolytic bacterial populations during conversion of
  cellulosic substrates relevant to consolidated bioprocessing.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Develop a reduced-nutrient defined medium that supports both
    cellulolytic thermophiles in coculture on cellulose- and xylan-containing
    substrates.
  assembly_strategy: Bottom-up two-member anaerobic coculture assembled from
    C. thermocellum ATCC 27405 and C. bescii DSM 6725 laboratory cultures.
  perturbation_design: Nitrogen and sulfur source concentrations were varied,
    sulfate assimilation was tested with ascorbate reductant, and the resulting
    defined medium was evaluated with cellobiose, cellulose, acid-pretreated
    Populus, and cellulose/xylan coculture substrates.
  measurement_endpoints:
  - Growth rate
  - Ethanol production response
  - Oxidized and reduced fermentation product ratios
  - Maintenance of both populations in coculture
  evidence:
  - reference: PMID:23306120
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Growth media for cellulolytic Clostridium thermocellum ATCC 27405 and Caldicellulosiruptor bescii bacteria usually contain excess nutrients
    explanation: Supports the defined-medium engineering objective and the exact two bacterial members.
  - reference: PMID:23306120
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a low ionic strength, defined minimal nutrient medium
    explanation: Supports the medium-development design for this coculture.
