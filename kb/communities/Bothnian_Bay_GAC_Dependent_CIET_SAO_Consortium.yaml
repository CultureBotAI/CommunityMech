ecological_interactions:
- name: GAC-mediated syntrophic acetate oxidation to methane
  description: >-
    Candidatus Geosyntrophus acetoxidans oxidizes acetate and transfers
    electrons through the granular activated carbon matrix to the
    Methanosarcina-related GAC.MBAT.2 methanogen, which accepts electrons from
    GAC and reduces carbon dioxide to methane. Parallel GAC-free serial
    transfers were nearly inactive and lost the key electrogenic and
    methanogenic MAGs, supporting a conductive-particle-mediated syntrophy.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Candidatus Geosyntrophus acetoxidans GAC.MBAT.93
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
    preferred_term: Baltic Methanosarcina MAG GAC.MBAT.2
    term:
      id: NCBITaxon:2207
      label: Methanosarcina
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the Baltic Sea Geobacter continued to oxidize acetate and transfer
      electrons through the GAC matrix
    explanation: >-
      Supports the direction of GAC-mediated electron transfer from the
      acetate-oxidizing bacterium to the methanogen.
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      confirming that the electrically conductive scaffold provided by GAC
      remains indispensable for SAO after a decade of serial cultivation and
      enrichment
    explanation: >-
      Supports GAC dependence of the syntrophic acetate-oxidizing enrichment.
- name: Lentimicrobium alternative EET-linked acetate oxidation
  description: >-
    A GAC-specific Lentimicrobium MAG encodes a large
    porin-multiheme-cytochrome cluster and a complete acetate uptake and
    utilization pathway, suggesting a secondary acetate-oxidizing route that
    could feed electrons to the Methanosarcina partner through extracellular
    electron transfer or allow persistence by fermentative recycling.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Lentimicrobium sp. GAC-specific MAG
    term:
      id: NCBITaxon:1840214
      label: Lentimicrobium
  target_taxon:
    preferred_term: Baltic Methanosarcina MAG GAC.MBAT.2
    term:
      id: NCBITaxon:2207
      label: Methanosarcina
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:41876513
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Lentimicrobium may sustain its activity via DIET with methanogens or by
      fermentatively recycling organic intermediates released within the
      consortium.
    explanation: >-
      Records the genome-based Lentimicrobium interaction as a proposed
      secondary route rather than a directly demonstrated edge.
- name: Auxiliary biomass turnover in the GAC enrichment
  description: >-
    Sedimentibacter, Desulforhopalus, and possibly Lentimicrobium are inferred
    to occupy auxiliary recycling niches that consume biomass-derived organic
    matter released within the conductive-particle enrichment rather than
    driving the main GAC-to-methanogen electron flow.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Sedimentibacter MAG in GAC incubations
    term:
      id: NCBITaxon:190972
      label: Sedimentibacter
  - preferred_term: Desulforhopalus MAG in GAC incubations
    term:
      id: NCBITaxon:40413
      label: Desulforhopalus
  - preferred_term: Lentimicrobium sp. GAC-specific MAG
    term:
      id: NCBITaxon:1840214
      label: Lentimicrobium
  evidence:
  - reference: PMID:41876513
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      their primary ecological role may not be related to direct electron
      transfer, but rather to the recycling of organic matter resulting from
      biomass turnover within the community
    explanation: >-
      Supports an inferred auxiliary recycling role for Sedimentibacter and
      Lentimicrobium in the GAC enrichment.
  - reference: PMID:41876513
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Desulforhopalus is unlikely to be involved in SAO but may be involved in
      biomass turnover like Sedimentibacter.
    explanation: >-
      Supports the inferred non-SAO biomass-turnover role for Desulforhopalus.
environmental_factors:
- name: Granular activated carbon dependence
  value: required for long-term SAO activity
  description: >-
    Decade-old GAC-propagated enrichments retained acetate oxidation and
    methane production, while serially transferred particle-free controls were
    nearly inactive and lost the key Ca. Geosyntrophus and Methanosarcina MAGs.
  evidence:
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      without conductive particles the electrogenic syntroph and their
      methanogenic partner cannot persist over extended propagation periods
    explanation: >-
      Supports the conductive-particle dependence of the core syntrophic
      partnership.
growth_media:
- name: DSMZ modified 120 acetate medium with GAC
  composition:
  - name: acetate
    concentration: '10'
    unit: mM
    chebi_term:
      preferred_term: acetate
      term:
        id: CHEBI:30089
        label: acetate
    from_source: community_curated
  temperature: 22
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: N2:CO2 80:20 during degassing and anaerobic transfers
  light_regime: dark
  preparation_notes: >-
    The consortium was serially transferred into DSMZ modified 120 medium with
    acetate as the sole electron donor. GAC-amended incubations received
    10 g/L wet-presterilized granular activated carbon; GAC-free controls were
    prepared in parallel.
  evidence:
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Each transfer was initiated with 10% or 20% inoculum in fresh DSMZ
      modified 120 media
    explanation: Supports the transfer medium and inoculum range.
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: containing 10 mM acetate as the sole electron donor
    explanation: Supports acetate as the supplied electron donor.
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Control incubations were prepared without conductive particles, while
      incubations with conductive particles received 10 g/L Granular Activated
      Carbon
    explanation: Supports the conductive-particle amendment concentration.
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All cultures were incubated in the dark, without shaking, at room
      temperature (22 °C).
    explanation: Supports the incubation light, shaking, and temperature conditions.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  instrument_detail: Anaerobic serum bottles or blue chlorobutyl-stoppered glass vials
  working_volume: 50
  working_volume_unit: mL
  operating_temperature: 22
  operating_temperature_unit: °C
  ph_controlled: false
  do_controlled: false
  temperature_controlled: false
  controls_notes: >-
    Cultures were anaerobic, static, dark batch incubations in sealed serum
    bottles or glass vials; transfers used gas-tight syringes and needles
    degassed with N2:CO2.
  evidence:
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The serum bottle volume for the inoculations was 100 mL, consisting of
      50 mL culture and 50 mL headspace.
    explanation: Supports the bottle and liquid/headspace volumes.
  - reference: PMID:41876513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Subsampling and transfer procedures were performed under strict sterile
      and anaerobic conditions using gas-tight syringes and hypodermic needles
      degassed with an 80:20 N2:CO2 gas mix.
    explanation: Supports strict anaerobic handling.
