id: CommunityMech:000349
name: Bothnian Bay GAC-Dependent CIET-SAO Consortium
description: >-
  A coastal-sediment-derived, granular-activated-carbon-dependent enrichment
  consortium serially transferred for about a decade from Bothnian Bay
  sediments. In anaerobic, acetate-fed cultures amended with granular activated
  carbon (GAC), the consortium couples syntrophic acetate oxidation to
  methane formation by moving electrons from the dominant electrogenic
  syntroph Candidatus Geosyntrophus acetoxidans through the GAC matrix to a
  Methanosarcina-related electrotrophic methanogen. Long-read metagenomics
  recovered 24 MAGs from the GAC-propagated enrichment, including MAGs for the
  core acetate-oxidizing and methanogenic partners plus GAC-enriched
  Lentimicrobium, Sedimentibacter, and Desulforhopalus lineages.
