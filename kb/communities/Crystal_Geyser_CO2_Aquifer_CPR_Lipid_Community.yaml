discussions:
- discussion_id: crystal_geyser_lipid_donor_and_adaptation
  prompt: Which sources and uptake routes supply CPR lipids, and do lysolipids causally relieve membrane curvature
    stress?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Predominantly Autotrophic Carbon Supply
  - ecological_interactions#Putative CPR Lipid Acquisition
  - ecological_interactions#CPR-Associated Lysolipids and Proposed Curvature Adaptation
  rationale: 'The complete primary main body supports mostly autotrophic community carbon, missing known biosynthesis
    pathways and CPR-associated lysolipids. Correlated relative abundances, mixed size fractions and FTIR do not
    resolve donors or transfer rates. Degraded-biomass scavenging, direct host acquisition and unknown biosynthetic
    routes remain distinguishable hypotheses. Selective uptake/biosynthesis perturbations, tracing and membrane-mechanical
    measurements would test the proposed chain. The separate archaeal lipid discussion must not establish archaeal
    donation to CPR. No figure images or supplementary files were inspected. Non-graph taxon-role and pressure-adaptation
    overstatements remain in #1366.'
  posed_by: codex
  posed_date: '2026-10-06'
