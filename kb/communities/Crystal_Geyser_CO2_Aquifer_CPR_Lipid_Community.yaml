ecological_interactions:
- name: Predominantly Autotrophic Carbon Supply
  description: Stable carbon isotope compositions, community metagenomes and geological constraints support a predominantly
    autotrophic origin of biomass across the sampled aquifers. Bacterial and archaeal carbon fixation supplies the
    community organic-carbon pool; isotope mass-balance estimates depend on fractionation assumptions and allow
    heterotrophic reuse. This does not trace a particular producer-to-CPR carbon or lipid transfer.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  downstream:
  - target: Putative CPR Lipid Acquisition
    description: HYPOTHESIZED - autotrophically fixed carbon can supply bacterial lipid production and the community
      material available for CPR acquisition. The isotope, lipid and genomic observations support this proposed
      carbon route but do not trace transfer from a particular producer to CPR cells.
  evidence:
  - reference: PMID:32203118
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bacterial and archaeal CO2 fixation ongoing in the deep subsurface provides organic carbon for the
      complex communities that reside there
    explanation: Supports the predominantly autotrophic community carbon source from isotope and genomic evidence,
      not a resolved producer-recipient flux. The broad producer participant is a functional pool, not one experimentally
      paired donor.
  participating_taxa:
  - preferred_term: deep-aquifer CO2-fixing bacteria and archaea
    term:
      id: NCBITaxon:131567
      label: cellular organisms
- name: Putative CPR Lipid Acquisition
  description: HYPOTHESIZED - CPR-associated membrane lipids together with missing known complete lipid-biosynthesis
    pathways support acquisition of lipids or precursors from coexisting bacteria. Scavenging degraded biomass and
    direct host-derived acquisition remain alternatives; neither a donor nor uptake flux was resolved. The broad
    producer participant represents community context, not proof of archaeal-to-CPR donation. Some Nealsonbacteria
    retain near-complete pathways, so unknown ACP-independent biosynthesis cannot be excluded. Product-removal syntrophy
    was not demonstrated.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lipid
    term:
      id: CHEBI:18059
      label: lipid
  - preferred_term: fatty acid
    term:
      id: CHEBI:35366
      label: fatty acid
  biological_processes:
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  downstream:
  - target: CPR-Associated Lysolipids and Proposed Curvature Adaptation
    description: HYPOTHESIZED - acquired community lipids or precursors could provide material for CPR-associated
      lysolipid membranes and their proposed curvature adaptation. Lipid correlations and mixed-fraction spectroscopy
      do not demonstrate that acquisition causes lysolipid enrichment or that enrichment improves curvature tolerance.
  evidence:
  - reference: PMID:32203118
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: CPR bacteria lack complete lipid biosynthesis pathways but still possess regular lipid membranes
    explanation: Combined field lipid and genome observations support an acquisition hypothesis. They do not identify
      the donor, exclude unknown biosynthesis, or demonstrate product-removal cooperation. Depth-associated unsaturation
      is not evidence for this transfer.
  - reference: PMID:32203118
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: the redistribution of lipids into putative symbionts within this community
    explanation: Combined field lipid and genome observations support an acquisition hypothesis. They do not identify
      the donor, exclude unknown biosynthesis, or demonstrate product-removal cooperation. Depth-associated unsaturation
      is not evidence for this transfer.
  - reference: PMID:32203118
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Thus, we suggest that most CPR bacteria derive their membrane lipids, including lysolipids, from coexisting
      bacteria.
    explanation: The primary Results/Discussion explicitly proposes bacterial lipid acquisition after considering
      missing ACP machinery and possible alternative pathways. This is an author interpretation, not a traced exchange
      experiment.
  participating_taxa:
  - preferred_term: deep-aquifer CPR bacteria
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
  - preferred_term: deep-aquifer CO2-fixing bacteria and archaea
    term:
      id: NCBITaxon:131567
      label: cellular organisms
  interaction_type: CROSS_FEEDING
- name: CPR-Associated Lysolipids and Proposed Curvature Adaptation
  description: Lipidomics, organism-lipid correlations and FTIR of CPR-enriched size fractions support lysolipid-rich
    membranes in some CPR bacteria. These fractions are mixed communities, not purified CPR isolates; the initial
    fraction also contained abundant Sulfurimonas. Reduced curvature stress in small cells is a proposed adaptive
    explanation, not a tested membrane-mechanical or fitness effect. No unaffected-donor relationship is established.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lipid
    term:
      id: CHEBI:18059
      label: lipid
  biological_processes:
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  evidence:
  - reference: PMID:32203118
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: An unusually high abundance of lysolipids attributed to CPR bacteria may represent an adaptation to
      membrane curvature stress induced by their small cell sizes
    explanation: Supports the authors' proposed curvature adaptation. The primary study adds mixed-fraction lipidomic
      and FTIR observations, not purified-cell transfer, curvature perturbation or a donor fitness measurement.
  participating_taxa:
