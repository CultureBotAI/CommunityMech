id: CommunityMech:000520
name: SO2-BS2 Lithium-ion Battery Bioleaching Consortium
description: A riboflavin-enhanced two-member engineered Shewanella oneidensis MR-1 SO2 and Bacillus subtilis 168 BS2 synthetic
  consortium for metal oxide leaching from spent LiNixCoyMn1-x-yO2 (NCM) lithium-ion battery cathode black mass in Moutai
  brewing wastewater. By pairing S. oneidensis SO2 (carrying Ptac::ribADEHC on pHG13) with B. subtilis BS2 (mutation-bred
  high-riboflavin strain BSG3 carrying P43::adh-aldH on pCE2), the SO2-BS2 consortium synthesized 46.00 uM riboflavin (166.67-fold
  higher than SO1-BS1), achieved a maximum microbial fuel cell power density of 347.29 mW m^-2, increased S. oneidensis NCM
  surface colonization to 63.28%, and leached 69.6 mg L^-1 total dissolved Li, Ni, Co, and Mn (55.3, 6.3, 2.8, and 5.1 mg
  L^-1; maximal leaching rate 16.2 mg L^-1 day^-1) before late-stage Ni2+ and Co2+ cytotoxicity slowed leaching during days
  7-14 (PMID:42733304).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Boost riboflavin electron-shuttle biosynthesis in both partners of the Shewanella/Bacillus division-of-labor
    consortium (SO2-BS2) to accelerate extracellular electron transfer and NCM cathode metal oxide leaching in Moutai brewing
    wastewater.
  assembly_strategy: Combine S. oneidensis MR-1 SO2 (overexpressing the B. subtilis 168 Ptac::ribADEHC operon on pHG13) with
    B. subtilis BS2 (constructed by introducing pCE2-P43::adh-aldH into mutation-bred high-riboflavin strain BSG3).
  inoculation_strategy: Grow SO2 and BS2 separately overnight in LB medium with 0.2 g L^-1 chloramphenicol, inoculate each
    at 1% (v/v) into Moutai brewing wastewater with 0.5 mM IPTG, transfer to anaerobic bottles with 0.2 g L^-1 spent NCM black
    mass, and ferment anaerobically at 30 degrees C for 14 days.
  perturbation_design: Compare SO1-BS1 (0.276 uM riboflavin, 116.15 mW m^-2, 50.7 mg L^-1 metals), SO2-BS1 (3.65 uM riboflavin,
    243.71 mW m^-2, 64.1 mg L^-1 metals), and SO2-BS2 (46.00 uM riboflavin, 347.29 mW m^-2, 69.6 mg L^-1 metals), and evaluate
    early (days 1-6) versus late (days 7-14) leaching rates and Ni2+/Co2+ cytotoxicity.
  measurement_endpoints:
  - riboflavin concentration in brewing wastewater (46.00 uM)
  - microbial fuel cell maximum power density (347.29 mW m^-2)
  - total and element-resolved dissolved Li, Ni, Co, and Mn concentrations (69.6 mg L^-1 total)
  - maximal and stage-specific metal oxide leaching rates (days 1-6 vs days 7-14)
  - proportion of S. oneidensis attached to the NCM surface (63.28%)
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Following the transfer of the plasmid pCE2‐P43‐adh‐aldH into BSG3, the recombinant strain BS2 (harboring genomic
      mutations for riboflavin synthesis and P43‐adh‐aldH in the pCE2 plasmid, Figure 3a and Table 1 ) was constructed, which
      was subsequently assembled with strain SO2 to form the SO2‐BS2 consortium. When fed with the brewing wastewater, the
      synthesized riboflavin by the SO2‐BS2 consortium reached 46.00 µM, which was 166.67‐ and 12.60‐fold higher than that
      of the SO1‐BS1 (0.276 µM) and SO2‐BS1 consortia (3.65 µM), respectively
    explanation: Defines the construction of SO2-BS2 and quantifies its 46.00 uM riboflavin synthesis in brewing wastewater.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In comparison, the concentration of leached metal ions achieved by the SO2‐BS2 consortium, which reached 69.6
      mg L−1 (comprising 55.3 mg L−1 Li, 6.3 mg L−1 Ni, 2.8 mg L−1 Co, and 5.1 mg L−1 Mn), along with the maximal leaching
      rate of 16.2 mg L−1·day−1, was also significantly higher than those observed for the SO1‐BS1 consortium (50.7 mg L−1,
      12.3 mg L−1·day−1)
    explanation: Quantifies total and element-resolved metal leaching and maximal leaching rate for the SO2-BS2 consortium.
