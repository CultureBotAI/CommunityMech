  downstream:
  - target: Riboflavin-Accelerated NCM Leaching and Late-Stage Ni/Co Cytotoxicity Bottleneck
    description: Elevated riboflavin (46.00 uM) and extracellular electron transfer (347.29 mW m^-2) increased total NCM metal
      leaching to 69.6 mg L^-1 (16.2 mg L^-1 day^-1 maximal rate) relative to SO1-BS1 (50.7 mg L^-1), while the resulting
      accumulation of dissolved Ni2+ (6.3 mg L^-1) and Co2+ (2.8 mg L^-1) inhibited SO2 and BS2 viability and depressed the
      day 7-14 average leaching rate from 10.033 to 1.171 mg L^-1 day^-1.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When fed with the brewing wastewater, the synthesized riboflavin by the SO2‐BS2 consortium reached 46.00 µM,
      which was 166.67‐ and 12.60‐fold higher than that of the SO1‐BS1 (0.276 µM) and SO2‐BS1 consortia (3.65 µM), respectively
      (Figure 3b ). The maximal power density of the SO2‐BS2 consortium reached 347.29 mW m−2, 2.99‐ and 1.42‐fold higher
      than that of the SO1‐BS1 (116.15 mW m−2) and SO2‐BS1 consortia (243.71 mW m−2), respectively
    explanation: Quantifies the 46.00 uM riboflavin production and 347.29 mW m^-2 EET power density in SO2-BS2.
- name: Riboflavin-Accelerated NCM Leaching and Late-Stage Ni/Co Cytotoxicity Bottleneck
  description: The SO2-BS2 consortium leached 69.6 mg L^-1 total dissolved metal ions (55.3 mg L^-1 Li, 6.3 mg L^-1 Ni, 2.8
    mg L^-1 Co, and 5.1 mg L^-1 Mn) at a maximal rate of 16.2 mg L^-1 day^-1. However, despite a 43% higher EET power density
    than SO2-BS1 (347.29 vs 243.71 mW m^-2), total leaching rose only modestly (69.6 vs 64.1 mg L^-1) and the average leaching
    rate dropped from 10.033 mg L^-1 day^-1 (days 1-6) to 1.171 mg L^-1 day^-1 (days 7-14) because accumulated Ni2+ (6 mg
    L^-1) and Co2+ (3 mg L^-1) caused ROS accumulation, DNA strand breaks, and cell death in SO2 and BS2.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Shewanella oneidensis MR-1 SO2
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
