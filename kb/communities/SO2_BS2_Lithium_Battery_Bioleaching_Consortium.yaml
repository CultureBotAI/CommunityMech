- name: Ni2+ and Co2+ cytotoxicity toward SO2 and BS2
  value: 6 mg L^-1 Ni2+ and 3 mg L^-1 Co2+ stress
  description: Exposure to 6 mg L^-1 Ni2+ and 3 mg L^-1 Co2+ reduced SO2 maximum OD600 from 1.941 to 1.367 and inhibited BS2
    to OD600 0.830 while increasing dead-cell red fluorescence prior to IrrE introduction.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When exposed to 6 mg L−1 Ni2+ and 3 mg L−1 Co2+, the growth of strain SO2 was notably inhibited, with its maximum
      cell density decreasing from 1.941 (in the absence of Ni2+ and Co2+) to 1.367
    explanation: Quantifies growth inhibition of strain SO2 under 6 mg L^-1 Ni2+ and 3 mg L^-1 Co2+.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Live‐dead staining also revealed that strains SO2 and BS2 exhibited more pronounced red fluorescence in the presence
      of Ni2+ and Co2+ (Figure 4g ), indicating a higher prevalence of dead cells due to Ni2+ and Co2+ exposure.
    explanation: Confirms elevated cell death of both SO2 and BS2 under Ni2+ and Co2+ exposure.
