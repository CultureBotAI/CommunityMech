ecological_interactions:
- name: Dual-Partner Riboflavin Overproduction and Ethanol Detoxification
  description: Co-cultivating Ptac::ribADEHC-expressing S. oneidensis SO2 with mutation-bred high-riboflavin P43::adh-aldH
    B. subtilis BS2 in Moutai brewing wastewater increased secreted riboflavin to 46.00 uM (166.67-fold higher than SO1-BS1
    and 12.60-fold higher than SO2-BS1) and elevated microbial fuel cell maximum power density to 347.29 mW m^-2 (2.99-fold
    higher than SO1-BS1 and 1.42-fold higher than SO2-BS1) while increasing S. oneidensis attachment on the NCM surface from
    51.14% to 63.28%.
