  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, although the EET rate of the SO2‐BS2 consortium (347.29 mW m−2) was 43% higher than that of the SO2‐BS1
      consortium (243.71 mW m−2) (Figure 3c ), its metal oxide leaching performance (69.6 mg L−1, 16.2 mg L−1·day−1) did not
      exhibit a corresponding enhancement compared to the SO2‐BS1 consortium (64.1 mg L−1, 16.4 mg L−1·day−1)
    explanation: Demonstrates that EET rate was no longer the sole rate-limiting step in SO2-BS2 metal leaching.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the average leaching rates decreased from 7.222 mg L−1·day−1 to 0.921 mg L−1·day−1 for the SO1‐BS1
      consortium, from 9.867 to 0.617 mg L−1·day−1 for the SO2‐BS1 biocatalyst, and from 10.033 to 1.171 mg L−1·day−1 for
      the SO2‐BS2 consortium
    explanation: Quantifies the drop in SO2-BS2 average leaching rate between days 1-6 (10.033 mg L^-1 day^-1) and days 7-14
      (1.171 mg L^-1 day^-1).
