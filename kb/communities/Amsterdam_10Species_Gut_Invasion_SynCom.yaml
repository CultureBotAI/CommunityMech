ecological_interactions:
- name: Negative Conditioned-Medium Interactions
  description: Cell-free stationary-phase spent YCFA medium from each species was mixed with fresh YCFA and used to grow every
    other species. Final-density effects were mostly negative, consistent with soluble resource depletion or inhibitory products
    dominating the tested donor-acceptor interaction matrix.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: GLV Co-culture Assembly Prediction
    description: The conditioned-medium final-population-density interactions parameterized GLV equations for co-culture equilibria.
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: negative interactions, which could be caused by e.g., resource competition or toxin production, dominate between
      the tested species
    explanation: Supports mostly negative soluble interactions among the tested strains.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We then prepared conditioned medium by mixing 60% fresh YCFA medium with 40% of spent medium.
    explanation: Supports the spent- plus fresh-YCFA conditioned-medium design.
- name: GLV Co-culture Assembly Prediction
  description: A generalized Lotka-Volterra model parameterized from conditioned media predicted qPCR-measured relative frequencies
    across two-species and selected three- or four-species co-cultures, showing that soluble pairwise interaction terms carried
    assembly signal beyond monoculture growth.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: regulation of multi-organism process
    term:
      id: GO:0043900
      label: regulation of multi-organism process
  downstream:
  - target: Resident-to-Invader Growth Control
    description: The same conditioned-medium interaction matrix was used to simulate E. coli and B. ovatus invasions into
      model-predicted stable resident communities.
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To validate the predictions, we grew the 36 combinations of two species and measured their final relative frequencies
      with qPCR.
    explanation: Supports experimental validation across all two-member combinations.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We grew 11 co-cultures of three and four species for 24 h and compared the final fraction with model predictions
    explanation: Supports validation of the model against three- and four-species co-cultures.
- name: Resident-to-Invader Growth Control
  description: 'Model-predicted resident assemblages differed strongly in whether they admitted E. coli or B. ovatus invaders:
    simulated B. ovatus invasions succeeded in most stable communities, simulated E. coli invasions succeeded in a minority,
    and 13 in-vitro invasion experiments matched the predicted successes and failures.'
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: regulation of biological quality
    term:
      id: GO:0065008
      label: regulation of biological quality
    notes: Broad GO proxy for resident control of invader growth.
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: E. coli can only invade 24.1% of the stable communities in which it is not present
    explanation: Supports a lower simulated invasion-success fraction for E. coli.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: B. ovatus can invade 97.6% of the stable communities
    explanation: Supports a higher simulated invasion-success fraction for B. ovatus.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Relative growth of the invader was measured for 13 different communities.
    explanation: Supports the in-vitro invasion validation set size.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We predicted invasions using a 5% population threshold at 24 h and successfully predicted all observed invasions.
    explanation: Supports agreement between predicted and observed invasion outcomes.
environmental_factors:
- name: 40 percent spent YCFA conditioned medium
  value: 60% fresh YCFA medium plus 40% spent medium
  description: Filtered spent medium from stationary-phase donor cultures was mixed with fresh phosphate-buffered YCFA to
    expose acceptor strains to donor-modified soluble chemistry.
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We then prepared conditioned medium by mixing 60% fresh YCFA medium with 40% of spent medium.
    explanation: Supports the conditioned-medium mixing ratio.
growth_media:
- name: Phosphate-buffered YCFA medium
  temperature: '37'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: 10% H2 / 80% N2 / 10% CO2
  incubation_time: '24'
  incubation_time_unit: h
  vessel_type: anaerobic chamber and 8 mL flasks
  preparation_notes: All DSMZ strains were grown in phosphate-buffered YCFA under anoxic gas; conditioned-medium donors grew
    24 h before 0.2 um filtration, and co-cultures were assembled after logarithmic phase pre-cultures.
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strains were then grown in YCFA media containing a phosphate buffer under anaerobic conditions using an anaerobic
      chamber filled with anoxic gas (10% H2, 80% N2, 10% CO2) set at 37°C
    explanation: Names the YCFA medium, phosphate buffer, gas mix, and 37°C setpoint.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All co-cultures were grown for 24 h in 8 mL flasks
    explanation: Supports the co-culture flask size and incubation time.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: FLASK
  instrument_detail: 8 mL flasks incubated under anaerobic YCFA conditions
  working_volume: 8.0
  working_volume_unit: mL
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: Two- to four-member co-cultures were inoculated with equal CFU contributions and grown from a final combined
    OD600 of 0.05. Invasion assays ran resident consortia for 24 h from OD600 0.05, washed and added the invader at OD600
    0.05, and incubated for another 24 h before qPCR.
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All co-cultures were grown for 24 h in 8 mL flasks
    explanation: Supports the batch flask co-culture format.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Initial consortia were cultivated for 24 h starting at an OD600 of 0.05.
    explanation: Supports the first phase of the invasion assay.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The washed invading species was then introduced into the resuspended initial consortia at a final OD600 of 0.05.
    explanation: Supports the invader inoculation density.
