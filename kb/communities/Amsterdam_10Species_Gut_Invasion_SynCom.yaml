id: CommunityMech:000382
name: Amsterdam 10-Species Gut Invasion SynCom
description: A defined ten-strain human gut bacterial synthetic-community panel used to quantify soluble, environmentally
  mediated interactions and predict community assembly and invasion outcomes. van Leeuwen et al. generated cell-free YCFA
  spent media from each DSMZ strain, grew every other strain in 40% spent plus 60% fresh YCFA medium, validated generalized
  Lotka-Volterra predictions with two- to four-member YCFA co-cultures, and tested whether Escherichia coli DSM 18039 or Bacteroides
  ovatus DSM 1896 could invade predicted stable resident assemblages.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Measure soluble pairwise interactions among prominent gut bacteria and test whether conditioned-medium interaction
    parameters predict co-culture assembly and invasion success.
  assembly_strategy: Assemble a ten-strain DSMZ panel of common human-gut bacteria; conditioned-medium assays used all ten
    species, and Roseburia intestinalis was excluded from later generalized Lotka-Volterra analyses after failing to grow
    in most conditioned media.
  inoculation_strategy: Combine species into co-cultures using OD-to-CFU correlations for equal CFU inputs, then dilute the
    mixture to a final combined OD600 of 0.05.
  perturbation_design: Assay all 90 donor-acceptor conditioned-medium pairs, grow 36 two-species combinations and 11 three-
    or four-species co-cultures, and challenge model-predicted stable communities with washed E. coli or B. ovatus invaders.
  measurement_endpoints:
  - OD595 growth curves in conditioned media
  - qPCR-derived relative frequencies in co-cultures
  - generalized Lotka-Volterra equilibrium predictions
  - 24 h invasion growth of Escherichia coli and Bacteroides ovatus
  evidence:
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study uses a 10-species synthetic community of common gut microbiota to predict stable communities and invasion
      success.
    explanation: Supports the defined ten-species gut SynCom scope.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All 10 bacteria were cultured in all other nine conditioned media, resulting in a total of 90 combinations.
    explanation: Supports the exhaustive conditioned-medium donor-acceptor design.
  - reference: PMID:41960919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using OD-CFU correlations, the bacteria were combined using an equal number of CFUs and subsequently diluted
      to a final combined OD of 0.05.
    explanation: Supports equalized CFU inoculation of the co-cultures.
