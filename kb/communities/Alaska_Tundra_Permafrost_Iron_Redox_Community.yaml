  downstream:
  - target: Fe(II) Oxidation by Chemoautotrophic Gallionella
    description: HYPOTHESIZED - Fe(III) reduction could supply Fe(II) to Gallionella-associated oxidation; the proposed
      substrate connection was inferred from genomic patterns, not traced between partners.
  - target: Candidate Iron-Reduction Suppression of Acetoclastic Methanogenesis
    description: HYPOTHESIZED - acetate use by iron reducers could limit substrate for acetoclastic methanogenesis;
      the study did not isolate acetate competition or measure its effect on methane flux.
  evidence:
  - reference: PMID:37996661
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the abundance of genes for Fe(III) reduction (e.g., MtrE) and Fe(II) oxidation (e.g., Cyc1) increased
      concurrently with genes for benzoate degradation and pyruvate metabolism, in which pyruvate is used to generate
      acetate that can be oxidized, along with benzoate, to CO2 when coupled with Fe(III) reduction
    explanation: Concurrent gene-abundance changes support the proposed coupling, not directly measured carbon or
      electron flux.
- name: Candidate Iron-Reduction Suppression of Acetoclastic Methanogenesis
  description: HYPOTHESIZED - declining methane-metabolism gene abundance during thaw was interpreted as consistent
    with iron reducers competing for acetate. This is not direct evidence that Rhodoferax suppressed methane production
    or caused the methanogen genomic changes.
  scope: COMMUNITY_LEVEL
  participating_taxa:
