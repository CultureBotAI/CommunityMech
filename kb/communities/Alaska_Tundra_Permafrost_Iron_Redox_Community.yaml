- name: Fe(III) Reduction Coupled to Organic Acid Oxidation
  description: HYPOTHESIZED - concurrent increases in iron-redox, benzoate-degradation and pyruvate-metabolism gene
    abundance support Rhodoferax-associated potential for organic-acid oxidation coupled to Fe(III) reduction during
    thaw. Gene copies do not establish pathway flux or the organism-resolved electron flow.
  scope: COMMUNITY_LEVEL
  participating_taxa:
