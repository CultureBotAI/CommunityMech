metal_notes: Iron-redox metabolism is the central process this community is built around;
  the dominant taxa are heterotrophic Fe(III)-reducing Rhodoferax and chemoautotrophic
  Fe(II)-oxidizing Gallionella, with Fe(III) reduction coupled to acetate/benzoate
  oxidation and Fe(II) re-oxidation closing the cycle.
