id: CommunityMech:000156
name: Neocallimastix-Methanobrevibacter Xylanolytic Coculture
description: >
  A defined anaerobic rumen-derived coculture in which the xylan-degrading fungus Neocallimastix
  frontalis PNK2 is grown with the hydrogenotrophic archaeon Methanobrevibacter smithii on xylan. The
  methanogen removes fermentation products through interspecies hydrogen transfer, shifting fungal
  metabolism toward acetate formation and increasing xylan utilization and extracellular hemicellulase
  activities.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Test whether a methanogenic partner stimulates xylan degradation and extracellular enzyme
    activity by anaerobic ruminal fungi.
  assembly_strategy: Grow axenic Neocallimastix frontalis PNK2 or coculture it with Methanobrevibacter
    smithii on xylan under anaerobic conditions.
  perturbation_design: Compare fungal monoculture with fungus-methanogen coculture over batch and extended
    incubation periods.
  measurement_endpoints:
  - rate and extent of xylan utilization
  - extracellular xylanase activity
  - alpha-L-arabinofuranosidase activity
  - beta-D-xylosidase activity
  - fermentation metabolite profiles
  evidence:
  - reference: PMID:16348244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Effect of Methanobrevibacter smithii on Xylanolytic Activity of Anaerobic Ruminal Fungi
    explanation: Supports the experimental focus on M. smithii effects on ruminal fungal xylanolysis.
