ecological_interactions:
- name: N7-A11 4,5-dicarboxyphenanthrene handoff
  description: >-
    Pelagerythrobacter sp. N7 initiated pyrene oxidation but accumulated
    4,5-dicarboxyphenanthrene as a bottleneck product in monoculture. PES
    additionally accumulated downstream products including 4-carboxyphenanthrene,
    phthalate, salicylic acid, and gentisate, leading the authors to propose
    that Salinicola sp. A11 assists N7 by decarboxylating
    4,5-dicarboxyphenanthrene through an hphtC-5-encoded candidate aromatic-acid
    decarboxylase.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pelagerythrobacter sp. N7
    term:
      id: NCBITaxon:2800685
      label: Pelagerythrobacter
  target_taxon:
    preferred_term: Salinicola sp. A11
    term:
      id: NCBITaxon:404432
      label: Salinicola
  metabolites:
  - preferred_term: pyrene
    term:
      id: CHEBI:39106
      label: pyrene
  downstream:
  - target: Complete 5%-salinity pyrene removal by PES
    description: >-
      The proposed N7-to-A11 intermediate handoff relieves the
      4,5-dicarboxyphenanthrene bottleneck observed in N7 monoculture and helps
      PES degrade the supplied pyrene completely within the main 10-day assay.
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Owing to the inability to further transfer 4,5-dicarboxyphenanthrene, the
      metabolic pathway was disrupted, leading to the significant accumulation
      of 4,5-dicarboxyphenanthrene during pyrene degradation by the pure culture
      of strain N7.
    explanation: Supports 4,5-dicarboxyphenanthrene as the N7 monoculture bottleneck.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      enzyme encoded by hphtC-5 was proposed to be the candidate decarboxylase
      for the decarboxylation process of 4,5-dicarboxyphenanthrene.
    explanation: Supports hphtC-5 as the expressed A11 candidate for the decarboxylation step.
- name: A11 extracellular bioemulsification of hydrophobic pyrene
  description: >-
    Salinicola sp. A11 secreted extracellular emulsan-like material detected in
    A11 and PES cell-free supernatants, but not N7 cell-free supernatant. The
    extracellular emulsifier was modeled as increasing hydrophobic pyrene
    bioavailability for the N7-centered upstream oxidation arm.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Salinicola sp. A11
    term:
      id: NCBITaxon:404432
      label: Salinicola
  target_taxon:
    preferred_term: Pelagerythrobacter sp. N7
    term:
      id: NCBITaxon:2800685
      label: Pelagerythrobacter
  metabolites:
  - preferred_term: pyrene
    term:
      id: CHEBI:39106
      label: pyrene
  downstream:
  - target: Complete 5%-salinity pyrene removal by PES
    description: >-
      A11 extracellular bioemulsifier production is proposed to reduce the mass
      transfer limitation of hydrophobic pyrene and thereby increase PES pyrene
      degradation efficiency.
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Distinct and persistent emulsion layers were observed only in the
      cell-free supernatants of strain A11 and consortium PES
    explanation: Supports A11 and PES, but not N7 alone, as sources of extracellular emulsifying activity.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In the genome of strain A11, wza, wzb, and wzc related genes were identified
    explanation: Supports the A11 genomic capacity for an emulsan-like export system.
- name: Complete 5%-salinity pyrene removal by PES
  description: >-
    In 200 mL 5%-salinity SSDM batch flasks with 50 mg/L pyrene as the sole
    carbon source, the two-member PES consortium approached complete pyrene
    removal within 10 days, whereas neither pure culture completely degraded
    pyrene by itself under the tested conditions.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: pyrene
    term:
      id: CHEBI:39106
      label: pyrene
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Within a 10-day cultivation period, the removal rate of 50 mg/L pyrene by
      the consortium PES approached 100%
    explanation: Supports the measured complete-pyrene-removal endpoint of the two-member consortium.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain A11 was detected to be unable to degrade PAHs
    explanation: Supports that A11 did not remove PAHs as an axenic culture.
environmental_factors:
- name: Sodium-chloride-dominated salinity
  value: 1%, 3%, 5%, 8%, and 10%
  description: >-
    PES pyrene degradation was tested over five salinity levels created by
    proportionally changing NaCl, MgCl2 and MgSO4 in SSDM while holding other
    medium components constant.
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The adaptability of the synthetic consortium to environmental factors was
      evaluated by monitoring pyrene degradation under various salinity levels
      (1%, 3%, 5%, 8%, and 10%)
    explanation: Supports the salinity gradient tested for PES pyrene degradation.
- name: Initial pH
  value: 5.0, 6.0, 7.0, 8.0, 9.0, and 10.0
  description: PES degraded pyrene fastest near neutral pH and was inhibited at pH 5 and 10.
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As shown in Figure 3B , the degradation efficiency approached 100% after
      10 days of incubation at both pH 7 and pH 8, with the most rapid
      degradation occurring at pH 7.
    explanation: Supports the pH-dependent pyrene-removal phenotype.
