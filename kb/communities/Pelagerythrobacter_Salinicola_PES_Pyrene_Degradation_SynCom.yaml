id: CommunityMech:000340
name: Pelagerythrobacter-Salinicola PES Pyrene-Degradation SynCom
description: >-
  A defined two-member halophilic synthetic consortium, PES, assembled from
  Pelagerythrobacter sp. N7 and Salinicola sp. A11, which were isolated from a
  PAH-degrading consortium enriched from saline PAH-polluted soil in Shanxi
  Province, China. Washed suspensions of the two isolates were mixed 1:1 and
  assayed in 5% sea-salt defined medium with 50 mg/L pyrene as the sole carbon
  source. N7 alone initiated pyrene oxidation but incompletely removed pyrene
  and accumulated 4,5-dicarboxyphenanthrene, whereas A11 alone had no detectable
  direct pyrene-degrading capability. In the PES consortium, A11 supplied a
  proposed hphtC-5-encoded aromatic-acid decarboxylase/downstream C12O arm and
  extracellular emulsan-like bioemulsifier activity, together enabling complete
  removal of 50 mg/L pyrene within 10 days at 5% salinity.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >-
    Construct a two-member moderate-halophile SynCom that couples upstream pyrene
    oxidation with downstream intermediate transformation and extracellular
    bioemulsification to degrade pyrene under saline conditions.
  assembly_strategy: >-
    Isolate Pelagerythrobacter sp. N7 and Salinicola sp. A11 from a
    phenanthrene-enriched halophilic PAH-degrading community and combine washed
    suspensions of the two pure cultures at a 1:1 volume ratio.
  inoculation_strategy: >-
    N7 and A11 were each resuspended in fresh 5% SSDM to OD600 0.2, mixed 1:1,
    and inoculated into 200 mL pyrene-amended 5% salinity SSDM at initial OD600
    0.015.
  perturbation_design: >-
    Compare N7 monoculture, A11 monoculture, PES coculture, and abiotic controls;
    assay PES pyrene removal across 1%, 3%, 5%, 8%, and 10% salinity and across
    pH 5.0, 6.0, 7.0, 8.0, 9.0, and 10.0.
  measurement_endpoints:
  - HPLC quantification of residual pyrene and accumulated 4,5-dicarboxyphenanthrene
  - GC-MS identification of pyrene-degradation intermediates
  - RT-qPCR for RHD, G12O, C12O, and hphtC-5 transcripts
  - A11 genome annotation and candidate decarboxylase structural modeling
  - Cell-free-supernatant bioemulsifier assay and FTIR characterization
  notes: >-
    The curated syntrophic network follows the authors' integrated model from
    metabolite detection, genomic annotation, gene expression, and
    bioemulsifier assays. The hphtC-5 step in A11 was proposed as a candidate
    activity rather than validated by purified-enzyme or knockout experiments.
  evidence:
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, a halophilic synthetic consortium, PES, comprising
      Pelagerythrobacter sp. N7 and Salinicola sp. A11, was constructed on the
      basis of the bottom-up strategy.
    explanation: Supports the exact two-member bottom-up synthetic consortium.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The 2 cell resuspensions were mixed at 1:1 volume ratio to construct the synthetic consortium PES
    explanation: Supports the 1:1 OD-adjusted assembly strategy for PES.
  - reference: PMID:42666409
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consortium PES completely degraded 50 mg/L pyrene at 5% salinity in 10
      days.
    explanation: Supports the pyrene-removal objective under the main saline assay condition.
