discussions:
- discussion_id: hphtc5_decarboxylase_candidate_unresolved
  prompt: >-
    Is the A11 hphtC-5 candidate sufficient and necessary for
    4,5-dicarboxyphenanthrene decarboxylation inside PES?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#N7-A11 4,5-dicarboxyphenanthrene handoff
  rationale: >-
    The source detected downstream pyrene metabolites in PES, annotated
    hphtC-5 in the A11 genome, modeled a compatible active site, and measured
    hphtC-5 expression by RT-PCR. It did not purify HphtC-5 or perturb hphtC-5
    genetically, so the specific enzyme assignment remains a candidate step.
  posed_by: codex
  posed_date: '2026-09-11'
