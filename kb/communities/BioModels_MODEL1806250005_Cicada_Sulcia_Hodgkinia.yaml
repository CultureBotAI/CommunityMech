ecological_interactions:
- name: Sulcia Essential Amino Acid Provisioning
  description: Sulcia provides essential amino acids to the cicada host, which are lacking in the nutrient-poor
    xylem sap diet. Through metabolic modeling, Sulcia with its highly reduced genome (≤0.3 Mb) is calculated
    to recycle 30-80% of host-derived nitrogen to essential amino acids that are returned to the host.
    This mutualistic relationship represents extensive bidirectional metabolite flux between Sulcia and
    the host, with the host providing carbon/energy substrates and Sulcia synthesizing amino acids the
    host cannot produce.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Sulcia
    term:
      id: NCBITaxon:2716471
      label: Sulcia
  target_taxon:
    preferred_term: Neotibicen canicularis
    term:
      id: NCBITaxon:1699721
      label: Neotibicen canicularis
  metabolites:
  - preferred_term: L-leucine
