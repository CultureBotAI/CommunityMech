    term:
      id: CHEBI:25555
      label: nitrogen atom
    concentration: 30-80% recycled from host to essential amino acids
  evidence:
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Sulcia and Hodgkinia with genomes of ≤0.3 Mb are calculated to recycle ∼30 to 80% of host-derived
      nitrogen to essential amino acids returned to the host
    explanation: Quantifies Hodgkinia's significant contribution to nitrogen recycling and metabolite
      provisioning to the host.
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: near-complete metabolic segregation (i.e., near absence of metabolic cross-feeding) between
      the two symbionts, a likely mode of host control over symbiont metabolism
    explanation: Demonstrates that Hodgkinia and Sulcia exchange metabolites primarily with the host rather
      than directly with each other.
