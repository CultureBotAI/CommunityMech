      label: L-isoleucine
    concentration: Essential amino acid produced by Sulcia
  - preferred_term: nitrogen
    term:
      id: CHEBI:25555
      label: nitrogen atom
    concentration: 30-80% recycled from host to essential amino acids
  evidence:
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Sulcia and Hodgkinia with genomes of ≤0.3 Mb are calculated to recycle ∼30 to 80% of host-derived
      nitrogen to essential amino acids returned to the host
    explanation: Demonstrates Sulcia's role in nitrogen recycling and essential amino acid provisioning
      to the host through metabolic modeling.
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our simulations reveal extensive bidirectional flux of multiple metabolites between each
      symbiont and the host
    explanation: Supports the extensive metabolic exchange between Sulcia and the cicada host.
- name: Hodgkinia Metabolic Complementarity
  description: Hodgkinia, the coprimary symbiont with a highly reduced genome (≤0.3 Mb similar to Sulcia),
    provides metabolic functions that complement both the host and Sulcia. Hodgkinia is calculated to
    recycle 30-80% of host-derived nitrogen, contributing significantly to essential amino acid and vitamin
    synthesis. The metabolic modeling reveals near-complete metabolic segregation between Hodgkinia and
    Sulcia, with metabolite exchange occurring primarily through host-mediated pathways rather than direct
    cross-feeding between symbionts, representing a mode of host control over symbiont metabolism.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Hodgkinia
    term:
      id: NCBITaxon:573657
      label: Candidatus Hodgkinia
  target_taxon:
