id: CommunityMech:000480
name: Chinese Fir Endophytic Phosphate-Solubilizing Synthetic Community SynCom-P6
description: Six-strain synthetic microbial community (SynCom-P6) constructed from non-antagonistic endophytic phosphate-solubilizing
  bacteria isolated from roots of Chinese fir (Cunninghamia lanceolata) capable of solubilizing calcium phosphate, iron phosphate,
  aluminum phosphate, and organic phosphorus. Applied to Chinese fir seedlings, SynCom-P6 mobilizes insoluble soil phosphorus,
  enriches beneficial rhizosphere genera Massilia and Dyadobacter, upregulates nitrogen fixation and hormone signaling genes,
  and enhances root elongation and biomass accumulation.
