id: CommunityMech:000314
name: SynCom ARC Peanut Aflatoxin-Control and Nodulation-Coupling Community
description: >
  A four-strain rhizosphere synthetic community — three Bacillus isolates (Bl13-2C11, Ba13-20E05,
  Bm14-5G09) and one Enterobacter isolate (El17-4B09) — assembled to couple two functions that are
  normally pursued separately in peanut: suppression of the aflatoxin-producing fungus Aspergillus
  flavus, and induction of rhizobia-legume nodulation. Candidate genera were chosen from
  cross-regional rhizosphere surveys as taxa negatively correlated with Aspergillus abundance but
  not with Bradyrhizobium, so that antifungal activity would not come at the cost of the nitrogen-
  fixing symbiont; strains that inhibited Bradyrhizobium in coculture were screened out on exactly
  that criterion. The resulting community, SynCom ARC, reduced peanut aflatoxin by 85.6% across
  four years of field trials and enhanced nodulation and nitrogenase activity while retaining
  active nodules at harvest. The record captures the community as a deliberately compatibility-
  constrained consortium: its design problem is not maximal antifungal potency but antagonism of
  the pathogen that spares a mutualist.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Build a single synthetic community that both suppresses aflatoxin-producing Aspergillus
    flavus and promotes rhizobia-legume nodulation in peanut, rather than trading one against the
    other.
  assembly_strategy: Screen rhizosphere genera negatively correlated with Aspergillus abundance but
    not with Bradyrhizobium; test isolates for aflatoxin inhibition against A. flavus and for
    compatibility with Bradyrhizobium; retain three Bacillus and one Enterobacter strain and combine
    them into candidate synthetic communities.
  measurement_endpoints:
  - Aflatoxin inhibition rate in coculture with A. flavus
  - Peanut aflatoxin level in multi-year field trials
  - Peanut nodule number, nitrogenase activity, and nodule retention at harvest
  - Yield, checked for a super-nodulation penalty
  notes: >
    Counter-selection is part of the design and is recorded here rather than as an ecological
    interaction. Three candidate Bacillus isolates inhibited Bradyrhizobium in coculture and were
    excluded on that basis; the source does not say which isolates they were, so they cannot be
    distinguished from the retained Bacillus members, which are all grounded at the same genus-level
    NCBITaxon:1386. Curating the exclusion as a typed Bacillus -> Bradyrhizobium COMPETITION edge
    would therefore assert, to any consumer reading only the interaction graph, that an ARC member
    antagonises the very mutualist ARC was assembled to spare — the opposite of the finding. The
    fact is kept, the misleading edge is not.
  evidence:
  - reference: PMID:42099455
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on the antifungal activity and rhizobial compatibility, finally, 3 Bacillus
    explanation: States the two-part selection criterion — antifungal activity together with
      rhizobial compatibility — that defines this community's assembly strategy.
  - reference: PMID:42099455
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 3 Bacillus inhibited Bradyrhizobium
    explanation: >-
      The counter-selection itself: three candidate Bacillus isolates antagonised the rhizobium and
      were excluded. Carried on the design rather than on an interaction because the excluded
      isolates are indistinguishable from the retained ones at the taxonomic resolution the source
      provides.
