ecological_interactions:
- name: SynCom ARC Suppression of Aspergillus flavus
  description: >
    The four-strain community inhibits growth of the aflatoxin-producing fungus Aspergillus flavus
    and lowers peanut aflatoxin levels by 85.6% over four years of field trials, with the abstract
    additionally reporting that the community acts on multiple targets in the fungus.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42099455
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom ARC inhibits A. flavus growth and reduces peanut aflatoxin levels by 85.6% in 4
      year field trials
    explanation: Supports community-level antagonism of the pathogen with a quantified field
      outcome.
- name: SynCom ARC Induction of Rhizobia-Legume Nodulation
  description: >
    Alongside pathogen suppression, the community enhances peanut nodulation and nitrogenase
    activity and keeps nodules active through to harvest, so the same consortium that antagonises
    the fungus facilitates colonisation by the nitrogen-fixing symbiont.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42099455
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom ARC enhances peanut nodulation and nitrogenase activity, retains active nodules
      at harvest
    explanation: Supports facilitation of the rhizobia-legume symbiosis as a community-level effect
      distinct from the antifungal activity.
environmental_factors:
- name: Multi-year multi-site field trial
  value: 4 years; 325 sites across 19 provinces
  description: >
    Both functions were evaluated in field conditions rather than only in vitro: aflatoxin
    reduction over four years of trials, and nodulation and yield effects across 325 sites in 19
    provinces, with yield checked for a super-nodulation penalty.
  evidence:
  - reference: PMID:42099455
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: boosts yield without super nodulation penalty in 325 sites of 19 provinces
    explanation: Establishes the field scale of the evaluation and that yield was checked against a
      super-nodulation trade-off.
