id: CommunityMech:000351
name: MUC2 Human Gut Commensal Defined Consortium
description: >-
  A 14-strain, commercially sourced synthetic consortium of human gut
  commensals assembled to span low, moderate, and extensive mucin-glycan
  degradation capacities. The consortium was grown anaerobically in ZMB1
  chemically defined medium in 150 mL bioreactors with either vehicle or
  0.5 mg/mL porcine MUC2. After 72 h of semi-continuous cultivation, MUC2
  supplementation shifted group-level qPCR profiles by expanding Akkermansia
  and reducing Prevotella, and it remodeled extracellular metabolism by
  lowering acetate while increasing propionate, butyrate, and formate.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: >-
    Test how exogenous MUC2 reshapes the structure and metabolic output of a
    defined human-gut consortium whose members have varied capacities to
    degrade mucin glycans.
  assembly_strategy: >-
    Combine commercially available anaerobic human gut commensals selected as
    low-capacity, moderate-capacity, and extensive mucin-glycan degraders.
  perturbation_design: >-
    Compare vehicle-treated ZMB1 bioreactors with matched bioreactors amended
    with 0.5 mg/mL porcine MUC2.
  measurement_endpoints:
  - Bacterial groups by qPCR-derived colony-forming-unit estimates
  - Targeted short-chain fatty acid LC-MS/MS
  - LC-MS/MS profiles of amino acids, vitamins, nucleic acids, and neuroactive metabolites
  evidence:
  - reference: PMID:42007376
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A defined consortium of human gut commensals with varied mucin-degrading
      capacities was cultivated in anaerobic bioreactors in the presence or
      absence of porcine MUC2.
    explanation: >-
      Supports the defined-consortium design and the MUC2 perturbation.
