ecological_interactions:
- name: MUC2 Glycan Niche Restructuring
  description: >-
    Porcine MUC2 altered the qPCR-detected community profile after three days,
    significantly increasing Akkermansia and decreasing Prevotella against the
    vehicle-treated consortium.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: MUC2-Shifted Short-Chain Fatty Acid Output
    description: >-
      MUC2-dependent changes in community structure accompanied broad changes
      in extracellular fermentation products.
  evidence:
  - reference: PMID:42007376
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MUC2 supplementation significantly altered community structure, promoting
      the expansion of Akkermansia muciniphila while reducing Prevotella.
    explanation: >-
      Supports the direction of the community-composition shift under MUC2.
- name: MUC2-Shifted Short-Chain Fatty Acid Output
  description: >-
    The MUC2-amended defined consortium showed reduced acetate and elevated
    propionate, butyrate, and formate relative to vehicle controls, consistent
    with MUC2 changing how the community routed fermentation products.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  evidence:
  - reference: PMID:42007376
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MUC2 also reshaped microbial metabolism, decreasing acetate levels while
      increasing propionate, butyrate, and formate.
    explanation: >-
      Supports the MUC2-dependent shift in extracellular short-chain fatty
      acids and formate.
environmental_factors:
- name: Porcine MUC2 supplementation
  value: '0.5'
  unit: mg/mL
  description: >-
    Bioreactors in the MUC2 arm received porcine MUC2, while control
    bioreactors received the same volume of water.
  evidence:
  - reference: PMID:42007376
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To the bioreactors receiving mucins, we added 0.5 mg/mL of porcine MUC2
      (MyBiosource cat# MBS2028824)
    explanation: >-
      Supports porcine MUC2 as the experimental supplementation and gives its
      dose.
growth_media:
- name: ZMB1 chemically defined medium
  temperature: 37
  temperature_unit: °C
  atmosphere: ANAEROBIC
  inoculum_size: 0.05
  inoculum_unit: OD600
  incubation_time: 72
  incubation_time_unit: h
  shaking_speed: 200
  shaking_speed_unit: rpm
  vessel_type: bioreactor
  preparation_notes: >-
    Pelleted overnight monocultures were washed three times in sterile
    anaerobic PBS, resuspended in ZMB1, and inoculated into 150 mL ZMB1 before
    random assignment to vehicle or MUC2 treatment. Ten percent of the medium
    was replaced daily.
  evidence:
  - reference: PMID:42007376
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After the final wash, bacteria were resuspended in an equivalent volume
      of the chemically defined medium ZMB1
    explanation: >-
      Supports ZMB1 as the common chemically defined medium used to assemble
      the consortium.
cultivation_setup:
- cultivation_mode: SEMI_CONTINUOUS
  system_type: BIOREACTOR_UNSPECIFIED
  working_volume: 150
  working_volume_unit: mL
  operating_temperature: 37
  operating_temperature_unit: °C
  ph_controlled: false
  do_controlled: false
  temperature_controlled: true
  controls_notes: >-
    Cultures were stirred on a magnetic stir plate at 200 rpm and kept in an
    Anaerobe Systems AS-150 oxygen-free chamber; pH was explicitly not
    controlled.
  evidence:
  - reference: PMID:42007376
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The system operated as a semi-continuous culture, with 10% of the medium
      replaced daily to maintain nutrient availability.
    explanation: >-
      Supports draw-and-fill semi-continuous operation in the anaerobic
      bioreactors.
