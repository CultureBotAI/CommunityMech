discussions:
- discussion_id: reciprocal_exchange_strain_context
  prompt: How general is reciprocal exchange across donor and recipient backgrounds?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Ammonium Cross-Feeding By Nitrogen-Fixing R. palustris
  - ecological_interactions#E. coli Fermentation Product Cross-Feeding
  - ecological_interactions#Reciprocal Carbon-Nitrogen Cross-Feeding
  rationale: The complete primary manuscript distinguishes engineered ammonium donors from WT-based emergence and
    shows that recipient adaptation can enable coculture growth without increased donor ammonium excretion. Retain
    both observed transfer directions, but do not generalize growth rates, readiness of exchange or inferred uptake
    feedback to arbitrary wild-type pairings. Species-level canonical taxonomy is unchanged. No new genetic design
    or experimental protocol is curated.
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: multiple combinations of recipient and producer genotypes can lead to stable coexistence
    explanation: Discussion limits coexistence to genotype/environment combinations, rather than all pairings.
