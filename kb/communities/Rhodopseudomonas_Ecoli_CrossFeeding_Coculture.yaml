ecological_interactions:
- name: Ammonium Cross-Feeding By Nitrogen-Fixing R. palustris
  description: 'In the tested anaerobic cocultures, nitrogen-fixing R. palustris supplies ammonium required by E.
    coli. Effective exchange depends on the donor and recipient context: engineered ammonium-excreting partners
    support growth, whereas WT-based emergence depends on recipient adaptation. This is not a claim that every wild-type
    pairing readily supports the same exchange.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Rhodopseudomonas palustris
    term:
      id: NCBITaxon:1076
      label: Rhodopseudomonas palustris
  target_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  metabolites:
  - preferred_term: dinitrogen
    term:
      id: CHEBI:17997
      label: dinitrogen
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  downstream:
  - target: Reciprocal Carbon-Nitrogen Cross-Feeding
    description: Ammonium transfer supports E. coli nitrogen acquisition and thereby its contribution to reciprocal
      coculture growth in the tested donor/recipient contexts; the rate and emergence of this exchange are strain
      dependent.
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: R. palustris fixes dinitrogen gas (N2) via the enzyme nitrogenase and excretes ammonium (NH4+)
    explanation: Supports the ammonium-transfer direction; donor and recipient context is qualified from the primary
      Results and Discussion.
- name: E. coli Fermentation Product Cross-Feeding
  description: E. coli fermentation supplies acetate, lactate and succinate that R. palustris can use as carbon
    sources in the studied cocultures. The paper excludes formate from these consumed organic-acid carbon sources;
    ethanol excretion is not evidence that ethanol supplies the partner. This is the carbon-transfer half of the
    demonstrated reciprocal exchange.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  target_taxon:
    preferred_term: Rhodopseudomonas palustris
    term:
      id: NCBITaxon:1076
      label: Rhodopseudomonas palustris
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Reciprocal Carbon-Nitrogen Cross-Feeding
    description: The usable organic-acid products of E. coli fermentation supply carbon to R. palustris, enabling
      the carbon-transfer arm of the reciprocal carbon/nitrogen exchange; not every excreted fermentation product
      is a partner carbon source.
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The organic acids, with the exception of formate, serve as the sole carbon sources for R. palustris
    explanation: The primary passage directly specifies organic-acid carbon use and excludes formate. Ethanol excretion
      alone does not establish ethanol transfer.
- name: Reciprocal Carbon-Nitrogen Cross-Feeding
  description: Reciprocal exchange of ammonium and usable organic-acid carbon supports the tested R. palustris-E.
    coli cocultures. Engineered donor contexts and adapted recipient contexts are distinct routes to coexistence,
    not a universal wild-type phenotype. Enhanced recipient uptake is the authors mechanistic interpretation of
    emergence; no new gene-design or feedback node is added here.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Previously we engineered a cross-feeding coculture between N2-fixing Rhodopseudomonas palustris and
      fermentative Escherichia coli.
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Engineered R. palustris excretes essential nitrogen as NH4+ to E. coli, while E. coli excretes essential
      carbon as fermentation products to R. palustris.
    explanation: Supports ammonium transfer from the nitrogen-fixing R. palustris partner as one leg of the reciprocal
      cross-feeding interaction.
