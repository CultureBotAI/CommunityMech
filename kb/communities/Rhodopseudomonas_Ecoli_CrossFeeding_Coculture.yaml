ecological_interactions:
- name: Reciprocal Carbon-Nitrogen Cross-Feeding
  description: R. palustris supplies ammonium while E. coli supplies fermentation products.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Two-member coculture based on nitrogen transfer from R. palustris and carbon-rich fermentation
    product transfer from E. coli.
  description: Wild-type and engineered cross-feeding contexts were compared during coculture evolution.
  evidence:
  - *id001
related_ingredients:
- preferred_term: ammonium
  chebi_term:
    id: CHEBI:28938
    label: ammonium
  relevance: >
    Ammonium (NH4+) is the nitrogen currency of the cross-feeding interaction: R. palustris excretes
    essential nitrogen as NH4+ to E. coli, and emergent NH4+ cross-feeding is the central phenotype studied.
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: palustris excretes essential nitrogen as NH4+ to E. coli, while E. coli excretes
    explanation: Identifies ammonium (NH4+) as the nitrogen metabolite transferred from R. palustris to E. coli.
- preferred_term: dinitrogen
  chebi_term:
    id: CHEBI:17997
    label: dinitrogen
  relevance: >
    R. palustris is the N2-fixing partner, reducing atmospheric dinitrogen to supply fixed nitrogen that
    is excreted as ammonium to E. coli in the coculture.
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cross-feeding coculture between N2-fixing
    explanation: Names R. palustris as the N2 (dinitrogen)-fixing member underpinning nitrogen supply.
growth_media:
- name: MDC (M9-derived coculture medium)
  temperature: '30'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: 100% N2
  shaking_speed: '150'
  shaking_speed_unit: rpm
  light_regime: continuous (60 W incandescent bulb)
  inoculum_size: 2% v/v
  vessel_type: sealed anaerobic tube
  preparation_notes: Mono- and cocultures grown in 10 ml MDC in tubes made anaerobic under 100% N2 at
    30 °C, shaken at 150 rpm beside a 60 W incandescent bulb; serially passaged at 2% v/v of stationary-phase
    coculture.
  evidence:
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Experimental mono- and cocultures were grown in 10 ml of M9-derived coculture medium (MDC)
    explanation: Coculture medium is MDC (M9-derived coculture medium).
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Tubes were made anaerobic under 100% N2
    explanation: Anaerobic cultivation under an N2 headspace.
  - reference: PMID:32788711
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: shaken at 150 rpm beneath a 60 W incandescent bulb (750 lumens)
    explanation: Grown at 30 °C, 150 rpm shaking under incandescent light.
