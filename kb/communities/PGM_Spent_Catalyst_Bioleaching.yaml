    snippet: about 82.9% of Ni, 33.4% of Al, and 22.7% of Mo were leached
    explanation: Supports the column Al result, not an alumina-to-PGM exposure mechanism.
- name: Biogenic Thiosulfate Leaching of Synthetic Palladium Catalyst
  description: A separate activated-sludge gas-lift system produced up to 4.9 g/L thiosulfate at pH 10. Its liquid
    was concentrated at 100 C and filtered before chemical leaching of synthetic metallic Pd on alpha-alumina at
    60 C, pH 8 and 5% pulp. Biogenic thiosulfate removed 93.22% of Pd from the solid, but dissolved-phase recovery
    was 63.53%; precipitation accounts for the discrepancy. This is not A. thiooxidans thiosulfate production, a
    spent-refinery PGM column, demonstrated Pt/Rh recovery, a measured unique Pd-complex stoichiometry or proof
    of benign industrial operation.
  scope: COMMUNITY_LEVEL
