    notes: 'Primary sulfur-oxidizing bacterium responsible for both alumina dissolution and thiosulfate
      generation in spent catalyst bioleaching. This gram-negative chemolithoautotroph oxidizes elemental
      sulfur (S⁰) and reduced inorganic sulfur compounds (RISC) to sulfuric acid, which dissolves the
      alumina (γ-Al₂O₃) support matrix of automotive and hydroprocessing catalysts. The acidic attack
      on alumina follows: Al₂O₃ + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂O, releasing embedded PGM particles and solubilizing
      aluminum as sulfate (achieving 33.4% Al recovery from petroleum catalysts). This organism''s role in
      the cited work is acid generation for support dissolution. An earlier version of this note also
      credited it with producing the thiosulfate that complexes the PGMs; the sources do not support that
      and one of them contradicts it. PMID:31059950 and doi:10.1016/j.jenvman.2019.04.081, the two
      At. thiooxidans papers, never mention thiosulfate at all, and in PMID:38138568 the biogenic
      thiosulfate is made in a separate biogas biodesulfurization bioreactor operating at pH 8-10 under
      anoxic to microaerobic conditions - conditions an acidophile growing at pH 1.5-3.0 does not share.
      The two stages are documented in two different systems, not in one organism (#605).

      '
