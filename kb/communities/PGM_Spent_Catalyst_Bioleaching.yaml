  notes: 'Column bioreactor environment for PGM recovery from spent catalysts using acidophilic bioleaching
    consortium. Spent automotive three-way catalysts (TWC) and petroleum refinery hydroprocessing catalysts
    are crushed and loaded into bioleaching columns. TWC substrates contain Pt, Pd, and Rh on alumina
    (γ-Al₂O₃) ceramic support, while hydroprocessing catalysts contain Pd, Ni, Mo on Al₂O₃. The column
    setup enables continuous percolation of acidic bioleaching solution through the catalyst bed. Operating
    conditions vary by substrate but typically employ low pH (1.5-3.0) for alumina dissolution and moderate
    temperatures (25-35°C) for mesophilic sulfur oxidizers. The alumina matrix dissolution exposes embedded
    PGM particles, while biogenic thiosulfate complexes with PGMs to enable solubilization and recovery.

    '
