- name: Column Bioleaching of Refinery Catalyst Metals
  description: Submerged continuous A. thiooxidans column operation on uncrushed spent hydroprocessing catalyst
    leached 82.9% Ni, 33.4% Al and 22.7% Mo after 315 h. V reached 53.6% at 105 h and then declined, consistent
    with precipitation; FESEM detected V in precipitates. The accessible abstract reports diffusion control for
    Ni and chemical control for Al/V/Mo. These are positive metal-extraction findings, not Pd/Pt/Rh recovery or
    a combined acid/thiosulfate cascade. Full-text conditions and mechanistic controls remain uninspected.
  scope: PAIRWISE
