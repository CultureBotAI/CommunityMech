ecological_interactions:
- name: Aluminium Leaching from Refinery Catalyst
  description: A. thiooxidans column bioleaching of an uncrushed refinery hydroprocessing catalyst released 33.4%
    of its Al after 315 h in submerged continuous operation. The accessible abstract reports a chemical-control
    kinetic fit for Al dissolution, not direct demonstration of gamma-alumina removal exposing PGM particles. This
    experiment is separate from synthetic Pd/alpha-alumina thiosulfate leaching; additional sulfur-oxidizing partners
    are not established.
  scope: PAIRWISE
