    id: ENVO:00002007
    label: sediment
  notes: 'Sediment from East Fork Poplar Creek, Oak Ridge Reservation, Oak Ridge, TN. The creek has been
    contaminated with mercury from upstream sources associated with historical weapons production at the
    Y-12 National Security Complex. Samples collected from two sediment core depths: 0-3 cm (surface)
    and 9-12 cm (subsurface).

    '
