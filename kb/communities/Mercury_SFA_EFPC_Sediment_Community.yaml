ecological_interactions:
- name: Chronic Mercury Selection of the EFPC Community
  description: 'Historical Hg release into East Fork Poplar Creek selected for a unique
    sediment community that includes many Hg-methylating organisms. Genome reconstruction
    from the same contaminated creek recovered MAGs with widespread metal-resistance
    functions and selenium-assimilatory metabolism, linking the local contamination
    regime to the community-scale functional repertoire.

    '
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
    notes: Divalent inorganic mercury driving chronic selection in EFPC sediment.
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  downstream:
  - target: Mercury Methylation by hgcAB+ Organisms
    description: The Hg-selected EFPC ecosystem includes many Hg methylators, making
      hgcAB-mediated methylmercury production one inferred consequence of chronic
      mercury selection.
  - target: Heavy Metal Resistance
    description: The same history of anthropogenic Hg contamination explains why nearly
      every MAG encoded putative heavy-metal resistance or ATPase efflux functions.
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The release of Hg into the EFPC ecosystem has selected for a unique microbial community that includes many Hg methylators
    explanation: Documents chronic Hg release as a selective force on the EFPC community
- name: Mercury Methylation by hgcAB+ Organisms
  description: 'Both bacterial and archaeal community members carry hgcA/hgcB genes enabling conversion
    of inorganic mercury (Hg(II)) to methylmercury (MeHg). Methanogenic archaea have been shown to methylate
    mercury at rates rivaling those of the better-known sulfate- and iron-reducing bacteria. This process
    is of major environmental concern as methylmercury bioaccumulates through aquatic food webs.

    '
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methylmercury
    term:
      id: CHEBI:49747
      label: methylmercury(1+)
    notes: Toxic organomercury compound produced by hgcAB+ organisms from inorganic mercury
  biological_processes:
  - preferred_term: mercury methylation
    term:
      id: GO:0042192
      label: methylmercury biosynthetic process
  evidence:
  - reference: PMID:29636434
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Methanogenesis has been linked to Hg methylation in several natural habitats where methylmercury
      production incurs risk to people and ecosystems

      '
    explanation: Documents the link between methanogenesis and mercury methylation
  - reference: PMID:29636434
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'methylation rates vary inherently among hgcAB+ methanogens but that several species are
      capable of MeHg production at rates that rival those of the better-know Hg-methylating sulfate-
      and iron-reducing bacteria

      '
    explanation: Documents mercury methylation rates by methanogenic archaea
- name: Heavy Metal Resistance
  description: '27 of 28 MAGs from EFPC sediment contained either putative heavy metal resistance genes
    or ATPase efflux pump genes, reflecting strong selective pressure from chronic mercury contamination
    in the creek. This widespread resistance enables community persistence in a heavily contaminated environment.

    '
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
    notes: Chronic EFPC contaminant linked to heavy metal resistance and efflux genes.
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 27 of the 28 MAGs (all except MAG 124, a Saccharimonadales bacterium from the Pastescibacteria phylum) contained either putative heavy metal resistance genes or ATPase efflux pump genes
    explanation: Documents near-universal heavy metal resistance in EFPC sediment community
- name: Selenium Assimilatory Metabolism
  description: '17 of 28 MAGs from EFPC sediment contained traits for selenium assimilatory metabolism,
    including MAGs from the candidate phyla Eisenbacteria and Rokubacteria, making
    this genome-resolved dataset the first report of selenium metabolism in those
    bacterial candidate phyla.

    '
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: selenium atom
    term:
      id: CHEBI:27568
      label: selenium atom
    notes: Element represented by Se-assimilatory metabolic traits in EFPC MAGs.
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 17 of the 28 MAGs contained traits for Se-assimilatory metabolism
    explanation: Documents selenium metabolism traits across EFPC sediment MAGs
environmental_factors:
- name: Mercury Contamination
  value: elevated
  description: 'East Fork Poplar Creek has been contaminated with mercury from upstream sources at the
    Y-12 National Security Complex, part of the Oak Ridge Reservation. This represents decades of chronic
    mercury contamination from historical weapons production.

    '
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'We sequenced two metagenomes of sediments from the East Fork Poplar Creek in the Oak Ridge
      Reservation (Oak Ridge, TN), a natural stream that has been contaminated with Hg from upstream sources,
      and we reconstructed 28 metagenome-assembled genomes of novel prokaryotic species

      '
    explanation: Documents mercury contamination in EFPC
- name: Sediment Depth
  value: 0-3 cm and 9-12 cm
  unit: cm
  description: 'Two sediment core sections were sampled for metagenomic analysis, representing surface
    (0-3 cm) and subsurface (9-12 cm) sediment layers with potentially different redox conditions and
    microbial community composition.

    '
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'We sequenced two metagenomes of sediments from the East Fork Poplar Creek in the Oak Ridge
      Reservation (Oak Ridge, TN), a natural stream that has been contaminated with Hg from upstream sources,
      and we reconstructed 28 metagenome-assembled genomes of novel prokaryotic species

      '
    explanation: Documents sediment sampling depths for EFPC metagenomics
