ecological_interactions:
- name: Chronic Mercury Contamination and EFPC Community Context
  description: Two depth sections of one EFPC sediment core yielded 28 MAGs from a chronically Hg-contaminated creek.
    The authors interpret the historical contamination as a selective context for the microbial community, drawing
    on prior EFPC work. This dataset is not a controlled Hg-selection experiment or an uncontaminated comparison.
    The seven canonical phylum-level entries are a subset of the sampled community, not seven isolates, all 28 MAGs
    or a complete functional roster.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
    notes: Inorganic Hg contamination context; the metagenomic dataset does not isolate divalent Hg as the sole
      cause of community composition.
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  downstream:
  - target: Putative Heavy Metal Resistance and Efflux Capacity
    description: HYPOTHESIZED - chronic metal exposure could favor organisms carrying resistance or efflux functions.
      The 27/28 MAG annotation result is consistent with that interpretation, but no matched uncontaminated community
      or experimental Hg perturbation isolates selection of these genes.
  evidence:
  - reference: PMID:33927032
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: The release of Hg into the EFPC ecosystem has selected for a unique microbial community that includes
      many Hg methylators
    explanation: Author interpretation and prior-study background for EFPC, not a controlled selection test in the
      two sampled metagenomes.
  participating_taxa:
