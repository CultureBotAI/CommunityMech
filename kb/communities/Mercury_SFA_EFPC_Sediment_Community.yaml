name: Mercury SFA East Fork Poplar Creek Sediment Community
description: >
  A sediment microbial community from East Fork Poplar Creek (EFPC) in Oak Ridge, Tennessee,
  contaminated with mercury from historical weapons production at the Y-12 National Security Complex.
  28 metagenome-assembled genomes (MAGs) were reconstructed from two sediment core sections (0-3 cm
  and 9-12 cm depth), with 27 representing novel prokaryotic species. 27 of 28 MAGs contained
  putative heavy metal resistance genes or ATPase efflux pump genes, reflecting strong selective
  pressure from chronic mercury contamination. 17 of 28 MAGs contained selenium assimilatory
  metabolism traits. The community includes both bacterial and archaeal members, with several
  lineages carrying hgcA/hgcB genes for mercury methylation, a process that converts inorganic
  mercury to the more bioavailable and toxic methylmercury. Methanogenic archaea in similar
  contaminated environments have been shown to methylate mercury at rates rivaling those of
  sulfate- and iron-reducing bacteria.
ecological_state: PERTURBED
community_origin: NATURAL
community_category: BIOREMEDIATION
environment_term:
  preferred_term: Mercury-contaminated creek sediment
  term:
    id: ENVO:00002007
    label: sediment
  notes: >
    Sediment from East Fork Poplar Creek, Oak Ridge Reservation, Oak Ridge, TN. The creek has been
    contaminated with mercury from upstream sources associated with historical weapons production at
    the Y-12 National Security Complex. Samples collected from two sediment core depths: 0-3 cm
    (surface) and 9-12 cm (subsurface).
