ecological_interactions:
- name: Mercury Methylation by hgcAB+ Organisms
  description: >
    Both bacterial and archaeal community members carry hgcA/hgcB genes enabling conversion of
    inorganic mercury (Hg(II)) to methylmercury (MeHg). Methanogenic archaea have been shown to
    methylate mercury at rates rivaling those of the better-known sulfate- and iron-reducing
    bacteria. This process is of major environmental concern as methylmercury bioaccumulates
    through aquatic food webs.
  interaction_type: COMMENSALISM
  metabolites:
  - preferred_term: methylmercury
    term:
      id: CHEBI:30785
      label: methylmercury(1+)
    notes: Toxic organomercury compound produced by hgcAB+ organisms from inorganic mercury
  biological_processes:
  - preferred_term: mercury methylation
    term:
      id: GO:0018636
      label: methylmercury biosynthetic process
  evidence:
  - reference: PMID:29636434
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Methanogenesis has been linked to Hg methylation in several natural habitats where
      methylmercury production incurs risk to people and ecosystems
    explanation: Documents the link between methanogenesis and mercury methylation
  - reference: PMID:29636434
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      methylation rates vary inherently among hgcAB+ methanogens but that several species are
      capable of MeHg production at rates that rival those of the better-know Hg-methylating
      sulfate- and iron-reducing bacteria
    explanation: Documents mercury methylation rates by methanogenic archaea
- name: Heavy Metal Resistance
  description: >
    27 of 28 MAGs from EFPC sediment contained either putative heavy metal resistance genes or
    ATPase efflux pump genes, reflecting strong selective pressure from chronic mercury
    contamination in the creek. This widespread resistance enables community persistence in a
    heavily contaminated environment.
  interaction_type: COMMENSALISM
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 27 of the 28 MAGs contained either putative heavy metal resistance genes or ATPase efflux pump genes
    explanation: Documents near-universal heavy metal resistance in EFPC sediment community
- name: Selenium Assimilatory Metabolism
  description: >
    17 of 28 MAGs from EFPC sediment contained traits for selenium assimilatory metabolism,
    suggesting an important role for selenium cycling in this mercury-contaminated environment.
    Selenium can interact with mercury biogeochemistry through formation of mercury-selenium
    complexes.
  interaction_type: COMMENSALISM
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 17 of the 28 MAGs contained traits for Se-assimilatory metabolism
    explanation: Documents selenium metabolism traits across EFPC sediment MAGs
environmental_factors:
- name: Mercury Contamination
  value: elevated
  description: >
    East Fork Poplar Creek has been contaminated with mercury from upstream sources at the Y-12
    National Security Complex, part of the Oak Ridge Reservation. This represents decades of
    chronic mercury contamination from historical weapons production.
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      We sequenced two metagenomes of sediments from the East Fork Poplar Creek in the Oak Ridge
      Reservation (Oak Ridge, TN), a natural stream that has been contaminated with Hg from upstream
      sources, and we reconstructed 28 metagenome-assembled genomes of novel prokaryotic species
    explanation: Documents mercury contamination in EFPC
- name: Sediment Depth
  value: 0-3 cm and 9-12 cm
  unit: cm
  description: >
    Two sediment core sections were sampled for metagenomic analysis, representing surface (0-3 cm)
    and subsurface (9-12 cm) sediment layers with potentially different redox conditions and
    microbial community composition.
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      We sequenced two metagenomes of sediments from the East Fork Poplar Creek in the Oak Ridge
      Reservation (Oak Ridge, TN), a natural stream that has been contaminated with Hg from upstream
      sources, and we reconstructed 28 metagenome-assembled genomes of novel prokaryotic species
    explanation: Documents sediment sampling depths for EFPC metagenomics
