- name: EFPC Mercury Methylation Potential
  description: The EFPC announcement describes a creek community that includes Hg methylators, citing prior EFPC
    research. This supports environmental methylation potential, not measured hgcAB carriage or methylmercury production
    by the 28 reconstructed MAGs or the seven canonical phylum entries. The separate methanogen culture study demonstrates
    positive methylation in eight of nine tested strains, but those cultures are not the sampled EFPC community.
    Exact carriers and methylation flux in these sediment samples remain unresolved.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methylmercury
    term:
      id: CHEBI:49747
      label: methylmercury(1+)
    notes: Potential environmental product; not measured methylmercury flux or a phenotype assigned to the recorded
      EFPC MAGs.
  biological_processes:
  - preferred_term: mercury methylation
    term:
      id: GO:0042192
      label: methylmercury biosynthetic process
    notes: Environmental potential from prior-study background, not a measured process for the recorded MAGs.
  evidence:
  - reference: PMID:33927032
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: The release of Hg into the EFPC ecosystem has selected for a unique microbial community that includes
      many Hg methylators
    explanation: EFPC background supports potential methylation, not a demonstrated function in the reconstructed
      MAGs. External methanogen culture evidence is kept in the discussion and must not be assigned to these taxa.
- name: Putative Heavy Metal Resistance and Efflux Capacity
  description: Annotation found putative heavy-metal resistance genes or ATPase efflux-pump genes in 27 of 28 EFPC
    MAGs; MAG124 was the exception. This is genomic capacity consistent with a contaminated habitat, not measured
    transcription, efflux, Hg-specific resistance, or a persistence advantage. The phylum-level participants identify
    a sampled subset, not uniform resistance of every organism in each phylum.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
    notes: Chronic EFPC contaminant linked to heavy metal resistance and efflux genes.
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 27 of the 28 MAGs (all except MAG 124, a Saccharimonadales bacterium from the Pastescibacteria phylum)
      contained either putative heavy metal resistance genes or ATPase efflux pump genes
    explanation: Supports the reported 27/28 genomic annotation result, not measured resistance or causally isolated
      selection.
  participating_taxa:
