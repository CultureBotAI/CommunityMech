id: CommunityMech:000044
name: Mercury SFA East Fork Poplar Creek Sediment Community
description: >
  A sediment microbial community from East Fork Poplar Creek (EFPC) in
  Oak Ridge, Tennessee, contaminated with mercury from historical weapons
  production at the Y-12 National Security Complex. Twenty-eight
  metagenome-assembled genomes were reconstructed from two sediment core
  sections at 0-3 cm and 9-12 cm depth, and most encoded putative heavy-metal
  resistance or ATPase efflux functions.
