discussions:
- discussion_id: efpc_exact_sample_methylation_and_genomic_capacity
  prompt: Which EFPC organisms perform the predicted functions in the sampled sediments?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Chronic Mercury Contamination and EFPC Community Context
  - ecological_interactions#EFPC Mercury Methylation Potential
  - ecological_interactions#Putative Heavy Metal Resistance and Efflux Capacity
  - ecological_interactions#Selenium Assimilatory Genomic Capacity
  rationale: 'PMID:33927032 is a genome announcement, not a methylation or resistance assay. PMID:29636434 tested
    separate methanogen cultures: eight of nine exceeded matched fresh/spent-medium controls, the fused-hgcAB M.
    methylutens did not, and thiol/sulfide responses varied with growth and chemistry. Preserve those positive external
    results without assigning them to EFPC MAGs. Full primary main texts and the EFPC MAG table were read; supplements,
    raw genomes and original images were not audited. The selection-to-methylation arrow is removed; selection-to-resistance
    remains hypothetical. #1596 repairs the graph; non-graph imported methylation/sulfide claims and incomplete
    roster remain #1600. No new nodes or arrows.'
  posed_by: codex
  posed_date: '2026-10-06'
