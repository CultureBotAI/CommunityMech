- name: Selenium Assimilatory Genomic Capacity
  description: Se-assimilatory traits were annotated in 17 of 28 EFPC MAGs, including Eisenbacteria and Rokubacteria.
    This preserves the reported genomic finding, not measured selenium uptake, expression, flux or niche partitioning.
    The explicit Eisenbacteria participant is the corresponding canonical subset; Rokubacteria is named by the source
    but is not a separately grounded taxon in this record. Selenium assimilation is not established as a cause of
    Hg resistance or methylation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: selenium atom
    term:
      id: CHEBI:27568
      label: selenium atom
    notes: Element represented by Se-assimilatory metabolic traits in EFPC MAGs.
  evidence:
  - reference: PMID:33927032
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 17 of the 28 MAGs contained traits for Se-assimilatory metabolism
    explanation: Supports annotated Se-assimilatory capacity, not an experimentally measured selenium transformation.
  participating_taxa:
  - preferred_term: Eisenbacteria
    term:
      id: NCBITaxon:1817801
      label: Candidatus Eiseniibacteriota
