id: CommunityMech:000200
name: Dehalococcoides-Desulfovibrio-Pelosinus Corrinoid Triculture
description: >
  A defined anaerobic three-member dechlorinating consortium containing
  Dehalococcoides mccartyi strain 195, Desulfovibrio vulgaris Hildenborough,
  and Pelosinus fermentans R7. In cobalamin-free, TCE- and lactate-amended
  medium supplemented with the lower ligand DMB, DvH supplies hydrogen while
  PfR7 supplies corrinoids that Dhc195 salvages and remodels into cobalamin.
  The triculture is relevant to DOE subsurface bioremediation because it
  identifies separable hydrogen-transfer and corrinoid-transfer mechanisms that
  support organohalide respiration in chlorinated-solvent dechlorinating
  communities.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Test whether a simplified lactate-fermenting consortium can support
    sustainable D. mccartyi strain 195 dechlorination without exogenous
    cobalamin by separating hydrogen and corrinoid provisioning across partners.
  assembly_strategy: Combine Dhc195 with DvH as a hydrogen-supplying fermenter
    and PfR7 as a corrinoid-supplying fermenter in defined anaerobic medium.
  perturbation_design: Compare Dhc195/DvH, Dhc195/PfR7, and Dhc195/DvH/PfR7
    consortia under cobalamin-free, DMB-supplemented, lactate-fed, and
    TCE-amended conditions.
  measurement_endpoints:
  - TCE dechlorination
  - Dhc195 cell growth
  - Hydrogen production
  - Organic acid concentrations
  - Corrinoid identity
  - Dhc195 transcriptomic response
  evidence:
  - reference: PMID:24463969
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: with both in tricultures
    explanation: Supports the three-member Dhc195/DvH/PfR7 consortium design.
  - reference: PMID:24463969
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: without exogenous cobalamin
    explanation: Supports the cobalamin-free experimental design.
