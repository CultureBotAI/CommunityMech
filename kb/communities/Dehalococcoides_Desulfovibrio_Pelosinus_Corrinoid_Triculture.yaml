- preferred_term: dihydrogen
  chebi_term:
    id: CHEBI:18276
    label: dihydrogen
  relevance: >
    Hydrogen is the electron donor that DvH supplies to Dhc195 to drive
    reductive dechlorination in the triculture.
  evidence:
  - reference: PMID:24463969
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DvH provided hydrogen
    explanation: Names hydrogen as the metabolite transferred from DvH to Dhc195.
- preferred_term: cobalamin
  chebi_term:
    id: CHEBI:30411
    label: cobalamin
  relevance: >
    Cobalamin is the corrinoid cofactor required by Dhc195 reductive
    dehalogenases; Dhc195 remodels PfR7-produced corrinoids into cobalamin
    when no exogenous cobalamin is supplied.
  evidence:
  - reference: PMID:24463969
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: remodeled the phenolic corrinoids produced by PfR7 into cobalamin
    explanation: Names cobalamin as the corrinoid form produced by Dhc195 remodeling.
- preferred_term: 5,6-dimethylbenzimidazole
  chebi_term:
    id: CHEBI:15890
    label: 5,6-dimethylbenzimidazole
  relevance: >
    DMB is the lower ligand of cobalamin supplied to the triculture, enabling
    Dhc195 to remodel PfR7 corrinoids into functional cobalamin.
  evidence:
  - reference: PMID:24463969
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 5,6-dimethylbenzimidazole (DMB), the lower ligand of cobalamin
    explanation: Names DMB as the supplied lower ligand of cobalamin.
