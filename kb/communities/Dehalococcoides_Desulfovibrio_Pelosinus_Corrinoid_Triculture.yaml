      gene-necessity experiment or direct transporter activity measurement.
- name: Hydrogen- and Corrinoid-Supported TCE Dechlorination
  description: The three-member lactate-fed consortium sustains TCE dechlorination and Dhc195 growth without exogenous
    cobalamin when DMB is supplied. DvH provides hydrogen and PfR7 corrinoids, with Dhc195 remodeling contributing
