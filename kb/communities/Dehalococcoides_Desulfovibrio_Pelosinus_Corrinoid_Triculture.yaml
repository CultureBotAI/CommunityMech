    evidence_source: IN_VITRO
    snippet: trichloroethene (TCE)- and lactate-amended medium
    explanation: Supports lactate and TCE as the donor and acceptor context for the triculture.
- name: Corrinoid Provision By Pelosinus
  description: PfR7 supplies corrinoids to Dhc195 in the DMB-amended, cobalamin-free triculture. These include precursors
    for recipient remodeling; PfR7 can also form some cobalamin when supplied DMB. DMB is an external amendment,
    not a demonstrated PfR7 product, and recipient remodeling is not the only possible functional-cofactor route.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
