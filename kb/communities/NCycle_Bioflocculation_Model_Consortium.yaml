ecological_interactions:
- name: Alginate-Entrapped Nitrifier Microcolony Formation
  description: Alginate entrapment during oxic/anoxic reactor cycles produced stable nitrifier microcolonies, mostly
    composed of one species. Microcolonies persisted after alginate dissolution with retained N-cycle activity.
    The artificial retention matrix is not itself a demonstrated interspecies colonization-facilitation interaction.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Nitrifier-Denitrifier Macrocluster Formation
    description: Released nitrifier microcolonies provided building blocks incorporated into mixed denitrifier macroclusters
      after centrifugation and resuspension in calcium-rich HEPES-buffered medium. Release alone did not yield these
      macroclusters. PARTIAL - Calcium bridging is proposed; its contribution was not fully decoupled from centrifugation.
  evidence:
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strong nitrifier microcolonies were formed during oxic/anoxic cycles in sequencing batch reactors,
      using alginate entrapment as a cell retention system.
    explanation: Supports the aggregate-formation process in the defined N-cycle consortium under sequencing-batch-reactor
      cultivation.
- name: Nitrifier-Denitrifier Macrocluster Formation
  description: Mixed macroclusters containing nitrifier colonies and Azoarcus flocs appeared after centrifugation
    at 3000 g for 10 min and resuspension in calcium-rich HEPES-buffered medium, persisting for about 10 days under
    aerobic stirring. Release alone did not generate these structures. FISH preparation caused separate artefactual
    aggregation; the later suspended macroclusters were a real positive result. Calcium and centrifugation effects
    were not fully decoupled.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After the release of these aggregates into suspension, macroclusters with flocs of the denitrifier
      were observed
    explanation: Abstract supports the observed endpoint; complete main-body Methods and Results qualify it by centrifugation
      plus calcium-rich resuspension, not release alone.
- name: Bottom-Up Activated Sludge Floc Model
  description: The nitrifier-microcolony/denitrifier-floc assembly provides a reduced bottom-up proof-of-concept
    model of activated-sludge flocs. It retains N-cycle function, but its use as a model is an interpretation of
    the same assembly, not a separate downstream biological event or proof of full-scale performance. The authors
    recommend operation that separates medium exchange from centrifugation when testing calcium effects.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a living model of a full-scale activated sludge floc can be built through the use of this bottom-up
      approach
    explanation: Supports the proposed model utility, not a separate causal stage or demonstrated equivalence to
      full-scale flocs.
