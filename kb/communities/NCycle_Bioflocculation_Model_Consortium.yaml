discussions:
- discussion_id: floc_calcium_centrifugation_and_imaging
  prompt: Which observations distinguish activity and causal mediation from inferred potential?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-07'
  rationale: Preserve stable nitrifier microcolonies, real mixed macroclusters and retained nitrogen cycling. Separate
