id: CommunityMech:000126
name: N-Cycle Bioflocculation Model Consortium
description: A reduced-complexity N-cycle model consortium of nitrifiers and denitrifiers used to study
  bioflocculation mechanisms in biological wastewater treatment.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Build a reduced-complexity living model of activated sludge flocculation.
  assembly_strategy: Nitrifying bacteria were entrapped to form microcolonies and then released with denitrifier
    flocs to form macroclusters.
  perturbation_design: Oxic/anoxic sequencing batch reactor cycles and alginate entrapment were used to
    control aggregation.
  measurement_endpoints:
  - microcolony formation
  - macrocluster formation
  - bioflocculation
  - FISH aggregation readouts
  evidence:
  - &id001
    reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that it is feasible to exploit a model (N-cycle) consortium with reduced complexity
      to fundamentally study bioflocculation.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: activated sludge floc model
  term:
    id: ENVO:00002046
    label: activated sludge
  notes: Model consortium designed to emulate aggregation in biological wastewater treatment.
taxonomy:
- taxon_term:
    preferred_term: N-cycle bacterial consortium members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: NO_GTDB_EQUIVALENT
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Nitrifier-Denitrifier Aggregate Formation
  description: Nitrifier microcolonies and denitrifier flocs formed larger aggregate structures under
    reactor cycling.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
related_ingredients:
- preferred_term: alginate
  chebi_term:
    id: CHEBI:58187
    label: alginate
  relevance: >
    Alginate was used as the entrapment / cell-retention matrix that promoted
    strong nitrifier microcolony formation, a key step in building the
    bioflocculation model consortium.
  evidence:
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Alginate entrapment leads to strong microcolony formation of nitrifiers
    explanation: Names alginate entrapment as the driver of nitrifier microcolony formation.
environmental_factors:
- name: oxic/anoxic sequencing batch reactor cycling
  value: Oxic/anoxic cycles and alginate entrapment were used to produce nitrifier microcolonies and mixed
    aggregates.
  description: Oxic/anoxic sequencing batch reactor cycles and alginate entrapment were used to control
    aggregation.
  evidence:
  - *id001
growth_media:
- name: HEPES-buffered N-cycle coculture medium
  temperature: '28'
  temperature_unit: °C
  light_regime: dark
  inoculum_source: nitrifier (AOB/NOB) precultures and denitrifier
  preparation_notes: Precultures shaken in the dark in phosphate-buffered coculture
    medium with ammonium and nitrite; carbonate added and yeast extract omitted to
    promote autotrophic growth; alginate entrapment used as a cell retention system.
  evidence:
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Precultures of AOB and NOB were shaken at 28 °C (in the dark) in a phosphate-buffered
      coculture medium with ammonium and nitrite
    explanation: Names the coculture medium, preculture temperature (28 °C) and dark incubation.
cultivation_setup:
- cultivation_mode: SEQUENCING_BATCH
  system_type: BIOREACTOR_UNSPECIFIED
  operating_temperature: 28.0
  operating_temperature_unit: °C
  notes: Sequencing batch reactor run in oxic/anoxic cycles with alginate-bead entrapment
    as cell retention; 1 vvm air sparged during the oxic phase.
  evidence:
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For experiments with entrapped biomass, the reactors were operated at 28 °C
      with HEPES-buffered medium.
    explanation: States the reactor operating temperature and medium for the SBR cultivation.
  - reference: PMID:40536564
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strong nitrifier microcolonies were formed during oxic/anoxic cycles in sequencing
      batch reactors, using alginate entrapment as a cell retention system.
    explanation: Establishes the sequencing-batch-reactor cultivation mode with alginate entrapment.
