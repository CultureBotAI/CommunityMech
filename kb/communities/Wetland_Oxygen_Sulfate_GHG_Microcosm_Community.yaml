id: CommunityMech:000255
name: Wetland Oxygen-Sulfate Greenhouse Gas Microcosm Community
description: >
  Freshwater wetland soil microbial microcosms incubated under anoxic
  non-sulfate, anoxic sulfate-addition, oxic non-sulfate, and oxic
  sulfate-addition conditions to resolve how climate-linked oxygen and sulfate
  exposures alter methane and carbon dioxide emissions. The study integrated
  geochemical measurements, proteogenomics, metaproteomics, and stoichiometric
  modeling to identify altered microbial guilds and metabolic processes driving
  CH4 and CO2 emissions. Sulfate exposure reduced methane production, oxygen
  shifted greenhouse gas emissions from CH4 toward CO2, and the combined
  exposure resembled oxygen exposure alone.
