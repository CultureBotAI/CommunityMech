discussions:
- discussion_id: pavin_genomic_potential_and_depth_covariation
  prompt: Which depth-associated capacities are expressed and mediate carbon flux?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Depth-Associated Carbon Metabolic Potential
  - ecological_interactions#Spatial Separation Of Methane-Cycle Genetic Potential
  - ecological_interactions#CPR And DPANN RuBisCO-Associated CO2 Incorporation Potential
  rationale: 'Drop both common-gradient arrows: co-varying genomic distributions do not establish carbon fixation
    as a cause of methane-cycle separation or CPR/DPANN RuBisCO distributions. Retain all three positive observations
    as potential. The 738 genomes cover only part of the community; nondetection and incomplete genomes cannot establish
    pathway absence. Oxygen, light and other geochemistry co-vary. CPR repertoires are weakly differentiated by
    depth, with host selection proposed. Canonical participants are incomplete: Archaea represents only the listed
    archaeal component, not all carbon-fixing bacteria or methane oxidizers. #1553 tracks roles and missing taxonomy/non-graph
    evidence. Main text/captions read, not raw genomes, separate supplements or figure pixels.'
  posed_by: codex
  posed_date: '2026-10-06'
