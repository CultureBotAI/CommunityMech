ecological_interactions:
- name: Depth-Associated Carbon Metabolic Potential
  description: Genome-resolved metagenomics associates Calvin-cycle potential with shallower lake zones and Wood-Ljungdahl/reverse-TCA
    potential with anoxic water and sediments. PARTIAL - depth and oxygen co-vary with light and other geochemistry;
    this is genetic potential, not measured carbon-fixation flux or an isolated oxygen effect. The listed Archaea
    participant represents only the canonical archaeal component; most non-CPR bacterial lineages in this analysis
    are absent from the record roster.
  scope: COMMUNITY_LEVEL
  metabolites:
