- name: Spatial Separation Of Methane-Cycle Genetic Potential
  description: Methane-monooxygenase genetic potential is concentrated near the lake interface, with low-abundance
    occurrences in anoxic water, whereas mcr genes are mainly sediment-associated and also occur in the anoxic zone.
    This is largely separated potential, not strictly exclusive compartments or measured methane flux. Genome recovery
    is incomplete, so nondetection is not proof of absence. The listed sediment-methanogen aggregate does not resolve
    the missing bacterial methane oxidizers.
  scope: COMMUNITY_LEVEL
  metabolites:
