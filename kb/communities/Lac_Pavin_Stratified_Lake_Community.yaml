    snippet: enrichment of distinct C1 and CO2 fixation pathways in the oxic lake interface and anoxic zone/sediments
    explanation: Supports depth-associated genome-derived potential; no expression, rate or selective causal perturbation
      is measured.
  participating_taxa:
