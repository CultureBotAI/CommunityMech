ecological_interactions:
- name: Substrate-Dependent Infant Community Interaction Responses
  description: 'The primary preprint compares donor-derived infant fermentations with a separate six-species SynCom
    containing B. breve, B. infantis, P. vulgatus, E. coli, L. gasseri and R. gnavus. Substrate perturbations and
    semipermeable binary cultures show growth responses and substrate-dependent interactions, including relief of
    P. vulgatus inhibition with 2FL. Donor communities instead contain P. dorei and L. rhamnosus in the corresponding
    comparisons; abundance correlations there are not the same intervention. The four canonical entries are a cross-experiment
    subset, not a four-member assayed SynCom or a complete roster. Exact strains and missing members remain unresolved
    under #1514.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.64898/2026.05.29.728681
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mechanistic dissection using SynCom revealed extensive cross-feeding networks and substrate-dependent
      interaction rewiring
    explanation: Supports positive substrate-dependent interaction responses; the inspected main text distinguishes
      defined-culture perturbations from donor-community comparisons.
  participating_taxa:
  - preferred_term: Bifidobacterium spp.
    term:
      id: NCBITaxon:1678
      label: Bifidobacterium
  - preferred_term: Bacteroides/Phocaeicola spp.
    term:
      id: NCBITaxon:816
      label: Bacteroides
  - preferred_term: Phocaeicola vulgatus
    term:
      id: NCBITaxon:821
      label: Phocaeicola vulgatus
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  downstream:
  - target: Species-Specific Lactate and Acetate Inhibition
    description: PARTIAL - substrate-dependent fermentation can supply lactate whose accumulation may suppress susceptible
      members. Community metabolite profiles, binary growth responses and separate acid challenges support this
      route, but selective lactate depletion/rescue was not demonstrated in the inspected complete-community experiments;
      pH and other products can also contribute.
- name: Phocaeicola Omission Alters Community Metabolism and Ecoli Activity
  description: Omitting P. vulgatus from the defined community changes succinate/propionate output and E. coli metabolic
    activity. Heavy-water Raman-FISH measurements under GOS found higher E. coli activity with P. vulgatus present,
    without an abundance change in that assay. This is positive community-context intervention evidence, not proof
    of direct two-member succinate or propionate transfer to E. coli. Growth in P. vulgatus-conditioned supernatants
    did not differ between GOS and glucose, leaving timing and other partners relevant. The listed taxa identify
    the omitted member and measured responder, not the whole tested community or universal abundance invariance.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: succinate
    term:
      id: CHEBI:26806
      label: succinate
    notes: Measured community output associated with P. vulgatus omission; not a demonstrated molecule transferred
      directly to E. coli.
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
    notes: Measured community output associated with P. vulgatus omission; not a demonstrated molecule transferred
      directly to E. coli.
  evidence:
  - reference: doi:10.64898/2026.05.29.728681
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: disproportionately shaped succinate and propionate production and altered  Escherichia coli metabolic
      activity without affecting its abundance
    explanation: Supports the positive community-context output/activity effects, not direct pairwise transfer or
      an unchanged abundance under every condition.
  - reference: doi:10.64898/2026.05.29.728681
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly higher activity when P. vulgatus was present
    explanation: 'Primary Results, Figure 3I context: E. coli activity under GOS is higher with the member present,
      not absent.'
  participating_taxa:
  - preferred_term: Phocaeicola vulgatus
    term:
      id: NCBITaxon:821
      label: Phocaeicola vulgatus
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
- name: Species-Specific Lactate and Acetate Inhibition
  description: 'The preprint reports stronger inhibition of P. vulgatus and R. gnavus by lactate than acetate at
    comparable concentrations, with E. coli less affected. P. vulgatus was also inhibited at pH 5, and the authors
    discuss additive effects of pH and acid identity. Preserve these positive challenge results without claiming
    a universally pH-independent mechanism or an inspected pH-clamped protocol: the exact acid-challenge protocol
    is not in the main Methods and the external supplement was not obtained. The canonical P. vulgatus and E. coli
    entries are the represented comparison subset; R. gnavus remains missing under #1514.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
    notes: Assayed inhibitory fermentation product; selective removal/rescue in the complete community was not established
      by the inspected main text.
  evidence:
  - reference: doi:10.64898/2026.05.29.728681
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: stronger by lactate than acetate at comparable concentrations
    explanation: Primary Results retain the acid-identity challenge effect and species dependence, not an independently
      verified pH-clamped mechanism.
  participating_taxa:
  - preferred_term: Phocaeicola vulgatus
    term:
      id: NCBITaxon:821
      label: Phocaeicola vulgatus
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
