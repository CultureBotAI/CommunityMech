id: CommunityMech:000281
name: Infant-gut Prebiotic-response SynCom
description: A defined synthetic microbial community (SynCom) modeling the early-life (infant) gut,
  studied alongside donor-derived infant faecal fermentations to dissect how prebiotic substrates
  reshape microbial and metabolic responses. Human milk oligosaccharides (HMOs) and
  galacto-oligosaccharides (GOS) robustly promote bifidobacterial expansion, while Bacteroides/Phocaeicola
  species are modulated in a feeding-mode- and substrate-dependent manner. The SynCom reveals extensive
  cross-feeding networks and substrate-dependent interaction rewiring, with Phocaeicola vulgatus acting
  as a context-dependent ecological hub that disproportionately shapes succinate and propionate production
  and alters Escherichia coli metabolic activity. Competitive outcomes are driven not only by acidification
  but by the chemical identity of fermentation products, with lactate exerting species-specific inhibition
  independent of bulk pH.
