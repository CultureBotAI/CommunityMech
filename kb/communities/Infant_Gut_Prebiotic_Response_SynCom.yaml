  prompt: Which exact members and metabolites mediate the substrate-dependent responses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Substrate-Dependent Infant Community Interaction Responses
  - ecological_interactions#Phocaeicola Omission Alters Community Metabolism and Ecoli Activity
  - ecological_interactions#Species-Specific Lactate and Acetate Inhibition
  rationale: 'Remove the network-overview-to-hub arrow, which describes identification of a component rather than
    a causal mechanism. Preserve the positive P. vulgatus omission result, with higher E. coli activity when present
    under GOS, and the separate acid challenge. Retain fermentation-to-inhibition only as PARTIAL. #1514 tracks
    the exact six-member roster, R. gnavus-dependent 2FL availability and missing ex-vivo mouse-colon outcome representation.
    Full/P. vulgatus-omitted supernatants both suppress motility; matched SCFAs do not reproduce it and PEA was
    below detection in SynCom. These do not prove infant in-vivo physiology or endogenous PEA mediation. Full version-1
    primary main text, Methods and embedded figure captions read; external supplement, exact strain sheet, raw data,
    code and figure pixels not inspected. One-community Edison dry run only; no paid report or new graph structure.
    Non-graph pH/roster claims remain outside this repair.'
