  description: Constructed functional consortia combining generalist non-obligate organochlorine-degrading bacteria (including
    Enterococcus casseliflavus, Sulfurospirillum multivorans, Trichlorobacter lovleyi, and Petrimonas sulfuriphila) with Dehalococcoides
    mccartyi and enriched pceA reductive dehalogenase genes cooperatively degrade gamma-hexachlorocyclohexane (lindane) in
    anoxic wetland sediment microcosms.
