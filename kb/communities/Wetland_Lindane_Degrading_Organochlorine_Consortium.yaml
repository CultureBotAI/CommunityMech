  - SYNTROPHIC_PARTNER
  evidence:
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, Enterococcus avium ATCC 14025 shared an ANI of 98.03 with PseS3 and 98.21 with bin161. Enterococcus
      thailandicus DSM 21767 exhibited an ANI of 99.35 with R1, 99.31 with R3, and 99.35 with bin381. Similarly, Enterococcus
      casseliflavus ATCC 49996 shared an ANI of 98.24 with R12 and 98.24 with bin436.
    explanation: >-
      The ANI comparison separately identifies isolate R12 and sediment MAG bin436 as E. casseliflavus
      relative to ATCC 49996 (98.24% each). It assigns PseS3 to E. avium and R1/R3 to E. thailandicus. Species
      correspondence does not establish that R12 and bin436 are the same physical strain or genome.
