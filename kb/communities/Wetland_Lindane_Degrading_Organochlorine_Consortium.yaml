id: CommunityMech:000471
name: Wetland Lindane-Degrading Organochlorine Bacterial Consortium
description: Functional anaerobic organochlorine-degrading bacterial consortia (top-down consortium M and bottom-up consortium
  Y13) constructed around generalist non-obligate organochlorine-degrading Enterococcus strains (Enterococcus casseliflavus
  PseS3, R1, R3, R12) alongside organohalide-respiring and fermentative partners (Sulfurospirillum multivorans, Trichlorobacter
  lovleyi, Dehalococcoides mccartyi, and Petrimonas sulfuriphila) for gamma-hexachlorocyclohexane (lindane) bioremediation
  in coastal wetland sediment microcosms while suppressing CO2-reduction methanogenesis.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
