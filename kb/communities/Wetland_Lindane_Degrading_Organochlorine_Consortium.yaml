    description: 'DIRECTLY IMPLIED: Bioaugmentation with the organochlorine-degrading consortia redirects electron flow toward
      reductive dechlorination and suppresses CO2-reduction methanogenesis.'
  evidence:
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both consortia demonstrated efficient degradation in sediment microcosms, reducing γ-HCH (C/C₀) to 63.0% (M)
      and 56.1% (Y13).
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Simultaneously, functional microbial consortia inoculation significantly suppressed the CO₂ reduction methanogenesis
      pathway compared with the non-inoculated group (P < 0.05), as evidenced by a marked decline in the CH₄/CO₂ ratio in
      inoculated groups.
