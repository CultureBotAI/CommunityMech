id: CommunityMech:000471
name: Wetland Lindane-Degrading Organochlorine Bacterial Consortium
description: >-
  Two anaerobic lindane bioaugmentation treatments in coastal wetland sediment: top-down sediment enrichment
  Y13 and bottom-up consortium M. M was assembled from Dehalococcoides mccartyi, Geobacter lovleyi
  (represented here as Trichlorobacter lovleyi), Sulfurospirillum multivorans, Petrimonas sulfuriphila PET and
  seven isolated gamma-HCH degraders. The five retained taxonomy entries are a partial representation, not a
  complete shared roster of M and Y13. The Enterococcus casseliflavus entry corresponds to isolate R12; PseS3
  is E. avium and R1/R3 are E. thailandicus. Intended inoculum membership does not establish revival or
  endpoint colonization of every stock. The ecological interaction graph retains separate unresolved mechanism
  limitations.
