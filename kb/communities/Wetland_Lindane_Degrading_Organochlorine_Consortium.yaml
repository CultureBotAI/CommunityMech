discussions:
- discussion_id: wetland-m-y13-stock-and-roster-boundaries
  prompt: Complete the separate M and Y13 membership descriptions without equating inoculated stocks with sediment
    MAGs or endpoint establishment.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - taxonomy
  - description
  rationale: Methods identify Y13 as the thirteenth sediment-enrichment transfer and M as a bottom-up mixture of
    four named partner taxa plus seven isolated degraders. The five current entries therefore represent selected
    taxa rather than a complete common roster. R12 and bin436 share a species-level ANI assignment but remain an
    isolate and a sediment MAG, respectively. Bulk revival measurements cannot establish viability of every initial
    stock.
  evidence:
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: full_text
    snippet: The “top-down” strategy yielded microbial community Y13.
    explanation: Methods assigns the top-down treatment to Y13.
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: full_text
    snippet: The bottom-up synthetic consortium (M) was rationally constructed following function-based SynCom (synthetic
      community) design strategies ( 17 , 21 ).
    explanation: Methods assigns the bottom-up treatment to M.
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: full_text
    snippet: The consortium comprised the obligate organohalide-respiring bacterium Dehalococcoides mccartyi , supported
      by the corrinoid-provisioning strains Geobacter lovleyi and Sulfurospirillum multivorans ( 9 , 18 ), the fermentative
      supplier Petrimonas sulfuriphila PET ( 22 ), and seven isolated γ-HCH-degrading strains, several of which
      harbor cobalamin synthesis genes ( 23 ).
    explanation: The reported M composition exceeds the five retained taxonomy entries; no full Table S1 inventory
      is reconstructed here.
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: full_text
    snippet: Specifically, Enterococcus avium ATCC 14025 shared an ANI of 98.03 with PseS3 and 98.21 with bin161.
      Enterococcus thailandicus DSM 21767 exhibited an ANI of 99.35 with R1, 99.31 with R3, and 99.35 with bin381.
      Similarly, Enterococcus casseliflavus ATCC 49996 shared an ANI of 98.24 with R12 and 98.24 with bin436.
    explanation: The ANI paragraph distinguishes three Enterococcus species and separates isolate names from MAG
      identifiers.
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: full_text
    snippet: Additionally, it should be noted that the initial consortium was constructed by directly mixing glycerol
      stocks of individual strains without prior revival and verification of each strain’s viability. The OD 600
      data reported here reflect the overall growth of the enrichment culture and do not confirm that all component
      strains were equally revived.
    explanation: The authors explicitly limit stock-specific revival inference from bulk OD measurements.
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: full_text
    snippet: To further investigate the genomic characteristics of Enterococcus spp., the Enterococcus MAGs (bin161,
      bin381, and bin436) assembled in this study were compared with whole genomes of Enterococcus spp., including
      PseS3, R1, R3, R12, and standard strains such as Enterococcus avium ATCC 14025, Enterococcus thailandicus
      DSM 21767, and Enterococcus casseliflavus ATCC 49996, which were obtained from NCBI.
    explanation: The comparison treats assembled sediment MAGs and isolate whole genomes as distinct inputs.
  posed_by: Codex
  posed_date: '2026-11-15'
