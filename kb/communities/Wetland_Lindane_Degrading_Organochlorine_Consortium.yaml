    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, Enterococcus avium ATCC 14025 shared an ANI of 98.03 with PseS3 and 98.21 with bin161. Enterococcus
      thailandicus DSM 21767 exhibited an ANI of 99.35 with R1, 99.31 with R3, and 99.35 with bin381. Similarly, Enterococcus
      casseliflavus ATCC 49996 shared an ANI of 98.24 with R12 and 98.24 with bin436.
    explanation: Identifies Enterococcus casseliflavus (strain R12 / bin436, 98.24% ANI to ATCC 49996) alongside E. avium
      and E. thailandicus as the isolated non-obligate organochlorine-degrading Enterococcus strains in the consortium.
