    gtdb_candidates:
    - GTDB:s__Enterococcus_D_casseliflavus
    - GTDB:s__Enterococcus_D_casseliflavus_A
    notes: >-
      The source ANI comparison identifies isolate R12 as Enterococcus casseliflavus (98.24% ANI to ATCC
      49996). Sediment MAG bin436 has the same reported ANI to that reference but is a separate metagenomic
      reconstruction, not the R12 isolate. PseS3 is E. avium and R1/R3 are E. thailandicus; these other
      isolates must not be grouped under this E. casseliflavus descriptor. The current five-entry taxonomy is
      incomplete for consortium M and does not define a complete Y13 roster.
  abundance_level: DOMINANT
