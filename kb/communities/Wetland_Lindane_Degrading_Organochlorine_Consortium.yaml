      label: Sulfurospirillum multivorans
    notes: Organohalide-respiring bacterium harboring pceA reductive dehalogenase in the functional consortium.
    gtdb_grounding_status: UNRESOLVED
  abundance_level: COMMON
  functional_role:
  - PRIMARY_DEGRADER
  - SYNTROPHIC_PARTNER
  evidence:
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium comprised the obligate organohalide-respiring bacterium Dehalococcoides mccartyi , supported by
      the corrinoid-provisioning strains Geobacter lovleyi and Sulfurospirillum multivorans ( 9 , 18 ), the fermentative supplier
      Petrimonas sulfuriphila PET ( 22 ), and seven isolated γ-HCH-degrading strains, several of which harbor cobalamin synthesis
      genes ( 23 ).
    explanation: Explicitly names Dehalococcoides mccartyi, Geobacter lovleyi (Trichlorobacter lovleyi), Sulfurospirillum
      multivorans, and Petrimonas sulfuriphila PET as the core members of the bottom-up γ-HCH-degrading consortium.
