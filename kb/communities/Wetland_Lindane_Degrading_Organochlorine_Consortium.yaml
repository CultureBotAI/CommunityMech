    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The well-known degradation gene pceA was enriched in the Y13 group, and the co-localization of pceA-encoding
      contigs with mobile genetic elements was identified.
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, Enterococcus was found to have successfully colonized inoculated groups. It has strong environmental
      evolutionary adaptability and might acquire organochlorine-degrading genes through horizontal gene transfer under pollution
      stress.
