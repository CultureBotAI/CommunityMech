      label: Enterococcus casseliflavus
    notes: Generalist non-obligate organochlorine-degrading Enterococcus (strains PseS3, R1, R3, R12) that colonizes sediment
      microcosms and degrades gamma-HCH.
    gtdb_grounding_status: UNRESOLVED
  abundance_level: DOMINANT
