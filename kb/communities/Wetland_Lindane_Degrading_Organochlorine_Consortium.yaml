ecological_interactions:
- name: Cooperative Organochlorine Dechlorination of Gamma-Hexachlorocyclohexane
  description: Inoculated organochlorine-degrading consortia (comprising Enterococcus casseliflavus, Sulfurospirillum multivorans,
    Trichlorobacter lovleyi, Dehalococcoides mccartyi, and Petrimonas sulfuriphila) cooperatively dechlorinate gamma-hexachlorocyclohexane
    (lindane) in anoxic wetland sediment microcosms.
  interaction_type: SYNTROPHY
  biological_processes:
  - preferred_term: organohalide respiration
    term:
      id: GO:0070812
      label: organohalide respiration
  - preferred_term: halogenated hydrocarbon metabolic process
    term:
      id: GO:0042197
      label: halogenated hydrocarbon metabolic process
  downstream:
  - target: Suppression of Carbon Dioxide Reduction Methanogenesis During Lindane Bioremediation
    description: 'DIRECTLY IMPLIED: Bioaugmentation with the organochlorine-degrading consortia redirects electron flow toward
      reductive dechlorination and suppresses CO2-reduction methanogenesis.'
  evidence:
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both consortia demonstrated efficient degradation in sediment microcosms, reducing γ-HCH (C/C₀) to 63.0% (M)
      and 56.1% (Y13).
    explanation: Demonstrates γ-HCH reductive degradation in inoculated wetland sediment microcosms.
  scope: COMMUNITY_LEVEL
- name: Suppression of Carbon Dioxide Reduction Methanogenesis During Lindane Bioremediation
  description: Inoculation of the functional organochlorine-degrading consortia into anoxic wetland sediment microcosms redirects
    electron flow toward reductive dechlorination and significantly suppresses the CO2-reduction methanogenesis pathway, lowering
    the CH4/CO2 ratio.
  interaction_type: SYNTROPHY
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: methanogenesis, from carbon dioxide
    term:
      id: GO:0019386
      label: methanogenesis, from carbon dioxide
  evidence:
  - reference: PMID:42663479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Simultaneously, functional microbial consortia inoculation significantly suppressed the CO₂ reduction methanogenesis
      pathway compared with the non-inoculated group (P < 0.05), as evidenced by a marked decline in the CH₄/CO₂ ratio in
      inoculated groups.
    explanation: Shows suppression of CO2-reduction methanogenesis and reduced CH4/CO2 ratio upon consortium inoculation.
  scope: COMMUNITY_LEVEL
