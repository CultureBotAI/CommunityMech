    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: consumption of H2 by C. ljungdahlii would relieve feedback inhibition of C. acetobutylicum
    explanation: Sources the hypothesized return benefit to the solventogen.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The effect was small, but was present in all three biological replicates
    explanation: Sources the size of the effect, which the record's description carries rather than overstates.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: paint a more complex syntrophic picture and suggest a mutualistic relationship
    explanation: Sources the authors' reclassification of the pairing as mutualistic.
- name: Contact-dependent growth stimulation of both partners
  description: >-
    In the transwell arm, removing the membrane enriches ribosomal-protein genes
    in C. acetobutylicum and pyrimidine biosynthesis genes in C. ljungdahlii among
    the most upregulated genes, which the authors read as direct cell-to-cell
    contact stimulating growth in both organisms. Community-level because the
    effect is reciprocal and has no single source.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Clostridium acetobutylicum
    term:
      id: NCBITaxon:1488
      label: Clostridium acetobutylicum
  - preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
  biological_processes:
