  - preferred_term: 2,3-butanediol
    term:
      id: CHEBI:62064
      label: butane-2,3-diol
  evidence:
  - reference: PMID:30391511
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: resulted in the production of non-native metabolites, namely isopropanol
    explanation: Sources isopropanol as a metabolite the pairing makes and neither member makes alone.
  - reference: PMID:30391511
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: direct cell-to-cell interactions and material exchange among the two microbes
    explanation: Sources direct interaction and material exchange as the cause of the rearranged metabolism.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  working_volume: 60.0
  working_volume_unit: mL
  operating_temperature: 37.0
  operating_temperature_unit: °C
  ph_controlled: false
  temperature_controlled: true
  instrument_detail: >-
    100 mL screw-cap bottles at 60 mL working volume, held static in an anaerobic
    incubator. The caps were left loose so gas made by the culture could escape
    rather than pressurize the bottle.
  controls_notes: >-
    A parallel transwell arm (Corning 7910, 0.4 µm membrane) ran the same
    coculture with the two species physically separated; one well per plate had
    its membrane removed to serve as the mixed control on the same plate.
  notes: >-
    Recorded as SERUM_BOTTLE for the vessel class even though the paper's bottles
    are screw-capped rather than crimp-sealed: they are the same static sealed
    glass format, and the loosened cap is captured in instrument_detail rather
    than by picking a different system_type.

    The transwell arm is not given its own cultivation_setup entry because it is a
    perturbation of this one, not a separate cultivation of the community.
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. acetobutylicum monocultures and cocultures were grown in 100 mL screw cap bottles and grown statically at 37°C in an anaerobic incubator
    explanation: Sources the vessel, the static mode, and the temperature.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Turbo CGM was inoculated with 17% of this exponential pre-culture to a final volume of 60 mL
    explanation: Sources the working volume and the inoculum fraction.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A transwell system (Corning, Prod. No. 7910) was used to prepare cocultures for RNA extraction in which
    explanation: Sources the transwell apparatus used for the physical-separation control.
environmental_factors:
- name: Chamber atmosphere
  value: 85% N2, 10% CO2, and 5% H2
  description: The cocultures were grown inside an anaerobic chamber with this gas mix.
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: inside an anaerobic chamber (atmosphere composed of 85% N2, 10% CO2, and 5% H2)
    explanation: Sources the chamber gas composition.
- name: Headspace venting
  value: screw caps loosened
  description: >-
    Caps were left loose so that gas produced by the culture escaped instead of
    pressurizing the bottle, which matters because the community's defining
    exchange is a gas transfer.
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The screw cap bottle lids were loosened to allow accumulated gas to escape
    explanation: Sources the venting and its purpose.
- name: Physical separation control
  value: 0.4 µm permeable membrane
  description: >-
    In the Type II arm a transwell membrane let solutes pass while preventing the
    two species from touching, which is what separates contact-dependent from
    medium-mediated effects.
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: separated by a permeable membrane (0.4 µm pore size)
    explanation: Sources the pore size of the separating membrane.
growth_media:
- name: Turbo CGM complex growth medium
  composition:
  - name: yeast extract
    concentration: '5'
    unit: g/L
  atmosphere: ANAEROBIC
  headspace_gas: 85% N2, 10% CO2, 5% H2 chamber atmosphere
  vessel_type: 100 mL screw-cap bottle, caps loosened
  temperature: 37.0
  preparation_notes: >-
    A complex medium chosen because it supports both species; the paper cites its
    earlier work for the formulation rather than restating the full recipe, so
    only the yeast-extract concentration is asserted here. Pre-cultures were heat
    shocked at 80°C to kill non-sporulated cells before inoculation. Note that
    C. ljungdahlii does not use glucose in this system; the paper tracks its
    fructose consumption.
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: using the complex (5 g/L yeast extract) Turbo CGM growth medium
    explanation: Sources the medium name and its yeast-extract concentration.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: heat shocked at 80°C to kill non-sporulated cells
    explanation: Sources the heat-shock step in pre-culture preparation.
