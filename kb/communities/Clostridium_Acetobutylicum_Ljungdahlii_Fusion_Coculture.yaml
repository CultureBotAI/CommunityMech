discussions:
- discussion_id: fusion_coculture_amino_acid_and_hydrogen_mediation
  prompt: Which partner-resolved fluxes and perturbations establish amino-acid transfer and hydrogenase-mediated
    benefit?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Gas syntrophy - CO2 and H2 transfer to the acetogen
  - ecological_interactions#Arginine cross-feeding to the acetogen
  - ecological_interactions#Histidine degradation feeding the acetogen
  - ecological_interactions#Proposed hydrogenase feedback relief through hydrogen removal
  - ecological_interactions#Contact-associated transcriptional response and proposed growth stimulation
  - ecological_interactions#Proposed amino-acid competition and product inhibition
  rationale: PMID:40298437 measures supernatant amino acids, recipient monoculture supplementation and early glucose
    consumption. These results support the proposed mechanisms without tracing donor-derived amino acids, ATP or
    local hydrogen flux, directly assaying hydrogenase feedback, or measuring species-specific reciprocal growth.
    Direct transfer and mediator perturbations would distinguish these routes from other contact or medium effects.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: fusion_coculture_wild_type_exchange_and_product_causality
  prompt: Which macromolecules transfer in the unmodified pair, and is fusion necessary for its product phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Interspecies cell fusion and cytoplasmic material exchange
  - ecological_interactions#Coculture isopropanol and 2,3-butanediol production
  rationale: PMID:32873766 demonstrates wild-type structural fusion and describes protein-dye exchange, but its
    RNA assay uses C. acetobutylicum-Halo. PMID:38214507 demonstrates DNA acquisition and integration using a plasmid-bearing
    C. ljungdahlii donor and selected recipients, not the wild-type pairing; its node and arrow were removed from
    this graph with provenance retained in the review ledger. A separately scoped engineered record and exact-system
    transfer evidence would preserve these distinctions. Contact separation is not a fusion-specific intervention.
    The founding PMID:30391511 full body and the supplementary images were not inspected.
  posed_by: codex
  posed_date: '2026-10-05'
