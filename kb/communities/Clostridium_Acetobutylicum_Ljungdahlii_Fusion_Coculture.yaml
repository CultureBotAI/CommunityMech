    term:
      id: GO:0006412
      label: translation
  - preferred_term: pyrimidine nucleotide biosynthetic process
    term:
      id: GO:0006221
      label: pyrimidine nucleotide biosynthetic process
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: suggests that direct cell-to-cell contact stimulates cell growth of both organisms
    explanation: Sources the reciprocal, contact-dependent growth stimulation.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: separated by a permeable membrane (0.4 µm pore size)
    explanation: Sources the transwell separation that licenses calling the effect contact-dependent.
- name: Competition for yeast-extract amino acids and product inhibition
  description: >-
    Alongside the cross-feeding, the majority C. acetobutylicum depletes the
    shared free amino acids of the yeast extract and accumulates butyrate and
    butanol, which together push C. ljungdahlii into a survival response. The
    same amino-acid pool is therefore both cross-fed and competed for, at
    different phases of the culture.
  interaction_type: COMPETITION
  source_taxon:
    preferred_term: Clostridium acetobutylicum
    term:
      id: NCBITaxon:1488
      label: Clostridium acetobutylicum
  target_taxon:
    preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
  metabolites:
