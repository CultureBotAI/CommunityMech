    description: HYPOTHESIZED - acetogenic consumption of partner-derived H2 could relieve local hydrogenase feedback
      in C. acetobutylicum. Early glucose-consumption comparisons are consistent with this reciprocal effect, but
      do not directly measure hydrogenase activity or isolate local H2 removal.
  evidence:
