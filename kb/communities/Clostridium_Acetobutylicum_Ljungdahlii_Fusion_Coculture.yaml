- name: Histidine degradation feeding the acetogen
  description: PARTIAL - histidine-degradation genes in C. ljungdahlii were upregulated early in coculture, and
    supernatant amino-acid profiles were measured. Histidine supplementation increased autotrophic C. ljungdahlii
    monoculture growth with acetate and ammonia measurements. HYPOTHESIZED - C. acetobutylicum-derived histidine
    is transferred to the acetogen and degraded through glutamate and a tetrahydrofolate intermediate that feeds
    the Wood-Ljungdahl pathway. Supplementation and transcription support this model, but do not directly trace
    donor-derived carbon through the proposed coculture route.
