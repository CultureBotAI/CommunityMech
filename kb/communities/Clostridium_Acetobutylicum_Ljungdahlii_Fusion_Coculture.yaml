ecological_interactions:
- name: Gas syntrophy - CO2 and H2 transfer to the acetogen
  description: >-
    C. acetobutylicum releases CO2 and H2 during glucose catabolism and
    C. ljungdahlii consumes them through the Wood-Ljungdahl pathway. This is the
    founding interaction of the pairing and the one the coculture was built on.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: Clostridium acetobutylicum
    term:
      id: NCBITaxon:1488
      label: Clostridium acetobutylicum
  target_taxon:
    preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  - preferred_term: hydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  biological_processes:
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CO2 and H2 produced by the former feed the latter
    explanation: Sources the direction of the gas transfer.
  - reference: PMID:30391511
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ljungdahlii which fixes CO2, achieved carbon recoveries into C2-C4 alcohols
    explanation: Sources CO2 fixation by the acetogen as the sink half of the syntrophy.
- name: Arginine cross-feeding to the acetogen
  description: >-
    C. ljungdahlii strongly upregulates its arginine deiminase genes in
    coculture, a pathway C. acetobutylicum lacks, while C. acetobutylicum
    upregulates arginine biosynthesis. The authors read this as arginine made by
    the solventogen being catabolized by the acetogen for extra ATP. The paper
    words the conclusion as a possibility, and no growth measurement on arginine
    was reported for this coculture.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Clostridium acetobutylicum
    term:
      id: NCBITaxon:1488
      label: Clostridium acetobutylicum
  target_taxon:
    preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
  metabolites:
  - preferred_term: L-arginine
    term:
      id: CHEBI:16467
      label: L-arginine
  biological_processes:
  - preferred_term: L-arginine biosynthetic process
    term:
      id: GO:0006526
      label: L-arginine biosynthetic process
  - preferred_term: L-arginine catabolic process
    term:
      id: GO:0006527
      label: L-arginine catabolic process
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. ljungdahlii may utilize arginine produced by C. acetobutylicum for additional ATP production
    explanation: Sources the direction and the benefit, in the paper's own hedged wording.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. acetobutylicum does not have homologs for the arginine deiminase pathway
    explanation: Sources the pathway asymmetry that makes the acetogen the consumer.
- name: Histidine degradation feeding the acetogen
  description: >-
    Four C. ljungdahlii genes for histidine degradation to glutamate are strongly
    upregulated early in coculture. The net reaction releases ammonia, glutamate,
    and a tetrahydrofolate intermediate of the Wood-Ljungdahl pathway's eastern
    branch, so histidine feeds carbon into the pathway the acetogen runs.
  interaction_type: CROSS_FEEDING
  source_taxon:
