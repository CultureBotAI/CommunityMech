    term:
      id: CHEBI:17968
      label: butyrate
  - preferred_term: butanol
    term:
      id: CHEBI:28885
      label: butan-1-ol
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: inhibitory metabolites (such as butyrate and butanol) and competition for yeast-extract amino acids from the dominating C. acetobutylicum drive C. ljungdahlii to adopt a survival strategy
    explanation: Sources both the inhibitory products and the amino-acid competition, and their direction.
- name: Interspecies cell fusion and cytoplasmic material exchange
  description: >-
    The two species fuse their cell walls and membranes and exchange protein,
    RNA, and DNA in bulk. The structural demonstration is in the 2020 mBio paper,
    not in the transcriptomic seed paper, which states that it could not identify
    the genes driving fusion.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Clostridium acetobutylicum
    term:
      id: NCBITaxon:1488
      label: Clostridium acetobutylicum
  - preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
