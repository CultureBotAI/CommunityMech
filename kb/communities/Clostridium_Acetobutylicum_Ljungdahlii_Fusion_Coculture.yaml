id: CommunityMech:000336
name: Clostridium acetobutylicum-Clostridium ljungdahlii Syntrophic Fusion Coculture
description: >
  A defined two-member anaerobic coculture of the solventogen Clostridium
  acetobutylicum ATCC 824 and the acetogen Clostridium ljungdahlii DSM 13528.
  CO2 and H2 produced by C. acetobutylicum feed C. ljungdahlii, and the pairing
  also produces interspecies cell fusion with large-scale exchange of protein,
  RNA, and DNA between the two organisms. RNA sequencing of the coculture
  against the two monocultures, and of membrane-separated against unseparated
  cocultures in a transwell system, separates the effect of soluble signals from
  the effect of direct cell-to-cell contact. The transcriptional program shows
  differential regulation of the C. ljungdahlii Wood-Ljungdahl pathway and of the
  motility machinery, and of amino-acid biosynthesis and degradation; arginine
  and histidine made by C. acetobutylicum are proposed to be metabolized by
  C. ljungdahlii for extra ATP and carbon. The authors read the pairing as
  mutualistic rather than the commensalism previously assumed.

  This record is scoped to the WILD-TYPE pairing. The same laboratory has since
  reported much higher isopropanol and butanol titers from the same species pair
  using genetically modified C. acetobutylicum; those are properties of the
  engineered pairing and are deliberately not curated here.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: >-
    Find the genes involved in and affected by the interspecies cell fusion seen
    when C. acetobutylicum and C. ljungdahlii are cocultured, and separate
    contact-dependent from medium-mediated effects.
  assembly_strategy: >-
    Coculture the two wild-type strains in a complex medium that supports both,
    and compare against each species grown alone.
  perturbation_design: >-
    Two contrasts. Type I compared the coculture with the two monocultures,
    capturing soluble signals and direct cell-to-cell interaction together.
    Type II compared cocultures separated by a permeable transwell membrane with
    unseparated cocultures on the same plate, isolating the contribution of
    physical contact.
  measurement_endpoints:
  - Differential gene expression by RNA sequencing, per species
  - Contact-dependent versus medium-mediated transcriptional response
  - Wood-Ljungdahl pathway and autotrophic energy metabolism gene regulation
  - Motility and chemotaxis gene regulation
  - Amino-acid biosynthesis and degradation gene regulation
  - Supernatant free amino-acid profile
  evidence:
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we used RNA sequencing to identify genes differentially expressed in this coculture using two types of comparisons
    explanation: Sources RNA sequencing of the coculture as the study design.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The second type compared membrane-separated versus -unseparated cocultures, isolating the impact of interspecies physical contact
    explanation: Sources the membrane-separation contrast as the contact-isolating perturbation.
