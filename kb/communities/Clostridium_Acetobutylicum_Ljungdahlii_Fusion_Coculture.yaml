- name: Interspecies cell fusion and cytoplasmic material exchange
  description: Wild-type electron microscopy and tomography demonstrate interspecies cell-wall and membrane fusion.
    The 2020 study also reports protein-dye exchange in the wild-type pairing. Its RNA-label experiment instead
    pairs wild-type C. ljungdahlii with a C. acetobutylicum-Halo reporter; this supports related-system RNA transfer,
    not an unmodified-pair RNA assay. DNA integration in the 2024 plasmid-donor experiment is outside this wild-type
    graph. Fusion remains untyped because structure and exchange do not by themselves establish a fitness sign (#749).
  scope: COMMUNITY_LEVEL
  participating_taxa:
