- name: Hydrogen removal relieving hydrogenase feedback inhibition
  description: >-
    Local consumption of H2 by C. ljungdahlii is hypothesized to relieve feedback
    inhibition of the C. acetobutylicum hydrogenase, which is the return benefit
    that makes the pairing mutualistic rather than commensal. The measured effect
    was small, though reproducible across the three biological replicates.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
  target_taxon:
