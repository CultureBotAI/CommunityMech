    evidence_source: IN_VITRO
    snippet: ljungdahlii which fixes CO2, achieved carbon recoveries into C2-C4 alcohols
    explanation: Sources CO2 fixation by the acetogen as the sink half of the syntrophy.
- name: Arginine cross-feeding to the acetogen
  description: PARTIAL - coculture arginine-biosynthesis and arginine-deiminase expression, together with measured
    supernatant amino-acid profiles, support proposed C. acetobutylicum-to-C. ljungdahlii cross-feeding. Arginine
    supplementation increased growth of autotrophic C. ljungdahlii monocultures; it was not a donor-to-recipient
    flux experiment. HYPOTHESIZED - arginine catabolism supplies additional ATP in coculture. The supplementation
    response must not be confused with a measured coculture transfer rate or ATP-mediated effect.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
