    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: transmission electron microscopy and electron tomography demonstrated cell wall and membrane fusions between the two organisms
    explanation: Sources the structural evidence for fusion, from the paper that produced it.
  - reference: PMID:40298437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: result in interspecies cell fusion involving large-scale exchange of protein, RNA, and DNA between the two organisms
    explanation: Sources the material classes exchanged across the fusion.
- name: Interspecies DNA transfer and genomic integration
  description: >-
    Plasmid DNA from C. ljungdahlii is acquired by C. acetobutylicum and
    integrated into its genome, a horizontal transfer route mediated by the cell
    fusion rather than by conjugation, transduction, or transformation.
  interaction_type: COMMENSALISM
  source_taxon:
    preferred_term: Clostridium ljungdahlii
    term:
      id: NCBITaxon:1538
      label: Clostridium ljungdahlii
  target_taxon:
    preferred_term: Clostridium acetobutylicum
    term:
      id: NCBITaxon:1488
      label: Clostridium acetobutylicum
  evidence:
