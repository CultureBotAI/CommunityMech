- name: Contact-associated transcriptional response and proposed growth stimulation
  description: PARTIAL - removing the 0.4 micrometer transwell membrane altered expression, with ribosomal-protein
    genes in C. acetobutylicum and pyrimidine-biosynthesis genes in C. ljungdahlii enriched among strongly upregulated
