    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we isolated C. acetobutylicum cells which acquired and integrated into their genome portions of plasmid DNA from a plasmid-carrying C. ljungdahlii strain
    explanation: Sources the direction of transfer and the genomic integration.
- name: Emergent non-native metabolites
  description: >-
    The wild-type pairing makes isopropanol and 2,3-butanediol, which neither
    species makes alone. This is the defining emergent phenotype of the coculture
    and it comes from the 2019 founding paper, not from the transcriptomic study.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
