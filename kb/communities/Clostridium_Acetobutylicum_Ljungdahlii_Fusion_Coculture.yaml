ecological_interactions:
- name: Gas syntrophy - CO2 and H2 transfer to the acetogen
  description: C. acetobutylicum releases CO2 and H2 during glucose catabolism, supporting C. ljungdahlii through
    the Wood-Ljungdahl pathway. Retain CROSS_FEEDING for this reported gas transfer without resolving the broader
    syntrophy enum question (#752). The monoculture controls used different substrate and gas conditions; their
    inclusion does not demonstrate facultative cooperation under identical conditions.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium acetobutylicum
