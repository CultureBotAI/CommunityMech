    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: consumption of H2 by C. ljungdahlii would relieve feedback inhibition of C. acetobutylicum
    explanation: Explicitly proposed local H2-removal mechanism; the source did not directly assay hydrogenase activity.
  - reference: PMID:40298437
    supports: SUPPORT
