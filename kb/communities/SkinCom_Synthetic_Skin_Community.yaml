id: CommunityMech:000125
name: SkinCom Synthetic Skin Community
description: A standardized synthetic skin microbial community for reproducible in vitro and in vivo studies
  of skin-associated microbe-metabolite interactions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Create a reproducible microbial component for experimental human skin microbiome models.
  assembly_strategy: Aerobic and anaerobic skin-associated bacteria were assembled into the SkinCom standardized
    community.
  perturbation_design: SkinCom was tested with common cosmetic chemicals in vitro and on dorsal skin of
    mice in vivo.
  measurement_endpoints:
  - community reproducibility
  - DNA and RNA recovery
  - chemical response agreement
  - microbe-metabolite interactions
  evidence:
  - &id001
    reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SkinCom represents a valuable, standardized tool for investigating microbe-metabolite interactions
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: skin-associated microbial habitat
  term:
    id: UBERON:0002097
    label: skin of body
  notes: Synthetic community applied to skin and skin-like experimental systems.
taxonomy:
- taxon_term:
    preferred_term: skin bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  evidence:
  - *id001
ecological_interactions:
- name: Oxic-Anoxic SkinCom Member Growth Profiling
  description: >
    Each aerobic or anaerobic human-skin type strain was cultured in BHI and profiled for growth
    over several days before its abundance was tuned for SkinCom assembly.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Defined-Cell SkinCom Assembly
    description: >
      Member growth curves informed the automated, cell-counted construction of balanced SkinCom
      formulations.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We monitored the growth rate of each species over 144 h through optical density
      measurements.
    explanation: >
      Anchors the per-member growth characterization used before tuning the SkinCom assembly.
- name: Defined-Cell SkinCom Assembly
  description: >
    A programmable CellenONE microfluidic device assembled SkinComs from pico-liter droplets so
    wells were defined by the number of cells added at assembly time.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: 1x BHI SkinCom Diversity Selection
    description: >
      Defined-cell assembly enabled direct comparison of SkinCom starting ratios and BHI
      concentrations for reproducible diverse growth.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This method ensures that communities are defined by the number of cells at assembly
      time, yielding highly reproducible results.
    explanation: >
      Supports the assembly step that made the standardized SkinCom composition reproducible.
- name: 1x BHI SkinCom Diversity Selection
  description: >
    SkinCom maintained better diversity in 1x BHI than in diluted 0.1x BHI, leading the authors to
    use 1x BHI under aerobic conditions for later experiments.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Aerobe-Facilitated Cutibacterium Oxic Proliferation
    description: >
      The 1x BHI aerobic SkinCom condition retained all intended isolates and exposed the
      community-dependent growth of C. acnes in an oxic setting.
  - target: Cosmetic Chemical Response Concordance
    description: >
      The reproducible aerobic SkinCom was used to compare in-vitro cosmetic-chemical responses
      with those observed in a human trial.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: superior diversity observed in 1× BHI cultures, we decided to carry out all subsequent
      experiments under aerobic conditions using 1× BHI
    explanation: >
      Explains why 1x BHI became the standardized SkinCom medium for subsequent assays.
- name: Aerobe-Facilitated Cutibacterium Oxic Proliferation
  description: >
    Cutibacterium acnes failed to grow axenically under oxic conditions but was detected in the
    oxic SkinCom, consistent with facilitation by oxygen consumption from aerobic members.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: metagenomic results confirmed the ability of C. acnes to proliferate in an oxic
      setting, likely facilitated by oxygen consumption by aerobic members of the SkinCom
    explanation: >
      Supports the community-level oxygen-consumption facilitation that allowed the anaerobic
      member to persist in oxic SkinCom culture.
- name: Cosmetic Chemical Response Concordance
  description: >
    The standardized SkinCom reproduced most measured skin-microbe responses to common cosmetic
    chemicals in vitro when compared with a human trial.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - *id001
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 66% of the responses to common cosmetic chemicals in vitro were in agreement with
      a human trial
    explanation: >
      Links the standardized SkinCom to reproducible in-vitro responses to skin-applied chemicals.
environmental_factors:
- name: standardized skin model conditions
  value: SkinCom was evaluated in vitro and after application to dorsal skin of mice.
  description: SkinCom was tested with common cosmetic chemicals in vitro and on dorsal skin of mice in
    vivo.
  evidence:
  - *id001
growth_media:
- name: brain-heart infusion (BHI)
  temperature: '37'
  temperature_unit: °C
  headspace_gas: N2/CO2/H2 (85%/10%/5%) for anaerobic incubation
  inoculum_size: '0.065'
  inoculum_unit: OD600
  incubation_time: '144'
  incubation_time_unit: h
  vessel_type: 96-well plate
  preparation_notes: Strains cultured in 1X BHI at 37°C without shaking; obligate anaerobes (e.g. C.
    acnes) in cysteine-reduced medium in Hungate tubes. Aerobic and anaerobic members grown separately,
    anaerobic incubation in a vinyl anaerobic chamber (N2/CO2/H2 85%/10%/5%). Oxic and anoxic growth
    monitored for 144 and 140 h respectively; inoculum diluted to OD600 0.065 and arrayed into 96-well
    plates.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Individual strains were cultured in sterile BHI broth at 37°C, without shaking.
    explanation: BHI medium at 37°C without shaking.
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under anaerobic conditions, plates were incubated in a vinyl anaerobic chamber (Coy Lab Products)
      with an atmosphere of N2/CO2/H2 (85%/10%/5%).
    explanation: Anaerobic incubation atmosphere for the anaerobic SkinCom members.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 96-well plates, arrayed by a pico-litre printing microfluidic
    device.
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: Members diluted to OD600 0.065 before arraying; plates incubated
    oxically, in the presence of oxygen.
  notes: The paper ran the assembled community under two atmospheres and reports
    both; this is the oxic arm. Each type strain was raised separately in BHI first
    (and C. acnes in cysteine-reduced medium in Hungate tubes, being an anaerobe);
    that is seed preparation and is not recorded as the community's conditions
    (#529).
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultures were diluted to an optical density (OD600) of 0.065 and arrayed
      into 96-well plates using a pico-liter printing microfluidic device
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plates were incubated at 37°C in the presence of oxygen (oxic) or in the
      anaerobic chamber (anoxic)
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 96-well plates in an anaerobic chamber.
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: The anoxic arm of the same experiment, incubated in the anaerobic
    chamber rather than in air.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plates were incubated at 37°C in the presence of oxygen (oxic) or in the
      anaerobic chamber (anoxic)
