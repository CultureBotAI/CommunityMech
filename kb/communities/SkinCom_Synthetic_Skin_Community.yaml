ecological_interactions:
- name: SkinCom Medium-Associated Diversity Difference
  description: The compared SkinCom medium conditions differed in diversity and composition. All intended isolates
    were detected in both conditions. This is a community-composition observation, not evidence that the diversity
    difference caused C. acnes presence or identified an interspecies mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sequencing data confirmed the presence of all intended isolates within both sets of SkinComs
    explanation: Supports presence in both compared conditions; the medium comparison does not establish the removed
      causal arrow.
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significant compositional differences between the 0.1× and 1× BHI communities
    explanation: Supports the observed composition difference without asserting an interspecies mechanism.
- name: Community-Associated Cutibacterium Detection in Oxic SkinCom
  description: 'C. acnes was detected in the oxic mixed community; the authors interpret the metagenomic result
    as proliferation. HYPOTHESIZED: oxygen consumption by aerobic members may explain this association. The reported
    comparison does not isolate that mechanism or identify a particular facilitating partner, and is not represented
    as demonstrated colonization facilitation.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:39111313
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: metagenomic results confirmed the ability of C. acnes to proliferate in an oxic setting, likely facilitated
      by oxygen consumption by aerobic members of the SkinCom
    explanation: The source explicitly qualifies oxygen-consumption mediation as likely; retain its interpretation
      without a categorical facilitation claim.
- name: Cosmetic Chemical Response Concordance
  description: The study reports an average 66% agreement in the direction of differential-abundance changes between
    SkinCom and a small human pilot (13 participants). Only one human comparison was statistically significant.
    Directional concordance is not replication of significant effects, clinical efficacy, or evidence that the in-vitro
    and human results are interchangeable.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 66% of the responses to common cosmetic chemicals in vitro were in agreement with a human trial
    explanation: Supports the reported directional agreement, not significance replication or clinical efficacy.
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Note that the only statistically significant change observed was for S. epidermidis in the day 7 SLES
      cohort. No other changes were statistically significant.
    explanation: Bounds the human-trial statistical interpretation; most concordant signs were not significant human
      effects.
environmental_factors:
- name: standardized skin model conditions
  value: SkinCom was evaluated in vitro and after application to dorsal skin of mice.
  description: SkinCom was tested with common cosmetic chemicals in vitro and on dorsal skin of mice in
    vivo.
  evidence:
  - *id001
growth_media:
- name: brain-heart infusion (BHI)
  temperature: '37'
  temperature_unit: °C
  headspace_gas: N2/CO2/H2 (85%/10%/5%) for anaerobic incubation
  inoculum_size: '0.065'
  inoculum_unit: OD600
  incubation_time: '144'
  incubation_time_unit: h
  vessel_type: 96-well plate
  preparation_notes: Strains cultured in 1X BHI at 37°C without shaking; obligate anaerobes (e.g. C.
    acnes) in cysteine-reduced medium in Hungate tubes. Aerobic and anaerobic members grown separately,
    anaerobic incubation in a vinyl anaerobic chamber (N2/CO2/H2 85%/10%/5%). Oxic and anoxic growth
    monitored for 144 and 140 h respectively; inoculum diluted to OD600 0.065 and arrayed into 96-well
    plates.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Individual strains were cultured in sterile BHI broth at 37°C, without shaking.
    explanation: BHI medium at 37°C without shaking.
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under anaerobic conditions, plates were incubated in a vinyl anaerobic chamber (Coy Lab Products)
      with an atmosphere of N2/CO2/H2 (85%/10%/5%).
    explanation: Anaerobic incubation atmosphere for the anaerobic SkinCom members.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 96-well plates, arrayed by a pico-litre printing microfluidic
    device.
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: Members diluted to OD600 0.065 before arraying; plates incubated
    oxically, in the presence of oxygen.
  notes: The paper ran the assembled community under two atmospheres and reports
    both; this is the oxic arm. Each type strain was raised separately in BHI first
    (and C. acnes in cysteine-reduced medium in Hungate tubes, being an anaerobe);
    that is seed preparation and is not recorded as the community's conditions
    (#529).
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultures were diluted to an optical density (OD600) of 0.065 and arrayed
      into 96-well plates using a pico-liter printing microfluidic device
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plates were incubated at 37°C in the presence of oxygen (oxic) or in the
      anaerobic chamber (anoxic)
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 96-well plates in an anaerobic chamber.
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: The anoxic arm of the same experiment, incubated in the anaerobic
    chamber rather than in air.
  evidence:
  - reference: PMID:39111313
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plates were incubated at 37°C in the presence of oxygen (oxic) or in the
      anaerobic chamber (anoxic)
