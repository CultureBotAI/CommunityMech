id: CommunityMech:000480
name: Clostridium acetobutylicum and Clostridium ljungdahlii Carbon-Negative Isopropanol Syntrophic Coculture
description: High-cell-density syntrophic bacterial coculture pairing genetically engineered Clostridium acetobutylicum (CACas9
  delta-hbd-p95ace02_atoB, lacking 4-C metabolism and overexpressing an acetone-formation pathway) with the acetogen and ketoreductase
  partner Clostridium ljungdahlii in a 3.6-L perfusion bioreactor. C. acetobutylicum ferments glucose to acetone, CO2, and
  H2; C. ljungdahlii consumes dissolved H2—relieving the thermodynamic bottleneck of NADH-driven H2 evolution in C. acetobutylicum—and
  reduces cross-fed acetone to isopropanol at supratheoretical yields in continuous carbon-negative glucose fermentation.
