    isopropanol yields from glucose.
  evidence:
  - reference: PMID:41831593
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudo-perfusion cocultures showed that high cell densities combined with a high population fraction of C. ljungdahlii
      enable dramatic increases in isopropanol yields beyond the thermodynamic limitation imposed in CACas9 Δhbd-p95ace02_atoB
      monocultures.
    explanation: Documents the operational parameters enabling supratheoretical isopropanol yield.
