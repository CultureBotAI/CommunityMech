    evidence_source: IN_VITRO
    snippet: To explore the potential of this coculture system to achieve supratheoretical isopropanol yields, we identify
      NADH-driven hydrogen conversion in CACas9 Δhbd-p95ace02_atoB as the thermodynamically limiting step for acetone production
      in monocultures and thus isopropanol production in cocultures.
    explanation: Identifies NADH-driven H2 evolution as the thermodynamic bottleneck relieved by C. ljungdahlii.
  - reference: PMID:41831593
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We then demonstrate the ability of C. ljungdahlii to mitigate this issue by eliminating detectable hydrogen accumulation
      in the coculture.
    explanation: Confirms syntrophic H2 scavenging by C. ljungdahlii in the coculture.
