ecological_interactions:
- name: SynCom-Shifted Rhizosphere Diversity
  description: After the four-member inoculation treatment, the study reports increased fungal and bacterial Chao
    richness and fungal Bray-Curtis dissimilarity, with decreased bacterial Bray-Curtis dissimilarity after 45 days.
    Preserve the observed community-profile response. These diversity indices do not demonstrate colonization by
    each inoculated strain, symbiosis, stability or a causal enrichment mechanism, and the main text contains inconsistent
    blanket richness/evenness wording.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Growth-Associated Native Taxa Relative Enrichment
    description: HYPOTHESIZED - The authors propose that the shifted rhizosphere community favors enrichment of
      growth-associated native taxa. Diversity indices and relative taxon profiles were measured after the same
      treatment; their association does not isolate diversity change as the cause of enrichment.
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The Chao index of the rhizosphere microbial community and Bray–Curtis dissimilarity of the fungal community
      significantly increased, while Bray–Curtis dissimilarity of the bacterial community significantly decreased
      by SynCom inoculation.
    explanation: 'Reports the measured alpha- and beta-diversity shifts in the SynCom-inoculated pepper rhizosphere.

      '
- name: Growth-Associated Native Taxa Relative Enrichment
  description: SynCom treatment increased relative abundances of selected Sordariomycetes, Pseudarthrobacter, norank
    SBR1031 and norank A4b OTUs associated with pepper growth and root morphology. Scedosporium OTU451 also increased,
    while total genus-level Scedosporium decreased; these different aggregation levels must remain distinct. Correlations
    and random-forest importance identify candidate mediators, not absolute population growth, strain-specific colonization
    or demonstrated contributions by the four inoculated strains.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Pepper Rhizosphere Growth Promotion
    description: HYPOTHESIZED - The enriched native taxa may contribute to pepper growth, as proposed from correlation
      and random-forest analyses. Those analyses do not establish necessity, sufficiency or direction independently
      of the shared inoculation treatment or plant-driven changes.
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The abundance of Sordariomycetes, Pseudarthrobacter, norank SBR1031, and norank A4b were significantly
      correlated with pepper growth and root morphology
    explanation: 'Links SynCom-enriched native taxa to the pepper growth and root-architecture phenotypes.

      '
- name: Pepper Rhizosphere Growth Promotion
  description: The four-member SynCom treatment increased measured shoot growth, biomass, chlorophyll, root vigor
    and root-morphology readouts compared with uninoculated controls after 45 days. Preserve these positive whole-plant
    responses without inferring reciprocal microbial fitness, superiority over every single strain, field yield
    or mediation by a particular native taxon.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly increased shoot height, stem diameter, fresh weight, dry weight, chlorophyll
      content, leaf number, root vigor, root tips, total root length, and root-specific surface area of pepper
    explanation: 'Reports the growth and root-morphology increases measured after SynCom inoculation.

      '
environmental_factors:
- name: defined synthetic community design
  value: Synthetic microbial community applied during pepper seedling establishment.
  description: SynCom inoculated versus uninoculated pepper seedlings.
  evidence:
