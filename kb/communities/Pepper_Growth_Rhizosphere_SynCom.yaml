ecological_interactions:
- name: Four-Member Pepper SynCom Inoculation
  description: >
    Bacillus subtilis, Trichoderma harzianum, Trichoderma asperellum, and Aspergillus sp.
    fermentation liquids were normalized and mixed in equal proportions before soil inoculation.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: SynCom-Shifted Rhizosphere Diversity
    description: >
      The prepared four-member SynCom was inoculated into pepper seedling substrate before
      rhizosphere fungi and bacteria were profiled after 45 days.
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The fermentation liquids of the four strains were adjusted to a concentration of
      1 × 108 CFU/mL, and then mixed in equal proportions to create the SynCom.
    explanation: >
      Defines the four-member inoculum and the equal-proportion mixing step used to make the pepper
      SynCom.
- name: SynCom-Shifted Rhizosphere Diversity
  description: >
    SynCom inoculation increased fungal richness and fungal Bray-Curtis dissimilarity while
    decreasing bacterial Bray-Curtis dissimilarity in the pepper seedling rhizosphere.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Key Native Taxa Enrichment
    description: >
      The SynCom-driven rhizosphere shift included increases in native fungal and bacterial OTUs
      that were correlated with pepper growth and root morphology readouts.
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The Chao index of the rhizosphere microbial community and Bray–Curtis dissimilarity
      of the fungal community significantly increased, while Bray–Curtis dissimilarity
      of the bacterial community significantly decreased by SynCom inoculation.
    explanation: >
      Reports the measured alpha- and beta-diversity shifts in the SynCom-inoculated pepper
      rhizosphere.
- name: Key Native Taxa Enrichment
  description: >
    SynCom inoculation enriched native Sordariomycetes, Pseudarthrobacter, SBR1031, and A4b OTUs
    whose abundances tracked pepper growth and root morphology.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Pepper Rhizosphere Growth Promotion
    description: >
      Random-forest and correlation analyses nominated the enriched native taxa as contributors to
      the shoot-height, dry-weight, chlorophyll, and root-vigor responses.
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The abundance of Sordariomycetes, Pseudarthrobacter, norank SBR1031, and norank
      A4b were significantly correlated with pepper growth and root morphology
    explanation: >
      Links SynCom-enriched native taxa to the pepper growth and root-architecture phenotypes.
- name: Pepper Rhizosphere Growth Promotion
  description: >
    The four-member SynCom increased pepper seedling shoot, biomass, chlorophyll, root-vigor, and
    root-morphology measurements relative to uninoculated controls.
  scope: COMMUNITY_LEVEL
  interaction_type: MUTUALISM
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly increased shoot height, stem diameter, fresh weight,
      dry weight, chlorophyll content, leaf number, root vigor, root tips, total root
      length, and root-specific surface area of pepper
    explanation: >
      Reports the growth and root-morphology increases measured after SynCom inoculation.
environmental_factors:
- name: defined synthetic community design
  value: Synthetic microbial community applied during pepper seedling establishment.
  description: SynCom inoculated versus uninoculated pepper seedlings.
  evidence:
  - *id001
related_ingredients:
- preferred_term: chlorophyll
  chebi_term:
    id: CHEBI:28966
    label: chlorophyll
  relevance: Photosynthetic pigment whose leaf content increased 29.65% after SynCom inoculation —
    one of the quantified plant-physiology readouts of SynCom-driven growth promotion in pepper
    seedlings (You et al. 2025).
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly increased shoot height, stem diameter, fresh weight, dry
      weight, chlorophyll content, leaf number, root vigor, root tips, total root length, and
      root-specific surface area of pepper by 20.9%, 36.33%, 68.84%, 64.34%, 29.65%
    explanation: Quantifies the chlorophyll-content increase as one of the SynCom-promoted pepper
      growth readouts.
growth_media:
- name: pepper seedling substrate (artificial climate chamber)
  temperature: '28'
  temperature_unit: °C
  light_regime: 16 h light / 8 h dark
  light_intensity: '300'
  light_intensity_unit: µmol m⁻² s⁻¹
  incubation_time: '45'
  incubation_time_unit: days
  inoculum_size: 1 × 10^7
  inoculum_unit: CFU/g soil
  vessel_type: plug seedling tray
  preparation_notes: 'Relative humidity 80%. Seeds germinated on 0.5x MS in the dark at 30°C for 36 h;
    seedlings pre-grown on 0.5x MS solution at 28°C, 80% humidity, 16 h light/8 h dark. SynCom members
    pre-cultured before inoculation: bacteria in liquid LB at 37°C, 170 rpm for 24 h; fungi in liquid
    PDA at 28°C, 170 rpm for 5 days. PPFD reported in source as 300 mmol m2 s−1.'
  evidence:
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'They were cultivated for 5 days in an artificial climate chamber with the following conditions:
      16 h of light at 28 °C and 8 h of dark at 28 °C, ensuring a photosynthetic photon flux density
      of 300 mmol m2 s−1 and a constant relative humidity of 80%'
    explanation: Reports cultivation temperature, photoperiod, light intensity, and humidity in the growth chamber.
  - reference: PMID:39858916
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the newly prepared SynCom was inoculated into soil at a concentration of 1 × 107 CFU/g. Following
      45 days of cultivation
    explanation: Reports the SynCom inoculum density and total cultivation duration.
