ecological_interactions:
- name: Archaeal CuMMO-Driven Aerobic Oxidation
  description: COMPUTATIONAL POTENTIAL - divergent CuMMO sequences retain catalytic residues and have predicted
    structural similarity to archaeal monooxygenases. These analyses support candidate activity, not demonstrated
    in-vivo oxidation or a resolved ammonia, methane or hydrocarbon substrate.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  evidence:
  - reference: PMID:34987183
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The CuMMO proteins in Ca. Angelarchaeales are more similar in structure to those in Nitrososphaerales
      than those of bacteria
    explanation: Supports the structural similarity to Nitrososphaerales CuMMOs.
  - reference: PMID:34987183
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: contain all functional residues required for general monooxygenase activity
    explanation: Conserved residues support candidate enzymatic activity; substrate specificity and in-vivo flux
      remain untested in the reviewed study.
- name: Blue Copper Protein Electron Transport Repertoire
  description: COMPUTATIONAL POTENTIAL - genomes are enriched in blue copper proteins and encode co-located candidate
    electron-transport machinery. Individual protein functions and their biochemical coupling to CuMMO activity
    remain unresolved.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  evidence:
  - reference: PMID:34987183
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: significantly enriched in blue copper proteins (BCPs) relative to sibling lineages
    explanation: Supports the BCP enrichment within Angelarchaeales.
  - reference: PMID:34987183
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: share numerous electron transport mechanisms with the Nitrososphaerales
    explanation: Supports the shared archaeal electron transport machinery surrounding the CuMMO inference.
- name: Peptide and Amino Acid Heterotrophy
  description: COMPUTATIONAL POTENTIAL - peptide/amino-acid transport and catabolic genes suggest heterotrophic
    metabolism in the surveyed Angelarchaeales genomes, not measured uptake or ecosystem carbon flux.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  biological_processes:
  - preferred_term: cellular amino acid catabolic process
    term:
      id: GO:0009063
      label: amino acid catabolic process
  evidence:
  - reference: PMID:34987183
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: significant capacity for peptide/amino acid uptake and degradation
    explanation: Supports the peptide and amino acid metabolic repertoire.
- name: CuMMO-Heterotrophic Metabolic Context
  description: HYPOTHESIZED - co-occurring CuMMO, electron-transport and amino-acid-metabolism genes suggest a possible
    coupled metabolism. The proposed use of amino-acid-derived ammonia is a hypothesis, not resolved substrate specificity
    or demonstrated coupling.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  - preferred_term: cellular amino acid catabolic process
    term:
      id: GO:0009063
      label: amino acid catabolic process
  evidence:
  - reference: PMID:34987183
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Ca. Angelarchaeales also encode significant capacity for peptide/amino acid uptake and degradation
      and share numerous electron transport mechanisms with the Nitrososphaerales
    explanation: Supports co-encoded metabolic capacities, not a causal coupling among them.
- name: Angelarchaeales Biogeochemical Cycling Potential
  description: HYPOTHESIZED - the genomic repertoire makes Angelarchaeales candidate contributors to terrestrial
    carbon and/or nitrogen cycling across the surveyed sites. Unknown CuMMO substrate specificity and unmeasured
    flux prevent assignment of a definite ecosystem transformation.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34987183
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: suggests previously unaccounted organisms contribute to critical global nitrogen and/or carbon cycling
      functions
    explanation: Supports inferred biogeochemical potential, not a measured ecological effect.
