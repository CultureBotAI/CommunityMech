ecological_interactions:
- name: Legume-rhizobia nitrogen-fixing symbiosis on Mars simulants
  description: >
    The rhizobia Sinorhizobium meliloti and Sinorhizobium medicae nodulate the roots of
    the model legume Medicago truncatula grown on Mars soil simulants and fix
    atmospheric nitrogen inside the nodules, providing fixed nitrogen to the host in
    exchange for plant photosynthate. Root nodules developed comparably to sand-grown
    controls and nifH nitrogen-fixation reporter-gene expression was detected in the
    nodules, showing the mutualism is functional on the simulants.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Sinorhizobium spp. (rhizobial symbionts)
    term:
      id: NCBITaxon:382
      label: Sinorhizobium meliloti
    notes: >
      Represents the two rhizobial symbionts (S. meliloti and S. medicae); grounded to
      S. meliloti as the representative nodulating partner.
  target_taxon:
    preferred_term: Medicago truncatula (host legume)
    term:
      id: NCBITaxon:3880
      label: Medicago truncatula
  biological_processes:
  - preferred_term: nodulation
    term:
      id: GO:0009877
      label: nodulation
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: root nodules could develop on M. truncatula roots when grown on these Mars soil simulants
    explanation: Supports functional nodulation of the host legume on Mars soil simulants.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: detected nifH (a reporter gene for nitrogen fixation) expression inside these nodules
    explanation: Supports active nitrogen fixation (nifH expression) inside the nodules.
environmental_factors:
- name: Mojave Mars Simulant grades (MMS-1) and MMS-2 substrate
  value: MMS-1 (Coarse/Fine/Unsorted/Superfine) and MMS-2
  description: >
    The symbiosis was tested across different grades of the Mojave Mars Simulant (MMS-1:
    Coarse, Fine, Unsorted, Superfine) and the MMS-2 simulant; plant mass was higher on
    MMS-2, indicating chemical composition matters more than grain size.
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "different grades of the Mojave Mars Simulant (MMS)-1: Coarse, Fine, Unsorted, Superfine, and the MMS-2 simulant"
    explanation: Supports the Mars soil simulant grades used as growth substrates.
- name: Atmospheric nitrogen as fixation substrate
  value: Nitrogen present in the Mars atmosphere
  description: >
    The presence of nitrogen in the Mars atmosphere makes the legume-rhizobia
    nitrogen-fixation association a route to nitrogen input for martian agriculture.
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The presence of nitrogen in the Mars atmosphere offers the possibility to take advantage of this important plant-microbe association
    explanation: Supports atmospheric nitrogen as the fixation substrate motivating the symbiosis on Mars.
growth_media:
- name: Tryptone-Yeast extract (TY) medium, for the rhizobial inoculum
  preparation_notes: Sinorhizobium meliloti 2011, S. medicae WSM419 and S. meliloti 1021 (PnifH::uidA)
    were grown to OD600 0.8 with appropriate antibiotics, then applied at 1e8 cells/mL. This is the medium
    for the bacterial partner only; the plant substrate is recorded separately.
  temperature: 30
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  inoculum_size: 100000000
  inoculum_unit: cells/mL
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The bacterial strains were grown in Tryptone-Yeast extract medium and supplemented with\
      \ appropriate antibiotics at 30\xB0C to an optical density (600 nm) of 0.8. Each plant was inoculated\
      \ with the appropriate bacterium at a concentration of 1x108 cells/ml."
    explanation: Gives the rhizobial medium, temperature, target OD and inoculation density
- name: Mojave Mars Simulant substrate (MMS-1 Coarse/Fine/Unsorted/Superfine, MMS-2) with sand control
  inoculum_source: Mars soil simulants from The Martian Garden, Austin, TX; Quikrete all-purpose sand
    as the control substrate
  preparation_notes: 'The substrate is a sterile mineral simulant, not a microbial source: the community
    here is the deliberately introduced legume-rhizobium pair, so the simulant supplies physical and chemical
    context rather than an inoculum. Grain-size grades were the variable.'
  temperature: 22
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  light_regime: temperature-controlled greenhouse (22-25 C), 16-hour photoperiod
  incubation_time: 21
  incubation_time_unit: d
  vessel_type: tray inserts, 2.35 x 1.94 x 2.23 in, filled with simulant
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'we used different Mars soil simulants (different grades of the Mojave Mars Simulant (MMS)-1:
      Coarse, Fine, Unsorted, Superfine, and the MMS-2 simulant) available through The Martian Garden
      (Austin, TX) along with sand. We used sand (Quikrete all-purpose sand) as our control substrate
      in this study.'
    explanation: Names the simulant grades and the sand control.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The germinated seedlings were planted on trays with inserts (2.35\u201D X 1.94\u201D X 2.23\u201D\
      ; CN-IKN, Greenhouse Megastore, USA) filled with the different Mars soil simulants. These plants\
      \ were allowed to grow in a temperature-controlled (22\xB0C\u201425\xB0C) greenhouse with a 16-hour\
      \ photoperiod."
    explanation: Gives the tray inserts and the greenhouse temperature and photoperiod.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The plants were watered every 24\u201348 hours with each plant receiving 1ml of water. The\
      \ plants were grown for seven days before inoculation with bacteria."
    explanation: Gives the watering regime and the 7 days of growth before inoculation.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The different plant phenotypes (total plant mass, lateral root number, average nodule number)
      were recorded 14 days post-inoculation.
    explanation: Gives the 14-days-post-inoculation harvest.
- name: 1% plant agar with 1 mM gibberellic acid (GA3), for germination
  preparation_notes: Seeds were surface-sterilised in 1 M sulfuric acid for 8 min, washed, rinsed in 5.6%
    sodium hypochlorite and imbibed in sterile water before plating; plates were stratified at 4 C for
    at least 48 h then held at 25 C for 48-96 h to germinate.
  temperature: 25
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  vessel_type: '9-cm Petri plates (Greiner Bio-one #633185)'
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The seeds were surface-sterilized in concentrated sulfuric acid (1M) for 8 minutes, then
      washed four times with sterile diH2O followed by one rinse with 5.6% (v/v) sodium hypochlorite solution.
      The seeds were rinsed an additional three times with sterile diH2O and allowed to imbibe in sterile
      diH2O for a minimum of 2 h in a sterile environment.
    explanation: Gives seed surface-sterilisation and imbibition.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: sterilized seeds were transferred to 9-cm Petri plates (#633185, Greiner Bio-one, Monroe,
      NC, USA) containing 1% (w/v) plant agar (#A038-2.5KG, Caisson Laboratories Inc., Smithfield, UT,
      USA) supplemented with 1 mM Gibberellic acid (GA3) medium under sterile conditions.
    explanation: Gives the plant agar and GA3 germination medium.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The plates were sealed with parafilm, wrapped completely in aluminum foil, and placed at\
      \ 4\xB0C for a minimum of 48 h, removed from the refrigerator, and then placed at room temperature\
      \ (25\xB0C) for an additional 48\u201396 h to allow the seeds to germinate."
    explanation: Gives the cold stratification and germination temperatures.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: Temperature-controlled greenhouse, 16-hour photoperiod, plants in tray inserts (2.35
    x 1.94 x 2.23 in) of Mars simulant or sand. Grown 7 days before inoculation with rhizobia, then a
    further 14 days to phenotyping.
  operating_temperature: 22
  operating_temperature_unit: "\xB0C"
  temperature_controlled: true
  controls_notes: Greenhouse temperature held between 22 and 25 C with a 16-hour photoperiod; operating_temperature
    records the lower bound of the reported range. Watering was 1 mL per plant every 24-48 h. No pH or
    dissolved-oxygen control applies, so both are left unset.
  notes: 'A plant-symbiosis experiment, not a reactor: system_type is OTHER because no enum value denotes
    a greenhouse tray. Three media are recorded because the partners were grown apart before being brought
    together -- TY broth for the rhizobia, agar/GA3 for germination, simulant for the symbiosis itself.'
  evidence:
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The germinated seedlings were planted on trays with inserts (2.35\u201D X 1.94\u201D X 2.23\u201D\
      ; CN-IKN, Greenhouse Megastore, USA) filled with the different Mars soil simulants. These plants\
      \ were allowed to grow in a temperature-controlled (22\xB0C\u201425\xB0C) greenhouse with a 16-hour\
      \ photoperiod."
    explanation: Gives the greenhouse, tray inserts, temperature range and photoperiod.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The plants were watered every 24\u201348 hours with each plant receiving 1ml of water. The\
      \ plants were grown for seven days before inoculation with bacteria."
    explanation: Gives watering and the pre-inoculation growth period.
  - reference: PMID:34879082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The different plant phenotypes (total plant mass, lateral root number, average nodule number)
      were recorded 14 days post-inoculation.
    explanation: Gives the post-inoculation duration.
