id: CommunityMech:000342
name: Nitratireductor-Gordonia Z123 LDPE-Degradation SynCom
description: >-
  A defined three-isolate synthetic consortium, Z123, reconstructed from a
  polyethylene-degrading enrichment isolated from marine plastic debris. Z123
  comprises Nitratireductor sp. Z-1 and two Gordonia isolates, Gordonia sp. Z-2
  and Gordonia sp. Z-3. In 30-day biodegradation assays with pristine
  low-density polyethylene, Z123 achieved 9.98% polymer weight loss and 50.88%
  molecular-weight reduction. Integrated genomic and proteomic data suggested a
  division of labor across oxidative activation, chain scission, and downstream
  metabolism, while GC-MS detected extracellular LDPE-associated products
  consistent with oxidative polymer modification.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >-
    Reconstruct a synthetic bacterial consortium whose functionally
    differentiated members cooperate to depolymerize and metabolize pristine
    low-density polyethylene.
  assembly_strategy: >-
    Combine Nitratireductor sp. Z-1 with Gordonia sp. Z-2 and Gordonia sp. Z-3
    isolated from a consistent enrichment system derived from marine plastic
    debris.
  measurement_endpoints:
  - LDPE polymer weight loss after 30 days
  - LDPE molecular-weight reduction after 30 days
  - Integrated genomic and proteomic analysis of consortium member functions
  - GC-MS detection of putative LDPE-associated extracellular compounds
  - In vitro LDPE modification by recombinant MCO1 and Lcp3
  notes: >-
    Curation is limited to the abstract-supported synthetic consortium
    membership, 30-day LDPE degradation phenotype, and high-level
    functional-differentiation model because the accessible PubMed cache does
    not report medium composition, culture temperature, inoculation ratios, or
    strain-specific enzyme assignments.
  evidence:
  - reference: PMID:42641428
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we reconstructed a synthetic consortium, Z123, comprising Nitratireductor
      sp. Z-1 and Gordonia spp. Z-2 and Z-3
    explanation: >-
      Supports the exact three-isolate membership of the Z123 synthetic
      consortium.
  - reference: PMID:42641428
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Z123 achieved 9.98% weight loss and 50.88% molecular weight reduction
      within 30 days
    explanation: >-
      Supports the 30-day pristine-LDPE degradation endpoint used to define the
      engineered consortium phenotype.
  - reference: PMID:42641428
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gas chromatography-mass spectrometry (GC-MS) analysis further detected
      putative LDPE-associated extracellular compounds consistent with oxidative
      polymer modification.
    explanation: >-
      Supports GC-MS detection of extracellular LDPE-associated products as an
      endpoint consistent with oxidative polymer modification.
