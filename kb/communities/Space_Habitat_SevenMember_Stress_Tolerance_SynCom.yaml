id: CommunityMech:000339
name: Space Habitat Seven-Member Stress-Tolerance SynCom
description: >-
  A defined seven-member bacterial consortium assembled as a tractable space-habitat
  microbiome model from ISS-derived, spacecraft-associated, and biosafety-level-1
  strains of genera commonly detected in spacecraft. The consortium contained
  Staphylococcus capitis K1-2-2-23, Bacillus subtilis W2-B1-K4, Pseudomonas
  antarctica CMS 35T, Streptococcus halotolerans HTS9T, Propionibacterium
  cyclohexanicum TA-12T, Micrococcus luteus W4-Al-K1, and Acinetobacter
  radioresistens 50V1. Equal OD-adjusted suspensions of the seven species were
  pooled to OD600 0.125 and used for static co-cultivation, early biofilm biomass,
  desiccation, X-ray irradiation, hydrogen peroxide, and pilot 16S rRNA gene
  sequencing assays. The study quantified stress survival of B. subtilis and S.
  capitis as single species and inside the full consortium; consortium context
  increased B. subtilis survival after 500 Gy X-ray irradiation but lowered
  recoverable B. subtilis CFU after 24 h co-cultivation in the full community.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: EXTREME_ENVIRONMENT
engineering_design:
  objective: >-
    Build a representative low-complexity bacterial space-habitat consortium and
    compare the stress tolerance of Bacillus subtilis and Staphylococcus capitis
    as isolated species versus embedded in the full consortium.
  assembly_strategy: >-
    Seven isolates were selected from ISS surfaces, spacecraft-associated
    facilities, or biosafety-level-1 representatives of commonly observed ISS
    genera, then combined in equal amounts from OD600-adjusted suspensions.
  inoculation_strategy: >-
    PBS-washed single-species suspensions were adjusted by OD600; equal amounts
    were pooled in one tube to create a final consortium OD600 of 0.125.
  perturbation_design: >-
    B. subtilis and S. capitis were exposed either alone or in the seven-member
    consortium to desiccation, cumulative X-ray irradiation, and hydrogen peroxide.
  measurement_endpoints:
  - Pairwise and whole-consortium growth by oCelloScope optical-density tracking
  - B. subtilis and S. capitis CFU after 24 h co-cultivation
  - Crystal-violet early biofilm biomass after static co-cultivation
  - CFU-derived B. subtilis and S. capitis survival fractions after desiccation, X-ray irradiation,
    and hydrogen peroxide
  - 16S rRNA gene sequencing of consortium composition before and after stress exposure or incubation
  notes: >-
    The authors intentionally tested vegetative B. subtilis cells rather than
    spores so putative metabolic interactions could occur during co-exposure.
    Stress-survival readouts were restricted to B. subtilis and S. capitis.
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To design a bacterial space habitat consortium, isolates obtained from the
      ISS or spacecraft-associated facilities, which are among commonly isolated
      and detected genera on the ISS as well as representative biosafety level 1
      strains from commonly observed genera were selected
    explanation: Supports the source habitat and representative-genus assembly strategy.
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To create the synthetic bacterial consortium, equal amounts of adjusted bacterial suspensions were added together in one tube for a final OD 600nm of 0.125.
    explanation: Supports equal OD-based assembly of the defined consortium.
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In order to test this, a straight-forward approach was started to determine
      how the presence of a synthetic bacterial consortium influences the survival
      of two species, namely B. subtilis and S. capitis , when co-exposed to
      different space-relevant stressors such as desiccation, X-ray irradiation,
      and oxidative stress.
    explanation: Supports the comparison of single-species and consortium stress responses.
