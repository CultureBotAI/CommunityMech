discussions:
- discussion_id: stress_protection_mechanisms_unresolved
  prompt: >-
    Which consortium members or metabolites drive the stressor-specific changes
    in B. subtilis and S. capitis survival inside the full consortium?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Whole-consortium reduction of recoverable Bacillus subtilis after co-cultivation
  rationale: >-
    The study showed stressor-specific differences between single-species and
    consortium survival, and it discusses candidate explanations including
    nutrient release, protective dead-cell material, catalase usage, antimicrobial
    peptides and biosynthetic gene clusters. The experiments did not identify a
    causal partner or measured metabolite, so no pairwise protective edge is
    asserted here.
  posed_by: codex
  posed_date: '2026-09-11'
