ecological_interactions:
- name: Whole-consortium reduction of recoverable Bacillus subtilis after co-cultivation
  description: >-
    After 24 h co-cultivation, culturable B. subtilis CFU were significantly
    lower in the whole seven-member consortium than in B. subtilis single culture
    under the tested recovery conditions. The source discusses possible
    antimicrobial competition but does not resolve which partner, metabolite or
    mechanism drove this effect.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus subtilis W2-B1-K4
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Quantification of viable cells of B. subtilis revealed an increase of
      CFU/mL when co-cultivated with A. radioresistens and M. luteus ,
      respectively, and decrease of CFU/mL when co-cultivated with S. capitis
      and P. antarctica , and a statistically significant decrease of CFU/mL when
      co-cultivated with the whole consortium ( p = 0.008)
    explanation: Supports the whole-consortium decrease in culturable B. subtilis recovery.
environmental_factors:
- name: Desiccation stress
  value: 1, 7, 14, 21 and 28 days
  description: >-
    B. subtilis and S. capitis were dried overnight in 96-well plates, resuspended
    after each time point, and assayed by CFU and regrowth in TSYB.
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After 1, 7, 14, 21, and 28 days, respectively, dried cells were resuspended
      in 200 μL TSYB and survival fractions were determined as described previously.
    explanation: Supports the desiccation time course.
- name: X-ray irradiation
  value: 50, 100, 250 and 500 Gy
  description: >-
    Prepared single-species and consortium cell suspensions were irradiated in a
    closed X-ray system before CFU-derived survival fractions were calculated.
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Samples were irradiated with X-rays (200 kV, 15 mA) with cumulative doses
      of 50, 100, 250 and 500 Gy using a closed X-ray system (RS225, Gulmay,
      Germany) with an average dose rate of 15.3 Gy/min ± 1.7 Gy/min.
    explanation: Supports the X-ray irradiation doses and apparatus.
- name: Hydrogen peroxide exposure
  value: 1.5% and 3% for 45 and 90 min
  description: >-
    Prepared cell suspensions were challenged with 1.5% or 3% hydrogen peroxide,
    neutralized with catalase, and assayed for B. subtilis and S. capitis survival.
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To determine hydrogen peroxide tolerance, we exposed both B. subtilis and
      S. capitis as single species and within the bacterial consortium to 1.5%
      and 3% hydrogen peroxide for 45 min and 90 min, respectively
    explanation: Supports the peroxide concentrations and exposure durations.
growth_media:
- name: Tryptic soy yeast broth and agar
  ph: 7.3
  temperature: 37
  temperature_unit: °C
  incubation_time: 24
  incubation_time_unit: h
  vessel_type: 48-well plate
  inoculum_size: 0.00005
  inoculum_unit: OD600
  preparation_notes: >-
    TSYB and TSYA contained casein peptone, soy peptone, NaCl, yeast extract,
    K2HPO4 and glucose; agar plates were supplemented with 15 g/L bacteriological agar.
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For determination of growth in co-cultivation, 500 μL TSYB were added per
      well of a 48-well plate and the respective single species or combinations
      of the consortium was added in a 1:1,000 dilution of a previously prepared
      bacterial suspension with an OD 600nm of 0.05 to reach a final OD 600nm of
      0.00005.
    explanation: Supports the TSYB 48-well-plate co-cultivation condition.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: Static multiwell-plate co-cultivation
  working_volume: 500
  working_volume_unit: uL
  operating_temperature: 37
  operating_temperature_unit: °C
  temperature_controlled: true
  controls_notes: >-
    Growth and early biofilm assays were run statically in 48-well or 24-well
    plates for 24 h; stress-recovery incubation used the same 37 °C TSYB/TSYA
    culture conditions.
  evidence:
  - reference: PMID:42577390
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All co-cultivation approaches were performed as three independent experiments with three biological replicates each.
    explanation: Supports the replicated batch co-cultivation setup.
