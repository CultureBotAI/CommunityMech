discussions:
- discussion_id: pha_mmc_phage_host_links_not_curated
  prompt: Should the per-reactor, per-timepoint phage-host linkages (for example Brevundimonas
    with phage 1010E_19 in Reactor A, or the intermittent Paracoccus linkages in Reactor
    D) be curated as individual LYTIC_INFECTION edges, given that the pOTUs have no
    stable public identifiers?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - ecological_interactions#Coupled Turnover of Phage and Bacterial Community Structure
  rationale: >-
    The paper reports named phage-host linkages per reactor and per time point in
    supplementary network figures, and they are the most mechanistically specific
    content it carries. They are not curated here for two reasons: the phage
    identifiers (0111B24, 1010E_19) are study-local contig labels with no
    NCBITaxon or other resolvable grounding, and each linkage holds at some time
    points and not others, which the schema has no way to qualify. Curating them
    as unqualified pairwise edges would assert a stability the source explicitly
    denies.
- discussion_id: pha_mmc_no_storage_polymer_functional_role
  prompt: Is a FunctionalRoleEnum value needed for storage-polymer accumulation, which
    is the defining function of this community and of PHA-MMCs generally?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: >-
    Every member here is carried with no `functional_role`. The defining function
    of these genera is accumulating polyhydroxyalkanoate under alternating feast
    and famine, and no existing value says that. PRIMARY_DEGRADER was considered
    and rejected: it means degrading complex substrates, while these organisms
    grow on single short-chain fatty acids and lactate, so using it would assert
    a metabolism the source does not report — the same failure the
    PATHOGEN_ANTAGONIST description records for #298/#301. Leaving the slot empty
    is correct until a value exists, but it does mean the community's central
    function is readable only from prose and interactions.
- discussion_id: pha_mmc_five_reactors_one_record
  prompt: Should five reactors differing in carbon source and in dominant genus be one
    record or five?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: >-
    The five reactors share an inoculum, a selection strategy, and an operating
    regime, and the paper analyses them as one system, so they are curated as one
    community. But the dominant genus differs between them — Azoarcus in A and B,
    Thauera in E — so the DOMINANT rank carried by all five genera here means
    "dominant in at least one reactor", not "dominant in the community". A reader
    taking the five dominants as co-dominant in a single vessel would be misled.
    Splitting per reactor would fix that and lose the cross-reactor comparison
    that is the paper's design.
