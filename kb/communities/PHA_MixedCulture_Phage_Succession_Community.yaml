id: CommunityMech:000468
name: Polyhydroxyalkanoate-Producing Mixed Microbial Culture Under Phage Predation
description: 'Five parallel 2 L sequencing batch reactors enriched from municipal activated sludge under
  an aerobic dynamic feeding regime, each on a single volatile fatty acid or lactate as sole carbon source,
  and followed for 145 days by paired metagenomics and metatranscriptomics. The polyhydroxyalkanoate-producing
  mixed microbial cultures (PHA-MMCs) include dominant Azoarcus, Paracoccus, Azomonas, Thauera, and Brevundimonas
  populations across the different reactors. The study recovered 963 metagenome-assembled genomes and
  4,294 phage operational taxonomic units.


  Bacterial and phage community turnover are statistically associated. Structural equation modeling estimates
  a negative association of phage abundance with bacterial alpha diversity and activity. The authors propose
  kill-the-winner predation as an explanation for alternating dominance; this is a model-inferred mechanism,
  not a controlled phage perturbation or direct demonstration of host lysis. Predicted host links and
  defense systems are sequence-derived. Predicted phage auxiliary metabolic genes are transcribed, but
  transcription does not establish a contribution to PHA yield or productive lytic infection.


  This many-phages-on-many-bacteria system complements the experimentally manipulated four-species community
  in CommunityMech:000467. The two records preserve the distinction between inferred phage effects and
  experimental intervention.'
