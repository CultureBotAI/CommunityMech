id: CommunityMech:000468
name: Polyhydroxyalkanoate-Producing Mixed Microbial Culture Under Phage Predation
description: >
  Five parallel 2 L sequencing batch reactors enriched from municipal activated
  sludge under an aerobic dynamic feeding regime, each on a single volatile fatty
  acid or lactate as sole carbon source, and followed for 145 days by paired
  metagenomics and metatranscriptomics. The enriched polyhydroxyalkanoate-
  producing mixed microbial cultures (PHA-MMCs) are dominated by Azoarcus,
  Paracoccus, Azomonas, Thauera, and Brevundimonas, with 963 metagenome-assembled
  genomes and 4,294 phage operational taxonomic units recovered.

  The curated subject is what the resident phage community does to that bacterial
  community. Bacterial and phage community turnover track each other closely
  across time, and structural equation modelling resolves the direction: phage
  abundance correlates negatively with bacterial alpha diversity and activity,
  consistent with virulent phages lysing whichever species is currently dominant
  and vacating the niche for a successor. Dominance therefore alternates rather
  than settling, even under constant selection — a kill-the-winner regime in an
  engineered system where the enrichment strategy alone would predict a stable
  dominant.

  This is a many-phages-on-many-bacteria (N-N) system in the sense of
  doi:10.1146/annurev-virology-100424-123645, and the companion record to
  CommunityMech:000467, which carries the 1-N case under experimental control.
  Phage-encoded auxiliary metabolic genes for the PHA pathway, including phaC,
  are transcribed here, so the phages are curated as participants in the
  community's defining metabolic function and not only as predators on it.
