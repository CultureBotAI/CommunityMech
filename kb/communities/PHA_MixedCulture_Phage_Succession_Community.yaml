ecological_interactions:
- name: Hypothesized Kill-the-Winner Succession of Dominant PHA Producers
  description: 'HYPOTHESIZED: the authors interpret alternating dominant species and the fitted SEM as
    consistent with phages lysing dominant hosts and freeing niches for successors. The succession pattern
    was observed during maintenance under constant aerobic dynamic feeding selection, but the mechanism
    is model-inferred rather than established by a phage manipulation or lysis assay. The KILL_THE_WINNER
    label denotes this explicitly qualified hypothesis.'
  interaction_type: KILL_THE_WINNER
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: viral process
    term:
      id: GO:0016032
      label: viral process
  evidence:
  - reference: PMID:40152616
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Structural equation modeling analysis showed that phages could infect and lyse dominant species
      to vacate ecological niches for other species, resulting in a community succession state in which
      dominant species alternated.
    explanation: Retains the source model qualifier. The proposed lysis-mediated succession mechanism
      is inferred from a fitted statistical structure, not directly demonstrated.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: structural equation model of phage and bacterial community drivers
      parameters: Fitted over 30 time-sequenced samples from five reactors, relating phage community composition
        and phage abundance to bacterial community composition, bacterial alpha diversity (Chao1), and
        bacterial community activity.
      tools:
      - tool_name: piecewiseSEM
        tool_version: 2.3.0
        role: Structural equation modeling in R 4.3.2.
  - reference: PMID:40152616
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Sample points in each reactor did not cluster together during the late stages of maintenance
      (days 65, 68, and 145), suggesting that the bacterial community structure reached alternative states
      during maintenance, even when deterministic selection pressure was applied
    explanation: Ordination supports non-convergence of community composition, but only partially supports
      the proposed phage mechanism.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: Bray-Curtis principal coordinates analysis
      tools:
      - tool_name: R
        tool_version: 4.3.2
        role: phyloseq community ordination.
- name: Coupled Turnover of Phage and Bacterial Community Structure
  description: Temporally adjacent samples were compared by Bray-Curtis dissimilarity for both the bacterial
    and the phage community, and the two turnover series track each other closely in all five reactors
    (Spearman rho 0.95, 0.77, 0.87, 0.99, and 0.80). Structural equation modelling returns a positive
    association between phage and bacterial community composition. This statistical association does not
    establish infection or causal direction.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: There was a significant positive relationship between the bacterial and phage communities
      shifts
    explanation: Supports the coupling of bacterial and phage community turnover.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: Bray-Curtis turnover and Spearman correlation analysis
      tools:
      - tool_name: R
        tool_version: 4.3.2
        role: vegan dissimilarities and cor.test Spearman correlation.
  - reference: PMID:40152616
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the dynamics of bacterial community structure could be mirrored in phage communities
    explanation: Correlated turnover is compatible with host dependence or phage effects but does not
      establish predation or direction; the separate SEM also estimates rather than experimentally establishes
      direction.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: Bray-Curtis turnover and Spearman correlation analysis
      tools:
      - tool_name: R
        tool_version: 4.3.2
        role: vegan dissimilarities and cor.test Spearman correlation.
- name: Modeled Association of Phage Abundance with Bacterial Diversity and Activity
  description: Structural equation modeling estimates negative associations of phage abundance with bacterial
    alpha diversity (Chao1, r = -0.43, P <= 0.05) and bacterial community activity (r = -0.36). The authors
    interpret these associations as consistent with virulent phage effects. The modeled direction is not
    an experimental demonstration of host killing and does not exclude host-driven or other explanations.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'significant negative correlation (r: −0.43, P ≤ 0.05) between phage abundance and the alpha
      diversity (Chao1) index of the bacterial community'
    explanation: Supports the negative phage-diversity association and its effect size.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: structural equation model of phage and bacterial community drivers
      parameters: Fitted over 30 time-sequenced samples from five reactors, relating phage community composition
        and phage abundance to bacterial community composition, bacterial alpha diversity (Chao1), and
        bacterial community activity.
      tools:
      - tool_name: piecewiseSEM
        tool_version: 2.3.0
        role: Structural equation modeling in R 4.3.2.
  - reference: PMID:40152616
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the SEM was used to discern the causality and quantify the effects of the drivers
    explanation: The direction of this edge rests on a structural equation model over observational time-series
      data, not on a manipulation, so the causal reading is the authors' inference from a fitted correlational
      structure. PARTIAL records that the association is measured while the direction is modelled.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: structural equation model of phage and bacterial community drivers
      parameters: Fitted over 30 time-sequenced samples from five reactors, relating phage community composition
        and phage abundance to bacterial community composition, bacterial alpha diversity (Chao1), and
        bacterial community activity.
      tools:
      - tool_name: piecewiseSEM
        tool_version: 2.3.0
        role: Structural equation modeling in R 4.3.2.
