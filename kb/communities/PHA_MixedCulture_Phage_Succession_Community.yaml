- name: Predicted Host Antiviral Defence Repertoire
  description: 'DefenseFinder predicts encoded antiviral systems in bacterial MAGs: restriction-modification
    and CRISPR-Cas predominate in 10 of 12 phyla, Wadjet in Actinobacteriota and SoFIC in Planctomycetota;
    AbiE and Thoeris are also represented. These are sequence-based defense predictions, not functional
    resistance assays or lytic infections.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The RM and CRISPR-Cas systems were the predominant antiviral systems in 10 of the 12 bacterial
      phyla
    explanation: Supports the distribution of computationally predicted encoded defense systems, not demonstrated
      antiviral activity.
    computational_provenance:
      prediction_type: SEQUENCE_HOMOLOGY
      model_name: DefenseFinder annotation of bacterial MAGs
      tools:
      - tool_name: DefenseFinder
        tool_version: 1.2.2
        role: Detect encoded antiphage systems from bacterial MAG sequences.
