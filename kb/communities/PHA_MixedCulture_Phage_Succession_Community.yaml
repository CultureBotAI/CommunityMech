ecological_interactions:
- name: Kill-the-Winner Succession of Dominant PHA Producers
  description: >-
    Virulent phages infect and lyse whichever bacterial species is currently
    dominant, vacating its ecological niche for a successor, so dominance
    alternates across the maintenance phase instead of settling on one producer.
    This occurs despite a constant deterministic selection pressure — alternating
    satiation and starvation — under which the enrichment strategy alone would
    predict a stable dominant, and sample composition in each reactor did not
    reconverge at the late time points.
  interaction_type: KILL_THE_WINNER
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: viral process
    term:
      id: GO:0016032
      label: viral process
  downstream:
  - target: Phage Suppression of Bacterial Alpha Diversity and Activity
    description: >-
      Repeated lysis of the standing dominant is the proposed mechanism behind
      the measured negative association between phage abundance and both
      bacterial richness and bacterial community activity.
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: phages could infect and lyse dominant species to vacate ecological niches
      for other species, resulting in a community succession state in which dominant
      species alternated
    explanation: Supports both the lysis of the standing dominant and the resulting
      alternation of dominance, which is what distinguishes this from a one-off
      competitive release.
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sample points in each reactor did not cluster together during the late
      stages of maintenance (days 65, 68, and 145), suggesting that the bacterial
      community structure reached alternative states during maintenance, even when
      deterministic selection pressure was applied
    explanation: Supports non-convergence under constant selection, the observation
      the phage explanation is offered for.
- name: Coupled Turnover of Phage and Bacterial Community Structure
  description: >-
    Temporally adjacent samples were compared by Bray-Curtis dissimilarity for
    both the bacterial and the phage community, and the two turnover series track
    each other closely in all five reactors (Spearman rho 0.95, 0.77, 0.87, 0.99,
    and 0.80). Structural equation modelling returns a positive association
    between phage and bacterial community composition.
  interaction_type: LYTIC_INFECTION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: There was a significant positive relationship between the bacterial and
      phage communities shifts
    explanation: Supports the coupling of bacterial and phage community turnover.
  - reference: PMID:40152616
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: the dynamics of bacterial community structure could be mirrored in phage
      communities
    explanation: PARTIAL because correlated turnover is consistent with predation but
      does not on its own establish it; the authors say so explicitly and turn to
      structural equation modelling for direction, which is curated separately.
- name: Phage Suppression of Bacterial Alpha Diversity and Activity
  description: >-
    Structural equation modelling resolves the direction of the phage-bacteria
    coupling: phage abundance is negatively associated with bacterial alpha
    diversity (Chao1, r = -0.43, P <= 0.05) and with bacterial community activity
    (r = -0.36). The authors read this as virulent phages hijacking and killing
    hosts during proliferation, and as evidence against the alternative that
    temperate phages are simply tracking host growth, since temperate phages
    benefit from a high host growth rate while limiting lytic activity.
  interaction_type: LYTIC_INFECTION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'significant negative correlation (r: −0.43, P ≤ 0.05) between phage abundance
      and the alpha diversity (Chao1) index of the bacterial community'
    explanation: Supports the negative phage-diversity association and its effect size.
  - reference: PMID:40152616
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the SEM was used to discern the causality and quantify the effects of the
      drivers
    explanation: The direction of this edge rests on a structural equation model over
      observational time-series data, not on a manipulation, so the causal reading is
      the authors' inference from a fitted correlational structure. PARTIAL records
      that the association is measured while the direction is modelled.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_name: structural equation model of phage and bacterial community drivers
      parameters: >-
        Fitted over 30 time-sequenced samples from five reactors, relating phage
        community composition and phage abundance to bacterial community
        composition, bacterial alpha diversity (Chao1), and bacterial community
        activity.
- name: Phage-Encoded Auxiliary Metabolic Genes for PHA Synthesis Are Transcribed
  description: >-
    Seven auxiliary metabolic genes potentially contributing to PHA synthesis —
    phaC, fadJ, acs, ackA, phbB, acdAB, and fadD — were identified in phage
    sequences, and metatranscriptomics shows them in an actively expressed state.
    This makes the phage population a participant in the community's defining
    biosynthetic function rather than only a source of mortality.
  interaction_type: LYTIC_INFECTION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: polyhydroxyalkanoate
    term:
      id: CHEBI:78037
      label: polyhydroxyalkanoate
  biological_processes:
  - preferred_term: viral process
    term:
      id: GO:0016032
      label: viral process
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Seven key auxiliary metabolic genes (AMGs), phaC, fadJ, acs, ackA, phbB,
      acdAB, and fadD, potentially contributing to PHA synthesis were identified from
      phage sequences
    explanation: Supports the identity of the phage-encoded AMGs.
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: these AMGs were transcribed, indicating that they were in an active expression
      state
    explanation: Supports active transcription rather than mere genomic presence. Note
      the authors' own wording is "potentially contributing" to PHA synthesis, so a
      contribution to yield is not asserted here.
- name: Host Antiviral Defence Repertoire
  description: >-
    Community members carry diverse antiviral defence systems, with restriction-
    modification and CRISPR-Cas predominant across 10 of the 12 bacterial phyla
    present, Wadjet predominant in Actinobacteriota and SoFIC in Planctomycetota,
    and abortive-infection systems including AbiE and Thoeris also represented.
  interaction_type: LYTIC_INFECTION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40152616
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The RM and CRISPR-Cas systems were the predominant antiviral systems in
      10 of the 12 bacterial phyla
    explanation: Supports the predominant defence systems and their breadth across the
      community.
