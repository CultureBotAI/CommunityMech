  description: Seven putative phage-encoded auxiliary metabolic genes potentially contributing to PHA
    synthesis (phaC, fadJ, acs, ackA, phbB, acdAB, and fadD) were identified by sequence analysis. Metatranscriptomic
    reads support transcription. Neither the annotations nor the transcripts establish productive lytic
    infection or increased PHA synthesis yield.
