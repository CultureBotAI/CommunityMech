- name: HPLC-confirmed cyantraniliprole removal
  description: In NPK-amended 500 mL freshwater microcosms incubated at 30 °C for 20 days, T2 bioaugmentation was associated
    with HPLC-measured cyantraniliprole decline from a 57.88 mg/L zero-day residue (96.47% recovery of the nominal 60 mg/L
    spike) to 3.30 mg/L after 20 days (94.30% removal, outperforming uninoculated controls C1 and C2) alongside total viable
    bacterial growth reaching 5.92 x 10^6 CFU/mL at day 11 before declining by day 20. Treatment-level parent-compound loss
    in non-sterile freshwater microcosms does not establish complete mineralization, detoxification, member-specific flux,
    or enzyme mediation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 20 days, the degradation rates reached 92.00%, 94.30%, 96.72%, and 98.27% for T1, T2, T3, and T4, respectively.
      These rates correspond to low residual concentrations of 4.64 mg/L, 3.30 mg/L, 1.90 mg/L, and 1.00 mg/L.
    explanation: Supports the 20-day HPLC-measured cyantraniliprole removal efficiency (94.30%) and final residue (3.30 mg/L)
      for T2.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: T2 96.47 57.88 44.22 d 33.11 d 22.31 d 3.30 d
    explanation: Table 7 reports the T2 recovery (96.47%), zero-day (57.88 mg/L), 3-day, 7-day, 11-day, and 20-day (3.30 mg/L)
      cyantraniliprole residues.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The bacterial consortia T1, T2, T3, and T4 all showed a consistent increase (p > 0.05) in total bacterial counts
      from the start of incubation to day 11, reaching 5.86 × 106, 5.92 × 106, 6.11 × 106, and 6.70 × 106 CFU/mL, respectively.
    explanation: Documents viable bacterial proliferation of consortium T2 (reaching 5.92 x 10^6 CFU/mL at day 11) during
      active cyantraniliprole biodegradation in the 20-day water microcosms.
