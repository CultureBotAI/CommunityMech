ecological_interactions:
- name: T2 distributed cyantraniliprole enzyme potential
  description: 'Post-assay bioinformatic analysis (Table 8 / Figure 5) assigns the six T2 strains a combined repertoire of
    22 predicted enzyme hits covering four of the five proposed enzyme classes: triosephosphate isomerase (TPI), aminopeptidase
    (AP), and catechol 1,2-dioxygenase (C1,2O) in Serratia marcescens Bo1-Bo2 and Pseudomonas aeruginosa Bo3-Bo6, plus 2-oxopent-4-enoate
    hydratase (OEX) in P. aeruginosa Bo3-Bo6, while all six isolates lack catechol O-methyltransferase (COMT). These represent
    predicted pathway and enzyme-class coverage rather than measured enzyme expression, catalytic activity, or member-resolved
    metabolic flux, and do not establish reciprocal fitness benefits.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: T2, which also had 22 total enzymes, lacked COMT, and this deficiency likely impaired its performance.
    explanation: Supports the post-assay bioinformatic enzyme-repertoire prediction for T2 (22 total enzyme hits in Table
      8 / Figure 5), without claiming measured enzymatic activity or confirmed pathway intermediates.
    computational_provenance:
      prediction_type: OTHER
      tools:
