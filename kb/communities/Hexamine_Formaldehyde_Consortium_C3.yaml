ecological_interactions:
- name: C3 suspended-culture hexamine, formaldehyde, and COD removal
  description: In suspended AS broth containing 50 mg/L hexamine at 37 degrees Celsius, the 1:1:1 Brevundimonas diminuta SRCHD04,
    Brucella pseudintermedia SRCHD05, and Ochrobactrum sp. SRCHD06 consortium (C3) achieved 67.21%, 79.70%, and 88.07% hexamine
    reduction, 37.43%, 41.63%, and 42.05% formaldehyde reduction, and 8.71%, 14.63%, and 27.30% COD reduction at 24, 48, and
    72 h, accompanied by 18.13%, 21.24%, and 22.66% ammonia production. These bulk-chemistry outcomes in nutrient-containing
    AS broth do not establish complete mineralization, member-resolved substrate conversion, or consortium ammonia removal.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    notes: Ammonia was produced as a hexamine breakdown by-product in the suspended-C3 assay (Table 2); a consortium ammonia
      sink is not established.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
