id: CommunityMech:000507
name: Hexamine Formaldehyde Consortium C3
description: Consortium C3 is a defined three-member hexamine- and formaldehyde-removing bacterial formulation assembled from
  environmental isolates Brevundimonas diminuta SRCHD04, Brucella pseudintermedia SRCHD05, and Ochrobactrum sp. SRCHD06 at
  a 1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius. Over 24, 48, and 72 h of suspended-culture
  incubation, C3 achieved 67.21%, 79.70%, and 88.07% hexamine reduction, 37.43%, 41.63%, and 42.05% formaldehyde reduction,
  and 8.71%, 14.63%, and 27.30% COD reduction while producing 18.13%, 21.24%, and 22.66% ammonia.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate the defined 3-isolate combination Consortium C3 (SRCHD04, SRCHD05, SRCHD06 at a 1:1:1 ratio) for removal
    of hexamine, its formaldehyde by-product, and chemical oxygen demand in suspended AS broth as part of the C1-C6 consortium
    development series.
  assembly_strategy: Select five hexamine-, formaldehyde-, and COD-removing environmental isolates (SRCHD03, SRCHD04, SRCHD05,
    SRCHD06, and SRCHD07) and test defined equal-ratio combinations C1-C6 in 50 mg/L hexamine AS broth at 37 degrees Celsius.
  inoculation_strategy: Combine Brevundimonas diminuta SRCHD04, Brucella pseudintermedia SRCHD05, and Ochrobactrum sp. SRCHD06
    at a 1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius and sample cell-free supernatants at 24,
    48, and 72 h.
  perturbation_design: Compare Consortium C3 across 24, 48, and 72 h incubation intervals against sibling consortia in the
    C1-C6 combinatorial assembly series in AS broth supplemented with 50 mg/L hexamine at 37 degrees Celsius.
  measurement_endpoints:
  - hexamine removal
  - formaldehyde removal
  - chemical oxygen demand removal
  - ammonia production
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on their hexamine, formaldehyde, and COD removal ability, five isolates were selected for consortium development
    explanation: Supports the bioremediation phenotype screen used to select the five isolates for C1-C5 consortium development.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '3 SRCHD04: SRCHD05: SRCHD06 (1:1:1) C3'
    explanation: Reports the Table 1 Consortium C3 assembly combining isolates SRCHD04, SRCHD05, SRCHD06 at a 1:1:1 ratio.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C3 67.21 79.70 88.07 37.43 41.63 42.05 8.71 14.63 27.30 18.13 21.24 22.66
    explanation: Quantifies Consortium C3 24 h, 48 h, and 72 h hexamine reduction, formaldehyde reduction, COD reduction,
      and ammonia production in suspended AS broth.
