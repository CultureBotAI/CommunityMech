id: CommunityMech:000102
name: Peanut Seed Bacterial CS SynCom
description: A combined peanut seed-borne bacterial synthetic community that suppresses Aspergillus flavus
  and Fusarium oxysporum while promoting seedling growth.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Construct conserved, growth-promoting, and combined peanut seed bacterial SynComs for pathogen
    resistance.
  assembly_strategy: Synthetic communities were derived from 16S profiling, strain isolation, and plant
    growth promotion indicators.
  perturbation_design: Peanut seed and seedling pathogen challenges with Aspergillus flavus and Fusarium
    oxysporum.
  measurement_endpoints:
  - root rot resistance
  - aflatoxin suppression
  - defense enzyme activity
  - seedling growth
  evidence:
  - &id001
    reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Potentially conserved microbial synthetic communities (C), growth-promoting synthetic communities
      (S), and combined synthetic communities (CS) of peanut seeds were constructed after 16S rRNA Illumina
      sequencing, strain isolation, and measurement of plant growth promotion indicators.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Seed-borne peanut bacterial SynComs tested against seed and root fungal pathogens.
taxonomy:
- taxon_term:
    preferred_term: peanut seed bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  evidence:
  - *id001
ecological_interactions:
- name: Peanut Seed SynCom Construction
  description: >
    Conserved, growth-promoting, and combined synthetic communities of peanut
    seed bacteria were constructed from 16S rRNA profiles, strain isolation,
    and plant-growth-promotion indicator measurements.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Dual Fungal Challenge Evaluation
    description: >
      The defined seed-bacterial SynComs were then challenged against peanut
      seed Aspergillus flavus contamination and Fusarium oxysporum seedling
      root rot.
  - target: CS Seedling Growth Promotion
    description: >
      The constructed seed-bacterial CS SynCom was evaluated for its ability to
      improve peanut seedling growth in parallel with fungal suppression.
  evidence:
  - *id001
- name: Dual Fungal Challenge Evaluation
  description: >
    Peanut seed-bacterial SynComs were tested for control of seed aflatoxin
    contamination caused by Aspergillus flavus and root rot caused by Fusarium
    oxysporum.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: Salicylic-Acid Defense Activation
    description: >
      The Fusarium oxysporum seedling challenge showed the CS community's
      strongest root-rot protection and associated that phenotype with
      salicylic-acid-related induced resistance.
  - target: CS Aspergillus and Aflatoxin Suppression
    description: >
      The Aspergillus flavus seed challenge directly measured seed fungal
      reproduction and aflatoxin production after CS inoculation.
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      the control effects of synthetic microbial communities composed of peanut
      seed bacteria against seed aflatoxin contamination caused by Aspergillus
      flavus and root rot by Fusarium oxysporum were evaluated
    explanation: >
      Supports testing peanut seed-bacterial SynComs against both seed
      Aspergillus flavus aflatoxin contamination and Fusarium oxysporum
      root rot.
- name: Salicylic-Acid Defense Activation
  description: >
    The combined CS SynCom's root-rot protection in peanut seedlings was
    associated with increased defense enzyme activity and activation of
    salicylic-acid-related systemic induced resistance.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: salicylic acid
    term:
      id: CHEBI:16914
      label: salicylic acid
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: CS Fusarium Root-Rot Resistance
    description: >
      Defense enzyme and salicylic-acid responses were the reported host
      defense axis underlying CS-mediated Fusarium root-rot resistance.
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      This was achieved by increased defense enzyme activity and activated
      salicylic acid (SA)-related, systematically induced resistance in peanuts
    explanation: >
      Supports salicylic-acid-related induced resistance as the peanut defense
      response associated with the CS root-rot phenotype.
- name: CS Fusarium Root-Rot Resistance
  description: >
    All three seed-bacterial SynCom designs resisted Fusarium oxysporum root
    rot in peanut seedlings, with the combined CS community producing the
    strongest protection.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Three synthetic communities showed resistance to root rot and CS had the
      best effect after inoculating into peanut seedlings
    explanation: >
      Supports Fusarium root-rot resistance and the strongest effect from the
      combined CS community.
- name: CS Aspergillus and Aflatoxin Suppression
  description: >
    The combined CS SynCom inhibited Aspergillus flavus reproduction on peanut
    seeds and reduced aflatoxin production, a seed-protection effect linked to
    bacterial toxin degradation and fungal mycelial disruption.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      CS also inhibited the reproduction of A. flavus on peanut seeds and the
      production of aflatoxin
    explanation: >
      Supports CS suppression of Aspergillus flavus reproduction and aflatoxin
      production on peanut seeds.
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: These effects are related to bacterial degradation of toxins and destruction of mycelia
    explanation: >
      Supports toxin degradation and fungal mycelial damage as the reported
      mechanisms associated with CS seed protection.
- name: CS Seedling Growth Promotion
  description: >
    In addition to helping peanut seeds and seedlings resist fungal invasion,
    inoculation with the seed-bacterial synthetic community promoted peanut
    seedling growth.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: promote the growth of peanut seedlings
    explanation: >
      Supports peanut seedling growth promotion after inoculation with a seed
      bacterial synthetic community.
environmental_factors:
- name: defined synthetic community design
  value: Synthetic communities were derived from 16S profiling, strain isolation, and plant growth promotion
    indicators.
  description: Peanut seed and seedling pathogen challenges with Aspergillus flavus and Fusarium oxysporum.
  evidence:
  - *id001
related_ingredients:
- preferred_term: salicylic acid
  chebi_term:
    id: CHEBI:16914
    label: salicylic acid
  relevance: Plant defense hormone underlying the systemic induced resistance that the combined
    seed-bacterial SynCom (CS) activates in peanut seedlings to resist Fusarium oxysporum root rot
    (Luo et al. 2024).
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: increased defense enzyme activity and activated salicylic acid (SA)-related, systematically
      induced resistance in peanuts
    explanation: Names salicylic acid as the host defense signaling axis activated by the SynCom to
      suppress root rot.
