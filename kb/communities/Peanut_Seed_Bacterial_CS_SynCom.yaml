ecological_interactions:
- name: SA-Related Defense Response and Proposed Resistance Mediation
  description: Peanut seedlings treated with the seed-bacterial synthetic communities showed increased defense-enzyme
    activity and an SA-related resistance response. The accessible abstract attributes protection to this host response.
    PARTIAL - The full-text controls for SA-pathway necessity, sufficiency and distal systemic signaling have not
    been inspected; marker/enzyme responses alone do not resolve those causal requirements.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: salicylic acid
    term:
      id: CHEBI:16914
      label: salicylic acid
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: CS Fusarium Root-Rot Resistance
    description: PARTIAL - The authors attribute increased root-rot resistance to higher defense-enzyme activity
      and SA-related induced resistance. Retain this reported causal direction, while noting that the accessible
      abstract does not expose pathway-blocking, rescue or distal-tissue controls needed to isolate SA mediation.
  evidence:
  - reference: PMID:38520150
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: 'This was achieved by increased defense enzyme activity and activated salicylic acid (SA)-related,
      systematically induced resistance in peanuts

      '
    explanation: Author-reported defense response and resistance interpretation; pathway-necessity controls are
      not exposed in the accessible abstract.
- name: CS Fusarium Root-Rot Resistance
  description: All three seed-bacterial synthetic communities, C, S and CS, improved resistance to Fusarium oxysporum
    root rot after seedling inoculation, with CS showing the best effect in the reported comparison. Preserve this
    positive host-protection result; it does not identify the contribution of each member or prove that SA signaling
    is the sole mediator.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Three synthetic communities showed resistance to root rot and CS had the best effect after inoculating
      into peanut seedlings

      '
    explanation: 'Supports Fusarium root-rot resistance and the strongest effect from the combined CS community.

      '
- name: CS Aspergillus and Aflatoxin Suppression
  description: CS inhibited Aspergillus flavus reproduction on peanut seeds and reduced aflatoxin production. The
    authors relate these effects to bacterial toxin degradation and mycelial destruction. The positive suppression
    phenotype is supported, but the accessible abstract does not disclose toxin-fate measurements, degradation products,
    adsorption controls or member-resolved contributions. Lower toxin abundance is not by itself proof of chemical
    destruction, complete detoxification or field efficacy.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'CS also inhibited the reproduction of A. flavus on peanut seeds and the production of aflatoxin

      '
    explanation: 'Supports CS suppression of Aspergillus flavus reproduction and aflatoxin production on peanut
      seeds.

      '
  - reference: PMID:38520150
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: These effects are related to bacterial degradation of toxins and destruction of mycelia
    explanation: Author-reported association with degradation and mycelial damage; exact toxin-fate and mediator
      controls remain uninspected in the abstract-only review.
- name: Reported Peanut Seedling Growth Promotion
  description: The abstract concludes that inoculation with a synthetic community composed of seed bacteria promotes
    peanut seedling growth. It does not give a CS-specific growth effect size or distinguish the contribution of
    C, S and CS to that conclusion. Preserve the reported positive outcome at its stated scope without assuming
    that disease protection, SA markers or toxin suppression caused the growth response.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:38520150
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: promote the growth of peanut seedlings
    explanation: 'Supports peanut seedling growth promotion after inoculation with a seed bacterial synthetic community.

      '
