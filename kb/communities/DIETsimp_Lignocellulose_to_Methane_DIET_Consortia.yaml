  - ecological_interactions#Proposed C. aceticum to M. mazei DIET Syntrophy
  - ecological_interactions#Proposed M. mazei CO2 Reduction to Methane
  rationale: 'The complete primary abstract contains positive pH-dependent conductivity, cytochrome-associated spectral
    and metagenomic observations, but explicitly calls the methanogenic route proposed. Full Methods/Results, donor-resolved
    tracing and selective perturbations were not available in this review. Both existing arrows are retained as
    hypotheses connecting parallel donor proposals to the methanogen''s intrinsic step; neither makes one donor
    relationship depend on the other. This corrects the older no-downstream wording without asserting new structure.
    Neutral-red-mediated electron delivery or other-system demonstrations must not be imported as exact-system evidence.
    Non-graph taxon roles, mechanism language and performance-versus-protocol distinctions remain in #1373.'
  evidence:
  - reference: PMID:42229598
    supports: PARTIAL
    evidence_source: OTHER
    snippet: during anaerobic digestion of lignocellulose that S. globosa and C. aceticum metabolized intermediates
    explanation: This excerpt belongs to the abstract's explicitly proposed mechanism. It does not invalidate the
      positive community measurements, but cannot establish partner-specific direct transfer or its share of methane
      production.
