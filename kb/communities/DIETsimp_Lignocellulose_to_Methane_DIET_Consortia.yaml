ecological_interactions:
- name: Proposed S. globosa to M. mazei DIET Syntrophy
  description: HYPOTHESIZED - Sphaerochaeta globosa is proposed to participate in direct electron delivery to Methanosarcina
    mazei in the two simplified lignocellulose-digesting consortia. The abstract links the dominant bacterial pair
    collectively to intermediates including xylose, glucose, pyruvate and acetate; it does not assign every substrate
    or flux separately to this donor. Community conductivity, cytochrome-associated spectra and metagenomic profiles
    support the model but do not distinguish this route from hydrogen/formate transfer, establish obligate donor
    dependence, or trace direct electron delivery by this particular partner.
  interaction_type: SYNTROPHY
