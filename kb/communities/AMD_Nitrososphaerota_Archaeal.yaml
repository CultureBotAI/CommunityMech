    notes: 'Mesophilic ammonia-oxidizing archaea related to Nitrososphaera viennensis but adapted to acidic
      conditions (pH 3.5-5.0). Detected in AMD-impacted sediments through 16S rRNA and amoA gene sequencing,
      with OTUs clustering with acidic soil- associated Nitrososphaera lineages. These archaea possess
      similar metabolic capabilities to N. viennensis (ammonia oxidation, 3HP/4HB carbon fixation, ureolytic
      activity) but exhibit enhanced acid tolerance through unknown mechanisms, possibly involving modified
      membrane lipid composition or proton homeostasis systems. Grow as small cocci (0.7-0.9 μm diameter)
      with S-layer cell envelope. Express ammonia monooxygenase (amoA, amoB, amoC), hydroxylamine oxidoreductase,
      and urease genes. Contribute significantly to nitrification in moderately acidic AMD sites (pH 3.5-4.5)
      where conditions are less extreme than ultra-acidic biofilms. May form syntrophic relationships
      with nitrite oxidizers (Nitrospira, Leptospirillum) providing nitrite substrate. Abundance correlates
      with ammonium concentration (optimal 50-200 mg/L NH4+-N) and moderate organic matter content.

      '
