- taxon_term:
    preferred_term: Nitrospira-like nitrite oxidizer
    term:
      id: NCBITaxon:1234
      label: Nitrospira
    gtdb_grounding_status: WITHHELD
    notes: 'Nitrite-oxidizing bacteria detected in AMD sediments (pH 3.2-4.5) through nxrB gene quantification.
      These Nitrospira strains represent acidophilic or acid-tolerant lineages capable of oxidizing nitrite
      (NO2-) to nitrate (NO3-) at low pH where typical nitrite oxidizers cannot function. Act as syntrophic
      partners to archaeal ammonia oxidizers, consuming nitrite produced by AOA ammonia oxidation and
      completing the nitrification pathway. Some Nitrospira strains possess complete ammonia oxidation
      (comammox) capability, oxidizing both ammonia and nitrite to nitrate independently. Recent studies
      show comammox Nitrospira co-dominate with AOA in acidic AMD lake sediments containing high ammonium
      (380 mg/L NH4+-N). Autotrophic growth using nitrite oxidation for energy and CO2 fixation through
      reverse TCA cycle. Phylogenetically related to Leptospirillum (both in Nitrospirota phylum). Provide
      critical ecosystem service by preventing nitrite accumulation that would inhibit AOA activity. Abundance
      correlates with AOA abundance and nitrite concentration.

      '
