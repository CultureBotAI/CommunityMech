    notes: 'Cell wall-lacking archaeon (Thermoplasmatales, Thermoplasmata) found in acid mine drainage
      alongside Nitrososphaerota AOA. Grows chemomixotrophically, oxidizing ferrous iron for energy while
      consuming organic matter. In the context of the archaeal nitrifying community, Ferroplasma plays
      supporting roles: (1) processing organic matter (amino acids, cell debris, extracellular polymeric
      substances) that could inhibit AOA growth, (2) maintaining low organic carbon concentrations that
      prevent toxicity, (3) providing trace metals mobilized from mineral surfaces, and (4) creating microaerobic
      niches through oxygen consumption that may benefit microaerophilic archaea. Thrives at extremely
      low pH (0.7-2.5), providing functional overlap with AOA in moderately acidic sites. Pleomorphic
      morphology lacking peptidoglycan. Exhibits extreme metal tolerance (As, Cu, Zn). Maintains cytoplasmic
      pH ~5.6 while external pH approaches 1. Cellular machinery dominated by iron-proteins reflecting
      adaptation to metal-rich AMD. Does not perform ammonia oxidation but contributes to ecosystem stability
      by nutrient cycling and detoxification.

      '
