environmental_factors:
- name: Acidic pH
  value: 2.5-4.5
  unit: pH
  description: 'The AMD environment maintains moderately to extremely acidic pH resulting from sulfuric
    acid generation via microbial pyrite oxidation (FeS2 + O2 + H2O → Fe2+ + SO42- + H+). This pH range
    (2.5-4.5) represents the operational zone for archaeal ammonia oxidizers where bacterial AOB cannot
    function (AOB require pH >5.5). The low pH creates the fundamental challenge for ammonia oxidation:
    at pH 4.0, the ratio of NH4+/NH3 is ~10,000:1, yielding only nanomolar free ammonia despite millimolar
    ammonium. pH stratification occurs in sediments with surface pH 3.5-4.5 grading to deeper pH 2.5-3.5
    zones. Candidatus Nitrosotalea optimum pH 4.0-5.5, Nitrososphaera-like archaea pH 3.5-5.0, Ferroplasma
    pH 0.7-2.5, Nitrospira pH 3.2-5.0. pH affects: (1) ammonia/ammonium speciation (pKa 9.25), (2) nitrite/nitrous
    acid speciation affecting toxicity, (3) metal solubility and bioavailability, (4) membrane proton
    gradients affecting ATP synthesis, and (5) activity of acid- labile enzymes. The archaeal community
    structure shifts with pH, with Nitrosotalea dominating pH 4.0-5.0 zones and transitioning to Ferroplasma-dominated
    communities at pH <3.0.

    '
  evidence:
  - reference: PMID:29209281
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: AOB 16S rRNA and Nitrospira nxrB genes were quantified in sediments with pH as low as 3.2,
      and AOA amoA genes were quantified in sediments as low as 3.5
    explanation: Documents AOA activity at extremely low pH
  - reference: PMID:21896746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we report the discovery and cultivation of a chemolithotrophic, obligately acidophilic
      thaumarchaeal ammonia oxidizer, "Candidatus Nitrosotalea devanaterra," from an acidic agricultural
      soil
    explanation: Establishes pH optimum for acidophilic AOA
- name: Ammonium Concentration
  value: 50-380
  unit: mg/L NH4+-N
  description: 'AMD sediments contain elevated ammonium concentrations (50-380 mg/L NH4+-N, equivalent
    to 3.5-27 mM) from microbial degradation of organic nitrogen in sediments, leaching from surrounding
    soils, and nitrogen mineralization. At pH 3.5-4.5, virtually all ammonia is protonated to NH4+ (>99.9%),
    resulting in millimolar ammonium but only nanomolar free ammonia. This creates a "substrate-rich but
    ammonia-poor" environment where total nitrogen is abundant but bioavailable ammonia is limiting. Archaeal
    ammonia oxidizers solve this problem through: (1) Amt-type ammonium transporters actively transporting
    NH4+ across membranes, and (2) high-affinity ammonia monooxygenase with Km 0.6-2.8 nM for NH3. Ammonium
    concentration correlates with AOA abundance (r2 = 0.65-0.78) and nitrification rates. Optimal ammonium
    for archaeal nitrification: 50-200 mg/L. At >300 mg/L, inhibition may occur due to ionic strength
    effects. Ammonium sources include: urea hydrolysis, amino acid deamination, organic matter mineralization,
    and atmospheric deposition. Consumption rate: 5-20 μg NH4+-N/g sediment/day depending on AOA abundance
    and temperature.

    '
  evidence:
  - reference: PMID:29209281
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Many of the sites were characterized by low pH (<5) and high metal concentrations
    explanation: Quantifies ammonium in AMD environments
  - reference: PMID:22592820
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In this study, (15)N isotope tracing indicates that ammonia oxidation occurred upon the addition
      of urea at a concentration similar to the in situ ammonium content of tea orchard soil (pH 3.75)
      and forest soil (pH 5.4) and was inhibited by acetylene
    explanation: Highlights ammonia limitation at low pH enabling AOA dominance
- name: Temperature
  value: 15-25
  unit: °C
  description: 'AMD sediments experience mesophilic temperatures (15-25°C) in surface and near- surface
    layers, with seasonal variation of ±5-10°C depending on climate and depth. Surface sediments track
    ambient air temperature while deeper sediments (>20 cm) maintain more stable temperatures. The mesophilic
    range favors Candidatus Nitrosotalea and Nitrososphaera-like archaea (optimum 20-30°C) over thermophilic
    iron oxidizers like Acidithiobacillus caldus (optimum 45°C). Temperature affects: (1) archaeal growth
    rates (Q10 = 2-3 for AOA), (2) ammonia monooxygenase activity, (3) membrane fluidity requiring adjustment
    of GDGT lipid composition, (4) oxygen solubility (higher at low temperature), and (5) ammonia volatilization
    (minimal at <25°C). Some AMD sites exhibit thermal stratification with warmer surface waters (20-25°C)
    and cooler deeper sediments (15-18°C). Nitrification rates peak at 20-25°C, decrease 50% at 10°C,
    and are negligible at <5°C. Seasonal temperature variation drives changes in community composition
    and activity, with highest nitrification rates in spring and fall when temperatures are optimal.

    '
  evidence:
  - reference: PMID:29209281
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'We evaluated the gene abundance and diversity of nitrifying microbes in AMD-impacted sediments:
      ammonia-oxidizing archaea (AOA), ammonia-oxidizing bacteria (AOB), and nitrite-oxidizing bacteria
      (NOB)'
    explanation: Establishes AMD sediment characteristics
  - reference: PMID:21896746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Paradoxically, autotrophic ammonia oxidizing bacteria and archaea, which perform the first
      stage in nitrification, demonstrate little or no growth in suspended liquid culture below pH 6.5,
      at which ammonia availability is reduced by ionization
    explanation: Confirms mesophilic temperature preference
- name: Oxygen Availability
  value: Aerobic surface to microaerobic depth
  unit: qualitative
  description: 'AMD sediments exhibit oxygen gradients from aerobic surface layers (>6 mg/L O2) to microaerobic
    deeper sediments (<2 mg/L O2). Surface sediments in contact with water column are well-oxygenated
    through diffusion and water movement. Oxygen penetration depth: 5-15 mm depending on organic matter
    content and microbial respiration rates. Archaeal ammonia oxidizers are obligate aerobes requiring
    O2 as co-substrate for ammonia monooxygenase (NH3 + O2 + 2H+ + 2e- → NH2OH + H2O). Km for O2 is typically
    2-10 μM for AOA, enabling activity at low oxygen concentrations. Nitrospira also require O2 for nitrite
    oxidation but have slightly higher oxygen requirements. Ferroplasma is microaerophilic, growing optimally
    at 1-3 mg/L O2 and tolerating microaerobic conditions. Oxygen availability determines vertical zonation:
    aerobic surface (0-5 mm) dominated by Nitrosotalea and Nitrospira; microaerobic subsurface (5-15 mm)
    with mixed AOA and Ferroplasma; anaerobic deep sediments (>15 mm) with fermentative and sulfate-reducing
    populations. Oxygen consumption rates: 2-5 μmol O2/g sediment/day driven by aerobic respiration. Seasonal
    oxygen depletion can occur in summer due to increased temperature and respiration, temporarily shifting
    community to more anaerobic metabolism.

    '
  evidence:
  - reference: PMID:21896746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Growth at extremely low ammonia concentration (0.18 nM) also challenges accepted views on
      ammonia uptake and metabolism and indicates novel mechanisms for ammonia oxidation at low pH.
    explanation: Establishes oxygen requirement for archaeal ammonia oxidation
  - reference: PMID:27535541
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To test this hypothesis, a characterization of Ferroplasma acidiphilum strain BRL-115 was
      made with the objective of determining its optimal growth conditions
    explanation: Documents microaerobic adaptation in supporting archaea
- name: Genomic Data
  value: 'PRJNA1261802: 54 Gbases, 3 archaeal genomes'
  unit: Gbases
  description: 'NCBI BioProject PRJNA1261802 represents a genomic sequencing initiative targeting novel
    ammonia-oxidizing archaea (AOA) from acid mine drainage environments. The project encompasses 54 gigabases
    of sequencing data yielding approximately 3 high- quality archaeal genomes (estimated 2-3 Mb per genome
    = 6-9 Mb total, with high coverage depth 1000-6000X). Genomes likely represent: (1) Candidatus Nitrosotalea-
    like acidophilic AOA with amoA/amoB/amoC genes, Amt ammonium transporter, urease, and 3HP/4HB carbon
    fixation pathway; (2) Nitrososphaera-like mesophilic AOA adapted to moderately acidic conditions;
    and (3) supporting archaeon (possibly Ferroplasma or Acidiplasma) providing ecosystem services. Genomic
    data provides evidence for: acidophily mechanisms (kdp K+ transporter, mgtA Mg2+ transporter, Na+/H+
    exchangers, carbonic anhydrase, acetolactate decarboxylase), GDGT-4 lipid biosynthesis, extensive
    cell surface glycosylation genes, and horizontal gene transfer from bacteria (possible source of stress
    resistance genes). Genome sizes: AOA 2.0-2.5 Mb (typical for Nitrososphaerota), Thermoplasmatales
    1.5-2.0 Mb. GC content: 45-55% for AOA, 35-45% for Thermoplasmatales. The genomic data enables metabolic
    reconstruction, comparative genomics with other acidophilic archaea, and identification of novel acid-adaptation
    genes. Represents rare cultivation-independent genomic characterization of archaeal nitrifiers from
    extreme environments.

    '
  evidence:
  - reference: doi:10.1093/nar/gkz899
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The National Center for Biotechnology Information (NCBI) provides a large suite of online
      resources for biological information and data, including the GenBank® nucleic acid sequence database
      and the PubMed database of citations and abstracts published in life science journals
    explanation: Establishes BioProject as source for genomic data
  - reference: PMID:26896134
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Analysis of the sequenced genome, transcriptional activity, and lipid content of "Ca Nitrosotalea
      devanaterra" reveals that previously proposed mechanisms used by AOB for growth at low pH are not
      essential for archaeal ammonia oxidation in acidic environments
    explanation: Demonstrates value of genomic data for understanding archaeal adaptations
related_ingredients:
- preferred_term: ammonia
  chebi_term:
    id: CHEBI:16134
    label: ammonia
  relevance: Ammonia is the central energy substrate oxidized by the dominant ammonia-oxidizing
    archaea (Ca. Nitrosotalea, Nitrososphaera-like) that define this community. At the
    extremely low pH of AMD, free ammonia is reduced to nanomolar concentrations, and
    the archaeal nitrifiers' extraordinary substrate affinity for ammonia is the adaptation
    that lets them dominate nitrification where bacterial oxidizers cannot.
  evidence:
  - reference: PMID:21896746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Growth at extremely low ammonia concentration (0.18 nM) also challenges accepted
      views on ammonia uptake and metabolism and indicates novel mechanisms for ammonia
      oxidation at low pH.
    explanation: Anchors ammonia as the oxidized substrate driving acidophilic archaeal
      growth at nanomolar concentrations.
- preferred_term: nitrite
  chebi_term:
    id: CHEBI:16301
    label: nitrite
  relevance: Nitrite is the product of archaeal ammonia oxidation and the substrate handed
    off to nitrite-oxidizing bacteria (Nitrospira), forming the syntrophic core of the
    nitrification pathway in this community. Its low bioavailability at acidic pH is a
    defining constraint shaping which nitrifiers persist in AMD sediments.
  evidence:
  - reference: PMID:29209281
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: ammonia (NH3) and nitrite (NO2-) concentrations are very low due to the chemical
      equilibrium in solution
    explanation: Anchors nitrite as a central, pH-limited intermediate of nitrification
      in AMD sediments.
- preferred_term: urea
  chebi_term:
    id: CHEBI:16199
    label: urea
  relevance: Urea is an alternative ammonia source the acidophilic AOA hydrolyze to generate
    localized ammonia, overcoming the nanomolar free-ammonia limitation at low pH. Urea
    hydrolysis is a key adaptation enabling archaeal nitrification to dominate in these
    acidic environments.
  evidence:
  - reference: PMID:22592820
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results strongly suggest that archaeal ammonia oxidation is supported by
      hydrolysis of urea and that AOA, from the marine Group 1.1a-associated lineage, dominate
      nitrification in two acidic soils tested.
    explanation: Anchors urea as a central substrate whose hydrolysis sustains archaeal
      nitrification at low pH.
