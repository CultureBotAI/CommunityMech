discussions:
- discussion_id: kg-aggregation-and-diet-unverified
  prompt: Does spatial association or the converged population ratio causally enhance syntrophic metabolism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Population Ratio Convergence During Growth
  - ecological_interactions#Syntrophic Aggregation and Cell-to-Cell Attraction
  rationale: The former population-ratio-to-metabolism arrow described aggregation rather than its source node and
    is removed. Initial ratios were experimentally varied; the converged endpoint is not an independently manipulated
    cause. Reciprocal attraction is supported, but ultrasound and shaking change activity without changing aggregation
    tendency. The separate nanomaterial study reports acceleration and proposes DIET without a decisive demonstration.
    No new aggregation-to-metabolism direction is added.
  evidence:
  - reference: PMID:34603271
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: the tendency of microbial aggregation was not
    explanation: Aggregation tendency was unchanged despite the disturbance-associated activity change.
  - reference: doi:10.1038/s41598-018-30745-7
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Though decisive conclusion can not be made, our study tends to support the possibility of DIET in syntrophic
      oxidation of butyrate.
    explanation: The nanomaterial study explicitly qualifies DIET; it is not proof of the carrier mechanism in the
      unamended coordination assay.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  working_volume: 250.0
  working_volume_unit: mL
  controls_notes: 250 mL incubation bottles, headspace flushed with N2 for 5 min then
    adjusted to N2:CO2 80:20 (v/v) at a final pressure of 172 kPa; cocultures prepared
    by mixing log-phase syntroph with actively growing methanogen in the medium of the
    respective methanogen.
  notes: 'The bottle volume is the vessel, not the liquid charge, which the paper does
    not give — recorded because the headspace pressure and gas mix only mean something
    against a stated bottle size. The gas mix is a supply here rather than an ambient
    atmosphere: the bottles are sealed and pressurised to 172 kPa, which is above
    ambient. Note the medium is the METHANOGEN''s, not a compromise between the two
    partners, which is a real fact about how these syntrophies are set up.'
  evidence:
  - reference: PMID:34603271
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The cocultures were prepared by mixing different volumes of the log phase
      S. wolfei or S. lipocalidus with the vigorously growing M. maripaludis or M.
      conradii in the medium of the respective methanogens
  - reference: PMID:34603271
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The headspace of 250-ml incubation bottles was flushed with N2 for 5 min
      and then adjusted with N2:CO2 (80:20 [v/v]) to a final pressure of 172 kPa
