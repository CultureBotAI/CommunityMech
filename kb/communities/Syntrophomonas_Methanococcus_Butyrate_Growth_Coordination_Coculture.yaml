id: CommunityMech:000189
name: Syntrophomonas-Methanococcus Butyrate Growth Coordination Coculture
description: >
  A defined mesophilic anaerobic coculture pairing the butyrate-oxidizing
  syntroph Syntrophomonas wolfei with the hydrogenotrophic methanogen
  Methanococcus maripaludis. The system is used to study how a fatty
  acid-oxidizing bacterium and a methanogen synchronize growth, form
  syntrophic aggregates, and maintain cell-to-cell attraction during
  methanogenic butyrate conversion. It is relevant to DOE interests in
  anaerobic carbon cycling, methane production, syntrophic energy sharing, and
  engineered bioreactor microbiology.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: >
    Evaluate cell-to-cell interaction, growth synchronization, and aggregation
    between a butyrate-oxidizing syntroph and a hydrogenotrophic methanogen.
  assembly_strategy: >
    Pair Syntrophomonas wolfei with Methanococcus maripaludis as a defined
    mesophilic coculture under anaerobic butyrate-oxidizing, methanogenic
    conditions.
  perturbation_design: >
    Vary initial syntroph-to-methanogen cell ratios and apply physical
    disturbance treatments to test growth coordination and aggregate stability.
  measurement_endpoints:
  - Quantitative PCR of syntroph and methanogen populations
  - Methane and hydrogen measurements
  - Butyrate oxidation activity
  - Fluorescence in situ hybridization
  - Scanning electron microscopy
  - Microfluidic cell-to-cell attraction assays
  evidence:
  - reference: PMID:34603271
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: three experiments were conducted to evaluate the cell-to-cell interaction
    explanation: Supports the experimental objective of measuring cell-to-cell interaction.
  - reference: PMID:34603271
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mesophilic coculture consisting of Syntrophomonas wolfei and Methanococcus maripaludis
    explanation: Supports the exact two-member mesophilic coculture design.
