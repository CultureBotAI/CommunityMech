- name: Population Ratio Convergence During Growth
  description: In the mesophilic S. wolfei-M. maripaludis cultures, different starting population ratios converged
    to around one during growth. This is a community population outcome, not a second directional mutualism interaction
    or proof that the converged ratio itself accelerates metabolism.
  scope: COMMUNITY_LEVEL
