- name: Syntrophic Aggregation and Cell-to-Cell Attraction
  description: FISH and SEM showed development of mixed aggregates, while microfluidic loading in either order showed
    preferential movement toward the other partner. A same-organism control lacked that preference. This supports
    reciprocal spatial association, not a uniquely directed colonization effect. Ultrasound and shaking reduced
    methane-production activity without a detectable change in aggregation tendency; causal mediation by aggregation
    remains unresolved.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:34603271
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the second organism preferred moving to the well where the first organism was already located
    explanation: Reciprocal loading supports spatial attraction, not a one-way established benefit.
  - reference: PMID:34603271
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: although the activity of the coculture was influenced by two disturbance treatments, the tendency of
      microbial aggregation was not.
    explanation: The disturbance comparison does not isolate aggregation as the mediator of metabolic activity.
  participating_taxa:
