  rationale: 'Retain three observations and zero arrows, preserving the earlier workflow-edge deletion. Early total
    OD on supplied soluble NAG is not partner-resolved benefit or late-phase improvement. Soil-network centrality
    from pooled relative abundance is not causal interaction or keystone necessity. Canonical participants are explicitly
    incomplete, and the source Table 1 maps the Rhizobium isolate to Rhizomicrobium OTU68; no new taxon equivalence
    is asserted. Storage drift, 31-versus-35 OTUs, Sect_C_4-versus-C2 naming, herbicide dose and inconsistent positive/negative
    Methods inequalities need separate reconciliation under #1569. Whole fresh primary body and main text table
    read; figure pixels, separate supplements and raw data not audited.'
