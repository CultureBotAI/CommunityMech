ecological_interactions:
- name: Chitin-Selected MSC-1 Stabilization
  description: >
    Serial enrichment on chitin/soil-extract agar selected MSC-1 as a stable,
    naturally interacting arid-grassland soil consortium whose dominant members
    persisted through extended passaging and two storage-revival cycles.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: chitin
    term:
      id: CHEBI:17029
      label: chitin
  biological_processes:
  - preferred_term: chitin catabolic process
    term:
      id: GO:0006032
      label: chitin catabolic process
  downstream:
  - target: NAG Positive Co-Cultures
    description: >
      MSC-1 stabilization by chitin enrichment motivated pairwise tests of
      isolates growing on soluble N-acetylglucosamine, the chitin monomer.
  - target: Soil Co-Abundance Central Hubs
    description: >
      The chitin-selected MSC-1 consortium was transferred to sterile soil
      perturbation experiments whose abundance trajectories resolved central
      co-abundance hubs.
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'This consortium was re-designated: Model Soil Consortium – 1 (MSC-1).'
    explanation: Identifies MSC-1 as the stable model soil consortium selected
      for detailed interaction analysis.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Because these species were co-enriched together over a 22-week period and through
      two rounds of freezing and revival, we hypothesized that there existed metabolic
      co-dependencies within MSC-1.
    explanation: Links long-term co-enrichment and storage-revival stability to
      suspected metabolic codependencies among MSC-1 members.
- name: NAG Positive Co-Cultures
  description: >
    Pairwise MSC-1 isolate assays in M9 plus N-acetylglucosamine detected
    statistically significant positive interactions, including
    Streptomyces-Rhodococcus, Streptomyces-Variovorax, Rhizobium-Rhodococcus,
    and Ensifer-Rhodococcus co-cultures.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Rhodococcus sp.
    term:
      id: NCBITaxon:1827
      label: Rhodococcus <high G+C Gram-positive bacteria>
  - preferred_term: Streptomyces sp.
    term:
      id: NCBITaxon:1931
      label: Streptomyces sp.
  - preferred_term: Ensifer sp.
    term:
      id: NCBITaxon:1872086
      label: Ensifer sp.
  - preferred_term: Variovorax sp.
    term:
      id: NCBITaxon:1871043
      label: Variovorax sp.
  metabolites:
  - preferred_term: N-acetyl-D-glucosamine
    term:
      id: CHEBI:28009
      label: N-acetyl-beta-D-glucosamine
  biological_processes:
  - preferred_term: glucosamine catabolic process
    term:
      id: GO:0006046
      label: N-acetylglucosamine catabolic process
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Several of the combinations showed much higher growth than would be predicted including
      Streptomyces paired with Rhodococcus, Streptomyces paired with Variovorax, and
      Rhizobium paired with Rhodococcus.
    explanation: Names MSC-1 isolate pairs with higher-than-predicted biomass in
      NAG co-culture assays.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: observed Ensifer and Rhodococcus co-culture ODs were higher than predicted suggesting
      positive interactions
    explanation: Adds the Ensifer-Rhodococcus positive interaction that agreed
      between NAG co-culture and the soil co-abundance network.
- name: Soil Co-Abundance Central Hubs
  description: >
    Soil incubations across chitin, temperature, salt, and herbicide
    perturbations produced a Pearson co-abundance network whose high-centrality
    MSC-1 taxa included Rhodococcus, Mycobacterium, and Rhizobiales members.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Rhodococcus had several positive and negative correlations with other genera of
      MSC-1, including Streptomyces, Variovorax, and Delftia (negative) and Rhizobiales
      (positive).
    explanation: Supports Rhodococcus as a central MSC-1 co-abundance hub with
      multiple positive and negative correlations.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: species of the Rhodococcus, Mycobacterium and Rhizobiales genera occupied positions
      of high centrality in the network
    explanation: Names the high-centrality genera in the MSC-1 soil
      co-abundance network.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  operating_temperature: 20.0
  operating_temperature_unit: °C
  instrument_detail: >-
    Chitin/soil extract agar plates at 20 °C, with colonies re-plated onto the same medium
    until enough biomass was available. Chitin is the primary carbon and nitrogen substrate,
    chosen because it is complex enough that no single species performs every step. MSC-1
    interactions were then studied both by pairwise co-cultivation in liquid media and by
    growth in soil.
  notes: >-
    The medium is solid on purpose, and the source says why: it "helped to retain some
    physical structure needed to allow for spatial interactions between species". That is a
    design decision about what kind of community can form, not a convenience - a shaken
    liquid culture would have selected differently. Recorded because a reader seeing only
    "agar" would take it for the default.

    `system_type` is OTHER: an agar-plate consortium has no enum value, and FLASK or a reactor
    type would assert a liquid culture this is not. Same call as the cheese-rind record.

    The Mason-jar step - 100 g of sieved field soil with 0 to 100 ppm powdered chitin - is the
    enrichment the isolates came from, not the consortium's own cultivation. Same distinction
    as the Cyprus bioleaching column: sampling is the origin, plating is the cultivation.
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To collect isolates for model soil consortium-1 (MSC-1), the community was plated onto
      chitin/soil extract agar and incubated at 20°C
    explanation: Medium and temperature for the consortium itself.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The solid medium helped to retain some physical structure needed to allow for spatial
      interactions between species
    explanation: Why the medium is solid — a design choice about which interactions can occur.

