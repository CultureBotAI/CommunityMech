id: CommunityMech:000042
name: MSC-1 Dominant Core
description: >
  A naturally evolved dominant core subset of Model Soil Consortium-1
  (MSC-1), an arid-grassland soil consortium enriched through serial
  dilution and passaging on chitin as the primary carbon and nitrogen
  source. MSC-1 retained 31 bacterial OTUs, was dominated by 13 OTUs, and
  was later analyzed through N-acetylglucosamine co-cultures and soil
  co-abundance networks that highlighted Rhodococcus, Mycobacterium, and
  Rhizobiales lineages.
