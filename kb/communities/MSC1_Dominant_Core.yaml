ecological_interactions:
- name: Chitin-Selected MSC-1 Stabilization
  description: Chitin-selected MSC-1 retained a broadly similar composition across prolonged passaging and storage-revival
    cycles, with residual drift rather than invariant membership. The selected consortium had 31 detected bacterial
    OTUs in Table 1 and Results, with its top 13 accounting for over 98% of reads; other source passages say approximately
    35. The nine canonical participants represent an incomplete roster, not a defined nine-strain mixture. HYPOTHESIZED
    - repeated co-enrichment could reflect metabolic codependencies, but persistence and selection on chitin/soil-extract
    agar do not demonstrate obligate dependence, niche partitioning or measured chitin turnover.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: chitin
    term:
      id: CHEBI:17029
      label: chitin
    notes: Selection-substrate context, not a directly quantified chitin-consumption or partner-transfer endpoint.
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'This consortium was re-designated: Model Soil Consortium – 1 (MSC-1).'
    explanation: Identifies the selected MSC-1 consortium; persistence and residual compositional drift are described
      in the primary Results, not evidence for metabolic necessity.
  - reference: PMID:32983014
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Because these species were co-enriched together over a 22-week period and through two rounds of freezing
      and revival, we hypothesized that there existed metabolic co-dependencies within MSC-1.
    explanation: The authors explicitly hypothesize codependencies from repeated co-enrichment; no selective dependence
      test is supplied by this excerpt.
  participating_taxa:
