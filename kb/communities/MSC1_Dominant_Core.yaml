growth_media:
- name: chitin/soil-extract agar (100 ppm shrimp-shell chitin)
  temperature: '20'
  temperature_unit: °C
  light_regime: dark
  vessel_type: agar plate
  preparation_notes: Enriched from arid grassland soil with chitin as the main carbon
    and nitrogen source; field soil incubated 7 months at 20°C in the dark with 100
    ppm chitin, then serially diluted in PBS and plated on chitin/soil-extract agar
    and grown ~1 week at 20°C. Pairwise interactions were assayed in M9 minimal liquid
    medium with 10 mM N-acetylglucosamine, shaken at 24°C for 5 days. Consortia stored
    as glycerol or lyophilized stocks at −80°C.
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Samples were collected from an arid grassland soil and microbial communities
      (consisting mainly of bacterial species) were enriched on agar plates containing
      chitin as the main carbon source.
    explanation: Names chitin agar as the enrichment/cultivation medium for the consortium.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The soil samples were incubated for 7 months at 20°C in the dark, with
      respiration used to monitor bioactivity once a week
    explanation: Gives the 20°C, dark enrichment incubation conditions.
