- name: NAG Positive Co-Cultures
  description: Pairwise isolates in M9 with 10 mM soluble N-acetylglucosamine (NAG) showed higher early-exponential
    optical density than the expected average of the two corresponding monocultures (p < 0.01 for reported positive
    comparisons). Named examples include Streptomyces-Rhodococcus, Streptomyces-Variovorax, Rhizobium-Rhodococcus
    and Ensifer-Rhodococcus. The difference was not significant in late exponential phase. Total OD does not resolve
    each partner biomass, reciprocal benefit or obligate syntrophy, and these NAG assays do not measure chitin-polymer
    degradation. The four canonical participants are a partial set of the named positive pairs; the source Rhizobium
    isolate is not canonically resolved here, and V4 does not distinguish which Ensifer OTU matches the isolate.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Rhodococcus sp.
    term:
      id: NCBITaxon:1827
      label: Rhodococcus <high G+C Gram-positive bacteria>
  - preferred_term: Streptomyces sp.
    term:
      id: NCBITaxon:1931
      label: Streptomyces sp.
  - preferred_term: Ensifer sp.
    term:
      id: NCBITaxon:1872086
      label: Ensifer sp.
  - preferred_term: Variovorax sp.
    term:
      id: NCBITaxon:1871043
      label: Variovorax sp.
  metabolites:
  - preferred_term: N-acetyl-D-glucosamine
    term:
      id: CHEBI:28009
      label: N-acetyl-beta-D-glucosamine
    notes: Supplied soluble NAG substrate, not proven interspecies donation. The retained beta-anomer grounding
      is not independently recertified by this assay review.
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Several of the combinations showed much higher growth than would be predicted including Streptomyces
      paired with Rhodococcus, Streptomyces paired with Variovorax, and Rhizobium paired with Rhodococcus.
    explanation: Supports the named early-exponential total-OD association. The whole primary text states no significant
      late-exponential difference; individual partner benefit or transfer is unresolved.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: observed Ensifer and Rhodococcus co-culture ODs were higher than predicted suggesting positive interactions
    explanation: Supports the named early-exponential total-OD association. The whole primary text states no significant
      late-exponential difference; individual partner benefit or transfer is unresolved.
- name: Soil Co-Abundance Central Hubs
  description: A Pearson network pooled normalized relative 16S abundances across soil-incubation conditions, replicate
    samples and time points. Rhodococcus, Mycobacterium and Rhizobiales-associated OTUs had high betweenness centrality.
    Rhizobiales is an order, not a genus or a verified isolate identity. The two explicit canonical participants
    identify the named Rhodococcus and Mycobacterium subset, not every hub. Positive and negative co-abundance associations
    can reflect common environmental or temporal responses; they do not establish pairwise facilitation, competition,
    niche partitioning or keystone necessity. Soil chitin and liquid NAG assays are distinct contexts, and their
    partly matching correlation signs do not establish a shared mechanism.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Rhodococcus had several positive and negative correlations with other genera of MSC-1, including Streptomyces,
      Variovorax, and Delftia (negative) and Rhizobiales (positive).
    explanation: Supports network associations computed from relative abundance data, not experimentally perturbed
      interactions. The source calls Rhizobiales a genus, but it is an order.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: species of the Rhodococcus, Mycobacterium and Rhizobiales genera occupied positions of high centrality
      in the network
    explanation: Supports network associations computed from relative abundance data, not experimentally perturbed
      interactions. The source calls Rhizobiales a genus, but it is an order.
  participating_taxa:
  - preferred_term: Rhodococcus sp.
    term:
      id: NCBITaxon:1827
      label: Rhodococcus <high G+C Gram-positive bacteria>
  - preferred_term: Mycobacterium sp.
    term:
      id: NCBITaxon:1785
      label: Mycobacterium sp.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  operating_temperature: 20.0
  operating_temperature_unit: °C
  instrument_detail: >-
    Chitin/soil extract agar plates at 20 °C, with colonies re-plated onto the same medium
    until enough biomass was available. Chitin is the primary carbon and nitrogen substrate,
    chosen because it is complex enough that no single species performs every step. MSC-1
    interactions were then studied both by pairwise co-cultivation in liquid media and by
    growth in soil.
  notes: >-
    The medium is solid on purpose, and the source says why: it "helped to retain some
    physical structure needed to allow for spatial interactions between species". That is a
    design decision about what kind of community can form, not a convenience - a shaken
    liquid culture would have selected differently. Recorded because a reader seeing only
    "agar" would take it for the default.

    `system_type` is OTHER: an agar-plate consortium has no enum value, and FLASK or a reactor
    type would assert a liquid culture this is not. Same call as the cheese-rind record.

    The Mason-jar step - 100 g of sieved field soil with 0 to 100 ppm powdered chitin - is the
    enrichment the isolates came from, not the consortium's own cultivation. Same distinction
    as the Cyprus bioleaching column: sampling is the origin, plating is the cultivation.
  evidence:
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To collect isolates for model soil consortium-1 (MSC-1), the community was plated onto
      chitin/soil extract agar and incubated at 20°C
    explanation: Medium and temperature for the consortium itself.
  - reference: PMID:32983014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The solid medium helped to retain some physical structure needed to allow for spatial
      interactions between species
    explanation: Why the medium is solid — a design choice about which interactions can occur.

