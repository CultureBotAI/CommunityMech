id: CommunityMech:000409
name: Wheat SynCom-SASW01 Drought-Resistance Inoculant
description: A five-strain bacterial synthetic community composed of Enterobacter hormaechei FN0603, Enterobacter cloacae
  FWP0601, Enterobacter ludwigii FWP1205, Pseudomonas putida FWP0405, and Stenotrophomonas maltophilia HLPD6. Yu et al. activated
  each stored strain on R2A agar, verified species identity by 16S rRNA V5-V7 sequencing, normalized the strains to OD600
  1.0, and mixed the suspensions at an equal 1:1:1:1:1 ratio to assemble SynCom-SASW01. The study applied the consortium alone
  or as a biochar-based wheat seed coating under drought stress, then measured wheat growth, rhizosphere nutrients, root-associated
  microbiomes, antioxidant physiology, and dual-site field yield.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Test whether the stress-tolerant plant-growth-promoting SynCom-SASW01 reshapes the wheat rhizosphere/endosphere
    system and improves wheat drought resistance.
  assembly_strategy: Retrieve Enterobacter hormaechei FN0603, Enterobacter cloacae FWP0601, Enterobacter ludwigii FWP1205,
    Pseudomonas putida FWP0405, and Stenotrophomonas maltophilia HLPD6 from frozen storage, activate each strain on R2A agar,
    confirm species identity by 16S rRNA gene sequencing, and mix standardized suspensions at an equal 1:1:1:1:1 volume ratio.
  inoculation_strategy: Apply SynCom-SASW01 either by seed soaking or as the biological component of a wheat seed coating
    containing biochar, maltodextrin, trehalose, phosphorus/potassium mineral powder, molasses, fulvic acid, and potassium
    silicate.
  perturbation_design: Compare untreated, chemical-coating-only, SynCom seed-soaking, and SynCom-containing biological coating
    treatments in a moderate-drought pot experiment; compare control and SynCom-SASW01 biological coating treatments at two
    arid Inner Mongolia field sites.
  measurement_endpoints:
  - Wheat seedling growth and chlorophyll under drought stress
  - Wheat root osmolytes and antioxidant enzyme activities
  - Rhizosphere soil relative water content and nutrients
  - Endosphere and rhizosphere amplicon profiles
  - Predicted root-associated MetaCyc pathway abundance
  - Hohhot and Hulunbuir wheat grain yield
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Five target bacterial strains (E. hormaechei FN0603, E. cloacae FWP0601, E. ludwigii FWP1205, P. putida FWP0405,
      and S. maltophilia HLPD6)
    explanation: Names the five bacterial strains used to assemble SynCom-SASW01.
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The optical density at 600 nm (OD600) was measured using a spectrophotometer(Shanghai INESA Scientific Instrument
      Co., Ltd., Shanghai, China) and adjusted to 1.0 ± 0.1
    explanation: Supports OD600 normalization before the standardized strains were mixed into SynCom-SASW01.
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: standardized bacterial suspensions were mixed at an equal 1:1:1:1:1 (v/v) ratio and vortexed thoroughly to assemble
      the synthetic community, SynCom-SASW01
    explanation: Supports the equal-volume five-strain assembly procedure.
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Four experimental groups were established: NC (negative control, no treatment), CC (chemical coating only, without
      SynCom-SASW01), BC (seed-soaking with SynCom-SASW01 only), and BCC'
    explanation: Supports the pot-assay comparison among untreated, coating-only, SynCom-only, and SynCom biological-coating
      treatments.
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Comparative field trials were conducted at typical arid experimental sites in Hohhot (41°11′55″ N, 111°39′52″
      E) and Hulunbuir (50°11′54″ N, 120°02′02″ E), Inner Mongolia.
    explanation: Supports the dual-site arid-field trial design.
