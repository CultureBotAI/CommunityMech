ecological_interactions:
- name: EPS-associated rhizosphere water retention
  description: SynCom-SASW01 treatment ameliorated drought-induced water deficits and was interpreted to stabilize the rhizosphere
    in part through exopolysaccharide secretion by core community members.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom-SASW01 treatment significantly ameliorated drought-induced water deficits, which may be partly attributable
      to the EPS secretion capacity of the consortium’s core members.
    explanation: Supports the paper's community-level interpretation that EPS-producing SynCom-SASW01 members helped improve
      rhizosphere water retention.
- name: SynCom-SASW01 root endosphere reshaping
  description: The SynCom-SASW01 biological coating reorganized wheat root-associated bacterial communities under drought
    stress and especially shifted the root endosphere.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the exogenous synthetic community efficiently colonized the endosphere and promoted the enrichment of keystone
      genera such as Pseudomonas.
    explanation: Supports SynCom-SASW01 endosphere colonization and enrichment of Pseudomonas-associated beneficial taxa after
      inoculation.
environmental_factors:
- name: Host crop
  value: Triticum aestivum
  description: Wheat was the crop host assayed in greenhouse drought-stress pots and in the Hohhot/Hulunbuir field trials.
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: enhancing drought resistance in wheat (Triticum aestivum L.).
    explanation: Identifies wheat as the plant host used to test SynCom-SASW01.
- name: Moderate pot drought
  value: 50-60
  unit: percent relative water content
  description: The greenhouse pot experiment maintained the substrate at 50-60% relative water content with Hoagland nutrient
    solution under moderate drought stress.
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Moisture was adjusted using Hoagland nutrient solution (pH 7.0) to maintain 50–60% relative water content (RWC),
      representing moderate drought stress.
    explanation: Supports the greenhouse drought-stress water regime.
growth_media:
- name: R2A agar strain activation
  ph: 7.0
  temperature: 28
  temperature_unit: °C
  incubation_time: 24
  incubation_time_unit: h
  vessel_type: agar plate
  preparation_notes: Each thawed SynCom-SASW01 strain was streaked onto pH 7.0 R2A agar before single colonies were selected
    for genomic DNA extraction and inoculum standardization.
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A 10 μL aliquot of each bacterial suspension was inoculated onto R2A agar medium (20 g·L−1, pH 7.0) and incubated
      at 28 °C for 24 h
    explanation: Supports the strain activation medium and incubation conditions.
- name: SynCom-SASW01 biological seed coating
  vessel_type: wheat seed coating
  preparation_notes: The biological coating mixed SynCom-SASW01 with biochar, maltodextrin, trehalose, phosphorus and potassium
    mineral powder, molasses, fulvic acid, and potassium silicate, then applied the matrix to wheat seed at 1:20 w/w.
  evidence:
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: adsorbent (biochar), binder (maltodextrin), biopriming agent (trehalose), and additives (including phosphorus
      and potassium mineral powder, molasses, fulvic acid, and potassium silicate) with the SynCom-SASW01 suspension
    explanation: Names the coating matrix used to deploy SynCom-SASW01 onto wheat seeds.
  - reference: PMID:42513902
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The coating matrix was applied to wheat seeds at a 1:20 (w/w) mass ratio.
    explanation: Supports the coating-to-seed application ratio.
