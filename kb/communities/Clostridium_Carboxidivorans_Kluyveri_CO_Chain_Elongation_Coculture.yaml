id: CommunityMech:000266
name: Clostridium carboxidivorans-Clostridium kluyveri CO Chain-Elongation Coculture
description: >
  A defined anaerobic synthetic coculture pairing the autotrophic solventogenic
  acetogen Clostridium carboxidivorans with the chain-elongating bacterium
  Clostridium kluyveri. In CO/CO2-fed stirred-tank bioreactors, C. kluyveri
  elongates C2 products to organic acids, and C. carboxidivorans reduces those
  acids to longer-chain alcohols such as butanol and hexanol. The system is
  DOE-relevant because it couples waste-gas/syngas fermentation, carbon
  utilization, and production of liquid fuels and platform chemicals.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Convert CO-rich gas into longer-chain alcohols by coupling autotrophic
    acetogenesis/solventogenesis with microbial chain elongation.
  assembly_strategy: >
    Assemble a bottom-up two-species clostridial coculture from C.
    carboxidivorans and C. kluyveri in anaerobic stirred-tank bioreactors with
    continuous CO/CO2 gas supply.
  perturbation_design: >
    Compare CO partial pressures, pH, sulfide supply, and batch versus
    continuously operated stirred-tank reactor cascades to identify conditions
    supporting both chain elongation and alcohol formation.
  measurement_endpoints:
  - species-resolved cell counts by FISH-FC
  - CO conversion
  - acetate and ethanol concentrations
  - butyrate and hexanoate concentrations
  - butanol and hexanol concentrations
  - alcohol-to-acid ratios
  evidence:
  - reference: PMID:34669248
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Synthetic co-cultures with identical initial cell concentrations of Clostridium carboxidivorans and Clostridium kluyveri were studied
    explanation: Supports the exact two-species synthetic coculture and controlled bioreactor study design.
  - reference: PMID:37110426
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a continuously operated cascade of two stirred-tank reactors was established with a synthetic co-culture of both Clostridia
    explanation: Supports the follow-up continuous reactor design for the same C. carboxidivorans/C. kluyveri clostridial coculture.
