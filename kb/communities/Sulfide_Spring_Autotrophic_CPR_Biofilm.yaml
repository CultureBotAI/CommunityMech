    encoded metabolic potential; the two former spatial arrows are removed while preserving the observations and
    source hypotheses. Canonical taxonomy and graph references need a coordinated identity repair; this record remains
    needs_research.
  evidence:
  - reference: PMID:38273328
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: our attempts to perform fluorescent in situ hybridization to determine CPR bacterial identity were
      unsuccessful due to low amount of material, so this inference remains tentative.
    explanation: States the unresolved identification boundary directly.
  - reference: PMID:38273328
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The most abundant species in MS4 shares genome-wide average 51% amino acid similarity with the sulfur-oxidizer
      Thiothrix nivea
    explanation: The source describes similarity to a reference species, not identity as that species.
