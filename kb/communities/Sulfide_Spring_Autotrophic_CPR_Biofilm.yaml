- name: Putative CPR association with sulfur-oxidizing filaments
  description: 'HYPOTHESIZED/PARTIAL: small cells occur near or on sulfur-bearing filaments, and the authors propose
    that some are CPR episymbionts. Attempts to identify CPR cells by FISH were unsuccessful, so the observed cells,
    their hosts and the fitness consequences remain unresolved. The source/target links retain legacy canonical
    cross-references for this proposed association; they do not verify a CPR-Thiothrix nivea pair. A possible cryptic
    sulfur-cycling symbiosis remains a source hypothesis, not demonstrated exchange.'
