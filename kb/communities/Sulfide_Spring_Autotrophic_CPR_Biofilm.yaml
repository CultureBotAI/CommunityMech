    from the MS4 and MS11 spring biofilms, consistent with sulfur oxidation. Primary Table S4 supports Thiothrix
    genus attribution for the named MS4 bin, with no species assignment. HYPOTHESIZED/PARTIAL: this is not identification
    of the imaged cells; Thiothrix nivea is not established. The Beggiatoa-related canonical participant remains
    unresolved because the supplementary classification leaves genus blank. These observations do not demonstrate
    commensalism or neutral effects on a host.'
