id: CommunityMech:000222
name: Sulfide Spring Autotrophic CPR-Hosting Biofilm
description: >
  An autotrophic biofilm community in sulfide-rich springs sustained by deeply
  sourced groundwater. Genome-resolved metagenomics combined with bulk
  geochemistry and scanning transmission X-ray microscopy (STXM) at room
  temperature and 87 K reveals biofilms dominated by chemolithotrophic
  sulfur-oxidizing bacteria including Thiothrix and Beggiatoa, with diverse
  Candidate Phyla Radiation (CPR) bacteria (Gracilibacteria, Absconditabacteria,
  Saccharibacteria, Peregrinibacteria, Berkelbacteria, Microgenomates,
  Parcubacteria). STXM imaging shows ultra-small cells adhered near filamentous
  bacteria, suggesting CPR episymbiosis. Carbon K and sulfur L2,3 edge NEXAFS
  spectroscopy indicates that filamentous bacteria contain protein-encapsulated
  elemental sulfur granules consistent with Thiothrix-like sulfur oxidation,
  and Berkelbacteria and Moranbacteria are predicted to encode a novel electron
  bifurcation system.
