- name: Filamentous Sulfur Oxidation with Encapsulated S Granules
  description: 'STXM and sulfur-edge spectroscopy show protein-associated elemental sulfur granules in filaments
    from the MS4 and MS11 spring biofilms, consistent with sulfur oxidation. The authors infer Thiothrix-like and
    Beggiatoa-related identities from the surrounding community evidence. HYPOTHESIZED/PARTIAL: the legacy canonical
    participant links do not identify the imaged cells, and NCBITaxon:1031 is not established for the MS4 lineage.
    These observations do not demonstrate commensalism or neutral effects on a host.'
