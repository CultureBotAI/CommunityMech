  - ecological_interactions#Predicted CPR sulfur and hydrogen metabolic capacity
  rationale: 'Table S4 resolves the MS4 Thiothrix bin to genus, not species, consistent with the reported 51% average
    amino-acid similarity to T. nivea. Canonical taxonomy and both Thiothrix graph links now use NCBITaxon:1030.
    The named dominant MS11 Beggiatoa-related bin is classified within Beggiatoaceae with empty genus and species,
    and other related bins lack a family assignment. The legacy Beggiatoa genus link is not recertified; source-specific
    reconciliation with NCBI remains necessary. FISH did not resolve CPR identity, and proximity does not establish
    metabolic exchange. Issue #1841 and needs_research remain open. Non-graph functional-role and ingredient assertions
    are outside this partial identity repair.'
  evidence:
  - reference: PMID:38273328
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: our attempts to perform fluorescent in situ hybridization to determine CPR bacterial identity were
      unsuccessful due to low amount of material, so this inference remains tentative.
    explanation: States the unresolved identification boundary directly.
  - reference: PMID:38273328
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The most abundant species in MS4 shares genome-wide average 51% amino acid similarity with the sulfur-oxidizer
