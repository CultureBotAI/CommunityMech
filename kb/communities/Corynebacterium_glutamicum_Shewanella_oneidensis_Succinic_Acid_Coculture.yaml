      label: tricarboxylic acid cycle
  downstream:
  - target: Enhanced Succinic Acid Production
    description: PARTIAL - the transcript-based interpretation is consistent with metabolic changes contributing
      to increased succinic acid yield. Positive coculture, riboflavin and ldhA-deletion outcomes support the production
      strategy, but do not selectively establish this transcript response or inferred flux redistribution as the
      mediator of each yield comparison.
  evidence:
  - reference: PMID:42203120
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Transcriptomic analysis revealed that co-culture induced global metabolic reprogramming in C. glutamicum,
      including reinforcement of the electron transport system, redistribution of carbon flux toward the reductive
      TCA pathway
    explanation: Supports the authors' transcriptomic interpretation of metabolic reprogramming, not direct flux
      measurement or a resolved Shewanella-to-Corynebacterium transfer mechanism.
- name: Enhanced Succinic Acid Production
  description: The abstract reports an optimized parent-strain coculture yield of 0.169 g/g, 45.65% above monoculture
    without markedly changing glucose consumption. Separately, ldhA deletion abolished lactate formation in K1;
    its coculture reached 0.686 g/g and showed up to 23.4% higher yield during extended fermentation than monoculture.
    These positive interventions do not establish thermodynamic syntrophy or assign the parent-strain result to
    K1.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Corynebacterium glutamicum (ldhA-deleted strain K1)
    term:
      id: NCBITaxon:1718
      label: Corynebacterium glutamicum
  - preferred_term: Shewanella oneidensis
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
