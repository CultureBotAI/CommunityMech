ecological_interactions:
- name: Riboflavin-Supplemented Coculture Response
  description: The complete abstract reports that externally supplied riboflavin was the most effective of five
    screened redox-active additives, with 0.1 mM supplementation further improving coculture production. This supports
    an additive response, not demonstrated Shewanella secretion, directed interspecies electron transfer or thermodynamic
    syntrophy. Parent-strain and K1 experiments must be distinguished; the abstract does not resolve every additive/transcript
    assay to K1.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: riboflavin
    term:
      id: CHEBI:17015
      label: riboflavin
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  downstream:
  - target: Corynebacterium Coculture Transcript Response
    description: HYPOTHESIZED - altered coculture redox conditions could contribute to the Corynebacterium transcript
      response. Additive screening and the transcriptomic interpretation support this candidate link, but the accessible
      abstract does not selectively establish riboflavin-dependent electron transfer as its cause.
  evidence:
  - reference: PMID:42203120
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Screening of five redox-active compounds identified riboflavin as the most effective additive, and
      supplementation with 0.1 mM riboflavin further improved production performance.
    explanation: Supports the externally supplied riboflavin intervention and improved production, not a demonstrated
      donor-to-recipient electron flux or endogenous riboflavin exchange.
