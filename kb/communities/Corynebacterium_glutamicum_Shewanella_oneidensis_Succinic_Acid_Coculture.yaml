id: CommunityMech:000294
name: Corynebacterium glutamicum + Shewanella oneidensis Succinic-acid Co-culture
description: Engineered two-member co-culture pairing the succinic-acid producer Corynebacterium
  glutamicum (including an ldhA-deleted, lactate-deficient strain K1) with the electroactive
  bacterium Shewanella oneidensis to enhance anaerobic succinic acid biosynthesis through
  interspecies interactions. Co-cultivation raised succinic acid yield markedly over monoculture
  without altering glucose consumption, and supplementation with riboflavin (the most effective
  of five screened redox-active additives) further improved production. Transcriptomics showed
  co-culture reprogrammed C. glutamicum metabolism, reinforcing its electron transport system and
  redistributing carbon flux toward the reductive TCA pathway.
