  description: Coculture changed C. glutamicum transcript profiles, interpreted by the authors as enhanced electron
    transport, redistribution toward the reductive TCA pathway and suppression of succinic-acid-consuming pathways.
    This is transcript-based metabolic interpretation, not directly traced carbon or electron flux. The canonical
    entry includes K1; the abstract does not identify the strain used for every transcript comparison.
