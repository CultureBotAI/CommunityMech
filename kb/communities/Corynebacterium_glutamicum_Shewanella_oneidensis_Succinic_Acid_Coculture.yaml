    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The engineered strain maintained enhanced succinic acid production in the co-culture system, reaching
      a yield of 0.686 g/g
    explanation: Supports the K1 coculture production outcome. The complete abstract separately reports parent-strain,
      riboflavin and ldhA-deletion comparisons; it does not establish the direction of interspecies electron flux.
