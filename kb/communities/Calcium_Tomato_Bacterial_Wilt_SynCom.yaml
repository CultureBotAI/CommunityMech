discussions:
- discussion_id: calcium_tomato_syncom_interstrain_mechanism
  prompt: >-
    Which SynCom members directly drive the Ralstonia solanacearum density drop
    in calcium-conditioned tomato root exudate, and is suppression mediated by
    antibiotic antagonism, calcium/root-metabolite competition, or both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions
  rationale: >-
    Bi et al. showed that all four isolates antagonized Ralstonia solanacearum
    and that the SynCom plus calcium-conditioned tomato root exudates reduced
    Ralstonia density. The paper also reports pairwise plate assays and
    predicted plant-growth-promoting genes, but it did not resolve
    member-to-member metabolic exchange or show which SynCom strain directly
    caused the Ralstonia drop in root-exudate co-culture. Barcode-tracked
    single, triple-dropout, and full four-member SynComs in the 20 mM
    calcium-conditioned root-exudate assay would resolve the member-level
    contributions.
  posed_by: codex
  posed_date: '2026-09-20'
curation_history:
- timestamp: '2026-09-20T12:09:26Z'
  curator: codex
  action: CREATE_RECORD
  changes: >-
