id: CommunityMech:000393
name: Calcium-Tomato Bacterial Wilt SynCom
description: >-
  A four-member tomato-root SynCom assembled from calcium-enriched antagonists
  to suppress Ralstonia solanacearum bacterial wilt. Bi et al. isolated Dyella
  japonica, Rhodanobacter glycinis, Paenibacillus polymyxa, and Pseudomonas
  aeruginosa from tomato roots after calcium chloride amendment, selected them
  because they antagonized R. solanacearum, were promoted by calcium or
  calcium-induced root metabolites, and encoded plant-growth-promoting traits,
  and mixed OD600-normalized LB-grown suspensions 1:1:1:1. In 96-well
  root-exudate co-culture assays, the SynCom plus exudates from 20 mM
  calcium-treated tomato seedlings reduced R. solanacearum density; in
  greenhouse soil, the SynCom combined with a reduced 100 mg Ca kg-1 soil dose
  dropped bacterial wilt incidence from 74.07% to 0%.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Assemble calcium-stimulated, tomato-root bacterial antagonists into a
    synthetic community that suppresses Ralstonia solanacearum and reduces the
    calcium fertilizer dose required for bacterial-wilt control.
  assembly_strategy: >-
    Select the four root-derived isolates that were significant predictors of
    pathogen suppression, antagonized R. solanacearum on plates, were promoted
    by calcium or calcium-induced root metabolites, and carried predicted
    plant-growth-promoting traits; then mix Dyella japonica, Rhodanobacter
    glycinis, Paenibacillus polymyxa, and Pseudomonas aeruginosa 1:1:1:1 after
    OD600 normalization.
  inoculation_strategy: >-
    Culture each member in LB liquid medium, wash and resuspend pellets in
    sterile double-distilled water, adjust each suspension to OD600 1, and mix
    the four suspensions in equal volumes for soil inoculation; for
    root-exudate co-culture, mix equal volumes of the four members to an OD600
    of 0.1 +/- 0.05 before adding 10 uL of SynCom to 1/2 NB plus 10 uL of
    Ralstonia solanacearum P380 suspension and 30 uL of tomato root exudate.
  perturbation_design: >-
    Screen CaCl2, salicylic acid, sucrose, trehalose, and calcium-treated tomato
    root exudates for differential promotion of SynCom members versus R.
    solanacearum; then compare no calcium/no SynCom, SynCom alone, 100 mg Ca
    kg-1 soil alone, and 100 mg Ca kg-1 soil plus SynCom in a tomato pot
    experiment challenged with R. solanacearum.
  measurement_endpoints:
  - SynCom member growth in calcium- or metabolite-supplemented medium
  - Ralstonia solanacearum P380 growth and qPCR density in root-exudate co-culture
  - pairwise inhibition among SynCom members
  - bacterial wilt incidence in tomato pot trials
  - predicted phosphorus mobilization, siderophore, IAA, and stress-resistance genes
  evidence:
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We constructed a bacterial SynCom consisting of four root-derived strains
      identified in this study: Dyella japonica, Rhodanobacter glycinis,
      Paenibacillus polymyxa, and Pseudomonas aeruginosa.
    explanation: Names the four calcium-stimulated root-derived strains assembled into
      the SynCom.
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These strains were selected for SynCom construction based on they: (1)
      were ranked as significant predictors of pathogen suppression in the
      Random Forest analysis
    explanation: Supports the function-guided SynCom selection strategy.
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The four suspensions were then mixed in equal volumes (1:1:1:1) to create
      the final synthetic bacterial inoculum.
    explanation: Supports the equal-volume 1:1:1:1 SynCom assembly ratio.
