ecological_interactions:
- name: Calcium and root-metabolite selective promotion
  description: >-
    Calcium chloride, salicylic acid, sucrose, and trehalose favored the four
    SynCom members relative to Ralstonia solanacearum P380 by inhibiting the
    pathogen while promoting beneficial isolates to varying extents.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: salicylic acid
    term:
      id: CHEBI:16914
      label: salicylic acid
  - preferred_term: sucrose
    term:
      id: CHEBI:17992
      label: sucrose
  - preferred_term: trehalose
    term:
      id: CHEBI:27082
      label: trehalose
  - preferred_term: calcium chloride
    term:
      id: CHEBI:3312
      label: calcium dichloride
  downstream:
  - target: Calcium-conditioned root-exudate pathogen suppression
    description: >-
      Calcium-induced root exudates carried the same selective pressure into a
      Ralstonia/SynCom co-culture, where they reduced pathogen density.
  evidence:
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ca supplementation significantly (one-way ANOVA: p < 0.05) inhibited the
      growth of R. solanacearum while enhancing the growth of the four
      beneficial strains
    explanation: Supports calcium as directly favoring the SynCom members over
      R. solanacearum in vitro.
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      higher concentrations of key metabolites (SA, sucrose, and trehalose)
      inhibited the growth of R. solanacearum and simultaneously promoted the
      proliferation of beneficial microbes
    explanation: >-
      Supports calcium-induced root metabolites as additional selective
      promoters of beneficial SynCom members over the pathogen.
- name: Calcium-conditioned root-exudate pathogen suppression
  description: >-
    Whole root exudates collected from 20 mM calcium-treated tomato seedlings
    worked with the equal-volume SynCom to reduce Ralstonia solanacearum P380
    density in 1/2 NB co-culture.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Calcium-SynCom bacterial wilt control
    description: >-
      The low-dose calcium plus SynCom pot treatment translated the exudate
      co-culture antagonism into tomato bacterial-wilt suppression.
  evidence:
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whole root exudates from Ca-treated plants (20 mM) significantly
      inhibited R. solanacearum growth while promoting the growth of beneficial
      microbes such as Paenibacillus polymyxa
    explanation: >-
      Supports 20 mM calcium-conditioned tomato root exudates as inhibiting the
      pathogen while promoting at least one SynCom member.
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the addition of whole root exudates from 20 mM Ca-treated plants led to a
      significant reduction in R. solanacearum density
    explanation: >-
      Supports reduced Ralstonia density when the SynCom and
      calcium-conditioned root exudates were combined.
- name: Calcium-SynCom bacterial wilt control
  description: >-
    Adding the four-member SynCom one week after Ralstonia solanacearum
    challenge synergized with 100 mg Ca kg-1 soil, a reduced calcium chloride
    amendment, to eliminate tomato bacterial wilt incidence in the controlled
    pot assay.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:41387930
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: with wilt incidence dropping from 74.07 to 0%
    explanation: >-
      Supports complete bacterial-wilt incidence control in the low-dose
      calcium plus SynCom pot treatment.
