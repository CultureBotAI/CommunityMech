  - target: Predicted Emergent Nitrogen and Metabolite Cross-Feeding
    description: HYPOTHESIZED - because enhanced coculture growth of both species cannot be fully explained by in situ O2
      and CO2 exchange alone, genome-scale modeling (SteadyCom and DynamiCom) predicts emergent exchange of ammonium, organic
      acids, and amino acids between A. platensis and M. buryatense 5GB1.
  evidence:
  - reference: doi:10.20517/mrr.2023.70
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In our previous work, we have demonstrated that for the coculture of Methylomicrobium buryatense (M. buryatense)
      5GB1 - Arthrospira platensis (A. platensis), the enhanced growth observed for both species in the coculture cannot be
      fully explained by the in-situ exchange of O2 and CO2, confirming the existence of other unknown metabolic interactions
      for the coculture
    explanation: Supports both the coupled O2/CO2 gas exchange in the M. buryatense 5GB1 - A. platensis coculture and the
      finding that enhanced growth of both partners exceeds what O2/CO2 exchange alone explains.
  - reference: PMID:35295538
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Through metabolic coupling of methane oxidation and oxygenic photosynthesis, methanotroph-photoautotroph (M-P)
      cocultures offer a highly promising technology platform for biogas conversion
    explanation: Supports the reciprocal coupling of methane oxidation and oxygenic photosynthesis for biogas conversion.
- name: Predicted Emergent Nitrogen and Metabolite Cross-Feeding
  description: HYPOTHESIZED - genome-scale metabolic modeling (SteadyCom and DynamiCom) constrained by experimental growth
    and gas-exchange kinetics predicts that Arthrospira platensis and Methylomicrobium buryatense 5GB1 exchange non-gaseous
    metabolites, with succinate, ammonium, pyruvate, formate, citrate, sucrose, glutamine, and glutamate ranked as the top
    eight exchanged metabolites. DynamiCom further predicts a temporal nitrogen shift in which M. buryatense 5GB1 transitions
    after approximately 45 h from co-consuming medium nitrate and cyanobacterial ammonium to exclusively consuming ammonium
    exported by A. platensis alongside increased glutamate exchange. Direct experimental metabolomic validation of these predicted
    fluxes remains outstanding.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Arthrospira platensis
    term:
