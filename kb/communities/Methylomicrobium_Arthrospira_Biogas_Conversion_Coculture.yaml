id: CommunityMech:000496
name: Methylomicrobium-Arthrospira Biogas Conversion Coculture
description: A defined synthetic binary methanotroph-photoautotroph coculture pairing Methylomicrobium buryatense 5GB1 (currently
  represented in NCBI Taxonomy as Methylotuvimicrobium buryatense 5G) with the oxygenic cyanobacterium Arthrospira platensis
  (Limnospira platensis) for simultaneous conversion of biogas methane and carbon dioxide without external oxygen supply.
  In illuminated closed bioreactors supplied with CH4/CO2/N2 feeding gas in 90% Zarrouk plus 10% NMS2 medium (pH 8.7-9) and
  refed every 24 h, photosynthetic O2 generated by A. platensis is completely consumed by M. buryatense 5GB1 to oxidize CH4
  and release CO2 for cyanobacterial fixation. Because enhanced coculture growth of both partners exceeds what in situ O2
  and CO2 exchange alone explains in dynamic flux balance analysis, genome-scale metabolic modeling (SteadyCom and DynamiCom
  coupling iMb5G(B1) and NIES-39) predicts emergent cross-feeding of ammonium, succinate, pyruvate, formate, glutamine, and
  glutamate.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Co-cultivate Methylomicrobium buryatense 5GB1 and Arthrospira platensis to convert biogas CH4 and CO2 into microbial
    biomass through in situ O2 and CO2 coupling, and combine a semi-structured kinetic model with genome-scale metabolic models
    to resolve interspecies metabolite exchange.
  assembly_strategy: Combine Methylomicrobium buryatense 5GB1 and Arthrospira platensis in a mixed 90% Zarrouk and 10% NMS2
    liquid medium adjusted to pH 8.7-9 under illuminated biogas-fed batch-refed conditions.
  inoculation_strategy: Vary photoautotroph-to-methanotroph (P:M) initial biomass inoculum ratios across 12.5:1, 8.5:1, 4:1,
    and 1.5:1 (with reference single-species controls at 0.218 gDCW/L A. platensis and 0.018 gDCW/L M. buryatense 5GB1).
  perturbation_design: Systematically vary light intensity (60, 100, 140, and 180 umol m-2 s-1), headspace gas composition
    (CH4:CO2:O2 ratios including 70:30:0, 80:20:0, 60:30:0, 60:30:10, and 20:10:0 with N2 balance), and inoculum ratio with
    headspace gas replacement every 24 h.
  measurement_endpoints:
  - Individual species biomass concentration in liquid phase over time
  - Headspace CH4, CO2, and O2 gas composition dynamics
  - Semi-structured kinetic model prediction accuracy across cultivation conditions
  - SteadyCom and DynamiCom genome-scale metabolic flux predictions of interspecies metabolite exchange
  evidence:
  - reference: PMID:35295538
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Through metabolic coupling of methane oxidation and oxygenic photosynthesis, methanotroph-photoautotroph (M-P)
      cocultures offer a highly promising technology platform for biogas conversion
    explanation: Supports the biogas conversion engineering objective of the methanotroph-photoautotroph coculture platform.
  - reference: PMID:35295538
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Comparison of the semi-structured kinetic model prediction (Pre.) versus experimental measurement (Mea.) for
      the coculture system (M. buryatense 5GB1-A. platensis) at gas composition of 60%CH4, 30%CO2, 10%N2; inoculum ratio of
      12.5:1 (P:M); and light intensity of 180 μ mol m − 2 s − 1 .
    explanation: Supports the experimental coculture design variables (gas composition, P:M inoculum ratio, and light intensity)
      and model validation endpoints.
  - reference: doi:10.20517/mrr.2023.70
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: After combining the modified iMb5G(B1) and NIES-39, there are more than 1,300 reactions in the coculture model.
    explanation: Supports the genome-scale metabolic modeling component combining iMb5G(B1) and NIES-39 to probe interspecies
      metabolic interactions.
