    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'The top eight exchanged metabolites predicted by SteadyCom are: succinate, ammonium, pyruvate, formate, citrate,
      sucrose, glutamine, and glutamate.'
    explanation: Reports the SteadyCom genome-scale model prediction of the top eight metabolites exchanged between A. platensis
      and M. buryatense 5GB1.
  - reference: doi:10.20517/mrr.2023.70
