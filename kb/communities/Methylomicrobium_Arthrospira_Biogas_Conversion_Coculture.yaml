ecological_interactions:
- name: In Situ Oxygen Provision for Methane Oxidation
  description: Under illumination in closed biogas-fed bioreactors without external O2 supply, Arthrospira platensis performs
    oxygenic photosynthesis and supplies dissolved O2 in situ to Methylomicrobium buryatense 5GB1. No headspace O2 accumulates
    during the growth experiment because the O2 produced by A. platensis is completely consumed by M. buryatense 5GB1 to drive
    aerobic methane oxidation.
  interaction_type: CROSS_FEEDING
