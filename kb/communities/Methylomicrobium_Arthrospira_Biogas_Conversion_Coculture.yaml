- name: Reciprocal Carbon Dioxide Provision and Synergistic Coculture Growth
  description: Methane oxidation by Methylomicrobium buryatense 5GB1 produces dissolved CO2 in situ that supplements inorganic
    carbon for Arthrospira platensis photosynthesis, establishing a mutualistic gas-exchange loop that supports simultaneous
    CH4 and CO2 conversion. However, dynamic flux balance analysis demonstrates that the enhanced growth observed for both
    species in coculture exceeds what in situ O2 and CO2 exchange alone can explain.
