id: CommunityMech:000163
name: PET Artificial Four-Species Degradation Consortium
description: >
  An engineered artificial consortium for polyethylene terephthalate (PET) biodegradation composed of
  two metabolically engineered Bacillus subtilis 168 strains that secrete PETase and MHETase, plus
  Rhodococcus jostii RHA1 and Pseudomonas putida KT2440. The design partitions PET depolymerization,
  terephthalic acid utilization, and ethylene glycol utilization across different members to reduce
  product inhibition during PET degradation.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Construct an artificial microbial consortium that degrades PET and reduces inhibition from
    the PET hydrolysis products terephthalic acid and ethylene glycol.
  assembly_strategy: Combine engineered B. subtilis 168 PETase and MHETase secretion strains with
    R. jostii RHA1 for TPA utilization and P. putida KT2440 for EG utilization in Wn medium.
  perturbation_design: Build two-, three-, and four-member consortia and vary temperature, pH, medium,
    and starting inoculation ratio to evaluate PET and BHET degradation.
  measurement_endpoints:
  - PET film weight loss
  - BHET depletion
  - terephthalic acid concentration
  - ethylene glycol concentration
  - HPLC quantification of PET hydrolysis products
  - scanning electron microscopy of PET film surfaces
  evidence:
  - reference: PMID:35003008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: artificial microbial consortium composed of Rhodococcus jostii, Pseudomonas putida and two metabolically engineered Bacillus subtilis
    explanation: Supports the engineered community identity and member composition.
  - reference: PMID:35003008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study constructed and evaluated the artificial microbial consortia in PET degradation
    explanation: Supports the artificial-consortium objective for complex-polymer degradation.
