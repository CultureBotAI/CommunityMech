  notes: Moderately thermophilic chalcopyrite bioleaching culture evaluated across initial pH values of 1.0, 2.0, and 3.0
    with real-time qPCR monitoring of planktonic and attached community dynamics (doi:10.1007/s13213-019-01453-y).
