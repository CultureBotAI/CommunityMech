environmental_factors:
- name: Initial pH Regime
  value: 1.0, 2.0, and 3.0 (optimal at pH 2.0)
  unit: pH
  description: Initial pH regimes evaluated for moderately thermophilic chalcopyrite bioleaching, where pH 1.0 and 3.0 prolonged
    leaching relative to pH 2.0.
  evidence:
  - reference: doi:10.1007/s13213-019-01453-y
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A mixed culture of moderate thermophiles was used for chalcopyrite bioleaching at initial pH values of 1.0, 2.0,
      and 3.0, and bioleaching processes were monitored via measuring the physicochemical parameters.
    explanation: Documents the initial pH values (1.0, 2.0, and 3.0) tested during chalcopyrite bioleaching.
  - reference: doi:10.1007/s13213-019-01453-y
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The leaching processes at initial pH of 1.0 and 3.0 were prolonged compared with that at initial pH of 2.0.
    explanation: Shows faster chalcopyrite bioleaching kinetics at initial pH 2.0 compared with pH 1.0 and 3.0.
