id: CommunityMech:000487
name: Moderate Thermophile Chalcopyrite pH-Regulated Bioleaching Consortium
description: A defined mixed culture of moderate thermophiles comprising Sulfobacillus thermosulfidooxidans, Acidithiobacillus
  caldus, and Ferroplasma thermophilum used for chalcopyrite bioleaching across initial pH values of 1.0, 2.0, and 3.0, exhibiting
  optimal leaching kinetics at initial pH 2.0 and stage-specific succession from early free-living S. thermosulfidooxidans
  and mineral-attached A. caldus to late-phase F. thermophilum dominance (doi:10.1007/s13213-019-01453-y).
