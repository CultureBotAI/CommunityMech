ecological_interactions:
- name: Metabolic division of labor in polyethylene degradation
  description: Complementary enzymatic repertoire drives synergistic PE degradation. Ensifer YF2, the
    primary degrader, performs backbone cleavage via oxidases (LadA, AlkB, CYP450); Sphingobacterium
    Y2, enriched in esterases and lipases, metabolizes the resulting intermediates through
    cross-feeding.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ensifer sp. YF2
    term:
      id: NCBITaxon:106591
      label: Ensifer
  target_taxon:
    preferred_term: Sphingobacterium sp. Y2
    term:
      id: NCBITaxon:28453
      label: Sphingobacterium
  evidence:
  - reference: PMID:41996795
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: YF2, encoding key oxidases (LadA, AlkB, CYP450), served as the primary degrader for
      backbone cleavage, while Y2, enriched with esterases and lipases, facilitated intermediate
      metabolism through cross-feeding.
    explanation: Genomic evidence for YF2 backbone cleavage feeding intermediates to Y2.
- name: Synergistic enhancement of PE degradation in the dual-strain consortium
  description: Co-culture of Ensifer YF2 and Sphingobacterium Y2 degraded polyethylene more
    efficiently than either strain alone or the full three-strain combination, indicating emergent
    synergy from functional compatibility rather than taxonomic richness.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ensifer sp. YF2
    term:
      id: NCBITaxon:106591
      label: Ensifer
