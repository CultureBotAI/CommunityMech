id: CommunityMech:000299
name: Ensifer YF2 + Sphingobacterium Y2 Polyethylene-degrading Consortium
description: Synthetic two-strain consortium for polyethylene (PE) biodegradation, constructed after
  screening Ensifer sp. YF2, Sphingobacterium sp. Y2, and Chryseobacterium sp. MF1 isolates from
  plastic-contaminated agricultural soils. The dual-strain consortium of YF2 and Y2 degraded PE more
  efficiently than individual strains or the full three-strain combination, using PE as the sole
  carbon source and inducing oxidative modifications and physical erosion of the polymer. Genomic
  analysis showed a complementary enzymatic division of labor - YF2 (oxidases LadA, AlkB, CYP450)
  performs backbone cleavage as the primary degrader, while Y2 (esterases and lipases) carries out
  intermediate metabolism through cross-feeding.
