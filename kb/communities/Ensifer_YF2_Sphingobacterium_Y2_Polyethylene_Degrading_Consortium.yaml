    term:
      id: NCBITaxon:28453
      label: Sphingobacterium
  evidence:
  - reference: PMID:41996795
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A dual-strain consortium (YF2 +Y2) demonstrated enhanced degradation compared to
      individual strains and the three-strain combination, indicating that functional compatibility
      rather than taxonomic richness drives consortium performance.
    explanation: Measured emergent synergy of the YF2+Y2 co-culture over monocultures and the 3-strain mix.
