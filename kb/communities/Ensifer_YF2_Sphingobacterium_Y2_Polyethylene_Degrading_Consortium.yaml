ecological_interactions:
- name: Metabolic division of labor in polyethylene degradation
  description: HYPOTHESIZED - genomic oxidase annotations in Ensifer YF2 and esterase/lipase annotations in Sphingobacterium
    Y2 motivate a model in which YF2 supplies polymer-derived intermediates to Y2. The directed pair represents
    that conceptual model, not measured donor export, identified exchanged compounds, recipient uptake or selectively
    established enzyme activity on polyethylene.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ensifer sp. YF2
    term:
      id: NCBITaxon:106591
      label: Ensifer
  target_taxon:
    preferred_term: Sphingobacterium sp. Y2
    term:
      id: NCBITaxon:28453
      label: Sphingobacterium
  downstream:
  - target: Synergistic enhancement of PE degradation in the dual-strain consortium
    description: HYPOTHESIZED - complementary transformation capacities could contribute to the stronger YF2/Y2
      consortium phenotype. Genomic annotation and the coculture comparison do not isolate cross-feeding as the
      cause of that improvement.
  evidence:
  - reference: PMID:41996795
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: YF2, encoding key oxidases (LadA, AlkB, CYP450), served as the primary degrader for backbone cleavage,
      while Y2, enriched with esterases and lipases, facilitated intermediate metabolism through cross-feeding.
    explanation: The abstract assigns roles from genomic complementarity and presents a conceptual model; it does
      not expose a direct exchange or enzyme-necessity experiment.
- name: Synergistic enhancement of PE degradation in the dual-strain consortium
  description: The abstract reports greater polyethylene degradation by the YF2/Y2 pair than by either isolate or
    the screened three-strain mixture including MF1. This is a consortium-output comparison, not demonstrated reciprocal
    fitness benefit, an identified exchanged metabolite or a formal additive-synergy test. MF1 is a comparator,
    not a member of this curated pair.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41996795
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A dual-strain consortium (YF2 +Y2) demonstrated enhanced degradation compared to individual strains
      and the three-strain combination, indicating that functional compatibility rather than taxonomic richness
      drives consortium performance.
    explanation: Supports the reported comparative consortium performance, not reciprocal organism fitness or a
      selectively resolved mechanism.
  participating_taxa:
  - preferred_term: Ensifer sp. YF2
    term:
      id: NCBITaxon:106591
      label: Ensifer
  - preferred_term: Sphingobacterium sp. Y2
    term:
      id: NCBITaxon:28453
      label: Sphingobacterium
- name: Polyethylene Oxidation and Surface Erosion
  description: The tested two-member consortium was reported to use polyethylene as the sole carbon source and to
    induce polymer oxidation and surface erosion. These physical and chemical endpoints do not by themselves establish
    complete mineralization, a measured interstrain carbon flux or a separate downstream consequence of the performance
    summary.
  scope: COMMUNITY_LEVEL
