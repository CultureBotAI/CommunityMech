ecological_interactions:
- name: Nitrifier-Heterotroph Urine Conversion
  description: Ureolytic heterotrophs and nitrifiers cooperate to convert urine nitrogen to nitrate.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Nitrosomonas europaea, Nitrobacter winogradskyi, Pseudomonas fluorescens, Acidovorax delafieldii,
    and Delftia acidovorans were compiled.
  description: Salt adaptation and urine feeding in nitrification reactors.
  evidence:
  - *id001
related_ingredients:
- preferred_term: urea
  chebi_term:
    id: CHEBI:16199
    label: urea
  relevance: Primary nitrogen source in urine; hydrolyzed by the ureolytic heterotrophs to release
    ammonium that feeds the nitrifiers, initiating the community N-cycle conversion.
  evidence:
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In reactor 2, the nitrifiers and ureolytic heterotrophs were fed with urine and achieved
      a 15±6mg NO3--NL-1d-1 production rate for 1% and 10% synthetic and fresh real urine, respectively.
    explanation: Urine feeding requires ureolysis of urea by the ureolytic heterotrophs, anchoring
      urea as the upstream nitrogen substrate of the community.
- preferred_term: ammonium
  chebi_term:
    id: CHEBI:28938
    label: ammonium
  relevance: Central intermediate released by ureolysis and oxidized by the AOB Nitrosomonas europaea;
    ammonium removal is a primary measured endpoint of the community.
  evidence:
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In reactor 1, salt adaptation of the ammonium-fed AOB and NOB co-culture was possible
      up to 45mScm-1, which resembled undiluted nitrified urine, while maintaining a 44±10mgNH4+-NL-1d-1
      removal rate.
    explanation: Explicitly names the ammonium-fed nitrifier co-culture and an NH4+ removal rate,
      anchoring ammonium as the oxidized intermediate.
- preferred_term: nitrate
  chebi_term:
    id: CHEBI:17632
    label: nitrate
  relevance: Terminal product of the nitrification cascade and the target fertilizer output of the
    engineered community.
  evidence:
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Astronauts' urine can, for instance, be nitrified by micro-organisms into a liquid nitrate
      fertilizer for plant growth in space.
    explanation: Names nitrate as the fertilizer end-product produced by nitrification, anchoring it
      as the community's terminal N-cycle compound.
growth_media:
- name: synthetic/real urine nitrification medium
  salinity: '45'
  salinity_unit: mS/cm
  inoculum_source: synthetic community of Nitrosomonas europaea, Nitrobacter winogradskyi, Pseudomonas
    fluorescens, Acidovorax delafieldii and Delftia acidovorans
  preparation_notes: 'Reactor 1: ammonium-fed AOB/NOB co-culture salt-adapted up to 45 mS/cm conductivity
    (resembling undiluted nitrified urine). Reactor 2: fed with 1% and 10% synthetic and fresh real
    urine; organics removal 69±15%.'
  evidence:
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In reactor 1, salt adaptation of the ammonium-fed AOB and NOB co-culture was possible
      up to 45mScm
    explanation: Reports salt adaptation of the nitrifier co-culture up to 45 mS/cm.
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In reactor 2, the nitrifiers and ureolytic heterotrophs were fed with urine
    explanation: Reports urine feeding of the full community in a reactor.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: BIOREACTOR_UNSPECIFIED
  notes: 'Two nitrification reactors (reactor 1: ammonium-fed AOB/NOB co-culture; reactor 2: nitrifiers
    + ureolytic heterotrophs fed with urine); batch activity tests performed with fresh real urine.'
  evidence:
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Batch activity tests with this community using fresh real urine even reached 29±3mgNL
    explanation: Names batch activity tests of the community with real urine.
  - reference: PMID:31623889
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In reactor 2, the nitrifiers and ureolytic heterotrophs were fed with urine
    explanation: Describes the nitrification reactor cultivating the community.
