    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mutualistic metabolic cooperation of pro- and eukaryotic microorganisms
    explanation: Supports bacteria-yeast mutualistic metabolic cooperation in KMC.
- name: Cellulose Pellicle Community Structuring
  description: Cellulose-producing acetobacteria create a surface pellicle that encloses the mixed yeast
    and bacterial community, physically structuring biochemical interactions.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Komagataeibacter
