id: CommunityMech:000154
name: Kombucha KMC-IMBG1 Fermentation Community
description: >
  A Ukrainian kombucha microbial community variant, KMC-IMBG1, profiled by culture-dependent isolation
  and 16S/ITS metabarcoding across sweetened black-tea and honey/cabbage-brine microenvironments. The
  core community contains cellulose-forming acetobacteria, especially Komagataeibacter and Gluconobacter,
  together with dominant yeasts such as Pichia and Brettanomyces/Dekkera; growth conditions alter the
  accessory community and yeast composition.
ecological_state: STABLE
community_origin: NATURAL
community_category: BIOTECHNOLOGY
