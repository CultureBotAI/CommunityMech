    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cellulose-based pellicles created by the cellulose-producing bacteria
    explanation: Supports acetobacterial cellulose pellicles as a structuring feature of the community.
- name: Growth-Condition Dependent Accessory Recruitment
  description: KMC-IMBG1 maintained a stable acetobacterial core but shifted accessory bacteria and yeast
    composition across sterile sweetened tea, nonsterile sweetened tea, honey-supplemented tea, and
    cabbage-brine hybrid microenvironments.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:26061774
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The community composition was dependent on the growth conditions
    explanation: Supports growth-condition-dependent shifts in KMC composition.
  - reference: PMID:26061774
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: bacterial core component in nsBTS remained the same
    explanation: Supports a relatively stable bacterial core despite growth-condition changes.
