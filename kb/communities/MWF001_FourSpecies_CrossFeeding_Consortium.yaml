discussions:
- discussion_id: mwf001_exact_byproduct_resolution
  prompt: Resolve the exact metabolic byproducts exchanged by Agrobacterium, Comamonas, Microbacterium, and Ochrobactrum/Brucella
    in each carbon-source context.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cross-fed metabolic byproduct partitioning
  rationale: The paper supports cross-feeding of partner-derived spent-media metabolites and uses a consumer-resource
    model to interpret the four-species coexistence, but it explicitly notes the technical challenge of quantifying
    resource affinities for cross-fed metabolites in vitro. No exact exchanged metabolite was therefore asserted
    in the record.
  posed_by: codex
  posed_date: '2026-09-26'
- discussion_id: mwf001_causal_extension_pending
  prompt: How strongly does byproduct partitioning support the observed coexistence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cross-fed metabolic byproduct partitioning
  - ecological_interactions#Robust coexistence across simple nutrient environments
  rationale: 'The complete primary text supports considering a PARTIAL arrow from cross-feeding/byproduct partitioning
    to coexistence, with generic-model, residual-substrate and exact-metabolite limits. This new causal structure
    is tracked in #1575: the free one-community Edison causal dry run passed, but the paid run and report review
    are not complete. Keep needs_research rather than calling the sparse graph complete. Preserve the existing exact-byproduct
    gap and #1127/#1128 safeguards. Protocol and source inconsistencies remain under #1574. Original figure pixels,
    separate supplements, raw data and executable models were not audited.'
  posed_by: codex
  posed_date: '2026-10-06'
