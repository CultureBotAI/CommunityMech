  interaction_type: CROSS_FEEDING
- name: Robust coexistence across simple nutrient environments
  description: All four strains remained detectable through eight 72-hour growth-and-dilution cycles in 31 carbon-supplied
    conditions, including 16 single-resource environments. These finite observations support broad conditional persistence,
    not asymptotic stability or a measured niche-partitioning mechanism. Additional 5X-malate conditions lost Comamonas
    after the first transfer; Microbacterium did not persist without carbon. The initial batch panel used 1/100
    transfers except 1/10 for citrate and inosine, with the first citrate transfer at 1/100. Separate four-day chemostats
    on four single carbon sources also retained all four strains. The canonical participants preserve the source
    roster and prior unresolved taxonomic mappings, not independently recertified identities.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42752228
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across 31 simple nutrient conditions, including 16 single-resource environments, all four species survived
      and coexisted over eight growth-and-dilution cycles.
    explanation: Supports finite persistence in the initial 31 carbon-supplied conditions; no-carbon and additional
      high-malate exceptions prevent a universal coexistence claim.
  participating_taxa:
  - preferred_term: Agrobacterium tumefaciens MWF001
