ecological_interactions:
- name: Cross-fed metabolic byproduct partitioning
  description: PARTIAL - partner spent-media growth and persistence of primary-carbon-source nonusers support byproduct
    cross-feeding in MWF001. All four strains grew better in partner spent medium than their own, but exact exchanged
    compounds and donor-recipient fluxes were not chemically resolved. Unchanged stationary OD does not establish
    complete primary-substrate depletion; the greater-than-10-percent residual-resource exclusion described in Methods
    applies to simulations, not an equivalent experimental chemical assay. Generic consumer-resource models support
    coexistence through byproduct availability and differential resource affinities, not exact four-strain pathways.
    Fresh-medium pair effects were positive or negative depending on partner and condition, so reciprocal benefit
    is not universal.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42752228
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: experimental assays and consumer-resource modeling showed that the coexistence was explained by cross-feeding
      and niche partitioning of metabolic byproducts
    explanation: Supports the integrated cross-feeding interpretation, with experimental spent-media growth and
      generic-model evidence; it does not identify exact compounds or selectively isolate the mechanism in all conditions.
  - reference: PMID:42752228
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our CRM simulates growth, resource depletion, and byproduct accumulation as a function of species'
      resource affinities, maximum uptake rates, and metabolite release profiles and thus captures both resource
      competition and cross-feeding
    explanation: Supports the generic consumer-resource model components, not a genome-resolved model or measured
      resource affinities for the four exact strains.
