id: CommunityMech:000443
name: MWF001 Four-Species Cross-Feeding Consortium
description: 'A defined synthetic model community of four bacterial strains originally isolated from toxic metal-working fluids:
  Agrobacterium tumefaciens MWF001, Comamonas testosteroni MWF001, Microbacterium liquefaciens MWF001, now classified as Microbacterium
  maritypicum, and Ochrobactrum anthropi MWF001, now classified as Brucella anthropi. Sulheim et al. assembled the four strains
  into M9 minimal media with chemically diverse single or paired carbon sources, followed individual members by colony counts
  on selective media across eight 72 h growth-and-dilution cycles, and found that metabolic byproduct cross-feeding and niche
  partitioning let all four members coexist in nearly every tested nutrient condition.'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Test whether robust four-species coexistence can emerge from cross-feeding and niche partitioning among community
    members rather than being dictated only by the identity or number of externally supplied carbon resources.
  assembly_strategy: Combine equal-density washed suspensions of A. tumefaciens MWF001, C. testosteroni MWF001, M. liquefaciens
    MWF001, and O. anthropi MWF001 into 96-well M9 minimal-medium communities.
  inoculation_strategy: Inoculate the first 200 uL growth cycle with each member at OD600 0.03 after TSB preculture and M9
    minimal-medium washing.
  passaging_regimen: Grow each transfer for 72 h at 28 degrees C with continuous double-orbital shaking, mix each well, and
    dilute 2 uL into a freshly made plate for the next 72 h cycle.
  perturbation_design: Challenge the consortium across 16 single-carbon-source media, 15 paired-carbon-source media, a no-carbon
    control, vitamin/amino-acid supplementation, altered carbon concentrations, rich media, and four single-carbon-source
    chemostats.
  measurement_endpoints:
  - species-resolved CFU counts on selective agar at each growth cycle
  - single-species growth rates, lag times, and yields on 33 carbon sources
  - four-species endpoint Shannon diversity across single and paired carbon sources
  - pairwise mono- and coculture growth in fresh and spent media
  - consumer-resource simulations of byproduct cross-feeding and resource affinity variation
  evidence:
  - reference: PMID:42752228
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we bridge this gap by profiling a synthetic four-species bacterial community across an extensive matrix
      of resource supply conditions, using selective plating to track individual species abundances across eight orders of
      magnitude for eight growth-and-dilution cycles.
    explanation: Supports the species-resolved, eight-cycle design used to probe coexistence.
  - reference: PMID:42752228
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The community assembly experiment was conducted in 32 different M9 minimal media, with 16 single carbon sources,
      15 pairs of carbon sources and a no-carbon control environment
    explanation: Supports the first resource-supply matrix used for community assembly.
