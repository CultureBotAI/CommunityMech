environmental_factors:
- name: Soil Cadmium Contamination
  value: ~1.0 mg/kg soil Cd
  description: Natural cadmium-contaminated agricultural soil imposing oxidative stress and phytotoxicity on Brassica juncea.
  evidence:
  - reference: PMID:42043130
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Pot experiments revealed that SynCom-NS root-zone application significantly alleviated Cd toxicity, increasing
      total fresh weight by 82% and chlorophyll content by 33%.
    explanation: Establishes soil cadmium stress as the primary environmental challenge.
