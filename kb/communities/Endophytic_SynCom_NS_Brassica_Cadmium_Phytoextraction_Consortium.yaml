id: CommunityMech:000476
name: Hyperaccumulator-Derived Endophytic SynCom-NS for Brassica juncea Cadmium Phytoextraction
description: Four-strain core endophytic synthetic bacterial community (SynCom-NS)—composed of Pseudomonas izuensis SaPI1,
  Leifsonia shinshuensis SaLS1, Brucella anthropi (Ochrobactrum anthropi) SaOA1, and Novosphingobium lindaniclasticum SaNL1
  originally isolated from the hyperaccumulator Sedum alfredii—applied to the high-biomass crop Brassica juncea under cadmium
  stress. SynCom-NS increases soil Cd bioavailability, upregulates root HMA4 metal transporter expression and glutathione-mediated
  antioxidant defenses, increases plant fresh weight by 82%, and amplifies shoot Cd accumulation 4.07-fold.
