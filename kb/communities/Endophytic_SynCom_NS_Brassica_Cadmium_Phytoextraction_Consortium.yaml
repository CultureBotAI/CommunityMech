environmental_factors:
- name: Soil Cadmium Contamination
  value: ~1.0 mg/kg soil Cd
  description: Natural cadmium-contaminated agricultural soil imposing oxidative stress and phytotoxicity on Brassica juncea.
  evidence:
  - reference: PMID:42043130
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Pot experiments revealed that SynCom-NS root-zone application significantly alleviated Cd toxicity, increasing
      total fresh weight by 82% and chlorophyll content by 33%.
    explanation: Establishes soil cadmium stress as the primary environmental challenge.
ecological_interactions:
- name: Microbiome-Driven Cadmium Mobilization, HMA4 Translocation, and Glutathione Detoxification
  description: Root-zone application of the four-strain SynCom-NS consortium (Pseudomonas izuensis SaPI1, Leifsonia shinshuensis
    SaLS1, Brucella anthropi SaOA1, and Novosphingobium lindaniclasticum SaNL1) induces a >3-fold surge in host glutathione
    (GSH) and phenylpropanoid defense pathways to scavenge hydrogen peroxide and alleviate cadmium toxicity in Brassica juncea.
  interaction_type: MUTUALISM
  metabolites:
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
  - preferred_term: hydrogen peroxide
    term:
      id: CHEBI:16240
      label: hydrogen peroxide
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  evidence:
  - reference: PMID:42043130
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Multi-omics analysis demonstrated a systemic modulation of the host's defense machinery, marked by a >3-fold
      surge in glutathione (GSH) levels and the induction of phenylpropanoid biosynthesis for cell wall reinforcement.
    explanation: Demonstrates glutathione surge and systemic host defense activation by SynCom-NS.
  scope: COMMUNITY_LEVEL
- name: Synergistic Endophytic HMA4 Regulation and Cadmium Translocation
  description: The four-strain SynCom-NS consortium mediates tissue-specific regulation of the heavy metal transporter HMA4—upregulating
    expression in roots and downregulating in shoots—to accelerate root-to-shoot cadmium(2+) translocation and achieve a 4.07-fold
    increase in shoot Cd phytoextraction.
  interaction_type: SYNTROPHY
  metabolites:
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  evidence:
  - reference: PMID:42043130
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom-NS application also mediated tissue-specific regulation of the key metal transporter HMA4, upregulating
      its expression in roots to accelerate long-distance translocation while downregulating it in shoots.
    explanation: Confirms tissue-specific HMA4 regulation driving 4.07-fold shoot Cd phytoextraction.
  scope: COMMUNITY_LEVEL
