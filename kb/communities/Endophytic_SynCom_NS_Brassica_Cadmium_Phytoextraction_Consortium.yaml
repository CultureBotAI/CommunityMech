ecological_interactions:
- name: Microbiome-Driven Cadmium Mobilization, HMA4 Translocation, and Glutathione Detoxification
  description: SynCom-NS strains (Pseudomonas izuensis, Leifsonia shinshuensis, Brucella anthropi, and Novosphingobium lindaniclasticum)
    mobilize rhizosphere cadmium(2+), upregulate root HMA4 expression to accelerate root-to-shoot Cd translocation, and induce
    host glutathione (>3-fold increase) and ROS-scavenging enzymes to scavenge hydrogen peroxide.
  interaction_type: MUTUALISM
