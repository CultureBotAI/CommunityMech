ecological_interactions:
- name: AHL Diffusion and Violacein Induction
  description: In the two-strain reporter demonstration, AHL-producing Cv017 induced violacein and vioC transcription
    in physically separated Cv026 through the shared reservoir. Replated Cv026 returned to a nonpigmented phenotype,
    supporting signal-dependent response rather than contamination or a stable pigmented mutant. This supports diffusible
    signaling in this assay, not a quantified signal dose, all extracellular enzyme classes or causation of the
    separate three-member metabolomics phenotype. The canonical record currently has only a Bacteria umbrella; exact
    strain participants remain unresolved rather than being assigned invented CURIEs.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: N-acyl-L-homoserine lactone
    term:
      id: CHEBI:55474
      label: N-acyl-L-homoserine lactone
  biological_processes:
  - preferred_term: quorum sensing
    term:
      id: GO:0009372
      label: quorum sensing
  evidence:
  - reference: PMID:29152587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: AHLs from Cv017 diffused through wells to induce quorum sensing and violacein production in Cv026
    explanation: Supports the two-strain reporter response across the reservoir; endpoint transcription and replating
      controls are described in the inspected main body. It is separate from the three-member time series.
- name: Three-Member Exometabolite Time Series
  description: 'The separate B. thailandensis E264, source-labeled C. violaceum and P. syringae DC3000 stationary-phase
    assay showed time-varying nonpolar mass features over 15-35 hours. The 977 features are not 977 identified metabolites,
    and changes do not resolve producer-consumer flux. Bactobolin was identified separately by polar HILIC-MS/MS;
    its accumulation does not selectively establish the cause of lower P. syringae live-cell counts in B. thailandensis-containing
    cultures. No bactobolin-to-inhibition or AHL-to-metabolomics arrow is asserted. The source has a Chromobacterium
    strain-number discrepancy; taxonomy and a separately supported antagonism node remain pending under #1467.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: antibacterial agent
    term:
      id: CHEBI:33282
      label: antibacterial agent
    notes: Bactobolin identified separately in the polar HILIC-MS/MS analysis; not an identity assignment for all
      977 nonpolar features or selective proof of inhibition mediation.
  evidence:
  - reference: PMID:29152587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed both decreases in existing features (clusters A and B) and production of new features over
      time (clusters D, E, and F)
    explanation: Supports temporal mass-feature differences, not resolved exchange flux or mediator-specific causality.
      The polar bactobolin measurement and live-cell counts are distinct readouts.
