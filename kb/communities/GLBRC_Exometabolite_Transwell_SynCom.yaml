    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultures in test tubes were incubated at 29°C at 200 rpm
    explanation: Source states the 29 °C, 200 rpm cultivation conditions of the representative Transwell community assay.
  - reference: PMID:29152587
