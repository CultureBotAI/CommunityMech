- name: Competitive exclusion of spoilage genera
  description: >-
    The SynCom drove the silage microbiome toward Lactobacillus, which exceeded
    95% of it, and the source attributes the suppression of the spoilage genera
    Staphylococcus and Weissella to competitive exclusion.

    Staphylococcus and Weissella are outcomes of the treatment, not members of the
    community, so they appear here as interaction participants without appearing in
    taxonomy (#319). The interaction is scoped COMMUNITY_LEVEL rather than pairwise
    for the same reason: the source attributes the suppression to the assembled
    consortium, not to one member acting on the pathogen.

    One caution the abstract cannot settle: the >95% figure is an amplicon genus
    bin reading "Lactobacillus", and under current taxonomy the inoculated organism
    is Lactiplantibacillus. Whether that population is the inoculum or a resident
    Lactobacillus-group taxon is not determinable from the accessible text, so this
    record does not attribute the surge to the inoculated strain.
