id: CommunityMech:000338
name: Caragana korshinskii Cross-Kingdom Forage Bio-Valorization SynCom
description: >
  A defined three-member, two-kingdom synthetic microbial community assembled to
  break the lignocellulose barrier of Caragana korshinskii, a shrub legume used
  as an arid-region feed resource. Lactobacillus plantarum supplies rapid
  acidification, Bacillus subtilis supplies fibrolytic enzyme secretion, and
  Aspergillus niger supplies what the source calls oxidative delignification
  potential. Against the control, the SynCom treatment reached higher in vitro
  dry matter digestibility (49.68%) and neutral detergent fibre digestibility
  (25.65%), shifted the silage microbiome so that Lactobacillus exceeded 95% of
  it, suppressed the spoilage genera Staphylococcus and Weissella by competitive
  exclusion, and upregulated predicted pyruvate metabolism and amino-acid
  biosynthesis.

  CURATION SCOPE. Only the abstract of the source is available: the paper is
  gold open access at the publisher but has no PMC deposit, Europe PMC serves no
  full text, and the publisher blocks programmatic retrieval, so
  references_cache/PMID_42432469.md is content_type abstract_only. Strain
  designations, inoculation rates, ensiling vessel, temperature, moisture and
  duration, control-arm values, pH and organic-acid data, sequencing methods and
  any sequence accessions are all unavailable and are therefore absent here
  because they were not readable, not because the study did not report them.
  Re-check with the Europe PMC search for EXT_ID:42432469 and curate the rest
  once a pmcid appears.
