- name: Acidification-driven preservation
  description: >-
    Functional prediction attributes upregulated pyruvate metabolism and
    amino-acid biosynthesis to the SynCom, which the source links to rapid
    acidification and protein preservation across the consortium. Community-level:
    the prediction is over the whole treated microbiome, not one member.

    Only pyruvate is annotated as a metabolite. The abstract says "rapid
    acidification" without naming an acid, and a lactic acid bacterium's product
    is an inference rather than a source-backed claim, so lactate is not asserted
    anywhere in this record.
