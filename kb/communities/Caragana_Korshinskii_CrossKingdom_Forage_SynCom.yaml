    Overcome the recalcitrant lignocellulose barrier that limits the use of
    Caragana korshinskii as livestock feed, by combining acidification, fibrolytic
    enzyme secretion and oxidative delignification in one consortium.
  assembly_strategy: >-
    Rational cross-kingdom assembly of three members with complementary declared
    functions - a lactic acid bacterium, a fibrolytic bacillus, and a filamentous
    fungus - applied to the forage as a silage inoculant.
  measurement_endpoints:
  - In vitro dry matter digestibility
  - In vitro neutral detergent fibre digestibility
  - Silage microbiome composition by amplicon profiling
  - Predicted metabolic module abundance from functional prediction
