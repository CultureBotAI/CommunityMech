ecological_interactions:
- name: Complementary lignocellulose attack by the two degraders
  description: >-
    B. subtilis contributes secreted fibrolytic enzymes and A. niger contributes
    what the source calls oxidative delignification potential, so the two attack
    different parts of the same recalcitrant substrate. Community-level because
    the source describes complementary contributions to one process rather than an
    effect of one organism on the other.

    The word "potential" is the authors' own and this record does not upgrade it.
    A. niger is a well-characterised cellulase and hemicellulase producer rather
    than a ligninolytic white-rot fungus, and no lignin measurement is available,
    so no lignin catabolism process term is asserted against it.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
