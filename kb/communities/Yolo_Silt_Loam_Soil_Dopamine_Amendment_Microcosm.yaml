    gtdb_classification:
      curated: true
      curation_note: 'Sharpened from p__Thermoproteota, which the rank-for-rank vote returns because NCBI calls Nitrososphaerota
        (Thaumarchaeota) a phylum (#451). GTDB demoted it - the clade survives as c__Nitrososphaeria inside Thermoproteota
        - and every one of the 65 named-species rows behind this grounding carries a Nitrososphaeria name: 57 rows read Nitrososphaeria
        and 8 read Nitrososphaeria_A. The suffix is what made this demotion invisible to a sweep demanding exact agreement
        (#453), but the two are not interchangeable - GTDB adds it to lineages that are not monophyletic with the type, and
        these eight are o__Caldarchaeales thermophiles rather than ammonia-oxidising Thaumarchaeota. So the grounding takes
        the unsuffixed name only: 552 of 631 genomes, where the phylum vote claimed 631 of 631 - less confident and more informative.
        p__Thermoproteota also holds ten other NCBI phyla, among them Ca. Bathyarchaeota and Ca. Marsarchaeota, so it did
        not distinguish this entry; the record names Thaumarchaeota specifically and ties it to archaeal amoA ammonia oxidation,
        which is a Nitrososphaeria trait.'
      gtdb_id: GTDB:c__Nitrososphaeria
