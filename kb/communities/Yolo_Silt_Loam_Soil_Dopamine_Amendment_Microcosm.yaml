  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: MESOCOSM
    snippet: Given that dopamine is correlated with the SynCom composition and regulates soil bacterial growth in vitro, we
      hypothesized that dopamine likely impacts soil microbial communities in a native context.
    explanation: The soil microcosm was run in the same study as the hydroponic SynCom experiment.
