id: CommunityMech:000497
name: Yolo Silt Loam Soil Dopamine Amendment Microcosm
description: Native bacterial and archaeal community of an agricultural Yolo silt loam from a UC Davis field, incubated as
  20 g microcosms for six weeks with twice-weekly dopamine or norepinephrine amendment (1.5 or 3.0 mg) at about 24.5% water
  content. Proteobacteria, Firmicutes, Actinobacteria, Acidobacteria, Thaumarchaeota and Bacteroidetes dominated control soil.
  Of all phyla only Actinobacteria were significantly enriched at the high dose of both catecholamines, more by dopamine;
  Acidobacteria fell under high norepinephrine. Run alongside the Brachypodium hydroponic SynCom experiment of the same study
  (CommunityMech:000498).
