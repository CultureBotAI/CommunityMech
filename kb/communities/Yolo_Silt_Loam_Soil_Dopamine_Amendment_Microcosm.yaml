ecological_interactions:
- name: High-Dose Catecholamine Amendment Enriches Actinobacteria
  description: Among all phyla, only Actinobacteria rose significantly in relative abundance in soil given the high dose (3.0
    mg) of dopamine or norepinephrine, with the larger effect from dopamine. Relative 16S abundance after six weeks; it does
    not show catecholamine use as a substrate or absolute growth.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Actinobacteria (Actinomycetota)
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  metabolites:
  - preferred_term: dopamine
    term:
      id: CHEBI:18243
      label: dopamine
    concentration: 1.5 or 3.0 mg per 20 g dried soil, twice weekly
  - preferred_term: norepinephrine
    term:
      id: CHEBI:33569
      label: noradrenaline
    concentration: 1.5 or 3.0 mg per 20 g dried soil, twice weekly
  effect_direction: INCREASES
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: MESOCOSM
    snippet: Among all bacterial phyla, only Actinobacteria were significantly enriched in soils treated with both dopamine
      and norepinephrine at the high dose; however, dopamine had a greater effect than norepinephrine
    explanation: Phylum-level enrichment at the high dose.
- name: High-Dose Norepinephrine Depletes Acidobacteria
  description: Acidobacteria relative abundance fell in soil given high-dose norepinephrine compared with control soil. Relative
    16S abundance only.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Acidobacteria (Acidobacteriota)
    term:
      id: NCBITaxon:57723
      label: Acidobacteriota
  metabolites:
  - preferred_term: norepinephrine
    term:
      id: CHEBI:33569
      label: noradrenaline
    concentration: 3.0 mg per 20 g dried soil, twice weekly
  effect_direction: DECREASES
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: MESOCOSM
    snippet: Acidobacteria significantly decreased in the soil treated with the high dose of norepinephrine compared to those
      in the control soil
    explanation: Phylum-level depletion under high norepinephrine.
environmental_factors:
- name: catecholamine amendment
  value: dopamine or norepinephrine, 1.5 mg (low) or 3.0 mg (high) per 20 g dried soil
  description: Mixed in dry without solvent; repeated twice a week for six weeks; control without amendment.
  evidence:
