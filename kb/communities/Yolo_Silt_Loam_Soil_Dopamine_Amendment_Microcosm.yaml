    supports: SUPPORT
    evidence_source: MESOCOSM
    snippet: The metabolites (dopamine and norepinephrine) at two doses (1.5 mg and 3.0 mg) were directly mixed into 20 g
      of dried soil without solvent dissolution
    explanation: Amendment doses and method.
