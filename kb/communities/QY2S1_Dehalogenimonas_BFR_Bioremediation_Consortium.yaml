id: CommunityMech:000424
name: QY2-S1 Dehalogenimonas-Rich Brominated-Flame-Retardant Consortium
description: A Dehalogenimonas-containing anaerobic enrichment culture obtained from e-waste-contaminated pond sediments in
  Longtang Town, Qingyuan, China, re-inoculated as QY2-S1, and assayed in anaerobic serum bottles for reductive debromination
  of the legacy brominated flame retardant BDE 99 and the novel cycloaliphatic flame retardant beta-TBCO. Zhang et al. showed
  that QY2-S1 transformed both substrates singly, that co-exposure reduced first-order transformation rates by 3- to 5-fold,
  and that Dehalogenimonas was the only detected organohalide-respiring genus in a stable consortium whose dominant fermenters
  and methanogens can supply H2, carbon, and cofactors for reductive dehalogenase activity.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate anaerobic transformation of representative co-occurring traditional and novel brominated flame retardants
    by a Dehalogenimonas-containing enrichment culture.
  assembly_strategy: Subject sediment from a closed e-waste-impacted pond to three to five rounds of serial enrichment in
    anaerobic flasks, using PCE to monitor reductive dehalogenation and remove sediment debris, then re-inoculate the resulting
    QY-2 mixed culture as QY2-S1.
  inoculation_strategy: Inoculate nitrogen-purged 100 mL serum bottles containing 60 mL anaerobic lactate medium with 5% v/v
    enriched stock culture.
  perturbation_design: Compare BDE 99 alone, beta-TBCO alone, and combined BDE 99/beta-TBCO exposures at 3 uM initial concentration
    for each target compound, alongside autoclaved abiotic controls.
  measurement_endpoints:
  - BDE 99 and beta-TBCO concentrations by gas chromatography-mass spectrometry
  - PBDE and beta-TBCO reductive-debromination products by full-scan GC-MS
  - observed first-order biotransformation rate constants
  - spike-in absolute quantitative 16S rRNA amplicon sequencing
  - alpha diversity and Bray-Curtis principal-coordinate analysis
  - absolute Dehalogenimonas abundance during single and co-exposure assays
  evidence:
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: using a Dehalogenimonas-containing mixed culture (QY2-S1) under single- and co-exposure conditions
    explanation: Identifies the QY2-S1 enrichment and the single/co-exposure BFR assay design.
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The resulting Dehalogenimonas-containing mixed culture QY-2 was provided by Professor Shanquan Wang’s research
      group at Sun Yat-sen University. After acquisition, it was re-inoculated and designated as QY2-S1.
    explanation: Supports the QY-2 to QY2-S1 provenance and reinoculation step.
