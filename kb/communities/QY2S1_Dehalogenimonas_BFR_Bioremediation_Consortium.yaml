ecological_interactions:
- name: Fermenter-Methanogen Support for Dehalogenimonas RDase Activity
  description: Dominant Clostridium and Sedimentibacter fermenters and Methanoculleus methanogens form a syntrophic support
    network that can supply H2, carbon, and cofactors required for Dehalogenimonas reductive dehalogenase activity during
    BDE 99 and beta-TBCO organohalide respiration.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This robust consortium forms a synergistic metabolic network, where fermentative bacteria and methanogens provide
      essential electron donors (H2), carbon source, and other growth cofactors, required for the RDase activity of the core
      OHRB, Dehalogenimonas
    explanation: Supports fermenter and methanogen support for Dehalogenimonas reductive dehalogenase activity.
environmental_factors:
- name: BDE 99 and beta-TBCO exposure panel
  value: BDE 99, beta-TBCO, and BDE 99/beta-TBCO at 3 uM per target
  description: 'QY2-S1 was assayed under three exposure conditions: BDE 99 alone, beta-TBCO alone, and both compounds together,
    each at 3 uM initial target-compound concentration.'
  evidence:
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: BDE 99, β-TBCO, or their mixture
    explanation: Names the single- and co-exposure assay groups.
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the initial concentration of each target compound was set at 3 μM
    explanation: Supports the brominated-flame-retardant loading concentration.
- name: Reciprocal co-exposure inhibition
  value: 3- to 5-fold lower kobs during co-exposure
  description: BDE 99 and beta-TBCO co-exposure reduced the observed first-order transformation rate constants for both substrates
    relative to single-substrate exposure.
  evidence:
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: kobs values decreased by approximately 3- to 5-fold in a co-exposure system
    explanation: Quantifies the reciprocal kinetic inhibition during BFR co-exposure.
- name: BDE 99 pathway truncation during beta-TBCO co-exposure
  value: BDE 99 stepwise debromination truncated at tetra-BDE
  description: When beta-TBCO was present with BDE 99, QY2-S1 retained ortho-regioselectivity but stopped the BDE 99 debromination
    sequence at the tetra-brominated diphenyl ether stage.
  evidence:
  - reference: PMID:42511722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: stepwise debromination was truncated at the tetra-BDE stage during co-exposure.
    explanation: Identifies the co-exposure-associated pathway truncation.
