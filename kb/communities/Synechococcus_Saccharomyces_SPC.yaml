growth_media:
- name: BG-11-based photosynthetic co-culture medium
  temperature: '35'
  temperature_unit: °C
  atmosphere: AEROBIC
  headspace_gas: 2% CO2
  light_regime: constant light
  light_intensity: '80'
  light_intensity_unit: µmol PAR
  shaking_speed: '150'
  shaking_speed_unit: rpm
  vessel_type: Multitron Infors HT shaking incubator
  preparation_notes: >-
    S. elongatus propagated in BG-11 + 1 g/L HEPES (pH 8, 35 °C, constant light); the yeast partner
    grown in the yeast co-culture medium CoY BG-11. The general co-culture conditions (35 °C, 150
    rpm, 2% CO2, ~80 µmol PAR) apply across all cyanobacterium/heterotroph dyads in the source. 2%
    sucrose added to acclimate; IPTG induces sucrose export. Long-term co-cultures were run in
    Phenometrics environmental photobioreactors on a 16:8 light:dark cycle.
  evidence:
  - reference: PMID:28127397
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All acclimating cultures and co-cultures were grown at 35 °C, 150 rpm, 2% CO2, in light
      (PAR = ~80 μmol with 15 W Gro-Lux Sylvania fluorescent bulbs) within a Multitron Infors HT incubator
    explanation: General co-culture conditions used across the photosynthetic consortium dyads.
  - reference: PMID:28127397
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. elongatus was propagated in BG-11 (Sigma-Aldrich) plus 1 g/L HEPES, pH 8 in constant
      light at 35 °C
    explanation: Base medium and maintenance conditions for the cyanobacterial primary producer.
discussions:
- discussion_id: spc-yeast-assay-and-mediator-boundaries
  prompt: Which strain- and condition-specific interactions explain growth and persistence in this dyad?
  rationale: The source combines batch, continuous, density-dependent and production assays. Keep their positive
    results without treating every partner or strain as persistent for weeks to months. Cyanobacterial growth stimulation
    is observed, but metabolite return and byproduct absorption remain hypotheses. Light-associated inhibition is
    supported without identifying oxygen as the exclusive cause. For Bacillus, the canonical168 production assay
    is distinct from 3610 perturbation experiments. For E. coli, the early non-sucrose inference differs from later
    sucrose-sensitive production; for yeast, W303Clump is not parental W303. No new causal node, direction, cultivation
    protocol or strain optimization is added.
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  attaches_to:
  - ecological_interactions#CO2 Fixation and Sucrose Production
  - ecological_interactions#Sucrose Utilization by the Heterotrophic Partner
  - ecological_interactions#Yeast Stimulation of Cyanobacterial Growth
  evidence:
  - reference: PMID:28127397
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: we hypothesize that these benefits arise from emergent cross-feeding of metabolite(s) and/or absorption
      of byproducts
    explanation: Source-explicit proposed mediator of cyanobacterial stimulation, not a measured transfer mechanism.
