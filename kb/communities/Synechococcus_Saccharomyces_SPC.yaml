id: CommunityMech:000067
name: Synechococcus-Saccharomyces Synthetic Photosynthetic Consortium
description: 'A synthetic, light-driven consortium pairing the cyanobacterium Synechococcus elongatus
  PCC 7942 (engineered to secrete sucrose via the cscB+ transporter) with the budding yeast Saccharomyces
  cerevisiae W303Clump. The cyanobacterium fixes CO2 and exports sucrose, which supports heterotrophic
  growth of the yeast. Wild-type W303 did not grow in co-culture; W303Clump, an evolved derivative
  carrying mutations that enhance fitness in dilute sucrose, did, and maintained viability in continuous
  co-culture for more than two months.

  '
ecological_state: ENGINEERED
