- name: Yeast Stimulation of Cyanobacterial Growth
  description: 'The tested heterotrophic partner increased cyanobacterial abundance relative to axenic controls
    in low-density cocultures. Together with photosynthate-supported heterotroph growth, this supports conditional
    reciprocal benefit. It is not universal stability: dense illuminated cyanobacteria could inhibit heterotroph
    viability. The source proposes metabolite return or byproduct absorption as possible explanations for stimulation,
    without resolving the mediator; respiratory CO2 alone was considered questionable.'
