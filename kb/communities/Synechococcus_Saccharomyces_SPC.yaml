engineering_design:
  objective: A synthetic, light-driven consortium pairing the cyanobacterium Synechococcus elongatus PCC
    7942 (engineered to secrete sucrose via the cscB+ transporter) with Saccharomyces cerevisiae
    W303Clump.
  assembly_strategy: Bottom-up co-culture of engineered Synechococcus elongatus PCC 7942 cscB+ and
    Saccharomyces cerevisiae W303Clump in defined medium under light-driven sucrose cross-feeding
    conditions.
  measurement_endpoints:
