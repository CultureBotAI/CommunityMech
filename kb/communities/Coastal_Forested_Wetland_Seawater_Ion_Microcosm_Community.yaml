ecological_interactions:
- name: Experimental Seawater-Ion Exposure
  description: Soil-core microcosms from one acidic, restored freshwater wetland received deionized water, 5 ppt
    artificial seawater, artificial seawater without sulfate, or sulfate alone. The 12-week experiment separates
    sulfate and non-sulfate mixture effects. It does not isolate sodium chloride from all other ions or establish
    a universal coastal-field response.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  - preferred_term: organic substance catabolic process
    term:
      id: GO:0009056
      label: catabolic process
  downstream:
  - target: Relative Carbon Nitrogen And Phosphorus Gene Abundances
    description: The controlled ion mixtures altered relative DNA gene abundances at week 12, supporting a treatment
      effect on measured functional potential. PARTIAL - the responsible ions and biological mediators remain unresolved;
      this is not evidence of gene expression or activity changes.
  - target: Week-12 Greenhouse-Gas Flux Response
    description: Controlled seawater-ion exposure changed week-12 whole-core net gas fluxes in treatment-specific
      comparisons. PARTIAL - factorial mixture effects and individual pairwise contrasts differ, and community composition
      or gene correlations do not establish the mediators of each gas response.
  evidence:
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Greenhouse gas emissions and microbial richness and composition were altered by artificial seawater
      regardless of whether sulfate was present
    explanation: Supports the experimental community and gas response; primary Results qualify the individual gas
      and diversity comparisons.
  - reference: PMID:38628812
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: other ions present in seawater, not sulfate, drive ecological and biogeochemical responses
    explanation: Supports a non-sulfate mixture effect, not isolation of sodium chloride or exclusion of every sulfate
      response.
- name: Week-12 Sulfate-Reduction Feature Response
  description: Sulfate addition increased porewater sulfate but did not enrich the measured relative sulfate-reducer
    abundance or sulfate-reduction gene features at week 12. Hydrogen sulfide was detected in sulfate-amended water
    at day 14. The bounded abundance result therefore does not establish inactive sulfate reduction, reciprocal
    competition, or absence of all sulfate-only gas effects.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  biological_processes:
  - preferred_term: sulfate reduction
    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: PMID:38628812
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: sulfate alone did not alter emissions or communities
    explanation: 'The abstract generalization is bounded by the primary comparisons: sulfate-only N2O differed from
      the control, while the factorial sulfate effect was not significant.'
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: addition of sulfate alone did not lead to increases in the abundance of sulfate reducing bacteria or
      sulfur cycling genes
    explanation: Supports the week-12 relative-abundance result, not absence of activity; primary day-14 hydrogen
      sulfide measurements provide a distinct functional observation.
- name: Relative Carbon Nitrogen And Phosphorus Gene Abundances
  description: Shotgun DNA metagenomes showed relative abundances of carbon-, nitrogen- and phosphorus-cycling genes
    responding more strongly to artificial-seawater mixtures than sulfate alone. These are community functional-potential
    measurements, not transcript abundance, pathway activity or proof that the correlated genes mediate gas flux.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: organic substance catabolic process
    term:
      id: GO:0009056
      label: catabolic process
  evidence:
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: genes involved in carbon, nitrogen, and phosphorus cycling responded more strongly to artificial seawater
      than to sulfate
    explanation: Supports relative DNA gene-abundance differences and functional potential, not expression or selective
      causal mediation.
- name: Week-12 Greenhouse-Gas Flux Response
  description: Week-12 whole-core net CO2, CH4 and N2O fluxes were measured. CO2 had a significant overall treatment
    and non-sulfate-factor effect but no significant individual pairwise contrasts. CH4 was higher without sulfate
    than in the water control or sulfate-only treatment; complete artificial seawater was intermediate. N2O was
    lower in every amended arm, including sulfate-only, than in the control. These outcomes do not directly partition
    microbial production and consumption pathways.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
