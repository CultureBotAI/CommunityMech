id: CommunityMech:000258
name: Coastal Forested Wetland Seawater-Ion Microcosm Community
description: >
  A restored coastal forested freshwater wetland soil community from the
  Timberlake Observatory for Wetland Restoration in North Carolina, curated
  around a manipulative laboratory microcosm experiment that disentangled
  sulfate from other seawater ions. Intact wetland soil cores received
  deionized water, artificial seawater, artificial seawater without sulfate, or
  sulfate alone, followed by DNA sequencing, biogeochemical measurements, and
  greenhouse gas flux measurements. The experiment found that artificial
  seawater altered microbial richness, composition, functional genes, and
  emissions of carbon dioxide, methane, and nitrous oxide whether sulfate was
  present or absent, whereas sulfate alone did not alter emissions or enrich
  sulfate-reducing bacteria or sulfur cycling genes. The record is DOE-relevant
  because authors were affiliated with the DOE Joint Genome Institute and
  Lawrence Berkeley National Laboratory, and sequencing followed DOE JGI
  methods.
