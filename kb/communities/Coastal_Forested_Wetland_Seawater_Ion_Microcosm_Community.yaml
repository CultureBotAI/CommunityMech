  preparation_notes: 'Four treatments: deionized water (control), artificial seawater (+ASW), ASW without
    sulfate (+ASW-SO4) and sulfate only (+SO4). In +ASW-SO4 the omitted K2SO4 was replaced with equivalent
    additional NaCl and KCl, which is what isolates the sulfate effect from the other seawater ions. The
    composition above is the full +ASW medium. NO INCUBATION TEMPERATURE, pH, LIGHT REGIME OR ATMOSPHERE
    IS REPORTED in the source, so those fields are left unset rather than inferred. The cores were fitted
    with a gas-tight lid only to measure fluxes, so they were not held under a defined headspace and `atmosphere`
    is unset rather than ANAEROBIC (#644); the cores are the growth substrate and the inoculum together,
    so there is no separate formulated growth medium.'
