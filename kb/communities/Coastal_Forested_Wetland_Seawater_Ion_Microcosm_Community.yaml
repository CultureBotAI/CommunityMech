    explanation: 'Gives the artificial-seawater recipe and its 5-ppt salinity. Span starts after the ''[
      50 ]'' citation marker on purpose: validate-references strips bracketed text before matching and
      then reports the wreckage as absent (#622), so a span containing a citation cannot validate.'
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the ASW-SO4 treatment, the absent K2SO4 was replaced with an equivalent amount of additional
      NaCl and KCl.
    explanation: Gives the substitution that makes the sulfate-free treatment ion-matched.
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Soil cores were collected in 2011 from the Timberlake Observatory for Wetland Restoration\
      \ in North Carolina, USA (35\xB054\u203222\u2032\u2032 N, 76\xB009\u203225\u2032\u2032 W, 0-m elevation),\
      \ a forested freshwater wetland in the Alligator River estuary that connects to the Albemarle Sound."
    explanation: Gives the source of the soil cores.
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The collection site is characterized by Eutric Histosol soils and Atlantic white cedar vegetation
    explanation: Gives the soil type and vegetation of the collection site.
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The experiment proceeded for 12\_weeks, after which soils from 0- to 5-cm depth and 10-\
      \ to 15-cm depth profiles were collected, a portion stored at \u221220\xB0C for DNA sequencing,\
      \ and another aliquot analyzed for porewater and soil biogeochemistry."
    explanation: Gives the 12-week duration.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 'Static laboratory microcosms: intact soil cores 2.5 cm diameter by 30 cm deep, water
    level held at the soil surface and topped up every 2 days with the appropriate solution, water column
    unmixed. For flux measurement each core was fitted with a gas-tight lid carrying a Swagelok brass
    sampling port with a 0.6 cm rubber septum; headspace was sampled at 0 and 1 h into evacuated 8 mL
    vials.'
  working_volume: 147
  working_volume_unit: mL
  notes: 'system_type is OTHER because no CultivationSystemEnum value denotes an intact soil core. working_volume
    is the core''s geometric volume (pi x 1.25^2 x 30 cm = ~147 cm3), not a reported figure -- the source
    gives dimensions rather than a volume. The manipulation is the water chemistry, not the vessel: this
    is a static incubation, so there is no feed, dilution or retention time to record.'
  controls_notes: 'The source reports no incubation temperature, no pH and no dissolved-oxygen control.
    All three of temperature_controlled, ph_controlled and do_controlled are therefore left UNSET rather
    than false: false would assert that temperature was not controlled, which is a finding the source
    does not support, and an absence recorded as a finding is the #183 failure mode (#644).'
  evidence:
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Laboratory microcosms were started with intact soil cores 2.5\_cm in diameter and 30-cm\
      \ deep, which then received either deionized water (control), artificial seawater (+ASW), artificial\
      \ seawater without sulfate (+ASW-SO4), and sulfate only (+SO4)."
    explanation: Gives the core dimensions and the treatment structure.
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Water level was maintained at the soil surface; this was monitored every 2\_days and refilled\
      \ as necessary with the appropriate solution. The water column was not mixed."
    explanation: Gives the water-level maintenance and that the column was unmixed.
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To measure CO2, CH4, and N2O, cores were fitted with a gas tight lid with a Swagelok brass
      sampling port with a rubber septum (0.6
    explanation: Gives the gas-tight lid and sampling port used for flux measurement.
  - reference: PMID:38628812
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The experiment proceeded for 12\_weeks, after which soils from 0- to 5-cm depth and 10-\
      \ to 15-cm depth profiles were collected, a portion stored at \u221220\xB0C for DNA sequencing,\
      \ and another aliquot analyzed for porewater and soil biogeochemistry."
    explanation: Gives the incubation length.
