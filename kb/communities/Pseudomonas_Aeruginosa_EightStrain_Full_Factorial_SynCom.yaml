id: CommunityMech:000399
name: Pseudomonas aeruginosa Eight-Strain Full-Factorial SynCom
description: 'A full-factorial synthetic community panel built from eight Pseudomonas aeruginosa mutants: pAOV, PA14, NfxB,
  ParR-CAZ, mexZ, OrfN, NfxB-CAZ, and MDR6-CAZ. Diaz-Colunga et al. assembled all 256 strain combinations in LB medium in
  96-well plates, measured post-growth absorbance spectra after 40 h at 37 C, and identified the three-member 00001101 consortium
  containing strains 1, 3, and 4 as the highest-Abs600 combination.'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Assemble a combinatorially complete eight-member P. aeruginosa mutant SynCom panel to measure the community-function
    landscape of biomass-associated Abs600 productivity.
  assembly_strategy: Grow each mutant monoculture in LB medium, homogenize them, combinatorially assemble all 2^8 strain combinations
    with PBS volume/density normalization, and dilute each assembled inoculum 1:400 into fresh LB medium in 96-well plates.
  measurement_endpoints:
  - full absorbance spectra of every strain combination
  - Abs600 as an example community-level function
  - diversity-function curves across all 256 combinations
  - functional effects and pairwise functional interactions across ecological backgrounds
  - third-order interaction in the 00001101 high-Abs600 trio
  evidence:
  - reference: PMID:42153623
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we construct a combinatorially complete set of consortia from a library of eight Pseudomonas aeruginosa strains,
      and empirically measure the community-function landscape of biomass productivity
    explanation: Supports the eight-strain full-factorial SynCom panel objective.
  - reference: PMID:42153623
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Monocultures were allowed to grow for 24 hr at 37 °C, after which we used them to assemble all 2 8 strain combinations
      as described in the main text.
    explanation: Supports using separately grown mutant monocultures as inputs for the full 2^8 strain-combination design.
