- name: Highest-Abs600 00001101 trio
  description: The highest Abs600 value in the demonstrator experiment came from consortium 00001101, the three-mutant Pseudomonas
    aeruginosa combination containing pAOV, NfxB, and ParR-CAZ; its positive third-order functional interaction is statistical
    under the source's additive Abs600 baseline, not a resolved molecular competition mechanism.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas aeruginosa pAOV
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  - preferred_term: Pseudomonas aeruginosa NfxB
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  - preferred_term: Pseudomonas aeruginosa ParR-CAZ
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  evidence:
  - reference: PMID:42153623
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the consortium with the highest function contains only three strains (consortium 00001101, containing strains
      1, 3, and 4)
    explanation: Identifies the highest-Abs600 strain-number trio in the panel.
  - reference: PMID:42153623
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the three strains engage in a positive third- order functional interaction (see inset in Figure 5E) which rescues
      the function of the trio
    explanation: Supports a community-level third-order functional interaction in the 1/3/4 high-Abs600 trio.
  - reference: PMID:42153623
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under this definition, the term interaction should be interpreted in a statistical, rather than biological sense
    explanation: Clarifies that the high-Abs600 trio's interaction coefficient is a statistical deviation from an additive
      function baseline, not a resolved biological competition mechanism.
