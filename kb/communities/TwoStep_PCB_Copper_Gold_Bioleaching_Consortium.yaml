id: CommunityMech:000491
name: Two-Step PCB Copper and Gold Bioleaching Consortium
description: Engineered two-step bioleaching process for biological recovery of copper and gold from discarded printed circuit
  boards (PCBs). In the first acidic step, chemolithotrophic acidophiles Acidithiobacillus ferrivorans and Acidithiobacillus
  thiooxidans bioleach 98.4% of copper from 1% pulp density (10 g/L PCB concentration) at pH 1.0-1.6 and ambient temperature
  (23 +/- 2 degrees C) in 7 days. In the second alkaline step, cyanide-producing heterotrophs Pseudomonas putida (strain WCS361,
  producing 21.5 +/- 1.5 mg/L cyanide from 10 g/L glycine) and Pseudomonas fluorescens mobilize 44.0% of gold from the Cu-leached
  PCB material at pH 7.3-8.6 and 30 degrees C in 2 days (PMID:26704063).
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOMINING
environment_term:
  preferred_term: laboratory environment
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Two-step laboratory bioleaching of discarded printed circuit boards at 1% pulp density (10 g/L PCB concentration,
    pH 1.0-1.6 at 23 +/- 2 degrees C for 7 days followed by pH 7.3-8.6 with 10 g/L glycine at 30 degrees C for 2 days; PMID:26704063).
