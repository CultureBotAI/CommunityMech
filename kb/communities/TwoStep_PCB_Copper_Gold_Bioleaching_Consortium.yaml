  - target: Second-Step Alkaline Cyanogenic Gold Mobilization from Cu-Leached PCBs
    description: Solubilization of 98.4% of copper in step 1 removes interfering copper and produces Cu-leached PCB material
      for subsequent alkaline cyanogenic gold mobilization by Pseudomonas putida and Pseudomonas fluorescens.
  evidence:
  - reference: PMID:26704063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the first step, chemolithotrophic acidophilic Acidithiobacillus ferrivorans and Acidithiobacillus thiooxidans
      were used. In the second step, cyanide-producing heterotrophic Pseudomonas fluorescens and Pseudomonas putida were used.
    explanation: Establishes the co-application of A. ferrivorans and A. thiooxidans for first-step copper bioleaching.
  - reference: PMID:26704063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Results showed that at a 1% pulp density (10g/L PCB concentration), 98.4% of the copper was bioleached by a mixture
      of A. ferrivorans and A. thiooxidans at pH 1.0-1.6 and ambient temperature (23±2°C) in 7days.
    explanation: Quantifies 98.4% copper bioleaching by the A. ferrivorans and A. thiooxidans mixture at 1% pulp density (10
      g/L PCB), pH 1.0-1.6, and 23 +/- 2 degrees C in 7 days.
  - reference: PMID:26704063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This gold complexing agent was used in the subsequent bioleaching step using the Cu-leached (by A. ferrivorans
      and A. thiooxidans) PCB material, 44.0% of the gold was mobilized in alkaline conditions at pH 7.3-8.6, and 30°C in
      2days.
    explanation: Supports the downstream transition from first-step Cu-leached PCB material to second-step alkaline gold mobilization.
