- name: First-Step Acidophilic Copper Bioleaching from Waste PCBs
  description: Chemolithotrophic acidophiles Acidithiobacillus ferrivorans and Acidithiobacillus thiooxidans co-leach 98.4%
    of copper from 1% pulp density (10 g/L PCB concentration) at pH 1.0-1.6 and ambient temperature (23 +/- 2 degrees C) in
    7 days, generating Cu-leached PCB material for subsequent alkaline gold recovery.
