id: CommunityMech:000362
name: Sphingobium-Nitrososphaera Phenanthrene-Carbon SynCom
description: A defined two-member synthetic community consisting of the PHE-degrading bacterium Sphingobium sp. RS2 and the
  carbon-sequestering archaeon Nitrososphaera viennensis EN76. The SynCom was added to phenanthrene-contaminated lettuce-soil
  pot experiments, where the accessible abstract reports 90.02% PHE removal from soil, an 81.07% reduction in PHE transferred
  to lettuce, and increases in soil organic carbon, microbial carbon, and total carbon.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine a PHE-degrading Sphingobium bacterium with a carbon-sequestering Nitrososphaera archaeon to mitigate
    the suppression of soil carbon synthesis in phenanthrene-contaminated soil.
  assembly_strategy: Construct a two-member SynCom from Sphingobium sp. RS2 and Nitrososphaera viennensis EN76.
  perturbation_design: Add the Sphingobium-Nitrososphaera SynCom to phenanthrene-contaminated lettuce pot experiments and
    measure soil/plant PHE and soil carbon responses.
  measurement_endpoints:
  - phenanthrene removal from soil
  - phenanthrene transferred to lettuce
  - soil organic carbon
  - microbial carbon
  - total carbon
  - modeled abundance of soil carbon-fixing and PHE-degrading microorganisms
  notes: The accessible PubMed abstract gives the exact SynCom members and high-level pot-experiment outcomes, but not the
    inoculation ratio, soil PHE dose, pot conditions, or assay timing.
  evidence:
  - reference: PMID:41967346
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we constructed a synthetic community (SynCom) consisting of PHE-degrading bacterium Sphingobium sp. RS2 and carbon-sequestering
      archaeon Nitrososphaera viennensis EN76
    explanation: Supports the exact two-member synthetic assembly.
  - reference: PMID:41967346
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results of the pot experiment indicated that 90.02% of the PHE was effectively removed from the soil and
      81.07% of the PHE transferred to the lettuce was reduced by the addition of SynCom.
    explanation: Supports the phenanthrene-removal and lettuce-transfer endpoints in pot experiments.
  - reference: PMID:41967346
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: demonstrated that these effects were primarily driven by a continuous increase in the absolute abundance of soil
      carbon-fixing microorganisms and PHE-degrading microorganisms after SynCom addition.
    explanation: Supports the modeled link between SynCom addition and enriched carbon-fixing/PHE-degrading guilds.
