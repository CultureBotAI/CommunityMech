id: CommunityMech:000270
name: Trichoderma-Streptomyces Filamentous Cellulose Coculture
description: >
  A synthetic filamentous coculture pairing the cellulolytic fungus
  Trichoderma reesei RUT-C30 with the noncellulolytic bacterium Streptomyces
  coelicolor A3(2). The coculture was designed to use cellulose as the carbon
  source, making S. coelicolor dependent on hydrolysate sugars released by T.
  reesei cellulases. The system is DOE-relevant as a controllable model for
  lignocellulose-oriented coculture bioprocessing, where population dynamics,
  cellulase formation, and secondary-metabolite/pigment production can be tuned
  through inoculation ratio and abiotic process parameters.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: >
    Develop a tractable filamentous coculture model for controlling population
    dynamics while linking cellulose hydrolysis by T. reesei to S. coelicolor
    growth and pigment production.
  assembly_strategy: >
    Pair cellulolytic Trichoderma reesei RUT-C30 with noncellulolytic
    Streptomyces coelicolor A3(2) in a cellulose-fed synthetic coculture.
  perturbation_design: >
    Tune the community using different inoculation ratios and abiotic factors,
    including osmolality and shaking frequency.
  measurement_endpoints:
  - respiration rate
  - mCherry fluorescence from T. reesei
  - mNeonGreen fluorescence from S. coelicolor
  - cellulase formation
  - pigment production
  evidence:
  - reference: PMID:36314761
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: developed a model filamentous coculture of the cellulolytic fungus Trichoderma reesei RUT-C30 and the noncellulolytic bacterium Streptomyces coelicolor A3(2)
    explanation: Supports the exact two-member synthetic filamentous coculture design.
  - reference: PMID:36314761
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: applied high-throughput online monitoring of the respiration rate and fluorescence of the tagged strains
    explanation: Supports the curated monitoring endpoints.
