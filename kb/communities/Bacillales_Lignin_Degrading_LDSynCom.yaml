ecological_interactions:
- name: LDSynCom lignin phenolic release
  description: The complete 11-member Bacillales LDSynCom released a higher Folin-Ciocalteu total-phenolic signal from lignin
    than the uninoculated, Paenibacillus sp. 11B-only, and 11B-dropout controls.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
    concentration: 0.1% in the 41- to 42-day dropout assay; 1 g/L in the screening, SEM, and proteomics assays
  biological_processes:
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  evidence:
  - reference: doi:10.64898/2026.08.24.746789
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The LDSynCom samples produced significantly higher phenolic signals than the uninoculated control
    explanation: Supports community-level lignin-associated phenolic release measured by the Folin-Ciocalteu assay.
- name: Paenibacillus 11B contribution to LDSynCom phenolic accumulation
  description: 'Paenibacillus sp. 11B contributed to, but did not alone explain, the community phenotype: removing 11B decreased
    overall growth and phenolic accumulation relative to full LDSynCom, while 11B alone accumulated less biomass than the
    complete consortium.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Paenibacillus sp. 11B
    term:
      id: NCBITaxon:3060965
      label: Paenibacillus sp. 11B
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  biological_processes:
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  evidence:
  - reference: doi:10.64898/2026.08.24.746789
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Removing strain 11B from the LDSynCom reduced the overall growth
    explanation: Supports the 11B dropout effect without asserting that all lignin degradation is exclusive to 11B.
- name: LDSynCom lignin-particle biofilm formation
  description: After growth in M9 medium with beechwood lignin, LDSynCom cells formed extracellular-matrix-associated biofilm
    structures attached to lignin particles.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: doi:10.64898/2026.08.24.746789
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: well-developed biofilm structures could be observed attached to the surface of lignin particles
    explanation: Supports lignin-particle biofilm formation as an observed community-level phenotype in the SEM assay.
