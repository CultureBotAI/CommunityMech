id: CommunityMech:000383
name: Bacillales Lignin-Degrading LDSynCom
description: An engineered eleven-strain Bacillales synthetic community assembled for aerobic beechwood-lignin degradation
  in M9 minimal medium. Zhou et al. 2026 screened a 121-strain Bacillales collection with a bottom-up clear-halo lignin-utilization
  assay and a top-down M9-lignin enrichment, distilled 15 candidates with crystal-violet biofilm and methylene-blue/Azure-B
  dye-decolorization assays, and retained 11 strains for the lignin-degrading SynCom. The final LDSynCom formed biofilms on
  lignin particles, accumulated more Folin-Ciocalteu-reactive phenolics than uninoculated and 11B-dropout controls, and produced
  extracellular proteomes whose lignin-induced proteins included Paenibacillus sp. 11B ring-cleaving dioxygenase candidates.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Construct a Bacillales synthetic community that combines ligninolytic capacity with biofilm-forming members for
    beechwood-lignin transformation under controlled M9 minimal-medium conditions.
  assembly_strategy: Screen 121 Bacillales strains with a bottom-up M9 agar clear-halo assay on kraft and beechwood lignin,
    enrich the complete 121-strain library in M9-lignin shake flasks as a top-down biofilm-forming screen, reduce the resulting
    15 candidates with crystal-violet biofilm and lignin-like dye-decolorization assays, and retain the 11 strains that formed
    biofilm or decolorized lignin-like dyes.
  inoculation_strategy: Grow each retained strain overnight in LB, adjust to OD600 0.8, and inoculate M9-lignin shake flasks
    with 100 uL of each culture for the SynCom lignin-degradation assay.
  perturbation_design: Compare full LDSynCom, LDSynCom lacking Paenibacillus sp. 11B, 11B alone, and an uninoculated M9 medium
    control supplemented with 0.2% glucose and 0.1% lignin over the 41- to 42-day dropout assay.
  measurement_endpoints:
  - single-strain clear-halo growth on M9 agar with glucose, kraft lignin, or beechwood lignin
  - crystal-violet biofilm staining
  - methylene blue and Azure B lignin-like dye decolorization
  - shake-flask OD measurements and A280 lignin absorbance
  - Folin-Ciocalteu A750 total released phenolic signal
  - lignin-particle scanning electron microscopy
  - extracellular diaPASEF LC-MS/MS proteomics after 7 days in M9 with or without lignin
  counter_selection:
  - criterion: Excluded after the 15-candidate stage because the strains had poor biofilm formation and/or low lignin-like
      dye decolorization.
    excluded_count: 4
    evidence:
    - reference: doi:10.64898/2026.08.24.746789
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ACCC04323, LY18, YX13 and DX1.1 showed poor biofilm formation and/or low dye decolorization
      explanation: Supports the four-candidate exclusion set that was not retained in the final LDSynCom.
  notes: Counter-selection is recorded as design logic rather than a taxon-to-taxon interaction because the rejected strains
    are not final LDSynCom members.
  evidence:
  - reference: doi:10.64898/2026.08.24.746789
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 121 strains used in this work are from the order Bacillales
    explanation: Supports the Bacillales starting collection used for SynCom assembly.
  - reference: doi:10.64898/2026.08.24.746789
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a total 11 strains were shown to produce biofilm or decolorize lignin-like dyes
    explanation: Supports the final 11-strain SynCom selection criterion.
