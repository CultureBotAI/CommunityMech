id: CommunityMech:000298
name: Shewanella-Acetogen Electrosynthetic Consortia for CO2-to-Acetate
description: Defined synthetic microbial electrosynthesis (MES) consortia constructed by pairing the
  model bidirectional electroactive bacterium Shewanella oneidensis MR-1 with either the electroactive
  acetogen Clostridium aceticum or the nonelectroactive acetogen Acetobacterium woodii, mimicking
  functional guilds of natural MES communities. Co-cultivation boosts CO2-to-acetate production by up
  to 88%. The two pairings use distinct interspecies electron transfer (IET) modes, namely direct
  interspecies electron transfer (DIET) via cytochrome c and riboflavin at the biofilm-electrode interface in the
  S. oneidensis-C. aceticum consortium, versus H2/formate-mediated IET in the planktonic phase for the
  S. oneidensis-A. woodii consortium. This metabolic stratification lets S. oneidensis act as an
  "ecosystem engineer" orchestrating electron flow across biofilm and suspension niches.
