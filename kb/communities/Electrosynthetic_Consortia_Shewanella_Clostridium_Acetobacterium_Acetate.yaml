discussions:
- discussion_id: electrosynthetic_route_specificity_and_alternative_pairs
  prompt: Which electron-transfer routes are necessary within each alternative pair?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Proposed Biofilm-Associated IET in the S. oneidensis-C. aceticum Pair
  - ecological_interactions#Proposed Planktonic H2/Formate IET in the S. oneidensis-A. woodii Pair
  - ecological_interactions#Enhanced CO2-to-Acetate Conversion
  rationale: 'Keep the two measured alternative pairs separate. Spectroscopy, electrochemistry, metabolite profiles,
    riboflavin add-back and daily planktonic-cell removal support compartment-associated models but do not isolate
    contact-only DIET or donor-resolved hydrogen/formate flux. Riboflavin is a diffusible mediator; hydrogen appears
    in both systems. Instantaneous apparent compartment contributions can exceed 100% and are not cumulative flux
    partitions. Main Methods describe DNA/16S, fhs copies and normalized gene abundance; do not call these transcript
    measurements without reviewing the unread supplement. The proposed acetate-formate recycling and future three-member
    consortium are hypotheses, not new measured causal nodes. Preserve canonical taxonomy and leave non-graph role,
    voltage and control wording to #1455.'
  posed_by: codex
  posed_date: '2026-10-06'
