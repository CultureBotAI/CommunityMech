ecological_interactions:
- name: Proposed Biofilm-Associated IET in the S. oneidensis-C. aceticum Pair
  description: 'PARTIAL: In the C. aceticum-S. oneidensis pair, biofilm-associated electron transfer is supported
    by compartment-removal responses, electrochemical and spectroscopic readouts, and riboflavin add-back. The authors
    call this DIET, but these assays do not uniquely establish contact-only transfer or selective cytochrome necessity;
    riboflavin is also a diffusible mediator. The canonical target label Andreesenella acetica preserves the source
    organism called C. aceticum. Product enhancement does not demonstrate obligatory syntrophy.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Shewanella oneidensis MR-1
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
  target_taxon:
    preferred_term: Clostridium aceticum (electroactive acetogen)
    term:
      id: NCBITaxon:84022
      label: Andreesenella acetica
  metabolites:
  - preferred_term: riboflavin
    term:
      id: CHEBI:17015
      label: riboflavin
  downstream:
  - target: Enhanced CO2-to-Acetate Conversion
    description: 'PARTIAL: Biofilm-associated electron supply and riboflavin-responsive transfer can support the
      C. aceticum pair''s acetate increase. Compartment removal and add-back support this contribution, but do not
      isolate the necessity of contact-only DIET or a specific cytochrome. This arrow concerns the CS pair, not
      a simultaneous three-member culture.'
  evidence:
  - reference: PMID:41236292
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: DIET via cytochrome c and riboflavin dominates at the biofilm-electrode interface in S. oneidensis-C.
      aceticum consortia
    explanation: The abstract states the authors' route model; the reviewed main-body assays do not uniquely resolve
      contact-only DIET.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: metabolite profiling (H2, formate, riboflavin), biomass distribution and fhs gene copy numbers, and
      functional prediction
    explanation: Identifies complementary readouts rather than a selective molecular-route perturbation.
- name: Proposed Planktonic H2/Formate IET in the S. oneidensis-A. woodii Pair
  description: 'PARTIAL: The A. woodii-S. oneidensis pair favors suspension-associated acetate synthesis, consistent
    with a diffusible hydrogen/formate electron-transfer model. These culture-level profiles and compartment interventions
    do not trace donor-resolved transfer or establish an exclusive route; hydrogen was detected in both alternative
    pairs. Daily apparent biofilm/suspension contributions are instantaneous responses to cell removal, not cumulative
    mass-balanced flux fractions, and may exceed 100% through compensatory responses.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Shewanella oneidensis MR-1
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
  target_taxon:
    preferred_term: Acetobacterium woodii (nonelectroactive acetogen)
    term:
      id: NCBITaxon:33952
      label: Acetobacterium woodii
  metabolites:
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  downstream:
  - target: Enhanced CO2-to-Acetate Conversion
    description: 'PARTIAL: Diffusible reducing equivalents are a supported explanation for suspension-associated
      acetate synthesis in the AS pair, including acetate production where A. woodii alone failed at the tested
      lower cell voltage. This does not establish exclusive hydrogen/formate mediation or identify the molecular
      donor flux.'
  evidence:
  - reference: PMID:41236292
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: whereas S. oneidensis-A. woodii consortia prefer H2/formate-mediated IET in the planktonic phase
    explanation: States the authors' preferred route model, not a directly traced partner-to-partner flux.
  - reference: PMID:41236292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: failed to produce acetate
    explanation: The 0.54-V A. woodii monoculture comparison supports assistance by the partner, without identifying
      a unique transferred mediator.
- name: Enhanced CO2-to-Acetate Conversion
  description: Two alternative two-member consortia, not one three-member community, increased acetate accumulation
    relative to their corresponding acetogen monocultures. At 0.88-V applied cell voltage, AS reached 1.16 g/L versus
    0.62 g/L for A. woodii alone, and CS reached 1.05 g/L versus 0.56 g/L for C. aceticum alone. The participating
    taxa are the combined comparison roster; the acetogens were alternatives. Open-circuit cultures used H2/CO2
    whereas driven cultures used N2/CO2, so that contrast is not voltage-only. Aggregate production does not prove
    reciprocal fitness or obligate syntrophy.
  scope: COMMUNITY_LEVEL
  metabolites:
