ecological_interactions:
- name: BS3 Ethanol Detoxification and Riboflavin Shuttle Supply with SO3ΔmtrCΔomcA
  description: In the SO3ΔmtrCΔomcA-BS3 consortium, Bacillus subtilis 168 BS3 oxidizes residual brewing-wastewater ethanol
    to acetate via the P43::adh-aldH dual-enzyme cascade, secretes riboflavin from glucose as an extracellular electron shuttle,
    and expresses Deinococcus radiodurans IrrE alongside SO3ΔmtrCΔomcA (which catabolizes lactate and expresses Ptac::ribADEHC-irrE)
    to maintain syntrophic partner viability during NCM bioleaching.
