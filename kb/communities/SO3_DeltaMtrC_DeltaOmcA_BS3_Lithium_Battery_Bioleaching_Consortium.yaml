      and supplying riboflavin as an electron shuttle.
- name: Attenuated EET and NCM Metal Oxide Leaching in SO3ΔmtrCΔomcA-BS3 Consortium
  description: Deletion of outer-membrane decaheme c-type cytochrome genes mtrC and omcA in SO3ΔmtrCΔomcA disrupted both direct
