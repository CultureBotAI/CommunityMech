id: CommunityMech:000528
name: SO3-Delta-mtrC-Delta-omcA-BS3 Lithium-ion Battery Bioleaching Consortium
description: Two-member engineered outer-membrane cytochrome perturbation consortium pairing Shewanella oneidensis MR-1 mutant
  strain SO3ΔmtrCΔomcA (outer-membrane decaheme c-type cytochrome genes mtrC and omcA deleted via pHG1.0 homologous recombination
  and transformed with pHG13-Ptac-ribADEHC-irrE, Cmr) with Bacillus subtilis 168 strain BS3 (BS2 carrying P43::irrE on pCE2,
  Cmr) in Moutai brewing wastewater with 0.2 g L^-1 spent LiNixCoyMn1-x-yO2 (NCM) lithium-ion battery cathode black mass (PMID:42733304).
  Assembled to dissect the outer-membrane c-type cytochrome conduit of the SO3-BS3 consortium (CommunityMech:000385; 452.90
  mW m^-2, 102.4 mg L^-1 leached metals), the SO3ΔmtrCΔomcA-BS3 consortium exhibited a 15.95-fold decrease in microbial fuel
  cell maximum power density to 28.39 mW m^-2 (Figure 5c) and a 7.64-fold decrease in 14-day total leached Li, Ni, Co, and
  Mn ions to 13.4 mg L^-1 (Figure 5d), compared with 13.4 mg L^-1 for sole strain BS3 monoculture (CommunityMech:000529).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Quantify the contribution of outer-membrane c-type cytochrome(s) (outer-membrane decaheme c-type cytochrome genes
    mtrC and omcA) in Shewanella oneidensis SO3 to direct and riboflavin-shuttle-mediated extracellular electron transfer
    (EET) and NCM cathode metal oxide leaching when co-cultured with Bacillus subtilis BS3.
  assembly_strategy: Delete outer-membrane decaheme c-type cytochrome genes mtrC and omcA in wild-type S. oneidensis MR-1
    via two-step pHG1.0 homologous recombination with sacB sucrose counter-selection, transform with pHG13-Ptac-ribADEHC-irrE
    to obtain SO3ΔmtrCΔomcA, and co-inoculate with B. subtilis 168 BS3 (pCE2-P43::adh-aldH-irrE in BSG3).
  inoculation_strategy: Pre-culture SO3ΔmtrCΔomcA and BS3 separately overnight in LB medium with 0.2 g L^-1 chloramphenicol,
    inoculate each at 1% (v/v) into Moutai brewing wastewater with 0.5 mM IPTG, transfer to anaerobic bottles with 0.2 g L^-1
    spent NCM black mass, and ferment anaerobically at 30 degrees C for 14 days.
  perturbation_design: Compare SO3ΔmtrCΔomcA-BS3 (28.39 mW m^-2, 13.4 mg L^-1 leached metals) against parental SO3-BS3 (452.90
    mW m^-2, 102.4 mg L^-1), the companion cytochrome-deletion consortia in Figure 5c,d, and sole strain BS3 monoculture (13.4
    mg L^-1).
  measurement_endpoints:
  - microbial fuel cell maximum power density (28.39 mW m^-2; 15.95-fold decrease vs SO3-BS3)
  - 14-day total leached Li, Ni, Co, and Mn concentration (13.4 mg L^-1; 7.64-fold decrease vs SO3-BS3)
  - comparison against sole-strain BS3 monoculture leaching baseline (13.4 mg L^-1)
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To this end, the genes encoding the critical c‐Cytochromes (MtrC and OmcA) in the EET conduits of S. oneidensis
      were individually or simultaneously deleted in strain SO3 using the homologous recombination method, resulting in the
      mutant strains SO3∆mtrC, SO3∆omcA, and SO3∆mtrC∆omcA.
    explanation: Describes the homologous-recombination construction of SO3ΔmtrCΔomcA to dissect the MtrC/OmcA EET conduit.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Correspondingly, compared with the total leached metal ions catalyzed by the SO3‐BS3 microbial consortium (102.4
      mg L−1), the contents of leached metal ions catalyzed by the SO3∆mtrC‐BS3 consortium (16.7 mg L−1), the SO3∆omcA‐BS3
      microbial consortium (18.7 mg L−1), and the SO3∆mtrC∆omcA‐BS3 consortium (13.4 mg L−1) were dramatically decreased by
      6.13‐, 5.48‐, and 7.64‐fold, respectively (Figure 5d ).
    explanation: Quantifies the 14-day total leached metal ion yield (13.4 mg L^-1, 7.64-fold reduction vs SO3-BS3) for the
      SO3ΔmtrCΔomcA-BS3 consortium.
