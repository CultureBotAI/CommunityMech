      label: carbon fixation
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  downstream:
  - target: Methane and Carbon Dioxide Conversion to Biomass
    description: PARTIAL - cyanobacterial carbon assimilation contributes to coculture biomass, with respiratory
      CO2 recycling supported by the follow-up mass-balance interpretation. The individual rates are stoichiometric
      estimates, so this arrow does not establish the exact recycled fraction or mutually enhanced growth.
  evidence:
  - reference: PMID:28092828
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: robust growth on diverse gas mixtures
    explanation: Supports positive gas-fed coculture growth, not the partition of cyanobacterial carbon between
      feed and methanotroph respiration.
  - reference: PMID:33064298
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: individual consumption and production rates of O2 and CO2
    explanation: The 20ZR/PCC7002 follow-up estimates individual gas rates from measured overall changes, TIC and
      growth stoichiometry (equations 3-9). Flow cytometry comparison validates biomass estimates, not an independent
      direct measurement of partner gas exchange.
- name: Methane and Carbon Dioxide Conversion to Biomass
  description: The 20z/PCC7002 coculture converts methane and carbon dioxide from tested gas feedstocks into microbial
    biomass. This positive system endpoint is distinct from a demonstrated increase in each partner's fitness. The
    quantitative follow-up uses the 20ZR derivative with PCC7002; its mass-balance estimates should not be treated
    as direct exchange measurements in the original continuous reactor.
