ecological_interactions:
- name: Photosynthetic O2 Support for Methane Oxidation
  description: Synechococcus PCC 7002 supplies photosynthetic O2 supporting aerobic methane oxidation by M. alcaliphilum
    20z. The 2017 continuous synthetic-natural-gas process reached steady state under coupled light and O2 limitations,
    with an O2-depleted reactor and no fed CH4/O2 mixture. Oxygen depletion does not imply anaerobic methane oxidation;
    directed support alone does not establish reciprocal fitness benefit.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Synechococcus PCC 7002
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  target_taxon:
    preferred_term: Methylomicrobium alcaliphilum 20z
    term:
      id: NCBITaxon:1091494
      label: Methylotuvimicrobium alcaliphilum 20Z
  metabolites:
  - preferred_term: oxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  downstream:
  - target: Methane and Carbon Dioxide Conversion to Biomass
    description: Photosynthetic oxygen production supports aerobic methane oxidation and thereby positive whole-coculture
      conversion of gas carbon into biomass. This physiological coupling is retained without requiring an independently
      measured respiratory-CO2 transfer rate or reciprocal growth enhancement.
  evidence:
  - reference: PMID:28092828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: via oxygenic photosynthesis
    explanation: Supports photosynthetic O2 production as the coupling mechanism.
  - reference: PMID:28092828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: does not require CH4/O2 mixtures to be fed
    explanation: Supports in situ O2 provisioning by the cyanobacterium during methane-fed cocultivation.
- name: CO2 Utilization by Cyanobacterial Partner
  description: PARTIAL - the cyanobacterium uses inorganic carbon from the supplied gas/medium and can use CO2 released
    by methanotroph respiration. The 20ZR/PCC7002 follow-up supports this exchange interpretation using an experimental-computational
    mass balance, not independently measured partner-specific CO2 flux. The respiratory contribution is inferred
    from methane uptake and growth stoichiometry; it is not separately isotope-resolved from supplied inorganic
    carbon.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylomicrobium alcaliphilum 20z
    term:
      id: NCBITaxon:1091494
