discussions:
- discussion_id: gas_feedstock_respired_carbon_and_rate_estimation
  prompt: How much cyanobacterial carbon derives from methanotroph respiration under each gas regime?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Photosynthetic O2 Support for Methane Oxidation
  - ecological_interactions#CO2 Utilization by Cyanobacterial Partner
  - ecological_interactions#Methane and Carbon Dioxide Conversion to Biomass
  rationale: 'Keep positive photosynthetic O2 support and gas-to-biomass conversion. The 2017 exact-pair abstract
    was read; PNNL PDF download returned 403, so its full controls are not certified. Public PMID:33064298 accepted
    manuscript and included supplement text were read; equation pages 10-11 visually checked. Organism-specific
    O2/CO2 rates derive from total gas changes, TIC and growth coefficients, with dissolved O2 neglected. Flow cytometry/OD
    checks support biomass estimation, not independent gas-flux validation. Its saltwater 20ZR/PCC7002 pair differs
    from the separate M. capsulatus/C. sorokiniana pair; the latter''s oxygen-limited inoculum response must not
    be imported here. #1609 repairs graph wording; #1612 keeps non-graph measurement/protocol claims open.'
