id: CommunityMech:000170
name: Methylotuvimicrobium-Synechococcus Gas Feedstock Coculture
description: >
  A defined synthetic methanotroph-cyanobacterium coculture developed at Pacific Northwest
  National Laboratory for simultaneous use of methane and carbon dioxide gas feedstocks. The
  methanotrophic bacterium Methylomicrobium alcaliphilum 20z, currently represented by NCBI as
  Methylotuvimicrobium alcaliphilum 20Z, is coupled to the cyanobacterium Synechococcus PCC 7002,
  currently represented by NCBI as Picosynechococcus sp. PCC 7002. The coculture converts CH4 and
  CO2 into microbial biomass through oxygenic photosynthesis-driven O2 supply to the methanotroph
  and respiratory CO2 supply to the photoautotroph, with follow-up work using the same species pair
  for quantitative coculture characterization.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert methane and carbon dioxide from biogas, natural gas, or related gas feedstocks
    into microbial biomass using a defined binary methanotroph-cyanobacterium coculture.
  assembly_strategy: Bottom-up two-member coculture coupling a methanotrophic bacterium to a
    cyanobacterium via oxygenic photosynthesis.
  perturbation_design: Batch and continuous coculture experiments tested diverse gas mixtures,
    synthetic natural gas feed, and coupled light/O2 limitations.
  measurement_endpoints:
  - Coculture growth on gas mixtures
  - Methane and CO2 conversion to biomass
  - O2 depletion in continuous cultivation
  - Individual biomass concentration and O2/CO2 rates in follow-up characterization
  evidence:
  - reference: PMID:28092828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: converts greenhouse gasses, CH4 and CO2, into microbial biomass
    explanation: Supports the gas-feedstock conversion objective.
  - reference: PMID:28092828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: coupled to a cyanobacterium, Synechococcus PCC 7002 via oxygenic photosynthesis
    explanation: Supports the engineered binary assembly strategy.
