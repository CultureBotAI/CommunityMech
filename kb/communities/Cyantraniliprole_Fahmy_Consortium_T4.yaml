- name: HPLC-confirmed cyantraniliprole removal
  description: In NPK-amended freshwater microcosms incubated at 30 C for 20 days, T4 augmentation was associated
    with HPLC-measured cyantraniliprole decline from a 57.79 mg/L zero-day residue to 1.00 mg/L, corresponding to
    98.27% removal from the recovered starting residue after a nominal 60 mg/L spike. This positive treatment-level
    outcome occurred alongside a native water microbiota and exceeded uninoculated controls. Parent-compound loss
    does not establish complete mineralization, detoxification, member-specific contribution, reciprocal benefit
    or enzyme mediation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'after 20 days of incubation at 30 °C, as confirmed by HPLC analysis, with the six-strain consortium
      (T4), comprising Bacillus subtilis subsp. subtilis AZFS3, Bacillus pumilus AZFS5, Bacillus mojavensis AZFS15,
      Bacillus paramycoides AZFS18, Pseudomonas aeruginosa KZFS4, and Alcaligenes aquatilis KZFS11, demonstrating
      the highest removal efficiency (98.27%) and reducing the pesticide concentration to 1.00 mg/L

      '
    explanation: Supports the six-strain treatment and measured HPLC endpoint. The percentage uses Table 7 zero-day
      recovery, not the nominal dose. Native-water controls and the predictive pathway analysis do not establish
      member-resolved causal flux or mutualism.
  participating_taxa:
