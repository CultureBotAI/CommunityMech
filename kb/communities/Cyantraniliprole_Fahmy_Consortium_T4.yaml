discussions:
- discussion_id: cyantraniliprole_t4_expressed_enzymes
  prompt: Which T4 enzymes and members causally mediate parent-compound removal, and what transformation products
    and fitness effects result?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#T4 distributed cyantraniliprole enzyme potential
  - ecological_interactions#HPLC-confirmed cyantraniliprole removal
  rationale: 'The complete primary body supports positive HPLC parent-removal outcomes, growth and redox proxies,
    and post-assay predicted pathway coverage. It does not experimentally assign the predicted enzyme activities
    or intermediary flux to T4 strains. Selective member/enzyme perturbations, product identification and mass balance
    would test mediation and distinguish removal from mineralization or detoxification. Reciprocal fitness benefits
    and the suggested reduced consortium remain untested. The former prediction-to-removal workflow arrow is not
    restored. Salinity and temperature inconsistencies in non-graph metadata remain in #1371.'
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'To facilitate practical bioremediation, subsequent studies should prioritize the characterization
      of bacterial enzymes that degrade cyantraniliprole.

      '
    explanation: 'Supports leaving strain-specific cyantraniliprole enzyme expression as an open mechanistic gap.

      '
  posed_by: codex
  posed_date: '2026-09-13'
