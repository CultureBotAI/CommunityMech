  - name: NPK fertilizer
  - name: cyantraniliprole
    concentration: '60'
    unit: mg/L
    chebi_term:
      preferred_term: cyantraniliprole
      term:
        id: CHEBI:132300
        label: cyantraniliprole
  temperature: '30'
  temperature_unit: degrees Celsius
  incubation_time: '20'
  incubation_time_unit: days
  preparation_notes: >
    Treatment T4 contained cyantraniliprole-polluted water supplemented with NPK
    and inoculated with the Fahmy consortium before HPLC residue analysis.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Treatments T1–T4 exposed cyantraniliprole-polluted water to NPK and
      distinct bacterial consortia: T1 (Consortium No. 1), T2 (Consortium No.
      2), T3 (Consortium No. 3), and T4 (Consortium No. 4, Fahmy consortium).
    explanation: Supports the T4 water-plus-NPK treatment design.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Biodegradation of Cyantraniliprole added at 60 mg/L in water and recovery
      (zero-day) tests with bacterial consortia during the incubation periods at
      30 °C for 20 days, as determined by HPLC in water.
    explanation: >
      Supports the cyantraniliprole dose, water matrix, temperature, duration,
      and HPLC measurement.
