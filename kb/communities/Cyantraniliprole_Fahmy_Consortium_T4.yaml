id: CommunityMech:000369
name: Cyantraniliprole Fahmy Consortium T4
description: >
  A defined six-member bacterial consortium, designated T4 or Fahmy-consortia,
  that was previously characterized for pesticide bioremediation and was
  re-evaluated as a cyantraniliprole-removal benchmark in simulated contaminated
  water. The consortium contains Bacillus subtilis subsp. subtilis AZFS3,
  Bacillus pumilus AZFS5, Bacillus mojavensis AZFS15, Bacillus paramycoides
  AZFS18, Pseudomonas aeruginosa KZFS4, and Alcaligenes aquatilis KZFS11. In
  20-day, 30 C simulated-water microcosms seeded with standardized bacterial
  inocula, T4 achieved the highest tested cyantraniliprole removal: HPLC
  measured 98.27% removal from the 57.79 mg/L zero-day residue and a 1.00 mg/L
  residue after 20 days in the nominal 60 mg/L treatment.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >
    Benchmark a previously characterized pesticide-bioremediation consortium
    against newly constructed six-member consortia for cyantraniliprole removal
    from simulated contaminated water and for broad diamide-insecticide growth
    capacity.
  assembly_strategy: >
    Include the previously characterized Bacillus-Pseudomonas-Alcaligenes
    Fahmy consortium as Consortium No. 4 / T4 after earlier diamide- and
    pesticide-bioremediation studies identified this exact six-strain group.
  measurement_endpoints:
  - cyantraniliprole residue by HPLC in simulated water microcosms
  - DCPIP decolorization time in Bushnell-Haas broth
  - biomass and biofilm optical density under cyantraniliprole stress
  - OD600 growth on five diamide insecticides in mineral salt medium
  - predicted cyantraniliprole enzyme and transformation pathway coverage
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      T4 + Fahmy-consortia + Bacillus subtilis subsp. subtilis AZFS3, Bacillus
      pumilus AZFS5, Bacillus mojavensis AZFS15, Bacillus paramycoides AZFS18,
      Pseudomonas aeruginosa KZFS4, and Alcaligenes aquatilis KZFS11
    explanation: >
      Identifies the exact six members of treatment T4, the Fahmy consortium, in
      the simulated-water bioremediation design.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      For comparative analysis, a previously characterized group, designated here
      as Consortium No. 4, was also included.
    explanation: >
      Supports treating T4 as a previously characterized benchmark rather than
      as one of the three newly constructed 2026 consortia.
