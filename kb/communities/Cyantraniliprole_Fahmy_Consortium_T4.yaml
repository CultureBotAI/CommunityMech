- name: DCPIP decolorization time
  value: '17'
  unit: h
  description: >
    T4 was the fastest consortium in the 0.1% DCPIP/Bushnell-Haas 72 h assay.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Table 5 Decolorization time (hours) of 0.1% DCPIP indicator in
