      (72 h). Relative Biodegradation Activity * Cyantraniliprole Control No
      Decolorization No Activity Consortia (No. 1) 27 a Moderate Consortia (No.
      2) 23 b High Consortia (No. 3) 20 c Very high Fahmy-Consortia 17 d
      Highest
    explanation: Supports the 17 h DCPIP endpoint and its highest activity rank.
- name: Broad diamide-insecticide growth OD600
  value: 2.211-2.272
  unit: OD600
  description: >
    T4 had the highest OD600 values on cyantraniliprole, flubendiamide,
    chlorantraniliprole, cyclaniliprole, and fluchlordiniliprole at 100 mg/L and
    35 C in Mineral Salt Medium.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Fahmy-Consortia 4 2.211 a 2.230 a 2.272 a 2.262 a 2.216 a
    explanation: >
      Table 6 reports T4 OD600 values across the five diamide insecticides in
      Mineral Salt Medium.
- name: Optimized cyantraniliprole growth conditions
  value: 30-35 C, pH 7.0-8.0, 0.5-5.0% NaCl, 11 days, 150 rpm
  description: >
    Growth optimization across environmental parameters favored mesophilic,
    neutral-to-slightly alkaline, low-salinity, shaken MSM conditions with
    50 mg/L cyantraniliprole.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      optimal degradation observed at 30–35 °C, pH 7.0–8.0, 0.5–5.0% NaCl, and
      11 days of incubation at 150 rpm using an initial cyantraniliprole
      concentration of 50 mg/L
    explanation: >
      Supports the reported condition window for cyantraniliprole degradation by
      the tested consortia.
