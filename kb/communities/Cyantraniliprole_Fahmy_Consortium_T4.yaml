ecological_interactions:
- name: T4 distributed cyantraniliprole enzyme potential
  description: >
    Bioinformatic prediction assigned T4 a distributed enzyme set covering the
    five enzyme classes the authors considered necessary for the cyantraniliprole
    degradation pathway. Individual predicted enzyme activities differed among
    strains, so the record captures this as community-level functional
    complementarity and not as a resolved pairwise metabolite exchange.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: HPLC-confirmed cyantraniliprole removal
    description: >
      The predicted enzyme suite was interpreted after HPLC water-microcosm
      assays in which T4 had the highest cyantraniliprole removal among the four
      tested consortia.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      While T3 had 24 enzymes and T4 had 22, the critical factor was that both
      contained all five key enzymes necessary for the complete degradation
      pathway, most notably including the enzyme catechol O-methyltransferase
      (COMT).
    explanation: >
      Supports predicted coverage of all five cyantraniliprole-degradation
      enzyme classes by the T4 consortium without proving pairwise metabolite
      exchange.
    computational_provenance:
      prediction_type: OTHER
      tools:
      - tool_name: EAWAG-BBD pathway prediction system
        role: predicted cyantraniliprole transformation pathway and associated enzyme coverage
      parameters: >
        Pathway and enzyme-activity prediction used to compare candidate enzyme
        coverage across Consortia No. 1-4; tool version and sequence-search
        thresholds were not reported in the source paper.
- name: HPLC-confirmed cyantraniliprole removal
  description: >
    In simulated contaminated water amended with NPK and incubated at 30 C, T4
    removed 98.27% of the initial 60 mg/L cyantraniliprole dose and left the
    lowest 20-day residual concentration among the tested consortia.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      In simulated contaminated water (60 mg/L cyantraniliprole), bacterial
      inoculants standardized to 107 CFU/mL achieved substantial degradation
      after 20 days of incubation at 30 °C, as confirmed by HPLC analysis, with
      the six-strain consortium (T4), comprising Bacillus subtilis subsp.
      subtilis AZFS3, Bacillus pumilus AZFS5, Bacillus mojavensis AZFS15,
      Bacillus paramycoides AZFS18, Pseudomonas aeruginosa KZFS4, and
      Alcaligenes aquatilis KZFS11, demonstrating the highest removal efficiency
      (98.27%) and reducing the pesticide concentration to 1.00 mg/L
    explanation: >
      Supports the exact T4 composition and the HPLC-confirmed cyantraniliprole
      removal endpoint in 20-day simulated contaminated water.
