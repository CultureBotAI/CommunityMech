ecological_interactions:
- name: T4 distributed cyantraniliprole enzyme potential
  description: Post-assay bioinformatic analysis assigns the T4 strains a combined repertoire spanning five enzyme
    classes proposed for cyantraniliprole transformation. These are predicted functions and pathway coverage, not
    measured enzyme expression, catalytic activity or necessary member-specific flux. The six-strain aggregate can
    have complementary potential without demonstrated reciprocal fitness benefits or resolved metabolite exchange;
    the simpler four-strain design suggested by the authors was not experimentally validated.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'While T3 had 24 enzymes and T4 had 22, the critical factor was that both contained all five key enzymes
      necessary for the complete degradation pathway, most notably including the enzyme catechol O-methyltransferase
      (COMT).

      '
    explanation: Supports the authors' predicted repertoire coverage, not measured enzyme activity, confirmed pathway
      intermediates, mutualism or an experimentally established four-strain minimum. Table 8 is explicitly bioinformatic
      despite its gene-activation wording.
    computational_provenance:
      prediction_type: OTHER
      tools:
      - tool_name: EAWAG-BBD pathway prediction system
        role: predicted cyantraniliprole transformation pathway and associated enzyme coverage
      parameters: 'Pathway and enzyme-activity prediction used to compare candidate enzyme coverage across Consortia
        No. 1-4; tool version and sequence-search thresholds were not reported in the source paper.

        '
