discussions:
- discussion_id: cyantraniliprole_t4_expressed_enzymes
  prompt: >
    Which T4 member enzyme activities are expressed during cyantraniliprole
    biodegradation, and which predicted transformation products are formed?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#T4 distributed cyantraniliprole enzyme potential
  rationale: >
    The 2026 study used bioinformatic prediction to map candidate
    cyantraniliprole-degradation enzymes and noted simpler transformation
    products, but it did not experimentally assign expressed enzymes or measured
    intermediates to specific T4 strains.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      To facilitate practical bioremediation, subsequent studies should
      prioritize the characterization of bacterial enzymes that degrade
      cyantraniliprole.
    explanation: >
      Supports leaving strain-specific cyantraniliprole enzyme expression as an
      open mechanistic gap.
