ecological_interactions:
- name: PMSX synergistic biofilm formation
  description: The complete four-member PMSX SynCom produced more crystal-violet biofilm biomass than any of its mono-, dual-,
    or triple-species subsets across the tested carbon-source conditions.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:42658845
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all tested conditions, the SynCom consistently formed more biofilm biomass than any of its subsets, indicating
      a robust synergistic phenotype.
    explanation: Supports a measured community-level synergistic biofilm phenotype.
    confidence_score: 0.9
- name: Polymeric carbon-driven spatial self-organization
  description: 'Carbon substrate type altered the PMSX biofilm architecture: cellobiose left the four members relatively intermixed,
    whereas CMC and xylan produced non-degrader clusters with P. amylolyticus enriched at their periphery.'
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
