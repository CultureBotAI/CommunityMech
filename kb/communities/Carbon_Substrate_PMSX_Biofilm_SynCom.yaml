id: CommunityMech:000400
name: PMSX Carbon-Substrate Biofilm SynCom
description: A defined four-member bacterial SynCom, abbreviated PMSX, containing Paenibacillus amylolyticus, Microbacterium
  oxydans, Stenotrophomonas rhizophila, and a strain reclassified as Stenotrophomonas maltophilia. Zhu et al. grew the soil
  isolates in M9 media and chemically defined 3D-printed hydrogels with diffusible sugars or polymeric cellulose/xylan carbon
  sources, measured crystal-violet biofilm biomass and FISH spatial patterning, and found that the complete SynCom robustly
  formed more biofilm than subsets while polymer-rich carbon sources drove self-organization around the Paenibacillus member.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Test whether carbon substrate type controls spatial self-organization and synergistic biomass formation in a
    tractable four-member bacterial biofilm SynCom.
  assembly_strategy: 'Combine four soil isolates as community PMSX: P. amylolyticus (P), M. oxydans (M), S. rhizophila (S),
    and S. maltophilia (X).'
  perturbation_design: Grow mono-, subset-, and four-member cultures on M9 media or 3D-printed cellulose-nanofiber hydrogels
    containing soluble glucose, xylose, or cellobiose and polymeric CMC, cellulose, alginate, or corncob xylan carbon sources.
  measurement_endpoints:
  - 96-well growth curves on individual carbon sources
  - crystal-violet biofilm biomass in static culture
  - Congo red binding on mono-, dual-, triple-, and quad-species colonies
  - FISH microscopy and pair-correlation analysis of biofilm spatial organization
  - conditioned-supernatant biofilm assays
  - CAZyme repertoire analysis
  - genome-scale metabolic modeling with SMETANA
  evidence:
  - reference: PMID:42658845
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we focus on how carbon substrate type, distinguishing between diffusible sugars and polymeric substrates, affects
      biofilm self-organization in a four-member synthetic bacterial community (SynCom)
    explanation: Supports the central four-member carbon-substrate biofilm design.
    confidence_score: 0.9
  - reference: PMID:42658845
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using chemically defined, 3D-printed hydrogel substrates with consistent physical properties, we varied carbon
      source composition to identify its impact on biofilm assembly.
    explanation: Supports 3D-printed hydrogels with controlled carbon-source variation.
    confidence_score: 0.9
