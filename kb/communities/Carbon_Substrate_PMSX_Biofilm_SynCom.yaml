  evidence:
  - reference: PMID:42658845
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On the simple substrates (e.g. cellobiose) both curves stay near 1, indicating a well-mixed, unstructured community;
      while on the polymeric substrates (e.g. CMC, xylan) the non-degrader members show strong short-range co-clustering
    explanation: Supports different FISH pair-correlation structure on simple versus polymeric carbon sources.
    confidence_score: 0.9
  - reference: PMID:42658845
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. amylolyticus is enriched at the periphery of those clusters which is consistent with substrate complexity
      driving spatial self-organization around P. amylolyticus.
    explanation: Supports peripheral localization of the putative primary degrader on polymer-rich substrates.
    confidence_score: 0.85
