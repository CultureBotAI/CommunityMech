    term:
      id: NCBITaxon:74969
      label: Ferroplasma acidiphilum
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Proposed Leptospirillum-derived organic matter; iron oxidation is not itself a transferred nutrient in
