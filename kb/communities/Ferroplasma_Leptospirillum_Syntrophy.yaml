ecological_interactions:
- name: Proposed Leptospirillum Organic-Matter Supply
  description: 'HYPOTHESIZED: L. ferriphilum growth supplies organic matter usable by F. acidiphilum. The inspected
    Merino abstract states this as the study hypothesis, not a quantified release flux or a resolved substrate identity.
    Retain the upstream supply context without asserting Calvin-Benson-Bassham fixation, mineral-specific dissolution,
    toxic accumulation thresholds or their relief in the exact pair.'
  scope: PAIRWISE
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Generic proposed organic substrate class; no compound identity or release flux established by the inspected
      abstract.
  downstream:
  - target: Proposed Ferroplasma Organic-Matter Consumption
    description: 'HYPOTHESIZED: Organic matter released during Leptospirillum growth would provide substrate for
      Ferroplasma consumption. This is the source-stated supply hypothesis, not a traced partner-to-partner flux;
      reciprocal supernatant growth does not identify the transferred compound or prove the detoxification mechanism.'
  evidence:
  - reference: PMID:27535541
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The hypothesis of this work is that F. acidiphilum uses the organic matter secreted by L. ferriphilum
      for growth
    explanation: Preserves the explicit hypothesis qualifier rather than using co-occurrence as evidence of an exact
      carbon-release pathway.
  source_taxon:
    preferred_term: Leptospirillum ferriphilum
    term:
      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
- name: Proposed Ferroplasma Organic-Matter Consumption
  description: 'HYPOTHESIZED: Organic matter supplied by L. ferriphilum contributes carbon to F. acidiphilum BRL-115
    and its removal relieves inhibition of the bacterium. Reciprocal filtered-supernatant growth supports soluble
    partner effects, but the inspected abstract does not establish identified transferred substrates, assimilation
    flux or detoxification thresholds. BRL-115 chemomixotrophy and the 0.04% yeast-extract growth optimum are characterization
    results, not proof of the proposed mediator in mixed culture. CROSS_FEEDING denotes this proposed transfer,
    not established obligate syntrophy.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Leptospirillum ferriphilum
    term:
      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
  target_taxon:
