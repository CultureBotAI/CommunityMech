  evidence:
  - reference: PMID:27535541
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The hypothesis of this work is that F. acidiphilum uses the organic matter secreted by L. ferriphilum
      for growth
    explanation: The authors state a working hypothesis; positive supernatant responses do not uniquely establish
      organic-carbon assimilation or detoxification.
  - reference: PMID:27535541
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: acidiphilum, strain BRL-115 is a chemomixotrophic organism, and its growth is maximized with yeast
      extract at a concentration of 0.04% wt/vol
    explanation: Supports BRL-115 characterization, not a measured carbon transfer or the mixed culture's optimal
      yeast-extract requirement.
- name: Ferroplasma Iron-Metabolism Context
  description: 'Ferroplasma iron metabolism is physiological context, not an observed niche-partitioning interaction.
    Ferrer studied strain Y(T), reporting ferrous-iron oxidation and iron-rich proteins; this is not BRL-115 in
    the Leptospirillum pair. Wilson compared isolated rusticyanins: the archaeal FaR had similar redox potential
    but slower electron transfer than AfR. These sources do not establish lower-oxygen complementarity, a pair-specific
    membrane complex, competition relief or stable coexistence. Protein electron-transfer properties do not measure
    consortium iron-oxidation flux.'
  scope: PAIRWISE
  metabolites:
  - preferred_term: Fe(II)
    term:
      id: CHEBI:29033
      label: iron(2+)
  - preferred_term: Fe(III)
    term:
      id: CHEBI:29034
      label: iron(3+)
  evidence:
  - reference: PMID:38593609
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While both N0 and FaR show redox potentials similar to that of AfR their electron transport rates were
      significantly slower.
    explanation: Isolated-protein comparison, not a demonstrated pathway in the BRL-115 coculture.
  - reference: PMID:17203061
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: F. acidiphilum strain Y(T) is a chemoautotroph
    explanation: Strain-specific physiological context; do not transfer the Y(T) result to chemomixotrophic BRL-115
      or infer oxygen partitioning.
  source_taxon:
    preferred_term: Ferroplasma acidiphilum
    term:
      id: NCBITaxon:74969
      label: Ferroplasma acidiphilum
- name: Reciprocal Filtered-Medium Growth Response
  description: In reciprocal assays, each organism grew favorably in filtered medium from its partner. This supports
    diffusible partner-associated growth effects without requiring direct cell contact in those assays, but does
    not identify the mediators, show equal reciprocal benefit in simultaneous coculture or prove obligatory syntrophy.
    Mixed-culture growth rates were used as input to flux-balance analysis; model behavior is not independent measurement
    of exchanged flux. Organic-matter consumption cannot be treated as the demonstrated cause of both reciprocal
    responses.
  scope: COMMUNITY_LEVEL
  participating_taxa:
