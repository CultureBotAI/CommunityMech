discussions:
- discussion_id: ferroplasma_soluble_mediation_and_strain_scope
  prompt: Which soluble factors mediate the reciprocal growth response of BRL-115 and L. ferriphilum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Proposed Leptospirillum Organic-Matter Supply
  - ecological_interactions#Proposed Ferroplasma Organic-Matter Consumption
  - ecological_interactions#Ferroplasma Iron-Metabolism Context
  - ecological_interactions#Reciprocal Filtered-Medium Growth Response
  rationale: 'Only cited abstracts were inspected. The primary abstract explicitly frames carbon supply and detoxification
    as a hypothesis. Reciprocal filtered-medium responses do not identify molecules, quantify partner-resolved flux
    or establish toxic thresholds. Growth-rate inputs to FBA are not independent flux observations. Preserve only
    the HYPOTHESIZED supply-to-consumption arrow and remove its unsupported extension to both reciprocal assays.
    Y(T) iron-rich proteins and isolated FaR kinetics are separate systems, not oxygen-niche or pair-specific membrane-complex
    evidence. No new structure is added. Non-graph physiology, medium and syntrophy claims remain #1462.'
  posed_by: codex
  posed_date: '2026-10-06'
