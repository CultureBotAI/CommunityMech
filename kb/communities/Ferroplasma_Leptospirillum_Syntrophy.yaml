environmental_factors:
- name: Extreme Acidity
  value: 0.7-2.5
  unit: pH
  description: 'Extremely acidic conditions typical of acid mine drainage and biomining environments.
    Ferroplasma thrives at pH 0.7-2.5, Leptospirillum at pH 1.2-2.0. Both organisms are obligate acidophiles
    with specialized proton homeostasis mechanisms. The low pH keeps ferric iron soluble and prevents
    metal hydroxide precipitation.

    '
  evidence:
  - reference: PMID:16104851
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: are probably the major players in the biogeochemical cycling of sulfur and sulfide metals
      in highly acidic environments, and may have considerable potential for biotechnological applications
      such as biomining and biocatalysis under extreme conditions.
    explanation: Establishes extreme acidity tolerance
- name: Temperature
  value: 30-50
  unit: °C
  description: 'Mesophilic to moderately thermophilic temperature range. Leptospirillum optimum 30-40°C,
    Ferroplasma optimum 35-45°C. Some Ferroplasma strains (F. thermophilum) are more thermophilic and
    can operate at 50°C. Temperature affects mineral dissolution kinetics and microbial growth rates.

    '
  evidence:
  - reference: PMID:27535541
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ferroplasma acidiphilum and Leptospirillum ferriphilum are the dominant species in extremely
      acid environments and have great use in bioleaching applications; however, the role of each species
      in this consortia is still a subject of research
    explanation: Establishes co-culture growth conditions
- name: Oxygen Availability
  value: Aerobic to microaerobic
  unit: qualitative
  description: 'Leptospirillum is an obligate aerobe requiring oxygen as terminal electron acceptor. Ferroplasma
    is microaerophilic, capable of growth at lower oxygen concentrations. This niche partitioning allows
    coexistence with Leptospirillum occupying aerobic zones and Ferroplasma occupying microaerobic zones,
    reducing competition. Both use oxygen for iron oxidation.

    '
  evidence:
  - reference: PMID:27535541
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: F. acidiphilum, strain BRL-115 is a chemomixotrophic organism, and its
      growth is maximized with yeast extract at a concentration of 0.04% wt/vol
    explanation: Merino et al. 2016 characterize F. acidiphilum BRL-115 as
      chemomixotrophic — confirms the aerobic (Fe-oxidizing plus organic-C-utilizing)
      metabolism in Ferroplasma.
- name: Metal Concentrations
  value: High Fe, Cu, Zn, As
  unit: qualitative
  description: 'Metal-rich environments with high concentrations of iron, copper, zinc, and arsenic from
    mineral dissolution. Ferroplasma exhibits extreme metal tolerance, particularly to arsenic and copper.
    Both organisms require high iron concentrations (mM range) for energy metabolism. Metal toxicity excludes
    most organisms, creating niches for specialized acidophiles.

    '
  evidence:
  - reference: PMID:16104851
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: For several decades, the bacterium Acidithiobacillus (previously Thiobacillus) has been considered
      to be the principal acidophilic sulfur- and iron-oxidizing microbe inhabiting acidic environments
      rich in ores of iron and other heavy metals, responsible for the metal solubilization and leaching
      from such ores, and has become the paradigm of such microbes
    explanation: Establishes metal-rich habitat
  - reference: PMID:17203061
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: acidiphilum therefore has a currently unique iron-protein-dominated cellular machinery and
      biochemical phylogeny.
    explanation: Reflects adaptation to high-iron environments
- name: Organic Matter Stress
  value: 0.5 g/L yeast extract
  unit: g/L
  description: 'Presence of organic matter (0.5 g/L yeast extract) creates stress for Leptospirillum but
    is mitigated by Ferroplasma consumption. In pure Leptospirillum cultures, organic matter inhibits
    growth. In co-culture, Ferroplasma maintains organic compounds below toxic levels, enabling the consortium
    to tolerate environments contaminated with organic carbon sources.

    '
  evidence:
  - reference: PMID:27535541
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: maintaining low levels of organic compounds in the culture medium,
      preventing their toxic effects on L. ferriphilum
    explanation: Merino et al. 2016 frame the organic-matter stress on L. ferriphilum
