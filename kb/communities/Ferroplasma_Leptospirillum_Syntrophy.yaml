- name: Enhanced Chalcopyrite Bioleaching
  description: 'The syntrophic consortium outperforms pure cultures in bioleaching chalcopyrite (CuFeS₂)
    and pyrite (FeS₂). Under organic matter stress (0.5 g/L yeast extract), the co-culture achieves 31.5%
    higher copper extraction and 31.7% higher ferric iron generation compared to pure cultures of either
    organism. The improvement results from: (1) Ferroplasma consuming organic matter that would inhibit
    Leptospirillum, (2) enhanced Leptospirillum stress resistance and oxidative phosphorylation gene expression,
    (3) complementary oxygen niches (aerobic Leptospirillum + microaerobic Ferroplasma), and (4) sustained
    high Fe³⁺ generation from both organisms. Cell growth is favorably affected by filtered medium from
    the partner, confirming synergistic interaction. This makes the consortium valuable for industrial
    biomining where organic matter contamination is common.

    '
