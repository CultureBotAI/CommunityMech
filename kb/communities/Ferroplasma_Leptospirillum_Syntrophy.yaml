    extract concentration is critical: 0.04% wt/vol (0.4 g/L) is optimal for F. acidiphilum growth. Higher
    concentrations (0.5 g/L) create organic matter stress that demonstrates the syntrophic benefit of
    co-culture. Co-culture achieves 31.5% higher copper extraction and 31.7% higher Fe3+ generation compared
    to monocultures under organic stress conditions. Leptospirillum is an obligate aerobe requiring oxygen,
    while Ferroplasma is microaerophilic and tolerates lower O2. Cultures maintained with aeration but
    not vigorous sparging to accommodate both organisms.'
