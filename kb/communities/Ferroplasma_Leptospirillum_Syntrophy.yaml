id: CommunityMech:000027
name: Ferroplasma-Leptospirillum Iron-Cycling Syntrophy
description: 'A synergistic two-member consortium consisting of the cell wall-lacking archaeon Ferroplasma
  acidiphilum and the iron-oxidizing bacterium Leptospirillum ferriphilum, found in extremely acidic,
  metal-rich environments including acid mine drainage and biomining operations. The partnership is
  centered on reciprocal soluble-metabolite effects: F. acidiphilum can use organic matter secreted by
  L. ferriphilum for growth, keeping low organic compound concentrations that would otherwise inhibit
  L. ferriphilum, and filtered medium from either partner favors growth of the other organism. This
  archaeal-bacterial partnership thrives at extremely low pH and represents a model system for studying
  cross-domain syntrophy in biomining acidophiles.

  '
ecological_state: STABLE
community_origin: NATURAL
community_category: AMD
environment_term:
  preferred_term: acid mine drainage
  term:
    id: ENVO:00001997
    label: acid mine drainage
  notes: 'Extremely acidic (pH <2), metal-rich environments including natural acid mine drainage and industrial
    biomining operations. The consortium thrives on pyrite (FeS₂) and chalcopyrite (CuFeS₂) surfaces where
    ferrous iron concentrations are high. Environments are aerobic to microaerobic, with temperatures
    ranging from 30-50°C. High concentrations of dissolved metals (Fe, Cu, Zn) and sulfate are characteristic.
    The extreme acidity and metal content exclude most organisms, creating niches for specialized acidophiles.

    '
