- name: Filtered Medium Cross-Feeding
  description: 'Cell growth is favorably affected by the presence of filtered medium of the partner organism,
    proving synergistic interaction. Leptospirillum-conditioned medium contains organic secretions that
    stimulate Ferroplasma growth. Ferroplasma-conditioned medium contains factors (possibly growth factors,
    vitamins, or signaling molecules) that enhance Leptospirillum activity. This demonstrates that the
    partnership involves exchange of multiple metabolites beyond simple organic carbon transfer, potentially
    including vitamins, cofactors, or quorum sensing molecules. The positive effects of filtered medium
    (which excludes direct cell contact) prove the interaction is mediated by soluble factors rather than
    physical contact.

    '
