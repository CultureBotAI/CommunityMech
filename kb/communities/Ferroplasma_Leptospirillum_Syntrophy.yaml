      majority_fraction: 0.91
      total_genomes: 22
      is_reclassified: true
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25)
    notes: 'Cell wall-lacking archaeon (Thermoplasmatales) that grows chemomixotrophically, oxidizing
      ferrous iron while utilizing organic compounds for carbon. In syntrophic partnership with Leptospirillum,
      F. acidiphilum consumes organic matter secreted by the bacterium, maintaining low organic compound
      concentrations that prevent toxic effects on Leptospirillum. Uses organic matter from L. ferriphilum
      for growth while oxidizing Fe²⁺ for energy. Pleomorphic morphology due to lack of peptidoglycan.
      Thrives at extremely low pH (0.7-2.5), temperature 35-45°C, and exhibits extreme metal tolerance
      (arsenic, copper). Microaerophilic, capable of growth at low oxygen concentrations. Cellular machinery
      is iron-protein-dominated, reflecting adaptation to metal-rich environments. Probably a major player
      in biogeochemical cycling of sulfur and sulfide metals in highly acidic environments.

      '
