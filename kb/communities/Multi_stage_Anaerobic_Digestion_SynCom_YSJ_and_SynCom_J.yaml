id: CommunityMech:000274
name: Multi-stage Anaerobic-Digestion SynCom-YSJ and SynCom-J
description: Two function-driven synthetic microbial communities (SynComs) constructed for
  bioaugmentation of food-waste anaerobic digestion. SynCom-J is a methanogen-only consortium,
  whereas SynCom-YSJ is a multi-stage consortium comprising hydrolytic, acidogenic, and
  methanogenic members. Both were introduced into semi-continuous reactors already harboring a
  metabolically complete native microbiome. The multi-stage SynCom-YSJ increased methane yield by
  22% (vs 8% for SynCom-J), nearly eliminated the start-up lag phase, reduced propionate
  accumulation, and reshaped the digester microenvironment (elevated acetate, reduced propionate),
  upregulating genes for hydrolysis, acidogenesis, interspecies electron transfer, energy
  metabolism, and acetoclastic/hydrogenotrophic methanogenesis. Individual member species are not
  named in the source abstract, so no NCBITaxon-grounded members are asserted here.
