ecological_interactions:
- name: Staged metabolic hand-off across hydrolytic, acidogenic and methanogenic members
  description: SynCom-YSJ combines hydrolytic, acidogenic and methanogenic members in reactors with a metabolically
    complete native microbiome. Relative to the non-bioaugmented control, methane yield increased by 22% for YSJ
    versus 8% for methanogen-only SynCom-J; YSJ nearly eliminated start-up lag. Both consortia reduced propionate
    accumulation by 1.6-fold. PARTIAL - Staged metabolite hand-off is the proposed cross-feeding mechanism, not
    a resolved transfer between particular introduced members or a YSJ-specific propionate advantage.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    notes: Short-chain VFA elevated in the SynCom-bioaugmented digesters.
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
    notes: Short-chain VFA whose accumulation was reduced by both introduced SynComs.
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Terminal methanogenic product enhanced by the staged SynCom-YSJ design.
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  downstream:
  - target: Putative interspecies electron transfer supporting methanogenesis
    description: HYPOTHESIZED - Hydrolytic and acidogenic processing can supply methanogenic substrates and thereby
      support electron-transfer-associated methanogenesis. The available abstract reports coordinated functional
      changes after bioaugmentation but does not resolve this mediation or separate introduced-member hand-off from
      native-community activity.
  evidence:
  - reference: PMID:41825563
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: a multi-stage consortium comprising hydrolytic, acidogenic, and methanogenic members (SynCom-YSJ)
    explanation: Defines staged functional guilds; membership alone does not demonstrate donor-recipient flux.
  - reference: PMID:41825563
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increased methane yield by 22% (vs. 8% for SynCom-J) and nearly eliminated the start-up lag phase,
      while both consortia reduced propionate accumulation by 1.6-fold.
    explanation: Preserves measured treatment effects and their non-bioaugmented comparator; both consortia reduce
      propionate.
- name: Putative interspecies electron transfer supporting methanogenesis
  description: PARTIAL - Metagenomic analysis associates YSJ bioaugmentation with hydrolysis, acidogenesis, interspecies
    electron transfer, energy metabolism and methanogenesis functions. The abstract calls this gene upregulation;
    this metagenomic statement alone does not establish transcription, protein activity, measured electron flux,
    direct electrical transfer or obligate syntrophy. Methane gains are retained independently of the unresolved
    transfer mechanism.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Methane output increases after bioaugmentation; its electron-transfer route is not resolved by the available
      abstract.
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  downstream:
  - target: Deterministic selection of the resident community by SynCom colonization
    description: HYPOTHESIZED - Electron-transfer-associated methanogenesis could alter acetate and propionate turnover,
      changing the chemical environment that selects resident taxa. Bioaugmentation changes both function and community
      structure; the abstract does not isolate electron transfer as the cause of pool shifts or deterministic selection.
  evidence:
  - reference: PMID:41825563
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: upregulating genes involved in hydrolysis, acidogenesis, interspecies electron transfer, energy metabolism,
      and acetoclastic/hydrogenotrophic methanogenesis
    explanation: Supports the authors metagenomic functional interpretation, not measured expression or an identified
      electron carrier.
- name: Deterministic selection of the resident community by SynCom colonization
  description: Successful SynCom colonization is reported with elevated acetate, reduced propionate and a moderate
    non-inhibitory total-ammonia-nitrogen increase. PARTIAL - Deterministic selection through this changed environment
    is the authors interpretation, not demonstration of pairwise resource competition. SynCom-J produced a more
    robust network, whereas YSJ prioritized methane yield with a more complex network; higher methane output is
    not universally greater network stability.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    notes: Elevated short-chain VFA in the SynCom-remodeled anaerobic-digester microenvironment.
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
    notes: Short-chain VFA reduced in the SynCom-remodeled anaerobic-digester microenvironment.
  evidence:
  - reference: PMID:41825563
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: thereby imposing deterministic selection on the resident community
    explanation: Reports the selection interpretation; it does not identify competitive fitness effects or isolate
      individual environmental mediators.
