ecological_interactions:
- name: Predicted SynCom-to-SFB metabolite exchange
  description: 'HYPOTHESIZED/PARTIAL: iNAP 2.0 predicted potential metabolite exchange from SynComBac10 to segmented
    filamentous bacteria, including the reported siderophore candidate. Culture-supernatant metabolomics corroborated
    production of a subset of predicted metabolites, but production is not measured transfer to SFB in the intestine.
    The source proposes cross-feeding as an explanation for SFB establishment and acknowledges alternative community
    effects.'
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: chicken intestinal SynComBac10 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  - preferred_term: segmented filamentous bacteria
    term:
      id: NCBITaxon:49082
      label: Candidatus Neoarthromitus
  metabolites:
  - preferred_term: staphyloferrin B
    term:
      id: CHEBI:134612
      label: staphyloferrin B
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: SFB-Driven Th17 Immune Priming
    description: 'HYPOTHESIZED/PARTIAL: predicted nutrient provision may help account for the observed SFB establishment
      upstream of Th17 induction. The study supports SFB-associated immune induction, but does not establish the
      predicted exchange as its necessary upstream mediator.'
  evidence:
  - reference: PMID:40266232
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: staphyloferrin B, a siderophore, could be provided from six SynComBac10 members (L. reuteri CML393,
      B. velezensis CML396, E. faecium CML291, M. funiformis CML154, R. lituseburensis CML137, and E. sp. CML138)
      to SFB
    explanation: Supports a predicted donor-recipient route, not experimentally traced in-host transfer.
    computational_provenance:
      prediction_type: METABOLIC_INTERACTION_SIMULATION
      tools:
      - tool_name: iNAP
        tool_version: '2.0'
        role: Prediction of potentially transferable metabolites
      model_source: Metabolic information from SynComBac10 member and reconstructed SFB genomes
      parameters: Potential transfer prediction; supernatant metabolite detection is separate evidence and does
        not measure recipient uptake.
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we performed metabolomic profiling of the bacterial culture supernatants, and ultimately, a total of
      18 metabolites were confirmed
    explanation: Preserves the positive metabolite-detection result without equating production with transfer.
- name: SFB-Driven Th17 Immune Priming
  description: SFB-associated intervention increased intestinal Th17 cells, supported by cellular profiling and
    flow cytometry, alongside the Th17 increase in SynComBac10-treated chickens. This is host immune induction,
    not a colonization-facilitation interaction. The specifically Th17 observation should not be represented only
    as regulation of innate immunity.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: segmented filamentous bacteria
    term:
      id: NCBITaxon:49082
      label: Candidatus Neoarthromitus
  downstream:
  - target: Host protection after SynComBac10 exposure
    description: 'HYPOTHESIZED/PARTIAL: SFB-associated Th17 responses are proposed to contribute to the protective
      host outcomes after SynComBac10 exposure. The source explicitly leaves other immune and non-immune contributions
      open, so this is not an exclusive or experimentally isolated mediation claim.'
  evidence:
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SFB), which in turn induced Th17 cell-mediated immune responses, thereby conferring resistance to Salmonella
      infection
    explanation: SynComBac10-promoted SFB growth is reported upstream of Th17 immune responses and Salmonella resistance.
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The induction of Th17 cells after SFB spore inoculation was also evidenced by the flow cytometry results
    explanation: Supports the positive cellular immune endpoint beyond transcript association.
- name: Host protection after SynComBac10 exposure
  description: SynComBac10-treated chickens showed improved host growth, tissue and serum outcome measures in the
    reported Salmonella comparison. SFB-associated immune responses are a proposed contributor, not the sole established
    cause of protection. These host endpoints do not demonstrate reciprocal-negative competition between SFB and
    Salmonella, pathogen eradication, or a universal effect across hosts.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: segmented filamentous bacteria
    term:
      id: NCBITaxon:49082
      label: Candidatus Neoarthromitus
  - preferred_term: Salmonella enterica serovar Typhimurium
    term:
      id: NCBITaxon:90371
      label: Salmonella enterica subsp. enterica serovar Typhimurium
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:40266232
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: SFB-enriched SynComBac10 chickens were highly resistant to Salmonella infection due to the SFB-mediated
      immune responses
    explanation: The authors attribute host protection to SFB immunity, but explicitly qualify exclusive attribution
      in the discussion.
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the anti-Salmonella effect of SynComBac10 treatment may not be solely attributed to its induction of
      SFB colonization.
    explanation: States the source limitation on exclusive SFB mediation.
environmental_factors:
- name: early-life gut SynCom exposure
  value: Chickens were exposed early in life to SynComBac10 and evaluated for gut maturation and Salmonella
    resistance.
  description: Early-life exposure and Salmonella infection challenge were used to test gut maturation
    and immune resistance.
  evidence:
  - *id001
related_ingredients:
- preferred_term: staphyloferrin B
  chebi_term:
    id: CHEBI:134612
    label: staphyloferrin B
  relevance: Siderophore predicted (by in-silico metabolic analysis) to be a cross-fed metabolite —
    six SynComBac10 members are inferred to provide staphyloferrin B to segmented filamentous bacteria
    (SFB), a route that would enable Fe³⁺ scavenging SFB cannot achieve on their own (SFB lack
    siderophore biosynthesis genes). Such iron-supplying cross-feeding is proposed to underlie the
    SynComBac10-driven SFB pre-colonization that primes Th17 anti-Salmonella immunity.
  evidence:
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: staphyloferrin B, a siderophore, could be provided from six SynComBac10 members
      (L. reuteri CML393, B. velezensis CML396, E. faecium CML291, M. funiformis CML154,
      R. lituseburensis CML137, and E. sp. CML138) to SFB
    explanation: In-silico analysis predicts staphyloferrin B as the iron-scavenging metabolite that
      could be cross-fed from six SynComBac10 members to SFB; the snippet's conditional phrasing
      ('could be provided') reflects a computational prediction rather than a measured cross-feeding
      result.
growth_media:
- name: GAM medium (Gifu Anaerobic Medium)
  temperature: '37'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  incubation_time: '72'
  incubation_time_unit: h
  preparation_notes: Each strain grown in liquid medium and diluted 1:10 into fresh medium every 24 h
    for 3 days; SynComBac10 composition analyzed by comparing the absolute abundance of the 10 strains
    in GAM medium; consortium administered to chicks via oral gavage. Cultured without shaking.
  evidence:
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Following a 72-hour growth period at 37°C without shaking under anaerobic conditions
    explanation: 37°C, anaerobic, 72 h growth period without shaking.
  - reference: PMID:40266232
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: absolute abundance of 10 strains in GAM medium
    explanation: GAM (Gifu Anaerobic Medium) used to culture the 10-member consortium.
