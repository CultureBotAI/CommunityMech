ecological_interactions:
- name: Complete-consortium intermediate alkane synergy
  description: The complete consortium, unlike single isolates, generated statistically significant degradation of the intermediate
    C15-C28 n-alkane fraction, consistent with multi-member cascading of alkane-derived byproducts and reduced toxic-intermediate
    accumulation.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: alkane
    term:
      id: CHEBI:18310
      label: alkane
  biological_processes:
  - preferred_term: alkane catabolic process
    term:
      id: GO:0043448
      label: alkane catabolic process
  downstream:
  - target: Statistically significant C15-C28 alkane degradation
    description: The whole consortium promoted intermediate-chain n-alkane removal that isolated strains did not match.
  evidence:
  - reference: PMID:41893893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The microbial consortium proved to be the only treatment capable of promoting statistically significant degradation
    explanation: Supports the whole-consortium degradation advantage for intermediate n-alkanes.
  - reference: PMID:41893893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cooperative action allows for the cascading utilization of byproducts
    explanation: Supports the authors' proposed byproduct-cascade interpretation for the intermediate-fraction synergy.
- name: Rapid and delayed alkane-degradation partitioning
  description: Representative Pseudomonas and Stenotrophomonas members carried alkB and acted as rapid degraders, whereas
    Bacillus sp. OH4 showed delayed late-phase degradation of longer and intermediate alkane fractions, consistent with temporal
    niche partitioning inside the consortium.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  participating_taxa:
