environmental_factors:
- name: Paraffinic crude-oil source
  value: '3'
  unit: g per flask
  description: Three grams of stabilized paraffinic crude oil from the Reconcavo Basin were supplied as the assay carbon source.
  evidence:
  - reference: PMID:41893893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The crude oil used was supplied by the independent operator of onshore oil and gas exploration and production
      Petrorecôncavo S.A.
    explanation: Identifies the paraffinic crude oil used for the alkane-degradation experiment.
- name: Total petroleum hydrocarbon degradation
  value: '47.76'
  unit: average percent over 31 days
  description: The complete consortium averaged 47.76% total petroleum hydrocarbon degradation across the 31-day assay.
  evidence:
  - reference: PMID:41893893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium reached a general average degradation of 47.76%
    explanation: Supports the reported whole-consortium petroleum hydrocarbon degradation endpoint.
- name: Intermediate n-alkane degradation
  value: '52.24'
  unit: percent in first 16 days
  description: The complete consortium degraded 52.24% of intermediate C15-C28 n-alkanes in the first 16 days.
  evidence:
  - reference: PMID:41893893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: achieving 52.24% specifically in the intermediate fraction within the first 16 days
    explanation: Supports the reported intermediate-fraction degradation rate and interval.
