  incubation_time: '31'
  incubation_time_unit: days
  vessel_type: 500 mL Erlenmeyer flask
  preparation_notes: Flasks contained 300 mL Bushnell-Haas Broth, 9 mL standardized saline inoculum, and 3 g crude oil.
