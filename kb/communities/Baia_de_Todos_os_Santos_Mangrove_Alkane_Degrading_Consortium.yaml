id: CommunityMech:000413
name: Baia de Todos os Santos Mangrove Alkane-Degrading Consortium
description: A petroleum-contaminated mangrove bacterial consortium from Baia de Todos os Santos, Brazil, reported as a 36-organism
  consortium and represented by nine selected Bacillus, Brevibacillus, Pseudomonas, and Stenotrophomonas isolates. de Santana
  Nazare et al. sequenced and compared the nine isolates, grew them in Bushnell-Haas broth with paraffinic crude oil, and
  found that the complete consortium was required for statistically significant intermediate n-alkane degradation while Pseudomonas/Stenotrophomonas
  and Bacillus members occupied rapid and delayed alkane-degradation roles.
ecological_state: STABLE
community_origin: NATURAL
community_category: BIOREMEDIATION
environment_term:
  preferred_term: paraffinic crude oil Bushnell-Haas laboratory culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Controlled flask assays containing Bushnell-Haas Broth and paraffinic crude oil from the Reconcavo Basin.
