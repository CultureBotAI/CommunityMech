    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    notes: Candidate substrate based on S8 excretion, not demonstrated acetate flux into Cupriavidus.
  biological_processes:
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  - preferred_term: acetate metabolic process
    term:
      id: GO:0006083
      label: acetate metabolic process
    notes: Proposed substrate metabolism; exact recipient acetate use in this coculture is not resolved at abstract
      scope.
  downstream:
  - target: Cupriavidus Growth in Aerobic S8 Coculture
    description: HYPOTHESIZED - nonmethanol carbon released by S8 could support Cupriavidus growth. Positive coculture
      growth supports this interpretation, but acetate identity, transfer rate, carryover controls and recipient-specific
      utilization are not resolved by the accessible abstract.
  evidence:
  - reference: doi:10.1093/bbb/zbab150
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: methanol-independent cross-feeding from M. marinum S8 under aerobic conditions
    explanation: Supports the author interpretation of nonmethanol carbon supply, not an acetate-specific transfer
      measurement.
- name: Cupriavidus Growth in Aerobic S8 Coculture
  description: Cupriavidus necator NBRC 102504 grew when cocultured with M. marinum S8 under aerobic conditions.
    This positive result supports methanol-independent cross-feeding to a nonmethylotrophic recipient, without establishing
    acetate as its sole or predominant substrate, a quantified production yield or reciprocal benefit.
  scope: PAIRWISE
