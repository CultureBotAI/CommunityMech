ecological_interactions:
- name: Proposed Methanol-Independent Carbon Supply To Cupriavidus
  description: PARTIAL - growth of nonmethylotrophic Cupriavidus necator NBRC 102504 with methane-oxidizing Methylocaldum
    marinum S8 supports supply of carbon other than methanol under aerobic conditions. Acetate is a plausible candidate
    because S8 excretes it, but the abstract does not identify the compound actually transferred to Cupriavidus.
    The phrase about possibly using acetate refers to the separate Gela4 system, not this recipient.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylocaldum marinum S8
    term:
      id: NCBITaxon:1432792
      label: Methylocaldum marinum
  target_taxon:
    preferred_term: Cupriavidus necator NBRC 102504
    term:
      id: NCBITaxon:1218105
      label: Cupriavidus necator NBRC 102504
  metabolites:
