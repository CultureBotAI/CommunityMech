id: CommunityMech:000197
name: Methylocaldum-Cupriavidus Methane Acetate Cross-Feeding Coculture
description: >
  A defined artificial aerobic coculture pairing the marine methanotroph
  Methylocaldum marinum S8 with the non-methylotrophic acetate-utilizing
  bacterium Cupriavidus necator NBRC 102504. The coculture was used to test
  whether methane-derived metabolites excreted by M. marinum S8 can support a
  partner that is not a methylotroph. The system is DOE-relevant because it
  links methane oxidation to acetate-mediated growth of a bioproduction-relevant
  heterotroph, providing a model for methane-to-bioproduct community design.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: CARBON_SEQUESTRATION
engineering_design:
  objective: Test methanol-independent cross-feeding from a methane-oxidizing bacterium to a
    non-methylotrophic acetate-utilizing partner.
  assembly_strategy: Pair acetate-excreting Methylocaldum marinum S8 with Cupriavidus necator
    NBRC 102504 in an artificial methane-fed coculture.
  perturbation_design: Compare M. marinum S8 acetate excretion under microaerobic and aerobic
    oxygen concentrations and test whether C. necator grows in coculture with S8.
  measurement_endpoints:
  - Acetate excretion
  - Methanotroph growth
  - Cupriavidus necator colony-forming units
  - Total cell counts
  - RNA-seq of M. marinum S8 under aerobic conditions
  evidence:
  - reference: doi:10.1093/bbb/zbab150
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Nonmethylotrophic bacteria, Cupriavidus necator NBRC 102504, could grow when cocultured with M. marinum S8
    explanation: Supports the exact two-member artificial coculture design.
  - reference: doi:10.1093/bbb/zbab150
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: effects of oxygen concentrations on growth of and acetate excretion by M. marinum S8
    explanation: Supports the oxygen-condition perturbation and acetate-excretion endpoint.
