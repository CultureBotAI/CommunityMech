ecological_interactions:
- name: Hydrolyzer-oxidizer division of labor
  description: >
    PA hydrolyzes bifenthrin into bifenthrin alcohol and
    trifluorochloro-chrysanthemic acid, while PP oxidizes bifenthrin alcohol and
    thereby relieves inhibition of PA hydrolases.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42269294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PA served as the hydrolyzer, cleaving the ester bond of bifenthrin to generate bifenthrin alcohol and trifluorochloro-chrysanthemic acid, while PP, as the oxidizer, efficiently degraded bifenthrin alcohol
    explanation: Supports the strain-specific hydrolysis and oxidation steps.
  - reference: PMID:42269294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: relieving steric hindrance on PA hydrolases and establishing an essential cooperative degradation partnership
    explanation: Supports the functional consequence of PP removing the inhibitory intermediate.
- name: Bifenthrin-intermediate cross-feeding
  description: PP consumes the bifenthrin-alcohol product generated by PA, coupling the two degradation steps.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas aeruginosa PA
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  target_taxon:
