id: CommunityMech:000331
name: Pseudomonas-Paracoccus Bifenthrin-Degrading Consortium
description: >
  A defined two-strain consortium of Pseudomonas aeruginosa PA and Paracoccus
  pantotrophus PP assembled from contaminated-soil isolates for bifenthrin
  biodegradation. P. aeruginosa PA hydrolyzes bifenthrin, while P. pantotrophus
  PP oxidizes the resulting bifenthrin-alcohol intermediate; PA extracellular
  polymeric substances also modify the local chemical microenvironment.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Improve bifenthrin biodegradation by combining a bifenthrin hydrolyzer with a strain that removes the inhibitory bifenthrin-alcohol intermediate.
  assembly_strategy: Construct a two-strain synthetic consortium from contaminated-soil isolates Pseudomonas aeruginosa PA and Paracoccus pantotrophus PP.
  measurement_endpoints:
  - bifenthrin removal
  - degradation rate constant
  - intermediate transformation
  - extracellular polymeric substance composition and function
  evidence:
  - reference: PMID:42269294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas aeruginosa strain PA (PA) and Paracoccus pantotrophus strain PP (PP) were isolated from contaminated soil and constructed into a synthetic consortium (PA+PP)
    explanation: Supports the exact strain composition, isolate origin, and synthetic assembly.
environment_term:
  preferred_term: aqueous bifenthrin-degradation laboratory assay
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The consortium was tested in an optimized aqueous mineral-salts-medium assay.
modeled_environment:
- preferred_term: bifenthrin-contaminated soil
  term:
    id: ENVO:00002116
    label: contaminated soil
  notes: Both strains were isolated from contaminated soil and the consortium was designed for bifenthrin-pollution remediation.
