    evidence_source: IN_VITRO
    snippet: PA served as the hydrolyzer, cleaving the ester bond of bifenthrin to generate bifenthrin alcohol and trifluorochloro-chrysanthemic acid, while PP, as the oxidizer, efficiently degraded bifenthrin alcohol
    explanation: Demonstrates sequential production and consumption of the bifenthrin-alcohol intermediate.
