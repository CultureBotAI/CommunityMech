    Bordetella) consume oxygen to create localized anaerobic microenvironments for
    the cellulolytic Clostridium species. Inoculum volume: 40 microliters per 4 mL
    medium. Subculture protocol: 40-700 microliters transferred to fresh medium after
    6 days.

    '
