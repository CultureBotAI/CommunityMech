discussions:
- discussion_id: sf356_negative_effects_and_feedback_scope
  prompt: What causes the negative effects and which partners are harmed?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Thermophilic Cellulose Hydrolysis
  - ecological_interactions#Oxygen Consumption and Anaerobiosis Creation
  - ecological_interactions#FG4 Excess Acetate Inhibits Cellulose Degradation
  - ecological_interactions#Brevibacillus Suppression of Bordetella
  rationale: The fresh primary abstract supports the positive metabolite/oxygen feedback, FG4-associated excess-acid
    inhibition and Brevibacillus suppression of Bordetella. The available evidence does not establish reciprocal
    harm required by COMPETITION. The complete main text was not retrieved in this pass, so no further inhibitory
    mechanism is certified. Current SYNTROPHY does not require obligacy, but oxygen facilitation alone is not product-removal
    feedback. CSK1 aerotolerance also precludes an absolute zero-oxygen claim. Non-graph origin, physiological roles
    and whole-community cultivation claims remain issue1770.
  evidence:
  - reference: PMID:16269746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: knockout communities
    explanation: The source investigated member removal, not merely coexistence.
  - reference: PMID:15545431
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grew under a gas phase containing up to 4 % O(2)
    explanation: The isolate abstract directly establishes CSK1 oxygen tolerance.
