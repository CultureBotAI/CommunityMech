    explanation: The primary abstract supports metabolite supply in the inferred positive CSK1-aerobe relationship.
- name: Oxygen Consumption and Anaerobiosis Creation
  description: Pseudoxanthomonas sp. M1-3 and Brevibacillus sp. M1-5 introduce anaerobic conditions that support
    cellulolytic CSK1 in the mixed culture. Together with CSK1 metabolite supply, this is a supported positive reciprocal
    relationship. It does not imply CSK1 cannot tolerate any oxygen.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Clostridium straminisolvens CSK1
    term:
