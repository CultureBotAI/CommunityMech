- name: Complementary Cellulolytic Activity
  description: 'Clostridium sp. FG4 provides complementary cellulolytic activity alongside
    C. straminisolvens CSK1, enhancing the overall cellulose degradation efficiency
    of the consortium. The presence of two Clostridium species with cellulose-degrading
    capability provides functional redundancy that contributes to the remarkable functional
    stability observed over 20 subcultures. Both Clostridium strains operate under
    anaerobic conditions created by the aerobic partners, sharing the cellulose substrate
    and potentially specializing in different cellulose fractions or degradation products.
    This functional diversity within the primary degrader guild ensures robust cellulose
    utilization even if one species declines.

    '
