growth_media:
- name: PCS-FP medium for thermophilic cellulose degradation
  atmosphere: AEROBIC
  ph: '8.0'
  temperature: '50'
  temperature_unit: degrees Celsius
  temperature_range: 50-55
  vessel_type: test tubes with loose caps
  preparation_notes: 'PCS basal medium (peptone-cellulose-salt) supplemented with
    filter paper as cellulose substrate and calcium carbonate buffer. Medium prepared
    with loose caps to allow oxygen entry while maintaining high humidity. Static
    (non-shaking) incubation. The aerobic members (Pseudoxanthomonas, Brevibacillus,
    Bordetella) consume oxygen to create localized anaerobic microenvironments for
    the cellulolytic Clostridium species. Inoculum volume: 40 microliters per 4 mL
    medium. Subculture protocol: 40-700 microliters transferred to fresh medium after
    6 days.

    '
