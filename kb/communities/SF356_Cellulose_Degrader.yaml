  downstream:
  - target: Thermophilic Cellulose Hydrolysis
    description: Excess acetic acid attributed to FG4 inhibits cellulose degradation in the mixed culture, opposing
      the community hydrolysis/cross-feeding process. The accessible evidence does not isolate the effect on CSK1
      from the rest of the consortium.
  evidence:
  - reference: PMID:16269746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the inhibition of cellulose degradation by producing excess amounts of acetic acid by Clostridium sp.
      strain FG4
    explanation: Supports FG4 excess acetic acid as a negative interaction in SF356.
