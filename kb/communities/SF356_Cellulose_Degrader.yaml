    term:
      id: GO:0009060
      label: aerobic respiration
  - preferred_term: interspecies interaction
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Thermophilic Cellulose Hydrolysis
    description: Aerobic oxygen consumption lowers oxygen availability and supports CSK1 cellulose degradation in
      the mixed culture, completing the positive feedback with metabolite supply. This does not assert an absolute
      zero-oxygen requirement for the aerotolerant CSK1 isolate.
  evidence:
  - reference: PMID:16269746
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the aerobes introduced anaerobic conditions
    explanation: Together with the metabolite-supply evidence, the primary abstract supports the retained positive
      feedback.
- name: FG4 Excess Acetate Inhibits Cellulose Degradation
  description: The primary abstract attributes inhibition of SF356 cellulose degradation to excess acetic acid produced
    by Clostridium sp. FG4. Retain this negative community-function link; it does not separately establish reciprocal
    harm between FG4 and CSK1 or isolated CSK1 toxicity.
