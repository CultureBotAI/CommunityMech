id: CommunityMech:000406
name: Meghalaya Bacillus Consortia-A22ED9
description: Consortia-A22ED9 is a defined two-member Bacillus consortium assembled from SK22 and KHED9, two native isolates
  recovered from active rat-hole coal-mine sites in Meghalaya, India. The consortium was selected after compatibility screening
  for growth stimulation and then assayed in pH 5.0 LB medium for in vitro removal of iron, cadmium, and chromium across sublethal
  metal concentrations.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Assemble site-specific native Bacillus isolates into an in vitro consortium for acidic heavy-metal biosorption
    and pH-buffering bioremediation relevant to rat-hole coal-mine acid mine drainage.
  assembly_strategy: Screen 16 isolates from active mines, abandoned mines, and a non-mining control site for low-pH and heavy-metal
    tolerance; retain five isolates with the strongest heavy-metal resistance and pH reversal; then pair mutually compatible
    isolates and retain SK22 plus KHED9 as Consortia-A22ED9.
  inoculation_strategy: Construct A22ED9 by transferring 1 mL each of OD600 0.5 SK22 and KHED9 culture into fresh LB broth,
    growing the mixed co-culture to a combined OD600 of 0.5, and inoculating heavy-metal-removal flasks at 1% v/v.
  perturbation_design: Challenge A22ED9 at pH 5.0 with Fe across 50-1000 mg/L and Cd or Cr across 1-32 mg/L, then compare
    metal depletion, OD600, and final pH after 24 h.
  measurement_endpoints:
  - iron removal percentage
  - chromium removal percentage
  - cadmium removal percentage
  - OD600 after 24 h
  - pH after 24 h
  - FTIR and SEM-EDX evidence of metal binding
  evidence:
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sixteen (16) isolates were initially screened to develop the microbial consortia and five isolates (05) were
      finally selected
    explanation: Supports the candidate-screening step before SK22 and KHED9 were chosen for the two-member A22ED9 consortium.
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolate SK22 was highly stimulated by KHED9 and form one consortium, Consortia-A22ED9
    explanation: Identifies SK22 and KHED9 as the compatible isolates used to form Consortia-A22ED9.
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each of the consortia were constructed by transferring 1 mL each of 0.5 OD culture
    explanation: Supports the equal-volume assembly of OD600 0.5 isolate cultures before the removal assay.
