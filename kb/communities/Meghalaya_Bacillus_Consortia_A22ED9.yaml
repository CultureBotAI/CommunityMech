ecological_interactions:
- name: Consortia-A22ED9 single-metal Fe-Cd-Cr removal
  description: A22ED9 removed iron, chromium, and cadmium from pH 5.0 LB cultures over 24 h, with mean removal values of 92.08%
    Fe across 50-1000 mg/L, 74.15% Cr across 1-32 mg/L, and 97.587% Cd across 1-32 mg/L.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: iron(2+)
    term:
      id: CHEBI:29033
      label: iron(2+)
  - preferred_term: chromium
    term:
      id: CHEBI:28073
      label: chromium atom
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  evidence:
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The iron removal percentage (%) of Consortia-A22ED9 is 92.08 ± 10.281
    explanation: Quantifies mean iron removal by A22ED9 across the tested Fe concentration series.
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The chromium removal percentage (%) of Consortia-A22ED9 is 74.15 ± 12.906
    explanation: Quantifies mean chromium removal by A22ED9 across the tested Cr concentration series.
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consortia-A22ED9 removed 97.587 ± 0.958% and Consortia-B18-4M11 removed 97.673 ± 0.475% of Cd respectively
    explanation: Quantifies mean cadmium removal by A22ED9 across the tested Cd concentration series.
