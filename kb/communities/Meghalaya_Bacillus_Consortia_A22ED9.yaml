discussions:
- discussion_id: a22ed9_species_grounding_and_field_performance
  prompt: Which species within Bacillus do SK22 and KHED9 belong to, and does A22ED9 retain Fe, Cd, and Cr removal in pilot-scale
    or field acid-mine-drainage treatments?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Bacillus sp. SK22
  - taxonomy#Bacillus sp. KHED9
  - modeled_environment#rat-hole coal-mine acid mine drainage
  rationale: The inspected study reports 16S rRNA accessions and in vitro pH 5.0 shake-flask assays, while noting that field
    trials and laboratory-scale fermentor validation remained future work.
  posed_by: codex
  posed_date: '2026-09-21'
- discussion_id: a22ed9_no_enhanced_consortium_removal
  prompt: Does A22ED9 provide reproducibly higher Fe, Cd, or Cr removal than its single-isolate members?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Consortia-A22ED9 single-metal Fe-Cd-Cr removal
  rationale: The paper reports high Fe, Cd, and Cr removal for A22ED9, but the abstract explicitly states that consortia did
    not show significant differences in heavy-metal removal, so the curated interaction does not assert an emergent metal-removal
    advantage.
  posed_by: codex
  posed_date: '2026-09-21'
