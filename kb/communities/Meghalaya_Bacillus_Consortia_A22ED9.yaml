  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To each flask, 1% v/v of 0.5 OD culture was inoculated and incubated for 24 h
    explanation: Reports the inoculum size used for the consortium heavy-metal-removal flasks.
