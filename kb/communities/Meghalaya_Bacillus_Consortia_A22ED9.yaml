growth_media:
- name: pH 5.0 LB single-metal Fe-Cd-Cr removal assay
  ph: 5.0
  temperature: 37
  temperature_unit: degrees Celsius
  inoculum_source: Consortia-A22ED9 grown to OD600 0.5 from equal 1 mL SK22 and KHED9 cultures
  inoculum_size: 1
  inoculum_unit: '% v/v of OD600 0.5 co-culture'
  incubation_time: 24
  incubation_time_unit: hours
  shaking_speed: 150
  shaking_speed_unit: rpm
  vessel_type: 250 mL conical flask
  preparation_notes: The heavy-metal-removal assay used 100 mL LB medium at pH 5.0 with either 50-1000 mg/L Fe or 1-32 mg/L
    Cd or Cr.
  evidence:
  - reference: PMID:42135302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 100 mL LB medium, incubated at 37 °C for 24 h in 250 mL conical flasks at 150 rpm
