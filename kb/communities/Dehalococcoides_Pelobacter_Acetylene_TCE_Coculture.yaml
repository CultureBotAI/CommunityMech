id: CommunityMech:000184
name: Dehalococcoides-Pelobacter Acetylene TCE Coculture
description: >
  A defined anaerobic laboratory coculture in which the acetylene-fermenting
  bacterium historically reported as Pelobacter strain SFB93 is paired with
  Dehalococcoides mccartyi strain 195 to sustain reductive dechlorination of
  trichloroethene when acetylene is provided as electron donor and carbon source.
  The system is relevant to chlorinated-solvent groundwater bioremediation because
  acetylene can be generated during abiotic TCE degradation and can inhibit
  dechlorination at high concentrations.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Test whether an acetylene-fermenting partner can support reductive
    dechlorination by D. mccartyi under TCE and acetylene co-exposure.
  assembly_strategy: Combine Pelobacter strain SFB93 with D. mccartyi strain 195
    in a defined anaerobic coculture and provide acetylene plus TCE.
  perturbation_design: Compare low and high acetylene exposures and test whether
    acetylene can act as electron donor and carbon source while chlorinated ethenes
    serve as electron acceptors.
  measurement_endpoints:
  - Acetylene consumption
  - TCE reductive dechlorination
  - D. mccartyi growth or inhibition
  - Reductive dehalogenase gene response
  - Dechlorination recovery after adding SFB93
  evidence:
  - reference: PMID:28075122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Acetylene Fuels TCE Reductive Dechlorination by Defined Dehalococcoides/Pelobacter Consortia
    explanation: Supports the defined Dehalococcoides/Pelobacter coculture objective.
  - reference: PMID:28075122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cocultures of Pelobacter SFB93
    explanation: Supports use of Pelobacter strain SFB93 in the defined coculture design.
  - reference: PMID:28075122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: acetylene as the electron donor and carbon source
    explanation: Supports acetylene as the designed feedstock for the coculture.
