    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aqueous H2 concentrations ranged from 114 to 217 nM during TCE-dechlorination
    explanation: H2 from acetylene fermentation fuels dechlorination by strain 195.
- preferred_term: acetate
  chebi_term:
    id: CHEBI:30089
    label: acetate
  relevance: >
    Acetate produced from acetylene fermentation by SFB93 supplies the carbon
    source required for growth of D. mccartyi.
  evidence:
  - reference: PMID:28075122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: strain SFB93 ferments acetylene to ethanol, acetate, and H2
    explanation: Acetate is a fermentation product providing carbon to dechlorinators.
- preferred_term: ethanol
  chebi_term:
    id: CHEBI:16236
    label: ethanol
  relevance: >
    Ethanol is an acetylene fermentation product of SFB93 that is rapidly oxidized
    to acetate and H2 in dechlorinating communities.
  evidence:
  - reference: PMID:28075122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: strain SFB93 ferments acetylene to ethanol, acetate, and H2
    explanation: Ethanol is a fermentation product of acetylene metabolism by SFB93.
- preferred_term: chloride
  chebi_term:
    id: CHEBI:17996
    label: chloride
  relevance: >
    Chloride is released during reductive dechlorination and was tracked as a
    measure of D. mccartyi cell yield in the coculture.
  evidence:
