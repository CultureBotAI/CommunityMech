      label: Acinetobacter baumannii
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
- taxon_term:
    preferred_term: Aeromonas hydrophila
    term:
      id: NCBITaxon:644
      label: Aeromonas hydrophila
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Disturbance-Stable Division of Labor
  description: Members redistribute functional dominance and metabolic pathways to maintain denitrification.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Pseudomonas aeruginosa N2, Acinetobacter baumannii N1, and Aeromonas hydrophila were assembled
    as an aerobic denitrification SMC.
  description: Dibutyl phthalate and levofloxacin disturbance treatments.
  evidence:
  - *id001
related_ingredients:
- preferred_term: N-butyryl-L-homoserine lactone
  chebi_term:
    id: CHEBI:29643
    label: N-butyryl-L-homoserine lactone
  relevance: Short-chain acyl-homoserine-lactone quorum-sensing signal (C4-HSL) used for
    interspecific communication in the aerobic-denitrification SMC under DBP/LOFX disturbance.
  evidence:
  - reference: PMID:40020349
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: interspecific communication was mainly carried out through N-butyryl-L-homoserine lactone
      (C4-HSL) and N-(3-oxododecanoyl)-L-homoserine lactone (3OC12-HSL), correspondingly
    explanation: Establishes C4-HSL as one of two AHL signals mediating inter-strain communication in
      the SMC.
- preferred_term: N-(3-oxododecanoyl)-L-homoserine lactone
  chebi_term:
    id: CHEBI:44534
    label: N-(3-oxododecanoyl)-L-homoserine lactone
  relevance: Long-chain 3-oxo acyl-homoserine-lactone quorum-sensing signal (3OC12-HSL) — the second
    of two AHLs mediating inter-strain communication in the SMC.
  evidence:
  - reference: PMID:40020349
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: interspecific communication was mainly carried out through N-butyryl-L-homoserine lactone
      (C4-HSL) and N-(3-oxododecanoyl)-L-homoserine lactone (3OC12-HSL), correspondingly
    explanation: Establishes 3OC12-HSL as the second AHL signal mediating inter-strain communication.
- preferred_term: phenazine-1-carboxylic acid
  chebi_term:
    id: CHEBI:62412
    label: phenazine-1-carboxylic acid
  relevance: DBP-stimulated phenazine secondary metabolite that accelerates electron transfer from the
    quinone pool to complex III, raising electron-transfer activity in the SMC under DBP disturbance.
  evidence:
  - reference: PMID:40020349
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DBP stimulated phenazine-1-carboxylic acid production to accelerate electron transfer from
      the quinone pool to complex III, resulting in an increase in electron transfer activity
    explanation: Establishes phenazine-1-carboxylic acid as the DBP-induced redox metabolite driving
      SMC adaptation.
