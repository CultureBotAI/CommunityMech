id: CommunityMech:000479
name: Trichoderma lentiforme and Burkholderia Cross-Feeding Atrazine-Degrading Consortium
description: Cross-kingdom fungal-bacterial synthetic consortium pairing the atrazine-degrading fungus Trichoderma lentiforme
  HN154 with rhizosphere Burkholderia isolates (strains Bur-4, Bur-5, and Bur-14) to remediate atrazine-contaminated corn-soybean
  rotation soil and protect soybean (Glycine max) from residual phytotoxicity. Trichoderma lentiforme HN154 transforms atrazine
  into hydroxyatrazine and biuret intermediates that stimulate Burkholderia chemotaxis, swarming, and swimming motility; cross-feeding
  on these intermediates harnesses bacterial atzB, atzC, atzE, and atzF catabolic enzymes to achieve 86.3% atrazine degradation
  within 168 h while boosting soybean SOD, POD, and CAT antioxidant defenses.
