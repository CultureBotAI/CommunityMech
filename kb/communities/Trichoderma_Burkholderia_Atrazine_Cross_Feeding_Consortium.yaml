environmental_factors:
- name: Soil Atrazine Contamination
  value: 500 mg/kg atrazine in corn-soybean rotation soil
  description: High residual triazine herbicide concentration causing phytotoxicity and oxidative damage (MDA) in rotational
    soybean.
  evidence:
  - reference: PMID:42372060
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: By leveraging the atrazine-degrading fungus Trichoderma lentiforme HN154, we achieved an 80.3% removal of atrazine
      (500 mg/kg) in non-sterilized soils from a corn planting system within 14 days, 22.1% higher degradation than in sterilized
      soil, while concurrently alleviating phytotoxic symptoms in soybean plants.
    explanation: Documents 500 mg/kg soil atrazine remediation and soybean phytotoxicity alleviation.
ecological_interactions:
- name: Fungal-to-Bacterial Cross-Feeding of Hydroxyatrazine and Biuret Intermediates
  description: Trichoderma lentiforme HN154 degrades atrazine into hydroxyatrazine and biuret, which act as chemoattractants
    and cross-fed substrates for Burkholderia strains (Bur-4, Bur-5, Bur-14) carrying atzB/atzC/atzE/atzF, accelerating complete
    atrazine mineralization to 86.3% within 168 h and enhancing soybean antioxidant enzymes.
  interaction_type: CROSS_FEEDING
