discussions:
- discussion_id: wine_yeast_indirect_contact_amino_acid_source
  prompt: Which yeasts, export processes, or lysis processes produced the non-supplemented amino acids and the higher 5 h
    extracellular amino-acid concentrations in the indirect-contact three-species wine yeast membrane-bioreactor setup?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Contact-dependent amino acid profile shift
  - growth_media#YNB with amino acids, ammonium sulfate, and glucose
  rationale: YNB with amino acids supplied histidine, methionine, and tryptophan, but other amino acids appeared in
    fermentation supernatants and several were significantly higher in the indirect-contact treatment after 5 h. The article
    lists active secretion, species-specific cell death, and partial cell lysis as possible sources and states that further
    experiments are required to explain the concentration differences.
  posed_by: codex
  posed_date: '2026-09-26'
