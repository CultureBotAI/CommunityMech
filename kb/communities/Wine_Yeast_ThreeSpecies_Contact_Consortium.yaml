id: CommunityMech:000438
name: Wine Yeast Three-Species Contact Consortium
description: A defined three-member wine yeast consortium built from fluorescently labeled Saccharomyces cerevisiae VIN13,
  Lachancea thermotolerans IWBT Y1240, and Torulaspora delbrueckii LO544 to compare direct cell-cell contact against
  metabolic-only contact in a multi-membrane bioreactor. Asmus et al. 2026 cultured the yeasts in yeast nitrogen base
  with glucose and ammonium sulfate, either together in the same 700 mL vessel or separated by 0.1 um membranes with
  continuous medium exchange, and measured 12 h growth, extracellular glucose, ammonia and amino acids, and
  S. cerevisiae RNA-seq at 5 and 9 h.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Compare how direct physical contact versus metabolic contact changes growth, extracellular nutrients, and
    S. cerevisiae transcription in a three-species wine yeast consortium.
  assembly_strategy: Assemble mCherry-labeled S. cerevisiae VIN13, mTagBFP2-labeled L. thermotolerans IWBT Y1240, and
    eGFP-labeled T. delbrueckii LO544 in a membrane bioreactor adapted to hold three wine yeast species.
  perturbation_design: Compare direct-contact cultures, in which all three yeasts occupy the same YNB vessel, with
    indirect-contact cultures, in which each yeast is retained in a separate vessel while filtered medium circulates among
    compartments.
  measurement_endpoints:
  - viable yeast growth over 12 h by fluorescent flow cytometry
  - extracellular glucose and ammonia at 5 and 9 h
  - extracellular amino acids at 5 and 9 h
  - S. cerevisiae transcriptomes in direct and indirect contact fermentations
  notes: The publication measures contact-dependent growth and S. cerevisiae expression across a complete three-member
    community, but it leaves the source of extra amino acids unresolved and treats T. delbrueckii suppression of
    L. thermotolerans in the indirect-contact setup as a likely medium-mediated mechanism.
  evidence:
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Therefore, we evaluated the impact of direct cell-cell contact on the physiology and gene expression of Saccharomyces
      cerevisiae within a yeast consortium including Lachancea thermotolerans and Torulaspora delbrueckii.
    explanation: Supports the three-species contact-comparison objective.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A membrane bioreactor allowed continuous media exchange between separate fermentation vessels.
    explanation: Supports the indirect-contact membrane-bioreactor comparison.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Yeast growth, extracellular metabolites, and S. cerevisiae transcriptional profiles were monitored at two timepoints.
    explanation: Supports the growth, extracellular-metabolite, and transcriptomic measurement endpoints.
