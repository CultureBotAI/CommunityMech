ecological_interactions:
- name: Direct-contact S. cerevisiae growth advantage
  description: When all three yeasts shared the same YNB vessel, direct contact favored S. cerevisiae growth and S. cerevisiae
    established numerical dominance by the end of the 12 h observation period.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Direct cell contact favored S. cerevisiae growth
    explanation: Supports the direct-contact growth advantage assigned to S. cerevisiae in the three-yeast consortium.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In direct contact, S. cerevisiae established rapid dominance
    explanation: Explicitly reports S. cerevisiae dominance in the direct-contact condition.
- name: Indirect-contact Torulaspora growth shift
  description: When the three yeasts were physically separated but shared filtered medium, T. delbrueckii dominated early
    biomass growth while L. thermotolerans growth was lower than in the direct-contact mixed culture.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: indirect (metabolic) contact favored T. delbrueckii growth at the expense of L. theromotolerans
    explanation: Supports the indirect-contact growth shift toward T. delbrueckii.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: T. delbrueckii likely suppresses growth of L. thermotolerans through a medium-mediated mechanism.
    explanation: Captures the authors' mechanistic interpretation for the no-contact L. thermotolerans decline.
- name: Contact-dependent amino acid profile shift
  description: Extracellular amino acid concentrations differed between direct and indirect contact fermentations after 5 h;
    the measured serine, glycine, valine, aspartic acid, and arginine concentrations were higher in the indirect-contact
    condition, with no significant difference after 9 h.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Direct cell contact favored S. cerevisiae growth and resulted in significantly different amino acid profiles
    explanation: Supports direct contact changing the amino-acid profile.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: serine, glycine, valine, aspartic acid, and arginine
    explanation: Names the amino acids that differed significantly between contact treatments at the 5 h time point.
