cultivation_setup:
- cultivation_mode: BATCH
  system_type: MEMBRANE_BIOREACTOR
  instrument_detail: Three fermentation vessels were connected through 0.1 um membranes in stainless-steel manifolds so
    each separated yeast culture recirculated to its vessel of origin while filtered medium from all vessels was pooled and
    redistributed.
  working_volume: 700
  working_volume_unit: mL
  feed_or_dilution_rate: 240
  feed_or_dilution_rate_unit: mL/min
  notes: The same pumping and membrane setup was retained in the direct-contact treatment, but all three yeasts were
    inoculated into each vessel.
  evidence:
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The design made use of membranes with 0.1 μm pore-sizes
    explanation: Supports the membrane-bioreactor pore size.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Media containing yeast cells (700 mL per vessel) is circulated separately for each vessel by peristaltic pumps
    explanation: Supports the three-vessel recirculating setup and working volume.
  - reference: PMID:42176030
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A flow rate of 4 mL/s ensures rapid replacement of media in each reactor
    explanation: Supports the medium-exchange flow rate; 4 mL/s equals 240 mL/min.
