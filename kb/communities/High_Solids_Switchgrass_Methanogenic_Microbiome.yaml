discussions:
- discussion_id: switchgrass_profile_to_function
  prompt: Which enzymes and metabolic routes maintain conversion at high solids?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#High-Solids Switchgrass Carbohydrate Solubilization
  - ecological_interactions#Fraction-Associated CAZyme Protein Profiles
  - ecological_interactions#Methane Production and Inferred Hydrogenotrophic Route
  rationale: One sequential HR1 reactor supports positive conversion and gas outcomes but does not isolate solids
    loading from vitamin, medium, mixing or adaptation changes. Metaproteomic replicates are not independent replicate
    reactors, and the sequence database was derived from lower-solids metagenomes. Selective enzyme perturbations,
    catalytic assays and route-resolved flux would test both existing arrows. AA6 enrichment motivated an oxidative/Fenton
    accessibility hypothesis, but ROS, iron cycling and lignin-depolymerization flux were not directly established
    in the inspected study; no new oxidative branch is asserted. The authors' proposed syntrophic acetate oxidation
    likewise remains unresolved. Canonical broad taxa are incomplete and are not a newly grounded strain roster.
    Cache abstract-only metadata coexists with an appended primary full body, which was read. Non-graph metadata
    is preserved, not recertified.
  posed_by: codex
  posed_date: '2026-10-06'
