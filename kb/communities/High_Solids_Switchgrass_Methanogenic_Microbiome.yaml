ecological_interactions:
- name: High-Solids Switchgrass Carbohydrate Solubilization
  description: The thermophilic HR1 community maintained fractional carbohydrate solubilization as switchgrass loading
    increased from 30 to 150 g/L in one sequentially operated reactor. This positive bulk-carbohydrate result does
    not demonstrate complete lignin mineralization or selectively identify the causal enzyme strategy. Vitamins,
    medium optimization, mixing and adaptation also changed during operation. LC-MS profiles identify expressed
    protein groups with annotated CAZyme potential, not direct catalytic activities; the five canonical taxa are
    a curated subset, not every organism responsible for conversion.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
  - preferred_term: xylan
    term:
      id: CHEBI:37166
      label: xylan
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  downstream:
  - target: Methane Production and Inferred Hydrogenotrophic Route
    description: PARTIAL - carbohydrate solubilization followed by fermentation can supply carbon and reducing equivalents
      to methanogenesis, connecting the measured reactor outcomes. The broad trophic model is supported by bulk
      products and protein profiles, but the hydrogenotrophic contribution and exact donor-to-methanogen flux were
      not selectively quantified.
  evidence:
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: undiminished fractional carbohydrate solubilization
    explanation: Supports maintained bulk fractional carbohydrate solubilization in the sequential reactor experiment,
      not an isolated solids-only treatment effect or complete lignin mineralization.
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: specific carbohydrate-active enzyme classes
    explanation: Supports the study's CAZyme-category analysis, not selective enzyme mediation or direct measurement
      of catalytic activity.
  participating_taxa:
  - preferred_term: Clostridia
    term:
      id: NCBITaxon:186801
      label: Clostridia
  - preferred_term: Bacilli
    term:
      id: NCBITaxon:91061
      label: Bacilli
