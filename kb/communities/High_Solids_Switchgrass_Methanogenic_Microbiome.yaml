id: CommunityMech:000194
name: High-Solids Switchgrass Methanogenic Microbiome
description: >
  A thermophilic, anaerobic, semi-continuously fed methanogenic enrichment
  microbiome cultivated on mid-season switchgrass at high solids loadings. The
  community maintained fractional carbohydrate solubilization as solids loading
  increased from 30 to 150 g/L, with methane and carbon dioxide as the main
  steady-state products. Metaproteomics identified bacterial carbohydrate-active
  enzyme strategies and archaeal methanogenesis functions relevant to DOE
  bioenergy efforts to understand robust lignocellulose deconstruction under
  industrially relevant process conditions.
ecological_state: STABLE
community_origin: ENGINEERED
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Characterize a thermophilic methanogenic microbiome capable of
    maintaining lignocellulose deconstruction at high switchgrass solids
    loadings.
  assembly_strategy: Enrich an anaerobic digester inoculum as a thermophilic
    lignocellulose-fermenting microbiome and operate it semi-continuously on
    switchgrass.
  perturbation_design: Increase switchgrass solids loading from 30 to 75, 120,
    and 150 g/L while fixing residence time and profiling metaproteomes across
    supernatant, planktonic-cell, and substrate-bound fractions.
  measurement_endpoints:
  - Fractional carbohydrate solubilization
  - Methane and carbon dioxide production
  - CAZyme abundance and fraction localization
  - Methanogenesis pathway protein abundance
  - Oxidative stress and AA6-family protein abundance
  evidence:
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: anaerobic methanogenic microbiome
    explanation: Supports the microbiome identity and anaerobic methanogenic study context.
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mid-season switchgrass
    explanation: Supports switchgrass as the lignocellulosic feedstock used to cultivate and test the community.
