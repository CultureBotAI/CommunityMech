- name: Fraction-Associated CAZyme Protein Profiles
  description: Chloroflexi-assigned CAZyme proteins were more prevalent in the planktonic-cell fraction, whereas
    Thermotogae-assigned proteins were more represented in supernatant and substrate-bound fractions. These positive
    metaproteomic profiles motivated the authors' functional-niche interpretation. Centrifugation-enriched fractions
    and protein adsorption do not directly locate every living organism, establish competitive niche partitioning,
    or demonstrate a Chloroflexota-to-Thermotogota interaction.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
  - preferred_term: xylan
    term:
      id: CHEBI:37166
      label: xylan
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: High-Solids Switchgrass Carbohydrate Solubilization
    description: PARTIAL - fraction-associated CAZyme proteins could contribute complementary hydrolysis functions
      that maintain carbohydrate solubilization. Protein abundance and localization profiles support this interpretation,
      not selective perturbation establishing that spatial partitioning causes the maintained phenotype.
  evidence:
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: CAZymes from the phylum Chloroflexi were more prevalent in the PC fraction while enzymes from the phylum
      Thermotogae were more represented in the SNT and SB fractions
    explanation: Supports fraction-associated annotated protein profiles and the authors' suggested niches, not
      experimentally established competitive partitioning.
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'each sample was split into three fractions: supernatant (SNT), planktonic cells (PC), and substrate-bound
      (SB)'
    explanation: Defines the measured fractions without asserting pure compartments or direct live-cell localization.
  participating_taxa:
  - preferred_term: Chloroflexota
    term:
      id: NCBITaxon:200795
      label: Chloroflexota
  - preferred_term: Thermotogota
    term:
      id: NCBITaxon:200918
      label: Thermotogota
- name: Methane Production and Inferred Hydrogenotrophic Route
  description: Methane and carbon dioxide were measured reactor products. The higher abundance and diversity of
    proteins assigned to hydrogenotrophic rather than acetoclastic pathways suggest a major hydrogenotrophic route,
    but do not quantify its fraction of methane production or exclude other routes. Steady-state hydrogen and volatile
    fatty acids below detection do not mean absent turnover. The canonical archaeal group represents inferred methanogenic
    capacity, not the complete community or an experimentally resolved partner pair.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:35790765
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The main products observed were methane
    explanation: Supports positive bulk methane production, not pathway-resolved carbon or electron flux.
  - reference: PMID:35790765
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: both the aggregate abundance and diversity (protein count) of those mapping the hydrogenotrophic pathway
      markedly exceeded that of the acetoclastic pathway
    explanation: Supports the authors' dominant-route inference from annotated protein profiles, not a measured
      methane-flux partition.
  participating_taxa:
  - preferred_term: Euryarchaeota
    term:
      id: NCBITaxon:28890
      label: Methanobacteriota
