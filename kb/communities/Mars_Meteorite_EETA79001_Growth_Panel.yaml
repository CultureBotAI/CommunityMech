  value: EETA79001 meteorite sawdust
  description: >
    Growth was tested on sawdust of the Mars meteorite EETA79001, a sample of actual
    martian material used in place of a terrestrial simulant to duplicate martian
    mineralogy and chemistry.
  evidence:
  - reference: PMID:38665180
    supports: SUPPORT
