id: CommunityMech:000308
name: Mars Meteorite EETA79001 Microbial Growth Panel
description: >
  A defined four-member panel of microorganisms tested for their ability to grow on
  actual martian regolith, supplied as sawdust of the Mars meteorite EETA79001, rather
  than on a terrestrial simulant. The panel comprises the bacterium Escherichia coli B,
  the two cyanobacteria Eucapsis sp. and Chroococcidiopsis sp. strain
  Chr20-20201027-1, and the cold-adapted bacterium Planococcus halocryophilus. Each
  organism was cultivated separately on EETA79001 sawdust for up to 23 days under
  terrestrial conditions across regolith:water ratios from 4:1 to 1:10; the study
  demonstrates that real martian regolith can support microbial growth and does not
  contain bactericidal agents. The panel is an astrobiology / In-Situ Resource
  Utilization model relevant to putative martian life and to bio-sustainable human
  habitats on Mars. Members were assayed individually, so the record captures a shared
  capacity to grow on martian regolith rather than measured interspecies interactions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: EXTREME_ENVIRONMENT
engineering_design:
  objective: >
    Determine whether actual martian regolith (Mars meteorite EETA79001 sawdust) can
    support the growth of microorganisms, using a panel of four organisms tested on
    real martian material instead of a terrestrial simulant.
  assembly_strategy: >
    Assemble a four-member panel spanning a model bacterium (Escherichia coli B), two
    cyanobacteria (Eucapsis sp.; Chroococcidiopsis sp. Chr20-20201027-1), and a
    cold-adapted environmental bacterium (Planococcus halocryophilus), and cultivate
    each organism separately on EETA79001 regolith sawdust across a range of
    regolith:water ratios.
  perturbation_design: >
    Regolith:water ratio was the primary designed variable, spanning 4:1 to 1:10, with
    growth followed for up to 23 days under terrestrial conditions.
  measurement_endpoints:
  - Growth and survival of each organism on EETA79001 regolith over 23 days
  - Dependence of growth on regolith:water ratio (4:1 to 1:10)
  - Absence of bactericidal activity in the martian regolith
  evidence:
  - reference: PMID:38665180
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: actual martian regolith, in the form of Mars meteorite EETA79001 sawdust
    explanation: States the objective of testing growth on actual martian regolith supplied as EETA79001 meteorite sawdust.
  - reference: PMID:38665180
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: support the growth of four microorganisms
    explanation: Supports the four-member panel design tested on martian regolith.
