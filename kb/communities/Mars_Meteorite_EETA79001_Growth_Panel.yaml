  description: >-
    Mars meteorite EETA79001 sawdust was tested as the sole nutrient source for
    the panel, with its aqueous leachate providing phosphate, nitrate, sulfate,
    calcium, and magnesium ions relevant to bacterial growth and maintenance.
  scope: COMMUNITY_LEVEL
