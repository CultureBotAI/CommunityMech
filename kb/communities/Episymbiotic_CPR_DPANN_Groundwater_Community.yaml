ecological_interactions:
- name: Groundwater CPR/DPANN-Host Coexistence
  description: >
    Genome-resolved metagenomics of eight Northern California groundwater
    communities recovered 746 CPR and DPANN genomes from small-celled symbionts
    that coexist with diverse host organisms in the aquifers.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Site-Specific CPR/DPANN Differentiation
    description: >
      The CPR/DPANN genomes recovered from the eight aquifers enabled
      cross-site comparisons of species-level overlap.
  - target: Size-Fraction CPR/DPANN Host-Attachment Signal
    description: >
      The recovered CPR/DPANN lineages could also be compared across serial
      groundwater-cell size fractions to infer host-attached populations.
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: recovered 746 CPR and DPANN genomes in total
    explanation: >
      Supports the CPR and DPANN genome collection recovered from the eight
      groundwater communities.
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: site-specific diversity of CPR bacteria and DPANN archaea that coexist with
      diverse hosts in groundwater aquifers
    explanation: >
      Supports coexistence between groundwater CPR/DPANN lineages and diverse
      host organisms.
- name: Site-Specific CPR/DPANN Differentiation
  description: >
    Little species-level overlap among metagenome-assembled genomes across
    groundwater sites indicated that CPR and DPANN communities were
    differentiated by local physicochemical conditions and host populations.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: little species-level overlap of metagenome-assembled genomes (MAGs)
      across the groundwater sites
    explanation: Supports the site-specific differentiation pattern.
- name: Size-Fraction CPR/DPANN Host-Attachment Signal
  description: >
    CPR and DPANN genomes detected in larger groundwater-cell size fractions
    provided genomic evidence that many ultrasmall CPR/DPANN cells remained
    physically attached to larger host cells during filtration.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: CPR/DPANN Episymbiotic Attachment to Hosts
    description: >
      Size-fraction evidence for attached ultrasmall cells motivated direct
      near-native imaging of CPR/DPANN episymbionts on host surfaces.
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: indicate that a fair number of CPR/DPANN cells retain host attachment throughout
      the filtration process
    explanation: >
      Supports using the larger size fractions as a genomic signal of
      CPR/DPANN host attachment.
- name: CPR/DPANN Episymbiotic Attachment to Hosts
  description: >
    Cryogenic transmission electron microscopy and genomic analyses identified
    ultrasmall CPR and DPANN lineages that reproducibly attach to prokaryotic
    host-cell surfaces through pili-like structures.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Host-Attached CPR Replication Stimulation
    description: >
      Direct observation of attached ultrasmall cells led to replication-rate
      comparisons between attached and unattached CPR populations.
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: CPR and DPANN lineages that reproducibly attach to host cells
    explanation: >
      Supports reproducible CPR/DPANN episymbiotic attachment to host cells.
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: attaching through pili-like structures
    explanation: >
      Supports the host-contact mechanism observed for ultrasmall episymbionts
      in the Ag groundwater cryo-TEM images.
- name: Host-Attached CPR Replication Stimulation
  description: >
    Higher instantaneous replication rates in larger size fractions indicated
    that CPR bacteria attached to host-cell surfaces replicated faster than
    unattached CPR bacteria from the same groundwater community.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: groundwater CPR (Candidate Phyla Radiation) bacteria
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
  - preferred_term: groundwater CPR/DPANN host bacteria and archaea
    term:
      id: NCBITaxon:131567
      label: cellular organisms
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: host-attached CPR bacteria consistently exhibit a higher replication rate than
      non-host-attached CPR bacteria
    explanation: >
      Supports stimulation of CPR replication in host-attached size fractions.
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the growth of CPR bacteria seems to be stimulated by attachment to
      host-cell surfaces
    explanation: >
      Summarizes the inferred positive effect of host attachment on CPR growth.
