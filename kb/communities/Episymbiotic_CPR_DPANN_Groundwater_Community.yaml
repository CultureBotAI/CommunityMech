ecological_interactions:
- name: Groundwater CPR/DPANN-Host Coexistence
  description: Genome-resolved surveys recovered 746 CPR and DPANN genomes across eight Northern California groundwater
    sites. This framework pools distinct environmental communities, not one defined three-member culture. The canonical
    participants are broad lineage/host categories; genome recovery and coexistence do not establish colonization
    facilitation or every possible host association.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: recovered 746 CPR and DPANN genomes in total
    explanation: 'Supports the CPR and DPANN genome collection recovered from the eight groundwater communities.

      '
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: site-specific diversity of CPR bacteria and DPANN archaea that coexist with diverse hosts in groundwater
      aquifers
    explanation: 'Supports coexistence between groundwater CPR/DPANN lineages and diverse host organisms.

      '
  participating_taxa:
  - preferred_term: groundwater CPR (Candidate Phyla Radiation) bacteria
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
  - preferred_term: groundwater DPANN archaea
    term:
      id: NCBITaxon:1783276
      label: Nanobdellati
  - preferred_term: groundwater CPR/DPANN host bacteria and archaea
