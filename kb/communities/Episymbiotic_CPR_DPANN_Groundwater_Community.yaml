      label: cellular organisms
- name: Host-Attached CPR Replication Stimulation
  description: At three of four size-fraction sampling points in Ag groundwater, CPR populations had significantly
    higher iRep in the 0.65-2.5 micrometer fraction than in the 0.1-0.2 micrometer fraction. iRep is average genome-replication
    state, not a single-cell growth rate or doubling time. Archaea were excluded from this analysis. An association
    with probable attachment does not establish causation or commensalism because host fitness was not measured.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: groundwater CPR (Candidate Phyla Radiation) bacteria
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
  - preferred_term: groundwater CPR/DPANN host bacteria and archaea
    term:
      id: NCBITaxon:131567
      label: cellular organisms
  evidence:
  - reference: PMID:33495623
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: host-attached CPR bacteria consistently exhibit a higher replication rate than non-host-attached CPR
      bacteria
    explanation: Supports an iRep/size-fraction association in CPR populations, not a causal attachment intervention
      or a measured effect on host fitness.
  - reference: PMID:33495623
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the growth of CPR bacteria seems to be stimulated by attachment to host-cell surfaces
    explanation: Supports an iRep/size-fraction association in CPR populations, not a causal attachment intervention
      or a measured effect on host fitness.
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: archaeal genomes were excluded
    explanation: The replication analysis does not establish a corresponding DPANN effect.
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: average replication state of the cell population
    explanation: Defines the iRep readout; it is not an individual-cell growth rate.
