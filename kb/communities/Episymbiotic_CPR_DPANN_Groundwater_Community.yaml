- name: Site-Specific CPR/DPANN Differentiation
  description: Most site pairs had little species-level genome overlap. Hydrogeochemistry, host composition, dispersal
    history, founder effects and sampling can contribute to this pattern; the comparison does not selectively demonstrate
    physiological niche partitioning or a universal interspecies mechanism.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: little species-level overlap of metagenome-assembled genomes (MAGs) across the groundwater sites
    explanation: Supports the site-specific differentiation pattern.
  participating_taxa:
  - preferred_term: groundwater CPR (Candidate Phyla Radiation) bacteria
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
  - preferred_term: groundwater DPANN archaea
    term:
      id: NCBITaxon:1783276
      label: Nanobdellati
  - preferred_term: groundwater CPR/DPANN host bacteria and archaea
    term:
      id: NCBITaxon:131567
      label: cellular organisms
- name: Size-Fraction CPR/DPANN Host-Attachment Signal
  description: Larger size fractions contained CPR/DPANN genome signals consistent with some ultrasmall cells retaining
    host attachment. This is a size-fraction proxy, not direct taxonomic identification of cell pairs. Estimated
    cell counts used DNA yield and genome-size corrections, not direct cell counting; attachment disruption and
    other size-associated effects limit the interpretation.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:33495623
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: indicate that a fair number of CPR/DPANN cells retain host attachment throughout the filtration process
    explanation: Supports the authors' interpretation of a fraction-associated genomic signal, not direct identification
      of attached pairs.
  participating_taxa:
  - preferred_term: groundwater CPR (Candidate Phyla Radiation) bacteria
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
  - preferred_term: groundwater DPANN archaea
    term:
      id: NCBITaxon:1783276
      label: Nanobdellati
  - preferred_term: groundwater CPR/DPANN host bacteria and archaea
    term:
      id: NCBITaxon:131567
      label: cellular organisms
- name: CPR/DPANN Episymbiotic Attachment to Hosts
  description: The authors report cryo-TEM observations of ultrasmall cells attached to larger cells in concentrated
    Ag groundwater, with pili-like appendages at some interfaces. Their assignment to CPR or DPANN is inferred from
    size and community context, not a resolved taxonomic identity for each imaged pair. These observations do not
    establish a necessary attachment protein, transferred resource or host fitness effect.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: Host-Attached CPR Replication Stimulation
    description: HYPOTHESIZED - access to host-associated resources could stimulate CPR replication. Attached-cell
      images and higher CPR iRep in larger fractions support this interpretation, but attachment was not selectively
      perturbed and the putative resource transfer was not measured. The replication comparison does not include
      DPANN archaea.
  evidence:
  - reference: PMID:33495623
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: CPR and DPANN lineages that reproducibly attach to host cells
    explanation: The combined abstract interpretation exceeds the taxonomic resolution of individual cryo-TEM images;
      identity is inferred from size and context.
  - reference: PMID:33495623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: attaching through pili-like structures
    explanation: Supports reported pili-like morphology at cell interfaces, not selective demonstration of a particular
      attachment molecule.
  - reference: PMID:33495623
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: likely to be CPR or DPANN organisms
    explanation: Main text explicitly limits the taxonomic assignment of the imaged ultrasmall cells.
  participating_taxa:
  - preferred_term: groundwater CPR (Candidate Phyla Radiation) bacteria
    term:
