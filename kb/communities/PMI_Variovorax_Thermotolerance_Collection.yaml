id: CommunityMech:000050
name: PMI Variovorax Thermotolerance Collection
description: A 25-strain Variovorax collection from Populus roots, screened for bacterial effects on Arabidopsis
  thaliana thermotolerance using a rapid hydroponic assay. Six strains (CF313, YR634, GV004, GV035, YR752,
  OV084) significantly improve plant heat tolerance at 45C. CF313 was selected for detailed follow-up
  study. The thermal benefit requires direct contact with living bacteria; heat-killed bacteria and culture
  supernatants provide no protection.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Strains originally isolated from Populus roots; thermotolerance assayed in Arabidopsis hydroponic
    system.
engineering_design:
  objective: Screen Variovorax strains for ability to enhance plant host thermotolerance using rapid hydroponic
    assay.
  assembly_strategy: Selected strain set from Populus root isolates; each strain tested individually with
    Arabidopsis seedlings.
  perturbation_design: Heat shock at 45C for 14 minutes, followed by 4-day recovery at 22C.
  measurement_endpoints:
  - Chlorophyll content after recovery
  - Plant survival
  notes: PMI (Plant-Microbe Interfaces) SFA at ORNL. CF313 reduced chlorophyll loss from 20.4% to 17%
    post heat shock.
  evidence:
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: method was used to screen 25 strains of the plant growth promoting Variovorax spp. for enhanced
      plant thermotolerance
    explanation: Supports the screening objective and strain collection size.
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A follow-up study demonstrated the reproducibility of this assay and led to the discovery
      of a novel beneficial interaction
    explanation: Supports the discovery of thermotolerance-enhancing strains through this assay.
