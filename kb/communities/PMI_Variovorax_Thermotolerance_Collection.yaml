ecological_interactions:
- name: Six-Strain Variovorax Thermotolerance Hit Set
  description: Six strains, CF313, YR634, GV004, GV035, YR752 and OV084, each individually improved post-heat-shock
    Arabidopsis chlorophyll relative to the no-bacteria heat-shocked control in a 25-strain screen. Seedlings received
    one strain for 7 days before 45 C for 14 min and 4 days recovery; this was not a six-strain consortium. Experimental
    units were 5-6 wells per strain and 12 control wells, with about 10 seedlings pooled per well and specified
    outlier removal. No facilitation of bacterial colonization was measured.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to heat
    term:
      id: GO:0009408
      label: response to heat
  evidence:
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'plants inoculated with six strains (CF313, YR634, GV004, GV035, YR752, and OV084) showed significantly
      higher levels of chlorophyll content

      '
    explanation: 'Supports CF313, YR634, GV004, GV035, YR752 and OV084 as thermotolerance-enhancing hits from the
      screen.

      '
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Individual strains of Variovorax were added to MS liquid medium to inoculate 7-day-old seedlings and
      co-cultured for an additional 7 days before heat shock treatment.

      '
    explanation: Preserves individual-strain assay context without representing workflow as a separate ecological
      interaction.
  participating_taxa:
