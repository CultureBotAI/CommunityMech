- name: CF313 Follow-Up Thermotolerance Confirmation
  description: In the CF313 follow-up, heat shock reduced chlorophyll 20.4% without bacteria, 17% with living CF313
    and 9.3% after thermopriming. This supports a reproducible plant thermotolerance benefit smaller than thermopriming,
    not a colonization-facilitation phenotype. The reported 9-12 wells per treatment each pool about 10 seedlings;
    these seedlings are not independent treatment replicates.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to heat
    term:
      id: GO:0009408
      label: response to heat
  evidence:
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'These results suggest that CF313 enhanced thermotolerance in Arabidopsis but to a lesser degree than
      thermo-priming.

      '
    explanation: 'Supports the follow-up confirmation of CF313-mediated Arabidopsis thermotolerance.

      '
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Plants inoculated with CF313 (Bac + HS) exhibited 17% reduction of chlorophyll content
    explanation: 'Supports the quantified CF313 phenotype in heat-shocked seedlings.

      '
  participating_taxa:
  - preferred_term: Variovorax sp. CF313
    term:
      id: NCBITaxon:34072
      label: Variovorax
- name: CF313 Live-Cell Versus Killed-Cell and Supernatant Response
  description: Living CF313 provided the plant thermotolerance benefit, whereas heat-killed cells and filtered culture
    supernatant gave phenotypes similar to the no-bacteria heat-shocked control. HYPOTHESIZED - The authors infer
    a requirement for direct contact, but no physical-separation experiment is described; these controls do not
    distinguish contact from ongoing production, unstable signals or host-induced activity by live cells. ACC-deaminase
    or ethylene signaling was proposed, not tested as the mediator.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Plants that were inoculated with heat killed CF313 or the supernatant of CF313 culture exhibited similar
      phenotype with HS plants

      '
    explanation: 'Supports failed protection by non-living bacteria or culture supernatant.

      '
  - reference: PMID:37386471
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: 'indicating that the thermal benefit conferred by CF313 is from direct contact with living bacteria

      '
    explanation: Author inference from live/killed/supernatant contrast; not a directly isolated physical-contact
      requirement.
  participating_taxa:
  - preferred_term: Variovorax sp. CF313
    term:
      id: NCBITaxon:34072
      label: Variovorax
