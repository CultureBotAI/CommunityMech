    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A follow-up study demonstrated the reproducibility of this assay and led to the discovery
      of a novel beneficial interaction
    explanation: Supports the novel bacterially-mediated thermotolerance interaction between Variovorax
      and Arabidopsis.
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The throughput and reproducibility of the system is ideal for testing many genetic variants
      of Arabidopsis and bacterial strains
    explanation: Supports the reproducibility of the thermotolerance phenotype.
