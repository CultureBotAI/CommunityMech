ecological_interactions:
- name: Bacterially-mediated plant thermotolerance
  description: Direct contact with living Variovorax bacteria enhances Arabidopsis heat tolerance at 45C.
    Heat-killed bacteria and culture supernatants provide no protection, indicating the benefit requires
    active bacterial metabolism and physical association.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Variovorax
    term:
      id: NCBITaxon:34072
      label: Variovorax
  target_taxon:
    preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  biological_processes:
  - preferred_term: response to heat
    term:
      id: GO:0009408
      label: response to heat
  evidence:
