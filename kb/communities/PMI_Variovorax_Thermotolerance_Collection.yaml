discussions:
- discussion_id: live-cell-benefit-versus-contact-and-workflow
  prompt: Does CF313 protection require physical contact, or an activity available only during live plant-bacterium
    coculture?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Six-Strain Variovorax Thermotolerance Hit Set
  - ecological_interactions#CF313 Follow-Up Thermotolerance Confirmation
  - ecological_interactions#CF313 Live-Cell Versus Killed-Cell and Supernatant Response
  rationale: Preserve positive individual-strain and CF313 results. Assay establishment, duration calibration and
    screening sequence are methods, not ecological interactions; their three nodes and the remaining workflow arrow
    are removed. The 14 min regime followed a 12-20 min heat-duration calibration, with a chlorophyll drop after
    14 min. Physical separation and pathway perturbations would distinguish contact from ongoing signaling. No mixed
    six-member community, bacterial colonization outcome or ACC mediation was demonstrated.
