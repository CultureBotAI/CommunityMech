growth_media:
- name: R2A broth (bacterial culture); liquid MS medium (plant assay)
  temperature: '28'
  temperature_unit: °C
  shaking_speed: '250'
  shaking_speed_unit: rpm
  inoculum_size: OD600 0.01 (2.9 x 10^7 CFU/mL)
  vessel_type: 6-well plate (hydroponic assay)
  preparation_notes: Strains streaked on R2A agar (28 °C, 2 d), single colonies grown
    in R2A broth (28 °C, 250 rpm, overnight), washed and resuspended in liquid MS medium
    to OD600 0.01; Arabidopsis seedlings floated on liquid MS medium in 6-well plates.
  evidence:
  - reference: PMID:37386471
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A single bacterial colony from the agar plate was inoculated into 3 mL of
      R2A broth and cultured at 28 °C with shaking at 250 rpm overnight
    explanation: States bacterial culture medium (R2A broth), temperature (28 °C) and
      shaking (250 rpm).
