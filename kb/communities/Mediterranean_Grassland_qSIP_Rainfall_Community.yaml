id: CommunityMech:000227
name: Mediterranean Grassland qSIP Rainfall-Gradient Community
description: >
  An active soil microbial community in three Mediterranean-climate grassland
  soils sampled across a rainfall gradient and assayed with genome-resolved
  quantitative stable isotope probing (qSIP) following an H2-18O labeling
  experiment to identify actively growing organisms and link growth and
  motility traits to historical precipitation. qSIP-informed genome-resolved
  metagenomics resolves the active subset of community members, with higher
  year-round precipitation correlating with higher activity and growth rates
  of flagellar motile microorganisms.
