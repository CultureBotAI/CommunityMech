ecological_interactions:
- name: qSIP-Inferred Soil Microbial Growth
  description: DNA isotope incorporation in rewetted grassland soil microcosms supported population-specific growth/activity
    estimates over an eight-day laboratory incubation. Genome-resolved qSIP linked these estimates to genomic traits.
    This is a positive biological growth observation, not labeling or genome assembly as an ecological mechanism.
    Low versus high activity is relative to the site mean; low labeling does not establish death or absolute inactivity.
    Gross incorporation over the incubation is not instantaneous replication, net population increase or movement
    measured in the field. The two canonical Bacteria entries are overlapping aggregate guild placeholders, not
    a resolved complete roster.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:36300946
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: genome-resolved metagenomic implementation of quantitative stable isotope probing (qSIP) with an H218O
      labeling experiment
    explanation: Supports isotope-based inference of growth and its linkage to genomic capacity; laboratory incubation
      and computational estimates are not interspecies causality or complete coverage of inactive organisms.
  - reference: PMID:36300946
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: isotopic incorporation into microbial DNA requires production of new genome copies
    explanation: Supports isotope-based inference of growth and its linkage to genomic capacity; laboratory incubation
      and computational estimates are not interspecies causality or complete coverage of inactive organisms.
  - reference: PMID:36300946
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: qSIP-informed genome-resolved metagenomics to resolve the active subset of soil community members and
      identify their characteristic ecophysiological traits
    explanation: Supports isotope-based inference of growth and its linkage to genomic capacity; laboratory incubation
      and computational estimates are not interspecies causality or complete coverage of inactive organisms.
- name: Historical Rainfall and Community Activity Association
  description: Across three California Mediterranean-climate grassland sites, historical mean precipitation was
    associated with community composition and activity patterns. The source tests a historical environmental-selection
    hypothesis, not randomized long-term rainfall treatment. Soil was sampled during the wet season, dried and rewetted
    for laboratory incubation; similar incubation water potential does not remove all site-history confounding.
    Preserve the observed association without asserting directly measured niche partitioning or a community-to-community
    causal arrow.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:36300946
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: three Mediterranean grassland soils across a rainfall gradient
    explanation: This excerpt describes the historical-gradient hypothesis/design; the full primary results support
      a statistical association, not experimentally isolated historical rainfall selection.
  - reference: PMID:36300946
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: historic precipitation levels are an important factor controlling trait selection
    explanation: This excerpt describes the historical-gradient hypothesis/design; the full primary results support
      a statistical association, not experimentally isolated historical rainfall selection.
- name: Wet-Site Growth Associated with Flagellar Genomic Capacity
  description: Genomes encoding complete or mostly complete flagellar gene suites were enriched among active organisms
    from the wetter Angelo and Hopland sites compared with Sedgwick. Activity was inferred by qSIP; motility was
    predicted from genes, not observed cell trajectories or a flagellar perturbation. Higher moisture could favor
    movement and resource access, but this remains an interpretation of a cross-site association. Active Bdellovibrio
    contributed to the pattern; exact prey, predation rates and necromass production were not measured here.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: bacterial-type flagellum-dependent cell motility
    term:
      id: GO:0071973
      label: bacterial-type flagellum-dependent cell motility
    notes: Predicted flagellar capacity associated with qSIP-inferred growth; not directly measured movement or
      proven mediation.
  evidence:
  - reference: PMID:36300946
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: higher activity and growth rates of flagellar motile microorganisms
    explanation: Supports the association of isotope-inferred growth with genomes predicted to encode motility,
      not experimentally observed movement or a causal advantage of flagella.
- name: Broad Carbon-Catabolism Capacity Distribution
  description: Genomic capacities for complex-carbohydrate degradation, methanol oxidation and carbon-monoxide oxidation
    were broadly distributed across soils and activity levels, rather than universally enriched among growing organisms
    at wetter sites. Specific site/taxon associations remained, including methanol-dehydrogenase-bearing genomes
    with higher activity at Angelo. Annotation plus organism-level DNA labeling is not substrate-specific flux,
    expression, a complete carbon budget, or proven sequestration. Broadly shared capacities do not establish partitioned
    carbon niches.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:36300946
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the capacity to decompose the diverse complex carbohydrates common in soil organic matter or oxidize
      methanol and carbon monoxide were broadly distributed across active and inactive bacteria
    explanation: 'Supports the negative qSIP finding that these soil carbon-cycling capacities were not restricted
      to active rainfall-selected taxa.

      '
