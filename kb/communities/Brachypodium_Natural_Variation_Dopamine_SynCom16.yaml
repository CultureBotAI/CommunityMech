    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Dopamine was positively associated with the relative abundances of two Actinobacteria, Rhodococcus OAS809 and
      Marmoricola OAE513, and three Proteobacteria, Rhizobium OAE497, Lysobacter OAE881, and Bosea OAE506, whereas it was
