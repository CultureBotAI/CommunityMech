ecological_interactions:
- name: Exudate Dopamine Correlates With Six Member Abundances
  description: 'Across ten host lines, root-exudate dopamine (LC-MS/MS ion intensity) was positively correlated (Spearman,
    n = 28) with relative abundance of Rhodococcus OAS809, Marmoricola OAE513, Rhizobium OAE497, Bosea OAE506 and Lysobacter
    OAE881, and negatively with Paraburkholderia OAS925. Correlational: no multiple-comparison adjustment was applied, abundances
    are relative 16S reads, and dopamine co-varies with other genotype-dependent exudate features.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - &id003
    preferred_term: Rhodococcus sp. OAS809
