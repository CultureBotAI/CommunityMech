    explanation: Figure 3a legend; correlations are unadjusted and hypothesis-generating.
- name: Dopamine Stimulates Growth of Five Positively Correlated Isolates
  description: 'In monoculture (R2A or 0.1x R2A, 30 °C), 100 ug/mL dopamine significantly increased final OD600 of Rhodococcus
    OAS809, Marmoricola OAE513, Rhizobium OAE497, Bosea OAE506 and Lysobacter OAE881, the same members whose abundance correlated
    positively with exudate dopamine. Single-strain assays: they show a direct dopamine effect on each isolate, not a demonstrated
    mechanism inside the SynCom, and OD600 cannot distinguish dopamine use as a substrate from signalling.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  metabolites:
  - preferred_term: dopamine
    term: *id008
    notes: Supplied exogenously at 50 and 100 ug/mL.
  biological_processes:
  - &id010
    preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we observed that dopamine at 100 μg/mL significantly stimulated the growth of all five isolates whose abundances
      were positively associated with dopamine
    explanation: Monoculture growth-curve result for the five positively correlated members.
- name: Dopamine Inhibits Paraburkholderia OAS925 Growth
  description: In monoculture, dopamine reduced final OD600 of Paraburkholderia (reported as Burkholderia) OAS925, the only
    member negatively correlated with exudate dopamine. Single-strain assay; mechanism of inhibition was not examined.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - *id009
  metabolites:
  - preferred_term: dopamine
    term: *id008
    notes: Supplied exogenously at 50 and 100 ug/mL.
  biological_processes:
  - *id010
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: while inhibiting the growth of Burkholderia OAS925, whose abundance was negatively correlated with dopamine
    explanation: Monoculture growth-curve result for OAS925.
- name: SynCom Colonization Lowers Exudate Dopamine
  description: Across lines, plants inoculated with the SynCom had lower dopamine in spent medium than axenic plants (pooled
    two-sided t-test). The authors suggest microbial consumption and/or altered plant production or exudation; neither was
    distinguished, so this is not established catabolism.
