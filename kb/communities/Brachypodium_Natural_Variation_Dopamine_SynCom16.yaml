environmental_factors:
- name: host genotype
  value: ten natural inbred Brachypodium distachyon lines
  description: Line-specific root exudate profiles and SynCom compositions; exudate dopamine varied between lines under axenic
    conditions with high replicate variability.
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: which revealed line-to-line variation in dopamine abundance in root exudates
    explanation: Axenic experiment with n = 6 per line.
growth_media:
- name: 0.5x Murashige-Skoog salts (hydroponic plant medium)
  temperature: '22'
  temperature_unit: °C
  light_regime: 16 h light / 8 h dark
  light_intensity: '150'
  light_intensity_unit: µmol/m²/s
  vessel_type: PTL-100 culture vessel
  preparation_notes: 40 mL 0.5x MS per vessel, 50% relative humidity; SynCom added at week one and plants harvested at week
    four. Isolates were precultured at 30 °C and 200 rpm in R2A, 0.1x R2A or LB and washed in 0.5x MS before pooling.
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Plants were grown in a 16 h light/8 h dark regime at 22 °C and 50% relative humidity with 150 μmol m−2 s−1 illumination
      for four weeks.
    explanation: Plant growth conditions in the hydroponic vessels.
discussions:
- discussion_id: dopamine_substrate_or_signal
  prompt: Do the five dopamine-stimulated members catabolize dopamine, and does dopamine shift SynCom composition when supplied
    to the community rather than to single isolates?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Dopamine Stimulates Growth of Five Positively Correlated Isolates
  - ecological_interactions#SynCom Colonization Lowers Exudate Dopamine
  rationale: The study links exudate dopamine to member abundance by correlation and tests single isolates; it does not supplement
    the assembled SynCom, measure dopamine depletion by isolates, or use dopamine-deficient plants. The Actinobacteria enrichment
    was shown in a native soil microcosm, not in this SynCom.
  posed_by: claude
  posed_date: '2026-10-28'
