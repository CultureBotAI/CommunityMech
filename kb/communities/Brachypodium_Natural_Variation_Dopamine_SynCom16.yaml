id: CommunityMech:000496
name: Brachypodium Natural-Variation Hydroponic Dopamine SynCom16
description: The 16-member switchgrass (Panicum virgatum) soil bacterial SynCom inoculated onto ten natural inbred Brachypodium
  distachyon lines grown hydroponically in 0.5x MS, used to link natural variation in root exudates to SynCom composition.
  Dopamine was one of the most intense LC-MS/MS peaks in roots and root exudates; across lines, exudate dopamine was positively
  correlated with the relative abundance of Rhodococcus OAS809, Marmoricola OAE513, Rhizobium OAE497, Lysobacter OAE881 and
  Bosea OAE506 and negatively with Paraburkholderia (Burkholderia) OAS925. In monoculture, 100 ug/mL dopamine stimulated growth
  of the five positively correlated isolates and inhibited OAS925. SynCom inoculation was associated with lower exudate dopamine.
  A separate soil microcosm experiment in the same study (agricultural soil amended with dopamine) enriched Actinobacteria;
  that native soil community is not this record.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Use natural variation in Brachypodium distachyon root exudates to identify exometabolites associated with rhizosphere
    SynCom assembly.
  assembly_strategy: Equal-OD pool of 16 switchgrass rhizosphere and bulk-soil isolates (the LBNL SynCom of CommunityMech:000087)
    inoculated at final OD600 ~0.02 into hydroponic vessels containing one-week-old plants of ten B. distachyon inbred lines.
  perturbation_design: 'Host genotype (ten inbred lines: Adi9, ABR6, Bd1-1, Bd2-3, Bd21, Bd21-3, Bd3-1, Bd30-1, BdTR10h, BdTR1f)
    with axenic and no-plant controls; follow-up monoculture assays with 0, 50 and 100 ug/mL dopamine.'
  measurement_endpoints:
  - 16S rRNA amplicon relative abundance in plant spent medium
  - untargeted LC-MS/MS root exudate metabolomics
  - Spearman correlation of exudate dopamine with member abundance
  - isolate OD600 growth curves with dopamine
  - plant biomass and root phenotypes
  evidence:
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we colonized ten natural B. distachyon lines with a 16-member bacterial synthetic community (SynCom), collected
      metabolomic and 16S rRNA sequencing data, and performed an association analysis
    explanation: 'Abstract statement of the design: ten host lines, 16-member SynCom, paired metabolomics and 16S.'
  - reference: PMID:42660928
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Individual bacterial strains were resuspended to have an OD600 at 1.0, and then equal volumes were pooled together
      to make the 16-member SynCom.
    explanation: Equal-volume, equal-OD inoculum assembly.
