id: CommunityMech:000180
name: Clostridium-Thermoanaerobacterium JN4-GD17 Cellulosic Biofuel Coculture
description: >
  A thermophilic two-member cellulosic biofuel coculture composed of Clostridium
  thermocellum JN4 and Thermoanaerobacterium thermosaccharolyticum GD17. The system
  improves overall cellulosic biofuel production efficiency relative to C. thermocellum
  alone, but later mechanistic work indicates that GD17 also competitively hampers
  C. thermocellum JN4 growth while using glucose and cellobiose released during cellulose
  degradation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Characterize and engineer a defined cellulose-converting microbial consortium for
    lignocellulosic biofuel production.
  assembly_strategy: Pair cellulolytic C. thermocellum JN4 with non-cellulolytic T. thermosaccharolyticum
    GD17, a companion fermenter that converts glucose or cellobiose into final products.
  perturbation_design: Compare mono- and coculture behavior and modulate the consortium using GD17
    stimulants to rebalance cellulose conversion.
  measurement_endpoints:
  - Cellulosic biofuel production efficiency
  - Cellulose degradation
  - Growth of C. thermocellum JN4 in coculture
  - Glucose and cellobiose conversion
  evidence:
  - reference: PMID:31551972
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Characterizing and engineering microbial communities for lignocellulosic biofuel production
    explanation: Supports the consortium engineering objective.
  - reference: PMID:31551972
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Clostridium thermocellum JN4 and Thermoanaerobacterium thermosaccharolyticum GD17 coculture
    explanation: Supports the exact two-member assembly.
  - reference: PMID:31551972
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: controlling and rebalancing these microbial consortia to modulate cellulose degradation
    explanation: Supports perturbation and control of cellulose conversion.
