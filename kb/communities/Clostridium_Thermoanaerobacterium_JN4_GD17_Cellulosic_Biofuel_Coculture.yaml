ecological_interactions:
- name: Enhanced Community Fermentation Products
  description: The JN4-GD17 coculture produced more lactate, acetate and ethanol than JN4 alone in the reported
    cellulose experiments, without improved overall cellulose utilization. This is a community product outcome,
    not cellulose donation. Cellulose is the feedstock; soluble glucose and cellobiose are the proposed exchanged
    carbon.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
    notes: Upstream feedstock, not the proposed soluble transfer currency or a measured product.
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:31551972
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: coculture significantly improves overall cellulosic biofuel production efficiency
    explanation: Supports improved fermentation output; the primary Results separately show that overall cellulose
      utilization did not improve.
  participating_taxa:
  - preferred_term: Clostridium thermocellum JN4
    term:
      id: NCBITaxon:1515
      label: Acetivibrio thermocellus
  - preferred_term: Thermoanaerobacterium thermosaccharolyticum GD17
    term:
      id: NCBITaxon:1517
      label: Thermoanaerobacterium thermosaccharolyticum
- name: GD17 Competitive Conversion of Released Sugars
  description: GD17 consumed glucose and cellobiose and produced fermentation products faster than JN4 in separate
    monoculture assays. Low soluble sugars and altered cellulolytic-gene transcription in coculture support a resource-competition
    model. PARTIAL - these measurements do not directly partition partner carbon flux or establish reciprocal harm
    required by the COMPETITION enum.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Thermoanaerobacterium thermosaccharolyticum GD17
    term:
      id: NCBITaxon:1517
      label: Thermoanaerobacterium thermosaccharolyticum
  target_taxon:
    preferred_term: Clostridium thermocellum JN4
    term:
      id: NCBITaxon:1515
      label: Acetivibrio thermocellus
  metabolites:
  - preferred_term: cellobiose
    term:
      id: CHEBI:17057
      label: cellobiose
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Enhanced Community Fermentation Products
    description: PARTIAL - faster GD17 conversion of JN4-released soluble sugars can contribute to higher community
      fermentation output. Monoculture conversion assays and coculture product measurements support this model,
      but do not directly measure the partner-specific contribution.
  evidence:
  - reference: PMID:31551972
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: strong competitive metabolic advantage of T. thermosaccharolyticum GD17 over C. thermocellum JN4
    explanation: Supports comparative metabolic advantage and the resource-competition interpretation, not a demonstrated
      negative effect on both partners.
  - reference: PMID:31551972
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: conversion of glucose or cellobiose into final products
    explanation: Supports the glucose and cellobiose conversion context; direct coculture transfer flux was not
      traced.
- name: GD17 Growth Inhibition of JN4
  description: JN4 biomass estimated from total protein and genomic community proportions was lower in coculture;
    this is not a direct viable-cell count. Dextrin or sucrose addition favored GD17 and largely stopped cellulose
    use. PARTIAL - the positive perturbation supports community rebalancing, but also adds carbon and changes sampling
    time, so it does not selectively isolate growth suppression or prove reciprocal harm.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Thermoanaerobacterium thermosaccharolyticum GD17
    term:
      id: NCBITaxon:1517
      label: Thermoanaerobacterium thermosaccharolyticum
  target_taxon:
    preferred_term: Clostridium thermocellum JN4
    term:
      id: NCBITaxon:1515
      label: Acetivibrio thermocellus
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Enhanced Community Fermentation Products
    description: PARTIAL - reduced JN4 biomass and cellulose use can constrain the cellulose-derived contribution
      to community products. Stimulant-driven rebalancing supports this possibility, not a measured reduction of
      total fermentation products or a resolved carbon balance when extra substrate is supplied.
  evidence:
  - reference: PMID:31551972
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: T. thermosaccharolyticum GD17 significantly hampers the growth of C. thermocellum JN4
    explanation: Supports the inferred JN4 growth effect; the primary assay estimates biomass from protein and genomic
      proportions, not direct viable counts.
  - reference: PMID:31551972
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: relieves the carbon catabolite repression of C. thermocellum JN4
    explanation: Supports proposed relief of carbon repression, complemented by sugar concentrations, transcription
      and glucose-addition controls; it does not negate growth suppression.
  - reference: PMID:31551972
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: re-balanced cocultures largely stopped degrading cellulose
    explanation: Preserves the positive stimulant intervention while distinguishing reduced cellulose use from total
      product output with added carbon.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  operating_temperature: 60.0
  operating_temperature_unit: °C
  instrument_detail: >-
    Anaerobic tubes or serum bottles of CTFUD medium in a 60 °C incubator, static. The same
    conditions were used for each strain alone and for the reconstructed coculture, which is
    what makes the monoculture and coculture results in this paper comparable.
  notes: >-
    "Without agitation" is recorded because it is a choice rather than an omission: these are
    thermophilic cellulose degraders and C. thermocellum works through a surface-attached
    cellulosome, so leaving the substrate settled is part of the design, not a detail that
    went unmentioned.

    No working volume. The source names the vessel type - tubes or serum bottles, either -
    but never a fill volume, and the two would not imply the same one.

    Unlike several neighbouring #183 records, the cited conditions are explicitly the
    coculture's as well as the monocultures': the sentence names "the reconstructed coculture
    of the two bacteria" among what was grown this way. That is the check #529 asks for, and
    here it passes on the sentence itself rather than on a member-name count.
  evidence:
  - reference: PMID:31551972
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Clostridium thermocellum JN4, T. thermosaccharolyticum GD17 and the reconstructed
      coculture of the two bacteria were grown using CTFUD media in anaerobic tubes/serum bottles
      in an incubator at 60°C without agitation
    explanation: Vessel, medium, temperature and static operation, stated for the coculture itself.

