id: CommunityMech:000224
name: Grassland Soil Wet-Up Virus-Host Community
description: >
  A grassland soil virus-host community whose dynamics were measured following
  rewetting of a seasonally dry California Mediterranean-climate soil. Dry
  soil holds a diverse but low-biomass reservoir of virions, of which only a
  subset thrives following wet-up. Quantitative isotope tracing, time-resolved
  metagenomics, and viromics show viral richness declines by 50 percent within
  24 hours post wet-up while viral biomass increases four-fold within one week.
  Lytic, not lysogenic, cycles dominate the response. Viruses drive a
  measurable and continuous rate of cell lysis, accounting for up to 46
  percent of microbial death one week after wet-up, contributing to microbial
  biomass turnover and the widely reported post-wet-up CO2 efflux.
