    evidence_source: COMPUTATIONAL
    snippet: viruses contribute to turnover of soil microbial biomass and the widely reported CO2 efflux following
      wet-up of seasonally dry soils
    explanation: Supports an inferred ecosystem contribution, not virus-specific carbon tracing, selective viral
      manipulation or a measured CO2 mediation effect.
