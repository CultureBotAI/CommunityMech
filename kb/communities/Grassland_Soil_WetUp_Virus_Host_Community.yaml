discussions:
- discussion_id: wetup_viral_mortality_and_carbon_mediation
  prompt: How much wet-up mortality and respiratory carbon flux are caused by viruses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Lytic-Dominated Viral Response Inferred After Wet-Up
  - ecological_interactions#Estimated Viral Contribution to Microbial Death
  - ecological_interactions#Inferred Lysis Contribution to Biomass Turnover and CO2 Efflux
  rationale: Resolve burst size, genome-length conversion, extraction efficiency, persistent particles and the assumed
    six bacterial 16S copies per cell before assigning a fixed mortality fraction. The Results and Discussion give
    slightly different lower bounds, both below 1%; no equation or analysis-code reimplementation is claimed. Separate
    early osmotic mortality from later viral effects. Genomic lifestyle markers do not exclude nonintegrating temperate
    infections, and coarse host predictions do not identify every infected strain. Direct viral perturbations and
    carbon tracing are needed for the proposed CO2 mediation. Abstract and main-body richness summaries use different
    time windows, which need not be contradictory. Preserve all positive time-course evidence while retaining these
    uncertainty labels; non-graph metadata is not recertified.
  posed_by: codex
  posed_date: '2026-10-06'
