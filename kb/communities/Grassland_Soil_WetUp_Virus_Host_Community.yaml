ecological_interactions:
- name: Lytic-Dominated Viral Response Inferred After Wet-Up
  description: Laboratory wet-up microcosms showed viral richness loss and increasing viral-DNA biomass proxies,
    with isotope incorporation supporting active viral DNA replication. The authors infer a predominantly lytic
    response from these measurements and lifestyle markers. This positive evidence does not exclude nonintegrating
    temperate lifestyles or directly count every productive infection. The abstract reports a 50% richness decline
    within 24 h and a four-fold biomass increase within one week; the main Results summarize richness loss over
    the week. Those time-window summaries need not conflict; no independent reconstruction of the time course is
    claimed here.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: virus-host interaction
    term:
      id: GO:0044003
      label: symbiont-mediated perturbation of host process
  downstream:
  - target: Estimated Viral Contribution to Microbial Death
    description: PARTIAL - productive lytic infection would cause host death. Viral replication, particle dynamics
      and lifestyle markers support this contribution, but the magnitude is inferred using burst-size and recovery
      assumptions rather than directly resolved infection-to-death events.
  evidence:
  - reference: PMID:37730729
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: viruses in lytic cycles dominate the response to wet-up
    explanation: Supports the authors' lifestyle inference from genomic markers and experimental time courses, not
      proof that all particles arose by lysis or that all temperate lifestyles were absent.
  - reference: PMID:37730729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Viral richness decreases by 50% within 24 h post wet-up, while viral biomass increases four-fold within
      one week
    explanation: Supports laboratory microcosm time-course observations. Viral DNA is a biomass proxy; source sections
      summarize richness loss over different time windows, without necessarily conflicting.
  participating_taxa:
  - preferred_term: soil DNA viruses (virions)
    term:
      id: NCBITaxon:10239
      label: Viruses
  - preferred_term: grassland soil bacterial hosts
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Estimated Viral Contribution to Microbial Death
  description: The study estimates a viral contribution to bacterial mortality from extracellular viral DNA and
    a separately estimated bacterial-death denominator. Its cumulative one-week estimate ranges from below 1% to
    46.6% as assumed burst size changes from 200 to 1 virions per cell. This is a model-dependent inference, not
    directly counted lysis of 46% of all microbes. The estimate depends on viral genome length, extraction recovery,
    particle persistence and assumptions about bacterial rRNA gene copies. Canonical virus-to-bacterium direction
    denotes the proposed aggregate predatory process, not resolved strain-specific host links.
  interaction_type: PREDATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: soil DNA viruses (virions)
    term:
      id: NCBITaxon:10239
      label: Viruses
  target_taxon:
    preferred_term: grassland soil bacterial hosts
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: virus-host interaction
    term:
      id: GO:0044003
      label: symbiont-mediated perturbation of host process
  downstream:
  - target: Inferred Lysis Contribution to Biomass Turnover and CO2 Efflux
    description: HYPOTHESIZED - lysis-released cellular carbon could support turnover and community respiration.
      The study does not isolate the viral share of CO2 efflux or selectively establish this carbon-transfer mediation.
  evidence:
  - reference: PMID:37730729
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: up to 46% of microbial death driven by viral lysis one week following wet-up
    explanation: The abstract upper bound summarizes a burst-size-dependent mortality estimate. It is not a direct
      census or a fixed effect across assumptions.
- name: Inferred Lysis Contribution to Biomass Turnover and CO2 Efflux
  description: HYPOTHESIZED - lysis can release cellular material that contributes to soil biomass turnover and
    potentially fuels respiration after wet-up. The paper interprets its viral dynamics and mortality estimates
    in this ecosystem context; it does not selectively isolate virus-driven CO2 flux or establish this pathway as
    the cause of the whole wet-up respiration pulse.
  scope: COMMUNITY_LEVEL
  metabolites:
