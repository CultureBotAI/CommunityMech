ecological_interactions:
- name: Species drop-out and strain-substitution output shifts
  description: Species drop-out and strain substitution changed population succession, fermentation kinetics and
    metabolic outputs in the defined five-species synthetic-must panel. These are positive composition-perturbation
    effects, not identified molecular mechanisms. All tested consortia completed fermentation within the observation
    period; changed kinetics should not be equated with failure to finish fermentation.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both species drop-out and strain substitution produced significant impacts on population dynamics,
      growth behaviors, and metabolic outputs.
    explanation: Supports both perturbation classes affecting consortium composition, growth, and metabolite outputs.
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the molecular mechanisms underlying the observed species- and strain-dependent effects were not addressed
      in the present work.
    explanation: The full-text Discussion explicitly limits mechanistic attribution.
- name: Inferred interspecies sugar-utilization competition
  description: 'PARTIAL: drop-out-associated sugar-preference shifts and compensatory relative-abundance changes
    support the authors'' competition interpretation, principally among L. thermotolerans, S. bacillaris and T.
    delbrueckii. These consortium-level observations do not resolve a direct inhibitory agent or establish every
    pairwise relationship. ARISA measures relative DNA-based succession, not absolute viable population size; viable
    plating provides complementary evidence. Contact, toxins and nitrogen preferences remain candidate mechanisms,
    not demonstrated causes here.'
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42784437
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Sugar utilization and population data jointly revealed competitive interactions among species
    explanation: Supports the authors' competition inference from phenotypic perturbations, not a resolved molecular
      or complete pairwise mechanism.
- name: Non-Saccharomyces strain-dependent metabolic tuning
  description: Among the particular strains tested, non-Saccharomyces substitutions affected a broader range of
    final metabolites than switching the S. cerevisiae strain. The latter still had detectable effects and was not
    metabolically silent. This result is panel- and synthetic-must-specific, not a universal ordering of species
    importance or a demonstration that strain effects share one mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two-way analysis confirmed that the non-Saccharomyces substitutions affected the metabolic output more
      broadly than the S. cerevisiae strain.
    explanation: Supports a broader metabolite effect for non-Saccharomyces strain substitutions.
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: chemical outputs tracked the identity of each consortium comprising different species and strains
    explanation: Supports consortium-specific chemical outputs across the species and strain perturbation panel.
