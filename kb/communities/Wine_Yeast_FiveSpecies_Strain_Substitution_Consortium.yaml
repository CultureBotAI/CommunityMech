discussions:
- discussion_id: wine_yeast_five_species_strain_accessions
  prompt: How should the ten reported strains and synthetic-must assay context be represented in the canonical species-level
    record?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Saccharomyces cerevisiae
  - taxonomy#Lachancea thermotolerans
  - taxonomy#Hanseniaspora uvarum
  - taxonomy#Starmerella bacillaris
  - taxonomy#Torulaspora delbrueckii
  rationale: The primary article Table 1 names the ten strains, and Methods supplies the synthetic-must assay conditions.
    The earlier abstract-only gap therefore concerns canonical strain and methods curation rather than missing source
    information. These non-graph fields require a separate evidence-backed update; species identities and the existing
    engineering-design block are preserved in this graph repair.
  posed_by: codex
  posed_date: '2026-09-28'
- discussion_id: five_causal_scope_batch123
  prompt: Which mechanisms account for the composition-dependent fermentation phenotypes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Species drop-out and strain-substitution output shifts
  - ecological_interactions#Inferred interspecies sugar-utilization competition
  - ecological_interactions#Non-Saccharomyces strain-dependent metabolic tuning
  rationale: Drop-outs and substitutions establish composition effects but not their molecular mediators. Relative
    succession is not a complete pairwise interaction matrix, and non-significant statistical interactions are not
    proof of absence. Do not transfer contact or toxin mechanisms from other systems to this panel.
  posed_by: codex
  posed_date: '2026-10-08'
  evidence:
  - reference: PMID:42784437
    snippet: the molecular mechanisms underlying the observed species- and strain-dependent effects were not addressed
      in the present work.
