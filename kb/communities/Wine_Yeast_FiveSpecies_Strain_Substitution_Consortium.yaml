id: CommunityMech:000465
name: Wine Yeast Five-Species Strain-Substitution Consortium
description: A defined five-species wine yeast consortium assembled from Saccharomyces cerevisiae,
  Lachancea thermotolerans, Hanseniaspora uvarum, Starmerella bacillaris, and Torulaspora
  delbrueckii. Wang et al. 2026 represented each species with two phenotypically diverging strains
  and systematically perturbed the consortium by species drop-out and strain substitution to
  quantify fermentation kinetics, sugar utilization, population dynamics, primary metabolites, and
  major volatile compounds. Species drop-out and strain substitution both shifted population,
  growth, and metabolic outputs, with non-Saccharomyces substitutions affecting metabolic output
  more broadly than S. cerevisiae strain choice.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Test how yeast species identity and within-species strain identity shape population
    dynamics and fermentation output in a defined five-species model of spontaneous wine alcoholic
    fermentation.
  assembly_strategy: Assemble the five wine-fermentation yeasts Saccharomyces cerevisiae, Lachancea
    thermotolerans, Hanseniaspora uvarum, Starmerella bacillaris, and Torulaspora delbrueckii, with
    two phenotypically diverging strains available for each species.
  perturbation_design: Compare the full consortium against single-species drop-out communities and
    communities in which individual species are swapped between their two representative strains.
  measurement_endpoints:
  - fermentation kinetics
  - sugar utilization
  - population dynamics
  - primary metabolite profiles
  - major volatile compounds
  notes: PMID:42784437 names the five species in the PubMed abstract but does not expose the ten
    strain names, the exact medium, or incubation conditions; doi:10.1128/spectrum.02819-26 is the
    stable route to the primary article Methods.
  evidence:
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Here, we established a consortium of five yeast species that are commonly identified as major
      contributors to spontaneous wine fermentations: Saccharomyces cerevisiae, Lachancea
      thermotolerans, Hanseniaspora uvarum, Starmerella bacillaris, and Torulaspora delbrueckii.'
    explanation: Identifies the five wine yeast species assembled in the defined consortium.
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each species in this consortium was represented by two phenotypically diverging strains.
    explanation: Supports the strain-substitution design space within the five-species consortium.
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two systematic consortium perturbations, single-species drop-out, and single-strain substitutions
      were applied, and fermentation kinetics, sugar utilization, population dynamics, primary
      metabolites, and major volatile compounds were characterized.
    explanation: Supports the perturbation design and the assayed fermentation endpoints.
