ecological_interactions:
- name: Species drop-out and strain-substitution output shifts
  description: Removing a species or substituting one of the two strains representing a species
    significantly changed population dynamics, growth behavior, and metabolic output across the
    five-species wine yeast consortium.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both species drop-out and strain substitution produced significant impacts on population
      dynamics, growth behaviors, and metabolic outputs.
    explanation: Supports both perturbation classes affecting consortium composition, growth, and
      metabolite outputs.
- name: Interspecies sugar-utilization competition
  description: Fermentation sugar utilization and population measurements together supported
    competitive interactions among the wine yeast species.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sugar utilization and population data jointly revealed competitive interactions among species
    explanation: Links measured sugar consumption and population dynamics to competitive
      interspecies interactions in the five-species consortium.
- name: Non-Saccharomyces strain-dependent metabolic tuning
  description: Strain substitutions in the non-Saccharomyces members shifted metabolic output more
    broadly than the S. cerevisiae strain, while chemical profiles tracked the species and strain
    identities assembled into each consortium.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two-way analysis confirmed that the non-Saccharomyces substitutions affected the metabolic
      output more broadly than the S. cerevisiae strain.
    explanation: Supports a broader metabolite effect for non-Saccharomyces strain substitutions.
  - reference: PMID:42784437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: chemical outputs tracked the identity of each consortium comprising different species and strains
    explanation: Supports consortium-specific chemical outputs across the species and strain
      perturbation panel.
