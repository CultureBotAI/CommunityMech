id: CommunityMech:000023
name: Desulfovibrio-Methanococcus Syntrophic Consortium
description: 'A syntrophic, obligate two-member anaerobic consortium consisting of Desulfovibrio vulgaris
  Hildenborough, which oxidizes lactate to acetate, H2, and CO2 in the absence of sulfate, and Methanococcus
  maripaludis S2, a hydrogenotrophic methanogen. D. vulgaris can reduce sulfate when available, but in
  sulfate-free environments it must grow syntrophically by coupling lactate oxidation to interspecies
  hydrogen transfer. M. maripaludis consumes the H2 and CO2 produced by D. vulgaris to produce methane,
  maintaining the low H2 partial pressure thermodynamically required for continued lactate oxidation.
  This syntrophic relationship is fundamental to understanding microbial metabolism in sulfate-depleted
  anaerobic environments and represents a classic model system for studying syntrophic electron transfer
  mechanisms.

  '
ecological_state: STABLE
community_origin: NATURAL
community_category: SYNTROPHY
environment_term:
  preferred_term: sulfate-free anaerobic environment
  term:
    id: ENVO:01001405
    label: laboratory bioreactor
  notes: 'Grown in continuous culture on lactate without sulfate under strict anaerobic conditions. In
    the absence of sulfate, D. vulgaris cannot use its typical respiratory pathway and must rely on syntrophic
    partnership with a H2-consuming organism. The system demonstrates obligate dependence on interspecies
    hydrogen transfer for energy conservation.

    '
taxonomy:
- taxon_term:
    preferred_term: Desulfovibrio vulgaris Hildenborough
    term:
      id: NCBITaxon:882
      label: Nitratidesulfovibrio vulgaris str. Hildenborough
    notes: 'Anaerobic sulfate-reducing bacterium that can also grow syntrophically in the absence of sulfate.
      When grown without sulfate, D. vulgaris oxidizes lactate to acetate, producing H2 and CO2 as electron
      sink products. This organism is a facultative syntrophic partner that preferentially uses sulfate
      when available but can adapt to syntrophic metabolism in sulfate-depleted environments. Uses protons
      as the terminal electron acceptor when growing syntrophically.

      '
