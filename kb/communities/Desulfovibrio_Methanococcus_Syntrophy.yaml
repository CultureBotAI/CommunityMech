ecological_interactions:
- name: Lactate Oxidation and H2 Production
  description: 'Desulfovibrio vulgaris Hildenborough oxidizes lactate to acetate in the absence of sulfate,
    using protons as the electron acceptor and producing H2 and CO2 as electron sink products. Normally
    a sulfate-reducing bacterium, D. vulgaris can adapt to sulfate-free conditions by coupling lactate
    oxidation to syntrophic hydrogen transfer. This metabolic shift is thermodynamically unfavorable under
    standard conditions and only proceeds when H2 partial pressure is kept extremely low by a syntrophic
    partner. The organism cannot complete lactate oxidation without efficient H2 removal.

    '
  interaction_type: SYNTROPHY
  source_taxon:
