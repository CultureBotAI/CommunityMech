- name: Syntrophic Carbon Monoxide Oxidation Coupled to Sulfate and Bicarbonate Reduction
  description: In methane-depleted anoxic cold-seep microcosms, ANME-2 archaea (Candidatus Methanocomedenaceae) oxidize carbon
    monoxide (CO) to bicarbonate/CO2 and transfer reducing equivalents to syntrophic sulfate-reducing bacteria (Thermodesulfobacteriota)
    to drive dissimilatory sulfate reduction to sulfide; when sulfate is absent, ANME-2 couples CO oxidation to CO2 reduction
    to methane.
