id: CommunityMech:000475
name: Cold-Seep ANME-2b and Seep-SRB1g Carbon Monoxide-Oxidizing Syntrophic Consortium
description: Syntrophic consortium of anaerobic methane-oxidizing archaea (ANME-2b, family Candidatus Methanocomedenaceae
  / Candidatus Methanomarinus) and sulfate-reducing bacteria (Seep-SRB1g, phylum Thermodesulfobacteriota) from deep-sea methane
  seep sediments on the Costa Rica margin capable of oxidizing carbon monoxide (CO) in the absence of methane. CO oxidation
  is coupled syntrophically to dissimilatory sulfate reduction and, under sulfate-free conditions, to CO2 (bicarbonate) reduction
  to methane by ANME-2b to support cellular maintenance.
