environmental_factors:
- name: Carbon Monoxide Partial Pressure and Sulfate Availability
  value: 0.1 to 1.0 bar CO headspace; presence or absence of 5 mM sulfate
  description: Carbon monoxide serves as a low-potential electron donor (-558 mV) in the absence of methane; lower CO partial
    pressure (0.1 bar) supports peak CO oxidation and 15N assimilation, whereas elevated CO (0.4-1.0 bar) partially inhibits
    SRB and ANME anabolism.
  evidence:
  - reference: PMID:41980960
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Carbon monoxide (CO) has been reported in seep environments and represents a thermodynamically favourable alternative
      electron donor due to its low reduction potential.
    explanation: Documents CO as the alternative electron donor for seep ANME-SRB consortia.
