ecological_interactions:
- name: Modeled Coupled Nitrification
  description: The ORT proof-of-concept uses Nitrososphaeraceae and Nitrospiraceae MAG-derived models for ammonium-to-nitrite
    and nitrite-to-nitrate transformations. Sequential substrate coupling is represented computationally, not experimentally
    measured partner transfer, obligatory syntrophy or an assembled two-strain culture.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
    notes: Contextual modeled substrate/product, not a measured member-specific concentration or flux; nitrogen
      production includes an explicitly gapfilled reaction.
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
    notes: Contextual modeled substrate/product, not a measured member-specific concentration or flux; nitrogen
      production includes an explicitly gapfilled reaction.
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    notes: Contextual modeled substrate/product, not a measured member-specific concentration or flux; nitrogen
      production includes an explicitly gapfilled reaction.
  biological_processes:
  - preferred_term: ammonia oxidation
    term:
      id: GO:0019329
      label: ammonia oxidation
    notes: Applies to the modeled archaeal first step, not the entire two-step nitrification pathway.
  evidence:
  - reference: PMID:34726691
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: nitrification and denitrification
    explanation: This primary-checked process phrase identifies the modeled processes. The inspected Methods specify
      MAG selection and gapfilling; Results report simulated trajectories, not empirical field flux.
  participating_taxa:
  - preferred_term: Nitrososphaeraceae archaeon
    term:
      id: NCBITaxon:1033997
      label: Nitrososphaeraceae
  - preferred_term: Nitrospiraceae bacterium
    term:
      id: NCBITaxon:189779
      label: Nitrospiraceae
  downstream:
  - target: Modeled Nitrate Reduction with Gapfilled Nitrogen Production
    description: PARTIAL - sequential modeled nitrification supplies nitrate for modeled denitrification. This is
      a substrate route in the proof-of-concept simulation, not proof of an exclusive environmental nitrate source,
      obligatory partner dependence or genome-supported completion to nitrogen gas.
- name: Modeled Nitrate Reduction with Gapfilled Nitrogen Production
  description: Two Steroidobacteraceae MAG-derived models represent nitrate reduction to dissolved nitrogen. Neither
    MAG encoded nitrogen-gas production; the N2O-to-N2 reaction was added by gapfilling. The positive simulation
    output is therefore conditional on model assumptions, not demonstrated complete metabolism of either organism
    or measured field nitrogen loss. The two canonical denitrifier names remain distinct despite sharing a family
    identifier.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    notes: Contextual modeled substrate/product, not a measured member-specific concentration or flux; nitrogen
      production includes an explicitly gapfilled reaction.
  - preferred_term: nitrogen
    term:
      id: CHEBI:17997
      label: dinitrogen
    notes: Contextual modeled substrate/product, not a measured member-specific concentration or flux; nitrogen
      production includes an explicitly gapfilled reaction.
