discussions:
- discussion_id: ort_gapfilling_and_environmental_validation
  prompt: Which modeled nitrogen and carbon routes are supported by measured organism activity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Modeled Coupled Nitrification
  - ecological_interactions#Modeled Nitrate Reduction with Gapfilled Nitrogen Production
  - ecological_interactions#Modeled Metabolome-Informed Carbon Utilization
  rationale: 'Retain both existing model-level substrate arrows, explicitly PARTIAL for biological validation. Nitrogen-gas
    completion is gapfilled, and neither denitrifier MAG encoded it. The single-chemistry-input demonstration compares
    model stoichiometries using common rate assumptions; no high-resolution empirical time series validates its
    predicted trajectories. Iterative KBase/PFLOTRAN coupling is a proposed capability, not a demonstrated feedback
    experiment. Full publisher main text/Methods/Table1/captions read; no figure pixels, supplements, code, raw
    data or narrative execution inspected. #1527 tracks non-graph metadata and #1528 cache provenance; all canonical
    IDs/labels remain unchanged. No new graph structure.'
  posed_by: codex
  posed_date: '2026-10-06'
