ecological_interactions:
- name: Coupled Nitrification in Columbia River Sediments
  description: Ammonia-oxidizing archaea (Nitrososphaeraceae) and nitrite-oxidizing bacteria (Nitrospiraceae)
    form a coupled nitrification network in Columbia River sediments. The archaeon oxidizes ammonium to
    nitrite, which is then consumed by Nitrospiraceae to produce nitrate. This syntrophic coupling is
    fundamental to nitrogen cycling in the sediment microbiome and demonstrates metabolic interdependence
    between archaeal and bacterial partners. The partnership enables complete nitrification from ammonium
    to nitrate, feeding nitrate to downstream denitrifiers.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
    concentration: Oxidized by archaeon
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
    concentration: Produced by archaeon, consumed by bacterium
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    concentration: Produced by bacterium
  biological_processes:
  - preferred_term: nitrification
    term:
      id: GO:0019329
      label: ammonia oxidation
  evidence:
  - reference: PMID:34726691
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: predict nitrogen cycling patterns with site-specific insight into the chemical and biological
      drivers of nitrification and denitrification processes
    explanation: Demonstrates coupled nitrification as a key process in the Columbia River sediment community.
- name: Nitrate-to-Nitrogen Gas Denitrification
  description: Two Steroidobacteraceae denitrifiers consume nitrate produced by nitrifying organisms and
    reduce it through denitrification to nitrogen gas. This terminal step in the nitrogen cycle completes
    the transformation of fixed nitrogen back to atmospheric N2. The denitrifiers depend on upstream nitrification
    to provide nitrate substrate, demonstrating sequential metabolic coupling across the community. Genome-scale
    models revealed that denitrifiers utilize 15 to 23 unique carbon sources including betaine, leucine,
    and choline, enabling precise identification of biogeochemical limiting factors.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    concentration: Consumed by denitrifiers
  - preferred_term: nitrogen
    term:
      id: CHEBI:17997
      label: dinitrogen
    concentration: Produced as N2 gas
  - preferred_term: betaine
    term:
      id: CHEBI:17750
      label: glycine betaine
    concentration: Carbon source for denitrifiers
  - preferred_term: leucine
    term:
      id: CHEBI:15603
      label: L-leucine
    concentration: Carbon source for denitrifiers
  - preferred_term: choline
    term:
      id: CHEBI:15354
      label: choline
    concentration: Carbon source for denitrifiers
  biological_processes:
