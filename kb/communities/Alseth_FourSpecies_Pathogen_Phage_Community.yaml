discussions:
- discussion_id: alseth_no_time_axis_for_abundance
  prompt: Should CommunityMech represent time-resolved composition, or keep trajectories
    in linked datasets and carry only the qualitative dynamic claim as an interaction?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: >-
    The curated finding here is a trajectory — P. aeruginosa falls and
    A. baumannii rises over 10 days — but TaxonomicComposition carries a single
    abundance per member with no time axis, so `abundance_level` had to be set to
    the phage-free baseline and the trajectory written into interaction
    descriptions instead. A consumer reading abundances alone sees
    P. aeruginosa DOMINANT and A. baumannii MINOR, which is the pre-phage state
    and the opposite of this record's point.

    What would resolve it is a decision about whether CommunityMech represents
    time-series composition at all, or deliberately keeps trajectories in linked
    datasets and carries only the qualitative dynamic claim in
    `ecological_interactions`. This record is a good test case either way: the
    underlying per-timepoint densities are published.
- discussion_id: alseth_kill_the_winner_not_asserted
  prompt: Would a longer run of this community show rotating dominance, which would
    justify KILL_THE_WINNER here rather than the weaker LYTIC_INFECTION typing?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - ecological_interactions#Phage-Associated Maintenance of Community Diversity
  rationale: >-
    The diversity-maintenance result reads like kill-the-winner — predation on
    the standing dominant stops any one species excluding the rest — but the
    experiment runs 10 days and phage is driven extinct partway through, so what
    is observed is one competitive release, not turnover. The stronger value
    requires repeated or alternating dominance, so it is deliberately not used.
    A. baumannii is not itself knocked back after rising, and whether it would be
    under a longer run with persisting phage is the question that would settle
    this.
- discussion_id: alseth_resistance_mechanism_has_no_slot
  prompt: Where should a phage-resistance mechanism (receptor mutation versus defence
    system) and its fitness cost be recorded, now that prose in an interaction description
    is the only option?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - ecological_interactions#Type IV Pilus Mutation Dominates Realised Resistance
  rationale: >-
    Two curated claims here are about phage resistance — that Type IV pilus
    mutation outbeat CRISPR-Cas as the realised route, and that its fitness cost
    is the proposed reason P. aeruginosa never recovers. Both had to be written
    as COMPETITION interactions with the content in prose, because the schema has
    no resistance-mechanism or fitness-cost slot. If more phage records are
    curated this becomes a recurring loss, since receptor identity versus
    defence-system identity is the distinction that governs whether a phage
    cocktail works.
