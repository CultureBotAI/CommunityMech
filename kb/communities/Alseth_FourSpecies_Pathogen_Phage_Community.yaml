ecological_interactions:
- name: DMS3vir Lytic Infection of Pseudomonas aeruginosa via the Type IV Pilus
  description: >-
    Phage DMS3vir infects P. aeruginosa PA14 by adsorbing to the Type IV pilus,
    replicating to high titre on sensitive hosts before host resistance evolves
    and phage densities collapse. The paper treats DMS3vir as a P. aeruginosa-
    targeting phage throughout and reports no infection of the other three
    species; it does not report host-range assays against them, so the absence of
    other hosts is the study's framing rather than a tested result.
  interaction_type: LYTIC_INFECTION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas phage DMS3vir
    term:
      id: NCBITaxon:389469
      label: Casadabanvirus DMS3
  target_taxon:
    preferred_term: Pseudomonas aeruginosa PA14
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  biological_processes:
  - preferred_term: viral process
    term:
      id: GO:0016032
      label: viral process
  downstream:
  - target: Competitive Release of Acinetobacter baumannii
    description: >-
      Lysis of the otherwise dominant competitor is what frees the niche that
      A. baumannii expands into.
  - target: Type IV Pilus Mutation Dominates Realised Resistance
    description: 'PARTIAL: Phage exposure provided the selection context in which surface-based resistance
      became dominant. This links infection to the observed resistance response, but does not show that
      receptor targeting itself causes a measured fitness cost or establishes the proposed cost-mediated
      explanation for continued host non-recovery.'
  evidence:
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phage DMS3vir targets P. aeruginosa’s Type IV pilus (T4P)
    explanation: Supports the receptor and the host specificity of the infection.
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: phage DMS3vir initially reached high titres due to replication on
      sensitive P. aeruginosa hosts, followed by a rapid decline in phage densities
      due to the evolution of phage resistance
    explanation: Supports productive lytic replication on the host and its collapse
      once resistance evolves.
- name: Competitive Release of Acinetobacter baumannii
  description: >-
    Phage predation removes P. aeruginosa, the strongest competitor, and
    A. baumannii expands into the vacated niche to become the dominant species.
    The release occurred in every treatment and did not depend on whether the
    P. aeruginosa clone had a functional CRISPR-Cas system. Without phage the
    hierarchy is the reverse, with P. aeruginosa outcompeting all three others.
  interaction_type: COMPETITIVE_RELEASE
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Acinetobacter baumannii FZ21
    term:
      id: NCBITaxon:470
      label: Acinetobacter baumannii
  - preferred_term: Pseudomonas aeruginosa PA14
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  downstream:
  - target: Phage-Associated Maintenance of Community Diversity
    description: 'PARTIAL: Competitive release is a proposed component of the phage-associated community
      shift and diversity maintenance. Phage addition altered both outcomes, but the experiment does not
      isolate expansion of A. baumannii alone as a necessary or sufficient mediator of the diversity effect.'
  evidence:
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the presence of phage caused microbial communities to no longer be
      dominated by P. aeruginosa
    explanation: Supports the loss of P. aeruginosa dominance under phage.
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the competitive release of A. baumannii occurred in all treatments and
      was virtually independent of whether P. aeruginosa had a functional CRISPR-Cas
      immune system or not
    explanation: Supports both the release of A. baumannii and its independence from
      the resistance mechanism.
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. aeruginosa outcompetes the other species in the absence of phage
    explanation: Supports the phage-free competitive hierarchy that the release
      inverts.
- name: Type IV Pilus Mutation Dominates Realised Resistance
  description: P. aeruginosa can resist DMS3vir either by CRISPR-Cas immunity or by losing or modifying
    the Type IV pilus receptor. Pilus mutation became the dominant realised mechanism even in clones with
    a functional CRISPR system, and the associated fitness cost is the proposed reason P. aeruginosa does
    not recover after the phage is driven extinct. The wild type did reach higher relative abundance than
    the CRISPR-KO when A. baumannii was present, early on while phage persisted. This node records the
    observed resistance response and its qualified ecological interpretation; it does not assert reciprocal
    negative fitness effects between the listed participants. The mutation terminology is the authors'
    phenotype-based classification of surface-based resistance; these receptor mutants were not sequenced
    in this study, so it does not establish their specific genotypes.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas aeruginosa PA14
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  - preferred_term: Acinetobacter baumannii FZ21
    term:
      id: NCBITaxon:470
      label: Acinetobacter baumannii
  evidence:
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mutation of the Type IV pilus became the dominant resistance mechanism
      even if P. aeruginosa has a functional CRISPR system
    explanation: Supports pilus mutation as the realised resistance route despite an
      available CRISPR route.
  - reference: PMID:38648198
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: which might in part be why P. aeruginosa did not recover in the
      microbial community post phage exposure due to the associated fitness costs
    explanation: The authors offer the resistance-cost explanation for non-recovery
      as a proposal ("might in part be why"), so this is curated as PARTIAL rather
      than as a demonstrated causal link.
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further sequencing of receptor mutants was not done
    explanation: 'The Methods explicitly limit the reported receptor-mutant classification: no sequencing
      of these mutants was performed. Supports the evidence-resolution caveat, not a specific genotype.'
- name: Phage-Associated Maintenance of Community Diversity
  description: 'Adding phage prevented the extinctions seen in the phage-free treatments: very few or
    none of the replicates lost a species, and the authors report a diversity-maintaining effect on Shannon
    diversity over time. This is a community-level treatment outcome, not an additional virus-to-host
    infection. The actual pairwise infection is represented separately. A single competitive release does
    not establish the repeated or alternating dominance required by KILL_THE_WINNER; no such interaction
    type is assigned here.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: very few to none of the experimental repeats had 1 or more bacterial
      species go extinct
    explanation: Supports the loss of extinctions under phage relative to the
      phage-free treatments.
  - reference: PMID:38648198
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: phage targeting a dominant species allows for the competitive release of
      the strongest competitor while also contributing to community diversity
      maintenance
    explanation: 'Supports the authors'' summary of joint competitive-release and diversity outcomes.
      PARTIAL for mediation: this summary does not demonstrate that the released competitor alone causes
      diversity maintenance, or establish repeated turnover.'
- name: Model-Inferred Context Dependence of Community Interactions
  description: 'PARTIAL: The tested generalized Lotka-Volterra models fitted to pairwise data failed to
    predict three- and four-species dynamics, consistent with context-dependent interactions. This diagnostic
    does not isolate a particular higher-order mechanism or prove that no pairwise-based model could describe
    the community. Incorporating two- and three-species data improved quantitative four-species prediction
    in the absence of phage. With phage, the fitted coefficients still failed to generalize quantitatively
    to four species, although the model captured a qualitative competitive-release shift. The authors
    identify omitted explicit phage dynamics as a possible structural limitation. These are computational
    findings, not a new measured reciprocal-competition relation.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38648198
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: fitting gLV models with pairwise only datasets led to predictive failures
      when applied to 3- or 4-species datasets
    explanation: Supports failure of the tested pairwise-fitted model. Context-dependent interactions
      are a supported interpretation, not a uniquely established mechanism or a general impossibility
      result.
    computational_provenance:
      prediction_type: POPULATION_DYNAMIC_MODEL
      model_name: generalised Lotka-Volterra competition model
      model_source: GITHUB:GaTechBrownLab/phage-community-dynamics
      tools:
      - tool_name: MATLAB
        tool_version: '2021b'
        role: Model parameterisation by least-squares regression and simulation.
      parameters: >-
        dNi/dt = ri*Ni - sum_j(beta_ij*Ni*Nj). Single-species maximal growth
        rates ri fixed from monoculture time series; interaction coefficients
        beta_ij fitted from all two-species cocultures, and separately from
        three-species data with all interaction parameters open. Phage effects
        enter implicitly, as differences in the fitted interaction coefficients
        between the with- and without-phage models, rather than as an explicit
        predation term.
  - reference: PMID:38648198
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: pairwise data alone is insufficient when modelling our microbial
      community
    explanation: Supports failure of the tested pairwise-fitted model. Context-dependent interactions
      are a supported interpretation, not a uniquely established mechanism or a general impossibility
      result.
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: reasonably fit the data in the absence of phage
    explanation: Bounds improved quantitative four-species prediction from two- and three-species fits
      to the phage-free condition.
    computational_provenance:
      prediction_type: POPULATION_DYNAMIC_MODEL
      model_name: generalised Lotka-Volterra competition model
      model_source: GITHUB:GaTechBrownLab/phage-community-dynamics
      tools:
      - tool_name: MATLAB
        tool_version: 2021b
        role: Model parameterisation by least-squares regression and simulation.
      parameters: dNi/dt = ri*Ni - sum_j(beta_ij*Ni*Nj). Single-species maximal growth rates ri fixed
        from monoculture time series; interaction coefficients beta_ij fitted from all two-species cocultures,
        and separately from three-species data with all interaction parameters open. Phage effects enter
        implicitly, as differences in the fitted interaction coefficients between the with- and without-phage
        models, rather than as an explicit predation term.
  - reference: PMID:38648198
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the interaction coefficients did not generalise quantitatively to 4-species data
    explanation: Reports the remaining quantitative failure in the phage-present condition despite qualitative
      competitive-release prediction.
    computational_provenance:
      prediction_type: POPULATION_DYNAMIC_MODEL
      model_name: generalised Lotka-Volterra competition model
      model_source: GITHUB:GaTechBrownLab/phage-community-dynamics
      tools:
      - tool_name: MATLAB
        tool_version: 2021b
        role: Model parameterisation by least-squares regression and simulation.
      parameters: dNi/dt = ri*Ni - sum_j(beta_ij*Ni*Nj). Single-species maximal growth rates ri fixed
        from monoculture time series; interaction coefficients beta_ij fitted from all two-species cocultures,
