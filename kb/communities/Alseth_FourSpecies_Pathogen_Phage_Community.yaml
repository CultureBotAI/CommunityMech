id: CommunityMech:000467
name: Four-Species Pathogen Community Under DMS3vir Phage Predation
description: >
  An artificial four-species bacterial community — Pseudomonas aeruginosa PA14,
  Acinetobacter baumannii, Staphylococcus aureus, and Burkholderia cenocepacia —
  propagated for 10 days in lysogeny broth with and without the lytic phage
  DMS3vir, which infects P. aeruginosa through its Type IV pilus. Without phage,
  P. aeruginosa outcompetes the other three species. Adding DMS3vir drives
  P. aeruginosa nearly extinct and releases A. baumannii into dominance, while
  maintaining community diversity. The experiment is fully factorial over all
  1-, 2-, 3-, and 4-species combinations and over two P. aeruginosa clones (wild
  type and an isogenic CRISPR-KO), which lets the record separate the community
  consequences of phage predation from the consequences of which resistance
  mechanism evolves: the two resistance routes gave largely indistinguishable
  community dynamics, and Type IV pilus mutation became dominant even where
  CRISPR-Cas was functional.

  This is a one-phage-on-many-bacteria (1-N) system in the sense of
  doi:10.1146/annurev-virology-100424-123645 — a single phage population against
  a bacterial community — and the record exists to carry the community-level
  consequences of phage predation rather than the phage-host pair itself. Its
  modelling result is curated as a negative one: generalised Lotka-Volterra
  coefficients fitted to pairwise cocultures failed to predict the 3- and
  4-species dynamics, so the assembled community is not reconstructible from its
  pairwise parts.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHAGE_PREDATION
environment_term:
  preferred_term: laboratory batch culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >-
    Glass microcosms containing 6 ml lysogeny broth, serially transferred 1:100
    every 24 h for 10 days at 37 degrees C with shaking.

    `modeled_environment` is deliberately empty. Three of the four strains are
    clinical isolates and the four species co-occur in human infection, but the
    paper presents the assembly as an artificial community for studying phage
    effects, not as a model of a named habitat, so asserting one would be the
    curator's inference rather than the source's claim.
