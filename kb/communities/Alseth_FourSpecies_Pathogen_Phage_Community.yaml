  preferred_term: laboratory batch culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >-
    Glass microcosms containing 6 ml lysogeny broth, serially transferred 1:100
    every 24 h for 10 days at 37 degrees C with shaking.

    `modeled_environment` is deliberately empty. Three of the four strains are
    clinical isolates and the four species co-occur in human infection, but the
    paper presents the assembly as an artificial community for studying phage
    effects, not as a model of a named habitat, so asserting one would be the
    curator's inference rather than the source's claim.
