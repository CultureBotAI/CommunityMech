id: CommunityMech:000467
name: Four-Species Pathogen Community Under DMS3vir Phage Predation
description: 'An artificial four-species bacterial community — Pseudomonas aeruginosa PA14, Acinetobacter
  baumannii, Staphylococcus aureus, and Burkholderia cenocepacia — propagated for 10 days in lysogeny
  broth with and without the lytic phage DMS3vir, which infects P. aeruginosa through its Type IV pilus.
  Without phage, P. aeruginosa outcompetes the other three species. Adding DMS3vir drives P. aeruginosa
  nearly extinct and releases A. baumannii into dominance, while maintaining community diversity. The
  experiment is fully factorial over all 1-, 2-, 3-, and 4-species combinations and over two P. aeruginosa
  clones (wild type and an isogenic CRISPR-KO), which lets the record separate the community consequences
  of phage predation from the consequences of which resistance mechanism evolves: the two resistance routes
  gave largely indistinguishable community dynamics, and surface-based resistance classified by the authors
  as Type IV pilus mutation became dominant even where CRISPR-Cas was functional. That classification
  is phenotype-based; the receptor mutants were not sequenced in this study.

  This is a one-phage-on-many-bacteria (1-N) system in the sense of doi:10.1146/annurev-virology-100424-123645
  — a single phage population against a bacterial community — and the record exists to carry the community-level
  consequences of phage predation rather than the phage-host pair itself. The tested pairwise-fitted generalized
  Lotka-Volterra models failed to predict the larger community. This supports a context-dependence interpretation
  without establishing a general impossibility of prediction from pairwise information. Adding three-species
  data improved quantitative prediction without phage; with phage, quantitative failure remained despite
  a qualitative competitive-release prediction.'
