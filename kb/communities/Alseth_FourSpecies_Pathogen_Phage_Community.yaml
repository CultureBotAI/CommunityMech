discussions:
- discussion_id: alseth_no_time_axis_for_abundance
  prompt: Should CommunityMech represent time-resolved composition, or keep trajectories
    in linked datasets and carry only the qualitative dynamic claim as an interaction?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: 'The curated finding here is a trajectory — P. aeruginosa falls and A. baumannii rises over
    10 days — but TaxonomicComposition carries a single abundance per member with no time axis, so `abundance_level`
    had to be set to the phage-free baseline and the trajectory written into interaction descriptions
    instead. A consumer reading abundances alone sees P. aeruginosa DOMINANT and A. baumannii RARE, which
    is the pre-phage state and the opposite of this record''s point.

    What would resolve it is a decision about whether CommunityMech represents time-series composition
    at all, or deliberately keeps trajectories in linked datasets and carries only the qualitative dynamic
    claim in `ecological_interactions`. This record is a good test case either way: the underlying per-timepoint
    densities are published.'
- discussion_id: alseth_kill_the_winner_not_asserted
  prompt: Does this study establish recurring changes in dominance, beyond the observed single competitive
    release, sufficient to support KILL_THE_WINNER?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - ecological_interactions#Phage-Associated Maintenance of Community Diversity
  rationale: 'The reported experiment shows one competitive release and subsequent phage decline, not
    recurring alternation of the dominant species. KILL_THE_WINNER is therefore not assigned. The diversity
    outcome is also not a separate lytic infection: the direct phage-host relation is already represented
    by its own pairwise node. This record does not establish what would happen under other time horizons
    or ecological conditions.'
- discussion_id: alseth_resistance_mechanism_has_no_slot
  prompt: Where should a phage-resistance mechanism (receptor mutation versus defence
    system) and its fitness cost be recorded, now that prose in an interaction description
    is the only option?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - ecological_interactions#Type IV Pilus Mutation Dominates Realised Resistance
  rationale: 'The record distinguishes observed resistance-route frequencies from the proposed fitness-cost
    explanation for non-recovery. No dedicated mechanism or cost slot is used here, but interaction_type
    is optional: the absence of a more specific type does not justify a COMPETITION label asserting reciprocal
    negative effects. The observations and their source-qualified interpretation remain in the node description
    and evidence without that label.'
- discussion_id: alseth_diversity_mediation_unresolved
  prompt: How much of the phage-associated diversity effect is mediated by competitive release of A. baumannii?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Competitive Release of Acinetobacter baumannii
  - ecological_interactions#Phage-Associated Maintenance of Community Diversity
  rationale: The phage addition comparison supports changes in both dominance and diversity. The inspected
    Results and Discussion do not isolate the released competitor as a necessary or sufficient cause of
    diversity maintenance. The existing arrow therefore retains a PARTIAL mediation interpretation rather
    than a fully resolved mechanistic chain. A direct mediation assessment in this exact community would
    be needed to strengthen that claim.
  evidence:
  - reference: PMID:38648198
    supports: PARTIAL
    evidence_source: full_text
    snippet: phage targeting a dominant species allows for the competitive release of the strongest competitor
      while also contributing to community diversity maintenance
    explanation: The authors summarize competitive release and diversity maintenance as joint phage-associated
      outcomes; this sentence does not isolate their mediation.
