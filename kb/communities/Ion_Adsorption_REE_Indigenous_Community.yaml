- name: Oligotrophic REE Mobilization and Deep Profile Colonization
  description: 'Acidobacteria employ oligotrophic K-strategist metabolic strategies to colonize nutrient-depleted
    deep weathering zones (up to 40m depth) and contribute to long-term REE mobilization and biogeochemical
    cycling. Representing 14.6% of the bacterial community, Acidobacteria thrive in low-organic-carbon
    regolith environments where r-strategist copiotrophs (like many Proteobacteria) cannot compete. Their
    slow-growing, stress-tolerant lifestyle enables sustained activity in the C horizon weathered bedrock
    where microbial biomass decreases to 23.6 ppm. Acidobacteria produce exopolysaccharides and organic
    ligands that bind REE cations and enhance mineral dissolution at depth, complementing the more abundant
    Proteobacteria in upper horizons. This vertical metabolic partitioning ensures continuous REE mobilization
    throughout the 40-meter weathering profile. The oligotrophic adaptations of Acidobacteria are critical
    for establishing stable indigenous microbial communities in the nutrient-scarce, low-productivity
    conditions of regolith-hosted REE deposits, enabling the thousand-year biogeochemical processes that
    create economically viable HREE enrichment.

    '
