environmental_factors:
- name: Weathering Profile Depth
  value: 0-40
  unit: meters
  description: 'The weathering profile extends from topsoil (0m) through A horizon (leaching zone), B
    horizon (REE enrichment zone, peak 776 ppm total REE at ~6m), to C horizon (weathered bedrock, ~40m).
    Microbial biomass is highest at 62.5 ppm at ~2m depth and decreases to 23.6 ppm at ~40m, reflecting
    decreasing nutrient availability and increasing rock consolidation with depth. The vertical stratification
    creates distinct biogeochemical zones for REE mobilization (upper profile) and HREE accumulation (B
    horizon).

    '
  evidence:
  - reference: PMID:35708325
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In this study, we characterized the microbial community composition and diversity along a
      complete weathering profile drilled from a regolith-hosted REE deposit in Southeastern China and
      report the striking contributions of microorganisms to the enrichment of REEs and fractionation
      between HREEs and light REEs (LREEs)
    explanation: Documents vertical microbial distribution
- name: pH Gradient
  value: 4.3-7.0
  unit: pH units
  description: 'Vertical pH gradient from acidic topsoil (pH 4.3) to near-neutral B horizon bottom (pH
    7.0), reflecting leaching of acidic organic matter in upper zones and buffering by weathered silicate
    minerals at depth. The pH gradient influences microbial community composition, with acidophilic taxa
    in upper horizons and neutrophilic taxa deeper. REE mobility and speciation are pH-dependent, with
    acidic conditions enhancing mineral dissolution and near-neutral pH favoring adsorption onto clays
    and bacterial cell walls.

    '
  evidence:
  - reference: PMID:35708325
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: For bacteria, the surface carboxyl and phosphate groups are active sites for REE adsorption,
      while teichoic acids in the cell walls of G+ bacteria lead to REE fractionation
    explanation: Documents pH stratification in weathering profile
- name: REE Concentration and HREE Enrichment
  value: '776'
  unit: ppm total REE
  description: 'Peak total REE concentration of 776 ppm occurs at ~6 meter depth in the B horizon (enrichment
    zone), with HREE content ranging 56-184 ppm. This HREE enrichment represents 7-24% of total REE, substantially
    higher than typical crustal abundance ratios, demonstrating the effectiveness of microbial HREE fractionation.
    The REE content and HREE enrichment make these deposits economically viable for mining, particularly
    for critical HREE (Dy, Y, Tb) that command premium prices due to supply constraints and permanent
    magnet applications.

    '
  evidence:
  - reference: PMID:35708325
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Our results provide evidence that the variations in REE contents are correlated with microbial
      community along the profile
    explanation: Quantifies REE enrichment
- name: Geographic Distribution
  value: 40+
  unit: deposit sites
  description: 'Ion-adsorption REE deposits occur at over 40 sites across South China (Jiangxi, Guangdong,
    Fujian, Guangxi provinces), representing the world''s dominant HREE source supplying 80-90% of global
    HREE production. The deposits form in subtropical monsoon climate zones where intensive chemical weathering
    of granite and rhyolite bedrock creates thick regolith profiles. The indigenous microbial communities
    are adapted to stable weathering environments with seasonal precipitation, warm temperatures (15-25°C),
    and oligotrophic nutrient conditions.

    '
- name: Microbial Diversity
  value: 700+
  unit: genera
  description: 'The indigenous community comprises over 700 bacterial and fungal genera, representing
    exceptional microbial diversity for a subsurface weathering environment. This high diversity reflects
    niche partitioning across vertical gradients (depth, pH, nutrient availability, oxygen, REE concentration)
    and functional specialization for bioweathering, mineral dissolution, and REE biosorption. The seven
    dominant bacterial phyla (Proteobacteria, Acidobacteria, Actinobacteria, Firmicutes, Bacteroidetes,
    Chloroflexi, Gemmatimonadetes) together account for 84.2% of sequences, with the remaining 15.8% distributed
    among hundreds of rare taxa that contribute to functional redundancy and ecosystem stability.

    '
  evidence:
  - reference: PMID:35708325
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In this study, we characterized the microbial community composition and diversity along a
      complete weathering profile drilled from a regolith-hosted REE deposit in Southeastern China and
      report the striking contributions of microorganisms to the enrichment of REEs and fractionation
      between HREEs and light REEs (LREEs)
    explanation: Documents high taxonomic diversity
- name: Temperature
  value: 15-25
  unit: °C
  description: 'Subtropical temperature range typical of South China weathering profiles, supporting mesophilic
    bacterial and fungal growth. The stable warm temperatures accelerate biogeochemical weathering reactions
    and microbial metabolic activity compared to temperate or cold climates. Temperature stability (minimal
    seasonal variation at depth) allows establishment of diverse indigenous communities adapted to predictable
    thermal conditions.

    '
- name: Economic Significance
  value: 80-90%
  unit: '% global HREE supply'
  description: 'South China ion-adsorption deposits supply 80-90% of global heavy rare earth element production,
    making them strategically critical for permanent magnet (Nd-Dy), phosphor (Tb, Eu), and advanced technology
    supply chains. The microbially mediated HREE enrichment creates deposits that are economically extractable
    through simple in-situ ammonium sulfate leaching, avoiding the harsh acids, high temperatures, and
    radioactive thorium waste associated with conventional hard-rock REE mining (bastnaesite, monazite).
    This natural biogeochemical concentration process represents a sustainable model for selective HREE
    recovery relevant to circular economy and green technology applications.

    '
