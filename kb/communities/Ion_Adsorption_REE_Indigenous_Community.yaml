environment_term:
  preferred_term: weathering crust
  term:
    id: ENVO:01000747
    label: regolith
  notes: 'Weathering profile (regolith-hosted deposit) extending to 40 meters depth in granitic bedrock,
    representing the classic ion-adsorption REE deposit type of South China. The profile shows vertical
    stratification with topsoil (pH 4.3), A horizon (leaching zone), B horizon (REE enrichment zone with
    peak 776 ppm total REE at ~6m depth, HREE content 56-184 ppm), and C horizon (weathered bedrock).
    Microbial biomass peaks at 62.5 ppm at ~2m depth and decreases to 23.6 ppm at ~40m. The environment
    represents a supergene weathering system where indigenous microorganisms accelerate REE mineralization
    through bioweathering, mineral dissolution, and selective biosorption. Ion-adsorption deposits are
    the world''s primary HREE source, with over 40 sites in South China (Jiangxi, Guangdong, Fujian, Guangxi
    provinces), producing 80-90% of global HREE supply.

    '
