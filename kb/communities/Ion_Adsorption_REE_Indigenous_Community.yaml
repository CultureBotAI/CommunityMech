- name: Fungal Bioweathering and Mineral Dissolution
  description: 'Ascomycota and Basidiomycota fungi work synergistically to accelerate granite weathering
    and REE mineral dissolution through complementary enzymatic and chemical attack mechanisms. Together
    comprising over 88% of fungal sequences, these two dominant phyla produce diverse organic acids (citric,
    oxalic, gluconic), extracellular enzymes (laccases, peroxidases), and siderophores that chelate REE
    cations and dissolve silicate minerals. Ascomycete hyphae mechanically penetrate mineral grain boundaries
    while secreting organic acids that protonate and dissolve REE-bearing phases like monazite, xenotime,
    and REE-enriched clays. Basidiomycete enzymes further degrade silicate matrices and mobilize REE from
    resistant mineral structures. The fungal bioweathering creates high-surface-area weathering zones
    where primary REE minerals transform into secondary clay-bound ion-adsorption forms. This fungal-bacterial
    partnership drives the biogeochemical cascade: fungal mineral dissolution releases REE → bacterial
    biosorption concentrates HREE → deposit-scale HREE enrichment occurs. The synergistic action of Ascomycota
    and Basidiomycota accelerates REE mineralization orders of magnitude faster than abiotic weathering
    processes.

    '
