    Retain all seven positive biofilm pairings with the SX attraction exception and in-vitro provenance.; Retain
    measured spent-medium cross-feeding with AS, medium, direction and network-weight limits.; Retain biological
    omission and host-outcome evidence without overclaiming the specific mediator. Issue#1923; reports/causal_graph_review/decisions/20261008-four-records-batch119.yaml
