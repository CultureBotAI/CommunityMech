discussions:
- discussion_id: tyq1_causal_graph_scope_batch119
  prompt: How much of TYQ1-dependent nematode suppression is specifically mediated by biofilm or metabolite exchange?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Keystone-Mediated Community Recruitment
  - ecological_interactions#TYQ1-partner biofilm enhancement
  - ecological_interactions#Condition-dependent TYQ1 spent-medium cross-feeding
  - ecological_interactions#Synergistic Nematode Suppression
  rationale: Pairwise biofilm and filtrate assays support real functions, and biological strain omission supports
    the contribution of TYQ1. Removing an organism also removes its direct nematicidal and host-modulating effects;
    it is not a selective biofilm or exchange perturbation. The reported colonization increase is transient within
    the first week. Medium-matched and mechanism-specific loss/rescue experiments are needed to resolve the two
    downstream mediation arrows without erasing the positive consortium outcome.
  evidence:
  - reference: PMID:41660888
    snippet: The -TYQ1 not only lost its inhibitory function but even had the opposite effect, facilitating the
      formation of egg masses on the roots.
  posed_by: codex
  posed_date: '2026-10-08'
curation_history:
