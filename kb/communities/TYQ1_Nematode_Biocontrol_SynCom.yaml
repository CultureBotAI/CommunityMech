    explanation: Documents TYQ1 as central metabolic hub in cross-feeding network
- name: Synergistic Nematode Suppression
  description: 'The complete 8-member TYQ1-centered SynCom exhibits more efficient and stable root-knot
    nematode inhibition than individual members alone, demonstrating emergent synergistic biocontrol activity.

    '
  interaction_type: MUTUALISM
