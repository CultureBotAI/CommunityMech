      of the community and established a tightly interconnected metabolic interaction network
    explanation: Documents synergistic biofilm enhancement across the SynCom
- name: Metabolic Cross-Feeding Network
  description: 'TYQ1 serves as the central metabolic hub in a tightly interconnected metabolic interaction
    network with the 7 biomarker species, enabling metabolic cross-feeding that supports community function.

    '
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Rhizobium pusense TYQ1
    term:
