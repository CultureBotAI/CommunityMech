id: CommunityMech:000072
name: TYQ1 Nematode Biocontrol SynCom
description: 'An 8-member synthetic community centered on keystone species Rhizobium pusense TYQ1, which
  is enriched during root-knot nematode (Meloidogyne incognita) infection of cucumber (Cucumis sativus
  cv. Zhongnong 26). TYQ1 recruits 7 biomarker species that enhance biofilm formation and metabolic cross-feeding,
  creating a tightly interconnected network for synergistic nematode suppression. The community was identified
  through stress-induced enrichment analysis and validated across 12 soil types, demonstrating that keystone
  species recruitment can guide functional microbial community assembly to synergistically enhance plant
  health.

  '
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
engineering_design:
  objective: Assemble a functional synthetic community centered on stress-induced keystone species for
    synergistic root-knot nematode suppression in cucumber
  assembly_strategy: Stress-induced enrichment identification of keystone Rhizobium pusense TYQ1 followed
    by recruitment of biomarker species
  perturbation_design: Tested across 3 soil types (Beijing sandy loam, Shandong silty loam, Zhejiang loam)
    and validated across 12 soil types. Pathogen challenge with 300 J2s Meloidogyne incognita per seedling.
  measurement_endpoints:
  - 16S rRNA amplicon sequencing
  - Biofilm formation assays
  - Metabolic interaction network analysis
  - Nematode suppression assays
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: stress-induced recruitment of keystone species can guide functional microbial community assembly
      to synergistically enhance plant health
    explanation: Documents the engineering rationale for the TYQ1-centered SynCom
