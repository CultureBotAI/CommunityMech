related_ingredients:
- preferred_term: indole-3-acetic acid
  chebi_term:
    id: CHEBI:16411
    label: indole-3-acetic acid
  relevance: PGPB auxin produced by the keystone Rhizobium pusense TYQ1 — directly demonstrated via
    Salkowski assay as one of TYQ1's plant-growth-promoting traits that complements its direct
    nematicidal effect.
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Promoting growth characteristics tests indicated that TYQ1 has the potential to solubilize
      inorganic phosphate and secrete indole-3-acetic acid
    explanation: Names IAA secretion as a TYQ1-encoded PGPB trait alongside phosphate solubilization.
- preferred_term: (+)-abscisic acid
  chebi_term:
    id: CHEBI:2365
    label: (+)-abscisic acid
  relevance: Host stress-response hormone — under root-knot-nematode stress, ABA-response pathways are
    enriched in the differentially-expressed cucumber gene set induced by TYQ1 + SynCom treatment,
    indicating ABA-mediated host defense activation.
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 535 commonly induced DEGs enriched in defense and abscisic acid response pathways
    explanation: Names abscisic-acid response as one of the host defense pathways induced by the
      SynCom under nematode stress.
- preferred_term: flavonoid
  chebi_term:
    id: CHEBI:47916
    label: flavonoid
  relevance: Host plant secondary metabolite class — KEGG enrichment identifies flavonoid biosynthesis
    among the DEGs induced by TYQ1-centered SynCom treatment, alongside phenylpropanoid biosynthesis
    and plant hormone signal transduction.
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: DEGs were extensively involved in various stress response processes, including
      phenylpropanoid biosynthesis, plant hormone signal transduction, flavonoid biosynthesis
    explanation: Names flavonoid biosynthesis as a host pathway induced by the SynCom-restructured
      rhizosphere community under nematode stress.
growth_media:
- name: tryptic soy agar (TSA) and R2A
  temperature: '28'
  temperature_unit: °C
  incubation_time: 3-5
  incubation_time_unit: d
  vessel_type: agar plates; TSB and M9 broth for growth/cross-feeding assays
  preparation_notes: Rhizosphere strains isolated and cultured on TSA and R2A at 28°C; SynCom
    members co-cultured on TSA (inter-colony/biofilm assays) and grown in TSB and M9 media
    supplemented with root exudates or TYQ1 supernatant.
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: plated on TSA and R2A media. The plates were then incubated at 28°C for 3–5 days
    explanation: Reports the TSA/R2A media, 28°C temperature, and 3-5 day incubation used to
      culture the community's constituent strains.
