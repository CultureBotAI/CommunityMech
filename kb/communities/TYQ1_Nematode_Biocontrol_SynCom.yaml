ecological_interactions:
- name: Keystone-Mediated Community Recruitment
  description: 'TYQ1 enrichment during root-knot nematode infection causes restructuring of the rhizobacterial
    community, leading to enrichment of 7 biomarker species. RKN infection restructured the rhizosphere
    bacterial community in RKN-susceptible cucumber plants regardless of soil type.

    '
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Rhizobium pusense TYQ1
    term:
      id: NCBITaxon:648995
      label: Agrobacterium pusense
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: root-knot nematode (RKN) infection restructured the rhizosphere bacterial community in RKN-susceptible
      cucumber plants, regardless of the soil type
    explanation: Documents stress-induced community restructuring mediated by TYQ1
- name: Synergistic Biofilm Formation
  description: 'All 7 recruited biomarker species show mutual attraction to TYQ1 and enhance biofilm-forming
    ability of the community. Biofilm formation is a key mechanism for community cohesion and nematode
    suppression.

    '
  interaction_type: MUTUALISM
  source_taxon:
