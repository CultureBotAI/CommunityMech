ecological_interactions:
- name: Keystone-Mediated Community Recruitment
  description: TYQ1 inoculation changes the cucumber rhizobacterial community relative to uninoculated controls
    and enriches biomarker OTUs from which seven partner strains were selected. This intervention is distinct from
    the initial nematode-induced enrichment of TYQ1. Relative-abundance enrichment alone does not establish mutual
    fitness benefit, absolute growth of every partner, or a compound-specific recruitment mechanism.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Rhizobium pusense TYQ1
    term:
      id: NCBITaxon:648995
      label: Agrobacterium pusense
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: TYQ1-partner biofilm enhancement
    description: 'PARTIAL: TYQ1 inoculation enriches the pool of partners whose reconstructed pairings enhance biofilm
      in vitro. This supports a recruitment-to-biofilm hypothesis across the linked assays, not direct measurement
      of biofilm mediation in the root community.'
  - target: Condition-dependent TYQ1 spent-medium cross-feeding
    description: 'PARTIAL: TYQ1-driven partner enrichment provides members with experimentally demonstrated spent-medium
      utilization. The reconstructed laboratory network does not establish that the same directional fluxes occur
      in situ after recruitment.'
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: This strain not only directly inhibited RKNs but also caused the restructuring of the rhizobacterial
      community, thereby leading to the enrichment of multiple biomarker species
    explanation: Supports the TYQ1 inoculation effect, rather than substituting the separate nematode-infection
      comparison.
- name: TYQ1-partner biofilm enhancement
  description: 'All seven TYQ1-partner pairings increased the measured biofilm phenotype in vitro. Colony attraction
    is a separate assay: SX showed no obvious attraction or repulsion, while the other six partners induced colony
    enlargement with TYQ1. These observations do not establish bilateral growth benefit for all pairs or prove that
    biofilm enhancement mediates nematode suppression in roots.'
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Rhizobium pusense TYQ1
    term:
      id: NCBITaxon:648995
      label: Agrobacterium pusense
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Synergistic Nematode Suppression
    description: 'PARTIAL: increased biofilm may support the observed transient increase in TYQ1 root colonization
      and contribute to suppression. The study does not selectively disrupt biofilm while preserving other TYQ1
      and partner functions, so mediation remains unresolved.'
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: all strains exhibited a synergistic effect with TYQ1 in biofilm formation
    explanation: Supports the seven pairwise biofilm results, not a species-resolved mutualism claim.
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: With the exception of SX, which did not display obvious attraction or repulsion toward TYQ1
    explanation: Records the explicit exception to the attraction claim.
- name: Condition-dependent TYQ1 spent-medium cross-feeding
  description: Metabolite-feeding assays support a cross-feeding network, with important medium and direction limits.
    TYQ1 grows on filtrates of all seven partners in M9; six partners grow on TYQ1-derived metabolites, with AS
    the reported exception. In TSB, adding TYQ1 supernatant generally increases partner growth rates without changing
    carrying capacity, whereas partner supernatants do not enhance TYQ1 growth. Directed network weights summarize
    fitted carrying capacities, not measured metabolite fluxes. Gephi node removal is an in-silico centrality analysis,
    distinct from biological strain omission. No particular exchanged molecule or obligatory seven-way mutualism
    is established.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Rhizobium pusense TYQ1
    term:
      id: NCBITaxon:648995
      label: Agrobacterium pusense
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Synergistic Nematode Suppression
    description: 'PARTIAL: assayed exchange capacity may support the community that improves nematode suppression.
      Biological TYQ1 omission and diversity gradients support its community contribution, but neither isolate exchange
      from direct nematicidal activity, biofilm effects or host responses. In-silico node removal is not that biological
      test.'
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TYQ1 could utilize the metabolites secreted by all seven enriched strains for growth
    explanation: Supports partner-to-TYQ1 utilization in the metabolite-feeding assay.
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Except for AS, which exhibited a relatively slow background growth in M9 basic medium, the other six
      strains could also grow using the metabolites of TYQ1
    explanation: Bounds the reverse direction to six partners rather than seven.
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the supernatant of the enriched strains did not influence TYQ1growth
    explanation: Preserves the rich-medium negative result; it does not negate the distinct M9 filtrate result.
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: directed edge weights defined as the carrying capacity (K) derived from logistic growth curve fitting
    explanation: Network weights summarize the growth assay; they are not directly measured exchange fluxes.
- name: Synergistic Nematode Suppression
  description: 'The eight-member consortium enhances nematode suppression and cucumber performance compared with
    TYQ1 alone in the tested pot assays. Actual leave-one-strain-out and diversity-gradient communities support
    a major contribution of TYQ1: omitting it abolishes efficient suppression and can promote egg-mass formation.
    The source reports validation in 12 soil types, not universal field performance. Root defense-expression and
    metabolite changes accompany protection, but neither strain omission nor these profiles isolate biofilm, specific
    cross-fed metabolites, or host defense as the sole mediator. Plant benefit is not evidence of mutual fitness
    benefit among all microbes.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  evidence:
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the TYQ1-centered SynCom is significantly more effective than the single inoculation of TYQ1
    explanation: Supports the tested consortium-versus-TYQ1 outcome.
  - reference: PMID:41660888
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The -TYQ1 not only lost its inhibitory function but even had the opposite effect, facilitating the
      formation of egg masses on the roots.
    explanation: Actual biological omission supports TYQ1 contribution, not isolation of an exchange pathway.
  - reference: PMID:41660888
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: 535 commonly induced DEGs enriched in defense and abscisic acid response pathways
    explanation: Supports the retained defense-response association without claiming a pathway-specific loss-of-function
      experiment.
