id: CommunityMech:000124
name: Honeybee Core-20 Defined Microbiota
description: A stably transmitted 20-strain synthetic gut microbiota from honeybee intestine that primes
  host immunity and reduces Hafnia alvei prevalence.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Test whether a defined honeybee gut community can stably colonize and protect the host against
    pathogen prevalence.
  assembly_strategy: Twenty strains isolated from honeybee intestine were selected using phylogeny analysis
    to create the Core-20 community.
  perturbation_design: Honeybees were colonized through passages and challenged in the context of Hafnia
    alvei inhibition.
  measurement_endpoints:
  - immune gene expression
  - Hafnia alvei prevalence
  - stable gut colonization
  - carbohydrate-utilization functions
  evidence:
  - &id001
    reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we assembled a defined microbial community based on phylogeny analysis, the 'Core-20' community,
      consisting of 20 strains isolated from the honeybee intestine.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: honeybee intestine
  term:
    id: UBERON:0000160
    label: intestine
  notes: Defined microbial community isolated from the honeybee gut.
taxonomy:
- taxon_term:
    preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  evidence:
  - *id001
ecological_interactions:
- name: Core-20 Gut Colonization
  description: The defined Core-20 community colonizes the honeybee gut in vivo; most member strains
    remained detectable through the serial-passage experiment, with G. sp. W8131 falling below
    detection or failing to colonize.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Core-20 Immune Priming
    description: In vivo Core-20 gut colonization provides the defined community context that stimulates
      antimicrobial peptide expression before Hafnia alvei challenge.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: All strains except G. sp. W8131 were detected individually in bee gut samples
      among passages
    explanation: Establishes in vivo persistence for most Core-20 strains during the serial honeybee-gut
      passaging experiment and prevents the record from implying perfect detection of all 20 members.
- name: Core-20 Immune Priming
  description: The stably established Core-20 community triggers up-regulation of honeybee innate immune
    genes, including antimicrobial peptide genes, that the authors link to microbiota-mediated pathogen
    protection.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: regulation of innate immune response
    term:
      id: GO:0045088
      label: regulation of innate immune response
  downstream:
  - target: Immune-Mediated Hafnia alvei Reduction
    description: Core-20 immune-gene induction coincided with reduced H. alvei loads after oral challenge
      and was interpreted as part of the protective mechanism.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bees with the Core-20 showed a significant increase of AMPs abaecin,
      apidaecin, hymenoptaecin, and defensin-1
    explanation: Supports the Core-20-induced antimicrobial peptide response measured before H. alvei
      inoculation.
- name: Immune-Mediated Hafnia alvei Reduction
  description: Host immune regulation by the Core-20 gut community reduces Hafnia alvei prevalence in
    orally challenged honeybees.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bees treated with the Core-6, including all these strains demonstrating the ability
      to inhibit pathogens, did not show a significant reduction of H. alvei, while
      the Core-20 reduced the H. alvei loads by 78 times
    explanation: 'Supports the endpoint: the high-diversity Core-20 inoculum reduced H. alvei burden
      in vivo after oral challenge.'
environmental_factors:
- name: stably transmitted defined microbiota
  value: The Core-20 community was passaged through honeybee guts and evaluated for stable colonization
    and immune effects.
  description: Honeybees were colonized through passages and challenged in the context of Hafnia alvei
    inhibition.
  evidence:
  - *id001
related_ingredients:
- preferred_term: carbohydrate
  chebi_term:
    id: CHEBI:16646
    label: carbohydrate
  relevance: Carbohydrate utilization is a represented genomic capacity of the Core-20 community
    and a plausible contributor to nutrient-niche occupation in the honeybee gut, but this record
    treats the link to immune priming and Hafnia alvei exclusion as a hypothesis rather than a tested
    metabolite edge.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Functions related to carbohydrate utilization and the phosphoenolpyruvate-dependent sugar
      phosphotransferase system (PTS systems) are represented in genomic analysis of the defined community
    explanation: The abstract names carbohydrate utilization as a represented function of the Core-20
      community, anchoring carbohydrate as a central substrate class.
- preferred_term: phosphoenolpyruvate
  chebi_term:
    id: CHEBI:18021
    label: phosphoenolpyruvate
  relevance: The phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS) is represented in
    Core-20 genome annotations, implicating PTS-linked sugar uptake as a possible community function
    without proving that phosphoenolpyruvate flux regulates the host immune response in vivo.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS systems) are represented
      in genomic analysis of the defined community
    explanation: The abstract explicitly names the phosphoenolpyruvate-dependent PTS as a represented
      function, anchoring phosphoenolpyruvate as a key metabolite in sugar transport.
growth_media:
- name: heart infusion agar (with 5% sheep blood), MRS agar, or TPY agar
  temperature: '35'
  temperature_unit: °C
  atmosphere: CAPNOPHILIC
  headspace_gas: 5% CO2
  incubation_time: '2-3'
  incubation_time_unit: d
  vessel_type: agar plate
  inoculum_source: honeybee-gut strain glycerol stocks (stored at -80°C)
  preparation_notes: Core-20 strains were revived from -80°C glycerol stocks on rich
    non-selective agar media before community assembly and honeybee colonization.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The glycerol stocks were plated on heart infusion agar supplemented with
      5% (vol/vol) defibrinated sheep’s blood (Solarbio, Beijing, China), MRS agar
      (Solarbio, Beijing, China) or TPY agar (Solarbio, Beijing, China) incubated at
      35°C in 5% CO2 for 2–3 days.
    explanation: Names the agar media, 35°C incubation, 5% CO2 atmosphere, and 2–3 day
      duration used to revive the Core-20 strains.
