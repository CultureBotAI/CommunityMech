id: CommunityMech:000124
name: Honeybee Core-20 Defined Microbiota
description: A stably transmitted 20-strain synthetic gut microbiota from honeybee intestine that primes
  host immunity and reduces Hafnia alvei prevalence.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Test whether a defined honeybee gut community can stably colonize and protect the host against
    pathogen prevalence.
  assembly_strategy: Twenty strains isolated from honeybee intestine were selected using phylogeny analysis
    to create the Core-20 community.
  perturbation_design: Honeybees were colonized through passages and challenged in the context of Hafnia
    alvei inhibition.
  measurement_endpoints:
  - immune gene expression
  - Hafnia alvei prevalence
  - stable gut colonization
  - carbohydrate-utilization functions
  evidence:
  - &id001
    reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we assembled a defined microbial community based on phylogeny analysis, the 'Core-20' community,
      consisting of 20 strains isolated from the honeybee intestine.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: honeybee intestine
  term:
    id: UBERON:0000160
    label: intestine
  notes: Defined microbial community isolated from the honeybee gut.
taxonomy:
- taxon_term:
    preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  evidence:
  - *id001
ecological_interactions:
- name: Core-20 Gut Colonization
  description: The defined Core-20 inoculum established gut communities in honeybees. During four serial passages,
    most input strains were detected, while G. sp. W8131 was below detection or failed to colonize. Relative abundance
    and diversity changed, so this is not unchanged composition or confirmed persistence of every strain. The separate
    passaging experiment did not establish that every passage preserved immune stimulation or pathogen protection.
    The canonical Bacteria participant is a broad placeholder, not a resolved 20-strain roster.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Core-20 Immune Priming
    description: PARTIAL - experimental Core-20 inoculation and establishment provide the microbial exposure that
      induces host immune-gene expression before challenge. The positive treatment response supports this link,
      but the separate serial-passage result does not establish persistent colonization as the necessary mediator
      or protection at every passage.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: All strains except G. sp. W8131 were detected individually in bee gut samples among passages
    explanation: Establishes in vivo persistence for most Core-20 strains during the serial honeybee-gut passaging
      experiment and prevents the record from implying perfect detection of all 20 members.
- name: Core-20 Immune Priming
  description: 'Core-20 treatment increased host innate immune-gene expression: selected Toll/Imd pathway genes
    at 24 h and abaecin, apidaecin, hymenoptaecin and defensin-1 transcripts on Day 7 before Hafnia alvei challenge.
    These are positive qPCR transcriptional responses, not direct AMP protein concentration or antimicrobial activity
    measurements. The authors propose immune priming as part of protection; selective immune or PTS perturbations
    were not reported in this study.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: regulation of innate immune response
    term:
      id: GO:0045088
      label: regulation of innate immune response
  downstream:
  - target: Core-20-Associated Hafnia alvei Load Reduction
    description: PARTIAL - induced host immune effectors could restrict Hafnia alvei after challenge. Prechallenge
      immune-gene induction and subsequent reduced pathogen load support the authors' protective mechanism proposal,
      but no selective immune-pathway perturbation establishes mediation or excludes nutrient competition and other
      community effects.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bees with the Core-20 showed a significant increase of AMPs abaecin, apidaecin, hymenoptaecin, and
      defensin-1
    explanation: Supports prechallenge AMP-gene transcript increases measured by qPCR, not direct peptide abundance
      or proof of immune-mediated protection.
- name: Core-20-Associated Hafnia alvei Load Reduction
  description: Core-20 treatment reduced Hafnia alvei load by the reported 78-fold relative to microbiota-free bees
    five days after oral challenge; load was measured by qPCR and normalized to host actin. Core-6 did not significantly
    reduce the load in that comparison. This positive community-treatment outcome is not pathogen eradication, direct
    viable-cell enumeration or demonstrated immune mediation. The strain-composition comparison does not isolate
    richness from strain identity, and the broad canonical bacterial participant does not resolve host, pathogen
    or individual symbiont identities.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: honeybee gut bacterial Core-20 members
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bees treated with the Core-6, including all these strains demonstrating the ability to inhibit pathogens,
      did not show a significant reduction of H. alvei, while the Core-20 reduced the H. alvei loads by 78 times
    explanation: Supports the positive oral-challenge load endpoint, not selectively identified immune mediation
      or a richness-only treatment effect.
environmental_factors:
- name: stably transmitted defined microbiota
  value: The Core-20 community was passaged through honeybee guts and evaluated for stable colonization
    and immune effects.
  description: Honeybees were colonized through passages and challenged in the context of Hafnia alvei
    inhibition.
  evidence:
  - *id001
related_ingredients:
- preferred_term: carbohydrate
  chebi_term:
    id: CHEBI:16646
    label: carbohydrate
  relevance: Carbohydrate utilization is a represented genomic capacity of the Core-20 community
    and a plausible contributor to nutrient-niche occupation in the honeybee gut, but this record
    treats the link to immune priming and Hafnia alvei exclusion as a hypothesis rather than a tested
    metabolite edge.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Functions related to carbohydrate utilization and the phosphoenolpyruvate-dependent sugar
      phosphotransferase system (PTS systems) are represented in genomic analysis of the defined community
    explanation: The abstract names carbohydrate utilization as a represented function of the Core-20
      community, anchoring carbohydrate as a central substrate class.
- preferred_term: phosphoenolpyruvate
  chebi_term:
    id: CHEBI:18021
    label: phosphoenolpyruvate
  relevance: The phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS) is represented in
    Core-20 genome annotations, implicating PTS-linked sugar uptake as a possible community function
    without proving that phosphoenolpyruvate flux regulates the host immune response in vivo.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS systems) are represented
      in genomic analysis of the defined community
    explanation: The abstract explicitly names the phosphoenolpyruvate-dependent PTS as a represented
      function, anchoring phosphoenolpyruvate as a key metabolite in sugar transport.
growth_media:
- name: heart infusion agar (with 5% sheep blood), MRS agar, or TPY agar
  temperature: '35'
  temperature_unit: °C
  atmosphere: CAPNOPHILIC
  headspace_gas: 5% CO2
  incubation_time: '2-3'
  incubation_time_unit: d
  vessel_type: agar plate
  inoculum_source: honeybee-gut strain glycerol stocks (stored at -80°C)
  preparation_notes: Core-20 strains were revived from -80°C glycerol stocks on rich
    non-selective agar media before community assembly and honeybee colonization.
  evidence:
  - reference: PMID:36532452
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The glycerol stocks were plated on heart infusion agar supplemented with
      5% (vol/vol) defibrinated sheep’s blood (Solarbio, Beijing, China), MRS agar
      (Solarbio, Beijing, China) or TPY agar (Solarbio, Beijing, China) incubated at
      35°C in 5% CO2 for 2–3 days.
    explanation: Names the agar media, 35°C incubation, 5% CO2 atmosphere, and 2–3 day
      duration used to revive the Core-20 strains.
discussions:
- discussion_id: core20_protection_mediation
  prompt: Which Core-20 members and host mechanisms cause the reduced pathogen load?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Core-20 Gut Colonization
  - ecological_interactions#Core-20 Immune Priming
  - ecological_interactions#Core-20-Associated Hafnia alvei Load Reduction
  rationale: Retain the positive immune-gene and load responses while testing immune-pathway necessity, peptide
    activity and strain-resolved contributions separately. The primary study proposes PTS-linked immune stimulation
    and nutrient-niche occupation from comparative genomic potential; neither is a newly demonstrated causal branch
    here. Four-passage detection is a separate endpoint with W8131 uncertainty, changing diversity and no protective
    challenge demonstrated for each passage. Existing broad Bacteria grounding is preserved rather than expanded
    to unverified CURIEs. Non-graph evidence classification and metadata are preserved, not recertified.
  posed_by: codex
  posed_date: '2026-10-06'
curation_history:
- timestamp: '2026-10-06T15:06:39Z'
  curator: codex
  action: REVIEW_CAUSAL_GRAPH
  changes: 'Separate positive Core-20 transcripts and pathogen reduction from proposed immune mediation. Issue #1499;
    reports/causal_graph_review/decisions/20261006-enrichments-core20-batch51.yaml'
  llm_assisted: true
