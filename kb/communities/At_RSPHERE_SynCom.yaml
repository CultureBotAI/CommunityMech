ecological_interactions:
- name: At-RSPHERE Root SynCom Recolonization
  description: Defined root-derived bacterial mixtures recolonized living Arabidopsis plants and resembled natural
    root microbiota at coarse taxonomic levels. The Bai study's main root/soil mixture contained 188 isolates; this
    is distinct from the later 17-member AtSC5/AtSC6 assays. The graph participant list is deliberately non-exhaustive,
    not a verified strain roster or evidence of partner facilitation.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  target_taxon:
    preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  biological_processes:
  - preferred_term: biological process involved in symbiotic interaction
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  evidence:
  - reference: doi:10.1038/nature16192
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Using defined bacterial communities and a gnotobiotic Arabidopsis plant system we show that the isolates
      form assemblies resembling natural microbiota on their cognate host organs, but are also capable of ectopic
      leaf or root colonization
- name: R401 Exometabolite Antagonism of At-SynCom Members
  description: Root401 DAPG/pyoverdine biosynthetic disruption decreased in-vitro antagonism against At- and Lj-derived
    commensals. This supports exometabolite-dependent inhibition, not a uniform reciprocal fitness cost or a verified
    identity for every inherited representative taxon. Only the source-established canonical Root401 entry is listed
    here.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas brassicacearum Root401
    term:
      id: NCBITaxon:930166
      label: Pseudomonas brassicacearum
  metabolites:
  - preferred_term: 2,4-diacetylphloroglucinol
    term:
      id: CHEBI:78688
      label: 2,4-diacetylphloroglucinol
  - preferred_term: pyoverdine
    term:
      id: CHEBI:84046
      label: pyoverdine
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: DAPG/Pyoverdine-Dependent AtSC6 Remodeling
    description: PARTIAL - Root401 exometabolites support commensal inhibition and are required for the characteristic
      AtSC6 root-composition shift. The in-vitro inhibition magnitude did not predict individual in-planta abundance
      changes, so this arrow links experimentally supported processes without claiming quantitative mediation across
      assays.
  evidence:
  - reference: PMID:40663585
    snippet: we confirmed the significant decrease of antagonism toward At-derived and Lj-derived commensal bacteria
      used in our study
    explanation: The study's pvdY/phlD double-mutant assay supports reduced antagonism; the older greater-than-70-percent
      estimate is background from another study.
    evidence_source: IN_VITRO
    supports: SUPPORT
- name: DAPG/Pyoverdine-Dependent AtSC6 Remodeling
  description: Wild-type Root401 changed AtSC6 composition on Col-0 roots, while the pvdY/phlD mutant lost the characteristic
    shift. This is a host-associated community-composition result, not reciprocal competitive harm to all members.
    Listed participants identify the host and invader, not all 17 community strains.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  - preferred_term: Pseudomonas brassicacearum Root401
    term:
      id: NCBITaxon:930166
      label: Pseudomonas brassicacearum
  metabolites:
  - preferred_term: 2,4-diacetylphloroglucinol
    term:
      id: CHEBI:78688
      label: 2,4-diacetylphloroglucinol
  - preferred_term: pyoverdine
    term:
      id: CHEBI:84046
      label: pyoverdine
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: R401 Root Invasion of AtSC6-Precolonized Arabidopsis
    description: PARTIAL - the authors infer that exometabolite-dependent AtSC6 remodeling permits Root401 invasion.
      Mutation changes inhibition, remodeling and invasion together; it does not independently establish that the
      composition shift is the necessary mediator.
  evidence:
  - reference: PMID:40663585
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: R401wt-induced remodeling of AtSC6 composition was directly linked to both invasion and disease and
      requires production of pyoverdine and DAPG
    explanation: Supports exometabolite-dependent remodeling in roots; selective intervention on composition as
      an independent mediator was not isolated.
- name: R401 Root Invasion of AtSC6-Precolonized Arabidopsis
  description: Wild-type Root401 invaded AtSC6-precolonized Arabidopsis roots by the reported relative-abundance
    readout; invasion was partly impaired by loss of DAPG/pyoverdine production, and At-derived communities then
    protected the plant. Root invasion contrasts with failed invasion of established liquid AtSC6. Competitive exclusion
    is an experimentally supported community phenotype in this study, but these endpoints do not establish reciprocal
    harm to every listed participant or identify a unique limiting resource.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  - preferred_term: Pseudomonas brassicacearum Root401
    term:
      id: NCBITaxon:930166
      label: Pseudomonas brassicacearum
  evidence:
  - reference: PMID:40663585
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Inspection of R401 levels based on RA in root samples revealed that R401wt efficiently invaded roots
      pre-colonized by AtSC6, and this colonization phenotype was partially impaired for R401mut
    explanation: Supports root invasion measured as relative abundance and its partial reduction in the mutant,
      not absolute titer or selective composition mediation.
  - reference: PMID:40663585
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At SynCom inability to protect against wild-type R401 (R401wt) reported above (Fig 1A) was causally
      linked to R401 exometabolite-mediated inhibition of AtSC5 and AtSC6 members
    explanation: Confirms that R401's exometabolites causally suppress the protective activity of At-derived SynComs.
