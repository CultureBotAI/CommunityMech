id: CommunityMech:000003
name: At-RSPHERE SynCom
description: 'A synthetic bacterial community derived from the Arabidopsis root microbiota
  culture collection (At-RSPHERE), representing 16 bacterial families isolated from
  Arabidopsis thaliana roots grown in natural soil. This community was established
  to study plant-microbe interactions and their effects on plant productivity and
  carbon cycling in the rhizosphere. The consortium members were selected to represent
  a broad taxonomic range covering the major bacterial phyla (Proteobacteria, Actinobacteria,
  and Bacteroidetes) found in the Arabidopsis root microbiome. Assembly sizes vary
  from 5-20 members depending on experimental design, enabling reductionist studies
  of root microbiota assembly and function.

  '
