    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using defined bacterial communities and a gnotobiotic Arabidopsis plant
      system we show that the isolates form assemblies resembling natural microbiota
      on their cognate host organs, but are also capable of ectopic leaf or root colonization
