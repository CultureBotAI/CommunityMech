    concentration: 30
    unit: mM
    chebi_term:
      preferred_term: butyrate
      term:
        id: CHEBI:17968
        label: butyrate
  - name: ammonium chloride
  preparation_notes: >-
    The 0B culture used an anoxic basal medium lacking yeast extract and
    supplemented with 30 mM sodium butyrate; ammonium chloride was carried over
    from the basal-medium recipe.
  evidence:
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Batch cultivations were established in 500 mL anaerobic flasks
      containing 250 mL anoxic basal medium and an N2:CO2 (80:20) headspace
    explanation: Supports the anaerobic flask volume, working volume, and gas mix.
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To further enrich the SBO community, subsequent transfers were performed
      in medium lacking yeast extract and supplemented with sodium butyrate (0B
      medium).
    explanation: >-
      Supports the sodium-butyrate, yeast-extract-free 0B medium regime.
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Following depletion of the supplied substrate and its degradation
      products, the 0B culture was fed additional substrate (30 mM sodium
      butyrate)
    explanation: Supports the 30 mM sodium butyrate amendment.
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reducing agents, vitamins, mineral solutions, and ammonium chloride were
      added as described above
    explanation: Supports ammonium chloride as a 0B medium component.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: FLASK
  working_volume: 250.0
  working_volume_unit: mL
  operating_temperature: 51.0
  operating_temperature_unit: °C
  controls_notes: >-
    Batch cultivations used 500 mL anaerobic flasks containing 250 mL anoxic
    basal medium under an N2:CO2 80:20 headspace; the 0B enrichment was
    maintained as a single long-term culture and refed with butyrate after
    depletion of supplied substrate and its degradation products.
  evidence:
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Within the duration of the present study, attempts to repeatedly transfer
      the 0B culture in medium without yeast extract were unsuccessful
    explanation: >-
      Supports recording the 0B enrichment as a single long-term culture rather
      than as a repeatably transferred serial enrichment.
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Following depletion of the supplied substrate and its degradation
      products, the 0B culture was fed additional substrate (30 mM sodium
      butyrate) on days 330, 449, 488, 554, 629, 678, 764 and 848.
    explanation: Supports the long-term butyrate refeeding schedule.
