environmental_factors:
- name: High-ammonia biogas origin
  value: elevated ammonia digestate
  description: >-
    The enrichment originated from a high-ammonia thermophilic biogas process
    treating food and slaughterhouse waste.
  evidence:
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The bioreactor was inoculated with digestate from a large-scale biogas
      plant treating food waste from households and industries and minor
      fractions of slaughterhouse waste.
    explanation: Supports the source of the syntrophic community.
- name: Long-term 0B butyrate enrichment
  value: 972 days and 8 degradation cycles
  description: >-
    The 0B culture was maintained without yeast extract and repeatedly fed 30
    mM sodium butyrate over eight depletion cycles.
  evidence:
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To further enrich the SBO community, subsequent transfers were performed
      in medium lacking yeast extract and supplemented with sodium butyrate (0B
      medium).
    explanation: Supports the 0B medium regime.
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      95 972 NA Number of degradation cycles 1 8 NA
    explanation: Supports the 972-day, eight-cycle duration of the 0B culture.
- name: Thermophilic static dark incubation
  value: 51 +/- 1 C
  unit: degrees Celsius
  description: >-
    The butyrate enrichment was incubated statically in the dark at
    thermophilic temperature.
  evidence:
  - reference: PMID:42527912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      incubated statically in the dark at 51 ± 1 °C.
    explanation: Supports the static, dark, thermophilic incubation condition.
