id: CommunityMech:000350
name: High-Ammonia Biogas 0B Butyrate-Oxidizing Enrichment
description: >-
  A thermophilic, high-ammonia syntrophic butyrate-oxidizing enrichment
  culture maintained in yeast-extract-free 0B medium after derivation from a
  propionate-fed biogas reactor community. The enrichment was inoculated from a
  laboratory bioreactor that originated from large-scale food- and
  slaughterhouse-waste digestate, then followed as a single long-running,
  butyrate-fed anaerobic culture at 51 C for 972 days. Amplicon and
  metagenomic analyses recovered MAG1, a putative novel ammonia-tolerant
  syntrophic butyrate oxidizer proposed as Candidatus Syntrophothermus
  ammoniitolerans, together with a putative syntrophic acetate-oxidizing MAG
  related to Candidatus Thermosyntrophaceticus schinkii and hydrogenotrophic
  Methanoculleus and Methanothermobacter MAGs that likely close the network by
  consuming formate or H2 and producing methane.
