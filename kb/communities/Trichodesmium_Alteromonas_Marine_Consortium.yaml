  target_taxon:
    preferred_term: Trichodesmium-associated heterotrophic microbiome
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
    notes: Trichodesmium is a photoautotrophic cyanobacterium with day-night physiological cycles.
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
    notes: Diel expression patterns can affect nitrogen fixation and resource cycling.
  evidence:
  - reference: PMID:29382945
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: significantly coordinated patterns of gene expression between host and microbiome
    explanation: Supports coordinated diel activity between Trichodesmium and associated bacteria.
  - reference: PMID:29382945
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: linked to key resources including nitrogen, carbon, and iron
    explanation: Supports resource-linked functional coordination in the holobiont.
