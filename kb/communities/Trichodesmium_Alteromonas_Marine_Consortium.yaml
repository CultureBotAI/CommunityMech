ecological_interactions:
- name: Colony Substrate Colonization by Heterotrophs
  description: Trichodesmium colonies provide physical and nutrient-rich habitats associated with heterotrophs.
    The 2017 study recovered an A. macleodii representative genome from an IMS101 laboratory enrichment and found
    a conserved association across culture and environmental samples. This establishes association, not commensal
    neutrality, universal mutualism or a causal explanation of the separate 2018 field day-night transcript patterns.
    Named participants here identify the laboratory association, not an assertion that the field host was the IMS101
    strain.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
    notes: Trichodesmium fixes nitrogen in oligotrophic marine environments.
  evidence:
  - reference: PMID:28440800
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: macroscopic colonies that serve as relatively nutrient-rich substrates
    explanation: Supports nutrient-rich colony habitat context; neither fitness neutrality nor mediation of field
      expression was established.
  participating_taxa:
  - preferred_term: Trichodesmium erythraeum IMS101
    term:
      id: NCBITaxon:203124
      label: Trichodesmium erythraeum IMS101
  - preferred_term: Alteromonas macleodii Trichodesmium associate
    term:
      id: NCBITaxon:28108
      label: Alteromonas macleodii
- name: Putative Alteromonas Helper Functions in Trichodesmium Colonies
  description: 'HYPOTHESIZED: comparative genomics and transcription identify candidate A. macleodii contributions
    to Trichodesmium nutrient acquisition, small-carbon recycling and ROS detoxification. The study also assayed
    siderophore production in isolates and reported Trichodesmium DMSP production; those measurements do not establish
    complete interpartner fluxes or reciprocal fitness effects. The proposed B12 direction is host-to-epibiont,
    not Alteromonas-to-Trichodesmium, and the 2017 genome permits facultative B12 use. These candidates are not
    demonstrated causes of the later field co-expression phenotype.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Alteromonas macleodii Trichodesmium associate
    term:
      id: NCBITaxon:28108
      label: Alteromonas macleodii
  target_taxon:
    preferred_term: Trichodesmium erythraeum IMS101
    term:
      id: NCBITaxon:203124
      label: Trichodesmium erythraeum IMS101
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:18367
      label: phosphate(3-)
    notes: Phosphate release is a proposed APase-mediated nutrient-acquisition mechanism (2017 Figure 3), not a
      measured interpartner phosphate flux.
  - preferred_term: iron(2+)
    term:
      id: CHEBI:29033
      label: iron(2+)
    notes: The 2017 Fe-acquisition model includes siderophore-bound Fe(III), photoreduction and Fe(II) availability;
      this term is one proposed species, not a generic or measured iron-transfer grounding.
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
    notes: Proposed Trichodesmium-to-Alteromonas provision, opposite to the helper node taxon direction. The 2017
      genome supports facultative vitamin use; the 2018 field co-expression inference does not prove exact-strain
      dependence or transfer flux.
  - preferred_term: reactive oxygen species
    term:
      id: CHEBI:26523
      label: reactive oxygen species
    notes: The compound. What the consortium does with it is the sibling biological_processes entry - ROS is involved
      in the interaction, and its detoxification is the process (#297).
  biological_processes:
  - preferred_term: reactive oxygen species detoxification
    term:
      id: GO:0098869
      label: cellular oxidant detoxification
    notes: 'Modelled as both compound and process, which is what the note this replaces described: "reactive oxygen
      species detoxification is an inferred interaction process". CHEBI:26523 is the species; GO:0098869 is what
      is done to it. Its definition - "reduces or removes the toxicity of superoxide radicals or hydrogen peroxide"
      - is the general oxidant case, chosen over GO:0141082 "symbiont-mediated detoxification of host-generated
      reactive oxygen species", which would assert a host-symbiont relation this consortium does not have, and over
      GO:0061692, which is hydrogen peroxide only. Inherits the interaction''s COMPUTATIONAL evidence: this is the
      inferred axis the source names, not a measured one (#297).'
  evidence:
  - reference: PMID:28440800
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: iron and phosphorus acquisition, vitamin B12 exchange
    explanation: Names genomic candidate axes, not measured mutualistic fitness or a demonstrated direction for
      every compound. B12 provision is proposed in the reverse taxon direction.
  - reference: PMID:28440800
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: detoxification of reactive oxygen species
    explanation: Names a candidate oxidative-stress helper function; the exact association was not subjected to
      a selective ROS-rescue test in this study.
- name: Field Host-Microbiome Diel Coexpression
  description: Sixteen field-colony metatranscriptomes over three day-night transitions in the North Pacific Subtropical
    Gyre showed coordinated host/microbiome expression, including nitrogen-, carbon-, iron- and B12-related functions.
    This is coexpression supporting candidate resource interactions, not directly demonstrated cross-feeding, a
    metabolite flux, or causation by A. macleodii helper genes. The host was field Trichodesmium, not demonstrated
    to be IMS101; Alteromonas genus transcripts must not be assigned wholesale to A. macleodii. The participant
    list credits only the record microbiome guild that this field measurement supports. Pseudocobalamin/DMB remodeling
    and host-to-microbiome provision remain interpretations.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
    notes: Trichodesmium is a photoautotrophic cyanobacterium with day-night physiological cycles.
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
    notes: Nitrogen-fixation-related expression is coordinated with microbiome transcripts; feedback on fixation
      rates is proposed, not measured by coexpression.
  evidence:
  - reference: PMID:29382945
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: significantly coordinated patterns of gene expression between host and microbiome
    explanation: Supports the measured field coexpression phenotype, not exact-strain field membership or demonstrated
      causal coupling.
  - reference: PMID:29382945
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: linked to key resources including nitrogen, carbon, and iron
    explanation: Supports functional resource annotations of correlated genes; it does not measure transfers of
      these resources.
  participating_taxa:
  - preferred_term: Trichodesmium-associated heterotrophic microbiome
    term:
      id: NCBITaxon:2
      label: Bacteria
