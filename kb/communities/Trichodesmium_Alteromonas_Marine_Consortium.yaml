ecological_interactions:
- name: Colony Substrate Colonization by Heterotrophs
  description: Trichodesmium colonies provide nutrient-rich physical substrates that are colonized by
    heterotrophic bacteria, linking diazotrophic primary production to associated heterotrophic metabolism.
  interaction_type: COMMENSALISM
  source_taxon:
    preferred_term: Trichodesmium erythraeum IMS101
