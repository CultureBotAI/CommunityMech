    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: macroscopic colonies that serve as relatively nutrient-rich substrates
    explanation: Supports a colony habitat effect that enables heterotrophic colonization.
- name: Alteromonas Helper Functions in Trichodesmium Colonies
  description: Comparative genomics suggests that Alteromonas macleodii contributes functions that may
    support Trichodesmium-associated community maintenance, including nutrient acquisition, vitamin exchange,
    catabolism of small carbon compounds, and reactive oxygen detoxification.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Alteromonas macleodii Trichodesmium associate
    term:
      id: NCBITaxon:28108
      label: Alteromonas macleodii
  target_taxon:
    preferred_term: Trichodesmium erythraeum IMS101
    term:
      id: NCBITaxon:203124
      label: Trichodesmium erythraeum IMS101
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:18367
      label: phosphate(3-)
    notes: Phosphorus acquisition was one inferred interaction axis.
  - preferred_term: iron(2+)
    term:
      id: CHEBI:29033
      label: iron(2+)
    notes: Iron acquisition was one inferred interaction axis; ferrous iron is used as a conservative
      CHEBI grounding for iron availability.
  - preferred_term: reactive oxygen species
    term:
      id: CHEBI:26523
      label: reactive oxygen species
    notes: The compound. What the consortium does with it is the sibling biological_processes
      entry - ROS is involved in the interaction, and its detoxification is the process
      (#297).
  biological_processes:
  - preferred_term: reactive oxygen species detoxification
    term:
      id: GO:0098869
      label: cellular oxidant detoxification
    notes: 'Modelled as both compound and process, which is what the note this replaces
      described: "reactive oxygen species detoxification is an inferred interaction process".
      CHEBI:26523 is the species; GO:0098869 is what is done to it. Its definition -
      "reduces or removes the toxicity of superoxide radicals or hydrogen peroxide" - is
      the general oxidant case, chosen over GO:0141082 "symbiont-mediated detoxification
      of host-generated reactive oxygen species", which would assert a host-symbiont
      relation this consortium does not have, and over GO:0061692, which is hydrogen
      peroxide only. Inherits the interaction''s COMPUTATIONAL evidence: this is the
      inferred axis the source names, not a measured one (#297).'
  evidence:
  - reference: PMID:28440800
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: iron and phosphorus acquisition, vitamin B12 exchange
    explanation: Supports inferred nutrient and vitamin exchange between Alteromonas and Trichodesmium.
  - reference: PMID:28440800
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: detoxification of reactive oxygen species
    explanation: Supports an oxidative-stress helper mechanism in the association.
