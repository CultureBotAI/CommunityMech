id: CommunityMech:000147
name: Trichodesmium-Alteromonas Marine Consortium
description: >
  A marine cyanobacterial colony consortium centered on the nitrogen-fixing photoautotroph
  Trichodesmium erythraeum IMS101 and conserved heterotrophic partners, especially
  Alteromonas macleodii. Multi-omics studies support recurring Trichodesmium-associated
  bacterial consortia in cultures and natural colonies, with potential interactions involving
  iron and phosphorus acquisition, vitamin B12 exchange, small-carbon compound catabolism,
  reactive oxygen detoxification, and coordinated diel resource cycling.
