discussions:
- discussion_id: kg-syntrophobacter-methanobacterium-partner-attribution
  prompt: >
    Which curated claims about this consortium rest on exact-pair
    (S. fumaroxidans + M. formicicum) evidence, and which were imported from
    S. fumaroxidans + M. hungatei experiments?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Propionate Oxidation and H2/Formate Production
  - ecological_interactions#Interspecies Electron Transfer and Methanogenesis
  rationale: >
    Several evidence items on this record quote doi:10.1099/00207713-48-4-1383
    (Harmsen et al. 1998), whose syntrophic coculture passage names
    *Methanospirillum hungateii*, not this record's partner *Methanobacterium
    formicicum*. Two of those items previously carried explanations asserting that
    the passage established M. formicicum as the partner; they have been corrected
    and downgraded to PARTIAL, and exact-pair support has been added from
    PMID:29611893 (Sedano-Nunez et al. 2018), which explicitly grew S. fumaroxidans
    in syntrophy with M. formicicum. The residual gap: the frequently cited
    biochemical formate-transfer and FDH/hydrogenase transcription results for this
    system were obtained with M. hungatei, so carrier apportionment ("formate is the
    dominant carrier") must NOT be curated as an exact-pair finding.

    PARTLY RESOLVED: the 2024 exact-pair perturbation study (Li et al., Water 16:3551,
    doi:10.3390/w16243551) is now ingested - its full text was supplied by a curator from
    the publisher PDF, since the journal is absent from PubMed and Europe PMC and MDPI
    blocks programmatic download. Its graded-formate results for the exact
    S. fumaroxidans-M. formicicum coculture are curated under the Exogenous Formate
    Dosage environmental factor, and its FDH downregulation result on the Propionate
    Oxidation interaction. Two cautions came out of that ingestion: (a) the paper runs
    an anaerobic-sludge system ALONGSIDE the coculture, and sludge-only results (e.g.
    Acetobacterium homoacetogenesis rising with formate dose) must not be attributed to
    this two-member consortium; (b) the dose response is non-monotonic - 30 mM recovers
    in the later stage - so it is NOT a simple ">=30 mM inhibits" threshold.

    Still open: carrier apportionment between H2 and formate for the M. formicicum pair
    specifically, which no retrieved study resolves with an isotope or
    selective-inhibition experiment.
  evidence:
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We performed a proteome analysis of S. fumaroxidans growing with propionate axenically
      with sulfate or fumarate, and in syntrophy with Methanospirillum hungatei, Methanobacterium
      formicicum or Desulfovibrio desulfuricans
    explanation: The one curated reference that studies the exact pair alongside the M. hungatei
      pairing - the basis for separating exact-pair from imported claims.
  - reference: doi:10.1099/00207713-48-4-1383
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: It oxidized propionate syntrophically in co-culture with the hydrogen- and formate-utilizing
      Methanospirillum hungateii
    explanation: The misattribution source - this passage names M. hungateii and cannot establish
      M. formicicum as the partner.
