- name: SO2 Ptac::ribADEHC Riboflavin Overproduction and BS1 Ethanol Detoxification
  description: Co-culturing Ptac::ribADEHC-overexpressing Shewanella oneidensis SO2 with P43::adh-aldH-expressing Bacillus
    subtilis BS1 in Moutai brewing wastewater combines BS1 Adh-AldH ethanol detoxification (converting inhibitory 1.8% v/v
    residual ethanol via acetaldehyde to acetate) with 13.22-fold higher secreted riboflavin (3.65 uM in SO2-BS1 vs 0.276
    uM in SO1-BS1, Figure 3b), elevating microbial fuel cell maximum power density 2.10-fold from 116.15 mW m^-2 (SO1-BS1)
    to 243.71 mW m^-2 (Figure 3c).
