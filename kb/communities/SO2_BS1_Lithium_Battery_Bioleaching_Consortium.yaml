    explanation: Quantifies the 64.1 mg L^-1 total metal leaching and 16.4 mg L^-1 day^-1 maximal leaching rate of the SO2-BS1
      consortium.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the leached concentrations of Li, Ni, Co, and Mn catalyzed by the SO2‐BS1 consortium reached 53.1,
      4.7, 1.9, and 4.4 mg L−1, respectively, achieving leaching efficiencies of 66.5%, 18.6%, 20.2%, and 33.3% (Figure 3e–h
      ).
    explanation: Quantifies element-resolved Li, Ni, Co, and Mn concentrations and leaching efficiencies for SO2-BS1.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the average leaching rates decreased from 7.222 mg L−1·day−1 to 0.921 mg L−1·day−1 for the SO1‐BS1
      consortium, from 9.867 to 0.617 mg L−1·day−1 for the SO2‐BS1 biocatalyst, and from 10.033 to 1.171 mg L−1·day−1 for
      the SO2‐BS2 consortium, as shown in Figure 4a .
    explanation: Quantifies the drop in SO2-BS1 average metal leaching rate from 9.867 mg L^-1 day^-1 (days 1-6) to 0.617
      mg L^-1 day^-1 (days 7-14).
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings indicated that the improvement of EET in the dual‐species microbial consortium through the promotion
      of riboflavin synthesis enhanced its performance in catalyzing the brewing wastewater‐mediated reduction of NCM, thereby
      further facilitating metal oxide leaching.
    explanation: Directly supports the causal relationship from riboflavin-boosted EET in SO2-BS1 to enhanced brewing-wastewater-mediated
      NCM reduction and metal oxide leaching.
