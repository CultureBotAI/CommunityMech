      (243.71 mW m^-2) in SO2-BS1.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using this engineered B. subtilis strain BS1, the residual ethanol in the brewing wastewater was oxidized to
      acetaldehyde by alcohol dehydrogenase (Adh), which was subsequently converted into acetate catalyzed by aldehyde dehydrogenase
      (AldH), constituting a dual‐enzyme cascade reaction that efficiently removed ethanol, thus eliminating ethanol inhibition
      on the EET efficiency of S. oneidensis.
    explanation: Documents the Adh-AldH ethanol-to-acetate detoxification function contributed by B. subtilis BS1.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To this end, a riboflavin biosynthesis pathway containing GTP cyclohydrolase II/ 3,4‐dihydroxy‐2‐butanone 4‐phosphate
      synthase (RibA), pyrimidine deaminase/reductase (RibD), riboflavin synthase (RibE), 6,7‐dimethyl‐8‐ribityllumazine synthase
      (RibH), and riboflavin kinase (RibC) was first overexpressed in SO1 driven by the promotor of Ptac, resulting in the
      recombinant strain SO2 (Ptac‐ribA‐ribD‐ribE‐ribH‐ribC) (Figure  3a and Table  1 ).
    explanation: Documents the construction of recombinant S. oneidensis SO2 overexpressing the Ptac-driven ribADEHC riboflavin
      biosynthesis operon to boost EET in SO2-BS1.
- name: SO2-BS1 Riboflavin-Accelerated NCM Metal Oxide Leaching and Late-Stage Rate Decline
  description: Catalyzed by the SO2-BS1 consortium in Moutai brewing wastewater with 0.2 g L^-1 spent NCM cathode black mass
    over 14 days, total dissolved metal ions reached 64.1 mg L^-1 (1.26-fold higher than SO1-BS1 at 50.7 mg L^-1, Figure 3d)
    with a maximal metal oxide leaching rate of 16.4 mg L^-1 day^-1 (1.33-fold higher than SO1-BS1 at 12.3 mg L^-1 day^-1,
    Figure S2). Element-resolved leached concentrations reached 53.1 mg L^-1 Li (66.5%), 4.7 mg L^-1 Ni (18.6%), 1.9 mg L^-1
    Co (20.2%), and 4.4 mg L^-1 Mn (33.3%) (Figure 3e-h). As leached Ni2+ and Co2+ accumulated, the average leaching rate
    of SO2-BS1 dropped from 9.867 mg L^-1 day^-1 during days 1-6 to 0.617 mg L^-1 day^-1 during days 7-14 (Figure 4a).
