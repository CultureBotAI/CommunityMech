id: CommunityMech:000523
name: SO2-BS1 Lithium-ion Battery Bioleaching Consortium
description: An intermediate two-member engineered Shewanella oneidensis MR-1 SO2 and Bacillus subtilis 168 BS1 synthetic
  division-of-labor consortium constructed by Zhang et al. 2026 to evaluate the effect of S. oneidensis riboflavin electron-shuttle
  overexpression on spent LiNixCoyMn1-x-yO2 (NCM) lithium-ion battery cathode black-mass bioleaching in Moutai brewing wastewater.
  By pairing S. oneidensis SO2 (carrying the Bacillus subtilis 168 Ptac::ribADEHC operon on pHG13) with ethanol-detoxifying
  B. subtilis BS1 (carrying P43::adh-aldH on pCE2), the SO2-BS1 consortium synthesized 3.65 uM riboflavin in brewing wastewater
  (13.22-fold higher than SO1-BS1 at 0.276 uM), achieved a maximum microbial fuel cell power density of 243.71 mW m^-2 (2.10-fold
  higher than SO1-BS1 at 116.15 mW m^-2), and leached 64.1 mg L^-1 total dissolved Li, Ni, Co, and Mn (53.1, 4.7, 1.9, and
  4.4 mg L^-1; leaching efficiencies 66.5%, 18.6%, 20.2%, and 33.3%; maximal leaching rate 16.4 mg L^-1 day^-1) over 14 days
  before accumulated Ni2+ and Co2+ cytotoxicity lowered the average leaching rate from 9.867 to 0.617 mg L^-1 day^-1 between
  days 1-6 and days 7-14 (PMID:42733304).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Enhance extracellular electron transfer and spent NCM cathode metal oxide leaching beyond the first-generation
    SO1-BS1 consortium by overexpressing the B. subtilis 168 Ptac::ribADEHC riboflavin biosynthesis operon in S. oneidensis
    MR-1 (strain SO2) while retaining B. subtilis BS1 Adh-AldH ethanol detoxification.
  assembly_strategy: Combine engineered S. oneidensis MR-1 SO2 (SO1 carrying Ptac::ribADEHC on pHG13, Cmr) with engineered
    B. subtilis 168 BS1 (BS0 carrying P43::adh from Saccharomyces cerevisiae BY4341 and aldH from Issatchenkia terricola XJ-2
    on pCE2, Cmr).
  inoculation_strategy: Grow SO2 and BS1 separately overnight in LB medium with 0.2 g L^-1 chloramphenicol, inoculate each
    at 1% (v/v) into Moutai brewing wastewater with 0.5 mM IPTG, transfer to anaerobic bottles with 0.2 g L^-1 spent NCM black
    mass, and ferment anaerobically at 30 degrees C for 14 days.
  perturbation_design: 'Benchmark SO2-BS1 (3.65 uM riboflavin, 243.71 mW m^-2, 64.1 mg L^-1 total leached metals, 16.4 mg
    L^-1 day^-1 maximal rate) against predecessor SO1-BS1 (0.276 uM riboflavin, 116.15 mW m^-2, 50.7 mg L^-1, 12.3 mg L^-1
    day^-1) and dual-partner riboflavin-overproducing successor SO2-BS2 (46.00 uM riboflavin, 347.29 mW m^-2, 69.6 mg L^-1,
    16.2 mg L^-1 day^-1), and compare early (days 1-6: 9.867 mg L^-1 day^-1) versus late (days 7-14: 0.617 mg L^-1 day^-1)
    average leaching rates.'
  measurement_endpoints:
  - riboflavin concentration in brewing wastewater (3.65 uM)
  - microbial fuel cell maximum power density (243.71 mW m^-2)
  - total and element-resolved dissolved Li, Ni, Co, and Mn concentrations (64.1 mg L^-1 total)
  - element-specific NCM leaching efficiencies (66.5% Li, 18.6% Ni, 20.2% Co, 33.3% Mn)
  - maximal (16.4 mg L^-1 day^-1) and stage-specific average metal leaching rates (days 1-6 vs days 7-14)
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When fed with the brewing wastewater, riboflavin synthesized by the SO2‐BS1 consortium reached 3.65 µm, 13.22‐fold
      higher than that synthesized by the SO1‐BS1 consortium (0.276 µm, Figure 3b ). Correspondingly, the maximum power density
      achieved by the SO2‐BS1 consortium rose to 243.71 mW m−2, 2.10‐fold increase relative to the SO1‐BS1 consortium (116.15
      mW m− 2, Figure 3c ), demonstrating an improved EET rate of the SO1‐BS1 consortium via enhanced riboflavin synthesis.
    explanation: Defines the SO2-BS1 consortium and quantifies its 3.65 uM riboflavin synthesis (13.22-fold over SO1-BS1)
      and 243.71 mW m^-2 maximum power density (2.10-fold over SO1-BS1).
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the leached concentrations of Li, Ni, Co, and Mn catalyzed by the SO2‐BS1 consortium reached 53.1,
      4.7, 1.9, and 4.4 mg L−1, respectively, achieving leaching efficiencies of 66.5%, 18.6%, 20.2%, and 33.3% (Figure 3e–h
      ).
    explanation: Quantifies the element-resolved Li, Ni, Co, and Mn leaching concentrations and efficiencies achieved by the
      SO2-BS1 consortium.
