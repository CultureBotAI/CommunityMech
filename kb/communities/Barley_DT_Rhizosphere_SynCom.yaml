id: CommunityMech:000428
name: Barley DT Rhizosphere SynCom
description: >
  A defined sixteen-strain drought-tolerant bacterial synthetic community
  assembled from barley-rhizosphere isolates collected at the Global Change
  Experimental Facility in Bad Lauchstadt. Rigerte et al. selected isolates
  with overlapping 16S rDNA sequences to drought- or future-climate-associated
  amplicon sequence variants, cultured the barley isolate set on YME agar,
  combined equal proportions of the sixteen single-strain suspensions, and
  applied the Barley DT-SynCom to barley seedlings before Blumeria graminis
  f. sp. hordei challenge and pre-challenge rhizosphere multi-omics assays.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >
    Build a barley-rhizosphere Drought-Tolerant Synthetic Community
    (DT-SynCom) from PEG-tolerant isolates matching climate- and
    drought-responsive rhizosphere ASVs, then test whether the root inoculant
    triggers systemic resistance against barley powdery mildew without major
    disruption of the native barley rhizosphere.
  assembly_strategy: >
    Collect rhizobacteria from barley cultivar Antonella grown at the GCEF
    field station, select sixteen PEG-tolerant barley isolates whose 16S rDNA
    sequences match drought- or future-climate-associated ASVs, cultivate each
    isolate for three days on YME agar, and combine the sixteen barley strains
    in equal proportions in 10 mM MgCl2.
  inoculation_strategy: >
    Suspend the barley equal-proportion SynCom in 10 mM MgCl2, incubate
    surface-sterilized germinated barley seeds in the inoculum for two hours,
    and grow the plants in standard potting soil before sampling rhizospheres
    and infecting leaves with Blumeria graminis f. sp. hordei.
  perturbation_design: >
    Compare MgCl2 mock, Pseudomonas simiae WCS417r positive-control,
    wheat-origin SynCom, and barley-origin SynCom treatments on barley
    seedlings before and after powdery mildew pathogen challenge.
  measurement_endpoints:
  - Blumeria graminis f. sp. hordei fluorescence intensity on barley leaves
  - pre-challenge barley leaf transcriptomes
  - pre-challenge rhizosphere 16S rRNA amplicon profiles
  - pre-challenge barley rhizosphere metatranscriptomes
  - OTU matches to inoculated SynCom strain 16S rDNA sequences
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      From this group, sixteen PEG-tolerant strains that showed similar growth
      on PEG0 and PEG0.5 were selected to assemble the Drought-Tolerant
      Synthetic Community (DT-SynCom).
    explanation: >
      Supports the drought-tolerance screen used to select strains for the
      DT-SynComs.
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Each SynCom was constructed by combining equal volumes of single-strain
      cultures as described in the following section.
    explanation: Supports the equal-volume construction of each DT-SynCom.
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      After four days, the seeds were divided into four groups and inoculated by
      means of a two hours long incubation with one of the following treatments:
      the wheat SynCom, the barley SynCom, or WCS417r
    explanation: >
      Supports the barley-seedling inoculation design and the two SynCom
      treatments.
