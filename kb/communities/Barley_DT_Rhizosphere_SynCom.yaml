ecological_interactions:
- name: Barley DT-SynCom powdery mildew resistance
  description: >
    Barley seedlings root-inoculated with the barley-origin DT-SynCom showed
    lower Blumeria graminis f. sp. hordei DAF fluorescence intensity than
    mock-treated controls after pathogen challenge, consistent with
    SynCom-induced systemic resistance under the assay conditions.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Mean fluorescence was reduced by 50.4% in the barley SynCom treatment,
      43.3% in the wheat SynCom treatment, and 34.9% in the WCS417r treatment,
      relative to the mock treatment.
    explanation: Quantifies the barley and wheat SynCom disease-protection phenotypes.
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      These results demonstrate that both the barley and wheat SynComs induce
      ISR in a manner similar to that of the ISR-eliciting bacterium WCS417r.
    explanation: Supports the systemic-resistance interpretation for both SynComs.
- name: Barley DT-SynCom rhizosphere persistence
  description: >
    OTUs matching the 16S rDNA sequences of inoculated SynCom strains at
    least 99% identity and coverage were detected in barley rhizosphere samples
    at harvest, although the assay could not confirm strain-level identity.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      OTUs with ≥ 99% sequence identity to the 16S rRNA gene sequences of the
      inoculated SynCom strains were detected in rhizosphere samples at harvest
    explanation: >
      Supports post-inoculation detection of OTUs matching SynCom 16S sequences
      in the rhizosphere.
environmental_factors:
- name: GCEF barley isolate source
  value: Barley cultivar Antonella rhizosphere
  description: >
    Barley DT-SynCom members were selected from isolates recovered from the
    rhizosphere of barley cultivar Antonella grown in organic or conventional
    GCEF plots exposed to ambient or future-climate treatments.
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The strains were isolated from the rhizospheres of the barley cultivar
      “Antonella” and the wheat cultivar “RGT Reform”
    explanation: Identifies the barley and wheat rhizosphere cultivar sources.
- name: Equal-proportion barley strain mixture
  value: 16 strains in 10 mM MgCl2
  description: >
    Sixteen barley isolate suspensions were mixed in equal proportions as a
    separate barley-origin synthetic community.
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The barley strains were combined in equal proportions into a synthetic
      community and the wheat strains into a separate community
    explanation: Supports separate equal-proportion assembly of the barley and wheat SynComs.
- name: Barley powdery mildew challenge
  value: Blumeria graminis f. sp. hordei
  description: >
    Three-week-old SynCom-inoculated barley seedlings were challenged with Bgh,
    grown for one week, and evaluated by DAF-based fungal-structure
    fluorescence.
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Plants were then grown for one week as described before to allow fungal
      structures to develop, after which leaves were harvested and infection
      intensity was evaluated by fluorescence-based quantification of fungal
      structures following DAF staining
    explanation: Supports the post-infection DAF readout for powdery mildew growth.
growth_media:
- name: Pikovskaya agar rhizobacteria isolation
  temperature: 25
  temperature_unit: C
  incubation_time: 3
  incubation_time_unit: weeks
  vessel_type: agar plate
  preparation_notes: >
    Used to isolate phosphate-solubilizing barley and wheat rhizobacteria from
    GCEF rhizosphere soil before DT-SynCom strain selection.
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      a suspension was inoculated on Pikovskaya’s (1948) agar medium. Plates
      were then incubated for three weeks at 25 °C and colonies showing
      phosphate solubilization (observed as clear halos around them) were
      purified.
    explanation: >
      Supports the initial Pikovskaya agar isolation medium and 25 C,
      three-week incubation condition.
- name: YME agar DT-SynCom preparation
  temperature: 25
  temperature_unit: C
  incubation_time: 3
  incubation_time_unit: days
  vessel_type: agar plate
  preparation_notes: >
    The barley and wheat SynCom strains were cultivated on yeast malt extract
    agar before resuspension, OD600 normalization, pelleting, and
    equal-proportion mixing.
  evidence:
  - reference: PMID:42453107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Bacterial strains from the rhizosphere of barley and wheat were cultivated
      for three days at 25 °C on yeast malt extract (YME) agar.
    explanation: Supports the final pre-inoculum agar medium and incubation condition.
