id: CommunityMech:000461
name: Pseudomonas-Acidovorax Aniline-Degradation SynCom
description: >-
  A two-member Pseudomonas sp./Acidovorax sp. synthetic microbial consortium,
  RF-PH, assembled from the aniline-degrading strains RF and PH isolated from
  heavily aniline-contaminated soil in a Dalian chemical industrial park. Pan et
  al. 2026 identified Pseudomonas and Acidovorax isolates by 16S rRNA sequencing,
  optimized their inoculation ratio in mineral-salts medium containing aniline,
  and designated a 3:1 RF:PH mixture as RF-PH after the consortium outperformed
  either monoculture in aniline shake-flask assays.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >-
    Assemble a two-strain synthetic bacterial consortium for rapid aniline
    degradation using isolates recovered from aniline-contaminated industrial
    soil.
  assembly_strategy: >-
    Screen heavily contaminated soil on R2A medium supplemented with aniline,
    identify the two aniline-degrading isolates as Pseudomonas sp. RF and
    Acidovorax sp. PH by 16S rRNA sequencing, and optimize their mixture in
    mineral-salts medium containing 500 mg/L aniline.
  inoculation_strategy: >-
    Resuspend late-log LB cultures of both isolates in sterile water at OD600
    2.0 and combine them in mineral-salts medium at the RF:PH biomass ratio
    selected by an orthogonal design.
  perturbation_design: >-
    Compare multiple RF:PH inoculation ratios in shake flasks and benchmark the
    optimized 3:1 RF-PH consortium against the two monocultures at 300, 500, and
    1000 mg/L aniline.
  measurement_endpoints:
  - aniline degradation rate
  - Pseudomonas sp. RF monoculture degradation
  - Acidovorax sp. PH monoculture degradation
  - consortium-to-monoculture degradation improvement
  notes: >-
    The study proposed cooperative and complementary behavior between RF and PH,
    but did not identify a specific exchanged metabolite or assign a directional
    pairwise cross-feeding step.
  evidence:
  - reference: PMID:41900437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This study aimed to construct a highly efficient aniline-degrading
      synthetic microbial consortium guided by ecological niche information from
      contaminated soil.
    explanation: >-
      Supports the overall engineered bioremediation objective of the RF-PH
      SynCom.
  - reference: PMID:41900437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through orthogonal experiments to optimize the inoculation ratio, a
      synthetic consortium, RF-PH, composed of the two strains at a 3:1 ratio,
      was constructed.
    explanation: >-
      Supports construction of the two-strain RF-PH consortium and the final
      RF:PH ratio.
