ecological_interactions:
- name: RF-PH enhanced aniline degradation
  description: >-
    The optimized 3:1 RF-PH consortium degraded 500 mg/L aniline more rapidly
    within 12 h than either single-strain culture, and also improved 12 h
    removal at 1000 mg/L aniline.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. RF
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Acidovorax sp. PH
    term:
      id: NCBITaxon:12916
      label: Acidovorax
  evidence:
  - reference: PMID:41900437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For 500 mg·L−1 aniline, the degradation rate reached 91.28% within 12 h,
      representing an increase of 11.33% and 17.02% compared to the degradation
      rates achieved by strain RF or strain PH alone, respectively.
    explanation: >-
      Supports the community-level enhancement of aniline degradation by RF-PH
      relative to either monoculture.
  - reference: PMID:41900437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For 1000 mg·L−1 aniline, the degradation rate reached 73.06% within 12 h,
      representing an increase of 18.25% and 28.04% compared to the degradation
      by strain RF or strain PH alone, respectively.
    explanation: >-
      Supports the RF-PH consortium's enhanced 1000 mg/L aniline degradation
      relative to either monoculture.
environmental_factors:
- name: RF-PH inoculation ratio
  value: RF:PH = 3:1
  unit: biomass ratio
  description: >-
    Orthogonal ratio screening selected a 3:1 Pseudomonas sp. RF to Acidovorax
    sp. PH biomass ratio as the final RF-PH consortium.
  evidence:
  - reference: PMID:41900437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The maximum aniline degradation rate obtained in the experiments was
      93.28%, from Experiment No. 2, where the inoculation ratio of strains RF
      to PH was 3:1.
    explanation: Supports the selected 3:1 RF:PH ratio.
- name: aniline assay substrate
  value: aniline
  unit: 500 mg/L
  description: >-
    The RF-PH consortium construction assay used mineral salt medium with 500
    mg/L aniline as the pollutant substrate.
  evidence:
  - reference: PMID:41900437
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In 100 mL of mineral salt medium containing 500 mg·L−1 aniline, bacterial
      resuspensions were added according to the ratios outlined, followed by
      shake-flask cultivation at 150 r·min−1 for 3 days.
    explanation: Supports the aniline concentration and shake-flask setup.
