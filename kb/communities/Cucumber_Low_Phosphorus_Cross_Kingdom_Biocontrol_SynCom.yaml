environmental_factors:
- name: Soil Phosphorus Availability and Low-P Rhizosphere Metabolites
  value: Low phosphorus (500 uM Pi) vs. high phosphorus (2 mM Pi); 100 uM LPDRMs
  description: Moderately low phosphorus availability induces root exudation of succinic acid, azelaic acid, threonic acid,
    and methionine that recruit and sustain the cross-kingdom biocontrol consortium.
  evidence:
  - reference: PMID:41882811
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Metabolomics identified low phosphorus distinguished rhizosphere metabolites (succinic acid, azelaic acid, threonic
      acid, and methionine) that recruit beneficial taxa, whereas high phosphorus distinguished rhizosphere metabolites promoted
      pathogen growth.
    explanation: Documents the low-phosphorus metabolite suite driving beneficial community recruitment.
ecological_interactions:
- name: Metabolite-Recruited Cross-Kingdom Pathogen Suppression of Fusarium oxysporum
  description: Combined with low-phosphorus distinguished rhizosphere metabolites (succinic acid, azelaic acid, threonic acid,
    and methionine), the 19-strain cross-kingdom SynCom (Bacillus, Devosia, Sphingopyxis, Cupriavidus, Aspergillus, and Amesomyces)
    reduces Fusarium oxysporum f. sp. cucumerinum abundance by 85% and suppresses cucumber wilt under high-phosphorus conditions.
  interaction_type: MUTUALISM
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:26020
      label: phosphate
  - preferred_term: succinic acid
    term:
      id: CHEBI:15741
      label: succinic acid
  - preferred_term: methionine
    term:
      id: CHEBI:16811
      label: methionine
  biological_processes:
  - preferred_term: phosphate-containing compound metabolic process
    term:
      id: GO:0006796
      label: phosphate-containing compound metabolic process
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:41882811
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: To validate the functional role of microbes-metabolites interaction, we constructed a synthetic microbial community
      composed of the signature taxa from the low phosphorus microbiota, which, when combined with low phosphorus metabolites,
      reduced pathogen abundance by 85% and conferred disease suppression under high phosphorus conditions.
    explanation: Validates 85% pathogen reduction and Fusarium wilt suppression by the cross-kingdom SynCom plus low-P metabolites.
  scope: COMMUNITY_LEVEL
- name: Cross-Kingdom Devosia and Amesomyces Biofilm and Colony Mutualism
  description: Devosia (strain B2) and Amesomyces (reported as Amesia sp. F7) engage in direct cross-kingdom mutual promotion,
    concurrently enhancing bacterial biofilm formation and fungal colony diameter in co-culture.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Devosia
    term:
      id: NCBITaxon:46913
      label: Devosia
  target_taxon:
    preferred_term: Amesomyces
    term:
      id: NCBITaxon:1934349
      label: Amesomyces
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41882811
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '(i) Mutual promotion (reflected by concurrent enhancement of bacterial biofilm formation and fungal colony diameter)
      was observed between specific fungal-bacterial pairs, including: Amesia sp. F7 & Devosia sp. B2; Amesia sp. F7 & Bacillus
      sp. B10; Aspergillus sp. F5 and Bacillus sp. B18.'
    explanation: Directly demonstrates mutualistic enhancement of bacterial biofilm formation and fungal colony growth between
      Amesia (Amesomyces) sp. F7 and Devosia sp. B2.
  scope: PAIRWISE
- name: Unidirectional Cross-Kingdom Facilitation of Cupriavidus by Aspergillus
  description: Aspergillus (strains F3 and F5) unidirectionally facilitates the growth and biofilm formation of Cupriavidus
    (strain B12) in cross-kingdom co-culture assays.
  interaction_type: COLONIZATION_FACILITATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Aspergillus
    term:
      id: NCBITaxon:5052
      label: Aspergillus
  target_taxon:
    preferred_term: Cupriavidus
    term:
      id: NCBITaxon:106589
      label: Cupriavidus
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41882811
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: (ii) Unidirectional facilitation (where one partner enhanced the growth of the other without a reciprocal benefit)
      characterized other interactions, including Aspergillus sp. F4 & Bacillus sp. B10; Aspergillus sp. F3 & Cupriavidus
      sp. B12; Aspergillus sp. F5 & Cupriavidus sp. B12).
    explanation: Directly documents unidirectional cross-kingdom facilitation in Aspergillus sp. F3 & Cupriavidus sp. B12
      and Aspergillus sp. F5 & Cupriavidus sp. B12 pairs.
