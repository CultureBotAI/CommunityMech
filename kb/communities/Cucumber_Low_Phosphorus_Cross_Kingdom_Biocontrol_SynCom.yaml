  description: Stimulated by low-phosphorus rhizosphere metabolites (succinic acid and methionine), Bacillus and Aspergillus
    within the cross-kingdom SynCom cooperate in phosphate solubilization and suppress the wilt pathogen Fusarium oxysporum
    f. sp. cucumerinum by 85%.
