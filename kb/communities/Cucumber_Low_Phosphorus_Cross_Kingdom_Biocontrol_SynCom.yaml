environmental_factors:
- name: Soil Phosphorus Availability and Low-P Rhizosphere Metabolites
  value: Low phosphorus (500 uM Pi) vs. high phosphorus (2 mM Pi); 100 uM LPDRMs
  description: Moderately low phosphorus availability induces root exudation of succinic acid, azelaic acid, threonic acid,
    and methionine that recruit and sustain the cross-kingdom biocontrol consortium.
  evidence:
  - reference: PMID:41882811
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Metabolomics identified low phosphorus distinguished rhizosphere metabolites (succinic acid, azelaic acid, threonic
      acid, and methionine) that recruit beneficial taxa, whereas high phosphorus distinguished rhizosphere metabolites promoted
      pathogen growth.
    explanation: Documents the low-phosphorus metabolite suite driving beneficial community recruitment.
