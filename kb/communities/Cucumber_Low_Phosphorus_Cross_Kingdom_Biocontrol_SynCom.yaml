id: CommunityMech:000478
name: Cucumber Low-Phosphorus Cross-Kingdom Bacterial-Fungal Biocontrol Synthetic Community
description: 'Cross-kingdom synthetic microbial community (13 bacterial and 6 fungal strains) assembled from signature taxa
  enriched in the low-phosphorus rhizosphere of cucumber (Cucumis sativus): bacterial genera Bacillus, Cupriavidus, Sphingopyxis,
  and Devosia together with fungal genera Aspergillus and Amesomyces (reported as Amesia). Recruited and sustained by low-phosphorus
  distinguished rhizosphere metabolites (succinic acid, azelaic acid, threonic acid, and methionine), the cross-kingdom SynCom
  engages in mutualistic biofilm and hyphal facilitation and reduces Fusarium oxysporum f. sp. cucumerinum abundance by 85-99%,
  suppressing cucumber Fusarium wilt even under high-phosphorus conditions.'
