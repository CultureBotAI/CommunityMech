discussions:
- discussion_id: b12-transfer-route
  prompt: >
    Does P. parvum acquire bacterial B12 primarily from passive extracellular
    release, bacterial lysis, prophage- or phage-mediated release, or
    bacterivory of the SynCom partners?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#B12-limited holobiont mutualism
  - ecological_interactions#Cobalamin biosynthesis by B12-producing SynCom members
  rationale: >
    The source supports bacterial B12 production and auxotrophic acquisition
    but explicitly leaves the cellular route of vitamin release and transfer
    unresolved.
  proposed_experiments:
  - experiment_id: b12_exporter_mutants
    name: Test B12 exporter and lysis routes in producing strains
    description: >
      Knock out or silence candidate B12 export, prophage, or lysis mechanisms
      in Marinovum algicola, Roseobacter sp., and Halomonas sp., then ask
      whether mutant producers still rescue B12-limited P. parvum.
    approach: defined-coculture growth assay with targeted bacterial genetics
    model_systems:
    - P. parvum CCAP 646/6 plus individual B12-producing isolates
    - P. parvum CCAP 646/6 plus the 15-strain SynCom
    perturbations:
    - candidate transporter inactivation
    - prophage or lysis inhibition
    - exogenous B12 rescue
    readouts:
    - dissolved and intracellular B12 pools
    - P. parvum growth recovery
    - SynCom B12 transporter expression
    decision_criterion: >
      Loss of algal rescue in a specific mutant background, restored by
      exogenous B12, would prioritize that release route.
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: full_text
    snippet: >
      The precise mechanism of B12 transfer remains unresolved. Not only are
      the potential acquisition routes unclear, but the identity of bacterial
      exporters mediating vitamin release is also unknown.
    explanation: >
      States the open mechanistic question around B12 export and acquisition.
  posed_by: codex
  posed_date: 2026-09-15
