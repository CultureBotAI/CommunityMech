ecological_interactions:
- name: B12-limited holobiont mutualism
  description: >
    Under vitamin B12 limitation, the bacterial SynCom rescued P. parvum growth
    and benefited from the algal coculture, indicating a nutrient-contextual
    mutualism rather than constitutive growth stimulation under every nutrient
    stress.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Cobalamin biosynthesis by B12-producing SynCom members
    description: >
      The B12-limited rescue corresponded to B12-producing bacteria
      upregulating the cobalamin biosynthetic pathway under B12 limitation.
  - target: Auxotrophic SynCom B12 acquisition
    description: >
      B12 exchanged in the holobiont also fed non-producing bacterial partners
      that induced B12 transport and B12-dependent functions.
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      B12-limitation triggered a strong mutualistic interaction in which the
      SynCom enabled a three-fold increase in algal biomass
    explanation: Supports the nutrient-contextual mutualism and algal growth rescue.
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      bacterial B12 production alleviated the limitation
    explanation: Links the B12-limited growth rescue to bacterial B12 production.
- name: Cobalamin biosynthesis by B12-producing SynCom members
  description: >
    Metabarcoding and metatranscriptomics linked B12-limited rescue to
    enrichment of B12-producing taxa and cobalamin-biosynthesis upregulation by
    Marinovum algicola, Roseobacter sp., and Halomonas sp.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Marinovum algicola 19-037
    term:
      id: NCBITaxon:42444
      label: Marinovum algicola
  - preferred_term: Roseobacter sp. 09-029
    term:
      id: NCBITaxon:2433
      label: Roseobacter
  - preferred_term: Halomonas sp. 19-001
    term:
      id: NCBITaxon:2745
      label: Halomonas
  metabolites:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  biological_processes:
  - preferred_term: cobalamin biosynthetic process
    term:
      id: GO:0009236
      label: cobalamin biosynthetic process
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      B12-producers (Marinovum algicola, Roseobacter sp., Halomonas sp.)
      upregulated cobalamin biosynthesis exclusively under B12-limitation
    explanation: >
      Supports B12-limited cobalamin pathway upregulation in three producing
      bacterial members.
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Enrichment of B12-producing taxa (i.e. Marinovum algicola, Roseobacter
      sp., Halomonas sp.) under B12-lim coincided with the upregulation of
      cobalamin biosynthesis pathways
    explanation: >
      Supports concurrent enrichment and cobalamin-pathway activation by the
      B12-producing bacterial subset.
- name: Auxotrophic SynCom B12 acquisition
  description: >
    Several non-producer strains lacked B12 biosynthesis but expressed
    B12-dependent functions and strongly induced cobalamin transporters under
    B12 limitation, implying that the released vitamin was competed for by
    P. parvum and bacterial auxotrophs.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Cyclobacterium sp. 09-022
    term:
      id: NCBITaxon:68288
      label: Cyclobacterium
  - preferred_term: Marivita cryptomonadis 10-255
    term:
      id: NCBITaxon:505252
      label: Marivita cryptomonadis
  - preferred_term: Marinobacter sp. 10-113
    term:
      id: NCBITaxon:2742
      label: Marinobacter
  - preferred_term: Pseudomonas stutzeri 23-003
    term:
      id: NCBITaxon:316
      label: Stutzerimonas stutzeri
  metabolites:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      several B12-auxotrophic taxa induced B12-transport and B12-requiring
      enzymes, indicating active vitamin exchange within the holobiont
    explanation: >
      Supports B12 uptake and B12-dependent activity by non-producing bacterial
      partners.
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      non-B12 producers Cyclobacterium qasimii, Marivita cryptomonadis,
      Marinobacter sp., and Pseudomonas stutzeri, which also upregulated
      B12-dependent genes, strongly induced most of their B12 transporters
      under B12-lim conditions
    explanation: >
      Names the non-producing B12-dependent strains that induced B12
      transporters under B12 limitation.
- name: Algal organic-matter support of heterotrophic bacteria
  description: >
    The heterotrophic SynCom depended on algal organic matter from P. parvum,
    while those bacterial partners synthesized and mobilized B12 under nutrient
    stress, completing a reciprocal exchange between the algal host and
    bacterial community.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Prymnesium parvum CCAP 646/6
    term:
      id: NCBITaxon:97485
      label: Prymnesium parvum
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: B12-limited holobiont mutualism
    description: >
      Bacterial dependence on algal organic matter made B12 biosynthesis part
      of a reciprocal holobiont interaction rather than one-way vitamin rescue.
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Heterotrophic bacteria dependent on algal organic matter synthesize and
      mobilize B12 under nutrient stress, and both partners utilize it.
    explanation: >
      Supports reciprocal carbon-for-vitamin coupling between P. parvum and
      heterotrophic bacterial members.
environmental_factors:
- name: vitamin B12 limitation
  value: 7.4 x 10^-6 uM vitamin B12
  description: >
    B12 was supplied at a limiting concentration to reveal algal vitamin
    auxotrophy and the SynCom's ability to alleviate B12 limitation.
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      vitamin B12-limited (B12-lim; B12 adjusted to 7.4 × 10−6 μM) conditions
    explanation: Supports the B12-limited treatment concentration.
- name: nitrogen limitation
  value: 62 uM N
  description: Nitrogen was reduced in the L1 medium to impose N-limited growth.
  evidence:
