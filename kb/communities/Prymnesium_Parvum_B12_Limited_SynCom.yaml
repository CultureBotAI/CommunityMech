id: CommunityMech:000381
name: Prymnesium parvum B12-Limited SynCom
description: >
  A defined 16-member marine algal-bacterial holobiont in which
  Prymnesium parvum CCAP 646/6 was cocultured in L1 medium with a
  15-strain synthetic bacterial community and monitored under nitrogen,
  phosphorus, or vitamin B12 limitation. Patron et al. (2026) inoculated all
  SynCom bacteria in equal proportions and compared photobioreactor cultures
  with and without the SynCom for 14 days. Nitrogen and phosphorus limitation
  did not reveal a major growth benefit from the SynCom, whereas B12 limitation
  triggered a mutualistic state in which bacterial cobalamin provisioning
  rescued algal growth, B12-producing bacteria upregulated cobalamin
  biosynthesis, and B12-auxotrophic bacteria induced vitamin transport and
  B12-dependent enzymes.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: >
    Test how controlled nitrogen, phosphorus, and vitamin B12 limitation
    restructure physiology, metabolism, transcription, and B12-mediated
    exchange in a synthetic P. parvum holobiont.
  assembly_strategy: >
    Combine fifteen ecologically diverse marine bacterial strains with
    P. parvum CCAP 646/6 to create a defined algal-bacterial SynCom containing
    B12 producers, non-producers, and diazotrophs.
  inoculation_strategy: >
    Inoculate P. parvum at 1 x 10^5 cells/mL and add the 15-strain bacterial
    SynCom at 1 x 10^5 total bacterial cells/mL, with every bacterial strain
    initially represented equally.
  perturbation_design: >
    Acclimate and grow the holobiont in modified L1 medium under N-limited,
    P-limited, or B12-limited conditions, with four SynCom biological
    replicates and three axenic controls monitored for 14 days.
  measurement_endpoints:
  - algal cell density and particulate organic carbon
  - bacterial cell density
  - dissolved nitrogen and phosphorus
  - prymnesin toxin production
  - intracellular and extracellular metabolomics
  - 16S rRNA metabarcoding
  - P. parvum RNA-seq and bacterial metatranscriptomics
  evidence:
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Fifteen bacterial strains were selected for their ecological relevance
      and functional diversity, including vitamin B12 production and
      diazotrophy
    explanation: Supports the SynCom strain-selection logic.
  - reference: PMID:42549325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      All the strains were inoculated in equal proportional representation
      within the SynCom.
    explanation: Supports equal representation of bacterial strains in the inoculum.
environment_term:
  preferred_term: laboratory marine algal-bacterial SynCom
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >
    P. parvum and its 15 bacterial partners were assembled and compared in
    defined photobioreactors supplied with nutrient-limited L1 medium and run
    under continuous light at 20 C and pH 8.2.
