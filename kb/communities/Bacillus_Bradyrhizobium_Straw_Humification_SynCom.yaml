ecological_interactions:
- name: Straw Humification Cross-Feeding
  description: The source explicitly reports reciprocal growth support by cross-feeding between the two SynCom members.
    The public supplement supports activity and metabolite-association endpoints, but the full main-text rescue/transfer
    methods were not reviewed; no particular exchanged metabolite or flux is certified here.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus siamensis
    term:
      id: NCBITaxon:659243
      label: Bacillus siamensis
  - preferred_term: Bradyrhizobium japonicum
    term:
      id: NCBITaxon:375
      label: Bradyrhizobium japonicum
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  downstream:
  - target: Straw-Degrading Enzyme Stimulation
    description: PARTIAL - the source attributes higher measured enzyme activities to cross-feeding-supported growth.
      The supplement confirms activity endpoints, but the unread main methods limit verification of selective exchange
      mediation.
  evidence:
  - reference: PMID:41264879
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By cross-feeding, SynCom members enable each other to grow, increase the activities of key enzymes
      (carboxymethyl cellulase, xylanase, lignin peroxidase, and nitrogenase), and thereby promote maize straw humification
    explanation: Supports cross-feeding between the two members and the enzyme activities that couple the interaction
      to straw humification.
- name: Straw-Degrading Enzyme Stimulation
  description: The SynCom increased measured carboxymethyl-cellulase, xylanase, lignin-peroxidase and nitrogenase
    activities in the laboratory assay. Nitrogenase was assayed by acetylene reduction. These are activity endpoints,
    not evidence that each enzyme is necessary or a member-resolved nitrogen-transfer flux.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus siamensis
    term:
      id: NCBITaxon:659243
      label: Bacillus siamensis
  - preferred_term: Bradyrhizobium japonicum
    term:
      id: NCBITaxon:375
      label: Bradyrhizobium japonicum
  metabolites:
  - preferred_term: lignocellulose
    term:
      id: CHEBI:180683
      label: lignocellulose
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  downstream:
  - target: Maize Straw Humification and Soil Organic Carbon Improvement
    description: PARTIAL - the source proposes that enhanced activities promote straw humification and downstream
      soil-carbon accumulation. Broth enzyme assays and field SOC/necromass outcomes are distinct measurements;
      selective enzyme mediation of the field effect was not verified from the accessible material.
  evidence:
  - reference: PMID:41264879
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increase the activities of key enzymes (carboxymethyl cellulase, xylanase, lignin peroxidase, and nitrogenase),
      and thereby promote maize straw humification
    explanation: Supports reported increases in enzyme activities and the proposed humification mechanism, not selective
      enzyme necessity.
- name: Maize Straw Humification and Soil Organic Carbon Improvement
  description: SynCom inoculation promoted straw humification and increased field soil organic carbon and bacterial
    necromass. Enhanced microbial-carbon-pump turnover is the source's mechanistic interpretation, not a selectively
    traced route verified here; not every measured carbon fraction or field enzyme increased.
  scope: COMMUNITY_LEVEL
