ecological_interactions:
- name: Straw Humification Cross-Feeding
  description: >
    B. siamensis B and B. japonicum G cross-feed in the two-member SynCom,
    enabling each other to grow.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus siamensis
    term:
      id: NCBITaxon:659243
      label: Bacillus siamensis
  - preferred_term: Bradyrhizobium japonicum
    term:
      id: NCBITaxon:375
      label: Bradyrhizobium japonicum
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  downstream:
  - target: Straw-Degrading Enzyme Stimulation
    description: >
      Cross-feeding by the two SynCom members increases cellulase, xylanase,
      lignin-peroxidase, and nitrogenase activities.
  evidence:
  - reference: PMID:41264879
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By cross-feeding, SynCom members enable each other to grow, increase the
      activities of key enzymes (carboxymethyl cellulase, xylanase, lignin peroxidase,
      and nitrogenase), and thereby promote maize straw humification
    explanation: Supports cross-feeding between the two members and the enzyme
      activities that couple the interaction to straw humification.
- name: Straw-Degrading Enzyme Stimulation
  description: >
    The cross-feeding Bacillus-Bradyrhizobium SynCom increases key
    carboxymethyl cellulase, xylanase, lignin peroxidase, and nitrogenase
    activities needed to decompose maize straw and supply nitrogen.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
