    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increase the activities of key enzymes (carboxymethyl cellulase, xylanase, lignin
      peroxidase, and nitrogenase), and thereby promote maize straw humification
    explanation: Supports increased straw-degrading enzyme activities as the
      mechanism linking SynCom cross-feeding to maize-straw humification.
- name: Maize Straw Humification and Soil Organic Carbon Improvement
  description: >
    SynCom inoculation promoted maize-straw humification and improved soil
    organic carbon in field straw-return experiments by enhancing the in vivo
    turnover pathway of the microbial carbon pump.
  scope: COMMUNITY_LEVEL
