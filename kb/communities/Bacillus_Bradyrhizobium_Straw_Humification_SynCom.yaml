    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  evidence:
  - reference: PMID:41264879
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation enhanced the in vivo turnover pathway of the microbial carbon pump, thereby promoting
      straw humification and improving SOC
