id: CommunityMech:000512
name: Trichococcus-Syntrophomonas-Methanobacterium Butyrate Coculture
description: A defined three-member anaerobic syntrophic triculture composed of the fermentative bacterium Trichococcus flocculiformis
  strain ES5 (DSM 23957), the butyrate-oxidizing syntroph Syntrophomonas wolfei strain G311, and the hydrogen- and formate-utilizing
  methanogen Methanobacterium formicicum strain MF (DSM 1535) grown on 20 mM butyrate, 1 mM glycerol, 0.05 g/L yeast extract,
  and 2 mM sodium acetate in bicarbonate-buffered mineral salt medium under N2/CO2 (80/20, vol/vol) at 1.5 bar. In Doloman
  et al. (2022, PMID:35699440, Table 1 and Fig. 2B), co-inoculating 1% (vol/vol) T. flocculiformis ES5 into the S. wolfei
  + M. formicicum coculture shortened the lag phase from 5.38 (0.43) days to 3.3 (0.55) days and produced a statistically
  significant ~2-fold increase in volumetric methane production rate from 0.15 (0.006)* mmol/L/day to 0.26 (0.02)* mmol/L/day
  (maximal methane concentration 4.1 +- 0.14 mmol/L).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Test whether adding the fermentative bacterium Trichococcus flocculiformis ES5 stimulates syntrophic butyrate
    conversion to methane when Methanospirillum hungatei JF1 is replaced by Methanobacterium formicicum MF (DSM 1535) as the
    methanogenic partner of Syntrophomonas wolfei G311.
  assembly_strategy: Assemble a three-species syntrophic triculture by co-inoculating 1% (vol/vol) Trichococcus flocculiformis
    ES5 (DSM 23957, pre-grown as a pure culture on basal medium with 20 mM glycerol) with 10% (vol/vol) pure cultures of Syntrophomonas
    wolfei G311 (pre-grown on 20 mM sodium crotonate) and Methanobacterium formicicum MF (DSM 1535, pre-grown under H2/CO2
    80/20 vol/vol at 1.5 bar with 2 mM sodium acetate) into mineral medium supplemented with 20 mM butyrate, 1 mM glycerol,
    0.05 g/L yeast extract, and 2 mM sodium acetate.
  inoculation_strategy: Inoculate 120-mL serum vials containing 50 mL bicarbonate-buffered mineral salt medium (20 mM butyrate,
    1 mM glycerol, 0.05 g/L yeast extract, 2 mM sodium acetate) with 10% (vol/vol) pre-grown S. wolfei G311 and M. formicicum
    MF plus 1% (vol/vol) T. flocculiformis ES5 under 1.5 bar N2/CO2 (80/20, vol/vol).
  perturbation_design: Compare the three-member T. flocculiformis ES5 + S. wolfei G311 + M. formicicum MF triculture against
    the two-member S. wolfei G311 + M. formicicum MF biculture (CommunityMech:000511) and the parallel M. hungatei JF1 triculture
    (CommunityMech:000188) on 20 mM sodium butyrate.
  measurement_endpoints:
  - lag phase of methane production (days)
  - volumetric methane production rate (mmol/L/day)
  - maximal methane concentration (mmol/L)
  - butyrate consumption and acetate accumulation (mM)
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each of the three syntrophic bi-cultures was constructed by mixing a 10% (vol/vol) inoculum of the pre-grown
      pure culture of S. wolfei and methanogens. For tri-cultures T. flocculiformis was additionally inoculated in 1% (vol/vol).
    explanation: Documents the 10% (vol/vol) syntroph/methanogen and 1% (vol/vol) T. flocculiformis triculture assembly protocol.
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: T. flocculiformis ES5 + S. wolfei + M. formicicum 3.3 (0.55) 0.26 (0.02)* 4.1 (0.14)
    explanation: Reports the Table 1 lag phase (3.3 +- 0.55 days), methane production rate (0.26 +- 0.02 mmol/L/day), and
      maximal methane concentration (4.1 +- 0.14 mmol/L) for the triculture.
