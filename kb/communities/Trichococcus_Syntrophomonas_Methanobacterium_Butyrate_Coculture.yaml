ecological_interactions:
- name: Trichococcus-Stimulated Syntrophic Butyrate Conversion to Methane
  description: In the three-member triculture of Trichococcus flocculiformis ES5, Syntrophomonas wolfei G311, and Methanobacterium
    formicicum MF grown on 20 mM sodium butyrate, 1 mM glycerol, 0.05 g/L yeast extract, and 2 mM sodium acetate, co-inoculating
    1% (vol/vol) T. flocculiformis ES5 shortened the methanogenic lag phase from 5.38 (0.43) days to 3.3 (0.55) days and doubled
    the volumetric methane production rate from 0.15 (0.006)* mmol/L/day to 0.26 (0.02)* mmol/L/day, reaching a maximal methane
    concentration of 4.1 (0.14) mmol/L (Table 1, Fig. 2B). Because quantitative proteomics and donor-to-recipient metabolite
    flux were measured only on the M. hungatei JF1 system, this three-member outcome is represented at COMMUNITY_LEVEL without
    unverified pairwise donor-recipient edges.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
