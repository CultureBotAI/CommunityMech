ecological_interactions:
- name: Predicted R2A Community Metabolite Exchange
  description: PARTIAL - the R2A community FBA model predicts that Pantoea sp. YR343 exports organic acids, purine
    derivatives and biogenic amines to other modeled members, and predicts a higher Pantoea growth rate in the community
    than in its individual model. The actual three-member model comprises YR343, Pseudomonas sp. GM17 and Sphingobium
    sp. AP49, not Variovorax CF313. The listed canonical participants are only the two correctly represented model
    members; AP49 membership and strain grounding remain unresolved in record metadata (#1533). Models were gapfilled,
    combined using final-passage 16S ratios and constrained by carbon uptake calibrated to experimental growth rates.
    These are conditional predictions, not measurements of exchange flux or reciprocal fitness benefit. Metaproteomics
    detects relevant enzymes but does not confirm metabolite transfer. Pantoea dominance is based on 16S data; protein-based
    abundance estimates differ.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic acid
    term:
      id: CHEBI:64709
      label: organic acid
    notes: Broad class of model-predicted exchange substrates, not a measured concentration or a compound-specific
      transferred flux.
  - preferred_term: purines
    term:
      id: CHEBI:26401
      label: purines
    notes: Broad class of model-predicted exchange substrates, not a measured concentration or a compound-specific
      transferred flux.
  evidence:
  - reference: PMID:33995895
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Organic acids, purine derivatives and biogenic amines are predicted to be excreted
    explanation: Results3.4.2 identifies predicted R2A exchanges, not observed donor-to-recipient flux.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The less abundant strains in R2A medium are Pseudomonas sp. GM17 and Sphingobium sp. AP49.
    explanation: Results3.1 identifies the R2A model companions of Pantoea; CF313 belongs to the separate MOPS model.
  participating_taxa:
  - preferred_term: Pantoea sp. YR343
    term:
      id: NCBITaxon:53335
      label: Pantoea
  - preferred_term: Pseudomonas sp. GM17
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
- name: Pseudomonas Competitive Antagonism
  description: 'Pseudomonas sp. GM17 inhibited Variovorax sp. CF313 in a pairwise R2A-agar lawn/spot screen: 5 microliters
    of overnight culture was spotted onto a lawn of the other strain and incubated at 25 degrees C for 48 hours.
    Preserve this experimentally observed antagonism as an assay-specific pair, not as membership of CF313 in the
    three-member R2A FBA model. The source reports coexistence during ten-member liquid cultivation despite agar
    inhibition. HYPOTHESIZED - beneficial shared metabolites could compensate for antagonism, but liquid-versus-static-agar
    conditions are an explicit alternative explanation. No selective metabolite rescue, inhibitory molecule or causal
    link from antagonism to cross-feeding was established.'
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas sp. GM17
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
  target_taxon:
    preferred_term: Variovorax sp. CF313
    term:
      id: NCBITaxon:34072
      label: Variovorax
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: although the growth of strain AP49, CF313 and CF142 were inhibited by strain GM17 in pairwise interaction
      screens
    explanation: Results3.5 directly identifies the GM17-to-CF313 inhibition; Methods2.4 gives the R2A-agar assay.
  - reference: PMID:33995895
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Alternatively, different experimental conditions may account for the unexpected result.
    explanation: Results3.5 explicitly contrasts well-mixed liquid cultivation with static agar; metabolic compensation
      remains an alternative, not established mediation.
