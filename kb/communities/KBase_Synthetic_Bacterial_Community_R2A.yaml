growth_media:
- name: R2A (complex medium)
  temperature: '30'
  temperature_unit: °C
  atmosphere: AEROBIC
  incubation_time: '48'
  incubation_time_unit: h
  shaking_speed: '200'
  shaking_speed_unit: rpm
  vessel_type: test tube (10 mL)
  preparation_notes: R2A selected as the complex medium (a parallel MOPS-glucose minimal
    medium was also tested); community mixed at approximately equal OD600 and serially
    passaged every 48 h at a 1:10 dilution for 15 passages. Member strains are obligate
    aerobes or facultative anaerobes and shaking ensured aeration.
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each strain was inoculated from an agar plate and grown individually in
      a test tube with 10 mL R2A or MOPS liquid medium and cultivated in a shaking
      incubator at 30 °C and 200 rpm for 48 h.
    explanation: Names R2A medium, 30 °C, 200 rpm shaking, and 48 h incubation for
      the Populus PD10 synthetic community members.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Triplicate cultures, for both media, were incubated for 48 h at 30 °C
      with shaking at 200 rpm and passaged every 48 h at a 1:10 dilution for 15 passages.'
    explanation: Confirms the community was passaged at 30 °C, 200 rpm, 48 h intervals
      at 1:10 dilution.
discussions:
- discussion_id: r2a_model_membership_and_exchange_validation
  prompt: Which R2A exchanges occur in culture, and what explains coexistence despite agar antagonism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Predicted R2A Community Metabolite Exchange
  - ecological_interactions#Pseudomonas Competitive Antagonism
  rationale: 'The three-member R2A model contains YR343, GM17 and AP49; CF313 belongs to the four-member MOPS model.
    The CF313 cross-feeding node and both arrows were removed because they transplant medium-specific predictions
    and a proposed compensation mechanism into R2A. Preserve the measured GM17-to-CF313 agar assay separately. Model
    fluxes and enzyme representation do not trace exchange; liquid-versus-agar conditions offer an alternative to
    metabolic rescue. Canonical membership, AP49 grounding, CF313 role and ten-isolate assembly metadata remain
    unresolved under #1533 and were not altered or certified here. Full primary extracted main text/Methods/Tables1-2/main
    captions read; no original figure pixels, supplements, raw data or executed KBase narrative. No new causal structure
    or Edison spend for this repair.'
  posed_by: codex
  posed_date: '2026-10-06'
