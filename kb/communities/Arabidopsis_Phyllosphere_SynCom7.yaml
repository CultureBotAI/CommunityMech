id: CommunityMech:000093
name: Arabidopsis Phyllosphere SynCom7
description: A seven-strain reduced-complexity Arabidopsis phyllosphere SynCom used to test host genetic
  effects on microbiota composition.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Identify Arabidopsis host genetic factors that alter phyllosphere community composition and
    abundance.
  assembly_strategy: Seven bacterial strains representing abundant phyllosphere phyla were inoculated
    onto gnotobiotic Arabidopsis mutants.
  perturbation_design: Host mutant panel affecting surface structure, cell wall, defense, secondary metabolism,
    and pathogen recognition.
  measurement_endpoints:
  - community composition
  - member abundance
  - host genotype effects
  evidence:
  - &id001
    reference: PMID:24743269
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the model plant Arabidopsis thaliana was used in a gnotobiotic system and inoculated with
      a reduced complexity synthetic bacterial community composed of seven strains representing the most
      abundant phyla in the phyllosphere.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: phyllosphere
  term:
    id: ENVO:01001442
    label: phyllosphere
  notes: Gnotobiotic Arabidopsis phyllosphere inoculated with a seven-strain bacterial community.
taxonomy:
- taxon_term:
    preferred_term: Arabidopsis phyllosphere bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Host-Genotype-Structured Assembly
  description: Arabidopsis host genotype shifts the abundance and composition of the phyllosphere SynCom.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Seven bacterial strains representing abundant phyllosphere phyla were inoculated onto gnotobiotic
    Arabidopsis mutants.
  description: Host mutant panel affecting surface structure, cell wall, defense, secondary metabolism,
    and pathogen recognition.
  evidence:
  - *id001
related_ingredients:
- preferred_term: ethylene
  chebi_term:
    id: CHEBI:18153
    label: ethene
  relevance: Host hormone whose signaling axis (via EIN2) Bodenhausen et al. 2014 identify as a
    plant-genetic factor that modulates Arabidopsis phyllosphere community composition.
  evidence:
  - reference: PMID:24743269
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we identified ein2, which is involved in ethylene signaling, as a host factor modulating
      the community's composition
    explanation: Establishes ethylene signaling as a host pathway modulating phyllosphere community
      composition.
growth_media:
- name: nutrient broth (NB) / mineral salt medium (seven-strain phyllosphere SynCom); half-strength
    MS medium for the gnotobiotic Arabidopsis host
  temperature: '28'
  temperature_unit: °C
  light_regime: 9-h photoperiod (short-day)
  inoculum_size: '0.02'
  inoculum_unit: OD600
  incubation_time: '1-3'
  incubation_time_unit: days
  vessel_type: microboxes in a standard growth chamber (gnotobiotic)
  preparation_notes: Bacterial members grown on nutrient broth (both Methylobacterium strains on mineral
    salt medium with 0.5% succinate) at 28°C for one to three days, washed and resuspended in 10 mM MgCl2,
    adjusted to OD600 0.2, mixed 1:1 across the seven strains and diluted to OD600 0.02 for spray inoculation;
    the Arabidopsis host was cultivated on half-strength MS nutrient medium with vitamins, 0.55% plant
    agar and 1% sucrose, with seeds stratified for 3 days at 4°C.
  evidence:
  - reference: PMID:24743269
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strains were grown at 28°C for three days (both Methylobacterium strains), two days (Rhodococcus
      sp., Variovorax sp., Arthrobacter sp. and S. phyllosphaerae), or one day (Sphingomonas sp. Fr1).
    explanation: Gives the 28°C incubation temperature and one-to-three-day growth times of the SynCom
      members before inoculation.
  - reference: PMID:24743269
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All other strains were grown on nutrient broth (NB) without additional NaCl
    explanation: Names nutrient broth (NB) as the growth medium for the SynCom bacteria.
  - reference: PMID:24743269
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plants were grown under short-day conditions (a 9-h photoperiod) in a standard growth chamber,
      as previously described.
    explanation: Gives the 9-h short-day photoperiod and growth-chamber conditions of the gnotobiotic
      host system.
  - reference: PMID:24743269
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This solution was then diluted to an OD600 of 0.02.
    explanation: Gives the OD600 0.02 inoculum density used for spray inoculation.
