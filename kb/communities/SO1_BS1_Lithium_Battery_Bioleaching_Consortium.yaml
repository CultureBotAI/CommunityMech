id: CommunityMech:000519
name: SO1-BS1 Lithium-ion Battery Bioleaching Consortium
description: A two-member engineered Shewanella oneidensis MR-1 SO1 and Bacillus subtilis 168 BS1 synthetic division-of-labor
  consortium for metal oxide leaching from spent LiNixCoyMn1-x-yO2 (NCM) lithium-ion battery cathode black mass using Moutai
  brewing wastewater as the organic leaching medium. In the baseline SO1-BS1 consortium, B. subtilis BS1 (carrying P43::adh
  from Saccharomyces cerevisiae BY4341 and aldH from Issatchenkia terricola XJ-2 on pCE2) removes 97.6% of residual ethanol
  in brewing wastewater within 48 h via an Adh-AldH dual-enzyme cascade, relieving ethanol inhibition of S. oneidensis SO1
  extracellular electron transfer (increasing microbial fuel cell maximum power density to 116.15 mW m^-2) and leaching 50.7
  mg L^-1 total dissolved Li, Ni, Co, and Mn (45.6, 2.4, 1.0, and 1.7 mg L^-1) over 14 days with XPS-verified reduction of
  Mn4+/Mn3+, Co3+, and Ni3+ to Mn2+, Co2+, and Ni2+ (PMID:42733304).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Establish a first-generation division-of-labor S. oneidensis SO1 / B. subtilis BS1 synthetic consortium that
    detoxifies inhibitory residual ethanol (1.8% v/v) in Moutai brewing wastewater and couples wastewater lactate oxidation
    to extracellular electron transfer for spent NCM cathode metal oxide leaching.
  assembly_strategy: Combine S. oneidensis MR-1 SO1 (carrying empty vector pHG13, Cmr) with engineered B. subtilis 168 BS1
    (carrying P43::adh-aldH on pCE2, Cmr), where BS1 oxidizes ethanol via acetaldehyde to acetate and SO1 reduces NCM metal
    oxides anaerobically.
  inoculation_strategy: Grow SO1 and BS1 separately overnight in LB medium with 0.2 g L^-1 chloramphenicol, inoculate each
    at 1% (v/v) into Moutai brewing wastewater with 0.5 mM IPTG, transfer to anaerobic bottles with 0.2 g L^-1 spent NCM black
    mass, and ferment anaerobically at 30 degrees C for 14 days.
  perturbation_design: Compare brewing wastewater alone (3.4 mg L^-1 leached metals), SO1 monoculture (15.4 mg L^-1, 3.10
    mW m^-2), BS1 monoculture (3.8 mg L^-1, 1.25 mW m^-2), and the SO1-BS1 coculture (50.7 mg L^-1, 116.15 mW m^-2), alongside
    XPS valence speciation of Mn 3p, Co 3p, and Ni 3p.
  measurement_endpoints:
  - ethanol removal efficiency over 48 h in brewing wastewater
  - microbial fuel cell maximum power density (mW m^-2)
  - total and element-resolved dissolved Li, Ni, Co, and Mn concentrations over 14 days
  - X-ray photoelectron spectroscopy (XPS) Mn 3p, Co 3p, and Ni 3p oxidation-state fractions
  - NCM surface attachment proportion of S. oneidensis MR-1 (51.14%)
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The microbial consortium SO1‐BS1, comprising the strains S. oneidensis (SO1, Table 1 ) and B. subtilis (P43‐adh‐aldH,
      BS1), was subsequently constructed. It was found that 97.6% of ethanol in the brewing wastewater could be removed by
      the SO1‐BS1 microbial consortium within 48 h
    explanation: Defines the SO1-BS1 consortium membership and its 97.6% ethanol removal within 48 h.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When applying the SO1‐BS1 consortium to catalyze the brewing wastewater‐mediated reduction of NCM, 50.7 mg L−1
      of the total leached metal ions (including Li, Ni, Co, and Mn) was leached over 2 week period (Figure 2d ), in which
      the ionic concentrations of Li, Ni, Co, and Mn were 45.6, 2.4, 1.0, and 1.7 mg L−1, respectively
    explanation: Quantifies total and element-resolved Li, Ni, Co, and Mn leaching by the SO1-BS1 consortium.
