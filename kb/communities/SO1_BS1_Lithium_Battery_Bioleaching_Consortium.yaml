  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When applying the SO1‐BS1 consortium to catalyze the brewing wastewater‐mediated reduction of NCM, 50.7 mg L−1
      of the total leached metal ions (including Li, Ni, Co, and Mn) was leached over 2 week period (Figure 2d ), in which
      the ionic concentrations of Li, Ni, Co, and Mn were 45.6, 2.4, 1.0, and 1.7 mg L−1, respectively (Figure S1 ), and the
      leaching efficiencies of Li, Ni, Co, and Mn were 57.7%, 9.5%, 11.1%, and 13.1%, respectively.
    explanation: Quantifies total and element-specific metal leaching by the SO1-BS1 consortium over 14 days.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Following treatment using brewing wastewater catalyzed by the SO1‐BS1 consortium, the levels of Mn4+ and Mn3+
      decreased to 45.40% and 6.80%, whereas the level of Mn2+ increased to 47.80%, respectively, indicating that a substantial
      fraction of Mn4+ and Mn3+ in NCM was reduced.
    explanation: Provides XPS confirmation of solid-phase NCM metal-oxide reduction by the SO1-BS1 consortium.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the average leaching rates decreased from 7.222 mg L−1·day−1 to 0.921 mg L−1·day−1 for the SO1‐BS1
      consortium, from 9.867 to 0.617 mg L−1·day−1 for the SO2‐BS1 biocatalyst, and from 10.033 to 1.171 mg L−1·day−1 for
      the SO2‐BS2 consortium, as shown in Figure 4a .
    explanation: Quantifies the decline in SO1-BS1 average metal leaching rate from 7.222 to 0.921 mg L^-1 day^-1 between
      days 1-6 and days 7-14.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study showed that the relative abundance of S. oneidensis on the NCM surface was 51.14% for the SO1‐BS1
      consortium, 63.28% for the SO2‐BS2 consortium, and 69.38% for the SO3‐BS3 consortium, as illustrated in Figure 5b .
    explanation: Documents the 51.14% relative abundance of S. oneidensis on the NCM cathode surface in the SO1-BS1 consortium.
