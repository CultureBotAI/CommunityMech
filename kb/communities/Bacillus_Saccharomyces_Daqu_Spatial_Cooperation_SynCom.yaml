id: CommunityMech:000355
name: Bacillus-Saccharomyces Daqu Spatial-Cooperation SynCom
description: A Bacillus-Saccharomyces synthetic consortium used as a representative Daqu solid-state fermentation model for
  starch-mediated spatial cooperation. Temporal transcriptomics connected Bacillus-dominated starch hydrolysis with Saccharomyces-driven
  ethanol production across fermentation stages, fluorescently labeled synthetic consortia showed that starch availability
  governed colony expansion and spatial cooperation, and an engineered consortium carrying an IPTG-inducible alpha-amylase
  expression system was applied in Daqu fermentation to improve starch conversion efficiency and flavor compound formation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Use a Bacillus-Saccharomyces defined consortium to study and program starch-mediated spatial cooperation during
    structured Daqu solid-state fermentation.
  assembly_strategy: Assemble fluorescently labeled Bacillus-Saccharomyces synthetic consortia as a model for Daqu fermentation
    and construct an IPTG-inducible alpha-amylase expression system to regulate starch hydrolysis kinetics, metabolic productivity,
    and consortium spatial organization.
  perturbation_design: Vary starch availability and use inducible alpha-amylase control to tune starch degradation within
    a spatially structured solid-state fermentation system.
  measurement_endpoints:
  - temporal transcriptomic metabolic succession
  - Bacillus-dominated starch hydrolysis
  - Saccharomyces-driven ethanol production
  - fluorescent colony expansion and spatial cooperation
  - starch conversion efficiency
  - flavor compound formation
  notes: The PubMed abstract supports genus-level Bacillus-Saccharomyces membership, fluorescent labeling, starch-availability
    perturbation, an IPTG-inducible alpha-amylase expression system, and application of the engineered consortium in Daqu
    fermentation. It does not identify the exact Bacillus or Saccharomyces species or strains, the labeled derivatives, which
    host carried the alpha-amylase construct, or the Daqu fermentation matrix and incubation parameters.
  evidence:
  - reference: PMID:42679964
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fluorescently labeled Bacillus-Saccharomyces synthetic consortia further demonstrated that starch availability
      critically governs colony expansion and spatial cooperation.
    explanation: Supports assembly of Bacillus-Saccharomyces synthetic consortia and a starch-availability perturbation used
      to measure spatial organization.
  - reference: PMID:42679964
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an isopropyl β-D-1-thiogalactopyranoside-inducible α-amylase expression system was constructed, enabling precise
      regulation of starch hydrolysis kinetics, metabolic productivity, and the spatial organization of the consortium.
    explanation: Supports the engineered alpha-amylase control module and the starch-hydrolysis, productivity, and spatial
      organization endpoints.
  - reference: PMID:42679964
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Application of the engineered consortium in Daqu fermentation significantly improved starch conversion efficiency
      and flavor compound formation
    explanation: Supports the application of the engineered consortium in Daqu fermentation and its measured starch-conversion
      and flavor-production outcomes.
