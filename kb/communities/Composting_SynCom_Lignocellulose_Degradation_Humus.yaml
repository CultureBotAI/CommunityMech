ecological_interactions:
- name: Native Microbiome Response To SynCom Inoculation
  description: The available abstract reports a native compost microbiome response to five-member bacterial-fungal
    SynCom inoculation, including enrichment of Thermobifida and Actinomadura. These are enriched native genera,
    not the five inoculant identities. The community abundance response does not by itself demonstrate establishment
    or identify which genera carry every enriched functional gene.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  downstream:
  - target: Metagenomic CAZyme Repertoire Enrichment
    description: HYPOTHESIZED - a compositional shift toward native degraders could contribute to the enriched CAZyme
      gene repertoire. The abstract links community and functional profiles, but does not establish gene ownership
      or selective mediation by Thermobifida and Actinomadura.
  evidence:
  - reference: PMID:41297400
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the SynCom profoundly restructured the native microbiome, enriching for key functional genera such
      as Thermobifida and Actinomadura
    explanation: Supports the reported native-community response, not direct establishment or the complete inoculant
      roster.
- name: Metagenomic CAZyme Repertoire Enrichment
  description: Metagenomic analysis associates SynCom-treated compost with enriched CAZyme families GH5, GH12, CE1,
    CE3, AA1 and AA6. This is community gene-repertoire potential, not a direct measurement of enzyme expression
    or catalytic activity. The available abstract does not resolve each gene to the two named native genera.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  downstream:
  - target: Enriched lignocellulose degradation and humus accumulation
    description: HYPOTHESIZED - the enriched gene repertoire could support polymer hydrolysis and supply humification
      precursors, contributing to the measured degradation and humus outcomes. Metagenomic, metabolomic and correlation
      analyses support this model, not a selective enzyme or precursor perturbation establishing mediation.
  evidence:
  - reference: PMID:41297400
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: crucial carbohydrate-active enzymes (CAZymes), including cellulases (GH5, GH12), hemicellulases (CE1,
      CE3), and lignin-modifying auxiliary activity enzymes (AA1, AA6)
    explanation: Supports CAZyme functional potential inferred from metagenomics; gene abundance is not enzyme activity.
- name: Enriched lignocellulose degradation and humus accumulation
  description: The available abstract reports that SynCom-treated compost had greater lignin, cellulose and hemicellulose
    degradation and higher humus content than the control, together with earlier maturation. These are positive
    treatment-level outcomes. Their association with community genes and humification precursors does not establish
    which organisms or enzymes mediate the improvement.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  - preferred_term: lignin catabolic process
    term:
