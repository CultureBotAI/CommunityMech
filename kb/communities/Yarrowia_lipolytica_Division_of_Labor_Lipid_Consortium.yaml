    The two engineered Y. lipolytica members partition lignocellulose
    oligosaccharide use between a cellobiose-specialized YBGL3 or YBGL1 strain
    and a xylooligosaccharide-specialized YBXT-XR strain, creating a
    mixed-substrate consortium rather than burdening one strain with every
    hydrolysis and assimilation function.
