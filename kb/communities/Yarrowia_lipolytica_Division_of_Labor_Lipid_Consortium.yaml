id: CommunityMech:000354
name: Yarrowia lipolytica Division-of-Labor Lipid Consortium
description: >-
  A defined two-strain Yarrowia lipolytica consortium engineered to convert
  lignocellulose-derived oligosaccharides into lipids through metabolic
  division of labor. The system partitions hydrolysis and assimilation between
  a cellobiose-specialized YBGL3/YBGL1 lineage and a
  xylooligosaccharide-specialized YBXT-XR lineage, then benchmarks the
  consortium against a single multifunctional YBXT-XR-BGL3 strain. In mixed
  glucose, cellobiose, and
  xylooligosaccharide coculture, the division-of-labor consortium raised lipid
  accumulation above the monoculture benchmark and shifted toward the YBXT-XR
  partner after cellobiose depletion.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >-
    Build a Y. lipolytica division-of-labor consortium that can simultaneously
    use cellulose- and hemicellulose-derived oligosaccharides for microbial
    lipid production.
  assembly_strategy: >-
    Pair a cellobiose-specialized Y. lipolytica strain carrying the BGL3 or
    BGL1 activity with a xylooligosaccharide-specialized Y. lipolytica
    YBXT-XR strain that hydrolyzes xylooligosaccharides and assimilates the
    resulting xylose.
  perturbation_design: >-
    Benchmark the two-strain division-of-labor consortium against an engineered
    single multifunctional strain, YBXT-XR-BGL3, in mixed glucose, cellobiose,
    and xylooligosaccharide substrate.
  measurement_endpoints:
  - Cellobiose and xylooligosaccharide saccharification
  - Lipid accumulation from cellobiose and xylooligosaccharides
  - Lipid production in mixed-substrate co-culture
  - Population shift after cellobiose depletion
  evidence:
  - reference: doi:10.64898/2025.12.19.695487
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, this study provides the first demonstration of a Y. lipolytica
      system capable of simultaneously utilizing cellulose- and
      hemicellulose-derived oligosaccharides.
    explanation: >-
      Supports the engineering objective of a Y. lipolytica system for
      simultaneous cellulose- and hemicellulose-oligosaccharide utilization.
  - reference: doi:10.64898/2025.12.19.695487
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Because the construction of a single multifunctional strain may impose a
      significant metabolic burden and reduce fitness, we benchmarked this
      strain against a division-of-labor strategy.
    explanation: >-
      Supports the division-of-labor benchmarking against a single engineered
      multifunctional strain.
