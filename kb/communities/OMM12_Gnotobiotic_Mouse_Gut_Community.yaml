ecological_interactions:
- name: Colonization Resistance Against Salmonella
  description: OMM12 was designed to provide conventional-like colonization resistance against Salmonella
    enterica serovar Typhimurium in gnotobiotic mice, making it useful for dissecting microbe-microbe and
    host-microbe mechanisms that prevent pathogen expansion.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:27869789
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: confers colonization resistance against Salmonella enterica serovar Typhimurium
    explanation: Supports pathogen-resistance as a primary ecological function of the designed community.
- name: Reproducible Multi-Strain Intestinal Colonization
  description: OMM12 can reproducibly colonize germ-free mice across different animal facilities, and
    individual strain abundances can be resolved by strain-specific qPCR. This makes the consortium a
    standardized model for comparing mouse microbiome experiments.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: established in several germ-free mouse facilities world-wide
    explanation: Supports reproducible colonization across facilities.
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Absolute abundance of each strain was determined by a strain-specific qPCR assay
    explanation: Supports strain-resolved monitoring of the defined community.
