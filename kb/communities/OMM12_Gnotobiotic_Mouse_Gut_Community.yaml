id: CommunityMech:000133
name: OMM12 Gnotobiotic Mouse Gut Community
description: OMM12, also called Oligo-MM12 or Oligo-Mouse-Microbiota, is a defined 12-strain murine
  intestinal bacterial community used to colonize germ-free mice for reproducible microbiome research.
  The community includes Lactobacillus reuteri I49, Enterococcus faecalis KB1, Blautia coccoides YL58,
  Clostridium innocuum I46, Flavonifractor plautii YL31, Clostridium clostridioforme YL32, Acutalibacter
  muris KB18, Bacteroides caecimuris I48, Muribaculum intestinale YL27, Bifidobacterium longum subsp.
  animalis YL2, Akkermansia muciniphila YL44, and Turicimonas muris YL45. It is used as a reduced,
  genome-characterized model of the mouse gut microbiota for colonization resistance, mucosal immunology,
  microbial ecology, host-microbiome metabolic cross-talk, and facility-to-facility reproducibility studies.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Provide a defined, reproducible mouse intestinal microbiota for gnotobiotic experiments and
    mechanistic studies of colonization resistance and host-microbiome interactions.
  assembly_strategy: Genome-guided selection of 12 cultured mouse intestinal bacterial strains representing
    major bacterial phyla in the murine gut.
  inoculation_strategy: Germ-free mice are colonized with a frozen mixture or cultured mixture of OMM12
    strains, with strain abundances monitored by strain-specific qPCR or sequencing.
  measurement_endpoints:
  - Stable colonization of germ-free mice
  - Strain-specific absolute abundance
  - Colonization resistance against Salmonella Typhimurium
  - Host-microbiome metabolic cross-talk
  evidence:
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The Oligo-Mouse-Microbiota (OMM12) is a recently developed synthetic bacterial community for functional microbiome research in mouse models
    explanation: Supports the identity and experimental purpose of the OMM12 community.
  - reference: PMID:27869789
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: By genome-informed design, we created an improved version of the Oligo-MM community
    explanation: Supports the genome-guided design strategy for Oligo-MM/OMM communities.
