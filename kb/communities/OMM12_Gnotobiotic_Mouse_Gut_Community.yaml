discussions:
- discussion_id: omm12_composition_dose_and_resistance_boundaries
  prompt: Which exact-system measurements distinguish the observed outcome from the proposed mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-07'
  rationale: Preserve the positive repeat-dose establishment and 12-member resistance results. The protocol study
    compared staged facility cohorts and did not isolate a member-mediated redox mechanism; early colonizers lowering
    gut redox is proposed. Double inoculation improved YL27 detection while four other strains remained variably
    undetected. Facility-associated variation persisted, and compositional similarity was not a functional challenge
    assay. The 2016 primary abstract distinguishes OMM12 resistance from conventional-like resistance of the version
    expanded by three facultative anaerobes; full infection Methods were not inspected because the publisher provides
    subscription preview only. Remove the context-only colonization-to-resistance arrow rather than treating the
    two separate studies as a mediation experiment.
  attaches_to:
  - ecological_interactions#Double-Dose OMM12 Engraftment
  - ecological_interactions#Colonization Resistance Against Salmonella
  - ecological_interactions#Reproducible Multi-Strain Intestinal Colonization
