growth_media:
- name: unspecified (anaerobic OMM12 cultivation medium)
  atmosphere: ANAEROBIC
  headspace_gas: '3% H2, rest N2'
  inoculum_source: glycerol cryostocks of individual OMM12 strains; germ-free mice
    inoculated with a frozen mixture of the strains
  preparation_notes: Media kept anoxic in an anaerobic chamber for at least 2 days
    before use; germ-free C57Bl/6J mice colonized with a frozen strain mixture, with
    a second application of the strains after 72 h to improve community stability.
  evidence:
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Media used for cultivation were kept under anoxic conditions
    explanation: Establishes anaerobic (anoxic) cultivation of the OMM12 strains.
