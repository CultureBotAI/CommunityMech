ecological_interactions:
- name: Double-Dose OMM12 Engraftment
  description: A second frozen OMM12 inoculum application 72 h after the first improved establishment across the
    participating germ-free mouse facilities, including more reliable detection of the slow-colonizing Muribaculum
    intestinale YL27. This is a tested dosing-protocol improvement, not demonstrated biotic facilitation by one
    member. Some strains remained below fecal qPCR detection in some samples, and the facility cohorts were not
    a fully matched randomized comparison.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Reproducible Multi-Strain Intestinal Colonization
    description: The repeat application after 72 h improved reproducibility of OMM12 establishment, particularly
      YL27 detection, relative to the single-dose protocol. This supports a protocol-to-colonization effect in the
      studied facility cohorts, not guaranteed detection of every strain or isolation of the effects of dose, timing
      and gut redox.
  evidence:
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We show that a second application of the OMM12 strains after 72 h leads to a more stable community
      composition than a single application.
    explanation: Supports the observed repeat-dose protocol improvement; neither all-12 detection in every sample
      nor a specific member-mediated mechanism follows.
- name: Colonization Resistance Against Salmonella
  description: The 12-member OMM12 community provided colonization resistance against Salmonella enterica serovar
    Typhimurium in gnotobiotic mice, but less than a conventional complex microbiota. Conventional-like resistance
    belongs to the expanded version with three added facultative anaerobic bacteria, not to this 12-member community.
    The phenotype is retained without assigning a uniquely established competition mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:27869789
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: provided colonization resistance against S. Tm infection, albeit not to the degree of a conventional
      complex microbiota.
    explanation: The primary abstract explicitly supports resistance by the 12-member community and its lower degree
      than conventional microbiota; the improved expanded community is a separate condition.
- name: Reproducible Multi-Strain Intestinal Colonization
  description: OMM12 was established in multiple germ-free mouse facilities, with strain-resolved fecal 16S rRNA
    gene-copy qPCR monitoring. The repeat-dose protocol improved reproducibility and YL27 establishment, but some
    other strains were undetected in some samples and facility differences persisted. Gene-copy counts per volume
    of extracted DNA are not viable cell counts or uniformly fecal-mass-normalized abundance. Compositional reproducibility
    alone does not establish functional equivalence or increased pathogen resistance.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: established in several germ-free mouse facilities world-wide
    explanation: Supports reproducible colonization across facilities.
  - reference: PMID:31998276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Absolute abundance of each strain was determined by a strain-specific qPCR assay
    explanation: Supports strain-specific qPCR monitoring; the Methods normalize 16S gene copies to extracted DNA
      volume, not viable cells, and fecal weight was not available for every sample.
