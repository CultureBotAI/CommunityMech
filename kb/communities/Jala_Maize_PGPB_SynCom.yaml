- name: SynCom 3 Antifungal and PAL Induction
  description: 'SynCom 3 inhibited several tested fungi in vitro, reaching up to 80 percent in the reported comparisons,
    but Helminthosporium was hardly inhibited by SynCom 3. It also tripled maize-root phenylalanine ammonia-lyase
    activity. These are positive but distinct assays: the authors did not test induced systemic resistance with
    a fungal challenge. PAL induction and inhibition of these cultured fungi do not by themselves demonstrate the
    mechanism of rust reduction in the field. The four canonical participants are a subset of the reported six-strain
    SynCom 3, not a complete four-member inoculant; exact membership and the primary Pseudomonas strain inconsistency
    remain under #1521.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 3 exhibited the highest inhibition percentages reaching 80% of inhibition
    explanation: Supports high inhibition in some tested comparisons, not 80 percent for every fungus or direct
      suppression of field rust.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: only the effect of SynCom 3 was statistically significant as it tripled the activity of the enzyme
    explanation: Supports positive root PAL induction, not a fungal-challenge demonstration of systemic resistance
      or selective mediation.
