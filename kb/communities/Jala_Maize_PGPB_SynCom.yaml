- name: Field Yield Increase and Rust Reduction
  description: 'In the reported one-site field experiment with CPL9105W hybrid maize, SynCom 3 treatment increased
    grain yield from 11 to 16 tons/ha relative to control. The abstract reports rust incidence falling from 12.5
    to 8 percent, not a 12.5-percentage-point reduction. The treatment involved seed inoculation and subsequent
    applications; it is distinct from the Conejo seedling experiments. The whole-inoculant effects do not establish
    which traits or members mediated them, universal efficacy across sites/seasons, or a benefit for every tested
    SynCom. The four canonical participants are a subset of the reported six-strain SynCom 3, not a complete four-member
    inoculant; exact membership and the primary Pseudomonas strain inconsistency remain under #1521.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the yield increased from 11 tons/ha for the control to 16 tons/ha inoculated with SynCom 3
    explanation: Supports the positive SynCom 3 field yield effect in this trial; not universal multi-site or all-SynCom
      performance.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: incidence of rust fungal infections decreased significantly from 12.5% in the control to 8% in the
      treatment with SynCom 3
    explanation: Supports the explicit abstract rust-incidence comparison; original figure pixels and raw plot data
      were not inspected.
