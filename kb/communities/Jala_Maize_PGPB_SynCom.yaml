  evidence:
  - *id001
related_ingredients:
- preferred_term: indole-3-acetic acid
  chebi_term:
    id: CHEBI:16411
    label: indole-3-acetic acid
  relevance: Plant growth-promoting auxin produced by Jala-landrace endophytes (e.g. Burkholderia
    Z1AL11) — one of the screened PGPB traits underlying SynCom 3 maize growth promotion and rust
    suppression in De la Vega-Camarillo et al. 2023.
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phosphate solubilization, IAA, BNF, metallophores, biocontrol against Fusarium oxysporum,
      Pestalotia sp., Curvularia sp.
    explanation: Names IAA as one of the documented plant-growth-promoting traits of the Jala-derived
      endophytes that compose the SynCom.
- preferred_term: pyrrolnitrin
  chebi_term:
    id: CHEBI:32079
    label: pyrrolnitrin
  relevance: Antifungal biocontrol metabolite documented at the species level for P. protegens;
    cited here as background for the kind of antifungal secondary metabolite Pseudomonas members of
    this genus can produce, rather than a trait demonstrated for the specific Jala-derived isolates.
  evidence:
  - reference: PMID:37275168
    supports: PARTIAL
    evidence_source: REVIEW
    snippet: P. protegens produces biocontrol compounds such as 2,4-diacetyl phloroglucinol, pyoluteorin,
      pyrrolnitrin, phenazines, and hydrogen cyanide
    explanation: This is a review/background statement (drawing on third-party citations) naming
      pyrrolnitrin among P. protegens biocontrol metabolites at the species level; it is not an
      isolate-specific result for the Jala-Maize SynCom members, so it only partially supports the
      claim that these particular SynCom isolates deploy pyrrolnitrin.
- preferred_term: 1-aminocyclopropanecarboxylic acid
  chebi_term:
    id: CHEBI:18053
    label: 1-aminocyclopropanecarboxylic acid
  relevance: ACC — the ethylene biosynthesis precursor whose bacterial ACC deaminase activity is one
    of the screened PGPB traits used to select SynCom members. ACC deaminase lowers stress ethylene
    and thereby promotes plant growth under stress.
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aminocyclopropane-1-carboxylate (ACC) deaminase production
    explanation: Names ACC (1-aminocyclopropanecarboxylic acid) as the substrate of a screened PGPB
      trait used in Jala-Maize SynCom assembly.
growth_media:
- name: Luria Bertani (LB) medium
  temperature: '28'
  temperature_unit: °C
  incubation_time: '48'
  incubation_time_unit: h
  vessel_type: agar plate / liquid culture
  preparation_notes: SynCom member strains were revived on solid LB and grown individually
    in LB liquid medium to exponential phase, then adjusted to defined densities for
    SynCom assembly.
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: were recovered in a solid Luria Bertani (LB) medium and incubated at 28°C
      for 48 h.
    explanation: Names LB medium, 28°C, and 48 h incubation for reviving the SynCom
      member strains.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each bacteria strain was grown individually in LB liquid media to the exponential
      phase.
    explanation: LB liquid medium was used to grow each strain to exponential phase
      before SynCom assembly.
