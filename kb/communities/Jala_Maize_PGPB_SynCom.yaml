ecological_interactions:
- name: SynCom 3 Multi-Trait PGP Activity
  description: 'The mixed SynCom 3 inoculant produced positive phosphate-solubilization, indole-reactive colorimetric,
    ACC-growth, metal-chelation and acetylene-reduction assay results. Salkowski chemistry is not specific identification
    of IAA; growth with ACC as sole nitrogen source is an indirect deaminase screen. Acetylene reduction is a nitrogenase
    proxy, not measured nitrogen transfer to maize, and the CAS assay does not identify a particular metallophore.
    These positive in-vitro traits were not selectively perturbed as mediators of plant growth. The four canonical
    participants are a subset of the reported six-strain SynCom 3, not a complete four-member inoculant; exact membership
    and the primary Pseudomonas strain inconsistency remain under #1521.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: phosphate ion
    term:
      id: CHEBI:35780
      label: phosphate ion
    notes: Measured soluble phosphate output in the in-vitro assay, not quantified uptake by maize.
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: IAA-associated colorimetric readout; Salkowski also responds to related indole compounds, so exact molecular
      identity is not established by this assay.
  - preferred_term: 1-aminocyclopropanecarboxylic acid
    term:
      id: CHEBI:18053
      label: 1-aminocyclopropanecarboxylic acid
    notes: Assay substrate in the indirect ACC-growth screen, not a measured community product or demonstrated plant
      ethylene decrease.
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
    notes: Inferred from acetylene reduction and growth under assay conditions; not direct plant nitrogen incorporation
      or identified member-level flux.
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phosphate solubilization, IAA, BNF, metallophores, biocontrol against Fusarium oxysporum, Pestalotia
      sp., Curvularia sp.
    explanation: Supports the positive screened trait or assay result within the mixed inoculant; the primary Methods
      bound specificity and do not isolate plant-growth mediation.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 3 accumulated more soluble orthophosphate
    explanation: Supports the positive screened trait or assay result within the mixed inoculant; the primary Methods
      bound specificity and do not isolate plant-growth mediation.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aminocyclopropane-1-carboxylate (ACC) deaminase production
    explanation: Supports the positive screened trait or assay result within the mixed inoculant; the primary Methods
      bound specificity and do not isolate plant-growth mediation.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: only SynCom 3 exhibited evident growth in the BMGM media and reduced acetylene
    explanation: Supports the positive screened trait or assay result within the mixed inoculant; the primary Methods
      bound specificity and do not isolate plant-growth mediation.
