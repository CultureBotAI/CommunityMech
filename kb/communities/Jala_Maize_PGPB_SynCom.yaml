    description: PARTIAL - antifungal activity or host defense responses could contribute to the rust-reduction
      component of the field outcome. Separate inhibition and PAL assays support candidate routes, but no fungal-challenge
      ISR test or selective PAL/antifungal perturbation establishes this mediation or explains the yield increase.
- name: Conejo Maize Seedling Growth Promotion
  description: 'SynCom 3 inoculation increased Conejo maize growth in gnotobiotic tubes and greenhouse pots. Gnotobiotic
    root and shoot sizes were 4.2 and 3.0 times the controls. In greenhouse comparisons, root/shoot lengths were
    3.3/1.4 times controls and shoot/root dry weights were 2.3/3 times controls. These are positive whole-inoculant
    treatment effects in the Conejo landrace, not proof that its earlier in-vitro trait panel caused them or that
    those seedlings produced the separate hybrid field harvest. The four canonical participants are a subset of
    the reported six-strain SynCom 3, not a complete four-member inoculant; exact membership and the primary Pseudomonas
    strain inconsistency remain under #1521.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: promoted the growth of the roots and shoots to sizes 4.2 and 3.0 times greater
    explanation: Supports positive gnotobiotic Conejo growth effects, not selective trait mediation.
  - reference: PMID:37275168
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: increases of 3.3 and 1.4 times the roots and shoot length and 2.3 and 3 times the dry weights
    explanation: Supports positive greenhouse growth; the primary Results assign dry-weight folds to shoots 2.3
      and roots 3, distinct from the root/shoot length ordering.
  participating_taxa:
