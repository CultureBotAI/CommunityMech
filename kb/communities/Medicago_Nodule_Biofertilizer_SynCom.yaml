ecological_interactions:
- name: Four-Strain Nodule PGP Trait Retention
  description: 'The four strains were assayed individually for PGP-associated traits and stress tolerance, not for
    reciprocal benefit in mixed culture. All showed phosphate solubilization, Salkowski-estimated IAA, ACC deaminase,
    biofilm and pectinase activity under the tested metal mixture. This was not universal trait retention: biofilm
    signal decreased and N10/N12 did not grow in nitrogen-free medium with metals. Nitrogen-free growth was only
    a first approximation of fixation. NaCl/PEG tolerance and maximum temperatures differed by strain. These positive
    culture traits do not establish their delivery, necessity or sufficiency in Medicago sativa.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. N4
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. N8
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Ensifer sp. N10
    term:
      id: NCBITaxon:106591
      label: Ensifer
  - preferred_term: Ensifer sp. N12
    term:
      id: NCBITaxon:106591
      label: Ensifer
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: IAA interpretation of a Salkowski assay with a calibration curve, not measured bacterial-to-plant hormone
      transfer.
  downstream:
  - target: Abiotic-Stress Antioxidant Enzyme Response
    description: HYPOTHESIZED - stress-tolerant PGP traits could help the inoculum function in the host and induce
      antioxidant responses. Individual-strain trait assays and whole-SynCom plant enzyme responses support this
      proposed connection, but no specific PGP trait was selectively perturbed to establish mediation.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The SynCom was made up of four strains: Pseudomonas sp. N4, Pseudomonas sp. N8, Ensifer sp. N10 and
      Ensifer sp. N12

      '
    explanation: Names the four strains whose stress-tolerant PGP traits were assayed.
  - reference: PMID:37299063
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: All strains maintained the PGP properties in absence of metals
    explanation: 'This excerpt is incomplete as a universal retention claim: the following text and Table 1 specify
      N10/N12 nitrogen-free-growth exceptions and reduced biofilm signal. Other PGP assays remain positive; these
      are individual-strain measurements.'
- name: Abiotic-Stress Antioxidant Enzyme Response
  description: SynCom inoculation increased measured catalase, superoxide dismutase, guaiacol peroxidase and ascorbate
    peroxidase activities in M. sativa tissues under the tested metal, salt, drought and heat conditions. Responses
    varied by tissue and treatment. These positive host enzyme responses support the proposed protective interpretation
    but do not directly quantify ROS clearance or establish antioxidant necessity for improved growth. Plant benefit
    is not a test of reciprocal bacterial benefit; M. sativa is the external host, not a fifth bacterial inoculum
    member.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: reactive oxygen species
    term:
      id: CHEBI:26523
      label: reactive oxygen species
    notes: ROS are the proposed substrate/context for antioxidant protection, not a directly quantified ROS pool
      in this experiment.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Legume Nodule Biofertilization
    description: HYPOTHESIZED - induced antioxidant activities could limit oxidative injury and thereby support
      plant growth and nodulation under stress. Enzyme and plant phenotypes co-occur with inoculation; selective
      antioxidant inhibition or rescue was not used to establish this causal step.
  evidence:
  - reference: PMID:37299063
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: The increase in plant antioxidant enzymatic activities seems to be a common and important mechanism
      of plant protection induced by the SynCom
    explanation: The authors propose a protective mechanism; measured enzyme activities support the response, but
      mediation of growth and nodulation was not selectively isolated.
  participating_taxa:
  - preferred_term: Pseudomonas sp. N4
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. N8
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Ensifer sp. N10
    term:
      id: NCBITaxon:106591
      label: Ensifer
  - preferred_term: Ensifer sp. N12
    term:
      id: NCBITaxon:106591
      label: Ensifer
- name: Legume Nodule Biofertilization
  description: 'In controlled pot experiments, the four-strain SynCom improved M. sativa dry biomass, nodule number,
    photosynthetic parameters and plant nitrogen content relative to comparison inoculation treatments, including
    Ensifer N10 alone. Benefits were endpoint- and stress-dependent: salinity-treated SynCom plants had shorter
    but thicker roots, and heat-stressed photosynthesis remained low despite improvement. Nodules and nitrogen content
    are positive outcomes, not direct N2-fixation flux or proof that all four members are required. These plant
    measurements do not establish field efficacy or reciprocal microbial benefit.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. N4
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. N8
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Ensifer sp. N10
    term:
      id: NCBITaxon:106591
      label: Ensifer
  - preferred_term: Ensifer sp. N12
    term:
      id: NCBITaxon:106591
      label: Ensifer
  metabolites:
  - preferred_term: dinitrogen
    term:
      id: CHEBI:17997
      label: dinitrogen
    notes: Candidate nitrogen source in the rhizobial symbiosis; tissue nitrogen and nodule counts do not directly
      measure atmospheric N2 fixation.
  biological_processes:
  - preferred_term: nodulation
    term:
      id: GO:0009877
      label: nodulation
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Inoculation with the SynCom in pots containing soil enhanced plant growth parameters
    explanation: An observed plant outcome, not the study aim. Supports pot-level growth improvement; other endpoints
      and limits are stated separately.
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: nodulation (from 1.5- to 3-fold increase in nodules number), photosynthesis and nitrogen content (up
      to 4-fold under metal stress)
    explanation: Links the Ensifer-containing SynCom to increased nodulation and plant nitrogen content in pot assays.
environmental_factors:
- name: defined synthetic community design
  value: Two Ensifer and two Pseudomonas strains isolated from Medicago nodules were assembled as a SynCom.
  description: Metal contamination, salinity, drought, and high temperature in estuarine soils.
  evidence:
  - *id001
related_ingredients:
- preferred_term: dinitrogen
  chebi_term:
    id: CHEBI:17997
    label: dinitrogen
  relevance: Atmospheric dinitrogen (N2) is the substrate fixed by the Ensifer (rhizobial)
    members of this Medicago nodule SynCom. Inoculation increased plant nitrogen content up
    to 4-fold under metal stress, the central nutritional benefit of this nodule biofertilizer.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: nodulation (from 1.5- to 3-fold increase in nodules number), photosynthesis and
      nitrogen content (up to 4-fold under metal stress) under all the controlled conditions
      tested
    explanation: The increase in nodulation and plant nitrogen content reflects symbiotic
      dinitrogen fixation by the nodule-forming rhizobial members of the SynCom.
growth_media:
- name: TSA and TY (bacterial maintenance media); greenhouse pots (plant assay)
  vessel_type: pots (greenhouse)
  incubation_time: '60'
  incubation_time_unit: d
  inoculum_source: two Ensifer and two Pseudomonas strains isolated from Medicago nodules
  preparation_notes: Pseudomonas strains maintained on Tryptic Soy Agar (TSA) and Ensifer strains on
    Tryptone-Yeast (TY); inoculated M. sativa grown ~60 days in pots under greenhouse conditions, with
    a 40 °C heat-stress treatment applied for 5 consecutive days in a growth chamber.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas strains were maintained in TSA (Tryptic Soy Agar; Intron Biotechnology, Seongnam,
      Republic of Korea) plates and Ensifer strains in TY
    explanation: Names the maintenance media (TSA and TY) for the two bacterial genera of the SynCom.
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: M. sativa plants after 60 days in pots under greenhouse conditions
    explanation: Names the ~60-day pot greenhouse cultivation of the inoculated plants.
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: plants were subjected to 40 °C during 5 consecutive days in a growth chamber
    explanation: Names the growth-chamber heat-stress temperature applied during the plant assay.
