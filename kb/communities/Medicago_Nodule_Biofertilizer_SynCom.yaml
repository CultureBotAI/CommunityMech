ecological_interactions:
- name: Four-Strain Nodule PGP Trait Retention
  description: >
    Pseudomonas sp. N4, Pseudomonas sp. N8, Ensifer sp. N10, and Ensifer sp.
    N12 retained a stress-tolerant PGP trait set, including phosphate
    solubilization, IAA production, ACC deaminase activity, biofilm formation,
    pectinase activity, salt and PEG tolerance, and growth at at least 40
    degrees Celsius.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. N4
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. N8
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Ensifer sp. N10
    term:
      id: NCBITaxon:106591
      label: Ensifer
  - preferred_term: Ensifer sp. N12
    term:
      id: NCBITaxon:106591
      label: Ensifer
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
  biological_processes:
  - preferred_term: nodulation
    term:
      id: GO:0009877
      label: nodulation
  downstream:
  - target: Abiotic-Stress Antioxidant Protection
    description: The stress-tolerant PGP endophyte SynCom induced antioxidant
      enzyme activities that protected M. sativa during abiotic stress.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The SynCom was made up of four strains: Pseudomonas sp. N4,
      Pseudomonas sp. N8, Ensifer sp. N10 and Ensifer sp. N12
    explanation: Names the four strains whose stress-tolerant PGP traits were
      assayed.
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All strains maintained the PGP properties in absence of metals
    explanation: Supports retention of plant-growth-promoting traits by the
      selected nodule endophytes.
- name: Abiotic-Stress Antioxidant Protection
  description: >
    The Pseudomonas-Ensifer SynCom increased M. sativa antioxidant enzymatic
    activities across metal, salt, drought, and heat treatments, providing a
    common plant-protection mechanism under abiotic stress.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: reactive oxygen species
    term:
      id: CHEBI:26523
      label: reactive oxygen species
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Legume Nodule Biofertilization
    description: Antioxidant enzyme activation is the shared protective
      mechanism associated with improved M. sativa growth and nodulation under
      each abiotic stress.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The increase in plant antioxidant enzymatic activities seems to be a common and
      important mechanism of plant protection induced by the SynCom
    explanation: Supports antioxidant enzyme activation as a shared mechanism of
      SynCom-induced plant protection under abiotic stress.
- name: Legume Nodule Biofertilization
  description: >
    The four-strain Pseudomonas-Ensifer SynCom increased M. sativa biomass,
    nodulation, photosynthesis, and nitrogen content in stressed estuarine
    soils.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. N4
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. N8
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Ensifer sp. N10
    term:
      id: NCBITaxon:106591
      label: Ensifer
  - preferred_term: Ensifer sp. N12
    term:
      id: NCBITaxon:106591
      label: Ensifer
  metabolites:
  - preferred_term: dinitrogen
    term:
      id: CHEBI:17997
      label: dinitrogen
  biological_processes:
  - preferred_term: nitrogen fixation
    term:
      id: GO:0009399
      label: nitrogen fixation
  - preferred_term: nodulation
    term:
      id: GO:0009877
      label: nodulation
  evidence:
  - *id001
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: nodulation (from 1.5- to 3-fold increase in nodules number), photosynthesis and
      nitrogen content (up to 4-fold under metal stress)
    explanation: Links the Ensifer-containing SynCom to increased nodulation and plant
      nitrogen content in pot assays.
environmental_factors:
- name: defined synthetic community design
  value: Two Ensifer and two Pseudomonas strains isolated from Medicago nodules were assembled as a SynCom.
  description: Metal contamination, salinity, drought, and high temperature in estuarine soils.
  evidence:
  - *id001
related_ingredients:
- preferred_term: dinitrogen
  chebi_term:
    id: CHEBI:17997
    label: dinitrogen
  relevance: Atmospheric dinitrogen (N2) is the substrate fixed by the Ensifer (rhizobial)
    members of this Medicago nodule SynCom. Inoculation increased plant nitrogen content up
    to 4-fold under metal stress, the central nutritional benefit of this nodule biofertilizer.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: nodulation (from 1.5- to 3-fold increase in nodules number), photosynthesis and
      nitrogen content (up to 4-fold under metal stress) under all the controlled conditions
      tested
    explanation: The increase in nodulation and plant nitrogen content reflects symbiotic
      dinitrogen fixation by the nodule-forming rhizobial members of the SynCom.
growth_media:
- name: TSA and TY (bacterial maintenance media); greenhouse pots (plant assay)
  vessel_type: pots (greenhouse)
  incubation_time: '60'
  incubation_time_unit: d
  inoculum_source: two Ensifer and two Pseudomonas strains isolated from Medicago nodules
  preparation_notes: Pseudomonas strains maintained on Tryptic Soy Agar (TSA) and Ensifer strains on
    Tryptone-Yeast (TY); inoculated M. sativa grown ~60 days in pots under greenhouse conditions, with
    a 40 °C heat-stress treatment applied for 5 consecutive days in a growth chamber.
  evidence:
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas strains were maintained in TSA (Tryptic Soy Agar; Intron Biotechnology, Seongnam,
      Republic of Korea) plates and Ensifer strains in TY
    explanation: Names the maintenance media (TSA and TY) for the two bacterial genera of the SynCom.
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: M. sativa plants after 60 days in pots under greenhouse conditions
    explanation: Names the ~60-day pot greenhouse cultivation of the inoculated plants.
  - reference: PMID:37299063
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: plants were subjected to 40 °C during 5 consecutive days in a growth chamber
    explanation: Names the growth-chamber heat-stress temperature applied during the plant assay.
