- name: Wetland Methanogen Co-occurrence Networks
  description: Positive Spearman genus co-occurrence networks used 12 late-season samples per site, four per depth
    category, at JLA, LA2, OWC, PPR P7 and PPR P8. JLA is a swamp despite shorthand marsh wording. Fewer methanogen-associated
    nodes and methanogen-methanotroph connections were associated with greater methane flux; whole-community network
    structure did not show the same relationship. MAG-derived metabolic categories were matched at genus level,
    providing potential cross-feeding interpretations rather than direct exchange measurements. Shared environmental
    responses, relative-abundance effects and incomplete genome coverage remain alternatives. Broad canonical guilds
    do not identify every network member or a directed donor-recipient pair.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Methane-cycle context, not measured partner-to-partner exchange or taxon-specific production flux.
  evidence:
  - reference: PMID:39843444
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: wetland-specific metabolic interactions in marshes
    explanation: Supports computed co-occurrence patterns and the authors metabolic interpretation, not perturbed
      pairwise causality or directly observed substrate transfer.
  - reference: PMID:39843444
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: low connections between methanogens and methanotrophs in high-emitting wetlands
    explanation: Supports computed co-occurrence patterns and the authors metabolic interpretation, not perturbed
      pairwise causality or directly observed substrate transfer.
  participating_taxa:
  - preferred_term: MUCC wetland methanogens
    term:
      id: NCBITaxon:2157
      label: Archaea
  - preferred_term: MUCC wetland methanotrophs
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Methanoregula Hub Methanogen And Flux Predictor
  description: Methanoregula was a core network member, and its fraction within methanogens predicted methane flux
    across nine sites; temperature plus this dominance measure improved the reported fit. These are cross-site associations,
    not evidence that removing or adding Methanoregula changes flux or that it is an obligate syntrophic hub. OWC
    MAG/genus transcription supplies an activity proxy, not methane-production flux. Methods describe 2018 transcriptomes
    and production estimates using 2015 flux/porewater inputs; temporal alignment needs reconciliation before treating
    the VIP analysis as a matched contemporaneous test. The single canonical participant identifies the focal genus,
    not its partners.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Methane-cycle context, not measured partner-to-partner exchange or taxon-specific production flux.
  evidence:
  - reference: PMID:39843444
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Methanoregula emerged as a hub methanogen across networks
    explanation: Supports a network/predictor association, not demonstrated keystone necessity, syntrophy or a selectively
      established contribution to methane flux.
  - reference: PMID:39843444
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: strong predictor of methane flux
    explanation: Supports a network/predictor association, not demonstrated keystone necessity, syntrophy or a selectively
      established contribution to methane flux.
  participating_taxa:
  - preferred_term: Methanoregula
    term:
      id: NCBITaxon:395331
      label: Methanoregula
- name: Methylotrophic Methanogenesis Potential
  description: Some of 107 dereplicated Methanoregula MAGs encoded candidate methylotrophic machinery for methylated
    sulfides and methoxylated compounds alongside broadly conserved hydrogenotrophic potential. Genomic annotation,
    phylogenetic placement and synteny support metabolic potential, not confirmed substrate use, enzyme activity
    or pathway-specific methane flux in these wetlands. This does not establish methanol use by the curated genus
    or experimentally demonstrated niche partitioning. Physiological validation is needed to assign the proposed
    expanded substrate range.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Methane-cycle context, not measured partner-to-partner exchange or taxon-specific production flux.
  evidence:
  - reference: PMID:39843444
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: functional potential for methylotrophic methanogenesis
    explanation: Supports candidate genomic methylotrophic potential, not measured methanol use or a quantified
      contribution to methane production.
  - reference: PMID:39843444
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: highlighting the importance of this pathway
    explanation: Supports candidate genomic methylotrophic potential, not measured methanol use or a quantified
      contribution to methane production.
  participating_taxa:
