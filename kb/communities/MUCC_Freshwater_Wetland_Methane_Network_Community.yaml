ecological_interactions:
- name: Conserved Methane-Cycling Genera Across Wetlands
  description: MUCC combines nine wetland sites; five high-emitting marsh and swamp sites share five methanogen
    and three methanotroph genera under the authors occupancy definition. Core means present in at least one sample
    at every site in this subset, not present in every sample or a demonstrated stable mutualistic consortium. The
    canonical whole-community aggregate and Archaea/Bacteria guild participants are contextual placeholders, not
    all eight resolved genera. Genus occupancy and relative abundance do not establish niche partitioning or metabolic
    dependence.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Methane-cycle context, not measured partner-to-partner exchange or taxon-specific production flux.
  evidence:
  - reference: PMID:39843444
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: identify eight methane-cycling genera shared across wetlands
    explanation: Supports the eight core genera; the primary Results locate this core analysis in five marsh/swamp
      sites, not universal occupancy across every sample or all nine sites.
  - reference: PMID:39843444
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Microorganisms drive methane cycling
    explanation: General methane-cycle context only; this short statement does not establish a particular interaction
      mechanism.
  participating_taxa:
