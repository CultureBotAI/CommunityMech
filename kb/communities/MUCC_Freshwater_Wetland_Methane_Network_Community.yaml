related_ingredients:
- preferred_term: methane
  chebi_term:
    id: CHEBI:16183
    label: methane
  relevance: Methane is the integrating output of this freshwater-wetland
    network and the response variable the MUCC v2.0.0 cross-wetland analysis
    correlates with microbiome composition; an environment-analog medium
    targeting the hub methanogens would need methane headspace as a key product
    monitor.
  evidence:
  - reference: PMID:39843444
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: link microbiome composition to function and methane emissions
    explanation: Anchors methane as the headline functional output the MUCC
      network analysis links to community structure.
- preferred_term: methylated compounds
  chebi_term:
    id: CHEBI:17790
    label: methanol
  relevance: Methylotrophic methanogenesis is the functional potential the
    paper highlights as central across MUCC wetlands; methanol is the most
    abundantly studied methylated substrate routed through Methanoregula and
    other hub methanogens, so an environment-analog medium for this network
    would need a methylated C1 substrate at minimum.
  evidence:
  - reference: PMID:39843444
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: displays the functional potential for methylotrophic methanogenesis,
      highlighting the importance of this pathway in these ecosystems
    explanation: Anchors methylotrophic methanogenesis (methanol as
      representative substrate) as a pathway central to the MUCC network.
