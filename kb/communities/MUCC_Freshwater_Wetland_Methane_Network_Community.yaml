id: CommunityMech:000257
name: MUCC Freshwater Wetland Methane-Cycling Network Community
description: >
  A multi-site terrestrial freshwater wetland microbial community synthesis
  curated around the Multi-Omics for Understanding Climate Change (MUCC)
  v2.0.0 database. The study integrates 16S rRNA amplicon datasets,
  metagenomes, metatranscriptomes, and annual methane flux measurements across
  nine wetlands to link microbial community structure, methane-cycling guilds,
  decomposition networks, and methane emissions. It identifies eight
  methane-cycling genera shared across wetlands, highlights wetland-specific
  metabolic interactions in marshes, and reports Methanoregula as a hub
  methanogen and predictor of methane flux. The record is DOE-relevant because
  the study was supported by DOE Office of Science BER awards and included
  metagenomic and metatranscriptomic sequencing at the DOE Joint Genome
  Institute.
