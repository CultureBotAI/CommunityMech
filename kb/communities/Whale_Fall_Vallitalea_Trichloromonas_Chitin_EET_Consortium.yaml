environmental_factors:
- name: Crystalline Chitin and Poised Anode (+0.22 V vs. SHE)
  value: 0.01 g/mL colloidal chitin; +0.22 V vs. SHE poised carbon cloth electrode
  description: Insoluble crystalline chitin serves as the sole carbon and nitrogen source while a potentiostatically poised
    electrode (+0.22 V vs. SHE) or poorly crystalline iron(III) oxide acts as the terminal electron sink under anoxic marine
    conditions.
  evidence:
  - reference: PMID:42297039
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we used potentiostatically controlled bioelectrochemical reactors poised at +0.22 V vs. Standard Hydrogen
      Electrode, mimicking iron-reducing conditions, to enrich and characterize a chitin-degrading, metal-reducing microbial
      community from an anoxic deep-sea whale-fall sediment.
    explanation: Documents the poised bioelectrochemical reactor regime mimicking Fe(III)-reducing deep-sea sediment conditions.
