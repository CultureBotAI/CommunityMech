id: CommunityMech:000474
name: Deep-Sea Whale-Fall Vallitalea and Trichloromonas Chitin-Degrading Electrogenic Consortium
description: Anaerobic deep-sea whale-fall sediment microbial consortium and reconstituted defined co-culture enriched in
  potentiostatically controlled bioelectrochemical reactors poised at +0.22 V vs. SHE mimicking iron-reducing conditions.
  Primary chitin-degrading Vallitalea sp. hydrolyzes insoluble crystalline chitin and ferments oligomers to soluble intermediates
  (N-acetylglucosamine, glucose, acetate) that are cross-fed to iron-reducing, electrogenic Trichloromonas sp. performing
  extracellular electron transfer (EET) to electrodes or iron oxides.
