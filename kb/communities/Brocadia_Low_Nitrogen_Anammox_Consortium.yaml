    snippet: During early acclimation, Ca. Kuenenia reduced the expression of costly biosynthetic pathways
    explanation: Supports Ca. Kuenenia as the early-acclimation lineage tracked in the biofilter succession study.
ecological_interactions:
- name: Brocadia complementary low-nitrogen auxotrophy
  description: SMETANA modeling inferred complementary auxotrophies among the long-term Ca. Brocadia assemblage, consistent
    with potential cooperation rather than dominance by one superior anammox competitor.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ca. Brocadia low-nitrogen assemblage
    term:
      id: NCBITaxon:380240
      label: Candidatus Brocadia
  evidence:
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: characterized by complementary model-inferred auxotrophies
    explanation: Supports the computationally inferred auxiliary metabolite complementarity within the multispecies Ca. Brocadia
      assemblage.
    computational_provenance:
      prediction_type: METABOLIC_INTERACTION_SIMULATION
      tools:
      - tool_name: SMETANA
        role: infer species metabolic coupling and resource overlap in the Ca. Brocadia assemblage
      model_source: genome-scale models derived from the anammox biofilter metagenomic analysis
environmental_factors:
- name: Sustained low-substrate nitrogen stress
  description: The operated anammox biofilter was held under low-substrate nitrogen stress, the selective regime that accompanied
    functional succession from Ca. Kuenenia toward Ca. Brocadia.
  evidence:
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: unstable performance under low nitrogen
    explanation: Supports low-nitrogen operation as the relevant stress in mainstream anammox treatment.
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: operated an anammox biofilter under sustained low‑nitrogen stress
    explanation: Supports an operated anammox biofilter as the physical system used for the low-nitrogen experiment.
- name: Ca. Brocadia transcriptional activation
  value: about 18-fold anammox-gene upregulation
  description: Ca. Brocadia showed broad transcriptional activation under low-nitrogen operation, including a large increase
    in anammox-gene expression.
  evidence:
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Ca. Brocadia showed broad transcriptional activation
    explanation: Supports transcriptional activation of Ca. Brocadia during low-nitrogen operation.
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: anammox genes upregulated by
    explanation: Supports upregulation of Ca. Brocadia anammox genes during low-nitrogen operation.
- name: Lower modeled metabolic resource overlap
  value: 0.66 versus 0.77 in the high-nitrogen system
  description: The long-term Ca. Brocadia assemblage had lower predicted metabolic resource overlap than the high-nitrogen
    comparison community.
  evidence:
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: lower predicted metabolic resource overlap than that observed in the high-nitrogen system
    explanation: Supports lower modeled resource overlap as a distinguishing property of the low-nitrogen Brocadia assemblage.
    computational_provenance:
      prediction_type: METABOLIC_INTERACTION_SIMULATION
      tools:
      - tool_name: SMETANA
        role: predict metabolic resource overlap
