id: CommunityMech:000447
name: Brocadia Low-Nitrogen Anammox Consortium
description: A laboratory anammox biofilter community operated under sustained low-substrate nitrogen stress, where metagenomics,
  metatranscriptomics, co-occurrence networks, and SMETANA supported functional succession from Ca. Kuenenia toward a multispecies,
  transcriptionally active Ca. Brocadia assemblage with lower modeled resource overlap and complementary auxotrophies.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Identify ecological mechanisms that can stabilize mainstream anammox performance in low-strength wastewater.
  assembly_strategy: Operate an anammox biofilter under sustained low-substrate nitrogen stress and follow the transition
    from early Ca. Kuenenia activity to a long-term Ca. Brocadia assemblage.
  measurement_endpoints:
  - metagenomics
  - metatranscriptomics
  - co-occurrence networks
  - SMETANA metabolic interaction predictions
  evidence:
  - reference: PMID:42323145
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: combined metagenomics, metatranscriptomics, co-occurrence networks, and SMETANA
    explanation: Names the multi-omics, network, and genome-scale modeling readouts used to analyze the low-nitrogen anammox
      biofilter.
environment_term:
  preferred_term: laboratory low-nitrogen anammox biofilter
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The abstract identifies an operated anammox biofilter subjected to low-nitrogen stress; the accessible abstract does
    not expose the reactor geometry or feed recipe.
