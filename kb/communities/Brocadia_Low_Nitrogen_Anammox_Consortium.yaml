    evidence_source: COMPUTATIONAL
    snippet: Ca. Brocadia replaced Ca. Kuenenia as the dominant functional lineage
    explanation: Supports the dominant late-operation role of Ca. Brocadia in the low-nitrogen anammox biofilter.
  - reference: PMID:42323145
    supports: SUPPORT
