id: CommunityMech:000415
name: Algal-Methanotroph Biogas Valorization Coculture
description: A laboratory enriched haloalkaliphilic microalga-methanotroph co-culture assembled by mixing a halotolerant methanotrophic
  consortium with a non-axenic algal culture. Triplicate 2.1 L gas-tight glass bioreactors containing 450 mL 6% NaCl mineral
  salt medium were supplied with a 70:30 CH4:CO2 biogas headspace under light; after two external O2 additions, the culture
  maintained methane oxidation via algal O2 production and removed 92% CH4 and 89% CO2 while producing ectoine, hydroxyectoine,
  and carotenoids. Shotgun metagenomics identified Chlorella vulgaris and Dunaliella viridis as the dominant Chlorophyta,
  Methylotuvimicrobium as the dominant methanotroph, and Methylophaga plus Methylonatrum as co-dominant methylotrophs.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert biogas methane and carbon dioxide into microbial biomass, ectoine, hydroxyectoine, and carotenoid products
    under saline laboratory photobioreactor conditions.
  assembly_strategy: Mix a halotolerant methanotrophic bacterial consortium with a non-axenic algal enrichment culture in
    6% NaCl mineral salt medium.
  inoculation_strategy: Inoculate each 450 mL co-culture with 350 mL sterile mineral salt medium and 100 mL fresh inoculum
    split 50:50 v/v between the algal and methanotrophic cultures.
  perturbation_design: Compare triplicate algal, methanotrophic, and algal-methanotrophic co-culture reactors fed CH4/CO2
    biogas; add external O2 on days 13 and 15 as a start-up perturbation.
  measurement_endpoints:
  - Biomass accumulation
  - Methane and carbon dioxide removal
  - Shotgun metagenomic taxonomic composition
  - pmoCAB-bearing methanotroph relative abundance
  - Ectoine and hydroxyectoine production
  - Carotenoid production
  evidence:
  - reference: PMID:41745484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The methanotrophic inoculum was obtained from a Taylor reactor
    explanation: Identifies the source of the methane-oxidizing enrichment used to seed the co-culture.
  - reference: PMID:41745484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The algal inoculum consisted of a non-axenic culture
    explanation: Identifies the source algal enrichment used to assemble the co-culture.
  - reference: PMID:41745484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 50% algal culture and 50% methanotrophic culture
    explanation: Supports the mixed algal/methanotrophic inoculation design for the co-culture reactors.
  - reference: PMID:41745484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an external supply of O2 was added on days 13 and 15
    explanation: Supports external oxygen addition as a start-up perturbation.
