ecological_interactions:
- name: Pseudomonas-Centered Metabolic Facilitation
  description: 'Seven selected helper strains promote P. aeruginosa Q6 growth in spent-medium assays; only three
    of those pairs show bilateral positive effects. PARTIAL: differential substrate depletion and candidate secreted/consumed
    compounds, including N-acetyl serine, support potential cross-feeding, not compound-specific rescue, resolved
    stereochemistry or measured transfer in the rhizosphere. MUTUALISM cannot describe all seven helper pairs.'
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We identified that seven strains enhanced Pseudomonas aeruginosa Q6
    explanation: Supports the positive spent-medium effect of the seven selected partners on Q6.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among these, three strains engaged in mutualistic interactions
    explanation: Restricts bilateral benefits to three pairs rather than all seven.
  - reference: PMID:38840214
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: indicating metabolic cross-feeding potential among these species
    explanation: The metabolomic candidates support potential exchange, not a causal single-metabolite assay.
- name: SSC8 watermelon growth promotion without added pathogen
  description: The eight-member SSC8 improved ungrafted-watermelon growth in non-sterile greenhouse soil, with height,
    root weight and dry weight comparable to the parent16-member SBC. This simplified-consortium experiment had
    no added pathogen. The55.6% disease-index reduction and biofilm-pathway enrichment were measured for SBC and
    must not be assigned to SSC8; neither plant protection nor biofilm mediation is established by this growth assay.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: none of the treatments in this potting experiment were supplemented with pathogen
    explanation: Defines the no-added-pathogen scope of the simplified-consortium experiment.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the growth parameters of the SSC8 group plants, including plant height, root weight, and dry weight,
      were comparable to the initial SynCom (SBC) group
    explanation: Preserves positive SSC8 growth results without transferring the parent disease-challenge outcome.
