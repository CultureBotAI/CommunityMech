  evidence:
  - *id001
ecological_interactions:
- name: Pseudomonas-Centered Metabolic Facilitation
  description: Seven simplified-SynCom partners with low substrate-use overlap
    promote Pseudomonas aeruginosa Q6 growth through spent-medium metabolites,
    including N-acetyl-L-serine among compounds enriched in mutually
    interacting strains.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: N-acetyl-L-serine
    term:
      id: CHEBI:45441
      label: N-acetyl-L-serine
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Pseudomonas Biofilm Pathway Enrichment
    description: Metabolic facilitation by the seven helper strains supports the
      Pseudomonas-centered simplified community whose inoculation enriches
      Pseudomonas biofilm-formation functions in the rhizosphere.
  evidence:
  - *id001
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We identified compounds such as n-acetyl serine and lysine-hydroxyproline
    explanation: Names N-acetyl-L-serine as a spent-medium compound in strains with
      mutualistic effects on Pseudomonas aeruginosa Q6.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: increase in the relative abundance and biofilm-forming pathways of Pseudomonas
      post-SynCom inoculation
    explanation: Links the simplified SynCom phenotype to Pseudomonas biofilm-forming
      pathways in the inoculated rhizosphere.
- name: Pseudomonas Biofilm Pathway Enrichment
  description: SynCom inoculation increases Pseudomonas abundance and enriches
    Pseudomonas biofilm-synthesis pathway genes in the watermelon rhizosphere.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Watermelon Growth and Disease-Resistance Increase
    description: Pseudomonas biofilm-formation enrichment and rhizosphere
      colonization are linked to the SynCom's improved watermelon growth and
      Fusarium oxysporum resistance.
  evidence:
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: SynCom inoculation was found to substantially increase the abundance of rhizosphere
      Pseudomonas
    explanation: Supports Pseudomonas enrichment after SynCom inoculation in the
      watermelon rhizosphere.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: metagenomics analysis highlighted a significant enrichment of the Pseudomonas
      biofilm synthesis pathway in SynCom-treated groups
    explanation: Supports enrichment of Pseudomonas biofilm-formation functions
      in SynCom-inoculated rhizospheres.
- name: Watermelon Growth and Disease-Resistance Increase
  description: The grafted-rhizosphere SynCom increases ungrafted-watermelon
    growth and reduces Fusarium oxysporum disease pressure in non-sterile
    greenhouse soil.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom promoted ungrafted watermelon growth and alleviated disease
    explanation: Supports the SynCom plant-growth and Fusarium-wilt protection
      endpoint in non-sterile greenhouse soil.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: significantly lower disease index (with a 55.6% reduction) and F. oxysporum
      abundance
    explanation: Quantifies the disease-resistance endpoint for SynCom-treated,
      Fusarium-challenged watermelon plants.
environmental_factors:
- name: defined synthetic community design
  value: Initial 16 core bacterial strains from grafted watermelon rhizosphere were refined to eight synergistic
    bacteria centered on Pseudomonas.
  description: Ungrafted watermelon grown in non-sterile soil under soil-borne disease pressure.
  evidence:
  - *id001
related_ingredients:
- preferred_term: N-acetyl-L-serine
  chebi_term:
    id: CHEBI:45441
    label: N-acetyl-L-serine
  relevance: Identified cross-feeding metabolite — Qiao et al. 2024 specifically name N-acetyl serine
    in the spent-medium of strains showing mutualistic interactions with P. aeruginosa Q6, evidencing
    metabolic cross-feeding as the synergy mechanism underlying SSC8 plant-promoting performance.
  evidence:
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We identified compounds such as n-acetyl serine and lysine-hydroxyproline
    explanation: Names N-acetyl-L-serine as a verified cross-feeding metabolite in the simplified
      SynCom centered on Pseudomonas aeruginosa Q6.
growth_media:
- name: beef extract peptone broth (NB) medium
  temperature: '37'
  temperature_unit: °C
  shaking_speed: '170'
  shaking_speed_unit: rpm
  inoculum_size: '0.1'
  inoculum_unit: OD600
  preparation_notes: SynCom members were each grown overnight in NB medium, then centrifuged and
    re-suspended in sterile water to OD600 0.1 and mixed in equal volume (v/v) to establish the
    SynCom. The SynCom was applied to ungrafted watermelon seedlings (cultivar Zaojia 8424) in
    polypropylene pots filled with 600 g of non-sterile soil in a greenhouse (daytime 16 h at 30 °C,
    night 8 h at 26 °C).
  evidence:
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: each of the 16 core strains was inoculated in beef extract peptone broth (NB) medium
      and incubated overnight at 37℃ at 170 rpm
    explanation: Names the growth medium (NB), incubation temperature (37 °C) and shaking speed (170
      rpm) used to culture the SynCom member strains.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The fermentation broth of each strain was centrifuged at 4000 × g for 5 min and re-suspended
      in sterile water with OD600 adjusted to 0.1. The suspensions of the 16 strains were mixed in
      equal volume (v/v) to establish the SynCom.
    explanation: Gives the inoculum preparation and density (OD600 0.1) used to assemble and apply
      the SynCom.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'The pot experiments were run in a greenhouse (daytime: 16 h long at 30°C, night: 8 h
      long at 26°C) located in Nanjing Agriculture University.'
    explanation: Gives the greenhouse day/night temperature and photoperiod regime under which the
      inoculated watermelon plants (and rhizosphere SynCom) were grown.
  - reference: PMID:38840214
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Each replicate was run in polypropylene pots filled with 600 g of dry, non-sterile soil
      with no history of watermelon cultivation.
    explanation: Describes the pot/soil cultivation vessel for the SynCom-inoculated watermelon plants.
