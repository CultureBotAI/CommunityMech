id: CommunityMech:000183
name: Dehalococcoides-Syntrophomonas TCE Dechlorination Coculture
description: >
  A defined two-member anaerobic syntrophic coculture in which Dehalococcoides
  mccartyi strain 195 reductively dechlorinates trichloroethene while
  Syntrophomonas wolfei ferments butyrate or crotonate-derived carbon to provide
  hydrogen and acetate. The system is relevant to chlorinated-solvent groundwater
  bioremediation because it models interspecies hydrogen transfer and metabolite
  exchange that support TCE dechlorination by Dehalococcoides-containing
  communities.
ecological_state: STABLE
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Establish a defined syntrophic coculture for studying TCE dechlorination
    supported by butyrate fermentation and interspecies hydrogen transfer.
  assembly_strategy: Pair Dehalococcoides mccartyi strain 195 with Syntrophomonas
    wolfei in an anoxic defined medium containing TCE and fermentable fatty-acid
    substrates.
  inoculation_strategy: Initial cocultures were assembled from D. mccartyi 195 and
    S. wolfei under anaerobic, TCE-amended laboratory conditions.
  passaging_regimen: The established coculture was maintained as a sustainable
    syntrophic coculture on butyrate and TCE.
  perturbation_design: Compare strain 195 pure cultures and syntrophic cocultures,
    including electron donor limitation and isotope-fractionation tests under altered
    growth conditions.
  measurement_endpoints:
  - TCE dechlorination rate
  - Ethene and chlorinated ethene product formation
  - Hydrogen concentration
  - Cell abundance of strain 195 and S. wolfei
  - Coculture aggregation and interspecies distance
  - Carbon isotope fractionation of TCE
  evidence:
  - reference: PMID:25576615
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dehalococcoides mccartyi 195 (strain 195) and Syntrophomonas wolfei were grown
    explanation: Supports the two-member defined coculture composition and design.
  - reference: PMID:25576615
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: using butyrate as an electron donor and carbon source and trichloroethene
    explanation: Supports the design around butyrate-fed syntrophy coupled to TCE dechlorination.
  - reference: PMID:24015929
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dhc195 with Syntrophomonas wolfei
    explanation: Supports that a separate isotope-fractionation study used the same exact species composition.
