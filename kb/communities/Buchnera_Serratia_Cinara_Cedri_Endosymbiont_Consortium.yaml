id: CommunityMech:000148
name: Buchnera-Serratia Cinara cedri Endosymbiont Consortium
description: >
  A natural co-obligate aphid endosymbiont consortium in the cedar aphid Cinara cedri,
  composed of Buchnera aphidicola BCc and Serratia symbiotica SCc. Genome-based metabolic
  inference shows that Buchnera BCc has lost some ancestral nutritional functions, while
  Serratia SCc retains or takes over functions needed by the host-associated consortium,
  including shared tryptophan biosynthesis and broader metabolic complementation.
