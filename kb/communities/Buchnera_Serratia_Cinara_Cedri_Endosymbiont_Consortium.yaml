ecological_interactions:
- name: Shared Tryptophan Biosynthesis
  description: Tryptophan biosynthesis is partitioned across Buchnera aphidicola BCc and Serratia symbiotica
    SCc, creating a metabolic dependency between the two endosymbionts.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: Buchnera aphidicola BCc
    term:
      id: NCBITaxon:372461
      label: Buchnera aphidicola BCc
  target_taxon:
    preferred_term: Serratia symbiotica SCc
    term:
      id: NCBITaxon:138074
      label: Serratia symbiotica
  metabolites:
  - preferred_term: L-tryptophan
    term:
      id: CHEBI:16828
      label: L-tryptophan
    notes: Essential amino acid with pathway partitioning across the two symbionts.
  biological_processes:
  - preferred_term: tryptophan biosynthetic process
    term:
      id: GO:0000162
      label: L-tryptophan biosynthetic process
    notes: Biosynthetic pathway shared by the two endosymbionts.
  evidence:
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the biosynthesis of tryptophan is shared with the endosymbiont Serratia symbiotica SCc
    explanation: Supports partitioning of tryptophan biosynthesis between Buchnera and Serratia.
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: both bacteria are involved in the synthesis of tryptophan
    explanation: Supports both endosymbionts contributing to the tryptophan pathway.
- name: Serratia Takeover of Lost Buchnera Functions
  description: Genome-based metabolic inference indicates that functions carried out by Buchnera in other
    aphids are either retained in Buchnera BCc or taken over by Serratia SCc in Cinara cedri.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Serratia symbiotica SCc
    term:
      id: NCBITaxon:138074
      label: Serratia symbiotica
  target_taxon:
    preferred_term: Buchnera aphidicola BCc
    term:
      id: NCBITaxon:372461
      label: Buchnera aphidicola BCc
  metabolites:
  - preferred_term: riboflavin
    term:
      id: CHEBI:17015
      label: riboflavin
    notes: Buchnera BCc was reported as unable to synthesize riboflavin.
  evidence:
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: taken over by S. symbiotica
    explanation: Supports Serratia complementation of functions missing from Buchnera BCc.
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: not able to synthesize tryptophan and riboflavin
    explanation: Supports loss of Buchnera nutritional functions that require consortium complementation.
- name: Stable Co-obligate Metabolic Complementation
  description: The paired endosymbionts form a stable consortium through multiple cases of metabolic
    complementation, preserving both bacterial partners in the aphid host context.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Buchnera aphidicola BCc
    term:
      id: NCBITaxon:372461
      label: Buchnera aphidicola BCc
  target_taxon:
    preferred_term: Serratia symbiotica SCc
    term:
      id: NCBITaxon:138074
      label: Serratia symbiotica
  evidence:
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: metabolic complementation giving functional stability to the whole consortium
    explanation: Supports stable consortium-level complementation.
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: both bacteria are evolving together towards the establishment of a powerful consortium
    explanation: Supports preservation of both symbionts as a coevolving consortium.
environmental_factors:
- name: aphid phloem-sap nutritional constraint
  value: nutrient-deficient phloem diet
  description: Aphid hosts feed on phloem sap with nutritional deficiencies, selecting for bacterial
    nutritional symbioses that provide amino acids and vitamins.
  evidence:
  - reference: doi:10.1371/journal.pgen.1002357
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: phloem sap, which has unbalanced nitrogen/carbon content and is deficient
    explanation: Supports the nutritional context driving the endosymbiont consortium.
