ecological_interactions:
- name: Shared Tryptophan Biosynthesis
  description: COMPUTATIONAL - genome reconstruction partitions tryptophan biosynthesis between Buchnera BCc trpEG,
    predicted to supply anthranilate, and Serratia SCc trpABCD, predicted to complete tryptophan synthesis. PARTIAL
    - inferred intermediate exchange is cross-feeding, not thermodynamic syntrophy or experimentally traced transport
    across the distinct bacteriocytes.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Buchnera aphidicola BCc
    term:
      id: NCBITaxon:372461
      label: Buchnera aphidicola BCc
  target_taxon:
