    term:
      id: NCBITaxon:138074
      label: Serratia symbiotica
  metabolites:
  - preferred_term: L-tryptophan
    term:
      id: CHEBI:16828
      label: L-tryptophan
    notes: Predicted final pathway product; anthranilate, not tryptophan, is the proposed Buchnera-to-Serratia intermediate.
  biological_processes:
  - preferred_term: tryptophan biosynthetic process
    term:
      id: GO:0000162
      label: L-tryptophan biosynthetic process
    notes: Biosynthetic pathway shared by the two endosymbionts.
  evidence:
  - reference: doi:10.1371/journal.pgen.1002357
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the biosynthesis of tryptophan is shared with the endosymbiont Serratia symbiotica SCc
    explanation: Genome content supports pathway partitioning and proposed exchange, not measured donor-resolved
      metabolite flux.
  downstream:
  - target: Inferred Co-obligate Metabolic Complementation
    description: HYPOTHESIZED - partitioned tryptophan capacity could favor preservation of both partners by making
      complete nutrition depend on their complementary reactions. This is a source-proposed evolutionary mechanism,
      not a measured perturbation of consortium stability.
- name: Serratia Takeover of Lost Buchnera Functions
  description: COMPUTATIONAL - genome comparison indicates that Serratia SCc retains biosynthetic capacity absent
    from Buchnera BCc, including riboflavin provision in the inferred consortium. PARTIAL - nutritional complementation
    is proposed from gene content; synthesis capacity does not establish export of every product, transport route
    or reciprocal fitness magnitude.
