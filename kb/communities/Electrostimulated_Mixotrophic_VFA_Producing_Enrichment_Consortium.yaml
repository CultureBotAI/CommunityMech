ecological_interactions:
- name: HRT-Driven Mixotrophic Consortium Enrichment
  description: A single electrostimulated reactor underwent sequential HRT phases and intervening batch assays.
    Its changing composition and outputs support an operational association, not an independently replicated HRT-only
    effect. Participants are representative genera, not the complete enrichment roster.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  downstream:
  - target: Planktonic and Electrode-Biofilm Spatial Partitioning
    description: PARTIAL - altered residence time may select community composition, but sequential operation and
      batch interruptions do not isolate its contribution to the endpoint compartment difference.
  evidence:
  - reference: doi:10.21203/rs.3.rs-9518331/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A continuous electrostimulated bioreactor was operated at a constant potential of 300 mV for approximately
      1200 h under three HRTs
    explanation: 'Defines the 300 mV continuous reactor and hydraulic-retention-time series that selected the enrichment
      consortium.

      '
  - reference: doi:10.21203/rs.3.rs-9518331/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Decreasing HRT promoted the enrichment of a specialized mixotrophic consortium
    explanation: 'Directly supports the reduced-HRT enrichment of a specialized mixotrophic community.

      '
  - reference: doi:10.21203/rs.3.rs-9518331/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Reducing HRT enhanced inorganic carbon utilization and selectively increased acetate production
    explanation: 'Supports the connection between HRT reduction, inorganic-carbon use, and acetate-selective production.

      '
