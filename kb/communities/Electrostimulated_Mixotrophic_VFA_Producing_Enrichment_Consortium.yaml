id: CommunityMech:000287
name: Electrostimulated Mixotrophic VFA-producing Enrichment Consortium
description: A specialized mixotrophic microbial consortium enriched in a continuous electrostimulated
  bioreactor operated at a constant potential of 300 mV for CO2 conversion into volatile fatty acids.
  Decreasing hydraulic retention time (HRT) selected for a spatially organized community in which
  Enterococcus and Clostridium dominated the planktonic phase while Desulfovibrio and Enterococcus were
  enriched in the electrode biofilm. This syntrophic organization enhanced biomass-specific inorganic
  carbon removal and redirected carbon flux toward acetate, a key product of acetogenic pathways, with
  electrode-associated taxa contributing reducing equivalents that supported autotrophic CO2/HCO3-
  fixation.
