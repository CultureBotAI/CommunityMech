    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the gut bacterial consortia enriched in the media of R2A including kanamycin (R2A + Kan), R2A, and Gauze's Synthetic
      Medium No.1 (GM1) significantly improved the shrimp fitness
    explanation: Identifies the three source enrichment media whose consortia improved shrimp fitness.
  - *id001
