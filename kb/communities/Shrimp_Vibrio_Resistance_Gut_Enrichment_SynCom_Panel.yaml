id: CommunityMech:000436
name: Shrimp Vibrio-Resistance Gut-Enrichment SynCom Panel
description: A four-SynCom panel constructed from shrimp gut bacterial enrichment cultures screened for resistance to Vibrio
  parahaemolyticus infection. Shen et al. enriched gut consortia in R2A plus kanamycin, R2A, and Gauze's Synthetic Medium
  No.1, isolated eight corresponding key bacterial strains from enriched genera, and assembled SynComAll, SynCom R2A+Kan,
  SynCom R2A, and SynCom GM1; addition of these SynComs improved shrimp fitness and conferred protection against V. parahaemolyticus
  infection.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct indigenous shrimp-gut SynComs that improve shrimp fitness and resistance to V. parahaemolyticus infection.
  assembly_strategy: Screen gut bacterial consortia enriched in R2A plus kanamycin, R2A, and Gauze's Synthetic Medium No.1
    for V. parahaemolyticus resistance, resolve high-resistance consortium composition by bacterial community sequencing,
    isolate eight corresponding strains from the key enriched genera, and combine them as SynComAll plus three source-medium
    sub-SynComs.
  measurement_endpoints:
  - shrimp fitness
  - shrimp survival after Vibrio infection
  - gut bacterial community composition
  - Vibrio parahaemolyticus FX1 resistance
  notes: The accessible Europe PMC abstract identifies the three enrichment media, eight genus-level source taxa, and four
    SynCom variants, but it does not expose the exact isolate names, species, strain accessions, kanamycin concentration,
    mixing ratios, or shrimp challenge protocol.
  evidence:
  - reference: doi:10.1016/j.aquaculture.2025.743350
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: multiple gut bacterial consortia enriched in different media were obtained to screen the bacterial consortia
      with high resistance against Vibrio parahaemolyticus infection
    explanation: Establishes that the source screened gut-derived enrichment cultures for resistance to V. parahaemolyticus
      infection.
  - reference: doi:10.1016/j.aquaculture.2025.743350
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Eight corresponding bacterial strains were isolated from these gut bacterial consortia, and were used to construct
      four SynComs
    explanation: Supports construction of a four-SynCom panel from the eight isolated gut-enrichment strains.
