ecological_interactions:
- name: Shrimp protection against Vibrio parahaemolyticus infection
  description: The SynCom panel improved shrimp fitness and conferred protection against V. parahaemolyticus infection. Because
    the accessible abstract reports the response at whole-SynCom level, this is represented as a community-level host-protection
    phenotype rather than a genus-to-pathogen antagonism edge.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.1016/j.aquaculture.2025.743350
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Addition of these SynComs not only improved shrimp fitness but also conferred protection against V. parahaemolyticus
      infection.
    explanation: Supports the community-level shrimp fitness and V. parahaemolyticus infection-protection phenotype.
environmental_factors:
- name: Vibrio parahaemolyticus FX1 infection challenge
  value: V. parahaemolyticus FX1 resistance assay
  description: The key taxa were selected from shrimp gut consortia with high resistance against V. parahaemolyticus FX1 infection,
    and the assembled SynComs were evaluated for V. parahaemolyticus protection.
  evidence:
  - reference: doi:10.1016/j.aquaculture.2025.743350
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Based on the bacterial community composition of gut bacterial consortia with high-resistance against V. parahaemolyticus
      FX1 infection, eight key taxa with relative abundances >0.01 % were identified as potential V. parahaemolyticus FX1-resistant
      candidates.
    explanation: Supports the V. parahaemolyticus FX1 challenge context used to choose the eight key taxa.
growth_media:
- name: R2A plus kanamycin shrimp-gut enrichment medium
  preparation_notes: R2A including kanamycin was one of the shrimp gut enrichment media that yielded key taxa for the four-SynCom
