ecological_interactions:
- name: Delta nrfA nitrate-to-nitrite supply for anammox
  description: Deleting nrfA in S. oneidensis MR-1 blocks terminal DNRA reduction of nitrite to ammonium. In the Delta-B batch
    cultures this diverted nitrate reduction toward nitrite accumulation, enriched the Brocadia-containing anammox guild,
    and let the sludge community route ammonium plus nitrite toward total-nitrogen removal instead of losing anammox contribution
    to excess ammonium production.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
