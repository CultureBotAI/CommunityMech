id: CommunityMech:000402
name: Delta nrfA Shewanella-Anammox Nitrite Coupled Consortium
description: Engineered anaerobic batch-culture consortium pairing activated anammox sludge from a full-scale municipal wastewater
  process with an nrfA-deficient Shewanella oneidensis MR-1 mutant. The Delta nrfA strain was inoculated into nitrate- and
  ammonium-containing mixed medium with sludge from an up-flow anaerobic sludge blanket reactor; blocking the terminal nitrite-to-ammonium
  DNRA step favored nitrite accumulation, enriched Candidatus Brocadia anammox bacteria, and made the 5:1 anammox-sludge-to-mutant
  culture the fastest and highest total-nitrogen removal treatment at 97%.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Couple anammox sludge with nitrate-respiring S. oneidensis MR-1 while using an nrfA knockout to accumulate nitrite
    for anammox instead of completing DNRA to ammonium.
  assembly_strategy: Activate municipal anammox sludge in a UASB reactor, grow wild-type or Delta nrfA S. oneidensis MR-1
    separately in LB, and add OD600-standardized Shewanella culture to anammox sludge in sealed 500 mL mixed-medium reagent
    bottles.
  perturbation_design: Compare anammox-only controls, wild-type S. oneidensis MR-1 additions, and Delta nrfA S. oneidensis
    MR-1 additions across 25:0 through 25:25 mL sludge:Shewanella inoculum volumes in 500 mL batch cultures.
  measurement_endpoints:
  - NH4+-N, NO2--N, NO3--N, COD, and total nitrogen through 9-11 sampling points
  - Final-time-point metagenomic community structure by Illumina NovaSeq X Plus sequencing and DIAMOND/Micro_NR LCA species
    annotation
  - Nitrogen- and carbon-metabolism functional gene abundance
  - Dissolved EPS by three-dimensional excitation-emission matrix fluorescence
  evidence:
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we constructed a novel coupled system integrating anammox with Shewanella oneidensis MR‐1
    explanation: Names the engineered anammox/S. oneidensis coupling design.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both S. oneidensis MR‐1 and Δ nrfA S. oneidensis MR‐1 were provided by Professor Qiu
    explanation: Names the wild-type and Delta nrfA MR-1 strains compared in the batch-culture design.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'ΔB1: M (470 mL) + A (25 mL) + ΔS (5 mL)'
    explanation: Defines the optimized Delta nrfA treatment as 470 mL mixed medium, 25 mL anammox sludge, and 5 mL mutant
      culture.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Samples were collected every 8 h, totaling 9–11 sampling events
    explanation: Supports the repeated sampling scheme for nitrogen-removal measurements.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The sequencing was performed using the Illumina NovaSeq X Plus sequencing system.
    explanation: Supports metagenomic sequencing as the community-structure endpoint.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Approximately 30 mL of the sludge–water mixture from the final time point was stored at −80°C
    explanation: Supports the final-time-point sludge-water mixture used for metagenomics.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Unigenes were aligned against Micro_NR using DIAMOND software
    explanation: Supports DIAMOND/Micro_NR alignment for taxonomic annotation.
