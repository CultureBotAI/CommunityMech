    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: all experimental groups achieved 100% NO 3 − ‐N removal efficiency
    explanation: Supports complete nitrate removal in the mutant experimental groups.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the addition of ΔnrfA S. oneidensis MR‐1 enhanced the reduction of NO 3 − ‐N to NO 2 − ‐N
    explanation: Supports nitrate-to-nitrite enhancement by the Delta nrfA strain.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Crucially, the ΔnrfA mutant may effectively block the terminal reduction of nitrite to ammonium via the Nap/Nrf
      pathway.
    explanation: Supports nrfA deletion as the engineered block in terminal DNRA to ammonium.
  - reference: PMID:42655905
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Metagenomic analysis revealed that this configuration enriched anammox bacteria (Candidatus Brocadia ) and enhanced
      the abundance of key anammox genes ( hzs and hdh )
    explanation: Supports Brocadia/anammox-gene enrichment in the optimized 5:1 mutant coupled system.
- name: Mutant dosage window for anammox performance
  description: Adding a small Delta nrfA S. oneidensis MR-1 inoculum to anammox sludge improved nitrogen-removal kinetics,
    but increasing the mutant culture fraction caused nitrite and ammonium accumulation patterns consistent with reduced anammox
    contribution. The optimal Delta B1 treatment kept 25 mL anammox sludge with 5 mL mutant culture in 500 mL total liquid,
    a 5:1 sludge-to-mutant culture-volume ratio.
