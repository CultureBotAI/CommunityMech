ecological_interactions:
- name: B. breve 2'FL Transporter Constraint
  description: The FT-1 B. breve isolate did not grow on 2'FL or fucose alone but grew on lactose. Genomic searches
    found a predicted intracellular GH95 fucosidase and no identifiable 2'FL transporter. PARTIAL - this is a candidate
    explanation for substrate limitation, not a transporter knockout or a cause of donor hydrolysis.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  metabolites:
