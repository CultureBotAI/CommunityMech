id: CommunityMech:000220
name: Bifidobacterium-Ruminococcus Infant HMO Cross-Feeding Coculture
description: >
  An infant gut microbiome cross-feeding system reconstructed from
  individualized cultivations with three infant fecal inocula and supplemented
  with the human milk oligosaccharide 2'-fucosyllactose (2'FL). Bifidobacterium
  breve typically cannot metabolize 2'FL on its own, but extracellular
  fucosidases encoded by coexisting Ruminococcus gnavus release lactose from
  2'FL and unlock extensive B. breve growth. Targeted cocultures and
  supplementation of R. gnavus into an infant microbiome showed that R. gnavus
  promotes B. breve growth through HMO breakdown, demonstrating that infant
  HMO utilization depends on synergistic interactions among coexisting species.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Establish whether human milk oligosaccharide (2'FL) utilization in
    the infant gut can be mediated by synergistic interactions among coexisting
    species rather than by isolated metabolizers.
  assembly_strategy: Establish individualized microbiomes from three infant
    fecal inocula and supplement with 2'FL; complement with targeted cocultures
    of Bifidobacterium breve and Ruminococcus gnavus and with R. gnavus
    supplementation into an infant microbiome.
  perturbation_design: Compare B. breve growth with and without R. gnavus, and
    measure microbiome responses to 2'FL across individualized infant inocula.
  measurement_endpoints:
  - B. breve growth on 2'FL with and without R. gnavus
  - Microbiome compositional response to 2'FL
  - Genomically predicted extracellular fucosidase activity
  evidence:
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: establishing individualized microbiomes using fecal samples from
      three infants as the inocula
    explanation: Supports the individualized-microbiome cultivation design.
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: R. gnavus can promote extensive growth of B. breve through the
      release of lactose from 2'FL
    explanation: Supports the cross-feeding mechanism as the curated objective.
