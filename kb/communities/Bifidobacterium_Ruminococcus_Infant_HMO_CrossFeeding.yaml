- name: Individualized HMO Utilization Capacity
  description: HMO utilization varies with the individual infant microbiome
    composition, reflecting whether coexisting species can supply extracellular
    fucosidase activity.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:37973815
