ecological_interactions:
- name: B. breve 2'FL Transporter Constraint
  description: >
    The FT-1 Bifidobacterium breve isolate could not grow with 2'FL as
    its sole carbohydrate source because it carried only an intracellular GH95
    fucosidase and lacked 2'FL transporters, making external 2'FL cleavage
    by a partner the prerequisite for lactose release and B. breve expansion.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  metabolites:
  - preferred_term: 2'-fucosyllactose
    term:
      id: CHEBI:147155
      label: 2'-fucosyllactose
  - preferred_term: lactose
    term:
      id: CHEBI:36219
      label: alpha-lactose
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  downstream:
  - target: R. gnavus 2'FL Hydrolysis Feeds B. breve
    description: >
      Because the FT-1 B. breve isolate could not directly use 2'FL,
      growth on this HMO required extracellular cleavage by R. gnavus.
  evidence:
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B. breve from FT-1 cannot metabolize 2’FL
    explanation: >
      Supports the absence of direct 2'FL utilization by the FT-1 B. breve isolate.
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: B. breve encoded one fucosidase, GH95, but this gene was predicted to be intracellular
    explanation: >
      Supports the genomic explanation for B. breve's dependence on extracellular
      HMO cleavage by other community members.
- name: R. gnavus Extracellular Fucosidase Capacity
  description: >
    Ruminococcus gnavus was the only FT-1 organism besides B. breve predicted
    to encode fucosidases; it carried six fucosidase genes, including one GH29
    and one GH95 predicted to be extracellular, positioning R. gnavus as the
    community member able to open 2'FL for lactose cross-feeding.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ruminococcus gnavus
    term:
      id: NCBITaxon:33038
      label: Mediterraneibacter gnavus
  target_taxon:
