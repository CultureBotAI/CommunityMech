      label: alpha-lactose
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  downstream:
  - target: R. gnavus 2'FL Hydrolysis Feeds B. breve
    description: >
      The predicted extracellular fucosidase activity is the genomic route
      through which R. gnavus can hydrolyze 2'FL and release lactose.
  - target: R. gnavus PT-1 2'FL Rescue
    description: >
      Adding the extracellular-fucosidase producer supplied the 2'FL-opening
      capacity missing from the unsupplemented PT-1 community.
  evidence:
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      R. gnavus was the only organism besides B. breve in FT-1 whose genome
      encodes fucosidases
    explanation: Identifies R. gnavus as the candidate 2'FL-cleaving partner in FT-1.
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      it encodes six fucosidase genes (three GH29 and three GH95 genes), two of
      which (one GH29 and one GH95 gene) were predicted to be extracellular
    explanation: >
      Supports the extracellular-fucosidase mechanism for R. gnavus-mediated
      2'FL cleavage.
- name: R. gnavus 2'FL Hydrolysis Feeds B. breve
  description: >
    In 2'FL-only medium, the FT-1 R. gnavus isolate grew while the FT-1
    B. breve isolate did not; their co-culture outperformed R. gnavus alone
    because R. gnavus released lactose from 2'FL and made that carbohydrate
    available to B. breve.
