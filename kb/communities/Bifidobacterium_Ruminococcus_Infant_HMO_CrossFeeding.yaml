      label: lactose
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B. breve from FT-1 cannot metabolize 2’FL
    explanation: 'Supports the absence of direct 2''FL utilization by the FT-1 B. breve isolate.

      '
  - reference: PMID:37973815
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: B. breve encoded one fucosidase, GH95, but this gene was predicted to be intracellular
    explanation: Supports predicted intracellular localization; functional sufficiency and transporter necessity
      were not demonstrated by this annotation.
- name: R. gnavus Extracellular Fucosidase Capacity
  description: COMPUTATIONAL POTENTIAL - FT-1 R. gnavus encoded six fucosidase genes, two predicted to be extracellular.
    This supplies a candidate molecular route for 2'FL cleavage, not directly measured extracellular activity or
    proof that the same donor explains every infant community.
