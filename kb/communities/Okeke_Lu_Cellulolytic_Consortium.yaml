ecological_interactions:
- name: Cellulose-Hydrolyzing Isolate Enzyme Activities
  description: 'Selected members of the five-isolate consortium had measured cellulolytic activity in individual
    isolate cultures: DB1 and DB2 filter-paper cellulase activities were 27.83 and 31.22 U per mg, and DB1 beta-glucosidase
    was 18.07 U per mg. These positive isolate results support the consortium design, not a directly measured combined-culture
    rate or obligate syntrophy in the accessible abstract.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  downstream:
  - target: Proposed Complementary Lignocellulose Hydrolysis
    description: HYPOTHESIZED - Measured isolate hydrolases provide the cellulose-hydrolysis branch proposed to
      complement the other enzyme activities in the assembled consortium. The causal contribution is biochemical
      potential inferred from isolate assays and consortium construction, not a measured increase in combined-culture
      degradation or demonstrated synergistic flux.
  evidence:
  - reference: PMID:20859703
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Isolates DB1 and DB2 displayed the highest filter paper cellulase: 27.83 and 31.22 U mg⁻¹, respectively.'
    explanation: Directly supports individual DB1/DB2 cellulase activities rather than a proposed future processing
      benefit.
- name: Xylan-Hydrolyzing Isolate Enzyme Activities
  description: Isolate DB2 produced the highest xylanase activity, 103.05 U per mg, and DB13 the highest beta-xylosidase
    activity, 7.72 U per mg, in the tested isolate panel. These observed activities support a hemicellulose-hydrolysis
    contribution to the defined five-isolate design; the accessible abstract does not supply a combined-culture
    activity or demonstrate obligate metabolic exchange.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: xylan
    term:
      id: CHEBI:37166
      label: xylan
  - preferred_term: xylose
    term:
      id: CHEBI:18222
      label: xylose
  biological_processes:
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  downstream:
  - target: Proposed Complementary Lignocellulose Hydrolysis
    description: HYPOTHESIZED - Measured isolate hydrolases provide the hemicellulose-hydrolysis branch proposed
      to complement the other enzyme activities in the assembled consortium. The causal contribution is biochemical
      potential inferred from isolate assays and consortium construction, not a measured increase in combined-culture
      degradation or demonstrated synergistic flux.
  evidence:
  - reference: PMID:20859703
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolate DB2 produced the highest xylanase activity (103.05 U mg⁻¹), while the highest β-xylosidase
      activity (7.72 U mg⁻¹) was observed with DB13
    explanation: Directly reports DB2/DB13 isolate enzyme activities, not the activity of the assembled community.
- name: Proposed Complementary Lignocellulose Hydrolysis
  description: HYPOTHESIZED - Five selected isolates were assembled into a defined consortium with cellulolytic
    and xylanolytic capabilities. Their complementary enzyme activities could broaden cellulose/hemicellulose processing
    and reduce incomplete-enzyme limitations. The accessible primary abstract proposes this benefit; it does not
    quantify synergy above additive monoculture activities, relief of product inhibition, lower enzyme demand or
    lignin breakdown. Full-text experiments remain uninspected behind subscription access, not demonstrated absent.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignocellulose
    term:
      id: CHEBI:180683
      label: lignocellulose
  biological_processes:
  - preferred_term: polysaccharide catabolic process
    term:
      id: GO:0000272
      label: polysaccharide catabolic process
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:20859703
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Five selected isolates (DB1, DB2, DB7, DB8, and DB13) were used to compose a defined consortium and
      characterized by 16S ribosomal RNA gene sequence analysis.
    explanation: Supports the five-isolate defined consortium assembled from the cellulolytic-xylanolytic enrichment.
  - reference: PMID:20859703
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Use of microbial consortium in bioprocessing of lignocelluloses could reduce problems such as incomplete
      synergistic enzymes, end-product inhibition, adsorption, and requirement for high amounts of enzymes in direct
      use of enzymes.
    explanation: The authors propose potential processing benefits; this is not a quantitative combined-consortium
      superiority result.
