- name: Carboxymethyl cellulose mineral medium for cellulolytic enrichment
  atmosphere: AEROBIC
  temperature: '30'
  temperature_unit: degrees Celsius
  temperature_range: 28-37
  preparation_notes: 'Mineral salts medium supplemented with carboxymethyl cellulose (CMC) as cellulose
    substrate for enrichment and isolation of cellulolytic bacteria from Alabama soil. The consortium
    was composed from 19 purified monocultures evaluated for cellulolytic-xylanolytic potential, with
    5 selected isolates (DB1, DB2, DB7, DB8, DB13) chosen based on high enzyme production. All strains
    are aerobic or facultatively anaerobic. Isolates DB1 and DB2 displayed the highest filter paper cellulase
    activity (27.83 and 31.22 U/mg). The defined consortium produces complete enzyme system: filter paper
    cellulase, beta-glucosidase, xylanase, and beta-xylosidase for comprehensive lignocellulose bioprocessing.

    '
