environmental_factors:
- name: Extreme Acidity for Gallium Dissolution
  value: 1.0-1.5
  unit: pH
  description: 'Extremely low pH maintained by biogenic sulfuric acid generation from sulfur oxidation
    by At. thiooxidans. The bioreactor operates at pH 1.0-1.5, producing acidic lixiviant that is transferred
    to the leaching reactor where spent lixiviant at pH 1.5 attacks LED waste. This extreme acidity is
    essential for: (1) dissolving gallium from GaN semiconductor materials, (2) maintaining Fe³⁺ in soluble
    ferric form rather than precipitating as hydroxides, (3) protonating metal oxide and nitride surfaces
    to enhance lixiviant attack, and (4) creating selective conditions favoring specialized acidophiles
    while excluding contaminants. The pH 1.0-1.5 range is among the most acidic bioprocesses and requires
    the consortium''s specialized acid-tolerant organisms.

    '
  evidence:
  - reference: doi:10.1016/j.jece.2025.120403
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A. thiooxidans in the mixed bacterial community oxidizes the elemental sulfur to generate
      sulfuric acid, thereby decreasing the pH to 1.53.
    explanation: Zhang et al. 2025 confirm biogenic sulfuric-acid generation by A. thiooxidans drives
      the system to pH ~1.5, supporting the extreme-acidity operating range of this factor. Snippet
      verified verbatim in the cached reference.
- name: LED Waste Pulp Density
  value: '15'
  unit: g/L
  description: 'LED waste concentration in the leaching reactor is maintained at 15 g/L pulp density,
    representing the optimal balance between gallium recovery efficiency and processing throughput. At
    this concentration, the biogenic lixiviant achieves 99.5% gallium extraction in 3 days. Higher pulp
    densities would increase gallium yield per batch but might require longer leaching times or reduce
    efficiency due to lixiviant depletion. Lower densities would reduce processing capacity. The 15 g/L
    optimization reflects the lixiviant strength (pH 1.5, Fe³⁺ content) and LED material composition (GaN
    layers, copper, nickel). Crushed LED particles provide surface area for acid attack while avoiding
    excessive solids loading that would impede liquid-solid contact.

    '
  evidence:
  - reference: doi:10.1016/j.jece.2025.120403
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The biogenic lixiviants achieved a Ga leaching efficiency of 99.5 % in 15 g/L pulp density
      during 3 days of non-contact bioleaching.
    explanation: Zhang et al. 2025 report the operating pulp density (15 g/L) at which the mixed
      consortium's biogenic lixiviant achieves 99.5% gallium recovery in 3 days. Snippet verified
      verbatim in the cached reference.
- name: Rapid Leaching Duration
  value: '3'
  unit: days
  description: 'The non-contact bioleaching process achieves 99.5% gallium recovery in just 3 days at
    15 g/L pulp density, representing exceptionally fast kinetics compared to conventional bioleaching
    methods that typically require weeks. This rapid performance reflects: (1) the high acidity (pH 1.5)
    and oxidizing power of the biogenic lixiviant, (2) the non-contact design that optimizes both microbial
    acid production and chemical leaching without compromising either stage, and (3) the synergistic activity
    of the mixed 1:1:1 consortium providing both sulfuric acid and ferric iron lixiviants. The 3-day duration
    makes this process economically viable for industrial gallium recovery from LED waste, enabling high
    throughput and rapid return on investment. Shorter processing times also reduce operational costs
    for bioreactor maintenance, aeration, and temperature control.

    '
  evidence:
  - reference: doi:10.1016/j.jece.2025.120403
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In addition, the biogenic lixiviants prevented microbial toxicity caused by high pulp
      density and shortened the leaching time from 10 to 30 days to 3 days.
    explanation: Zhang et al. 2025 explicitly report the non-contact biogenic-lixiviant process
      shortened leaching time to 3 days versus the conventional 10-30 days, directly supporting the
      rapid-leaching-duration claim. Snippet verified verbatim in the cached reference.
