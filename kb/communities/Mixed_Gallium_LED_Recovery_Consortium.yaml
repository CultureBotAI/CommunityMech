    community output, not a commensal interaction or proof of continuous lixiviant recycling. The primary abstract
    also reports contact-associated gallium adsorption up to 21.43% and proposes a role for bound extracellular
    polymers; the component-specific adsorption mechanism and its contribution to the recovery difference remain
