ecological_interactions:
- name: Synthetic Community Fermentation-Enzyme Production
  description: The four reported bacterial/fungal degraders form an enzyme-producing inoculum that yields the crude
    enzyme solution used for wheat-straw pretreatment. This positive process output does not measure reciprocal
    fitness, member-specific enzyme contributions or metabolite cross-feeding. The accessible abstract does not
    resolve strain identities or establish that the four isolates constitute the downstream anaerobic-digestion
    community.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignocellulose
    term:
      id: CHEBI:180683
      label: lignocellulose
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  downstream:
  - target: Lignocellulose Enzyme Pretreatment
    description: Fermentation supplies the crude enzyme solution applied to wheat straw, enabling the measured polymer-degradation
      pretreatment. This is an enzyme-mediated material-transfer step, not proof that the living four-member inoculum
      colonizes every subsequent process stage.
  evidence:
  - reference: PMID:38748977
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic microbial communities were constructed for fermentation-enzyme production
    explanation: Supports the fermentation-enzyme production step driven by the constructed degrader community.
- name: Lignocellulose Enzyme Pretreatment
  description: Crude enzyme solution from the synthetic community was applied to wheat straw before anaerobic digestion.
    Reported cellulose, hemicellulose and lignin degradation rates were 39.85%, 36.99% and 19.21%, respectively.
    The treatment acts through the enzyme preparation; these values do not establish reciprocal microbial benefit
    or living producer growth on the pretreated substrate.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
  - preferred_term: hemicellulose
    term:
      id: CHEBI:61266
      label: hemicellulose
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  downstream:
  - target: Enhanced Biogas Production after Anaerobic Digestion
    description: The enzyme-pretreated straw supplies substrate to subsequent anaerobic digestion, where cumulative
      biogas was higher than with untreated straw or either commercial-enzyme pretreatment. Retain this process-level
      treatment effect without assigning gas production to the four enzyme producers or to one uniquely necessary
      polymer-degradation route.
  evidence:
  - reference: PMID:38748977
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Herein, a metagenomic approach was used to screen core microorganisms (Bacillus subtilis, Acinetobacter
      johnsonii, Trichoderma viride, and Aspergillus niger) possessing lignocellulose-degrading abilities among
      samples from three environments: pile retting wheat straw (WS), WS returned to soil, and forest soil.'
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:38748977
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: yielding cellulose, hemicellulose, and lignin degradation rates of 39.85, 36.99, and 19.21%, respectively.
    explanation: Quantifies degradation of the three major wheat-straw polymers by the synthetic microbial community
      enzyme pretreatment.
- name: Enhanced Biogas Production after Anaerobic Digestion
  description: Subsequent anaerobic digestion of synthetic-community enzyme-pretreated straw yielded 801.16 mL/g
    TS cumulative biogas, higher than untreated straw and both commercial-enzyme pretreatments. Biogas volume is
    not a methane-only yield. The abstract does not identify the digestion community or demonstrate methanogenesis
    by the four enzyme-producing isolates.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38748977
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SMCEP displayed the highest cumulative biogas production at 801.16 mL/g TS
    explanation: Supports the anaerobic-digestion endpoint after synthetic microbial community enzyme-producing
      pretreatment.
