- name: Enhanced Biogas Production after Anaerobic Digestion
  description: Wheat straw pretreated with the synthetic-community crude enzyme
    solution produced the highest cumulative biogas in the subsequent anaerobic
    digestion stage, outperforming untreated straw and both commercial enzyme
    pretreatments.
  interaction_type: MUTUALISM
