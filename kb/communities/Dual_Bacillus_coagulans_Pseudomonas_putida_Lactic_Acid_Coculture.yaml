ecological_interactions:
- name: Biodetoxification-mediated commensalism (DSM1-25280 to CC17B-1)
  description: The PAD-overexpressing strain DSM1-25280 degrades inhibitory phenolic compounds
    (including accelerated vanillin degradation) in the undetoxified hydrolysate, relieving toxicity
    for the LA producer CC17B-1. This is the early commensalism phase of the niche-succession model.
  interaction_type: COMMENSALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bacillus coagulans DSM1-25280 (PAD-overexpressing)
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  target_taxon:
    preferred_term: Bacillus coagulans CC17B-1
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  metabolites:
  - preferred_term: vanillin
    term:
      id: CHEBI:18346
      label: vanillin
  evidence:
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a strongly supported model of niche succession process within the system, transitioning
      from biodetoxification-mediated commensalism to competitive exclusion
    explanation: Abstract describes the early biodetoxification-mediated commensalism phase between
      the two strains.
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: overexpression of PAD in the engineered strain DSM1-25280 not only enhanced tolerance
      to phenolic acids but also significantly accelerated vanillin degradation
    explanation: Mechanism of biodetoxification (phenolic/vanillin degradation) provided by DSM1-25280.
- name: Competitive exclusion in the dual Bacillus coagulans consortium
  description: Following the biodetoxification phase, the two Bacillus coagulans strains transition
    to competition, with competitive exclusion as the late phase of the induced niche succession.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bacillus coagulans DSM1-25280 (PAD-overexpressing)
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  target_taxon:
    preferred_term: Bacillus coagulans CC17B-1
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  evidence:
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: transitioning from biodetoxification-mediated commensalism to competitive exclusion
    explanation: Late phase of the niche-succession model is competitive exclusion between the strains.
- name: Aromatic scavenging by P. putida KT2440 ZL reinforces LA fermentation
  description: The sugar-metabolism-deficient engineered P. putida KT2440 ZL acts as a heterologous
    aromatic scavenger, removing aromatic inhibitors without competing for sugars, which reinforces
    the consortium and further elevates LA titer for the Bacillus coagulans producers.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Pseudomonas putida KT2440 ZL
    term:
      id: NCBITaxon:303
      label: Pseudomonas putida
  target_taxon:
    preferred_term: Bacillus coagulans CC17B-1
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  evidence:
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an enhanced three-strain co-culture system by incorporating a sugar-metabolism-deficient
      engineered Pseudomonas putida KT2440 ZL as a heterologous aromatic scavenger
    explanation: P. putida ZL scavenges aromatics without consuming sugars, reinforcing the system.
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This system further elevated the LA titer to 146.00 g/L with a yield of 98.9%
    explanation: Adding the aromatic scavenger raised LA titer/yield, evidencing the beneficial effect.
