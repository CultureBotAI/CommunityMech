ecological_interactions:
- name: Biodetoxification-Mediated Facilitation of CC17B-1
  description: DSM1-25280 pretreatment lowers inhibitory phenolics and permits subsequent CC17B-1 fermentation of
    undetoxified corncob hydrolysate. The optimized dual-strain scheme adds 1 g/L DSM1-25280, then 3 g/L CC17B-1
    after 12 h. CC17B-1 also contributes to detoxification; donor neutrality is not established. Accelerated vanillin
    loss accompanies PAD overexpression but is not demonstrated direct PAD catalysis.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bacillus coagulans DSM1-25280 (PAD-overexpressing)
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  target_taxon:
    preferred_term: Bacillus coagulans CC17B-1
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  metabolites:
  - preferred_term: vanillin
    term:
      id: CHEBI:18346
      label: vanillin
  downstream:
  - target: CC17B-1 Dominance and Hypothesized Exclusion of DSM1-25280
    description: HYPOTHESIZED - detoxification may remove the selective advantage of the stress-tolerant DSM1-25280
      strain and permit CC17B-1 dominance. CFU succession supports the proposed trade-off model but does not isolate
      resource competition from lactic-acid inhibition or loss of culturability.
  evidence:
  - reference: PMID:42098792
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: a strongly supported model of niche succession process within the system, transitioning from biodetoxification-mediated
      commensalism to competitive exclusion
    explanation: Supports the authors' succession model, not established donor neutrality or a selectively demonstrated
      competition mechanism.
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: overexpression of PAD in the engineered strain DSM1-25280 not only enhanced tolerance to phenolic acids
      but also significantly accelerated vanillin degradation
    explanation: Supports the engineered-strain phenotype; primary Results explicitly describe accelerated vanillin
      degradation as an indirect, unresolved effect rather than direct PAD reduction.
- name: CC17B-1 Dominance and Hypothesized Exclusion of DSM1-25280
  description: After 24 h in the optimized dual-strain culture, CC17B-1 CFU increased while DSM1-25280 CFU declined
    and became undetectable after 72 h. The proposed direction of exclusion is CC17B-1 toward DSM1-25280. HYPOTHESIZED
    resource competition and metabolic trade-offs may explain this pattern, but product inhibition is an explicit
    alternative and CFU measures culturability, not demonstrated extinction or real-time metabolic viability.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bacillus coagulans CC17B-1
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  target_taxon:
    preferred_term: Bacillus coagulans DSM1-25280 (PAD-overexpressing)
    term:
      id: NCBITaxon:1398
      label: Heyndrickxia coagulans
  evidence:
  - reference: PMID:42098792
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: transitioning from biodetoxification-mediated commensalism to competitive exclusion
    explanation: The source proposes competition-driven succession; differential plating supports the directional
      CFU shift, while the exact cause of DSM1-25280 decline remains unresolved.
- name: Aromatic scavenging by P. putida KT2440 ZL reinforces LA fermentation
  description: The three-strain protocol first incubates sugar-metabolism-deficient P. putida KT2440 ZL aerobically
    at 30 C for 12 h, then shifts to 50 C anaerobic DSM1-25280 fermentation and adds CC17B-1 after another 12 h.
    This staged treatment reached 146.00 g/L LA and 98.9% yield versus 124.72 g/L for the optimized dual culture.
    Aromatic scavenging is the proposed contribution; the comparison does not selectively isolate that mediator,
    donor neutrality or stable simultaneous three-strain coexistence.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: small molecule catabolic process
    term:
      id: GO:0044282
      label: small molecule catabolic process
  downstream:
  - target: Biodetoxification-Mediated Facilitation of CC17B-1
    description: PARTIAL - aerobic ZL pretreatment may reduce recalcitrant aromatic toxicity and facilitate the
      subsequent anaerobic Bacillus relay. The staged treatment improves fermentation, but does not selectively
      establish aromatic removal as the sole mediator or equate the two temperature/oxygen stages.
  evidence:
  - reference: PMID:42098792
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: an enhanced three-strain co-culture system by incorporating a sugar-metabolism-deficient engineered
      Pseudomonas putida KT2440 ZL as a heterologous aromatic scavenger
    explanation: Supports inclusion of the engineered aromatic-scavenging strain; primary Methods specify staged
      aerobic pretreatment followed by an anaerobic temperature shift, not simultaneous equivalent growth conditions.
  - reference: PMID:42098792
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This system further elevated the LA titer to 146.00 g/L with a yield of 98.9%
    explanation: Supports the measured output of the three-strain staged treatment, not selective aromatic mediation
      or donor neutrality.
  participating_taxa:
