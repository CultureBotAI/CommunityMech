  vessel_type: 150 mL shake flask (50 mL working volume)
  preparation_notes: Dual Bacillus coagulans co-culture fermented under anaerobic conditions at 50 °C and 150 rpm in 150 mL shake flasks containing 50 mL of hydrolysate fermentation medium; 0.5 g CaCO3/g sugar added to regulate pH; strains introduced by a sequential inoculation strategy. The engineered Pseudomonas putida KT2440 ZL was initially cultivated at 30 °C and 200 rpm.
  evidence:
