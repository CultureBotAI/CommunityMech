    evidence_source: IN_VITRO
    snippet: The strains were inoculated at 4 g/L (wet weight) into 150 mL shake flasks containing 50 mL of hydrolysate fermentation medium, supplemented with 0.5 g CaCO3/g sugar to regulate the pH during fermentation.
    explanation: Names the shake-flask vessel and working volume, 4 g/L inoculum, fermentation medium, and CaCO3 pH regulation.
