id: CommunityMech:000286
name: Dual Bacillus coagulans + Pseudomonas putida Lactic-acid Co-culture
description: Engineered artificial microbial consortium for L-lactic acid (LA) fermentation
  directly from undetoxified lignocellulosic (corncob) hydrolysates. A dual Bacillus coagulans
  (Heyndrickxia coagulans) system pairs a phenolic acid decarboxylase (PAD)-overexpressing
  biodetoxifying strain, DSM1-25280, with a high-yield LA producer, CC17B-1, and reaches
  124.72 g/L LA from undetoxified hydrolysate via a sequential-inoculation division of labor.
  Multidimensional analysis supports a niche-succession model transitioning from
  biodetoxification-mediated commensalism to competitive exclusion. A sugar-metabolism-deficient
  engineered Pseudomonas putida KT2440 ZL added as a heterologous aromatic scavenger reinforces
  the system, raising the LA titer to 146.00 g/L at 98.9% yield.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
