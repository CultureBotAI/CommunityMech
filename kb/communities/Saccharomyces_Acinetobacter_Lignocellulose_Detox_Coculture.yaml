    description: 'PARTIAL: faster inhibitor conversion is proposed to relieve stress and support the higher coculture
      lactic acid productivity. The coculture comparison supports a net benefit but does not isolate detoxification
      from all other partner effects or prove a higher lactic acid yield.'
  evidence:
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A. baylyi ADP1 showed efficient bioconversion of furan aldehydes present in the hydrolysate, namely
      furfural and 5-hydroxymethylfurfural, and did not compete for substrates with S. cerevisiae
    explanation: Directly supports furan-aldehyde detoxification by A. baylyi and lack of substrate competition
      with S. cerevisiae.
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The lactic acid productivity of S. cerevisiae was improved approximately 1.5-fold (to 0.41 ± 0.08 g/L/h)
      in the coculture with A. baylyi ADP1, compared to a monoculture of S. cerevisiae
    explanation: Quantifies the positive coculture productivity comparison, not independently isolated detoxification
      mediation.
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: both strains are able to independently grow in the SLH medium
    explanation: The authors describe facultative mutualism, not obligate dependence or an unaffected partner.
- name: Carbon Diversion to Wax Esters
  description: 'PARTIAL: residual medium substrates and yeast-derived byproducts can contribute carbon used by ADP1
    for wax ester production. Unconsumed feedstock is not itself a metabolite secreted by yeast, and the precise
    contribution of yeast-derived carbon is not traced. The primary results reliably quantified wax esters in only
    one of four coculture replicates, so the positive observation is retained without claiming a reproducible second
    product stream.'
