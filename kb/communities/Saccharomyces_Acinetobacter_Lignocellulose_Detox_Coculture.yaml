discussions:
- discussion_id: detox_graph_evidence_scope
  prompt: How reproducible is wax-ester coproduction and how much of the yeast benefit is specifically mediated
    by detoxification?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Primary results support faster inhibitor conversion and higher lactic acid productivity, not a higher
    lactic acid yield or neutral ADP1 fitness. Wax esters were reliably quantified in only one of four coculture
    replicates, and residual feedstock must be distinguished from yeast-produced carbon. The authors' facultative-mutualism
    interpretation does not demonstrate obligate dependence. Preserve all three nodes and both PARTIAL directions;
    no new culture, strain-design or optimization instructions are added.
  evidence:
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Measurable amounts of WEs were only detected in one of the cocultures
    explanation: Bounds the reproducibility of the positive wax-ester result.
