growth_media:
- name: synthetic lignocellulosic hydrolysate (SLH) medium
  temperature: '30'
  temperature_unit: °C
  ph: '6.0'
  shaking_speed: '300'
  shaking_speed_unit: rpm
  vessel_type: shake flask / 3.5-L bioreactor
  preparation_notes: >-
    SLH mimics 70%-diluted spruce hydrolysate: d-glucose 12.18 g/L, d-xylose
    7.91 g/L, d-mannose 10.43 g/L, d-galactose 7.14 g/L, acetic acid 2.66 g/L,
    ferulic acid 0.5 g/L, p-coumaric acid 0.5 g/L, furfural 0.84 g/L, HMF 0.35
    g/L, formic acid 0.28 g/L, yeast extract 5 g/L, urea 2.5 g/L.
  evidence:
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The liquid cultivations were incubated at 30 °C and 300 rpm in an Innova
      44 shaker (Eppendorf, Germany), cultivations using LB-agar plates were
      incubated at 30 °C.
    explanation: Names 30 °C incubation temperature and 300 rpm shaking for the liquid cultivations.
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fermentations were carried out in a 3.5 L bioreactor with 1 L SLH medium
      in 30 °C and pH was maintained at 6.0 by 2 M HCl and 8% (v/v)
    explanation: Documents the SLH medium and pH 6.0 maintained during the bioreactor fermentation.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: STIRRED_TANK_BIOREACTOR
  instrument_detail: 3.5-L bioreactor (Biostream International BV, Netherlands)
  working_volume: 1000.0
  working_volume_unit: mL
  operating_temperature: 30.0
  operating_temperature_unit: °C
  ph_controlled: true
  do_controlled: true
  notes: >-
    3.5-L stirred-tank bioreactor, 1 L working volume, 30 °C; dissolved-oxygen
    minimum set to 30% by automatically adjusting agitation from 300 to 900 rpm;
    pH maintained at 6.0.
  evidence:
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The working volume of the bioreactor was 1 L, and the cultivations were carried out at 30 °C.
    explanation: Names the 1 L working volume and 30 °C operating temperature of the bioreactor.
  - reference: PMID:38711153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The minimal dissolved oxygen level was set to 30%, controlled by
      automatically adjusting the agitation from 300 to 900 rpm.
    explanation: Documents dissolved-oxygen control via agitation in the stirred-tank bioreactor.
