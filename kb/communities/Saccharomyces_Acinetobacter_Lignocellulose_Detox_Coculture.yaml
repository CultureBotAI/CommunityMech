ecological_interactions:
- name: Furan Aldehyde Detoxification Cross-Protection
  description: 'A. baylyi ADP1 bioconverts the furan aldehydes faster than the yeast in the reported strain comparisons,
    and coculture has faster inhibitor disappearance and greater lactic acid productivity than the yeast monoculture.
    PARTIAL: detoxification is the authors'' proposed mediator of that benefit, not an independently isolated quantitative
    contribution. The benefit does not establish neutral fitness of ADP1; the authors describe the overall consortium
    as facultative mutualism, with both strains able to grow independently.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: engineered Acinetobacter baylyi ADP1
