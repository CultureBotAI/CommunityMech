id: CommunityMech:000288
name: Shewanella oneidensis + Pseudomonas aeruginosa Fe0-dependent Electro-syntrophic Denitrifying Consortium
description: Engineered two-member denitrifying consortium of the electroactive bacterium Shewanella
  oneidensis and the denitrifier Pseudomonas aeruginosa, operated in anaerobic conditions with
  metallic iron (Fe0) as the sole electron donor. S. oneidensis acts as a bio-engine, using its
  membrane-bound CymA-OmcA-MtrC complexes to harvest electrons from Fe0 biocorrosion and transfer
  them to P. aeruginosa. P. aeruginosa accepts these electrons for nitrate reduction, accomplishing
  microbial denitrification via a Fe0-S. oneidensis-P. aeruginosa electron-transfer system. This
  Fe0-dependent electro-syntrophy defines a metabolic window for denitrifier growth relevant to
  nitrate removal in water/wastewater treatment and the global nitrogen cycle.
