ecological_interactions:
- name: Shewanella Fe0-Biocorrosion Electron Harvesting
  description: The primary abstract reports that Shewanella oneidensis harvests electrons and conserves energy from
    metallic-iron biocorrosion in the model consortium. This donor-side process is retained without assigning a
    separate syntrophic feedback interaction.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Shewanella oneidensis
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  downstream:
  - target: Fe0-Dependent Interspecies Electron Transfer
    description: Electron harvest from metallic iron supplies the electrons that the source reports passing from
      S. oneidensis to P. aeruginosa in the model consortium. This preserves the reported upstream-to-transfer direction
      without adding a reciprocal feedback claim.
  evidence:
  - reference: PMID:39504696
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: using Fe0 as the sole electron donor, S. oneidensis can act as a bio-engine to harvest electrons and
      conserve energy from Fe0 biocorrosion
    explanation: Supports the upstream Fe0 electron-harvesting role of S. oneidensis.
- name: Fe0-Dependent Interspecies Electron Transfer
  description: The source reports electron transfer from S. oneidensis to P. aeruginosa in the Fe0-dependent consortium,
    described by the authors as direct electron cross-feeding and electro-syntrophy. The reported metatranscriptomic
    response is not by itself proof that the associated expression changes are necessary for this route. The abstract
    does not independently establish the product-removal feedback required by the schema SYNTROPHY definition; direct
    electrons are not assigned a metabolite-exchange category.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Shewanella oneidensis
