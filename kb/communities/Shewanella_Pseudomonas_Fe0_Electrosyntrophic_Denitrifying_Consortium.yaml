ecological_interactions:
- name: Fe0-dependent electro-syntrophic electron transfer
  description: Direct electron cross-feeding in which S. oneidensis harvests electrons from Fe0
    biocorrosion via its CymA-OmcA-MtrC complexes and transfers them to P. aeruginosa, which uses
    them to reduce nitrate and accomplish denitrification. The direct electron cross-feeding also
    facilitates expression of P. aeruginosa denitrification enzymes, intracellular electron-transfer
    proteins, and quorum-sensing genes.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
