id: CommunityMech:000283
name: Sesame-flavor Baijiu Fuqu SynCom (13-genus)
description: Thirteen-genus synthetic microbial community (SynCom) designed for Fuqu, the fermentation
  starter used in sesame flavor-type baijiu (Chinese liquor) production. Multi-omics analysis
  identified 13 core genera - the fungal/yeast genera Aspergillus, Pichia, Saccharomyces, Trichosporon,
  Candida, Torulaspora, Clavispora and Wickerhamomyces and the bacterial genera Bacillus, Lactobacillus,
  Leuconostoc, Pediococcus and Weissella - as the core microbiota driving flavor-compound formation.
  Assembled into a SynCom, these members yielded the highest flavor-compound diversity and
  3-(methylthio)-1-propanal (a key sulfur-containing flavor compound) content in simulative fermentation,
  and outperformed commercial Fuqu at large scale. The community represents an engineered strategy to
  enhance sulfur-containing flavor compounds during baijiu fermentation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
