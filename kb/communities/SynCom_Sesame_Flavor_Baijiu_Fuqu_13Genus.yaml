ecological_interactions:
- name: Emergent flavor-compound co-production by the assembled SynCom
  description: When the 13 core genera are assembled into a SynCom, the community exhibits emergent,
    community-level enhancement of flavor-compound production - the highest flavor-compound diversity and
    3-(methylthio)-1-propanal (a key sulfur-containing flavor compound) content in simulative fermentation,
    exceeding commercial Fuqu at large scale.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: 3-(methylthio)-1-propanal
    term:
      id: CHEBI:49017
      label: 3-methylthiopropanal
  evidence:
  - reference: PMID:42121419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The resulting SynCom exhibited the highest flavor compound diversity (0.64) and
      3-(methylthio)-1-propanal content (618.14
    explanation: Community-level emergent enhancement of flavor-compound diversity and the key sulfur
      flavor compound 3-(methylthio)-1-propanal by the assembled SynCom.
growth_media:
- name: sorghum extract medium (simulated fermentation)
  temperature_range: '30-37'
  temperature_unit: °C
  shaking_speed: '150'
  shaking_speed_unit: rpm
  inoculum_size: 1 x 10^5 CFU/mL per strain (equal proportions)
  preparation_notes: >-
    Simulated fermentation of the assembled SynCom in sorghum extract medium. Yeast incubated at
    30 °C for 24 h (150 rpm); bacteria (except L. acetotolerans) at 37 °C for 14 h (150 rpm);
    L. acetotolerans anaerobically at 37 °C for 3 d; A. oryzae at 30 °C for 5 d. Strains mixed at
    an equal concentration of 1 x 10^5 CFU/mL.
  evidence:
  - reference: PMID:42121419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All strains were incubated in the sorghum extract medium. Yeast was incubated at 30 °C
      for 24 h with shaking at 150 rpm.
    explanation: Names the sorghum extract medium, incubation temperatures, and 150 rpm shaking used
      for the SynCom simulated fermentation.
  - reference: PMID:42121419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each strain in the SynComs was mixed at an equal concentration of 1 × 10 5 CFU/mL.
    explanation: Inoculum composition for the assembled SynCom.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: Solid-state fermentation bags embedded 0.5 m deep in the upper
    layer of a baijiu fermentation pit, at a sesame-flavour baijiu distillery in
    Suqian City, Jiangsu, China.
  controls_notes: 500 g of mixed grains per bag, blended 4.5:1 last-batch to fresh,
    steamed and cooled before the SynCom was inoculated; each member mixed in at an
    equal 1 x 10^5 CFU/mL; fermented 30 d.
  notes: 'Solid-state, so there is no working volume to record: the charge is a mass
    of grain, not a liquid, and `working_volume` takes volume units only. Duration is
    kept here rather than in `retention_time` because `retention_time_type` offers
    only HRT and SRT, both of which describe continuous systems; this is a 30-day
    batch. The per-strain incubations the paper also gives (yeast 30 C/24 h, most
    bacteria 37 C/14 h, L. acetotolerans anaerobic 37 C/3 d, A. oryzae 30 C/5 d) are
    seed-culture preparation and are deliberately NOT recorded as the community''s
    conditions (#529).'
  evidence:
  - reference: PMID:42121419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A total of 500 g of mixed materials was placed into fermentation bags.
      After steaming and cooling, the SynCom was inoculated into the materials. The
      fermentation bags were then embedded in the upper layer of the pit (0.5 m deep)
      to simulate actual baijiu fermentation for 30 d
  - reference: PMID:42121419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each strain in the SynComs was mixed at an equal concentration of 1 × 105
      CFU/mL
