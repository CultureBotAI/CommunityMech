  preferred_term: sesame flavor-type baijiu fermentation (Fuqu starter)
  term:
    id: ENVO:03600040
    label: fermentation starter
  notes: Fuqu is the fermentation starter (Qu) used to initiate sesame flavor-type baijiu fermentation.
