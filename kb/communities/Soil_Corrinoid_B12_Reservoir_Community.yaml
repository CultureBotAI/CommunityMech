id: CommunityMech:000221
name: Soil Corrinoid Reservoir Microbial Community
description: >
  A grassland soil microbial community in which the structurally diverse
  corrinoid (vitamin B12-related) cofactor pool serves as a key determinant of
  community structure. Analysis of metagenome-assembled genomes implicates
  Thermoproteota, Actinobacteria, and Proteobacteria as the principal corrinoid
  suppliers. Corrinoids accumulate adhered to the soil matrix at levels
  exceeding the requirements of cultured bacteria. Enrichment cultures and soil
  microcosms seeded with different corrinoids exhibit distinct shifts in
  bacterial community composition, supporting the hypothesis that corrinoid
  structure shapes communities, with environmental context modulating both
  community-level and taxon-specific responses.
