      label: corrinoid
  biological_processes:
  - preferred_term: cobalamin metabolic process
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  downstream:
  - target: Soil Corrinoid Reservoir and Hypothesized Buffering
    description: 'HYPOTHESIZED: the source model proposes that corrinoids released by predicted producers can adsorb
      to the soil matrix and contribute to its reservoir. The mechanism and magnitude of release and pool replenishment
      remain unknown; the MAG predictions do not trace this flux.'
  evidence:
  - reference: PMID:38832716
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Analysis of metagenome-assembled genomes suggests that corrinoids are supplied to the community by
      members of the archaeal and bacterial phyla Thermoproteota, Actinobacteria, and Proteobacteria
    explanation: Retains the prediction qualifier; does not demonstrate metabolite transfer.
    computational_provenance:
      prediction_type: OTHER
      model_source: Corrinoid biosynthesis-marker and dependent-enzyme annotations in 503 soil MAGs; DRAM annotations
        cross-listed with KEGG orthologues, with a Pfam exception for corrinoid-dependent ribonucleotide reductase.
      tools:
      - tool_name: DRAM
        role: Previously generated MAG annotations used for corrinoid-role inference
- name: Corrinoid Amendment and Community Composition
  description: Distinct corrinoid amendments altered bacterial composition in soil-derived enrichments and soil
    microcosms, with context-dependent responses. In soil microcosms, non-cobalamin treatments had stronger early
    effects than cobalamin, and the treatment effect was largely lost by the final sampling point. These amendment
    responses do not establish niche partitioning, a direct response by every taxon, or exposure to an equally diverse
    native reservoir.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: corrinoid
    term:
      id: CHEBI:33913
      label: corrinoid
  biological_processes:
  - preferred_term: cobalamin metabolic process
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  evidence:
  - reference: PMID:38832716
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Enrichment cultures and soil microcosms seeded with different corrinoids showed distinct shifts in
      bacterial community composition, supporting the hypothesis that corrinoid structure can shape communities.
    explanation: Supports context-dependent amendment responses, not an interspecies niche or transfer mechanism.
  - reference: PMID:38832716
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Environmental context influenced both community- and taxon-specific responses to specific corrinoids.
    explanation: Bounds the response to the measured environmental contexts.
- name: Soil Corrinoid Reservoir and Hypothesized Buffering
  description: 'Soil extraction and bioassays detected an abundant, strongly soil-associated corrinoid pool, expected
    to be predominantly cobalamin. The assay does not separate intracellular from extracellular corrinoids, and
    accessibility to resident microbes remains unclear. HYPOTHESIZED: this reservoir buffers community response
    to additional cobalamin; its role in stability was not isolated experimentally.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: corrinoid
    term:
      id: CHEBI:33913
      label: corrinoid
  biological_processes:
  - preferred_term: cobalamin metabolic process
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  downstream:
  - target: Corrinoid Amendment and Community Composition
    description: 'HYPOTHESIZED: a predominantly cobalamin reservoir may buffer the community response to added cobalamin,
      helping explain the contrast with other corrinoid amendments and with soil-derived enrichments. This proposed
      modulation of the amendment response is not demonstrated release of a diverse native pool or proof that the
      reservoir caused the observed shifts.'
  evidence:
  - reference: PMID:38832716
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Corrinoids were found largely adhered to the soil matrix in a grassland soil, at levels exceeding those
      required by cultured bacteria.
    explanation: Supports the measured total soil-associated pool, not its extracellular fraction or bioavailability.
  - reference: PMID:38832716
    supports: PARTIAL
    evidence_source: OTHER
    snippet: These results implicate corrinoids as key determinants of soil microbiome structure and suggest that
      environmental micronutrient reservoirs promote community stability.
    explanation: 'The source says suggest: reservoir-mediated stability remains an interpretation.'
