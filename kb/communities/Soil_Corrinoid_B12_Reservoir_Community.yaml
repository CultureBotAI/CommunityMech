ecological_interactions:
- name: Predicted Soil Corrinoid Supply Capacity
  description: 'Metagenome-assembled genomes from Hopland grassland soil suggest that Thermoproteota, Actinobacteria
    and Proteobacteria contain the principal corrinoid-producing lineages. This is predicted capacity in a subset
    of genomes, not demonstrated production or exchange by every member of these phyla. HYPOTHESIZED: released corrinoids
    support dependent organisms directly or through a soil-associated reservoir; release and replenishment were
    not traced.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: corrinoid-supplying Thermoproteota
    term:
      id: NCBITaxon:28889
      label: Thermoproteota
  - preferred_term: corrinoid-supplying Actinobacteria
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  - preferred_term: corrinoid-supplying Proteobacteria
    term:
      id: NCBITaxon:1224
      label: Pseudomonadota
  metabolites:
