  evidence:
  - reference: PMID:42535840
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: D. flosaquae FBCC-A233 encoded most genes required for anaerobic corrinoid-ring biosynthesis
    explanation: Supports D. flosaquae as a candidate corrinoid producer, while retaining the paper's
      caveat that cobamide identity and exchange were unresolved.
  - reference: PMID:42535840
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: The associated bacterial genomes lacked complete de novo cobamide biosynthesis but retained cobamide-related
      utilization genes
    explanation: Supports a candidate cobamide-utilization asymmetry in the two bacterial associates.
