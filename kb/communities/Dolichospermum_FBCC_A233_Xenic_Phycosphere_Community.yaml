    term:
      id: GO:0009110
      label: vitamin biosynthetic process
  evidence:
  - reference: PMID:42535840
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: D. flosaquae FBCC-A233 was the only genome encoding the BioU-mediated de novo biotin
      biosynthesis route
    explanation: Supports a genome-inferred biotin asymmetry, not direct biotin exchange.
  - reference: PMID:42535840
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: associated bacterial genomes lacked complete de novo biosynthetic pathways
    explanation: Supports the absence of complete de novo biotin biosynthesis in the recovered
      Sphingorhabdus and Brevundimonas genomes.
- name: Genome-inferred corrinoid utilization asymmetry
  description: D. flosaquae FBCC-A233 encoded most anaerobic corrinoid-ring biosynthesis genes, while
    Sphingorhabdus sp. and Brevundimonas sp. lacked complete de novo cobamide biosynthesis and
    retained different methionine-synthase repertoires.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
