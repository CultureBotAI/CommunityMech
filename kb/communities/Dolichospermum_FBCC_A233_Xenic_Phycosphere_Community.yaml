id: CommunityMech:000441
name: Dolichospermum FBCC-A233 Xenic Phycosphere Community
description: A unialgal xenic freshwater cyanobacterial culture centered on Dolichospermum flosaquae
  FBCC-A233 and two co-maintained alphaproteobacterial associates assigned to Sphingorhabdus sp.
  and Brevundimonas sp. Kim et al. reconstructed complete circular genomes from the FBCC-A233
  culture, resolved the associated bacterial genomes at genus level, and predicted an asymmetric
  cofactor economy in which D. flosaquae FBCC-A233 encoded BioU-mediated de novo biotin and
  extensive anaerobic corrinoid biosynthesis potential while the associated bacteria lacked complete
  de novo biotin and cobamide biosynthetic pathways.
ecological_state: STABLE
community_origin: NATURAL
community_category: PHYTOPLANKTON
environment_term:
  preferred_term: freshwater cyanobacterial laboratory culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The curated community is a culture-collection-maintained unialgal xenic culture originally
    established by single-filament isolation from Inpyeong Reservoir, Republic of Korea.
