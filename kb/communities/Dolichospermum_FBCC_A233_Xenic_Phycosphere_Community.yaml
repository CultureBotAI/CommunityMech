      flosaquae FBCC-A233
    explanation: Supports D. flosaquae FBCC-A233 as the cyanobacterial genome recovered from the
      xenic culture.
  - reference: PMID:42535840
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: FBCC-A233 strain was established by single-filament isolation
    explanation: Supports the culture-collection isolate context for the cyanobacterial member.
- taxon_term:
    preferred_term: Sphingorhabdus sp. FBCC-A233 associate
    term:
      id: NCBITaxon:1434046
      label: Sphingorhabdus
    gtdb_grounding_status: UNRESOLVED
    notes: Associated alphaproteobacterial genome recovered from the xenic FBCC-A233 culture and
      resolved by the source article only to Sphingorhabdus sp.
  abundance_level: RARE
  evidence:
  - reference: PMID:42535840
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: two associated alphaproteobacterial genomes assigned to Sphingorhabdus sp. and Brevundimonas
      sp.
    explanation: Identifies Sphingorhabdus sp. as one of the two associated bacterial genomes
      reconstructed from the culture.
  - reference: PMID:42535840
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Sphingorhabdus sp. encoded both metH and metE
    explanation: Supports the Sphingorhabdus genome as a predicted cobamide-flexible member rather
      than directly demonstrating cobamide exchange.
- taxon_term:
    preferred_term: Brevundimonas sp. FBCC-A233 associate
    term:
      id: NCBITaxon:41275
      label: Brevundimonas
    gtdb_grounding_status: UNRESOLVED
    notes: Putative undescribed Brevundimonas species-level lineage recovered from the xenic
      FBCC-A233 culture and reported only at genus level in the source article.
  abundance_level: RARE
  evidence:
  - reference: PMID:42535840
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: associated bacterial genomes represented Sphingorhabdus sp. and a putative undescribed
      Brevundimonas species-level lineage
    explanation: Identifies Brevundimonas sp. as a recovered associated bacterial genome and preserves
      the unresolved species-level assignment.
  - reference: PMID:42535840
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Brevundimonas sp. encoded only metH
    explanation: Supports the predicted cobamide-dependent methionine-synthase profile that motivated
      the candidate cofactor-dependence hypothesis.
ecological_interactions:
- name: Genome-inferred biotin asymmetry
  description: D. flosaquae FBCC-A233 was the only recovered genome with a complete BioU-mediated
    de novo biotin-biosynthesis route, whereas Sphingorhabdus sp. and Brevundimonas sp. lacked
    complete de novo pathways while retaining biotin-dependent carboxylase genes.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Dolichospermum flosaquae FBCC-A233
    term:
      id: NCBITaxon:1166
      label: Dolichospermum flos-aquae
  - preferred_term: Sphingorhabdus sp. FBCC-A233 associate
    term:
      id: NCBITaxon:1434046
      label: Sphingorhabdus
  - preferred_term: Brevundimonas sp. FBCC-A233 associate
    term:
      id: NCBITaxon:41275
      label: Brevundimonas
  metabolites:
