id: CommunityMech:000356
name: Jiangshui LAB Directed Fermentation SynCom
description: A three-strain lactic-acid-bacterial synthetic community combining Jiangshui isolates Y-5-3, Y-6-2, and HN for
  standardized traditional Chinese Jiangshui fermentation. The strains were selected from Gansu-province Jiangshui samples,
  assembled across 20 empirical ratios, and optimized to a Y-5-3:Y-6-2:HN ratio of 2:3:1. The optimized SynCom improved sensory
  score, increased total phenols and flavonoids relative to natural Jiangshui, reduced off-odors, and improved fermentation
  stability.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct a safe and efficient synthetic lactic-acid-bacterial starter community for standardized traditional
    Chinese Jiangshui fermentation.
  assembly_strategy: Screen lactic acid bacteria isolated from 53 traditional Jiangshui samples, select strains Y-5-3, Y-6-2,
    and HN as high-performing candidates, and combine the three selected strains across empirical ratios.
  perturbation_design: Manually combine strains Y-5-3, Y-6-2, and HN in 20 ratios and optimize the Jiangshui fermentation
    design by comparing acidity, sensory quality, total phenols, and flavonoids.
  measurement_endpoints:
  - growth performance and acid production by candidate LAB isolates
  - stress, gastrointestinal, adhesion, antimicrobial, and biosafety traits
  - Jiangshui acidity and sensory quality across 20 SynCom ratios
  - total phenol and flavonoid contents in fermented Jiangshui
  notes: The PubMed abstract identifies the selected strains only as LAB strain codes, and does not expose the exact species
    assignments, Jiangshui vegetable matrix, salt and acid recipe, inoculation units, fermentation temperature, or fermentation
    duration.
  evidence:
  - reference: PMID:42425667
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a synthetic microbial community (SynCom) via manual combination was constructed for standardized Jiangshui fermentation
      by combining screened LAB strains from traditional Jiangshui at ratios empirically optimized through evaluation of acidity,
      sensory quality, total phenols, and flavonoids.
    explanation: Supports the manually assembled LAB SynCom design and the Jiangshui fermentation endpoints used for ratio
      optimization.
  - reference: PMID:42425667
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: LAB were isolated and purified from 53 traditional Jiangshui samples collected from Gansu Province, and 5 dominant
      strains (Y-5-3, Y-6-2, HN, HX, CB) were screened via morphological, molecular and physiological characterization.
    explanation: Supports the traditional Jiangshui isolate source and the screening process used to choose candidate LAB
      strains.
  - &id002
    reference: PMID:42425667
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The optimal fermentation scheme was Y-5-3: Y-6-2: HN = 2:3:1'
    explanation: Supports the Y-5-3:Y-6-2:HN 2:3:1 ratio as the optimized three-strain fermentation scheme.
