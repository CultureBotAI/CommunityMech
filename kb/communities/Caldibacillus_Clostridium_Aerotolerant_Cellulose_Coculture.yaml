id: CommunityMech:000179
name: Caldibacillus-Clostridium Aerotolerant Cellulose Coculture
description: >
  A designed two-member thermophilic coculture for aerotolerant cellulose conversion.
  The community pairs the cellulolytic strict anaerobe Clostridium thermocellum with
  the noncellulolytic facultative anaerobe Caldibacillus debilis GB1. C. debilis GB1
  provides respiratory protection under oxidative conditions, enabling synergistic
  cellulose utilization and ethanogenic biofuel production under an aerobic atmosphere.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Develop an aerotolerant ethanogenic cellulose coculture that reduces the burden of
    maintaining strictly anaerobic conditions during consolidated bioprocessing.
  assembly_strategy: Pair cellulolytic C. thermocellum with noncellulolytic facultative anaerobe
    C. debilis GB1, an isolate from an air-tolerant cellulolytic enrichment consortium.
  perturbation_design: Compare designed cocultures across oxidative conditions and monitor fermentation
    product shifts during cellulose utilization.
  measurement_endpoints:
  - Cellulose utilization
  - Ethanol production
  - Lactate production
  - Respiratory protection under oxidative conditions
  evidence:
  - reference: doi:10.1128/AEM.00735-15
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: aerotolerant ethanogenic biofuel production from cellulose
    explanation: Supports the bioenergy and aerotolerant cellulose-conversion objective.
  - reference: doi:10.1128/AEM.00735-15
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: isolated from an air-tolerant cellulolytic consortium
    explanation: Supports the assembly rationale for including C. debilis GB1.
  - reference: doi:10.1128/AEM.00735-15
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: unique responses to oxidative conditions
    explanation: Supports oxidative-condition perturbation as a core design feature.
