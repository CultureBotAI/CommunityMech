id: CommunityMech:000427
name: Lupinus SC-7 Rhizosphere SynCom
description: >
  A defined twelve-strain bacterial synthetic community, SC-7, assembled from
  representative Bradyrhizobium, Micromonospora, Caulobacter, Kribbella,
  Pseudomonas, Pseudoxanthomonas, Rhizobium, Sphingopyxis, Stenotrophomonas,
  Streptomyces, and Variovorax isolates from the wild Lupinus angustifolius
  microbiome. The study selected these strains from core-hub-associated,
  peripheral, and satellite genera in a lupin root co-occurrence network, mixed
  them at equal optical density for gnotobiotic FlowPot and non-sterile soil
  inoculation, and found that increasing SynCom complexity reshaped
  root-associated microbiota while SC-7 gave the strongest lupin growth and
  transcriptional response among the tested SynComs.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >
    Reconstruct a tractable wild Lupinus angustifolius root-associated
    community spanning dominant, low-abundance, core-hub, peripheral, and
    satellite genera, then test how increasing SynCom complexity affects lupin
    root colonization, resident microbiome assembly, plant growth, and host
    transcription.
  assembly_strategy: >
    Define the lupin root-associated core microbiome from prevalence and
    abundance across two Spanish sites, use co-occurrence network positions to
    identify candidate hub, peripheral, and satellite genera, randomly select
    twelve representative isolates from those genera, verify the twelve
    isolates for mutual growth inhibition on TSA or TY agar, and combine all
    twelve as the highest-complexity SC-7 SynCom.
  inoculation_strategy: >
    Grow each strain individually in TSB or TY broth, mix the strains in equal
    amounts, and dilute the mixture to OD600 0.02 for FlowPot inoculation with
    Broughton and Dilworth medium without nitrogen or for non-sterile CAS soil
    inoculation in 10 mM MgSO4.
  perturbation_design: >
    Compare SynComs SC-1 through SC-7, ranging from one to twelve strains, in
    sterile gnotobiotic FlowPots and in pots containing non-sterile agricultural
    soil from Cologne, Germany.
  measurement_endpoints:
  - Lupinus angustifolius shoot and root growth
  - nodule number
  - root and rhizosphere V5-V7 16S rRNA amplicon profiles
  - SynCom input reference sequencing
  - root RNA-seq host-transcription profiles
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      To further assess the ecological significance of these taxa, co-occurrence
      network analysis was conducted.
    explanation: >
      Supports the network-guided design step used to select representative
      root-associated lupin genera.
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Twelve representative strains from these genera were then randomly
      selected from the collection for inoculation experiments.
    explanation: Supports random strain selection from the network-prioritized genera.
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Total number of strains in SynComs 1 1 2 10 11 11 12
    explanation: Identifies SC-7 as the twelve-strain SynCom.
