ecological_interactions:
- name: SC-7 high-complexity lupin response
  description: >
    The most complex consortium, SC-7, was the SynCom associated with the
    highest lupin growth increase and broad host transcriptional responses, but
    the assay varied richness and membership simultaneously and therefore does
    not separate a pure diversity effect from the effect of particular strains.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Given that SC-7 was the most complex SynCom and led to the highest
      increase in plant growth
    explanation: Identifies SC-7 as the most growth-promoting SynCom in the series.
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Because community complexity and strain composition varied simultaneously
      among SynComs, the individual contributions of these factors cannot be
      disentangled under the conditions tested.
    explanation: >
      Preserves the paper's caution that the SC-7 response is not evidence for
      a richness-only causal effect.
- name: SC-7-associated host transcriptional reprogramming
  description: >
    SC-7 inoculation was associated with up-regulated lupin root pathways for
    signaling, hormone perception, primary and secondary metabolism, defense
    responses, and growth regulation.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Upon addition of SC-7, several key pathways related to signalling, hormone
      perception, and primary and secondary metabolism were significantly
      upregulated
    explanation: Supports the host transcriptional response observed after SC-7 inoculation.
- name: Complex SynCom root and rhizosphere reshaping
  description: >
    More complex Lupinus SynCom inocula, including SC-7, were associated with
    root-associated microbiome shifts, moderate rhizosphere effects, and limited
    bulk-soil effects across sterile and non-sterile tests.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      SynCom inoculation reshaped root-associated microbiota, moderately
      influenced the rhizosphere, and had limited impact on bulk soil communities.
    explanation: >
      Supports the root, rhizosphere, and soil microbiome shifts associated with
      the Lupinus SynCom inoculation series.
environmental_factors:
- name: SC-7 equal-ratio inoculum
  value: OD600 1 individual cultures diluted as a 12-member mixture to OD600 0.02
  description: >
    Each strain was grown separately in TSB or TY broth, mixed in equal amounts
    at OD600 1, and diluted to a final OD600 0.02 for inoculation.
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial strains were mixed in equal amounts to reach an OD600 of 1.
    explanation: Supports the equal-amount strain mixing step used before dilution.
- name: Gnotobiotic FlowPot plant growth
  value: 2:1 sterile peat and vermiculite
  description: >
    Surface-sterilized lupin seedlings were transferred into FlowPots flushed
    with 50 mL of BD medium/SynCom mix and held in a sterile peat:vermiculite
    matrix under long-day growth conditions.
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      each FlowPot was then flushed with 50 mL of the inoculum (BD
      medium/SynCom mix)
    explanation: Supports FlowPot delivery of the diluted SynCom inoculum.
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      containing a matrix of sterile peat and vermiculite (2:1)
    explanation: Supports the sterile plant-growth matrix used for gnotobiotic testing.
- name: Non-sterile CAS soil assay
  value: 3 L pots with Cologne agricultural soil
  description: >
    Fifteen seedlings per treatment were planted in 3 L pots containing
    agricultural soil from Cologne, inoculated with OD600 0.02 equal-ratio
    bacterial suspensions, and grown under greenhouse long-day conditions for
    eight weeks.
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      A total of 120 seeds (fifteen seeds per treatment) were transferred to
      pots (3 L) containing CAS soil (Agricultural Soil from Cologne, Germany).
    explanation: Supports the non-sterile soil pot design and replication.
growth_media:
- name: TSB or TY broth
  temperature: 28
  temperature_unit: C
  shaking_speed: 200
  shaking_speed_unit: rpm
  preparation_notes: >
    Used to grow SC-7 strains individually before equal-amount mixing.
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Each strain was grown individually in liquid medium TSB (BD) or TY broth
      (DSMZ medium 1143)
    explanation: Names the liquid media used to grow individual SC-7 strains.
- name: Broughton and Dilworth medium without nitrogen
  inoculum_size: 0.02
  inoculum_unit: OD600
  preparation_notes: >
    Final gnotobiotic FlowPot carrier medium for equal-ratio SynCom mixtures.
  evidence:
  - reference: PMID:42602126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The suspension mixtures were added to Broughton and Dilworth (BD) medium
      ( Broughton and Dilworth, 1971 ) without nitrogen to a final OD600 of 0.02
    explanation: >
      Identifies the final nitrogen-free BD medium and OD600 used for SynCom
      FlowPot inoculation.
