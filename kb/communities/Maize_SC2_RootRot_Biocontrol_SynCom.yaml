discussions:
- discussion_id: maize_sc2_secreted_biocontrol_mechanism
  prompt: >-
    Which SC2 member metabolites or community-level interactions directly
    suppress Pythium torulosum and connect the strong IAA and siderophore
    phenotypes to maize protection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Pythium torulosum suppression by SC2
  - ecological_interactions#SC2 auxin and siderophore output
  rationale: >-
    Kaki et al. 2026 showed that the S4/S1/S5 subcommunity inhibited Pythium in
    plate assays, protected maize in growth-chamber assays, and produced high
    IAA plus significant siderophore activity, but the specific antimicrobials,
    responsible members, and causal links among siderophores, auxin, root growth,
    and oomycete suppression remain unresolved.
