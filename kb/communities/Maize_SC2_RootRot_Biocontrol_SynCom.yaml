growth_media:
- name: Tryptic Soy Broth SC2 preculture
  temperature: '30'
  temperature_unit: C
  shaking_speed: '200'
  shaking_speed_unit: rpm
  inoculum_source: >-
    Enterobacter cloacae S4, Stenotrophomonas maltophilia S1, and
    Chryseobacterium indologenes S5 0.1x TSA colony cultures
  preparation_notes: >-
    The C7-derived bacterial members were streaked on 0.1x TSA for 24-48 h,
    expanded from single colonies in 5 mL TSB overnight at 30 degrees C and
    200 rpm, re-inoculated into fresh TSB for 8 h at 30 degrees C, harvested,
    resuspended in PBS, and adjusted to approximately 10^8 CFU/mL before assay
    use.
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The seven bacterial species (labeled S1–S7) collected from Roberto
      Kolter’s laboratory ( Niu et al., 2017 ) were cultured on Tryptic Soy Agar
      (TSA) medium and incubated at 30 °C for 24–48 h.
    explanation: >-
      Supports TSA cultivation of the S1-S7 members inherited from the C7
      maize-root consortium.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Following incubation, a single colony from each bacterial strain was
      inoculated into 5 mL of Tryptic Soy Broth (TSB) and incubated overnight at
      30°C with shaking at 200 rpm.
    explanation: Supports TSB preculture at 30 degrees C and 200 rpm.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cultures were adjusted to OD600 ≈ 0.1, corresponding to ∼108 CFU/mL.
    explanation: Supports the approximately 10^8 CFU/mL bacterial inoculum density.
