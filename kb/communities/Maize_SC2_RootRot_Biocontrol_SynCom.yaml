    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Candidate mediator from a separate Salkowski culture-supernatant assay; not measured in the maize plant
      experiment or selectively established as its cause.
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Among the sub-communities tested, SC1 (comprising strains S4, S6, and S7) and SC2 (comprising strains
      S4, S1, and S5) consistently showed enhanced protection from the pathogen and promoted plant growth traits
      significantly more than both the non-inoculated control and the C7 community.
    explanation: Supports plant growth promotion by SC2 under Pythium torulosum challenge.
- name: SC2 Salkowski and CAS assay outputs
  description: 'SC2 culture supernatants gave Salkowski estimates of approximately 45 ug/mL at day 2 and 65 ug/mL
    at day 7 against a pure-IAA calibration, highest among the tested C7-derived communities. CAS agar activity
    was reported as a 0.50 cm halo at day 7 (p=0.015 versus control). Retain the authors auxin and siderophore interpretation
    at assay scope: these colorimetric and halo measurements do not resolve molecular identities, biosynthetic pathways,
    member-specific contributions, plant delivery or reciprocal mutualism. They were not selective mediator perturbations
    of the plant or pathogen assays.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: 'Author-assigned assay interpretation: Salkowski calibrated to IAA or CAS iron-chelation activity, not
      molecular identity or in-planta transfer established here.'
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
    notes: 'Author-assigned assay interpretation: Salkowski calibrated to IAA or CAS iron-chelation activity, not
      molecular identity or in-planta transfer established here.'
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SC2 exhibited the highest IAA levels, reaching ∼45 μg/mL by day 2 and ∼65 μg/mL by day 7, indicating
      strong and sustained auxin synthesis.
    explanation: Supports the reported whole-SC2 assay output; Methods specify Salkowski calibration or CAS halos,
      not resolved structures, pathway perturbation or mediation of plant protection.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: siderophore activity ( Figure 7B ) was most pronounced in SC1 (0.55 cm, p = 0.01) and SC2 (0.50 cm,
      p = 0.015), followed by C7 (0.45 cm, p = 0.02).
    explanation: Supports the reported whole-SC2 assay output; Methods specify Salkowski calibration or CAS halos,
      not resolved structures, pathway perturbation or mediation of plant protection.
