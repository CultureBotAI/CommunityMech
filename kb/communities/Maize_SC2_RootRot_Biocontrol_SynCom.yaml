id: CommunityMech:000375
name: Maize SC2 Root-Rot Biocontrol SynCom
description: >-
  A three-member maize-root synthetic microbial community refined from the C7
  corn root consortium to improve Pythium torulosum biocontrol while preserving
  plant growth promotion. Kaki et al. selected SC2 as S4, S1, and S5:
  Enterobacter cloacae S4, Stenotrophomonas maltophilia S1, and Chryseobacterium
  indologenes S5. Plate assays showed P. torulosum inhibition comparable to C7,
  growth-chamber pot assays showed stronger maize protection and growth than C7
  under P. torulosum challenge, and metabolite assays showed that SC2 had the
  highest measured indole-3-acetic acid production among C7, SC1, SC2, and SC3
  together with significant siderophore activity on CAS agar.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Refine the seven-member C7 maize root consortium into a smaller
    Pythium-suppressive bacterial SynCom that retains complementary biocontrol
    and plant growth-promoting traits.
  assembly_strategy: >-
    Construct SC2 by combining S4, S1, and S5 from the Kolter-laboratory
    seven-strain maize root community after comparing individual members and C7
    in plate inhibition, maize growth-chamber, cell-free supernatant,
    indole-3-acetic acid, and siderophore screens.
  inoculation_strategy: >-
    Expand C7-derived bacterial strains from 0.1x TSA colonies in Tryptic Soy
    Broth at 30 degrees C, resuspend cells in PBS, and use inocula adjusted to
    approximately 10^8 CFU/mL for pathogen plate assays and maize seed soaking.
  perturbation_design: >-
    Compare the rationally reduced SC1, SC2, and SC3 consortia with the parent
    C7 community against Pythium torulosum in PDA dual-culture assays, then
    assay their effects on B73 maize height and fresh root biomass 14 days after
    sowing under P. torulosum-infested sorghum-seed challenge.
  measurement_endpoints:
  - Pythium torulosum radial growth after bacterial challenge
  - maize plant height and fresh root biomass at 14 days post-inoculation
  - indole-3-acetic acid production at 2 and 7 days
  - CAS-agar siderophore activity at 7 days
  notes: >-
    SC2 is a deliberately simplified derivative of C7 rather than a renamed C7:
    Kaki et al. 2026 defined SC1, SC2, and SC3 as separate subcommunities after
    single-member and whole-community screens. The publication's Figure 4 maps
    S1 to Stenotrophomonas maltophilia, S4 to Enterobacter cloacae, and S5 to
    Chryseobacterium indologenes; Niu and Kolter's 2018 Bio-protocol anchors the
    same species in the originating maize C7 strain set as ZK5342, ZK5345, and
    ZK5346.
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      These sub-communities are composed as follows: SC1 (S4, S6, S7), SC2 (S4,
      S1, S5), and SC3 (S1, S4, S5, S6, S7).
    explanation: >-
      Names S4, S1, and S5 as the three members of the SC2 subcommunity.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      SC2 (S4, S1, and S5) was chosen to represent functionally complementary
      strains with moderate antagonism and improved root biomass responses.
    explanation: Supports function-guided selection of the S4/S1/S5 SC2 design.
