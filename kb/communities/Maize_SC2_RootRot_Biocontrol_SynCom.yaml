      label: indole-3-acetic acid
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Among the sub-communities tested, SC1 (comprising strains S4, S6, and S7)
      and SC2 (comprising strains S4, S1, and S5) consistently showed enhanced
      protection from the pathogen and promoted plant growth traits
      significantly more than both the non-inoculated control and the C7
      community.
    explanation: >-
      Supports plant growth promotion by SC2 under Pythium torulosum challenge.
- name: SC2 auxin and siderophore output
  description: >-
    As a whole consortium, SC2 accumulated about 45 ug/mL
    indole-3-acetic acid by day 2 and about 65 ug/mL by day 7, the highest
    measured IAA output among the assayed C7-derived communities; SC2 also
    produced a significant 0.50 cm CAS-agar siderophore halo at day 7.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
  biological_processes:
  - preferred_term: indole-3-acetic acid biosynthetic process
    term:
      id: GO:0009684
      label: indoleacetic acid biosynthetic process
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SC2 exhibited the highest IAA levels, reaching ∼45 μg/mL by day 2 and ∼65
      μg/mL by day 7, indicating strong and sustained auxin synthesis.
    explanation: Supports SC2 as the strongest measured IAA producer.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      siderophore activity ( Figure 7B ) was most pronounced in SC1 (0.55 cm, p
      = 0.01) and SC2 (0.50 cm, p = 0.015), followed by C7 (0.45 cm, p = 0.02).
    explanation: Supports significant CAS-agar siderophore production by SC2.
