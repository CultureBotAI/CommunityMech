ecological_interactions:
- name: Pythium torulosum suppression by SC2
  description: The three-member SC2 inhibited Pythium torulosum radial growth on PDA after seven days, comparably
    to C7. In a separate growth-chamber experiment, SC2-treated B73 seedlings challenged with Pythium had improved
    height and fresh root biomass at 14 days. These positive antagonist and protection phenotypes do not isolate
    nutrient competition, secreted antimicrobials or host immune activation. The three canonical bacterial terms
    identify the curated SC2 roster; Pythium is an external challenge organism, not an inoculum member. Exact strain-number
    and ZK-alias mapping is preserved, not independently recertified.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Enterobacter cloacae S4
    term:
      id: NCBITaxon:550
      label: Enterobacter cloacae
  - preferred_term: Stenotrophomonas maltophilia S1
    term:
      id: NCBITaxon:40324
      label: Stenotrophomonas maltophilia
  - preferred_term: Chryseobacterium indologenes S5
    term:
      id: NCBITaxon:253
      label: Chryseobacterium indologenes
  - preferred_term: Pythium torulosum
    term:
      id: NCBITaxon:4799
      label: Pythium torulosum
  downstream:
  - target: Maize growth promotion under Pythium challenge
    description: HYPOTHESIZED - pathogen inhibition could reduce injury and thereby contribute to improved maize
      growth under challenge. Plate inhibition and plant height/root-mass outcomes support this interpretation,
      but inhibition was not selectively separated from direct growth promotion in the pot experiment; pathogen
      load and immune mediation were not established.
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All sub-communities displayed inhibition comparable to that of the established biocontrol community
      C7
    explanation: Supports SC2 inhibition of Pythium torulosum in the plate assay.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Among the sub-communities tested, SC1 (comprising strains S4, S6, and S7) and SC2 (comprising strains
      S4, S1, and S5) consistently showed enhanced protection from the pathogen and promoted plant growth traits
      significantly more than both the non-inoculated control and the C7 community.
    explanation: Supports the Pythium-challenge growth-chamber phenotype of SC2 relative to uninoculated and C7
      controls.
- name: Maize growth promotion under Pythium challenge
  description: SC2 seed treatment improved B73 maize height and fresh root biomass after 14 days in Pythium-infested
    potting mix relative to the challenged comparison treatments, with SC1 and SC2 outperforming C7 in the reported
    experiment. These are treatment-level plant benefits, not reciprocal bacterial benefit, field yield or proof
    of IAA-mediated protection. Zea mays is an external host, not a fourth bacterial inoculum member. The candidate
    IAA mechanism derives from a separate culture assay, not a measured plant hormone pool or traced bacterial-to-host
    delivery.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Enterobacter cloacae S4
    term:
      id: NCBITaxon:550
      label: Enterobacter cloacae
  - preferred_term: Stenotrophomonas maltophilia S1
    term:
      id: NCBITaxon:40324
      label: Stenotrophomonas maltophilia
