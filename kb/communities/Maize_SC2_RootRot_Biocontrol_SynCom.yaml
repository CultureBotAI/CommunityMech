ecological_interactions:
- name: Pythium torulosum suppression by SC2
  description: >-
    SC2 inhibited the oomycete pathogen Pythium torulosum in PDA dual-culture
    assays at a level comparable to C7 and, in maize growth-chamber assays,
    protected B73 seedlings from P. torulosum while improving plant height and
    root biomass more than either a pathogen-only challenge or the parent C7
    community.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Enterobacter cloacae S4
    term:
      id: NCBITaxon:550
      label: Enterobacter cloacae
  - preferred_term: Stenotrophomonas maltophilia S1
    term:
      id: NCBITaxon:40324
      label: Stenotrophomonas maltophilia
  - preferred_term: Chryseobacterium indologenes S5
    term:
      id: NCBITaxon:253
      label: Chryseobacterium indologenes
  - preferred_term: Pythium torulosum
    term:
      id: NCBITaxon:4799
      label: Pythium torulosum
  biological_processes:
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  downstream:
  - target: Maize growth promotion under Pythium challenge
    description: >-
      Reduced pathogen pressure in the SC2 plus P. torulosum treatment was
      accompanied by higher maize plant height and fresh root biomass than the
      C7 plus P. torulosum treatment.
  evidence:
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All sub-communities displayed inhibition comparable to that of the
      established biocontrol community C7
    explanation: >-
      Supports SC2 inhibition of Pythium torulosum in the plate assay.
  - reference: PMID:42039819
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Among the sub-communities tested, SC1 (comprising strains S4, S6, and S7)
      and SC2 (comprising strains S4, S1, and S5) consistently showed enhanced
      protection from the pathogen and promoted plant growth traits
      significantly more than both the non-inoculated control and the C7
      community.
    explanation: >-
      Supports the Pythium-challenge growth-chamber phenotype of SC2 relative
      to uninoculated and C7 controls.
- name: Maize growth promotion under Pythium challenge
  description: >-
    Maize seeds soaked with SC2 before growth in P. torulosum-infested potting
    mix developed greater 14-day plant height and fresh root biomass than C7- or
    pathogen-only treatments, linking the reduced community to a plant-beneficial
    outcome under oomycete stress.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Enterobacter cloacae S4
    term:
      id: NCBITaxon:550
      label: Enterobacter cloacae
  - preferred_term: Stenotrophomonas maltophilia S1
    term:
      id: NCBITaxon:40324
      label: Stenotrophomonas maltophilia
