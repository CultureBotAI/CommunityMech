    snippet: Although absolute lactate concentrations varied among inoculation sets, D-lactate and L-lactate were produced
      in comparable amounts in all tri-cultures, indicating that Ld strains remained viable and metabolically active.
    explanation: Documents comparable D- and L-lactate production in the set 3 triculture at 160 h.
  - reference: PMID:41859451
