ecological_interactions:
- name: Set 3 triculture milk acidification and total lactate enhancement
  description: The set 3 C001.15/RBC06/C5I3 1:1:1 triculture displayed the highest maximum acidification rate (umax), highest
    maximum fermentative efficiency (Delta pHmax, Figure 7B), and highest total lactic acid production compared with the set
    3 monocultures and 1:1 pairwise co-cultures (p < 0.05) at constant total inoculum (2 x 10^7 CFU/mL). These community-level
    fermentation readouts establish enhanced mixed-culture acidification and total lactate accumulation without isolating
    per-strain cell counts or specific exchanged metabolites.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus C001.15
    term:
      id: NCBITaxon:1587
      label: Lactobacillus helveticus
