  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all inoculation sets, tri-cultures consistently displayed the highest μmax values (p < 0.05), followed
      by the co-cultures St + Lh and St + Ld.
    explanation: Supports the highest maximum milk acidification rate in the set 3 C001.15/RBC06/C5I3 triculture.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all three strain combinations, total lactic acid production was highest in tri-cultures, followed by St
      + Lh and St + Ld co-cultures (p < 0.05)
    explanation: Supports the highest total lactic acid production in the set 3 triculture relative to monocultures and 1:1
      co-cultures.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Statistical analysis of the maximum acidification efficiency (ΔpHmax) largely confirmed the trends described
      for μmax, with the exception of Ld strain T1104 in inoculation set 1 ( Figure 7B ).
    explanation: Confirms that maximum fermentative efficiency (Delta pHmax) in set 3 followed the same superior trend as
      umax without the T1104 set 1 exception.
- name: RBC06-containing pairwise acidification and lactate stimulation in Set 3
  description: In set 3 pairwise 1:1 co-cultures containing Streptococcus thermophilus RBC06 (RBC06 + C5I3 and RBC06 + C001.15),
    maximum acidification rates (umax), maximum acidification efficiency (Delta pHmax), and total lactate concentrations significantly
    exceeded those of the corresponding monocultures (p < 0.05). In the RBC06 + C001.15 pair, L-lactate accounted for 86.73%
    of total lactate, whereas in the RBC06 + C5I3 pair production was dominated by D-lactate. These two-member phenotypes
    are preserved as separate pairwise comparison outcomes without asserting a subset-to-triculture causal arrow.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus C001.15
    term:
      id: NCBITaxon:1587
      label: Lactobacillus helveticus
  - preferred_term: Streptococcus thermophilus RBC06
    term:
      id: NCBITaxon:1308
      label: Streptococcus thermophilus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis C5I3
    term:
      id: NCBITaxon:29397
      label: Lactobacillus delbrueckii subsp. lactis
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By contrast, in St + Ld co-cultures, μmax values were significantly higher than those observed in the corresponding
      Ld and St monocultures (p < 0.05) ( Figure 7A ), indicating a mutual benefit from co-cultivation. A similar enhancement
      was observed in Lh + St co-cultures, where all strain combinations exhibited significantly higher acidification rates
      than their respective monocultures (p < 0.05)
    explanation: Supports higher maximum acidification rates in both St + Ld (RBC06 + C5I3) and Lh + St (C001.15 + RBC06)
      co-cultures relative to monocultures.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under St + Lh conditions, L-lactate predominates, accounting for 86.73% of total lactate in the co-culture of
      strains RBC06 and C001.5 and 74.08% in the co-culture of strains C001.27 and LBB04. Similarly, in St + Ld co-cultures,
      total lactate concentrations also exceeded those of the respective monocultures, with production dominated by D-lactate
    explanation: Quantifies the 86.73% L-lactate share in the RBC06 + C001.15 co-culture and D-lactate predominance in the
      RBC06 + C5I3 co-culture.
- name: C001.15-C5I3 reduced acidification and D-lactate-majority pairwise subset
  description: Co-inoculation of L. helveticus C001.15 with L. delbrueckii subsp. lactis C5I3 in set 3 resulted in lower maximum
    acidification rate (umax) and lower maximum acidification efficiency (Delta pHmax) than the corresponding monocultures
    and yielded significantly lower total lactic acid than the set 3 triculture and the St + Lh and St + Ld co-cultures (Figure
    8). Unlike the set 1 C001.15 + T1104 pair (67.42% L-lactate), D-lactate accounted for the majority (56.63%) of total lactate
    in the set 3 C001.15 + C5I3 co-culture, indicating that L. delbrueckii subsp. lactis C5I3 remained metabolically active
    despite reduced bulk acidification.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus C001.15
