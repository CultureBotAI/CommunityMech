    snippet: In two of the three sets (sets 1 and 2), D-lactate levels in tri-cultures were significantly higher than those
      detected in the corresponding Ld monocultures (p < 0.05)
    explanation: Distinguishes set 3 from sets 1 and 2 regarding whether triculture D-lactate significantly exceeded the corresponding
      Ld monoculture.
growth_media:
- name: Partially skimmed UHT milk cross-feeding medium
  vessel_type: 100 mL screw-cap Erlenmeyer flask
  inoculum_source: L. helveticus C001.15, S. thermophilus RBC06, and L. delbrueckii subsp. lactis C5I3 cell suspensions harvested
    from stationary-phase pre-cultures.
  preparation_notes: Stationary-phase cells were harvested, resuspended in sterile physiological solution, combined at 1:1
    or 1:1:1 ratios immediately before inoculation to reach the same total final concentration (2 x 10^7 CFU/mL) in 40 mL
    partially skimmed UHT milk, and incubated at 42 degrees C for 160 h in a temperature-controlled water bath.
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cell suspensions were then inoculated in 40 mL of partially skimmed UHT milk (Parmalat, Reggio Emilia, Italy)
    explanation: Names the partially skimmed UHT milk fermentation medium and 40 mL working volume.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cell suspensions of the respective species were combined in 1:1 or 1:1:1 ratio immediately prior to inoculation
      to reach the same final concentration (2 × 107 CFU/mL)
    explanation: Supports the 1:1:1 set 3 triculture inoculation ratio and constant total final cell density.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inoculated milk samples were incubated at 42°C for 160 h in a temperature-controlled water bath.
    explanation: Supports the 42 degrees C temperature, 160 h fermentation duration, and water-bath setup.
