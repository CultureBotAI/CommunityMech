discussions:
- discussion_id: nws_set3_d_lactate_and_strain_combination_specificity
  prompt: Why did the Set 3 triculture (C001.15 + RBC06 + C5I3) achieve the highest umax and total lactate without significantly
    elevating triculture D-lactate above the C5I3 monoculture (unlike Set 2 LBB04 + C001.27 + C5I3), and which exchanged metabolites
    govern the C001.15/C5I3 slowdown?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Set 3 triculture milk acidification and total lactate enhancement
  - ecological_interactions#RBC06-containing pairwise acidification and lactate stimulation in Set 3
  - ecological_interactions#C001.15-C5I3 reduced acidification and D-lactate-majority pairwise subset
  - ecological_interactions#Set 3 triculture balanced D-/L-lactate accumulation relative to C5I3 monoculture
  rationale: PMID:41859451 measured bulk milk acidification kinetics (umax, Delta pHmax) and endpoint D-/L-lactate concentrations
    across monocultures, 1:1 pairs, and the 1:1:1 set 3 triculture, showing that set 3 (unlike sets 1 and 2) did not significantly
    increase triculture D-lactate above the Ld C5I3 monoculture (p > 0.05) and that D-lactate formed 56.63% of the C001.15
    + C5I3 pair versus 75.95% in set 2 LBB04 + C5I3. Because member-specific CFU trajectories and candidate exchanged metabolites
    were not directly quantified in milk, the four nodes are retained without directed mediator edges.
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In two of the three sets (sets 1 and 2), D-lactate levels in tri-cultures were significantly higher than those
      detected in the corresponding Ld monocultures (p < 0.05)
    explanation: Highlights the Set 3 contrast in triculture D-lactate accumulation relative to Sets 1 and 2.
