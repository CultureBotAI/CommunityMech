      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Remarkably, in all strain combinations tested, co-inoculation of milk with Lh and Ld resulted in reduced acidification
      rates compared with the corresponding monocultures, regardless of the specific Ld and Lh strains used
    explanation: Supports the lower maximum acidification rate (umax) of the set 3 C001.15 + C5I3 co-culture relative to monocultures.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In inoculation sets 2 and 3, Lh + Ld co-cultures yielded significantly lower total lactic acid than tri-cultures
      and the St + Lh and St + Ld co-cultures ( Figure 8 ). In both cases, D-lactate accounted for the majority of lactate
      produced (75.95% in set 2 and 56.63% in set 3, respectively), indicating that Ld was metabolically active.
    explanation: Quantifies the lower total lactic acid production and 56.63% D-lactate share of the set 3 C001.15 + C5I3
      co-culture.
- name: Set 3 triculture balanced D-/L-lactate accumulation relative to C5I3 monoculture
  description: At the 160 h fermentation endpoint, D-lactate and L-lactate were produced in comparable amounts in the set
    3 C001.15/RBC06/C5I3 triculture. Notably, whereas sets 1 and 2 showed significantly higher D-lactate in tricultures than
    in their corresponding Ld monocultures (p < 0.05), set 3 did not show a statistically significant triculture D-lactate
    increase over the C5I3 monoculture alone, reflecting strain-combination specificity when C5I3 is paired with C001.15 and
    RBC06.
  scope: COMMUNITY_LEVEL
  participating_taxa:
