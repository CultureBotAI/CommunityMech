id: CommunityMech:000113
name: Phylogenetically Diverse Denitrifying SynCom
description: Closely related and distantly related synthetic denitrifying communities used to test how
  phylogenetic diversity affects denitrification and stability.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Determine whether phylogenetic diversity improves denitrification function and temporal stability.
  assembly_strategy: Closely related communities used Shewanella strains; distantly related communities
    used constituents from different genera.
  perturbation_design: Experimental evolution for 200 generations.
  measurement_endpoints:
  - denitrification rate
  - productivity
  - temporal stability
  - complementarity
  evidence:
  - &id001
    reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'we selected denitrifiers based on their phylogenetic distance to construct two groups of
      synthetic denitrifying communities: one closely related (CR) group with all strains from the genus
      Shewanella and the other distantly related (DR) group with all constituents from different genera.'
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: laboratory bioreactor
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Synthetic denitrifying communities experimentally evolved under laboratory conditions.
taxonomy:
- taxon_term:
    preferred_term: Shewanella sp.
    term:
      id: NCBITaxon:22
      label: Shewanella
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
- taxon_term:
    preferred_term: Paracoccus denitrificans
    term:
      id: NCBITaxon:266
      label: Paracoccus denitrificans
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Phylogenetic Complementarity in Denitrification
  description: Distantly related denitrifiers improve function and stability through complementarity and
    asynchronous fluctuations.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Closely related communities used Shewanella strains; distantly related communities used constituents
    from different genera.
  description: Experimental evolution for 200 generations.
  evidence:
  - *id001
related_ingredients:
- preferred_term: nitrate
  chebi_term:
    id: CHEBI:17632
    label: nitrate
  relevance: 'The defining substrate of every member of the CR and DR synthetic denitrifying communities
    — denitrification is by definition the dissimilatory reduction of nitrate, and the Zhou et al.
    2023 study quantifies denitrification rates as the primary functional readout across the
    phylogenetic-diversity gradient. The Edison-surfaced companion Wu et al. 2023 Microbiology Spectrum
    paper (DOI:10.1128/spectrum.04528-22, also a 12-Shewanella SynCom under serial-transfer evolution)
    states the substrate explicitly as 20 mM NaNO3 supplied as the electron acceptor.'
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Denitrification is an important process of the global nitrogen cycle as some of its
      intermediates are environmentally important or related to global warming
    explanation: Establishes denitrification (nitrate reduction) as the defining process of the SDCs;
      the substrate is nitrate.
- preferred_term: dinitrogen oxide
  chebi_term:
    id: CHEBI:17045
    label: dinitrogen oxide
  relevance: The greenhouse-gas intermediate of the denitrification pathway — Zhou et al. 2023
    motivate the work by framing some denitrification intermediates (notably N2O) as "related to
    global warming"; the DR Paracoccus-dominated community achieves higher denitrification rates,
    relevant to mitigating N2O emissions in environmental applications.
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study has important implications for applying synthetic communities to remediate
      environmental problems and mitigate greenhouse gas emissions
    explanation: Names mitigation of greenhouse gas emissions (N2O is the key denitrification-derived
      GHG) as a motivating application of the phylogenetically diverse SDCs.
