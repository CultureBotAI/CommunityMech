ecological_interactions:
- name: High-Phylogenetic-Diversity Function and Stability
  description: In the 200-generation experiment, the high-phylogenetic-diversity DR design showed greater productivity,
    denitrification rate and temporal stability than the closely related Shewanella-only CR design. Preserve the
    positive community comparison without treating the two designs as one coexisting Shewanella-Paracoccus pair
    or asserting a measured compound-resolved niche mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'high phylogenetic diversity followed by experimental evolution promoted the function and stability
      of synthetic denitrifying communities

      '
    explanation: Supports the experimentally observed function/stability advantage, not a particular interspecies
      transfer mechanism.
- name: Paracoccus-Dominated DR Denitrification
  description: Paracoccus denitrificans dominated the DR community from generation 50 onward, where productivity
    and denitrification rates were significantly higher than in the CR communities. Preserve this positive abundance/function
    observation. Dominance is not a demonstrated reciprocal competition assay, nor does this comparison isolate
    Paracoccus abundance as the causal driver of higher function.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: higher with Paracocus denitrificans as the dominant species (since the 50th generation) in the DR community
      than those in the CR community
    explanation: The abstract spells the genus Paracocus; retain canonical Paracoccus identity while preserving
      the literal source. Supports dominance associated with higher productivity/denitrification, not a dominance
      intervention.
- name: DR Overyielding and Asynchronous Stability
  description: DR communities had significantly higher temporal stability, with overyielding and asynchronous species
    fluctuations, and more complementarity than CR communities during evolution. Preserve the reported stability
    result and statistical ecological interpretation. Aggregate complementarity/asynchrony does not identify exchanged
    resources or demonstrate a species-resolved causal chain; higher stability is not an upstream cause of its own
    decomposition.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'higher stability through overyielding and asynchrony of species fluctuations

      '
    explanation: Supports the reported ecological pattern and interpretation, without identifying compound-resolved
      niche partitioning or an experimentally isolated mediator.
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: showed more complementarity than the CR group during the experimental evolution
    explanation: Supports the reported ecological pattern and interpretation, without identifying compound-resolved
      niche partitioning or an experimentally isolated mediator.
environmental_factors:
- name: defined synthetic community design
  value: Closely related communities used Shewanella strains; distantly related communities used constituents
    from different genera.
  description: Experimental evolution for 200 generations.
  evidence:
  - *id001
related_ingredients:
- preferred_term: nitrate
  chebi_term:
    id: CHEBI:17632
    label: nitrate
  relevance: 'The defining substrate of every member of the CR and DR synthetic denitrifying communities
    — denitrification is by definition the dissimilatory reduction of nitrate, and the Zhou et al.
    2023 study quantifies denitrification rates as the primary functional readout across the
    phylogenetic-diversity gradient. The Edison-surfaced companion Wu et al. 2023 Microbiology Spectrum
    paper (DOI:10.1128/spectrum.04528-22, also a 12-Shewanella SynCom under serial-transfer evolution)
    states the substrate explicitly as 20 mM NaNO3 supplied as the electron acceptor.'
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Denitrification is an important process of the global nitrogen cycle as some of its
      intermediates are environmentally important or related to global warming
    explanation: Establishes denitrification (nitrate reduction) as the defining process of the SDCs;
      the substrate is nitrate.
- preferred_term: dinitrogen oxide
  chebi_term:
    id: CHEBI:17045
    label: dinitrogen oxide
  relevance: The greenhouse-gas intermediate of the denitrification pathway — Zhou et al. 2023
    motivate the work by framing some denitrification intermediates (notably N2O) as "related to
    global warming"; the DR Paracoccus-dominated community achieves higher denitrification rates,
    relevant to mitigating N2O emissions in environmental applications.
  evidence:
  - reference: PMID:37207729
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study has important implications for applying synthetic communities to remediate
      environmental problems and mitigate greenhouse gas emissions
    explanation: Names mitigation of greenhouse gas emissions (N2O is the key denitrification-derived
      GHG) as a motivating application of the phylogenetically diverse SDCs.
growth_media:
- name: Modified marine broth 2216 supplemented with 20 mM NaNO3 (nitrate as electron acceptor)
  composition:
  - name: marine broth 2216 (modified)
  - name: sodium nitrate
  temperature: '25'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  vessel_type: Balch tubes (three replicate)
  preparation_notes: Conditions are drawn from the same group's closely related, open-access
    all-Shewanella denitrifying-SynCom study (Wu et al. 2023, Microbiol Spectr), which describes the
    identical cultivation used to build the Shewanella (closely related, CR) synthetic denitrifying
    communities of this record; the paywalled primary paper (PMID:37207729) reports no Methods in its
    abstract. Strains cultured anaerobically in a modified marine broth 2216 (Becton, Dickinson) with
    20 mM NaNO3 as electron acceptor, at 25°C in replicate Balch tubes, then serially transferred for
    experimental evolution.
  evidence:
  - reference: doi:10.1128/spectrum.04528-22
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultured anaerobically in three replicate Balch tubes at 25°C in the modified marine broth
      2216 (Becton, Dickinson)
    explanation: States the anaerobic atmosphere, 25°C incubation temperature, marine broth 2216 base
      medium, and Balch-tube vessel for the same group's all-Shewanella denitrifying SynCom (the CR
      community type in this record).
  - reference: doi:10.1128/spectrum.04528-22
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultivated in a modified 2216 medium
    explanation: Confirms the modified marine broth 2216 as the defined base medium for constructing
      the synthetic denitrifying communities.
  - reference: doi:10.1128/spectrum.04528-22
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: as the electron acceptor
    explanation: Supports 20 mM nitrate (NaNO3) supplied as the terminal electron acceptor for
      anaerobic denitrification in the medium.
