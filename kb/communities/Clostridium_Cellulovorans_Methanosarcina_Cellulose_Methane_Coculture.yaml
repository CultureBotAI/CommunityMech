    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: produced by C. cellulovorans during cellulose degradation
    explanation: Supports the source of the methanogenesis precursors, not consumption of every VFA or quantitative
      donor-resolved flux.
  - reference: PMID:28191038
    snippet: no H2 was detected in the cocultures throughout the cultivation period
    explanation: Supports the coculture gas profile in the primary Results; absence of accumulated hydrogen does
      not quantify its production and consumption separately.
    evidence_source: IN_VITRO
