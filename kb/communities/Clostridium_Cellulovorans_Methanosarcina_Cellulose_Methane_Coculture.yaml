id: CommunityMech:000174
name: Clostridium cellulovorans-Methanosarcina barkeri Cellulose Methane Coculture
description: >
  A defined anaerobic cellulose-to-methane coculture combining the cellulolytic
  fermenter Clostridium cellulovorans 743B with the metabolically versatile methanogen
  Methanosarcina barkeri Fusaro. C. cellulovorans degrades cellulose and produces
  methanogenesis precursors including hydrogen, formate, and acetate, while M. barkeri
  consumes those products for methanogenesis. The system is relevant to DOE bioenergy
  because it is an experimentally tractable model for renewable methane production
  from cellulosic biomass and for engineering anaerobic biomethanation consortia.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: METHANOGENESIS
engineering_design:
  objective: Establish a genetically tractable two-member model for direct conversion of cellulose
    to methane through fermentative cellulose degradation coupled to methanogenesis.
  assembly_strategy: Bottom-up coculture assembled from C. cellulovorans 743B and M. barkeri Fusaro
    in anaerobic DCB-1 medium with cellulose as the sole added substrate.
  perturbation_design: Monocultures and cocultures were compared for cellulose degradation, gas
    production, VFA dynamics, pH, cell abundance, and RT-qPCR expression of interaction-related
    genes.
  measurement_endpoints:
  - Cellulose degradation
  - Methane and hydrogen production
  - Formate and acetate depletion
  - Volatile fatty acid concentrations
  - pH stabilization
  - RT-qPCR expression of selected metabolic genes
  evidence:
  - reference: PMID:28191038
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: experimentally tractable model system
    explanation: Supports the model-system design for mechanistic study.
  - reference: PMID:28191038
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: assembling consortia as inocula
    explanation: Supports the bioenergy engineering objective of the coculture model.
