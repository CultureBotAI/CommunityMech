ecological_interactions:
- name: Cellulose Fermentation to Methanogenesis Precursors
  description: C. cellulovorans 743B ferments cellulose to hydrogen, formate and acetate that support M. barkeri
    Fusaro methanogenesis in the tested coculture. Methane production, undetectable hydrogen and transient formate/acetate
    accumulation followed by depletion support the supply model. Other fermentation products, including butyrate
    and lactate, are not thereby established as substrates consumed by M. barkeri. Product pools reflect simultaneous
    production and consumption, not directly resolved partner-specific fluxes.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
