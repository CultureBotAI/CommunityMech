cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  working_volume: 100.0
  working_volume_unit: mL
  operating_temperature: 35.0
  operating_temperature_unit: °C
  instrument_detail: >-
    160 mL serum bottles holding 100 mL of DCB-1 medium, incubated at 35 °C without shaking,
    with the headspace filled with CO2/N2 (20%:80%) and 2.5 g/L sodium bicarbonate in the
    medium. Monoculture and coculture experiments used the same setup, which is what makes the
    two comparable.
  notes: >-
    The headspace is a supply, not an atmosphere. CO2 at 20% plus bicarbonate is provided in
    excess so that the CO2 produced by C. cellulovorans need not be measured - the paper says
    so explicitly. Recording only "anaerobic" would lose the fact that one substrate of
    methanogenesis is deliberately non-limiting.

    Static, as with the other cellulose-degrading anaerobe cocultures in this sweep: the
    substrate is a settled solid and agitation would work against both the gas balance and the
    interspecies transfer.

    The media "recommended by the culture collections" for reviving the lyophilised strains
    are precultures and are not recorded (#529). The conditions above are stated for
    monocultures and cocultures together, so they are the community's.
  evidence:
  - reference: PMID:28191038
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All monoculture and coculture experiments were carried out in 160-mL serum bottles with
      100 mL of the DCB-1 medium as described above and incubated at 35 °C without shaking
    explanation: Vessel, working volume, medium, temperature and static operation — for the cocultures.
  - reference: PMID:28191038
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: excess CO2 was provided by filling the headspace of the culture bottles with CO2/N2
      (20%:80%) and 2.5 g/L of sodium bicarbonate was added as part of the DCB-1 medium
    explanation: The headspace composition, and that CO2 is deliberately supplied in excess.

