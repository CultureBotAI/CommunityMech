- name: Coculture-Associated Cellulose Degradation and pH Stabilization
  description: Coculturing with M. barkeri increased the extent of cellulose degradation by 13.8% relative to C.
    cellulovorans monoculture, with a final pH around 6.7 rather than 6.1. These are measured outcomes. HYPOTHESIZED
    - formate/acetate consumption and altered fermenter production jointly contribute to the smaller pH decline
    and improved degradation. Butyrate and lactate accumulated to lower levels without net depletion, and C. cellulovorans
    cell growth was not significantly improved; the reported growth yields were similar. This is not demonstrated
    reciprocal fitness mutualism or uniquely established pH mediation.
  scope: PAIRWISE
