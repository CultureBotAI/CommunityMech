- name: Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
  description: PARTIAL - coculture methane production and hydrogen, formate and acetate depletion, together with
    RT-qPCR, support the authors' acetoclastic and CO2-reduction model. M. barkeri did not grow with formate alone
    after nine months. A mixed-substrate monoculture consumed only about 1.5 mM of 10 mM supplied formate and little
    acetate, unlike the coculture. The specific formate-linked pathway and each electron contribution remain inferred
    rather than directly traced. The M. barkeri-to-C. cellulovorans direction represents proposed product-removal
    feedback to the fermenter, not donation of methanogenesis substrates in that direction.
