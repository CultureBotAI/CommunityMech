discussions:
- discussion_id: cellulose_methane_formate_and_ph_mediation
  prompt: Which pathways and partner changes mediate coculture-specific formate use and improved cellulose degradation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cellulose Fermentation to Methanogenesis Precursors
  - ecological_interactions#Coculture-Associated Multi-Substrate Methanogenesis by M. barkeri
  - ecological_interactions#Coculture-Associated Cellulose Degradation and pH Stabilization
  rationale: PMID:28191038 supports reproducible gas and VFA profiles, formate-only failure, limited mixed-substrate
    monoculture formate use and altered gene expression. Its conceptual pathways do not directly measure partner
    flux. Product removal and changed fermenter production can both affect pools and pH. Matched-pH interventions,
    partner-resolved flux and selective formate-pathway perturbations would separate mediation from association.
    Increased cellulose degradation did not significantly increase C. cellulovorans cell growth. The distinct M.
    mazei comparison is not added as a member of this record.
  posed_by: codex
  posed_date: '2026-10-05'
