- name: Elevated CO2-Associated Ectomycorrhizal Colonization
  description: Elevated CO2 increased ectomycorrhizal colonization of tree roots in the field study. Greater colonization
    was associated with a higher relative representation of short-distance exploration types. The plant-fungal association
    is retained, but the cited measurements do not directly resolve reciprocal fitness or transfer of particular
    glucose, glutamine or ammonium molecules. Trees are the plant context of this node, not a newly curated microbial
    member.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Fungi
    term:
      id: NCBITaxon:4751
      label: Fungi
  downstream:
  - target: Root Trait-Mediated Microbial Community Assembly
    description: 'PARTIAL: increased ectomycorrhizal colonization under elevated CO2 is associated with fungal community
      composition and exploration-type changes. This supports the authors'' root-associated assembly interpretation,
      not an independently isolated mediator or a uniformly positive effect on decomposers; elevated CO2 decreased
      saprotroph representation.'
  evidence:
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Conversely, eCO2 promoted associations between trees and ectomycorrhizal fungi
    explanation: Documents elevated CO2 effects on ECM abundance
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Trees mostly associated with short-distance exploration-type fungi that preferentially use labile soil
      N
    explanation: Details ECM functional guild shifts under eCO2
- name: Root Trait-Mediated Microbial Community Assembly
  description: Fine-root traits and microbial community composition covary across the warming and elevated-CO2 field
    treatments. The authors interpret root traits as mediators of climate responses, while the statistical associations
    do not independently establish every intermediate mechanism. Warming-associated resource investment in roots
    and elevated-CO2-associated tree mycorrhizal colonization have contrasting community effects. The record does
    not claim measured root-exudate chemistry, universal morphological change, or competition-reducing niche partitioning.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to other organism
    term:
      id: GO:0051707
      label: response to other organism
    notes: Broad biotic-response grounding retained for the root-associated community interpretation. A more specific
      non-symbiosis-implying term is a separate ontology question tracked in issue463.
  downstream:
  - target: Warming-Associated Root-Zone Decomposer Community
    description: 'PARTIAL: warming-associated root investment is proposed to change resources available to root-zone
      decomposers, consistent with the measured root-trait and microbial-composition associations. Exudate-mediated
      causation and decomposition flux are not independently isolated. This arrow does not imply that elevated CO2
      also promotes decomposers; its reported saprotroph response is opposite.'
  evidence:
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Our results indicate that plant fine-root trait variation is a crucial mechanism through which vascular
      plants in peatlands respond to climate change via their influence on microbial communities that regulate biogeochemical
      cycles
    explanation: The paper's own conclusion that root traits mediate the climate-microbe link.
- name: Predicted Viral Hosts and Depth-Associated Composition
  description: Metagenomic viral composition correlated with depth, water content and carbon chemistry, and aquatic-like
    sequence signatures were enriched near the peat surface. CRISPR matches predicted links to bacterial MAGs, generally
    within a genus where resolvable. These are computational host assignments and ecological associations, not direct
    infection, predation, cell lysis or viral-shunt measurements. No CRISPR links to the detected methanogen or
    methanotroph MAGs were recovered by this study; this is a limitation of the analysis, not evidence that such
    infections never occur. The sampled column was saturated throughout despite greater near-surface water content.
    No significant temperature-associated compositional effect was reported during the first two years.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34836550
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Predicted host ranges for SPRUCE vOTUs were relatively narrow, generally within a single bacterial
      genus
    explanation: Supports predicted host range or environmental association, not experimental predation or causal
      control.
  - reference: PMID:34836550
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: viral community composition was significantly correlated with peat depth, water content, and carbon
      chemistry
    explanation: Supports predicted host range or environmental association, not experimental predation or causal
      control.
  - reference: PMID:34836550
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: none of these MAGs had a CRISPR linkage to a vOTU
    explanation: The primary results do not identify viral hosts among the methanogen/methanotroph MAGs.
