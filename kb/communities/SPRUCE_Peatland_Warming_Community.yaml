environmental_factors:
- name: Temperature Gradient
  value: '+0 to +9'
  unit: °C above ambient
  description: 'Whole-ecosystem warming gradient with five treatment levels: ambient (+0°C), +2.25°C, +4.5°C, +6.75°C, and +9°C. Warming is achieved through chambered enclosures with active heating, maintained year-round. The gradient design allows dose-response analyses of microbial community responses to warming, revealing threshold effects and nonlinear responses. Warming effects include: increased saprophytic fungal and bacterial decomposition rates, altered plant root allocation, potential acceleration of peat carbon loss. The experiment represents realistic future warming scenarios for northern boreal regions under RCP 4.5 to RCP 8.5 climate projections.

    '
  evidence:
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: whole-ecosystem warming gradient (+0°C to 9°C)
    explanation: Documents experimental warming design
- name: Elevated CO2
  value: '+500'
  unit: ppm above ambient
  description: 'Elevated CO2 treatment adds ~500 ppm CO2 to ambient levels (~400 ppm), achieving ~900 ppm total atmospheric CO2. eCO2 is maintained within chambered enclosures through controlled CO2 injection. This treatment level represents projected atmospheric CO2 concentrations for late 21st century under high-emission scenarios. eCO2 effects include: enhanced plant photosynthesis and belowground carbon allocation, increased ectomycorrhizal fungal associations, shifts in ECM functional guild composition toward short-distance explorers. The eCO2 treatment interacts with warming, with some evidence for synergistic effects on plant-microbe interactions.

    '
  evidence:
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: to explore the effects of a whole-ecosystem warming gradient (+0°C to 9°C) and
      eCO2 on vascular plant fine roots and their associated microbes
    explanation: Documents the eCO2 arm of the experimental design, and the warming gradient.
- name: Peat Depth Gradient
  value: 0-200
  unit: cm depth
  description: 'Peat depth ranges from surface (0 cm, waterlogged Sphagnum layer) to deep anoxic peat (>100 cm). Depth gradients create strong environmental heterogeneity: surface peat has high water content, aerobic microsites, active plant-microbe interactions, and labile carbon; deep peat has anoxic conditions, recalcitrant carbon, slower decomposition, and methanogenic archaeal activity. Microbial and viral communities show strong stratification with depth, reflecting oxygen availability, carbon quality, and plant root distribution. Peat depth is one of the strongest predictors of viral community composition, exceeding temperature effects.

    '
  evidence:
  - reference: PMID:34836550
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: viral community composition was significantly correlated with peat depth
    explanation: Documents depth as major environmental driver
- name: Water Content
  value: Variable
  unit: '% volumetric water content'
  description: 'Peat water content varies from saturated (>80% VWC in surface peat) to unsaturated (<50% VWC in hummocks). Water content controls oxygen availability, redox potential, microbial metabolism (aerobic vs anaerobic), methane production, and nutrient diffusion. Waterlogged surface peat hosts aquatic-like viral communities, while drier peat supports terrestrial viruses. Warming may lower water table depth through increased evapotranspiration, potentially shifting peat from anaerobic to aerobic conditions with major implications for carbon cycling.

    '
  evidence:
  - reference: PMID:34836550
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: significantly correlated with peat depth, water content
    explanation: Documents water content as environmental driver
- name: Carbon Chemistry
  value: Variable CH4/CO2
  unit: ppm in pore water
  description: 'Peat carbon chemistry includes dissolved methane (CH4) and carbon dioxide (CO2) concentrations in pore water, reflecting microbial metabolism (methanogenesis, respiration). High CH4 indicates anaerobic methanogenic activity; high CO2 indicates aerobic or anaerobic respiration. Carbon gas concentrations correlate with viral community composition, likely through effects on microbial host populations. Methane emissions from peatlands represent a critical climate feedback, as CH4 is a potent greenhouse gas. Warming may increase methanogenesis rates but also enhance methanotrophy if water tables drop, with uncertain net effects on CH4 flux.

    '
  evidence:
  - reference: PMID:34836550
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: carbon chemistry, including CH4 and CO2 concentrations
    explanation: Documents carbon chemistry as environmental driver
- name: pH
  value: '3.5-4.5'
  unit: pH units
  description: 'Peatland pH is acidic (3.5-4.5), characteristic of ombrotrophic Sphagnum bogs. Low pH results from Sphagnum-mediated cation exchange, organic acid accumulation, and limited carbonate buffering. Acidic conditions select for specialized microbial taxa (acidophilic bacteria, fungi tolerant of low pH) and inhibit some decomposition pathways. pH may shift under warming due to altered plant community composition or increased decomposition rates.

    '
- name: Nutrient Status
  value: Oligotrophic
  description: 'Peatlands are nutrient-poor (oligotrophic) ecosystems, particularly limited in nitrogen and phosphorus. Nutrient limitation constrains plant growth and microbial activity, making nutrient acquisition (via mycorrhizal symbiosis, N-fixation, organic matter decomposition) critical. Ectomycorrhizal fungi play key roles in accessing limited N pools. Warming and eCO2 may alter nutrient availability through changes in decomposition rates (nutrient mineralization) and plant-microbe competition for nutrients.

    '
