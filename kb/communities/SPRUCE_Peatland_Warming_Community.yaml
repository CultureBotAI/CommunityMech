ecological_interactions:
- name: Warming-Associated Root-Zone Decomposer Community
  description: The field warming study found increased representation of saprophytic fungi and putative chemoorganoheterotrophic
    bacteria in root-associated communities. Trait measurements and amplicon profiles support a community response,
    not a directed mutualistic benefit between all fungi and bacteria. Increased decomposition is a functional interpretation;
    the cited observations do not directly measure specific cellulase, laccase or peroxidase activity, fungal-to-bacterial
    carbon transfer, or methane production by these participants.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Warming promoted self-reliance for resource uptake in trees and shrubs, while saprophytic fungi and
      putative chemoorganoheterotrophic bacteria utilizing plant-derived carbon substrates were favored in the root
      zone
    explanation: Documents warming effects on decomposer communities
