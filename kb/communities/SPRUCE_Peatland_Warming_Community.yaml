discussions:
- discussion_id: warming_graph_evidence_scope
  prompt: Which root-mediated and viral processes are measured rather than inferred from community profiles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The root paper supports increased ECM colonization and community responses, including opposite saprotroph
    responses to warming and elevated CO2. Retain both existing directions as PARTIAL, without a uniform positive
    chain, measured compound exchange or fungal-bacterial mutualism. The virome paper provides host predictions,
    not measured lysis or top-down control; no methane-cycler MAG had a CRISPR host link. Functional decomposition
    and root-exudate mediation need process-specific evidence. Non-graph descriptions and dataset claims remain
    a separate review scope.
  evidence:
  - reference: PMID:38515239
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Additionally, eCO2 decreased the relative abundance of saprotrophs in tree roots
    explanation: The treatment effects must not be propagated with the same positive sign.
  attaches_to:
  - ecological_interactions#Warming-Associated Root-Zone Decomposer Community
  - ecological_interactions#Elevated CO2-Associated Ectomycorrhizal Colonization
  - ecological_interactions#Root Trait-Mediated Microbial Community Assembly
