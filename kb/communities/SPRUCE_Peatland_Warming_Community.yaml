environment_term:
  preferred_term: peatland
  term:
    id: ENVO:00000044
    label: peatland
  notes: 'Northern boreal peatland ecosystem at Marcell Experimental Forest, Minnesota, USA. The SPRUCE experiment site consists of Sphagnum-dominated ombrotrophic bog with black spruce (Picea mariana), ericaceous shrubs (Rhododendron groenlandicum, Chamaedaphne calyculata), and sedges (Carex). Peat depth ranges from surface (waterlogged, high water content) to deeper anoxic layers. The experimental design includes 10 treatment plots (5 temperature levels × 2 CO2 levels) with chambered enclosures maintaining warming gradients from ambient to +9°C and ambient to +900 ppm CO2. Sampling includes plant fine roots, rhizospheres, bulk peat at multiple depths, and pore water. Environmental characteristics: acidic pH (3.5-4.5), anoxic subsurface, high organic matter content, carbon-rich (methane and CO2 production), oligotrophic nutrient status. The peatland represents a critical carbon reservoir vulnerable to climate change, with potential for accelerated decomposition, altered plant-microbe interactions, and shifts from carbon sink to source under warming.

    '
