ecological_interactions:
- name: Warming-Enhanced Saprophytic Decomposition
  description: 'Whole-ecosystem warming (+2.25°C to +9°C) promotes saprophytic fungal and chemoorganoheterotrophic bacterial abundance and activity in root-associated environments. Saprophytic fungi (primarily Basidiomycota and Ascomycota) decompose plant litter, peat organic matter, and dead root tissues, releasing CO2 and mobilizing nutrients. Warming accelerates enzymatic activity (cellulases, laccases, peroxidases) and fungal hyphal growth rates, increasing organic carbon mineralization. Bacterial decomposers (Proteobacteria, Acidobacteria, Actinobacteria) synergize with fungal decomposition by metabolizing low-molecular-weight organic compounds released during fungal litter breakdown. This climate-driven enhancement of decomposition has critical ecosystem consequences: (1) accelerated carbon loss from peat carbon stores, potentially shifting peatlands from carbon sinks to sources; (2) increased nutrient availability for plants, potentially stimulating productivity; (3) altered peat structure and hydrology through organic matter breakdown. The warming effect on decomposition is modulated by peat moisture status, with waterlogged conditions limiting aerobic decomposition despite elevated temperatures.

    '
  interaction_type: MUTUALISM
  scope: PAIRWISE
