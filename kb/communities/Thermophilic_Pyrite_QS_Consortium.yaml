  description: 'The consortium operates at moderately thermophilic temperature (40°C) with constant shaking
    at 140 rpm. This temperature represents a compromise between mesophilic L. ferriphilum (optimum 30-37°C),
    moderately thermophilic A. caldus (optimum 45°C), and thermophilic S. thermosulfidooxidans (optimum
    50-55°C). The 40°C cultivation enables all three species to maintain metabolic activity while approximating
    industrial bioleaching conditions where exothermic sulfide oxidation elevates temperatures. L. ferriphilum
    dominates commercial biooxidation tanks operating at 40°C, confirming suitability of this temperature
    for consortium function. Moderately thermophilic conditions accelerate reaction kinetics compared
    to mesophilic systems, increasing metal extraction efficiency while avoiding extreme temperatures
    that would denature proteins or require specialized thermophilic strains.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2025.1592588
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Mixed microbial consortia composed of moderate thermophiles such as Sulfobacillus and some
      Leptospirillum species improve metal extraction efficiency at higher temperatures compared to pure
      cultures of mesophiles
    explanation: Documents experimental cultivation temperature
  - reference: doi:10.1128/aem.68.2.838-845.2002
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Iron-oxidizing bacteria belonging to the genus Leptospirillum are of great importance in
      continuous-flow commercial biooxidation reactors, used for extracting metals from minerals, that
      operate at 40°C or less
    explanation: Confirms relevance to industrial operations at 40°C
- name: pH
  value: 2.0-2.5
  unit: pH units
  description: 'The consortium maintains acidic pH 2.0-2.5 through continuous sulfuric acid generation
    by A. caldus and S. thermosulfidooxidans sulfur oxidation. This pH range is optimal for all three
    species: L. ferriphilum thrives at pH 1.5-2.5, A. caldus optimum is pH 2.0-2.5, and S. thermosulfidooxidans
    tolerates similar acidity. Low pH is essential for maintaining ferric iron solubility (Fe³⁺ precipitates
    as Fe(OH)₃ at pH >3), enabling continued mineral oxidation. Acidic conditions protonate mineral surfaces,
    enhancing Fe³⁺ attack on sulfide bonds. The pH also selects against non-acidophilic contaminants,
    maintaining consortium purity. Media pH 2.0-2.5 represents the equilibrium between sulfuric acid production
    and buffering capacity, creating stable conditions for sustained iron and sulfur oxidation. This pH
    range is typical of industrial heap leach operations and acid mine drainage environments where these
    organisms naturally dominate.

    '
