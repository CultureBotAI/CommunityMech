environment_term:
  preferred_term: mine tailing
  term:
    id: ENVO:00000003
    label: mine tailing
  notes: 'Laboratory-scale moderately thermophilic bioleaching system using pyrite (FeS₂) and chalcopyrite
    (CuFeS₂) minerals as substrates. Cultures were grown in acidic media (pH 2.0-2.5) at 40°C with constant
    shaking at 140 rpm. The experimental system creates heterogeneous environments with planktonic and
    mineral-attached bacterial subpopulations that respond differentially to quorum sensing signals. The
    consortium oxidizes iron and sulfur compounds from mineral sulfides, generating ferric iron and sulfuric
    acid typical of industrial bioleaching operations. This controlled environment enables investigation
    of quorum sensing-mediated coordination of mineral colonization, cell motility, and metabolic activities
    in acidophilic thermophiles.

    '
