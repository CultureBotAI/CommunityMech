- name: Pyrite and Chalcopyrite Dissolution
  description: The three-species culture catalyzes sulfide-mineral dissolution through iron and sulfur oxidation.
    Ferric attack releases ferrous iron that can be reoxidized; copper release reports chalcopyrite dissolution.
    Added DSF/BDSF decreased bioleaching under the tested conditions, with effects on growth, redox potential and
    colonization. The contributions of signaling, fatty-acid stress and cell damage were not selectively separated.
    Pyrite and chalcopyrite responses differ; the outcome is not evidence of Leptospirillum-to-Sulfobacillus mutualism
    or uniformly beneficial biofilm stabilization by AHLs.
