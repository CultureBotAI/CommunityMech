- name: Dual Iron and Sulfur Oxidation by Sulfobacillus
  description: S. thermosulfidooxidans DSM 9293 has both ferrous-iron and inorganic sulfur-oxidizing capacity and
    can grow mixotrophically. The 2025 consortium assays used 40 C, not the species growth optimum. Its biofilm
    relative distribution at 7 and 14 days was not significantly changed by DSF/BDSF, although other assay designs
    and time points showed inhibition. The separate 2020 two-species study found that co-inoculation improved leaching
    relative to S. thermosulfidooxidans alone but not relative to L. ferriphilum biofilms; precolonization could
    impair leaching. These condition-dependent findings do not establish universal mutualism or measured consumption
    of partner lysate or EPS.
