- name: DSF Quorum Sensing Signals
  value: '2'
  unit: μM
  description: 'Diffusible signal factor (DSF) compounds including (Z)-11-methyl-2-dodecenoic acid (DSF)
    and (Z)-2-dodecenoic acid (BDSF) were added at 2 μM each to investigate quorum sensing effects. DSF
    is naturally produced by L. ferriphilum through RpfF-family synthases and accumulates as population
    density increases. At 2 μM concentrations, DSF compounds induced significant changes in community
    behavior: reduced pyrite and chalcopyrite dissolution, increased A. caldus motility and dispersion
    from minerals, expanded L. ferriphilum surface colonization, and decreased mineral-attached populations
    of all three species. These effects demonstrate that DSF acts as a density-dependent signal coordinating
    consortium-level transitions between biofilm and planktonic lifestyles. The 2 μM concentration likely
    represents biologically relevant levels achievable during high-density biofilm development. DSF signaling
    provides a mechanism for cells to sense population density and adjust metabolic strategies, mineral
    colonization patterns, and community spatial structure accordingly.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2025.1592588
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In this study, treatment of a moderately thermophilic biomining consortium with QS compounds,
      termed diffusible signal factors (DSF), reduced pyrite and chalcopyrite dissolution via an inhibitory
      effect on iron oxidation and mineral colonization by the mixed culture
    explanation: Quantifies DSF treatment concentrations
  - reference: doi:10.3389/fmicb.2025.1592588
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: treatment of a moderately thermophilic biomining consortium with QS compounds, termed diffusible signal factors (DSF), reduced pyrite and chalcopyrite dissolution
    explanation: Documents functional effects of DSF at this concentration
- name: AHL Quorum Sensing Signals
  value: '5'
  unit: μM
  description: 'N-acyl-homoserine lactone (AHL) mixtures containing C12-AHL, C14-AHL, 3-OH-C12-AHL, and
    3-OH-C14-AHL were added at 5 μM each to assess AHL-mediated quorum sensing. These long-chain AHLs
    are potentially produced by A. caldus and S. thermosulfidooxidans LuxI-type synthases. At 5 μM concentrations
    (higher than 2 μM DSF treatment), AHLs repressed L. ferriphilum motility, contrasting with DSF effects.
    AHL signaling may stabilize biofilm formation and mineral attachment during high cell density conditions.
    The use of multiple AHL species (C12, C14, and 3-hydroxylated variants) reflects the diversity of
    AHL signals in natural systems and enables detection of responses to different chain lengths and modifications.
    AHL concentrations of 5 μM are within ranges observed in bacterial biofilms and represent biologically
    relevant signaling levels. The opposing regulatory effects of DSF versus AHL systems suggest complex
    multi-layered quorum sensing networks coordinate community assembly, with DSF promoting species redistribution
    while AHL stabilizes attachment.

    '
