    notes: 'Chemolithoautotrophic iron-oxidizing bacterium (Nitrospirae phylum) representing a dominant
      member of moderately thermophilic bioleaching consortia. L. ferriphilum DSM 14647 (type strain)
      oxidizes ferrous iron [Fe(II)] to ferric iron [Fe(III)] as the primary energy source for carbon
      fixation. This organism produces and responds to diffusible signal factor (DSF) quorum sensing compounds.
      Treatment with exogenous DSF induces expansion of L. ferriphilum populations on pyrite mineral surfaces,
      while AHL-mediated quorum sensing represses L. ferriphilum motility. Temperature optimum is 30-37°C
      with growth capability at 40-45°C, enabling activity in moderately thermophilic bioleaching operations.
      L. ferriphilum predominates in sulfide mineral-containing environments and serves as an effective
      primary mineral colonizer. The organism thrives at extremely low pH (1.5-2.5) and high ferric iron
      concentrations, maintaining iron oxidation activity critical for sustained mineral dissolution.
      Genome-encoded DSF synthase (RpfF homolog) enables quorum sensing signal production that coordinates
      community behavior.

      '
