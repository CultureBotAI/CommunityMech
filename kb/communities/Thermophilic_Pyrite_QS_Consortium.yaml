discussions:
- discussion_id: endogenous-signal-and-stress-separation-batch115
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which endogenous signals and receptors mediate mineral redistribution at natural concentrations?
  rationale: 'Biogenic DSF production has experimental support, but micromolar additions combine signaling and stress.
    Density-matched and receptor/production perturbations are needed to assign the three-species phenotype to endogenous
    signaling. AHL-producing partners and exact compound groundings remain unresolved. Non-graph assay and signaling
    metadata remain issue #1896.'
