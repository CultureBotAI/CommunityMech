- name: Responses to Added DSF and BDSF
  description: 'The 2025 mixed-culture experiments added DSF and BDSF at 2 uM each. Pyrite relative abundances and
    planktonic transcripts support A. caldus dispersal and relative L. ferriphilum enrichment on mineral surfaces,
    with context-dependent inhibition of growth and leaching. The separate 2021 study confirmed biogenic DSF in
    L. ferriphilum and L. ferrooxidans pyrite cultures by GC-MS at nanomolar concentrations. That production result
    is retained, but it does not prove the micromolar treatment phenotype arises from endogenous transfer within
    this three-species consortium. HYPOTHESIZED: natural niche defense and receptor-mediated regulation; fatty-acid
    stress can also contribute. Neither mutual benefit nor density-dependent protection against mineral overexploitation
    was demonstrated.'
