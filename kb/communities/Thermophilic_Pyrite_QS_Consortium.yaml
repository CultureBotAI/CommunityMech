    notes: 'Gram-positive, spore-forming, moderately thermophilic bacterium (Firmicutes) that oxidizes
      both ferrous iron and reduced sulfur compounds. S. thermosulfidooxidans DSM 9293 (type strain AT-1)
      exhibits temperature optimum at 50-55°C with growth range of 20-60°C, representing the most thermophilic
      member of the consortium. This facultatively autotrophic organism can grow mixotrophically on organic
      compounds plus Fe²⁺ or S⁰, providing metabolic flexibility. Displays considerable tolerance of high
      copper, zinc, nickel, and cobalt concentrations, making it valuable for polymetallic ore processing.
      S. thermosulfidooxidans responds to DSF quorum sensing signals with decreased mineral attachment,
      shifting toward planktonic lifestyle. The organism''s spore-forming capability provides resilience
      to fluctuating environmental conditions in bioleaching operations. Its dual iron and sulfur oxidation
      capabilities enable participation in both ferric iron generation for mineral oxidation and sulfuric
      acid production for pH maintenance. S. thermosulfidooxidans bridges mesophilic and thermophilic
      temperature ranges, allowing consortium function across varying thermal conditions generated by
      exothermic sulfide oxidation reactions.

      '
