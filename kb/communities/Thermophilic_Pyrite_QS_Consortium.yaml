    notes: 'Gram-negative γ-proteobacterium specialized for oxidizing reduced inorganic sulfur compounds
      (RISCs) including elemental sulfur, tetrathionate, and thiosulfate to sulfuric acid. A. caldus DSM
      8584 (type strain KU) is a moderately thermophilic acidophile with temperature optimum at 45°C and
      pH optimum at 2.0-2.5. This organism does not oxidize iron, focusing exclusively on sulfur metabolism
      to generate the acidic conditions essential for mineral dissolution. A. caldus possesses an AHL-type
      quorum sensing system and responds to exogenous DSF compounds with increased motility and dispersion
      from pyrite surfaces. DSF treatment induced a decrease in mineral-attached A. caldus populations,
      demonstrating QS-mediated control of biofilm formation and mineral colonization patterns. The organism
      prevents accumulation of passivating elemental sulfur layers on mineral surfaces that would inhibit
      leaching. A. caldus contributes sustained sulfuric acid production throughout bioleaching cycles,
      maintaining the low pH required for ferric iron stability and mineral attack. Its thermophilic nature
      enables operation at elevated temperatures (40-50°C) typical of exothermic sulfide oxidation in
      industrial heaps.

      '
