ecological_interactions:
- name: Ferrous Iron Oxidation by Leptospirillum
  description: L. ferriphilum DSM 14647 oxidizes ferrous iron to ferric iron for chemolithoautotrophic growth. Ferric
    iron is a chemical oxidant of sulfide minerals, not evidence of a measured nutrient transfer to a named microbial
    recipient. Carbon fixation is retained without assigning the Calvin-Benson-Bassham pathway. The 2025 study measured
    growth, redox potential and mineral-colonization responses to added signal compounds at 40 C. Relative enrichment
    on pyrite in the mixed culture is not an absolute increase in every condition or proof of natural density-dependent
    control of iron oxidation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: Fe(II)
    term:
      id: CHEBI:29033
      label: iron(2+)
  - preferred_term: Fe(III)
    term:
      id: CHEBI:29034
      label: iron(3+)
  downstream:
  - target: Pyrite and Chalcopyrite Dissolution
    description: Biological oxidation regenerates ferric iron, the chemical oxidant that attacks sulfide minerals
      and enables their dissolution. This is the iron-recycling mechanism described in the cited studies, not a
      pairwise cross-feeding assay or proof that increasing oxidation always improves chalcopyrite recovery; its
      redox-potential window matters.
  evidence:
  - reference: doi:10.1038/s41598-021-95324-9
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: iron(II)-ion oxidation regenerates iron(III) ions, the chemical oxidant of the metal sulfide bond
    explanation: The source introduction describes the mineral iron-recycling mechanism; not a measured microbial
      exchange.
  - reference: doi:10.3389/fmicb.2025.1592588
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: L. ferriphilum is the single moderately thermophilic Leptospirillum species and uses iron(II) as sole
      energy source and fixes carbon dioxide
    explanation: Background physiology supports the species role, without specifying a carbon-fixation pathway.
  participating_taxa:
  - preferred_term: Leptospirillum ferriphilum
    term:
      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
- name: Sulfur Oxidation by Acidithiobacillus caldus
  description: A. caldus DSM 8584 supplies inorganic sulfur-oxidizing capacity in the three-species culture. Sulfur
    oxidation contributes to acid generation, but the cited mixed-culture study does not isolate a passivation-removal
    benefit to another named species or selective DSF control of sulfur-oxidation flux. Under added DSF/BDSF, pyrite-attached
    relative abundance decreased while the planktonic fraction increased; flagellar transcript changes support a
    dispersal interpretation. Axenic and mixed-culture responses differ.
  scope: COMMUNITY_LEVEL
  metabolites:
