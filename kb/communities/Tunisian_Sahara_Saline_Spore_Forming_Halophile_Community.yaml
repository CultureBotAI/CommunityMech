id: CommunityMech:000494
name: Tunisian Sahara Saline Spore-Forming Halophile Community
description: Halophilic and halotolerant aerobic endospore-forming bacterial community characterized across 336 spore-forming
  isolates recovered from five salt-saturated brines and soils (Chott and Sebkhas) in the hyper-arid southern Tunisian Sahara.
  Based on 16S-23S rRNA ITS fingerprinting and 16S rRNA gene sequencing, the community spans seven Firmicutes genera—Bacillus,
  Gracilibacillus, Halobacillus, Oceanobacillus, Paenibacillus, Pontibacillus, and Virgibacillus—with Halobacillus trueperi
  as the most frequently encountered species across all sites (42 isolates in the dominant ITS type spanning 14 BOX-PCR genotypes)
  and community members partitioned across extremely halotolerant (44.3%), strict halophilic (32.7%), and moderately halotolerant
  (23%) salinity guilds (PMID:23949950).
