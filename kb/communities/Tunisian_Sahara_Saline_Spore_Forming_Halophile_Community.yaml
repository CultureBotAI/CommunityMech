    snippet: 44.3 % of the isolates were extremely halotolerant, 23 % were moderate halotolerant, and 32.7 % were strict halophiles,
      indicating that they are adapted to thrive in these saline ecosystems.
    explanation: Quantifies the partitioning of the 336 spore-forming isolates into extremely halotolerant (44.3%), moderately
      halotolerant (23%), and strict halophilic (32.7%) salinity guilds.
  - reference: PMID:23949950
    supports: SUPPORT
