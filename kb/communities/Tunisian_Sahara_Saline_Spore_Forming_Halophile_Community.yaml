      Oceanobacillus, Paenibacillus, Pontibacillus, and Virgibacillus. Halobacillus trueperi was the most encountered species
      in all the sites and presented a large intraspecific diversity with a multiplicity of ITS types.'
    explanation: Documents the seven co-occurring Firmicutes genera and the dominance of Halobacillus trueperi across all
      sites.
  - reference: PMID:23949950
    supports: SUPPORT
    evidence_source: FIELD_STUDY
    snippet: A high intraspecific microdiversity was documented by 14 BOX-PCR genotypes whose distribution correlated with
