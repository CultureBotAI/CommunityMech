id: CommunityMech:000199
name: Dehalococcoides-Desulfovibrio Lactate-Fed TCE Dechlorination Coculture
description: >
  A defined anaerobic syntrophic coculture pairing Dehalococcoides mccartyi
  strain 195 with Desulfovibrio vulgaris Hildenborough. In this laboratory
  model for chlorinated-solvent groundwater bioremediation, D. vulgaris
  Hildenborough ferments lactate and supplies hydrogen and acetate that support
  strain 195 growth and reductive dechlorination. The system is DOE-relevant
  because it resolves metabolite exchange and stress responses that affect
  organohalide-respiring communities used for in situ trichloroethene
  bioremediation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Establish a sustainable two-member syntrophic coculture that supports
    Dehalococcoides strain 195 reductive dechlorination using lactate as the
    supplied organic substrate.
  assembly_strategy: Pair organohalide-respiring D. mccartyi strain 195 with
    lactate-fermenting D. vulgaris Hildenborough in defined anaerobic coculture.
  perturbation_design: Compare strain 195 pure culture, DvH/195 coculture, and
    related tricultures or sulfate/sulfide perturbations to quantify syntrophic
    enhancement and inhibition mechanisms.
  measurement_endpoints:
  - Dechlorination rate
  - Dehalococcoides strain 195 cell yield
  - Transcriptomic response
  - Proteomic response
  - Sulfate and sulfide inhibition
  evidence:
  - reference: PMID:21881617
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dehalococcoides ethenogenes strain 195 (DE195) was grown in a sustainable syntrophic association with Desulfovibrio vulgaris Hildenborough
    explanation: Supports the exact two-member syntrophic coculture design.
  - reference: PMID:21881617
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: global transcriptomic and proteomic analyses
    explanation: Supports transcriptomic and proteomic endpoints for the coculture study.
