    snippet: capabilities of DVH to ferment lactate to provide H(2) and acetate for growth
    explanation: Supports the hydrogen and acetate cross-feeding mechanism from DvH to strain 195.
  - reference: PMID:24463969
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Only the triculture exhibited sustainable dechlorination and cell growth
    explanation: Constrains the cobalamin-free comparison to the tested DMB-amended consortia. It does not mean
      the cobalamin-supplemented two-member coculture cannot grow.
- name: Enhanced TCE Dechlorination By Syntrophic Support
  description: Strain 195 showed faster reductive dechlorination and greater cell yield in DvH coculture than in
    isolation. The approximately threefold comparison concerns maximum dechlorination rate, not every growth endpoint.
    This is the recipient dechlorinator phenotype, not a second DvH-to-Dhc195 metabolite-transfer event.
