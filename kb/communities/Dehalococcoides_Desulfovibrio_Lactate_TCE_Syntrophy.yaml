discussions:
- discussion_id: dhc_dvh_inhibition_and_support_limits
  prompt: Which ancillary partner benefits and sulfide-sensitive processes explain strain-195 performance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Lactate Fermentation Supports Dehalococcoides Growth
  - ecological_interactions#Enhanced TCE Dechlorination By Syntrophic Support
  - ecological_interactions#Sulfide-Associated Inhibition Of Dechlorination
  rationale: 'Keep measured fermentation support and conditional inhibition distinct. The 2012 full body was unavailable;
    ancillary benefits remain potential. The 2017 primary body distinguishes donor-excess cocultures from donor-limited
    tricultures and shows inhibition despite hydrogen availability. Its abstract and Results differ on the DvH sulfide
    threshold. Expression changes do not by themselves identify the inhibited enzyme. Broader field concentrations
    and mechanisms are not established by these laboratory comparisons. Non-graph follow-up: #1385.'
  posed_by: codex
  posed_date: '2026-10-06'
