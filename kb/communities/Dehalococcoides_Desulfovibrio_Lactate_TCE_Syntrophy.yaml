    description: DvH-derived hydrogen and acetate support strain-195 growth and reductive dechlorination in the
      tested coculture. The faster dechlorination comparison does not isolate every proposed ancillary benefit;
      proton translocation, amino-acid supply and corrinoid-related effects are not separately demonstrated by this
      arrow.
