ecological_interactions:
- name: Lactate Fermentation Supports Dehalococcoides Growth
  description: DvH fermentation of lactate supplies hydrogen as electron donor and acetate for strain-195 growth
    in the syntrophic coculture. Hydrogen consumption by the dechlorinator supports fermentative energetics. This
    does not establish that DvH supplies every required cofactor; later cobalamin-free tests required an additional
    corrinoid source or cobalamin amendment.
