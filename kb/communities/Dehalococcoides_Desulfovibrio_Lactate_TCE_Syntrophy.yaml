    recipient activity without a duplicate transfer claim.; Retain the conditional negative arrow while separating
    sulfide toxicity from hydrogen competition. Issue #1382; reports/causal_graph_review/decisions/20261006-three-records-batch30.yaml'
  llm_assisted: true
