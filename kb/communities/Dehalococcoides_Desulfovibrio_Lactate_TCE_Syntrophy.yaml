    description: Under the tested high-sulfate, electron-donor-excess conditions, accumulated sulfide suppresses
      strain-195 dechlorination despite available hydrogen. Electron allocation to sulfate reduction is not sufficient
      evidence that hydrogen competition caused this inhibition. The arrow qualifies the recipient phenotype under
      this perturbation, not its unperturbed coculture rate.
  evidence:
  - reference: PMID:28159790
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: high sulfate concentrations (5 mM) inhibited reductive dechlorination due to the toxicity of generated
      sulfide
    explanation: Supports generated-sulfide toxicity in electron-acceptor-limited cocultures; does not establish
      sulfate toxicity or a hydrogen-starvation mechanism.
  - reference: PMID:28159790
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sulfide at 5 mM exhibited inhibitory effects
    explanation: Supports sulfide inhibition in the tested cultures. The primary Results distinguish organism-specific
      thresholds; the abstract and Results differ on the DvH threshold, which is not resolved here.
