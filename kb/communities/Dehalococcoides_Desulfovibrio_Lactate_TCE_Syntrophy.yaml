- name: Sulfide-Associated Inhibition Of Dechlorination
  description: In the electron-acceptor-limited DvH/195 coculture, sulfate reduction at high initial sulfate generated
    sulfide and inhibited strain-195 dechlorination and growth. This is conditional sulfide-associated inhibition,
    not a general effect of sulfate itself or demonstrated hydrogen starvation. Donor-limited butyrate-triculture
    and enrichment outcomes are separate experiments.
