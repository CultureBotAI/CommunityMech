id: CommunityMech:000374
name: Achromobacter-Enterobacter SL8-SL12 Cadmium Immobilization Coculture
description: A defined two-member bacterial coculture assembled from the Cd-contaminated mine-area soil isolates Achromobacter
  sp. SL8 and Enterobacter sp. SL12 to immobilize cadmium. In 100 mg/L Cd2+ LB assays the SL8-SL12 coculture removed 80.9%
  of dissolved Cd after 7 days, exceeding both monocultures at the same Cd dose; Cd partitioning, microscopy, and spectroscopy
  associated this performance with CdS bioprecipitation, intracellular Cd accumulation, surface aggregation with possible
  EPS involvement, and phosphate-, amino-, and hydroxyl-bearing surface groups. In greenhouse Chinese-cabbage pots the
  inoculated coculture decreased bioavailable soil Cd fractions and lowered Cd in aboveground cabbage tissue under high
  Cd stress.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Test whether a deliberately combined Achromobacter sp. SL8 and Enterobacter sp. SL12 bacterial consortium improves
    Cd immobilization relative to monocultures and can reduce cadmium phytoavailability in soil-cabbage pot experiments.
  assembly_strategy: Isolate Cd-resistant bacteria from Cd-contaminated mine-area soil by LB enrichment and Cd2+-supplemented
    LB agar selection, identify SL8 and SL12 by 16S rRNA gene sequencing, and assay the two strains alone or as an SL8-SL12
    coculture.
  inoculation_strategy: Grow purified strains in LB at 30 C and 200 rpm to OD600 0.8, then transfer a 1% vol/vol inoculum
    into Cd2+-supplemented LB for liquid removal assays; greenhouse pots received the strains at 2 x 10^7 CFU/g soil before
    planting.
  perturbation_design: Compare SL8, SL12, and the SL8-SL12 coculture at 0, 50, or 100 mg/L Cd2+ in LB; profile the two monocultures
    and the coculture with or without 100 mg/L Cd2+ for extracellular metabolomics and proteomics; and test the coculture
    in soil spiked with 0, 5, or 10 mg/kg CdCl2.
  measurement_endpoints:
  - minimum inhibitory Cd concentration and Cd2+ removal efficiency
  - extracellular adsorption, intracellular accumulation, and bioprecipitation fractions
  - SEM, TEM, EDS, FTIR, and XPS characterization of Cd-associated precipitates
  - extracellular metabolomics and proteomics in monoculture and coculture
  - Chinese cabbage biomass and Cd content in greenhouse pots
  - rhizosphere soil Cd speciation and 16S rRNA amplicon profiles
  notes: The article title and GenBank accessions use the species assignments Achromobacter insuavis and Enterobacter cancerogenus,
    but the reported identification result was 16S rRNA gene sequence support for Achromobacter sp. SL8 and Enterobacter sp.
    SL12. No genome-backed species assignment was curated.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Building on this premise, our study investigates the combined effects of Achromobacter insuavis SL8 and Enterobacter
      cancerogenus SL12, two strains with documented Cd resistance and bioremediation potential
    explanation: Supports the deliberate two-strain Cd-bioremediation design.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When the bacterial suspension reached an OD600 of 0.8, 1% (vol/vol) of the culture was transferred into liquid
      LB medium supplemented with 50 mg/L or 100 mg/L Cd 2+ , followed by incubation under identical conditions (30℃, 200
      rpm).
    explanation: Supports the 1% inoculum, LB medium, Cd2+ doses, and 30 C/200 rpm liquid assay design.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Bacterial inoculation was performed by introducing the bacterial strains at a concentration of 2 × 10 7 CFU/g
      soil to each pot.
    explanation: Supports the greenhouse pot inoculation density.
