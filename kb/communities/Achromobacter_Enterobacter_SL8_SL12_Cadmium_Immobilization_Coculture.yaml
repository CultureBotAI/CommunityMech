      rpm).
    explanation: Supports the Cd2+ concentrations used for the liquid Cd-removal assay.
- name: SL8-SL12 100 mg/L Cd2+ removal after 7 days
  value: '80.9'
  unit: '% removal'
  description: The SL8-SL12 coculture removed 80.9% of Cd2+ at an initial LB concentration of 100 mg/L after 7 days.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After a 7-day incubation period, RE-Cd values reached 82.6% and 69.55% for SL8, 63.4% and 70.8% for SL12, and
      82.6% and 80.9% for the co-cultured strains at initial Cd concentrations of 50 mg/L and 100 mg/L, respectively.
