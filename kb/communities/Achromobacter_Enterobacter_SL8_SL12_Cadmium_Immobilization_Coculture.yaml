  description: Culture pH increased from approximately 6.5 to 8.0-8.5 during the first two days and then stabilized.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The pH increased sharply from approximately 6.5 to 8.0–8.5 within the first 2 days of incubation and then stabilized
    explanation: Supports alkalinization as a measured condition during Cd removal.
- name: Bioavailable Cd decrease in cabbage-pot soil
  value: '13'
  unit: '% decrease versus control'
  description: The SL8-SL12 treatment decreased exchangeable, carbonate-bound, and Fe-Mn oxidized bioavailable Cd fractions
    in greenhouse pot soil relative to the untreated control.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The results revealed a discernible decrease of 13% in the bioavailable Cd fractions (exchangeable, carbonate-bound,
      and Fe-Mn oxidized forms) in the co-cultured strains treatment compared to the control treatment.
    explanation: Supports the reported soil Cd-immobilization endpoint in cabbage pots.
- name: Aboveground Chinese cabbage Cd decrease
  value: '20'
  unit: '% decrease under high Cd stress'
  description: SL8-SL12 inoculation lowered Cd accumulation in aboveground cabbage tissue under high Cd stress.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the application of SL8 and SL12 strains under high Cd stress conditions significantly reduced Cd accumulation
      in the aboveground parts by 20%
    explanation: Supports reduced aboveground Cd accumulation in Chinese cabbage.
