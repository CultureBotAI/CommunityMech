discussions:
- discussion_id: sl8_sl12_omics_causality
  prompt: Which transporter, antioxidant, or peptide changes are causally required for the SL8-SL12 coculture's improved cadmium
    immobilization?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#SL8-SL12 cooperative cadmium immobilization
  rationale: The primary article reported significant proteomic and metabolomic changes in the Cd-stressed coculture, but
    explicitly framed ABC transporters and Ohr-family peroxiredoxin as hypotheses rather than validated causal factors.
  proposed_experiments:
  - name: Targeted transporter and antioxidant knockouts in SL8-SL12 coculture
    approach: gene knockout or complementation in defined coculture Cd-removal assays
    model_systems:
    - Achromobacter sp. SL8
    - Enterobacter sp. SL12
    perturbations:
    - ABC transporter knockout
    - Ohr family peroxiredoxin knockout
    readouts:
    - Cd2+ removal efficiency
    - intracellular Cd accumulation
    - CdS precipitation
    decision_criterion: Loss and rescue of coculture Cd immobilization would identify an omics-inferred candidate as causal
      rather than correlative.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: full_text
    snippet: While our proteomic and metabolomic analyses provide strong correlative evidence for the proposed molecular mechanisms,
      direct causal validation (e.g., gene knockout) was not performed.
    explanation: Records the authors' explicit limitation around mechanistic causality.
  posed_by: codex
  posed_date: '2026-09-14'
