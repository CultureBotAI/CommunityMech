ecological_interactions:
- name: SL8-SL12 cooperative cadmium immobilization
  description: The SL8-SL12 coculture combined alkalinization, increased intracellular Cd accumulation, CdS bioprecipitation,
    and surface aggregation with possible EPS involvement under 100 mg/L Cd2+, removing 80.9% of Cd after 7 days and
    outperforming both monocultures at the high Cd dose.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Achromobacter sp. SL8
    term: *id001
  - preferred_term: Enterobacter sp. SL12
    term: *id002
  metabolites:
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  downstream:
  - target: increased 100 mg/L Cd removal
    description: The coculture reached 80.9% Cd removal at 100 mg/L Cd2+, compared with 69.55% for SL8 and 70.8% for SL12.
  - target: CdS bioprecipitation and intracellular Cd accumulation
    description: Spectroscopy and Cd-removal partitioning associated the coculture with CdS precipitate formation and enhanced
      intracellular Cd accumulation.
  evidence:
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After a 7-day incubation period, RE-Cd values reached 82.6% and 69.55% for SL8, 63.4% and 70.8% for SL12, and
      82.6% and 80.9% for the co-cultured strains at initial Cd concentrations of 50 mg/L and 100 mg/L, respectively.
    explanation: Supports the coculture advantage at 100 mg/L Cd2+ after 7 days.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culturing enhanced intracellular Cd accumulation ( Fig. 2C ), potentially by improving cellular membrane fluidity,
      thus offering a robust barrier against Cd ion penetration
    explanation: Supports increased intracellular Cd accumulation in the coculture.
  - reference: PMID:42307251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The detection of the Cd 3d peak confirmed the presence of CdS and further supported a multi-faceted response
      to Cd stress.
    explanation: Supports CdS formation as a detected coculture Cd-immobilization product.
