- name: Paraburkholderia Acid-Tolerant Root Colonization Traits
  description: OAS925 carried uniquely detected surveyed acid-resistance and type III secretion modules among
    the 17 genomes. Separate RFP-isolate plant assays showed root colonization at 1 DAI and biofilm at 3 DAI;
    separate culture assays showed high liquid growth and acid-tolerant motility. OAS925 was sixth, not first,
    in the biofilm assay. These are one-strain observations, not facilitation of another taxon. No selective gene
    or trait perturbation established which mechanism causes dominance in SynCom17.
  scope: PAIRWISE
  downstream:
  - target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: HYPOTHESIZED - acid-tolerant motility, colonization traits and associated genomic modules may
      help OAS925 establish and expand on roots, contributing to its relative dominance. Separate isolate assays
      and gene annotation support candidate mechanisms, but none was selectively disrupted or rescued in the 17-member
      community.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Comparative genomic analysis showed that the Paraburkholderia sp. OAS925 genome
    explanation: Supports surveyed OAS925 genomic signatures, not demonstrated expression, necessity or a gene-specific
      mechanism of community dominance.
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Clear RFP signals were detected at the root tip and in the maturation zone at 1 DAI
    explanation: Supports early colonization in the separate RFP-isolate assay, not a selective trait test in
      SynCom17.
  source_taxon:
    preferred_term: Paraburkholderia sp. OAS925
    term:
      id: NCBITaxon:1822464
      label: Paraburkholderia
