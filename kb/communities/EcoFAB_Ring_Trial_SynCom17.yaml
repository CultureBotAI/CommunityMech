environmental_factors:
- name: Ring-trial host growth medium
  value: Half-strength Murashige-Skoog basal salts
  description: Common hydroponic medium, not a nitrogen-form intervention. 9 mL before addition of 1 mL inoculum/mock.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 9 mL of ½ MS basal salts (pH 5.5–6.0)
    explanation: Methods 4.2 device medium before inoculation.
- name: Ring-trial photoperiod and temperature
  value: 14 h light 26 °C /10 h dark 20 °C; laboratory C 16 h light
  description: Reported prescribed protocol, retaining the laboratory C exception without inferring its unstated
    dark duration. S1 Table and logger measurements report deviations.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a 14 h photoperiod (16 h for lab C) at 26 °C and 10 h dark at 20 °C
    explanation: Methods 4.2 laboratory protocol.
- name: Ring-trial illumination and humidity
  value: 110–140 µmol/m2/s PPFD; 70% humidity if tunable
  description: Protocol targets, not a claim all chambers achieved identical measured values.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 110–140 µmol/m2/s and 70% humidity if tunable
    explanation: Methods 4.2 target conditions; S1 Table reports chamber variation.
