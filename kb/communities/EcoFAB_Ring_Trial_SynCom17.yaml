    analysis and reduced root development from 14 DAI onward. SynCom16 had a smaller shoot effect. These are whole-treatment
    plant outcomes with laboratory variation, not a demonstrated microbial competition mechanism, direct OAS925-only
    effect or reciprocal symbiosis.
