    devices and compared with axenic plants, SynCom16 lacking OAS925, and plant-free medium controls in five laboratories.
    Its three downstream arrows represent whole-treatment effects on root composition, bulk spent-medium profiles
    and plant development, not a claim that protocol standardization itself is a biological mechanism or that every
    member facilitates colonization.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Paraburkholderia-Dominated SynCom17 Root Assembly
    description: SynCom17 inoculation supplied the 17-member community from which the OAS925-dominated root profile
      developed by 22 DAI. The SynCom16 omission comparison supports an inoculum-composition effect, not identification
      of the molecular mechanism or absolute loss of the other members.
  - target: Treatment-Structured Rhizosphere Exometabolites
    description: SynCom17 inoculation altered the plant-microbe system and thereby changed the measured bulk spent-medium
      metabolite profile relative to the control treatments. This is a treatment-level effect; microbial versus
      plant production, uptake and extracellular enzyme activity were not separated.
  - target: SynCom17 Plant Biomass and Root Development Decrease
    description: The SynCom17 inoculation treatment reduced shoot biomass in the combined-laboratory comparison
      with axenic plants and reduced root development from 14 DAI onward. The experiment establishes a whole-treatment
      response, not OAS925-only toxicity, competition for a specific nutrient or one necessary member.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All participating laboratories observed consistent inoculum-dependent changes in plant phenotype, root
      exudate composition, and final bacterial community structure
    explanation: 'Anchors the standardized EcoFAB 2.0 SynCom ring trial and its treatment-dependent plant, exudate,
      and community-structure outcomes.

      '
