id: CommunityMech:000025
name: EcoFAB 2.0 Root Microbiome Ring Trial SynCom17
description: A 17-member synthetic bacterial inoculum used in a five-laboratory EcoFAB 2.0 ring trial with Brachypodium
  distachyon Bd21-3. SynCom17, SynCom16 lacking OAS925, axenic plants and plant-free medium were compared under
  standardized protocols. At 22 days after inoculation, OAS925 accounted for 98 ± 0.03% of root bacterial 16S
  reads in SynCom17; the omission treatment had more variable relative profiles. Whole-treatment differences in
  plant biomass and bulk spent-medium metabolites do not identify OAS925-specific uptake, toxicity, competitive
  exclusion or absolute loss of other stocks. Separate genomic, isolate-culture and reporter-plant assays identify
  candidate colonization traits, not selectively demonstrated mechanisms in SynCom17. The 17 stocks originate
  from the source switchgrass isolate collection; physical cultivation here is a laboratory hydroponic model,
  not native soil.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: A 17-member synthetic bacterial community (SynCom17) used in a standardized inter-laboratory ring
    trial across five international laboratories (LBNL, UNC Chapel Hill, Max Planck Cologne, Forschungszentrum
    Julich, U Melbourne) to study root microbiome recruitment and exudate composition of the model grass Brachypodium
    distachyon in EcoFAB 2.0 fabricated ecosystem devices.
  assembly_strategy: Seventeen source stocks were grown separately, washed with half-strength MS and combined
    using OD600-to-CFU conversions into equal-cell concentrated stocks in 20% glycerol. The inoculation calculation
    assumed 50% freeze-thaw survival and a theoretical 1e5 CFU per plant; neither equal realized abundance nor
    actual post-thaw survival is inferred.
  measurement_endpoints:
  - Relative 16S read composition of root and unfiltered medium samples
  - Net extracellular LC-MS metabolite profiles in filtered spent medium
  - Whole-treatment plant fresh/dry biomass and root-development readouts
  - Separate isolate-culture traits and computational genome annotations
  notes: Ring-trial Methods 4.1–4.2 and S2 Table define inoculum/arm identity. Physical device culture, isolate
    stock preparation, separate RFP-isolate microscopy and computational genomic analysis remain distinct. Ring-trial
    Methods distinguishes individual source stocks from the complete SynCom17 consortium deposit DSM 200000SY.
    DSM 113627 is the individual OAS925 accession reported in Coker Methods; this source-reported stock identity
    is not an independent current DSMZ catalog verification.
  perturbation_design: 'Four ring-trial arms: SynCom17, SynCom16 omitting OAS925, mock-inoculated axenic plant
    control, and mock-inoculated plant-free medium control. The nitrogen-form/starvation study is a separate sterile-plant
    experiment, not this trial''s factorial intervention.'
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Mock-inoculated axenic plant control, ii) SynCom16-inoculated plants, iii) SynCom17-inoculated plants,
      and iv) Mock-inoculated technical control (plant-free)
    explanation: Methods 4.2 names the four actual ring-trial arms; no competitive-exclusion mechanism or nitrogen/light
      factorial is implied.
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: or as a collection (DSM 200000SY
    explanation: Ring-trial Methods describes the consortium collection separately from individual strains; this
      is not an OAS925 stock accession.
environment_term:
  preferred_term: EcoFAB 2.0 hydroponic device
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Sterile EcoFAB 2.0 laboratory hydroponic devices containing 9 mL half-strength MS plus 1 mL inoculum
    or mock at inoculation. Methods 4.2 specifies 14 h light at 26 °C and 10 h dark at 20 °C (16 h light for laboratory
    C), 110–140 µmol/m2/s PPFD and 70% humidity if tunable. Chamber deviations are reported separately in S1 Table;
    these conditions are not uniform measured exposures or the reporter-isolate protocol.
