ecological_interactions:
- name: MET10-STR3 Sulfur Auxotrophy Cross-Feeding
  description: The met10Delta-str3Delta O. polymorpha pair showed reproducible growth complementation in Delft minimal
    medium on glucose and methanol. The reported glucose maximum OD600 range 27.3-28.5 spans this pair and str3Delta-leu2Delta,
    with no significant advantage over FY00 (26.8); methanol growth remained below FY00. FY34 met10Delta-mCherry
    and FY31 str3Delta-EGFP were the labeled derivatives used for population tracking, not identities established
    for every screening assay. Cooperative rescue is observed; specific sulfur exchange remains inferred.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ogataea polymorpha FY34 met10Δ-mCherry
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  - preferred_term: Ogataea polymorpha FY31 str3Δ-EGFP
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The met10Δ and str3Δ mutants harbor deletions in the sulfur assimilation pathway at MET10 and STR3,
      respectively.
    explanation: Places the two deletions in the sulfur-assimilation pathway.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strongly complementary pairs (met10Δ-str3Δ and str3Δ-leu2Δ) reached maximum OD600 values of 27.3–28.5
    explanation: Reports the range across two complementary pairs, not an exact value or significant superiority
      for this pair alone.
- name: Asymmetric Homocysteine Dependency
  description: HYPOTHESIZED - The model proposes homocysteine supply from met10Delta to str3Delta and multiple organic
    sulfur intermediates in the reverse direction. Single-strain supplementation at 20 mg/L restored met10Delta
    growth with L-cysteine, cystathionine or homocysteine, but not sodium sulfide; str3Delta recovered substantially
    only with homocysteine among the tested compounds. These are demonstrated nutrient-rescue profiles, not measured
    interstrain transfer, secretion, exchange rates or an exhaustive nutrient requirement. The paper calls for isotope
    labeling or targeted metabolomics to identify coculture exchange.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ogataea polymorpha FY34 met10Δ-mCherry
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  target_taxon:
    preferred_term: Ogataea polymorpha FY31 str3Δ-EGFP
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: met10Δ can utilize multiple sulfur-containing intermediates, whereas str3Δ relies exclusively on homocysteine.
    explanation: Abstract summarizes asymmetric use of the tested supplements; this only partially supports the
      directed exchange model.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ recovered growth in the presence of L-Cys, Cysta, or Hcy, but not with Na2S. str3Δ, by contrast,
      showed substantial growth recovery only with Hcy.
    explanation: Directly supports single-strain supplementation outcomes, not donor-to-recipient transfer.
- name: Initial Ratio-Dependent Met10 Enrichment
  description: Controlled initial met10Delta:str3Delta ratios at total OD600 0.4 changed growth and composition
    on glucose. Ratios 1:10, 1:5 and 1:1 achieved higher final biomass, with met10Delta fractions increasing; 5:1
    and 10:1 maintained met10Delta dominance but grew weakly. Endpoint composition was generally met10Delta-biased
    at 168 h, not evidence that every culture increased its met10Delta fraction, grew robustly or converged to one
    identical ratio. Longer-term continuous and product-producing stability was not established.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ogataea polymorpha FY34 met10Δ-mCherry
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  - preferred_term: Ogataea polymorpha FY31 str3Δ-EGFP
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Communities with initially higher frequencies of str3Δ (1:10, 1:5, and 1:1 groups) achieved higher
      final OD600 values.
    explanation: Supports the positive ratio-dependent biomass response.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, groups initially dominated by met10Δ (5:1 and 10:1) showed weak growth throughout.
    explanation: Distinguishes maintained compositional bias from successful high-biomass establishment.
