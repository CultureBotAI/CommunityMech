id: CommunityMech:000450
name: Ogataea Met10-Str3 Sulfur Cross-Feeding Coculture
description: A defined two-member Ogataea polymorpha synthetic yeast coculture pairing a met10Δ-mCherry auxotroph, FY34, with
  a str3Δ-EGFP auxotroph, FY31. The pair was selected from systematic auxotroph screening because it showed reproducible growth
  restoration in Delft minimal medium with glucose or methanol; single-strain supplementation assays supported an asymmetric
  sulfur-metabolite dependency in which met10Δ could use multiple sulfur-containing intermediates while str3Δ depended on
  homocysteine.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Establish auxotrophy-based cross-feeding as a stabilization strategy for synthetic consortia in the non-conventional
    methylotrophic yeast Ogataea polymorpha.
  assembly_strategy: Construct Ogataea polymorpha auxotrophic mutants in the JQcr03L background with CRISPR/Cas9, screen pairwise
    combinations in Delft minimal glucose medium, then fluorescently tag the met10Δ-str3Δ pair as FY34 met10Δ-mCherry and
    FY31 str3Δ-EGFP for composition tracking.
  perturbation_design: Compare met10Δ-str3Δ against other pairwise auxotrophic mutants, glucose versus 10 or 20 g/L methanol
    as the sole carbon source, and initial met10Δ:str3Δ inoculation ratios from 1:10 to 10:1.
  measurement_endpoints:
  - maximum OD600
  - lag phase
  - growth restoration on glucose
  - growth restoration on methanol
  - met10Δ fraction by red and green fluorescence
  - response to 20 mg/L sulfur-containing supplements
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we establish an auxotrophy-based cross-feeding strategy in the non-conventional yeast Ogataea polymorpha
    explanation: Supports the engineered cross-feeding design in O. polymorpha.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ-str3Δ, met14Δ-str3Δ, and met10Δ-met3Δ all achieved RI > 0.8, suggesting that these combinations are capable
      of robust reciprocal cross-feeding.
    explanation: Shows that met10Δ-str3Δ was one of several strongly complementary screened pairs.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among all tested pairs, met10Δ-str3Δ and str3Δ-leu2Δ exhibited the most reproducible and robust complementation.
    explanation: Supports choosing the met10Δ-str3Δ pair for focused curation.
