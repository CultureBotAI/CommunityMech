  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ recovered growth in the presence of L-Cys, Cysta, or Hcy, but not with Na2S.
    explanation: Identifies L-cysteine as one of the intermediates that restored met10Δ growth.
- preferred_term: cystathionine
  relevance: Cystathionine rescued met10Δ growth in the sulfur-intermediate supplementation assay.
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ recovered growth in the presence of L-Cys, Cysta, or Hcy, but not with Na2S.
    explanation: Identifies cystathionine as one of the intermediates that restored met10Δ growth.
- preferred_term: homocysteine
  relevance: Homocysteine restored growth for both met10Δ and str3Δ single mutants and was the only sulfur intermediate that
    substantially rescued str3Δ.
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: str3Δ, by contrast, showed substantial growth recovery only with Hcy.
    explanation: Identifies homocysteine as the rescuing intermediate for the str3Δ auxotroph.
