ecological_interactions:
- name: MET10-STR3 Sulfur Auxotrophy Cross-Feeding
  description: The FY34 met10Δ and FY31 str3Δ O. polymorpha auxotrophs were co-cultured as a sulfur-assimilation cross-feeding
    pair whose deleted metabolic nodes complemented one another in Delft minimal medium.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ogataea polymorpha FY34 met10Δ-mCherry
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  - preferred_term: Ogataea polymorpha FY31 str3Δ-EGFP
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The met10Δ and str3Δ mutants harbor deletions in the sulfur assimilation pathway at MET10 and STR3, respectively.
    explanation: Places the two deletions in the sulfur-assimilation pathway.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strongly complementary pairs (met10Δ-str3Δ and str3Δ-leu2Δ) reached maximum OD600 values of 27.3–28.5
    explanation: Quantifies robust complementation for the curated met10Δ-str3Δ pair.
- name: Asymmetric Homocysteine Dependency
  description: Supplementation assays indicated that the met10Δ mutant could recover growth with L-cysteine, cystathionine,
    or homocysteine, whereas str3Δ only showed substantial recovery with homocysteine.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ogataea polymorpha FY34 met10Δ-mCherry
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  target_taxon:
    preferred_term: Ogataea polymorpha FY31 str3Δ-EGFP
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ can utilize multiple sulfur-containing intermediates, whereas str3Δ relies exclusively on homocysteine.
    explanation: Supports the asymmetric sulfur-intermediate dependency.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ recovered growth in the presence of L-Cys, Cysta, or Hcy, but not with Na2S. str3Δ, by contrast, showed
      substantial growth recovery only with Hcy.
    explanation: Reports the single-mutant supplementation result used to infer the homocysteine-centered cross-feeding model.
- name: Initial Ratio-Dependent Met10 Enrichment
  description: The inoculated met10Δ:str3Δ ratio controlled community establishment and final biomass, while surviving cocultures
    shifted toward a met10Δ-biased composition.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ogataea polymorpha FY34 met10Δ-mCherry
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  - preferred_term: Ogataea polymorpha FY31 str3Δ-EGFP
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the initial inoculation ratio critically determines community establishment and final biomass
    explanation: Supports the ratio-dependence of community assembly.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: all co-cultures converging toward met10Δ enrichment over time
    explanation: Supports the met10Δ-biased population trajectory.
growth_media:
- name: Delft minimal glucose medium
  temperature: '37'
  temperature_unit: °C
  shaking_speed: '220'
  shaking_speed_unit: rpm
  vessel_type: 100 mL flask
  composition:
  - name: glucose
    concentration: '20'
    unit: g/L
    chebi_term:
      preferred_term: glucose
      term:
        id: CHEBI:17234
        label: glucose
  preparation_notes: Glucose screening cocultures started at total OD600 0.2 and a 1:1 strain ratio; fluorescence-based FY31/FY34
    population tracking started at total OD600 0.4 across 1:10, 1:5, 1:1, 5:1, and 10:1 met10Δ:str3Δ ratios.
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: glucose (20 g/L) was used as the carbon source.
    explanation: Supports the standard 20 g/L glucose carbon source.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Initial ratios of met10Δ to str3Δ were set at 1:10, 1:5, 1:1, 5:1, and 10:1.
    explanation: Supports the glucose population-tracking ratio series.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For screening under glucose conditions, co-cultures were initiated in Delft medium containing 20 g/L glucose
      at an initial total OD600 of 0.2 with a 1:1 strain ratio.
    explanation: Supports the glucose screening inoculation density and 1:1 starting ratio.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: FY31 (str3Δ-EGFP) and FY34 (met10Δ-mCherry) were co-cultured in Delft medium containing 20 g/L glucose at an
      initial total OD600 of 0.4.
    explanation: Supports the FY31/FY34 fluorescence-tracking inoculation density.
- name: Delft minimal methanol medium
  temperature: '37'
  temperature_unit: °C
  shaking_speed: '220'
  shaking_speed_unit: rpm
  vessel_type: 100 mL flask
  composition:
  - name: methanol
    concentration: 10 or 20
    unit: g/L
    chebi_term:
      preferred_term: methanol
      term:
        id: CHEBI:17790
        label: methanol
  preparation_notes: Methanol complementation tests replaced glucose with 10 or 20 g/L methanol, used the methanol as sole
    carbon source, and started at total OD600 0.6.
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For methanol experiments, Delft medium containing 10 or 20 g/L methanol was used as the sole carbon source.
    explanation: Supports the methanol-only Delft medium condition.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: met10Δ-str3Δ consistently performed well under both methanol concentrations and was selected for further characterization.
    explanation: Supports met10Δ-str3Δ complementation on both methanol concentrations.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For methanol experiments, Delft medium containing 10 or 20 g/L methanol was used as the sole carbon source. The
      initial total OD600 was set to 0.6.
    explanation: Supports the methanol-only medium and the 0.6 initial total OD600.
