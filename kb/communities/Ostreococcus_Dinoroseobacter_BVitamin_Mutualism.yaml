  downstream:
  - target: Stable B-Vitamin Mutualism Maintains Coculture
    description: Bacterial complementation of algal vitamin requirements sustains the algal partner under the tested
      vitamin-omission conditions and contributes to serial coculture persistence. This positive physiological dependence
      does not isolate a transporter, secretion mechanism or the cause of the near 1:1 population ratio.
  evidence:
  - reference: PMID:30228381
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B12 and B1 auxotrophy of O. tauri can be alleviated by co-culturing with a heterotrophic bacterial
      partner Dinoroseobacter shibae
    explanation: Supports D. shibae-mediated rescue of O. tauri cobalamin and thiamine requirements.
- name: Algal Rescue of Bacterial Vitamin Requirements
  description: O. tauri significantly complements D. shibae requirements for niacin, biotin and p-aminobenzoic acid
    compared with the corresponding vitamin-deficient monocultures. This reciprocal physiological rescue supports
    mutualism, not merely one-way commensalism. The exact transport/release routes were not investigated; the ratio-dynamics
    experiment supplied thiamine and biotin to shorten growth times, unlike the all-vitamin-omission assay.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ostreococcus tauri
