    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: alga is in turn able to satisfy the reciprocal vitamin requirements of its bacterial partner in a stable
      long-term co-culture
    explanation: Supports reciprocal vitamin provisioning from O. tauri to D. shibae.
- name: Stable B-Vitamin Mutualism Maintains Coculture
  description: Both partners persisted through serial subcultures under mutually dependent nutrient conditions.
    Initial-ratio experiments reached approximately 1:1, and serial persistence was reported over four consecutive
    subcultures. Thiamine and biotin were supplied in the ratio-dynamics experiment, whereas separate omission assays
    tested all five vitamins. Vitamin/carbon addback changed the ratio; this supports nutrient dependence but not
    exclusive active population regulation, because competition for other nutrients remains possible.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
