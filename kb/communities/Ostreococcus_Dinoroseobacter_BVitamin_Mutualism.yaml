ecological_interactions:
- name: Bacterial Rescue of Algal Cobalamin and Thiamine Auxotrophy
  description: 'D. shibae significantly rescues O. tauri growth under cobalamin or thiamine omission compared with
    corresponding axenic cultures. Rescue of the B12 requirement is stronger: without thiamine, algal carrying capacity
    in coculture was only about 30% of the vitamin-supplemented condition. This is demonstrated physiological complementation,
    not a measurement of secreted vitamin flux or a complete rescue of every vitamin requirement.'
  interaction_type: MUTUALISM
  scope: PAIRWISE
