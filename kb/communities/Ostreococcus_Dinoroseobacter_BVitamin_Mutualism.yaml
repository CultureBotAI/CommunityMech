discussions:
- discussion_id: reciprocal-rescue-versus-population-regulation
  prompt: How should reciprocal vitamin rescue be connected to persistence without equating it with a resolved population-regulation
    mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Bacterial Rescue of Algal Cobalamin and Thiamine Auxotrophy
  - ecological_interactions#Algal Rescue of Bacterial Vitamin Requirements
  - ecological_interactions#Stable B-Vitamin Mutualism Maintains Coculture
  rationale: The demonstrated algal-to-bacterial rescue merits a separate rescue-to-persistence arrow, pending scoped
    Edison/report review. The removed reverse arrow described fixed carbon but targeted vitamin rescue. No passive-versus-active
    release mechanism was tested, and other nutrient competition was not excluded. One 9032 character Edison dry
    run is not a provider report or authorization to spend.
  evidence:
  - reference: PMID:30228381
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: alga is in turn able to satisfy the reciprocal vitamin requirements of its bacterial partner in a stable
      long-term co-culture
    explanation: Supports reciprocal vitamin provisioning from O. tauri to D. shibae.
  posed_by: codex
