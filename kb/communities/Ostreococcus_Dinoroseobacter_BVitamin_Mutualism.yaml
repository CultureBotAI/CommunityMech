id: CommunityMech:000155
name: Ostreococcus-Dinoroseobacter B-Vitamin Mutualism
description: >
  A defined marine algal-bacterial coculture in which the picoeukaryotic alga Ostreococcus tauri OTH95
  and the roseobacter Dinoroseobacter shibae DF-12 form a reciprocal B-vitamin mutualism. D. shibae
  supplies cobalamin and thiamine needed by O. tauri, while O. tauri satisfies bacterial requirements for
  other B vitamins in a stable long-term coculture; the interaction is experimentally tractable under
  controlled light, temperature, and vitamin-amendment regimes.
ecological_state: STABLE
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Test whether reciprocal B-vitamin auxotrophies can support a stable marine phytoplankton-
    bacterium mutualism.
  assembly_strategy: Coculture axenic Ostreococcus tauri OTH95 with Dinoroseobacter shibae DF-12 under
    defined L1 marine algal culture conditions and controlled B-vitamin amendments.
  perturbation_design: Vary B-vitamin combinations and starting algal:bacterial ratios, then follow
    growth and community ratios through repeated subcultures.
  measurement_endpoints:
  - algal and bacterial cell densities
  - B-vitamin auxotrophy rescue
  - stable coculture ratios
  - genome-based vitamin biosynthesis pathway presence and absence
  evidence:
  - reference: PMID:30228381
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cross-exchange of B-vitamins underpins a mutualistic interaction between Ostreococcus tauri and Dinoroseobacter shibae
    explanation: Supports the experimental focus on reciprocal vitamin exchange in this two-member coculture.
