id: CommunityMech:000210
name: Zymomonas-E. coli Exometabolomics-Designed Obligate Mutualism
description: >
  A defined synthetic obligate mutualism pairing auxotrophic Zymomonas mobilis
  with auxotrophic Escherichia coli. Exometabolomics of Z. mobilis spent medium
  identified amino acid exometabolites used to select E. coli proA, pheA, and
  ilvA auxotroph partners, while mutant fitness profiling selected a Z. mobilis
  ZMO0748 auxotroph whose rescue was linked to glutathione-related metabolites
  in E. coli spent medium. The system is DOE-relevant because it was developed
  by LBNL and Sandia researchers with DOE BER support as a synthetic microbial
  ecology platform for more resilient biotechnology processes.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct synthetic obligate mutualisms from industrially important species using
    exometabolomics and mutant fitness profiling to select reciprocal auxotroph partners.
  assembly_strategy: Pair a Z. mobilis ZMO0748 auxotroph with one of three E. coli amino acid
    auxotrophs selected from Z. mobilis spent-medium exometabolites.
  perturbation_design: Compare candidate auxotroph combinations selected by exometabolomics and
    mutant fitness profiling for coculture growth.
  measurement_endpoints:
  - Optical density growth monitoring
  - Flow cytometry confirmation of each species
  - Exometabolomic identification of candidate rescue metabolites
  evidence:
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: creation of synthetic obligate mutualism using auxotrophic mutants
    explanation: Supports the design objective of engineering auxotroph-based obligate mutualism.
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: integration of mutant library fitness profiling with mass spectrometry based exometabolomics
    explanation: Supports the combined screening and exometabolomics design workflow.
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: analyzed by flow cytometry to confirm high cell counts for each species
    explanation: Supports the use of flow cytometry as a measurement endpoint for both community members.
