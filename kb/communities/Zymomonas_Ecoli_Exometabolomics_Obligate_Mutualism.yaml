ecological_interactions:
- name: Zymomonas Amino Acid Rescue of E. coli Auxotrophs
  description: Wild-type Z. mobilis ZM4 spent medium and individual amino-acid supplementation rescued the selected
    E. coli proA, pheA and ilvA auxotrophs. This supports nutritional rescue, beyond candidate selection alone.
    The reciprocal experiments paired each E. coli mutant separately with the Z. mobilis ZMO0748 mutant; they do
    not describe a four-member consortium or establish a dedicated export mechanism.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Zymomonas mobilis
    term:
      id: NCBITaxon:542
      label: Zymomonas mobilis
  target_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
    notes: The manuscript identifies proline, phenylalanine and isoleucine as the selected rescue amino acids; the
      existing generic amino-acid grounding is retained.
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Reciprocal Auxotroph Coculture Growth
    description: Partner spent-medium and amino-acid rescue support the nutritional contribution to the three separately
      tested reciprocal pairs. The molecular release route and all additional interactions are not resolved.
  evidence:
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Amino acid exometabolites identified in the spent medium of Z. mobilis
    explanation: Supports Z. mobilis spent-medium amino acid exometabolites as candidate E. coli rescue metabolites.
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: used to select three corresponding E. coli auxotrophs
    explanation: Supports selection of E. coli auxotrophs based on Z. mobilis exometabolites.
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: they all successfully grew in 50% spent medium and metabolite supplemented medium
    explanation: Rescue was tested using partner spent medium and metabolite-supplemented medium, with no growth
      in unsupplemented ZMMG.
- name: E. coli Sulfur-Metabolite Rescue of Zymomonas Auxotroph
  description: E. coli spent medium rescued the Z. mobilis ZMO0748 cysteine-synthase-like mutant. Cysteine and glutathione
    supplementation independently supported rescue. Glutathione-related compounds were detected in spent medium,
    but free cysteine below detection was not excluded. Thus the phenotype is experimentally supported while the
    exact naturally transferred sulfur compound and release/uptake route remain PARTIAL.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  target_taxon:
    preferred_term: Zymomonas mobilis
    term:
      id: NCBITaxon:542
      label: Zymomonas mobilis
  metabolites:
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
    notes: Glutathione supplementation supports rescue; it is not established as the sole necessary transferred
      molecule in coculture.
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Reciprocal Auxotroph Coculture Growth
    description: 'PARTIAL molecular assignment: sulfur-metabolite rescue supports the ZMO0748 contribution to reciprocal
      growth, and glutathione is sufficient in supplementation. Its exclusive necessity in coculture and the exact
      exchanged sulfur species were not established.'
  evidence:
  - reference: PMID:26885935
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: identified glutathione related metabolites as potentially available for rescue
    explanation: Supports E. coli metabolite availability for rescue of the Z. mobilis auxotroph.
  - reference: PMID:26885935
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: rescue of the Z. mobilis cysteine synthase mutant
    explanation: Supports the target Z. mobilis auxotroph rescue mechanism.
  - reference: PMID:26885935
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: both cysteine and glutathione are capable of rescuing Z. mobilis
    explanation: Preserves the positive metabolite-supplementation result without claiming exclusive glutathione
      mediation.
- name: Reciprocal Auxotroph Coculture Growth
  description: Each of three separate pairs containing the Z. mobilis ZMO0748 auxotroph and an E. coli proA, pheA
    or ilvA auxotroph grew in unsupplemented ZMMG, where the individual auxotrophs did not. Optical density and
    species-resolved flow cytometry support growth of both partners under those conditions. This does not establish
    long-term community stability or the absence of additional beneficial or inhibitory exchanges.
  interaction_type: MUTUALISM
  scope: PAIRWISE
