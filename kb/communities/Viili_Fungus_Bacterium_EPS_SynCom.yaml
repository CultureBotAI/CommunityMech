ecological_interactions:
- name: Geotrichum nitrogen supply to lactic acid bacteria
  description: G. candidum Y1 supplies nitrogen sources, including valine, to L. lactis V9 and L. paracasei V21.
    Metabolomics and amino-acid depletion/supplementation support nutrient provision associated with increased bacterial
    growth, biofilm formation and EPS production. These assays do not by themselves isolate a valine-specific signaling
    mechanism independent of growth.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
