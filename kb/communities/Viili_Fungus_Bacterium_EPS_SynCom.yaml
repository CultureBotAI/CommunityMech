  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  downstream:
  - target: AI-2 regulation of Viili bacterial EPS production
    description: 'PARTIAL: fungal nitrogen provision supports bacterial growth and is accompanied by stronger quorum-sensing
      activity. It may contribute to activation of the AI-2 regulatory node, but the abstract does not isolate valine-specific
      mediation from growth effects.'
  evidence:
  - reference: PMID:42372608
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Untargeted metabolomics combined with validation experiments revealed that G. candidum supplied lactic
      acid bacteria with nitrogen sources, including valine.
    explanation: Supports G. candidum as a nitrogen-source supplier to the lactic acid bacteria and names valine
      as one implicated amino acid.
  - reference: PMID:42372608
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Amino acid depletion and supplementation experiments indicated that valine, as a key amino acid, is
      closely associated with enhanced growth, biofilm formation, and EPS production in lactic acid bacteria.
    explanation: Connects valine availability to growth, biofilm formation, and EPS production in the bacterial
      partners.
- name: AI-2 regulation of Viili bacterial EPS production
  description: Fungal co-culture increases bacterial AI-2 production and luxS transcription. AI-2 activation and
    inhibition assays support positive regulation of EPS synthesis. This is signaling regulation, not evidence that
    G. candidum supplies AI-2 as an exchanged nutrient; the abstract describes fungal-metabolite activation of signaling
    as a possible contribution.
  scope: COMMUNITY_LEVEL
  participating_taxa:
