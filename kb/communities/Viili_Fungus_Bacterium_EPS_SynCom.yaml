      id: GO:0009372
      label: quorum sensing
  downstream:
  - target: Three-species Viili EPS maximum
    description: AI-2 activation and inhibition support positive regulation of bacterial EPS synthesis and thus
      a contribution to the three-member output. They do not establish AI-2 as the sole explanation of the tested
      consortium maximum.
  evidence:
  - reference: PMID:42372608
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culture with G. candidum significantly enhanced AI-2 production and luxS gene transcription in lactic
      acid bacteria.
    explanation: Supports stronger AI-2 production and luxS transcription when the fungal member was present with
      the lactic acid bacteria.
  - reference: PMID:42372608
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: AI-2 activation and inhibition assays confirmed that AI-2-mediated quorum sensing positively regulates
      EPS synthesis.
    explanation: Supports the causal link from AI-2-mediated quorum sensing to EPS synthesis.
  - reference: PMID:42372608
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: fungal metabolites may contribute to the activation of AI-2 signaling
    explanation: Qualifies the fungal-metabolite-to-signaling mechanism; the separate AI-2 perturbations support
      downstream regulation.
- name: Three-species Viili EPS maximum
  description: Among the microbial combinations tested in the Viili model, the complete L. lactis V9 plus L. paracasei
    V21 plus G. candidum Y1 consortium had the highest measured exopolysaccharide concentration.
