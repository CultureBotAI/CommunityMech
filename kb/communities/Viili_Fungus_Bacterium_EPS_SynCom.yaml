id: CommunityMech:000408
name: Viili Fungus-Bacterium EPS SynCom
description: A top-down three-strain synthetic microbial consortium from Viili fermented milk, composed of Lactococcus lactis
  V9, Lacticaseibacillus paracasei V21, and Geotrichum candidum Y1. Hu et al. 2026 used monoculture, co-culture, supernatant-supplementation,
  metabolomics, amino-acid depletion, amino-acid supplementation, and AI-2 perturbation assays to show that G. candidum supplies
  lactic-acid bacteria with nitrogen sources including valine, increases AI-2/luxS quorum-sensing activity, and gives the
  three-member community the highest measured exopolysaccharide concentration among the tested microbial combinations.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct a simplified fungus-lactic-acid-bacterium Viili consortium to resolve how fungal-bacterial metabolic
    interactions regulate exopolysaccharide production in fermented milk.
  assembly_strategy: Assemble a top-down Viili synthetic microbial consortium from Lactococcus lactis V9, Lacticaseibacillus
    paracasei V21, and Geotrichum candidum Y1, then compare monocultures, two-member lactic-acid bacterial co-cultures, and
    the three-member fungus-bacterium consortium.
  measurement_endpoints:
  - viable lactic acid bacterial counts
  - exopolysaccharide concentration
  - untargeted metabolomics
  - amino acid depletion and supplementation responses
  - AI-2 production
  - luxS gene transcription
  evidence:
  - reference: PMID:42372608
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Viili fermentation was employed as a model system using a synthetic microbial consortium, consisting of Lactococcus
      lactis V9, Lacticaseibacillus paracasei V21, and Geotrichum candidum Y1, which was constructed using a top-down strategy.
    explanation: Supports the Viili model system, top-down construction strategy, and exact three-strain SynCom membership.
  - reference: PMID:42372608
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Results from supernatant supplementation, monoculture, and co-culture assays demonstrated that the introduction
      of G. candidum markedly promoted the growth of lactic acid bacteria, resulting in increased quorum sensing activity,
      and EPS production.
    explanation: Identifies the assay families used to test how the fungal member affected lactic-acid-bacterial growth, signaling,
      and EPS output.
