ecological_interactions:
- name: Moss-facilitated microbial colonization on Martian simulant
  description: The primary abstract reports that Hypnum plumaeforme acts as a biological buffer facilitating microbial
    colonization in the dense, low-porosity Martian simulant, where microbial effectiveness is otherwise impeded.
    PARTIAL - This is the reported facilitation interpretation; abstract-only access does not resolve selective
    colonization mediation versus other moss-associated changes.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Moss-microbe co-treatment enhances barley growth and soil quality
    description: PARTIAL - Moss-associated buffering and microbial colonization are reported to restore plant growth
      responses on the Martian simulant. This is a supported mechanistic interpretation of the combined treatment,
      but the available abstract does not isolate colonization from organic inputs, soil changes or other growth-promoting
      activities.
  evidence:
  - reference: doi:10.1016/j.ecolind.2025.114023
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: moss functioned as a biological buffer that facilitated microbial colonization
    explanation: Supports the moss facilitating microbial colonization on the Martian simulant.
  - reference: doi:10.1016/j.ecolind.2025.114023
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: moss acts not merely as an organic input but as a key facilitator of plant–microbe interactions under
      harsh conditions
    explanation: Supports the moss as a facilitator of plant-microbe interactions under harsh regolith-simulant
      conditions.
- name: Moss-microbe co-treatment enhances barley growth and soil quality
  description: The study compared moss alone, microbes alone and combined application on lunar and Martian simulants.
    The primary abstract reports significant combined-treatment improvements in barley shoot biomass, dry weight,
    organic matter, available phosphate and cation exchange capacity. It does not specify every endpoint comparator
    or demonstrate reciprocal moss-microbial fitness; these positive treatment outcomes are not classified as mutualism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.1016/j.ecolind.2025.114023
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: moss–microbe co-treatment significantly enhanced shoot biomass, dry weight, organic matter content,
      available phosphate, and cation exchange capacity
    explanation: Supports positive combined-treatment outcomes; does not specify superiority over each single treatment
      for every endpoint or reciprocal fitness.
- name: Moss-Microbe Rhizosphere Metabolite Accumulation
  description: Metabolite profiling reports accumulation of D-ribose and D-gluconate with moss-microbe treatment.
    Reprogrammed rhizosphere metabolism is HYPOTHESIZED from altered pools; producer identity, interspecies transfer
    and the causal contribution to barley growth are not resolved by the available abstract. Growth/soil improvement
    and metabolite changes are parallel reported treatment outcomes, not an established causal sequence.
  scope: COMMUNITY_LEVEL
  metabolites:
