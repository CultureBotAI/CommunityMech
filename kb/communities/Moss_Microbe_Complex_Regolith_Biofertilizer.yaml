    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.1016/j.ecolind.2025.114023
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Metabolite profiling further revealed the significant accumulation of growth-related compounds such
      as D-ribose and D-gluconate, suggesting that the moss–microbe complex may reprogram rhizosphere metabolism.
    explanation: Supports changed metabolite pools and the authors proposed metabolic interpretation, not demonstrated
      transfer or mediation.
