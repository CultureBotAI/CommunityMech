discussions:
- discussion_id: moss_colonization_and_metabolite_mediation
  prompt: Which selective mechanisms explain the measured community responses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-07'
  rationale: The primary publisher abstract supports positive treatment effects and a colonization interpretation.
    Full publisher access returned403; this does not show that selective controls were absent. Obtain authorized
    full Methods to resolve colonization versus other moss effects, endpoint comparators and metabolite mediation.
    Devosia is detected rather than a selected inoculant; do not assign all measured outcomes to each bacterial
    member.
