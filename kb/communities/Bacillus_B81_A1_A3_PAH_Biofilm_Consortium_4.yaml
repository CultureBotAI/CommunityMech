id: CommunityMech:000504
name: Bacillus B8-1, A1, and A3 Three-Strain PAH Biofilm Consortium 4
description: A defined three-isolate Bacillus consortium, Consortium 4, assembled from Bacillus paramycoides isolate B8-1
  (1150 uL), Bacillus paranthracis isolate A1 (2550 uL), and Bacillus licheniformis isolate A3 (1273 uL) after enrichment
  of petroleum-contaminated subsurface soil from Ras Gharib, Egypt on polycyclic aromatic hydrocarbons. Consortium 4 combined
  all three potent PAH-degrading isolates, formed glass-attached biofilms, and degraded 64.47% of naphthalene in planktonic
  culture and 79.74% in biofilm culture over 7 days at 200 mg/L (exceeding the planktonic monocultures of A1 at 41.01% and
  A3 at 38.92%), while degrading 16.47% (planktonic) and 20.79% (biofilm) of phenanthrene.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine all three high-performing indigenous PAH-degrading Bacillus isolates (B8-1, A1, and A3) from petroleum-contaminated
    soil to test whether a three-strain planktonic or biofilm consortium improves phenanthrene or naphthalene degradation
    relative to two-strain combinations and single isolates.
  assembly_strategy: Select isolates A1, A3, and B8-1 after enrichment on phenanthrene or naphthalene as sole carbon sources,
    standardize each isolate by OD600, and construct the three-member Consortium 4 from B8-1, A1, and A3.
  inoculation_strategy: Consortium 4 was assembled from Bacillus paramycoides B8-1, Bacillus paranthracis A1, and Bacillus
    licheniformis A3; Table 1 reports 1150 uL of B8-1, 2550 uL of A1, and 1273 uL of A3 after OD600 standardization.
  perturbation_design: Compare the three selected isolates and four derived consortia in planktonic and glass-attached biofilm
    forms for 7-day phenanthrene and naphthalene degradation at 200 mg/L, 37 °C, and pH 7.0.
  measurement_endpoints:
  - biofilm formation by crystal violet OD595 assay
  - HPLC quantification of phenanthrene and naphthalene degradation
  - 16S rRNA identification of the selected isolates
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The consortia were composed as follows: Consortium 1 (B8-1 and A1), Consortium 2 (B8-1 and A3), Consortium 3
      (A1 and A3), and Consortium 4 (B8-1, A1, and A3).'
    explanation: Identifies Consortium 4 as the three-member B8-1/A1/A3 consortium.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consortium 4 1150 µl 2550 µl 1273 µl
    explanation: Table 1 specifies 1150 uL of B8-1, 2550 uL of A1, and 1273 uL of A3 to assemble Consortium 4.
