ecological_interactions:
- name: Consortium 4 Three-Strain Planktonic and Biofilm Naphthalene Biodegradation
  description: The three-strain Consortium 4 (B8-1, A1, and A3) degraded 64.47% of naphthalene in planktonic culture and 79.74%
    as a glass-attached biofilm in the 7-day HPLC assay (200 mg/L initial concentration), exceeding the planktonic monoculture
    naphthalene degradation of A1 (41.01%) and A3 (38.92%) as well as the A3 biofilm monoculture (64.57%).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paramycoides B8-1
    term:
      id: NCBITaxon:2026194
      label: Bacillus paramycoides
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  - preferred_term: Bacillus licheniformis A3
    term:
      id: NCBITaxon:1402
      label: Bacillus licheniformis
  metabolites:
  - preferred_term: naphthalene
    term:
      id: CHEBI:16482
      label: naphthalene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The result demonstrated that the naphthalene biodegradation rates of 41.01, 38.92, 75.54, 44.71, 92.43, and 64.47%
      for the planktonic cultures, whereas were 87.72, 64.57, 77.45, 86.88, 94.69, and 79.74% for the biofilm cultures of
      isolates A1, A3, consortium 1, consortium 2, consortium 3, and consortium 4, respectively.
    explanation: Supports the 64.47% planktonic and 79.74% biofilm naphthalene degradation rates reported for three-strain
      Consortium 4.
  - reference: PMID:42587276
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Moreover, the planktonic cultures of all consortia have more naphthalene biodegradation ability than the planktonic
      cultures of A1 and A3 individual isolates. This finding demonstrated the synergistic interaction between the consortia`s
      members
    explanation: Records the authors' synergy interpretation from planktonic consortium naphthalene removal relative to A1
      and A3.
- name: Consortium 4 Three-Strain Phenanthrene Antagonism
  description: In 7-day phenanthrene degradation assays (200 mg/L), three-strain Consortium 4 degraded 16.47% of phenanthrene
    in planktonic culture and 20.79% in glass-attached biofilm culture—the lowest biofilm phenanthrene degradation among the
    four tested consortia and substantially below all three single-strain cultures (60.72-77.94%), consistent with intensified
    nutrient competition and antagonism when all three strains grow on the three-ring PAH.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paramycoides B8-1
    term:
      id: NCBITaxon:2026194
      label: Bacillus paramycoides
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  - preferred_term: Bacillus licheniformis A3
    term:
      id: NCBITaxon:1402
      label: Bacillus licheniformis
  metabolites:
  - preferred_term: phenanthrene
    term:
      id: CHEBI:28851
      label: phenanthrene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In addition, planktonic cultures of A1, A3, consortium 1, consortium 2, consortium 3, and consortium 4 displayed
      degradation rates of 31.82, 28.40, 4.26, 21.25, 15.05, and 16.47%, respectively. Whereas in the biofilm mode, the biodegradation
      rates were 70.22, 63.29, 53.51, 48.66, 47.77, and 20.79%, respectively.
    explanation: Supports the 16.47% planktonic and 20.79% biofilm phenanthrene biodegradation rates for three-strain Consortium
      4.
  - reference: PMID:42587276
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Moreover, these findings could be attributed to the nutrient stress and competition between the individual isolates,
      which inhibit the growth and metabolism of each other, thus affecting the outcome of bioremediation negatively, which
      is better described as an antagonistic effect
    explanation: Records the authors' nutrient-competition and antagonism interpretation for lower consortium phenanthrene
      removal.
