ecological_interactions:
- name: Four-Stage Maize Biofertilization
  description: The field experiment compared no application, conventional fertilizer and seven-strain biofertilizer,
    each active treatment delivered manually or by drone. The reported protocol used 50 mL per plant and four application
    times (0, 25, 55 and 85 days after sowing). Delivery is a manipulated input, not microbial colonization facilitation.
    The source separately describes about 120 days for yield harvest; those timing descriptions are not silently
    reconciled here.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Biofertilizer-Linked Soil and Yield Response
    description: The repeated biofertilizer treatment is the manipulated input compared with control and conventional-fertilizer
      arms in the reported field design. The resulting agronomic differences support a treatment-level effect, not
      proof that a particular strain, nitrogen-fixation route or within-consortium mutualism mediated it.
  - target: Treatment-associated soil microbiome shifts
    description: The biofertilizer application arms produced distinct soil-community profiles across the sampled
      season. This treatment-to-profile link does not establish absolute taxon growth, tracking of the introduced
      strains, or causation by the individual edges of the co-occurrence network.
  evidence:
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'The drone was calibrated to deliver 50 mL of treatment solution per plant

      '
    explanation: "Supports the per-plant dose used in drone-assisted biofertilizer delivery.\n Field-treatment protocol,\
      \ not an in-vitro ecological interaction."
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Applications were carried out at four key growth stages: pre-treatment at 0 days after sowing (DAS),
      mid-season at 25 DAS, early reproductive stage at 55 DAS, and harvest at 85 DAS

      '
    explanation: "Documents the four maize growth stages used for treatment applications.\n Field-treatment protocol,\
      \ not an in-vitro ecological interaction."
- name: Biofertilizer-Linked Soil and Yield Response
  description: The study reports higher soil microbial biomass, aggregate stability, plant nutrient uptake, chlorophyll,
    growth and yield, with lower disease incidence, under biofertilization, especially drone delivery, than its
    comparison treatments. These are treatment-level outcomes of the reported field experiment, not measurements
    of nitrogen-fixation flux, phosphate transfer, mutual benefit among seven strains, or a uniquely demonstrated
    microbial mechanism. The field statistics were not independently reproduced.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Biofertilization treatments, mainly when applied via drone technology, demonstrated the most pronounced
      positive impacts on soil microbial diversity, nutrient availability, crop yield, and disease resistance

      '
    explanation: 'Supports the positive agronomic and soil responses to the teosinte-derived biofertilizer treatments.

      '
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Biofertilization also enhanced plant nutrient uptake and physiological performance

      '
    explanation: 'Supports improved maize nutrient uptake and host physiology after SynCom-based biofertilization.

      '
- name: Treatment-associated soil microbiome shifts
  description: Soil bacterial and fungal relative-abundance profiles shifted across fertilization treatments and
    sampling times, including reduced Enterobacteriaceae dominance and increased representation of source-described
    beneficial genera. The soil community includes indigenous taxa beyond the seven inoculant strains. Relative
    abundance does not prove absolute population growth, inoculant strain establishment, or uniformly beneficial
    function of every organism assigned to those genera.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Biofertilization treatments produced the most pronounced shifts, reducing Enterobacteriaceae below
      50% while significantly increasing beneficial taxa like Bacillus, Pantoea, and Serratia

      '
    explanation: 'Supports beneficial-taxon enrichment and Enterobacteriaceae reduction after SynCom biofertilization.

      '
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Bacterial communities exhibited complementary patterns, with plant growth-promoting rhizobacteria
      showing significant enrichment in biofertilization treatments

      '
    explanation: 'Supports enrichment of plant-growth-promoting rhizobacteria in the biofertilized soil community.

      '
- name: Statistical Bacillus-centered soil association network
  description: Computational co-occurrence analysis of soil abundance profiles identifies Bacillus as a central
    taxonomic node and correlated responses among putative functional guilds. Correlation and centrality do not
    establish mutualism, directed nutrient exchange, nitrogen-fixation activity, pathogen suppression by a particular
    edge, or experimental keystone necessity. These are soil-community associations, not a resolved interaction
    network among the seven inoculant strains.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:40270813
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: 'Network analysis demonstrated that microbial interaction complexity increased across treatments, with
      Bacillus emerging as a keystone species

      '
    explanation: Supports a source-interpreted co-occurrence pattern; ecological mechanism and necessity are not
      experimentally established.
  - reference: PMID:40270813
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: 'Drone-assisted biofertilization fostered particularly intricate microbial networks, enhancing synergistic
      relationships involved in nutrient cycling and biocontrol

      '
    explanation: Supports a source-interpreted co-occurrence pattern; ecological mechanism and necessity are not
      experimentally established.
  - reference: PMID:40270813
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: based on correlated changes in abundance throughout the crop cycle
    explanation: Identifies the observational basis of the network, rather than a perturbation test of its edges.
