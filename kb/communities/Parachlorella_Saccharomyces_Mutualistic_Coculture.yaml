    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: yeast viability remained above 68%, indicating possible metabolic support from microalgae
      via exopolysaccharides (EPS) - derived molecules
    explanation: Positive viability observation supports a proposed EPS mechanism, not directly traced
      carbon transfer or demonstrated necessity.
- name: Coculture Algal Cell Increase and Relative Lipid Signal
  description: 'Two distinct positive endpoints are reported for the P. kessleri-S. cerevisiae coculture.
    Figure 3 measures P. kessleri cell concentration: at day 12, BG10P10 coculture is reported as 4.8-fold
    the BBM + NO3 monoculture control, while BG10P10 algal monoculture is 2.8-fold that control. This
    is not a fourfold isolated yeast effect or a dry-biomass measurement. Separately, Methods 2.3 assays
    day-14 pellets resuspended at 1.0 x 10^8 cells/mL using bulk Nile Red fluorescence. Results 3.2 reports
    3437 +/- 17 a.u. for BBM control and 14195 +/- 216 a.u. for coculture, and calls the latter 4.3-fold;
    the ratio of those means is approximately 4.13. Methods specifies 2 micrograms/mL dye, whereas Results
    specifies 2.5. These reporting conflicts remain unresolved. No species separation is described for
    this lipid assay in the inspected main text; relative signal is not lipid mass, volumetric productivity,
    or proof of exclusively algal lipid production. The combined endpoint remains community-level to preserve
    that mixed-assay boundary.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
