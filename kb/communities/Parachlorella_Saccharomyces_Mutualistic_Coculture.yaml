      label: growth
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  downstream:
  - target: Fourfold Coculture Biomass and Lipid Increase
    description: PARTIAL - Yeast-associated maintenance of algal growth and nutrient-competition-associated lipid
      accumulation provide the reported physiological contribution to higher coculture biomass/lipid production.
      This does not apportion the fourfold endpoint among growth support, gas exchange and other mechanisms.
  evidence:
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Yeast sustained microalgal growth during the transition to phototrophy after glucose depletion (day
      6) and promoted lipid accumulation through nutrient competition.
    explanation: Yeast supports microalgal growth and drives lipid accumulation via nutrient competition.
- name: Proposed EPS-Derived Metabolic Support of Yeast
  description: HYPOTHESIZED - Yeast viability remained above 68% during approximately 8 days of nutrient limitation,
    which the authors interpret as possible metabolic support by microalgal EPS-derived molecules. AFM showed visible
    EPS and cell-surface changes, and FluidFM found stronger, longer cell interactions, likely associated with EPS.
    These positive viability and biophysical observations do not by themselves demonstrate EPS-carbon uptake, donor-to-recipient
    transfer or dependence of yeast survival on EPS.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Parachlorella kessleri
