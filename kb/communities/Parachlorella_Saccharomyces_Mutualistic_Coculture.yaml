ecological_interactions:
- name: Proposed Reciprocal Oxygen and Carbon Dioxide Exchange
  description: HYPOTHESIZED - Reciprocal oxygen/carbon dioxide exchange is proposed as a basis for microalga-yeast
    association. In the accessible PMID42217804 abstract, this is introductory context rather than an exact-system
    gas-flux or mediator-perturbation result. Preserve it as a mechanistic hypothesis for P. kessleri and S. cerevisiae,
    not demonstrated bidirectional flux or reciprocal fitness benefit.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Parachlorella kessleri
