ecological_interactions:
- name: Proposed Reciprocal Oxygen and Carbon Dioxide Exchange
  description: HYPOTHESIZED - Reciprocal oxygen/carbon dioxide exchange is proposed for P. kessleri and
    S. cerevisiae. Results 3.2 of PMID42217804 attributes sustained algal growth after day 6 most likely
    to local yeast-derived CO2 enrichment. The inspected main-text methods do not directly measure reciprocal
    gas flux or isolate gas-exchange mediation. This is a mechanistic interpretation, not demonstrated
    bidirectional transfer or reciprocal fitness benefit. Separate supplements remain uninspected.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Parachlorella kessleri
    term:
      id: NCBITaxon:3074
      label: Parachlorella kessleri
  target_taxon:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  metabolites:
  - preferred_term: oxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  downstream:
  - target: Coculture Algal Cell Increase and Relative Lipid Signal
    description: HYPOTHESIZED - Respiratory CO2 and photosynthetic oxygen could support coculture growth.
      Main-text comparisons do not isolate gas exchange as the cause of the species-resolved algal cell
      increase or bulk relative lipid signal; medium enrichment contributes to the growth comparison.
  evidence:
  - reference: PMID:42217804
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Microalgae and yeasts can establish a mutualistic relationship based on reciprocal oxygen/carbon
      dioxide exchange, offering a strategy to overcome productivity limits caused by the slow growth
      of microalgae.
    explanation: Introductory mechanistic context, not an exact-system gas-exchange measurement in the
      accessible abstract.
  - reference: PMID:42217804
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: microalgal growth was sustained and boosted in co-culture, most likely due to the local CO2
      enrichment of the medium provided by yeast activity, in addition to atmospheric CO2.
    explanation: 'Results 3.2, article page 6: authors'' proposed explanation of growth maintenance, not
      direct CO2-flux or necessity evidence.'
- name: Yeast support of microalgal growth and lipid accumulation
  description: 'P. kessleri growth was maintained in coculture after the day 6 transition to phototrophy.
    Figure 3 compares BBM + NO3 monoculture, glucose/peptone-enriched BG10P10 monoculture and BG10P10
    coculture: reported day-12 algal cell concentrations are 2.8-fold and 4.8-fold the BBM control in
    enriched monoculture and coculture, respectively. Thus yeast is associated with an additional growth
    benefit, but the full 4.8-fold comparison includes medium enrichment. Nutrient competition and gas
    exchange are proposed explanations of the relative lipid response, not isolated mediation estimates.
    The day-14 bulk Nile Red assay does not establish taxon-specific lipid production.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  target_taxon:
    preferred_term: Parachlorella kessleri
    term:
      id: NCBITaxon:3074
      label: Parachlorella kessleri
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  downstream:
  - target: Coculture Algal Cell Increase and Relative Lipid Signal
    description: PARTIAL - Yeast-associated maintenance of algal growth contributes to the cell-count
      endpoint. Nutrient competition is the authors' proposed explanation of increased relative lipid
      signal. The enriched-medium control also increases growth, so the full control-relative fold change
      cannot be assigned to yeast or a particular exchanged metabolite.
  evidence:
  - reference: PMID:42217804
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Yeast sustained microalgal growth during the transition to phototrophy after glucose depletion
      (day 6) and promoted lipid accumulation through nutrient competition.
    explanation: Abstract reports algal growth maintenance and attributes lipid accumulation to nutrient
      competition; the latter is an interpretation, not isolated mediator necessity. Methods 2.3 measures
      bulk relative fluorescence.
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The presence of glucose and peptone in BG10P10 medium brought higher cell concentrations,
      with a maximum at day 12 with a 2.8-fold higher concentration in BG10P10 condition and a 4.8-fold
      higher concentration in co-culture condition (Fig. 3A and B).
    explanation: 'Results 3.2 and Figure 3: medium enrichment alone increases algal cell counts; coculture
      provides a further increase. Both fold changes use BBM + NO3 monoculture as reference.'
- name: Proposed EPS-Derived Metabolic Support of Yeast
  description: HYPOTHESIZED - Yeast viability remained above 68% during approximately 8 days of nutrient
    limitation, which the authors interpret as possible metabolic support by microalgal EPS-derived molecules.
    AFM showed visible EPS and cell-surface changes, and FluidFM found stronger, longer cell interactions,
    likely associated with EPS. These positive viability and biophysical observations do not by themselves
    demonstrate EPS-carbon uptake, donor-to-recipient transfer or dependence of yeast survival on EPS.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Parachlorella kessleri
