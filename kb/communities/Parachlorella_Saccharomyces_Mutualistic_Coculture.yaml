    snippet: concentration of 2 µg/mL in 40% (v/v) dimethyl sulfoxide (DMSO)
    explanation: Methods 2.3 dye concentration conflicts with Results 3.2; supplementary calibration remains
      uninspected.
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a Nile red concentration of 2.5 µg/mL was selected for the comparison.
    explanation: Results 3.2 dye concentration retained alongside the different Methods value; no preferred
