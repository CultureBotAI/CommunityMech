    snippet: The presence of glucose and peptone in BG10P10 medium brought higher cell concentrations,
      with a maximum at day 12 with a 2.8-fold higher concentration in BG10P10 condition and a 4.8-fold
      higher concentration in co-culture condition (Fig. 3A and B).
    explanation: Results 3.2, article page 6; Figure 3 reports algal cell concentration, with distinct
      enriched-medium and coculture comparisons.
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: to enable species differentiation, precise cell quantification and to measure cell population
      viability.
    explanation: 'Methods 2.1.2, article page 3: coculture flow cytometry distinguishes species for cell
      counts; this does not make the separate lipid plate assay species-resolved.'
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Relative lipid levels were then measured using Nile Red staining coupled with fluorescence
      spectroscopy (Rumin et al., 2015).
    explanation: Results 3.2 identifies relative lipid fluorescence, not an extracted lipid mass.
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pellets were thawed immediately before analysis and resuspended in deionized water to a final
      concentration of 1.0 × 108 cells/mL.
    explanation: 'Methods 2.3, article page 4: fixed-density pellet assay; species separation is not described
      in this section.'
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 3437 ± 17 a. u., and in co-culture conditions with a lipid content increased to 14195 ± 216
      a. u..
    explanation: Results 3.2 gives arbitrary-unit fluorescence means; their calculated ratio is approximately
      4.13, differing from the separately stated 4.3-fold.
  - reference: PMID:42217804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the co-culture exhibited a relative lipid content 4.3-fold higher than that observed in BBM
      + NO3.
    explanation: Results 3.2 reported fold change retained as a source conflict, not silently replaced
