- name: Fourfold Coculture Biomass and Lipid Increase
  description: Under coculture conditions, biomass and lipid production increased fourfold relative to microalgal
    monoculture grown in BBM + NO3 medium. This is a positive culture-level productivity comparison. The accessible
    abstract does not establish that the entire biomass increase is microalgal, quantify each species contribution,
    or isolate gas exchange or EPS transfer as the cause. It does not demonstrate reciprocal benefit solely from
    increased bulk output.
