      label: dioxygen
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  downstream:
  - target: Fourfold Coculture Biomass and Lipid Increase
    description: HYPOTHESIZED - Photosynthetic oxygen and respiratory carbon dioxide exchange could support coculture
      productivity. The accessible abstract does not isolate the contribution of gas exchange to the observed fourfold
      biomass/lipid increase.
  evidence:
  - reference: PMID:42217804
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Microalgae and yeasts can establish a mutualistic relationship based on reciprocal oxygen/carbon dioxide
      exchange, offering a strategy to overcome productivity limits caused by the slow growth of microalgae.
    explanation: Introductory mechanistic context, not an exact-system gas-exchange measurement in the accessible
      abstract.
- name: Yeast support of microalgal growth and lipid accumulation
  description: The abstract reports that yeast sustained microalgal growth during the transition to phototrophy
    after glucose depletion on day 6 and promoted lipid accumulation through nutrient competition. Preserve these
    reported positive physiological effects without interpreting nutrient competition as a demonstrated reciprocal
    benefit or specifying an unmeasured exchanged nutrient. Full-text comparisons and the fraction of productivity
    mediated by each process remain uninspected.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Saccharomyces cerevisiae
    term:
