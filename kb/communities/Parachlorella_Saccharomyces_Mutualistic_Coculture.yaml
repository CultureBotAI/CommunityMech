id: CommunityMech:000295
name: Parachlorella kessleri + Saccharomyces cerevisiae Mutualistic Co-culture
description: Two-member engineered co-culture of the green microalga Parachlorella kessleri and the
  yeast Saccharomyces cerevisiae, established to enhance microalgal lipid productivity. The partners
  form a mutualistic relationship based on reciprocal oxygen/carbon dioxide gas exchange. Under
  co-culture, biomass and lipid production increased 4-fold relative to microalgal monoculture. Yeast
  sustained microalgal growth during the transition to phototrophy after glucose depletion and promoted
  lipid accumulation through nutrient competition, while microalgae are inferred to provide metabolic
  support to the yeast via exopolysaccharide (EPS)-derived molecules. Nanomechanical analyses (AFM,
  FluidFM) showed increased EPS production and stronger, longer microalga-yeast cell-cell interactions
  in co-culture.
