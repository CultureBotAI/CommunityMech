    term:
      id: CHEBI:16526
      label: carbon dioxide
  - preferred_term: dissolved organic matter
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Generic organic-carbon pool; the exchanged compounds and release routes were not resolved by protein/SIP.
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  downstream:
  - target: Carbon Transfer to Heterotrophs
    description: Cyanobacterial fixation supplies carbon subsequently incorporated into heterotrophic proteins,
      as supported by 13C-bicarbonate protein/SIP. Preserve this experimental donor-to-heterotroph direction without
      claiming that labeling identifies the exact exchanged compounds or a trophic cascade.
  evidence:
  - reference: doi:10.3389/fmicb.2022.780346
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: tight coupling of carbon transfer from cyanobacteria to the heterotrophic populations
    explanation: The primary protein/SIP results support transfer of photosynthetically fixed carbon; they do not
      resolve the release route.
- name: Carbon Transfer to Heterotrophs
  description: Protein/SIP supports cyanobacterial carbon transfer to heterotrophs, with strong peptide coverage
    for Wenzhouxiangella MAG57 and Phycisphaerales MAG34. These populations lagged cyanobacterial labeling, consistent
    with use of macromolecular carbon; specific protein/glycogen transfer remains an interpretation. Planctomycetota
    is the existing broad canonical grounding for MAG34, not evidence that every member of that phylum participates.
    Do not assign all proposed fermentation products to Wenzhouxiangella or infer nutrient return and reciprocal
    fitness from carbon uptake.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.3389/fmicb.2022.780346
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: tight coupling of carbon transfer from cyanobacteria to the heterotrophic populations
    explanation: Experimental labeling supports carbon flow; full Figure 4 distinguishes the two major heterotrophic
      populations from lower-peptide populations.
