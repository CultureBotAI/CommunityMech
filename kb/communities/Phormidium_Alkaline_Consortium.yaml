discussions:
- discussion_id: phormidium-observed-carbon-versus-proposed-services
  prompt: Which genomic niches and reciprocal services operate in this alkaline consortium?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Photosynthetic CO2 Fixation
  - ecological_interactions#Carbon Transfer to Heterotrophs
  - ecological_interactions#Proposed Cyanobacterial Polymer Use by Verrucomicrobiota
  - ecological_interactions#Alphaproteobacterial Heterotrophic Carbon Use
  rationale: 'Retain experimental carbon flow and qualified genomic niches. Introductory examples of vitamin/siderophore
    delivery, nutrient remineralization and ROS protection in other phototroph systems do not demonstrate the removed
    exact-community services. The nutrient-return to vitamin-production arrow has no supporting experiment. Figure
    3 explicitly depicts inference from gene content; Figure 4 supports carbon flow, not compound-resolved flux
    or a trophic cascade. Bacteroidota remains a genuine member with inferred metabolic niches, not proven nutrient-return
    function. Stability over years does not mean fixed membership or experimentally established redundancy mediation.
    Additional niche and MAG-resolved graph coverage remains issue #1699 pending scoped Edison report; no unsupported
    edge is added to give every taxon connectivity credit.'
  evidence:
  - reference: doi:10.3389/fmicb.2022.780346
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: tight coupling of carbon transfer from cyanobacteria to the heterotrophic populations
    explanation: Experimental labeling supports carbon flow; full Figure 4 distinguishes the two major heterotrophic
      populations from lower-peptide populations.
  - reference: doi:10.3389/fmicb.2022.780346
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: All four consortium members affiliated with Verrucomicrobiota had 6–38 genes for glycoside hydrolysis
      and 12–37 genes encoding sulfatases
    explanation: Primary Results assign the hydrolase/sulfatase genomic capacity to these four MAGs, not a demonstrated
      cross-phylum handoff.
  posed_by: codex
