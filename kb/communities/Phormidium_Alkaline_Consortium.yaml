ecological_interactions:
- name: Photosynthetic CO2 Fixation
  description: Ca. P. alkaliphilum is the primary producer in this alkaline consortium. Label from supplied 13C-bicarbonate
    entered cyanobacterial proteins and subsequently heterotrophic proteins. Preserve photosynthetic carbon input
    without assigning every proposed release route (excretion, vesicles, lysis or osmotic shock) as measured in
    this community, or treating all cultures as uniformly above pH 11.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Candidatus Phormidium alkaliphilum
    term:
      id: NCBITaxon:1807132
      label: Candidatus Phormidium alkaliphilum
  metabolites:
