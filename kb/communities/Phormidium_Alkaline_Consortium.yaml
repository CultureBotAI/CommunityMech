- name: Nutrient Remineralization
  description: 'Heterotrophic bacteria remineralize nutrients from complex organic matter, returning inorganic
    nutrients to the cyanobacterial primary producer. This includes breakdown of biopolymers using extracellular
    enzymes. The recycling of nutrients helps sustain long-term community productivity and stability.

    '
