- name: Alphaproteobacterial Heterotrophic Carbon Use
  description: PARTIAL - Alphaproteobacterial genomes support heterotrophic niches, and the lower-peptide Rhodobacteraceae
    MAG58 isotope signal is consistent with cyanobacterial carbon use. Oceanicaulis MAG52 and Roseinatronobacter
    MAG58 also encode bacteriochlorophyll-associated phototrophic capacity, not demonstrated photosynthetic flux.
    The study does not establish class-wide vitamin provision, siderophore delivery, nitrogen recycling or reciprocal
    cyanobacterial benefit; Figure 4 has much weaker peptide coverage for MAG58 than the major heterotrophs.
  scope: PAIRWISE
  source_taxon:
