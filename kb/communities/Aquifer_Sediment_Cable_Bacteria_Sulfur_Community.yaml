id: CommunityMech:000484
name: Aquifer Sediment Cable Bacteria Sulfur-Cycling Community
description: An oxic-anoxic interface and capillary-fringe sediment community from a tar-oil-contaminated aquifer in Flingern
  (Düsseldorf, Germany) mediated by long filamentous Desulfobulbaceae cable bacteria that bridge spatially separated anodic
  sulfide oxidation and cathodic oxygen reduction over 1-2 cm via long-distance electron transfer (LDET), co-occurring with
  Thiobacillus denitrificans and Ignavibacteria at the upper plume fringe and regenerating sulfate for toluene-degrading sulfate-reducing
  Desulfobulbaceae (PMID:27058505).
ecological_state: PERTURBED
community_origin: NATURAL
community_category: BIOREMEDIATION
environment_term:
  preferred_term: sediment
  term:
    id: ENVO:00002007
    label: sediment
  notes: Hydrocarbon-contaminated Flingern aquifer sediment cores and laboratory sediment column microcosms amended with 2
    umol g-1 FeS and incubated at 20 C in the dark across an oxic-suboxic-sulfidic gradient (PMID:27058505).
