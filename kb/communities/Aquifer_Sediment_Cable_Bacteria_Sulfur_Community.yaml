  downstream:
  - target: Sulfate-Reducing Hydrocarbon Plume Fringe Biodegradation
    description: Sulfate regenerated by cable-bacterial anodic sulfide oxidation replenishes the electron acceptor pool for
      sulfate-reducing toluene biodegradation at the plume fringe.
  - target: Redox-Gradient Niche Competition with Unicellular Sulfide Oxidizers
    description: Spatial decoupling of anodic sulfide oxidation and cathodic oxygen reduction across 1-2 cm gives filamentous
      cable bacteria a competitive advantage over unicellular Thiobacillus across fluctuating redox gradients.
  evidence:
  - reference: PMID:27058505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we provide primary evidence that such sulfur-oxidizing cable bacteria can also be found at oxic–anoxic interfaces
      in aquifer sediments, where they provide a means for the direct recycling of sulfate by electron transfer over 1–2-cm
      distance.
    explanation: Establishes LDET-driven sulfide oxidation and direct sulfate recycling over 1-2 cm by aquifer Desulfobulbaceae
      cable bacteria.
- name: Sulfate-Reducing Hydrocarbon Plume Fringe Biodegradation
  description: Sulfate-reducing Desulfobulbaceae at the plume fringe utilize regenerated sulfate to degrade toluene and produce
    sulfide, which is re-oxidized by cable bacteria or precipitated as FeS.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Desulfobulbaceae
    term:
      id: NCBITaxon:213121
      label: Desulfobulbaceae
  metabolites:
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  - preferred_term: sulfide
    term:
      id: CHEBI:26822
      label: sulfide
  biological_processes:
  - preferred_term: dissimilatory sulfate reduction
    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: PMID:27058505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A plume fringe scenario including sulfide re-oxidation by cable bacteria leads to higher availability of sulfate
      for toluene degradation by sulfate reduction (SR) and a broader zone of biodegradation at the plume fringes.
    explanation: Supports coupling between cable-bacterial sulfate regeneration and sulfate-reducing toluene biodegradation.
  - reference: PMID:27058505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: It is also likely that sulfide produced by sulfate-reducing toluene degradation is immediately re-oxidized by
      LDET ( Figure 4b ) or precipitated as FeS in the field.
    explanation: Documents the cyclic re-oxidation of biogenic sulfide produced during sulfate-reducing toluene degradation.
- name: Redox-Gradient Niche Competition with Unicellular Sulfide Oxidizers
  description: Filamentous Desulfobulbaceae cable bacteria compete with unicellular chemolithoautotrophic sulfide oxidizers
    such as Thiobacillus at the oxic-anoxic interface by bridging separated electron donor and acceptor zones across fluctuating
    water tables.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Desulfobulbaceae
    term:
      id: NCBITaxon:213121
      label: Desulfobulbaceae
