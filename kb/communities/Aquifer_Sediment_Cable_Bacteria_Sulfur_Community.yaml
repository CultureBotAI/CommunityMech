ecological_interactions:
- name: Long-Distance Electron Transfer Sulfide Oxidation and Sulfate Recycling
  description: Filamentous Desulfobulbaceae cable bacteria span the 9-25 mm suboxic zone to couple anodic sulfide oxidation
    in the sulfidic zone with cathodic oxygen reduction in the oxic zone via long-distance electron transfer (LDET, 1.5 mA
    m-2), directly regenerating sulfate at the oxic-anoxic interface.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Desulfobulbaceae
    term:
      id: NCBITaxon:213121
      label: Desulfobulbaceae
