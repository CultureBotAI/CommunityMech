    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial filaments, which were highly abundant in the suboxic zone, were identified by sequencing of 16S rRNA
      genes and fluorescence in situ hybridization (FISH) as cable bacteria belonging to the Desulfobulbaceae.
    explanation: Identifies the abundant suboxic-zone filaments in aquifer sediment columns as Desulfobulbaceae cable bacteria.
  - reference: PMID:27058505
