    snippet: Dominant taxa within the plume core were Rhodocyclaceae (T-RF 502) and Desulfobulbaceae related to the toluene-degrading
      strain TRM1 ( Meckenstock, 1999 ) at the lower fringe, previously identified as the key toluene degraders in this aquifer
    explanation: Documents co-occurring toluene-degrading Desulfobulbaceae related to strain TRM1 in the aquifer plume fringe.
