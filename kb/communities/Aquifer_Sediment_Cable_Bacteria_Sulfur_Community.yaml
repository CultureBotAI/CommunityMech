    term:
      id: NCBITaxon:919
      label: Thiobacillus
  metabolites:
  - preferred_term: sulfide
    term:
      id: CHEBI:26822
      label: sulfide
  biological_processes:
  - preferred_term: sulfur oxidation
    term:
      id: GO:0019417
      label: sulfur oxidation
  evidence:
  - reference: PMID:27058505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The high abundance of cable bacteria at the oxic–anoxic interface of aquifers indicates an ecological competitiveness
      to other sulfide-oxidizing, chemo–litho–autotrophs such as, for example, Thiobacillus.
    explanation: Establishes ecological competition between filamentous Desulfobulbaceae cable bacteria and unicellular Thiobacillus
      sulfide oxidizers.
environmental_factors:
- name: Suboxic Zone Spatial Separation
  value: 9 to 25
  unit: mm
  description: Spatial separation between oxygen penetration (8 mm) and sulfidic zones bridged by cable bacteria in FeS-amended
    aquifer sediment columns.
  evidence:
  - reference: PMID:27058505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Steep geochemical gradients developed in the upper 3 cm, showing a spatial separation of oxygen and sulfide by
      9 mm together with a pH profile characteristic for sulfur oxidation by LDET.
    explanation: Reports the 9 mm suboxic separation and characteristic LDET pH profile in the upper 3 cm of sediment.
- name: Iron Sulfide Amendment and Dark Incubation
  value: 2 umol g-1 FeS at 20 C
  unit: qualitative
  description: Homogenized Flingern aquifer sediments were amended with 2 umol g-1 FeS, saturated with anoxic water, and incubated
    at 20 C in the dark for 70 days.
  evidence:
  - reference: PMID:27058505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sediments were taken from a hydrocarbon-contaminated aquifer, amended with iron sulfide and saturated with water,
      leaving the sediment surface exposed to air.
    explanation: Documents the sediment microcosm setup with iron sulfide amendment and air-exposed surface.
