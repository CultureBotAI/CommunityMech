discussions:
- discussion_id: kg-geobacter-methanosaeta-acetate-route-unresolved
  prompt: >
    Alongside DIET-driven CO2 reduction, does M. harundinacea also cross-feed on the
    acetate generated by G. metallireducens ethanol oxidation, and what fraction of
    methane comes from each route in this defined coculture?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Ethanol Oxidation and Direct Electron Transfer
  - ecological_interactions#Direct Electron Acceptance and Methanogenesis
  rationale: >
    A causal-graph pass on this record proposed an additional acetate cross-feeding node
    and an acetate -> methanogenesis edge, on the reasoning that Methanosaeta is
    classically an acetoclastic genus and that ethanol oxidation by G. metallireducens
    yields acetate, giving an overall stoichiometry near 1.5 mol CH4 per mol ethanol.
    That claim is NOT curated here as an interaction: the primary source
    (doi:10.1039/C3EE42189A) is cached abstract-only and its full text was not
    retrievable, and the abstract states only that M. harundinacea "accepted electrons
    via DIET for the reduction of carbon dioxide to methane" - it does not report acetate
    cross-feeding, the acetate/DIET split, or the per-route methane stoichiometry. The
    supporting quotations offered for the acetate route came from secondary reviews
    attributing findings to this study, which per this repo's conservative-curation rule
    (see CommunityMech:000176) is not a sufficient basis for an exact-system causal edge.
    Resolving this needs the primary full text or a radiotracer/isotope partition
    experiment in this exact coculture.
  evidence:
  - reference: doi:10.1039/C3EE42189A
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Transcriptomic, radiotracer, and genetic analysis demonstrated that M. harundinacea
      accepted electrons via DIET for the reduction of carbon dioxide to methane
    explanation: The abstract demonstrates only the DIET/CO2-reduction route; it is silent on an
      acetate cross-feeding route, which is why that edge is filed as a gap rather than curated.
