ecological_interactions:
- name: Geobacter Ethanol Oxidation
  description: In the defined Geobacter metallireducens-Methanosaeta harundinacea coculture, Geobacter oxidizes
    ethanol to acetate and releases electrons for DIET. This is the donor reaction, not a claim that ethanol carbon
    is directly oxidized to CO2 at this step. The acetate coproduct also contributes to bulk methane through a separate
    route, not yet represented as its own graph branch.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Geobacter metallireducens
    term:
      id: NCBITaxon:28232
      label: Geobacter metallireducens
  metabolites:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
    concentration: Substrate for oxidation
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    concentration: Product of ethanol oxidation
  biological_processes:
  - preferred_term: ethanol catabolic process
    term:
      id: GO:0006068
      label: ethanol catabolic process
  downstream:
  - target: DIET in Defined Coculture Aggregates
    description: Ethanol oxidation releases reducing equivalents that Geobacter supplies to the defined partner
      through DIET. This arrow routes electron supply, not acetate carbon, and does not assert that ethanol oxidation
      selectively causes aggregate formation.
  evidence:
  - reference: doi:10.1039/C3EE42189A
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: stoichiometrically converted ethanol to methane
    explanation: Abstract support for coupled conversion; primary defined-coculture Results and Figure 4 locate
      the donor reaction. Not environmental gene-expression proof.
- name: DIET in Defined Coculture Aggregates
  description: Defined G. metallireducens-M. harundinacea cocultures form mixed aggregates and support DIET; the
    pilA-deficient Geobacter comparison supports a requirement for its pili-associated machinery under these conditions.
    This evidence is distinct from Geobacter-species and Methanosaeta concilii expression in brewery-digester aggregates.
    Aggregate formation itself was not selectively perturbed, and the methanogen electron-entry components remain
    unresolved. Do not transfer measured conductivity of environmental aggregates to these defined aggregates as
    a separately measured property.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Geobacter metallireducens
    term:
      id: NCBITaxon:28232
      label: Geobacter metallireducens
  target_taxon:
    preferred_term: Methanosaeta harundinacea
    term:
      id: NCBITaxon:301375
      label: Methanothrix harundinacea
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  downstream:
  - target: DIET-Linked Carbon Dioxide Reduction to Methane
    description: DIET supplies electrons for M. harundinacea CO2 reduction to methane, supported by the defined-coculture
      radiotracer and pilA comparison. This direction does not allocate acetate-derived methane to the CO2 branch
      or establish a particular methanogen entry protein.
  evidence:
  - reference: doi:10.1039/C3EE42189A
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transcriptomic, radiotracer, and genetic analysis demonstrated that M. harundinacea accepted electrons
      via DIET
    explanation: The abstract identifies experimental DIET evidence in the defined coculture; Figures 4-5 bound
      aggregate and mutant interpretation.
- name: DIET-Linked Carbon Dioxide Reduction to Methane
  description: M. harundinacea accepts DIET electrons for CO2 reduction to methane in the defined coculture, supported
    by transcript, radiotracer and genetic analyses. Bulk methane also includes acetate conversion. The reported
    stoichiometry and bicarbonate radiolabel are consistent with roughly one-third of methane arising through CO2
    reduction, not all methane. This node represents that CO2 route; it does not replace the missing acetate branch
    or identify the methanogen surface electron receptor.
  scope: PAIRWISE
  source_taxon:
