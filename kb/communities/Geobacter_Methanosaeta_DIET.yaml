- name: Conductive Aggregate Formation
  value: Required for DIET
  description: 'Cocultures form conductive aggregates that enable direct cell-to-cell
    electrical contact necessary for electron transfer. Conductive aggregate formation
    is essential for establishing biological electrical connections between G. metallireducens
    and M. harundinacea. These aggregates provide the physical matrix and electrical
    conductivity required for efficient electron flow.

    '
  evidence:
  - reference: doi:10.1039/C3EE42189A
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, Geobacter species, the most abundant bacteria in the aggregates,
      highly expressed genes for ethanol metabolism and for extracellular electron
      transfer via electrically conductive pili, suggesting that Geobacter and Methanosaeta
      species were exchanging electrons via direct interspecies electron transfer
      (DIET)
    explanation: Demonstrates conductive aggregate formation as a requirement for
      DIET
- name: Pili Expression
  value: Essential for DIET initiation
  description: 'Expression of electrically conductive pili by G. metallireducens is
    critical for initiating DIET cocultures and establishing electrical connections
    with M. harundinacea. The pili contribute to the formation of conductive aggregates
    and provide pathways for electron transfer.

    '
  evidence:
  - reference: doi:10.1039/C3EE42189A
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, Geobacter species, the most abundant bacteria in the aggregates,
      highly expressed genes for ethanol metabolism and for extracellular electron
      transfer via electrically conductive pili, suggesting that Geobacter and Methanosaeta
      species were exchanging electrons via direct interspecies electron transfer
      (DIET)
    explanation: Establishes pili as essential for DIET initiation
