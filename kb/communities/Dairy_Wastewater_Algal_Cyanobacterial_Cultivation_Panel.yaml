id: CommunityMech:000384
name: Dairy Wastewater Algal-Cyanobacterial Cultivation Panel
description: 'A bounded non-sterile laboratory panel that compared mono-, co-, and sequential cultures of the screened phototrophs
  Chlorella sorokiniana, Euglena gracilis, Synechocystis sp., and Desertifilum tharense during dairy-wastewater treatment.
  The 12-day experiment grew four monocultures, four 1:1 dry-weight co-cultures, and four sequential cyanobacterium/microalga
  cultures in 50% diluted raw dairy wastewater in 500 mL bottles with 250 mL working volume. Samples were fractionated into
  phycosphere-attached and free-living bacteria for V3-V4 16S rRNA MiSeq profiling, with raw sequence data deposited under
  NCBI BioProject PRJNA1265442. This is a panel record: the four named taxa were assayed across the treatment bottles rather
  than all co-occurring in every bottle, and indigenous dairy-wastewater bacteria were intentionally retained by non-sterile
  sample handling.'
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Compare monoculture, 1:1 co-culture, and sequential cultivation strategies for two cyanobacteria and two microalgae
    in diluted raw dairy wastewater, and profile how these strategies relate to pollutant removal, algal physiology, and phycosphere/free-living
    bacterial community structure.
  assembly_strategy: Establish MC1-MC4 monocultures, CC1-CC4 pairwise co-cultures, and SC1-SC4 sequential cultures using Synechocystis
    sp., Desertifilum tharense, Chlorella sorokiniana, and Euglena gracilis as the screened algal/cyanobacterial inocula.
  inoculation_strategy: Inoculate all treatment bottles at 0.25 +/- 0.1 g/L initial biomass; combine co-culture constituents
    at a 1:1 dry-weight ratio.
  perturbation_design: Culture type was varied across four monocultures, four pairwise co-cultures, and four sequential cyanobacterium/microalga
    cultures during the same 12-day dairy-wastewater run.
  measurement_endpoints:
  - COD, NH4+-N, total nitrogen, total phosphorus, and pH
  - Biomass, total chlorophyll, proteins, lipids, polysaccharides, and extracellular polymeric substances
  - Phycosphere-associated and free-living bacterial V3-V4 16S rRNA amplicon profiles
  evidence:
  - reference: PMID:41561919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Data was collected from a 12-day laboratory-scale experiment employing three distinct cultivation systems: monoculture,
      co-culture, and sequential culture of four algal/cyanobacterial strains'
    explanation: Supports the three-way culture-strategy comparison across four phototroph strains.
  - reference: PMID:41561919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the co-culture systems, constituent strains were combined at a 1:1 dry weight ratio
    explanation: Supports the pairwise co-culture inoculation ratio.
