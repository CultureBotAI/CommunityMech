id: CommunityMech:000278
name: SynCom BsBv Cigar Tobacco Leaf Fermentation
description: Two-species synthetic microbial community (the BsBv SynCom) of Bacillus safensis and
  Bacillus velezensis, screened for high extracellular cellulase, amylase and protease activities and
  applied to cigar tobacco leaves (cultivar QX204) during a 42-day fermentation. The consortium
  accelerated degradation of cellulose, protein, and starch, shifted the leaf bacterial community
  toward Firmicutes/Bacillus, and modulated the volatile flavor metabolite profile (e.g. phenylacetic
  acid, phytol, farnesol) to enhance honey, floral, and baked aromas while reducing irritancy,
  thereby directionally improving cigar tobacco leaf quality.
