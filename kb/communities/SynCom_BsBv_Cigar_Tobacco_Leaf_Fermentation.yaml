ecological_interactions:
- name: Cooperative macromolecule degradation by the BsBv SynCom
  description: Co-inoculation of the two cellulase/amylase/protease-producing Bacillus members on
    cigar tobacco leaves accelerated the degradation of key macromolecules, reducing cellulose,
    protein, and starch contents by 52.48 %, 56.36 %, and 68.47 % respectively, markedly greater than
    the uninoculated control (a community-level, emergent function of the consortium).
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.1016/j.indcrop.2025.122621
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The SynCom significantly accelerated the degradation of key macromolecules, reducing
      cellulose, protein, and starch contents by 52.48 %, 56.36 %, and 68.47 %, respectively, which
      were markedly greater reductions than those observed in the uninoculated control.
    explanation: Measured community-level macromolecule degradation by the two-member SynCom versus
      control.
- name: SynCom-driven bacterial community succession and Bacillus enrichment
  description: Inoculation with the SynCom shifted the leaf bacterial community structure, increasing
    the relative abundance of Firmicutes and significantly enriching the genus Bacillus during
    fermentation (community-level restructuring driven by the introduced consortium).
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.1016/j.indcrop.2025.122621
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: inoculation shifted the bacterial community structure, increasing the relative abundance
      of Firmicutes and significantly enriching the genus Bacillus.
    explanation: SynCom inoculation restructured the resident bacterial community, enriching Bacillus.
