- name: L. mesenteroides Lactate Provisioning to L. kefiranofaciens
  description: Lactate supplementation increased L. kefiranofaciens growth about three-fold, and living partners
    showed reciprocal benefit. PARTIAL - L. mesenteroides-derived lactate is the source's proposed return metabolite,
    supported by modeling, supplementation and partner assays. Supplementation is not donor-resolved flux or proof
