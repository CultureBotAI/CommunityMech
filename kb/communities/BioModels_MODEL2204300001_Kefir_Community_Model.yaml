- name: Acetobacter Lactate Cross-Feeding
  description: PARTIAL - lactate-producer partnerships, conditioned-medium assays and supplementation support the
    authors' Acetobacter cross-feeding model. Acetobacter growth benefited most at 7-12 mg/ml supplied lactate.
    GC-MS did not detect appreciable lactate consumption in the tested conditioned media, although amino-acid consumption
    was measured; limited analytical sensitivity is a proposed explanation. Supplementation and late growth do not
    uniquely resolve the donor-specific lactate flux.
