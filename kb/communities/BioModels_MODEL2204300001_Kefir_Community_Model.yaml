ecological_interactions:
- name: L. kefiranofaciens Proteolytic Support for L. mesenteroides
  description: Experimental pairwise growth and supplementation support reciprocal benefit between L. kefiranofaciens
    and L. mesenteroides in liquid milk. Proteolysis, casein peptides and amino-acid supplementation support L.
    mesenteroides growth. PARTIAL - partner-specific transfer and its necessity are inferred from these assays,
    not resolved donor-tracer flux. MUTUALISM retains the measured paired benefits.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Lactobacillus kefiranofaciens
    term:
      id: NCBITaxon:267818
      label: Lactobacillus kefiranofaciens
  target_taxon:
    preferred_term: Leuconostoc mesenteroides
    term:
      id: NCBITaxon:1245
      label: Leuconostoc mesenteroides
  metabolites:
  - preferred_term: peptide
    term:
      id: CHEBI:16670
      label: peptide
    notes: Liberated by proteolytic activity
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
    notes: Accumulates throughout fermentation via proteolysis
  downstream:
  - target: L. mesenteroides Lactate Provisioning to L. kefiranofaciens
    description: PARTIAL - proteolytic support of L. mesenteroides growth can enable lactate production that benefits
      L. kefiranofaciens in the proposed reciprocal mechanism. Growth and supplementation support this model, but
      donor-resolved transfer and selective molecular necessity were not established at this review scope.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: proteolytic activity of L. kefiranofaciens constitutes its beneficial impact on L. mesenteroides
    explanation: Demonstrates that L. kefiranofaciens supports L. mesenteroides through proteolytic activity.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: casein peptides as well as free amino acids restore the growth of L. mesenteroides
    explanation: Shows that peptides and amino acids from proteolysis enable L. mesenteroides growth.
- name: L. kefiranofaciens Suppression of L. kefiri
  description: 'L. kefiranofaciens suppressed L. kefiri in liquid-milk pairwise assays. This measured directional
    inhibition is retained without assigning the local reciprocal-negative COMPETITION type: the inspected main-text
    claim does not establish both partners'' negative responses. Solid milk-agar interactions are a separate experimental
    condition.'
  scope: PAIRWISE
  source_taxon:
