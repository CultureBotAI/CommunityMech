ecological_interactions:
- name: L. kefiranofaciens Proteolytic Support for L. mesenteroides
  description: >-
    Lactobacillus kefiranofaciens provides amino acids and small peptides to Leuconostoc
    mesenteroides through proteolytic activity. L. mesenteroides depends on proteolytic
    activity by other community members, as it cannot grow in milk whey alone but grows
    well in kefir spent whey containing casein peptides and amino acids liberated by
    L. kefiranofaciens. This niche-opening interaction enables L. mesenteroides to thrive
    during early fermentation (Stage II-III) despite being poorly suited for milk alone.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Lactobacillus kefiranofaciens
    term:
      id: NCBITaxon:33962
      label: Lactobacillus kefiranofaciens
  target_taxon:
    preferred_term: Leuconostoc mesenteroides
    term:
      id: NCBITaxon:1245
      label: Leuconostoc mesenteroides
  metabolites:
  - preferred_term: peptide
    term:
      id: CHEBI:16670
      label: peptide
    concentration: Liberated by proteolytic activity
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
    concentration: Accumulates throughout fermentation via proteolysis
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      proteolytic activity of L. kefiranofaciens constitutes its beneficial impact on
      L. mesenteroides
    explanation: >-
      Demonstrates that L. kefiranofaciens supports L. mesenteroides through proteolytic
      activity.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      casein peptides as well as free amino acids restore the growth of L. mesenteroides
    explanation: >-
      Shows that peptides and amino acids from proteolysis enable L. mesenteroides growth.
- name: L. mesenteroides Lactate Provisioning to L. kefiranofaciens
  description: >-
    Leuconostoc mesenteroides produces lactate as a major fermentation by-product, which
    boosts the growth of L. kefiranofaciens approximately three-fold. Lactate supplementation
    considerably enhances L. kefiranofaciens growth in milk, demonstrating cross-feeding
    that completes the mutualistic loop. This metabolic cooperation between the two species
    involves bidirectional exchange: amino acids/peptides from L. kefiranofaciens to
    L. mesenteroides, and lactate from L. mesenteroides to L. kefiranofaciens.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Leuconostoc mesenteroides
    term:
      id: NCBITaxon:1245
      label: Leuconostoc mesenteroides
  target_taxon:
    preferred_term: Lactobacillus kefiranofaciens
    term:
      id: NCBITaxon:33962
      label: Lactobacillus kefiranofaciens
  metabolites:
  - preferred_term: L-lactate
    term:
      id: CHEBI:422
      label: lactate
    concentration: Major fermentation by-product, 7-12 mg/ml optimal
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      lactate considerably boosted (circa three-fold) the growth of L. kefiranofaciens
    explanation: >-
      Quantifies the growth enhancement of L. kefiranofaciens by lactate from L. mesenteroides.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the metabolic cooperation between L. kefiranofaciens and L. mesenteroides is
      mediated by amino acids and small peptides liberated by proteolytic activity of
      L. kefiranofaciens, which in turn benefits from lactic acid produced by L. mesenteroides
    explanation: >-
      Summarizes the bidirectional mutualistic exchange between the two species.
- name: Acetobacter Lactate Cross-Feeding
  description: >-
    Acetobacter fabarum exhibits strong dependency on lactate produced by lactate-generating
    bacteria (L. mesenteroides, L. lactis). The majority of mutualistic interactions
    involving A. fabarum (8 total) are with lactate-producing partners. Acetobacter growth
    is promoted by lactate concentrations between 7-12 mg/ml, explaining its late onset
    during fermentation (Stage VI) when lactate accumulates. This cross-feeding enables
    A. fabarum to thrive despite poor growth in plain milk whey.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Acetobacter fabarum
    term:
      id: NCBITaxon:728467
      label: Acetobacter fabarum
  metabolites:
  - preferred_term: L-lactate
    term:
      id: CHEBI:422
      label: lactate
    concentration: Consumed at 7-12 mg/ml for optimal growth
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The majority of the mutualistic interactions, 8 in total, involved A. fabarum and
      a lactate-producing partner, supporting its dependency on lactate and late onset
      during fermentation.
    explanation: >-
      Demonstrates A. fabarum's strong dependency on lactate cross-feeding from other
      community members.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Acetobacter sp. benefited from lactate most between 7 and 12 mg/ml
    explanation: >-
      Quantifies the optimal lactate concentration for Acetobacter growth.
- name: Kazachstania Lactate-Promoted Growth
  description: >-
    Kazachstania exigua, a kefir yeast, is promoted by lactate at lower concentrations
    than Acetobacter. The time-window of K. exigua growth aligns with the beneficial
    range of lactate concentration during fermentation. This cross-feeding on lactate
    produced by bacterial community members enables the yeast to thrive in the kefir
    ecosystem despite limited ability to utilize milk whey alone.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Kazachstania exigua
    term:
      id: NCBITaxon:1380867
      label: Kazachstania exigua
  metabolites:
  - preferred_term: L-lactate
    term:
      id: CHEBI:422
      label: lactate
    concentration: Promotes growth at lower concentrations than Acetobacter
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Kazachstania exigua (and Saccharomyces unisporus) were also promoted by lactate
      but at lower concentrations
    explanation: >-
      Demonstrates that K. exigua benefits from lactate cross-feeding at lower concentrations.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the time-windows of yeast and Acetobacter growth align well with the beneficial
      or inhibitory range of lactate and acetate concentration
    explanation: >-
      Shows temporal alignment of K. exigua growth with beneficial lactate concentrations.
