  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lactate considerably boosted (circa three-fold) the growth of L. kefiranofaciens
    explanation: Quantifies response to added lactate, not donor-resolved lactate transfer from L. mesenteroides.
  - reference: PMID:33398099
