ecological_interactions:
- name: L. kefiranofaciens Proteolytic Support for L. mesenteroides
  description: Lactobacillus kefiranofaciens provides amino acids and small peptides to Leuconostoc mesenteroides
    through proteolytic activity. L. mesenteroides depends on proteolytic activity by other community
    members, as it cannot grow in milk whey alone but grows well in kefir spent whey containing casein
    peptides and amino acids liberated by L. kefiranofaciens. This niche-opening interaction enables L.
    mesenteroides to thrive during early fermentation (Stage II-III) despite being poorly suited for milk
    alone.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Lactobacillus kefiranofaciens
    term:
      id: NCBITaxon:267818
      label: Lactobacillus kefiranofaciens
  target_taxon:
    preferred_term: Leuconostoc mesenteroides
    term:
      id: NCBITaxon:1245
      label: Leuconostoc mesenteroides
  metabolites:
  - preferred_term: peptide
    term:
      id: CHEBI:16670
      label: peptide
    concentration: Liberated by proteolytic activity
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
    concentration: Accumulates throughout fermentation via proteolysis
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: proteolytic activity of L. kefiranofaciens constitutes its beneficial impact on L. mesenteroides
    explanation: Demonstrates that L. kefiranofaciens supports L. mesenteroides through proteolytic activity.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: casein peptides as well as free amino acids restore the growth of L. mesenteroides
    explanation: Shows that peptides and amino acids from proteolysis enable L. mesenteroides growth.
- name: L. mesenteroides Lactate Provisioning to L. kefiranofaciens
  description: 'Leuconostoc mesenteroides produces lactate as a major fermentation by-product, which boosts
    the growth of L. kefiranofaciens approximately three-fold. Lactate supplementation considerably enhances
    L. kefiranofaciens growth in milk, demonstrating cross-feeding that completes the mutualistic loop.
    This metabolic cooperation between the two species involves bidirectional exchange: amino acids/peptides
    from L. kefiranofaciens to L. mesenteroides, and lactate from L. mesenteroides to L. kefiranofaciens.'
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Leuconostoc mesenteroides
    term:
      id: NCBITaxon:1245
      label: Leuconostoc mesenteroides
  target_taxon:
    preferred_term: Lactobacillus kefiranofaciens
    term:
      id: NCBITaxon:267818
      label: Lactobacillus kefiranofaciens
  metabolites:
  - preferred_term: L-lactate
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    concentration: Major fermentation by-product, 7-12 mg/ml optimal
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lactate considerably boosted (circa three-fold) the growth of L. kefiranofaciens
    explanation: Quantifies the growth enhancement of L. kefiranofaciens by lactate from L. mesenteroides.
  - reference: PMID:33398099
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: early members open the niche for the followers by making available metabolites
      such as amino acids and lactate
    explanation: Abstract confirms cross-feeding of amino acids and lactate among kefir
      members; the specific kefiranofaciens/mesenteroides direction is detailed in the
      full text but only generically supported by the abstract.
- name: Acetobacter Lactate Cross-Feeding
  description: Acetobacter fabarum exhibits strong dependency on lactate produced by lactate-generating
    bacteria (L. mesenteroides, L. lactis). The majority of mutualistic interactions involving A. fabarum
    (8 total) are with lactate-producing partners. Acetobacter growth is promoted by lactate concentrations
    between 7-12 mg/ml, explaining its late onset during fermentation (Stage VI) when lactate accumulates.
    This cross-feeding enables A. fabarum to thrive despite poor growth in plain milk whey.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Acetobacter fabarum
    term:
      id: NCBITaxon:483199
      label: Acetobacter fabarum
  metabolites:
  - preferred_term: L-lactate
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    concentration: Consumed at 7-12 mg/ml for optimal growth
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The majority of the mutualistic interactions, 8 in total, involved A. fabarum and a lactate-producing
      partner, supporting its dependency on lactate and late onset during fermentation.
    explanation: Demonstrates A. fabarum's strong dependency on lactate cross-feeding from other community
      members.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Acetobacter sp. benefited from lactate most between 7 and 12 mg/ml
    explanation: Quantifies the optimal lactate concentration for Acetobacter growth.
- name: Kazachstania Lactate-Promoted Growth
  description: Kazachstania exigua, a kefir yeast, is promoted by lactate at lower concentrations than
    Acetobacter. The time-window of K. exigua growth aligns with the beneficial range of lactate concentration
    during fermentation. This cross-feeding on lactate produced by bacterial community members enables
    the yeast to thrive in the kefir ecosystem despite limited ability to utilize milk whey alone.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Kazachstania exigua
    term:
      id: NCBITaxon:34358
      label: Maudiozyma exigua
  metabolites:
  - preferred_term: L-lactate
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    concentration: Promotes growth at lower concentrations than Acetobacter
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Kazachstania exigua (and Saccharomyces unisporus) were also promoted by lactate but at lower
      concentrations
    explanation: Demonstrates that K. exigua benefits from lactate cross-feeding at lower concentrations.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the time-windows of yeast and Acetobacter growth align well with the beneficial or inhibitory
      range of lactate and acetate concentration
    explanation: Shows temporal alignment of K. exigua growth with beneficial lactate concentrations.
related_ingredients:
- preferred_term: lactose
  chebi_term:
    id: CHEBI:17716
    label: lactose
  relevance: >
    Lactose is the primary milk sugar fermented by the kefir community; about half of the
    initial lactose remains unused, with metabolism shifting from homofermentative to
    heterofermentative during early fermentation.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lactose metabolism shifted from homofermentative to heterofermentative
    explanation: Identifies lactose as the fermented milk substrate of the kefir community.
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: about half of the initial lactose was left unused
    explanation: Confirms lactose as the bulk fermentation substrate, only partially consumed.
- preferred_term: glucose
  chebi_term:
    id: CHEBI:17234
    label: glucose
  relevance: >
    Glucose is one of the sugars supplied in isolation media (M17) used to recover kefir
    bacterial isolates from the community.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: M17 supplemented with lactose and glucose
    explanation: Names glucose as a carbohydrate substrate used for kefir isolate cultivation.
- preferred_term: lactate
  chebi_term:
    id: CHEBI:24996
    label: lactate
  relevance: >
    Lactate is a major fermentation product that mediates cross-feeding in the kefir community,
    boosting growth of L. kefiranofaciens roughly three-fold and supporting Acetobacter and yeast.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lactate considerably boosted (circa three-fold) the growth of L. kefiranofaciens
    explanation: Demonstrates lactate as a key cross-fed fermentation product.
- preferred_term: acetate
  chebi_term:
    id: CHEBI:30089
    label: acetate
  relevance: >
    Acetate is one of the major fermentation products tested for its impact on kefir community
    member growth alongside lactate and ethanol.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lactate, acetate, and ethanol (EtOH)
    explanation: Lists acetate as a major fermentation product affecting community growth.
- preferred_term: ethanol
  chebi_term:
    id: CHEBI:16236
    label: ethanol
  relevance: >
    Ethanol is one of the main fermentation products evaluated for its effect on the growth of
    kefir community members.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: supplemented with lactate, acetate, or ethanol
    explanation: Names ethanol as a main fermentation product tested in kefir whey supplementation.
- preferred_term: citrate
  chebi_term:
    id: CHEBI:30769
    label: citric acid
  relevance: >
    Citrate depletion in early fermentation, driven by citrate-utilizing L. lactis and
    L. mesenteroides, is linked to the onset of proteolysis and amino acid accumulation.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: depletion of citrate
    explanation: Identifies citrate consumption as an early metabolic function in kefir fermentation.
- preferred_term: aspartate
  chebi_term:
    id: CHEBI:22660
    label: aspartic acid
  relevance: >
    Aspartate is limiting during kefir fermentation, rapidly consumed early on, and boosts
    Acetobacter growth in milk whey; it is also cross-fed between L. lactis and A. fabarum.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aspartate, on the other hand, is limiting during kefir fermentation and indeed boosts the growth of Acetobacter
    explanation: Establishes aspartate as a limiting, growth-promoting metabolite for Acetobacter.
- preferred_term: glutamate
  chebi_term:
    id: CHEBI:18237
    label: glutamic acid
  relevance: >
    Glutamate concentrations remain at initial levels during fermentation, and it serves as the
    precursor from which L. lactis produces GABA.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: recently reported to be produced by L. lactis from glutamate
    explanation: Names glutamate as the metabolic precursor for GABA production by L. lactis.
- preferred_term: proline
  chebi_term:
    id: CHEBI:26271
    label: proline
  relevance: >
    Proline accumulates in large quantities during kefir fermentation and is among the amino
    acids cross-fed between L. lactis and A. fabarum.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aspartate, proline, glycine, and GABA are cross-fed between L. lactis and A. fabarum
    explanation: Identifies proline as a cross-fed amino acid between L. lactis and A. fabarum.
- preferred_term: glycine
  chebi_term:
    id: CHEBI:15428
    label: glycine
  relevance: >
    Glycine is cross-fed between L. lactis and A. fabarum, being consumed in conditioned media
    while also exerting an inhibitory effect.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aspartate, proline, glycine, and GABA are cross-fed between L. lactis and A. fabarum
    explanation: Identifies glycine as a cross-fed amino acid in the kefir community.
- preferred_term: GABA
  chebi_term:
    id: CHEBI:16865
    label: gamma-aminobutyric acid
  relevance: >
    GABA (4-aminobutyric acid) is produced by L. lactis from glutamate and cross-fed between
    L. lactis and A. fabarum during kefir fermentation.
  evidence:
  - reference: PMID:33398099
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aspartate, proline, glycine, and GABA are cross-fed between L. lactis and A. fabarum
    explanation: Identifies GABA as a cross-fed metabolite between L. lactis and A. fabarum.
