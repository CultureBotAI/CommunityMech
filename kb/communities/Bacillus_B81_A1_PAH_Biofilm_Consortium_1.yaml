ecological_interactions:
- name: Consortium 1 Planktonic and Biofilm Naphthalene Biodegradation
  description: The B8-1/A1 Consortium 1 degraded 75.54% of naphthalene in planktonic culture and 77.45% as a glass-attached
    biofilm in the 7-day HPLC assay (200 mg/L initial concentration), exceeding the planktonic monoculture naphthalene degradation
    of isolate A1 (41.01%).
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paramycoides B8-1
    term:
      id: NCBITaxon:2026194
      label: Bacillus paramycoides
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  metabolites:
  - preferred_term: naphthalene
    term:
      id: CHEBI:16482
      label: naphthalene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The result demonstrated that the naphthalene biodegradation rates of 41.01, 38.92, 75.54, 44.71, 92.43, and 64.47%
      for the planktonic cultures, whereas were 87.72, 64.57, 77.45, 86.88, 94.69, and 79.74% for the biofilm cultures of
      isolates A1, A3, consortium 1, consortium 2, consortium 3, and consortium 4, respectively.
    explanation: Supports the 75.54% planktonic and 77.45% biofilm naphthalene degradation rates reported for Consortium 1.
  - reference: PMID:42587276
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Moreover, the planktonic cultures of all consortia have more naphthalene biodegradation ability than the planktonic
      cultures of A1 and A3 individual isolates. This finding demonstrated the synergistic interaction between the consortia`s
      members
    explanation: Records the authors' synergy interpretation from planktonic consortium naphthalene removal relative to A1
      and A3.
- name: Consortium 1 Biofilm-Mitigated Phenanthrene Antagonism
  description: 'In 7-day phenanthrene degradation assays (200 mg/L), Consortium 1 degraded 4.26% of phenanthrene in planktonic
    culture and 53.51% in glass-attached biofilm culture—making Consortium 1 biofilm the only consortium biofilm exceeding
    50% phenanthrene degradation, although still lower than the individual isolates (B8-1: 77.94% planktonic / 60.72% biofilm;
    A1: 31.82% planktonic / 70.22% biofilm), which the authors attribute to inter-isolate competition and antagonism on phenanthrene.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paramycoides B8-1
    term:
      id: NCBITaxon:2026194
      label: Bacillus paramycoides
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  metabolites:
  - preferred_term: phenanthrene
    term:
      id: CHEBI:28851
      label: phenanthrene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Figure 8 a showed that the biofilm growth mode displayed about > 50% biodegradation rate by the isolates A1,
      A3, and B8-1. and consortium 1 biofilm. In addition, planktonic cultures of A1, A3, consortium 1, consortium 2, consortium
      3, and consortium 4 displayed degradation rates of 31.82, 28.40, 4.26, 21.25, 15.05, and 16.47%, respectively. Whereas
      in the biofilm mode, the biodegradation rates were 70.22, 63.29, 53.51, 48.66, 47.77, and 20.79%, respectively.
    explanation: Supports the 4.26% planktonic and 53.51% (>50%) biofilm phenanthrene biodegradation rates for Consortium
      1.
  - reference: PMID:42587276
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Surprisingly, the biodegradation rates by the individual isolates were higher than those of the consortium. This
      observation may relate to an antagonistic effect of the consortium isolates
    explanation: Supports lower consortium phenanthrene removal relative to single isolates and records the authors' antagonism
      interpretation.
