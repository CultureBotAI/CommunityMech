id: CommunityMech:000502
name: Bacillus B8-1 and A1 PAH Biofilm Consortium 1
description: A defined two-isolate Bacillus consortium, Consortium 1, assembled from Bacillus paramycoides isolate B8-1 (1560
  uL) and Bacillus paranthracis isolate A1 (3458 uL) after enrichment of petroleum-contaminated subsurface soil from Ras Gharib,
  Egypt on polycyclic aromatic hydrocarbons. Consortium 1 was induced to grow as a glass-attached biofilm and evaluated in
  7-day HPLC assays at 200 mg/L PAH, achieving 75.54% planktonic and 77.45% biofilm naphthalene biodegradation (exceeding
  the A1 planktonic monoculture rate of 41.01%) and 4.26% planktonic and 53.51% biofilm phenanthrene biodegradation (the only
  tested consortium biofilm exceeding 50% phenanthrene biodegradation, though still below the single-isolate phenanthrene
  degradation rates due to substrate-dependent antagonism).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine high-performing indigenous PAH-degrading Bacillus isolates B8-1 and A1 from petroleum-contaminated soil
    to test whether planktonic and biofilm co-cultures improve phenanthrene or naphthalene degradation.
  assembly_strategy: Select isolates A1, A3, and B8-1 after enrichment on phenanthrene or naphthalene as sole carbon sources,
    standardize each isolate by OD600, and construct Consortium 1 from B8-1 plus A1.
  inoculation_strategy: Consortium 1 was assembled from Bacillus paramycoides B8-1 and Bacillus paranthracis A1; Table 1 reports
    1560 uL of B8-1 plus 3458 uL of A1 after OD600 standardization to a 5 mL final volume.
  perturbation_design: Compare the three selected isolates and four derived consortia in planktonic and glass-attached biofilm
    forms for 7-day phenanthrene and naphthalene degradation at 200 mg/L, 37 °C, and pH 7.0.
  measurement_endpoints:
  - biofilm formation by crystal violet OD595 assay
  - HPLC quantification of phenanthrene and naphthalene degradation
  - 16S rRNA identification of the selected isolates
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Three isolates (A1, A3, and B8-1) were selected as the most potent phenanthrene and naphthalene degraders.
    explanation: Supports the screen that selected the source isolate set used to construct the consortia.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The consortia were composed as follows: Consortium 1 (B8-1 and A1), Consortium 2 (B8-1 and A3), Consortium 3
      (A1 and A3), and Consortium 4 (B8-1, A1, and A3).'
    explanation: Identifies Consortium 1 as the two-member B8-1/A1 consortium.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consortium 1 1560 µl 3458 µl --
    explanation: Table 1 specifies 1560 uL of B8-1 and 3458 uL of A1 to assemble Consortium 1.
