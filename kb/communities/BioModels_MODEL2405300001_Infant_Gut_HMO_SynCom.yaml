growth_media:
- name: anoxic minimal medium with human milk oligosaccharides as sole carbon source
  temperature: '37'
  temperature_unit: °C
  ph: '6'
  atmosphere: ANAEROBIC
  headspace_gas: '80% N2 : 20% CO2'
  redox_potential: '-300'
  redox_potential_unit: mV
  inoculum_size: '1'
  inoculum_unit: '% v/v'
  vessel_type: continuous bioreactor (DASGIP Parallel Bioreactor System, 300 mL working volume)
  preparation_notes: Minimal/basal medium (1 g/L yeast extract, Na2S excluded) with 0.4% w/v four-
    or five-HMO mix as sole carbon source; anoxic (redox constantly below -300 mV); 80% N2:20%
    CO2 sparged at 6 sl/h; each strain inoculated at 1% v/v of an OD:1-normalized culture; batch
    start then switched to continuous feed at 12.5 mL/h.
  evidence:
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The working volume was 300 ml and the temperature was set to 37°C. The pH was monitored
      and maintained at 6"
    explanation: States the 300 mL working volume, 37°C temperature, and pH 6 of the BIG-Syc fermentation.
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A mixed gas of 80% N2 : 20% CO2 was introduced at a 6 sl/h rate."
    explanation: 'States the anaerobic headspace gas mixture (80% N2 : 20% CO2).'
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Anoxic conditions were monitored based on the redox potential that was constantly below −300 mV."
    explanation: Establishes anaerobic (anoxic) cultivation with redox potential below -300 mV.
cultivation_setup:
- cultivation_mode: CONTINUOUS
  system_type: BIOREACTOR_UNSPECIFIED
  working_volume: 300.0
  working_volume_unit: mL
  operating_temperature: 37.0
  operating_temperature_unit: °C
  notes: DASGIP Parallel Bioreactor System run in triplicate; batch start then switched to continuous
    feed at 12.5 mL/h at transition to stationary phase; pH maintained at 6; 80% N2:20% CO2 sparged
    at 6 sl/h.
  evidence:
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Continuous bioreactors of the DASGIP Parallel Bioreactor Systems (Eppendorf SE, Hamburg,
      Germany) were set in triplicate."
    explanation: Defines the continuous bioreactor cultivation system used for BIG-Syc.
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the fermentations were switched to continuous by introducing fresh medium and removing
      liquid culture. A flow rate of 12.5 ml/h"
    explanation: Establishes continuous-mode operation with a 12.5 mL/h feed rate.
