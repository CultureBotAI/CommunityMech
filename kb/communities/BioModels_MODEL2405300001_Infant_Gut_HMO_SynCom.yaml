ecological_interactions:
- name: Bifidobacterium HMO Degradation and Cross-Feeding
  description: Bifidobacterium species (B. infantis, B. bifidum, B. breve) serve as primary human milk
    oligosaccharide degraders in BIG-Syc. These HMO degraders break down complex oligosaccharides and
    release simpler carbohydrates, organic acids, and gases that are utilized by cross-feeding community
    members. B. infantis and B. bifidum can suppress one another depending on HMO composition, with four-HMO
    mixes favoring B. infantis dominance and five-HMO mixes supporting B. bifidum dominance. This resource-sharing
    mechanism enables complete HMO degradation through teamwork.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Bifidobacterium longum subsp. infantis
    term:
      id: NCBITaxon:1682
      label: Bifidobacterium longum subsp. infantis
  metabolites:
  - preferred_term: oligosaccharide
    term:
      id: CHEBI:50699
      label: oligosaccharide
    concentration: Human milk oligosaccharides degraded by Bifidobacterium
  - preferred_term: organic acid
    term:
      id: CHEBI:64709
      label: organic acid
    concentration: Released by HMO degraders for cross-feeders
  evidence:
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: BIG-Syc demonstrated teamwork as cross-feeders utilized simpler carbohydrates, organic acids,
      and gases released from human milk oligosaccharide degraders.
    explanation: Demonstrates the cross-feeding mechanism where HMO degraders provide metabolites to other
      community members.
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bifidobacterium infantis and Bifidobacterium bifidum suppressing one another
    explanation: Shows competitive dynamics between the two main Bifidobacterium HMO degraders.
- name: Cross-Feeder Utilization of HMO Degradation Products
  description: Cross-feeding community members (Veillonella, Ruminococcus, E. coli, Lactobacillus, Enterococcus,
    Streptococcus) utilize simpler carbohydrates, organic acids, and gases released from HMO degradation
    by Bifidobacterium and Bacteroides species. This resource-sharing enables complete degradation of
    human milk oligosaccharides through metabolic cooperation. The cross-feeders depend on primary degraders
    to break down complex HMOs into accessible metabolites, demonstrating syntrophic teamwork in the infant
    gut ecosystem.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Veillonella parvula
    term:
      id: NCBITaxon:29466
      label: Veillonella parvula
  metabolites:
  - preferred_term: monosaccharide
    term:
      id: CHEBI:35381
      label: monosaccharide
    concentration: Simple carbohydrates from HMO degradation
  - preferred_term: organic acid
    term:
      id: CHEBI:64709
      label: organic acid
    concentration: Metabolites from HMO degraders
  evidence:
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: BIG-Syc demonstrated teamwork as cross-feeders utilized simpler carbohydrates, organic acids,
      and gases released from human milk oligosaccharide degraders.
    explanation: Demonstrates cross-feeder reliance on metabolites from primary HMO degraders.
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: human milk oligosaccharides prompt resource-sharing for their complete degradation while
      leading to a different compositional and functional profile in the community
    explanation: Shows that HMOs drive resource-sharing dynamics in the community.
- name: Bacteroides HMO Degradation
  description: Bacteroides species (B. fragilis, B. vulgatus, B. ovatus) complement Bifidobacterium as
    primary HMO degraders in BIG-Syc. These species contribute to the degradation of human milk oligosaccharides
    and release metabolites that support cross-feeding community members. Their combined activity with
    Bifidobacterium species enables comprehensive HMO utilization and shapes the compositional and functional
    profile of the infant gut community.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Bacteroides fragilis
    term:
      id: NCBITaxon:817
      label: Bacteroides fragilis
  metabolites:
  - preferred_term: oligosaccharide
    term:
      id: CHEBI:50699
      label: oligosaccharide
    concentration: Human milk oligosaccharides degraded
  evidence:
  - reference: doi:10.1093/ismejo/wrae209
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: BIG-Syc replicated key compositional, metabolic, and proteomic characteristics of the gut
      microbiota of infants.
    explanation: Supports that Bacteroides species contribute to authentic infant gut microbiota characteristics
      including HMO degradation.
