discussions:
- discussion_id: formaldehyde_and_conditional_exchange_boundaries
  prompt: Which selective mechanisms explain the measured community responses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-07'
  rationale: Preserve direct formaldehyde lowering, C.fimi-supported methylotroph growth and selected-overproducer
    methionine rescue. The PCA control retains inhibition without formaldehyde; supplementation and spent medium
    do not uniquely isolate resource depletion. CM4744 rescue requires additional producer substrate, while true
    codependence is proposed for future evolution. Remove the competition-to-engineered-exchange arrow because it
    encodes investigator intervention, not spontaneous biological induction.
  attaches_to:
  - ecological_interactions#Formaldehyde Toxicity from Aromatic Breakdown
  - ecological_interactions#Methylotrophic Formaldehyde Mitigation
  - ecological_interactions#Conditional Methionine Rescue and C. fimi Cross-Feeding
  - ecological_interactions#Resource Competition in Model Lignocellulose Medium
