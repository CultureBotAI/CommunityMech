  downstream:
  - target: Methylotrophic Formaldehyde Mitigation
    description: P. putida vanillic-acid metabolism supplies formaldehyde that M. extorquens can consume, reducing
      the magnitude and duration of its accumulation. The biochemical production-to-removal link is supported; relief
      of C. fimi growth inhibition is PARTIAL, because inhibition persists in the formaldehyde-free PCA control
      and is not fully ameliorated by M. extorquens.
  evidence:
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: formaldehyde produced by P. putida growing on vanillic acid
    explanation: Supports P. putida as the formaldehyde-generating member.
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: exceed the minimum inhibitory concentration for C. fimi
    explanation: Supports formaldehyde toxicity toward C. fimi.
- name: Methylotrophic Formaldehyde Mitigation
  description: M. extorquens addition lowers measurable formaldehyde produced by P. putida. PARTIAL - C. fimi is
    a potential beneficiary of reduced toxin exposure, but detoxification does not completely ameliorate its growth
    inhibition; other interactions dominate the tested batch conditions. Neither neutral fitness of the methylotroph
    nor full recipient rescue is established by the concentration change.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylorubrum extorquens
    term:
      id: NCBITaxon:408
      label: Methylorubrum extorquens
  target_taxon:
    preferred_term: Cellulomonas fimi
    term:
      id: NCBITaxon:1708
      label: Cellulomonas fimi
  metabolites:
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  evidence:
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: presence of M. extorquens lowers those concentrations
    explanation: Supports methylotrophic lowering of formaldehyde concentrations.
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: M. extorquens was not able to completely ameliorate either the formaldehyde production or the growth
      inhibition.
    explanation: Bounds detoxification without erasing the observed reduction.
- name: Conditional Methionine Rescue and C. fimi Cross-Feeding
  description: Selected methionine-overproducing M. extorquens CM4744 supports C. fimi without supplied methionine,
    but only when methanol or succinate supports the producer; wild-type M. extorquens does not provide this rescue.
    The listed source-to-target direction denotes this methionine supply. Separately, C. fimi supports M. extorquens
    growth without an added methylotroph carbon substrate, consistent with reverse-direction carbon cross-feeding
    whose carrier was not resolved here. PARTIAL - These positive assays do not demonstrate autonomous reciprocal
    methionine-for-carbon codependence in one unsupplemented condition.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylorubrum extorquens
    term:
      id: NCBITaxon:408
      label: Methylorubrum extorquens
  target_taxon:
    preferred_term: Cellulomonas fimi
    term:
      id: NCBITaxon:1708
      label: Cellulomonas fimi
  metabolites:
  - preferred_term: methionine
    term:
      id: CHEBI:16811
      label: methionine
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.3390/microorganisms9020321
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: mutualistic interaction between C. fimi and M. extorquens through metabolite exchange
    explanation: The abstract explicitly proposes a possibility, not established autonomous mutualism.
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: M. extorquens to support C. fimi through the production of methionine
    explanation: Supports the selected methionine-overproducer-to-C.fimi direction, conditional on producer growth
      substrate.
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: wild-type M. extorquens did not promote C. fimi growth.
    explanation: Distinguishes the selected overproducer from the wild-type assay.
- name: Resource Competition in Model Lignocellulose Medium
  description: PARTIAL - P. putida suppresses C. fimi growth and cellobiose consumption even on formaldehyde-free
    protocatechuic acid. Iron and vitamin/amino-acid supplementation improves coculture growth, consistent with
    competition for iron or methionine and other supplements. Spent medium lowers yield, but depletion and a secreted
    inhibitor remain alternatives; high iron itself inhibits C. fimi. These experiments do not establish a single
    exclusive inhibitory resource or competition causing methionine overproduction.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.3390/microorganisms9020321
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: resource competition
    explanation: Supports resource competition as an ecological dynamic in the community.
  - reference: doi:10.3390/microorganisms9020321
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: This could indicate either the effect of a soluble compound produced by P. putida, or the depletion
      by P. putida of important medium components, or both.
    explanation: Retains alternative inhibition mechanisms rather than certifying a single depleted resource.
