id: CommunityMech:000178
name: Model Lignocellulose Formaldehyde Cross-Feeding Community
description: >
  A synthetic model lignocellulose-degrading community developed to study plant-biomass
  transformation and mitigation of toxic formaldehyde produced during breakdown of methoxylated
  aromatic compounds. The system includes Pseudomonas putida as a lignin degrader, Cellulomonas
  fimi as a cellulose degrader, Methylorubrum extorquens as a methylotrophic formaldehyde
  consumer, and Yarrowia lipolytica as an oleaginous yeast included in some consortium variants.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Build a reproducible model consortium for lignocellulose degradation while reducing
    formaldehyde toxicity generated during methoxylated aromatic-compound breakdown.
  assembly_strategy: Combine lignin-, cellulose-, methylotrophic-, and oleaginous community members
    in a defined Model Lignocellulose medium for controlled coculture experiments.
  perturbation_design: Compare member combinations and substrate contexts to resolve formaldehyde
    accumulation, resource competition, and metabolite-exchange interactions.
  measurement_endpoints:
  - Formaldehyde accumulation
  - Growth inhibition by toxic intermediates
  - Formaldehyde mitigation by methylotrophy
  - Resource competition
  - Metabolite exchange
  evidence:
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: model microbial consortium for studying lignocellulose degradation
    explanation: Supports the model-community objective.
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mitigating the production of the toxin formaldehyde
    explanation: Supports the formaldehyde-toxicity mitigation design.
  - reference: doi:10.3390/microorganisms9020321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: defined minimal “Model Lignocellulose” growth medium
    explanation: Supports the controlled growth-medium design.
