ecological_interactions:
- name: Formaldehyde Toxicity from Aromatic Breakdown
  description: 'P. putida growing on vanillic acid accumulates approximately 0.6-0.8 mM formaldehyde, above the
    0.5 mM concentration that prevents C. fimi growth in separate tolerance assays. This demonstrates toxic potential,
    not that the transient formaldehyde pulse is the dominant cause of coculture inhibition: P. putida also inhibits
    C. fimi on protocatechuic acid without formaldehyde generation.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas putida
    term:
      id: NCBITaxon:303
      label: Pseudomonas putida
  target_taxon:
    preferred_term: Cellulomonas fimi
    term:
      id: NCBITaxon:1708
      label: Cellulomonas fimi
  metabolites:
