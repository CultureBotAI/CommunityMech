    snippet: P. eryngii became dominant during the middle and late stages through the upregulation of AA1 family laccase genes and aromatic catabolic pathways
    explanation: Supports the middle- and late-stage lignin-derived aromatic conversion role assigned to P. eryngii.
ecological_interactions:
- name: Temporal Dual-Fungal Lignin Conversion
  description: P. chrysosporium dominated the early phase by expressing AA2 family peroxidase genes involved in oxidative
    lignin cleavage, while P. eryngii dominated the middle and late phases by upregulating AA1 family laccase genes and
    aromatic-catabolic pathways that further converted lignin-derived compounds.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  biological_processes:
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  evidence:
  - *temporal_division
  - reference: PMID:42660361
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: During the early stage, P. chrysosporium predominantly expressed AA2 family peroxidase genes, promoting oxidative cleavage of lignin β-O-4 linkages
    explanation: Supports the P. chrysosporium early-stage oxidative lignin-cleavage arm of the division of labor.
  - reference: PMID:42660361
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. eryngii became dominant during the middle and late stages through the upregulation of AA1 family laccase genes and aromatic catabolic pathways
    explanation: Supports the P. eryngii middle- and late-stage aromatic-catabolism arm of the division of labor.
environmental_factors:
- name: Chinese Distillers' grains solid substrate
