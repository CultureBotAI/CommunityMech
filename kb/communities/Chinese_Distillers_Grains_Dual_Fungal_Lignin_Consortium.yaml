    snippet: The lignin degradation ratio reached 58.66%, indicating that the system can effectively convert lignin.
    explanation: Quantifies the lignin degradation outcome for the two-fungus consortium.
- name: Ligninolytic enzyme activity timing
  value: Lac and MnP peaked at 10 d; LiP peaked at 15 d
  description: Laccase and manganese peroxidase reached peak activity at day 10, while lignin peroxidase reached peak activity
    at day 15.
  evidence:
  - reference: PMID:42660361
    supports: SUPPORT
