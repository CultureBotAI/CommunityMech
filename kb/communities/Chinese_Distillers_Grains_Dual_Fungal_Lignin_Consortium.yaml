id: CommunityMech:000421
name: Chinese Distillers Grains Dual Fungal Lignin Consortium
description: A two-member fungal solid-state fermentation system consisting of Phanerochaete chrysosporium and Pleurotus
  eryngii that was constructed to convert the recalcitrant lignin fraction of Chinese Distillers' grains. Chen et al. 2026
  measured 58.66% lignin degradation in Chinese Distillers' grains, day-10 peaks in laccase and manganese peroxidase
  activity, a day-15 peak in lignin peroxidase activity, and transcriptomic/metabolomic evidence that P. chrysosporium was
  most active in early oxidative lignin cleavage while P. eryngii became dominant during later aromatic catabolism.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Construct a dual-fungal solid-state fermentation system that improves conversion of recalcitrant lignin in
    Chinese Distillers' grains.
  assembly_strategy: Combine the ligninolytic fungi Phanerochaete chrysosporium and Pleurotus eryngii to create a temporal
    division of labor across early oxidative lignin cleavage and later aromatic-catabolite conversion.
  measurement_endpoints:
  - lignin degradation ratio in Chinese Distillers' grains
  - laccase activity
  - manganese peroxidase activity
  - lignin peroxidase activity
  - transcriptomic and metabolomic stage dominance
  evidence:
  - &primary_system
    reference: PMID:42660361
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a dual-fungal solid-state fermentation system consisting of Phanerochaete chrysosporium and Pleurotus eryngii was constructed for lignin conversion in CDGs.
    explanation: Identifies the two fungi and the CDG solid-state fermentation design.
  - &temporal_division
    reference: PMID:42660361
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Integrated transcriptomic and metabolomic analyses revealed a clear temporal division of labor between the dual-fungal.
    explanation: Supports the multi-omics evidence for a temporal division of labor in the two-fungus system.
environment_term:
  preferred_term: Chinese Distillers' grains solid-state fungal fermentation
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The two-fungus consortium was constructed and assayed under solid-state fermentation conditions on Chinese Distillers'
    grains rather than in an open natural environment.
