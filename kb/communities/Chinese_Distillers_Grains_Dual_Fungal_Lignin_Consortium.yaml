  - reference: PMID:42660361
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lignin peroxidase (LiP) reached its maximum activity (51.67 U/g) at 15 d.
    explanation: Supports the day-15 lignin peroxidase peak.
