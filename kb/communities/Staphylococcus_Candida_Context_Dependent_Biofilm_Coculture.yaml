ecological_interactions:
- name: Antagonistic Dual-Species Biofilm Suppression
  description: The PMID:42629020 coculture had reduced aggregate biofilm biomass, cell counts, metabolic activity
    and extracellular matrix relative to single-species biofilms. Preserve this reported suppressive phenotype without
    treating aggregate endpoints as demonstrated reciprocal negative fitness effects. This observation does not
    establish the mechanism of a different strain/condition study.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:42629020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: there is an antagonistic effect between C. albicans and S. aureus
    explanation: Supports the source authors antagonism interpretation, not demonstrated reciprocal competition
      from aggregate endpoints alone.
  - reference: PMID:42629020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly reduced biomass, cell counts, metabolic activity, and EPS content
    explanation: Supports the measured suppressive biofilm phenotype.
- name: Contact-Dependent Strain-Specific Fungal Suppression
  description: PMID:42413741 reports strain-dependent, contact-associated fungal suppression and variation among
    dual-species biofilm compositions. This is a reported one-way inhibitory effect, not evidence that both partners
    suffer reciprocal negative fitness effects or that the mechanism explains PMID:42629020.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  target_taxon:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:42413741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The majority of the 60 S. aureus strains tested suppressed fungal growth in a contact-dependent manner
    explanation: Supports strain-dependent, contact-mediated inhibition of C. albicans.
  - reference: PMID:42413741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: dual-species biofilms varied significantly in their bacterial-to-fungal cell ratios and in the composition
      of the biofilm-associated extracellular matrix
    explanation: Supports variation in community composition and matrix across strain combinations.
- name: Copper-Mediated Nutritional Mutualism
  description: 'HYPOTHESIZED/PARTIAL: PMID:42359480 interprets its larger dual-species biofilms and proteomic copper-handling
    observations as nutritional mutualism. Preserve this study-specific interpretation, distinguishing inferred
    copper handling and aggregate biomass from quantified reciprocal partner benefit or a universal relationship
    across the six studies.'
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: copper(2+)
    term:
      id: CHEBI:29036
      label: copper(2+)
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:42359480
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Dual-species proteomic analysis revealed non-reciprocal copper handling
    explanation: Supports the reported proteomic interpretation; PARTIAL for nutritional mutualism and not a direct
      measurement of transferred copper or reciprocal fitness.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      parameters: Abstract-reported comparison of dual-species proteomic profiles. Software, statistical model and
        versions were not verified; this evidence concerns inferred copper handling, not directly traced transfer.
  - reference: PMID:42359480
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: dual-species biofilms are consistently larger than single-species counterparts
    explanation: Supports the reported aggregate biomass difference within this study, not quantified benefit to
      each partner.
- name: Candida Biofilm Scaffold Supports Staphylococcus Colonization
  description: PMID:33831044 reports a contact-dependent scaffold association and increased bacterial cell numbers
    within its tested Candida-Staphylococcus system. Retain this source-supported colonization-facilitation observation
    without importing a hyphal requirement or other conditions from a separate study.
  interaction_type: COLONIZATION_FACILITATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  target_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:33831044
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: early C. albicans biofilms enhanced the numbers of E. coli and S. aureus
    explanation: Supports increased S. aureus abundance in the presence of early Candida biofilms.
  - reference: PMID:33831044
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: contact with C. albicans was required for the increased bacterial cell numbers observed
    explanation: Supports contact dependence of the facilitation.
  - reference: PMID:33831044
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. albicans provided a scaffold for initial bacterial adhesion
    explanation: Supports the physical-scaffold mechanism.
- name: Growth-State and Hyphal Context Dependence
  description: PMID:41324029 reports differing outcomes between planktonic and biofilm contexts. Preserve the study-specific
    suppression and aggregate biofilm observations without classifying every condition as mutualism or turning its
    morphological comparison into a requirement for the separate PMID:33831044 scaffold study.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. albicans dominated in planktonic co-culture, suppressing S. aureus growth, whereas biofilm conditions
      favored mutual adaptation
    explanation: Supports interaction reversal between planktonic and biofilm states.
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: hyphae-competent C. albicans forming dual-species biofilms with S. aureus that accumulated substantial
      biomass
    explanation: Supports the reported within-study morphological context and aggregate biomass; it does not establish
      a requirement in another study.
- name: Study-Specific Candida Transcript Response
  description: PMID:34888261 reports Candida transcript differences and gene-ontology associations in the studied
    dual-species biofilms. Transcript abundance and functional annotations are not demonstrated changes in genotype,
    infection severity or colonization. No phenotype-enhancing mechanism is inferred from this expression result.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  target_taxon:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
  evidence:
  - reference: PMID:34888261
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Upregulated genes in dual-species biofilms corresponded to multiple gene ontology terms, including
      those attributed to virulence, biofilm formation and protein binding
    explanation: Supports the reported transcript and ontology associations, not demonstrated virulence, genotype
      change or colonization facilitation.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      parameters: Abstract-reported RNA-seq comparison and gene-ontology interpretation. Exact analysis software
        and versions were not verified; this is expression/annotation evidence, not a functional phenotype assay.
