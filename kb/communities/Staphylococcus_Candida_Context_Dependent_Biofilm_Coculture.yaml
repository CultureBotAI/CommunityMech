    snippet: C. albicans dominated in planktonic co-culture, suppressing S. aureus growth, whereas biofilm conditions favored mutual adaptation
    explanation: Supports growth state as a determinant of interaction outcome.
growth_media:
- name: Context-dependent dual-species biofilm media
  preparation_notes: >
    Multiple exact-composition studies used distinct nutrient conditions. One
    study specifically compared yeast growth in YPD with hyphal induction by
    RPMI substrates; complete formulations are not curated from the abstracts.
  evidence:
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared to yeast cells in YPD, hyphal growth induced by RPMI substrates significantly augmented biofilm formation
    explanation: Supports YPD and RPMI as experimentally contrasted growth contexts.
