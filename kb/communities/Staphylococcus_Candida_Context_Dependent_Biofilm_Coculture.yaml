    snippet: Using in vitro biofilms formed on plastic
    explanation: Supports plastic as one tested biofilm surface.
  - reference: PMID:42413741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: across different nutrient conditions and surface types
    explanation: Supports surface and nutrient context as experimental variables.
- name: Copper availability
  value: depletion and supplementation
  description: Both copper depletion and supplementation reduced dual-species biofilm biomass in the copper-economy study.
  evidence:
  - reference: PMID:42359480
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: specific sensitivity to both copper depletion and supplementation, with corresponding reductions in biomass
    explanation: Supports copper availability as a determinant of community biomass.
- name: Growth state
  value: planktonic versus biofilm
  description: Growth state changed the direction and outcome of the interaction.
  evidence:
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. albicans dominated in planktonic co-culture, suppressing S. aureus growth, whereas biofilm conditions favored mutual adaptation
    explanation: Supports growth state as a determinant of interaction outcome.
growth_media:
- name: Context-dependent dual-species biofilm media
  preparation_notes: >
    Multiple exact-composition studies used distinct nutrient conditions. One
    study specifically compared yeast growth in YPD with hyphal induction by
    RPMI substrates; complete formulations are not curated from the abstracts.
  evidence:
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared to yeast cells in YPD, hyphal growth induced by RPMI substrates significantly augmented biofilm formation
    explanation: Supports YPD and RPMI as experimentally contrasted growth contexts.
