discussions:
- discussion_id: staph_candida_study_boundaries
  prompt: Which observations belong to the same tested system, and which claims remain interpretations rather than
    measured partner effects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Antagonistic Dual-Species Biofilm Suppression
  - ecological_interactions#Contact-Dependent Strain-Specific Fungal Suppression
  - ecological_interactions#Copper-Mediated Nutritional Mutualism
  - ecological_interactions#Candida Biofilm Scaffold Supports Staphylococcus Colonization
  - ecological_interactions#Growth-State and Hyphal Context Dependence
  - ecological_interactions#Study-Specific Candida Transcript Response
  rationale: Six primary abstracts were read as separate studies of a species pair, not one resolved strain/condition
    system. Remove cross-study causal joins; distinguish aggregate biomass, one-way inhibition, proteomic interpretation
    and transcript associations. Retain the directly supported scaffold observation and the copper authors mutualism
    interpretation with explicit qualifications. Available full-text leads were not reviewed here. This is evidence/metadata
    correction only, without new enhancement procedures, genetic designs or partner mechanisms.
  evidence:
  - reference: PMID:42629020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly reduced biomass, cell counts, metabolic activity, and EPS content
    explanation: Supports the measured suppressive biofilm phenotype.
  - reference: PMID:42359480
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Dual-species proteomic analysis revealed non-reciprocal copper handling
    explanation: Supports the reported proteomic interpretation; PARTIAL for nutritional mutualism and not a direct
      measurement of transferred copper or reciprocal fitness.
