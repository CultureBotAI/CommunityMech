id: CommunityMech:000326
name: Staphylococcus-Candida Context-Dependent Biofilm Coculture
description: >
  A defined interkingdom biofilm composed of Staphylococcus aureus and Candida
  albicans. Primary studies of this exact species composition report outcomes
  ranging from contact-dependent antagonism to hypha-supported colonization and
  copper-mediated mutualism, demonstrating strong dependence on strains,
  nutrients, surfaces, growth state, and colonization order.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Resolve mechanisms and context dependence in S. aureus-C. albicans dual-species biofilms.
  assembly_strategy: Coculture S. aureus and C. albicans in defined in vitro dual-species biofilm systems.
  perturbation_design: Compare biofilm and planktonic states, nutrient conditions, surface types, strain combinations, colonization order, copper availability, and antifungal treatment.
  measurement_endpoints:
  - biofilm biomass and viable cell counts
  - extracellular matrix and metabolic activity
  - fungal morphology and biofilm architecture
  - transcriptomic and proteomic responses
  - copper uptake and export
  evidence:
  - reference: PMID:42629020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: interaction mechanism of the co-culture of the two species
    explanation: Supports mechanistic analysis of the exact dual-species system.
  - reference: PMID:42413741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: investigated how S. aureus strain heterogeneity influences C. albicans within dual-species biofilms
    explanation: Supports strain identity as an explicit perturbation in this community.
environment_term:
