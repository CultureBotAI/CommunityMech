ecological_interactions:
- name: Antagonistic Dual-Species Biofilm Suppression
  description: >
    In one defined coculture, dual-species biofilms had reduced biomass, cell
    counts, metabolic activity, EPS, and structural density relative to
    single-species biofilms, with metabolic and signaling pathways suppressed in both members.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42629020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: there is an antagonistic effect between C. albicans and S. aureus
    explanation: Supports antagonism in the reported dairy and clinical surface model.
  - reference: PMID:42629020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly reduced biomass, cell counts, metabolic activity, and EPS content
    explanation: Supports the measured suppressive biofilm phenotype.
- name: Contact-Dependent Strain-Specific Fungal Suppression
  description: >
    Across 60 S. aureus strains, most strains suppressed C. albicans growth by
    a contact-dependent mechanism, while matrix composition and antifungal
    response varied among strain combinations.
  interaction_type: COMPETITION
  source_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  target_taxon:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  evidence:
  - reference: PMID:42413741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The majority of the 60 S. aureus strains tested suppressed fungal growth in a contact-dependent manner
    explanation: Supports strain-dependent, contact-mediated inhibition of C. albicans.
  - reference: PMID:42413741
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: dual-species biofilms varied significantly in their bacterial-to-fungal cell ratios and in the composition of the biofilm-associated extracellular matrix
    explanation: Supports variation in community composition and matrix across strain combinations.
- name: Copper-Mediated Nutritional Mutualism
  description: >
    In plastic-grown biofilms, C. albicans increased copper uptake through Ctr1
    while S. aureus increased copper export through CsoR and CopZ; disrupting
    copper availability reduced dual-species biomass.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42359480
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. albicans increased copper uptake via transporter Ctr1, while S. aureus enhanced copper export via regulator CsoR and export chaperone CopZ
    explanation: Supports complementary copper handling by the two members.
  - reference: PMID:42359480
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: dual-species biofilms are consistently larger than single-species counterparts
    explanation: Supports cooperative biofilm growth in the copper-economy study.
- name: Candida Biofilm Scaffold Supports Staphylococcus Colonization
  description: >
    Early C. albicans biofilms provide a contact-dependent physical scaffold
    that increases S. aureus cell numbers during biofilm maturation.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  target_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:33831044
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: early C. albicans biofilms enhanced the numbers of E. coli and S. aureus
    explanation: Supports increased S. aureus abundance in the presence of early Candida biofilms.
  - reference: PMID:33831044
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: contact with C. albicans was required for the increased bacterial cell numbers observed
    explanation: Supports contact dependence of the facilitation.
  - reference: PMID:33831044
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. albicans provided a scaffold for initial bacterial adhesion
    explanation: Supports the physical-scaffold mechanism.
- name: Growth-State and Hyphal Context Dependence
  description: >
    C. albicans suppresses S. aureus in planktonic coculture, whereas
    hyphae-competent biofilms support mutual adaptation, biomass accumulation,
    cohesion, and resistance.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. albicans dominated in planktonic co-culture, suppressing S. aureus growth, whereas biofilm conditions favored mutual adaptation
    explanation: Supports interaction reversal between planktonic and biofilm states.
  - reference: PMID:41324029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: hyphae-competent C. albicans forming dual-species biofilms with S. aureus that accumulated substantial biomass
    explanation: Supports the role of hyphal morphology in cooperative biofilm accumulation.
- name: Staphylococcus-Induced Candida Virulence Response
  description: >
    S. aureus changes the C. albicans transcriptome in dual-species biofilms,
    including expression programs associated with virulence, biofilm formation,
    protein binding, and heat-shock responses.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  target_taxon:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  evidence:
  - reference: PMID:34888261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Upregulated genes in dual-species biofilms corresponded to multiple gene ontology terms, including those attributed to virulence, biofilm formation and protein binding
    explanation: Supports the Candida transcriptional response to S. aureus.
  - reference: PMID:34888261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. aureus pushes C. albicans towards a more virulent genotype
    explanation: Supports the study's interpretation of increased Candida virulence-associated expression.
environmental_factors:
- name: Surface-associated biofilm growth
  value: plastic and other biotic or abiotic surfaces
  description: Interaction outcomes were evaluated in surface-associated in vitro biofilms.
  evidence:
