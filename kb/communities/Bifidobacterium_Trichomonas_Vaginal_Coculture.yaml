discussions:
- discussion_id: trichomonas_contact_lipid_and_adhesin_mediation
  prompt: Which contact, lipid and adhesin mechanisms cause the transient coculture and host responses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Direct Bifidobacterium-Trichomonas Surface Association
  - ecological_interactions#T. vaginalis Growth with B. breve Attrition
  - ecological_interactions#Parasite DNA-Replication and Energy Response
  - ecological_interactions#Parasite Fatty-Acid Pathway Response
  - ecological_interactions#Fatty-Acid Pool Decrease
  - ecological_interactions#Adhesin Transcripts and HeLa Nonprotection
  rationale: The source explicitly lacks direct internalization evidence and proposes future contact-versus-conditioned-medium
    tests. RNA enrichment and lipid pools do not measure donor transfer, oxidation or necessary growth mediation.
    Separate HeLa designs show differing cytokine responses; adhesin necessity is not resolved by co-occurrence.
    Figures, supplementary files and raw ArrayExpress measurements were not inspected.
