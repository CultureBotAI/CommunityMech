      confers no protection.
ecological_interactions:
- name: Direct Bifidobacterium-Trichomonas Surface Association
  description: >
    Confocal imaging after 4 h of anaerobic co-culture placed B. breve cells
    closely around the T. vaginalis surface, establishing the direct
    in-vitro contact from which the parasite growth, transcriptional, and lipid
    responses were measured.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: T. vaginalis Growth with B. breve Attrition
    description: >
      The direct co-culture paired increased parasite viability with declining
      B. breve colony-forming units.
  - target: Parasite DNA-Replication and Energy Response
    description: >
      T. vaginalis RNA-seq after B. breve co-culture resolved transcriptional
      enrichment for DNA replication and ATP synthesis-coupled electron
      transport.
  - target: Parasite Fatty-Acid Pathway Response
    description: >
      The same 4 h exposure produced a parasite fatty-acid transcriptional
      response.
  - target: Adhesin-Linked HeLa Nonprotection
    description: >
      B. breve-treated or co-treated T. vaginalis retained epithelial
      cytopathic effects and adherence while virulence-associated adhesin
      genes increased.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microscopy showed a direct physical association between the two organisms
    explanation: >
      Supports direct physical contact between the B. breve and T. vaginalis
      partners in the short co-culture assay.
- name: T. vaginalis Growth with B. breve Attrition
  description: >
    In 4 h co-culture the protozoan proliferated 1.2-fold more while bacterial
    abundance fell 27%, an asymmetric direct-coculture outcome reported without
    resolving whether B. breve loss came from ingestion, competition, or the
    culture conditions.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  metabolites:
  - preferred_term: long-chain fatty acid
    term:
      id: CHEBI:15904
      label: long-chain fatty acid
    notes: Metabolomics confirmed changes in long-chain fatty acid content in the parasite,
      corroborating the transcriptomic signal for fatty acid metabolism.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Adhesin-Linked HeLa Nonprotection
    description: >
      The B. breve-exposed parasite population was carried forward into host
      epithelial assays that showed no protective B. breve effect.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Co-culture of T. vaginalis with B. breve for 4 h significantly increased protozoan
      proliferation by 1.2-fold, while bacterial abundance was reduced by 27%
    explanation: >
      Supports the measured asymmetric direct-coculture outcome without
      assigning a trophic mechanism to the decrease in B. breve abundance.
- name: Parasite DNA-Replication and Energy Response
  description: >
    T. vaginalis exposed to B. breve showed a distinct transcriptomic response
    in which upregulated genes were enriched for DNA replication, chromatin
    organization, and ATP synthesis-coupled electron transport, matching the
    observed short-term increase in parasite viable counts.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
