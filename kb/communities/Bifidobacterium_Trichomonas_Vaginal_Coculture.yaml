    term:
      id: GO:0006631
      label: fatty acid metabolic process
  downstream:
  - target: T. vaginalis Growth with B. breve Attrition
    description: >
      The fatty-acid decrease was interpreted as a metabolic adaptation that
      could support the energetic and biosynthetic demands of parasite DNA
      replication and proliferation.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      levels of several fatty acids were significantly reduced in the
      B. breve–treated group relative to the control, including 8 UFAs and 7
      SFAs
    explanation: >
      Supports B. breve-linked depletion of saturated and unsaturated
