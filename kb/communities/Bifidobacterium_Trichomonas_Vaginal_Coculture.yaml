id: CommunityMech:000318
name: Bifidobacterium breve-Trichomonas vaginalis Vaginal Co-culture
description: >
  A defined two-member co-culture of the vaginal commensal Bifidobacterium breve with the
  sexually transmitted protozoan parasite Trichomonas vaginalis, assayed against HeLa epithelial
  cells. The result runs counter to the expectation that a beneficial commensal antagonises the
  parasite: over 4 h the protozoan proliferated 1.2-fold more while bacterial abundance fell 27%,
  microscopy showed direct physical association between the two organisms, and transcriptomics of
  T. vaginalis showed upregulation of fatty acid metabolism and DNA replication genes together with
  virulence-associated genes including adhesins, corroborated by metabolomic changes in long-chain
  fatty acids. B. breve conferred no protection on host epithelial cells, and the effects on the
  parasite were transient. The record captures a commensal-parasite association in which the
  commensal is depleted while the parasite is enhanced.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Determine whether the vaginal commensal Bifidobacterium breve, whose abundance falls in
    women infected with Trichomonas vaginalis, antagonises the parasite or protects host epithelium.
  assembly_strategy: Co-culture T. vaginalis with B. breve and monitor both populations
    microscopically; expose HeLa cells to T. vaginalis pretreated with or without B. breve and score
    cytokine responses and cytopathic effects; profile the parasite by transcriptomics and
    metabolomics.
  measurement_endpoints:
  - Protozoan proliferation and bacterial abundance in co-culture
  - Cytopathic effects and IL-6/IL-8 responses in HeLa cells
  - T. vaginalis gene expression and long-chain fatty acid content
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: HeLa cells were exposed to T. vaginalis that had been pretreated with or without B.
      breve
    explanation: States the host-cell arm of the design, which is what allows the protection
      question to be answered separately from the co-culture growth effects.
