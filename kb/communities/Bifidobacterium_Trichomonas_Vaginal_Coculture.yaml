  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
  downstream:
  - target: T. vaginalis Growth with B. breve Attrition
    description: >
      The authors interpreted replication-gene enrichment as consistent with
      the measured increase in T. vaginalis proliferation after B. breve
      exposure.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Upregulated genes were enriched in pathways related to DNA replication
      and chromatin organization
    explanation: >
      Supports activation of DNA-replication-associated transcription in
      B. breve-exposed T. vaginalis.
- name: Parasite Fatty-Acid Pathway Response
  description: >
    B. breve co-culture shifted the T. vaginalis transcriptome toward fatty
    acid biosynthesis, propionate metabolism, and putative fatty-acid metabolic
    pathways, indicating a lipid metabolic program accompanying parasite
    growth.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
