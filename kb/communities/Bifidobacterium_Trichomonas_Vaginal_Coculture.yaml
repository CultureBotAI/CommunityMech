    explanation: Records the host-cell outcome, which is the basis for concluding that the commensal
      confers no protection.
ecological_interactions:
- name: Direct Bifidobacterium-Trichomonas Surface Association
  description: Confocal imaging after 4 hours of anaerobic coculture showed B. breve around the T. vaginalis surface.
    This supports physical association, not bacterial internalization or contact-dependent mediation of the parallel
    growth, transcript, lipid and host-assay responses.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microscopy showed a direct physical association between the two organisms
    explanation: 'Supports direct physical contact between the B. breve and T. vaginalis partners in the short co-culture
      assay.

      '
- name: T. vaginalis Growth with B. breve Attrition
  description: Four-hour coculture increased viable parasite counts by the reported 1.2-fold and reduced bacterial
    CFUs by 27% relative to controls. PREDATION here follows the local paired benefit/harm (+/-) definition; it
    does not establish ingestion. The paper explicitly lacked direct evidence of bacterial internalization, and
    the trophic mechanism remains unresolved.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Co-culture of T. vaginalis with B. breve for 4 h significantly increased protozoan proliferation by
      1.2-fold, while bacterial abundance was reduced by 27%
    explanation: 'Supports the measured asymmetric direct-coculture outcome without assigning a trophic mechanism
      to the decrease in B. breve abundance.

      '
- name: Parasite DNA-Replication and Energy Response
  description: Parasite RNA-seq after B. breve exposure showed enrichment of DNA-replication, chromatin and ATP
    synthesis-coupled electron-transport annotations. These are expression responses accompanying higher viable
    parasite counts, not direct replication-rate, ATP-flux or necessity measurements.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
  downstream:
  - target: T. vaginalis Growth with B. breve Attrition
    description: PARTIAL - the source proposes that the replication-associated program supports parasite proliferation.
      Enrichment and viable counts are consistent with this explanation but do not selectively establish pathway
      mediation of either parasite growth or bacterial CFU loss.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Upregulated genes were enriched in pathways related to DNA replication and chromatin organization

      '
    explanation: 'Supports activation of DNA-replication-associated transcription in B. breve-exposed T. vaginalis.

      '
- name: Parasite Fatty-Acid Pathway Response
  description: GSVA identified fatty-acid-biosynthesis and propionate-metabolism pathway annotations in the parasite
    transcriptional response. This does not demonstrate de-novo fatty-acid synthesis, which the paper notes the
    parasite lacks, or measure SCFA concentrations or metabolic rates.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  biological_processes:
  - preferred_term: fatty acid metabolic process
    term:
      id: GO:0006631
      label: fatty acid metabolic process
  downstream:
  - target: T. vaginalis Growth with B. breve Attrition
    description: PARTIAL - the source proposes that altered fatty-acid handling contributes to the energetic or
      biosynthetic demands of parasite growth. Transcript pathway scores are not a selective metabolic perturbation,
      and the mechanism of bacterial CFU loss remains separate.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'gene set variation analysis (GSVA) showed increased activity in fatty acid biosynthesis and propionate
      metabolism pathways

      '
    explanation: Supports expression-based pathway scoring, not measured synthesis or metabolic flux.
- name: Fatty-Acid Pool Decrease
  description: Protein-normalized LC-MS in parasite-enriched low-speed pellets detected decreases in 15 fatty-acid
    pools after four-hour coculture, among 38 identified species containing at least 12 carbons. PARTIAL - increased
    utilization is the authors' interpretation, not measured uptake, oxidation, turnover or bacterial-to-parasite
    transfer; sample enrichment does not establish complete lipid-source purity.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  metabolites:
  - preferred_term: fatty acid
    term:
      id: CHEBI:35366
      label: fatty acid
    notes: Broad class covers the source panel of at least 12 carbons; CHEBI:15904 only covers C13-C22.
  biological_processes:
  - preferred_term: fatty acid metabolic process
    term:
      id: GO:0006631
      label: fatty acid metabolic process
  downstream:
  - target: T. vaginalis Growth with B. breve Attrition
    description: PARTIAL - increased fatty-acid utilization could support parasite biosynthesis and growth in the
      source's model. Decreased standing pools do not determine turnover or energetic flux and do not explain bacterial
      CFU loss by themselves.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'levels of several fatty acids were significantly reduced in the B. breve–treated group relative to
      the control, including 8 UFAs and 7 SFAs

      '
    explanation: Supports reduced protein-normalized fatty-acid pools in the enriched preparation, not turnover,
      uptake or pure parasite origin.
- name: Adhesin Transcripts and HeLa Nonprotection
  description: B. breve exposure increased parasite adhesin-associated transcripts, while HeLa assays did not show
    reduced parasite adherence or epithelial damage. Host pretreatment, simultaneous exposure and exposure to pretreated
    parasites are distinct designs. Cytokine responses varied by assay and time; lack of cytoprotection is not absence
    of cytokine effects or proof that adhesins mediate nonprotection.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  - preferred_term: HeLa human epithelial cells
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B. breve did not prevent epithelial damage or reduce T. vaginalis adherence
    explanation: 'Supports the absence of a B. breve cytoprotective effect in the HeLa infection model.

      '
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: there was an increase in virulence-associated genes, including adhesins
    explanation: 'Supports a virulence-associated adhesin response in T. vaginalis after B. breve exposure.

      '
growth_media:
- name: Bifidobacterium broth, B. breve maintenance
  composition:
  - name: Bifidobacterium broth
    from_source: true
  atmosphere: ANAEROBIC
  vessel_type: Broth, with single colonies picked from streaked plates
  preparation_notes: >-
    Maintenance culture for the bacterial partner, kept as -80C glycerol stocks. Extracted
    from the cached open-access full text; #183 listed this record as lacking growth
    conditions because they are Methods-level.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B. breve (ATCC 15700) was maintained anaerobically in Bifidobacterium broth, streaked
      to isolate single colonies, and preserved at −80°C in 50% glycerol
    explanation: Names the medium, the atmosphere and the strain for the maintenance culture.
- name: Serum-free YI-S co-culture assay
  composition:
  - name: YI-S, serum-free
    from_source: true
  atmosphere: ANAEROBIC
  incubation_time: 4.0
  incubation_time_unit: HOURS
  inoculum_size: 100000000.0
  inoculum_unit: CFU
  preparation_notes: >-
    The assay the record is about - B. breve at 1e8 CFU against T. vaginalis at 1e7 cells,
    the ratio taken from the prior study the source cites. Viability and bacterial counts
    were read at sequential time points.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both organisms were combined in serum-free YI-S and incubated anaerobically for four
      hours
    explanation: Names the co-culture medium, atmosphere and duration.
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mid-log phase bacteria and parasites were adjusted to 108 CFU and 107 cells, respectively
    explanation: The inoculum for each partner. The source renders the exponents without
      superscripts, so 108 and 107 are 1e8 and 1e7.

environmental_factors:
- name: Co-culture duration
  value: 4 h
  description: >
    Effects on parasite proliferation, gene expression and lipid metabolism were measured over a 4 h
    co-culture and are described by the authors as transient, so the interaction is time-bounded
    rather than a stable association.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: modulates parasite gene expression and lipid metabolism transiently
    explanation: Records that the observed modulation does not persist, which bounds how the
      interaction should be read.
