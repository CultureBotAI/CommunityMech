- name: Adhesin-Linked HeLa Nonprotection
  description: >
    B. breve-exposed T. vaginalis increased virulence-associated adhesin genes,
    and B. breve failed to reduce parasite adherence, cytopathic effects, or
    sustained cytokine production in HeLa epithelial assays whether supplied
    before or alongside the parasite.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
