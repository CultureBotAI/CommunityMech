ecological_interactions:
- name: Trichomonas vaginalis Proliferation at the Expense of Bifidobacterium breve
  description: >
    In 4 h co-culture the protozoan proliferated 1.2-fold more while bacterial abundance fell 27%,
    with microscopy showing direct physical association between the two organisms. The exchange is
    asymmetric — one member gains as the other is depleted.
  interaction_type: PREDATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Trichomonas vaginalis
    term:
      id: NCBITaxon:5722
      label: Trichomonas vaginalis
  target_taxon:
    preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  metabolites:
  - preferred_term: long-chain fatty acid
    term:
      id: CHEBI:15904
      label: long-chain fatty acid
    notes: Metabolomics confirmed changes in long-chain fatty acid content in the parasite,
      corroborating the transcriptomic signal for fatty acid metabolism.
  evidence:
  - reference: PMID:41688526
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Co-culture of T. vaginalis with B. breve for 4 h significantly increased protozoan
      proliferation by 1.2-fold, while bacterial abundance was reduced by 27%
    explanation: PARTIAL - the directional gain and loss are both measured, and microscopy shows
      physical association, but the paper does not demonstrate ingestion, so PREDATION is the
      closest available type rather than a mechanism the source establishes. Nothing here rules out
      the bacterial decline arising from competition or the culture conditions.
  - reference: PMID:41688526
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Transcriptomic profiling of T. vaginalis co-cultured with B. breve revealed an
      upregulation of genes related to fatty acid metabolism and DNA replication
    explanation: PARTIAL - the parasite's transcriptomic and metabolomic response to the bacterium,
      recorded on this interaction rather than as a separate edge because it describes the same
      relationship rather than a second one. Virulence-associated genes including adhesins also
      increased. No transferred compound is identified, so no cross-feeding is claimed.
- name: Absence of Host Epithelial Protection
  description: >
    B. breve conferred no protection on HeLa epithelial cells during infection, whether given before
    or alongside the parasite, so the commensal does not directly counteract T. vaginalis at the
    host interface despite its clinical association with lower parasite burden.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: it does not confer protection on host epithelial cells during infection
    explanation: States the negative host-protection result directly; recorded because a negative
      outcome here is the paper's main corrective to the expected protective role.
environmental_factors:
- name: Co-culture duration
  value: 4 h
  description: >
    Effects on parasite proliferation, gene expression and lipid metabolism were measured over a 4 h
    co-culture and are described by the authors as transient, so the interaction is time-bounded
    rather than a stable association.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: modulates parasite gene expression and lipid metabolism transiently
    explanation: Records that the observed modulation does not persist, which bounds how the
      interaction should be read.
