    description: >
      The pathway signal was followed by LC-MS profiling of the long-chain
      fatty-acid pool in co-cultured parasites.
  - target: T. vaginalis Growth with B. breve Attrition
    description: >
      Transcriptomic and functional analyses connected B. breve-enhanced
      parasite growth to upregulated fatty-acid metabolism.
  evidence:
  - reference: PMID:41688526
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      gene set variation analysis (GSVA) showed increased activity in fatty
      acid biosynthesis and propionate metabolism pathways
    explanation: >
      Supports a fatty-acid and SCFA-related transcriptional response in the
      parasite after B. breve co-culture.
- name: Long-Chain Fatty-Acid Pool Decrease
  description: >
    Targeted metabolomics of co-cultured T. vaginalis showed significant
    decreases in saturated and unsaturated long-chain fatty acids, consistent
    with increased parasite utilization of fatty acids after B. breve exposure.
  interaction_type: PREDATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bifidobacterium breve
    term:
      id: NCBITaxon:1685
      label: Bifidobacterium breve
  - preferred_term: Trichomonas vaginalis
