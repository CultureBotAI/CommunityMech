id: CommunityMech:000470
name: Rice Paddy Sediment Syntrophic Methanogenic Consortium Under Hypophosphite Inhibition
description: Anoxic rice paddy field sediment and model Methanococcus maripaludis S2 syntrophic methanogenic system in which
  primary fermenters (including Clostridium) convert organic substrates into interspecies electron carriers (formate and H2)
  consumed by hydrogenotrophic and formate-utilizing methanogens (Methanococcus maripaludis S2, Methanobacterium, and Methanosarcina).
  Hypophosphite (H2PO2-), an inorganic formate analogue, selectively inhibits syntrophic methanogenesis by targeting archaeal
  formate metabolism without inhibiting primary fermentation.
