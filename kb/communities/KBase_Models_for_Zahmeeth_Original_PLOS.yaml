ecological_interactions:
- name: Model-Architecture-Dependent Information Flow
  description: 'Mixed-bag models generally had higher mutual-information scores than compartmentalized models. The
    authors attribute this to pooling reactions without intermember transport constraints; this is a model-architecture
    interpretation, not observed niche partitioning or a selectively validated biological transport mechanism. Methods/Results
    identify E. coli iML1515 and B. theta iAH991; the abstract names different pairs. The two canonical participants
    delimit the modeled comparison, not a four-member consortium; the source/metadata discrepancy remains #1527.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: mixed-bag framework conducts greater information flow than the compartmentalized framework
    explanation: Primary-checked abstract fragment supports the model comparison; transport explanation remains
      an interpretation rather than demonstrated ecological causation.
  participating_taxa:
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  - preferred_term: Bacteroides thetaiotaomicron
    term:
      id: NCBITaxon:818
      label: Bacteroides thetaiotaomicron
- name: Model-Conditional Growth Contrasts
  description: 'Community models grew on dextrin where the E. coli isolate model did not. Aerobic isolated B. theta
    growth and information flow were manually set to zero, with that constraint lifted in community models; the
    contrast is not independently predicted partner rescue. Model growth does not establish actual strain growth,
    resolved cross-feeding, stable community formation or reciprocal benefit. Methods/Results identify E. coli iML1515
    and B. theta iAH991; the abstract names different pairs. The two canonical participants delimit the modeled
    comparison, not a four-member consortium; the source/metadata discrepancy remains #1527.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: dextrin
    term:
      id: CHEBI:28675
      label: dextrin
    notes: Model carbon substrate in the dextrin growth comparison, not a measured concentration or traced interstrain
      flux.
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: despite that E. coli failed to grow as an isolate
    explanation: Primary-checked Results fragment supports the dextrin contrast. The read Methods explicitly impose
      the aerobic isolated B. theta zero-growth/MI rule; the comparison cannot independently validate rescue.
  participating_taxa:
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  - preferred_term: Bacteroides thetaiotaomicron
    term:
      id: NCBITaxon:818
      label: Bacteroides thetaiotaomicron
- name: Greater Community Information Flow
  description: 'RFMIA generally returned higher mutual-information scores for the community models than for isolated
    models under the tested nutrient combinations. These are computed information-theoretic outputs in bits, not
    measured molecular communication, a universal growth advantage or mutualism. Methods/Results identify E. coli
    iML1515 and B. theta iAH991; the abstract names different pairs. The two canonical participants delimit the
    modeled comparison, not a four-member consortium; the source/metadata discrepancy remains #1527.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: information flow is greater through communities than isolated models
    explanation: Primary-checked abstract fragment supports the reported computational trend, bounded by Methods/Results
      and selected chart inspection; not every environmental condition or biological system.
  participating_taxa:
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  - preferred_term: Bacteroides thetaiotaomicron
    term:
      id: NCBITaxon:818
      label: Bacteroides thetaiotaomicron
