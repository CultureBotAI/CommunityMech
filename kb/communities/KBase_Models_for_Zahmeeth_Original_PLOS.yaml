ecological_interactions:
- name: RFMIA Community Information-Flow Adaptation
  description: >
    The Zahmeeth computational workflow adapted Run Flux Mutual Information
    Analysis to combine molecular communication, Shannon information theory, and
    metabolic flux analysis for quantifying information flow through modeled
    microbial community metabolism in bits.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Idealized Two-Member Community Model Construction
    description: >
      The RFMIA framework was applied to idealized two-member microbial
      communities represented by genome-scale metabolic models.
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: adapted a model that blends molecular communication and Shannon Information theory
      to be able to quantify the information flow through metabolism in bits
    explanation: >
      Supports the computational RFMIA adaptation used to quantify metabolic
      information flow in bits.
- name: Idealized Two-Member Community Model Construction
  description: >
    The RFMIA analysis was instantiated on idealized two-member communities,
    including Escherichia coli with Pseudomonas fluorescens and Bacteroides
    thetaiotaomicron with Klebsiella, allowing modeled community flux behavior
    to be compared with isolate behavior.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Mixed-Bag and Compartmentalized GEM Comparison
    description: >
      The idealized two-member models supplied the test cases for comparing
      mixed-bag and compartmentalized community genome-scale model structures.
  - target: In Silico Community-Formation Dependencies
    description: >
      The paired idealized communities were also used to identify model
      dependencies that justified community formation relative to isolate
      simulations.
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: RFMIA (Run Flux Mutual Information Analysis), was applied to idealized two-member
      microbial communities
    explanation: >
      Establishes that the computational information-flow method was applied to
      idealized two-member microbial community models.
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: one of E. coli and Pseudomonas fluorescens and another of Bacteroides thetaiotaomicron
      (B. theta) and Klebsiella
    explanation: >
      Names the two idealized two-member model communities used in the RFMIA
      comparison.
- name: Mixed-Bag and Compartmentalized GEM Comparison
  description: >
    The workflow compared mixed-bag and compartmentalized genome-scale metabolic
    modeling frameworks for the same idealized two-member communities, separating
    model-architecture effects from isolated-community information-flow
    contrasts.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Greater Community Information Flow
    description: >
      Comparing the alternative GEM frameworks produced the specific result that
      mixed-bag community models conducted more information flow than
      compartmentalized ones.
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: mixed-bag framework conducts greater information flow than the compartmentalized
      framework for community genome-scale metabolic models
    explanation: >
      Supports the community GEM architecture comparison and its
      information-flow result.
- name: In Silico Community-Formation Dependencies
  description: >
    Simulated pairwise communities exposed community-only dependencies, including
    aerobic B. thetaiotaomicron growth when coupled with E. coli and community
    dextrin growth in cases where E. coli could not grow as an isolate.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  metabolites:
  - preferred_term: dextrin
    term:
      id: CHEBI:28675
      label: dextrin
    concentration: Model carbon source supporting community growth but not E. coli isolate growth
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Greater Community Information Flow
    description: >
      The modeled dependency examples accompanied the broader finding that
      two-member community models carried more metabolic information flow than
      isolate models.
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our work reveals dependencies among organisms that justify community formation
    explanation: >
      Supports the in silico identification of dependencies that motivate the
      modeled community state.
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: including that B. theta only grows in aerobic environments when coupled with E. coli
      and that community models grew on dextrin despite that E. coli failed to grow
      as an isolate
    explanation: >
      Gives the two abstract-level examples of predicted community dependencies.
- name: Greater Community Information Flow
  description: >
    The RFMIA simulations reported higher information flow through the idealized
    two-member community models than through isolated organism models, tying the
    KBase model workflows to a quantitative community-level information-flow
    output.
  scope: COMMUNITY_LEVEL
  interaction_type: MUTUALISM
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: information flow is greater through communities than isolated models
    explanation: >
      Supports the downstream quantitative result that community models carried
      more metabolic information flow than isolate models.
