ecological_interactions:
- name: B. thetaiotaomicron Aerobic Growth Dependency on E. coli
  description: >-
    Bacteroides thetaiotaomicron, typically an obligate anaerobe, can grow in aerobic
    environments only when coupled metabolically with Escherichia coli. This syntrophic
    dependency demonstrates metabolic complementarity where E. coli provides necessary
    functions enabling B. theta aerobic survival. The interaction reveals that community
    formation provides adaptive advantages that neither organism achieves in isolation,
    supporting cross-species metabolic cooperation as a driver of community assembly.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: Bacteroides thetaiotaomicron
    term:
      id: NCBITaxon:818
      label: Bacteroides thetaiotaomicron
  target_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      B. theta only grows in aerobic environments when coupled with E. coli
    explanation: >-
      Demonstrates syntrophic dependency where B. theta requires E. coli for aerobic growth.
- name: Community Dextrin Degradation via Metabolic Complementarity
  description: >-
    The microbial community models successfully grew on dextrin as a carbon source
    despite E. coli failing to grow on dextrin as an isolate. This demonstrates metabolic
    complementarity where cross-feeding or cooperative substrate degradation by community
    members enables utilization of resources inaccessible to individual species. The
    finding justifies community formation as a strategy to expand collective metabolic
    capabilities beyond the sum of individual organism capacities.
  interaction_type: CROSS_FEEDING
  metabolites:
  - preferred_term: dextrin
    term:
      id: CHEBI:28580
      label: dextrin
    concentration: Growth substrate for community but not E. coli alone
  evidence:
  - reference: doi:10.1101/2023.08.23.554558
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      community models grew on dextrin despite that E. coli failed to grow as an isolate
    explanation: >-
      Demonstrates community metabolic complementarity enabling dextrin utilization.
