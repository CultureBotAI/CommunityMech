id: CommunityMech:000371
name: Rhodococcus-Pseudomonas Plastic Pyrolysis Oil Waste Consortium
description: A defined three-member synthetic bacterial consortium composed of Rhodococcus opacus DSM 43250, Pseudomonas putida
  KT2440, and Pseudomonas sp. VLB120 for aerobic degradation of CARBOLIQ-derived plastic pyrolysis oil waste in a 2-nonanone
  organic-aqueous biphasic system. The consortium was rationally assembled to couple long-chain alkane degradation with aromatic-catabolism
  and solvent-tolerance functions, and its highest measured activity used an initial R. opacus:P. putida:VLB120 ratio of 1:1:2
  at 30 C, 1:5 organic-to-aqueous phase ratio, and 20% v/v PPOW in the organic phase.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Assemble and optimize a synthetic bacterial consortium that can tolerate the heterogeneity of plastic pyrolysis
    oil waste and use its aliphatic and aromatic organic pollutants as carbon and energy sources in a biphasic treatment system.
  assembly_strategy: Combine Rhodococcus opacus DSM 43250 with two pseudomonads, Pseudomonas putida KT2440 and Pseudomonas
    sp. VLB120, to test a rational division of labor between alkane degradation, aromatic catabolism, and solvent-stress tolerance.
  inoculation_strategy: Prepare the inoculum by mixing OD600-standardized cultures of the three strains at a specified ratio,
    washing pellets twice with sterile mineral salt medium to remove benzoate, adjusting the final cell density to OD600 1.0,
    and transferring a 10% v/v inoculum into the biphasic reaction.
  perturbation_design: Compare 2-nonanone against ethyl decanoate as the second organic phase and optimize temperature, organic-to-aqueous
    phase ratio, PPOW loading in the organic phase, and the relative R. opacus:P. putida:VLB120 inoculation ratio.
  measurement_endpoints:
  - O2 consumption during PPOW degradation
  - CO2 release during second-organic-phase selection
  - GC-FID removal rates for major PPOW compounds
  - Back-propagation neural-network prediction of O2 consumption
  notes: The article explicitly reports that the member-level mechanism was inferred after process optimization; this record
    therefore keeps the alkane, aromatic, and solvent-tolerance split as a community-level niche-partitioning model rather
    than individual pairwise cross-feeding edges.
  evidence:
  - reference: PMID:42491060
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To reduce this molecular heterogeneity, we artificially compounded, monitored, and optimized a bacterial consortium
      capable of tolerating organic pollutants and utilizing them as carbon and energy sources.
    explanation: Supports the engineered PPOW-removal objective.
  - reference: PMID:42491060
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biodegradation of PPOW by a synthetic bacterial community composed of Rhodococcus opacus DSM 43250, Pseudomonas
      putida KT2440 and Pseudomonas sp. VLB120 was investigated in an organic-aqueous two-phase system
    explanation: Supports the exact three-strain synthetic consortium and biphasic assay design.
  - reference: PMID:42491060
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although the specific mechanism remains unclear, we infer that the high degradation efficiency achieved in this
      study stems from rational functional complementarity among the consortium members
    explanation: Supports treating the division of labor as the authors' inferred design model.
  - reference: PMID:42491060
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Additionally, a back-propagation (BP) neural network was applied to evaluate O2 consumption as an indicator of
      microbial activity and to build a predictive model for process optimization.
    explanation: Supports the O2-consumption neural-network optimization endpoint.
  - reference: PMID:42491060
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Within 7 days, the bacterial community demonstrated remarkable efficacy, degrading alkanes (C10–C28) at rates
      of 71–100% and achieving complete removal of ε-caprolactam (8,032 mg/mL) and naphthalene.
    explanation: Supports the seven-day PPOW component-removal endpoint.
