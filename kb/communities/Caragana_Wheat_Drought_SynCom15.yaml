ecological_interactions:
- name: SynCom15 wheat drought growth promotion
  description: The full fifteen-member SynCom significantly enhanced wheat growth under drought stress relative to uninoculated
    controls and any single member in potted plant assays.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41634815
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: inoculation with the complete SynCom15 consortium significantly enhanced wheat growth under drought stress compared
      to any single member
    explanation: Supports a community-level drought-growth phenotype for SynCom15.
- name: Pseudomonas-associated biofilm and quorum-sensing enrichment
  description: SynCom inoculation enriched biofilm-formation and quorum-sensing pathways in the wheat rhizosphere, with enriched
    genes traced predominantly to Pseudomonas.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41634815
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: biofilm formation and quorum sensing pathways were significantly positively correlated with plant fresh weight
    explanation: Supports the rhizosphere functional signal linked to SynCom inoculation.
  - reference: PMID:41634815
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: enriched genes were predominantly of Pseudomonas origin
    explanation: Links the enriched biofilm and quorum-sensing functions to Pseudomonas in the SynCom-treated rhizosphere.
environmental_factors:
- name: Drought treatment
  value: drought stress
  description: The SynCom was evaluated for its ability to improve plant growth under drought treatment.
  evidence:
  - reference: PMID:41634815
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Both SynCom5 and SynCom15 significantly enhanced plant growth under drought to a comparable extent
    explanation: Supports drought treatment as the main perturbation for SynCom15 evaluation.
