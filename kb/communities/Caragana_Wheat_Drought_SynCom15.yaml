id: CommunityMech:000456
name: Caragana-Wheat Drought SynCom15
description: A fifteen-member bacterial synthetic community constructed from drought-responsive core microbes of the desert
  shrub Caragana korshinskii and tested as a cross-host wheat drought-tolerance inoculant. Hao et al. combined four functional
  strains with eleven core microbial strains, assayed the full SynCom15 in potted plant experiments, and linked SynCom inoculation
  to wheat growth under drought, Pseudomonas-associated biofilm and quorum-sensing functions, and later streamlining into
  a biofilm-forming SynCom5.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Construct a desert-plant-root bacterial SynCom that transfers drought tolerance to wheat and other crop hosts.
  assembly_strategy: Identify Caragana korshinskii root-enriched core ASVs with aridity-linked functional contributions, isolate
    cultivable candidates, and combine four functional strains with eleven core microbial strains into a 15-member SynCom.
  perturbation_design: Compare uninoculated and SynCom-inoculated plants under well-watered and drought treatments, including
    wheat rhizosphere 16S rRNA gene amplicon and metagenomic profiling.
  measurement_endpoints:
  - wheat fresh weight under drought
  - SynCom member root colonization
  - rhizosphere 16S rRNA amplicon profiles
  - rhizosphere metagenomic functions
  - biofilm formation pathway abundance
  - quorum sensing pathway abundance
  - Pseudomonas relative abundance
  notes: This record curates the original fifteen-member SynCom. The paper later streamlined the consortium to SynCom5, but
    the cached text enumerates SynCom5 members only through Fig. 6 labels, so SynCom5 should be curated as a separate record
    only if those labels are captured as source text.
  evidence:
  - reference: PMID:41634815
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Finally, a 15-member synthetic community (SynCom) was constructed by combining these four functional strains
      with 11 core microbial strains
    explanation: Supports the 15-member engineered SynCom construction.
  - reference: PMID:41634815
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Functionally, inoculation with the complete SynCom15 consortium significantly enhanced wheat growth under drought
      stress compared to any single member
    explanation: Supports the full SynCom15 wheat drought assay and community-level phenotype.
environment_term:
  preferred_term: wheat rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: The defined SynCom was inoculated onto wheat in potted drought assays and evaluated through rhizosphere amplicon
    and metagenomic sequencing.
modeled_environment:
- preferred_term: Caragana korshinskii root endosphere
  term:
    id: ENVO:01001001
    label: plant-associated environment
  notes: The member-selection strategy mined drought-responsive core bacteria from the desert shrub Caragana korshinskii.
