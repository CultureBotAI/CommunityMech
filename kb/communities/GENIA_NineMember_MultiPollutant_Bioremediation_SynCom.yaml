id: CommunityMech:000352
name: GENIA Nine-Member Multi-Pollutant Bioremediation SynCom
description: >
  A nine-member bacterial synthetic community selected by the GENIA genome-informed
  machine-learning framework for simultaneous degradation of lignin, atrazine,
  and perfluoroalkyl substances. The SynCom combines Atlantibacter hermannii,
  Bacillus cabrialesii, Bacillus licheniformis, Bacillus pseudomycoides,
  Micrococcus luteus, Paenibacillus polymyxa, Pantoea dispersa, Pseudomonas
  fulva, and Pseudomonas pergaminensis isolates from xenobiotic-enriched cotton
  detritusphere material. In controlled M9 minimal-medium flask assays, the
  assembled consortium removed more PFOS, atrazine, and lignin than any single
  member and retained all nine strains during full-length 16S rRNA tracking.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >
    Design a defined bacterial SynCom with complementary genome-encoded pathways
    for degradation of lignin, atrazine, and perfluoroalkyl substances.
  assembly_strategy: >
    Screen cotton-detritusphere isolates for growth on target pollutants,
    sequence 45 prioritized strains, and use the GENIA graph-neural-network and
    genetic-algorithm workflow to choose nine strains with predicted
    multipollutant degradation and reduced functional redundancy.
  inoculation_strategy: >
    Grow the nine predicted members separately to mid-exponential phase in M9
    plus glucose, normalize each to 9 x 10^6 CFU/mL, and assemble the SynCom by
    mixing equal volumes to target 10^6 CFU/mL per strain.
  measurement_endpoints:
  - Lignin, atrazine, PFOS, and PFOA removal
  - Fluoride liberation and PFBS accumulation during PFOS degradation
  - Ammonium release during atrazine mineralization
  - Vanillin and syringaldehyde accumulation during lignin degradation
  - Full-length 16S rRNA community composition dynamics
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Nine strains predicted by GENIA to form an optimal community were
      systematically validated through controlled coculture experiments.
    explanation: >
      Establishes that the GENIA-selected nine-strain community was assembled
      and experimentally validated.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Community selection by genetic algorithm maximizing degradation while
      minimizing redundancy
    explanation: >
      Supports the predicted functional-complementarity and redundancy
      minimization criteria used to select the final nine-member SynCom.
