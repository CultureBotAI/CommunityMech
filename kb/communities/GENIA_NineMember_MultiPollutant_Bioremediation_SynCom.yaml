environmental_factors:
- name: Liquid-culture PFOS removal
  value: 93.1% removal within 7 days
  description: >
    The assembled consortium removed PFOS in the M9 minimal-medium liquid assay.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      PFOS degradation follows sigmoid kinetics with a distinct lag phase (days
      0-1, < 5% removal), exponential degradation (days 2-5), and an asymptotic
      approach (93.1% final).
    explanation: Supports the seven-day PFOS removal endpoint.
- name: Liquid-culture atrazine removal
  value: 91.4% removal by day 3
  description: >
    Atrazine was rapidly removed by the assembled consortium in M9 minimal
    medium.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Atrazine degradation exhibits the fastest kinetics among pollutants: 91.4%
      removal by day 3
    explanation: Supports the atrazine removal endpoint.
- name: Liquid-culture lignin removal
  value: 91.6% removal by day 5
  description: >
    Kraft lignin was removed by the assembled consortium in M9 minimal medium.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Lignin degradation ( Figure b) proceeded from an initial concentration of
      490.7 +/- 12.1 mg/L to a final concentration of 41.6 +/- 1.0 mg/L,
      representing 91.6% removal after 5 days.
    explanation: Supports the lignin removal endpoint.
- name: Soil-microcosm PFOS, PFOA, and atrazine removal
  value: 68.7% PFOS removal, 64.3% PFOA removal, and 73.2% atrazine removal
  description: >
    The defined SynCom also improved PFOS, PFOA, and atrazine removal after
    inoculation into agricultural-soil microcosms.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Atrazine removal achieved 73.2 +/- 5.1% by day 7 compared to 18.4 +/- 3.2%
      in noninoculated controls
    explanation: Supports the soil atrazine bioaugmentation endpoint.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      PFOS degradation reached 68.7 +/- 6.8% vs 12.1 +/- 2.9% in controls
    explanation: Supports the soil PFOS bioaugmentation endpoint.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      PFOA showed a similar pattern (64.3 +/- 7.2% removal; data not shown in
      the main text but included in the Supporting Information).
    explanation: Supports the soil PFOA bioaugmentation endpoint.
