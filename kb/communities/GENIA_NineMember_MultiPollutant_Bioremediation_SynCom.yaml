ecological_interactions:
- name: Predicted GENIA Metabolic Complementarity
  description: 'HYPOTHESIZED: Genome annotations and computational network models predict complementary degradation
    potential across nine selected members, including five predicted generalists and four specialists. Agreement
    between GENIA and iNAP is computational cross-validation, not measured interspecies metabolite transfer, active
    expression or catalytic necessity. Growth-screen fluorescence does not independently establish pollutant degradation.
    The assembly workflow is not itself a biological cause of the measured removal phenotype; no design-to-removal
    arrow is retained.'
