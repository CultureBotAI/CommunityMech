- name: GENIA DNA Composition and Ratio-Management Comparison
  description: 'Full-length 16S rRNA gene profiles track relative DNA composition during removal; predicted hub
    taxa increased in relative abundance and other inoculated taxa remained detectable. These measurements do not
    establish absolute viable persistence, member-resolved flux or hub necessity. The source also compares self-organizing
    communities with daily dilution/remixing to equal ratios, reporting lower PFOS and atrazine removal in the remixed
    condition; the lignin comparison had p=0.092. PARTIAL: this treatment comparison supports a composition-management
    association with performance, but does not isolate a particular taxon, metabolite or persistence-mediated pathway
    from the handling intervention.'
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Reported GENIA Liquid Pollutant Removal
    description: 'PARTIAL: Allowing composition to reorganize was associated with greater PFOS and atrazine removal
      than daily equal-ratio dilution/remixing. This reported intervention supports a bounded community-management
      effect, not selective proof that persistence or a particular cross-feeding network causes removal. Dilution/remixing
      changes handling as well as ratios; the reported lignin difference was not significant at p<0.05.'
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Hub strains showed predicted expansion: P. polymyxa increased from 11.1% (day 0) to 14.2% (day 3)
      to 15.6% (day 7), representing a 40.5% relative increase

      '
    explanation: Supports source-reported relative DNA composition, not absolute viable abundance or selective causal
      mediation.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Critically, no invasive taxa (noninoculated strains) exceeded 1% relative abundance at any time point

      '
    explanation: Supports source-reported relative DNA composition, not absolute viable abundance or selective causal
      mediation.
  - reference: PMID:42036878
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Comparison of self-organizing community dynamics vs artificially maintained equal ratios
    explanation: The primary Results describe daily dilution/remixing with pollutant-specific comparisons; supports
      only the qualified treatment-level arrow.
