ecological_interactions:
- name: GENIA Multipollutant Assembly
  description: >
    GENIA integrated pollutant-growth phenotypes and whole-genome annotations to
    assemble a community with complementary lignin, atrazine, and PFAS
    degradation potential across hub and specialist strains.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  - preferred_term: atrazine
    term:
      id: CHEBI:15930
      label: atrazine
  - preferred_term: perfluorooctane-1-sulfonic acid
    term:
      id: CHEBI:39421
      label: perfluorooctane-1-sulfonic acid
  biological_processes:
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: Liquid Multipollutant Degradation
    description: >
      The genome-informed community architecture yielded synergistic PFOS,
      atrazine, and lignin removal in minimal medium.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Functional classification based on genomic capacity identified two
      ecological roles: 5 generalist strains (55.6% of consortium) possessing
      enzymatic capacity across all three pollutant classes
    explanation: >
      Supports role partitioning across generalist and specialist members of the
      GENIA community.
- name: Liquid Multipollutant Degradation
  description: >
    The assembled nine-member SynCom degraded lignin, atrazine, and PFOS in M9
    minimal-medium assays at levels greater than the best individually assayed
    member.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  - preferred_term: atrazine
    term:
      id: CHEBI:15930
      label: atrazine
  - preferred_term: perfluorooctane-1-sulfonic acid
    term:
      id: CHEBI:39421
      label: perfluorooctane-1-sulfonic acid
  biological_processes:
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The 9-member consortium achieved 93.1% PFOS removal (2.23-fold improvement
      over best individual), 91.4% atrazine removal (1.47-fold), and 91.6% lignin
      removal (1.46-fold).
    explanation: >
      Quantifies emergent community-scale pollutant removal beyond the
      strongest monoculture benchmarks.
- name: Community Stability During Degradation
  description: >
    Full-length 16S rRNA tracking over the seven-day degradation assay showed
    that all nine inoculated strains persisted, with the predicted Paenibacillus
    polymyxa and Pseudomonas pergaminensis hub strains increasing in relative
    abundance while specialist strains remained detectable.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Liquid Multipollutant Degradation
    description: >
      Persistence of the complete inoculated roster maintained the multispecies
      degradation network during the pollutant-removal time course.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Hub strains showed predicted expansion: P. polymyxa increased from 11.1%
      (day 0) to 14.2% (day 3) to 15.6% (day 7), representing a 40.5% relative
      increase
    explanation: >
      Supports molecular tracking of predicted hub-strain dynamics during the
      degradation assay.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Critically, no invasive taxa (noninoculated strains) exceeded 1% relative
      abundance at any time point
    explanation: >
      Supports persistence of the defined community without takeover by
      contaminating noninoculated strains.
environmental_factors:
- name: Liquid-culture PFOS removal
  value: 93.1% removal within 7 days
  description: >
    The assembled consortium removed PFOS in the M9 minimal-medium liquid assay.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      PFOS degradation follows sigmoid kinetics with a distinct lag phase (days
      0-1, < 5% removal), exponential degradation (days 2-5), and an asymptotic
      approach (93.1% final).
    explanation: Supports the seven-day PFOS removal endpoint.
- name: Liquid-culture atrazine removal
  value: 91.4% removal by day 3
  description: >
    Atrazine was rapidly removed by the assembled consortium in M9 minimal
    medium.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Atrazine degradation exhibits the fastest kinetics among pollutants: 91.4%
      removal by day 3
    explanation: Supports the atrazine removal endpoint.
- name: Liquid-culture lignin removal
  value: 91.6% removal by day 5
  description: >
    Kraft lignin was removed by the assembled consortium in M9 minimal medium.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Lignin degradation ( Figure b) proceeded from an initial concentration of
      490.7 +/- 12.1 mg/L to a final concentration of 41.6 +/- 1.0 mg/L,
      representing 91.6% removal after 5 days.
    explanation: Supports the lignin removal endpoint.
- name: Soil-microcosm PFOS and atrazine removal
  value: 68.7% PFOS removal and 73.2% atrazine removal
  description: >
    The defined SynCom also improved PFOS and atrazine removal after inoculation
    into agricultural-soil microcosms.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Atrazine removal achieved 73.2 +/- 5.1% by day 7 compared to 18.4 +/- 3.2%
      in noninoculated controls
    explanation: Supports the soil atrazine bioaugmentation endpoint.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      PFOS degradation reached 68.7 +/- 6.8% vs 12.1 +/- 2.9% in controls
    explanation: Supports the soil PFOS bioaugmentation endpoint.
