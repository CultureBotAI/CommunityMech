    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The 9-member consortium achieved 93.1% PFOS removal (2.23-fold improvement over best individual),
      91.4% atrazine removal (1.47-fold), and 91.6% lignin removal (1.46-fold).

      '
    explanation: Source-reported separate-treatment comparison, not mutualism or the lower mixed-pollutant outcomes;
