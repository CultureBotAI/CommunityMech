  shaking_speed: '150'
  shaking_speed_unit: rpm
  vessel_type: 250 mL baffled Erlenmeyer flask
  inoculum_size: 10^6 CFU/mL per strain
  preparation_notes: >
    Individual-pollutant assays used kraft lignin, atrazine, or a PFAS mixture
    of PFOA and PFOS in the M9 formulation; the nine normalized member
    suspensions were mixed in equal volumes before inoculation.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The assembled synthetic communities were inoculated into fresh M9 minimal
      medium (Na2HPO4, 6.78 g L-1; KH2PO4, 3.0 g L-1; NH4Cl, 1.0 g L-1; NaCl,
      0.5 g L-1; MgSO4, 1 mM; CaCl2, 0.1 mM) containing one of the three target
      pollutants as the sole carbon source.
    explanation: >
      Supports the M9 salt formulation and use of a target pollutant as the sole
      carbon source.
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Treatment conditions included kraft lignin (500 mg L-1), atrazine (30 mg
      L-1), or PFAS mixture (20 mg L-1 each of PFOA and PFOS).
    explanation: >
      Supports pollutant concentrations used in the individual substrate assays.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: FLASK
  working_volume: 50.0
  working_volume_unit: mL
  instrument_detail: >
    250 mL baffled Erlenmeyer flasks incubated at 27 C with orbital shaking at
    150 rpm for seven-day liquid-culture validation.
  evidence:
  - reference: PMID:42036878
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Incubations were performed in 250 mL baffled Erlenmeyer flasks, with a
      working volume of 50 mL, in 6 biological replicates per treatment at 27 C
      with orbital shaking at 150 rpm for 7 days.
    explanation: >
      Supports the vessel, working volume, replication, temperature, agitation,
      and duration of the liquid-culture validation assays.
