- name: Reported GENIA Liquid Pollutant Removal
  description: 'The source reports consortium removal above the best assayed monoculture: PFOS 93.1%, atrazine 91.4%
    and lignin 91.6% in the separate treatment comparisons. A distinct seven-day mixed-pollutant experiment reports
    PFOS 87.1%, atrazine 84.7% and lignin 88.9%; do not substitute the higher figures for this mixture. LC-MS/MS
    loss and lignin UV-visible changes are community-level endpoints, not proof of reciprocal member benefit, assigned
    cross-feeding or complete carbon mineralization. The paper reports fluoride and intermediates, but its PFOS
    fluorine denominator and atrazine nitrogen/method descriptions conflict; removal is retained as source-reported,
    not independent certification of defluorination efficiency or complete mineralization. Supplements and raw data
    were not audited.'
  scope: COMMUNITY_LEVEL
