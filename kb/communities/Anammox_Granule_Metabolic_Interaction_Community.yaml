id: CommunityMech:000146
name: Anammox Granule Metabolic Interaction Community
description: >
  A laboratory-scale anammox granular-sludge bioreactor community reconstructed with genome-centric
  metagenomics and metatranscriptomics. Brocadia-affiliated anammox bacteria dominate nitrogen removal,
  while Chlorobi-affiliated and other heterotrophic bacteria recycle nitrate to nitrite, degrade EPS-derived
  peptides, and scavenge detrital products from anammox growth.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Resolve metabolic interactions in anammox granules used for energy-efficient wastewater nitrogen
    removal.
  assembly_strategy: Maintain dense anammox granular sludge in a laboratory-scale bioreactor and reconstruct
    member genomes and transcript profiles from whole-community sequencing.
  measurement_endpoints:
  - metagenome-assembled genomes
  - metatranscriptomic gene expression
  - anammox gene expression
  - heterotrophic nitrate respiration
  - peptide and amino acid catabolism
  evidence:
  - &anammox_granules
    reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: recover 17 draft genomes
    explanation: Supports genome-resolved reconstruction of the anammox granule community.
