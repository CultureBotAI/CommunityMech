    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: scavenging of detritus and peptides
    explanation: Supports detritus and peptide scavenging by heterotrophic members.
environmental_factors:
- name: anaerobic granule interior
  value: Oxygen diffusion limited by dense aggregate structure
  description: High granule density limits oxygen diffusion into the interior, permitting anaerobic bacteria
    and anammox activity.
