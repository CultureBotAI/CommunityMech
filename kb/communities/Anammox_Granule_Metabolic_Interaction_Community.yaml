environmental_factors:
- name: anaerobic granule interior
  value: Oxygen diffusion limited by dense aggregate structure
  description: High granule density limits oxygen diffusion into the interior, permitting anaerobic bacteria
    and anammox activity.
  evidence:
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: limit oxygen diffusion into the granule interior
    explanation: Supports anaerobic granule interiors as a key environmental factor.
- name: extracellular polymeric substances
  value: Protein- and polysaccharide-rich EPS matrix
  description: Anammox granules are embedded in EPS, and EPS-derived peptides are inferred substrates for
    heterotrophic members.
  evidence:
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: matrix of organic extracellular polymeric substances
    explanation: Supports EPS as the granule matrix.
- name: wastewater nitrogen removal context
