    term:
      id: NCBITaxon:1090
      label: Chlorobiota
  evidence:
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: catabolizing extracellular peptides
    explanation: Supports peptide scavenging by Chlorobi-affiliated heterotrophs.
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: EPS produced by anammox bacteria
    explanation: Supports anammox-derived EPS as an organic carbon source.
- name: Detritus and Small-Donor Scavenging
  description: Other heterotrophic members scavenge detritus, peptides, hydrogen, acetate, and formate,
    broadening carbon and electron flow in the granule.
  interaction_type: COMMENSALISM
  source_taxon:
