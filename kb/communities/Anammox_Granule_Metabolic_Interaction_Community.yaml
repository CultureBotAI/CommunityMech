ecological_interactions:
- name: Anammox Ammonium-Nitrite Conversion
  description: Brocadia-affiliated AMX1 oxidizes ammonium anaerobically using nitrite as the terminal
    electron acceptor, producing nitrogen gas and nitrate-linked byproducts that structure the granule.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Brocadia-affiliated anammox bacterium AMX1
    term:
      id: NCBITaxon:795830
      label: Candidatus Brocadia sinica
  metabolites:
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  evidence:
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: genes involved in anammox metabolism
    explanation: Supports active anammox metabolism in the Brocadia-affiliated AMX1 genome.
- name: Heterotrophic Nitrite Loop
  description: Heterotrophic anammox-granule members respire nitrate to nitrite, potentially recycling nitrate
    produced by anammox growth back into nitrite for anammox bacteria.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: anammox-granule heterotrophic flanking bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
    preferred_term: Brocadia-affiliated anammox bacterium AMX1
    term:
      id: NCBITaxon:795830
      label: Candidatus Brocadia sinica
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  biological_processes:
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  evidence:
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: possibly completing a nitrite loop with anammox and nitrite oxidizing bacteria (NOB) by reducing nitrate back to nitrite
    explanation: Supports nitrate-to-nitrite recycling as an interaction with anammox bacteria.
- name: EPS Peptide Scavenging by Chlorobi
  description: Chlorobi-affiliated heterotrophs degrade extracellular proteinaceous material in the granule
    matrix, releasing amino acids and peptides that can support themselves and other community members.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Brocadia-affiliated anammox bacterium AMX1
    term:
      id: NCBITaxon:795830
      label: Candidatus Brocadia sinica
  target_taxon:
