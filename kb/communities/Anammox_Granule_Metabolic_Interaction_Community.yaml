ecological_interactions:
- name: Anammox Ammonium-Nitrite Conversion
  description: The Brocadia-affiliated AMX1 genome expressed anammox genes in the nitrogen-removing granule reactor.
    This supports active metabolic potential; the proposed transfers to neighboring heterotrophs were inferred from
    genomes and transcripts rather than measured as partner-resolved fluxes.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Brocadia-affiliated anammox bacterium AMX1
    term:
      id: NCBITaxon:795830
      label: Candidatus Brocadia sinica
  metabolites:
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  downstream:
  - target: Heterotrophic Nitrite Loop
    description: HYPOTHESIZED - anammox-derived nitrate could supply heterotrophic nitrate reduction and a nitrite-return
      loop; expression supports potential but not the exchanged flux.
  - target: EPS Peptide Scavenging by Chlorobi
    description: HYPOTHESIZED - anammox-associated extracellular material could feed heterotrophic proteolysis;
      the source of consumed protein and the transfer were not traced in this study.
  - target: Detritus and Small-Donor Scavenging
    description: HYPOTHESIZED - biomass turnover or released small substrates could feed heterotrophs; wastewater-derived
      organic carbon and unresolved pathway directions prevent exclusive attribution to AMX1.
  evidence:
  - reference: doi:10.1038/ncomms15416
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: genes involved in anammox metabolism
    explanation: Supports active anammox metabolism in the Brocadia-affiliated AMX1 genome.
- name: Heterotrophic Nitrite Loop
  description: HYPOTHESIZED - expressed heterotrophic nitrate-reductase genes could support nitrate-to-nitrite recycling
    for anammox. The study also identifies other nitrogen-reduction routes; a realized nitrite loop and its contribution
    were not directly measured.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: anammox-granule heterotrophic flanking bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  - preferred_term: Brocadia-affiliated anammox bacterium AMX1
    term:
      id: NCBITaxon:795830
      label: Candidatus Brocadia sinica
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  evidence:
  - reference: doi:10.1038/ncomms15416
    snippet: All heterotrophs expressed respiratory nitrate reductase genes
    explanation: Same-study results support nitrate-reduction potential. They do not prove nitrite return or complete
      nitrate-to-dinitrogen denitrification by every participant.
    evidence_source: COMPUTATIONAL
    supports: PARTIAL
- name: EPS Peptide Scavenging by Chlorobi
  description: HYPOTHESIZED - highly expressed peptidases and peptide/amino-acid transport genes support Chlorobi-affiliated
    protein scavenging. Extracellular localization and anammox-derived EPS as the substrate are inferred; transfer
    to other community members was not directly demonstrated.
  interaction_type: CROSS_FEEDING
