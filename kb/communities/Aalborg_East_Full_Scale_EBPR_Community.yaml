      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at p__ rank; 3 GTDB taxa under the NCBI taxon]
    notes: Tetrasphaera-related Actinobacteria were abundant by qFISH but underrepresented in the metagenome,
      likely because of DNA extraction bias against gram-positive bacteria.
  functional_role:
  - PRIMARY_DEGRADER
  abundance_level: DOMINANT
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The organisms facilitating EBPR are called polyphosphate accumulating organisms (PAOs)
      and the most important PAOs have been identified using culture independent methods as Candidatus
      Accumulibacter phosphatis and the actinobacterial genus Tetrasphaera.
    explanation: Supports Tetrasphaera-related Actinobacteria as polyphosphate-accumulating members of EBPR
      communities.
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: It is evident that actinobacteria (3% vs 30%), chloroflexi (3% vs 17%) and TM7 (0.3%
      vs 5%) were underrepresented in the metagenome compared with the qFISH data
    explanation: Supports substantial actinobacterial abundance in qFISH data and highlights metagenomic
