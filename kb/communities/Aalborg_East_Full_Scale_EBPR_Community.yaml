    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bacteria providing substrate to the PAOs, such as fermenters, and bacteria involved in hydrolysis
      of macromolecules
    explanation: Supports a functionally important flanking bacterial community around PAOs.
related_ingredients:
- preferred_term: phosphate
  chebi_term:
    id: CHEBI:18367
    label: phosphate(3-)
  relevance: >
    Phosphate is the target nutrient removed from wastewater by the EBPR process,
    and the community metagenome was enriched for phosphate metabolism genes.
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The genetic potential for community function showed enrichment of genes involved in phosphate
      metabolism and biofilm formation, reflecting the selective pressure of the EBPR process.
    explanation: Phosphate metabolism is a selected functional potential of the EBPR community.
- preferred_term: polyphosphate
  chebi_term:
    id: CHEBI:16838
    label: polyphosphate
  relevance: >
    Polyphosphate is the intracellular phosphorus storage polymer accumulated by the
    polyphosphate accumulating organisms (PAOs) that drive enhanced biological phosphorus removal.
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The organisms facilitating EBPR are called polyphosphate accumulating organisms (PAOs) and
      the most important PAOs have been identified using culture independent methods as Candidatus Accumulibacter
      phosphatis and the actinobacterial genus Tetrasphaera.
    explanation: Identifies the PAOs that accumulate polyphosphate as central to the EBPR community.
ecological_interactions:
- name: PAO Phosphate Storage Under EBPR Selection
  description: EBPR process cycling selects for bacteria that accumulate and use intracellular polyphosphate,
    enabling phosphorus removal from wastewater.
  interaction_type: NICHE_PARTITIONING
  source_taxon:
    preferred_term: Candidatus Accumulibacter phosphatis and related PAOs
    term:
      id: NCBITaxon:28216
      label: Betaproteobacteria
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:18367
      label: phosphate(3-)
  biological_processes:
  - preferred_term: phosphate-containing compound metabolic process
    term:
      id: GO:0006796
      label: phosphate-containing compound metabolic process
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The genetic potential for community function showed enrichment of genes involved in phosphate
      metabolism and biofilm formation, reflecting the selective pressure of the EBPR process.
    explanation: Supports phosphate metabolism as a selected community function in full-scale EBPR sludge.
- name: Flanking-Community Substrate Provision To PAOs
  description: Fermenters and macromolecule-hydrolyzing bacteria provide substrates to polyphosphate-accumulating
    organisms, linking community trophic structure to phosphorus removal.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: EBPR flanking bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
    preferred_term: Candidatus Accumulibacter phosphatis and related PAOs
    term:
      id: NCBITaxon:28216
      label: Betaproteobacteria
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bacteria providing substrate to the PAOs, such as fermenters, and bacteria involved in hydrolysis
      of macromolecules
    explanation: Supports cross-feeding from flanking heterotrophs to PAOs.
- name: Sludge Floc and Biofilm Formation
  description: Activated sludge biomass retention depends on floc and biofilm formation, and the EBPR
    metagenome was enriched for genes linked to cell wall, capsule, and extracellular macromolecule functions.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: EBPR flanking bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: A relatively high number of proteins was assigned to cell wall and capsule formation.
    explanation: Supports biofilm/floc-associated functional potential in the EBPR metagenome.
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: strong selective pressure on activated sludge bacteria for effective floc/biofilm formation
      that leads to the good settling properties that are required to retain the biomass in the plant.
    explanation: Supports sludge floc and biofilm formation as a retention mechanism in the engineered
      community.
environmental_factors:
- name: Full-scale Aalborg East WWTP operating context
  value: domestic wastewater; stable EBPR; greater than 95% incoming phosphorus removed
  description: The community was sampled from a municipal full-scale EBPR plant with long-term stable
    phosphorus removal performance.
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The plant treats mainly domestic wastewater and serves 100 000 person equivalents with
      an average load of 45 000 person equivalents.
    explanation: Supports the full-scale municipal wastewater treatment context.
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The plant had stable EBPR performance for several years prior to the time of sampling removing
      >95% of the incoming P
    explanation: Supports stable phosphorus removal performance.
- name: Anaerobic-anoxic-oxic process cycling
  value: anaerobic tank plus alternating denitrifying anoxic and nitrifying oxic conditions
  description: EBPR process zones impose redox and substrate cycling that selects PAOs, nitrifiers, denitrifiers,
    and floc-forming bacteria.
  evidence:
  - *ebpr_plant
