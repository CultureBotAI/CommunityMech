id: CommunityMech:000139
name: Aalborg East Full-Scale EBPR Activated Sludge Community
description: An engineered full-scale activated sludge microbial community from the Aalborg East wastewater
  treatment plant in Denmark carrying out enhanced biological phosphorus removal. The community was profiled
  with an 18.2 Gb Illumina metagenome and qFISH, revealing phosphate-removal organisms including
  Candidatus Accumulibacter and Tetrasphaera-related Actinobacteria, flanking substrate-providing bacteria,
  and metagenomic enrichment for phosphate metabolism and biofilm/floc formation functions.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Remove phosphorus from municipal wastewater using enhanced biological phosphorus removal.
  assembly_strategy: Full-scale wastewater treatment operation selected an activated sludge community under
    anaerobic, anoxic, and oxic process zones rather than deliberate assembly from isolates.
  perturbation_design: The plant configuration included an anaerobic tank and alternating denitrifying
    anoxic and nitrifying oxic conditions.
  measurement_endpoints:
  - phosphorus removal
  - qFISH community structure
  - metagenomic functional potential
  - Accumulibacter microdiversity
  evidence:
  - &ebpr_plant
    reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The plant has a biodenipho configuration, which includes an anaerobic tank and a tank with
      alternating denitrifying anoxic and nitrifying oxic conditions.
    explanation: Supports the full-scale EBPR process configuration used to select and maintain the community.
environment_term:
  preferred_term: full-scale enhanced biological phosphorus removal activated sludge
  term:
    id: ENVO:00002046
    label: activated sludge
  notes: Activated sludge was sampled from the aeration tank of the Aalborg East wastewater treatment plant.
