      total_genomes: 41937
      is_reclassified: true
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at c__ rank; 1 GTDB taxa under the NCBI taxon]
    notes: Accumulibacter is represented with the validated Betaproteobacteria class term because the record
      captures the full-scale community and clade-level microdiversity rather than a cultured isolate.
  functional_role:
  - PRIMARY_DEGRADER
  - CROSS_FEEDER
  abundance_level: DOMINANT
  abundance_value: 4.8% of all bacteria by qFISH
  evidence:
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Accumulibacter accounted for only 4.8% of all bacteria by qFISH, but the depth of sequencing
      enabled detailed insight into their microdiversity in the full-scale plant.
    explanation: Supports Accumulibacter membership, abundance, and strain-level diversity in the full-scale
      EBPR community.
  - reference: PMID:22170425
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The organisms facilitating EBPR are called polyphosphate accumulating organisms (PAOs) and
      the most important PAOs have been identified using culture independent methods as Candidatus Accumulibacter
      phosphatis
    explanation: Supports the PAO role of Accumulibacter in EBPR activated sludge.
- taxon_term:
    preferred_term: Tetrasphaera-related actinobacterial PAOs
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:p__Actinomycetota
