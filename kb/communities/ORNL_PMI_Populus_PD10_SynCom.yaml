  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For 16S rRNA gene amplicon sequencing, three members dominate in abundance when grown in R2A complex
      medium, and Pantoea sp. YR343 is the member with highest content after 15 passages
    explanation: Supports Pantoea-dominated R2A community membership in the 16S time series.
  - reference: PMID:33995895
