    term:
      id: NCBITaxon:379
      label: Rhizobium
  - preferred_term: Sphingobium sp. AP49
    term:
      id: NCBITaxon:165695
      label: Sphingobium
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In MOPS medium, Pseudomonas sp. GM17 is the most abundant member along with three other strains, Variovorax
      sp. CF313, Rhizobium sp. CF142 and Sphingobium sp. AP49, that persist in consistent proportions
    explanation: Supports the four-strain MOPS survivor set and its stable coexistence.
- name: R2A Pantoea-Dominated Stable Community
  description: In R2A, YR343, GM17 and AP49 dominated the 16S profile, with stable coexistence reported from passage
    10 and YR343 most abundant after 15 passages. Metaproteomics recovered notable BC15 proteins and different YR343
    proportions. Sporulation-related detection bias and relic DNA were proposed explanations; protein-relative abundance
    is not a direct viable-cell count or proof of a uniform four-strain abundance ranking.
  scope: COMMUNITY_LEVEL
