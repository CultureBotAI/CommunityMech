id: CommunityMech:000047
name: ORNL PMI Populus PD10 SynCom
description: A 10-member synthetic bacterial community (PD10) assembled by the Oak Ridge National Laboratory
  Plant-Microbe Interfaces (PMI) team from Populus deltoides rhizosphere isolates. The community was used
  as a bottom-up model system to study assembly dynamics, medium-dependent community structure, metabolic
  exchange, and antagonistic interactions during stable community formation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Isolates were recovered from Populus deltoides rhizosphere and assembled in vitro.
engineering_design:
  objective: Quantify assembly dynamics and interaction mechanisms in a defined Populus rhizosphere SynCom.
  assembly_strategy: Bottom-up assembly of 10 Populus deltoides rhizosphere isolates into a defined community.
  passaging_regimen: Serial passaging in two media environments until stable membership emerged.
  perturbation_design: Medium perturbation using complex R2A versus minimal MOPS growth conditions.
  measurement_endpoints:
  - Time-series strain abundance profiling
  - Flux balance analysis of potential metabolic exchange
  - Identification of selective antagonistic interactions
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, 10 bacterial strains isolated from the Populus deltoides rhizosphere were
      combined and passaged in two different media environments to form stable microbial communities
    explanation: Supports bottom-up assembly and medium-dependent passaging design.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The membership and relative abundances of the strains stabilized after around 5 growth cycles
      and resulted in just a few dominant strains that depended on the medium
    explanation: Supports stabilization dynamics under serial passaging.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: To unravel the underlying metabolic interactions, flux balance analysis was used to model
      microbial growth and identify potential metabolic exchanges involved in shaping the microbial communities
    explanation: Supports use of FBA as a core measurement endpoint in the design.
