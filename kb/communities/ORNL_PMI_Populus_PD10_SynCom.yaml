  - preferred_term: biogenic amine
    term:
      id: CHEBI:50790
      label: biogenic amine
  downstream:
  - target: R2A Pantoea-Dominated Stable Community
    description: FBA-predicted export by Pantoea provides a computational exchange mechanism for
      R2A community persistence.
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In the community model using R2A medium, metabolite exchange can also be predicted. Here,
      the dominant strain Pantoea sp. YR343, based on the 16S rRNA marker data, is expected
      to export a greater range of metabolites than it receives from the other two members of the community
