- name: MOPS Minimal-Medium Four-Strain Coexistence
  description: In MOPS-glucose, GM17 dominated while CF313, CF142 and AP49 persisted in consistent relative proportions
    from approximately passage 4. This positive coexistence result does not establish obligate mutualism or niche
    partitioning. The paper also predicts MOPS-specific exchanges, but their missing graph structure requires separate
    causal research and must not be borrowed from the distinct R2A model.
