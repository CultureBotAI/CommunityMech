ecological_interactions:
- name: Medium-Dependent Stable Community Assembly
  description: Serial passaging of the same ten-strain Populus rhizosphere inoculum in R2A versus
    MOPS-glucose produced distinct stable communities after the first several growth cycles.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: MOPS Minimal-Medium Four-Strain Coexistence
    description: The MOPS-glucose condition selected a stable community dominated by Pseudomonas,
      Variovorax, Rhizobium, and Sphingobium.
  - target: R2A Pantoea-Dominated Stable Community
    description: The R2A condition selected a community dominated by Pantoea, Pseudomonas,
      Sphingobium, and viable Bacillus biomass.
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, 10 bacterial strains isolated from the Populus deltoides rhizosphere were
      combined and passaged in two different media environments to form stable microbial communities
    explanation: Supports medium-dependent stable-community assembly from a defined ten-strain
      rhizosphere inoculum.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The membership and relative abundances of the strains stabilized after around 5 growth cycles
      and resulted in just a few dominant strains that depended on the medium
    explanation: Supports medium-dependent convergence to a few dominant surviving strains.
- name: Selective Antagonism During Assembly
  description: Pairwise screens showed that Pseudomonas was antagonistic to most other members, while
    Pantoea showed positive interactions with several strains, implicating both competition and
    facilitation in final community selection.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  participating_taxa:
  - preferred_term: Pseudomonas sp. GM17
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
  - preferred_term: Pantoea sp. YR343
    term:
      id: NCBITaxon:53335
      label: Pantoea
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas sp. GM17 cells were antagonistic to the growth of the majority of the other
      community members, while Pantoea sp. YR343 demonstrated positive interactions with several strains
    explanation: Supports selective antagonism and positive pairwise interactions as experimentally
      screened assembly mechanisms.
- name: Pantoea-Centered R2A Metabolite Export
  description: The R2A community FBA model predicted that dominant Pantoea sp. YR343 exports more
    metabolite classes than it receives from the other R2A community members.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
