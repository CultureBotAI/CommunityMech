ecological_interactions:
- name: Medium-Dependent Serial-Passage Selection
  description: Serial passage of the same ten-strain inoculum in MOPS-glucose versus R2A selected distinct persistent
    communities. The controlled medium comparison supports medium-dependent assembly, not uniquely demonstrated
    niche partitioning. Main-text trajectories distinguish the MOPS four-strain pattern from passage 4 and R2A stable
    coexistence from passage 10; the abstract summary of about five cycles is not a universal threshold.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: MOPS Minimal-Medium Four-Strain Coexistence
    description: Serial passage in the MOPS-glucose condition selected the persistent Pseudomonas, Variovorax, Rhizobium
      and Sphingobium assemblage, in contrast to the R2A outcome from the same inoculum. The condition-to-composition
      effect is supported without isolating nutrient competition from proposed exchange mechanisms.
  - target: R2A Pantoea-Dominated Stable Community
    description: Serial passage in the R2A condition selected the Pantoea-dominated 16S assemblage with Pseudomonas
      and Sphingobium, while metaproteomics also recovered notable Bacillus proteins. The medium effect on community
      composition is retained without equating protein-relative abundance with directly counted viable biomass.
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, 10 bacterial strains isolated from the Populus deltoides rhizosphere were combined and
      passaged in two different media environments to form stable microbial communities
    explanation: Supports medium-dependent stable-community assembly from a defined ten-strain rhizosphere inoculum.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The membership and relative abundances of the strains stabilized after around 5 growth cycles and resulted
      in just a few dominant strains that depended on the medium
    explanation: Supports medium-dependent convergence to a few dominant surviving strains.
- name: Pairwise Growth Phenotypes on R2A Agar
  description: R2A agar pairwise screens found GM17-associated inhibition of multiple lawns and YR343-associated
    growth promotion of CF142 and CF313. These are measured colony phenotypes, not a direct test of their contribution
    to liquid-community selection or a uniquely established nutrient-competition or antimicrobial mechanism. AP49,
    CF142 and CF313 still coexisted with GM17 in liquid culture; positive exchanges and the agar-versus-liquid conditions
    are alternative explanations.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  participating_taxa:
  - preferred_term: Pseudomonas sp. GM17
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
  - preferred_term: Pantoea sp. YR343
    term:
      id: NCBITaxon:53335
      label: Pantoea
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas sp. GM17 cells were antagonistic to the growth of the majority of the other community members,
      while Pantoea sp. YR343 demonstrated positive interactions with several strains
    explanation: Supports the positive and negative pairwise agar phenotypes. Their mediation of liquid-community
      assembly was proposed, not directly established by this assay.
- name: Pantoea-Centered R2A Metabolite Export
  description: HYPOTHESIZED - In the three-member R2A community FBA model, Pantoea sp. YR343 exports predicted organic
    acids, purine derivatives and biogenic amines that could support other modeled members, Pseudomonas sp. GM17
    and Sphingobium sp. AP49. This is a constrained, gapfilled model conditioned on endpoint 16S proportions; pathway
    proteins support metabolic capacity, not measured exchange flux or proof that export caused long-term persistence.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Pantoea sp. YR343
    term:
      id: NCBITaxon:53335
      label: Pantoea
  metabolites:
  - preferred_term: organic acid
    term:
      id: CHEBI:64709
      label: organic acid
  downstream:
  - target: R2A Pantoea-Dominated Stable Community
    description: HYPOTHESIZED - Predicted YR343 secretion could provide growth substrates that help sustain the
      R2A partners. The source proposes this mechanism, but FBA uses final community proportions as inputs and does
      not independently establish temporal assembly or measured cross-feeding; enzyme detection is not exchange-flux
      validation.
  evidence:
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In the community model using R2A medium, metabolite exchange can also be predicted. Here, the dominant
      strain Pantoea sp. YR343, based on the 16S rRNA marker data, is expected to export a greater range of metabolites
      than it receives from the other two members of the community
    explanation: Supports Pantoea as the dominant modeled metabolite exporter in the R2A community.
  - reference: PMID:33995895
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Organic acids, purine derivatives and biogenic amines are predicted to be excreted and support the
      growth of the other community members
    explanation: Identifies the metabolite classes predicted to support other R2A community members.
