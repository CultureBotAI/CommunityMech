- name: Cooperative Infant-Gut HMO Mutualism
  description: E. coli K12 and the infant-stool B. bifidum isolate co-grew in modified M9 with 0.5% 2-fucosyllactose
    and without added cysteine or casamino acids. Cysteine dependence, viable-partner controls and measured sugar
    utilization support reciprocal benefit in this restricted laboratory model. This node summarizes that exchange
    rather than adding a separate downstream outcome. Its prevalence, strength and effect on E. coli abundance in
    living infants remain untested.
