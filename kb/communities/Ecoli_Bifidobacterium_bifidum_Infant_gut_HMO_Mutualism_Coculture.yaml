discussions:
- discussion_id: hmo_mutualism_flux_and_host_boundary
  prompt: How strongly does the measured laboratory exchange operate in the infant gut?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cysteine provision enabling cooperative 2'-fucosyllactose degradation
  - ecological_interactions#Monosaccharide return sustaining E. coli growth
  - ecological_interactions#Cooperative Infant-Gut HMO Mutualism
  rationale: 'The K12 donor and infant B. bifidum isolate support nutrient-limited reciprocal cooperation, not a
    universal species-level interaction or demonstrated regulation of E. coli abundance in vivo. Chromatographic
    sugar data and a delta-cysE control do not resolve cysteine release route, export rate or isotope-resolved feedback.
    The pH-adjusted spent-medium assay is distinct from the live coculture. The sugar-to-mutualism summary arrow
    is removed as a part/whole restatement, not an independently supported causal consequence. Experimental-strain
    and 0.1% screening versus 0.5% coculture metadata remain under #1428.'
