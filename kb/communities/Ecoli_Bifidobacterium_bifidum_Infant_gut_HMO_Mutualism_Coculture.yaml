ecological_interactions:
- name: Cysteine provision enabling cooperative 2'-fucosyllactose degradation
  description: In the nutrient-limited in vitro model, E. coli K12 supplies the cysteine requirement of an infant-stool
    B. bifidum isolate, enabling growth and 2-fucosyllactose degradation without added cysteine or casamino acids.
    The delta-cysE donor control impaired coculture growth and ethanol-killed partner controls failed to support
    it. This supports cysteine-dependent cooperation, not a measured cysteine export rate or proof of active secretion
    rather than overflow or lysis.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  target_taxon:
    preferred_term: Bifidobacterium bifidum
    term:
      id: NCBITaxon:1681
      label: Bifidobacterium bifidum
  metabolites:
  - preferred_term: cysteine
    term:
      id: CHEBI:15356
      label: cysteine
  - preferred_term: 2'-fucosyllactose
    term:
      id: CHEBI:147155
      label: 2'-fucosyllactose
  downstream:
  - target: Monosaccharide return sustaining E. coli growth
    description: Cysteine-dependent support from E. coli permits the auxotrophic B. bifidum partner to grow and
      degrade 2-fucosyllactose under the tested nutrient limitation, releasing sugar substrates usable by E. coli.
      The mutant and killed-partner controls support the dependency; the sugar-consumption assay separately required
      spent-medium pH adjustment to 6.3.
  evidence:
  - reference: PMID:42020426
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: E. coli supplies cysteine to its auxotrophic partner, facilitating cooperative degradation of 2'-fucosyllactose,
      the predominant human milk oligosaccharide
    explanation: Supports reciprocal in vitro cross-feeding in the tested strain pair; does not establish host abundance
      regulation, a cysteine export route or universal infant-gut mutualism.
  - reference: PMID:42020426
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: observing a significant impairment of growth
    explanation: The delta-cysE comparison supports the cysteine dependence discussed in Results, without quantifying
      donor export.
- name: Monosaccharide return sustaining E. coli growth
  description: B. bifidum degraded 2-fucosyllactose and left fucose and galactose that E. coli K12 subsequently
    consumed, measured by chromatography. E. coli grew in this spent medium only after pH readjustment from 4.3
    to 6.3. This measured in vitro return of carbon does not establish that the same exchange controls E. coli abundance
    in infants or quantify sugar-to-cysteine flux in coculture.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
