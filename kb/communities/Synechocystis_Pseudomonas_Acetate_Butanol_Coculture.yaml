id: CommunityMech:000363
name: Synechocystis-Pseudomonas Acetate-Butanol Coculture
description: >
  A two-member photosynthetic synthetic consortium pairing acetate-secreting
  Synechocystis sp. PCC 6803 WT_PKPa_RBS_BsPta_Δacs with a Pseudomonas
  taiwanensis VLB120 derivative engineered with the TPC4 1-butanol pathway
  under the Pem7 promoter. The coculture was grown for 42 days in illuminated
  CoBG11 with repeated medium replacement, added bicarbonate, and pH adjustment.
  The system tests whether Synechocystis can route light- and CO2-derived carbon
  through extracellular acetate toward heterotrophic production of the bulk
  chemical 1-butanol.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Couple photosynthetic CO2 fixation and acetate secretion by engineered
    Synechocystis to 1-butanol formation by an acetate-adapted engineered
    Pseudomonas taiwanensis VLB120 heterotroph.
  assembly_strategy: >
    Pair the acetate-producing WT_PKPa_RBS_BsPta_Δacs Synechocystis farmer with
    P. taiwanensis_Pem7_ButOH, a VLB120 derivative carrying the oxygen-tolerant
    TPC4 1-butanol pathway.
  perturbation_design: >
    Compare the P. taiwanensis and E. coli acetate-to-butanol cocultures against
    an axenic Synechocystis culture while periodically replacing 10% of the
    medium during a 42-day illuminated closed-flask experiment.
  measurement_endpoints:
  - Pseudomonas CFU per mL
  - Synechocystis chlorophyll a concentration
  - acetate titer
  - 1-butanol titer
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: forming two distinct consortia
    explanation: Supports curating one of the two reported synthetic consortia.
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. taiwanensis_Pem7_ButOH
    explanation: Supports the engineered Pseudomonas strain used in this consortium.
