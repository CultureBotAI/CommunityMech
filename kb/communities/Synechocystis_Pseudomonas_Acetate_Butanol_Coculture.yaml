  working_volume_unit: mL
  operating_temperature: 30.0
  operating_temperature_unit: °C
  ph_controlled: true
  controls_notes: >
    Illumination, partial medium replacement, bicarbonate addition, and pH
    adjustment were controlled by the protocol. Cultures were sampled every
    2 days through day 30 and every 4 days through day 42.
  notes: >
    The experiment sampled and replenished 2.5 mL of a 25 mL culture each cycle,
    with bicarbonate supplementation and HCl pH adjustment at each refresh.
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 25 mL and closed system was applied
    explanation: Supports the closed-flask system and working volume.
  - reference: PMID:42726284
