discussions:
- discussion_id: pseudomonas_butanol_coculture_carbon_specificity
  prompt: >
    What fraction of Pseudomonas carbon in the coculture came from
    Synechocystis-derived acetate rather than extracellular polysaccharides or
    other cyanobacterial exudates?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Photosynthetic Acetate Supply To Pseudomonas
  rationale: >
    The paper reports lower acetate levels in the P. taiwanensis coculture than
    in axenic Synechocystis and uses acetate as the designed exchange
    metabolite, but it did not isotope-resolve Pseudomonas carbon uptake.
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we cannot conclude that the heterotrophic bacteria used acetate as the only source of carbon
    explanation: >
      Records the authors' caveat that other cyanobacterial carbon pools may
      have contributed to heterotroph growth.
