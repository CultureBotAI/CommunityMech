        id: CHEBI:26710
        label: sodium chloride
  - name: TES
    concentration: '13.1'
    unit: mM
  - name: kanamycin
    concentration: '50'
    unit: ug/mL
  ph: '8.0'
  temperature: '30'
  temperature_unit: C
  light_regime: illuminated
  light_intensity: '65'
  light_intensity_unit: umol photons m^-2 s^-1
  inoculum_source: >
    BG11/CoBG11 precultures of Synechocystis WT_PKPa_RBS_BsPta_Δacs and
    acetate-adapted P. taiwanensis_Pem7_ButOH.
  inoculum_size: Synechocystis OD750 2.5 and Pseudomonas OD600 0.5 at coculture day 0
  incubation_time: '42'
  incubation_time_unit: d
  vessel_type: Biolite 25 cm2 plug-sealed tissue culture flasks
  preparation_notes: >
    CoBG11 was prepared as BG11 supplemented with TES adjusted to pH 8.0,
    ammonium chloride, sodium chloride, kanamycin, and 50 mM bicarbonate. The
    synthetic consortium used 25 mL of CoBG11 in a closed flask because
    1-butanol is volatile. From day 0 to day 30, 2.5 mL of culture was removed
    every second day and replaced with fresh CoBG11 containing kanamycin and
    bicarbonate; after day 30, the refresh interval was every 4 days.
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a triplicate of Synechocystis and P. taiwanensis VLB120
    explanation: Supports the exact member pair in the synthetic-consortium experiment.
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: BG11 supplied with 4 mM NH4Cl, 13.1 mM
    explanation: Supports the CoBG11 base medium and ammonium chloride/TES supplementation.
