related_ingredients:
- preferred_term: butyrate
  chebi_term:
    id: CHEBI:17968
    label: butyrate
  relevance: >
    Butyrate is the central growth substrate of this triculture; S. wolfei
    syntrophically oxidizes butyrate, and ES5 addition increased the rate of
    butyrate consumption.
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: rates of butyrate consumption
    explanation: Anchors butyrate as the oxidized substrate whose consumption rate increased.
- preferred_term: methane
  chebi_term:
    id: CHEBI:16183
    label: methane
  relevance: >
    Methane is the terminal product generated by M. hungatei from interspecies
    electron carriers; volumetric methane production was the key performance
    output that increased after ES5 addition.
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: volumetric methane production
    explanation: Anchors methane as the terminal methanogenic product measured in the coculture.
- preferred_term: dihydrogen
  chebi_term:
    id: CHEBI:18276
    label: dihydrogen
  relevance: >
    Hydrogen is an interspecies electron carrier transferred from the
    butyrate-oxidizing bacterium to the hydrogen-scavenging methanogen
    M. hungatei, enabling thermodynamically favorable syntrophy.
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: hydrogen/formate-scavenging methanogenic archaea
    explanation: Anchors hydrogen as a scavenged interspecies electron carrier consumed by the methanogen.
- preferred_term: formate
  chebi_term:
    id: CHEBI:15740
    label: formate
  relevance: >
    Formate is the second interspecies electron carrier scavenged by the
    methanogenic partner M. hungatei, providing the reducing equivalents that
    couple butyrate oxidation to methanogenesis.
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: hydrogen/formate-scavenging methanogenic archaea
    explanation: Anchors formate as a scavenged interspecies electron carrier consumed by the methanogen.
