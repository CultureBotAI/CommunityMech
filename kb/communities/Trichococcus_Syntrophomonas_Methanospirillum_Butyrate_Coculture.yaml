id: CommunityMech:000188
name: Trichococcus-Syntrophomonas-Methanospirillum Butyrate Coculture
description: >
  A defined anaerobic three-member coculture in which fermentative
  Trichococcus flocculiformis strain ES5 stimulates the syntrophic
  butyrate-oxidizing partnership between Syntrophomonas wolfei and
  Methanospirillum hungatei. The system extends the classic two-member
  fatty-acid syntrophy model by adding a fermentative bacterium that increases
  butyrate consumption and methane production and aggregates with the
  syntrophic partners. It is relevant to DOE anaerobic carbon cycling,
  wastewater treatment bioreactors, and engineered methanogenic consortia.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: >
    Test how addition of fermentative T. flocculiformis ES5 influences
    syntrophic butyrate oxidation and methane generation in a defined
    S. wolfei and M. hungatei coculture.
  assembly_strategy: >
    Add T. flocculiformis ES5 to a cultured syntrophic coculture of
    S. wolfei and M. hungatei under anaerobic butyrate-oxidizing conditions.
  measurement_endpoints:
  - Butyrate consumption rate
  - Volumetric methane production rate
  - Scanning electron microscopy of mixed-culture aggregates
  - Coculture proteome with and without the fermentative bacterium
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: experimental observations of stimulated butyrate oxidation and methane generation
    explanation: Supports the experimental objective focused on butyrate oxidation and methane output.
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: due to the addition of a fermentative Trichococcus flocculiformis strain ES5
    explanation: Supports the assembly strategy that adds T. flocculiformis ES5 to syntrophic cocultures.
