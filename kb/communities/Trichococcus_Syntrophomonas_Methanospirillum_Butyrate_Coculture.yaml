ecological_interactions:
- name: Fermenter-Stimulated Butyrate Oxidation and Methane Production
  description: Adding T. flocculiformis ES5 stimulated the S. wolfei-M. hungatei culture, most clearly by shortening
    the lag before conversion. In the exact-pair comparison, Table 1 marks the methane lag difference significant,
    not the fitted maximum production-rate or final-concentration differences. The Discussion reports similar butyrate-consumption
    slopes with and without ES5. Abstract-wide 120%/150% wording is not an exact-triculture increase estimate. This
    is a three-member outcome, not an ES5-to-S. wolfei syntrophic exchange.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: statistically significant change in the lag phase of the S. wolfei and M. hungatei when cultured with
      T. flocculiformis ES5.
    explanation: The main Results identify the significant exact-pair lag response; Table 1 marks lag, not the rate
      or final concentration, for this pairing.
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: butyrate consumption rates were similar regardless of presence of T. flocculiformis ES5 in the syntroph-methanogen
      coculture
    explanation: The Discussion bounds the general stimulation claim and separates lag from consumption slope.
  participating_taxa:
  - preferred_term: Trichococcus flocculiformis strain ES5
    term:
      id: NCBITaxon:82803
      label: Trichococcus flocculiformis
  - preferred_term: Syntrophomonas wolfei
    term:
      id: NCBITaxon:863
      label: Syntrophomonas wolfei
  - preferred_term: Methanospirillum hungatei
    term:
      id: NCBITaxon:2203
      label: Methanospirillum hungatei
- name: Aggregation With Syntrophic Partners
  description: SEM of the exact three-member culture showed ES5 in close spatial association with both syntrophic
    partners and altered aggregation relative to the biculture. This is a community morphology observation, not
    an isolated directional colonization benefit or proof of conductive bridging.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Fermenter-Stimulated Butyrate Oxidation and Methane Production
    description: 'HYPOTHESIZED/PARTIAL: ES5-associated aggregation could contribute to the shorter conversion lag,
      but morphology was not selectively manipulated to show mediation. Conductive bridging and DIET remain proposed
      explanations, not demonstrated routes.'
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: very close proximity of T. flocculiformis ES5 cells to the cells of M. hungatei (as well as to the
      cells of S. wolfei)
    explanation: Supports association with both canonical partners, not a single directed recipient.
  participating_taxa:
  - preferred_term: Trichococcus flocculiformis strain ES5
    term:
      id: NCBITaxon:82803
      label: Trichococcus flocculiformis
  - preferred_term: Syntrophomonas wolfei
    term:
      id: NCBITaxon:863
      label: Syntrophomonas wolfei
  - preferred_term: Methanospirillum hungatei
    term:
      id: NCBITaxon:2203
      label: Methanospirillum hungatei
- name: Proteome Response in the Syntrophic Partners
  description: Comparative proteomics of the two syntrophic partners with and without ES5 detected differential
    protein abundance. Additional S. wolfei butyryl-CoA dehydrogenase and electron-transfer flavoprotein were more
    abundant in the triculture; many candidate M. hungatei signaling proteins were instead more abundant in the
    biculture. These observations do not directly measure enzyme activation, prove a signaling mechanism or establish
    a second syntrophic exchange. ES5 is the added member; the assayed proteomes belong to S. wolfei and M. hungatei.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  downstream:
  - target: Fermenter-Stimulated Butyrate Oxidation and Methane Production
    description: 'HYPOTHESIZED/PARTIAL: changes in partner protein abundance may contribute to the shorter lag associated
      with ES5 addition. The comparison does not selectively establish enzymatic or signaling mediation, and protein
      abundance is not a direct activity assay.'
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: differential proteomics to compare protein expression profiles of the Syntrophomonas wolfei and Methanospirillum
      hungatei with or without the addition of the fermentative microorganism
    explanation: Defines the two measured proteomes and ES5 perturbation.
  - reference: PMID:35699440
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: it is not clear whether the presence of T. flocculiformis ES5 alone was activating production of this
      enzyme.
    explanation: The source explicitly withholds direct enzyme-activation attribution.
  participating_taxa:
  - preferred_term: Trichococcus flocculiformis strain ES5
    term:
      id: NCBITaxon:82803
      label: Trichococcus flocculiformis
  - preferred_term: Syntrophomonas wolfei
    term:
      id: NCBITaxon:863
      label: Syntrophomonas wolfei
  - preferred_term: Methanospirillum hungatei
    term:
      id: NCBITaxon:2203
      label: Methanospirillum hungatei
