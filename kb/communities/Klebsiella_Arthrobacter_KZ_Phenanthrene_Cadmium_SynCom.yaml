id: CommunityMech:000344
name: Klebsiella-Arthrobacter KZ Phenanthrene-Cadmium SynCom
description: >-
  A defined two-isolate bacterial consortium, KZ, assembled from Klebsiella sp.
  CW-D3T and Arthrobacter sp. SZ-3 to degrade phenanthrene under 25 mg/L Cd2+
  stress. KZ outperformed the two monocultures by 1.2-1.9-fold for
  phenanthrene degradation and mineralization under cadmium stress. The
  division of labor inferred from biomass-normalized enzyme assays assigned
  stronger upstream 2H1N conversion to SZ-3 and more than 80% of downstream
  mineralization to CW-D3T, while metagenomics associated cadmium tolerance with
  CW-D3T efflux-pump/antioxidant genes and the SZ-3 oxidative-stress response.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >-
    Construct a functionally specialized two-member bacterial consortium that
    coordinates PAH degradation with heavy-metal stress tolerance for
    phenanthrene mineralization under cadmium co-contamination.
  assembly_strategy: >-
    Assemble Klebsiella sp. CW-D3T with Arthrobacter sp. SZ-3 into the
    functionally specialized KZ bacterial consortium.
  perturbation_design: >-
    Compare KZ with the two monocultures during phenanthrene degradation and
    mineralization under 25 mg/L Cd2+ stress.
  measurement_endpoints:
  - Phenanthrene degradation and mineralization under cadmium stress
  - Biomass-normalized enzyme activity for upstream 2H1N conversion and downstream mineralization
  - Metagenomic inference of cadmium-response genes in each member
  notes: >-
    The accessible PubMed abstract supports the exact two-isolate KZ
    membership, the 25 mg/L Cd2+ stress condition, enhanced phenanthrene
    degradation and mineralization, and a high-level SZ-3/CW-D3T division of
    labor. It does not report the medium composition, the inoculation ratio, or
    the isolate source.
  evidence:
  - reference: PMID:41365368
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      functionally specialized bacterial consortium (KZ) by assembling
      Klebsiella sp. CW-D3T and Arthrobacter sp. SZ-3
    explanation: >-
      Supports the KZ name and exact Klebsiella-Arthrobacter two-isolate
      assembly.
  - reference: PMID:41365368
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      which synergistically enhanced phenanthrene (PHE) degradation and
      mineralization under cadmium stress (25 mg/L Cd2+), outperforming
      monocultures by 1.2-1.9-fold.
    explanation: >-
      Supports the phenanthrene/cadmium bioremediation objective and the
      reported monoculture comparison.
