ecological_interactions:
- name: SZ-3 to CW-D3T phenanthrene-mineralization division of labor
  description: >-
    Arthrobacter sp. SZ-3 supplied stronger upstream catalytic activity,
    measured as 50% higher 2H1N conversion, whereas Klebsiella sp. CW-D3T
    dominated downstream mineralization with more than 80% contribution in the
    biomass-normalized enzyme activity assays.
  interaction_type: NICHE_PARTITIONING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Arthrobacter sp. SZ-3
    term:
      id: NCBITaxon:1663
      label: Arthrobacter
  target_taxon:
    preferred_term: Klebsiella sp. CW-D3T
    term:
      id: NCBITaxon:570
      label: Klebsiella
  metabolites:
  - preferred_term: phenanthrene
    term:
      id: CHEBI:28851
      label: phenanthrene
  downstream:
  - target: Phenanthrene mineralization under cadmium stress
    description: >-
      The strain-level split between SZ-3 upstream 2H1N conversion and CW-D3T
      downstream mineralization was proposed to coordinate phenanthrene
      degradation and detoxification in the KZ consortium.
  evidence:
  - reference: PMID:41365368
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through biomass-normalized enzyme activity assays, we uncovered a
      structured division of labor: SZ-3 exhibited superior upstream catalytic
      activity (50 % higher 2H1N conversion), while CW-D3T dominated downstream
      mineralization (>80 % contribution).
    explanation: >-
      Supports complementary upstream and downstream phenanthrene-catabolism
      roles for the two KZ members.
