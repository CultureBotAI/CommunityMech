  functional_role:
  - PRIMARY_PRODUCER
  - CROSS_FEEDER
ecological_interactions:
- name: Yeast Carbon Dioxide Provisioning
  description: In the sealed illuminated coculture, yeast glucose metabolism supplies carbon dioxide assimilated
    by the algal partner. This is the carbon arm of the authors' experimentally supported reciprocal carbon/nitrogen
    mutualism. The source does not isolate fermentation as the only route of yeast carbon dioxide production.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  target_taxon:
    preferred_term: Chlamydomonas reinhardtii
    term:
      id: NCBITaxon:3055
      label: Chlamydomonas reinhardtii
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  downstream:
  - target: Algal Reduced Nitrogen Provisioning
    description: 'PARTIAL: yeast-derived carbon dioxide sustains the alga that supplies reduced nitrogen to yeast,
      closing the resource-dependence loop. Coculture and resource-availability comparisons support this reciprocal
      mechanism, but do not separately quantify how a change in carbon transfer changes ammonia release.'
  evidence:
  - reference: PMID:24994654
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. cerevisiae metabolizes glucose to carbon dioxide (CO2), a carbon source that C. reinhardtii fixes
      via photosynthesis
    explanation: Supports yeast glucose metabolism supplying the carbon dioxide fixed by the algal partner.
- name: Algal Reduced Nitrogen Provisioning
  description: Algal nitrite metabolism supplies ammonia usable by yeast in the carbon/nitrogen mutualism. The dependence
    is conditional on the resource environment, not an unconditional property of these species; external reduced
    nitrogen can remove yeast dependence on the alga.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chlamydomonas reinhardtii
    term:
      id: NCBITaxon:3055
      label: Chlamydomonas reinhardtii
  target_taxon:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  metabolites:
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Yeast Carbon Dioxide Provisioning
    description: 'PARTIAL: algal reduced nitrogen sustains yeast growth and therefore the yeast partner supplying
      carbon dioxide. This reciprocal support is consistent with the reported dependence, not a measured feedback
      gain or a separate temporal causal experiment.'
  evidence:
  - reference: PMID:24994654
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. reinhardtii reduces nitrite (NO2−) into ammonia (NH3) (14), which yeast can use as a nitrogen source
    explanation: Supports algal nitrite reduction to ammonia as the nitrogen source used by yeast.
environmental_factors:
- name: atmospheric carbon dioxide exclusion
  description: Preventing access to atmospheric carbon dioxide makes the alga depend on yeast-derived
    carbon dioxide and helps force obligate mutualism.
- name: glucose and nitrite availability
  description: Glucose and nitrite availability define the reciprocal carbon and nitrogen exchange
    environment; omitting either substrate prevents the designed mutualism.
related_ingredients:
- preferred_term: glucose
  chebi_term:
    id: CHEBI:17234
    label: glucose
  relevance: >
    Glucose is the carbon source supplied to the yeast partner; S. cerevisiae
    metabolizes it to carbon dioxide that feeds the alga in the engineered mutualism.
- preferred_term: carbon dioxide
  chebi_term:
    id: CHEBI:16526
    label: carbon dioxide
  relevance: >
    Carbon dioxide released by yeast glucose metabolism is fixed photosynthetically
    by C. reinhardtii, providing the carbon exchange that sustains the mutualism.
- preferred_term: nitrite
  chebi_term:
    id: CHEBI:16301
    label: nitrite
  relevance: >
    Nitrite is the oxidized nitrogen source provided to the alga, which reduces it
    to ammonia that the yeast can use as a nitrogen source.
- preferred_term: ammonia
  chebi_term:
    id: CHEBI:16134
    label: ammonia
  relevance: >
    Ammonia produced by algal nitrite reduction is the reduced nitrogen form that
    supports yeast growth in the reciprocal nitrogen exchange.
- preferred_term: galactose
  chebi_term:
    id: CHEBI:28260
    label: galactose
  relevance: >
    Galactose is reported as an alternative carbon source that, although less
    effective than glucose, can also sustain the yeast-alga mutualism.
- preferred_term: nitrate
  chebi_term:
    id: CHEBI:17632
    label: nitrate
  relevance: >
    Nitrate is reported as an alternative nitrogen source that, although less
    effective than nitrite, can also sustain the yeast-alga mutualism.
- preferred_term: ammonium chloride
  chebi_term:
    id: CHEBI:31206
    label: ammonium chloride
  relevance: >
    Ammonium chloride was used to supply ammonia directly to airtight cocultures,
    decoupling the yeast from its dependence on algal nitrogen reduction.
growth_media:
