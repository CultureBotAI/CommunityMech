environmental_factors:
- name: atmospheric carbon dioxide exclusion
  description: Preventing access to atmospheric carbon dioxide makes the alga depend on yeast-derived
    carbon dioxide and helps force obligate mutualism.
  evidence:
  - reference: PMID:24994654
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: preventing access to atmospheric CO2
    explanation: Supports sealed carbon-limited cultivation as an environmental condition.
- name: glucose and nitrite availability
  description: Glucose and nitrite availability define the reciprocal carbon and nitrogen exchange
    environment; omitting either substrate prevents the designed mutualism.
  evidence:
  - reference: PMID:24994654
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: glucose, or nitrite was omitted from the experiment
    explanation: Supports glucose and nitrite as required environmental substrates.
