id: CommunityMech:000165
name: Saccharomyces-Chlamydomonas Fungal-Algal Mutualism
description: >
  A two-member synthetic fungal-algal community pairing Saccharomyces cerevisiae with
  Chlamydomonas reinhardtii under engineered laboratory conditions that force reciprocal
  carbon and nitrogen exchange. Yeast metabolizes glucose and supplies carbon dioxide to
  the alga, while the alga photosynthetically releases oxygen and converts nitrite into
  reduced nitrogen that supports yeast growth.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Engineer a tractable two-species fungal-algal mutualism by imposing reciprocal carbon and
    nitrogen dependencies between model eukaryotes.
  assembly_strategy: Pair S. cerevisiae with C. reinhardtii in sealed illuminated cocultures containing
    glucose and oxidized nitrogen sources so that each partner supplies a limiting metabolite to the
    other.
  measurement_endpoints:
  - yeast and algal cell density
  - coculture productivity
  - reciprocal carbon and nitrogen exchange
  - evolved changes in mutualism strength
  evidence:
  - reference: PMID:24994654
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: obligate mutualism between the yeast Saccharomyces cerevisiae and the alga Chlamydomonas reinhardtii
    explanation: Supports the designed two-member fungal-algal community.
  - reference: PMID:24994654
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: reciprocal carbon and nitrogen exchange
    explanation: Supports the engineered dependency used to create the mutualism.
environment_term:
  preferred_term: laboratory fungal-algal coculture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Engineered sealed microtiter-plate cocultures maintained under laboratory illumination.
