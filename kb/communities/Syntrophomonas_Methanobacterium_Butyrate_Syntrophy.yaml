discussions:
- discussion_id: swol-mfor-biculture-proteomics-not-measured
  prompt: Why did 1.1 mM initial acetate stimulate methane production in the S. wolfei + M. formicicum biculture (Fig. S2)
    when it had no effect on the S. wolfei + M. hungatei biculture, and do the same proteomics patterns measured for the M.
    hungatei system hold in the M. formicicum biculture?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Syntrophic Butyrate Beta-Oxidation Coupled to Methanogenesis
  rationale: Doloman et al. (2022) performed quantitative proteomics and lactate/formate transfer follow-ups on the S. wolfei
    + M. hungatei biculture and triculture, not on the S. wolfei + M. formicicum biculture. Because M. formicicum MF lacks
    the organic carbon assimilation requirement of M. hungatei JF1, the physiological basis of the 1.1 mM acetate stimulation
    in the M. formicicum biculture remains an open question.
  evidence:
  - reference: PMID:35699440
    reference_title: Stimulating Effect of Trichococcus flocculiformis on a Coculture of Syntrophomonas wolfei and Methanospirillum
      hungatei.
    supports: SUPPORT
    evidence_source: full_text
    snippet: A bi-culture of the syntroph with M. formicicum was indeed positively affected (increased methane production)
      by a slightly elevated starting amount of acetate in the growth media.
    explanation: Documents the positive effect of starting acetate on the S. wolfei + M. formicicum biculture.
  posed_by: antigravity
  posed_date: '2026-11-05'
