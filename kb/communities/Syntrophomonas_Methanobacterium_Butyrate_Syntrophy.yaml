ecological_interactions:
- name: Syntrophic Butyrate Beta-Oxidation Coupled to Methanogenesis
  description: In the two-member S. wolfei G311 + M. formicicum MF biculture grown on 20 mM sodium butyrate, S. wolfei oxidizes
    butyrate to acetate while transferring reducing equivalents (hydrogen and formate) to M. formicicum for methanogenesis,
    yielding a 5.38 (0.43) day lag phase, a 0.15 (0.006)* mmol/L/day methane production rate, and 3.92 (0.23) mmol/L maximal
    methane concentration (Table 1, Fig. 2B). Supplementing the S. wolfei + M. formicicum biculture with 1.1 mM initial acetate
    positively stimulated methane production (Fig. S2).
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Syntrophomonas wolfei
    term:
      id: NCBITaxon:863
      label: Syntrophomonas wolfei
