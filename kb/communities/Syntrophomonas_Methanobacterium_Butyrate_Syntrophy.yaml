id: CommunityMech:000511
name: Syntrophomonas-Methanobacterium Butyrate Syntrophy
description: A defined two-member anaerobic syntrophic biculture of the butyrate-oxidizing bacterium Syntrophomonas wolfei
  strain G311 and the hydrogen- and formate-utilizing methanogen Methanobacterium formicicum strain MF (DSM 1535) grown at
  37 degrees Celsius in bicarbonate-buffered mineral salt medium supplemented with 20 mM butyrate, 1 mM glycerol, 0.05 g/L
  yeast extract, and 2 mM sodium acetate under N2/CO2 (80/20, vol/vol) at 1.5 bar. In Doloman et al. (2022, PMID:35699440,
  Table 1 and Fig. 2B), the S. wolfei + M. formicicum biculture converted butyrate to acetate and methane with a lag phase
  of 5.38 (0.43) days, a volumetric methane production rate of 0.15 (0.006)* mmol/L/day, and a maximal methane concentration
  of 3.92 (0.23) mmol/L, and was positively stimulated by 1.1 mM starting acetate (Fig. S2).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Establish the two-member syntrophic butyrate-degrading baseline of Syntrophomonas wolfei G311 and Methanobacterium
    formicicum MF (DSM 1535) on 20 mM sodium butyrate and evaluate whether adding fermentative Trichococcus flocculiformis
    ES5 or 1.1 mM acetate accelerates methanogenic butyrate conversion.
  assembly_strategy: Combine pure cultures of butyrate-oxidizing Syntrophomonas wolfei G311 (pre-grown on basal medium supplemented
    with 20 mM sodium crotonate) and hydrogen/formate-consuming Methanobacterium formicicum MF (DSM 1535; pre-grown under
    H2/CO2 80/20 vol/vol at 1.5 bar supplemented with 2 mM sodium acetate) at 10% (vol/vol) inoculum in mineral medium with
    20 mM sodium butyrate, 1 mM glycerol, 0.05 g/L yeast extract, and 2 mM sodium acetate.
  inoculation_strategy: Construct the syntrophic biculture in 120-mL serum vials containing 50 mL bicarbonate-buffered mineral
    salt medium (20 mM butyrate, 1 mM glycerol, 0.05 g/L yeast extract, 2 mM sodium acetate, N2/CO2 80/20 vol/vol at 1.5 bar)
    by mixing a 10% (vol/vol) inoculum of pre-grown pure cultures of S. wolfei G311 and M. formicicum MF.
  perturbation_design: Compare the S. wolfei G311 + M. formicicum MF biculture against the three-member triculture with Trichococcus
    flocculiformis ES5 (CommunityMech:000512), the parallel M. hungatei JF1 biculture and triculture (CommunityMech:000188),
    and bicultures supplemented with 1.1 mM initial acetate or yeast extract (Fig. S2).
  measurement_endpoints:
  - lag phase of methane production (days)
  - volumetric methane production rate (mmol/L/day)
  - maximal methane concentration (mmol/L)
  - butyrate consumption and acetate accumulation (mM)
  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each of the three syntrophic bi-cultures was constructed by mixing a 10% (vol/vol) inoculum of the pre-grown
      pure culture of S. wolfei and methanogens.
    explanation: Documents the 10% (vol/vol) co-inoculation strategy used to assemble the S. wolfei + M. formicicum biculture.
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. wolfei + M. formicicum 5.38 (0.43) 0.15 (0.006)* 3.92 (0.23)
    explanation: Reports the Table 1 lag phase (5.38 +- 0.43 days), methane production rate (0.15 +- 0.006 mmol/L/day), and
      maximal methane concentration (3.92 +- 0.23 mmol/L) for the S. wolfei + M. formicicum biculture.
