  evidence:
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. wolfei + M. formicicum 5.38 (0.43) 0.15 (0.006)* 3.92 (0.23)
    explanation: Quantifies the syntrophic methanogenesis kinetics (lag phase, rate, and maximal methane concentration) of
      the S. wolfei + M. formicicum biculture.
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, the tri-culture with M. formicicum had a significantly higher (~2-fold increase) methane production
      rate compared to the bi-culture pair.
    explanation: Establishes the S. wolfei + M. formicicum biculture pair as the baseline against which the ~2-fold triculture
      rate increase is measured.
  - reference: PMID:35699440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A bi-culture of the syntroph with M. formicicum was indeed positively affected (increased methane production)
      by a slightly elevated starting amount of acetate in the growth media.
    explanation: Documents that starting acetate supplementation (1.1 mM, Fig. S2) positively affected methane production
      in the S. wolfei + M. formicicum biculture.
