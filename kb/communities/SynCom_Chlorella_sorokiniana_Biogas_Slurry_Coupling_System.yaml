ecological_interactions:
- name: Nitrate-Nitrogen and Phosphorus Removal
  description: The sequential SynCom-microalga system operated stably for 60 days and removed 94.41% of nitrate
    nitrogen, 81.84% of total phosphorus and 6.31% of chemical oxygen demand. These are system-level removal endpoints,
    not direct evidence of metabolite transfer between the bacterial pretreatment community and the alga or of which
    organisms carried each removal flux.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  evidence:
  - reference: PMID:41794300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '94.41% removal of nitrate nitrogen, 81.84% removal of total phosphorus, and 6.31% removal of chemical
      oxygen demand

      '
    explanation: 'Supports the reported nitrate-nitrogen, phosphorus, and COD removal endpoints.

      '
- name: Chlorella biomass and protein response to SynCom pretreatment
  description: C. sorokiniana grown with SynCom-pretreated slurry had 27.15% greater biomass and 488.10% greater
    soluble protein content than the BG11 comparison. This positive algal response does not isolate bacterial conditioning
    from all differences between the media, identify an exchanged metabolite, or establish that bacterial fitness
    was unaffected.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41794300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom pretreatment increased the biomass and soluble protein content of C. sorokiniana by 27.15% and
      488.10%, respectively
    explanation: Supports the algal biomass/protein response; the abstract names BG11 as the comparator, not an
      otherwise identical untreated-slurry control.
  participating_taxa:
  - preferred_term: Chlorella sorokiniana
    term:
      id: NCBITaxon:3076
      label: Chlorella sorokiniana
- name: Chlorella carbon- and nitrogen-assimilation transcript response
  description: Transcriptomic analysis reported upregulated Rubisco and glutamine synthetase genes in C. sorokiniana.
    This supports a carbon- and nitrogen-assimilation transcriptional response accompanying the biomass and protein
    phenotype. It does not measure enzyme activity or carbon/nitrogen flux and does not establish that increased
    growth caused the transcript changes.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  evidence:
  - reference: PMID:41794300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Transcriptomic analysis showed that the expression levels of key genes Rubisco and glutamine synthetase
      were upregulated

      '
    explanation: 'Supports the carbon- and nitrogen-assimilation transcriptional response in the coupled system.

      '
  participating_taxa:
  - preferred_term: Chlorella sorokiniana
    term:
      id: NCBITaxon:3076
      label: Chlorella sorokiniana
