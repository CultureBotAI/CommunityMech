id: CommunityMech:000285
name: SynCom + Chlorella sorokiniana Biogas-slurry Coupling System
description: A sequential synthetic microbial community (SynCom)-microalga coupling system engineered
  to treat livestock biogas slurry. An autochthonous microalga, Chlorella sorokiniana, isolated from
  the slurry is coupled with a SynCom pretreatment stage. The system operated stably for 60 days,
  achieving 94.41% nitrate-nitrogen removal, 81.84% total-phosphorus removal, and 6.31% chemical
  oxygen demand removal. SynCom pretreatment increased the biomass and soluble protein content of
  C. sorokiniana (by 27.15% and 488.10% vs the BG11 control), upregulating Rubisco and glutamine
  synthetase, providing a strategy for simultaneous pollutant abatement and resource recovery.
