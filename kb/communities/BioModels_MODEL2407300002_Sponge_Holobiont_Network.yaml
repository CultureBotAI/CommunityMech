ecological_interactions:
- name: Coupled Nitrification in Stylissa Holobiont
  description: COMPUTATIONAL - archaeal ammonia oxidation supplies nitrite to the modeled nitrite oxidizer, enabling
    coupled nitrification. This is predicted cross-feeding, not evidence that thermodynamically obligatory substrate
    removal links the partners. A nitric-oxide-forming reaction was disabled to approximate extracellular chemistry;
    modeled exchanges are not measured holobiont fluxes.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    notes: Oxidized by AOA
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
    notes: Produced by AOA, consumed by NOB
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    notes: Produced by NOB
  biological_processes:
  - preferred_term: ammonia oxidation
    term:
      id: GO:0019329
      label: ammonia oxidation
  - preferred_term: nitrogen cycle metabolic process
    term:
      id: GO:0071941
      label: nitrogen cycle metabolic process
  downstream:
  - target: Stable Ammonia-Supported Nitrifying Consortium
    description: COMPUTATIONAL - nitrite generated by archaeal ammonia oxidation supplies the modeled nitrite oxidizer
      and can enable joint growth, conditional on imposed ammonia supply and cell removal. This substrate-support
      mechanism does not establish in-vivo stability or thermodynamic syntrophy.
  evidence:
  - reference: PMID:39738126
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: constraint-based, genome-scale metabolic networks for the microbiome of the sponge Stylissa sp.
    explanation: Supports presence of both AOA and bacterial species enabling coupled nitrification in the holobiont.
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: ammonia oxidation of C. stylissae was able to support the growth of N. stylissae
    explanation: Supports modeled nitrite transfer from the archaeal ammonia oxidizer to the nitrite-oxidizing bacterium.
- name: Nutrient-Responsive Cross-Feeding Network
  description: COMPUTATIONAL - alternative organic-input regimes alter predicted exchanges among eight reconstructed
    Stylissa symbionts. Deltaporibacter contributes condition-dependent routes, not demonstrated active coordination
    of the community. HT denotes hypotaurine. Predicted exchange and net carbon balance share imposed inputs; the
    whole-network summary is not an independent cause of its component routes or trophic-balance summary.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Sponge-derived organic inputs passed through the modeled symbiont exchange network.
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the key role that a newly discovered bacterial taxon has in cross-feeding activities
    explanation: Identifies a bacterial taxon central to cross-feeding dynamics in the holobiont network.
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: different organic inputs can result in net heterotrophy or autotrophy of the symbiont community
    explanation: Supports input-dependent predicted net carbon balance, not experimentally isolated mediation by
      a coordinating organism.
- name: Sponge-Derived Nutrient Provisioning to Microbiome
  description: COMPUTATIONAL - metabolites enriched in sponge tissue were treated as candidate host-derived inputs
    to microbial models. Their host origin and delivery are assumptions informed by metabolomics, not resolved host-to-microbe
    flux. The host metabolism and respiration were not modeled, so this does not establish reciprocal host fitness
    or whole-holobiont mutualism.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Organic substrates that were enriched in sponge tissue and modeled as candidate microbiome inputs.
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Nutrient-Responsive Cross-Feeding Network
    description: COMPUTATIONAL - supplying candidate host-derived organic substrates changes the resources available
      for modeled microbial exchange. This conditional input-to-exchange mechanism does not prove host secretion,
      reciprocal fitness or the same fluxes in vivo.
  evidence:
  - reference: PMID:39738126
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: constraint-based, genome-scale metabolic networks for the microbiome of the sponge Stylissa sp.
    explanation: Supports microbial reconstructions; host metabolism itself was not reconstructed.
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our models define the importance of sponge-derived nutrients for microbiome stability
    explanation: Supports model sensitivity to candidate host inputs, not directly measured host provisioning or
      mutualism.
- name: Stable Ammonia-Supported Nitrifying Consortium
  description: COMPUTATIONAL - simulated ammonia supply and cell-removal rate jointly determine nitrifier growth
    and composition. The stability criterion divides the final AOA:NOB population ratio by its initial value and
    requires that normalized ratio to lie within 0.5-2; these are not absolute population-size bounds. The criterion
    and input regimes are model choices, not measured environmental thresholds or a separate syntrophic interaction.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  biological_processes:
  - preferred_term: nitrogen cycle metabolic process
    term:
      id: GO:0071941
      label: nitrogen cycle metabolic process
  evidence:
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: a stable and actively growing nitrifying community can only be achieved with ammonia concentrations
    explanation: The excerpt is conditional on ammonia and cell removal. Stability refers to the final/initial AOA:NOB
      population-ratio criterion, not absolute abundance or measured in-vivo persistence.
- name: Deltaporibacter Nitrogen-Linked Cross-Feeding
  description: COMPUTATIONAL - the Deltaporibacter stylissae reconstruction participates in nutrient-regime-dependent
    exchanges. Under hypotaurine input, predicted nitrate reduction supplies nitric oxide; combined organic inputs
    produce a different exchange pattern including acetate donation. These are conditional predicted fluxes, not
    measured transfer or evidence that this organism actively coordinates the microbiome.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: nitrogen cycle metabolic process
    term:
      id: GO:0071941
      label: nitrogen cycle metabolic process
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Deltaporibacter stylissae within the Myxococcota, which appears in Stylissa sp. to be central in cross-feeding
      activities and nitrogen cycling
    explanation: Supports the central modeled role of the newly described Deltaporibacter symbiont.
- name: Nutrient-Dependent Symbiont Trophic Balance
  description: COMPUTATIONAL - alternative organic inputs change net carbon exchange of the modeled microbial symbionts
    between net heterotrophy and net autotrophy. This is an aggregate model endpoint, not itself an additional cross-feeding
    interaction. Host respiration is excluded, so the result does not classify the entire living sponge holobiont.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
  biological_processes:
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: different organic inputs can result in net heterotrophy or autotrophy of the symbiont community
    explanation: Supports the nutrient-dependent trophic behavior predicted for the Stylissa symbiont community.
