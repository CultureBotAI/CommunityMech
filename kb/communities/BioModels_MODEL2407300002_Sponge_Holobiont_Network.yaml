ecological_interactions:
- name: Coupled Nitrification in Stylissa Holobiont
  description: Ammonia-oxidizing archaea (AOA) and nitrite-oxidizing bacteria (NOB) form a coupled nitrification
    network in the Stylissa holobiont. AOA oxidize ammonia to nitrite, which is then consumed by NOB to
    produce nitrate. This syntrophic coupling is fundamental to nitrogen cycling in the sponge microbiome
    and demonstrates metabolic interdependence between archaeal and bacterial partners. The partnership
    enables complete nitrification and contributes to nutrient cycling within the holobiont.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    concentration: Oxidized by AOA
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
    concentration: Produced by AOA, consumed by NOB
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    concentration: Produced by NOB
  biological_processes:
  - preferred_term: nitrification
    term:
      id: GO:0019329
      label: ammonia oxidation
  - preferred_term: nitrogen cycle metabolic process
    term:
      id: GO:0071941
      label: nitrogen cycle metabolic process
  downstream:
  - target: Stable Ammonia-Supported Nitrifying Consortium
    description: Model simulations used AOA nitrite production to test how
      ammonia flux can maintain an actively growing AOA-NOB community.
  evidence:
  - reference: PMID:39738126
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: constraint-based, genome-scale metabolic networks for the microbiome of the sponge Stylissa sp.
    explanation: Supports presence of both AOA and bacterial species enabling coupled nitrification in
      the holobiont.
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: ammonia oxidation of C. stylissae was able to support the growth
      of N. stylissae
    explanation: Supports modeled nitrite transfer from the archaeal ammonia
      oxidizer to the nitrite-oxidizing bacterium.
- name: Nutrient-Responsive Cross-Feeding Network
  description: A newly discovered bacterial taxon serves a key role in cross-feeding activities within
    the Stylissa holobiont, dynamically adjusting its metabolism with nutrient inputs. This organism mediates
    metabolic exchanges among community members, enabling resource sharing and metabolic flexibility.
    Different organic nutrient inputs (such as HT and laurate) result in the symbiont community exhibiting
    net heterotrophy or autotrophy, demonstrating nutrient-dependent metabolic flexibility coordinated
    through cross-feeding interactions.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Sponge-derived organic inputs passed through the modeled symbiont
      exchange network.
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Deltaporibacter Nitrogen-Linked Cross-Feeding
    description: Nutrient-responsive cross-feeding is centered on the newly
      described Deltaporibacter symbiont.
  - target: Nutrient-Dependent Symbiont Trophic Balance
    description: Organic-input-dependent exchange changes whether the modeled
      symbiont community is net heterotrophic or net autotrophic.
  evidence:
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the key role that a newly discovered bacterial taxon has in cross-feeding activities
    explanation: Identifies a bacterial taxon central to cross-feeding dynamics in the holobiont network.
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: different organic inputs can result in net heterotrophy or autotrophy of the symbiont community
    explanation: Demonstrates nutrient-responsive metabolic flexibility mediated by cross-feeding.
- name: Sponge-Derived Nutrient Provisioning to Microbiome
  description: The sponge host (Stylissa sp.) provides essential nutrients to the microbial community,
    which are critical for microbiome stability. Metabolic modeling reveals that sponge-derived metabolites
    define the metabolic capacity of the symbiont network and enable community persistence. This host-to-microbe
    nutrient flow represents a fundamental mutualistic relationship where the host supplies resources
    that structure the eight-species microbial community and drive their metabolic interactions.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
    notes: Organic substrates that were enriched in sponge tissue and modeled
      as candidate microbiome inputs.
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Nutrient-Responsive Cross-Feeding Network
    description: Sponge-derived nutrients define the model boundary conditions
      that drive symbiont cross-feeding and community stability.
  evidence:
  - reference: PMID:39738126
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: constraint-based, genome-scale metabolic networks for the microbiome of the sponge Stylissa sp.
    explanation: Supports host-microbiome metabolic integration in the Stylissa holobiont.
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our models define the importance of sponge-derived nutrients for
      microbiome stability
    explanation: Supports sponge-derived nutrients as the modeled inputs that
      stabilize the symbiont community.
- name: Stable Ammonia-Supported Nitrifying Consortium
  description: Simulations of Cenoporarchaeum stylissae and Nitrospongiibacter
    stylissae predicted that ammonia availability sets the boundary for a
    stable, actively growing nitrifying consortium in the Stylissa microbiome.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
