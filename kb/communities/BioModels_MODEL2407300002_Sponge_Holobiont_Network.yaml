  - reference: doi:10.1038/s41467-024-55222-w
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Eight genome-scale metabolic models representing seven bacterial and one archaeal
      species constructed and manually curated based on metagenome-assembled genomes
    explanation: >-
      Establishes this BioModels entry as the eight-species metabolic network model for
      Stylissa holobiont.
- name: PubMed record
  repository: OTHER
  resource_id: PMID:39738126
  url: https://pubmed.ncbi.nlm.nih.gov/39738126/
  description: Genome-scale metabolic modelling of Stylissa sponge holobiont interactions.
  evidence:
  - reference: PMID:39738126
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      different organic inputs can result in net heterotrophy or autotrophy of the symbiont
      community
    explanation: >-
      Demonstrates nutrient-dependent metabolic flexibility in the holobiont network.
notes: >-
  Eight-species metabolic network includes seven bacterial and one archaeal species
  (ammonia-oxidizing archaea, nitrite-oxidizing bacteria, and a newly discovered bacterial
  taxon involved in cross-feeding). Full taxonomy and interactions require access to
  supplementary materials from doi:10.1038/s41467-024-55222-w (Nature Communications, Dec 2024).
  Community deferred pending supplementary data extraction.
