growth_media:
- name: BG-11-based photosynthetic co-culture medium
  temperature: '35'
  temperature_unit: °C
  atmosphere: AEROBIC
  headspace_gas: 2% CO2
  light_regime: constant light
  light_intensity: '80'
  light_intensity_unit: µmol PAR
  shaking_speed: '150'
  shaking_speed_unit: rpm
  vessel_type: Multitron Infors HT shaking incubator
  preparation_notes: >-
    S. elongatus propagated in BG-11 + 1 g/L HEPES (pH 8, 35 °C, constant light). In the source
    (Hays et al. 2017) the yeast partner tested was Saccharomyces cerevisiae, grown in the yeast
    co-culture medium CoY BG-11; the general co-culture conditions (35 °C, 150 rpm, 2% CO2, ~80
    µmol PAR) apply across all cyanobacterium/heterotroph dyads. 2% sucrose added to acclimate;
    IPTG induces sucrose export.
  evidence:
  - reference: PMID:28127397
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All acclimating cultures and co-cultures were grown at 35 °C, 150 rpm, 2% CO2, in light
      (PAR = ~80 μmol with 15 W Gro-Lux Sylvania fluorescent bulbs) within a Multitron Infors HT incubator
    explanation: General co-culture conditions used across the photosynthetic consortium dyads.
  - reference: PMID:28127397
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. elongatus was propagated in BG-11 (Sigma-Aldrich) plus 1 g/L HEPES, pH 8 in constant
      light at 35 °C
    explanation: Base medium and maintenance conditions for the cyanobacterial primary producer.
