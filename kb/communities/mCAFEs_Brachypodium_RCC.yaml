growth_media:
- name: modified RCH2 minimal medium
  ph: '6.0'
  temperature: '30'
  temperature_unit: °C
  shaking_speed: '130'
  shaking_speed_unit: rpm
  inoculum_size: '10'
  inoculum_unit: '% v/v'
  vessel_type: 96-well deep-well plate (1.8 mL working volume)
  preparation_notes: Base RCH2 minimal medium at pH 6.0 amended with 10 mL/L Wolfe's
    vitamins and a single carbon source at 2 mM (citrate, malate, glucose, asparagine,
    glutamine, glucuronic acid, or a mixture), or 1/10 R2A; enrichments transferred
    every 3 or 7 days for 10 generations.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The base media for all but one enrichment was a modified RCH2 media (minimal
      media) at pH 6.0 to mimic the field pH
    explanation: Supports the RCH2 minimal medium and pH 6.0 used for the enrichments.
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plates were incubated in the 30°C shaking incubator at 130 rpm
    explanation: Supports the incubation temperature (30°C) and shaking speed (130 rpm).
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each well had 1.8 mL volume in total with 10% inoculum (180 μL)
    explanation: Supports the 96-well plate working volume and 10% v/v inoculum size.
