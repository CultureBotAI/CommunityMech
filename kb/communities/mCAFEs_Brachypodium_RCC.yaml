ecological_interactions:
- name: Root Exudate-Mimicking Enrichment Assembly
  description: A multiplexed enrichment experiment varied root-associated inocula, carbon conditions and 3-day versus
    7-day transfer intervals to generate a collection of Brachypodium-derived RCC. It is not one fixed consortium
    of the ten listed representative taxa. The abiotic selection treatments are experimental inputs, not direct
    evidence that species partition niches or reduce competition.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Carbon-Source ASV Sorting
    description: Changing the supplied carbon condition alters the ASV composition of enrichment cultures, with
      inoculum source accounted for in comparisons. This experimentally imposed selection does not demonstrate reciprocal
      niche partitioning or consumption of distinct substrates by each named organism.
  - target: Transfer-interval ASV abundance classification
    description: Changing serial-transfer interval alters which ASVs are relatively enriched at later generations.
      The resulting 3-day/7-day abundance classification is a response to the transfer regime, not a direct per-ASV
      growth-rate measurement.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'We enriched co-localized microbes from Brachypodium roots grown in field soil with carbon substrates
      mimicking Brachypodium root exudates

      '
    explanation: 'Supports using Brachypodium rhizosphere inocula and root-exudate-like substrates to seed the RCC
      enrichment design.

      '
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Thereafter, plates were transferred 10 times at two different intervals, 3 days and 7 days for targeting
      fast and slow growing microbes.

      '
    explanation: 'Supports the two serial-transfer regimes used to enrich fast- and slow-growing reduced-complexity
      consortia.

      '
- name: Carbon-Source ASV Sorting
  description: Carbon amendments selected different ASVs in inoculum-stratified comparisons. Complex 1/10 R2A supported
    broad enrichment including Terriglobus and Arthrobacter; asparagine enriched Bradyrhizobium and a related rhizobial
    clade. The listed participants are representative named taxa, not all enriched ASVs. These relative-abundance
    changes do not isolate substrate consumption, microbial cooperation or reduced competition as their mechanism.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Terriglobus
    term:
      id: NCBITaxon:392733
      label: Terriglobus
  - preferred_term: Arthrobacter
    term:
      id: NCBITaxon:1667
      label: Arthrobacter sp.
  - preferred_term: Bradyrhizobium
    term:
      id: NCBITaxon:374
      label: Bradyrhizobium
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '1/10 R2A had the highest potential to enrich ASVs compared to other carbon sources

      '
    explanation: 'Supports 1/10 R2A as the high-diversity complex-carbon condition used for deeper network analysis.

      '
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'significantly enriched ASVs from genera Bradyrhizobium and Allorhizobium-Neorhizobium-Pararhizobium-Rhizobium

      '
    explanation: Supports Bradyrhizobium enrichment in asparagine-amended RCC.
- name: Transfer-interval ASV abundance classification
  description: For a fixed carbon source and original inoculum, ASVs more abundant after 7-day transfers than 3-day
    transfers were called slow growers, and the converse were called fast growers. The comparison used generations
    6 and 9. These are operational relative-abundance classes, not measured isolate growth rates; transfer duration
    also changes other ecological conditions. The reported capacity of 1/10 R2A, asparagine and glucuronic acid
    to enrich both classes is retained. Network-hub genera are not substituted for the set of ASVs in this differential-abundance
    analysis.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'microbes significantly more abundant in 7-day interval samples compared to 3-day interval samples
      were categorized as

      '
    explanation: 'Supports the 7-day versus 3-day comparison used to classify slow- and fast-growing ASVs.

      '
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '1/10 R2A medium, along with asparagine and glucuronic acid, demonstrated the greatest capability to
      enrich both slow and fast-growing microbes

      '
    explanation: 'Supports the substrate set that best retained both transfer-interval growth classes.

      '
- name: Transfer-interval association-network hubs
  description: NetCoMi Pearson-correlation analysis of core ASVs in the 1/10 R2A enrichments identified different
    high-eigenvector-centrality hubs in 3-day and 7-day networks. The named taxa are representative reported hubs,
    including the Methylobacterium-Methylorubrum source clade, not an exhaustive community roster. Association centrality
    does not establish ecological niche partitioning, directly measured growth rate, keystone necessity or plant-growth
    promotion by those ASVs.
