- name: 1/10 R2A Glycerol Stock Revival
  description: Five selected 1/10 R2A RCC stocks were revived and serially propagated, with broadly consistent dominant
    genera and relative abundances in those tests. This does not establish universal revival of all initial enrichments,
    exact strain-level identity, or retention of every rare taxon. Burkholderia and Mesorhizobium were shared statistical
    hubs in the revived-stock networks, not demonstrated causes of revival. The original broad 1/10 R2A enrichments
    were less stable than most other carbon arms; that result is distinct from stability of these five selected
    stocks.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'dominant genera from the glycerol stocks (>0.5% in at least one sample) and their relative abundances
      remained consistent between transfers

      '
    explanation: 'Supports stability of the genera recovered during serial propagation from frozen 1/10 R2A glycerol
      stocks.

      '
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'Genus Burkholderia and Mesorhizobium were shared keystone taxa among 3-day and 7-day intervals

      '
    explanation: Shared hubs of revived-stock association networks, not experimentally necessary revival partners.
environmental_factors:
- name: Carbon Substrate
  value: glucose, glucuronic acid, glutamine, asparagine, 1/10 R2A
  description: Five carbon substrates mimicking root exudates used as enrichment conditions. Each substrate
    drives distinct community compositions.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: systematic design framework built on microbial colocalization and microbial interaction,
      toward successful assembly of multiple rhizosphere-derived Reduced Complexity Consortia (RCC)
    explanation: Carbon substrates are central to the RCC enrichment design
- name: Transfer Frequency
  value: 3-day (fast) or 7-day (slow)
  description: Serial transfer frequency for 10 generations. Fast transfers (3-day) select for fast-growing
    taxa; slow transfers (7-day) select for slow-growing, functionally important taxa.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: complex carbon enriching slow growing yet functionally important soil taxa like Acidobacteria
      and Verrucomicrobia
    explanation: Transfer frequency is a key design variable for growth rate selection
- name: Soil Source
  value: Angelo Coast Range Reserve, California
  description: Field soil from Angelo Coast Range Reserve (39deg44'21.4"N 123deg37'51.0"W), pH 5.75. Source
    of initial rhizosphere microbial diversity for enrichment.
