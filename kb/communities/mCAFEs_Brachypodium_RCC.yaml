ecological_interactions:
- name: Carbon Substrate-Driven Community Differentiation
  description: Different carbon substrates (glucose, glucuronic acid, glutamine, asparagine, 1/10 R2A)
    drive distinct community compositions in the enrichment framework. Simple sugars like glucose enrich
    fast-growing taxa while complex carbon sources like 1/10 R2A enrich slow-growing yet functionally
    important soil taxa.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: complex carbon enriching slow growing yet functionally important soil taxa like Acidobacteria
      and Verrucomicrobia
    explanation: Documents how carbon substrate type drives community composition differences
- name: Fast vs Slow Growth Rate Selection
  description: Transfer frequency selects for different community types. 3-day transfers enrich fast growers
    (Pseudomonas, Stenotrophomonas, Methylobacterium) while 7-day transfers enrich slow growers (Acidobacteria,
    Verrucomicrobia, Terriglobus). This creates distinct ecological niches within the enrichment framework.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: complex carbon enriching slow growing yet functionally important soil taxa like Acidobacteria
      and Verrucomicrobia
    explanation: Documents growth rate-based selection of different community types via transfer frequency
environmental_factors:
- name: Carbon Substrate
  value: glucose, glucuronic acid, glutamine, asparagine, 1/10 R2A
  description: Five carbon substrates mimicking root exudates used as enrichment conditions. Each substrate
    drives distinct community compositions.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: systematic design framework built on microbial colocalization and microbial interaction,
      toward successful assembly of multiple rhizosphere-derived Reduced Complexity Consortia (RCC)
    explanation: Carbon substrates are central to the RCC enrichment design
- name: Transfer Frequency
  value: 3-day (fast) or 7-day (slow)
  description: Serial transfer frequency for 10 generations. Fast transfers (3-day) select for fast-growing
    taxa; slow transfers (7-day) select for slow-growing, functionally important taxa.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: complex carbon enriching slow growing yet functionally important soil taxa like Acidobacteria
      and Verrucomicrobia
    explanation: Transfer frequency is a key design variable for growth rate selection
- name: Soil Source
  value: Angelo Coast Range Reserve, California
  description: Field soil from Angelo Coast Range Reserve (39deg44'21.4"N 123deg37'51.0"W), pH 5.75. Source
    of initial rhizosphere microbial diversity for enrichment.
