ecological_interactions:
- name: Root Exudate-Mimicking Enrichment Assembly
  description: >
    Co-localized microbes from Brachypodium roots grown in Angelo Coast Range
    Reserve soil were introduced into a multiplexed high-throughput enrichment
    design, coupling root-exudate-like carbon substrates to 3-day and 7-day
    transfers to produce fast- and slow-growing reduced-complexity consortia.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Carbon-Source ASV Sorting
    description: >
      The 768 enrichments crossed rhizosphere inocula with root-exudate carbon
      substrates, allowing carbon chemistry to sort enriched ASVs.
  - target: Transfer-Interval Growth-Rate Sorting
    description: >
      The same enrichment design used serial 3-day and 7-day transfers to
      separate ASVs favored by fast and slow subculture intervals.
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      We enriched co-localized microbes from Brachypodium roots grown in field
      soil with carbon substrates mimicking Brachypodium root exudates
    explanation: >
      Supports using Brachypodium rhizosphere inocula and root-exudate-like
      substrates to seed the RCC enrichment design.
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Thereafter, plates were transferred 10 times at two different intervals,
      3 days and 7 days for targeting fast and slow growing microbes.
    explanation: >
      Supports the two serial-transfer regimes used to enrich fast- and
      slow-growing reduced-complexity consortia.
- name: Carbon-Source ASV Sorting
  description: >
    Carbon substrate choice imposed a measurable selection on the enrichment
    communities: 1/10 R2A gave the broadest ASV enrichment and repeatedly
    selected Terriglobus and Arthrobacter, while asparagine selected
    Bradyrhizobium and a related rhizobial clade.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
