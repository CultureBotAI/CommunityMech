id: CommunityMech:000078
name: m-CAFEs Brachypodium Reduced Complexity Consortia
description: A systematic framework for assembling rhizosphere-derived Reduced Complexity Consortia (RCC)
  from Brachypodium distachyon roots grown in field soil from Angelo Coast Range Reserve, California.
  Enriched co-localized microbes with carbon substrates mimicking root exudates, generating 768 enrichments.
  Transferred every 3 or 7 days for 10 generations to develop fast and slow-growing reduced complexity
  communities. Keystone taxa identified within these networks belong to genera with plant growth-promoting
  traits. Tested consortia demonstrated high stability and reproducibility, assuring successful revival
  from glycerol stocks.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
engineering_design:
  objective: Systematic framework for assembling stable, simplified, functional rhizosphere consortia
    from Brachypodium roots for sustainable agriculture applications
  assembly_strategy: Enrichment-based assembly from field soil using carbon substrates mimicking root
    exudates, with serial transfers for 10 generations
  perturbation_design: Carbon substrate type (glucose, glucuronic acid, glutamine, asparagine, 1/10 R2A)
    and transfer frequency (3-day fast vs 7-day slow)
  measurement_endpoints:
  - 16S rRNA amplicon sequencing
  - Network analysis
  - Stability and reproducibility assays
  evidence:
  - reference: PMID:38846575
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: systematic design framework built on microbial colocalization and microbial interaction,
      toward successful assembly of multiple rhizosphere-derived Reduced Complexity Consortia (RCC)
    explanation: Describes the enrichment-based design framework for assembling RCCs
environment_term:
  preferred_term: Brachypodium distachyon rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Enrichment from Angelo Coast Range Reserve soil (39deg44'21.4"N 123deg37'51.0"W), pH 5.75. Carbon
    substrates used include glucose, glucuronic acid, glutamine, asparagine, and 1/10 R2A medium to mimic
    root exudates.
