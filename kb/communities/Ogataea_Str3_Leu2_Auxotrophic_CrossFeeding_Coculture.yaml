ecological_interactions:
- name: STR3-LEU2 Cross-Pathway Auxotrophic Complementation and Biomass Restoration on Glucose
  description: While individual O. polymorpha auxotrophic single mutants failed to grow in unsupplemented Delft minimal glucose
    medium (OD600 remaining below 1.2), 1:1 co-cultivation of str3Δ and leu2Δ at initial total OD600 = 0.2 in shake flasks
    (20 g/L glucose, 37 degrees C, 220 rpm, n = 4) resulted in reproducible and robust growth complementation. Along with
    met10Δ-str3Δ, str3Δ-leu2Δ reached a maximum OD600 of 27.3–28.5 (comparable to the prototrophic control strain FY00 at
    OD600 = 26.8, p > 0.1) and outperformed moderately complementary pairs such as met10Δ-leu2Δ and ura3Δ-leu2Δ (maximum OD600
    = 24–26, lag phases 70–144 h), while exhibiting a significantly longer lag phase than FY00 (p < 10^-4) reflecting the
    time required to establish reciprocal amino acid/intermediate exchange.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ogataea polymorpha str3Δ
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  - preferred_term: Ogataea polymorpha leu2Δ
    term:
      id: NCBITaxon:460523
      label: Ogataea polymorpha
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strongly complementary pairs (met10Δ-str3Δ and str3Δ-leu2Δ) reached maximum OD600 values of 27.3–28.5, slightly
      higher than that of the FY00 control (OD600 = 26.8, p > 0.1). However, their lag phases were obviously longer than that
      of FY00 (p < 10−4), reflecting the time required for metabolic exchange and population establishment.
    explanation: Quantifies the shake-flask maximum OD600 (27.3–28.5) and extended lag phase (p < 10^-4) of the strongly complementary
      str3Δ-leu2Δ and met10Δ-str3Δ cocultures relative to FY00.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among all tested pairs, met10Δ-str3Δ and str3Δ-leu2Δ exhibited the most reproducible and robust complementation.
    explanation: Highlights str3Δ-leu2Δ and met10Δ-str3Δ as the two most reproducible and robust auxotrophic cocultures on
      glucose.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, most auxotrophic strains failed to grow without exogenous supplementation, with OD600 remaining
      below 1.2 throughout cultivation ( Fig. S1b and c ).
    explanation: Establishes the single-strain auxotroph baseline (OD600 < 1.2) against which str3Δ-leu2Δ coculture rescue
      (OD600 27.3–28.5) was measured.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In comparison, moderately complementary pairs (met10Δ-leu2Δ, met10Δ-met14Δ, ura3Δ-leu2Δ, and met10Δ-met3Δ) exhibited
      lower maximum OD600 (24-26) and extremely extended lag phases (70-144 h).
    explanation: Contrasts the superior maximum OD600 and shorter lag phase of str3Δ-leu2Δ against moderately complementary
      pairs such as met10Δ-leu2Δ and ura3Δ-leu2Δ.
