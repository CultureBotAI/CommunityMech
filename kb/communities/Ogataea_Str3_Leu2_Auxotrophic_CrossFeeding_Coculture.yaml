id: CommunityMech:000535
name: Ogataea Str3-Leu2 Auxotrophic Cross-Feeding Coculture
description: A defined two-member Ogataea polymorpha synthetic yeast coculture pairing a sulfur assimilation cystathionine
  beta-lyase auxotroph (str3Δ) with a leucine biosynthesis auxotroph (leu2Δ) constructed in the JQcr03L laboratory background
  by Fan et al. 2026 (PMID:42318495). Alongside the met10Δ-str3Δ pair (CommunityMech:000450), str3Δ-leu2Δ was identified in
  systematic pairwise auxotroph screening and shake-flask validation (1:1 strain ratio, initial total OD600 = 0.2, Delft minimal
  medium containing 20 g/L glucose, 37 degrees C, 220 rpm, n = 4) as one of the two strongly complementary pairs exhibiting
  the most reproducible and robust growth complementation, reaching maximum OD600 values of 27.3–28.5 (comparable to the prototrophic
  control strain FY00 at OD600 = 26.8, p > 0.1) after a prolonged lag phase (p < 10^-4) required for cross-pathway metabolic
  exchange between sulfur assimilation and leucine biosynthesis.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Evaluate pairwise auxotrophic cross-feeding between distinct amino acid biosynthetic pathways (sulfur assimilation
    STR3 deletion and leucine biosynthesis LEU2 deletion) to establish stable synthetic consortia in Ogataea polymorpha.
  assembly_strategy: Construct single-gene auxotrophic mutants in the O. polymorpha JQcr03L background via CRISPR/Cas9 followed
    by URA3 restoration, screen pairwise combinations at a 1:1 ratio in Delft minimal medium with 20 g/L glucose using Recovery
    Index (RI = co-culture maximum OD600 / FY00 maximum OD600), and validate top-performing pairs in 100 mL shake flasks (n
    = 4 biological replicates).
  inoculation_strategy: Pre-culture single colonies in liquid YPD overnight (15–18 h) at 37 degrees C and 220 rpm, wash twice
    with Delft minimal medium, and inoculate at a 1:1 str3Δ:leu2Δ ratio to an initial total OD600 of 0.2 in 20 mL Delft minimal
    medium (20 g/L glucose) in 100 mL shake flasks.
  perturbation_design: Compare str3Δ-leu2Δ against prototrophic control FY00, single-mutant monocultures (OD600 < 1.2 without
    supplementation), sulfur-pathway pairs (met10Δ-str3Δ, met14Δ-str3Δ, met3Δ-str3Δ), and moderately complementary pairs (met10Δ-leu2Δ,
    met10Δ-met14Δ, ura3Δ-leu2Δ, met10Δ-met3Δ).
  measurement_endpoints:
  - Recovery Index (RI) in multi-well plate screening
  - shake-flask growth curves (OD600)
  - maximum OD600 in stationary phase
  - lag phase duration relative to prototrophic FY00
  evidence:
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among all tested pairs, met10Δ-str3Δ and str3Δ-leu2Δ exhibited the most reproducible and robust complementation.
    explanation: Identifies str3Δ-leu2Δ alongside met10Δ-str3Δ as the two most reproducible and robust complementary auxotrophic
      pairs in the study.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strongly complementary pairs (met10Δ-str3Δ and str3Δ-leu2Δ) reached maximum OD600 values of 27.3–28.5, slightly
      higher than that of the FY00 control (OD600 = 26.8, p > 0.1).
    explanation: Quantifies the shake-flask maximum OD600 (27.3–28.5) of the strongly complementary str3Δ-leu2Δ and met10Δ-str3Δ
      pairs relative to FY00.
  - reference: PMID:42318495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For screening under glucose conditions, co-cultures were initiated in Delft medium containing 20 g/L glucose
      at an initial total OD600 of 0.2 with a 1:1 strain ratio. Single-strain controls were inoculated at the same OD600.
    explanation: Specifies the 1:1 inoculation ratio, initial total OD600 of 0.2, and 20 g/L glucose Delft minimal medium
      condition.
