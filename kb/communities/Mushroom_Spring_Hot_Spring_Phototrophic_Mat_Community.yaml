    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:23575369
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: expressed key genes involved in the 3-hydroxypropionate (3-OHP) carbon dioxide fixation bi-cycle during the day
    explanation: Supports daytime carbon dioxide fixation by phototrophic Chloroflexi populations.
  - reference: PMID:23575369
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Transcripts for genes involved in the biosynthesis of bacteriochlorophylls
    explanation: Supports diel expression of phototrophy genes in the mat community.
- name: Phototroph Storage Polymer Cycling
  description: >
    Filamentous anoxygenic phototrophs shift between synthesis and use of
    storage polymers across the diel cycle, coupling light availability to
    community carbon and energy flow.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:23575369
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: storage polymers, including glycogen, polyhydroxyalkanoates and wax esters
    explanation: Supports storage polymer metabolism as a diel feature of the phototrophic mat.
  - reference: PMID:23575369
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: in daytime, polyhydroxyalkanoates and wax esters are degraded
    explanation: Supports daytime use of storage polymers by phototrophic Chloroflexi.
- name: Upper-Mat and Undermat Nitrogen Fixation Partitioning
  description: >
    Nitrogen fixation potential is spatially partitioned between Synechococcus
    spp. in the upper phototrophic layer and Thermodesulfovibrio sp. in the
    undermat, while nitrate and nitrite metabolism appears limited.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  source_taxon:
