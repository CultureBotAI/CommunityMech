- name: Stratified Chlorophototrophic Community Structure
  description: >
    The Mushroom Spring mat is a stratified, highly uneven phototrophic
    community in which upper-layer cyanobacteria coexist with abundant
    filamentous anoxygenic phototrophs and an undermat assemblage resolved by
    amplicon and metagenomic sequencing.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:28634470
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: diverse but extremely uneven microbial assemblage in the undermat of Mushroom Spring
    explanation: Supports the stratified and uneven community organization.
  - reference: PMID:28634470
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Metagenome binning recovered partial genomes of all abundant community members
    explanation: Supports genome-resolved analysis of abundant community members.
