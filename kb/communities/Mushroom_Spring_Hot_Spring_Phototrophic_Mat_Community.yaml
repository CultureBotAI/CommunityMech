id: CommunityMech:000260
name: Mushroom Spring Hot-Spring Phototrophic Mat Community
description: >
  A natural alkaline geothermal microbial mat community from Mushroom Spring in
  Yellowstone National Park. The community is structured around thermophilic
  Synechococcus cyanobacteria, filamentous anoxygenic phototrophs related to
  Roseiflexus and Chloroflexus, and an undermat community that includes
  Thermodesulfovibrio-like sulfate reducers. It is a DOE-relevant model for
  high-temperature photosynthesis, diel carbon and nitrogen cycling,
  metagenome-resolved community metabolism, and carbon flow in phototrophic
  microbial mats.
