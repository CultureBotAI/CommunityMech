ecological_interactions:
- name: Diel Phototrophic Carbon Fixation
  description: >
    Roseiflexus and Chloroflexus populations show diel expression of
    bacteriochlorophyll, reaction-center, and 3-hydroxypropionate carbon
    dioxide fixation genes, indicating time-resolved phototrophic carbon
    metabolism in the mat.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
