discussions:
- discussion_id: g88_excluded_from_full_combinatorial_panel
  prompt: Should the context-dependent Pseudocolwellia degrader G88/AS88 be represented in a companion pairwise-coculture record?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - engineering_design
  - ecological_interactions#Seven-degrader synergistic function landscape
  rationale: G88 was an experimentally validated fucoidan degrader from the same strain collection, but the full 127-community
    landscape explicitly excluded G88 and used the seven degraders F12, F40, F56, F94, V25, V69, and V4.
  evidence:
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The only exception was G88, which increased degradation when paired with V69, but acted as an exploiter when paired
      with V4 and V25.
    explanation: Supports treating G88 as pairwise context-dependent instead of silently adding it to the seven-degrader panel.
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: seven degraders F12, F40, F56, F94, V25, V69 and V4
    explanation: Names the exact full-combinatorial panel that excluded G88.
  posed_by: codex
  posed_date: '2026-09-27'
- discussion_id: v4_lentimonas_alias
  prompt: Does the article's prose label for Lentimonas sp. CC4 resolve to V4 or V43?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Lentimonas sp. CC4
  rationale: Supplementary Table 2 maps LCC_4 to Lentimonas sp. CC4, Verruco4, and V4, and the full-combinatorial Methods
    use V4. One article paragraph refers to the previously characterized CC4 degrader as strain V43, so this record follows
    the spreadsheet and Methods convention for the member code.
  evidence:
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lentimonas sp. CC4 | Verruco4 | V4 | degrader
    explanation: Supports the Supplementary Table 2 mapping from LCC_4 to V4.
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: seven degraders F12, F40, F56, F94, V25, V69 and V4
    explanation: Supports the V4 code in the full-combinatorial Methods section.
  posed_by: codex
  posed_date: '2026-09-27'
