ecological_interactions:
- name: Complementary fucoidan monomer degradation
  description: The SynCom's community-level degradation emerges from combining fucose specialists, rare-sugar specialists,
    and generalists whose enzyme repertoires unlock distinct fractions of the sulfated F. vesiculosus fucoidan substrate.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate catabolic process
    term:
      id: GO:0016052
      label: carbohydrate catabolic process
  evidence:
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: V69 and F56 function as generalists, whereas V4, V25 and G88 are fucose-specialists and F12, F40 and F94 are
      rare-sugar specialists.
    explanation: Supports division of the isolated degraders into fucose specialists, rare-sugar specialists, and generalists.
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: access to complementary substrate fractions--rather than enzyme count--limits fucoidan degradation, such that complete
      breakdown emerges from interactions among metabolically complementary degraders.
    explanation: Supports the source article's mechanism for community-level fucoidan breakdown.
- name: Seven-degrader synergistic function landscape
  description: The complete non-empty panel of seven fucoidan degraders produced a smooth community-function landscape in
    which synergism remained common even among combinations approaching nearly complete degradation.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate catabolic process
    term:
      id: GO:0016052
      label: carbohydrate catabolic process
  evidence:
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Total degradation increased with community richness, ranging from 4% to a maximum of 97.1% in the 5-member community
      F40, F56, V69, F94 and V4
    explanation: Supports the observed degradation range across the seven-member composition landscape.
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: even when approaching near-complete degradation, 80% of interactions were still synergistic beyond what would be expected
      from simple resource partitioning
    explanation: Supports persistence of synergism across high-degradation communities.
