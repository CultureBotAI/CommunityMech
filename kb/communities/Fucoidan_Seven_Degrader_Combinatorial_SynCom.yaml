id: CommunityMech:000449
name: Fucoidan Seven-Degrader Combinatorial SynCom
description: A defined seven-member marine bacterial SynCom assembled from the fucoidan degraders F12, F40, F56, F94,
  V25, V69, and V4 to quantify complementary fucose- and rare-sugar-monomer degradation of Fucus vesiculosus fucoidan.
  Sichert et al. constructed all 127 possible non-empty combinations of these degraders at equal OD600 in MBL medium
  with 0.2% fucoidan, measured total and monomer-specific degradation by liquid chromatography mass spectrometry, and
  resolved a functionally synergistic community landscape in which specialized degrader combinations reached up to 97.1%
  total degradation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Reconstruct fucoidan degradation with a defined marine degrader SynCom and test whether complementary
    fucose and rare-sugar specialists can drive synergistic breakdown of a structurally complex brown-algal polysaccharide.
  assembly_strategy: Enrich a coastal-seawater bacterial community on Fucus vesiculosus fucoidan, isolate fucoidan
    degraders spanning Verrucomicrobiota and Flavobacteriia, then assemble every non-empty combination of seven consistent
    degraders while excluding the context-dependent Pseudocolwellia degrader G88.
  inoculation_strategy: Mix each member at equal optical density, OD600 0.01 per strain, and inoculate the assembled
    community into 1.8 mL MBL medium containing 0.2% (w/v) F. vesiculosus fucoidan as the sole carbon source.
  perturbation_design: Measure all 127 possible one- to seven-member combinations of F12, F40, F56, F94, V25, V69,
    and V4 plus a no-cell negative control to map the fucoidan-degradation landscape.
  measurement_endpoints:
  - total fucoidan degradation
  - fucoidan-bound fucose depletion
  - rare-sugar monomer depletion
  - growth on fucoidan
  - synergism scores against a resource-partitioning null model
  - trait-based predictions from fucose and rare-sugar degradation capacities
  notes: The record curates the seven-degrader full-combinatorial SynCom. G88/Pseudocolwellia sp. AS88 was one of the
    isolated degraders but was excluded from the 127-community experiment and is therefore not a member of this record.
  evidence:
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To systematically evaluate synergistic interactions in fucoidan degradation, we constructed all 127 possible combinations
      of the seven degraders F12, F40, F56, F94, V25, V69 and V4, along with a no-cell negative control.
    explanation: Names the seven strains and the complete non-empty combinatorial panel.
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each community was assembled by mixing strains at equal optical density (OD600) at 0.01 each and inoculating into
      1.8 ml of MBL medium supplemented with 0.2% (w/v) fucoidan from F. vesiculosus as the sole carbon source.
    explanation: Supports the equal-OD inoculation strategy and the MBL plus F. vesiculosus fucoidan medium.
  - reference: PMID:42649294
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Total degradation increased with community richness, ranging from 4% to a maximum of 97.1% in the 5-member community
      F40, F56, V69, F94 and V4
    explanation: Supports the measured upper end of the community-function landscape.
