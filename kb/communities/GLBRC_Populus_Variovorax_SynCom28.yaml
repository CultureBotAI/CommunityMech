growth_media:
- name: R2A (strain propagation) with in planta Populus microcosm colonization
  temperature: '30'
  temperature_unit: °C
  temperature_range: '17-21'
  shaking_speed: '200'
  shaking_speed_unit: rpm
  light_regime: 16 h photoperiod
  incubation_time: '3'
  incubation_time_unit: weeks
  inoculum_source: single colonies propagated overnight in liquid R2A
  vessel_type: sterile Populus microcosm (controlled growth chamber)
  preparation_notes: Strains grown from R2A plates in liquid R2A at 30°C/200 rpm, then inoculated into
    sterile Populus microcosms; colonization assessed after 3 weeks.
  evidence:
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Microcosms were sealed and maintained under controlled growth chamber conditions (16 h photoperiod, 21°C/17°C day/night, 60% RH) for 3 weeks
    explanation: Source states the growth-chamber conditions (photoperiod, day/night temperature, humidity, 3 weeks) of the in planta colonization cultivation.
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A single colony from each plate was used to inoculate 5 mL of R2A and incubated overnight at 30°C and 200 rpm by continually shaking
    explanation: Source states the R2A medium and 30 °C / 200 rpm conditions used to propagate the strains before inoculation.
