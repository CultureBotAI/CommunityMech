discussions:
- discussion_id: variovorax_competition_and_fucose_scope
  prompt: Which resource and regulatory mechanisms explain strain-resolved compartment enrichment?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Variovorax Relative Compartment Enrichment
  - ecological_interactions#Proposed Variovorax Resource Competition
  - ecological_interactions#CF313 Fucose-Pathway-Associated Root Recovery
  rationale: 'The 28-strain metagenomic profiles describe relative DNA enrichment, while CF313 deletion and root
    CFU recovery are a separate strain-specific perturbation. Resource competition remains an author-proposed hypothesis.
    The study did not quantify host fucose; intact pathways did not guarantee growth. Complementation, full-panel
    mutant replacement, absolute strain abundance and resource/flux perturbations would distinguish direct metabolic
    mediation, regulatory effects and host filtering. No priority effects or facilitation of other strains are established.
    Existing-node and arrow corrections address #1471 without new structure or provider spend. Non-graph metadata
    and source-cache front matter are preserved, not certified. Complete cached main body and Methods/captions read;
    no figure images, separate supplements, raw data or analysis code audited.'
  posed_by: codex
  posed_date: '2026-10-06'
curation_history:
- timestamp: '2026-10-06T11:33:41Z'
  curator: codex
  action: REVIEW_CAUSAL_GRAPH
  changes: 'Retain relative compartment enrichment, not reduced competition or absolute colonization efficiency.;
    Retain author-proposed resource competition as HYPOTHESIZED without a selective compartment-causation claim.;
    Restrict the existing fucose node to canonical CF313 locus-associated root recovery, not interstrain facilitation
    or pathway sufficiency. Issue #1471; reports/causal_graph_review/decisions/20261006-variovorax-batch43.yaml'
  llm_assisted: true
