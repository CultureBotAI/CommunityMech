environmental_factors:
- name: Endosphere selective pressure
  value: host-filtered root endosphere
  description: Endosphere colonization requires host entry and in planta persistence.
  evidence:
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In particular, the endosphere represents a highly selective environment requiring host entry
      and in planta persistence.
    explanation: Supports compartment-specific selective pressure in this SynCom study.
- name: Compartment partitioning design
  value: rhizosphere versus endosphere
  description: The SynCom was profiled in both root-associated compartments to identify endosphere-specialized
    strains.
  evidence:
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Here, we use a defined, genome-resolved community of 28 Variovorax strains isolated from
      the roots of Populus deltoides and Populus trichocarpa (poplar trees) to determine which strains
      partition between rhizosphere and endosphere compartments and to identify the genomic traits associated
      with endosphere specialization.
    explanation: Supports dual-compartment design and the endosphere specialization objective.
ecological_interactions:
- name: Variovorax Relative Compartment Enrichment
  description: After equal-OD preparation and three weeks in axenic P. deltoides or P. trichocarpa microcosms, strain-resolved
    metagenomic profiles showed relative endosphere-versus-rhizosphere enrichment. Five strains accounted for about
    80% of mapped endosphere reads, while enrichment and normalized read abundance identified distinct patterns. This
    is relative DNA compartment association, not absolute colonization efficiency, physical exclusion, or demonstrated
    reduction of competition. Some abundant strains were generalists in both compartments. Isolation source and
    shared genus do not establish fixed niche identity or a single species; the authors distinguish ANI-defined
    lineages and putative species.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we use a defined, genome-resolved community of 28 Variovorax strains isolated from the roots of Populus
      deltoides and Populus trichocarpa (poplar trees) to determine which strains partition between rhizosphere
      and endosphere compartments
    explanation: The complete main body supports compartment-associated relative strain profiles; the study aim
      alone does not demonstrate reduced competition or absolute colonization efficiency.
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: dominant endosphere colonizers are enriched in genes related to nutrient metabolism, redox balance,
      transcriptional regulation, and a conserved L-fucose utilization pathway
    explanation: Gene-content enrichment is inferred potential associated with selected lineages, not directly measured
      expression or mediator necessity.
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Log₂ fold changes (endosphere vs. rhizosphere) were used to quantify differential compartment association
      rather than absolute colonization efficiency
    explanation: The Methods explicitly limit the metagenomic comparison to differential compartment association.
