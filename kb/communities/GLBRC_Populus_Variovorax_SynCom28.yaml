- name: Proposed Variovorax Resource Competition
  description: 'HYPOTHESIZED: The authors propose metabolic competitiveness alongside regulatory adaptation as alternative
    routes to successful endosphere colonization. Associations among community abundance, genomic traits and separate
    sole-fucose growth assays support this interpretation, not directly measured depletion of host resources, reciprocal
    partner harm, or selective mediation of compartment enrichment. Host fucose concentrations were not quantified.
    All 28 canonical participants denote the assayed community, not 28 demonstrated competitive pairs; these isolates
    span putative species within Variovorax, so intraspecific competition is not established.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41543249
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: These findings reveal that multiple ecological strategies, such as metabolic competition, regulatory
      adaptation, and niche specialization, can support endosphere colonization.
    explanation: Supports the authors' ecological interpretation of genomic, growth and enrichment observations,
      not selective measurement of resource competition or a causal arrow to compartment partitioning.
  - reference: PMID:41543249
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Not all strains succeed through the same strategy. Community-wide functional profiling revealed a distinct
      and reduced set of traits in the endosphere
    explanation: Supports the authors' ecological interpretation of genomic, growth and enrichment observations,
      not selective measurement of resource competition or a causal arrow to compartment partitioning.
