- name: CF313 Fucose-Pathway-Associated Root Recovery
  description: In the separate CF313 assay, deletion of the L-fuconolactonase gene PMI12_01353 abolished growth
    with L-fucose as sole carbon source and reduced recoverable root CFUs in sterile P. deltoides microcosms relative
    to wild type (reported P=0.0022). This supports a locus-associated contribution to recovered colonization in
    the tested strain and host, not facilitation of other strains, priority effects, or a community-wide cause of
    relative compartment enrichment. Only CF313, OV700 and YR750 showed the reported sole-fucose growth among 28
    strains; several intact-pathway strains did not grow. Gene presence alone is not sufficient, and host fucose
    was not quantified. Complementation rescue and full-panel mutant replacement are not established by the inspected
    main body; no distinct entry, persistence or in planta flux mechanism is assigned.
  scope: PAIRWISE
  metabolites:
  - preferred_term: L-fucose
    term:
      id: CHEBI:18287
      label: L-fucose
    notes: Substrate in the separate sole-carbon-source assay; concentration and flux in the host were not measured.
  evidence:
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The resulting CF313Δfuc strain failed to grow on L-fucose as a sole carbon source, while the wild type
      showed robust growth under the same conditions
    explanation: Supports the strain-specific growth phenotype after locus deletion, not universal sufficiency of
      pathway possession.
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: When inoculated into sterile P. deltoides microcosms, the mutant exhibited significantly reduced colonization
      compared to wild-type CF313
    explanation: Supports the reported mutant-versus-wild-type root recovery endpoint in the separate assay; not
      partner facilitation or mediation of the complete SynCom compartment pattern.
  - reference: PMID:41543249
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Other strains, which included those with intact fucose pathways, such as BK151, BK613, BK370, and YR634,
      showed little to no growth.
    explanation: Bounds gene-presence claims with the separate strain growth screen.
  source_taxon:
    preferred_term: Variovorax sp. CF313
    term:
      id: NCBITaxon:34072
      label: Variovorax
