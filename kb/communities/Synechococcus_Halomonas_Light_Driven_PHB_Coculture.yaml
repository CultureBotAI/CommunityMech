id: CommunityMech:000198
name: Synechococcus-Halomonas Light-Driven PHB Coculture
description: >
  A synthetic, light-driven two-member phototroph-heterotroph consortium pairing
  sucrose-exporting Synechococcus elongatus PCC 7942 cscB with the halotolerant
  polyhydroxybutyrate producer Halomonas boliviensis LC1. The cyanobacterium
  fixes carbon dioxide under illumination and exports sucrose, while H.
  boliviensis consumes the cyanobacterial sucrose and accumulates the bioplastic
  precursor polyhydroxybutyrate. The system is relevant to DOE carbon
  utilization and bioproduct goals because it couples photosynthetic carbon
  fixation to heterotrophic biopolymer production in a modular synthetic
  coculture.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert light and carbon dioxide into heterotrophic polyhydroxybutyrate production by
    coupling cyanobacterial sucrose secretion to a PHB-accumulating halophile.
  assembly_strategy: Pair engineered S. elongatus PCC 7942 cscB with H. boliviensis LC1, with sucrose
    export from the cyanobacterium supporting the heterotrophic PHB producer.
  perturbation_design: Evaluate suspended and hydrogel-encapsulated coculture formats for stable,
    light-driven PHB production.
  measurement_endpoints:
  - Sucrose-supported heterotroph growth
  - Polyhydroxybutyrate production
  - Coculture stability
  - Long-term productivity
  evidence:
  - reference: PMID:29061492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A synthetic, light-driven consortium of cyanobacteria and heterotrophic bacteria enables stable polyhydroxybutyrate production
    explanation: Supports the engineered light-driven consortium design and PHB production objective.
  - reference: PMID:29061492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sucrose secreted by S. elongatus CscB directly supports the bacterium Halomonas boliviensis
    explanation: Supports the exact phototroph-heterotroph pairing and sucrose cross-feeding design.
