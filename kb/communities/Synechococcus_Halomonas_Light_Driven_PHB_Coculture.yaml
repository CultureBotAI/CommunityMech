    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: sucrose biosynthetic process
    term:
      id: GO:0005986
      label: sucrose biosynthetic process
  downstream:
  - target: Light-Driven Biopolymer Production
    description: Photosynthetically supplied sucrose supports the PHB-producing Halomonas partner. This preserves
      the source-supported carbon-to-product route without asserting that the abstract proves exclusion of every
      external organic input or a quantitative carbon balance.
  evidence:
  - reference: PMID:29061492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sucrose secreted by S. elongatus CscB directly supports the bacterium Halomonas boliviensis
    explanation: Supports direct sucrose cross-feeding from the cyanobacterium to the Halomonas partner.
- name: Light-Driven Biopolymer Production
  description: The light-driven consortium accumulated PHB in H. boliviensis. The primary abstract reports up to
    31% of heterotroph dry weight as PHB and productive coculture persistence for over five months. This is a community
    production endpoint, not an additional pairwise exchange or direct photosynthesis by Halomonas. Exact assay
    and LC1 attribution await primary Methods.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: poly(3-hydroxybutyrate)
    term:
      id: CHEBI:53389
      label: poly(3-hydroxybutyrate)
  evidence:
  - reference: PMID:29061492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consortial H. boliviensis accumulate up to 31% of their dry-weight as PHB
    explanation: Supports PHB accumulation in the heterotroph, not a second exchange.
  - reference: PMID:29061492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cultures were continuously productive for over 5 months
    explanation: Supports the reported duration without assigning an unverified operating mode.
  participating_taxa:
