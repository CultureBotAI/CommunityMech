ecological_interactions:
- name: Photosynthetic Sucrose Transfer To Halomonas
  description: The study reports that sucrose secreted by S. elongatus CscB directly supports H. boliviensis in
    the light-driven consortium. CO2 is the photosynthetic substrate, not the exchanged organic carbon. The record
    retains its canonical LC1 identity, but the available primary abstract identifies the heterotroph only at species
    level; strain-specific attribution and complete medium inputs remain unverified.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Synechococcus elongatus PCC 7942 cscB
    term:
      id: NCBITaxon:32046
      label: Synechococcus elongatus
  target_taxon:
    preferred_term: Halomonas boliviensis LC1
    term:
      id: NCBITaxon:1072583
      label: Vreelandella boliviensis LC1
  metabolites:
