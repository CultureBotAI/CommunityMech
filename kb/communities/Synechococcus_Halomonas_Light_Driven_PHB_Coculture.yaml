- name: Alginate-Partitioned Coculture Stabilization
  description: Alginate encapsulation of S. elongatus CscB increased sucrose export and improved coculture stability
    in the primary abstract. This is an abiotic partitioning intervention, not organism-driven colonization facilitation.
    The source supports these positive effects but the abstract does not isolate how much of PHB output is mediated
    by export versus other effects.
