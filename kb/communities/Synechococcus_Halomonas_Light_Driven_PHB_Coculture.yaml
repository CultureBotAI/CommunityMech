    term:
      id: CHEBI:16526
      label: carbon dioxide
    notes: Carbon-fixation substrate, not the transferred organic carbon.
  - preferred_term: sucrose
    term:
      id: CHEBI:17992
      label: sucrose
  biological_processes:
