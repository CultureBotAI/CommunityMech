ecological_interactions:
- name: Low-Oxygen Algal O2 Support for Methane Oxidation
  description: Under low initial oxygen, photosynthetic Galdieria sp. RTK37.1 supplies oxygen supporting Methylacidiphilum
    sp. RTK17.1 growth and methane oxidation. The positive support depends on inoculum proportions and gas supply.
    This directed benefit does not by itself establish reciprocal carbon donation to the alga or obligatory mutualism.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Galdieria sp. RTK37.1
    term:
      id: NCBITaxon:2530459
      label: Galdieria sp.
  target_taxon:
    preferred_term: Methylacidiphilum sp. RTK17.1
    term:
      id: NCBITaxon:511746
      label: Candidatus Methylacidiphilum infernorum
  metabolites:
  - preferred_term: oxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  downstream:
  - target: Methane-Linked Carbon Valorisation
    description: Algal oxygen production supports aerobic methane oxidation and contributes to greater whole-coculture
      net carbon fixation at low methanotroph-to-alga ratios. This is a condition-dependent system benefit, not
      quantified methanotroph-to-alga carbon transfer.
  evidence:
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: oxygen supplied by the extremophilic microalga Galdieria sp. RTK37.1
    explanation: Supports algal oxygen supply to the methanotroph.
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enhancing growth and methane oxidation
    explanation: Supports the positive effect of algal oxygen supply on methanotroph performance.
- name: Biomass-Ratio-Dependent Oxygen Competition
  description: At initial Methylacidiphilum:Galdieria biomass ratios >=0.23:1 in low-oxygen methane-fed batches,
    growth fell 66-100% and net carbon fixation fell 44-62% relative to methane-free controls. Pigment loss, chlorosis
    and LC-MS-confirmed extracellular coproporphyrin III accompanied oxygen competition. Daily CH4/CO2/O2 replenishment
    prevented chlorosis. In a separate recovery experiment, methane was removed on day 4 and oxygen was allowed
    to accumulate without oxygen addition; pigments recovered before growth resumed. Oxygen-dependent HemF inhibition
    and porphyrin reuptake are proposed molecular explanations, not directly measured enzyme inhibition or transport.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylacidiphilum sp. RTK17.1
    term:
      id: NCBITaxon:511746
      label: Candidatus Methylacidiphilum infernorum
  target_taxon:
    preferred_term: Galdieria sp. RTK37.1
    term:
      id: NCBITaxon:2530459
      label: Galdieria sp.
  metabolites:
  - preferred_term: oxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  - preferred_term: coproporphyrin III
    term:
      id: CHEBI:27609
      label: coproporphyrin III
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  downstream:
  - target: Methane-Linked Carbon Valorisation
    description: Oxygen competition at high methanotroph abundance suppresses algal activity and decreases whole-coculture
      carbon fixation, opposing the low-ratio benefit. Ratio and gas interventions support this physiological mechanism;
      they do not individually establish HemF inhibition, porphyrin reuptake or a universal ratio threshold.
  evidence:
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: inhibitory due to oxygen competition
    explanation: Supports ratio-dependent oxygen competition, not reciprocal benefit at every ratio.
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: chlorosis and excreted coproporphyrin III
    explanation: Supports the curated chlorosis and coproporphyrin III response.
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No O2 was added at any point.
    explanation: Figure 5 distinguishes methane-withdrawal recovery from the separate daily gas-replenishment prevention
      experiment.
- name: Methane-Linked Carbon Valorisation
  description: Methane-fed cocultures at low initial Methylacidiphilum:Galdieria ratios (<0.18:1) showed 17-28%
    greater net carbon fixation than methane-free controls. This endpoint was calculated from initial/final gas
    concentrations, pressure and temperature across six days; it is a whole-system carbon balance, not partner-resolved
    assimilation or proof of CO2 transfer from methanotroph to alga. The maximum measured methane-consumption rate
    was 0.124 +/- 0.001 mmol/L/h at 0.15:1, where methane was depleted, so it is not an unconstrained rate optimum.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
