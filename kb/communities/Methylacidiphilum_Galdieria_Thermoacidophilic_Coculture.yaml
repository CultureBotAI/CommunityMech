    term:
      id: GO:0015947
      label: methane metabolic process
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: greater net carbon fixation
    explanation: Supports methane-linked improvement in carbon fixation at low initial ratios.
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: methane-fed photobioreactors relevant to SCP production
    explanation: Supports the methane-fed photobioreactor and carbon-valorisation context.
