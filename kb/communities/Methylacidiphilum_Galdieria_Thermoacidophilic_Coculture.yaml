id: CommunityMech:000171
name: Methylacidiphilum-Galdieria Thermoacidophilic Methane Coculture
description: >
  A defined thermoacidophilic methanotroph-microalga coculture pairing Methylacidiphilum sp.
  RTK17.1 with Galdieria sp. RTK37.1 for methane and carbon dioxide valorisation. In methane-fed
  photobioreactor studies, the methanotroph benefits from oxygen supplied by the extremophilic
  microalga under low-oxygen conditions, enhancing growth and methane oxidation. Follow-up work
  showed that this interaction is density-dependent: low initial Methylacidiphilum:Galdieria ratios
  improve net carbon fixation, whereas elevated methanotroph abundance can impose oxygen competition,
  causing chlorosis and reduced carbon assimilation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Optimize an extremophile methane-fed photobioreactor coculture for single-cell protein
    production and carbon valorisation from methane and carbon dioxide.
  assembly_strategy: Bottom-up coculture of the thermoacidophilic methanotroph Methylacidiphilum sp.
    RTK17.1 with the extremophilic microalga Galdieria sp. RTK37.1.
  perturbation_design: Initial Methylacidiphilum:Galdieria biomass ratios were varied to test how
    partner abundance controls oxygen partitioning, growth, chlorosis, and net carbon assimilation.
  measurement_endpoints:
  - Coculture dynamics
  - Overall carbon assimilation
  - Growth inhibition
  - Methane oxidation
  - Chlorosis and coproporphyrin III excretion
  evidence:
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Methanotroph-microalgae cocultures offer a promising bioprocess platform
    explanation: Supports the engineered methanotroph-microalga bioprocess framing.
  - reference: PMID:41888821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sustainable single-cell protein (SCP) production
    explanation: Supports the single-cell protein production objective.
