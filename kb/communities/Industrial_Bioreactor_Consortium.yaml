environment_term:
  preferred_term: bioreactor
  term:
    id: ENVO:00002123
    label: bioreactor
  notes: 'Industrial-scale continuous and batch bioreactor system for chalcopyrite and sulfide ore bioleaching.
    Reactors operate at controlled moderate thermophilic temperatures (40-50°C) with pH maintained at
    1.5-2.0 through microbial sulfuric acid generation. Pulp density ranges from low (1-4%) to high (20%
    w/v) after multi-year adaptation through serial subculturing. Aeration provides oxygen
    with optional CO₂ enrichment for autotrophic carbon fixation. Reactor configurations include
    different bioreactor operating modes. Carbon
    source variations (CO₂, molasses, organic matter) create distinct selective pressures shaping community
    composition. Temperature treatments span 40°C, 45°C, and 50°C to optimize moderate thermophile activity.
    The system supports temporal succession across operational phases as pH, iron redox chemistry,
    and metal concentrations create dynamic ecological niches.

    '
