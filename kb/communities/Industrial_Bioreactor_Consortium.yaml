- name: Late-Stage Extreme Acidophile Iron Oxidation
  description: 'In late-stage reactor operation, Ferroplasma species (F. thermophilum, F. acidiphilum,
    Ferroplasma sp., Acidiplasma sp.) dominate the consortium. These cell
    wall-lacking archaea thrive under extreme conditions: low pH and elevated dissolved
    metal concentrations (Cu²⁺, Zn²⁺, Ni²⁺). Ferroplasma oxidizes Fe²⁺
    using sulfocyanin-based electron transport, distinct from bacterial rusticyanin systems. Facultatively
    aerobic and mixotrophic, these archaea utilize both iron oxidation and accumulated dissolved organic
    matter for energy and carbon. Their extreme metal tolerance (growth at 1000 mM heavy metals) and pleomorphic
    morphology (no peptidoglycan cell wall) enable persistence in acidic, toxic conditions that eliminate
    competitors. Ferroplasma maintains sustained Fe³⁺ generation for continued copper extraction throughout
    extended reactor operation, preventing Fe³⁺ depletion that would halt bioleaching. The succession
    from bacterial to archaeal iron oxidizers demonstrates niche differentiation along chemical gradients
    in industrial reactors.

    '
