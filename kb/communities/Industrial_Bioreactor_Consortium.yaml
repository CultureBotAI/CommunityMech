environmental_factors:
- name: Moderate Thermophilic Temperature Range
  value: 40-50
  unit: °C
  description: 'Reactor temperatures span moderate thermophilic range optimized for thermotolerant acidophiles.
    Treatments include 40°C, 45°C (optimum for At. caldus, Sulfobacillus, Ferroplasma thermophilum), and
    50°C for enhanced kinetics. Elevated temperatures result from exothermic sulfide oxidation reactions
    (CuFeS₂ + O₂ → heat) in industrial-scale operations. Moderate thermophily (40-50°C) provides faster
    reaction rates than mesophilic systems (30°C) while avoiding extreme thermophile requirements (>60°C).
    Temperature gradients create spatial niches favoring different organisms: At. caldus (40-52°C), Sulfobacillus
    (45-55°C), Ferroplasma (40-55°C), enabling coexistence and temporal succession. Controlled temperature
    is critical for population dynamics and copper extraction efficiency.

    '
  evidence:
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results show that the culture consisted mainly of four species, including Leptospirillum
      ferriphilum, Acidithiobacillus caldus, Sulfobacillus acidophilus, and Ferroplasma thermophilum,
      before adapting to a pulp density of 4%
    explanation: Establishes optimal operating temperature
  - reference: doi:10.3390/biology12111411
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At the same time, the application of additional carbon dioxide improved the bio-oxidation
      performance at temperatures of 45 and 50 °C and made it possible to avoid the inhibition of bio-oxidation
      due to an increase in the temperature
    explanation: Documents temperature gradient experimental design
- name: Extreme Acidity and pH Succession
  value: low pH
  unit: pH units
  description: 'Reactor pH can decline as microbial sulfur
    oxidation generates sulfuric acid. Early stages favor At. caldus dominance, while late stages
    favor Ferroplasma and Acidiplasma. The pH gradient structures community composition through
    differential acid tolerance, with successive waves of specialists adapted to progressively more extreme
    acidity. Extremely low pH (1.5-2.0) prevents metal hydroxide precipitation, maintains Fe³⁺ solubility,
    protonates mineral surfaces for enhanced oxidant attack, and creates selective pressure excluding
    non-acidophiles. pH is controlled by balance between sulfuric acid generation (At. caldus, S. acidophilus)
    and acid consumption by mineral dissolution and Fe²⁺ oxidation.

    '
  evidence:
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results show that the culture consisted mainly of four species, including Leptospirillum
      ferriphilum, Acidithiobacillus caldus, Sulfobacillus acidophilus, and Ferroplasma thermophilum,
      before adapting to a pulp density of 4%
    explanation: Quantifies pH succession and community response
- name: High Pulp Density Through Adaptation
  value: 1-20% (adapted to 20% after >2 years)
  unit: '% w/v'
  description: 'Chalcopyrite concentrate pulp density ranges from low (1-4%) to industrial-scale high
    density (20% w/v = 200 g/L) achieved through multi-year serial subculturing adaptation. Low pulp densities
    (1-4%) support robust growth of all consortium members including sensitive L. ferriphilum. Above 4%,
    organic matter accumulation, flotation reagent residues, and elevated metal concentrations eliminate
    L. ferriphilum while selecting for tolerant Ferroplasma, Acidiplasma, Sulfobacillus, and At. caldus.
    At 20% pulp density, the adapted culture achieved 60.4% copper extraction in 25 days.
    High pulp density operations maximize metal recovery per batch, critical for
    industrial economics, but require adapted consortia with evolved tolerance to toxic organics and metals.

    '
  evidence:
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results show that the culture consisted mainly of four species, including Leptospirillum
      ferriphilum, Acidithiobacillus caldus, Sulfobacillus acidophilus, and Ferroplasma thermophilum,
      before adapting to a pulp density of 4%
    explanation: Quantifies high-density performance after adaptation
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: L. ferriphilum could not be detected when the pulp density was greater than 4%
    explanation: Identifies pulp density threshold beyond which L. ferriphilum is lost.
- name: CO2 Enrichment
  value: additional carbon dioxide
  unit: qualitative
  description: 'Additional carbon dioxide altered bio-oxidation performance in
    temperature-dependent fashion in the 2023 pyrite-arsenopyrite reactors:
    it did not affect bio-oxidation efficiency at 40 °C, but improved performance
    at 45 and 50 °C and helped avoid temperature-associated inhibition.

    '
  evidence:
  - reference: doi:10.3390/biology12111411
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At the same time, the application of additional carbon dioxide improved the bio-oxidation
      performance at temperatures of 45 and 50 °C and made it possible to avoid the inhibition of bio-oxidation
      due to an increase in the temperature
    explanation: Indicates CO₂ enrichment in operational parameters
- name: Carbon Source Variation
  value: CO2, molasses, organic matter
  unit: qualitative
  description: 'Carbon source variation creates distinct selective pressures shaping consortium composition.
    Autotrophic conditions (CO₂ enrichment only) favor obligate chemolithoautotrophs At. caldus and L.
    ferriphilum. Molasses addition (organic carbon, reducing sugars, vitamins) selects for mixotrophs
    Sulfobacillus and Ferroplasma while supporting heterotroph Cuniculiplasma. Organic matter from cell
    lysis, flotation reagents, and mineral processing byproducts accumulates during extended operation,
    shifting competitive balance toward mixotrophs and heterotrophs. The ability to utilize both inorganic
    (Fe²⁺, S⁰, CO₂) and organic substrates provides metabolic flexibility critical for adaptation to industrial
    reactor conditions with variable feed composition and operational modes (batch vs continuous).

    '
  evidence:
  - reference: doi:10.3390/biology12111411
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Temperature influenced the composition of the communities to a greater extent than the additional
      sources of carbon and the mode of operation of the bioreactor
    explanation: Documents carbon source experimental treatments
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results show that the culture consisted mainly of four species, including Leptospirillum
      ferriphilum, Acidithiobacillus caldus, Sulfobacillus acidophilus, and Ferroplasma thermophilum,
      before adapting to a pulp density of 4%
    explanation: Documents the four-member acidophile consortium before high-pulp-density adaptation.
- name: Reactor Configuration and Operational Mode
  value: bioreactor operating mode
  unit: qualitative
  description: 'The mode of bioreactor operation was varied along with temperature
    and carbon source in the 2023 pyrite-arsenopyrite bio-oxidation study, but
    temperature influenced community composition more strongly than operating
    mode or additional carbon sources. Understanding operational mode effects
    on microbial ecology optimizes reactor design for maximum metal recovery
    and stable long-term performance.

    '
  evidence:
  - reference: doi:10.3390/biology12111411
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Temperature influenced the composition of the communities to a greater extent than the additional
      sources of carbon and the mode of operation of the bioreactor
    explanation: Establishes comparative reactor configuration study design
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After that, the mixed cultures growing on different substrates were pooled equally, resulting
      in a final mixed culture
    explanation: Documents the pooled enrichment that was used for serial adaptation.
- name: Leaching Time and Succession Phases
  value: 0-25+ days with distinct phases
  unit: days
  description: 'Bioleaching timecourses exhibit distinct operational phases.
    In the 20% pulp-density chalcopyrite culture, A. caldus was predominant
    initially, S. acidophilus rather than A. caldus was predominant in the
    middle stage, and F. thermophilum accounted for the greatest proportion in
    the final stage. Total extraction reached 60.4%
    at 25 days for 20% pulp density. Extended operation enables continued metal recovery as long as Fe³⁺
    generation and acid production are sustained. The predictable succession pattern enables process optimization
    through targeted bioaugmentation or operational parameter adjustments (pH, temperature, aeration)
    to favor desired organisms at each stage.

    '
  evidence:
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results show that the culture consisted mainly of four species, including Leptospirillum
      ferriphilum, Acidithiobacillus caldus, Sulfobacillus acidophilus, and Ferroplasma thermophilum,
      before adapting to a pulp density of 4%
    explanation: Quantifies temporal succession and copper extraction timeline
- name: Ferric Iron Concentration Gradient
  value: ferric iron accumulation
  unit: g/L
  description: 'Fe³⁺ concentration increases during reactor operation as iron oxidizers
    accumulate ferric iron from continuous Fe²⁺ oxidation. Late-stage chemical conditions favor
    extreme acidophiles Ferroplasma and Acidiplasma over less acid-tolerant At. caldus
    and Sulfobacillus. High Fe³⁺ is essential for sustained chalcopyrite oxidation but creates toxicity
    stress for some organisms. The Fe³⁺/Fe²⁺ ratio influences redox potential, microbial energetics, and
    competitive outcomes. Industrial operations balance Fe³⁺ concentration to optimize both
    microbial activity and mineral dissolution kinetics.

    '
  evidence:
  - reference: PMID:24242252
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results show that the culture consisted mainly of four species, including Leptospirillum
      ferriphilum, Acidithiobacillus caldus, Sulfobacillus acidophilus, and Ferroplasma thermophilum,
      before adapting to a pulp density of 4%
    explanation: Links high Fe³⁺ to Ferroplasma competitive advantage
