- name: Early-Stage Iron Oxidation with Leptospirillum
  description: Leptospirillum ferriphilum contributes to iron oxidation in the early stages of bioreactor
    operation at lower pulp densities (<4% w/v). This obligate chemolithoautotroph efficiently colonizes
    sulfide mineral surfaces and oxidizes Fe²⁺ at pH approaching 1.5, working alongside Acidithiobacillus
    caldus in the initial consortium composition. However, L. ferriphilum is sensitive to elevated pulp
    densities, organic matter accumulation, and flotation reagent residues, becoming absent above 4% pulp
    density. As the reactor adapts to higher densities through serial subculturing, L. ferriphilum is
    replaced by more tolerant iron oxidizers like Ferroplasma species and Acidiplasma.
