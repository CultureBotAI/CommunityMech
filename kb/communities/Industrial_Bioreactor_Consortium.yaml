    notes: 'Gram-positive, moderately thermophilic (optimum 45-50°C), facultatively autotrophic bacterium
      that oxidizes both ferrous iron and reduced sulfur compounds. Spore-forming capability provides
      resilience to environmental stress, toxic metals, and nutrient limitation. Grows mixotrophically
      on organic compounds plus Fe²⁺ or S⁰, bridging autotrophic and heterotrophic niches. Sulfobacillus
      was one of the dominant bacterial groups in 2023 bio-oxidation reactors and the related
      S. acidophilus rather than A. caldus predominated in the middle stage of the adapted chalcopyrite
      culture. Enhanced ferrous iron oxidation capacity maintains Fe³⁺ supply for chalcopyrite dissolution
      during these transitions. Metal tolerance enables activity in copper, zinc, and nickel-rich leachates.
      Sulfobacillus species are critical for industrial thermophilic bioleaching (50-60°C) where elevated
      temperatures from exothermic sulfide oxidation favor this organism over mesophilic Acidithiobacillus.

      '
