id: CommunityMech:000182
name: Thermacetogenium-Methanothermobacter Acetate Oxidation Coculture
description: >
  A defined thermophilic anaerobic two-member syntrophic coculture in which
  Thermacetogenium phaeum strain PB oxidizes acetate using the reversible
  Wood-Ljungdahl/CO dehydrogenase-acetyl-CoA pathway, while Methanothermobacter
  thermautotrophicus strain TM consumes reduced products through hydrogenotrophic
  methanogenesis. This model system is relevant to anaerobic digestion and methane
  cycling because acetate oxidation is coupled to methane formation under low
  hydrogen partial pressure.
ecological_state: STABLE
community_origin: SYNTHETIC
community_category: METHANOGENESIS
engineering_design:
  objective: Use a defined thermophilic coculture to study syntrophic acetate oxidation
    coupled to hydrogenotrophic methanogenesis.
  assembly_strategy: Pair the acetate-oxidizing bacterium Thermacetogenium phaeum PB
    with the hydrogen-utilizing methanogen Methanothermobacter thermautotrophicus TM.
  perturbation_design: Compare syntrophic coculture growth on acetate with pure-culture
    or reverse-direction assays supplied with H2/CO2.
  measurement_endpoints:
  - Acetate oxidation
  - Methane production
  - Hydrogen partial pressure
  - CO dehydrogenase/acetyl-CoA pathway activity
  - Methanogenesis gene expression
  evidence:
  - reference: PMID:15866934
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: can also grow on acetate if cocultured
    explanation: Supports the experimental objective of acetate-linked syntrophic coculture growth.
  - reference: PMID:11872465
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: in a coculture with an acetate-oxidizing hydrogen-producing bacterium
    explanation: Supports the coculture design around acetate oxidation and hydrogen-producing syntrophy.
  - reference: PMID:31849917
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: oxidation of acetate in syntrophic cooperation with methanogens
    explanation: Supports acetate oxidation in syntrophic association with methanogens as the model function.
