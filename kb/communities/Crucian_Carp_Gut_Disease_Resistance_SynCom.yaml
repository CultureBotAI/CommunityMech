ecological_interactions:
- name: SynCom-associated intestinal immune responses
  description: After 28 days of SynCom feeding, crucian carp showed increased intestinal SOD, CAT, ACP and lysozyme
    activities versus controls, alongside immune-associated transcript changes and qPCR validation of selected genes.
    The intestinal immune network for IgA production is a KEGG pathway annotation, not a direct IgA production assay.
    These treatment-associated host responses do not establish commensal microbial fitness or selective immune mediation
    of challenge protection.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Cetobacterium
    term:
      id: NCBITaxon:180162
      label: Cetobacterium
  - preferred_term: Paraclostridium
    term:
      id: NCBITaxon:1849822
      label: Paraclostridium
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  downstream:
  - target: SynCom-mediated suppression of Aeromonas hydrophila
    description: PARTIAL - prechallenge immune-associated responses could contribute to the improved survival and
      reduced pathogen DNA loads after SynCom feeding. The treatment comparison supports protection, but no selective
      immune blockade or rescue establishes these responses as necessary or sufficient mediators.
  evidence:
  - reference: PMID:41280275
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: the results revealed significant upregulation of immune-related pathways, particularly the intestinal
      immune network for IgA production
    explanation: Supports a pathway-level interpretation; primary sections 3.5-3.6 separately report enzyme activities,
      transcript enrichment and selected-gene qPCR. The annotation label is not a direct IgA assay or selective
      mediation experiment.
- name: SynCom-associated intestinal barrier markers
  description: SynCom feeding increased zo-1, occludin and claudin12 transcript levels, and transcriptomics enriched
    tight-junction-associated pathways. DAO activity also increased; the paper interprets this injury-associated
    marker as possible mucosal turnover or repair, not an unambiguous improvement in permeability. These results
    support a barrier-response hypothesis, not direct barrier-protein abundance, selective functional barrier rescue
    or reciprocal microbial benefit.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Cetobacterium
    term:
      id: NCBITaxon:180162
      label: Cetobacterium
  - preferred_term: Paraclostridium
    term:
      id: NCBITaxon:1849822
      label: Paraclostridium
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  downstream:
  - target: SynCom-mediated suppression of Aeromonas hydrophila
    description: PARTIAL - altered barrier-associated transcripts could contribute to lower intestinal and kidney
      pathogen DNA loads and improved survival after challenge. The SynCom treatment effect is measured, but marker
      changes and ambiguous DAO activity do not isolate epithelial barrier function as the necessary mediator.
  evidence:
  - reference: PMID:41280275
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: activation of tight junction signaling pathways was observed
    explanation: Supports the authors' pathway-level barrier interpretation; enrichment and transcript markers are
      not a direct functional permeability or protein-abundance assay.
  - reference: PMID:41280275
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the expression levels of genes related to the intestinal barrier
    explanation: Primary Results section 3.5 describes gene-expression measurements, not the unqualified barrier-protein
      validation suggested by Discussion wording. The same section reports increased DAO activity and a possible
      turnover/repair interpretation.
- name: SynCom-mediated suppression of Aeromonas hydrophila
  description: After 28 days of three-strain SynCom feeding, challenged crucian carp had 60% survival versus 32.5%
    in controls and lower calibrated qPCR Aeromonas DNA loads in intestine and kidney. These are positive host treatment
    outcomes, not merely relative 16S profiles or viable-pathogen counts. Immune and barrier mediation remains proposed,
    and reciprocal microbial competition is not established. The separate FMT survival comparison (66.7% versus
    36.7%) is not the SynCom result.
  scope: COMMUNITY_LEVEL
  participating_taxa:
