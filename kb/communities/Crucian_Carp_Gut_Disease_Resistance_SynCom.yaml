    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: administration of this community significantly improved host resistance to A. hydrophila (p < 0.05)
      by activating intestinal immune responses and reinforcing the gut barrier
    explanation: Supports the protective feeding intervention. Primary Results section 3.5 supplies survival and
      qPCR-load endpoints; its immune/barrier interpretation is not a selectively tested mediation pathway.
