cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  controls_notes: Pairwise and triple-strain co-cultures incubated 78 h at inoculation
    ratios of 1:1 and 1:1:1, as an in vitro antagonism check before the feeding trials.
  notes: 'Deliberately thin, and thin because the paper is: the retrievable text gives
    the duration and the inoculation ratio for the co-cultures but puts the medium and
    temperature in Supplementary Fig. S10, which is not part of the cached full text.
    The 28 C anaerobic incubation that does appear belongs to the isolation plates
    that produced the strains, not to the co-culture (#529). Recorded rather than
    omitted because "these three were grown together in vitro, at a defined ratio,
    for 78 h" is itself a fact about the community that the record otherwise lacks.'
  evidence:
  - reference: PMID:41280275
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pairwise and triple-strain co-cultures were incubated for 78 h at
      inoculation ratios of 1:1 or 1:1:1, respectively, and no antagonistic or
      inhibitory effects were observed
discussions:
- discussion_id: crucian_syncom_host_mediation
  prompt: Which host responses and microbial functions causally mediate SynCom protection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#SynCom-associated intestinal immune responses
  - ecological_interactions#SynCom-associated intestinal barrier markers
  - ecological_interactions#SynCom-mediated suppression of Aeromonas hydrophila
  rationale: 'Complete main-body Methods and Results support 28-day feeding, enzyme/transcript responses, challenge
    survival and calibrated qPCR pathogen loads. They do not report selective immune/barrier blockade or rescue,
    direct barrier permeability or barrier-protein validation. Elevated DAO is ambiguous, and the IgA phrase is
    a pathway annotation. Main text reports non-antagonistic in vitro co-culture and preliminary single/pair/triple
    feeding comparisons; supplementary images/data were not inspected. In-host cross-feeding and signaling remain
    hypotheses. Species/strain metadata and conflicting source units/schedules are tracked separately in #1353;
    canonical genus participants are preserved here.'
