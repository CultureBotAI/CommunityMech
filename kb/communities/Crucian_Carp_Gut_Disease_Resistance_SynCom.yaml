ecological_interactions:
- name: SynCom-mediated suppression of Aeromonas hydrophila
  description: The three-genus SynCom (Cetobacterium, Paraclostridium, Pseudomonas) significantly
    reduced the abundance of the pathogen Aeromonas hydrophila by activating intestinal immune
    responses and reinforcing the gut barrier, an emergent host-mediated antagonism rather than a
    direct pairwise microbe-microbe interaction.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  target_taxon:
