id: CommunityMech:000293
name: Crucian Carp Gut Disease-resistance SynCom
description: A simplified synthetic microbial community of three gut genera (Cetobacterium,
  Paraclostridium, and Pseudomonas) assembled from the intestinal microbiota of crucian carp
  (Carassius auratus). These genera were enriched in fish that displayed mild symptoms after
  Aeromonas hydrophila infection, and fecal microbiota transplantation from mild-symptom fish
  conferred enhanced resistance to the pathogen. The reconstituted SynCom significantly reduced
  A. hydrophila abundance by activating intestinal immune responses and reinforcing the gut
  barrier, supporting microbiome-based disease prevention in aquaculture.
