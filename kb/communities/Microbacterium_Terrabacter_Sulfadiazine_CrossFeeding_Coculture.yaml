    explanation: Supports DSMZ 28514 as the Terrabacter culture used in the coculture assay.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: proving that this bacterium assimilates 2-AP for biomass synthesis
    explanation: Supports Terrabacter as the member that assimilates sulfadiazine-derived 2-aminopyrimidine.
ecological_interactions:
- name: Microbacterium 2-Aminopyrimidine Release
  description: Microbacterium sp. BR1 transforms sulfadiazine and releases 2-aminopyrimidine (2-AP), which accumulates
    in its axenic culture. This supplies the intermediate used by Terrabacter in coculture. The complementary cultures,
    chemical time course and recipient isotope signal support sequential cross-feeding rather than merely co-occurring
    degradation.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Microbacterium sp. BR1
    term:
      id: NCBITaxon:1070896
      label: Microbacterium sp. BR1
  target_taxon:
    preferred_term: Terrabacter sp. 2APm3
    term:
      id: NCBITaxon:1472881
      label: Terrabacter sp. 2APm3
  metabolites:
  - preferred_term: 2-aminopyrimidine
    term:
      id: CHEBI:38618
      label: pyrimidin-2-amine
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Terrabacter 2-Aminopyrimidine Assimilation
    description: Microbacterium cleavage supplies sulfadiazine-derived 2-AP to Terrabacter, enabling recipient carbon
      assimilation. Terrabacter alone did not remove parent sulfadiazine; the coculture-specific recipient Raman
      shift and axenic 2-AP accumulation support this causal sequence.
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: fragment is released from sulfadiazine by Microbacterium BR1
    explanation: Supports Microbacterium BR1 as the strain releasing 2-aminopyrimidine from sulfadiazine.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microbacterium led to the entire degradation of sulfadiazine with concomitant accumulation of 2-AP
    explanation: Supports 2-aminopyrimidine accumulation as a Microbacterium monoculture dead-end product.
- name: Terrabacter 2-Aminopyrimidine Assimilation
  description: Terrabacter assimilates carbon from Microbacterium-released 2-AP in coculture. Its phenylalanine
    Raman peak shifted from about 1000 to 988 cm-1 with the pyrimidine-labeled substrate, supporting 13C incorporation;
    this signal does not independently establish 15N assimilation. Detectably labeled Terrabacter fractions were
    42.8 +/- 1.8% on day 2 and 45.9 +/- 3.2% on day 4, so activity is heterogeneous and subthreshold activity is
    not excluded. Recipient cell counts recovered between days 2 and 4 after an initial decline, not uninterrupted
    growth of both partners.
  interaction_type: COMMENSALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Microbacterium sp. BR1
    term:
      id: NCBITaxon:1070896
      label: Microbacterium sp. BR1
  target_taxon:
    preferred_term: Terrabacter sp. 2APm3
    term:
      id: NCBITaxon:1472881
      label: Terrabacter sp. 2APm3
  metabolites:
  - preferred_term: 2-aminopyrimidine
    term:
      id: CHEBI:38618
      label: pyrimidin-2-amine
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Coculture Sulfadiazine Degradation
    description: 'Terrabacter utilization removes the 2-AP intermediate that persists in Microbacterium axenic cultures,
      allowing the coculture endpoint to lack detectable 2-AP. This complements parent transformation but does not
      accelerate it: parent sulfadiazine disappeared by day 2 in Microbacterium alone and day 4 in coculture.'
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: subsequently utilized by Terrabacter
    explanation: Supports Terrabacter consumption of the Microbacterium-derived intermediate.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Terrabacter assimilated carbon derived from 13C,15N-labeled 2-AP
    explanation: Supports carbon incorporation from the dual-labeled substrate, not a separate nitrogen-incorporation
      measurement or activity of every recipient cell.
- name: Coculture Sulfadiazine Degradation
  description: With 1 mM supplied sulfadiazine, the coculture showed complete parent disappearance by day 4 and
    no detectable 2-AP at sampled days 0, 2 and 4. Microbacterium alone removed parent by day 2 while accumulating
    about 1 mM 2-AP; Terrabacter alone did not remove parent. Preserve the positive complementary degradation endpoint
    without claiming faster parent removal, continuous absence of any intermediate pool, or quantitative mineralization
    from a closed carbon balance.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Microbacterium sp. BR1
    term:
      id: NCBITaxon:1070896
      label: Microbacterium sp. BR1
  - preferred_term: Terrabacter sp. 2APm3
    term:
      id: NCBITaxon:1472881
      label: Terrabacter sp. 2APm3
  metabolites:
  - preferred_term: sulfadiazine
    term:
      id: CHEBI:9328
      label: sulfadiazine
  - preferred_term: 2-aminopyrimidine
    term:
      id: CHEBI:38618
      label: pyrimidin-2-amine
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium degraded labeled sulfadiazine without any accumulation of 2-aminopyrimidine
    explanation: Supports coupled sulfadiazine degradation and 2-aminopyrimidine removal by the coculture.
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No traces of 2-AP were detected in cocultures at all sampling times
    explanation: Supports nondetection at sampled times, not continuous zero intermediate concentration or a measured
      carbon-mineralization balance.
