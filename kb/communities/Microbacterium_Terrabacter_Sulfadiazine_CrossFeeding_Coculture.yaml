    notes: >-
      2-aminopyrimidine-assimilating Terrabacter partner; the 2026 article used
      the DSMZ 28514 stock corresponding to this Terrabacter sp. 2APm3 taxon.
  strain_designation:
    strain_name: DSMZ 28514
  functional_role:
  - CROSS_FEEDER
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
