discussions:
- discussion_id: exact-brunner-msm-vitamin-composition
  prompt: Which Brunner MSM salts, vitamins, and supplement concentrations were present in the sulfadiazine isotope-tracing
    coculture medium?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - growth_media#sulfadiazine isotope-tracing coculture medium
  rationale: The open article body identifies MSM Brunner plus vitamins and labeled sulfadiazine as the isotope-tracing
    coculture medium, but places full materials and methods details in supporting information.
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Supplementary experimental procedures: synthesis of 13C,15N-labeled sulfadiazine'
    explanation: Indicates that additional procedure details were separated into supporting information rather than
      fully reproduced in the article body.
  posed_by: codex
  posed_date: '2026-09-28'
- discussion_id: sulfadiazine_isotope_kinetics_and_donor_benefit
  prompt: What nitrogen incorporation and donor benefit accompany the demonstrated carbon cross-feeding?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Microbacterium 2-Aminopyrimidine Release
  - ecological_interactions#Terrabacter 2-Aminopyrimidine Assimilation
  - ecological_interactions#Coculture Sulfadiazine Degradation
  rationale: 'Retain all three nodes and both supported arrows. Dual-labeled substrate does not make the observed
    phenylalanine Raman shift an independent 15N readout. Partial recipient labeling, initial population decline
    and subsequent Terrabacter recovery bound the growth claim. Parent disappearance is slower in coculture than
    BR1 alone, whereas 2-AP removal is the complementary benefit. The paper''s proposed donor protection from 2-AP
    is not a selectively tested feedback mechanism, so no new return arrow is added. Complete primary main text
    and Table 1 read; supporting information/raw spectra not audited. #1611 repairs graph interpretation; #1612
    retains axenic-label wording and culture-stock/medium follow-up. Preserve the prior #1196 coculture-label fix
    and #1195 Brunner MSM discussion.'
  posed_by: codex
  posed_date: '2026-10-07'
metal_relevance: NOT_APPLICABLE
metal_notes: >-
