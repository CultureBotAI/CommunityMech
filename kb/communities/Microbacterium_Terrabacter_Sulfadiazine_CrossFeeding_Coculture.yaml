id: CommunityMech:000462
name: Microbacterium-Terrabacter Sulfadiazine Cross-Feeding Coculture
description: >-
  A two-member synthetic bacterial coculture pairing Microbacterium sp. BR1
  with Terrabacter sp. 2APm3/DSMZ 28514 for sulfadiazine degradation. Xue et
  al. 2026 traced 13C,15N-labeled sulfadiazine through the coculture and showed
  a sequential commensal pathway in which Microbacterium sp. BR1 cleaves
  sulfadiazine to release 2-aminopyrimidine and Terrabacter assimilates and
  degrades the 2-aminopyrimidine intermediate that accumulated in
  Microbacterium monoculture.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >-
    Assemble a defined two-strain synthetic ecosystem for complete sulfadiazine
    degradation by coupling Microbacterium sp. BR1 transformation of
    sulfadiazine to Terrabacter sp. 2APm3 consumption of the
    2-aminopyrimidine product.
  assembly_strategy: >-
    Grow Microbacterium sp. BR1 and Terrabacter DSMZ 28514 precultures and
    inoculate both strains into medium containing 1 mM pyrimidine-labeled
    sulfadiazine as the sole carbon source.
  perturbation_design: >-
    Compare the coculture with Microbacterium and Terrabacter axenic cultures in
    1 mM 13C,15N-diazine-labeled sulfadiazine as the sole carbon source and use
    unlabeled sulfadiazine coculture as a Raman-microscopy control.
  measurement_endpoints:
  - sulfadiazine concentration
  - 2-aminopyrimidine concentration
  - Microbacterium and Terrabacter cell-number ratio
  - single-cell Raman isotope shift
  evidence:
  - reference: PMID:42598292
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: consortium composed of Microbacterium sp. strain BR1 and Terrabacter
    explanation: >-
      Supports the defined two-member composition of the sulfadiazine-degrading
      synthetic ecosystem.
environment_term:
  preferred_term: sulfadiazine-fed laboratory coculture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >-
    Defined laboratory coculture assayed in liquid medium containing 1 mM
    sulfadiazine as a synthetic ecosystem for antibiotic degradation.
