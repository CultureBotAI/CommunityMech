id: CommunityMech:000368
name: Arabidopsis Bacillus Biocontrol SynCom150
description: A 150-member bacterial synthetic community assembled from genome-sequenced isolates recovered from surface-sterilized
  Brassicaceae roots, nearly all Arabidopsis thaliana, and applied to Arabidopsis Col-0 plants in gamma-irradiated coconut-coir
  and MS-agar microcosms. The study used top-down dropout and add-in deconstruction to test SynCom subsets against the leaf
  pathogen Pseudomonas syringae pv. tomato DC3000, resolving Bacillus and Pseudomonadota as protective components; follow-up
  halo assays, Bacillus-only inocula, leaf-recovery CFU assays, and Arabidopsis RNA-seq supported a model in which diverse
  rhizospheric Bacillus suppress Pto without requiring host immune activation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Identify which components of a complex Arabidopsis root-derived bacterial SynCom protect leaves against Pseudomonas
    syringae pv. tomato DC3000.
  assembly_strategy: Assemble 150 genome-sequenced bacterial isolates from surface-sterilized Brassicaceae roots into a defined
    SynCom, then deconstruct it into phylum-, class-, and genus-level add-in and dropout communities.
  inoculation_strategy: Revive frozen SynCom members in LB in 96-deep-well plates at 28°C with shaking, combine isolates after
    OD600 measurement into phylum-specific pools, normalize before and after pooling to OD600 0.1, centrifuge and resuspend
    the mixed cells in liquid Murashige-Skoog medium for inoculation.
  perturbation_design: First remove or individually add the four bacterial phyla in the full SynCom, then run second-round
    dropout and add-in tests for Alpha-, Beta-, and Gammaproteobacteria within Pseudomonadota and for Bacillus versus Paenibacillus
    within Bacillota.
  measurement_endpoints:
  - Pseudomonas syringae pv. tomato DC3000 luminescent CFU per milligram of Arabidopsis leaf tissue
  - SynCom colonization by 16S rRNA gene amplicon sequencing of rhizosphere, roots and shoots
  - plant shoot area and diseased-area image analysis
  - in vitro Pto halo inhibition by individual SynCom members
  - Arabidopsis leaf RNA-seq after full-SynCom and Bacillus-dropout treatments
  - Bacillus biosynthetic gene clusters predicted by antiSMASH
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The 150-member bacterial synthetic community (SynCom) used here contains genome-sequenced isolates
    explanation: Identifies the defined 150-member genome-sequenced bacterial SynCom used for the study.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Here, we tested a new screening strategy for ecologically relevant traits within the microbiome, that we term
      “top-down community deconstruction.”
    explanation: Names the top-down deconstruction strategy used to perturb the synthetic community.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'The SynCom contains four bacterial phyla: Actinomycetota, Bacillota, Bacteroidota, and Pseudomonadota'
    explanation: Supports the first deconstruction level across the four phyla in the complete bacterial SynCom.
