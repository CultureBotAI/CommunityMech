ecological_interactions:
- name: Closed Coir Arabidopsis Microbiota Reconstruction
  description: The full 150-member bacterial SynCom replaced microbes destroyed by gamma irradiation, colonized Arabidopsis
    rhizosphere, root and shoot compartments, and partially rescued the poor growth phenotype of plants raised on irradiated
    coconut coir.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: 150-member Brassicaceae-root bacterial SynCom
    term: *id001
  biological_processes:
  - preferred_term: plant-bacterium symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We replaced the destroyed microbiota with a 150-member SynCom composed of bacterial isolates previously retrieved
      from Arabidopsis roots
    explanation: Supports use of the 150-member root-derived SynCom to reconstruct the irradiated plant-growth microcosm.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We found that 100% of the 16S rRNA gene reads in our data originated from the inoculum
    explanation: Supports successful replacement of the resident microbiota by the inoculated SynCom.
- name: Bacillus-Dependent Pto Leaf-Pathogen Suppression
  description: 'Bacillus was the focal genus in the top-down Bacillota deconstruction: Bacillus-only add-ins protected Arabidopsis
    leaves from Pto colonization and Bacillus dropouts lost protection, whereas Paenibacillus-only and Paenibacillus-dropout
    comparisons did not show the same focal protective requirement.'
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - &id003
    preferred_term: protective Bacillus subset
    term: *id002
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  downstream:
  - target: Diverse Bacillus In Vitro Pto Antagonism
    description: Individual Bacillus isolates inhibited luminescent Pto lawns, supporting direct antagonism as a candidate
      mechanism for the plant-protection phenotype.
  - target: Immune-Independent Bacillus Protection
    description: Bacillus protected Arabidopsis even when the bbc1 receptor mutant reduced bacterial pattern-triggered immune
      recognition.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: This process of community deconstruction revealed a critical role for the genus Bacillus in protecting the plant
      from infection.
    explanation: Supports the top-down deconstruction result assigning Pto protection to Bacillus.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Only when multiple Bacillus strains were present together were the leaves protected from infection.
    explanation: Supports the diversity dependence of the Bacillus protection phenotype.
- name: Diverse Bacillus In Vitro Pto Antagonism
  description: Each Bacillus isolate in the screened set inhibited luminescent Pto on LB agar, producing an inhibition halo
    consistent with secreted diffusible antagonists; antiSMASH did not identify one BGC shared by all Bacillus strains and
    absent from the rest of the SynCom.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - *id003
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To scan the SynCom members for inhibition of the pathogenic bacterium Pto, we co-cultured each one of the SynCom
      bacteria with a Pto lawn on agar plates.
    explanation: Supports the direct Bacillus-Pto co-culture halo-assay design.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As the Bacillus strains all inhibited Pto in vitro and produced an inhibition halo indicative of a diffusible
      compound
    explanation: Supports the direct in vitro Pto antagonism detected for the Bacillus strains.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: we could not identify any BGCs that were common to all Bacillus strains and absent in the other strains in the
      collection
    explanation: Records that the in vitro phenotype could not be reduced to one Bacillus-specific biosynthetic gene cluster.
- name: Pseudomonadota Multi-Class Pto Protection
  description: Pseudomonadota members also contributed to Pto suppression at phylum scale, but second-round Alpha-, Beta-
    and Gammaproteobacteria add-in and dropout tests did not resolve the effect to one protective class.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: protective Pseudomonadota subset
    term: *id005
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we separately dropped out each of the three classes Alpha-, Beta-, and Gamma-proteobacteria. None of these drop-outs
      compromised the protection provided by the SynCom
    explanation: Supports the finding that Pseudomonadota protection was not attributable to one class-level dropout.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: in the case of Pseudomonadota, we could not identify a focal taxon
    explanation: Supports keeping this protective component at phylum level rather than over-resolving a class or genus.
- name: Immune-Independent Bacillus Protection
  description: The Bacillus subset suppressed Pto colonization in wild-type Arabidopsis and in the bbc1 pattern-recognition
    receptor co-receptor mutant, indicating that the protective outcome did not require fully functional plant bacterial pattern-triggered
    immunity.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - *id003
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Bacillus-inoculated plants from both genotypes were infection free
    explanation: Supports Bacillus-mediated protection in both wild-type and bbc1 Arabidopsis after Pto challenge.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We concluded that inoculating the rhizosphere with a consortium of Bacillus strains compensates for the lack
      of a fully functional immune system, protecting the plant from a leaf pathogen.
    explanation: Supports the conclusion that Bacillus protection can compensate for the bbc1 immune deficit.
environmental_factors:
- name: closed gamma-irradiated coir microcosm
  value: three 25 kGy gamma-irradiation rounds, 30 ml sterile liquid MS medium, 5 ml bacterial suspension
  description: The closed gnotobiotic screen grew Arabidopsis seedlings in Magenta GA-7 boxes containing sterilized coconut
    coir and introduced the OD-normalized bacterial suspension into the coir.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Coconut coir was placed in Magenta GA-7 culture boxes (plantMedia) and subjected to three rounds of gamma irradiation,
      25 kGy each.
    explanation: Supports the coir substrate, Magenta-box vessel, and gamma-sterilization dose.
- name: Pto-lux leaf challenge endpoint
  value: 6 days post-infection
  description: The deconstruction screen challenged SynCom-inoculated Arabidopsis leaves with luminescent Pto and quantified
    luminescent colony counts per milligram of leaf tissue six days later.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: measured the resulting population size of Pto per milligram of leaf tissue, 6 days post-infection
    explanation: Supports the pathogen-challenge readout and six-day post-infection endpoint.
growth_media:
- name: Luria Bertani medium
  temperature: '28'
  temperature_unit: degrees Celsius
  atmosphere: AEROBIC
  incubation_time: '6'
  incubation_time_unit: days
  shaking_speed: '250'
  shaking_speed_unit: rpm
  vessel_type: 96-deep-well plate
  preparation_notes: SynCom members were revived from 50% glycerol stocks for 4 days in 500 ul LB, transferred to fresh LB
    for another 48 h to produce aged and nonstationary cultures, OD-normalized into phylum pools, centrifuged and resuspended
    in liquid Murashige-Skoog medium.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: bacteria were inoculated from 50% glycerol stocks at −80°C into 500 μl Luria Bertani (LB) medium in a 96-deep-well
      plate
    explanation: Supports the LB revival medium, glycerol-stock source, culture volume, and 96-deep-well format.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial cultures were grown at 28°C, shaking at 250 rpm
    explanation: Supports the aerobic shaking incubation temperature and agitation rate.
- name: Murashige-Skoog Arabidopsis inoculation medium
  ph: '5.7'
  inoculum_size: '0.1'
  inoculum_unit: OD600
  vessel_type: Magenta GA-7 culture box or 12-well plate
  preparation_notes: The bacterial pellet was resuspended in liquid MS medium made from 2.2 g/l MS and 0.5 g/l MES, pH adjusted
    to 5.7 with KOH, then diluted for closed coir, MS agar, or open coir inoculation.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'MS medium was prepared according the following formula: 2.2 g MS (plantMedia), 0.5 g MES, 1 l double-distilled
      water, pH adjusted to 5.7 with 1 M KOH.'
    explanation: Supports the Murashige-Skoog inoculation-medium composition and pH.
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The resuspended solution was then diluted to OD600 = 0.1
    explanation: Supports the closed-system OD600 used for inoculation after LB-grown cells were resuspended in MS.
