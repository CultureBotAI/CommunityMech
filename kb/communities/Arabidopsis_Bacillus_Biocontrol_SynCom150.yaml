discussions:
- discussion_id: arabidopsis_bacillus_direct_vs_systemic_protection
  prompt: How much of the Bacillus-mediated leaf protection comes from direct leaf-level antagonism versus induced systemic
    resistance from the root compartment?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Bacillus-Dependent Pto Leaf-Pathogen Suppression
  - ecological_interactions#Immune-Independent Bacillus Protection
  rationale: Bacillus strains could be recovered from leaves and protected immune-impaired bbc1 plants, but the study leaves
    induced-resistance contributions unresolved.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: further research into the involvement of induced resistance is needed in order to fully tease apart induced immunity
      from direct pathogen inhibition
    explanation: Records the authors' stated uncertainty about the relative contribution of direct Bacillus-Pto antagonism
      and systemic host immunity.
  posed_by: codex
  posed_date: '2026-09-13'
- discussion_id: arabidopsis_pseudomonadota_focal_taxon_gap
  prompt: Which Pseudomonadota class or lower-resolution taxon combinations are sufficient to suppress Pto in this SynCom?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Pseudomonadota Multi-Class Pto Protection
  rationale: The first-round screen implicated the Pseudomonadota phylum, but second-round class add-ins and dropouts did
    not resolve a single focal class or genus.
  evidence:
  - reference: PMID:40590505
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In contrast to Bacillus, in the case of Pseudomonadota, we could not identify a focal taxon
    explanation: Supports an explicit gap rather than inventing a Pseudomonadota class-level driver.
  posed_by: codex
  posed_date: '2026-09-13'
