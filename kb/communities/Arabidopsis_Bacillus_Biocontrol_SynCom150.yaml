  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The primary plant-protection screen used Arabidopsis grown on gamma-irradiated coconut coir in Magenta GA-7 boxes
    covered with a breathable membrane; validation experiments also used MS agar and open unsterilized-coir systems.
