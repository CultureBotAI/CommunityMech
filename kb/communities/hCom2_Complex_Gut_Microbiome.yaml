growth_media:
- name: SAAC complete defined medium
  atmosphere: ANAEROBIC
  headspace_gas: 10% CO2, 5% H2, 85% N2
  vessel_type: 2.2-mL 96-well deep well plate
  inoculum_size: '10'
  inoculum_unit: '% (1:10 dilution)'
  preparation_notes: Individual strains were propagated in Mega Medium (MM) or Chopped
    Meat Medium (CMM) and diluted 1:10 every 24 h before assembly; the assembled community
    was propagated in vitro in SAAC complete defined medium.
  evidence:
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The community was propagated in vitro in SAAC medium
    explanation: Names SAAC as the defined medium used to propagate the assembled community.
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All culturing was done in an anaerobic chamber (Coy Laboratories) at 10% CO2,
      5% H2, and 85% N2 atmosphere.
    explanation: Supports the anaerobic atmosphere and headspace gas composition used
      for cultivation.
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: each of our 104 strains can be propagated in Mega Medium (MM), Chopped
      Meat Medium (CMM), or both
    explanation: Supports the media used to propagate individual community members.
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strains were diluted 1:10 every 24 h for 2 days into fresh growth medium
      in 2.2-mL deep well plates
    explanation: Supports the deep-well plate vessel and the 1:10 daily dilution regimen.
