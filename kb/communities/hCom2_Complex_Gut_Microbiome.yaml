id: CommunityMech:000123
name: hCom2 Complex Gut Microbiome
description: A complex defined human gut microbiome assembled from hCom1 and iteratively augmented after
  fecal challenge to improve stability and colonization resistance in gnotobiotic mice.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Construct a defined but complex gut microbiome that models human gut community functions
    in vivo.
  assembly_strategy: A 104-species hCom1 community was challenged with fecal microbiota in germ-free mice
    and augmented with engrafting species to yield hCom2.
  perturbation_design: Fecal challenge and pathogenic Escherichia coli challenge were used to test stability
    and colonization resistance.
  measurement_endpoints:
  - engraftment
  - community stability
  - colonization resistance
  - host phenotypes
  evidence:
  - &id001
    reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We identified new species that engrafted following fecal challenge and added them to hCom1,
      yielding hCom2.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: human gut
  term:
    id: UBERON:0001007
    label: digestive system
  notes: Defined human gut microbiome used in gnotobiotic mouse experiments.
taxonomy:
- taxon_term:
    preferred_term: defined human gut bacterial members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Gut Niche Filling and Colonization Resistance
  description: Iterative niche filling improved stability to fecal challenge and resistance to pathogenic
    Escherichia coli.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  working_volume: 4.0
  working_volume_unit: mL
  instrument_detail: >-
    Built up through deep-well plates: strains revived from frozen 96-well stocks into 1 mL in
    2.2 mL 96-well plates, diluted 1:10 every 24 h for two days, then 1:10 into 4 mL in 5 mL
    48-well plates. All culturing inside a Coy anaerobic chamber at 10% CO2 / 5% H2 / 85% N2.
    Communities were then propagated for 48 h per passage with DNA taken at 0, 12, 24 and 48 h.
    Member strains are maintained in Mega Medium, Chopped Meat Medium, or both; community
    experiments also ran in a complete defined medium and in versions with single amino acids
    removed.
  notes: >-
    `system_type` is OTHER because the format is a deep-well plate, which the enum has no
    value for; FLASK or a reactor type would assert a containment this does not have. The
    plate sizes are in instrument_detail instead.

    No `operating_temperature`: the source gives the chamber's gas mix but not its
    temperature, and a gut-community chamber is not necessarily at 37 °C by assumption.

    The amino-acid dropout media are named because they are the experiment: strains change
    relative abundance by orders of magnitude when a single amino acid is removed, so
    "defined medium" alone would describe a condition the study exists to vary.

    Third failure of the "likely refuse" group in #543, predicted on the assumption that a
    gut community lives in a mouse. hCom2 is used in gnotobiotic mice, but this paper builds
    and propagates it in vitro first - which is what OMM12 does not do, and why that one was
    correctly refused. Three of five in that group have now failed; the reasoning behind it
    should be treated as discarded rather than partly true.
  evidence:
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: constructing and propagating the 104-member community multiple times in vitro
    explanation: The community itself was built and grown in vitro, not only in a host.
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We propagated the communities for 48 h and extracted DNA for sequencing at 0, 12, 24,
      and 48 h
    explanation: The passage length and sampling schedule.
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that each of our 104 strains can be propagated in Mega Medium (MM), Chopped
      Meat Medium (CMM), or both
    explanation: The media the members are maintained in.

environmental_factors:
- name: gnotobiotic fecal challenge
  value: Germ-free mice colonized with hCom1 were challenged with a human fecal sample to identify additional
    engrafting species.
  description: Fecal challenge and pathogenic Escherichia coli challenge were used to test stability and
    colonization resistance.
  evidence:
  - *id001
related_ingredients:
- preferred_term: arginine
  chebi_term:
    id: CHEBI:29016
    label: arginine
  relevance: >
    Arginine is fermented by hCom2 members via the arginine deiminase pathway,
    a defined amino-acid-utilization route in the community.
  evidence:
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: conversion of arginine to ornithine plus CO2 and two equivalents of ammonium
    explanation: Anchors arginine as the substrate of the community's arginine deiminase pathway.
- preferred_term: ornithine
