      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Fecal-Challenge-Guided Community Augmentation
  description: Species identified after challenging hCom1-colonized mice with fecal communities informed the assembly
    of hCom2. The intervention changes community membership; filling open niches is its ecological interpretation,
    not a directly measured complete metabolic or spatial niche map.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: hCom2 Fecal-Challenge Stability
    description: 'Membership augmentation produced a community with greater fecal-challenge resilience in the tested
      mice. PARTIAL mechanism: niche occupancy is a proposed explanation rather than a selectively measured mediator,
      and unrelated donors expose residual invasibility.'
  - target: hCom2 Escherichia coli Colonization Resistance
    description: 'HYPOTHESIZED mediation: broader niche occupancy could contribute to hCom2 resistance, but observing
      resistance in hCom2 does not establish that the augmentation step or any added species is necessary. The study
      does not resolve the protective strains or molecular pathway.'
  evidence:
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We identified new species that engrafted following fecal challenge and added them to hCom1, yielding
      hCom2.
    explanation: Supports the defined synthetic community design and represented community context.
- name: hCom2 Fecal-Challenge Stability
  description: In gnotobiotic mice, hCom2 was more resilient than hCom1 to fecal challenge. The primary study also
    reports weaker resilience to unrelated fecal donors. Stability is therefore donor- and experiment-dependent,
    not complete exclusion or universal human-microbiome equivalence.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: hCom2 exhibited increased stability to fecal challenge
    explanation: Direct abstract evidence for the observed stability endpoint.
- name: hCom2 Escherichia coli Colonization Resistance
  description: hCom2 conferred robust resistance to the tested pathogenic E. coli challenge in gnotobiotic mice.
    The phenotype is community-level resistance, not facilitation of the invader and not proof that each bacterial
    member is protective. The responsible strains and molecular mechanism remain unresolved.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:36070752
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: robust colonization resistance against pathogenic Escherichia coli
    explanation: Direct abstract evidence for the challenge phenotype; assembly alone is not outcome evidence.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  working_volume: 4.0
  working_volume_unit: mL
  instrument_detail: >-
    Built up through deep-well plates: strains revived from frozen 96-well stocks into 1 mL in
    2.2 mL 96-well plates, diluted 1:10 every 24 h for two days, then 1:10 into 4 mL in 5 mL
    48-well plates. All culturing inside a Coy anaerobic chamber at 10% CO2 / 5% H2 / 85% N2.
    Communities were then propagated for 48 h per passage with DNA taken at 0, 12, 24 and 48 h.
    Member strains are maintained in Mega Medium, Chopped Meat Medium, or both; community
    experiments also ran in a complete defined medium and in versions with single amino acids
    removed.
  notes: >-
    `system_type` is OTHER because the format is a deep-well plate, which the enum has no
    value for; FLASK or a reactor type would assert a containment this does not have. The
    plate sizes are in instrument_detail instead.

    No `operating_temperature`: the source gives the chamber's gas mix but not its
    temperature, and a gut-community chamber is not necessarily at 37 °C by assumption.

    The amino-acid dropout media are named because they are the experiment: strains change
    relative abundance by orders of magnitude when a single amino acid is removed, so
    "defined medium" alone would describe a condition the study exists to vary.

    Third failure of the "likely refuse" group in #543, predicted on the assumption that a
    gut community lives in a mouse. hCom2 is used in gnotobiotic mice, but this paper builds
    and propagates it in vitro first - which is what OMM12 does not do, and why that one was
    correctly refused. Three of five in that group have now failed; the reasoning behind it
    should be treated as discarded rather than partly true.
environmental_factors:
- name: gnotobiotic fecal challenge
  value: Germ-free mice colonized with hCom1 were challenged with a human fecal sample to identify additional
    engrafting species.
  description: Fecal challenge and pathogenic Escherichia coli challenge were used to test stability and
    colonization resistance.
  evidence:
  - *id001
related_ingredients:
- preferred_term: arginine
  chebi_term:
    id: CHEBI:29016
    label: arginine
  relevance: >
    Arginine is fermented by hCom2 members via the arginine deiminase pathway,
    a defined amino-acid-utilization route in the community.
- preferred_term: ornithine
  chebi_term:
    id: CHEBI:18257
    label: ornithine
  relevance: >
    Ornithine is the product of arginine catabolism via the arginine deiminase pathway in hCom2.
- preferred_term: carbon dioxide
  chebi_term:
    id: CHEBI:16526
    label: carbon dioxide
  relevance: >
    CO2 is released during arginine fermentation by the community.
- preferred_term: ammonium
  chebi_term:
    id: CHEBI:28938
    label: ammonium
  relevance: >
    Ammonium is generated during arginine fermentation by the community.
- preferred_term: methionine
  chebi_term:
    id: CHEBI:16811
    label: methionine
  relevance: >
    Methionine is among the amino acids whose removal affected growth of hCom2 strains,
    indicating community amino-acid utilization.
- preferred_term: histidine
  chebi_term:
    id: CHEBI:27570
    label: histidine
  relevance: >
    Histidine is among the amino acids whose removal affected growth of hCom2 strains.
- preferred_term: isoleucine
  chebi_term:
    id: CHEBI:24898
    label: isoleucine
  relevance: >
    Isoleucine is among the amino acids whose removal affected growth of hCom2 strains.
- preferred_term: valine
  chebi_term:
    id: CHEBI:27266
    label: valine
  relevance: >
    Valine is among the amino acids whose removal affected growth of hCom2 strains.
- preferred_term: tyrosine
  chebi_term:
    id: CHEBI:18186
    label: tyrosine
  relevance: >
    Tyrosine is among the amino acids whose removal affected growth of hCom2 strains.
- preferred_term: bile acid
  chebi_term:
    id: CHEBI:3098
    label: bile acid
  relevance: >
    Primary and secondary bile acids in the gut are transformed by the community;
    fecal bile-acid levels were used to compare hCom2 to a native microbiome.
growth_media:
- name: SAAC complete defined medium
  atmosphere: ANAEROBIC
  headspace_gas: 10% CO2, 5% H2, 85% N2
  vessel_type: 2.2-mL 96-well deep well plate
  inoculum_size: '10'
  inoculum_unit: '% (1:10 dilution)'
  preparation_notes: Individual strains were propagated in Mega Medium (MM) or Chopped
    Meat Medium (CMM) and diluted 1:10 every 24 h before assembly; the assembled community
    was propagated in vitro in SAAC complete defined medium.
