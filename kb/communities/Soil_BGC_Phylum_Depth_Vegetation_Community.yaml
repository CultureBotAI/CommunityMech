ecological_interactions:
- name: Three-Site CZO Genome-Resolved Metagenomics
  description: >
    Soil and saprolite from three northern California Critical Zone Observatory
    sites were sequenced to recover a genome-resolved view of bacterial
    secondary-metabolite potential across vegetation, depth, and bedrock
    gradients.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Dereplicated-MAG BGC Discovery
    description: >
      The metagenomes were filtered and dereplicated into MAGs that could be
      screened for biosynthetic gene clusters.
  evidence:
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      We sampled soils and saprolite from three sites in a northern California
      Critical Zone Observatory with various vegetation and bedrock
      characteristics
    explanation: >
      Supports the three-site soil and saprolite sampling design.
- name: Dereplicated-MAG BGC Discovery
  description: >
    Genome-resolved metagenomics narrowed thousands of bins to 1,334
    dereplicated MAGs, then antiSMASH found thousands of biosynthetic gene
    clusters carried by soil bacteria and archaea.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Phylum-Scale Biosynthetic-Potential Heterogeneity
    description: >
      Mapping BGC calls to genome phylogeny revealed uneven
      secondary-metabolite potential across bacterial phyla.
  - target: CPR Linaridin BGC Detection
    description: >
      The genome-resolved BGC screen recovered a RiPP-class peptide cluster in
      a Candidate Phyla Radiation bacterium.
  - target: Depth and Vegetation Enrichment of BGC-Rich Genomes
    description: >
      The BGC calls were combined with depth- and vegetation-based differential
      abundance tests to identify where high-potential genomes were enriched.
  evidence:
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      Overall, 3,175 BGCs were identified on contigs of >10 kb within the set
      of 1,334 dereplicated genomes
    explanation: >
      Supports the genome-resolved BGC-discovery step.
- name: Phylum-Scale Biosynthetic-Potential Heterogeneity
  description: >
    Biosynthetic gene cluster loads varied strongly across soil bacterial
    lineages, with prolific individual producers among Actinobacteria,
    Chloroflexi, and Candidatus Dormibacteraeota.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Depth and Vegetation Enrichment of BGC-Rich Genomes
    description: >
      Phylum-resolved BGC assignments let the study compare BGC-rich bacterial
      abundance by soil depth and vegetation.
  evidence:
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      We obtained genomes for prolific producers of secondary metabolites,
      including novel groups within the Actinobacteria, Chloroflexi, and
      candidate phylum "Candidatus Dormibacteraeota."
    explanation: >
      Supports the bacterial phyla curated as prolific BGC producers.
