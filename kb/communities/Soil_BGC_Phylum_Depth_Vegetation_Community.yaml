ecological_interactions:
- name: Phylum-Scale Biosynthetic-Potential Heterogeneity
  description: Predicted BGC content varied among recovered genomes and within soil bacterial lineages. Some genomes
    assigned to Actinobacteria, Chloroflexi and Candidatus Dormibacteraeota had high biosynthetic potential. This
    does not establish metabolite production by every member of those clades or reduced competition through niche
    partitioning.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'We obtained genomes for prolific producers of secondary metabolites, including novel groups within
      the Actinobacteria, Chloroflexi, and candidate phylum "Candidatus Dormibacteraeota."

      '
    explanation: Supports the reported genomic prediction, not expression, product activity or an experimentally
      demonstrated interaction.
    computational_provenance:
      prediction_type: OTHER
      model_source: BGC predictions in metagenome-assembled genomes from the primary soil survey.
      tools:
      - tool_name: antiSMASH
        tool_version: '4.0'
        role: BGC prediction and classification
  participating_taxa:
  - preferred_term: Actinobacteria (prolific BGC producers)
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  - preferred_term: Chloroflexi (prolific BGC producers)
    term:
      id: NCBITaxon:200795
      label: Chloroflexota
  - preferred_term: Candidatus Dormibacteraeota (prolific BGC producers)
    term:
      id: NCBITaxon:2052312
      label: Candidatus Dormiibacterota
- name: CPR Linear Azole/Azoline-Containing Peptide BGC Prediction
  description: A soil CPR genome carried a predicted linear azole/azoline-containing peptide (LAP) biosynthetic
    gene cluster, with related predictions in additional public CPR genomes. LAP is the reported class, not linaridin.
    The finding is genomic potential, not measured peptide production, antibiotic action or an ecological partner
    effect in the sampled community.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'one genome of a candidate phyla radiation (CPR) bacterium coded for a ribosomally synthesized linear
      azole/azoline-containing peptide

      '
    explanation: Supports the reported genomic prediction, not expression, product activity or an experimentally
      demonstrated interaction.
    computational_provenance:
      prediction_type: OTHER
      model_source: BGC predictions in metagenome-assembled genomes from the primary soil survey.
      tools:
      - tool_name: antiSMASH
        tool_version: '4.0'
        role: BGC prediction and classification
  participating_taxa:
  - preferred_term: BGC-encoding CPR bacterium
    term:
      id: NCBITaxon:1783273
      label: Patescibacteria group
- name: Depth and Vegetation Associations of Biosynthetic Potential
  description: Genomes enriched in shallow samples encoded more predicted BGCs and ketosynthase domains on average;
    genomes enriched in grasslands encoded more ketosynthase domains than those enriched at tree-covered sites.
    These field-sample associations do not show that biosynthetic products caused the abundance patterns or reduced
    interspecies competition. BGC-type distributions were not broadly different between the environmental groups.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: bacteria with higher biosynthetic potential were enriched in shallow soils and grassland soils, with
      patterns of abundance of BGC type varying by taxonomy
    explanation: Supports the depth and vegetation enrichment.
  - reference: PMID:32546614
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: genomes that were enriched in grasslands encoded more KS domains than genomes that were enriched at
      tree-covered sites
    explanation: Specifies the vegetation-associated domain result rather than assigning an increase to every BGC
      type.
