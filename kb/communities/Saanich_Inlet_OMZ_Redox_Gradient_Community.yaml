id: CommunityMech:000140
name: Saanich Inlet Oxygen Minimum Zone Redox-Gradient Community
description: A natural marine water-column microbial community from Saanich Inlet, a seasonally anoxic
  fjord on Vancouver Island, Canada that serves as a model oxygen minimum zone. Integrated geochemistry,
  rate measurements, metagenomics, metatranscriptomics, metaproteomics, and qPCR link community structure
  to coupled carbon, nitrogen, and sulfur cycling across a redox gradient, including SUP05-driven incomplete
  sulfide-dependent denitrification, nitrite leakage supporting anammox, and a complementary nitrous oxide
  reduction niche.
ecological_state: PERTURBED
community_origin: NATURAL
community_category: EXTREME_ENVIRONMENT
environment_term:
  preferred_term: seasonally anoxic marine fjord water column
  term:
    id: ENVO:01000320
    label: marine environment
  notes: Saanich Inlet is a seasonally anoxic fjord and model oxygen minimum zone; this record captures
    the water-column redox-gradient microbial community.
related_ingredients:
- preferred_term: nitrate
