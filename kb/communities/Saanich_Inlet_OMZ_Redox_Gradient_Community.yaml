    id: CHEBI:17632
    label: nitrate
  relevance: >
    Nitrate is the terminal electron acceptor for SUP05-driven chemoautotrophic
    nitrate reduction coupled to sulfide oxidation at the sulfide-nitrate transition zone.
  evidence:
  - reference: PMID:27655888
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: At the SNTZ in Saanich Inlet, the simultaneous availability of nitrate and hydrogen
      sulfide fuels chemoautotrophic nitrate reduction coupled to sulfide oxidation
    explanation: Nitrate is named as a key electron acceptor fueling chemoautotrophic nitrate reduction.
- preferred_term: hydrogen sulfide
  chebi_term:
    id: CHEBI:16136
    label: hydrogen sulfide
  relevance: >
    Hydrogen sulfide is the electron donor oxidized during incomplete sulfide-driven
    denitrification at the sulfide-nitrate transition zone.
  evidence:
  - reference: PMID:27655888
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: At the SNTZ in Saanich Inlet, the simultaneous availability of nitrate and hydrogen
      sulfide fuels chemoautotrophic nitrate reduction coupled to sulfide oxidation
    explanation: Hydrogen sulfide is named as the co-substrate oxidized in sulfide-driven nitrate reduction.
- preferred_term: nitrite
  chebi_term:
    id: CHEBI:16301
    label: nitrite
  relevance: >
    Nitrite leaks from SUP05 incomplete sulfide-driven denitrification, providing a
    substrate that supports anammox-linked nitrogen loss.
  evidence:
  - reference: PMID:27655888
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: nitrite leakage during incomplete sulfide-driven denitrification by SUP05 Gammaproteobacteria
    explanation: Nitrite is named as the leaked intermediate from incomplete denitrification.
- preferred_term: nitrous oxide
  chebi_term:
    id: CHEBI:17045
    label: dinitrogen oxide
  relevance: >
    Nitrous oxide is an intermediate of partial denitrification and the substrate for a
    complementary nitrous oxide reduction niche completing denitrification.
  evidence:
  - reference: PMID:27655888
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: genes associated with partial denitrification to nitrous oxide, nitrous oxide reduction,
      and anammox are most abundant in the SNTZ
    explanation: Nitrous oxide is named as a denitrification intermediate and reduction substrate.
- preferred_term: ammonium
  chebi_term:
    id: CHEBI:28938
    label: ammonium
  relevance: >
    Ammonium is oxidized via anaerobic ammonium oxidation (anammox), the process driving
    intense nitrogen loss linked to SUP05 denitrification.
  evidence:
  - reference: PMID:27655888
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: incomplete sulfide-driven denitrification by SUP05 Gammaproteobacteria is predicted to
      support inorganic carbon fixation and intense nitrogen loss via anaerobic ammonium oxidation.
    explanation: Ammonium is named as the substrate for anaerobic ammonium oxidation.
