id: CommunityMech:000166
name: Deepwater Horizon Deep-Sea Oil Plume Succession
description: >
  A natural, perturbed deep-sea hydrocarbon-plume microbial community that developed during the 2010
  Deepwater Horizon blowout in the Gulf of Mexico. The plume selected indigenous hydrocarbon-degrading
  Gammaproteobacteria, with early enrichment of Oceanospirillales-like petroleum degraders followed by
  Colwellia, Cycloclasticus, methylotrophic bacteria, and other taxa with non-redundant hydrocarbon
  degradation capacities.
ecological_state: PERTURBED
community_origin: NATURAL
community_category: BIOREMEDIATION
