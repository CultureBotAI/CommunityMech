    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: methylotrophs, including Methylophaga, were in a heightened state of metabolic activity within oil plume waters
    explanation: Supports active Methylophaga-like methylotrophs in oil plume waters.
- taxon_term:
