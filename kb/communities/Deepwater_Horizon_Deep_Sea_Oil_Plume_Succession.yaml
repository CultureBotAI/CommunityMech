    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: enriched in the polycyclic-aromatic-hydrocarbon-degrading communities
    explanation: Supports aromatic-hydrocarbon-degrading community members associated with plume samples.
- taxon_term:
