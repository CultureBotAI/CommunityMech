ecological_interactions:
- name: Intrinsic Hydrocarbon Bioremediation
  description: Indigenous deep-sea bacteria degraded plume hydrocarbons under cold deep-water conditions,
    creating potential for intrinsic bioremediation without substantial oxygen drawdown.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: DWH Oceanospirillales-like bacteria
    term:
      id: NCBITaxon:135619
      label: Oceanospirillales
  metabolites:
  - preferred_term: hydrocarbon
    term:
      id: CHEBI:24632
      label: hydrocarbon
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  biological_processes:
  - preferred_term: alkane catabolic process
    term:
      id: GO:0043448
      label: alkane catabolic process
  evidence:
  - reference: PMID:20736401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: faster-than-expected hydrocarbon biodegradation rates at 5°C
    explanation: Supports cold deep-water hydrocarbon biodegradation.
  - reference: PMID:20736401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: intrinsic bioremediation of the oil plume in the deep-water column without substantial oxygen drawdown
    explanation: Supports intrinsic bioremediation as a community-level function.
- name: Colwellia Oil Droplet Floc Formation
  description: Colwellia-dominated flocs formed with oil and biomass in cold incubations, linking cell
    aggregation to hydrocarbon degradation in deep marine habitats.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Colwellia
    term:
      id: NCBITaxon:28228
      label: Colwellia
  metabolites:
  - preferred_term: hydrocarbon
    term:
      id: CHEBI:24632
      label: hydrocarbon
  evidence:
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: flocs were comprised of oil, carbohydrates and biomass
    explanation: Supports oil-associated floc formation as a Colwellia-linked mechanism.
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Colwellia were the dominant bacteria in the flocs
    explanation: Supports Colwellia dominance in the oil-associated flocs.
- name: Complex Hydrocarbon Substrate Partitioning
  description: Different plume-associated taxa contributed distinct, non-redundant capacities for degrading
    alkane and polycyclic aromatic hydrocarbons, so community-level degradation exceeded single-member
    capabilities.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrocarbon
    term:
      id: CHEBI:24632
      label: hydrocarbon
  - preferred_term: alkane
    term:
      id: CHEBI:18310
      label: alkane
  biological_processes:
  - preferred_term: alkane catabolic process
    term:
      id: GO:0043448
      label: alkane catabolic process
  evidence:
  - reference: PMID:27572965
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: combined capabilities of the microbial community exceeded those of its individual components
    explanation: Supports non-redundant substrate specialization across the oil-degrading community.
  - reference: PMID:27572965
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: degradation of complex hydrocarbon mixtures requires the non-redundant capabilities of a complex oil-degrading community
    explanation: Supports niche partitioning among hydrocarbon-degrading taxa.
environmental_factors:
- name: Deepwater Horizon hydrocarbon plume
  value: Deepwater Horizon blowout, Gulf of Mexico
  description: The plume was generated by the 2010 Deepwater Horizon blowout and selected indigenous
    hydrocarbon-degrading bacteria.
  evidence:
  - reference: PMID:20736401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: dispersed hydrocarbon plume stimulated deep-sea indigenous γ-Proteobacteria
    explanation: Supports the hydrocarbon plume as the perturbation selecting the microbial community.
- name: Low deep-water temperature
  value: 5
  unit: degrees Celsius
  description: Cold deep-water conditions shaped biodegradation and incubation responses.
  evidence:
  - reference: PMID:20736401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: hydrocarbon biodegradation rates at 5°C
    explanation: Supports the cold-temperature condition for plume biodegradation.
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: incubation at 5°C
    explanation: Supports cold incubation used to model deep-water oil degradation.
- name: Oil and dispersant exposure
  description: Oil and COREXIT exposure in cold Gulf deep-water enrichments selected hydrocarbon-degrading
    community members.
  evidence:
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enriched and isolated indigenous hydrocarbon-degrading bacteria from deep, uncontaminated waters
    explanation: Supports oil/dispersant exposure as an experimental enrichment condition.
