    preferred_term: DWH Oceanospirillales-like bacteria
    term:
      id: NCBITaxon:135619
      label: Oceanospirillales
    notes: Early deep-plume bloom related to known petroleum-degrading Oceanospirillales.
  abundance_level: DOMINANT
  functional_role:
  - PRIMARY_DEGRADER
  evidence:
