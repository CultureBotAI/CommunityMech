ecological_interactions:
- name: Cold Hydrocarbon Biodegradation and Bioremediation Potential
  description: Field hydrocarbon patterns and environmental-isolate incubations at 5 C support cold-water biodegradation
    and the potential for intrinsic plume bioremediation without substantial oxygen drawdown. This is not a distinct
    oxygen-conservation mechanism or established syntrophy. The named Oceanospirillales group represents a canonical
    subset, not every degrader or all spill phases.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrocarbon
    term:
      id: CHEBI:24632
      label: hydrocarbon
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  biological_processes:
  - preferred_term: alkane catabolic process
    term:
      id: GO:0043448
      label: alkane catabolic process
  evidence:
  - reference: PMID:20736401
    supports: SUPPORT
    evidence_source: OTHER
    snippet: faster-than-expected hydrocarbon biodegradation rates at 5°C
    explanation: The abstract combines field observations and in vitro isolate experiments. It supports biodegradation,
      not a purely in vivo rate measurement or syntrophic dependence.
  - reference: PMID:20736401
    supports: PARTIAL
    evidence_source: OTHER
    snippet: intrinsic bioremediation of the oil plume in the deep-water column without substantial oxygen drawdown
    explanation: The quoted phrase is governed by the abstract's potential-exists qualifier, not a demonstrated
      oxygen-conserving mechanism or a plume-wide oxygen budget.
  participating_taxa:
  - preferred_term: DWH Oceanospirillales-like bacteria
    term:
      id: NCBITaxon:135619
      label: Oceanospirillales
- name: Colwellia-Dominated Oil-Associated Flocs
  description: In cold oil/COREXIT enrichments from uncontaminated deep Gulf water without added FeCl2, oil-, carbohydrate-
    and biomass-containing flocs were dominated by Colwellia. Oil degradation by an isolated Colwellia strain is
    a separate positive result. Aggregation does not by itself demonstrate facilitation of another taxon or quantify
    a floc-specific contribution to field attenuation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrocarbon
    term:
      id: CHEBI:24632
      label: hydrocarbon
  downstream:
  - target: Cold Hydrocarbon Biodegradation and Bioremediation Potential
    description: HYPOTHESIZED - aggregation with oil droplets could support Colwellia-associated hydrocarbon access
      and degradation. The enrichment observations and separate isolate assay do not selectively test this route
      or establish its contribution to in situ plume attenuation.
  evidence:
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: flocs were comprised of oil, carbohydrates and biomass
    explanation: Supports the observed Colwellia-dominated oil-associated aggregates in laboratory enrichments,
      not an isolated causal effect of flocs on degradation or recipient colonization.
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Colwellia were the dominant bacteria in the flocs
    explanation: Supports the observed Colwellia-dominated oil-associated aggregates in laboratory enrichments,
      not an isolated causal effect of flocs on degradation or recipient colonization.
  participating_taxa:
  - preferred_term: Colwellia
    term:
      id: NCBITaxon:28228
      label: Colwellia
- name: Proposed Community Hydrocarbon Pathway Complementarity
  description: HYPOTHESIZED - SIP enrichment and genome reconstruction suggest complementary hydrocarbon pathways.
    The study separates deep-water hexadecane from surface-water PAH enrichments, incubated at room temperature
    without added dispersant. Named taxa are a subset across those enrichments, not a proven five-member deep-plume
    consortium. Coordinated metabolism is an alternative to unknown enzymes or incomplete assemblies, not resolved
    metabolite exchange.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrocarbon
    term:
      id: CHEBI:24632
      label: hydrocarbon
  - preferred_term: alkane
    term:
      id: CHEBI:18310
      label: alkane
  biological_processes:
  - preferred_term: alkane catabolic process
    term:
      id: GO:0043448
      label: alkane catabolic process
  downstream:
  - target: Cold Hydrocarbon Biodegradation and Bioremediation Potential
    description: HYPOTHESIZED - complementary pathways could expand community hydrocarbon transformation and contribute
      to bioremediation. SIP and annotated repertoires support this model but do not establish intertaxon flux,
      necessity or the contribution of this room-temperature enrichment mechanism in the cold field plume.
  evidence:
  - reference: PMID:27572965
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: combined capabilities of the microbial community exceeded those of its individual components
    explanation: The abstract supports the proposed community-capability model. The full author proof explicitly
      retains alternative enzymes and incomplete-genome explanations and distinguishes sample origins and enrichment
      conditions.
  - reference: PMID:27572965
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: degradation of complex hydrocarbon mixtures requires the non-redundant capabilities of a complex oil-degrading
      community
    explanation: The abstract supports the proposed community-capability model. The full author proof explicitly
      retains alternative enzymes and incomplete-genome explanations and distinguishes sample origins and enrichment
      conditions.
  - reference: PMID:27572965
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: assimilate alkane and polycyclic aromatic hydrocarbons during stable-isotope probing experiments
    explanation: Preserves positive experimental assimilation evidence without equating the SIP label with resolved
      cross-feeding or every annotated pathway being active.
  participating_taxa:
  - preferred_term: DWH Oceanospirillales-like bacteria
    term:
      id: NCBITaxon:135619
      label: Oceanospirillales
  - preferred_term: Colwellia
    term:
