    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: stimulated deep-sea indigenous γ-Proteobacteria that are closely related to known petroleum degraders
    explanation: Supports early enrichment of indigenous petroleum-degrading Gammaproteobacteria in the plume.
  - reference: PMID:22616650
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increase in abundance of Colwellia and Oceanospirillales during the incubations
    explanation: Supports Oceanospirillales enrichment in oil and dispersant incubations from Gulf deep waters.
