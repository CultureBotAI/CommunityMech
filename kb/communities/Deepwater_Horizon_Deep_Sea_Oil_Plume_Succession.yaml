    explanation: Supports Colwellia as an abundant oil-associated member in cold deep-water incubations.
  - reference: PMID:25071745
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Colwellia species that was dominant during the Deepwater Horizon oil spill
    explanation: Supports Colwellia dominance during the field spill response.
- taxon_term:
    preferred_term: Cycloclasticus
    term:
      id: NCBITaxon:34067
      label: Cycloclasticus
    notes: Aromatic-hydrocarbon-associated genus reported in DWH plume succession studies.
  functional_role:
