- name: Tripartite Gut-pH Niche Partitioning
  description: >
    The Bacillus/Lactobacillus/Issatchenkia SynCom showed the best protein
    conversion among tested inoculation schemes and formed distinct
    spatiotemporal patterns along the black soldier fly larval gut pH gradient,
    a community-level distribution pattern associated with a 63% final larval
    protein-content increase.
