id: CommunityMech:000284
name: Black Soldier Fly Larvae Gut SynCom (Bacillus + Lactobacillus + Issatchenkia)
description: A tripartite synthetic microbial community (SynCom) engineered from the core gut microbiota
  of black soldier fly larvae (BSFL) to enhance protein bioconversion from organic wastes. The SynCom
  combines the bacteria Bacillus and Lactobacillus with the yeast Issatchenkia and was assembled and
  tested in germ-free (gnotobiotic) larval hosts using multi-omics. Bacillus provides direct proteolytic
  activity, whereas Lactobacillus and Issatchenkia are associated with improved protein-conversion
  performance and amino-acid metabolic responses. The tripartite SynCom showed the highest protein
  conversion performance and distinct spatiotemporal distribution along the gut pH gradient, increasing
  final larval protein content by 63%.
ecological_state: ENGINEERED
