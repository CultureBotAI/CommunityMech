ecological_interactions:
- name: Spatiotemporal niche partitioning along the gut pH gradient
  description: In the tripartite SynCom the three taxa show distinct spatiotemporal distribution patterns
    along the black soldier fly larva gut pH gradient, coinciding with the highest protein conversion
    performance (community-level, emergent).
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a tripartite SynCom comprising these taxa showed the highest protein conversion performance
      and was associated with distinct spatiotemporal distribution patterns along the gut pH gradient,
      increasing final larval protein content by 63%.
    explanation: Members occupy distinct spatial/temporal niches along the gut pH gradient, associated
      with peak protein conversion.
- name: Proteolysis-driven division of labor for protein conversion
  description: Functional complementarity within the SynCom, where Bacillus supplies direct proteolytic
    activity (liberating amino acids) while Lactobacillus and Issatchenkia are associated with the
    downstream improvement in protein conversion and amino-acid metabolism (community-level division
    of labor / inferred cross-feeding of proteolysis products).
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Bacillus showed direct proteolytic activity, whereas Lactobacillus and Issatchenkia were
      associated with improved protein conversion performance in the tested SynCom.
    explanation: Bacillus proteolysis and the partners' protein-conversion association imply a division
      of labor / cross-feeding of proteolysis-derived amino acids.
