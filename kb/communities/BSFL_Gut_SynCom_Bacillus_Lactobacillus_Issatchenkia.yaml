    description: >
      Bacillus proteolysis was combined with Lactobacillus and Issatchenkia in
      the three-member SynCom that had the best host protein-conversion
      performance.
  evidence:
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Bacillus showed direct proteolytic activity
    explanation: Supports Bacillus as the directly proteolytic member of the tripartite SynCom.
