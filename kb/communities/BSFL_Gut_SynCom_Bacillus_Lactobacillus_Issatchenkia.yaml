ecological_interactions:
- name: Function-Guided BSFL SynCom Selection
  description: >
    Multi-omics analysis in germ-free black soldier fly larvae identified
    Bacillus, Lactobacillus, and Issatchenkia as gut taxa functionally
    associated with improved host protein conversion and amino-acid metabolism,
    defining the tripartite SynCom tested in gnotobiotic larvae.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Bacillus Direct Proteolysis
    description: >
      The selected Bacillus member was assayed as the direct proteolytic member
      of the protein-conversion consortium.
  - target: Lactobacillus-Issatchenkia Protein-Conversion Association
    description: >
      The selected Lactobacillus and Issatchenkia members were retained as the
      non-proteolytic partners associated with stronger protein conversion and
      host amino-acid metabolic responses.
  evidence:
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >
      identified the bacteria Bacillus and Lactobacillus and the yeast
      Issatchenkia functionally relevant taxa associated with improved host
      protein conversion and amino-acid metabolic responses
    explanation: >
      Supports selecting Bacillus, Lactobacillus, and Issatchenkia as the three
      functionally relevant BSFL gut taxa used in the SynCom.
- name: Bacillus Direct Proteolysis
  description: >
    Bacillus supplied the directly observed proteolytic activity in the
    gnotobiotic BSFL SynCom, providing a protein-catabolic function upstream of
    the tripartite consortium's improved larval protein-conversion phenotype.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  participating_taxa:
  - preferred_term: Bacillus
    term:
