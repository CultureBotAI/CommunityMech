    explanation: >
      Supports applying the tripartite SynCom-BSFL system to chicken-manure and
      kitchen-waste bioconversion.
growth_media:
- name: Gnotobiotic BSFL host reared on organic-waste feedstock
  composition:
  - name: chicken manure
  - name: kitchen waste
  preparation_notes: In-vivo cultivation of the SynCom in germ-free (gnotobiotic) black soldier fly
    larvae under controlled conditions; the larvae were reared on organic-waste feedstocks (chicken
    manure and kitchen waste). No defined medium composition, temperature, pH value, atmosphere,
    incubation time, or shaking is reported in the accessible source (full text paywalled in
    Bioresource Technology; abstract only). The larval gut presents a spatial pH gradient along which
    the SynCom members show distinct spatiotemporal distribution.
  evidence:
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: employed multi-omics and synthetic microbial communities (SynCom) in germ-free models to
      examine microbiota-associated protein conversion under controlled conditions
    explanation: The SynCom is cultivated in vivo in germ-free (gnotobiotic) larval hosts under
      controlled conditions.
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: when applied to chicken manure and kitchen waste, the SynCom-BSFL system showed
      improvements in selected performance metrics
    explanation: Chicken manure and kitchen waste are the organic-waste feedstock substrates on which
      the SynCom-BSFL system was cultivated.
  - reference: PMID:42167379
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: distinct spatiotemporal distribution patterns along the gut pH gradient
    explanation: The cultivation environment is the larval gut, which presents a spatial pH gradient
      shaping member distribution.
