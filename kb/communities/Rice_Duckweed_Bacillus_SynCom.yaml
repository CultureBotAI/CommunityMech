      id: CHEBI:29681
      label: surfactin
    notes: Lipopeptide antibiotic contributing to biocontrol
  evidence:
  - reference: PMID:41736136
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom concurrently promoted rice growth and suppressed sheath blight caused by Rhizoctonia
      solani, reducing the final disease index by 70% without detectable phytotoxicity
