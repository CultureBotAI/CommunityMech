ecological_interactions:
- name: Division-of-Labor Growth Promotion
  description: 'The eight-member SynCom shows complementary, partly redundant metabolic contributions in member-dropout
    and omics comparisons. These support a division-of-labor interpretation associated with rice growth promotion.
    PARTIAL: specific metabolite-to-plant effects and reciprocal fitness among the bacteria are not established
    by those comparisons.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Reported growth-associated metabolite; its individual causal contribution to the plant phenotype remains
      unresolved.
  - preferred_term: acetoin
    term:
      id: CHEBI:15688
      label: acetoin
    notes: Reported growth-associated metabolite; its individual causal contribution to the plant phenotype remains
      unresolved.
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Concurrent Rice Growth Promotion and Sheath Blight Suppression
    description: 'PARTIAL: the complementary growth-associated metabolic pool is proposed to contribute to the complete
      SynCom greenhouse growth phenotype. Dropout/omics associations do not establish genetic necessity or in-plant
      chemical mediation.'
  evidence:
  - reference: PMID:41736136
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: complementary yet partially redundant contributions mapped members, metabolite pools, plant outcomes
      and rendered community performance resilient to single-member loss
    explanation: Supports complementary contributions and a division-of-labor interpretation, not reciprocal bacterial
      fitness or chemical necessity.
- name: Antimicrobial Biocontrol of Sheath Blight
  description: 'SynCom treatment suppressed R. solani sheath blight, with about 70% reduction of the final disease
    index in the tested greenhouse comparison. PARTIAL: lipopeptide/polyketide-associated features and dropout phenotypes
    suggest contributing chemistries, but the individual compounds are not established as necessary causes of this
    plant outcome. Antagonism is not itself proof of resource competition.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: surfactin
    term:
      id: CHEBI:29681
      label: surfactin
    notes: Reported antimicrobial-associated metabolite; individual necessity for greenhouse disease suppression
      is unresolved.
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: Concurrent Rice Growth Promotion and Sheath Blight Suppression
    description: 'PARTIAL: the antimicrobial-associated component is proposed to contribute to the complete SynCom
      disease-suppression phenotype; the observed plant protection is stronger evidence than the assignment of that
      protection to individual compounds.'
  evidence:
  - reference: PMID:41736136
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom concurrently promoted rice growth and suppressed sheath blight caused by Rhizoctonia solani,
      reducing the final disease index by 70% without detectable phytotoxicity
    explanation: Supports the positive greenhouse disease-index outcome, not causal attribution to specific antimicrobial
      metabolites.
