discussions:
- discussion_id: duckweed_chemical_and_ecological_scope
  prompt: Which metabolic contributions causally explain the greenhouse plant benefits?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Division-of-Labor Growth Promotion
  - ecological_interactions#Antimicrobial Biocontrol of Sheath Blight
  - ecological_interactions#Concurrent Rice Growth Promotion and Sheath Blight Suppression
  rationale: The complete primary main text supports dropout-dependent functional contributions and positive greenhouse
    outcomes, but not genetic necessity or in-plant chemical confirmation. Individual strain abundances during coculture
    were not measured; contribution scores are not abundance data. The source also conflicts about unique versus
    shared auxin production and about duckweed-comparison disease effects versus unmeasured agronomic outcomes.
    Do not resolve these by selecting a favorable sentence. No ecological mutualism, resource competition or colonization-facilitation
    type is assigned merely from benefit to rice. The unqualified 2,3-butanediol feature does not establish a specific
    stereoisomer. Canonical input taxonomy is preserved, but its four role placeholders do not resolve eight strain
    identities; issue1759 tracks non-graph corrections. No field efficacy or general safety is certified.
  evidence:
  - reference: PMID:41736136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: this study is limited to greenhouse conditions and does not yet establish genetic necessity for the
      proposed metabolite-to-phenotype links.
    explanation: Explicit primary limitation separates plant efficacy from the proposed chemical mechanisms.
