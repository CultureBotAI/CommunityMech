id: CommunityMech:000058
name: Rice-Duckweed Bacillus Biocontrol SynCom
description: 'An 8-member, Bacillus-dominated synthetic community (SynCom) assembled from a rice-duckweed
  agroecosystem by targeting taxa consistently shared across soil, root and shoot niches. The SynCom concurrently
  promotes rice growth and suppresses sheath blight caused by Rhizoctonia solani, reducing the final disease
  index by 70% without detectable phytotoxicity. Leave-one-member perturbations reveal a division-of-labor
  architecture: individual strains specialize in auxin production, siderophore-linked iron mobilization,
  or lipopeptide/polyketide-based antagonism, yielding complementary yet partially redundant contributions
  that render community performance resilient to single-member loss. 8 members total; strain-level identifiers
  available in supplementary data.'
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
engineering_design:
  objective: Generate a multifunctional SynCom for concurrent rice growth promotion and sheath blight
    biocontrol via a top-down, ecology-guided route with demonstrated greenhouse efficacy and mechanistic
    transparency.
  assembly_strategy: Top-down ecological core selection from a rice-duckweed agroecosystem, targeting
    taxa consistently shared across soil, root and shoot niches.
  perturbation_design: Leave-one-member perturbations (-Dx) combined with untargeted LC-MS profiling and
    qRT-PCR of biosynthetic genes to map individual member contributions to metabolite pools and plant
    outcomes.
  measurement_endpoints:
  - Disease index (sheath blight severity)
  - Plant growth metrics (shoot biomass, root architecture)
  - Untargeted LC-MS metabolite profiling
  - qRT-PCR of biosynthetic genes (surfactin, bacillomycin, fengycin, difficidin)
  evidence:
  - reference: PMID:41736136
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A top-down, ecology-guided route can generate a multifunction SynCom with demonstrated greenhouse
      efficacy and mechanistic transparency
    explanation: Describes the ecology-guided assembly strategy and greenhouse validation
