id: CommunityMech:000167
name: Synechococcus-Pseudomonas Phototrophic PHA and DNT Coculture
description: >
  A synthetic, light-driven two-species coculture pairing engineered Synechococcus elongatus PCC 7942
  cscB with engineered Pseudomonas putida strains that consume cyanobacterial sucrose. The cyanobacterium
  fixes CO2 and exports sucrose under salt/IPTG induction, while P. putida converts the transferred carbon
  into polyhydroxyalkanoates (PHA) and, in a related engineered implementation, transforms the industrial
  pollutant 2,4-dinitrotoluene. This platform is relevant to DOE carbon utilization, bioproduct formation,
  and contaminant bioremediation because it couples photosynthetic CO2 fixation to heterotrophic
  biocatalysis in a controlled laboratory community.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Couple photosynthetic CO2 fixation and sucrose export by engineered S. elongatus to P. putida
    growth, PHA accumulation, and engineered 2,4-dinitrotoluene transformation.
  assembly_strategy: Bottom-up two-member coculture assembled from S. elongatus PCC 7942 cscB and
    sucrose-utilizing P. putida cscAB, cscRABY, or EM173-derived engineered strains in BG-11-derived
    medium under illumination.
  inoculation_strategy: S. elongatus cscB was established first under sucrose-exporting conditions, followed
    by inoculation of the heterotrophic P. putida partner after sucrose was available.
  perturbation_design: Salt stress and IPTG induction drive cyanobacterial sucrose export; nitrate limitation,
    nitrate-blind P. putida engineering, alginate encapsulation, and 2,4-dinitrotoluene exposure were used
    in different publications to tune production or remediation.
  measurement_endpoints:
  - Sucrose concentration
  - Coculture growth
  - PHA production
  - 2,4-dinitrotoluene transformation
  - Transcriptome, proteome, and metabolome profiles
  evidence:
  - reference: PMID:28814973
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culture consists of two bio-modules
    explanation: Supports the two-module coculture design and division of labor.
  - reference: PMID:32064751
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic microbial consortium composed of two genetically engineered microbes
    explanation: Supports that the DNT-transforming implementation is a synthetic engineered two-member
      consortium.
