id: CommunityMech:000348
name: Sorghum SRC2v4 Root Colonization SynCom
description: >-
  A 15-member reduced-complexity Sorghum bicolor synthetic root community
  rationally derived from the 57-member Sorghum Root Consortium 1 (SRC1).
  SRC2v4 was designed by ranking SRC1 strains by cumulative root abundance in a
  prior permutational membership experiment, prioritizing known sorghum
  root-exudate users when abundance rankings were highly similar, and selecting
  15 high-colonization isolates with distinguishable 16S rRNA V3-V4 sequences.
  In gnotobiotic 5-l sterile microboxes, SRC2v4 showed exceptional
  compositional fidelity relative to its inoculum, stably colonized roots and
  rhizospheres, promoted plant growth as a live community but not as a
  heat-killed inoculum, and induced coordinated S. bicolor transcriptional and
  metabolomic responses centered on flavonoid biosynthesis.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Reduce the parent 57-isolate SRC1 sorghum SynCom to a 15-member community
    that retained gnotobiotic root colonization, compositional stability, and
    plant growth promotion.
  assembly_strategy: >-
    Generate four 15-isolate SRC2 variants with distinct reduction strategies,
    then define SRC2v4 by choosing the most abundant root colonizers from a
    prior SRC1 permutational membership experiment while prioritizing
    sorghum-root-exudate users when isolate abundance rankings were closely
    tied.
  perturbation_design: >-
    Compare SRC2v1, SRC2v2, SRC2v3, SRC2v4, and mock treatments for 1-month
    gnotobiotic colonization and plant phenotypes; then benchmark live SRC2v4
    against heat-killed SRC2v4, mock, and the 57-member parent SRC1.
  measurement_endpoints:
  - 16S rRNA amplicon tracking of root and rhizosphere colonization
  - Sorghum shoot and root biomass phenotypes
  - Live versus heat-killed SRC2v4 growth promotion
  - One-month, six-timepoint host RNA-seq
  - Root and rhizosphere LC-MS metabolomics
  - Rhizosphere metatranscriptomics
  evidence:
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Four distinct strategies were employed to reduce the complexity of the 57
      member SynCom SRC1
    explanation: >-
      Supports the parent community and four-variant rational reduction design.
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Finally, the fourth variant, SRC2v4, was designed specifically to
      optimize root colonization efficiency.
    explanation: >-
      Identifies the curated 15-member variant as the formulation selected for
      root-colonization capacity.
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      For strains that exhibited highly similar abundance rankings, priority
      was given to isolates previously characterized as capable of utilizing S.
      bicolor root exudates as a sole carbon source
    explanation: >-
      Documents the root-exudate-use tie breaker in the SRC2v4 design.
