ecological_interactions:
- name: Root-Colonization-Selected SRC2v4 Stability
  description: >-
    SRC2v4, the 15-member variant selected for root colonization efficiency,
    was the most compositionally representative of its inoculum among the four
    SRC2 variants and shifted no members in the differential-abundance test
    against the starting inoculum.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Live SRC2v4 Plant Growth Promotion
    description: >-
      Stable colonization by SRC2v4 was linked to its selection for further
      live versus heat-killed plant growth assays.
  evidence:
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Differential abundance testing reinforced SRC2v4's exceptional stability
    explanation: >-
      Supports the community-level colonization-stability phenotype of SRC2v4.
- name: Live SRC2v4 Plant Growth Promotion
  description: >-
    Live SRC2v4 promoted above- and below-ground S. bicolor growth in 1-month
    gnotobiotic microboxes, whereas heat-killed SRC2v4 failed to significantly
    induce plant growth promotion.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: SRC2v4 Host Flavonoid Response
    description: >-
      Live SRC2v4 was then profiled with host RNA-seq and metabolomics to
      characterize the molecular plant response accompanying successful
      colonization.
  evidence:
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Live SRC2v4 treatment increased shoot fresh weight, shoot dry weight, and
      root fresh weight.
    explanation: >-
      Documents plant growth promotion by live SRC2v4 relative to the
      heat-killed and mock controls.
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: host interaction with live SRC2v4 was required for PGP
    explanation: >-
      Shows that the plant growth promotion required live SRC2v4 rather than
      heat-killed microbial material.
- name: SRC2v4 Host Flavonoid Response
  description: >-
    Colonization by SRC2v4 induced a dynamic root and shoot host transcriptomic
    response that upregulated flavonoid biosynthesis genes and was corroborated
    by LC-MS/MS detection of enriched flavones in root and rhizosphere samples.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      functional enrichment analysis confirmed that the flavonoid biosynthetic
      pathway was strongly regulated
    explanation: >-
      Supports host transcriptional regulation of flavonoid biosynthesis after
      SRC2v4 inoculation.
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Notably, five enriched flavones in the root in addition to Flavone +1O;
      OMe in the rhizosphere
    explanation: >-
      Supports metabolomic flavone enrichment in SRC2v4-treated roots and
      rhizosphere samples.
growth_media:
- name: Sterile Hoagland microbox seedling system
  composition:
  - name: calcined clay
    concentration: 1
    unit: kg per 5-l microbox
    from_source: community_curated
  - name: Hoagland's solution
    concentration: 400
    unit: ml per 5-l microbox
    from_source: community_curated
  temperature_range: 26-28
  temperature_unit: C
  light_regime: '16 h : 8 h light : dark'
  vessel_type: 5-l sterile microboxes
  preparation_notes: >-
    Pregerminated S. bicolor seeds were dipped in SRC2v4, heat-killed SRC2v4,
    or mock inoculum, planted 5 cm deep, and dosed with 1 ml additional
    inoculum per seed.
  evidence:
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Seedling assays were conducted in 5-l sterile microboxes (Combiness,
      Belgium) containing 1 kg of autoclaved calcined clay (Sierra Pacific
      Supply, Campbell, CA, USA) mixed with 400 ml of sterile Hoagland's
      solution
    explanation: >-
      Supports the gnotobiotic microbox vessel, calcined-clay matrix, and
      Hoagland solution used for the SRC2v4 plant assays.
  - reference: PMID:42454401
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Growth conditions were maintained at 26-28C, 16 h : 8 h, light : dark,
      and 50% relative humidity.
    explanation: Supports the temperature, photoperiod, and humidity settings.
