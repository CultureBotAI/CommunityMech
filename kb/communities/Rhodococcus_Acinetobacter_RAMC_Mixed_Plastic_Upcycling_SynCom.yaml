ecological_interactions:
- name: RAMC aromatic-aliphatic oxygenate division of labor
  description: >
    R. jostii strain PET specializes on aromatic carboxylates generated from
    PET and PS deconstruction, while A. baylyi ADP1 specializes on aliphatic
    carboxylates generated from PE and PP deconstruction; pairing the two
    specialists in RAMC allows complete consumption of the simulated mixed
    oxygenate pool that neither monoculture depleted.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
