id: CommunityMech:000412
name: Rhodococcus-Acinetobacter RAMC Mixed Plastic Upcycling SynCom
description: >
  A bottom-up, two-member synthetic bacterial consortium, termed RAMC, that
  couples Rhodococcus jostii strain PET aromatic-carboxylate metabolism with
  Acinetobacter baylyi ADP1 aliphatic-carboxylate metabolism to consume
  oxygenated products from post-consumer mixed plastic deconstruction. The
  platform was optimized across SR:SA starting ratios of 9:1 through 1:9,
  completely consumed aromatic plus aliphatic model oxygenates that neither
  monoculture fully depleted, and supported an engineered RAMC-P_9/1 derivative
  that converted real mixed-plastic effluents into lycopene and microbial
  lipids.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Construct a robust division-of-labor SynCom that converts chemically
    depolymerized post-consumer mixed plastic waste into microbial biomass and
    value-added products.
  assembly_strategy: >
    Pair specialist R. jostii strain PET (SR), which consumes aromatic
    carboxylic acids such as terephthalic acid and benzoic acid, with specialist
    A. baylyi ADP1 (SA), which consumes the acetic, lactic, succinic, glutaric,
    adipic, and pimelic acid mixture generated from polyolefin deconstruction.
  inoculation_strategy: >
    Wash glucose-grown seed cultures twice with sterile deionized water,
    resuspend each to OD600 2, and mix SR and SA to an initial total OD600 0.2
    at SR:SA ratios of 9:1, 7:3, 5:5, 3:7, or 1:9; RAMC-P_9/1 used the product
    strains SR-P and SA-P at the 9:1 starting ratio selected for follow-up
    plastic upcycling assays.
  perturbation_design: >
    Compare specialist monocultures to RAMC, vary total carbon from 125 to
    750 mM, vary the SR:SA starting cell-density ratio, replace simulated media
    with real post-consumer mixed-plastic deconstruction effluents, spike
    additional PET- or PS-derived aromatic acids to mimic waste-stream
    variability, and repeat product assays with altered PE:PP ratios.
  measurement_endpoints:
  - HPLC depletion of individual aromatic and aliphatic oxygenates
  - dry cell weight and OD600 biomass accumulation
  - population balance by CFU counts
  - lycopene concentration
  - total lipid concentration
  notes: >
    RAMC denotes the wild-type SR plus SA platform, while RAMC-P denotes the
    corresponding lycopene/lipid-producing engineered-derivative platform.
  evidence:
  - reference: PMID:41381587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      we construct engineered microbial consortia by leveraging DOL
    explanation: Supports the bottom-up division-of-labor assembly strategy.
  - reference: PMID:41381587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      SR completely consumed the aromatic carboxylic acids (TPA and BEN) but
      showed a limited utilization of aliphatic carboxylic acids
    explanation: Supports the aromatic-carboxylate specialization of SR.
  - reference: PMID:41381587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      These results suggest that ADP1 can be an ideal aliphatic carboxylic acid
      specialist for assembling a consortium for mixed plastic upcycling.
    explanation: Supports selecting ADP1 as the aliphatic-acid specialist.
  - reference: PMID:41381587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Next, we assembled a co-culture of SR-P and SA-P, referred to as RAMC-P
    explanation: Supports the RAMC-P engineered-derivative assembly from SR-P and SA-P.
  - reference: PMID:41381587
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      When cultivated in BM, RAMC-P_9/1 produced ~1248 μg/L of lycopene and
      0.37 g/L of total lipids
    explanation: Supports RAMC-P_9/1 lycopene and lipid production from basal real-plastic medium.
