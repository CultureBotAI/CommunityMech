id: CommunityMech:000017
name: Chromium Sulfur Oxidation Enrichment
description: >
  An enrichment consortium in which microbial chromate reduction is coupled to
  anaerobic oxidation of inorganic electron donors. A 60-day cultivation study
  showed that sludge enrichments supplied with elemental sulfur, S(0), or
  zerovalent iron, Fe(0), as sole electron donors biologically reduced Cr(VI),
  deposited Cr(III) as the main reduction product, and achieved high chromate
  removal in both independent donor systems. High-throughput 16S rRNA sequencing
  linked this transformation to a consortium-level division of labor in which
  S(0)- or Fe(0)-oxidizing bacteria such as Thiobacillus or Ferrovibrio generated
  volatile fatty acids that chromate-reducing bacteria such as Geobacter or
  Desulfovibrio could further use to reduce chromate.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: METAL_REDUCTION
engineering_design:
  objective: >
    Enrich a microbial consortium that can reduce toxic soluble Cr(VI) in
    contaminated water while using elemental sulfur or zerovalent iron as an
    inorganic electron donor.
  assembly_strategy: >
    Anaerobic sludge enrichment in two independent systems supplied with S(0) or
    Fe(0) as the sole electron donor.
  measurement_endpoints:
  - Cr(VI) removal from liquid culture
  - Cr(III) deposition as the reduction product
  - 16S rRNA community composition
  evidence:
  - reference: doi:10.1021/acs.est.8b05053
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      This study demonstrated chromate could be biologically reduced by using
      S(0) or Fe(0) as inorganic electron donor
    explanation: >
      Supports enrichment of biological chromate-reducing consortia on elemental
      sulfur or zerovalent iron.
