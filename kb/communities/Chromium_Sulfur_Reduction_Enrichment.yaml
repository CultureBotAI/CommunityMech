ecological_interactions:
- name: Inorganic-Donor Oxidation to Volatile Fatty Acids
  description: HYPOTHESIZED - in separate S(0)-fed and Fe(0)-fed sludge enrichments, the authors propose that inorganic-donor
    oxidizers generate volatile fatty acids usable by chromate reducers. Thiobacillus and Ferrovibrio are example
    oxidizers in the primary abstract, not proof of one defined community shared by both systems. The accessible
    abstract and supplement do not establish exact VFA molecules or taxon-resolved production and transfer.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  participating_taxa:
  - preferred_term: Thiobacillus
    term:
      id: NCBITaxon:919
      label: Thiobacillus
  metabolites:
  - preferred_term: elemental sulfur
    term:
      id: CHEBI:33403
      label: elemental sulfur
    notes: Solid S(0) donor in the sulfur-fed system; this is not the sulfur-atom ontology term or an identified
      exchanged VFA.
  downstream:
  - target: VFA-Fed Chromate Reduction
    description: HYPOTHESIZED - VFA production by donor-oxidizing members could provide organic electron donors
      to chromate reducers. This author-proposed substrate link is not direct tracing between the named genera,
      and exact molecules and system-specific producers/consumers remain unresolved in the accessible evidence.
  evidence:
  - reference: doi:10.1021/acs.est.8b05053
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'S(0)- or Fe(0)-oxidizing bacteria (e.g., Thiobacillus or Ferrovibrio) could generate volatile fatty
      acids as metabolites

      '
    explanation: The primary abstract proposes VFA generation by example oxidizers; it does not identify acetate
      or resolve taxon-specific donor flux in either system.
- name: VFA-Fed Chromate Reduction
  description: PARTIAL - separate S(0)-fed and Fe(0)-fed sludge systems removed Cr(VI), with deposited Cr(III) reported
    as the main reduction product. The authors propose VFA use by reducers such as Geobacter or Desulfovibrio from
    community-composition evidence. This does not demonstrate one three-member defined consortium, acetate transfer,
    or exclusive VFA mediation. Supplemental controls distinguish biotic and abiotic systems and show some early
    abiotic Fe-associated Cr(VI) loss.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Thiobacillus
    term:
      id: NCBITaxon:919
      label: Thiobacillus
  - preferred_term: Geobacter
    term:
      id: NCBITaxon:28231
      label: Geobacter
  - preferred_term: Desulfovibrio
    term:
      id: NCBITaxon:872
      label: Desulfovibrio
  metabolites:
  - preferred_term: chromate
    term:
      id: CHEBI:35404
      label: chromate(2-)
  downstream:
  - target: Cr(III) Deposition and Immobilization
    description: Reduction of Cr(VI) yields Cr(III), reported by XPS as the main deposited product in these enrichments.
      This supported transformation/product relationship does not establish that the upstream VFA mechanism uniquely
      caused deposition or that all removal is biological under every operating condition.
  evidence:
  - reference: doi:10.1021/acs.est.8b05053
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'volatile fatty acids as metabolites, which were further utilized by chromate-reducing bacteria

      '
    explanation: Supports the proposed VFA-mediated consortium model, not identified acetate transfer, partner-resolved
      flux or isolated causal necessity.
  - reference: doi:10.1021/acs.est.8b05053
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'Cr(VI) reduction coupled to S(0) or Fe(0) oxidation was mediated synergically by a microbial consortia

      '
    explanation: Author interpretation of consortium-level coupling from reactor and community observations; not
      formal synergy or a resolved mechanism shared by identical memberships in both donor systems.
- name: Cr(III) Deposition and Immobilization
  description: The primary abstract identifies deposited Cr(III) as the main Cr(VI)-reduction product by X-ray photoelectron
    spectroscopy. This is a bulk product/retention observation, not cross-feeding, demonstrated cellular detoxification,
    free chromium(3+) speciation or tested long-term immobilization stability.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: chromate
    term:
      id: CHEBI:35404
      label: chromate(2-)
  evidence:
  - reference: doi:10.1021/acs.est.8b05053
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The deposited Cr(III) was identified as the main reduction product based on X-ray photoelectron spectroscopy

      '
    explanation: Supports bulk deposited Cr(III) identified by XPS; neither exact deposited compound identity nor
      free-cation speciation, cellular mechanism or long-term retention follows from this abstract statement.
