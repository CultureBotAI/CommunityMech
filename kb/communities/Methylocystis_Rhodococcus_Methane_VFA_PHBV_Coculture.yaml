ecological_interactions:
- name: Valeric-Acid PHBV Accumulation
  description: 'After methane growth, the defined M. parvus OBBP/R. opacus DSM 43205 coculture was transferred to
    nitrogen-free medium at pH 7 with externally supplied valeric acid (30% of total carbon). PHBV accumulated under
    both air and CH4:O2 headspaces: maxima were 35.9 +/- 8.6% and 68 +/- 7% by mass, respectively. These are whole-coculture
    polymer contents, not reciprocal benefit or measured VFA exchange. A separate Methylocystis-enriched community
    is a comparator, not an additional member; under air it produced PHV without PHB, unlike the defined pair.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: valeric acid
    term:
      id: CHEBI:17418
      label: valeric acid
    notes: Externally supplied substrate, not demonstrated interspecies exchange.
  evidence:
  - reference: PMID:38516398
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: valeric acid promoted PHBV accumulation in both cultures regardless of the atmosphere
    explanation: Abstract summary supports accumulation with supplied valeric acid under both tested atmospheres;
      body distinguishes defined-coculture PHBV from PHV-only production in the separate air-grown mixed comparator.
  participating_taxa:
  - preferred_term: Methylocystis parvus
    term:
      id: NCBITaxon:134
      label: Methylocystis parvus
  - preferred_term: Rhodococcus opacus
    term:
      id: NCBITaxon:37919
      label: Rhodococcus opacus
- name: Mixed-VFA PHBV Accumulation Under Tested Gas Conditions
  description: The methane-grown defined coculture received a synthetic acetate/propionate/butyrate/valerate mixture
    (15% of total carbon) in nitrogen-free medium, not actual waste effluent. PHBV accumulated with CH4:O2 (33.3:66.6)
    but was not detected under air. Because oxygen supply also differs, this is a positive gas-condition contrast,
    not an oxygen-matched selective methane test. Peak coculture PHBV content was 73.7 +/- 2.5% by mass on day 18
    (PHB:PHV 94:6), versus 49.6 +/- 13% in the separately tested mixed consortium. Polymer fraction is not biomass
    yield, partner-resolved synthesis or proof of mutualism; bulk measurements do not isolate R. opacus mediation.
  scope: COMMUNITY_LEVEL
  metabolites:
