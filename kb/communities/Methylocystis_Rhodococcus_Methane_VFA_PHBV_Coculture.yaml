id: CommunityMech:000204
name: Methylocystis-Rhodococcus Methane VFA PHBV Coculture
description: >
  A defined synthetic coculture pairing the type II methanotroph Methylocystis parvus with
  the heterotrophic bacterium Rhodococcus opacus for methane-linked polyhydroxyalkanoate
  production. The coculture was first evaluated for methane-to-poly(3-hydroxybutyrate)
  conversion and then used in a two-stage PHBV accumulation strategy with nutrient starvation,
  methane, oxygen or air, valeric acid, and a volatile fatty acid mixture containing acetic,
  propionic, butyric, and valeric acids. The system is relevant to methane valorization,
  waste-derived volatile fatty acid upgrading, and biopolymer production.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert methane and volatile fatty acid cosubstrates into microbial
    polyhydroxyalkanoate biopolymer, especially PHBV, using a defined methanotroph-heterotroph
    coculture.
  assembly_strategy: Bottom-up coculture of Methylocystis parvus and Rhodococcus opacus,
    selected from prior methane-to-PHB coculture tests for follow-up PHBV accumulation.
  perturbation_design: Methane-grown biomass was transferred to nutrient-starved mineral medium
    with valeric acid or a mixed VFA cosubstrate and incubated under CH4:O2 or air headspace.
  measurement_endpoints:
  - Methane, oxygen, and carbon dioxide dynamics
  - Total suspended solids
  - PHA concentration and composition
  - PHBV content under VFA and methane conditions
  evidence:
  - reference: PMID:38516398
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic coculture and a mixed methanotrophic consortium
    explanation: Supports the engineered synthetic coculture design evaluated against a mixed consortium.
