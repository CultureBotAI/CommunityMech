id: CommunityMech:000388
name: Rhizorhabdus-Cupriavidus BDE-47 Degradation SynCom
description: A defined aerobic two-isolate synthetic consortium pairing Rhizorhabdus wittichii YL-JM2C with the chloroaromatic-degrading
  strain reported as Cupriavidus necator JMP134 for 2,2',4,4'-tetrabromodiphenyl ether (BDE-47) degradation. YL-JM2C uses
  the dioxygenase TcsAaAb to initiate BDE-47 conversion to 2,4-dibromophenol and 3,5-dibromocatechol; JMP134 hydroxylates
  the YL-JM2C dead-end 2,4-dibromophenol intermediate to 3,5-dibromocatechol, which can then enter an ortho-cleavage pathway
  in either strain. The bottom-up consortium removed BDE-47 from minimal salts medium and real wastewater microcosms.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Assemble a bottom-up bacterial SynCom that closes the aerobic BDE-47 catabolic pathway by coupling YL-JM2C-initiated
    ring oxidation with JMP134 hydroxylation of the 2,4-dibromophenol dead-end intermediate.
  assembly_strategy: Grow Rhizorhabdus wittichii YL-JM2C and Cupriavidus necator JMP134 separately to exponential phase in
    R2A, harvest and wash the cells into pH 7 minimal salts medium, then mix equal volumes of the two suspensions before adding
    BDE-47.
  inoculation_strategy: Use washed resting-cell suspensions in minimal salts medium for flask BDE-47 assays and 5% v/v of
    each OD600 1.0 strain suspension for wastewater microcosm tests.
  measurement_endpoints:
  - BDE-47 and 2,4-dibromophenol concentrations by HPLC
  - BDE-47 transformation products by LC-MS and GC-MS
  - Bromide release by ion chromatography
  - Strain-specific 16S rRNA gene abundance by qPCR
  - Residual BDE-47 in real wastewater microcosms
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic consortium composed of two environmental isolates, Rhizorhabdus wittichii YL-JM2C and Cupriavidus necator
      JMP134
    explanation: Identifies the exact two isolate members of the bottom-up SynCom.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A synthetic consortium was established by mixing equal volumes of both cell suspensions, followed by the addition
      of BDE-47.
    explanation: Supports equal-volume assembly of the two washed cell suspensions for BDE-47 assays.
