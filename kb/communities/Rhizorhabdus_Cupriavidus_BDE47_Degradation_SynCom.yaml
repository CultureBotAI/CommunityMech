ecological_interactions:
- name: YL-JM2C BDE-47 initiation
  description: Rhizorhabdus wittichii YL-JM2C initiates aerobic BDE-47 oxidation through TcsAaAb, producing 2,4-dibromophenol
    and 3,5-dibromocatechol. The 2,4-DBP branch is a dead-end for YL-JM2C and becomes the substrate for JMP134 TfdB hydroxylation.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Rhizorhabdus wittichii YL-JM2C
    term:
      id: NCBITaxon:160791
      label: Rhizorhabdus wittichii
  target_taxon:
    preferred_term: Cupriavidus necator JMP134
    term:
      id: NCBITaxon:264198
      label: Cupriavidus pinatubonensis JMP134
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: JMP134 2,4-dibromophenol rescue
    description: YL-JM2C-generated 2,4-dibromophenol is subsequently converted to 3,5-dibromocatechol by JMP134 TfdB.
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TcsAaAb from strain YL-JM2C catalyzed the initial conversion of BDE-47 into 2,4-dibromophenol (2,4-DBP) and 3,5-dibromocatechol
      (3,5-DBC)
    explanation: Supports YL-JM2C as the first transformer of BDE-47.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As a dead-end intermediate in strain YL-JM2C
    explanation: Supports 2,4-DBP as a YL-JM2C dead-end intermediate.
- name: JMP134 2,4-dibromophenol rescue
  description: Cupriavidus necator JMP134 hydroxylase TfdB converts the YL-JM2C dead-end 2,4-dibromophenol product to 3,5-dibromocatechol,
    linking YL-JM2C's initial BDE-47 attack to the downstream ortho-cleavage pathway shared by both strains.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Cupriavidus necator JMP134
    term:
      id: NCBITaxon:264198
      label: Cupriavidus pinatubonensis JMP134
  target_taxon:
    preferred_term: Rhizorhabdus wittichii YL-JM2C
    term:
      id: NCBITaxon:160791
      label: Rhizorhabdus wittichii
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: Consortium BDE-47 removal
    description: Removal of the 2,4-DBP bottleneck connects the two isolate pathways and enables community-level BDE-47 degradation.
  evidence:
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 2,4-DBP) was subsequently transformed into the latter (3,5-DBC) by the hydroxylase TfdB from strain JMP134
    explanation: Supports JMP134 hydroxylation of the YL-JM2C-derived 2,4-DBP intermediate.
  - reference: PMID:42364169
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The resulting 3,5-DBC was catabolized through the downstream ortho-cleavage pathway present in both strains.
    explanation: Supports 3,5-DBC as the shared downstream intermediate.
