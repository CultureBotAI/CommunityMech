    evidence_source: IN_VITRO
    snippet: Bioaugmentation with this consortium achieved complete removal of BDE-47 in real wastewater samples.
    explanation: Supports the emergent wastewater BDE-47 removal endpoint.
  - reference: PMID:42364169
