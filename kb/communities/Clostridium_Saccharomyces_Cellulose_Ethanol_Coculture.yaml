    explanation: Supports the approximately 22 g/L coculture endpoint with added endoglucanase, not an unsupplemented
      productivity gain or a partner-resolved sugar flux.
- name: Oxygen Protection of Anaerobic Cellulolytic Partner
  description: The oxygen-removal arm of a condition-dependent mutualism protects oxygen-sensitive C. phytofermentans,
    while bacterial sugar supply benefits the yeast. Semi-aerobic mono-/coculture comparisons support respiratory
    protection, and controlled low oxygen delivery supports yeast persistence. This is not a claim that either organism
    universally requires its partner under other culture conditions.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Saccharomyces cerevisiae cdt-1
