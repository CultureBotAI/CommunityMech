ecological_interactions:
- name: Cellulose Hydrolysis Feeds Yeast Fermentation
  description: C. phytofermentans hydrolysis supplies soluble sugars, including cellodextrins and glucose, that
    support S. cerevisiae cdt-1. Cellulose is the upstream feedstock. The approximately 22 g/L ethanol result used
    added endoglucanase; unsupplemented coculture did not show the same productivity improvement. Under the low-oxygen
    ethanol-production regime, ethanol is an output rather than the proposed sugar-transfer currency.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
