id: CommunityMech:000206
name: Clostridium-Saccharomyces Cellulose Ethanol Coculture
description: >
  A synthetic two-member cellulose-to-ethanol coculture pairing the cellulolytic
  mesophile Clostridium phytofermentans ISDg, currently represented in NCBI
  Taxonomy as Lachnoclostridium phytofermentans ISDg, with the engineered
  cellodextrin-fermenting yeast Saccharomyces cerevisiae cdt-1. The consortium
  is maintained by controlled oxygen delivery: the yeast removes inhibitory oxygen
  and receives soluble sugars released during C. phytofermentans cellulose hydrolysis.
  With added endoglucanase, the coculture produced approximately 22 g/L ethanol from
  100 g/L alpha-cellulose. This system is relevant to DOE lignocellulosic biofuel
  and consolidated bioprocessing goals.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Develop a stable consortia-based process for direct ethanol production
    from cellulose using oxygen-mediated symbiosis between a cellulolytic bacterium
    and an ethanologenic yeast.
  assembly_strategy: Combine C. phytofermentans with S. cerevisiae cdt-1 so that
    bacterial cellulose hydrolysis supplies soluble sugars to the yeast while yeast
    respiration protects the oxygen-sensitive bacterium.
  perturbation_design: Compare mono- and cocultures under semi-aerobic conditions,
    controlled oxygen transfer, scale-up to 500 mL reactors, and added endoglucanase
    during high-cellulose fermentations.
  measurement_endpoints:
  - Filter paper degradation
  - Alpha-cellulose conversion
  - Ethanol concentration
  - Population stability over 50 days
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: symbiotic Clostridium phytofermentans/yeast co-culture
    explanation: Supports the engineered cellulolytic bacterium and yeast coculture design.
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: consortia-based bioprocessing systems for lignocellulosic biofuels production
    explanation: Supports the DOE-relevant lignocellulosic biofuels objective.
