discussions:
- discussion_id: yeast_cellulose_stability_and_productivity
  prompt: How do oxygen delivery and hydrolytic capacity separately control persistence and ethanol productivity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cellulose Hydrolysis Feeds Yeast Fermentation
  - ecological_interactions#Oxygen Protection of Anaerobic Cellulolytic Partner
  - ecological_interactions#Oxygen-Dependent Long-Term Population Maintenance
  rationale: The oxygen controls support conditional cooperation and viable population maintenance, while additional
    endoglucanase improves conversion. These are different experimental arms. Mediator-specific or partner-resolved
    measurements would separate respiratory protection, sugar supply and enzyme effects without inferring universal
    obligacy or unsupplemented productivity gains.
