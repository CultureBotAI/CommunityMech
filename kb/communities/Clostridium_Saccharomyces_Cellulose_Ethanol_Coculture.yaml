cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  working_volume: 50.0
  working_volume_unit: mL
  operating_temperature: 30.0
  operating_temperature_unit: °C
  instrument_detail: >-
    50 mL cultures at 30 °C under semi-aerobic conditions in sealed 100 mL serum bottles, with
    oxygen delivered at a controlled rate by diffusion through 10 cm of neoprene tubing fixed
    to stainless steel tubing inserted through the seal, at roughly 8 μmol/L per hour.
    Populations of 1e5 to 1e6 CFU/mL were held for 50 days. α-Cellulose was the model
    substrate, chosen because it carries no additional carbon sources.
  notes: >-
    The oxygen rate is the experiment, not a condition around it. The consortium is
    "maintained by controlled oxygen transport": the yeast protects the anaerobe from
    introduced oxygen in exchange for the sugars its cellulose hydrolysis releases, so
    removing the oxygen removes the reason the partnership exists. Recording
    "semi-aerobic" without the rate would lose that.

    Only cocultures degraded filter paper under these conditions - the monocultures did not -
    which is why the conditions belong to the community rather than to either member (#529).

    `system_type` corrected from FLASK to SERUM_BOTTLE. The abstract said "50 mL shake
    cultures", which read as flasks; the full text, fetched after this record was first
    curated, shows a sealed 100 mL serum bottle with the oxygen-transfer tubing inserted
    through the seal. The seal is the point - a flask could not hold a controlled oxygen
    transfer rate, which is the entire mechanism here. The 50 mL is the working volume in a
    100 mL vessel.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Only co-cultures were able to degrade filter paper when mono- and co-cultures were
      incubated at 30°C under semi-aerobic conditions
    explanation: Temperature and oxygen regime, stated for the cocultures specifically.
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using controlled oxygen delivery by diffusion through neoprene tubing at a calculated
      rate of approximately 8 μmol/L hour, we demonstrate establishment of the symbiotic relationship
    explanation: The oxygen-delivery mechanism and rate that maintain the consortium.
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Controlled oxygen transfer reactor with 10 cm neoprene tubing fixed to stainless steel
      tubing inserted into a sealed 100 mL serum bottle
    explanation: The actual vessel and how the oxygen line enters it.
- cultivation_mode: BATCH
  system_type: BIOREACTOR_UNSPECIFIED
  working_volume: 500.0
  working_volume_unit: mL
  operating_temperature: 30.0
  operating_temperature_unit: °C
  instrument_detail: >-
    The scale-up arm: 500 mL bioreactors, reported as showing symbiotic population dynamics
    comparable to the 50 mL shake cultures.
  notes: >-
    Recorded as a second entry rather than merged, because the comparability between scales is
    a result rather than a detail - it is what the paper offers as evidence the symbiosis is
    not an artefact of small-volume culture.

    `system_type` is BIOREACTOR_UNSPECIFIED: the source says "bioreactors" and never says what
    kind. Abstract-only, so no agitation, medium composition or oxygen-transfer figures for
    this arm either.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Comparable symbiotic population dynamics were observed in scaled up 500 mL bioreactors
      as those in 50 mL shake cultures
    explanation: Both vessels and volumes, and that the two scales behaved alike.

environmental_factors:
- name: Controlled oxygen transfer
  value: approximately 8 micromol/L hour diffusive oxygen delivery
  description: Low-level oxygen delivery through neoprene tubing provided enough oxygen
    for yeast respiration while maintaining compatibility with the anaerobic cellulolytic
    bacterium.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: controlled oxygen delivery by diffusion
    explanation: Supports controlled diffusive oxygen delivery as the stabilizing factor.
- name: Semi-aerobic cellulose degradation
  value: filter paper and alpha-cellulose under semi-aerobic coculture conditions
  description: Filter paper degradation required coculture under semi-aerobic conditions,
    and high-substrate alpha-cellulose tests quantified ethanol production.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: semi-aerobic conditions
    explanation: Supports the oxygen regime for filter paper degradation assays.
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Only co-cultures were able to degrade filter paper
    explanation: Supports coculture-specific cellulose degradation under semi-aerobic conditions.
- name: Added endoglucanase
  value: added endoglucanase during high-cellulose fermentation
  description: Additional cellulase improved alpha-cellulose conversion and ethanol production,
    indicating hydrolysis-rate limitation in the coculture process.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: improve with additional cellulase
    explanation: Supports cellulase supplementation as a performance-affecting perturbation.
- name: Ethanol titer
  value: approximately 22 g/L ethanol from 100 g/L alpha-cellulose
  description: The C. phytofermentans and S. cerevisiae cdt-1 coculture with endoglucanase
    produced more ethanol than either monoculture under the reported high-cellulose condition.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 22 g/L ethanol from 100 g/L
    explanation: Supports the curated ethanol titer and substrate loading.
