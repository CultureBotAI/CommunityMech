    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Oxygen-Dependent Long-Term Population Maintenance
    description: PARTIAL - yeast respiratory protection together with oxygen-supported yeast growth and bacterial
      sugar supply can stabilize the pairing. Oxygen-positive versus oxygen-negative viable-count controls support
      the conditional cooperation, without selectively measuring every mediator.
  evidence:
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: “protect” C. phytofermentans from introduced oxygen
    explanation: Supports oxygen removal by yeast as the protective interaction.
  - reference: PMID:23628342
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: maintained by controlled oxygen transport
    explanation: Supports controlled oxygen delivery as the stabilizing environmental mechanism.
- name: Oxygen-Dependent Long-Term Population Maintenance
  description: With controlled oxygen delivery, both partners remained culturable at the reported 30-, 40- and 50-day
    samples; without oxygen the yeast fell below detection before day 30. This long-term arm used 25 mL medium and
    150 g/L alpha-cellulose. Population maintenance is a community outcome, distinct from the enzyme-assisted ethanol
    experiment and from an unconditional mutualism claim.
