ecological_interactions:
- name: Hydrogen Peroxide Cross-Protection
  description: Alteromonas protects Prochlorococcus by removing hydrogen peroxide and other reactive oxygen
    species. This detoxification service reduces oxidative stress for Prochlorococcus, which lacks catalase,
    and increases its growth under otherwise inhibitory peroxide and temperature conditions.
  interaction_type: COMMENSALISM
  source_taxon:
    preferred_term: Alteromonas macleodii EZ55
    term:
      id: NCBITaxon:28108
      label: Alteromonas macleodii
  target_taxon:
    preferred_term: Prochlorococcus marinus MIT9312
    term:
      id: NCBITaxon:1219
      label: Prochlorococcus marinus
  metabolites:
  - preferred_term: hydrogen peroxide
    term:
      id: CHEBI:16240
      label: hydrogen peroxide
    notes: Reactive oxygen species removed by helper bacteria.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Prochlorococcus growth
    description: Scavenging hydrogen peroxide increases Prochlorococcus growth rate and permissive temperature range.
  evidence:
  - reference: PMID:29087377
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Alteromonas facilitate the growth of Prochlorococcus by scavenging HOOH
    explanation: Directly supports the helper-bacterium peroxide-scavenging mechanism.
  - reference: doi:10.1038/ismej.2017.189
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lacks the gene catalase and relies on 'helper' bacteria
    explanation: Supports the dependence of Prochlorococcus on helper bacteria for oxidative stress relief.
- name: Carbon Dioxide Perturbation of Helper Function
  description: Elevated carbon dioxide weakens the Alteromonas helper interaction by decreasing Alteromonas
    catalase gene expression and reducing the rate at which cocultures remove hydrogen peroxide. This
    makes Prochlorococcus more vulnerable to oxidative stress under projected high-CO2 conditions.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Alteromonas macleodii EZ55
    term:
