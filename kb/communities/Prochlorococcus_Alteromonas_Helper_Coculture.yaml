id: CommunityMech:000131
name: Prochlorococcus-Alteromonas Helper Coculture
description: A defined marine phototroph-heterotroph coculture in which the cyanobacterium Prochlorococcus
  marinus MIT9312 is paired with the heterotrophic helper bacterium Alteromonas macleodii EZ55. The
  system models an ocean-surface interaction where Prochlorococcus is vulnerable to hydrogen peroxide
  because it lacks catalase, while Alteromonas removes reactive oxygen species and thereby expands the
  conditions under which Prochlorococcus can grow. Elevated carbon dioxide perturbs this interaction by
  reducing Alteromonas catalase expression and hydrogen peroxide removal.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Test how a heterotrophic helper bacterium changes oxidative stress tolerance and growth of
    Prochlorococcus under ocean-relevant hydrogen peroxide, temperature, and carbon dioxide conditions.
  assembly_strategy: Laboratory coculture of Prochlorococcus strains, including MIT9312, with Alteromonas
    macleodii strain EZ55.
  perturbation_design: Ambient and elevated carbon dioxide treatments, hydrogen peroxide treatments, and
    temperature gradients were used to probe helper-bacterium protection.
  measurement_endpoints:
  - Prochlorococcus growth rate
  - Hydrogen peroxide removal
  - Catalase gene expression in Alteromonas
  - Photosynthetic efficiency
  evidence:
  - reference: doi:10.1038/ismej.2017.189
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Prochlorococcus (VOL4, MIT9312) was co-cultured with Alteromonas (strain EZ55)
    explanation: Supports the defined two-member coculture design and strain context.
