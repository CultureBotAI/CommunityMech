ecological_interactions:
- name: A. naeslundii and S. mitis Planktonic Coaggregation
  description: A. naeslundii AK6 and S. mitis SK24 formed visible coaggregates within 15 min in a separate planktonic
    assay in 1/10 Todd-Hewitt broth. This is direct physical association, not a demonstrated directional benefit,
    colonization-facilitation effect or cause of acidification in the five-species biofilm. The authors propose
    an adhesion contribution but did not selectively perturb coaggregation in the pH assay.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Actinomyces naeslundii
    term:
      id: NCBITaxon:1655
      label: Actinomyces naeslundii
  target_taxon:
    preferred_term: Streptococcus mitis
    term:
      id: NCBITaxon:28037
      label: Streptococcus mitis
  evidence:
  - reference: PMID:21966490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cells of A. naeslundii AK6 and S. mitis SK24 formed clearly visible, slowly settling coaggregates within
      15 min
    explanation: Documents the strongest pairwise coaggregation among the five strains used to assemble the early
      dental biofilm.
- name: A. naeslundii and S. sanguinis Planktonic Coaggregation
  description: A. naeslundii AK6 and S. sanguinis SK150 formed small suspended aggregates within 2 h in the separate
    planktonic assay, weaker than the A. naeslundii-S. mitis association. The source/target fields identify the
    measured pair, not a direction of facilitation. This does not establish an attachment route or acidification
    mechanism in the five-species flow biofilm.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Actinomyces naeslundii
    term:
      id: NCBITaxon:1655
      label: Actinomyces naeslundii
  target_taxon:
    preferred_term: Streptococcus sanguinis
    term:
      id: NCBITaxon:1305
      label: Streptococcus sanguinis
  evidence:
  - reference: PMID:21966490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When A. naeslundii AK6 was mixed with S. sanguinis SK150, small uniform aggregates that remained in
      suspension formed within 2 h
    explanation: Documents weaker but positive coaggregation between A. naeslundii and S. sanguinis in the same
      pairwise assay.
- name: Five-species glucose acidification of the biofilm interface
  description: Sequentially assembled five-species plastic flow-channel biofilms showed extracellular acidification
    after 0.4% or 10% glucose in sterile saliva, while the no-glucose control remained above pH 7. Spatial pH differences
    persisted for hours. This is a collective glucose-response endpoint, not demonstrated niche partitioning, metabolite
    exchange, species-specific acid flux or enamel demineralization. Growth in flowing diluted Todd-Hewitt broth
    and the later salivary glucose challenge are distinct stages.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:21966490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Anaerobic glycolysis in the model biofilms created a mildly acidic environment. Decrease in pH in different
      areas of the biofilms varied, and distinct extracellular pH-microenvironments were conserved over several
      hours.
    explanation: Supports measured collective extracellular pH heterogeneity after glucose challenge, not a selective
      role for either coaggregating pair or a niche-partitioning mechanism.
