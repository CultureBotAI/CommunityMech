    snippet: Organisms were cultivated aerobically on blood agar (SSI, Copenhagen, Denmark) and transferred to THB (Roth, Karlsruhe, Germany) at 35°C until mid to late exponential phase prior to experimental use
    explanation: Names aerobic cultivation on blood agar and THB at 35 °C for the strains.
