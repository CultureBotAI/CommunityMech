related_ingredients:
- preferred_term: glucose
  chebi_term:
    id: CHEBI:17234
    label: glucose
  relevance: >
    Glucose supplied in salivary solutions is the carbohydrate substrate that
    drives anaerobic glycolysis in this five-species biofilm, generating the
    acidic extracellular microenvironments central to the caries model.
  evidence:
  - reference: PMID:21966490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We employed the pH-sensitive ratiometric probe C-SNARF-4 to perform
      real-time microscopic analyses of the biofilm pH in response to salivary
      solutions containing glucose.
    explanation: Names glucose as the carbohydrate challenge fueling biofilm acidogenesis.
environmental_factors:
- name: Glucose challenge
  description: >-
    Salivary solutions containing glucose were used to trigger anaerobic
    glycolysis and map extracellular pH at the biofilm-substrate interface.
  evidence:
  - reference: PMID:21966490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We employed the pH-sensitive ratiometric probe C-SNARF-4 to perform
      real-time microscopic analyses of the biofilm pH in response to salivary
      solutions containing glucose.
    explanation: Documents the carbohydrate perturbation used to probe pH dynamics.
- name: Persistent acidic microenvironments
  description: >-
    Anaerobic glycolysis generated conserved extracellular acidic microniches
    across the developing biofilm.
  evidence:
  - reference: PMID:21966490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Anaerobic glycolysis in the model biofilms created a mildly acidic
      environment. Decrease in pH in different areas of the biofilms varied,
      and distinct extracellular pH-microenvironments were conserved over
      several hours.
    explanation: Supports the dysbiosis-relevant pH heterogeneity captured by the model.
growth_media:
- name: Todd-Hewitt broth (THB); flow-cell biofilm fed with sterile saliva
  temperature: '35'
  temperature_unit: °C
  atmosphere: AEROBIC
  incubation_time: '26'
  incubation_time_unit: h
  vessel_type: flow cell / flow channel
  preparation_notes: Strains were cultivated aerobically on blood agar and transferred to Todd-Hewitt broth (THB) at 35 °C to mid-to-late exponential phase; the five species were inoculated sequentially into a flow-cell system and biofilms grown for 26 h at 35 °C; living biofilms were then stimulated with sterile salivary solutions containing glucose.
  evidence:
