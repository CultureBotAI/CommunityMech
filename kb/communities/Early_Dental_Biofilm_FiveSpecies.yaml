    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: were inoculated sequentially into a flow cell system that permitted direct microscopic examination, and biofilms were grown for 26 h at 35°C
    explanation: Names the flow-cell vessel, 26 h incubation, and 35 °C biofilm growth temperature.
  - reference: PMID:21966490
