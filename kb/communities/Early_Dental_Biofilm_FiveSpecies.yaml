discussions:
- discussion_id: early_dental_coaggregation_acidification_boundary
  prompt: Does either pairwise coaggregation mechanism mediate biofilm acidification?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#A. naeslundii and S. mitis Planktonic Coaggregation
  - ecological_interactions#A. naeslundii and S. sanguinis Planktonic Coaggregation
  - ecological_interactions#Five-species glucose acidification of the biofilm interface
  rationale: 'Planktonic coaggregation and glucose-responsive biofilm pH were measured in different assays. Neither
    pair was selectively disrupted or rescued in the biofilm; physical association does not establish colonization
    benefit or mediation of the pH response. Resolve species-specific acid flux and the origin of persistent pH
    heterogeneity experimentally. The two workflow-to-outcome arrows are removed. Flow rate, growth feed, substrate
    and temperature-stage metadata remain under #1420.'
