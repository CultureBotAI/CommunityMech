    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Changes in photosynthesis at the sediment surface had an immediate and repeatable effect on sulfide
      concentrations at depth
    explanation: Supports rapid transmission of a surface photosynthesis perturbation to deeper sulfide chemistry.
