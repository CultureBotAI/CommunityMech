id: CommunityMech:000145
name: Cable Bacteria beneath Photosynthetic Biofilm Sediment Community
description: >
  A coastal sediment community in which long filamentous Desulfobulbaceae cable bacteria connect
  sulfide-rich deeper sediment to oxygen supplied near the sediment-water interface by an oxygenic
  photosynthetic biofilm. The system links sulfur oxidation, oxygen production, sulfide availability,
  and centimeter-scale long-distance electron transfer.
