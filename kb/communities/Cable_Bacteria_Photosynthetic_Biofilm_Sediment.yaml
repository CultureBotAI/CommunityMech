ecological_interactions:
- name: Photosynthesis Stimulates Cable-Bacteria Electron Harvesting
  description: 'Photosynthetic oxygen supply from a diatom-dominated surface biofilm supports cable-bacteria sulfide
    oxidation. The light perturbation supports oxygen cross-feeding, but reciprocal benefit to the phototrophs is
    not established. The record''s Chlorophyta roster conflicts with the primary source; explicit graph assignments
    are withheld pending #1267. Community-level connectivity still inherits that unresolved roster, so this graph
    is not fully certified.'
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  downstream:
  - target: Electrogenic Sulfide Oxidation across Sediment Redox Zones
    description: Greater photosynthetic oxygen supply can provide the surface electron acceptor for cable-bacteria
      sulfide oxidation at depth. Light manipulation and microsensor responses support this coupling; the precise
      spatial redox-site model remains an interpretation.
  evidence:
  - reference: PMID:25416774
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a greater oxygen supply can enable cable bacteria
    explanation: Supports the link between photosynthetic oxygen supply and enhanced cable-bacteria activity.
- name: Electrogenic Sulfide Oxidation across Sediment Redox Zones
  description: The source interprets microsensor and filament observations as cable-bacteria electron conduction
    coupling deep sulfide oxidation with oxygen reduction near the surface. Conduction along a filament is not separately
    classified as interorganism cross-feeding. Exact redox-site allocation, regulation and filament motility remain
    proposed mechanisms.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrogen sulfide
    term:
      id: CHEBI:16136
      label: hydrogen sulfide
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  evidence:
  - reference: PMID:25416774
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: harvesting electrons from free sulfide
    explanation: Supports sulfide oxidation as the electron-donor side of the cable-bacteria metabolism.
  - reference: PMID:25416774
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: transferring these electrons along their longitudinal axes
    explanation: Supports long-distance electron transfer along cable-bacteria filaments.
  downstream:
  - target: Rapid Redox Signal Transmission under Diel Illumination
    description: Cable-bacteria electron conduction provides a mechanism for rapid coupling of altered surface oxygen
      availability to deep sulfide responses during light/dark perturbations. The observed rapid response supports
      coupling without uniquely resolving motility or biochemical regulation.
- name: Rapid Redox Signal Transmission under Diel Illumination
  description: Surface light/dark perturbations caused rapid, repeatable changes in sulfide at depth. Repeated cycles
    are not independent sediment-core replicates. The response supports electrical coupling, not a separate cross-feeding
    interaction; nonsignificant current-density contrasts and an inconsistent reported sulfide-depth significance
    claim are not treated as confirmed increases.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrogen sulfide
    term:
      id: CHEBI:16136
      label: hydrogen sulfide
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
  evidence:
