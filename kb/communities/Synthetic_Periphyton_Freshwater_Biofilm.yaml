ecological_interactions:
- name: EPS-Conditioned Colonization Surface
  description: 'Sphingomonas elodea was used to condition the colonization surface with an EPS-rich attachment layer
    before phototroph assembly. The source attributes a sticky attachment function to that layer. PARTIAL: the reviewed
    main text does not isolate its effect size in an EPS-free comparison or establish persistence of the conditioning
    bacterium. Sphingomonas is not an added canonical member of this record''s aggregate phototroph taxonomy.'
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Groups were added sequentially onto growth chambers covered with the EPS-producing bacteria Sphingomonas
      elodea

      '
    explanation: 'Supports using Sphingomonas-conditioned growth chambers as the surface for sequential periphyton
      assembly.

      '
  - reference: PMID:35869094
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'This bacterium provided a solid and sticky attachment layer for the subsequently introduced phototrophic
      species

      '
    explanation: Source-attributed attachment function; not an isolated effect-size or persistence measurement.
- name: Pioneer Diatom Surface Attachment
  description: The two group-A diatoms showed predominantly surface-attached growth at the selected early time point,
    covering only part of the conditioned surface. This is a diatom-subset attachment outcome; leaving unoccupied
    area is not evidence that these diatoms facilitated later phototrophs. The canonical diatom descriptor represents
    this selected subset.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the large majority of cells (approximately 6 to 7 times more cells than in the supernatant) were attached
      to the substrate surface
    explanation: Supports the measured group-A attachment phenotype, not a facilitated recipient species.
  participating_taxa:
  - preferred_term: diatoms
    term:
      id: NCBITaxon:2836
      label: Bacillariophyta
- name: AB Diatom Biofilm Development
  description: After group B joined group A, the combined diatom biofilm showed predominantly attached cells, greater
    surface coverage and a more heterogeneous architecture at the selected AB observation point. Later incubation
    increased detached cells and reduced PSII yield. These are combined-group time-course observations, not an isolated
    demonstration of facilitation by one diatom group or niche partitioning.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 14 days after group B was added to group A, most of the cells were attached
    explanation: The group-AB Results describe attachment at the selected observation point.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Longer incubation, on the other hand, led to an increase of detached cells
    explanation: The time course does not imply monotonically improving attachment or function.
  participating_taxa:
  - preferred_term: diatoms
    term:
      id: NCBITaxon:2836
      label: Bacillariophyta
- name: Mature Periphyton Establishment
  description: The mature ABC periphyton showed broad surface attachment, high density and relatively high PSII
    yield at the measured endpoint. Although 26 phototrophic species were introduced, the mature community contained
    at least 22 detected species and three introduced species were no longer detected. This is a community establishment
    outcome, not proof that all input members persisted or that assembly order caused ecological facilitation.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  - preferred_term: photosynthesis, light reaction
    term:
      id: GO:0019684
      label: photosynthesis, light reaction
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'we obtained a stable benthic community after a total colonization duration of 30 days

      '
    explanation: 'Supports the thirty-day endpoint as mature synthetic periphyton.

      '
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a diverse and complex mature periphyton composed of at least 22 different phototrophic species
    explanation: Distinguishes detected mature membership from the input pool.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: three species were no longer detected in the mature periphyton
    explanation: Detection loss is not assigned a proven competitive cause or equated with demonstrated extinction.
- name: Reproducible 3D Biofilm Stressor Response
  description: Independent assemblies reproduced community composition and physical structure. Warming and terbuthylazine
    altered taxon abundances and reduced biofilm structure and biomass in the reported comparisons. PSII quantum
    yield was generally similar across treatments, with the reported highest-herbicide exception at the AB stage.
    Preserved PSII is consistent with, but does not demonstrate, functional redundancy. Neither reproducibility
    nor these stress phenotypes establishes NICHE_PARTITIONING.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  - preferred_term: photosynthesis, light reaction
    term:
      id: GO:0019684
      label: photosynthesis, light reaction
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'we were able to obtain a reproducible and diverse synthetic community

      '
    explanation: 'Supports the reproducibility and diversity of the assembled synthetic periphyton.

      '
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'increased temperature and exposure to the herbicide terbuthylazine affected negatively the 3D-structure
      and biomass but not the PSII quantum yield

      '
    explanation: 'Supports the use of the mature community to resolve whole-biofilm structural and photosystem-II
      responses to warming and herbicide perturbations.

      '
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: except for periphyton exposed to 100 nM terbuthylazine at 18 days
    explanation: Retains the explicit exception to generally similar PSII quantum yield.
  - reference: PMID:35869094
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: further specifically designed studies are needed to clearly demonstrate functional redundancy
    explanation: The proposed buffering mechanism is unresolved.
environmental_factors:
- name: successional inoculation on glass slides
  value: Phototrophic species were inoculated sequentially to construct a synthetic periphytic biofilm.
  description: Temperature increase and herbicide stressors were applied singly and in combination.
  evidence:
  - *id001
growth_media:
- name: COMBO freshwater medium
  temperature: '17'
  temperature_unit: °C
  temperature_range: '17-20'
  light_regime: 16 h light:8 h dark
  light_intensity: 40-60
  light_intensity_unit: µmol s-1 (PAR photon irradiance)
  shaking_speed: '30'
  shaking_speed_unit: rpm
  vessel_type: 300-mL Erlenmeyer flasks (stock cultures); glass slides (periphyton biofilm)
  preparation_notes: >-
    26 phototrophic species pre-cultured in COMBO and inoculated in a successional sequence onto
    glass slides to build the biofilm. Warming (17 to 20 °C) and the herbicide terbuthylazine
    (0-100 nM) were applied as stressors.
  evidence:
