ecological_interactions:
- name: EPS-Conditioned Colonization Surface
  description: >
    Sphingomonas elodea was used to coat the glass growth chambers with an
    extracellular-polymeric-substance layer that enabled subsequently inoculated
    phototrophs to attach during staged periphyton assembly.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Growth-Balanced Phototroph Grouping
    description: >
      The EPS-conditioned substrate was the attachment context for the selected
      phototrophs that were sorted into staged inoculation groups.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Groups were added sequentially onto growth chambers covered with the
      EPS-producing bacteria Sphingomonas elodea
    explanation: >
      Supports using Sphingomonas-conditioned growth chambers as the surface for
      sequential periphyton assembly.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      This bacterium provided a solid and sticky attachment layer for the
      subsequently introduced phototrophic species
    explanation: >
      Supports the EPS matrix as a colonization aid for later phototrophic
      members.
- name: Growth-Balanced Phototroph Grouping
  description: >
    Twenty-six freshwater phototrophs were divided into successional groups and
    given cell densities that compensated for each species' suspension growth
    rate and final biomass, limiting dominance by fast high-biomass members.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Four-Day Pioneer-Diatom Colonization
    description: >
      The group design produced an initial low-profile diatom inoculum that was
      given an empirically chosen four-day surface-colonization window.
  evidence:
  - *id001
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The selected species were then assigned to three groups
    explanation: >
      Supports the division of the phototrophic SynCom members into staged
      groups.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      we added the least number of cells for species that grew fast and reached
      high biomasses
    explanation: >
      Supports balancing the starting inoculum against single-species growth
      behavior.
- name: Four-Day Pioneer-Diatom Colonization
  description: >
    Group A low-profile pioneer diatoms colonized the EPS-covered substrate for
    four days, attaching to the glass surface while leaving most of the chamber
    area available for subsequent high-profile and motile phototrophs.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Fourteen-Day High-Profile Diatom Colonization
    description: >
      The four-day group A foundation enabled the next diatom group to be added
      onto an attached pioneer biofilm.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      we selected 4 days as the optimal colonization duration for group A
    explanation: >
      Supports four days as the experimentally selected group A colonization
      duration.
- name: Fourteen-Day High-Profile Diatom Colonization
  description: >
    Group B high-profile diatoms were layered onto the four-day group A biofilm
    for another fourteen days, expanding surface coverage and structural
    maturity before the final group was introduced.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Thirty-Day ABC Periphyton Maturity
    description: >
      Fourteen days of group B development set the eighteen-day handoff point
      for adding group C and completing the mature ABC periphyton.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      14 days is the optimal colonization duration for group B, when added on
      top of group A
    explanation: >
      Supports the experimentally chosen group B colonization interval.
- name: Thirty-Day ABC Periphyton Maturity
  description: >
    After group C was added to the eighteen-day AB biofilm, a final twelve-day
    colonization interval generated a stable thirty-day benthic periphyton with
    broad surface attachment and high photosystem II quantum yield.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  - preferred_term: photosynthesis, light reaction
    term:
      id: GO:0019684
      label: photosynthesis, light reaction
  downstream:
  - target: Reproducible 3D Biofilm Stressor Response
    description: >
      The assembled ABC biofilm was reproducible enough for single-species and
      whole-community responses to be measured under herbicide and warming
      stressors.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Twelve days after group C was added, most of the cells were attached to
      the colonization surface
    explanation: >
      Supports group C as the final colonization stage after the eighteen-day
      AB biofilm.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      we obtained a stable benthic community after a total colonization
      duration of 30 days
    explanation: >
      Supports the thirty-day endpoint as mature synthetic periphyton.
- name: Reproducible 3D Biofilm Stressor Response
  description: >
    The mature synthetic periphyton produced reproducible microbial
    composition, photosystem-II activity, and three-dimensional biofilm
    structure, allowing species-resolved responses to terbuthylazine and
    warming to be measured across the whole consortium.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  - preferred_term: photosynthesis, light reaction
    term:
      id: GO:0019684
      label: photosynthesis, light reaction
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      we were able to obtain a reproducible and diverse synthetic community
    explanation: >
      Supports the reproducibility and diversity of the assembled synthetic
      periphyton.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      increased temperature and exposure to the herbicide terbuthylazine
      affected negatively the 3D-structure and biomass but not the PSII quantum
      yield
    explanation: >
      Supports the use of the mature community to resolve whole-biofilm
      structural and photosystem-II responses to warming and herbicide
      perturbations.
environmental_factors:
- name: successional inoculation on glass slides
  value: Phototrophic species were inoculated sequentially to construct a synthetic periphytic biofilm.
  description: Temperature increase and herbicide stressors were applied singly and in combination.
  evidence:
  - *id001
growth_media:
- name: COMBO freshwater medium
  temperature: '17'
  temperature_unit: °C
  temperature_range: '17-20'
  light_regime: 16 h light:8 h dark
  light_intensity: 40-60
  light_intensity_unit: µmol s-1 (PAR photon irradiance)
  shaking_speed: '30'
  shaking_speed_unit: rpm
  vessel_type: 300-mL Erlenmeyer flasks (stock cultures); glass slides (periphyton biofilm)
  preparation_notes: >-
    26 phototrophic species pre-cultured in COMBO and inoculated in a successional sequence onto
    glass slides to build the biofilm. Warming (17 to 20 °C) and the herbicide terbuthylazine
    (0-100 nM) were applied as stressors.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: to grow in the same freshwater medium COMBO (see Supplementary Table 2 for the detailed
      composition) 77 at 17 °C and photon irradiance of 40 to 60 µmol s−1
    explanation: Names COMBO medium, 17 °C, and 40-60 µmol s-1 photon irradiance for the phototrophic
      community.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'with a photoperiod of 16 h light: 8 h dark'
    explanation: Light:dark photoperiod for the periphyton cultures.
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sterile 300-mL Erlenmeyer flasks containing 150 mL of COMBO and placed on a shaker operated
      at 30 rpm
    explanation: Stock-culture vessel and 30 rpm shaking for the phototrophic pre-cultures.
cultivation_setup:
- cultivation_mode: SEMI_CONTINUOUS
  system_type: OTHER
  instrument_detail: Static microcosms with no flow; actinic light exposure.
  operating_temperature: 17.0
  operating_temperature_unit: °C
  controls_notes: 2 mL of COMBO medium exchanged every two days across 30 days of
    periphyton establishment; full factorial design over four terbuthylazine levels
    (0, 1, 10, 100 nM) and two temperatures.
  notes: The 17 C arm. The paper establishes the same synthetic community at two
    temperatures as a designed factor, so both are recorded rather than one being
    treated as the condition and the other as a treatment. The authors note the
    absence of flow as a limitation of the system, which is why the mode is
    semi-continuous by medium exchange rather than continuous.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Synthetic periphyton communities were established, as described previously,
      in the presence of four levels of terbuthylazine (i.e., 0, 1, 10, and 100 nM)
      and under two temperatures (17 °C and 20 °C)
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: During the 30 days of periphyton establishment, 2 mL COMBO, supplemented
      or not with terbuthylazine, were exchanged every two days
- cultivation_mode: SEMI_CONTINUOUS
  system_type: OTHER
  operating_temperature: 20.0
  operating_temperature_unit: °C
  controls_notes: The 20 C arm of the same factorial design; medium exchange as above.
  evidence:
  - reference: PMID:35869094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: under two temperatures (17 °C and 20 °C)
