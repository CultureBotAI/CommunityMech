ecological_interactions:
- name: Pseudomonas-Associated Leptolyngbya Growth Promotion
  description: The primary abstract reports a coculture biomass maximum of 298.19 mg/L on day 6 versus 198.08 mg/L
    on day 9 for axenic Leptolyngbya lignicola, with greater pigment and biochemical accumulation. These are maxima
    on different days, not a matched-time comparison. Pseudomonas monteilii produced IAA, IBA, vitamin B12 and siderophores,
    but metabolite production does not establish transfer or selective mediation of growth. Full Methods were unavailable,
    so the biomass measurement cannot be assumed to resolve each partner separately.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas monteilii
    term:
      id: NCBITaxon:76759
      label: Pseudomonas monteilii
  target_taxon:
    preferred_term: Leptolyngbya lignicola
    term:
      id: NCBITaxon:1940730
      label: Leptolyngbya lignicola
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Reported Pseudomonas production; abstract-only evidence does not establish transfer to Leptolyngbya or
      selective mediation of the coculture outcome.
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
    notes: Reported Pseudomonas production; abstract-only evidence does not establish transfer to Leptolyngbya or
      selective mediation of the coculture outcome.
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
    notes: Reported Pseudomonas production; abstract-only evidence does not establish transfer to Leptolyngbya or
      selective mediation of the coculture outcome.
  biological_processes:
