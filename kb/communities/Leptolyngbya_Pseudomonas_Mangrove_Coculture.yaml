id: CommunityMech:000452
name: Leptolyngbya-Pseudomonas Mangrove Growth-Promotion Coculture
description: A defined mangrove cyanobacterium-bacterium coculture pairing Leptolyngbya lignicola with the associated bacterium
  Pseudomonas monteilii, both isolated from mangrove waters of Bhitarkanika, Odisha, India. Dash et al. used axenic L. lignicola
  comparisons, morphology, biochemical assays, scanning electron microscopy, pigment and biomass measurements, and metabolite
  profiling to show a close physical association, a faster and higher co-culture biomass peak, and Pseudomonas-linked production
  of indole-3-acetic acid, indole-3-butyric acid, vitamin B12, and siderophores.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Test whether P. monteilii promotes biomass accumulation, photosynthetic pigment production, and metabolite accumulation
    in mangrove-derived L. lignicola under laboratory co-culture.
  assembly_strategy: Pair the mangrove-water cyanobacterium L. lignicola with its associated bacterium P. monteilii and compare
    the two-member co-culture with axenic L. lignicola.
  perturbation_design: Compare P. monteilii-containing co-cultures against axenic L. lignicola cultures across the incubation
    series.
  measurement_endpoints:
  - cyanobacterial biomass
  - cultivation time to stationary phase
  - scanning electron microscopy
  - chlorophyll a
  - carotenoids
  - phycocyanin
  - proteins
  - carbohydrates
  - reducing sugars
  - amino acids
  - P. monteilii growth-promoting metabolites
  evidence:
  - reference: PMID:42573630
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: interaction between the cyanobacterium Leptolyngbya lignicola and the associated bacterium Pseudomonas monteilii
    explanation: Identifies the two organisms tested for a growth-promoting interaction.
  - reference: PMID:42573630
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culture achieved a maximum biomass of 298.19
    explanation: Supports direct biomass measurement in the two-member co-culture.
