    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42573630
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly exceeding that of axenic L. lignicola
    explanation: Supports the reported coculture-versus-axenic biomass maxima, reached on different days; partner-resolved
      biomass methods are unavailable.
  - reference: PMID:42573630
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Metabolite profiling revealed the production of several growth-promoting compounds by P. monteilii
    explanation: Supports metabolite production, not transfer or selective growth mediation.
- name: Pseudomonas Physical Association With Leptolyngbya
  description: Morphological, biochemical and scanning electron microscopic analyses in the primary abstract support
    close physical association between Leptolyngbya lignicola and Pseudomonas monteilii. Association is not a selective
    test that contact is required for growth promotion, nor proof of metabolite transfer or reciprocal benefit.
    No physical-association-to-growth arrow is inferred.
  scope: PAIRWISE
