ecological_interactions:
- name: Model-Predicted Beneficial Gut Interactions
  description: COMPUTATIONAL - pairwise community FBA compares single and paired growth for mouse gut MAG reconstructions.
    Across age groups, inferred beneficial interactions decline. This collection is not uniformly commensal, and
    concurrent metabolite predictions do not establish that interaction loss causes reduced metabolic output. The
    aging comparison uses separate age cohorts, not a longitudinal competition intervention.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
    notes: Community FBA compared single and paired bacterial growth rates to infer beneficial interactions.
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Growth was estimated by FBA for single growth and community FBA for combined growth.
    explanation: Describes the FBA comparison used to infer pairwise bacterial ecological relationships.
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We observed a pronounced reduction in metabolic activity within the aging microbiome accompanied by
      reduced beneficial interactions between bacterial species.
    explanation: Supports the aging-associated decline in beneficial bacterial interactions.
- name: Aging Shift Toward Competitive Gut Interactions
  description: COMPUTATIONAL - normalized pairwise interaction frequencies shift toward the model's competition
    category with age, while amensal, commensal and neutral categories decline. COMPETITION refers to the paired-growth
    classification, not a cause of every aging-associated metabolite change. Reduced amensalism and neutralism are
    not themselves losses of beneficial commensalism.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
    notes: FBA compared single and combined bacterial growth rates to call ecological relationships.
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We observed a significant decrease in amensal, commensal and neutral interactions at the expense of
      increased competitive interactions
    explanation: Supports the predicted aging-associated shift toward competitive bacterial interactions.
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Aging-related microbiome changes led to the accumulation of pro-aging metabolites (D-galactose, succinate)
      and a decline in beneficial metabolites (nucleotides, butyrate).
    explanation: Reports parallel aging-associated model outputs, not proof that competitive interactions mediate
      metabolite changes or host effects.
- name: Microbiota-Dependent Host Nucleotide Support
  description: COMPUTATIONAL - a separate pooled microbiome/host metamodel links colon, liver and brain reconstructions
    and predicts age-associated nucleotide co-metabolism changes. Host-to-microbe and microbe-to-host routes are
    reciprocal, not established commensalism. PARTIAL - a contribution to barrier integrity is hypothesized; predicted
    flux ranges, gene associations and broad germ-free/colonization validation do not establish donor-traced exchange
    or route-specific causal rescue.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nucleotide
    term:
      id: CHEBI:36976
      label: nucleotide
    notes: Nucleotide co-metabolism was highlighted as a microbiome-linked host pathway affected by aging.
  biological_processes:
  - preferred_term: nucleotide metabolic process
    term:
      id: GO:0009117
      label: nucleotide metabolic process
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In this metamodel, the host is represented by three different tissues (colon, liver and brain) connected
      through the bloodstream and interacting with the microbiome through the gut lumen
    explanation: Describes the host and microbiome compartments used to model gut-lumen and bloodstream exchange.
  - reference: PMID:40140706
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: An aging-associated decline in nucleotide co-metabolism could underlie diminished intestinal barrier
      integrity
    explanation: The source says could underlie; the barrier mechanism is a hypothesis, not a route-specific intervention
      result.
