    term:
      id: NCBITaxon:976
      label: Bacteroidota
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:p__Bacteroidota
      gtdb_taxon: Bacteroidota
      gtdb_lineage: d__Bacteria;p__Bacteroidota
      ncbi_source_id: NCBITaxon:976
