id: CommunityMech:000011
name: BioModels MODEL2310020001 Mouse Metaorganism Model
description: >-
  BioModels record MODEL2310020001 contains an integrated metabolic
  metaorganism model of aging mice that connects a merged mouse gut microbiome
  metabolic model to colon, liver, and brain host-tissue models through gut
  lumen and bloodstream exchange compartments.
ecological_state: STABLE
community_origin: NATURAL
community_category: OTHER
environment_term:
  preferred_term: laboratory environment
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >-
    Male C57BL/6J/Ukj mice were bred and housed in a laboratory mouse facility
    for the aging cohort that supplied fecal metagenomes and host tissue
    transcriptomes.
modeled_environment:
- preferred_term: intestine environment
  term:
    id: ENVO:2100002
    label: intestine environment
  notes: >-
    Fecal metagenomes from colon contents were used to reconstruct the gut
    microbiome component of the host-microbiome metamodel.
