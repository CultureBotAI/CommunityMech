      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at p__ rank; 5 GTDB taxa under the NCBI taxon]
    notes: >-
      Phylum-level aggregate for the Bacteroidota MAGs reconstructed from the
      mouse gut metagenomes; Bacteroidota dominated the 60 most abundant MAGs in
      the aging cohort.
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Bacteroidota predominated in the cohort
    explanation: Supports Bacteroidota as a dominant mouse gut MAG group in the aging cohort.
ecological_interactions:
- name: Model-Predicted Beneficial Gut Interactions
  description: >-
    Community FBA over genome-scale models from 181 mouse gut MAGs inferred
    pairwise growth effects among bacterial species. Aging was associated with
    a loss of beneficial bacterial interactions, linking within-microbiome
    ecological decline to lower microbiome metabolic output.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
    notes: Community FBA compared single and paired bacterial growth rates to infer beneficial interactions.
  metabolites:
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
    notes: Butyrate was a beneficial microbial metabolite reduced in aging-associated microbiome change.
  downstream:
  - target: Aging Shift Toward Competitive Gut Interactions
    description: >-
      Loss of beneficial growth interactions accompanied an aging-associated
      increase in competitive pairwise interaction frequencies.
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Growth was estimated by FBA for single growth and community FBA for combined growth.
    explanation: Describes the FBA comparison used to infer pairwise bacterial ecological relationships.
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We observed a pronounced reduction in metabolic activity within the aging microbiome
      accompanied by reduced beneficial interactions between bacterial species.
    explanation: Supports the aging-associated decline in beneficial bacterial interactions.
- name: Aging Shift Toward Competitive Gut Interactions
  description: >-
    Community FBA predicted every pairwise relationship in each mouse gut
    microbiome by comparing single-bacterium growth with two-species growth.
    Aging shifted the inferred interaction frequencies away from amensal,
    commensal, and neutral outcomes and toward competition, consistent with a
    loss of beneficial metabolic interactions among bacterial members.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
    notes: FBA compared single and combined bacterial growth rates to call ecological relationships.
  metabolites:
  - preferred_term: succinate
    term:
      id: CHEBI:30031
      label: succinate(2-)
    notes: Succinate was a model-predicted pro-inflammatory product that increased with aging.
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
    notes: Butyrate was a beneficial microbial metabolite reduced in aging-associated microbiome change.
  downstream:
  - target: Microbiota-Dependent Host Nucleotide Support
    description: >-
      Reduced beneficial bacterial interactions and microbiome metabolic output
      are upstream of model-predicted declines in host pathways that depend on
      microbiome-derived metabolism.
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We observed a significant decrease in amensal, commensal and neutral interactions at the
      expense of increased competitive interactions
    explanation: Supports the predicted aging-associated shift toward competitive bacterial interactions.
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Aging-related microbiome changes led to the accumulation of pro-aging
      metabolites (D-galactose, succinate) and a decline in beneficial
      metabolites (nucleotides, butyrate).
    explanation: Links the modeled ecological shift to aging-associated changes in microbial metabolic output.
- name: Microbiota-Dependent Host Nucleotide Support
  description: >-
    The integrated host-microbiome metamodel linked gut microbial reactions with
    host colon, liver, and brain reactions through lumen and bloodstream
    exchanges. Aging reduced microbial nucleotide synthesis and other microbial
    metabolic activities correlated with host expression, tying community
    metabolic decline to model-predicted loss of microbiota-supported host
    nucleotide pathways.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nucleotide
    term:
      id: CHEBI:36976
      label: nucleotide
    notes: Nucleotide co-metabolism was highlighted as a microbiome-linked host pathway affected by aging.
  biological_processes:
  - preferred_term: nucleotide metabolic process
    term:
      id: GO:0009117
      label: nucleotide metabolic process
  evidence:
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In this metamodel, the host is represented by three different tissues
      (colon, liver and brain) connected through the bloodstream and interacting
      with the microbiome through the gut lumen
    explanation: Describes the host and microbiome compartments used to model gut-lumen and bloodstream exchange.
  - reference: PMID:40140706
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: An aging-associated decline in nucleotide co-metabolism could underlie diminished intestinal
      barrier integrity
    explanation: Supports nucleotide co-metabolism as an aging-affected host-microbiome pathway.
related_ingredients:
