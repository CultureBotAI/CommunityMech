id: CommunityMech:000317
name: Human Gut Four-Member Proteome-Complementarity Consortium
description: >
  A defined four-member consortium of metabolically distinct human gut anaerobes — Eubacterium
  hallii, Roseburia intestinalis, Marvinbryantia formatexigens and Faecalibacterium prausnitzii —
  assembled in all pairwise combinations and as the full community, on distinct carbon sources, and
  profiled by species-resolved proteomics. The finding is regulatory rather than compositional:
  bacteria modulate protein abundance in response to specific partners, and those partner-specific
  shifts reduce functional overlap between members and are frequently associated with increased
  community productivity. Biotic interactions, not the carbon source, dominated proteomic variation.
  The record captures a community whose members divide labour by changing what they express in each
  other's presence, so metabolic complementarity is an outcome of regulation rather than a fixed
  property of the members.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Determine whether and how bacteria adjust protein expression in response to specific
    community partners, and whether such shifts reduce functional redundancy between members.
  assembly_strategy: Assemble four metabolically distinct human gut-associated species in every
    pairwise combination and as the full 4-member community, expose them to distinct carbon sources,
    and profile species-resolved proteomes against the isolate baseline.
  measurement_endpoints:
  - Species-level proteome composition across isolate, pairwise and 4-member contexts
  - Functional overlap between community members
  - Community productivity
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we systematically profiled proteomic responses of individual species across isolate,
      pairwise and 4-member communities
    explanation: States the combinatorial design — isolate, pairwise and full community — that lets
      partner-specific effects be separated from context-independent expression.
