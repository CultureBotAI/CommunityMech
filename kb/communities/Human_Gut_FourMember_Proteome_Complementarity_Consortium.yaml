ecological_interactions:
- name: Partner-Specific Proteome Remodelling Reduces Functional Overlap
  description: >
    Members modulate protein abundance in response to which specific partners are present, producing
    reproducible partner-specific expression shifts that significantly reduce functional overlap
    between community members and are frequently associated with increased community productivity.
    Because the response depends on partner identity rather than on the carbon source, the division
    of labour is regulatory — the members reshape their realised niche by what they express.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
    notes: Terminal product of three of the four members, and part of the functional redundancy that
      partner-specific expression reduces.
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
    notes: Fermentation end product of Marvinbryantia formatexigens.
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    notes: Fermentation end product of Marvinbryantia formatexigens.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These interactions led to reproducible, partner-specific expression shifts that
      significantly reduced functional overlap and were frequently associated with increased
      community productivity
    explanation: States the central result — partner-specific, reproducible shifts that reduce
      functional overlap — which is what makes this niche partitioning rather than a generic
      co-culture effect.
- name: Biotic Interaction Dominance over Carbon Source
  description: >
    Across the combinatorial design, biotic interactions rather than abiotic conditions were the
    dominant drivers of proteomic variation, so partner identity mattered more to what a member
    expressed than which carbon source it was given.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that biotic interactions, rather than abiotic conditions, were the dominant
      drivers of proteomic variation
    explanation: Establishes the comparison that gives the result its force — partner identity
      outweighed the carbon source, which the design varied independently.
environmental_factors:
- name: Distinct carbon sources
  description: >
    Consortia were exposed to distinct carbon sources as the abiotic variable against which biotic
    interaction effects were compared; carbon source proved the weaker driver of proteomic variation.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using synthetic gut-derived consortia exposed to distinct carbon sources
    explanation: Records carbon source as the varied abiotic condition in the design.
