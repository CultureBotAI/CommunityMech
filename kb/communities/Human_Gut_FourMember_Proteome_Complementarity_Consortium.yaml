ecological_interactions:
- name: Partner-Specific Proteome Remodelling Reduces Functional Overlap
  description: >
    Members modulate protein abundance in response to which specific partners are present, producing
    reproducible partner-specific expression shifts that significantly reduce functional overlap
    between community members and are frequently associated with increased community productivity.
    Because the response depends on partner identity rather than on the carbon source, the division
    of labour is regulatory — the members reshape their realised niche by what they express.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
    notes: Terminal product of three of the four members, and part of the functional redundancy that
      partner-specific expression reduces.
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
    notes: Fermentation end product of Marvinbryantia formatexigens.
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    notes: Fermentation end product of Marvinbryantia formatexigens.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These interactions led to reproducible, partner-specific expression shifts that
      significantly reduced functional overlap and were frequently associated with increased
      community productivity
    explanation: States the central result — partner-specific, reproducible shifts that reduce
      functional overlap — which is what makes this niche partitioning rather than a generic
      co-culture effect.
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that biotic interactions, rather than abiotic conditions, were the dominant
      drivers of proteomic variation
    explanation: Recorded on this interaction rather than as a separate edge, because "partner
      identity outweighed carbon source" is a property of the same partner-specific remodelling
      rather than a second interaction between taxa. The design varied carbon source independently,
      which is what gives the comparison force.
growth_media:
- name: YCFA with wheat straw fibre, anaerobic Hungate tubes
  composition:
  - name: Yeast casitone fatty acids (YCFA) medium
    from_source: true
  - name: wheat straw fibre
    concentration: 0.5
    unit: '%'
    from_source: true
  atmosphere: ANAEROBIC
  temperature: 37.0
  temperature_unit: CELSIUS
  incubation_time: 24.0
  incubation_time_unit: HOURS
  vessel_type: Hungate tube
  preparation_notes: >-
    The fibre arm of the two-carbon-source design. Stability came from serial transfer -
    fresh medium every 24 h over five transfers - rather than from a single long
    incubation. Extracted from the cached open-access full text; #183 listed this record
    as lacking growth conditions because they are Methods-level.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacteria were grown anaerobically in Hungate tubes containing yeast casitone fatty
      acids (YCFA) medium
    explanation: Names the atmosphere, vessel and base medium.
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: supplemented with 0.5% wheat straw fibre (collected at the Agricultural Research
      Organization, Volcani Center, Israel) or 0.5% fructose as carbon sources for 24 h at 37 °C
    explanation: Names both carbon sources, the concentration, duration and temperature.
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the cultures were transferred to fresh media every 24 h over a span of 5 transfers
    explanation: The serial-transfer regimen used to stabilise the community.
- name: YCFA with fructose, anaerobic Hungate tubes
  composition:
  - name: Yeast casitone fatty acids (YCFA) medium
    from_source: true
  - name: fructose
    concentration: 0.5
    unit: '%'
    from_source: true
  atmosphere: ANAEROBIC
  temperature: 37.0
  temperature_unit: CELSIUS
  incubation_time: 24.0
  incubation_time_unit: HOURS
  vessel_type: Hungate tube
  preparation_notes: >-
    The soluble-sugar arm, run in parallel with the fibre arm above. Kept as its own entry
    because the carbon source is the experimental variable, not an incidental detail.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: or 0.5% fructose as carbon sources for 24 h at 37 °C
    explanation: The alternative carbon source at the same concentration and conditions.

cultivation_setup:
- cultivation_mode: BATCH
  system_type: SERUM_BOTTLE
  operating_temperature: 37.0
  operating_temperature_unit: °C
  instrument_detail: >-
    Anaerobic Hungate tubes of YCFA medium at 37 °C, 24 h per passage, transferred to fresh
    medium every 24 h for five transfers to establish community stability. Media were filter
    sterilised and degassed overnight in a COY anaerobic chamber under 75% N2 / 20% CO2 /
    5% H2. Carbon was supplied as either 0.5% wheat straw fibre or 0.5% fructose.
  controls_notes: >-
    Atmosphere set by the chamber during media preparation and by the sealed Hungate tube
    thereafter, rather than by a per-vessel gas control.
  notes: >-
    The two carbon sources are the experiment, not alternatives to pick between. Each species
    grows on both independently but not on media lacking them, and the study compares
    proteome complementarity across the two - so recording one would halve the design.

    Five serial 24 h transfers are recorded because they are what makes the community stable
    rather than a fresh mixture: the source gives that as their purpose.

    `system_type` is SERUM_BOTTLE, the nearest value for a butyl-stoppered anaerobic culture
    tube. A Hungate tube is that kind of vessel and the enum has no entry for it - the same
    approximation, labelled the same way, as the Balch tubes in the cellobiose biofilm record.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacteria were grown anaerobically in Hungate tubes containing yeast casitone fatty acids
      (YCFA) medium 49 , supplemented with 0.5% wheat straw fibre (collected at the Agricultural
      Research Organization, Volcani Center, Israel) or 0.5% fructose as carbon sources for 24 h
      at 37 °C
    explanation: Vessel, medium, both carbon sources, duration and temperature.
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To ensure bacterial community stability, the cultures were transferred to fresh media
      every 24 h over a span of 5 transfers
    explanation: The transfer regime, and that community stability is its purpose.
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The cultivation media were filter sterilized and degassed overnight in an anaerobic
      chamber (COY Lab) with a gas composition of 75% nitrogen, 20% carbon dioxide and 5% hydrogen
    explanation: How anaerobiosis was established before inoculation.

environmental_factors:
- name: Distinct carbon sources
  description: >
    Consortia were exposed to distinct carbon sources as the abiotic variable against which biotic
    interaction effects were compared; carbon source proved the weaker driver of proteomic variation.
  evidence:
  - reference: PMID:42032280
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using synthetic gut-derived consortia exposed to distinct carbon sources
    explanation: Records carbon source as the varied abiotic condition in the design.
