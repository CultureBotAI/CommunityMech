  - ecological_interactions#LBB04-C5I3 reduced acidification subset
  rationale: PMID:41859451 directly measured acidification and D-/L-lactate outcomes for monocultures, pairwise
    co-cultures, and tricultures, but the source's formate, folate, urease, NADH oxidase, and antimicrobial-molecule
    explanations are literature-backed hypotheses rather than molecule-level measurements in this exact set 2 community.
  posed_by: codex
  posed_date: '2026-09-24'
