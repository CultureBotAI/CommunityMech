ecological_interactions:
- name: Set 2 milk acidification enhancement
  description: The set 2 LBB04/C001.27/C5I3 triculture produced higher total lactic acid than the tested monocultures
    and pairwise cultures. Maximum acidification rate was high, but the exact set 2 C001.27/C5I3 pair was comparable
    to the triculture, so the triculture was not uniquely superior on this rate readout. Total inoculum was held
    constant across compositions. These positive community fermentation phenotypes do not establish per-strain growth,
    reciprocal benefit or a specific molecular exchange.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all inoculation sets, tri-cultures consistently displayed the highest μmax values (p < 0.05),
      followed by the co-cultures St + Lh and St + Ld.
    explanation: Supports the strongest maximum acidification rate in the tricultures, including the set 2 LBB04/C001.27/C5I3
      community.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all three strain combinations, total lactic acid production was highest in tri-cultures, followed
      by St + Lh and St + Ld co-cultures (p < 0.05)
    explanation: Supports stronger total lactic acid production by tricultures than by their monoculture and pairwise
      comparison conditions.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultivation of St strain C001.27 with Ld strain C5I3 resulted in μmax values comparable to those
      observed under tri-culture conditions.
    explanation: Exact set 2 exception to a uniquely highest triculture rate.
- name: C001.27-C5I3 acidification enhancement
  description: The C001.27/C5I3 pair had a higher maximum acidification rate than either corresponding monoculture,
    and in set 2 its rate was comparable to that of the triculture. This is a positive two-member fermentation phenotype,
    not proof that adding LBB04 preserves a pair-specific causal mechanism or that both members benefit equally.
    The study interprets D-lactate predominance as preferential L. delbrueckii activity; exchanged formate, folate
    and peptides were not directly resolved in this assay.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Streptococcus thermophilus C001.27
    term:
      id: NCBITaxon:1308
      label: Streptococcus thermophilus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis C5I3
    term:
      id: NCBITaxon:29397
      label: Lactobacillus delbrueckii subsp. lactis
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultivation of St strain C001.27 with Ld strain C5I3 resulted in μmax values comparable to those
      observed under tri-culture conditions
    explanation: Supports the strong positive set 2 acidification response when C001.27 and C5I3 were combined.
- name: LBB04-C5I3 reduced acidification subset
  description: The LBB04/C5I3 pair showed lower maximum acidification rates than the corresponding monocultures
    and the C001.27/C5I3 pair. Its total lactic acid was also lower than the triculture and St-containing pairs,
    with D-lactate comprising 75.95% of the pair’s total lactate. Preserve this negative fermentation response without
    converting bulk acidification to a strain-specific growth-inhibition assay or claiming a measured antimicrobial
    or nutrient-competition mechanism.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus LBB04
    term:
      id: NCBITaxon:1587
      label: Lactobacillus helveticus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis C5I3
    term:
      id: NCBITaxon:29397
      label: Lactobacillus delbrueckii subsp. lactis
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultivation with Lh strain LBB04 yielded significantly lower μmax values compared to the corresponding
      St + Ld interaction
    explanation: Supports lower set 2 milk acidification by the LBB04/C5I3 subset than by the C001.27/C5I3 subset.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In inoculation sets 2 and 3, Lh + Ld co-cultures yielded significantly lower total lactic acid than
      tri-cultures and the St + Lh and St + Ld co-cultures
    explanation: Supports lower total lactic acid production for the Lh/Ld subset in set 2.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-inoculation of milk with Lh and Ld resulted in reduced acidification rates compared with the corresponding
      monocultures
    explanation: Retains the directly reported negative fermentation comparison, without assigning a molecular mechanism.
- name: Set 2 Triculture D-Lactate Accumulation
  description: At the end of fermentation, set 2 triculture D-lactate was significantly higher than in the C5I3
    monoculture. This is a measured mixed-culture pool, consistent with L. delbrueckii metabolic activity but not
    exclusive C5I3 production or directly measured C5I3 cell growth. L. helveticus produces both enantiomers, and
    C001.27 monoculture was 83% L-lactate rather than exclusively L-lactate. Acidification and lactate are related
    readouts; an arrow from acidification to inferred member activity would reverse measurement and inference.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In two of the three sets (sets 1 and 2), D-lactate levels in tri-cultures were significantly higher
      than those detected in the corresponding Ld monocultures (p < 0.05)
    explanation: Supports measured triculture D-lactate and the authors activity interpretation; not exclusive C5I3
      production or a member-resolved growth assay.
growth_media:
- name: Partially skimmed UHT milk cross-feeding medium
  vessel_type: 100 mL screw-cap Erlenmeyer flask
  inoculum_source: L. helveticus LBB04, S. thermophilus C001.27, and L. delbrueckii subsp. lactis C5I3 cell suspensions from
    stationary-phase pre-cultures.
  preparation_notes: Stationary-phase cells were collected, resuspended in sterile physiological solution, combined immediately
    before inoculation for co-cultures and tricultures, inoculated into 40 mL of partially skimmed UHT milk at the same total
    final concentration, and fermented at 42°C for 160 h.
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cell suspensions were then inoculated in 40 mL of partially skimmed UHT milk (Parmalat, Reggio Emilia, Italy)
    explanation: Names the milk fermentation medium and volume.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cell suspensions of the respective species were combined in 1:1 or 1:1:1 ratio immediately prior to inoculation
      to reach the same final concentration (2 × 107 CFU/mL)
    explanation: Supports the 1:1:1 set 2 triculture inoculation ratio and total final cell concentration.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inoculated milk samples were incubated at 42°C for 160 h in a temperature-controlled water bath.
    explanation: Supports the incubation temperature, duration, and water-bath setup used for milk cross-feeding.
