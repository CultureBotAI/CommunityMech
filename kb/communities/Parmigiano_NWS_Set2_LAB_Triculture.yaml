  status: OPEN
  attaches_to:
  - ecological_interactions#Set 2 milk acidification enhancement
  - ecological_interactions#C001.27-C5I3 acidification enhancement
  - ecological_interactions#LBB04-C5I3 reduced acidification subset
  - ecological_interactions#Set 2 Triculture D-Lactate Accumulation
  rationale: 'Four measured phenotypes remain. Pair and triculture comparisons do not form a causal sequence, and
    higher D-lactate is an observation used to infer activity, not an outcome caused by measuring acidification.
    No new mediator arrows are justified by the full main text. Preserve previous #1077-1079 removal of unsupported
    mutualism, taxon roles and exclusive C5I3 attribution; the existing molecular-mechanism gap remains open.'
