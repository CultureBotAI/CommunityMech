ecological_interactions:
- name: Set 2 milk acidification enhancement
  description: The complete three-member LAB triculture increased maximum milk acidification rate and total lactic acid production
    relative to the monocultures and most pairwise co-cultures, supporting a positive mixed-culture effect during milk fermentation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: C5I3 activity enhancement in mixed culture
    description: Higher D-lactate in set 2 tricultures than in the corresponding C5I3 monoculture indicated that the Ld member
      remained viable and metabolically active in the mixed culture.
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all inoculation sets, tri-cultures consistently displayed the highest μmax values (p < 0.05), followed
      by the co-cultures St + Lh and St + Ld.
    explanation: Supports the strongest maximum acidification rate in the tricultures, including the set 2 LBB04/C001.27/C5I3
      community.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all three strain combinations, total lactic acid production was highest in tri-cultures, followed by St
      + Lh and St + Ld co-cultures (p < 0.05)
    explanation: Supports stronger total lactic acid production by tricultures than by their monoculture and pairwise comparison
      conditions.
- name: C001.27-C5I3 acidification enhancement
  description: In the set 2 pairwise subset, S. thermophilus C001.27 co-cultured with L. delbrueckii subsp. lactis C5I3 produced
    maximum acidification rates comparable with the complete triculture.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Streptococcus thermophilus C001.27
    term:
      id: NCBITaxon:1308
      label: Streptococcus thermophilus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis C5I3
    term:
      id: NCBITaxon:29397
      label: Lactobacillus delbrueckii subsp. lactis
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Set 2 milk acidification enhancement
    description: The strong St + Ld pairwise response was retained within the complete LBB04/C001.27/C5I3 triculture.
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultivation of St strain C001.27 with Ld strain C5I3 resulted in μmax values comparable to those observed
      under tri-culture conditions
    explanation: Supports the strong positive set 2 acidification response when C001.27 and C5I3 were combined.
- name: LBB04-C5I3 reduced acidification subset
  description: The L. helveticus LBB04 plus L. delbrueckii subsp. lactis C5I3 pairwise subset had weaker acidification than
    the matched C001.27/C5I3 co-culture and lower total lactic acid than tricultures and S. thermophilus-containing co-cultures
    in the set 2 lactate assay.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus LBB04
    term:
      id: NCBITaxon:1587
      label: Lactobacillus helveticus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis C5I3
    term:
      id: NCBITaxon:29397
      label: Lactobacillus delbrueckii subsp. lactis
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultivation with Lh strain LBB04 yielded significantly lower μmax values compared to the corresponding St
      + Ld interaction
    explanation: Supports lower set 2 milk acidification by the LBB04/C5I3 subset than by the C001.27/C5I3 subset.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In inoculation sets 2 and 3, Lh + Ld co-cultures yielded significantly lower total lactic acid than tri-cultures
      and the St + Lh and St + Ld co-cultures
    explanation: Supports lower total lactic acid production for the Lh/Ld subset in set 2.
- name: C5I3 activity enhancement in mixed culture
  description: D-lactate measurements showed that the set 2 triculture accumulated more D-lactate than the C5I3 monoculture,
    consistent with L. delbrueckii subsp. lactis remaining viable and metabolically active in mixed culture.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In two of the three sets (sets 1 and 2), D-lactate levels in tri-cultures were significantly higher than those
      detected in the corresponding Ld monocultures (p < 0.05)
    explanation: Supports significantly higher D-lactate in the set 2 triculture than in the C5I3 monoculture, a mixed-culture
      readout consistent with enhanced L. delbrueckii activity.
growth_media:
- name: Partially skimmed UHT milk cross-feeding medium
  vessel_type: 100 mL screw-cap Erlenmeyer flask
  inoculum_source: L. helveticus LBB04, S. thermophilus C001.27, and L. delbrueckii subsp. lactis C5I3 cell suspensions from
    stationary-phase pre-cultures.
  preparation_notes: Stationary-phase cells were collected, resuspended in sterile physiological solution, combined immediately
    before inoculation for co-cultures and tricultures, inoculated into 40 mL of partially skimmed UHT milk at the same total
    final concentration, and fermented at 42°C for 160 h.
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cell suspensions were then inoculated in 40 mL of partially skimmed UHT milk (Parmalat, Reggio Emilia, Italy)
    explanation: Names the milk fermentation medium and volume.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cell suspensions of the respective species were combined in 1:1 or 1:1:1 ratio immediately prior to inoculation
      to reach the same final concentration (2 × 107 CFU/mL)
    explanation: Supports the 1:1:1 set 2 triculture inoculation ratio and total final cell concentration.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inoculated milk samples were incubated at 42°C for 160 h in a temperature-controlled water bath.
    explanation: Supports the incubation temperature, duration, and water-bath setup used for milk cross-feeding.
