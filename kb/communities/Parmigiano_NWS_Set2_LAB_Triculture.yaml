id: CommunityMech:000431
name: Parmigiano NWS Set 2 LAB Triculture
description: A defined three-strain lactic-acid-bacterial triculture assembled from Parmigiano Reggiano natural whey starter
  isolates. Cristofolini et al. 2026 combined Lactobacillus helveticus LBB04, Streptococcus thermophilus C001.27, and Lactobacillus
  delbrueckii subsp. lactis C5I3 in a 1:1:1 milk triculture to test whether natural-whey-starter partners could enhance the
  impaired cultivability and acidification activity of L. delbrueckii subsp. lactis. Across the milk cross-feeding panel,
  tricultures showed the highest maximum acidification rates and total lactic acid production, with positive S. thermophilus-linked
  effects and weaker L. helveticus/L. delbrueckii pair performance in set 2.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Reconstruct a simplified three-species Parmigiano Reggiano natural-whey-starter consortium to test how S. thermophilus
    and L. helveticus alter milk acidification by otherwise poorly cultivable L. delbrueckii subsp. lactis isolates.
  assembly_strategy: Combine L. helveticus LBB04, S. thermophilus C001.27, and L. delbrueckii subsp. lactis C5I3 at a 1:1:1
    species ratio in partially skimmed UHT milk.
  perturbation_design: Compare monocultures, 1:1 pairwise co-cultures, and 1:1:1 tricultures from three natural-whey-starter
    strain sets while holding the total inoculum size constant.
  measurement_endpoints:
  - maximum milk acidification rate
  - maximum acidification efficiency
  - D- and L-lactate concentrations after fermentation
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: set 2 (Lh LBB04, St C001.27, Ld C5I3)
    explanation: Names the exact three strains assembled in inoculation set 2 for milk cross-feeding assays.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the strains S. thermophilus RBC06 and C001.27, L. helveticus C001.15 and LBB04, and L. delbrueckii subsp.
      lactis T1104 and C5I3 were originally isolated from NWS using M17 and MRS media
    explanation: Supports the natural-whey-starter origin of the set 2 strains used for milk cross-feeding.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Milk fermentations were performed using single monocultures (St, Lh, and Ld), 1:1 co-cultures (St + Lh, St +
      Ld, and Lh + Ld), and 1:1:1 tri-cultures (St + Lh + Ld)
    explanation: Supports the monoculture, pairwise co-culture, and triculture perturbation design.
