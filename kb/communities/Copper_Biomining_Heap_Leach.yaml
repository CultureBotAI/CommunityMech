      id: NCBITaxon:930
      label: Acidithiobacillus thiooxidans
    notes: 'Gram-negative γ-proteobacterium specialized for oxidizing elemental sulfur (S⁰) and reduced
      inorganic sulfur compounds to sulfuric acid. Unlike At. ferrooxidans, At. thiooxidans does not oxidize
      iron and focuses exclusively on sulfur metabolism. Maintains constant copy numbers (10⁵ copies/ml)
      throughout the leaching cycle, providing sustained sulfuric acid production regardless of heap age.
      This mesophilic organism (optimum 28°C) oxidizes the sulfur components released from sulfide minerals,
      preventing accumulation of elemental sulfur that could passivate mineral surfaces. The consistent
      abundance suggests a stable niche for sulfur oxidation across all heap conditions.

      '
