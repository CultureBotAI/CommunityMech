    explanation: Establishes Fe³⁺ as primary oxidant for copper dissolution
- name: Ferrous Iron Oxidation in Aged Heaps
  description: 'In aged heaps (>250 days, pH 1.67-1.83), Leptospirillum ferriphilum and Ferroplasma acidiphilum
    take over iron oxidation as conditions become too extreme for At. ferrooxidans. These organisms oxidize
    Fe²⁺ at pH values approaching 1.67 and tolerate elevated Fe³⁺ concentrations (1.86-1.9 g/L). Leptospirillum
    is particularly effective at colonizing mineral surfaces and maintaining Fe³⁺ supply for chalcopyrite
    dissolution. Both organisms reach ~10⁵ copies/ml in aged heaps. The shift from At. ferrooxidans to
    Leptospirillum/Ferroplasma reflects thermodynamic constraints - as pH drops and Fe³⁺/Fe²⁺ ratio increases,
    specialists adapted to extreme acidity outcompete generalists. This succession ensures sustained iron
    oxidation throughout the multi-year heap lifetime.

    '
