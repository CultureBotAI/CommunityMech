- name: Thermophilic Iron and Sulfur Oxidation
  description: 'Sulfobacillus thermosulfidooxidans contributes to iron and sulfur oxidation in thermophilic
    heap sections (50-60°C) where exothermic sulfide oxidation elevates temperatures. This moderately
    thermophilic organism (optimum 50-55°C) oxidizes both Fe²⁺ and S⁰, performing roles analogous to At.
    ferrooxidans and At. thiooxidans but at elevated temperatures. Sulfobacillus exhibits facultative
    autotrophy, growing mixotrophically on organic compounds plus iron or sulfur. Its spore-forming capability
    provides resilience to fluctuating heap conditions. Metal tolerance (copper, zinc, nickel, cobalt)
    enables activity in polymetallic ores. Despite low abundance (10³-10⁴ copies/ml), microarray data
    shows increased activity in aged heaps, suggesting specialized niches where thermophily and metal
    tolerance provide competitive advantage.

    '
