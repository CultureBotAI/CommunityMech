environment_term:
  preferred_term: mine tailing
  term:
    id: ENVO:00000072
    label: mine tailing
  notes: 'Industrial copper sulfide ore heap leach operation. Crushed low-grade ore is piled in heaps
    and irrigated with acidic solution (pH 1.5-2.5) containing the microbial consortium. The heaps provide
    a heterogeneous environment with spatial gradients in pH (1.67-2.5), Fe²⁺/Fe³⁺ ratios, oxygen availability,
    temperature, and copper concentration. Heap age ranges from fresh ore (<100 days) to aged ore (>250
    days), with microbial succession reflecting changing chemical conditions. The engineered environment
    promotes iron and sulfur oxidation to generate sulfuric acid and ferric iron for mineral dissolution.

    '
