ecological_interactions:
- name: Acidithiobacillus Iron Oxidation and Early-Heap Association
  description: A. ferrooxidans has measured iron-oxidation capacity in separate laboratory assays and was abundant
    during the early part of the 2009 industrial leaching cycle. Field DNA counts, rRNA and solution chemistry support
    occurrence and activity, not taxon-resolved iron flux or demonstrated displacement by competitors. In the 2022
    monoculture assay, 100-300 mg/L SX reagent allowed iron oxidation while copper extraction fell from about 15%
    to the approximately 5% abiotic level; oxidation capacity alone did not ensure copper recovery.
  scope: PAIRWISE
  metabolites:
  - preferred_term: Fe(II)
    term:
      id: CHEBI:29033
      label: iron(2+)
    concentration: Substrate from mineral dissolution
  - preferred_term: Fe(III)
    term:
      id: CHEBI:29034
      label: iron(3+)
    concentration: Ferric iron measured in heap solution is not assigned solely to this taxon
  biological_processes:
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  downstream:
  - target: Copper Sulfide Dissolution
    description: PARTIAL - A. ferrooxidans iron oxidation can replenish ferric oxidant for mineral attack. The chemical
      cycle and laboratory oxidation support this direction, but the SX assay shows that retained iron oxidation
      need not sustain copper recovery, and the field contribution is not taxon-resolved.
  evidence:
  - reference: doi:10.1111/j.1751-7915.2009.00112.x
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At. ferrooxidans phylotypes were the most abundant microorganisms during the first part of the leaching
      cycle (around 200 days of operation)
    explanation: Supports early field abundance, not direct taxon-resolved iron-oxidation flux or competition. Field
      rRNA assays add activity evidence but do not quantify that reaction.
  - reference: doi:10.3389/fmicb.2022.820052
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 100 and 300 mg/L SX reagent could hardly inhibit At. ferrooxidans from oxidizing Fe2+
    explanation: Supports iron oxidation in a separate A. ferrooxidans monoculture. Primary Results also show reduced
      copper extraction under SX reagent despite retained iron oxidation.
