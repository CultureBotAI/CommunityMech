      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
    notes: 'Iron-oxidizing bacterium (Nitrospirae phylum) that becomes dominant in aged copper bioleaching
      heaps as pH drops and Fe³⁺ concentrations increase. Leptospirillum species predominate in sulfide
      mineral-containing environments and are effective primary mineral colonizers. L. ferriphilum oxidizes
      Fe²⁺ efficiently at extremely low pH (1.67-1.83) where At. ferrooxidans cannot compete effectively.
      Abundance increases to ~10⁵ copies/ml in heaps >250 days old with elevated Fe³⁺ (1.86-1.9 g/L).
      Leptospirillum''s tolerance of extreme acidity and high ferric iron makes it critical for sustained
      copper leaching in mature heaps. Often occurs with Ferroplasma in extremely acidic niches.

      '
