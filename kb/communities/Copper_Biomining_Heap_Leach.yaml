discussions:
- discussion_id: copper_heap_resolved_flux_and_context
  prompt: Which taxa and mineral/redox conditions sustain the industrial leaching feedback?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Acidithiobacillus Iron Oxidation and Early-Heap Association
  - ecological_interactions#Aged-Heap Iron-Oxidizer Association
  - ecological_interactions#Sulfur Oxidation to Sulfuric Acid
  - ecological_interactions#Copper Sulfide Dissolution
  - ecological_interactions#Sulfobacillus Iron and Sulfur Oxidation Capacity
  rationale: 'Field DNA/rRNA and solution measurements support an open indigenous community and succession, not
    species-resolved iron/sulfur flux or competitive exclusion. Separate culture perturbations demonstrate oxidation
    and copper release, including lower-ORP benefits and loss of recovery despite iron oxidation under SX reagent.
    Taxon-resolved flux, selective perturbations and mineral/passivation measurements are needed to connect those
    laboratory mechanisms to the heap. Preserve the real chemical feedback without asserting a closed five-member
    syntrophy. Field-genus versus exact Sulfobacillus species, non-graph abundance/engineering metadata and culture-context
    discrepancies remain in #1358.'
  posed_by: codex
  posed_date: '2026-10-05'
