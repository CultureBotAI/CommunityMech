- name: Copper Sulfide Dissolution
  description: Ferric iron attacks copper sulfide minerals and releases copper and reduced substrates that can support
    microbial iron regeneration and sulfur oxidation. The 2009 field heap contained mixed copper sulfides, indigenous
    organisms beyond the five canonical representatives, and a 400-day leaching cycle. Separate 2018 cultures measured
    copper release from chalcopyrite and favored a lower-redox-potential A. caldus/S. thermosulfidooxidans combination;
    the triple culture did not outperform the binaries. The 2022 SX-reagent monocultures further dissociated iron
    oxidation from copper recovery. The feedback is conditional on mineral, redox and inhibition context, not proof
    of a closed five-member syntrophic consortium or monotonically increasing recovery with ferric iron.
  scope: COMMUNITY_LEVEL
