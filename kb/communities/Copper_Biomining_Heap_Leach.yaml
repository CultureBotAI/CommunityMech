  preparation_notes: 'Classic 9K medium (Silverman & Lundgren 1959) used for laboratory cultivation of
    individual consortium members. pH adjusted with H2SO4. For iron oxidizers (At. ferrooxidans, Leptospirillum
    spp.), use FeSO4 as energy source. For sulfur oxidizers (At. thiooxidans), elemental sulfur S0 is
    primary substrate. Temperature varies by organism: mesophiles (At. ferrooxidans, At. thiooxidans)
    at 28-30°C, moderate thermophiles (Sulfobacillus spp.) at 45-55°C. Modifications: For Leptospirillum
    (obligate autotroph), omit yeast extract. For Ferroplasma (mixotroph), add 0.02-0.1% yeast extract.
    For Sulfobacillus (facultative autotroph), add 0.02% yeast extract. For nitrogen fixation studies
    with L. ferrodiazotrophum, omit (NH4)2SO4. Industrial heap operations use in situ bioleaching rather
    than defined media - ore heaps are irrigated with acidic process solution containing indigenous microorganisms.'
