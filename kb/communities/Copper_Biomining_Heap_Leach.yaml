- name: Sulfobacillus Iron and Sulfur Oxidation Capacity
  description: S. thermosulfidooxidans has measured iron/sulfur oxidation and leaching capacity in separate 2018
    cultures at 38 +/- 2 C and 2022 monocultures at 45 C. In 2018, comparatively weak iron oxidation and lower redox
    potential favored copper release, including the A. caldus binary. In 2022, 10 mg/L SX reagent delayed but did
    not prevent recovery of iron oxidation and approximately 30% copper extraction; at 50 mg/L, sulfur oxidation
    and growth persisted while iron oxidation and extraction were impaired. Genus-level Sulfobacillus RNA in older
    field strips does not identify this exact species, measured 50-60 C heap niches, or competitive advantage.
