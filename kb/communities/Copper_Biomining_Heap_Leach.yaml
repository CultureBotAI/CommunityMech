    aged. Late L. ferriphilum DNA reached about 10^5 copies/mL, whereas Ferroplasma was around 10^3 copies/mL; neither
    count is a direct oxidation flux. Lower pH and changing iron redox chemistry were proposed drivers of succession,
    not selectively demonstrated competitive exclusion or reduced competition through niche partitioning. L. ferriphilum
    oxidation is experimentally supported in the separate 2018 cultures; the 2022 Leptospirillum strain is L. ferrooxidans,
    not this canonical species.
