ecological_interactions:
- name: MAMC-M48 Lignocellulose Degradation
  description: MAMC-M48, containing study isolate IDs 13, 18, 25, 29 and 68, was the best-performing five-member
    mixture in the tested 65-mixture screen. At 96 hours, calibrated FTIR estimates were 43.01% lignin, 39.65% cellulose
    and 69.18% hemicellulose change, averaging 50.6%, rather than 50.6% for each fraction. These are fraction-composition
    estimates, not direct gravimetric mass loss, carbon mineralization or partner-resolved catalytic flux. HYPOTHESIZED
    - complementary substrate use could contribute, but niche partitioning and directed exchanges were not established.
    Canonical participants retain source-reported 16S identification labels; their strain-like suffixes are not
    independently verified culture-strain identities. Enrichment and reductive screening describe selection procedures,
    not ecological interactions.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
    notes: Lignocellulosic substrate context; calibrated FTIR fraction estimates do not identify the individual
      partner or enzyme responsible.
  - preferred_term: xylan
    term:
      id: CHEBI:37166
      label: xylan
    notes: Lignocellulosic substrate context; calibrated FTIR fraction estimates do not identify the individual
      partner or enzyme responsible.
  - preferred_term: lignin
