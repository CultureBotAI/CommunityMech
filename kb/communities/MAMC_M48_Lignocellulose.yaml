  inoculum_unit: cells/mL total
  preparation_notes: 'Mineral salts medium (MSM) supplemented with 1% sugarcane straw as lignocellulose
    substrate. All five strains are aerobic degraders isolated from soil through enrichment on sugarcane
    waste. Each strain inoculated at 1x10^5 cells/mL for total inoculum of 5x10^5 cells/mL. The consortium
    was optimized through reductive screening from 18 candidate strains using molecular phenotyping and
    metabolic characterization. MAMC-M48 (synthetic community 48) showed highest degradation efficiency
    (50.6% of all lignocellulose fractions), reaching 96.5% of the degradation rate observed with full
    18-species pool.

    '
