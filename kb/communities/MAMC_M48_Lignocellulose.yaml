      id: CHEBI:6457
      label: lignin
    notes: Lignocellulosic substrate context; calibrated FTIR fraction estimates do not identify the individual
      partner or enzyme responsible.
  evidence:
  - reference: PMID:29392382
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A consortium containing Stenotrophomonas maltophilia, Paenibacillus sp., Microbacterium sp., Chryseobacterium
      taiwanense, and Brevundimonas sp. was found to be the most effective degrading synthetic community.
    explanation: Supports the selected five-member mixture and its performance; primary Table3 provides FTIR-based
      fraction estimates, not a partner mechanism or direct dry-mass loss.
  - reference: PMID:29392382
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further work would be needed to understand the interactive relationship and metabolic pathways of these
      consortium partners.
    explanation: Explicitly leaves partner interaction routes and metabolic pathways unresolved; no niche-partitioning
      type or directed transfer is inferred.
