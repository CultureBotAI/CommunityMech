id: CommunityMech:000186
name: Thermotoga-Methanocaldococcus Hyperthermophilic Syntrophy
description: >
  A defined hyperthermophilic bacterial-archaeal coculture in which Thermotoga
  maritima MSB8 ferments organic substrates and transfers hydrogen to the
  hydrogenotrophic methanogen historically reported as Methanococcus jannaschii,
  now represented by NCBI as Methanocaldococcus jannaschii DSM 2661. The
  coculture is relevant to DOE bioenergy and subsurface biogeochemistry because
  it links high-temperature fermentation, interspecies hydrogen transfer, cell
  aggregation, and methane formation in an experimentally tractable system.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Study interspecies hydrogen transfer between a hyperthermophilic fermentative
    bacterium and a hydrogenotrophic methanogen under anaerobic high-temperature
    conditions.
  assembly_strategy: Pair T. maritima MSB8 with M. jannaschii DSM 2661/JAL-1 in
    defined laboratory coculture.
  perturbation_design: Compare pure T. maritima growth with methanogenic coculture,
    including physical separation tests and growth-phase transcriptome profiling.
  measurement_endpoints:
  - T. maritima cell density
  - Methanogen growth without externally supplied H2 and CO2
  - Methane production
  - Exopolysaccharide-based cell aggregation
  - T. maritima differential gene expression
  evidence:
  - reference: PMID:18636642
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Interactions involving hydrogen transfer were studied
    explanation: Supports the experimental objective of studying interspecies hydrogen transfer.
  - reference: PMID:18636642
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a coculture of two hyperthermophilic microorganisms
    explanation: Supports the defined two-member hyperthermophilic coculture design.
  - reference: PMID:16391122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: when it was cocultured with the hyperthermophilic archaeon Methanococcus jannaschii
    explanation: Supports the transcriptome comparison between T. maritima monoculture and the exact coculture.
