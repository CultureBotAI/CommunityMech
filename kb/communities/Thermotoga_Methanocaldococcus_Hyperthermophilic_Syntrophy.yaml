  evidence:
  - reference: PMID:16391122
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Interspecies H2 transfer resulted in three- to fivefold-higher T. maritima
      cell densities
    explanation: Names interspecies H2 (dihydrogen) transfer as the intermediate driving
      the coculture growth response.
  - reference: PMID:18636642
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Interactions involving hydrogen transfer were studied in a coculture of
      two hyperthermophilic microorganisms
    explanation: Anchors hydrogen as the transferred substrate central to the studied
      coculture interaction.
- preferred_term: carbon dioxide
  chebi_term:
    id: CHEBI:16526
    label: carbon dioxide
  relevance: Co-substrate for hydrogenotrophic methanogenesis; the methanogen grew
    without externally supplied CO2, indicating CO2 from T. maritima fermentation
    supports methanogenic growth in the coculture.
  evidence:
  - reference: PMID:18636642
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the methanogen was able to grow in the absence of externally supplied H(2)
      and CO(2)
    explanation: Names CO(2) (carbon dioxide) as a methanogenic substrate supplied
      internally by the partner rather than externally.
- preferred_term: methane
  chebi_term:
    id: CHEBI:16183
    label: methane
  relevance: Terminal product of the coculture; hydrogenotrophic methanogenesis
    converts transferred H2 and CO2 to methane, the metabolic endpoint linking the
    syntrophy to biogeochemical methane formation.
  evidence:
  - reference: PMID:18636642
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increases in methanogenesis rates with temperature
    explanation: Methanogenesis is the methane-forming process whose rate rises with
      temperature, anchoring methane as the central product of the coculture.
