    snippet: soluble sugars and butyric acid generated can be subsequently utilized by Clostridium beijerinckii
      NCIMB 8052
    explanation: The abstract states the proposed supply relationship; primary Results additionally compare sugar
      profiles, AECC degradation and solvent outputs across monocultures and coculture. It is not a traced partner-specific
      flux measurement.
  - reference: PMID:25023325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: produce solvents by consolidated bioprocessing (CBP) with alkali extracted deshelled corn cobs (AECC)
    explanation: Supports the overall coculture output, not an arrow from substrate provision to a uniquely identified
      competition mechanism.
- name: Butyric Acid Support of Butanol Production
  description: PARTIAL - C. cellulovorans produces butyric acid in monoculture, and the coculture produces butanol
    without external butyric-acid addition. Acid accumulation followed by reassimilation during solventogenesis
    supports an in-situ cosubstrate contribution to C. beijerinckii. The primary study also changes pH control and
    inoculation conditions. It does not trace the partner origin of every acid molecule or isolate butyrate necessity
    from these covariates, and does not establish that butyrate causes upstream AECC saccharification.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium cellulovorans 743B
    term:
      id: NCBITaxon:573061
      label: Clostridium cellulovorans 743B
  target_taxon:
    preferred_term: Clostridium beijerinckii NCIMB 8052
    term:
      id: NCBITaxon:1520
      label: Clostridium beijerinckii
  metabolites:
