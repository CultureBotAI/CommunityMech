id: CommunityMech:000323
name: Clostridium cellulovorans-Beijerinckii AECC ABE Coculture
description: >
  A defined anaerobic artificial symbiosis pairing the cellulolytic,
  butyrate-producing mesophile Clostridium cellulovorans 743B with the
  non-cellulolytic solventogenic bacterium Clostridium beijerinckii NCIMB
  8052. The coculture was designed for consolidated bioprocessing of alkali
  extracted deshelled corn cobs, where C. cellulovorans saccharifies
  lignocellulose and produces butyric acid, and C. beijerinckii converts the
  released soluble sugars and butyric acid into acetone-butanol-ethanol
  solvents. The system is DOE-relevant as a lignocellulosic biomass-to-biofuel
  community model using an agricultural residue feedstock.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: >
    Produce acetone-butanol-ethanol solvents from alkali extracted deshelled
    corn cobs through one-pot consolidated bioprocessing by combining a
    lignocellulose-saccharifying partner with a solventogenic partner.
  assembly_strategy: >
    Co-culture C. cellulovorans 743B with C. beijerinckii NCIMB 8052 under
    anaerobic conditions using AECC as the sole carbon source.
  perturbation_design: >
    Optimize the artificial symbiosis for AECC degradation, solvent production,
    and strain-abundance dynamics measured by 16S rRNA gene qPCR.
  measurement_endpoints:
  - AECC degradation
  - total solvent production
  - acetone concentration
  - butanol concentration
  - ethanol concentration
  - strain abundance by 16S rRNA gene qPCR
  evidence:
  - reference: PMID:25023325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Artificial symbiosis for acetone-butanol-ethanol (ABE) fermentation
    explanation: Supports the engineered artificial-symbiosis objective for ABE production.
  - reference: PMID:25023325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culture of Clostridium beijerinckii and Clostridium cellulovorans
    explanation: Supports the two-member coculture design.
