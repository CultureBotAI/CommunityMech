discussions:
- discussion_id: aecc_abe_flux_and_competition_mediation
  prompt: How much of solventogenesis and partner dynamics is mediated by acid transfer, pH and resource competition?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Lignocellulose Saccharification Feeding Solventogenesis
  - ecological_interactions#Butyric Acid Support of Butanol Production
  - ecological_interactions#Population Dynamics and Proposed Competition
  rationale: PMID:25023325 supports sugar supply, in-situ acid formation and measured solvent production, and experimentally
    compares inoculation timing, ratio and pH-control duration. The full primary Results/Discussion leave molecular
    competition/cooperation unresolved. RNA/cDNA-based 16S proportions are not direct cell counts. Partner-resolved
    flux, selective acid perturbations with matched pH, and independent population quantification would distinguish
    these contributions. Butyrate provision does not itself establish a causal arrow to upstream saccharification.
  posed_by: codex
  posed_date: '2026-10-05'
