ecological_interactions:
- name: Lignocellulose Saccharification Feeding Solventogenesis
  description: C. cellulovorans 743B saccharifies AECC and supplies soluble sugars for C. beijerinckii NCIMB 8052
    solventogenesis. The primary study compares monocultures and coculture, measures sugar accumulation and depletion,
    and reports ABE output. Cellulose is the polymer substrate and ABE compounds are products, not molecules all
    transferred between partners. Inoculation timing, ratio and pH-control duration also affect performance; product
    supply alone does not establish the cause of the population dynamics.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium cellulovorans 743B
    term:
      id: NCBITaxon:573061
      label: Clostridium cellulovorans 743B
  target_taxon:
