      label: butyric acid
  - preferred_term: butanol
    term:
      id: CHEBI:28885
      label: butan-1-ol
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:25023325
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: produce butyric acid, instead of adding cellulase and butyric acid to the medium
    explanation: The abstract states the design objective. Primary Results support acid formation and butanol production
      without added butyrate, but do not isolate an essential butyrate-only mediator.
  - reference: PMID:25023325
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: soluble sugars and butyric acid generated can be subsequently utilized
    explanation: Supports the cosubstrate interpretation, not quantitative donor-resolved acid flux. Primary Results
      discuss acid reassimilation together with pH and sugar availability.
- name: Population Dynamics and Proposed Competition
  description: PARTIAL - the reported 16S-based abundance assay showed changing partner proportions during coculture,
    with early C. cellulovorans dominance and later C. beijerinckii dominance. The authors interpret stage-dependent
    cooperation and competition in relation to pH and nutrient availability, but explicitly leave the molecular
    mechanism unresolved. Methods describe RNA extraction and cDNA for this assay, so the reported proportions are
    not direct cell counts. The experiments vary inoculation and pH conditions; abundance changes alone do not isolate
    reciprocal resource competition or its molecular mediator.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:25023325
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: mechanisms of cooperation and competition between the two strains during the co-culture process
    explanation: The abstract summarizes the authors' interpretation; the primary Results/Discussion explicitly
      state that the molecular mechanism remains unclear. Do not promote the summary wording to an isolated competition
      experiment.
  - reference: PMID:25023325
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: real-time PCR assay based on the 16S rRNA gene sequence was performed
    explanation: Supports the reported abundance assay. Primary Methods use RNA/cDNA, not direct cell counting;
      this is an experimental population proxy, not computational-only evidence.
