growth_media:
- name: M9 minimal medium (18 mM NH4Cl) with colloidal chitin
  temperature: '20'
  temperature_unit: °C
  incubation_time: '120'
  incubation_time_unit: h
  shaking_speed: '180'
  shaking_speed_unit: rpm
  vessel_type: 100-mL flask
  preparation_notes: Each strain precultured on R2A agar for 3 days, washed and resuspended
    in M9 (18 mM NH4Cl); community grown on colloidal shrimp-shell chitin as the sole
    carbon source (100 ppm for growth screens, 500 ppm for the community multiomics
    flasks); five biological-replicate flasks (30 mL M9) incubated at 20°C for 5 days.
  evidence:
  - reference: PMID:36154140
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Plates were shaken at 180 rpm during growth, and cultivation was carried
      out at 20°C.
    explanation: Gives the 180 rpm shaking and 20°C cultivation temperature for MSC-2
      chitin growth.
  - reference: PMID:36154140
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Five biological replicate flasks, labeled A to E, were started and incubated
      at 20°C for 5 days.
    explanation: Gives the flask cultivation vessel, 20°C temperature, and 5-day incubation
      for the MSC-2 community assay.
discussions:
- discussion_id: msc2_product_sharing_and_emergent_role
  prompt: Do transferred chitin products enable the Streptomyces community phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Primary Chitin Polymer Degradation
  - ecological_interactions#Chitin Breakdown Product Sharing
  - ecological_interactions#Community-Responsive Streptomyces Chitin Phenotype
  rationale: 'Retain both existing biological arrows as HYPOTHESIZED; do not restore previously removed dangling
    outcome arrows. Five monoculture-positive isolates need not be the exclusive initial community degraders. Main
    Fig5 describes a hypothesized decomposition route, temporal community transcripts are not matched induction
    assays, and pellet GC-MS is not extracellular transfer despite Introduction wording. The mixed-bag model removes
    species boundaries. Pairwise and leave-one-out experiments are future work, and NAG preconditioning may repress
    Streptomyces chitinase. Primary body and main Tables1/2 read, not original figure pixels, separate supplements,
    raw data or executable models. Canonical labels/genomes preserved without independent identity recertification;
    non-graph protocol and source inconsistencies remain under #1569.'
  posed_by: codex
  posed_date: '2026-10-06'
