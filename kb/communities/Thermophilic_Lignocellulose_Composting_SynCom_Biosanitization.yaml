ecological_interactions:
- name: Community-level bio-sanitization of high-risk pathogens
  description: By intensifying thermophilic fermentation and driving down the carbon/nitrogen ratio,
    the SynCom collapses high-risk ARG-mobilome interactomes and eliminates high-risk pathogens
    including Pseudomonas aeruginosa, an emergent community-level function rather than a single
    pairwise edge.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Pseudomonas aeruginosa
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  evidence:
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: deep bio-sanitization was achieved by synchronously eliminating high-risk pathogens (e.g.,
      Pseudomonas aeruginosa), phytopathogens, and specific virulence factors
    explanation: The consortium collectively suppresses and eliminates high-risk pathogens including
      P. aeruginosa.
- name: SynCom-driven suppression of horizontal gene transfer
  description: SynCom inoculation reprograms community metabolism from a biofilm-dependent
    defense-survival model to an active motility-metabolism mode (depleted lipopolysaccharide
    biosynthesis, enriched flagellar assembly), a fitness-cost trade-off that physically restricts
    horizontal gene transfer and suppresses key recombinases (XerD, IntI1).
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a pivotal metabolic reprogramming from a biofilm-dependent defense-survival model to an
      active motility-metabolism mode, characterized by depleted lipopolysaccharide biosynthesis and
      enriched flagellar assembly
    explanation: Community-level metabolic reprogramming that restricts horizontal gene transfer.
growth_media:
