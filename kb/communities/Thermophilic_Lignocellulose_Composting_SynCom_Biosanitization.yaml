ecological_interactions:
- name: SynCom-associated compost maturation
  description: The five-member inoculum is reported to intensify thermophilic fermentation, lower the compost carbon/nitrogen
    ratio and increase humification. These are community-treatment and substrate outcomes, not evidence that all
    five inoculated members obtain reciprocal fitness benefits. The accessible abstract relates maturation to resistance-gene
    attenuation using Mantel correlation; it does not resolve individual-strain contributions or a uniquely demonstrated
    causal mediator.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  downstream:
  - target: Reported compost resistome and pathogen attenuation
    description: 'PARTIAL: intensified fermentation and the correlated C/N decrease and humification are proposed
      environmental contributors to later ARG and pathogen attenuation. Mantel association and the common inoculation
      treatment support this interpretation, not selective demonstration that maturation alone mediates elimination
      or prevents every gene-transfer event.'
  evidence:
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: OTHER
    snippet: SynCom-driven rapid decrease in carbon/nitrogen ratio and enhanced humification
    explanation: Abstract-reported compost maturation; the experimental venue and detailed assay design were not
      reconstructed from full text.
  - reference: PMID:41839407
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Mantel correlation analysis revealed
    explanation: Identifies the association analysis underlying the environmental-driver interpretation.
- name: Reported compost resistome and pathogen attenuation
  description: The abstract reports a transient ARG rebound after SynCom inoculation followed by attenuation, reduced
    multidrug-resistance genes and virulence factors, and elimination of source-identified high-risk pathogens.
    Preserve this reported bio-sanitization result without equating metagenomic or network signals with demonstrated
    loss of every viable pathogen, universal fertilizer biosafety, or bilateral negative fitness effects. The accessible
    abstract does not resolve the viability-detection limits or provide a direct causal competition assay.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: OTHER
    snippet: deep bio-sanitization was achieved by synchronously eliminating high-risk pathogens (e.g., Pseudomonas
      aeruginosa), phytopathogens, and specific virulence factors
    explanation: Preserves the authors' reported bio-sanitization outcome; the abstract alone does not establish
      viability-detection limits or universal eradication.
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Metagenomic analysis showed SynCom inoculation caused a transient ARG rebound followed by profound
      attenuation
    explanation: Retains the non-monotonic resistance-gene trajectory instead of claiming immediate uniform removal.
- name: Metagenomic signatures of reduced HGT potential
  description: 'KEGG and metagenomic analyses suggest a shift in functional potential from biofilm-associated defense
    toward motility/metabolism, with lower lipopolysaccharide biosynthesis and higher flagellar-assembly representation.
    The reported network change includes 26.6% fewer potential host-gene associations. PARTIAL: reduced HGT opportunity,
    recombinase suppression and physical restriction of transfer are source interpretations, not measurements of
    conjugation frequency, gene expression, actual cell motility or proven necessity of a particular route. Potential
    host-gene associations are not a count of observed horizontal-transfer events.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: horizontal gene transfer
    term:
      id: GO:0009292
      label: horizontal gene transfer
    notes: Inferred change in HGT potential; not a directly measured transfer rate.
  evidence:
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: a pivotal metabolic reprogramming from a biofilm-dependent defense-survival model to an active motility-metabolism
      mode, characterized by depleted lipopolysaccharide biosynthesis and enriched flagellar assembly
    explanation: KEGG-based functional interpretation; not directly measured motility, biofilm loss or transfer
      frequency.
  - reference: PMID:41839407
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: reducing potential host-gene associations by 26.6%
    explanation: Network statistic, not observed gene-transfer frequency.
  - reference: PMID:41839407
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: This metabolic shift implies a fitness cost trade-off that physically restricts horizontal gene transfer
      (HGT) opportunities
    explanation: The source labels this a mechanistic implication; it is retained as partial support only.
