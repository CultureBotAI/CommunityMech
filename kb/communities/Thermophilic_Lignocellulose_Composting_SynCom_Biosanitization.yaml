id: CommunityMech:000282
name: Thermophilic Lignocellulose-degrading Composting SynCom
description: A five-member thermophilic lignocellulose-degrading synthetic microbial community (SynCom)
  designed for manure composting, comprising the bacteria Bacillus cereus, Achromobacter sp., and
  Pseudomonas sp. together with the fungi Cladosporium sp. and Trichoderma harzianum. Inoculation
  drives a metabolic reprogramming from a biofilm-dependent defense-survival mode toward an active
  motility-metabolism mode (depleted lipopolysaccharide biosynthesis, enriched flagellar assembly),
  which restricts horizontal gene transfer opportunities. By intensifying thermophilic fermentation,
  lowering the carbon/nitrogen ratio, and enhancing humification, the SynCom attenuates antibiotic
  resistance genes and virulence factors, collapses high-risk ARG-mobilome interactomes, and achieves
  deep bio-sanitization by eliminating high-risk pathogens such as Pseudomonas aeruginosa.
