    snippet: Consortia (No. 1) 1 2.144 d 2.115 d 2.166 d 2.198 d 2.112 d
    explanation: Table 6 reports T1 OD600 values across the five diamide insecticides in Mineral Salt Medium.
- name: Optimized cyantraniliprole growth conditions
  value: 30-35 °C, pH 7.0-8.0, 0.0-0.5% NaCl (tested across 0-5.0% NaCl), 11 days, 150 rpm
  description: One-variable-at-a-time growth optimization in MS broth with 50 mg/L cyantraniliprole showed peak biomass at
    30-35 °C, pH 7.0-8.0, and 0.0-0.5% NaCl (with growth tolerated up to 5.0% NaCl, summarized as 0.5-5.0% NaCl in the abstract)
    over 11 days at 150 rpm.
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: optimal degradation observed at 30–35 °C, pH 7.0–8.0, 0.5–5.0% NaCl, and 11 days of incubation at 150 rpm using
      an initial cyantraniliprole concentration of 50 mg/L
    explanation: Supports the abstract summary of the temperature, pH, salinity range, incubation time, shaking speed, and
      initial cyantraniliprole concentration.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Optimal growth, corresponding to the highest biomass yield for all consortia, was observed at NaCl concentrations
