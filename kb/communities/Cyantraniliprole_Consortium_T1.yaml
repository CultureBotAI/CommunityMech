ecological_interactions:
- name: T1 distributed cyantraniliprole enzyme potential
  description: 'Post-assay bioinformatic analysis (Table 8 / Figure 5) assigns the six T1 Bacillus strains a combined repertoire
    of 19 predicted enzyme hits spanning all five proposed enzyme classes: triosephosphate isomerase (TPI) and aminopeptidase
    (AP) in Re1-Re6; catechol 1,2-dioxygenase (C1,2O) in Re1, Re2, Re3, and Re6; catechol O-methyltransferase (COMT) in B.
    subtilis subsp. subtilis Re1 and B. pumilus Re3; and 2-oxopent-4-enoate hydratase (OEX) solely in B. cereus Re2. These
    represent predicted pathway and enzyme-class coverage rather than measured enzyme expression, catalytic activity, or member-resolved
    metabolic flux, and do not establish reciprocal fitness benefits.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Conversely, T1, despite having the lowest total (19 enzymes), still possessed all five essential enzymes, though
      its lower overall count may have limited its efficiency.
    explanation: Supports the post-assay bioinformatic enzyme-repertoire prediction for T1 (19 total enzyme hits in Table
      8 / Figure 5), without claiming measured enzymatic activity or confirmed pathway intermediates.
    computational_provenance:
      prediction_type: OTHER
      tools:
