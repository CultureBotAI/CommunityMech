ecological_interactions:
- name: Mineral-Type-Dependent Community Composition
  description: Switching between chalcopyrite and chalcocite reshapes member
    abundances in the bioleaching consortium, reflecting differences in mineral
    structure and Fe availability.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: trends in abundance patterns were observed with mineralogy and
      surface-attached versus planktonic conditions
    explanation: Supports mineralogy and lifestyle as drivers of abundance
      patterns.
- name: Plasmid-Borne Metal Resistance and Sulphur Metabolism
  description: Plasmid-encoded metal resistance pathways, sulphur metabolic
    capacities, and CRISPR-Cas loci are widespread in the bioleaching consortium
    and may modulate microbial activity during sulphide ore dissolution.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: encoded metal resistance pathways, sulphur metabolic capacities and
      CRISPR-Cas loci
    explanation: Supports the plasmid-encoded functional repertoire.
- name: Intra-Plasmid CRISPR Competition
  description: CRISPR spacers on an Acidithiobacillus plasmid target plasmid-
    borne conjugal transfer genes from the same genus, indicating intra-plasmid
    competition among co-resident mobile elements.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CRISPR spacers on an Acidithiobacillus plasmid targeted plasmid-borne
      conjugal transfer genes found in the same genus, likely belonging to
      another plasmid, evidence of intra-plasmid competition
    explanation: Supports the CRISPR-spacer-based plasmid competition.
