ecological_interactions:
- name: Mineral- and Fraction-Associated Community Profiles
  description: Serially passaged SC3 enrichments on chalcopyrite and chalcocite showed different metagenomic community
    profiles, including differences between attached and planktonic fractions at eight weeks. The four named taxonomic
    groups are an aggregate view of the recovered organisms. These positive mineral-treatment and microhabitat observations
    support ecological selection, but the combined mineral-structure, dissolution and Fe-availability changes do
    not isolate Fe as the sole cause. Relative DNA profiles from pooled replicate samples and gene annotations do
    not directly measure each member's metabolic niche or flux.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: chalcopyrite
    term:
      id: CHEBI:86202
      label: chalcopyrite
    notes: Fe-bearing CuFeS2 mineral used to establish and propagate the consortium before substrate switching.
  - preferred_term: chalcocite
    term:
      id: CHEBI:51114
      label: copper(I) sulfide
    notes: Fe-free Cu2S mineral used to test how mineral structure and mineral-derived Fe availability shift community
      composition.
  - preferred_term: iron(2+)
    term:
      id: CHEBI:29033
      label: iron(2+)
    notes: Ferrous iron whose mineral-derived availability differs between chalcopyrite and chalcocite enrichments.
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: trends in abundance patterns were observed with mineralogy and surface-attached versus planktonic conditions
    explanation: Supports observed composition patterns under the mineral and fraction comparisons, not a selectively
      demonstrated Fe-only mechanism or experimentally resolved metabolic niche partitioning.
  participating_taxa:
  - preferred_term: Acidithiobacillus species
    term:
      id: NCBITaxon:119977
      label: Acidithiobacillus
  - preferred_term: Leptospirillum ferrodiazotrophum
