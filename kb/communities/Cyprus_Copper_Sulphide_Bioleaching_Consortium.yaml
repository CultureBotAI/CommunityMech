discussions:
- discussion_id: cyprus_mineral_functions_and_plasmid_interference
  prompt: Which mineral-associated functions and plasmid activities causally alter SC3 bioleaching?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Mineral- and Fraction-Associated Community Profiles
  - ecological_interactions#Plasmid-Encoded Functional Potential
  - ecological_interactions#Putative Acidithiobacillus Plasmid CRISPR Interference
  rationale: 'The main body and tables distinguish measured composition/solution chemistry from predicted organism/plasmid
    functions. The two removed arrows were a recovery-context link and a general-repertoire-to-example link, not
    causal dependencies. Plasmid perturbations, expression/flux assays, host resolution and conjugation/interference
    experiments would test the proposed functions. Relative abundance and spacer matches alone cannot assign benefits
    or competition. The literature-derived sulphur pathway diagram is not a measured organism-resolved exchange
    map. No figure images or supplementary files were inspected. Non-graph mineral oxidation-state and Fe-specific
    attribution wording remains in #1372.'
