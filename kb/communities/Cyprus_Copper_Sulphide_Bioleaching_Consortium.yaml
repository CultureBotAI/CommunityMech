      label: Thermoplasmatales
- name: Plasmid-Encoded Functional Potential
  description: The metagenomic analysis recovered twelve distinct putative plasmids, some encoding predicted metal-resistance,
    sulphur-metabolism or CRISPR-associated functions. Named participants represent the explicitly Acidithiobacillus-
    and Leptospirillum-associated subset, not every host or every listed function. Copper-resistance candidates
    on an Alphaproteobacteria-related plasmid are not assigned specifically to the canonical Rhodospirillales member
    or to archaea. Gene content and phylogenetic association do not demonstrate expression, host benefit, horizontal
    transfer or a plasmid-caused increase in bioleaching.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: sulfur compound metabolic process
    term:
      id: GO:0006790
      label: sulfur compound metabolic process
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: encoded metal resistance pathways, sulphur metabolic capacities and CRISPR-Cas loci
    explanation: Supports sequence-annotated functional potential in some plasmids, not expressed activity or commensal
      fitness. Host associations and functions are distinct annotations; the unresolved Alphaproteobacteria-linked
      plasmid is not grounded to a specific Rhodospirillales taxon.
  participating_taxa:
  - preferred_term: Acidithiobacillus species
    term:
      id: NCBITaxon:119977
      label: Acidithiobacillus
  - preferred_term: Leptospirillum ferrodiazotrophum
    term:
      id: NCBITaxon:412449
      label: Leptospirillum ferrodiazotrophum
- name: Putative Acidithiobacillus Plasmid CRISPR Interference
  description: HYPOTHESIZED - CRISPR spacers on Acidithiobacillus-associated Plasmid_56_509 match two unbinned Acidithiobacillus-like
    contigs containing conjugation-related genes. This supports a putative plasmid interference model in that host
    group. The source-only scope records the host-associated molecular capability, not a taxon-to-taxon competitive
    relationship. Sequence matches do not demonstrate target cleavage, blocked conjugation, plasmid exclusion, confirmed
    co-residence in a cell or reciprocal harm among the microbial members.
  scope: PAIRWISE
  evidence:
  - reference: PMID:41381092
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: CRISPR spacers on an Acidithiobacillus plasmid targeted plasmid-borne conjugal transfer genes found
      in the same genus, likely belonging to another plasmid, evidence of intra-plasmid competition
    explanation: Supports a spacer/contig-based interference inference. The primary body identifies two unbinned
      targets with plasmid-related genes; it does not experimentally establish plasmid elimination or co-residence.
      Competition here concerns proposed mobile-element dynamics, not measured reciprocal taxon fitness.
  source_taxon:
    preferred_term: Acidithiobacillus species
    term:
      id: NCBITaxon:119977
      label: Acidithiobacillus
cultivation_setup:
- cultivation_mode: BATCH
  operating_temperature: 28.0
  operating_temperature_unit: °C
  instrument_detail: >-
    The consortium was sampled from packed bioleaching column SC3 at the Skouriotissa Mine in
    Cyprus, then maintained in the laboratory: incubated at 28 °C without agitation and
    sub-cultured ten times at 5% inoculum every two months in MAM with 0.25 g of unsterilised
    research-grade chalcopyrite. It was then split and sub-cultured onto chalcocite as well as
    chalcopyrite, since the mineral is the variable the study is about.
  notes: >-
    The mineral is in the setup rather than only among environmental factors because it is
    the substrate the community is grown on and the experimental variable at once - the whole
    question is how mineral type drives composition. It is also deliberately unsterilised,
    which is a choice about what the community is allowed to encounter.

    Static, and worth recording for the same reason as the thermophilic cellulose and TCE
    records: a mineral-attached acidophile consortium is grown on a settled solid surface, so
    "without agitation" is a design decision rather than an omission.

    No `system_type` or `working_volume`. The source names neither the vessel nor the fill for
    the sub-cultures; the packed column it came from is the field source, not the laboratory
    setup, and recording it would describe where the community was found rather than how it
    was grown.

    Third of the three "likely curatable" predictions in #543, and it holds - but only just.
    The community originates in a column at a mine, which is exactly the shape that made
    Avena_Rhizosphere unenrichable. What separates them is that this one was then carried into
    the laboratory and propagated for ten passages; the sampling is the origin, the
    sub-culturing is the cultivation.
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Before the experiment, the microbial enrichment was incubated at 28°C without agitation
      and sub‐cultured 10 times with a 5% inoculum every 2 months in MAM with 0.25 g unsterilized
      research grade chalcopyrite
    explanation: Temperature, static operation, transfer regime, medium and mineral substrate.
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: microbial consortia from a copper bioleaching column in Cyprus were cultivated on
      chalcopyrite (CuFeS2) and then sub‐cultured on chalcocite (Cu2S) and chalcopyrite
    explanation: The community was cultivated in the laboratory, and the mineral was varied.

