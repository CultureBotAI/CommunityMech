id: CommunityMech:000217
name: Cyprus Copper Sulphide Bioleaching Consortium
description: >
  An acidophilic copper bioleaching consortium established from a copper
  bioleaching column in Cyprus on chalcopyrite (CuFeS2) and sub-cultured to
  chalcocite (Cu2S) to test how mineral type and surface chemistry shape
  community composition. Genome-resolved metagenomics after 4 and 8 weeks of
  cultivation identified dominant members including Acidithiobacillus species
  and strains, a Rhodospirilales, Leptospirillum ferrodiazotrophum, and
  Thermoplasmatales archaea, with abundance trends linked to mineralogy and to
  surface-attached versus planktonic lifestyles. Many bacteria carried plasmids
  encoding metal resistance, sulphur metabolism, and CRISPR-Cas loci, with
  evidence of intra-plasmid competition via CRISPR spacers on an
  Acidithiobacillus plasmid targeting plasmid-borne conjugal transfer genes.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOMINING
engineering_design:
  objective: Determine how copper sulphide mineral type and surface chemistry
    shape the composition and metabolism of an acidophilic bioleaching
    consortium.
  assembly_strategy: Establish a consortium from a copper bioleaching column in
    Cyprus on chalcopyrite and sub-culture the same community onto chalcocite,
    a Fe-free Cu-sulphide mineral.
  perturbation_design: Switch the mineral substrate between chalcopyrite and
    chalcocite, and compare surface-attached versus planktonic subpopulations
    at 4 and 8 weeks.
  measurement_endpoints:
  - Community composition shifts by mineral type
  - Surface-attached versus planktonic differential abundance
  - Plasmid content and encoded metal resistance, sulphur metabolism, CRISPR-Cas
    loci
  - Inferred intra-plasmid competition via CRISPR spacers
  evidence:
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: established a microbial consortium from a copper bioleaching column
      in Cyprus on chalcopyrite and then sub-cultured it to chalcocite
    explanation: Supports the consortium origin and substrate-switching design.
  - reference: PMID:41381092
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the structure and composition of metal sulphide minerals select for
      distinct consortia
    explanation: Supports the mineral-driven community assembly objective.
