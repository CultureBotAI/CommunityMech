  chebi_term:
    id: CHEBI:16828
    label: L-tryptophan
  relevance: Aromatic amino acid whose metabolism the seven-member commensal SynCom enhances after
    F. nucleatum decolonization — one of the two key host-metabolism axes (tryptophan + secondary bile
    acid) the SynCom restores to suppress CRC tumor growth (Zhou et al. 2025).
  evidence:
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: it promotes F. nucleatum decolonization, and enhances tryptophan metabolism and secondary
      bile acid conversion
    explanation: Names tryptophan metabolism as one of two metabolic axes the SynCom restores after
      F. nucleatum displacement.
growth_media:
- name: GAM medium (Gifu Anaerobic Medium)
  atmosphere: ANAEROBIC
  preparation_notes: Seven-species SynCom and F. nucleatum cultured in GAM under anaerobic conditions;
    modified GAM (mGAM, GAM supplemented with arginine and tryptophan) and 1% arginine/tryptophan-supplemented
    GAM used across multiple transfer generations to test pH-dependent F. nucleatum suppression.
  evidence:
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The nine species were first cultured in vitro under anaerobic condition
    explanation: Establishes anaerobic cultivation of the SynCom member species.
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: growth curves of SynCom in GAM medium
    explanation: Names GAM as the growth medium used to culture the SynCom.
