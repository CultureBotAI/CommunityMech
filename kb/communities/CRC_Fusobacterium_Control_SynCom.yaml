ecological_interactions:
- name: Low-Competition Commensal SynCom Colonization
  description: A seven-species SynCom selected using metabolic-network criteria was tested for colonization in an
    AOM-DSS mouse CRC model. Low modeled competition is a design criterion, not demonstrated niche partitioning
    or isolated evidence that colonization causes F. nucleatum suppression. F. nucleatum and SynCom were mixed before
    gavage in the combination arm.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A synthetic microbial community (SynCom) is then designed by metabolic network reconstruction, and
      its performance is validated using coculture experiments and an AOM-DSS induced mouse CRC model.
    explanation: Supports the defined synthetic community design and represented community context.
- name: Fusobacterium nucleatum Ecological Suppression
  description: The SynCom inhibited F. nucleatum in vitro and lowered its abundance in the mouse experiment. The
    paper classifies many pair interactions as exploitation, not reciprocal-negative competition under this schema.
    Amino-acid supplementation reduced acidity and slowed F. nucleatum decline, supporting context-dependent inhibition
    rather than tryptophan-enhanced suppression. Co-gavage does not cleanly establish eradication of a previously
    established infection.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: L-tryptophan
    term:
      id: CHEBI:16828
      label: L-tryptophan
    notes: Supplementation slowed pathogen decline while reducing acidity; do not infer tryptophan itself enhanced
      suppression.
  evidence:
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A synthetic microbial community (SynCom) is then designed by metabolic network reconstruction, and
      its performance is validated using coculture experiments and an AOM-DSS induced mouse CRC model.
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: it promotes F. nucleatum decolonization, and enhances tryptophan metabolism and secondary bile acid
      conversion
    explanation: Reports pathogen and metabolic outcomes under the same intervention; concurrence does not establish
      suppression-to-metabolism mediation.
- name: Tryptophan and Secondary Bile Acid Restoration
  description: SynCom treatment was associated with altered tryptophan metabolism and secondary bile-acid profiles
    in the mouse model. PARTIAL - the authors propose that these changes contribute to disease outcomes, but metabolite
    correlations and expression do not establish necessary mediation. The main-text versus figure definitions of
    the LCA conversion ratio differ, so no numerical conversion direction is inferred here.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: L-tryptophan
    term:
      id: CHEBI:16828
      label: L-tryptophan
  - preferred_term: bile acid
    term:
      id: CHEBI:3098
      label: bile acid
  downstream:
  - target: Reduced Inflammation and Tumor Burden
    description: PARTIAL - altered tryptophan and bile-acid metabolism could contribute to reduced tissue lipid
      accumulation, inflammation and tumor burden, as proposed by the source. The experiments do not isolate these
      metabolites as necessary mediators of SynCom benefit or establish clinical efficacy.
  evidence:
  - reference: PMID:40433987
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: enhances tryptophan metabolism and secondary bile acid conversion, leading to reduced lipid accumulation,
      decreased inflammatory reaction, and enhanced tumor inhibition effect
    explanation: Supports the authors' mechanistic interpretation; concurrent metabolite and disease changes do
      not isolate mediation.
- name: Reduced Inflammation and Tumor Burden
  description: The SynCom combination arm reduced measured tumor and inflammatory endpoints and tissue lipid accumulation
    in the F. nucleatum-treated AOM-DSS mouse model. Blood triglyceride reduction was nonsignificant. There was
    no disease-model SynCom-only arm without F. nucleatum, and these results do not establish efficacy in human
    colorectal cancer.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40433987
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: leading to reduced lipid accumulation, decreased inflammatory reaction, and enhanced tumor inhibition
      effect
    explanation: Supports the disease-model endpoint improved by the designed SynCom.
environmental_factors:
- name: metabolic network reconstruction design
  value: A seven-species SynCom with low competitive interrelationships was designed from human metagenome
    and metabolomics data.
  description: The SynCom was tested against Fusobacterium nucleatum in vitro and in an AOM-DSS mouse
    colorectal cancer model.
  evidence:
