id: CommunityMech:000509
name: Hexamine Formaldehyde Consortium C5
description: Consortium C5 is a defined five-member hexamine- and formaldehyde-removing bacterial formulation assembled from
  all five primary selected environmental isolates—Brevundimonas diminuta SRCHD03 and SRCHD04, Brucella pseudintermedia SRCHD05
  and SRCHD07, and Ochrobactrum sp. SRCHD06—at an equal 1:1:1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees
  Celsius. Over 24, 48, and 72 h of suspended-culture incubation, Table 2 reports 79.02%, 87.59%, and 94.18% hexamine reduction,
  16.43%, 37.91%, and 43.88% formaldehyde reduction, and 1.15%, 36.21%, and 42.17% COD reduction with 1.94%, 24.08%, and 29.45%
  ammonia production (summarized in the main text at 72 h as 94.1% hexamine, 42.4% COD, and 49% formaldehyde reduction while
  producing ammonia simultaneously), and C5 was additionally profiled by a 44 h OD600 growth curve alongside the individual
  isolates and Consortium C6.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate the defined 5-isolate combination Consortium C5 (SRCHD03, SRCHD04, SRCHD05, SRCHD06, SRCHD07 at a 1:1:1:1:1
    ratio) for removal of hexamine, its formaldehyde by-product, and chemical oxygen demand in suspended AS broth as part
    of the C1-C6 consortium development series.
  assembly_strategy: Select five hexamine-, formaldehyde-, and COD-removing environmental isolates (SRCHD03, SRCHD04, SRCHD05,
    SRCHD06, and SRCHD07) and test defined equal-ratio combinations C1-C6 in 50 mg/L hexamine AS broth at 37 degrees Celsius.
  inoculation_strategy: Combine Brevundimonas diminuta SRCHD03 and SRCHD04, Brucella pseudintermedia SRCHD05 and SRCHD07,
    and Ochrobactrum sp. SRCHD06 at a 1:1:1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius and sample
    cell-free supernatants at 24, 48, and 72 h; also monitor 44 h OD600 growth kinetics.
  perturbation_design: Compare Consortium C5 across 24, 48, and 72 h incubation intervals against sibling consortia in the
    C1-C6 combinatorial assembly series in AS broth supplemented with 50 mg/L hexamine at 37 degrees Celsius.
  measurement_endpoints:
  - hexamine removal
  - formaldehyde removal
  - chemical oxygen demand removal
  - ammonia production
  - optical density at 600 nm growth curve over 44 hours
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on their hexamine, formaldehyde, and COD removal ability, five isolates were selected for consortium development
    explanation: Supports the bioremediation phenotype screen used to select the five isolates for C1-C5 consortium development.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '5 SRCHD03: SRCHD04: SRCHD05: SRCHD06: SRCHD07 (1:1:1: 1:1) C5'
    explanation: Reports the Table 1 Consortium C5 assembly combining isolates SRCHD03, SRCHD04, SRCHD05, SRCHD06, SRCHD07
      at a 1:1:1:1:1 ratio.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C5 79.02 87.59 94.18 16.43 37.91 43.88 1.15 36.21 42.17 1.94 24.08 29.45
    explanation: Quantifies Consortium C5 24 h, 48 h, and 72 h hexamine reduction, formaldehyde reduction, COD reduction,
      and ammonia production in suspended AS broth.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Figure 3 Growth curve of the isolates and consortium 5 and consortium 6. Line graph showing optical density
      at 600 nm over 44 hours for different strains: SRCHD02, SRCHD03, SRCHD04, SRCHD05, SRCHD06, SRCHD07, consortium 5, and
      consortium 6.'
    explanation: Supports the 44 h OD600 growth-curve endpoint measured for Consortium C5.
