ecological_interactions:
- name: C5 suspended-culture hexamine, formaldehyde, and COD removal
  description: In suspended AS broth containing 50 mg/L hexamine at 37 degrees Celsius, the five-isolate Consortium C5 (SRCHD03,
    SRCHD04, SRCHD05, SRCHD06, and SRCHD07 at a 1:1:1:1:1 ratio) combined the fast-growing hexamine/formaldehyde reducer SRCHD07
    (12 h log phase, 49 min 6 s doubling time), the COD-reducing strong biofilm formers SRCHD05 and SRCHD06 (42% and 36% monoculture
    COD reduction), and structured biofilm formers SRCHD03 and SRCHD04 to outperform the two- and three-isolate combinations
    C1-C4, reaching 79.02%, 87.59%, and 94.18% hexamine reduction, 16.43%, 37.91%, and 43.88% formaldehyde reduction, and
    1.15%, 36.21%, and 42.17% COD reduction with 1.94%, 24.08%, and 29.45% ammonia production in Table 2 (reported in the
    Results narrative at 72 h as 94.1% hexamine, 42.4% COD, and 49% formaldehyde reduction with simultaneous ammonia production).
    Because bulk supernatant assays in nutrient-containing AS broth do not resolve inter-strain substrate handoff or complete
    mineralization, C5 is represented as a single COMMUNITY_LEVEL node with 0 directed downstream edges.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    notes: Ammonia was produced as a hexamine breakdown by-product in the suspended-C5 assay (Table 2); a consortium ammonia
      sink is not established.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C5 79.02 87.59 94.18 16.43 37.91 43.88 1.15 36.21 42.17 1.94 24.08 29.45
    explanation: Quantifies the 24 h, 48 h, and 72 h bulk hexamine, formaldehyde, and COD reduction percentages and ammonia
      production percentages for Consortium C5 in suspended AS broth.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among the different consortia developed ( Table 1 ), consortium (C5) showed 94.1% hexamine reduction associated
      with 42.4% COD and 49% formaldehyde reduction after 72 h of incubation, while producing ammonia simultaneously.
    explanation: Supports the main-text 72 h performance summary for Consortium C5 and explicitly confirms simultaneous ammonia
      production rather than ammonia removal.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Figure 3 Growth curve of the isolates and consortium 5 and consortium 6. Line graph showing optical density
      at 600 nm over 44 hours for different strains: SRCHD02, SRCHD03, SRCHD04, SRCHD05, SRCHD06, SRCHD07, consortium 5, and
      consortium 6.'
    explanation: Documents the 44 h OD600 growth-curve comparison of Consortium C5 alongside its constituent isolates and
      Consortium C6.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth curve data of the selected isolates revealed that the isolate SRCHD07 was the fastest growing strain
      among the selected five isolates, with a log phase of 12 h and doubling time of 49 min and 6 s. Isolates SRCHD06 (14
      h log phase, 128 min and 12 s doubling time), SRCHD05 (13.5 h log phase, 73 min and 2 s doubling time), SRCHD03 (20
      h log phase, 121 min and 4 s doubling time), and SRCHD04 (25 h log phase, 80 min, and 6 s doubling time) took longer
      time to reach growth saturation ( Figure 3 ).
    explanation: Quantifies the monoculture log-phase durations and doubling times for all five constituent isolates assembled
      at a 1:1:1:1:1 ratio in Consortium C5.
