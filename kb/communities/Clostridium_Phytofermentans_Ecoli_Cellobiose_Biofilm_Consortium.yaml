id: CommunityMech:000196
name: Clostridium phytofermentans-E. coli Cellobiose Biofilm Consortium
description: >
  A rationally designed two-member artificial consortium composed of
  Clostridium phytofermentans ISDg, currently represented in NCBI Taxonomy as
  Lachnoclostridium phytofermentans ISDg, and Escherichia coli K-12 MG1655.
  The community was built to improve conversion of cellulose-derived sugars
  into ethanol, biomass, and other bioproduct-relevant outputs through division
  of labor between a cellulolytic obligate anaerobe and a facultative anaerobe.
  It is DOE-relevant because it models consolidated lignocellulosic
  bioprocessing, cellobiose conversion, biofilm oxygen partitioning, and
  cross-feeding mechanisms that can improve cellulosic fuel and chemical
  production.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Improve cellobiose and glycerol catabolism, ethanol production, and
    biofilm biomass productivity by pairing a primary cellulose-derived-sugar
    specialist with a facultative secondary-resource specialist.
  assembly_strategy: Assemble wild-type C. phytofermentans ISDg with E. coli
    K-12 MG1655 as an artificial consortium in modified GS-2 medium.
  perturbation_design: Compare monocultures with binary consortia in planktonic
    anoxic culture and colony biofilms, including fully anoxic, fully oxic, and
    anoxic-to-oxic switch biofilm regimes.
  measurement_endpoints:
  - Cellobiose depletion
  - Glycerol depletion
  - Ethanol production
  - Biofilm biomass accumulation
  - Species-resolved biofilm spatial distribution
  - Oxygen profiles in biofilms
  evidence:
  - reference: PMID:33268782
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: rationally designed consortium
    explanation: Supports the engineered design framing for the two-member community.
  - reference: PMID:33268782
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: division of labor, and nutrient and energy transfer via necromass catabolism
    explanation: Supports the curated design mechanisms.
  - reference: PMID:33268782
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. phytofermentans ISDg (ATCC 700394) and E. coli K-12 MG1655 were used for all experiments
    explanation: Supports the exact strain composition of the engineered consortium.
