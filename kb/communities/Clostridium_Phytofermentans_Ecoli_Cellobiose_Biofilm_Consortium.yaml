ecological_interactions:
- name: Cellobiose Hydrolysis And Glucose Scavenging Feedback
  description: C. phytofermentans releases cellobiase activity that hydrolyzes cellobiose to glucose;
    E. coli consumes the released glucose, reducing product inhibition and creating a positive feedback
    loop that enhances cellulose-derived sugar catabolism.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Clostridium phytofermentans ISDg
    term:
      id: NCBITaxon:357809
      label: Lachnoclostridium phytofermentans ISDg
  target_taxon:
