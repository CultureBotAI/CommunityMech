    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: E. coli consumed inhibitory byproducts from cellobiose catabolism
    explanation: Supports glucose/byproduct scavenging by E. coli as a positive interaction.
  - reference: PMID:33268782
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: released cellobiase enzyme which hydrolyzed cellobiose into glucose extracellularly
    explanation: Supports the extracellular cellobiose-to-glucose mechanism.
- name: Reciprocal Necromass Catabolism
  description: >
    The two members exchange nutrients through biomass turnover: C. phytofermentans necromass
    supports E. coli growth, while E. coli necromass provides peptides or biomass-derived nutrients that
    promote C. phytofermentans growth and viability.
