    evidence_source: IN_VITRO
    snippet: E. coli necromass enhanced C. phytofermentans growth
    explanation: Supports necromass-mediated support from E. coli to C. phytofermentans.
  - reference: PMID:33268782
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. phytofermentans necromass aided E. coli growth
    explanation: Supports the reciprocal necromass contribution to E. coli.
- name: Biofilm Oxygen Partitioning
  description: In colony biofilms, E. coli consumes oxygen and helps maintain an anoxic zone that allows
    the obligate anaerobe C. phytofermentans to persist during oxic perturbation, while E. coli occupies
    the more oxic upper biofilm region.
