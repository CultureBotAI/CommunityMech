- name: Mineral-Dependent Demineralization Restraint
  description: Higher-fluoride arms had lower enamel surface-microhardness change, lesion depth and integrated mineral
    loss. Calcium at 2 mM reduced surface-microhardness change relative to lower calcium arms, not every mineral-loss
    endpoint. These are treatment-dependent material outcomes, not microbial competition or proof that altered cell
    counts mediate protection; proposed calcium/EPS mechanisms were not tested.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: fluoride
    term:
      id: CHEBI:17051
      label: fluoride
  - preferred_term: calcium(2+)
    term:
      id: CHEBI:29108
      label: calcium(2+)
  evidence:
  - reference: PMID:23446436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: There was a decrease in %SMC in response to increased fluoride and calcium concentrations (p < 0.001).
    explanation: Supports treatment-dependent surface-microhardness outcomes; it does not establish a monotonic
      effect for every calcium concentration or all mineral endpoints.
  - reference: PMID:23446436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lower IML (p < 0.001) and LD (p < 0.05) were found in the presence of 0.8 and 1.0 ppm F.
    explanation: Supports lower lesion depth and integrated mineral loss in the specified higher-fluoride arms,
      not a resolved interspecies competitive mechanism.
  participating_taxa:
