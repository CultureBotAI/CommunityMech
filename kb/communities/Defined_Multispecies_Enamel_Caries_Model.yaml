- name: Treatment-Dependent Viable Biofilm Counts
  description: Sucrose, fluoride and calcium treatments altered selected viable-count outcomes in the inoculated
    model. Higher sucrose increased total counts and L. casei; calcium did not significantly change total counts
    or S. mutans. Species-specific responses are not a uniform community increase or demonstrated cross-feeding.
    Acid selection remains a proposed explanation, not a selectively perturbed mechanism.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: sucrose
    term:
      id: CHEBI:17992
      label: sucrose
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:23446436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Counts of viable cells on biofilms were significantly affected by sucrose, fluoride and calcium concentrations
      (p < 0.05).
    explanation: The abstract summarizes treatment-dependent counts; primary Tables 1 and 2 distinguish total and
      species-specific outcomes. The broad statement does not mean every count changed with every amendment.
  participating_taxa:
