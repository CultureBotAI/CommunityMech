ecological_interactions:
- name: Four-Species Enamel Biofilm Formation
  description: The four canonical taxa were inoculated onto salivary-pellicle-coated enamel for the four-day assay
    with daily medium changes. This records the defined starting community and biofilm platform, not demonstrated
    interspecies colonization facilitation or persistence of all four members in every treatment; S. sanguinis was
    below detection in the calcium arms.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:23446436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Defined-multispecies biofilms, formed by Lactobacillus casei, Streptococcus mutans, S. salivarius and
      S. sanguinis, were grown on the surface of salivary-pellicle-coated enamel slabs, with known baseline surface
      hardness; growth medium was changed daily.
    explanation: Supports the inoculated model and biofilm platform. Primary viable-count results limit claims about
      persistence; the abstract does not establish member-to-member facilitation.
  participating_taxa:
