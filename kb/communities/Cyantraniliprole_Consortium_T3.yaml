ecological_interactions:
- name: T3 distributed cyantraniliprole enzyme potential
  description: 'Post-assay bioinformatic analysis (Table 8 / Figure 5) assigns the six T3 strains a combined repertoire of
    24 predicted enzyme hits spanning all five proposed enzyme classes with complementary genus-level division: triosephosphate
    isomerase (TPI), aminopeptidase (AP), and catechol 1,2-dioxygenase (C1,2O) in Ht1-Ht6; catechol O-methyltransferase (COMT)
    in Bacillus strains Ht1-Ht3; and 2-oxopent-4-enoate hydratase (OEX) in Pseudomonas aeruginosa strains Ht4-Ht6. These represent
    predicted pathway and enzyme-class coverage rather than measured enzyme expression, catalytic activity, or member-resolved
    metabolic flux, and do not establish reciprocal fitness benefits.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: While T3 had 24 enzymes and T4 had 22, the critical factor was that both contained all five key enzymes necessary
      for the complete degradation pathway, most notably including the enzyme catechol O-methyltransferase (COMT).
    explanation: Supports the post-assay bioinformatic enzyme-repertoire prediction for T3 (24 total enzyme hits in Table
      8 / Figure 5), without claiming measured enzymatic activity or confirmed pathway intermediates.
    computational_provenance:
      prediction_type: OTHER
      tools:
      - tool_name: EAWAG-BBD pathway prediction system
        role: predicted cyantraniliprole transformation pathway and associated enzyme coverage
      parameters: Pathway and enzyme-activity prediction used to compare candidate enzyme coverage across Consortia Nos. 1-4;
        tool version and sequence-search thresholds were not reported in the source paper.
  - reference: PMID:42354927
    supports: SUPPORT
