- name: HPLC-confirmed cyantraniliprole removal
  description: In NPK-amended 500 mL freshwater microcosms incubated at 30 °C for 20 days, T3 bioaugmentation was associated
    with HPLC-measured cyantraniliprole decline from a 57.89 mg/L zero-day residue (96.48% recovery of the nominal 60 mg/L
    spike) to 1.90 mg/L after 20 days (96.72% removal, outperforming uninoculated controls C1 and C2) alongside total viable
    bacterial growth reaching 6.11 x 10^6 CFU/mL at day 11 before declining by day 20. Treatment-level parent-compound loss
    in non-sterile freshwater microcosms does not establish complete mineralization, detoxification, member-specific flux,
    or enzyme mediation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cyantraniliprole
    term:
      id: CHEBI:132300
      label: cyantraniliprole
