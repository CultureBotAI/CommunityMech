    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: followed by consortium T3 (96.72%), which consisted of Bacillus subtilis Ht1, Bacillus subtilis Ht2, Bacillus
      mojavensis Ht3, Pseudomonas aeruginosa Ht4, Pseudomonas aeruginosa Ht5, and Pseudomonas aeruginosa Ht6.
    explanation: Supports the 20-day HPLC-measured cyantraniliprole removal efficiency (96.72%) and final residue (1.90 mg/L)
      for T3.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: T3 96.48 57.89 43.13 e 31.14 e 19.52 e 1.90 e
    explanation: Table 7 reports the T3 recovery (96.48%), zero-day (57.89 mg/L), 3-day, 7-day, 11-day, and 20-day (1.90 mg/L)
      cyantraniliprole residues.
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The bacterial consortia T1, T2, T3, and T4 all showed a consistent increase (p > 0.05) in total bacterial counts
      from the start of incubation to day 11, reaching 5.86 × 106, 5.92 × 106, 6.11 × 106, and 6.70 × 106 CFU/mL, respectively.
    explanation: Documents viable bacterial proliferation of consortium T3 (reaching 6.11 x 10^6 CFU/mL at day 11) during
      active cyantraniliprole biodegradation in the 20-day water microcosms.
