id: CommunityMech:000500
name: Cyantraniliprole Bioremediation Consortium T3
description: A defined six-member bacterial consortium, designated T3 or Consortium No. 3, constructed from non-antagonistic
  pesticide-degrading freshwater isolates enriched near the Kafr El-Zayat Pesticides and Chemicals Factory (Egypt) and evaluated
  for cyantraniliprole and diamide-insecticide biodegradation. The consortium comprises Bacillus subtilis Ht1, Bacillus subtilis
  Ht2, Bacillus mojavensis Ht3, Pseudomonas aeruginosa Ht4, Pseudomonas aeruginosa Ht5, and Pseudomonas aeruginosa Ht6. In
  20-day, 30 °C NPK-supplemented simulated contaminated-water microcosms (500 mL, nominal 60 mg/L cyantraniliprole, 57.89
  mg/L zero-day residue at 96.48% recovery), T3 achieved 96.72% cyantraniliprole removal, reducing residual cyantraniliprole
  to 1.90 mg/L while reaching 6.11 x 10^6 CFU/mL on day 11 and decolorizing DCPIP in 20 h.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Construct and evaluate six-member bacterial Consortium No. 3 (T3) from pesticide-contaminated freshwater isolates
    for cyantraniliprole bioremediation in simulated contaminated water and broad growth on diamide insecticides.
  assembly_strategy: Enrich 45 isolates from pesticide-contaminated freshwater in mineral salt medium with 50 mg/L cyantraniliprole,
    select the 18 highest-performing degraders, screen for absence of antagonism by cross-streaking on nutrient agar, and
    combine six compatible isolates into Consortium No. 3 (T3).
  measurement_endpoints:
  - cyantraniliprole residue by HPLC in simulated water microcosms
  - total viable bacterial counts (CFU/mL) in 20-day water microcosms
  - DCPIP decolorization time in Bushnell-Haas broth
  - biomass (OD600) and biofilm formation (OD570) under 70-100 mg/L cyantraniliprole stress
  - OD600 growth on five diamide insecticides in mineral salt medium
  - predicted cyantraniliprole enzyme and transformation pathway coverage
  evidence:
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: T3 + Consortia No. 3 + Bacillus subtilis Ht1, Bacillus subtilis Ht2, Bacillus mojavensis Ht3, Pseudomonas aeruginosa
      Ht4, Pseudomonas aeruginosa Ht5, and Pseudomonas aeruginosa Ht6
    explanation: Identifies the exact six constituent isolates of treatment T3 (Consortium No. 3) in the simulated-water microcosm
      design (Table 2).
  - reference: PMID:42354927
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolates showing high biodegradation potential and no visible antagonistic activity were combined to construct
      the six-member bacterial consortia. These were used to construct three distinct consortia, each comprising six isolates.
    explanation: Documents the enrichment, non-antagonism screening, and six-isolate construction strategy for Consortia Nos.
      1-3.
