id: CommunityMech:000328
name: Waste-Sludge Electro-Fermentation Biofilm-Suspension Community
description: >
  An engineered waste-activated-sludge electro-fermentation community with
  spatially differentiated electrode-biofilm and planktonic fractions. The
  source reports biofilm-associated reductive debromination of 4-bromophenol
  and suspension-associated acidogenesis for volatile-fatty-acid recovery. The
  five genera recorded here are enriched functional examples, not an exhaustive
  inventory of the sludge community.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Synchronize volatile-fatty-acid production from waste activated sludge with degradation of 4-bromophenol in an electro-fermentation system.
  assembly_strategy: Enrich spatially separated electrode-biofilm and planktonic communities from waste activated sludge in an electrode-coupled reactor.
  measurement_endpoints:
  - 4-bromophenol removal
  - volatile-fatty-acid production
  - biofilm and suspension community composition
  - electron-transfer and dehalogenation genes
  - hydrolysis and fatty-acid biosynthesis pathways
  evidence:
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cooperation between biofilms and suspensions in EFS designed to synchronize carbon recovery (volatile fatty acid, VFAs) production and halogenated contaminant degradation
    explanation: Supports the engineered two-compartment objective and measured functions.
