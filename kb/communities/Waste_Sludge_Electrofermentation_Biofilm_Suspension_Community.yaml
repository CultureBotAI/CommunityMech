ecological_interactions:
- name: Biofilm-Suspension Spatial Division of Labor
  description: Electrode biofilms perform reductive debromination while planktonic suspensions perform acidogenesis, partitioning contaminant degradation from carbon recovery.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Multi-omics analysis revealed a distinct spatial division of labor
    explanation: Supports the community-level spatial partitioning.
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Electrode biofilms primarily governed reductive debromination
    explanation: Supports the biofilm function within the spatially divided community.
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: planktonic suspensions mainly drove acidogenesis
    explanation: Supports the suspension function within the spatially divided community.
- name: Biofilm Electroactivity and Dehalogenation
  description: Syntrophomonas and Geobacter are enriched as electroactive biofilm members, while Hydrogenophaga is enriched as a dehalogenator.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enriching electroactive bacteria (e.g., Syntrophomonas and Geobacter) and dehalogenators (e.g., Hydrogenophaga)
    explanation: Supports the differentiated functions of the three named biofilm genera.
- name: Suspension Acidogenesis
  description: Sedimentibacter and Petrimonas are enriched in the planktonic suspension associated with hydrolysis, fatty-acid biosynthesis, and acidogenesis.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enriching fermentative bacteria (e.g., Sedimentibacter and Petrimonas) and accelerating hydrolysis and fatty acid biosynthesis pathways
    explanation: Supports the reported suspension-associated taxa and acidogenic mechanisms.
- name: EET-Reinforced Biofilm-Suspension Syntrophy
  description: Extracellular electron transfer reinforces cooperation between the spatial fractions and contributes to dehalogenation and acidogenesis.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41793807
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: extracellular electron transfer as the key factor reinforcing this biofilm-suspension syntrophy, significantly contributing to both dehalogenation and acidogenesis
    explanation: Supports EET as the mechanistic link between the two spatial fractions.
