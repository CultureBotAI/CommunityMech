  objective: A simplified synthetic community (sfSynCom) for enhanced symbiotic nitrogen
    fixation in soybean, based on core-helper strain interactions.
  assembly_strategy: Bottom-up assembly from isolates, with a Bradyrhizobium core
    symbiont combined with helper strains selected to improve root colonization and
    nodulation.
  measurement_endpoints:
  - Interaction-level mechanistic characterization
  - Member-level abundance and persistence tracking
  notes: Backfilled engineering-design metadata from existing curation; refine with
    protocol-level parameters when available.
