ecological_interactions:
- name: Acidic Warm-Spring Mercury Speciation Regime
  description: Geochemical measurements characterize acidic warm Ngawha springs with high dissolved total mercury
    and methylmercury and high sediment mercury. These measured environmental pools constrain hypotheses about bioavailability,
    but total dissolved mercury is not synonymous with freely available Hg(II), and co-occurrence does not show
    that the regime caused the observed diversity.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
  - preferred_term: methylmercury
    term:
      id: CHEBI:49747
      label: methylmercury(1+)
  evidence:
  - reference: PMID:32414793
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'acidic warm springs in the Ngawha Geothermal Field (<55°C, pH <4.5), Northland Region, Aotearoa New
      Zealand

      '
    explanation: 'Supports the acidic warm-spring geochemical setting of the Hg-cycling community.

      '
- name: Metagenomic Mercury Transformation Potential
  description: PARTIAL - Metagenomic merA/merB homologues support potential Hg(II) reduction and organomercurial
    demethylation. Cub Bath yielded hgcA/hgcB evidence, but hgcA-bearing sequences could not be assigned to a resolved
    genome or definitive taxon; Tiger Bath nondetection is sequencing-depth bounded. These are positive sequence
    findings, not measured transformation rates or identified active members for every reaction. HMM merA counts
    required paralog filtering.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
  - preferred_term: methylmercury
    term:
      id: CHEBI:49747
      label: methylmercury(1+)
  evidence:
  - reference: PMID:32414793
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: merB genes were identified
    explanation: 'Author manuscript Results, page9: actual gene identification supports potential, not enzymatic
      activity.'
  - reference: PMID:32414793
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The Cub Bath hgcA sequences could not be binned
    explanation: 'Author manuscript Results, page11: directly limits genome-resolved methylator assignment, despite
      positive hgcA evidence.'
- name: Diverse Acidophile Guilds Under Ultrahigh Mercury
  description: The sampled Ngawha microbiomes were unexpectedly diverse despite high mercury, with sulfur- and iron-cycling
    bacteria, Hg/As-resistance potential and acidophilic archaea; the two baths differed in composition. This metagenomic
    observation does not demonstrate temporal stability, realized niche partitioning, or a mercury-driven diversity
    increase.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
  - preferred_term: sulfur atom
    term:
      id: CHEBI:26833
      label: sulfur atom
  evidence:
  - reference: PMID:32414793
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In the context of such ultrahigh mercury levels, the geothermal microbiome was unexpectedly diverse
    explanation: Supports the curated high-diversity-under-high-Hg observation.
- name: Measured Gaseous Mercury With Unresolved Microbial Contribution
  description: 'Gaseous Hg(0) was measured above Tiger and Cub Baths, alongside aqueous and sediment mercury measurements.
    The source also reports merA-based reduction potential. The measured atmospheric mercury is a positive environmental
    result, not an isolated microbial emission rate: deep geological inputs and abiotic redox processes also contribute,
    and their contributions were not separated from microbial reduction.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
  - preferred_term: mercury(0)
    term:
      id: CHEBI:16170
      label: mercury(0)
  evidence:
  - reference: PMID:32414793
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Gaseous Hg0 emissions were also recorded from the baths
    explanation: 'Author manuscript Results, page7 and Table2: supports measured gaseous mercury; does not identify
      its microbial fraction.'
- name: Sulfur-Iron-Coupled Mercury Cycle Model
  description: HYPOTHESIZED - The conceptual model links sulfur/iron redox cycling and cinnabar precipitation/dissolution
    to mercury bioavailability, with potential methylation, demethylation and Hg(II) reduction. These coupled biotic
    and abiotic reactions are an evidence-informed model, not demonstrated interspecies syntrophy or a measured
    taxon-to-taxon mercury flux.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: mercury(2+)
    term:
      id: CHEBI:16793
      label: mercury(2+)
  - preferred_term: sulfur atom
    term:
      id: CHEBI:26833
      label: sulfur atom
  evidence:
  - reference: PMID:32414793
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: 'illustrates how geothermal mercury cycling may couple to microbial community dynamics and sulfur and
      iron biogeochemistry

      '
    explanation: Supports the explicitly conceptual coupling model; it does not establish syntrophy, exclusive biotic
      attribution or reaction flux.
