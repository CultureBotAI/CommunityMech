- name: Acidic Warm-Spring Mercury Speciation Regime
  description: >
    Adjacent acidic warm springs in the Ngawha Geothermal Field had pH below
    4.5, temperatures below 55 C, and exceptionally high dissolved total and
    methylated mercury, defining the geochemical regime constraining microbial
    Hg transformations.
