  downstream:
  - target: Diverse Acidophile Guilds Under Ultrahigh Mercury
    description: >
      The high-Hg acidic spring regime was inhabited by unexpectedly diverse
      sulfur-, iron-, Hg/As-resistance, and archaeal guilds.
  - target: Genome-Resolved Mercury Transformation Potential
    description: >
      Genome-resolved metagenomics was interpreted against the springs'
      mercury-speciation measurements to infer Hg methylation, demethylation,
      and reduction potential.
