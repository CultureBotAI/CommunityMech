    description: >
      The metagenomic potential included Hg(II) reduction to volatile elemental
      Hg(0), one route by which springs can emit mercury.
  - target: Sulfur-Iron-Coupled Mercury Cycle Model
    description: >
      The methylation, demethylation, and reduction potential was integrated
