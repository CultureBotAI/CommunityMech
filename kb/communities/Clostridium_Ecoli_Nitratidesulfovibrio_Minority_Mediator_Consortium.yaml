id: CommunityMech:000333
name: Clostridium-E. coli-Nitratidesulfovibrio Minority-Mediator Consortium
description: >
  A defined anaerobic three-strain consortium containing Clostridium
  acetobutylicum ATCC 824, Escherichia coli DH10B, and Nitratidesulfovibrio
  vulgaris Hildenborough NCIMB 8303. In glucose-yeast extract medium, the
  minority N. vulgaris population persists as a physical and metabolic mediator,
  reduces E. coli-associated inhibition of C. acetobutylicum growth, and can
  exchange cytoplasmic material with both other members.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Test how a minority species changes pairwise growth, metabolite exchange, and hydrogen production in a reconstituted three-bacterium community.
  assembly_strategy: Combine washed exponential-phase cultures at equal OD600 contributions in a 1:1:1 ratio.
  measurement_endpoints:
  - growth kinetics
  - glucose consumption
  - organic-acid and solvent production
  - hydrogen production
  - transfer of fluorescent cytoplasmic labels
  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In this study, we explore the intricate bacterial interplay between three key players involved in biomass degradation: Clostridium acetobutylicum (Gram-positive), Escherichia coli, and Nitratidesulfovibrio vulgaris Hildenborough (Gram-negative) using synthetic reconstituted consortium.'
    explanation: Supports the defined three-member synthetic design and its interaction-focused objective.
