discussions:
- discussion_id: minority_member_growth_mediator
  prompt: Which soluble factors or direct exchanges cause the N. vulgaris-associated growth benefit?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Fluorescent-Label Exchange and Proposed Minority-Member Shuttle
  - ecological_interactions#E. coli-associated inhibition of C. acetobutylicum
  - ecological_interactions#E. coli-to-Clostridium lactate cross-feeding
  - ecological_interactions#Nitratidesulfovibrio-Associated Recovery of Second-Phase Growth
  rationale: PMID:41684672 supports label exchange, altered growth/metabolite kinetics, lactate uptake and a filtered-supernatant
    benefit. It does not selectively establish a shuttle or identify the growth-promoting molecule. Matched pH/resource
    conditions, recipient-specific viable growth measurements and selective contact/transfer perturbations would
    distinguish these mechanisms. Genomic qPCR normalization and species-specific extraction differences constrain
    abundance comparisons.
  posed_by: codex
  posed_date: '2026-10-05'
