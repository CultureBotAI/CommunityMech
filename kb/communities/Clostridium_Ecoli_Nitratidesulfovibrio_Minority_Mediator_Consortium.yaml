  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All monocultures and co-cultures were carried out in anaerobic conditions in Hungates tubes with 10 mL of GY medium as describe above and incubated at 37 C without shaking.
    explanation: Supports the vessel, volume, atmosphere, temperature, and agitation.
