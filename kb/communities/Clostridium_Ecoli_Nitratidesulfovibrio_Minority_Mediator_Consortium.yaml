ecological_interactions:
- name: Minority-member mediation of community interactions
  description: >
    N. vulgaris physically associates with both other members and exchanges
    cytoplasmic material bidirectionally, allowing it to act as a mediator even
    though C. acetobutylicum and E. coli do not exchange cytoplasmic material
    directly.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Confocal microscopy confirmed that N. vulgaris exchanges cytoplasmic material with both C. acetobutylicum and E. coli bidirectionally, suggesting its role as a mediator in the consortium.
    explanation: Directly supports the mediator mechanism and its dependence on N. vulgaris.
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Thus, N. vulgaris may function as a shuttle between E. coli and C. acetobutylicum.
    explanation: Supports the shuttle interpretation of the fluorescent-label transfer experiment.
- name: E. coli-associated inhibition of C. acetobutylicum
  description: >
    E. coli passively competes with C. acetobutylicum through resource use and
    medium acidification; adding N. vulgaris restores the C. acetobutylicum-like
    second growth phase in the three-member consortium.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli DH10B
    term:
      id: NCBITaxon:316385
      label: Escherichia coli str. K-12 substr. DH10B
  target_taxon:
    preferred_term: Clostridium acetobutylicum ATCC 824
    term:
      id: NCBITaxon:272562
      label: Clostridium acetobutylicum ATCC 824
  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results indicate that E. coli engages in passive competition with C. acetobutylicum
    explanation: Supports classification of the pairwise relationship as competition.
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the presence of N. vulgaris could prevent the inhibition of C. acetobutylicum growth by E. coli
    explanation: Supports the protective effect observed after adding the minority member.
- name: E. coli-to-Clostridium lactate cross-feeding
  description: C. acetobutylicum consumes lactate associated with E. coli metabolism in coculture.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
