      term:
        id: CHEBI:17634
        label: D-glucose
  - name: yeast extract
    concentration: '0.1'
    unit: percent
  temperature: '37'
  temperature_unit: degrees Celsius
  atmosphere: ANAEROBIC
  headspace_gas: N2
  inoculum_size: 10 percent total; members combined 1:1:1 by OD600
  vessel_type: Hungate tubes
  preparation_notes: The medium used Starkey-like inorganic nutrients, with MgCl2 replacing MgSO4; cultures contained 10 mL and were incubated without shaking.
  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth medium (glucose–yeast extract (GY) medium) used for studying monocultures and co-cultures was prepared with glucose (14 mmol.L−1) and 0.1% yeast extract
    explanation: Supports the named medium and its two quantified organic components.
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All monocultures and co-cultures were carried out in anaerobic conditions in Hungates tubes with 10 mL of GY medium as describe above and incubated at 37 °C without shaking.
    explanation: Supports the vessel, volume, atmosphere, temperature, and agitation.
