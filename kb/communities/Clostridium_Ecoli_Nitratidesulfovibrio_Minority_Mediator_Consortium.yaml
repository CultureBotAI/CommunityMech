ecological_interactions:
- name: Fluorescent-Label Exchange and Proposed Minority-Member Shuttle
  description: PARTIAL - confocal experiments using calcein-labeled C. acetobutylicum, mCherry-expressing E. coli
    and initially unlabeled N. vulgaris support exchange of fluorescent cytoplasmic labels. The authors propose
    that N. vulgaris acts as a shuttle between the other members. This does not identify a growth-supporting metabolite
    or establish that label exchange causes the growth benefit; the two rod-shaped partners are not readily distinguishable
    by morphology.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41684672
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Confocal microscopy confirmed that N. vulgaris exchanges cytoplasmic material with both C. acetobutylicum
      and E. coli bidirectionally, suggesting its role as a mediator in the consortium.
    explanation: Supports observed label exchange and the authors' mediator interpretation, not necessity or sufficiency
      of a physical shuttle for growth protection.
  - reference: PMID:41684672
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Thus, N. vulgaris may function as a shuttle between E. coli and C. acetobutylicum.
    explanation: The source explicitly proposes a shuttle; fluorescent labeling is not a nutrient-flux or growth-mediator
      intervention.
- name: E. coli-associated inhibition of C. acetobutylicum
  description: PARTIAL - the E. coli/C. acetobutylicum culture has a slower second OD600 growth phase attributed
    to C. acetobutylicum, while the early E. coli phase appears unaffected. The authors call the relationship passive
    competition, but reciprocal negative effects required by the local COMPETITION type are not established. Glucose
    depletion, acidification, added metabolites and filtered supernatants do not reproduce every live-coculture
    feature; the inhibition mechanism remains incompletely resolved.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli DH10B
    term:
      id: NCBITaxon:316385
      label: Escherichia coli str. K-12 substr. DH10B
  target_taxon:
    preferred_term: Clostridium acetobutylicum ATCC 824
    term:
      id: NCBITaxon:272562
      label: Clostridium acetobutylicum ATCC 824
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41684672
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The results indicate that E. coli engages in passive competition with C. acetobutylicum
    explanation: Retains the authors' terminology as an interpretation. Their early E. coli measurements do not
      demonstrate a negative effect on both partners, as the local COMPETITION enum requires.
  - reference: PMID:41684672
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: the presence of N. vulgaris could prevent the inhibition of C. acetobutylicum growth by E. coli
    explanation: The addition comparison supports attenuation of the second-phase inhibition, not an arrow asserting
      that inhibition itself causes protection.
- name: E. coli-to-Clostridium lactate cross-feeding
  description: C. acetobutylicum consumes E. coli-associated lactate in the binary coculture and in filtered E.
    coli supernatant. These complementary assays support extracellular lactate cross-feeding. They do not quantify
    every donor-resolved carbon flux or identify lactate as the unique cause of the hydrogen-yield changes.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli DH10B
    term:
      id: NCBITaxon:316385
      label: Escherichia coli str. K-12 substr. DH10B
  target_taxon:
    preferred_term: Clostridium acetobutylicum ATCC 824
    term:
      id: NCBITaxon:272562
      label: Clostridium acetobutylicum ATCC 824
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the utilization of lactate by C. acetobutylicum is observed in both conditions, i.e., in the consortia
      C. acetobutylicum E. coli and C. acetobutylicum in E. coli's supernatant
    explanation: Supports consumption by C. acetobutylicum of an E. coli-associated extracellular metabolite.
- name: Nitratidesulfovibrio-Associated Recovery of Second-Phase Growth
  description: Adding N. vulgaris restores a faster second mixed-culture OD600 phase, with author-reported doubling
    estimates of 5.5 h versus 9 h in the E. coli/C. acetobutylicum culture. Separate genomic qPCR supports the growth-phase
    assignment, but copies per ng DNA are not direct live-cell counts. Filtered N. vulgaris/E. coli supernatant
    also improves C. acetobutylicum growth without simultaneous contact with that recipient. The soluble factor
    and any necessity of cytoplasmic exchange remain unresolved; faster liquid-culture growth is not itself a colonization
    assay.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the presence of N. vulgaris could prevent the inhibition of C. acetobutylicum growth by E. coli
    explanation: Supports the three-member addition comparison; the reported doubling estimates refer to the second
      mixed-culture optical-density phase, not directly counted taxon-specific divisions.
  - reference: PMID:41684672
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: N. vulgaris emerges as an unexpected mediator and protector
    explanation: The abstract summarizes the mediator/protector interpretation; the main-body supernatant control
      supports a soluble effect but does not identify the causal molecule or require a shuttle.
  - reference: PMID:41684672
    snippet: C. acetobutylicum growth is also considerably enhanced in the supernatant of N. vulgaris/E. coli
    explanation: Supports a growth-promoting effect in cell-free spent medium, without simultaneous contact between
      the recipient and its neighbors.
    evidence_source: IN_VITRO
    supports: SUPPORT
