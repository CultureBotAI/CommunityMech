  evidence:
  - reference: PMID:41684672
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the utilization of lactate by C. acetobutylicum is observed in both conditions, i.e., in the consortia C. acetobutylicum E. coli and C. acetobutylicum in E. coli's supernatant
    explanation: Supports consumption by C. acetobutylicum of an E. coli-associated extracellular metabolite.
