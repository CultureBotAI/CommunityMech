id: CommunityMech:000211
name: Synechococcus-Shewanella D-Lactate Biophotovoltaic Consortium
description: >
  A two-species engineered biophotovoltaic consortium pairing engineered
  Synechococcus elongatus UTEX 2973 with engineered Shewanella oneidensis MR-1.
  The cyanobacterium converts light and carbon dioxide into D-lactate, and the
  exoelectrogenic Shewanella partner oxidizes D-lactate and transfers electrons
  to an anode. The system is relevant to DOE bioenergy and bioelectrochemical
  research because it demonstrates division of labor for renewable electricity
  production from photosynthesis, metabolite transfer, and extracellular electron
  transfer.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Build a durable biophotovoltaic consortium by separating photosynthetic
    light harvesting from extracellular electron transfer.
  assembly_strategy: Pair D-lactate-producing S. elongatus UTEX 2973 Syn2973-omcS-ldh
    with a S. oneidensis MR-1 napA deletion mutant in an electrochemical device.
  perturbation_design: Compare temporal separation, spatial separation, and spatial-temporal
    separation with medium replenishment to manage oxygen, light stress, and electron flow.
  measurement_endpoints:
  - Current density
  - Power density
  - D-lactate production
  - Coculture operating lifetime
  - Dissolved oxygen and light stress responses
  evidence:
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic two-species microbial consortium is designed and constructed for electricity production from light
    explanation: Supports the overall engineering objective and synthetic two-species design.
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: directing solar energy from photons to D-lactate, then to electricity
    explanation: Supports the intended constrained electron-flow design.
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: spatial-temporal separation setup with medium replenishment enables stable operation for over 40 days
    explanation: Supports the device-level perturbation strategy and long-duration operation.
