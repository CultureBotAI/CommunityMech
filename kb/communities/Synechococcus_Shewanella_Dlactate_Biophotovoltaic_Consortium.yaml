- name: Spatial-Temporal Separation for Compatibility
  description: Light and oxygen produced during photosynthesis damaged or inhibited S. oneidensis,
    so temporal and spatial separation protected the exoelectrogenic partner while allowing D-lactate
    transfer to support durable power generation.
  interaction_type: COLONIZATION_FACILITATION
