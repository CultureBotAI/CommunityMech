  chebi_term:
    id: CHEBI:15361
    label: pyruvate
  relevance: >
    Shewanella oxidizes lactate to pyruvate via its D- and L-lactate dehydrogenases
    during D-lactate utilization.
  evidence:
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: responsible for oxidizing lactate to pyruvate
    explanation: Names pyruvate as the product of Shewanella lactate oxidation.
- preferred_term: acetate
  chebi_term:
    id: CHEBI:30089
    label: acetate
  relevance: >
    Faraday efficiency was computed from the maximal oxidation of D-lactate to acetate,
    naming acetate as the reference oxidation endpoint.
  evidence:
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the oxidation of d-lactate to acetate
    explanation: Names acetate as the D-lactate oxidation endpoint used for efficiency calculation.
- preferred_term: potassium ferricyanide
  chebi_term:
    id: CHEBI:30060
    label: potassium hexacyanoferrate(3-)
  relevance: >
    Potassium ferricyanide is the cathodic electron acceptor and a common BPV electron
    mediator that proved light-sensitive and toxic to cells in this study.
  evidence:
  - reference: PMID:31537786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a common electron mediator, potassium ferricyanide
    explanation: Names potassium ferricyanide as the electron mediator used in the system.
