id: CommunityMech:000418
name: Staged Ensifer-Bacillus Cattle-Manure Wastewater SynCom
description: A defined two-member staged consortium, SYC, pairing the heterotrophic ammonia-oxidizing core strain Ensifer
  sp. S2-8-1 with an auxiliary Bacillus subtilis strain to convert cattle manure wastewater into a bioactive fermentation
  broth for maize growth promotion. The primary study compared an S2-8-1 monoculture, simultaneous co-culture, and the staged
  consortium, and reported that SYC had the best overall performance, enhanced rhizosphere nitrification, increased NO3--N
  availability, promoted maize growth, and increased whole-plant dry matter in a soil-maize pot experiment.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Stage Ensifer sp. S2-8-1 and Bacillus subtilis so cattle manure wastewater is converted into a stable, bioactive
    fermentation broth for compound microbial fertilizer development.
  assembly_strategy: Use Ensifer sp. S2-8-1 as the core strain, Bacillus subtilis as the auxiliary strain, and compare S2-8-1
    monoculture, simultaneous co-culture, and a staged consortium named SYC.
  perturbation_design: Compare staged SYC to a monoculture and simultaneous co-culture, then assay the resulting fermentation
    broth in a soil-maize pot experiment.
  measurement_endpoints:
  - viable bacterial density
  - rhizosphere nitrification
  - NO3--N availability
  - maize whole-plant dry matter
  - photosynthetic performance
  - cytokinin accumulation
  - metatranscriptomic response of heterotrophic ammonia oxidation and cytokinin-related genes
  evidence:
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study aimed to develop a low-cost and stable microbial consortium for converting cattle manure wastewater
      into a bioactive fermentation broth
    explanation: Supports the engineered wastewater-valorization objective for the consortium.
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The heterotrophic ammonia-oxidizing bacterium Ensifer sp. S2-8-1 was used as the core strain, and Bacillus subtilis
      was employed as the auxiliary strain.
    explanation: Identifies the two-member composition and their design roles.
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Three cultivation systems were compared: S2-8-1 monoculture, simultaneous co-culture, and a staged consortium
      (SYC).'
    explanation: Supports the staged consortium design relative to monoculture and simultaneous co-culture controls.
