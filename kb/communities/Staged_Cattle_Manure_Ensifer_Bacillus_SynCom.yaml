ecological_interactions:
- name: Staged cattle-manure wastewater valorization
  description: The staged two-member SYC consortium converted cattle manure wastewater into stable bioactive fermentation
    broth and maintained stronger viable bacterial density than the S2-8-1 monoculture or simultaneous co-culture.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among them, SYC exhibited the best overall performance, maintaining the highest viable bacterial density
    explanation: Supports the staged consortium as the best-performing cultivation system.
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The staged "pre-modification followed by synergy" consortium effectively converts cattle manure wastewater into
      a stable and bioactive fermentation broth
    explanation: Supports conversion of cattle manure wastewater by the staged consortium.
- name: SYC rhizosphere nitrification and maize promotion
  description: Fermentation broth from SYC increased rhizosphere nitrification, nitrate availability, photosynthetic performance,
    cytokinin accumulation, and maize whole-plant dry matter in a soil-maize pot experiment.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
