      label: nitrate
  evidence:
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SYC significantly enhanced rhizosphere nitrification, increased NO3--N availability, and promoted maize growth
    explanation: Supports the pot-experiment nitrogen and maize-growth effects of SYC.
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: resulting in a 41.4% increase in whole-plant dry matter compared with the water control
    explanation: Quantifies the maize dry-matter increase after SYC treatment.
- name: S2-8-1 nitrogen and cytokinin-related gene upregulation
  description: Comparative metatranscriptomics under SYC conditions found significant upregulation of S2-8-1 heterotrophic
    ammonia oxidation-related genes and cytokinin-related genes.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42341825
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Comparative metatranscriptomic analysis revealed significant upregulation of heterotrophic ammonia oxidation-related
      genes (CYP450) and cytokinin-related genes (miaA and LOG) in S2-8-1 under SYC conditions
    explanation: Supports S2-8-1 transcriptional activation in the staged consortium.
