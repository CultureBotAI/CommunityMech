ecological_interactions:
- name: Three-Species Anode Biofilm Formation
  description: The three-member culture formed a stable anode-associated biofilm under the tested bioelectrochemical
    conditions. Coexistence on the electrode supports this community observation, but does not by itself establish
    that one member facilitated another's colonization or that every member contributed equally.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Higher Current in the Three-Species Coculture
    description: 'PARTIAL: the anode-associated community provides the setting for the measured mixed-culture electron
      transfer. The study does not independently isolate biofilm formation or architecture as the cause of the current
      increment over solitary cultures.'
  evidence:
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: organisms build a stable biofilm on an electrode surface
    explanation: Supports formation of the mixed anode biofilm, not an isolated colonization-facilitation mechanism.
- name: Coculture-Associated Metabolic Responses
  description: Shewanella oneidensis and Geobacter sulfurreducens upregulated central-metabolism and electron-transfer-associated
    transcripts in the three-species coculture comparison. This supports the authors' positive-interaction hypothesis,
    but is not a two-member perturbation experiment or a direct demonstration of reciprocal fitness benefit.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Higher Current in the Three-Species Coculture
    description: 'HYPOTHESIZED: the coculture-associated metabolic responses may contribute to increased electron
      transfer. Transcript abundance and current covary, but the proposed interaction pathways were not individually
      perturbed to establish their causal contribution.'
  evidence:
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transcriptomic results point toward a positive interaction among the individual strains
    explanation: Supports a positive interaction among members in the mixed-species biofilm.
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: S. oneidensis and G. sulfurreducens upregulated their central metabolisms
    explanation: Supports a mixed-species metabolic response by S. oneidensis and G. sulfurreducens.
  participating_taxa:
  - preferred_term: Shewanella oneidensis
    term:
      id: NCBITaxon:70863
      label: Shewanella oneidensis
  - preferred_term: Geobacter sulfurreducens
    term:
      id: NCBITaxon:35554
      label: Geobacter sulfurreducens
- name: Higher Current in the Three-Species Coculture
  description: The three-species coculture produced more current than each solitary culture in the study-specific
    reactor and feeding comparisons. Retain this measured positive community result without treating it as proof
    of superadditivity, reciprocal fitness benefit or a resolved syntrophic product-removal feedback. The proposed
    interaction mechanisms remain distinct from the electrical endpoint.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: During solitary growth, each of the strains produced less current than that from coculture conditions
    explanation: Direct primary result supporting the current comparison; a brief selected excerpt, not independently
      cached full text.
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: positive interactions that might lead to accelerated electron transfer
    explanation: Supports the authors' proposed positive-interaction mechanism, not an individually isolated mediator.
