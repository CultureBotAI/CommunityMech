id: CommunityMech:000177
name: Shewanella-Geobacter Three-Species Exoelectrogenic Biofilm Community
description: >
  A defined three-species anode-associated exoelectrogenic biofilm community composed of
  Shewanella oneidensis, Geobacter sulfurreducens, and Geobacter metallireducens. The
  community was assembled to study biofilm formation dynamics, strain interactions, redox
  potential resilience, and electron transfer activity in bioelectrochemical systems.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Build a tractable multispecies exoelectrogenic biofilm for studying interactions,
    biofilm dynamics, and electrical activity in bioelectrochemical reactors.
  assembly_strategy: Bottom-up three-member biofilm assembled from exoelectrogenic Shewanella
    and Geobacter species on an anode surface.
  perturbation_design: Applied anode potential was varied to test biofilm resilience and electron
    transfer activity.
  measurement_endpoints:
  - Biofilm formation on electrode surfaces
  - Current density and electron transfer rate
  - Redox-potential resilience
  - Transcriptomic response under mixed-species conditions
  evidence:
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: model multispecies biofilm comprising three exoelectrogenic proteobacteria
    explanation: Supports the engineered multispecies exoelectrogenic-biofilm design.
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: biofilm formation dynamics, the interactions between the organisms
    explanation: Supports the design objective and interaction-focused measurements.
  - reference: PMID:28087529
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: consequence of the applied anode potential
    explanation: Supports anode potential as the experimental perturbation.
