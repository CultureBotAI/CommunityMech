ecological_interactions:
- name: Box-Behnken optimized in vitro fiber degradation
  description: The five-strain Group 41 formulation of SynCom 3 produced the highest 48 h neutral-detergent-fiber degradation
    in the Box-Behnken in vitro screen and exceeded the sterile-water control by 20.56%.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  downstream:
  - target: In situ cattle rumen fermentation shift
    description: The Group 41 strain ratio was carried into the fistulated-cattle dosing assay.
  evidence:
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Group 41, consisting of 1 × 108 CFU/mL of S. equinus 5640 and E. lactis 6088, 1 × 106 CFU/mL of P. mucosa 6360,
      and 1 × 105 CFU/mL of L. delbrueckii 5812 and P. acetatigenes 6076, achieved the highest 48 h NDFD (66.84%), significantly
      higher than the control group by 20.56%, but had no difference in 48 h DMD and gas production (P < 0.05, Fig.  6 C).
      The results demonstrated that favorable concentrations and ratios of strains in SynComs are more effective in promoting
      fermentation performance and facilitating industrial application.
    explanation: Supports the optimized five-strain Group 41 formulation and its 48 h in vitro NDFD improvement.
- name: Genome-annotated carbohydrate-active enzyme complement
  description: Whole-genome sequencing of the five SynCom 3 strains supported a broad carbohydrate-degradation enzyme repertoire,
    including glycoside hydrolases, carbohydrate-binding modules, carbohydrate esterases, and KEGG enzymes linked to cellulose,
    hemicellulose, pectin, glucose, and volatile-fatty-acid metabolism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The fiber degrading strains S. equinus 5640, L. delbrueckii 5812, P. acetatigenes 6076, E. lactis 6088, and P.
      mucosa 6360 had whole genome sequencing at Biozeron.
    explanation: Identifies the five SynCom strains sequenced for whole-genome functional annotation.
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Genome sequence analysis revealed the synergistic and complementary actions of these five bacterial strains in
      carbohydrate degradation processes.
    explanation: Supports the genome-annotation inference of complementary carbohydrate-degradation processes.
- name: In situ cattle rumen fermentation shift
  description: Supplementing fistulated Huaxi cattle with the five-strain optimized SynCom altered rumen fermentation and
    trended toward higher DM, NDF, and ADF degradation at 72 h, with significant VFA and NH3-N shifts.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The in situ feeding trial demonstrated that the supplementation of the SynCom significantly altered the rumen
      fermentation profile and enhanced feed fiber degradation in Huaxi cattle. The ruminal degradation rates of DM, NDF,
      and ADF exhibited a positive trend in the TRE group, with increases of 2.61%, 7.81%, and 11.47%, respectively, at 72 h
      compared to the CON group, although these differences were not statistically significant (Fig.  8 A–C, P > 0.05). SynCom
      supplementation profoundly influenced ruminal VFA production. While the total VFA concentration in the TRE group was
      significantly lower than in the CON group at 12 h (Fig.  8 F, P = 0.0011), it increased progressively over time, becoming
      significantly higher in the TRE group at 24 h (P = 0.0196) and 48 h (P = 0.0001), and remaining 10.80% higher at 72 h
      (P > 0.05). This shift was driven by a significantly elevated acetate concentration in the TRE group at 24, 48, and
      72 h (Fig.  8 G, P < 0.05), with no significant difference observed in propionate levels. Consequently, the A:P ratio
      was significantly elevated in the treatment group at 48 h and 72 h (Fig.  8 M, P < 0.05). The concentrations of butyrate,
      isobutyrate, and isovalerate in the TRE group were also significantly higher than in the CON group at 24 and 48 h (Fig. 
      8 I, J, and L, P < 0.05). In contrast, valerate concentration in the TRE group was significantly lower than in the CON
      group at 48 h (Fig.  8 K, P = 0.0013) and 72 h (Fig.  8 K, P < 0.0001). Concomitantly, the NH3-N concentration was significantly
      lower in the TRE group at 48 h and 72 h (Fig.  8 E, P< 0.0001 and P = 0.0034, respectively), implying improved nitrogen
      utilization by the rumen microbiota.
    explanation: Supports the in situ rumen response to the optimized SynCom.
growth_media:
- name: Total-mixed-ration rumen-fluid in vitro fermentation medium
  temperature: 39
  temperature_unit: °C
  atmosphere: ANAEROBIC
  inoculum_size: '1'
  inoculum_unit: mL mixed SynCom suspension
  incubation_time: '48'
  incubation_time_unit: h
  vessel_type: 100 mL sealed glass bottle
  preparation_notes: Each 100 mL bottle contained 0.75 g ground TMR substrate, 45 mL pre-warmed fermentation medium, 15 mL
    filtration-sterilized rumen fluid, and 1 mL bacterial suspension or sterile-water control.
  evidence:
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Glass bottles (100 mL) were prepared with 0.75 g of ground TMR substrate (Table S4), 45 mL of pre-warmed fermentation
      medium (Table S5), and 15 mL of filtration-sterilized rumen fluid. Each bottle was inoculated with 1 mL of 1 × 107 CFU/mL
      of the following strains: B. subtilis 5632, S. equinus 5640, S. pluranimalium 5823, S. infantarius 6074, L. delbrueckii
      5812, P. mucosa 6360, S. condimenti 5845, E. gallinarum 6392, A. glycerinitolerans 6345, E. lactis 6088, C. pasinlerensis
      5847, L. pontis 5897, and P. acetatigenes 6076. All bacterial suspensions underwent centrifugation (12,000 × g, 10 min)
      to remove the culture medium, after which the resulting cell pellets were resuspended in an equivalent volume of sterile
      water. 1 mL of sterile water was utilized as the negative control (CON). All bottles were sealed with a rubber stopper
      and aluminum crimp cap immediately after loading and were incubated at 39 °C for 48 h'
    explanation: Supports the TMR substrate, fermentation-medium, rumen-fluid, inoculum, sealed-bottle, and 39 C incubation
      setup.
