id: CommunityMech:000398
name: Optimized Rumen Fiber-Degrading SynCom 3
description: A five-strain synthetic rumen bacterial consortium optimized from dairy-cattle culturomics isolates to increase
  fiber degradation of a total-mixed-ration substrate. The Streptococcus equinus 5640, Lactobacillus delbrueckii 5812, Proteiniphilum
  acetatigenes 6076, Enterococcus lactis 6088, and Petrimonas mucosa 6360 SynCom 3 derivative was dose-optimized by a Box-Behnken
  in vitro design and then dosed into fistulated Huaxi cattle as a mixed bacterial suspension.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Mine fiber-degrading dairy-cow rumen isolates and construct a dose-optimized five-member SynCom 3 to increase
    total-mixed-ration fiber degradation.
  assembly_strategy: Use 16S rRNA profiles, culturomics, cellulase and reducing-sugar screens, single-strain in vitro rumen
    fermentation, four seven-strain SynCom designs, and a 41-run Box-Behnken design to choose and dose five key fiber-degrading
    strains.
  inoculation_strategy: For the in situ cattle test, centrifuge the five optimized strains, resuspend cell pellets in sterile
    water, and administer 500 mL of mixed bacterial suspension into the rumen.
  measurement_endpoints:
  - 48 h in vitro dry-matter degradation, neutral-detergent-fiber degradation, acid-detergent-fiber degradation, gas production,
    pH, microbial crude protein, NH3-N, and volatile fatty acids
  - in situ dry-matter, neutral-detergent-fiber, and acid-detergent-fiber degradation in nylon bags
  - rumen-fluid pH, NH3-N, total volatile fatty acids, acetate, propionate, butyrate, isobutyrate, valerate, and isovalerate
  - whole-genome COG, CAZy, and KEGG annotation of the five fiber-degrading strains
  evidence:
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: four SynComs were developed based on the abundance patterns derived from sequencing data, featuring highly efficient
      fiber degraders. Each bacterial suspension was prepared, and 1 mL of bacterial suspension from SynCom 1 to 4 was inoculated
      into the in vitro fermentation systems as previously described. Sterile water served as the negative control (CON).
      Rational design was employed to ensure the authenticity of SynComs. A three-factor Box–Behnken experimental design comprising
      41 combinations was used to assess the contribution of each strain
    explanation: Supports construction of four SynComs followed by a Box-Behnken dose-optimization design.
  - reference: doi:10.1186/s40168-025-02331-3
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: which received 500 mL of sterile water, and a treatment group (TRE), which received 500 mL of mixed bacterial
      suspension. The bacterial suspension contained S. equinus 5640 and E. lactis 6088 (1 × 109 CFU/mL each), P. mucosa 6360
      (1 × 107 CFU/mL), and L. delbrueckii 5812 and P. acetatigenes 6076 (1 × 106 CFU/mL each). The concentrations of the
      mixed bacterial suspension were formulated based on the results of a three-factor Box-Behnken design experiment, which
      determined the optimal ratio for synergistic effects.
    explanation: Supports the final 500 mL in situ rumen dosing strategy and the five strain-specific suspension concentrations.
