ecological_interactions:
- name: Six-strain SMC suppression of Fusarium crown rot
  description: The complete six-strain SMC was soil-drenched into nonsterile wheat pots after Fusarium pseudograminearum challenge
    and reduced the disease severity index relative to the pathogen-only treatment while sustaining plant growth.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: With SMC treatment, the DSI decreased to 25.93%, a 70.01% reduction relative to Fp, demonstrating marked control
      efficacy.
    explanation: Reports the Fusarium crown-rot disease-severity reduction in the SMC+Fp treatment.
- name: SMC-associated wheat rhizosphere remodeling
  description: The SMC shifted the resident wheat rhizosphere toward fungal and bacterial genera associated with antagonism,
    plant growth promotion, and nutrient supply under Fusarium challenge.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: regulation of defense response
    term:
      id: GO:0031347
      label: regulation of defense response
  evidence:
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SMC and SMC+Fp increased the relative abundances of growth-promoting and antagonistic genera, including Chaetomium,
      Trichoderma, and Mortierella.
    explanation: Supports SMC-associated remodeling of the resident fungal rhizosphere community.
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Full-length ITS and 16S profiling revealed that SMC suppressed pathogenic Fusarium in favor of beneficial fungi
      (Mortierella, Trichoderma, Chaetomium) and plant growth-promoting bacteria (Pseudomonas, Paenibacillus).
    explanation: Supports SMC-associated enrichment of resident fungal and bacterial taxa with plant-beneficial trait annotations.
growth_media:
- name: nonsterile wheat soil pot assay
  temperature: 25
  temperature_unit: °C
  light_regime: 16 h light / 8 h dark
  incubation_time: 45
  incubation_time_unit: days
  vessel_type: pot
  preparation_notes: Each pot contained 1,100 g of air-dried nonsterile soil. Fusarium pseudograminearum was applied first,
    and the SMC was inoculated one week later.
  evidence:
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Each pot contained 1,100 g of air-dried, nonsterile soil. The pot experiment was conducted in the plant tissue
      culture room at Xinjiang Normal University (25 °C; 16 h light/8 h dark photoperiod).
    explanation: Reports the nonsterile soil mass and controlled pot-assay light and temperature conditions.
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Fp was applied at 1 × 106 CFU mL–1, and the SMC was inoculated 1 week later.
    explanation: Reports the pathogen challenge timing relative to SMC inoculation.
- name: six-strain SMC liquid precultures
  temperature_unit: °C
  vessel_type: liquid preculture
  preparation_notes: T19 conidia were produced in carboxymethyl cellulose liquid medium at 28 °C for 5 d; each Bacillus member
    was grown in nutrient broth at 37 °C for 8 h, adjusted to OD600 0.1, and mixed with T19 by equal volume.
  evidence:
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Conidia of T. harzianum T19 were produced in carboxymethyl cellulose (CMC) liquid medium at 28 °C for 5 d, then
      filtered through four layers of sterile gauze.
    explanation: Reports the fungal CMC liquid preculture conditions.
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The five core bacterial strains were grown in nutrient broth (NB) at 37 °C for 8 h; each culture was adjusted
      to an OD600 of 0.1 and resuspended in sterile water.
    explanation: Reports the Bacillus nutrient-broth preculture conditions.
cultivation_setup:
- system_type: OTHER
  instrument_detail: plant tissue culture room with potted wheat in nonsterile soil
  operating_temperature: 25
  operating_temperature_unit: °C
  temperature_controlled: true
  controls_notes: 16 h light / 8 h dark photoperiod; randomized complete-block design with CK, Fp, SMC, and SMC+Fp arms.
  evidence:
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Wheat was grown under four treatments: sterile water control (CK), inoculation with F. pseudograminearum (Fp),
      inoculation with the SynCom (SMC), and coinoculation with Fp and the SynCom (SMC+Fp).'
    explanation: Reports the four-arm pot-assay treatment structure.
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Pots were arranged in a randomized complete block design.
    explanation: Reports the pot layout as a randomized complete-block design.
