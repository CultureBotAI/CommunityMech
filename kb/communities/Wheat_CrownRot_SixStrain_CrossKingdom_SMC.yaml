id: CommunityMech:000414
name: Wheat Crown-Rot Six-Strain Cross-Kingdom SMC
description: A six-strain cross-kingdom wheat-rhizosphere synthetic microbial community that combined Trichoderma harzianum
  T19, Bacillus subtilis BS-Z15, Bacillus spizizenii PM9, Bacillus rugosus PM16, Bacillus rugosus S32, and Bacillus halotolerans
  S8 for nonsterile-soil wheat pot assays against Fusarium pseudograminearum Fusarium crown rot. Zhou et al. 2026 assembled
  the SMC from antagonistic, growth-promoting, and auxiliary wheat-rhizosphere isolates and compared sterile-water, Fusarium-only,
  SMC-only, and SMC-plus-Fusarium treatments for plant growth, disease severity, resident rhizosphere amplicon profiles, co-occurrence
  networks, and rhizosphere metabolomics.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Assemble a cross-kingdom synthetic microbial community that suppresses Fusarium pseudograminearum wheat crown
    rot while promoting wheat growth.
  assembly_strategy: Combine equal volumes of Bacillus subtilis BS-Z15, Bacillus spizizenii PM9, Bacillus rugosus PM16, Bacillus
    rugosus S32, Bacillus halotolerans S8, and Trichoderma harzianum T19 suspensions immediately before inoculation.
  inoculation_strategy: Produce T19 conidia in CMC liquid medium at 28 °C for 5 d, grow each Bacillus strain in nutrient broth
    at 37 °C for 8 h, resuspend the five bacterial cultures in sterile water after OD600 adjustment to 0.1, and mix equal
    volumes of the five bacterial suspensions with the T19 spore suspension to form the SMC.
  perturbation_design: Compare sterile-water, Fusarium pseudograminearum, SMC, and SMC+Fusarium treatments in nonsterile wheat
    pots arranged as randomized complete blocks.
  measurement_endpoints:
  - wheat Fusarium crown-rot disease severity index
  - wheat plant height, root length, stem diameter, biomass, chlorophyll, and thousand-kernel weight
  - rhizosphere soil physicochemical and enzyme activities
  - rhizosphere full-length 16S rRNA and ITS amplicon profiles
  - rhizosphere bacterial and fungal co-occurrence networks
  - rhizosphere soil metabolomics profiles
  evidence:
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: assembled a cross-kingdom synthetic microbial community (SMC) of Trichoderma harzianum T19 and five Bacillus
      strains and tested it in nonsterile soil challenged with Fusarium pseudograminearum.
    explanation: Identifies the SMC as T19 plus five Bacillus strains and the nonsterile Fusarium-challenged soil test system.
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Equal volumes of the five bacterial suspensions and the T19 spore suspension were then combined to constitute
      the SynCom SMC.
    explanation: Reports that the six separately prepared strain suspensions were mixed by equal volume to make the SMC.
  - reference: PMID:41504167
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on prior screening, we assembled an SMC comprising antagonists (T19 and BS-Z15), growth-promoting strains
      (PM9 and PM16), and auxiliary strains (S8 and S32) (Figure G).
    explanation: Describes the design roles assigned to the antagonistic, growth-promoting, and auxiliary member strains.
