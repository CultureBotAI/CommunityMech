id: CommunityMech:000420
name: PPCP Wastewater Sphingopyxis-Ochrobactrum-Apiotrichum SMC
description: A three-member synthetic microbial community comprising Sphingopyxis sp. GC21, Ochrobactrum sp. TCC-2, and
  Apiotrichum sp. IB-1. Xu et al. assembled the two bacterial strains and one fungal strain to enhance simultaneous removal
  of the pharmaceutical and personal care products chloramphenicol, triclocarban, and naproxen from simulated wastewater
  and real domestic wastewater under aerobic and anoxic conditions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Assemble a defined bacterial-fungal synthetic microbial community that improves simultaneous removal of
    chloramphenicol, triclocarban, and naproxen from domestic wastewater.
  assembly_strategy: Combine the bacterial strains Sphingopyxis sp. GC21 and Ochrobactrum sp. TCC-2 with the fungal strain
    Apiotrichum sp. IB-1 for PPCP-removal bioaugmentation of simulated and real wastewater reactors.
  perturbation_design: Test the three-member SMC against chloramphenicol, triclocarban, and naproxen in simulated wastewater
    and real wastewater under both aerobic and anoxic conditions.
  measurement_endpoints:
  - Chloramphenicol removal efficiency
  - Triclocarban removal efficiency
  - Naproxen removal efficiency
  - Persistence of introduced Sphingopyxis, Ochrobactrum, and Apiotrichum in the SMC reactor
  - Mobile genetic element, pathogen, and antibiotic resistance gene responses
  evidence:
  - reference: PMID:42526243
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SMC) comprising two bacterial strains (Sphingopyxis sp. GC21 and Ochrobactrum sp. TCC-2) and one fungal
      strain (Apiotrichum sp. IB-1)
    explanation: Supports the defined two-bacterium plus one-fungus construction of the PPCP-removal SMC.
  - reference: PMID:42526243
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: for the enhanced simultaneous removal of three representative PPCPs
    explanation: Supports the engineered wastewater PPCP-removal objective.
  - reference: PMID:42526243
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The relative abundance of introduced Sphingopyxis was 6.45%, Ochrobactrum was 0.23%, and Apiotrichum was
      51.06%
    explanation: Supports persistence of all three introduced genera in the SMC reactor.
  - reference: PMID:42526243
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SMC alleviated the selection pressure imposed by pollutants, thereby reducing the enrichment of mobile genetic
      elements and pathogens and suppressing the dissemination of ARGs.
    explanation: Supports the mobile genetic element, pathogen, and antibiotic resistance gene response endpoint.
