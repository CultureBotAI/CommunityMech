ecological_interactions:
- name: SynCom restriction of rice arsenic accumulation
  description: >-
    Inoculation with the Priestia flexa and Pseudomonas putida SynCom
    substantially reduced arsenic accumulation in rice roots, shoots and grains
    by coordinating down-regulation of arsenic-transporter genes that drive
    arsenic uptake and internal translocation.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to toxic substance
    term:
      id: GO:0009636
      label: response to toxic substance
  evidence:
  - reference: PMID:42691895
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      SynCom substantially reduced arsenic accumulation in roots, shoots and
      grains by coordinate downregulation of arsenic transporter genes
    explanation: >-
      Links the whole SynCom to lowered arsenic accumulation and to suppression
      of rice arsenic-transporter gene expression.
  - reference: PMID:42691895
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Lsi1, Lsi2, Lsi3, OsNIP1;1, and OsNIP3;3
    explanation: Names the rice arsenic-transporter genes that were coordinately down-regulated by SynCom treatment.
- name: SynCom restoration of rice stress physiology
  description: >-
    The two-member SynCom restored host photosynthetic and metabolic function
    under arsenic exposure, with improved photosynthesis, increased soluble
    sugars, reduced proline accumulation, and suppression of overactive
    antioxidant-enzyme responses.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to stress
    term:
      id: GO:0006950
      label: response to stress
  evidence:
  - reference: PMID:42691895
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Inoculation with SynCom restored physiological function and metabolic
      balance, as evidenced by improved photosynthesis, increased soluble
      sugars, and reduced proline accumulation.
    explanation: >-
      Supports improved host photosynthetic and metabolic performance under
      arsenic stress after SynCom inoculation.
