id: CommunityMech:000341
name: Priestia-Pseudomonas Rice Arsenic-Stress SynCom
description: >-
  A defined two-member synthetic microbial community composed of Priestia flexa
  and Pseudomonas putida that mitigates arsenic toxicity in rice (Oryza sativa
  var. Sarju-52). In arsenite- and arsenate-stressed paddy-soil assays, SynCom
  inoculation restored plant photosynthetic and metabolic balance, limited
  oxidative-stress responses, reduced arsenic accumulation in roots, shoots and
  grains, and coordinately down-regulated rice arsenic-transporter genes
  including Lsi1, Lsi2, Lsi3, OsNIP1;1, and OsNIP3;3.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Construct a defined bacterial SynCom that lowers arsenic uptake and grain
    accumulation in rice under paddy-soil arsenic stress.
  assembly_strategy: >-
    Combine Priestia flexa and Pseudomonas putida into a defined two-member
    synthetic microbial community for rice inoculation.
  perturbation_design: >-
    Compare arsenite and arsenate stress in rice with and without the
    two-member SynCom inoculum.
  measurement_endpoints:
  - Rice photosynthetic performance
  - Soluble sugars and proline accumulation
  - Antioxidant enzyme overactivation
  - Arsenic accumulation in roots, shoots and grains
  - Expression of arsenic-transporter genes Lsi1, Lsi2, Lsi3, OsNIP1;1, and OsNIP3;3
  - Metabolomic profiling of stress-associated metabolites and growth-related pathways
  notes: >-
    Curation is limited to abstract-supported species-level membership and host
    response endpoints because the full text is not open access in Europe PMC.
  evidence:
  - reference: PMID:42691895
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      a defined synthetic microbial community (SynCom) of Priestia flexa and
      Pseudomonas putida mitigates arsenic toxicity and restricts arsenic
      accumulation in rice
    explanation: Supports the exact two-member bacterial SynCom and its intended rice arsenic-mitigation function.
environment_term:
  preferred_term: paddy-rice plant-associated SynCom assay
  term:
    id: ENVO:01001001
    label: plant-associated environment
  notes: >-
    The two-member bacterial SynCom was assayed with rice under paddy-soil
    arsenic stress; the plant-associated environment term is used broadly
    because no narrower ENVO term captures the inoculated paddy-rice SynCom
    setup from the abstract.
