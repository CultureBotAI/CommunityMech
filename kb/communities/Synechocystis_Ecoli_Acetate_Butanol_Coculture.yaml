  downstream:
  - target: Acetate-Coupled 1-Butanol Production
    description: 'HYPOTHESIZED/PARTIAL: photosynthetically supplied acetate is a supported candidate carbon route to the observed
      E. coli 1-butanol output (with peaks on days 10 and 14). The experiment does not resolve the fraction of product carbon
      derived from acetate rather than secreted cyanobacterial carbohydrates or extracellular polysaccharides; production
      detection is not a quantified acetate-to-product flux.'
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: where no additional carbon source was used
    explanation: Supports Synechocystis-derived carbon as the designed organic carbon input during cocultivation.
  - reference: PMID:42726284
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Compared to the production of acetate in the axenic culture, less amount of acetate was measured in the co-culture
      with E. coli indicating acetate consumption.
    explanation: Lower extracellular acetate in the E. coli coculture relative to axenic Synechocystis supports heterotrophic
      acetate consumption but does not resolve transfer flux or carbon exclusivity.
  - reference: PMID:42726284
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: When it comes to the synthetic consortia, the consortium based on E. coli_Pem7_ButOH and WT_PKPa_RBS_BsPta_Δacs
      showed higher acetate than the one based on P. taiwanensis_Pem7_ButOH until day 14, and then the values are similar
      and eventually, after day 22 has a lower acetate concentration. The decrease in acetate is in general sharper in the
      case of E. coli_Pem7_ButOH compared to when P. taiwanensis_Pem7_ButOH was the bacterium in the consortium.
    explanation: Details the temporal profile of extracellular acetate depletion specifically in the E. coli_Pem7_ButOH consortium.
  - reference: PMID:42726284
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: we cannot conclude that the heterotrophic bacteria used acetate as the only source of carbon
    explanation: The authors explicitly retain secreted cyanobacterial carbohydrates and extracellular polysaccharides as
      possible additional carbon contributors.
- name: Acetate-Coupled 1-Butanol Production
  description: The engineered E. coli_Pem7_ButOH partner produced measurable 1-butanol during the 42-day, periodically replenished
    coculture with Synechocystis WT_PKPa_RBS_BsPta_Δacs, showing relatively high production peaks on days 10 and 14. Titers
    were not stable across the time course and reached a plateau; earlier acetate-adaptation assays improved heterotroph growth
    on low acetate without increasing 1-butanol production above pre-adaptation levels. This is a community production endpoint,
    not a second pairwise exchange, and product-carbon attribution to acetate remains unresolved.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: butan-1-ol
    term:
      id: CHEBI:28885
      label: butan-1-ol
  biological_processes:
  - preferred_term: acetate metabolic process
    term:
      id: GO:0006083
      label: acetate metabolic process
  - preferred_term: 1-butanol biosynthetic process
    term:
      id: GO:0071271
      label: 1-butanol biosynthetic process
  participating_taxa:
  - preferred_term: Synechocystis sp. PCC 6803 WT_PKPa_RBS_BsPta_Δacs
    term:
      id: NCBITaxon:1148
      label: Synechocystis sp. PCC 6803
  - preferred_term: Escherichia coli BL21(DE3) Pem7_ButOH
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Additionally, on specific days, for example on days 10 and 14, a relatively high production was noted in the
      consortium containing the E. coli_Pem7_ButOH while on days 20 and 26, P. taiwanensis_Pem7_ButOH showed high production.
    explanation: Supports measurable 1-butanol production in the E. coli_Pem7_ButOH consortium with high production peaks
      on days 10 and 14.
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the production was not stable in the systems but it clearly reached a plateau
    explanation: Bounds the coculture 1-butanol time course rather than claiming constant high output.
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 1-butanol production did not exceed the levels prior to adaptation
    explanation: Separates the earlier growth-adaptation finding from increased product formation.
