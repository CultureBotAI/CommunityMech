id: CommunityMech:000497
name: Synechocystis Escherichia coli Acetate-Butanol Coculture
description: A two-member photosynthetic synthetic consortium pairing acetate-secreting Synechocystis sp. PCC 6803 WT_PKPa_RBS_BsPta_Δacs
  with an Escherichia coli BL21(DE3) derivative (E. coli_Pem7_ButOH) engineered with the oxygen-tolerant TPC4 1-butanol pathway
  on the pPMQAK1 self-replicating vector under the Pem7 promoter. The coculture was grown for 42 days in closed, illuminated
  plug-sealed tissue culture flasks containing CoBG11 medium with repeated 10% medium replacement, added bicarbonate (50 mM
  final concentration), and HCl pH 7 adjustment without exogenous organic carbon. Compared with axenic Synechocystis controls,
  the E. coli coculture exhibited lower extracellular acetate levels with a sharper decrease after day 22 and produced measurable
  1-butanol with prominent peaks on days 10 and 14.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Couple photosynthetic CO2 fixation and acetate secretion by engineered Synechocystis sp. PCC 6803 to 1-butanol
    formation by an acetate-adapted engineered Escherichia coli BL21(DE3) heterotroph without adding exogenous organic carbon.
  assembly_strategy: Pair the acetate-producing WT_PKPa_RBS_BsPta_Δacs Synechocystis farmer (starting OD750 = 2.5 at coculture
    day 0) with E. coli_Pem7_ButOH (starting OD600 = 0.5, a 5:1 OD ratio), an Escherichia coli BL21(DE3) derivative carrying
    the oxygen-tolerant TPC4 1-butanol pathway on vector pPMQAK1 under the Pem7 promoter.
  perturbation_design: Compare the E. coli_Pem7_ButOH and P. taiwanensis_Pem7_ButOH acetate-to-butanol cocultures against
    an axenic Synechocystis culture while periodically replacing 10% of the medium (every 2nd day through day 30 and every
    4th day through day 42) during a 42-day illuminated closed-flask experiment.
  measurement_endpoints:
  - Escherichia coli CFU per mL
  - Synechocystis chlorophyll a concentration
  - acetate titer
  - 1-butanol titer
  notes: E. coli_Pem7_ButOH was adapted for growth on acetate in CoBG11 prior to cocultivation. Closed plug-sealed tissue
    culture flasks were applied because 1-butanol is volatile.
  evidence:
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, Escherichia coli and Pseudomonas taiwanensis were engineered to produce 1-butanol, an industrially
      relevant bulk chemical, and cultivated using acetate as the sole carbon source. These strains were then individually
      co-cultivated with the previously engineered Synechocystis strain, WT_PKPa_RBS_BsPta_Δacs, forming two distinct consortia
      that were maintained for 42 days.
    explanation: Defines the engineered Synechocystis-Escherichia coli acetate-to-1-butanol synthetic consortium alongside
      the parallel P. taiwanensis consortium.
  - reference: PMID:42726284
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In one triplicate, E. coli_Pem7_ButOH with OD600 = 0.5 was added and in second P. taiwanensis_Pem7_ButOH with
      the same starting OD600, and the last third triplicate was a monoculture of the cyanobacterium to monitor the acetate
      production in the same growth conditions. The OD750 of the cyanobacterium was 2.5, so the ratios of ODs between the
      organisms were 5 to 1.
    explanation: Documents the coculture day-0 starting ODs (Synechocystis OD750 = 2.5, E. coli_Pem7_ButOH OD600 = 0.5; 5:1
      ratio) and axenic control design.
