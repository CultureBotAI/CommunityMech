    explanation: Documents E. coli_Pem7_ButOH growth dynamics across the 42-day coculture with Synechocystis WT_PKPa_RBS_BsPta_Δacs.
ecological_interactions:
- name: Photosynthetic Acetate Supply To Escherichia coli
  description: 'The engineered Synechocystis partner supplies photosynthetic organic carbon to E. coli_Pem7_ButOH in the acetate-designed
    coculture cultivated without exogenous organic carbon. The heterotroph grows on acetate in separate monoculture assays,
    and extracellular acetate concentrations in the E. coli coculture were lower than in the axenic Synechocystis control
    with a sharp decrease after day 22. PARTIAL: these observations support heterotrophic acetate consumption in coculture
    but do not isotope-resolve carbon flux or exclude secreted cyanobacterial carbohydrates and extracellular polysaccharides
    as additional carbon sources. CO2/bicarbonate is the photosynthetic substrate, not the exchanged organic molecule.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Synechocystis sp. PCC 6803 WT_PKPa_RBS_BsPta_Δacs
    term:
