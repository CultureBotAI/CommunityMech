ecological_interactions:
- name: Carbon-for-Nitrogen Resource Trading
  description: M. vaginatus and Massilia sp. METH4 form a resource-trading mutualism under carbon- and
    nitrogen-limited conditions, with cyanobacterial photosynthate supporting the heterotroph and heterotrophic
    nitrogen acquisition supporting cyanobacterial growth.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Microcoleus vaginatus PCC 9802
    term:
      id: NCBITaxon:119532
      label: Microcoleus vaginatus
  target_taxon:
