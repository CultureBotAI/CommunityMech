environmental_factors:
- name: carbon and nitrogen limitation
  value: carbon-free and nitrogen-free BG11-based coculture condition
  description: Mutualistic growth was tested under conditions where the cyanobacterium lacked fixed nitrogen
    and the heterotroph lacked organic carbon.
  evidence:
  - reference: PMID:32968213
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: nitrogen-deplete (N−), carbon-free medium solid plates
    explanation: Supports carbon and nitrogen limitation as the coculture condition used for mutualism assays.
- name: urea availability
  value: low micromolar urea range tested as nitrogen source and transfer vehicle
  description: The urea-transfer study tested urea production, urea-responsive motility, and M. vaginatus
    growth on low micromolar urea.
  evidence:
  - reference: doi:10.1093/ismejo/wrae246
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: M. vaginatus PCC 9802 grows on urea down to the low micromolar range
    explanation: Supports urea availability as an experimentally relevant environmental factor.
- name: phototrophic incubation
  value: 23 C with white light and 14 h light/10 h dark cycle
  description: The cyanobacterial partner was maintained under illuminated phototrophic culture conditions
    before and during mutualism-related assays.
  evidence:
  - reference: doi:10.1093/ismejo/wrad029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 23°C, 18–20 μE m−2 s−1 of white light illumination and 14 h light/10 dark cycle
    explanation: Supports the temperature and light regime used for M. vaginatus PCC 9802 culture.
growth_media:
