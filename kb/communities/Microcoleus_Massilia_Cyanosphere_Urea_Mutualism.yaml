      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Carbon-for-Nitrogen Resource Trading
    description: PARTIAL - Coculture-associated urea release and cyanobacterial low-concentration urea utilization
      provide a plausible, experimentally supported route for the nitrogen side of carbon-for-nitrogen trading.
      Coordinated expression supports Massilia-to-Microcoleus transfer, but exclusive donor attribution and the
      fraction of growth sustained by this route are not directly resolved.
  evidence:
  - reference: doi:10.1093/ismejo/wrae246
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: M. vaginatus and Massilia sp. METH4 in co-culture on N and C free media
    explanation: Supports the exact two-member coculture condition used to test mutualistic exchange. Full Results
      also reports increased extracellular urea in coculture and growth on supplied urea; the authors explicitly
      qualify donor attribution. Expression and pool measurements are not a traced transfer flux.
  - reference: doi:10.1093/ismejo/wrae246
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: these results are consistent with the notion that urea is likely the vehicle for interspecies N transfer
    explanation: Supports urea as the inferred nitrogen-transfer metabolite between the partners. Full Results also
      reports increased extracellular urea in coculture and growth on supplied urea; the authors explicitly qualify
      donor attribution. Expression and pool measurements are not a traced transfer flux.
- name: GABA and Glutamate Spatial Signaling
  description: GABA and glutamate released by C-limited Massilia sp. METH4 and N-starved M. vaginatus influence
    cyanobacterial motility and bundling. Addition experiments establish N-dependent chemokinetic and chemophobic
    responses, not measured Massilia migration; PCC 9802 did not show true chemotaxis to glutamate. Natural-bundle
    assays additionally measure gliding reversals, a response poorly retained in the long-cultured PCC 9802 strain.
    Low GABA can stabilize bundles, whereas high GABA can destabilize natural bundles, so increasing signal is not
    uniformly beneficial. The proposed benefit to carbon-for-nitrogen exchange is spatial retention near heterotrophic
    partners, not a directly measured flux increase.
  interaction_type: COLONIZATION_FACILITATION
