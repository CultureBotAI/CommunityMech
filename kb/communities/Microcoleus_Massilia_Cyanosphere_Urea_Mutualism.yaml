    term:
      id: NCBITaxon:149698
      label: Massilia
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
    notes: Inorganic carbon fixed by the cyanobacterial phototroph before transfer as organic carbon.
  biological_processes:
