  temperature: '23'
  temperature_unit: C
  atmosphere: AEROBIC
  light_regime: 14 h light/10 h dark cycle
  vessel_type: solid plate or liquid coculture assay
  preparation_notes: M. vaginatus PCC 9802 was maintained in 50% BG11 and shifted into nitrogen-limited
    BG11-based media; Massilia sp. METH4 was maintained on N-free Burks medium and paired with M. vaginatus
    under carbon- and nitrogen-free coculture conditions.
  evidence:
  - reference: doi:10.1093/ismejo/wrae246
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Axenic cyanobacterial cultures of M. vaginatus PCC 9802 and Synechocystis sp. PCC 6803 were maintained in 50% BG11 medium
    explanation: Supports BG11 as the maintenance medium for the cyanobacterial partner.
  - reference: doi:10.1093/ismejo/wrae246
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The heterotrophic mutualists Arthrobacter sp. O80, Bacillus sp. O64, and Massilia sp. METH4, originally isolated from the cyanosphere of M. vaginatus
    explanation: Supports the heterotrophic cyanosphere isolate source and maintenance context for Massilia sp. METH4.
