      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:32968213
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: allowing for copious growth of both partners under nitrogen-free, organic C-free conditions
    explanation: Supports mutualistic growth when neither partner has external organic carbon or fixed nitrogen.
  - reference: PMID:32968213
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: indicating that M. vaginatus was the source of organic carbon needed to complete the C for N mutualism
    explanation: Supports the direction of carbon transfer from M. vaginatus to the heterotrophic partner.
- name: Urea-Mediated Nitrogen Transfer
  description: In the M. vaginatus PCC 9802-Massilia sp. METH4 coculture, Massilia upregulates urea-biosynthesis
    functions while M. vaginatus upregulates urea uptake and urea carboxylase/allophanate hydrolase functions,
    supporting urea as the nitrogen-transfer vehicle.
