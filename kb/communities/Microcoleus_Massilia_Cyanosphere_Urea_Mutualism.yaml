ecological_interactions:
- name: Carbon-for-Nitrogen Resource Trading
  description: 'M. vaginatus PCC 9802 and Massilia sp. METH4 participate in selective carbon-for-nitrogen mutualism:
    coculture growth under organic-carbon and fixed-nitrogen limitation is consistent with photosynthate supporting
    the heterotroph and diazotrophic nitrogen acquisition supporting the cyanobacterium. The shared growth phenotype
    does not by itself identify the transferred organic-carbon compound or quantify partner-specific fluxes.'
