id: CommunityMech:000157
name: Microcoleus-Massilia Cyanosphere Urea Mutualism
description: >
  A defined biological soil crust cyanosphere coculture pairing the pioneer cyanobacterium
  Microcoleus vaginatus PCC 9802 with the heterotrophic cyanosphere isolate Massilia sp. METH4.
  Across repeated studies of the same exact strain pair, M. vaginatus provides photosynthetically
  fixed organic carbon while the diazotrophic Massilia partner supports nitrogen acquisition through
  a specific carbon-for-nitrogen mutualism, including urea-mediated nitrogen transfer and GABA/glutamate
  signaling that organizes close spatial association.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Reconstitute a biological soil crust cyanosphere carbon-for-nitrogen mutualism in vitro using
    cultured representatives of the M. vaginatus cyanosphere.
  assembly_strategy: Pair axenic Microcoleus vaginatus PCC 9802 with the cyanosphere-associated heterotrophic
    isolate Massilia sp. METH4 under carbon- and nitrogen-limited BG11-based conditions.
  perturbation_design: Compare nitrogen-replete, nitrogen-deplete, and carbon-free culture conditions and
    test nitrogen-source, urea, GABA, and glutamate effects on growth, gene expression, and spatial behavior.
  measurement_endpoints:
  - cyanobacterial and heterotrophic growth in carbon- and nitrogen-free coculture
  - urea-related gene expression
  - extracellular urea concentrations
  - GABA and glutamate signaling responses
  - bundle formation and motility behavior
  evidence:
  - reference: PMID:32968213
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We provide evidence for this by establishing such a symbiosis in culture and by showing
      that it is selective and dependent on nitrogen availability
    explanation: Supports the coculture design as an in vitro reconstruction of a selective cyanosphere
      symbiosis.
