    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the proximity of mutualistic diazotroph populations results in M. vaginatus bundle formation orchestrated through chemophobic and chemokinetic responses to gamma-aminobutyric acid (GABA) /glutamate (Glu) signals
    explanation: Supports GABA/glutamate signaling as a mechanism organizing the cyanosphere mutualism.
