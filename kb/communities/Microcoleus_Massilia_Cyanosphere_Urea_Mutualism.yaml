  downstream:
  - target: Carbon-for-Nitrogen Resource Trading
    description: PARTIAL - GABA/glutamate responses keep nitrogen-limited Microcoleus trichomes bundled near cyanosphere
      partners, providing spatial proximity expected to facilitate nutrient exchange. Signal-addition and cyanosphere-cleansing
      experiments support bundle organization, but the increase in carbon-for-nitrogen flux or fitness attributable
      to this organization was not directly quantified. The responding motile organism is Microcoleus, not demonstrated
      recruitment of motile Massilia.
  evidence:
  - reference: doi:10.1093/ismejo/wrad029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the proximity of mutualistic diazotroph populations results in M. vaginatus bundle formation orchestrated
      through chemophobic and chemokinetic responses to gamma-aminobutyric acid (GABA) /glutamate (Glu) signals
    explanation: Direct support for cyanobacterial motility and bundle organization, including natural-population
      experiments; not a measurement of partner-specific nutrient flux or Massilia motility.
  - reference: doi:10.1093/ismejo/wrad029
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Glutamate, by contrast, was only produced in measurable quantities by M. vaginatus PCC 9802 and Massilia
      sp. METH4
    explanation: Supports M. vaginatus PCC 9802 and Massilia sp. METH4 as contributors to the glutamate signaling
      pool.
