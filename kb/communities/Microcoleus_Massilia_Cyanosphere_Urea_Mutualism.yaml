- name: Urea-Mediated Nitrogen Transfer
  description: PARTIAL - Urea is a strongly supported likely nitrogen-transfer vehicle in the exact PCC 9802/METH4
    pair. Coculture increases extracellular urea release; METH4 upregulates urea-cycle genes and PCC 9802 upregulates
    uptake and urea carboxylase/allophanate hydrolase genes. PCC 9802 can grow on supplied urea down to 5 micromolar,
    but not 2 micromolar in the tested assay. These convergent results support cross-feeding without directly tracing
    the origin and assimilation of each urea molecule or proving urea is the exclusive nitrogen carrier. Release
    rates use total coculture biomass, because a heterotrophic origin of extracellular urea is inferred rather than
    absolutely resolved.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Massilia sp. METH4
    term:
      id: NCBITaxon:149698
      label: Massilia
  target_taxon:
    preferred_term: Microcoleus vaginatus PCC 9802
    term:
