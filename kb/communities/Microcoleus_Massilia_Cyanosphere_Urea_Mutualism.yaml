    evidence_source: IN_VITRO
    snippet: M. vaginatus and Massilia sp. METH4 in co-culture on N and C free media
    explanation: Supports the exact two-member coculture condition used to test mutualistic exchange.
  - reference: doi:10.1093/ismejo/wrae246
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: these results are consistent with the notion that urea is likely the vehicle for interspecies N transfer
    explanation: Supports urea as the inferred nitrogen-transfer metabolite between the partners.
- name: GABA and Glutamate Spatial Signaling
  description: Nitrogen-starved M. vaginatus and carbon-limited Massilia sp. METH4 produce GABA and glutamate
    signals that modulate M. vaginatus motility and bundle formation, optimizing close spatial organization
    for the mutualism.
  interaction_type: COLONIZATION_FACILITATION
