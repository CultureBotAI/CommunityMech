ecological_interactions:
- name: Genotype-Dependent Improvement of Seedling Quality and Survival
  description: >
    Two of three Eucalyptus genotypes showed improved seedling quality after inoculation, and one
    showed mortality fall from 21.8% to 6.7%. The benefit is therefore conditional on host genotype
    rather than a uniform property of the consortium.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42050290
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Two genotypes exhibited improved seedling quality, with a higher proportion classified
      into superior categories, and one genotype showed a significant reduction in mortality (from
      21.8% to 6.7%)
    explanation: PARTIAL - the host benefit is measured and quantified, but the paper does not
      identify which consortium members or mechanisms produce it, and the effect did not hold across
      all three genotypes.
environmental_factors:
- name: Root community restructuring without diversity change
  description: >
    Inoculation altered root microbial community structure while leaving bacterial richness and
    diversity unchanged, so the effect is compositional. This is recorded as a measured outcome
    rather than as a typed ecological interaction: the paper resolves neither which taxa were
    displaced nor which niches were divided, so NICHE_PARTITIONING would assert a mechanism the
    source does not establish.
  evidence:
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: While inoculation did not significantly affect bacterial richness and diversity, it
      altered the root microbial community structure
    explanation: States the compositional shift and the absence of a diversity change, which
      together are the community-level result of introducing the inoculant.
- name: Tree-nursery field trial
  value: three Eucalyptus clones; 13 weeks
  description: >
    The consortium was evaluated in a large field experiment in a commercial tree nursery rather
    than only in vitro, with root community and seedling outcomes assessed after 13 weeks.
  evidence:
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: After 13 weeks, we assessed microbial diversity, morphological seedling traits, and
      survival rates
    explanation: Records the trial duration and the endpoints measured in the nursery setting.
