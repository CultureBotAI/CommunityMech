id: CommunityMech:000316
name: Eucalyptus Nursery Five-Strain Bacterial Inoculant Consortium
description: >
  A five-strain synthetic consortium of Eucalyptus-derived bacteria — Bacillus subtilis,
  Paraburkholderia caribensis, Methylobacterium tardum, and two strains representing putative novel
  species in Paenibacillus and Mesorhizobium — assembled from isolates of Eucalyptus rhizosphere and
  roots and selected for complementary functional traits in nitrogen cycling and rhizosphere
  colonisation. Applied to three Eucalyptus clones in a large tree-nursery field experiment and
  assessed after 13 weeks, the inoculant did not change bacterial richness or diversity but did
  alter root microbial community structure; two genotypes showed improved seedling quality and one
  showed mortality fall from 21.8% to 6.7%. The record captures a case where a defined inoculant
  reshapes community composition and host outcome without shifting diversity metrics, and where the
  response is genotype-dependent rather than uniform.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Test whether a five-strain consortium of Eucalyptus-derived bacteria improves seedling
    quality and survival in commercial nursery production, and how it affects the root endophytic
    community.
  assembly_strategy: Combine one representative from each of five bacterial genera, isolated from
    Eucalyptus rhizosphere and roots and characterised in previous work, chosen for complementary
    traits in nitrogen cycling and rhizosphere colonisation; apply to three Eucalyptus clones in a
    tree nursery and profile roots by 16S rRNA metabarcoding at 13 weeks.
  measurement_endpoints:
  - Bacterial richness, diversity and root community structure
  - Morphological seedling traits and seedling quality classification
  - Seedling mortality
  evidence:
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The strains were selected to form a synthetic community based on their complementary
      functional traits related to nitrogen cycling and rhizosphere colonization
    explanation: States the selection principle behind the consortium, which is what makes it a
      designed community rather than a pooled isolate collection.
