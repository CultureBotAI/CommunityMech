ecological_interactions:
- name: Complementary Nitrogen-Phosphate Trait Pool
  description: The five bacterial inoculant members were selected using prior phosphate-solubilization screens,
    with nifH detected and indolic compounds produced by some candidates. These prior traits do not demonstrate
    nitrogen fixation in the nursery, specific indole-3-acetic acid exchange or persistence of each inoculant. The
    participants name the inoculant, not every member of the native root microbiome.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:18367
      label: phosphate(3-)
    notes: Prior phosphate-solubilization screening, not measured phosphate transfer or nursery flux.
  evidence:
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These bacteria were selected for their strong performance in phosphate solubilization tests, and some
      exhibited the presence of the nifH gene (indicating potential nitrogen-fixing capacity) as well as the production
      of indolic compounds
    explanation: Reports prior screening traits; nifH indicates potential, not measured nursery nitrogen fixation,
      and indolic compounds do not uniquely identify IAA.
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: direct nitrogen fixation was not measured in this study
    explanation: The source explicitly limits the functional interpretation.
  participating_taxa:
