- name: Root Endophytic Community Restructuring
  description: At 13 weeks, inoculation changed root community structure by PERMANOVA without significantly changing
    richness or Shannon diversity. No genus or phylum showed robust differential abundance after ANCOM-BC-2 sensitivity
    analysis; reported Mesorhizobium enrichment and Ralstonia reduction are exploratory, not proof of inoculant
    persistence or disease suppression. Endpoint profiles of 30 A/B-category seedlings do not resolve strain-specific
    colonization through time. Participants identify inoculant plus host context, not an exhaustive root community.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: While inoculation did not significantly affect bacterial richness and diversity, it altered the root
      microbial community structure
    explanation: 'States the compositional shift and the absence of a diversity change, which together define the
      measured community-level effect of introducing the inoculant.

      '
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: No taxa were identified as robustly differentially abundant after ANCOM-BC-2 sensitivity analysis
    explanation: Limits interpretation of the plotted taxon-level trends.
  participating_taxa:
  - preferred_term: Bacillus subtilis
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  - preferred_term: Paraburkholderia caribensis
    term:
      id: NCBITaxon:75105
      label: Paraburkholderia caribensis
  - preferred_term: Methylobacterium tardum
    term:
      id: NCBITaxon:374432
      label: Methylobacterium tardum
  - preferred_term: Paenibacillus sp. (putative novel species)
    term:
      id: NCBITaxon:44249
      label: Paenibacillus
  - preferred_term: Mesorhizobium sp. (putative novel species)
    term:
      id: NCBITaxon:68287
      label: Mesorhizobium
  - preferred_term: Eucalyptus (three clones)
    term:
      id: NCBITaxon:3932
      label: Eucalyptus
- name: Genotype-Dependent Improvement of Seedling Quality and Survival
  description: 'The nursery trial compared five-strain inoculation with a water control across three Eucalyptus
    genotypes. At 13 weeks, quality improvements were genotype-dependent: the reported nonviable/dead category fell
    from 21.8% to 6.7% for genotype Y, and genotype Z had improved quality. The operational dead category also included
    severe stem curvature greater than 45 degrees, so this is not exclusively literal mortality. Morphological responses
    were not uniformly positive across genotypes and traits. Host outcomes do not establish reciprocal bacterial
    fitness or a resolved microbial mediator.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Two genotypes exhibited improved seedling quality, with a higher proportion classified into superior
      categories, and one genotype showed a significant reduction in mortality (from 21.8% to 6.7%)
    explanation: Supports the reported host response; the main Methods operational definition includes severely
      curved seedlings in the dead category.
  - reference: PMID:42050290
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Seedlings exhibiting severe stem curvature (defined as a deviation greater than 45° from the vertical
      axis) or found dead during the evaluation period were counted as dead
    explanation: The full operational definition includes severely curved seedlings as well as dead seedlings; the
      reported category is broader than literal mortality.
  participating_taxa:
  - preferred_term: Bacillus subtilis
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
