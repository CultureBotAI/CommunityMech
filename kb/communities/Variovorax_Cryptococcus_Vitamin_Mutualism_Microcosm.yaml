discussions:
- discussion_id: variovorax-evidence-boundaries-batch117
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How much of the coculture benefit is mediated by each vitamin, and which quantitative values are reconciled?
  rationale: 'The abstract/discussion report 90-130-fold increases; the Fig.6 caption gives about 50-fold for yeast,
    while the bacterial Results densities imply a different ratio. Results describe Cryptococcus monoculture spent
    medium, whereas Methods describe final-passage coculture spent medium for quantification. No corrected value
    or uniquely resolved medium source is invented. Raw data and supplementary files were not audited. The controls
    support vitamin-dependent mutualism without establishing vitamin-only mediation or native bioreactor pairing.
    Supplementation/network metadata remains issue #1912.'
  attaches_to:
