- name: Bidirectional Vitamin Mutualism in Coculture
  description: Both isolates achieve higher viable cell densities in coculture than in monoculture over the reported
    serial-passage assay, supporting MUTUALISM under those conditions. Auxotrophy, supplementation and extracellular
