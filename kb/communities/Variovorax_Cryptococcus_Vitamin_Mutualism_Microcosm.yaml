    with thiamine supplementation and in coculture. Together these experiments support thiamine cross-feeding to
    this yeast. They do not validate every correlated auxotroph as a recipient. Cryptococcus was not included in
    the correlation network. The up-to-100 mg/L measurement belongs to a separate spent-medium-supplemented assay,
    not a measured concentration in the two-member coculture.
