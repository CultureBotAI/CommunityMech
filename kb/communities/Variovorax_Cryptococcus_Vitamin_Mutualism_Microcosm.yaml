id: CommunityMech:000213
name: Variovorax-Cryptococcus Vitamin Cross-Feeding Microcosm
description: >
  A two-member vitamin cross-feeding microcosm derived from mine tailings
  laboratory microbial consortia, in which a Variovorax species produces
  thiamine (vitamin B1) as a community hub for correlated thiamine auxotrophs
  and a Cryptococcus yeast supplies pantothenate (vitamin B5) required by
  Variovorax. Co-culture of the two members yielded a 90-130 fold fitness
  increase for both organisms, supporting the bidirectional vitamin-dependent
  mutualism predicted from metagenome-informed abundance correlation networks
  of mine-tailings-derived consortia grown under dozens of conditions.
related_ingredients:
- preferred_term: thiamine
  chebi_term:
    id: CHEBI:18385
    label: thiamine(1+)
  relevance: >
    Thiamine (vitamin B1) is the vitamin produced at high levels by the
    Variovorax hub and cross-fed to correlated thiamine auxotrophs, anchoring
    one direction of the validated vitamin mutualism.
  evidence:
  - reference: PMID:37553333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: high levels of thiamine production, up to 100 mg/L
    explanation: Quantifies thiamine production by Variovorax in minimal media.
- preferred_term: pantothenate
  chebi_term:
    id: CHEBI:7916
    label: pantothenic acid
  relevance: >
    Pantothenate (vitamin B5) is the B-vitamin produced by the Cryptococcus
    yeast and required for growth of Variovorax, supplying the reciprocal
    direction of the bidirectional vitamin cross-feeding mutualism.
  evidence:
  - reference: PMID:37553333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the B-vitamin pantothenate
    explanation: Names pantothenate as the B-vitamin produced by the Cryptococcus yeast.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Experimentally validate vitamin-dependent mutualistic interactions
    predicted from metagenome-informed organism abundance correlation networks
    in mine-tailings-derived microbial consortia.
  assembly_strategy: Pair a thiamine-producing Variovorax species with a
    pantothenate-producing Cryptococcus yeast as a minimal co-culture and
    measure fitness changes relative to monocultures.
  perturbation_design: Grow Variovorax in minimal media to quantify thiamine
    production, and compare Variovorax and Cryptococcus growth in mono- versus
    co-culture conditions to assess mutual fitness benefit.
  measurement_endpoints:
  - Thiamine production by Variovorax
  - Pantothenate requirement of Variovorax
  - Fitness change of each organism in mono- versus co-culture
  - Predictive value of correlation network for vitamin interactions
  evidence:
  - reference: PMID:37553333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an organism abundance correlation network to investigate factors that
      control community organization in mine tailings-derived laboratory microbial
      consortia
    explanation: Supports the metagenome-informed correlation-network approach to
      the mine-tailings consortia microcosm design.
  - reference: PMID:37553333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: vitamin-dependent interactions are mutualistic
    explanation: Supports the mutualistic vitamin-cross-feeding objective of the
      curated microcosm.
