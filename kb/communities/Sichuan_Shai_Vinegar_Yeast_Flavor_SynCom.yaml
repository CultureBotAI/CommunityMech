id: CommunityMech:000417
name: Sichuan Shai Vinegar Yeast Flavor SynCom
description: A defined yeast consortium model for early solid-state fermentation of Sichuan Shai vinegar. Zhu et al. 2026
  compared four key yeast species by co-culturing, metabolomics, and simulated fermentation, then identified Pichia kudriavzevii,
  Kazachstania humilis, and Brettanomyces bruxellensis as a triple consortium with optimal synergy for total acid, acetic
  acid, and characteristic flavor-profile formation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Resolve division of labor among key Sichuan Shai vinegar yeasts and define a synthetic yeast starter combination
    for modulating early solid-state-fermentation flavor profiles.
  assembly_strategy: Investigate Saccharomyces cerevisiae, Pichia kudriavzevii, Kazachstania humilis, and Brettanomyces bruxellensis
    using co-culturing, metabolomics, and simulated fermentation; then compare combinations to find a synergistic three-yeast
    consortium.
  perturbation_design: Compare defined yeast co-cultures during a simulated Sichuan Shai vinegar fermentation model.
  measurement_endpoints:
  - functional division of labor among four yeasts
  - ester synthesis
  - ethanol production
  - acidification
  - acetaldehyde and 4-ethylguaiacol production
  - total acid and acetic acid content
  - untargeted metabolomics of flavor biosynthesis pathways
  notes: The PubMed abstract supports the four species, the division-of-labor model, and the optimal P. kudriavzevii / K.
    humilis / B. bruxellensis triple consortium, but does not expose strain accessions, inoculation ratios, the solid-state
    matrix, or incubation parameters.
  evidence:
  - reference: PMID:41344775
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study elucidated the functional division of labor within the yeast microbiota during the early stage (days
      1-5) of solid-state fermentation in SSV.
    explanation: Supports the early Sichuan Shai vinegar division-of-labor objective.
  - reference: PMID:41344775
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Investigating of four key yeast strains (Saccharomyces cerevisiae, Pichia kudriavzevii, Kazachstania humilis,
      and Brettanomyces bruxellensis) via co-culturing, metabolomics, and simulated fermentation
    explanation: Supports the four-yeast co-culture, metabolomics, and simulated-fermentation design.
  - reference: PMID:41344775
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The triple-strain combination of Pichia kudriavzevii, Kazachstania humilis, and Brettanomyces bruxellensis exhibited
      optimal synergy
    explanation: Identifies the optimized three-yeast consortium.
