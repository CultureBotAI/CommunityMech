ecological_interactions:
- name: Commercial Maize SynCom Inoculation
  description: Seeds of DKB177 PRO3, SX7341 VIP3 and P3707VYH maize hybrids received a SynCom assembled from 17
    community-based isolates from sugarcane roots/stalks, corresponding to 23 tracked OTUs. The one canonical Bacteria
    entry does not resolve these inoculum members or include the maize host. Separate greenhouse assays measured
    severe-drought bending/recovery and drought sensor/yield responses; treatment contrasts support inoculation
    effects, not a single experimentally resolved mechanism shared by all hybrids.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Mature-Root SynCom Colonization
    description: PARTIAL - inoculation supplied bacteria whose assigned OTUs were enriched in roots sampled at 53
      days after sowing. Relative 16S detection supports establishment of multiple members but does not demonstrate
      viable persistence of all 17 inoculum isolates in every hybrid or at harvest.
  - target: Drought Physiology Modulation
    description: Inoculation changed measured maize physiology relative to uninoculated controls, with effects depending
      on hybrid, watering regime and time. These treatment contrasts support a microbial amendment effect without
      isolating colonization, osmolyte exchange or resident recruitment as its mediator.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a synthetic community (SynCom) harboring plant-beneficial bacteria on the physiology and response of
      three commercial maize hybrids to drought stress (DS).
    explanation: Supports inoculation of the three commercial hybrids in a plant experiment; source IN_VIVO is scoped
      to this graph, leaving the shared non-graph evidence unchanged. A contiguous excerpt avoids the cache/primary
      hyphen rendering difference in plant-sensors.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: Mature-Root SynCom Colonization
  description: Relative 16S profiles from four plants per treatment at 53 days after sowing (V11-V12) identified
    SynCom-associated OTUs in maize roots. Fourteen of 23 OTUs met the authors robust-colonizer criterion in at
    least one hybrid under well-watered conditions and 16 under drought; not every member did so in every condition.
    SynCom-assigned reads comprised about 9-12% of the communities. These DNA-based relative abundances are not
    absolute viable strain counts or persistence to the 117-day harvest. No significant drought-versus-well-watered
    community separation was detected at this early sampling point.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Beneficial Resident Microbiota Recruitment
    description: HYPOTHESIZED - established SynCom members could alter the root habitat or host response and thereby
      recruit resident groups. Inoculated roots had compositional shifts, but colonization was not independently
      varied to isolate this mediation, and family-level beneficial roles were inferred from prior literature.
  evidence:
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Microbiome profiling revealed that SynCom bacterial members were able to robustly colonize mature plants
      and recruit soil/seed-borne beneficial microbes
    explanation: Supports root enrichment in mature plants in the authors terminology; the actual sampling is 53
      days, relative OTUs rather than viable strain counts, and robust colonization is condition dependent.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: Beneficial Resident Microbiota Recruitment
  description: SynCom-inoculated roots differed in relative abundance for 632 of 17437 resident OTUs; some enriched
    families have plant-beneficial representatives in prior literature. This supports resident compositional restructuring,
    not measured benefit from each recruited taxon, absolute expansion or a tested resident-to-host functional pathway.
    The canonical inoculum placeholder does not enumerate the resident community or host. The proposed contribution
    to drought homeostasis remains HYPOTHESIZED.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Drought Physiology Modulation
    description: HYPOTHESIZED - recruited resident microbes could help maintain plant homeostasis during drought,
      as proposed in the Discussion. Relative community shifts and literature-assigned benefits do not establish
      that these residents mediate the measured physiology.
  evidence:
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: SynCom inoculation recruits and enriches such beneficial microbial groups naturally found in low abundance
      in the plant/soil microbiota
    explanation: Supports the authors resident-recruitment interpretation of relative OTUs; beneficial function
      was inferred from family-level literature, not tested for the recruited members.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: ABC Osmolyte Transporter Enrichment
  description: Prior genomic work cited in the drought paper reported enriched ABC-type transporter capacity for
    proline, glycine betaine, sugars and amino acids among the SynCom members. This is potential substrate uptake,
    not drought-induced expression, measured osmolyte pools or demonstrated plant-to-bacterium exchange in this
    experiment. The authors propose that SynCom members might stimulate plant osmolyte production for microbial
    benefit, possibly affecting plant water-use traits. Neither exact transport activity nor a reciprocal benefit
    mechanism was selectively tested.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: L-proline
    term:
      id: CHEBI:17203
      label: L-proline
    notes: Candidate substrate of prior genomic transporter annotations; not measured production, concentration
      or exchange in this drought assay.
  - preferred_term: glycine betaine
    term:
      id: CHEBI:17750
      label: glycine betaine
    notes: Candidate substrate of prior genomic transporter annotations; not measured production, concentration
      or exchange in this drought assay.
  downstream:
  - target: Drought Physiology Modulation
    description: HYPOTHESIZED - genomic osmolyte-uptake potential could promote microbial stimulation of plant osmolyte
      production and thereby influence water-use traits. This author-proposed route lacks measured pools, transporter
      activity, transfer or selective perturbation; enrichment is not a consequence of root colonization.
  evidence:
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: they are enriched in ABC-type transporters for proline, glycine betaine, sugars, and amino acids, among
      other compounds
    explanation: The Discussion attributes transporter enrichment to prior genomic work, not an in-vivo osmolyte
      transfer or gene-expression assay in the current drought experiment.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: Drought Physiology Modulation
  description: SynCom inoculation altered sensor-recorded leaf temperature, turgor and sap flow in genotype-, watering-
    and time-dependent ways. Lower temperature was observed in some contexts, but inoculated plants had higher leaf
    temperature across all three hybrids in late drought (72-79 days after sowing), so the response is not uniformly
    cooling. Sap-flow direction also varied. Separate severe-drought imaging showed reduced or delayed leaf bending,
    most clearly in DKB. Sensors do not by themselves establish stomatal aperture, osmolyte-mediated protection
    or uniformly improved water-use efficiency.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Faster Rehydration Recovery
    description: HYPOTHESIZED - changes in water use could preserve turgor and aid recovery after rewatering. The
      sensor experiment and severe-drought bending/recovery experiment used different watering schedules (rewatering
      at 80 versus 84 days), so this is a proposed physiological link, not measured within-plant mediation across
      those endpoints.
  - target: Reduced Maize Yield Loss
    description: HYPOTHESIZED - altered water-use physiology could contribute to lower drought-associated yield
      loss, as proposed by the authors. Treatment-associated sensor and yield outcomes do not selectively establish
      the mediator; DKB and P3707 benefited, whereas SX had no significant yield benefit.
  evidence:
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: SynCom-inoculated plants displayed lower leaf temperature, reduced turgor loss under severe DS and
      a faster recovery upon rehydration
    explanation: The abstract compresses different conditions; primary Results report higher late-drought leaf temperature
      and genotype/time-dependent responses, not uniformly lower temperature under drought.
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: likely as a result of sap flow modulation and better water usage
    explanation: Supports the authors physiological mediation hypothesis, not selective mechanistic proof or direct
      water-use efficiency measurement.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Faster Rehydration Recovery
  description: In the severe-drought imaging assay, complete water withdrawal ran from 50 to 84 days after sowing.
    On rewatering, inoculated SX recovered immediately compared with a one-day control delay, and inoculated P3707
    recovered fully after two days while controls recovered only partly. Inoculated DKB had not visibly bent before
    rewatering, so it does not supply an equivalent recovery-time comparison. These qualitative bending observations
    are distinct from the sensor/yield experiment, which used reduced irrigation and rewatering at 80 days.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: a faster recovery upon rehydration
    explanation: Supports the abstract recovery result, bounded by hybrid-specific qualitative bending observations
      and a separate severe-drought assay.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Reduced Maize Yield Loss
  description: In the drought sensor/yield experiment harvested at 117 days after sowing, inoculated DKB and P3707
    had significantly greater grain yield under drought than controls (38.7 versus 9.8 g and 42.7 versus 12.4 g,
    respectively). SX showed no significant drought yield benefit. The benefit is conditional on hybrid and watering
    regime, not universal across three genotypes; mature aerial biomass did not show a general increase. These inoculation
    outcomes do not independently prove mediation by the separate severe-drought recovery assay, resident taxa or
    osmolyte exchange.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34745050
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly reduced yield loss and modulated vital physiological traits
    explanation: Supports reduced yield loss in the study, but Results restrict significant drought grain-yield
      benefit to DKB and P3707, not SX.
  participating_taxa:
  - preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
