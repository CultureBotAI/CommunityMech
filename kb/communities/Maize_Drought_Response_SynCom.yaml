id: CommunityMech:000103
name: Maize Drought Response SynCom
description: A plant-beneficial bacterial SynCom that modulates physiology and drought response of commercial
  maize hybrids.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Quantify how bacterial SynCom inoculation changes maize physiology, resilience, and productivity
    under drought.
  assembly_strategy: Synthetic community of plant-beneficial bacteria applied to three commercial maize
    hybrids.
  perturbation_design: Drought stress and rehydration tracked with real-time non-invasive phenotyping.
  measurement_endpoints:
  - yield loss
  - leaf temperature
  - turgor loss
  - sap flow
  - SynCom colonization
  evidence:
  - &id001
    reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we used a non-invasive real-time phenotyping platform in a one-to-one (plant-sensors) set
      up to investigate the impact of a synthetic community (SynCom) harboring plant-beneficial bacteria
      on the physiology and response of three commercial maize hybrids to drought stress (DS).
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Plant-beneficial bacterial SynCom applied to maize under drought stress.
taxonomy:
- taxon_term:
    preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Maize Drought Physiology Modulation
  description: SynCom inoculation modulates maize water-use physiology and drought recovery.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Synthetic community of plant-beneficial bacteria applied to three commercial maize hybrids.
  description: Drought stress and rehydration tracked with real-time non-invasive phenotyping.
  evidence:
  - *id001
related_ingredients:
- preferred_term: L-proline
  chebi_term:
    id: CHEBI:17203
    label: L-proline
  relevance: One of the plant osmolytes whose ABC-type transport genes are enriched in the SynCom
    members — Armanhi et al. 2021 hypothesize that SynCom strains uptake plant proline, indirectly
    stimulating plant osmolyte production for SynCom benefit and contributing to drought tolerance.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: they are enriched in ABC-type transporters for proline, glycine betaine, sugars, and amino
      acids, among other compounds
    explanation: Names proline as a SynCom-transporter substrate underlying drought-tolerance osmolyte
      cross-feeding.
- preferred_term: glycine betaine
  chebi_term:
    id: CHEBI:17750
    label: glycine betaine
  relevance: Second osmolyte whose ABC-type transport genes are enriched in SynCom members — same
    osmolyte cross-feeding mechanism contributing to maize drought tolerance.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: they are enriched in ABC-type transporters for proline, glycine betaine, sugars, and amino
      acids, among other compounds
    explanation: Names glycine betaine as a SynCom-transporter substrate underlying osmolyte cross-
      feeding.
growth_media:
- name: greenhouse pot substrate (7:1 sphagnum:perlite)
  vessel_type: 18-L pots
  light_regime: photoperiod extended until 8:00 pm with halogen bulbs PAR38 100 W
  inoculum_source: SynCom of plant-beneficial bacteria applied to commercial maize hybrids
  preparation_notes: Maize hybrids grown in a netted greenhouse; drought imposed by switching from
    full to reduced irrigation; seeds stored at 4 °C prior to sowing.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Plants were grown in 18-L pots filled with a commercial substrate (Biogrow, Brazil) modified
      to contain a 7:1 sphagnum:perlite
    explanation: Names the pot vessel and substrate used to grow the maize-SynCom system.
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the photoperiod was extended until 8:00 pm with halogen bulbs PAR38 100 W
    explanation: Names the light/photoperiod regime of the greenhouse cultivation.
