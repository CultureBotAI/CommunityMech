id: CommunityMech:000103
name: Maize Drought Response SynCom
description: A plant-beneficial bacterial SynCom that modulates physiology and drought response of commercial
  maize hybrids.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Quantify how bacterial SynCom inoculation changes maize physiology, resilience, and productivity
    under drought.
  assembly_strategy: Synthetic community of plant-beneficial bacteria applied to three commercial maize
    hybrids.
  perturbation_design: Drought stress and rehydration tracked with real-time non-invasive phenotyping.
  measurement_endpoints:
  - yield loss
  - leaf temperature
  - turgor loss
  - sap flow
  - SynCom colonization
  evidence:
  - &id001
    reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we used a non-invasive real-time phenotyping platform in a one-to-one (plant-sensors) set
      up to investigate the impact of a synthetic community (SynCom) harboring plant-beneficial bacteria
      on the physiology and response of three commercial maize hybrids to drought stress (DS).
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Plant-beneficial bacterial SynCom applied to maize under drought stress.
taxonomy:
- taxon_term:
    preferred_term: plant-beneficial maize bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Commercial Maize SynCom Inoculation
  description: >
    A synthetic community harboring plant-beneficial bacteria was applied to
    three commercial maize hybrids so SynCom effects on drought physiology and
    crop performance could be tracked across host genotypes.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Mature-Root SynCom Colonization
    description: >
      SynCom inoculation established members that were later detected as robust
      colonizers of mature maize roots.
  - target: Drought Physiology Modulation
    description: >
      The inoculated plants were the treatment group used to quantify
      SynCom-associated shifts in maize leaf temperature, turgor, and sap flow
      during drought.
  evidence:
  - *id001
- name: Mature-Root SynCom Colonization
  description: >
    16S profiling showed that SynCom bacterial members robustly colonized mature
    maize roots and recruited beneficial soil- and seed-borne microbes under the
    greenhouse drought assay.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Beneficial Resident Microbiota Recruitment
    description: >
      Root colonization by inoculated SynCom strains coincided with recruitment
      of beneficial microbes already present in the soil or on seed.
  - target: ABC Osmolyte Transporter Enrichment
    description: >
      Robust root colonization positioned SynCom members with enriched osmolyte
      transporters in the root-associated community during drought.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Microbiome profiling revealed that SynCom bacterial members were able to robustly
      colonize mature plants and recruit soil/seed-borne beneficial microbes
    explanation: >
      Supports mature-plant root colonization by the inoculated SynCom and
      associated recruitment of resident beneficial microbes.
- name: Beneficial Resident Microbiota Recruitment
  description: >
    SynCom inoculation reshaped the maize root microbiota by enriching beneficial
    resident soil and seed groups, a community change proposed to help sustain
    plant homeostasis under drought stress.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Drought Physiology Modulation
    description: >
      Recruitment of beneficial root-associated microbes supplied a candidate
      community-level route by which SynCom inoculation modulated drought
      physiology.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation recruits and enriches such beneficial microbial groups naturally
      found in low abundance in the plant/soil microbiota
    explanation: >
      Supports SynCom-associated enrichment of resident beneficial microbial
      groups in the maize root microbiota.
- name: ABC Osmolyte Transporter Enrichment
  description: >
    Plant-beneficial SynCom members were enriched in ABC-type transporters for
    L-proline, glycine betaine, sugars, and amino acids, supporting a proposed
    osmolyte exchange route that could influence maize water-use traits.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: L-proline
    term:
      id: CHEBI:17203
      label: L-proline
  - preferred_term: glycine betaine
    term:
      id: CHEBI:17750
      label: glycine betaine
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Drought Physiology Modulation
    description: >
      Enrichment of transporters for plant osmolytes supplied a hypothesis for
      SynCom-associated water-usage and turgor effects.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: they are enriched in ABC-type transporters for proline, glycine betaine, sugars, and amino
      acids, among other compounds
    explanation: Names proline and glycine betaine as osmolyte substrates tied to
      the SynCom drought-response hypothesis.
- name: Drought Physiology Modulation
  description: >
    SynCom-inoculated maize displayed altered water-use physiology during drought,
    including lower leaf temperature, less turgor loss under severe drought
    stress, and changes consistent with sap-flow modulation and better water
    usage.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Faster Rehydration Recovery
    description: >
      Leaf-temperature, turgor, and sap-flow modulation accompanied faster
      recovery of inoculated plants after rehydration.
  - target: Reduced Maize Yield Loss
    description: >
      Water-use changes occurred in the same inoculated plants for which yield
      loss under drought was reduced.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom-inoculated plants displayed lower leaf temperature, reduced turgor loss
      under severe DS and a faster recovery upon rehydration
    explanation: >
      Supports SynCom-associated modulation of temperature, turgor, and
      recovery phenotypes under drought stress.
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: likely as a result of sap flow modulation and better water usage
    explanation: >
      Supports sap-flow and water-use modulation as the likely physiological
      basis for the drought-response changes.
- name: Faster Rehydration Recovery
  description: >
    After drought stress, SynCom-inoculated maize recovered faster upon
    rehydration, linking the altered water-use phenotype to improved
    post-stress plant performance.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Reduced Maize Yield Loss
    description: >
      Faster physiological recovery after water reintroduction preceded the
      drought-stressed crop-productivity endpoint.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a faster recovery upon rehydration
    explanation: >
      Supports faster drought recovery by SynCom-inoculated maize after
      rehydration.
- name: Reduced Maize Yield Loss
  description: >
    The greenhouse SynCom treatment significantly reduced drought-associated
    yield loss in the three-hybrid experiment, tying the microbial amendment and
    water-physiology changes to crop productivity.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly reduced yield loss and modulated vital physiological
      traits
    explanation: >
      Supports reduced yield loss as a SynCom-associated endpoint under the
      drought-stress assay.
environmental_factors:
- name: defined synthetic community design
  value: Synthetic community of plant-beneficial bacteria applied to three commercial maize hybrids.
  description: Drought stress and rehydration tracked with real-time non-invasive phenotyping.
  evidence:
  - *id001
related_ingredients:
- preferred_term: L-proline
  chebi_term:
    id: CHEBI:17203
    label: L-proline
  relevance: One of the plant osmolytes whose ABC-type transport genes are enriched in the SynCom
    members — Armanhi et al. 2021 hypothesize that SynCom strains uptake plant proline, indirectly
    stimulating plant osmolyte production for SynCom benefit and contributing to drought tolerance.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: they are enriched in ABC-type transporters for proline, glycine betaine, sugars, and amino
      acids, among other compounds
    explanation: Names proline as a SynCom-transporter substrate underlying drought-tolerance osmolyte
      cross-feeding.
- preferred_term: glycine betaine
  chebi_term:
    id: CHEBI:17750
    label: glycine betaine
  relevance: Second osmolyte whose ABC-type transport genes are enriched in SynCom members — same
    osmolyte cross-feeding mechanism contributing to maize drought tolerance.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: they are enriched in ABC-type transporters for proline, glycine betaine, sugars, and amino
      acids, among other compounds
    explanation: Names glycine betaine as a SynCom-transporter substrate underlying osmolyte cross-
      feeding.
growth_media:
- name: greenhouse pot substrate (7:1 sphagnum:perlite)
  vessel_type: 18-L pots
  light_regime: photoperiod extended until 8:00 pm with halogen bulbs PAR38 100 W
  inoculum_source: SynCom of plant-beneficial bacteria applied to commercial maize hybrids
  preparation_notes: Maize hybrids grown in a netted greenhouse; drought imposed by switching from
    full to reduced irrigation; seeds stored at 4 °C prior to sowing.
  evidence:
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Plants were grown in 18-L pots filled with a commercial substrate (Biogrow, Brazil) modified
      to contain a 7:1 sphagnum:perlite
    explanation: Names the pot vessel and substrate used to grow the maize-SynCom system.
  - reference: PMID:34745050
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the photoperiod was extended until 8:00 pm with halogen bulbs PAR38 100 W
    explanation: Names the light/photoperiod regime of the greenhouse cultivation.
