  evidence:
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: hydrogen metabolism, rubisco-based CO2 fixation, reduction of
      nitrogen compounds and sulfate reduction are well represented functions
      in microbiomes from both URLs
    explanation: Supports the shared deep-subsurface functional repertoire.
- name: Genotypic Homogeneity Across Depths in Horonobe
  description: Near-identical genotypes for approximately one third of detected
    organisms recur at multiple Horonobe depths with detectable but slow in
    situ growth, suggesting historical dispersal under different hydrological
    regimes.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: near-identical genotypes for approximately one third of all
      genomically defined organisms at multiple depths within the Horonobe URL
    explanation: Supports cross-depth genotypic homogeneity.
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the Horonobe URL microbiome homogeneity may be explained by higher
      groundwater mobility during the last glacial period
    explanation: Supports paleo-hydrological dispersal as the proposed mechanism.
- name: Trans-Continental Genotypic Overlap
  description: Species closely related to those detected in the URLs are
    identified in three other USA subsurface environments, suggesting dispersal
    rates fast enough relative to mutation rates to preclude substantial
    divergence.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Genotypically-defined species closely related to those detected in
      the URLs were identified in three other subsurface environments in the USA
    explanation: Supports trans-continental subsurface species overlap.
