id: CommunityMech:000218
name: Horonobe and Mizunami Underground Research Laboratory Subsurface Microbiome
description: >
  A multi-year, depth-resolved groundwater microbiome study of the Horonobe
  (sedimentary rock) and Mizunami (granitic rock) Underground Research
  Laboratories in Japan, sampling defined intervals between 140 and 400 m
  below the surface over four years. Draft genomes were reconstructed for more
  than 90 percent of all detected organisms. The Horonobe and Mizunami
  microbiomes are dissimilar at the community level, but hydrogen metabolism,
  rubisco-based CO2 fixation, reduction of nitrogen compounds, and sulfate
  reduction are well represented in both, while methane metabolism is more
  prevalent at the organic- and CO2-rich Horonobe URL. High fluid flow zones
  and tunnel proximity select for candidate phyla radiation bacteria in the
  Mizunami URL. Approximately one third of genomically defined organisms have
  near-identical genotypes at multiple depths within Horonobe, and
  closely-related species recur in three other USA subsurface environments,
  constraining expectations of global subsurface biodiversity.
