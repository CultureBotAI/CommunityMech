- name: Horonobe Sulfate-Reducer Hydrogen Support of Methanogenesis
  description: PARTIAL - in Horonobe samples farther from tunnels, the authors propose that putative autotrophic
    sulfate-reducing Syntrophobacterales may produce hydrogen supporting Methanospirillum methanogenesis. Genomic
    capacities and community profiles motivate this model, without directly measuring partner-resolved hydrogen
    transfer, necessity or simultaneous sulfate reduction and hydrogen export. The canonical Horonobe community
    placeholder does not resolve those partners as individual grounded taxa.
  interaction_type: CROSS_FEEDING
