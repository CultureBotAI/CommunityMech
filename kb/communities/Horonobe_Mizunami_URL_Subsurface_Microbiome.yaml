ecological_interactions:
- name: Site-Associated URL Community Divergence
  description: Groundwater metagenomes distinguish the sedimentary Horonobe and granitic Mizunami microbiomes. Host
    rock, location, groundwater chemistry and tunnel/flow context covary, so the comparison supports a site-associated
    pattern and a proposed lithological explanation, not an isolated lithology effect or demonstrated competitive
    niche partitioning. The two canonical habitat-level participants share a broad cellular-organisms CURIE but
    denote different sampled communities.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  evidence:
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The Horonobe and Mizunami microbiomes are dissimilar, likely because the Mizunami URL is hosted in
      granitic rock and the Horonobe URL in sedimentary rock
    explanation: Supports distinct microbiomes and the authors' likely lithological explanation, not a selectively
      established driver.
  participating_taxa:
  - preferred_term: Horonobe sedimentary URL groundwater microbiome
    term:
      id: NCBITaxon:131567
      label: cellular organisms
  - preferred_term: Mizunami granitic URL groundwater microbiome
    term:
      id: NCBITaxon:131567
      label: cellular organisms
- name: Shared Deep-Subsurface Genomic Functional Potential
  description: Genome marker annotations in both URLs support widespread coding potential for hydrogen metabolism,
    Rubisco-based carbon fixation, nitrogen reduction and sulfate reduction. The positive genomic result is not
    measurement of pathway expression, biogeochemical flux, or exchange between every organism carrying those genes.
    A functional repertoire is not itself cross-feeding.
