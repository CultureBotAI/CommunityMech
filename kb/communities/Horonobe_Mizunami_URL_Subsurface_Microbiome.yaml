- name: Genotypic Homogeneity Across Depths in Horonobe
  description: Near-identical genotypes recur across Horonobe depths for approximately one third of genomically
    defined organisms. Coverage-qualified iRep estimates for a subset support replication, not direct absolute growth
    rates for all taxa. Historical groundwater mobility is a proposed explanation for present genotype similarity;
    the data do not directly establish migration, colonization facilitation or mutation rates, and current low conductivity
    and heterogeneous chemistry argue against assuming ongoing intersite dispersal.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: near-identical genotypes for approximately one third of all genomically defined organisms at multiple
      depths within the Horonobe URL
    explanation: Supports the sequence-based cross-depth similarity observation.
  - reference: PMID:39696556
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the Horonobe URL microbiome homogeneity may be explained by higher groundwater mobility during the
      last glacial period
    explanation: Supports a proposed prior hydrological explanation, not observed historical transport.
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: in situ growth was detected for some bacteria, albeit at slow rates
    explanation: Supports the authors' replication inference from a coverage-qualified iRep subset, not direct absolute
      growth-rate measurements.
  participating_taxa:
