ecological_interactions:
- name: Lithology-Driven Community Divergence
  description: Sedimentary versus granitic host rock yields dissimilar URL
    microbiomes despite shared deep-subsurface chemistry, indicating lithology
    as a primary structuring factor.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:39696556
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The Horonobe and Mizunami microbiomes are dissimilar, likely because
      the Mizunami URL is hosted in granitic rock and the Horonobe URL in
      sedimentary rock
    explanation: Supports lithology as the divergence driver.
- name: Shared Deep-Subsurface Functional Core
  description: Despite community-level dissimilarity, both URLs share well-
    represented hydrogen metabolism, rubisco-based CO2 fixation, nitrogen
    reduction, and sulfate reduction functions.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
