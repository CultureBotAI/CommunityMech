discussions:
- discussion_id: url_function_and_dispersal_limits
  prompt: Which processes connect URL genomic potential to activity and dispersal?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Site-Associated URL Community Divergence
  - ecological_interactions#Shared Deep-Subsurface Genomic Functional Potential
  - ecological_interactions#Horonobe Sulfate-Reducer Hydrogen Support of Methanogenesis
  - ecological_interactions#Genotypic Homogeneity Across Depths in Horonobe
  rationale: 'Remove both overview-to-hydrogen arrows: contrasting sites provides context, and membership of a shared
    functional repertoire provides inclusion, neither an experimentally resolved upstream cause of the proposed
    transfer. Expression, isotope/flux measurements and partner perturbations would test the retained hydrogen hypothesis.
    Distinct rpS3 and genome-ANI species definitions yield different overlap counts and must not be conflated. Broad
    habitat placeholders are not organism-resolved donor/recipient groundings. Methanoperedens iron-coupling, tunnel-associated
    mobilization and historical dispersal are additional proposals, not newly demonstrated branches or an exhaustive
    mechanism expansion. Non-graph metadata is preserved, not recertified.'
  posed_by: codex
  posed_date: '2026-10-06'
