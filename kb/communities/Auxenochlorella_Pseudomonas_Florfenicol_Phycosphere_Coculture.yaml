discussions:
- discussion_id: exact-pair-growth-medium
  prompt: The article body states that Text S12 contains details of the Pseudomonas_sp1 and A. pyrenoidosa co-culture
    experiment; those supplementary details should be inspected to recover the exact medium, inoculum, volume, and
    exposure groups for the pairwise assay.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - growth_media#Pseudomonas_sp1-Auxenochlorella
  rationale: The main article cleanly establishes Pseudomonas_sp1 as the selected partner and reports the 13-day
    response, but it points cultivation details for that follow-up pairwise assay to Text S12.
  evidence:
  - reference: PMID:41724996
    supports: SUPPORT
    evidence_source: full_text
    snippet: Text S12. The co-culture experiment of phycospheric isolates and A. pyrenoidosa
    explanation: Shows that exact follow-up co-culture details were placed in the supplement rather than the article
      body.
  posed_by: claude
  posed_date: '2026-09-27'
- discussion_id: auxeno_pyridoxal_mediation
  prompt: Is bacterial pyridoxal necessary for the algal benefit, and is its transfer directly measurable?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Pseudomonas Pyridoxal Support Under Florfenicol Stress
  rationale: PMID:41724996 supports the defined-pair growth response and vitamin supplementation. Removing pyridoxal
    production or blocking algal uptake would distinguish mediation from correlated metabolite accumulation. The
    existing Text S12 medium gap remains; Text S12-S14 were not reviewed. No antibiotic-degradation or reciprocal-fitness
    claim is added.
  posed_by: codex
  posed_date: '2026-10-05'
