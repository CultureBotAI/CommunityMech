id: CommunityMech:000451
name: Auxenochlorella-Pseudomonas Florfenicol Phycosphere Coculture
description: A defined freshwater green-alga and bacterium co-culture pairing axenic Auxenochlorella pyrenoidosa with Pseudomonas_sp1,
  a phycospheric isolate recovered after high-florfenicol and polylactic acid microplastic stress. Liu et al. isolated Pseudomonas_sp1
  from the stressed phycosphere and used the isolate in short co-culture validation experiments showing promoted A. pyrenoidosa
  growth and Pseudomonas-associated pyridoxal production under florfenicol stress.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Test whether a stress-enriched Pseudomonas isolate from the A. pyrenoidosa phycosphere can improve algal fitness
    under florfenicol and polylactic acid microplastic stress.
  assembly_strategy: Recover phycospheric bacteria from the PFH high-florfenicol plus PLA microplastic treatment, identify
    Pseudomonas_sp1 by whole-genome sequencing, and co-cultivate it with axenic A. pyrenoidosa.
  perturbation_design: Compare axenic A. pyrenoidosa controls with Pseudomonas_sp1 co-cultures under florfenicol-only and
    combined florfenicol plus polylactic acid microplastic treatments.
  measurement_endpoints:
  - A. pyrenoidosa cell density
  - chlorophyll content
  - extracellular polymeric substance production
  - superoxide dismutase activity
  - malondialdehyde content
  - florfenicol concentration
  - pyridoxal concentration
  evidence:
  - reference: PMID:41724996
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phycospheric bacteria were isolated from the PFH group after co-cultivation
    explanation: Supports the high-florfenicol plus PLA microplastic enrichment context for the Pseudomonas_sp1 isolate.
  - reference: PMID:41724996
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas_sp1 was selected for co-cultivation with axenic A. pyrenoidosa
    explanation: Supports the defined isolate-pair validation design used for this record.
