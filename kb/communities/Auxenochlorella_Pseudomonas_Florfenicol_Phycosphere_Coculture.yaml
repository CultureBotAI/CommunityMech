ecological_interactions:
- name: Pseudomonas Pyridoxal Support Under Florfenicol Stress
  description: PARTIAL - Pseudomonas_sp1 promoted A. pyrenoidosa growth during the 13-day florfenicol-stress co-culture,
    and pyridoxal was detected with the bacterium. Exogenous vitamin B6 also promoted axenic algal growth, supporting
    pyridoxal as a candidate mediator. These experiments establish association and supplementation sufficiency,
    not necessity of bacterial pyridoxal or traced transfer.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas sp. Pseudomonas_sp1
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
  target_taxon:
    preferred_term: Auxenochlorella pyrenoidosa
    term:
      id: NCBITaxon:3078
      label: Auxenochlorella pyrenoidosa
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41724996
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultures with Pseudomonas_sp1 promoted microalgal growth within 13
    explanation: Supports the positive effect of Pseudomonas_sp1 on A. pyrenoidosa growth in the defined co-culture
      assay.
  - reference: PMID:41724996
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: pyridoxal was detected only in the presence of Pseudomonas_sp1
    explanation: Supports bacterium-associated pyridoxal detection; its biosynthetic origin and transfer were not
      directly traced.
  - reference: PMID:41724996
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: exogenous vitamin B6 alone is sufficient to promote axenic algal growth
    explanation: Supports supplementation sufficiency, not necessity for the endogenous bacterial benefit.
environmental_factors:
- name: Florfenicol and PLA microplastic challenge
  value: single florfenicol or florfenicol plus PLA MPs
  description: The isolate-pair validation compared A. pyrenoidosa controls and Pseudomonas_sp1 co-cultures across florfenicol
    and combined florfenicol plus polylactic acid microplastic stress treatments.
  evidence:
  - reference: PMID:41724996
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Different FF and PLA MPs treatments were set up in the co-culture system
    explanation: Supports the stress-treatment design for the defined Pseudomonas_sp1 co-culture.
- name: Pseudomonas-associated pyridoxal production
  description: Pyridoxal accumulated only in Pseudomonas_sp1-containing cultures and increased over time, with florfenicol
    further stimulating production.
  evidence:
  - reference: PMID:41724996
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas_sp1 was capable of producing pyridoxal
    explanation: Supports measured pyridoxal production by Pseudomonas_sp1.
