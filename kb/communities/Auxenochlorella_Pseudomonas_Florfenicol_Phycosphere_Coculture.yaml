  preferred_term: freshwater algal-bacterial stress coculture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Defined laboratory validation co-culture pairing axenic A. pyrenoidosa with a phycospheric Pseudomonas isolate under
    florfenicol and polylactic acid microplastic stress.
