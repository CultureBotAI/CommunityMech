id: CommunityMech:000419
name: Rice FSQN Rhizosphere Microbiome SynCom
description: A four-strain synthetic microbial community, FSQN, applied to the rhizosphere soil and
  root microbiomes of rice (Oryza sativa) and compared with the single-strain Brevundimonas
  diminuta NH1 inoculant. FSQN was composed of Bacillus amyloliquefaciens FH1, Ochrobactrum
  tritici S112, Gluconacetobacter liquefaciens QZR14, and Brevundimonas diminuta NH1; after
  inoculation, high-throughput sequencing showed altered beta-diversity in rhizosphere soil and
  roots and functional predictions indicated enhanced ectomycorrhizal, endomycorrhizal, and
  plant-saprotrophic functions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Compare how a single Brevundimonas diminuta NH1 inoculant and the four-strain FSQN
    SynCom differ in rice microbiome regulation and growth-promotion associations.
  assembly_strategy: FSQN was assembled from Bacillus amyloliquefaciens FH1, Ochrobactrum tritici
    S112, Gluconacetobacter liquefaciens QZR14, and Brevundimonas diminuta NH1.
  measurement_endpoints:
  - High-throughput sequencing of rice rhizosphere-soil and root microbiomes
  - Microbial community composition
  - Predicted bacterial and fungal functions
  - Correlations between microbiome shifts and rice growth traits
  evidence:
  - reference: PMID:42596554
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic microbial community (FSQN) composed of Bacillus amyloliquefaciens FH1, Ochrobactrum
      tritici S112, Gluconacetobacter liquefaciens QZR14, and B. diminuta NH1
    explanation: Identifies the four-strain FSQN synthetic-community membership.
  - reference: PMID:42596554
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: High-throughput sequencing was used to assess microbial α- and β-diversity, community composition,
      predicted bacterial and fungal functions, and correlations between microbiome shifts and rice
      growth traits.
    explanation: Summarizes the sequencing and prediction endpoints used to compare the single-strain
      and FSQN inoculants in rice.
