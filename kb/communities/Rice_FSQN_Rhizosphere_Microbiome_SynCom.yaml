ecological_interactions:
- name: FSQN-induced rice microbiome beta-diversity shift
  description: FSQN inoculation significantly altered beta-diversity in rice rhizosphere soil and
    roots relative to the uninoculated control and enriched Mortierella, Tausonia, Fusarium, and
    Glomerella in rhizosphere soil plus Exiguobacterium, Pseudomonas, and Rhodotorula in roots.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42596554
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: both significantly altered β-diversity in rhizosphere soil and roots
    explanation: Shows that inoculation with either the single-strain treatment or FSQN significantly
      changed beta-diversity in host-associated rice microbiomes.
  - reference: PMID:42596554
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The synthetic community mainly enriched Mortierella, Tausonia, Fusarium, and Glomerella in
      rhizosphere soil, and Exiguobacterium, Pseudomonas, and Rhodotorula in roots.
    explanation: Names the root and rhizosphere taxa enriched after FSQN treatment.
- name: FSQN-associated predicted fungal functional shift
  description: Functional prediction of the FSQN-treated rice microbiome indicated enrichment of
    ectomycorrhizal, endomycorrhizal, and plant-saprotrophic functions.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42596554
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the synthetic community enhanced ectomycorrhizal, endomycorrhizal, and plant-saprotrophic
      functions
    explanation: Supports the predicted fungal-guild functional shift associated with FSQN inoculation.
