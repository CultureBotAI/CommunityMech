- name: SCDY1 Arabidopsis salt-stress growth promotion
  description: SCDY1 improved Arabidopsis root elongation and biomass under moderate sodium-chloride stress, with the clearest
    overall response at 120 mM NaCl.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.64898/2026.07.15.738596
    supports: SUPPORT
    evidence_source: IN_VIVO
