id: CommunityMech:000459
name: Quinoa SCDY1 Salt-Stress SynCom
description: A nine-isolate synthetic bacterial community discovered by cube-based screening of quinoa-associated isolates
  for Arabidopsis salt-stress growth promotion. Dangjarean et al. divided 135 quinoa isolates into five 3 x 3 x 3 cubes, treated
  each layer as a nine-isolate SynCom, and identified SynCom DY1 (SCDY1) as the 100 mM NaCl screening hit. SCDY1 combined
  Pseudomonas panipatensis-like isolate 82, Stenotrophomonas bentonitica-like isolate 85, Fictibacillus enclensis-like isolate
  88, Novosphingobium subterraneum-like isolate 91, Herbaspirillum frisingense-like isolate 94, Acidovorax facilis-like isolate
  97, Bacillus atrophaeus-like isolate 100, Priestia megaterium-like isolate 103, and Bacillus subtilis-like isolate 106.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Discover a traceable quinoa-associated bacterial SynCom that improves plant performance under sodium-chloride
    stress.
  assembly_strategy: Distribute 135 quinoa-associated bacterial isolates into five 27-isolate 3 x 3 x 3 cubes, treat each
    cube layer as a nine-isolate SynCom, screen 45 layer communities under 100 mM NaCl, and carry the best-performing DY1
    layer forward as SCDY1.
  inoculation_strategy: Pregrow isolates, combine the nine SCDY1 members as a defined synthetic community, and spread the
    cell suspension over Arabidopsis agar plates before transferring seedlings to salt-stress assays.
  perturbation_design: Select SCDY1 in the 100 mM NaCl primary screen, then compare mock and SCDY1-inoculated Arabidopsis
    seedlings across NaCl doses for growth, biomass, strain recovery, transcriptomic, and root-hair phenotypes.
  measurement_endpoints:
  - primary-root elongation and seedling biomass under NaCl stress
  - plant-growth-promoting traits of member isolates
  - SCDY1 member recovery from inoculated seedlings
  - Arabidopsis RNA-seq and RT-qPCR under moderate salinity
  - root-hair length, density, and position relative to the root apex
  evidence:
  - reference: doi:10.64898/2026.07.15.738596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The isolates were divided into five 27-isolate sets, each arranged as a 3 x 3 x 3 cube in which each 3 x 3 layer
      was defined as a 9-isolate SynCom, generating 45 SynComs in total.
    explanation: Supports the cube-based strategy that made every screened layer a nine-isolate SynCom.
  - reference: doi:10.64898/2026.07.15.738596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Screening under 100 mM NaCl identified SynCom DY1 (SCDY1) as a candidate salt stress-mitigating consortium.
    explanation: Identifies SCDY1 as the selected salt-stress SynCom.
