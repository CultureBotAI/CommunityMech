id: CommunityMech:000292
name: Pseudomonas-Rahnella native rhizosphere SynCom for Artemisia argyi phytoremediation
description: A simplified, native rhizosphere synthetic microbial community (SynCom) pairing a
  Pseudomonas isolate with a Rahnella isolate, assembled by a top-down design from rhizobacteria
  isolated from cadmium (Cd)-contaminated agricultural soil to partner with the perennial medicinal
  plant Artemisia argyi. The Pseudomonas-Rahnella pair shows strong Cd tolerance (~2 mM), plant
  growth-promotion (PGP) traits, and carbon fixation capacity, and was chosen for functional
  complementarity with minimal antagonism. Under Cd stress the SynCom establishes stable endophytic
  colonization (10-15%) rather than rhizoplane colonization, improving root biomass, Cd uptake, soil
  organic carbon accumulation, and essential-oil precursors, thereby coupling phytoremediation,
  productivity, and carbon sequestration.
