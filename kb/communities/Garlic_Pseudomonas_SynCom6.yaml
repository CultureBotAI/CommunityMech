ecological_interactions:
- name: Radish Seedling Length Response to Pseudomonas SynCom6
  description: The equal-proportion M mixture of six garlic-rhizosphere Pseudomonas isolates increased radish seedling
    length relative to sterile-water CK and B8-7 alone in the two-day incubator assay. Adding B8-7 to M did not
    significantly change the growth-promoting effect, and B8-7 alone did not promote growth. This is a consortium-level
    host response, not a garlic field-yield result or demonstrated cooperation among the six strains. Individual
    Pseudomonas monocultures and member omissions were not the comparison reported here, so synergy and each member's
    necessity are unresolved. The single canonical Pseudomonas sp. participant is an unresolved umbrella for the
    six isolates, not a complete strain-resolved roster or a claim that they are one species.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom with six Pseudomonas sp. strains significantly promote plant growth.
    explanation: Supports the observed radish seedling response to M; the host assay is distinct from in-vitro preparation
      of the inoculum. Main Methods specifies a two-day length endpoint, not garlic yield or a test of interstrain
      synergy.
  participating_taxa:
  - preferred_term: Pseudomonas sp.
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
