id: CommunityMech:000095
name: Garlic Rhizosphere Pseudomonas SynCom6
description: A six-strain Pseudomonas SynCom selected from garlic rhizosphere microbiome data for plant
  growth promotion.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Use top-down rhizosphere microbiome analysis to identify and apply plant growth-promoting
    Pseudomonas strains.
  assembly_strategy: Six Pseudomonas strains isolated from garlic rhizosphere were combined into a SynCom.
  perturbation_design: Garlic growth periods, soil types, and agricultural practices informed candidate
    selection.
  measurement_endpoints:
  - plant growth promotion
  - PGPR enrichment
  - rhizosphere community structure
  evidence:
  - &id001
    reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom with six Pseudomonas strains isolated from the garlic rhizosphere were constructed,
      which showed that they have the ability to promote plant growth.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Six Pseudomonas strains isolated from the garlic rhizosphere.
taxonomy:
- taxon_term:
    preferred_term: Pseudomonas sp.
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
    gtdb_grounding_status: UNRESOLVED
  evidence:
  - *id001
ecological_interactions:
- name: Top-Down Pseudomonas PGPR Selection
  description: >
    Field amplicon and co-occurrence analyses nominated Pseudomonas as a garlic PGPR candidate:
    the genus was enriched under late-stage or fertile-soil rhizosphere conditions and was
    prioritized in Apr, May, sandy loam, and loam co-occurrence networks.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Six-Strain Pseudomonas SynCom Assembly
    description: >
      The field rhizosphere screen and co-occurrence network analysis selected Pseudomonas as the
      genus to isolate and carry into a six-strain synthetic community.
  evidence:
  - reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Pseudomonas was enriched in eight comparison groups under the late growth periods
      and good growth conditions
    explanation: >
      Identifies Pseudomonas as a repeatedly enriched genus in garlic rhizospheres from late-growth
      or higher-yield field conditions.
  - reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Compared with the network of Mar and sandy soil datasets, Pseudomonas plays more
      important role in the Apr, May, sandy loam and loam networks.
    explanation: >
      Shows that Pseudomonas was also retained as an important co-occurrence network member in
      later-growth and more fertile-soil rhizosphere communities.
- name: Six-Strain Pseudomonas SynCom Assembly
  description: >
    Six garlic rhizosphere Pseudomonas isolates with different 16S/BLAST phylogenetic names were
    mixed in equal proportions to form the M SynCom used for plant-growth testing.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Pseudomonas-Mediated Growth Promotion
    description: >
      The equal-proportion six-strain M group was the inoculum whose seedling growth-promotion
      effect was assayed against sterile-water and B8-7 controls.
  evidence:
  - reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Group M consisted of six Pseudomonas sp. strains with different phylogenetic names
      mixed in equal proportions.
    explanation: >
      Defines the six-member Pseudomonas consortium assembled from garlic rhizosphere isolates.
- name: Pseudomonas-Mediated Growth Promotion
  description: The six-strain Pseudomonas M SynCom promoted radish seedling growth
    after assembly from garlic rhizosphere isolates.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom with six Pseudomonas sp. strains significantly promote plant growth.
    explanation: >
      Reports the growth-promotion phenotype of the six-strain Pseudomonas SynCom in the seedling
      assay.
environmental_factors:
- name: defined synthetic community design
  value: Six Pseudomonas strains isolated from garlic rhizosphere were combined into a SynCom.
  description: Garlic growth periods, soil types, and agricultural practices informed candidate selection.
  evidence:
  - *id001
growth_media:
- name: Luria-Bertani medium (LB)
  temperature: '28'
  temperature_unit: °C
  shaking_speed: '200'
  shaking_speed_unit: r.p.m.
  incubation_time: '2'
  incubation_time_unit: days
  inoculum_size: OD600 diluted to 0.1-0.2
  inoculum_unit: OD600
  vessel_type: 18 mm x 180 mm glass tubes
  preparation_notes: Six Pseudomonas strains grown at 28°C (strain B8-7 at 37°C) in 10 ml LB.
  evidence:
  - reference: PMID:32762153
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial strains were cultured (28°C for six Pseudomonas strains, 37°C for B8‐7, 18 mm × 180 mm glass tubes, shaking at 200 r.p.m.) in 10 ml LB for 2 days.
    explanation: Source states the LB medium, 28 °C temperature, glass-tube vessel, 200 r.p.m. shaking and 2-day incubation of the Pseudomonas SynCom strains.
