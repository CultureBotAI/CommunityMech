ecological_interactions:
- name: E. coli glucose competition imposes F. betulina carbon stress
  description: >-
    When E. coli ATCC 25922 was added to 3-day F. betulina liquid MEB cultures,
    glucose fell to zero within 1 day after bacterial addition, F. betulina dry
    biomass dropped from about 60 mg in monoculture to 34 mg in coculture, and
    RNA-seq after 3 days of coculture showed broad F. betulina differential
    expression consistent with carbon depletion and metabolic stress.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli ATCC 25922
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  target_taxon:
    preferred_term: Fomitopsis betulina CIRM-BRFM 860
    term:
      id: NCBITaxon:40450
      label: Fomitopsis betulina
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  downstream:
  - target: F. betulina nutritional-stress response
    description: >-
      Glucose depletion during coculture coincided with F. betulina biomass
      reduction and differential expression of carbon-acquisition, nutrient
      transport, redox-homeostasis, stress-adaptation, and biosynthetic-gene
      cluster genes.
  evidence:
  - reference: doi:10.64898/2026.09.14.751415
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the glucose concentration was reduced to zero within 1 day
    explanation: Supports rapid E. coli-associated glucose depletion in liquid coculture.
  - reference: doi:10.64898/2026.09.14.751415
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the growth of F. betulina was reduced to 34 mg dry weight
    explanation: Supports the reduced F. betulina biomass in liquid coculture.
- name: F. betulina distal inhibition of E. coli on malt extract agar
  description: >-
    In malt extract agar confrontation plates, F. betulina CIRM-BRFM 860 formed
    a visible zone that inhibited E. coli ATCC 25922 growth at a distance from
    the fungal mycelium. LC-MS metabolomics of media plugs from the inhibition
    zone detected enriched Sumiki's-acid-derivative, calcium-diformate, and
    sulfuric-acid features, and the authors linked the zone to local medium
    acidification rather than to detectable piptamine production.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Fomitopsis betulina CIRM-BRFM 860
    term:
      id: NCBITaxon:40450
      label: Fomitopsis betulina
  target_taxon:
    preferred_term: Escherichia coli ATCC 25922
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  downstream:
  - target: E. coli agar growth inhibition
    description: >-
      The fungal colony inhibited bacterial growth across the agar surface
      without requiring direct cell-cell contact.
  evidence:
  - reference: doi:10.64898/2026.09.14.751415
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed a clear inhibition of the bacterial growth at distance from
      the mycelium
    explanation: Supports distal inhibition of E. coli in the agar confrontation assay.
