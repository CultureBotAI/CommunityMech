id: CommunityMech:000457
name: Fomitopsis-E. coli Nutritional-Stress Coculture
description: >-
  A defined two-member fungal-bacterial coculture pairing the brown-rot
  basidiomycete Fomitopsis betulina CIRM-BRFM 860 with Escherichia coli ATCC
  25922 to probe bacterial competition as a trigger for fungal nutritional
  stress and secondary metabolism. Albert et al. 2026 tested the pair in malt
  extract agar confrontations, where F. betulina inhibited distant E. coli
  growth, and in malt extract broth, where E. coli addition after 3 days of
  fungal growth depleted glucose within 1 day, reduced fungal dry biomass, and
  shifted F. betulina transcription toward carbon acquisition, transport,
  stress adaptation, and multiple biosynthetic gene clusters.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >-
    Use a two-member F. betulina-E. coli coculture to test how bacterial
    nutrient competition affects fungal growth, extracellular metabolite
    profiles, carbon starvation, stress adaptation, and specialized-metabolite
    biosynthetic pathways.
  assembly_strategy: >-
    Pair a subcultured F. betulina CIRM-BRFM 860 mycelial inoculum with
    E. coli ATCC 25922 grown from an ATCC stock revived in Mueller Hinton II
    broth; assay the pair both on malt extract agar and in shaken malt extract
    broth.
  inoculation_strategy: >-
    For the liquid assay, inoculate 100 mL malt extract broth with three
    5 x 5 mm F. betulina plugs, grow the fungus alone for 3 days at 30 C and
    120 rpm, then add 1 mL of E. coli preculture standardized to OD600 0.1.
  perturbation_design: >-
    Compare F. betulina-E. coli cocultures with fungal and bacterial
    monoculture controls on agar and with fungal and bacterial pure cultures in
    the liquid malt extract broth experiment.
  measurement_endpoints:
  - agar inhibition-zone phenotype and surface pH
  - UHPLC-HRMS metabolomics of agar confrontation zones
  - fungal dry biomass, survival, pH, and glucose concentration in liquid culture
  - E. coli viable counts after liquid coculture
  - F. betulina RNA-seq and biosynthetic-gene-cluster expression after coculture
  notes: >-
    The study used the fast-growing E. coli partner to test whether rapid
    bacterial consumption of available carbon sources imposed nutritional stress
    on F. betulina; the authors inferred nutrient competition from rapid glucose
    depletion and reduced fungal biomass, while the exact fungal metabolites
    mediating the agar inhibition zone remained unresolved.
  evidence:
  - reference: doi:10.64898/2026.09.14.751415
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      using co-cultures with Escherichia coli
    explanation: Supports use of E. coli coculture to study F. betulina.
  - reference: doi:10.64898/2026.09.14.751415
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After 3 days, we added 1 mL of a standardized inoculum of bacteria
    explanation: Supports the staged addition of E. coli to established fungal MEB cultures.
