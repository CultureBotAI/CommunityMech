ecological_interactions:
- name: Moisture-Structured Rind Community Assembly
  description: Rind-style treatments changed reconstructed composition; drying also concentrates salt, so moisture
    was not an isolated niche mechanism. The environmental reconstruction, pairwise assays and succession subset
    have different memberships. The four genera in this record are not a complete defined assay roster.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
- name: Proposed Fungal Deacidification and Bacterial Growth Responses
  description: PARTIAL - fungal pH changes and pH-dependent bacterial growth suggest deacidification contributes
    to some responses. The current roster omits several responsive genera and includes bacteria with inhibitory
    responses; facilitation cannot be assigned across its four members. Exact-system evidence and assay scope remain
    unresolved in issue 765.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: Reproducible Natural-Rind Succession
  description: A simplified reconstruction reproduced broad in situ succession patterns, but was faster and quantitatively
    different. This observation does not demonstrate that earlier members facilitated later colonization. The succession
    subset must not be conflated with the environmental reconstruction or the incomplete four-genus roster.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:25036636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Patterns of community composition and succession observed in situ can be recapitulated in a simple
      in vitro system.
    explanation: Supports the abstract-level observation of in situ patterns reproduced in vitro, not exact temporal
      ordering or facilitation among the currently listed genera.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: >-
    The in vitro arm. Communities reconstructed on cheese curd agar, inoculated with roughly
    equal numbers of each member and followed over time; growth monitored by removing agar
    plugs from 96-well plates, homogenising in PBS and counting CFUs. Plates at room
    temperature.
  notes: >-
    `system_type` is OTHER because an agar-plug community in a 96-well plate has no enum
    value, and FLASK or any reactor type would assert a liquid culture this is not. The
    format is in instrument_detail instead.

    No operating_temperature: the source says "room temperature" rather than a figure, and
    turning that into 20 or 25 °C would invent precision the paper declined to give.

    This record covers an in situ survey as well as this in vitro reconstruction, and only
    the reconstruction is a cultivation. The in situ side is sampled cheese rind - the same
    distinction that made Avena_Rhizosphere unenrichable (#543), except that here the paper
    supplies both and only one of them belongs in this slot.

    The medium is the point rather than a detail: cheese curd agar is what makes the in vitro
    system recapitulate the in situ succession, which is the paper's central claim.
environmental_factors:
- name: rind moisture
  value: natural-rind treatment drier than undried plates
  description: Moisture was measured across rind styles and experimentally manipulated in vitro; the dry
    natural-rind treatment enriched taxa associated with low moisture and higher salt concentration.
- name: cheese curd medium pH
  value: initial low pH near 5, with fungal deacidification
  description: The study tested pH as a mechanism for bacterial responses to fungal growth on cheese curd
    agar.
growth_media:
- name: cheese curd agar
  temperature: '12'
  temperature_unit: C
  incubation_time: '4'
  incubation_time_unit: weeks
  preparation_notes: Simplified rind communities were inoculated onto cheese curd agar and subjected to
    bloomy, washed, natural, or unmanipulated control treatments.
