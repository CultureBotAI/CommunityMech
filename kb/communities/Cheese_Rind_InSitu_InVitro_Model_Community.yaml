ecological_interactions:
- name: Moisture-Structured Rind Community Assembly
  description: Moisture and rind-style manipulations selected different bacterial and fungal assemblages,
    with drier natural-rind conditions enriching Debaryomyces, Staphylococcus, and Penicillium.
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: doi:10.1016/j.cell.2014.05.041
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: moisture is the best predictor of rind community composition
    explanation: Supports moisture as a key environmental driver of community assembly.
  - reference: doi:10.1016/j.cell.2014.05.041
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: rind microbial communities diverge in composition when exposed to abiotic manipulations
    explanation: Supports the mechanistic role of abiotic manipulations in reconstructed communities.
- name: Fungal Deacidification Facilitates Bacterial Growth
  description: Yeasts and filamentous fungi increased cheese-curd-medium pH, and the study linked this
    deacidification to positive growth responses of multiple bacterial genera in fungal coculture.
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:25036636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: yeasts and filamentous fungi deacidify the cheese curd medium
    explanation: Supports fungal pH modification as a mechanism affecting bacterial growth.
  - reference: PMID:25036636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: positive growth responses of many bacteria to the presence of a fungus
    explanation: Supports bacterial growth facilitation by fungal community members.
- name: Reproducible Natural-Rind Succession
  description: A six-genus natural-rind subset recapitulated key features of in situ succession on cheese
    curd agar, with early Staphylococcus and Candida followed by later Brevibacterium, Brachybacterium,
    Penicillium, and Scopulariopsis.
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: doi:10.1016/j.cell.2014.05.041
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: succession in vitro was highly reproducible amongst replicates
    explanation: Supports reproducible temporal assembly in the reconstructed natural-rind community.
environmental_factors:
- name: rind moisture
  value: natural-rind treatment drier than undried plates
  description: Moisture was measured across rind styles and experimentally manipulated in vitro; the dry
    natural-rind treatment enriched taxa associated with low moisture and higher salt concentration.
  evidence:
  - reference: PMID:25036636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 62% final moisture of the medium compared to 83% in plates that were not dried
    explanation: Supports the moisture contrast used for the natural-rind treatment.
- name: cheese curd medium pH
  value: initial low pH near 5, with fungal deacidification
  description: The study tested pH as a mechanism for bacterial responses to fungal growth on cheese curd
    agar.
  evidence:
  - reference: PMID:25036636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: fresh cheeses have a relatively low pH before rind development occurs
    explanation: Supports the low-pH starting environment relevant to rind development.
