id: CommunityMech:000153
name: Cheese Rind In Situ-In Vitro Model Community
description: >
  A tractable fermented-food surface biofilm system based on cheese rind microbial communities. Wolfe
  and colleagues surveyed 137 rind communities across 10 countries, isolated representatives of the
  dominant bacterial and fungal genera, and reconstructed simplified cheese-curd-agar communities in
  vitro to test how moisture, washing, pH, and bacterial-fungal interactions shape reproducible
  community assembly and succession.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Use naturally aged cheese rinds as a manipulable model system for mechanisms of microbial
    community assembly, succession, and bacterial-fungal interactions.
  assembly_strategy: Culture dominant rind-associated bacteria and fungi from representative cheeses and
    inoculate simplified communities onto cheese curd agar under controlled rind-style treatments.
  perturbation_design: Manipulate fungal inoculum, washing with salt solution, and moisture to mimic
    bloomy, washed, natural, and control rind environments.
  measurement_endpoints:
  - 16S rDNA and ITS community composition
  - whole-community shotgun metagenomic functional profiles
  - colony-forming units in reconstructed communities
  - bacterial-fungal pairwise growth responses
  - pH changes in cheese curd agar
  evidence:
  - reference: PMID:25036636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: developed cheese rinds as model microbial communities
    explanation: Supports the design objective of treating cheese rinds as model microbial communities.
environment_term:
  preferred_term: laboratory reconstructed cheese rind biofilm
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The source communities are naturally aged cheese rind biofilms; this curated record emphasizes
    the controlled in vitro reconstruction on cheese curd agar.
