ecological_interactions:
- name: Maternal Strain Sharing and Persistence Association
  description: Among 17 mother-infant pairs, maternal strain sharing was associated with subsequent infant persistence.
    Maternal transmission was particularly enriched among Bacteroides, whereas persistent Bifidobacterium strains
    often lacked a maternal match. Sharing supports maternal-origin association, not a selectively established dominant
    driver or repeated reseeding mechanism. The canonical Bacteria entry represents the sampled maternal-origin
    strain class, not a property of all bacteria.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34622230
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: maternal gut strains are significantly more likely to persist in the infant gut than other strains
    explanation: Supports the positive maternal-sharing association, not a dominant isolated causal driver applying
      equally to every persister genus.
  participating_taxa:
  - preferred_term: maternal-origin gut bacterial strains
    term:
      id: NCBITaxon:2
      label: Bacteria
  downstream:
  - target: Bacteroides and Bifidobacterium First-Year Persistence
    description: PARTIAL - maternal gut adaptation or repeated introduction could support infant retention of shared
      strains, particularly the Bacteroides-enriched maternal subset. The observational association does not isolate
      either mechanism or explain all Bifidobacterium persisters.
- name: Bifidobacterium Persister Carbohydrate-Gene Enrichment
  description: 'Within-genus comparison of 12 Bifidobacterium persisters and 18 non-persisters found higher CAZyme
    diversity and coding density in persister genomes. This is positive genomic association, not measured expression,
    enzyme activity or demonstrated commensalism. The separate E. coli comparison used three persisters and 25 non-persisters;
    its iron-acquisition and adhesion findings cannot be assigned to the canonical Bacteroides or Bifidobacterium
    entries. Exact E. coli representation and broader trait structure remain unresolved under #1515.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
    notes: Genomic carbohydrate-associated potential, not measured catalytic activity or expression.
  evidence:
  - reference: PMID:34622230
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Bifidobacterium persisters dedicated a significantly higher percentage of their genomes to CAZymes
    explanation: Primary Results support Bifidobacterium CAZyme coding-density association, not transfer of E. coli
      iron/adhesion annotations or a causal enzyme perturbation.
  participating_taxa:
  - preferred_term: persistent infant Bifidobacterium colonizers
    term:
      id: NCBITaxon:1678
      label: Bifidobacterium
  downstream:
  - target: Bacteroides and Bifidobacterium First-Year Persistence
    description: PARTIAL - a broader encoded carbohydrate repertoire could support substrate use and persistence
      of Bifidobacterium strains within the downstream persister group. Within-genus enrichment supports this hypothesis,
      not measured enzyme flux or necessity, and does not assign E. coli iron/adhesion traits to Bacteroides or
      Bifidobacterium.
- name: Bacteroides and Bifidobacterium First-Year Persistence
  description: Bacteroides and Bifidobacterium were prominent among 59 of 560 early colonizer strains that persisted
    into late first-year sampling. The approximately 11 percent denominator is all eligible early strains, not each
    genus separately. Early detection was within the first two months; persistence required detection at month eight
    or later, accommodating missing or inadequate month-twelve samples. Strain matching used 99.999 percent population
    ANI over at least half the compared genome. This is observed persistence, not evidence that every member expressed
    adhesion or iron-acquisition traits.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: persistent infant Bacteroides colonizers
    term:
      id: NCBITaxon:816
      label: Bacteroides
  - preferred_term: persistent infant Bifidobacterium colonizers
    term:
      id: NCBITaxon:1678
      label: Bifidobacterium
  evidence:
  - reference: PMID:34622230
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Approximately 11% of early colonizers, primarily Bacteroides and Bifidobacterium, persist during the
      first year of life
    explanation: Supports the observed persister distribution; the primary Methods bound eligibility and strain
      identity, not a universal genus-specific trait mechanism.
  - reference: PMID:34622230
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: When considering all infants, Bacteroides and Bifidobacterium strains were more likely to persist than
      were strains of other bacterial genera
    explanation: Supports the observed persister distribution; the primary Methods bound eligibility and strain
      identity, not a universal genus-specific trait mechanism.
