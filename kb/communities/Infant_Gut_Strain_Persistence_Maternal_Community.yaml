discussions:
- discussion_id: infant_bacterial_taxon_specific_persistence
  prompt: Which taxon-specific traits causally contribute to strain persistence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Maternal Strain Sharing and Persistence Association
  - ecological_interactions#Bifidobacterium Persister Carbohydrate-Gene Enrichment
  - ecological_interactions#Bacteroides and Bifidobacterium First-Year Persistence
  rationale: 'The maternal-sharing and Bifidobacterium CAZyme routes remain partial models. E. coli iron-acquisition,
    adhesion and toxin annotations are positive genetic-potential results from three persisters versus 25 non-persisters,
    not expression, flux or knockout evidence. All three E. coli persisters came from preterm infants in a disease-enriched
    sample. #1515 tracks missing exact E. coli representation and valid trait structure; do not transfer those results
    to other taxa or erase them as negative evidence. Prematurity, early antibiotics, hospitalization and feeding
    covary, so the birth-status comparison is not an isolated cause. Full cached primary main text, Methods, Table
    1 and figure captions read, but not external supplementary files, raw data, code or original images. One-community
    Edison dry run only; no paid report or new graph structure. Canonical taxonomy and non-graph fields are preserved,
    not recertified.'
