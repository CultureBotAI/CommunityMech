discussions:
- discussion_id: taxonomy_resolution
  prompt: The final reactor community is resolved primarily at phylum level by 16S rRNA sequencing and by group-specific
    qPCR. Species- or MAG-level assignments for the dominant Euryarchaeota, Firmicutes, and Coprothermobacterota
    partners remain unresolved.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: Genome-resolved metagenomics or isolates from the day-69 culture would determine which exact hydrogenotrophic,
    acetoclastic, and acetate-oxidizing taxa executed the inferred final-phase metabolism.
  evidence:
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: full_text
    snippet: The microbial community structure was analysed at the phylum level
    explanation: Confirms that the final amplicon composition was reported at phylum resolution.
  posed_by: codex
  posed_date: '2026-09-21'
- discussion_id: industrial_nonsterile_stability
  prompt: Long-term robustness under continuous, non-sterile industrial feeding is unvalidated because the proof-of-concept
    system used autoclaved digestate.
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - engineering_design
  - cultivation_setup
  rationale: A non-sterile continuous-feeding trial would test whether the selected thermophilic consortium remains
    stable under industrially realistic operation rather than washout-managed autoclaved-sludge proof-of-concept
    conditions.
  evidence:
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: full_text
    snippet: long-term stability under non-sterile conditions typical of industrial operation remains to be validated
    explanation: Names the industrial robustness gap stated by the authors.
  posed_by: codex
  posed_date: '2026-09-21'
- discussion_id: biomethane_causal_scope_batch120
  prompt: Which taxon-specific VFA and methane routes were active beyond the bulk chemistry and DNA profiles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Thermophilic H2/CO2 Biomethanation
  - ecological_interactions#VFA dynamics and inferred interspecies turnover
  rationale: The study follows one reactor through sequential temperature, gas and washout changes. Methane production
    is measured, but its organism-specific allocation and interspecies fluxes are inferred. Direct sludge qPCR/16S
    can include DNA from killed or inactive cells; bacterial plate recovery is a separate culturable fraction. The
    original taxonomy-resolution and industrial-stability discussions remain open. No new causal link between the
    two process nodes is introduced.
  evidence:
  - reference: PMID:42293522
    snippet: These approaches reflect the total microbial DNA pool
  posed_by: codex
  posed_date: '2026-10-08'
