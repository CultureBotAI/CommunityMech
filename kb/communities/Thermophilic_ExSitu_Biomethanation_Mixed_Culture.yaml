cultivation_setup:
- cultivation_mode: SEMI_CONTINUOUS
  system_type: STIRRED_TANK_BIOREACTOR
  instrument_detail: Custom 1.73 L CSTR with a 0.4 L working volume and a 60 mm Rushton-type impeller operated at 2,500 rpm.
  working_volume: 0.4
  working_volume_unit: L
  operating_temperature: 50
  operating_temperature_unit: °C
  temperature_controlled: true
  controls_notes: External heating controlled reactor temperature; intermittent washouts regulated volatile fatty acids and
    restored the working volume.
  notes: Gas feed was continuous, while liquid replacement in the final phase was a daily 25% draw-and-fill washout.
  evidence:
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: total volume of 1.73
    explanation: Supports the custom CSTR total and working volumes.
