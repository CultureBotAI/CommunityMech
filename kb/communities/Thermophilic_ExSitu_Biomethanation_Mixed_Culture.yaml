id: CommunityMech:000416
name: Thermophilic Ex-Situ Biomethanation Mixed Culture
description: An engineered mixed microbial culture for ex-situ thermophilic biomethanation that was enriched from autoclaved
  anaerobic digested sewage sludge in a 0.4 L working-volume continuously stirred tank reactor. The proof-of-concept reactor
  was conditioned with intermittent washouts and reached sustained H2/CO2 4:1 throughput of 500 L/L/d at 50 C in the final
  phase, where Euryarchaeota, Firmicutes, and Coprothermobacterota dominated the 16S phylum profile and Methanobacteria, Methanosarcina,
  and Methanosaeta were tracked by qPCR as methane content rose to 86% by day 69.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: METHANOGENESIS
engineering_design:
  objective: Select and stabilize a mixed anaerobic-digestate consortium for high-throughput ex-situ H2/CO2 biomethanation
    in a thermophilic CSTR at atmospheric pressure.
  assembly_strategy: Filter anaerobic digested sewage sludge, autoclave it to partially reduce competing biomass without fully
    eliminating methanogens, and condition the surviving consortium with thermophilic H2/CO2 gas feed.
  inoculation_strategy: Load 0.4 L of autoclaved digestate sludge from a local wastewater treatment multi-stage mesophilic
    digestion plant into a single custom CSTR proof-of-concept reactor.
  passaging_regimen: Use pH- and CH4-triggered 50% culture washouts during early conditioning, followed by 25% daily washouts
    during phase 4 at 50 C and 500 L/L/d H2/CO2.
  perturbation_design: Progress from mesophilic 37 C operation, to 2-3 C daily temperature increases up to 55 C, to final
    50 C operation with H2:CO2 throughput increased to 500 L/L/d.
  measurement_endpoints:
  - Effluent CH4, CO2, and H2 composition
  - 16S rRNA phylum-level community structure
  - Methanobacteria, Methanosarcina, Methanosaeta, and bacterial qPCR gene copies
  - Volatile fatty acid concentration and composition
  - pH during washout-managed operation
  evidence:
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study presents a novel operational strategy integrating autoclave pretreatment
    explanation: Supports the combination of autoclaving, microbial conditioning, and washouts as the engineered strategy.
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ex-situ biomethanation was carried out in a custom-designed Continuous Stirred Tank Reactor (CSTR)
    explanation: Identifies the reactor format used to cultivate the mixed culture.
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Anaerobic digested sewage sludge, sourced from a local wastewater treatment multi-stage mesophilic digestion
      plant
    explanation: Identifies the source sludge used to seed the mixed culture.
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: autoclaved at 121
    explanation: Supports heat treatment of the digestate before cultivation.
