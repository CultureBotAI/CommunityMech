ecological_interactions:
- name: Thermophilic H2/CO2 Biomethanation
  description: A conditioned mixed culture converted externally supplied H2/CO2 to methane in a single proof-of-concept
    CSTR. Output methane content reached 86% by day 69 in the final thermophilic phase; exceeding 90% was proposed,
    not observed. Cylinder-fed gas conversion is not itself interspecies cross-feeding. Methanobacteria enrichment
    and contributions by Methanosarcina are source interpretations informed by group-specific qPCR and community
    profiles, not taxon-resolved flux measurements. The listed phylum, class and genus are overlapping taxonomic
    summaries rather than independent strain members. Sequential conditioning and washout changes do not independently
    isolate temperature as the cause of every performance difference.
  scope: COMMUNITY_LEVEL
  participating_taxa:
