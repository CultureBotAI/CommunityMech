- discussion_id: taxonomy_resolution
  prompt: The final reactor community is resolved primarily at phylum level by 16S rRNA sequencing and by group-specific qPCR.
    Species- or MAG-level assignments for the dominant Euryarchaeota, Firmicutes, and Coprothermobacterota partners remain
    unresolved.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: Genome-resolved metagenomics or isolates from the day-69 culture would determine which exact hydrogenotrophic,
    acetoclastic, and acetate-oxidizing taxa executed the inferred final-phase metabolism.
  evidence:
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: full_text
    snippet: The microbial community structure was analysed at the phylum level
    explanation: Confirms that the final amplicon composition was reported at phylum resolution.
  posed_by: codex
  posed_date: '2026-09-21'
- discussion_id: industrial_nonsterile_stability
  prompt: Long-term robustness under continuous, non-sterile industrial feeding is unvalidated because the proof-of-concept
    system used autoclaved digestate.
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - engineering_design
  - cultivation_setup
  rationale: A non-sterile continuous-feeding trial would test whether the selected thermophilic consortium remains stable
    under industrially realistic operation rather than washout-managed autoclaved-sludge proof-of-concept conditions.
  evidence:
  - reference: PMID:42293522
    supports: SUPPORT
    evidence_source: full_text
    snippet: long-term stability under non-sterile conditions typical of industrial operation remains to be validated
    explanation: Names the industrial robustness gap stated by the authors.
