    evidence_source: OTHER
    snippet: favoured hydrogenotrophic Methanobacteria
    explanation: The source interprets enrichment from group-level measurements; not organism-specific gas tracing.
- name: VFA dynamics and inferred interspecies turnover
  description: 'The measured VFA pool fell from approximately 5 to 3.5 g/L during the final phase and ended with
    73% acetate, 16% propionic acid and 10% n-butyric acid. These are pool measurements during washout-managed operation,
    not direct rates of metabolite exchange. PARTIAL: the authors interpret Firmicutes as VFA producers, Coprothermobacterota
    as acetate oxidizers and Methanosaeta/Methanothrix as acetoclastic methanogens, with Methanosarcina potentially
    using both substrates. Group abundance and gene copies do not demonstrate those exact taxa executing each route,
    metabolic activity per cell, or product-removal-dependent thermodynamic cooperation. Washout and substrate-pool
    changes remain alternatives to attributing every VFA decrease to consumption.'
  scope: COMMUNITY_LEVEL
