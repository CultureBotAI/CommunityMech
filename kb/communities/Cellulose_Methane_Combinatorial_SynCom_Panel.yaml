id: CommunityMech:000394
name: Cellulose-to-Methane Combinatorial SynCom Panel
description: >
  A bounded anaerobic synthetic-community panel assembled from the cellulolytic
  bacterium Ruminiclostridium cellulolyticum H10, the hydrogenotrophic methanogen
  Methanospirillum hungatei JF-1, the acetoclastic methanogen Methanosaeta
  concilii GP6, and the sulfate-reducing bacterium Desulfovibrio vulgaris
  Hildenborough. The experiment co-cultured all cellulose-fed bi-, tri-, and
  quad-species combinations containing R. cellulolyticum, plus the R.
  cellulolyticum monoculture, and used proteogenomics, stoichiometric flux
  modeling, and SMETANA to resolve context-dependent cross-feeding, competition,
  and methanogenic carbon flow.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: METHANOGENESIS
engineering_design:
  objective: Quantify how species composition and richness rewire cooperative
    and competitive metabolic interactions during anaerobic conversion of
    cellulose to methane and carbon dioxide.
  assembly_strategy: Assemble a fully combinatorial cellulose-fed panel from
    R. cellulolyticum, M. hungatei, M. concilii, and D. vulgaris, including one
    mono-culture, three bi-cultures, three tri-cultures, and the four-species
    quad-culture.
  perturbation_design: Pair stoichiometric flux modeling and SMETANA
    simulations with seven-day anaerobic bottle cultures spanning the
    R. cellulolyticum-centered species combinations.
  measurement_endpoints:
  - acetate, lactate, ethanol, formate, glucose, and cellobiose by HPLC
  - H2, CH4, and CO2 by gas chromatography
  - TMT metaproteomics searched against a custom four-species database
  - modeled carbon and electron fluxes
  - SMETANA metabolic interaction potential and metabolic resource overlap
  evidence:
  - &design_evidence
    reference: PMID:40937471
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Different combinations of R. cellulolyticum, M. hungatei, M. concilii,
      and D. vulgaris, including one mono-culture, three bi-cultures, three
      tri-cultures, and one quad-culture, were co-cultured in a medium with
      cellulose as the sole carbon source
    explanation: Supports the bounded mono-, bi-, tri-, and quad-species
      combinatorial panel and its cellulose-fed anaerobic growth context.
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      We applied a systems biology framework combining proteogenomics,
      stoichiometric flux modeling, and SMETANA (Species Metabolic Coupling
      Analysis) to quantify syntrophic cooperation and competition across
      configurations
    explanation: Supports the modeled and proteomic endpoints for the panel.
