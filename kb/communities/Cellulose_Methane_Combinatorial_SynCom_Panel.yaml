ecological_interactions:
- name: Combinatorial cellulose-fed interaction rewiring
  description: >
    Species composition altered the modeled balance between cooperative
    metabolite exchange and competition across the R. cellulolyticum-centered
    bi-, tri-, and quad-species communities, with tri-cultures showing enhanced
    cooperation and reduced competition compared with their corresponding
    bi-cultures.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Acetoclastic methanogenesis as dominant methane route
    description: The higher-cooperation multi-species cultures were evaluated by
      stoichiometric flux modeling, which identified acetoclastic methanogenesis
      as the dominant methane-producing route.
  evidence:
  - *design_evidence
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: These results suggest that tri-cultures enhance cooperation and reduce competition
    explanation: Summarizes the modeled tri-culture shift in SMETANA MIP/MRO
      scores across the panel.
- name: Acetoclastic methanogenesis as dominant methane route
  description: >
    In the multi-species panel, acetate cross-feeding to the acetoclastic
    methanogen M. concilii was inferred as the primary route from cellulose
    fermentation products to methane and carbon dioxide.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ruminiclostridium cellulolyticum H10
    term:
      id: NCBITaxon:1521
      label: Ruminiclostridium cellulolyticum
  target_taxon:
    preferred_term: Methanosaeta concilii GP6
    term:
      id: NCBITaxon:2223
      label: Methanothrix soehngenii
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: acetoclastic methanogenesis
    term:
      id: GO:0019385
      label: methanogenesis, from acetate
  downstream:
  - target: Combinatorial cellulose-fed interaction rewiring
    description: Acetoclastic methane production was the central carbon-flow
      route through which species composition produced non-additive tri- and
      quad-culture behavior.
  evidence:
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      Flux analysis identified acetoclastic methanogenesis as the primary CH₄
      and CO₂ source, especially in multi-species cultures
    explanation: Supports M. concilii acetoclastic methanogenesis as the
      dominant modeled methane route in the richer panel members.
- name: D. vulgaris hydrogen turnover supports methanogenesis
  description: >
    D. vulgaris acted as a context-dependent syntrophic lactate oxidizer: its
    redox and hydrogen turnover tightened interspecies hydrogen transfer and
    improved methanogenic fluxes in the more complex cellulose-fed assemblies.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Desulfovibrio vulgaris Hildenborough
    term:
      id: NCBITaxon:882
      label: Nitratidesulfovibrio vulgaris str. Hildenborough
  target_taxon:
    preferred_term: Methanospirillum hungatei JF-1
    term:
      id: NCBITaxon:323259
      label: Methanospirillum hungatei JF-1
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  biological_processes:
  - preferred_term: hydrogenotrophic methanogenesis
    term:
      id: GO:0019386
      label: methanogenesis, from carbon dioxide
  evidence:
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      Desulfovibrio vulgaris likely promotes hydrogen turnover, maintaining
      low partial pressures that favor this pathway
    explanation: Supports the inferred D. vulgaris hydrogen-turnover effect on
      hydrogenotrophic methanogenesis in the modeled panel.
