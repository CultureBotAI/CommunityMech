    label: methane
  relevance: Methane output reported how each species combination routed
    cellulose-derived carbon and electrons through hydrogenotrophic and
    acetoclastic methanogenesis.
  evidence:
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      carbon and electron transfers were measured
    explanation: Supports methane as a measured terminal product in the
      carbon- and electron-flow experiment.
growth_media:
- name: modified VM medium with 10 g/L cellulose
  composition:
  - name: cellulose
    concentration: 10
    unit: g/L
  temperature: '34'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: 3% H2 / 97% N2
  shaking_speed: '200'
  shaking_speed_unit: rpm
  incubation_time: '7'
  incubation_time_unit: d
  vessel_type: 160 mL anaerobic serum bottle with 20 mL working volume
  preparation_notes: >
    R. cellulolyticum and D. vulgaris were revived in VM and LS4D media at
    34°C; M. hungatei and M. concilii were pre-cultured in RST medium with
    H2/CO2 and acetate at 37°C; all strains were acclimated in VM and inoculated
    at roughly 5 x 10^7 cells per species.
  evidence:
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cultures were grown in 160 ml anaerobic bottles with 20 ml modified VM medium plus 10 g/L cellulose
    explanation: Defines the serum-bottle vessel, working volume, medium, and
      cellulose concentration.
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cultures were incubated at 34°C, 200 rpm for 7 days under 3% H₂/97% N₂
    explanation: Defines the incubation temperature, shaking speed, duration,
      and anaerobic gas phase.
