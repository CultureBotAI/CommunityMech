      R. cellulolyticum and M. concilii.
- preferred_term: lactate
  chebi_term:
    id: CHEBI:24996
    label: lactate
  relevance: Lactate linked R. cellulolyticum fermentation to D. vulgaris
    metabolism and was one of the measured HPLC intermediates.
  evidence:
  - reference: PMID:40937471
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Metabolites (acetate, lactate, ethanol, formate, glucose, cellobiose) were measured by HPLC
    explanation: Supports lactate as a measured panel metabolite.
- preferred_term: methane
  chebi_term:
