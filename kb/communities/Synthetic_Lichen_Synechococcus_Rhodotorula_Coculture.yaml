id: CommunityMech:000149
name: Synthetic Lichen Synechococcus-Rhodotorula Coculture
description: >
  A synthetic lichen-inspired phototroph-heterotroph coculture pairing engineered sucrose-secreting
  Synechococcus elongatus PCC 7942 with the oleaginous yeast Rhodotorula glutinis. The cyanobacterium
  fixes carbon dioxide under illumination and exports sucrose, while R. glutinis consumes the cyanobacterial
  photosynthate, increases coculture biomass and lipid yield, and alleviates reactive oxygen stress that
  limits low-density cyanobacterial axenic growth.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Establish a lichen-mimicking artificial phototroph-heterotroph production platform for biomass,
    lipid, and biofuel precursor production from light and carbon dioxide.
  assembly_strategy: Pair cscB+ sucrose-secreting Synechococcus elongatus PCC 7942 with compatible oleaginous
    yeasts in modified BG-11 coculture medium; the R. glutinis pairing showed stable performance.
  measurement_endpoints:
  - cyanobacterial and yeast growth
  - sucrose utilization
  - biomass yield
  - lipid yield and fatty acid profile
  - hydrogen peroxide and reactive oxygen stress effects
  evidence:
  - reference: doi:10.1186/s13068-017-0736-x
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: establish a synthetic system mimicking lichens
    explanation: Supports the engineering objective of constructing an artificial lichen-like coculture.
