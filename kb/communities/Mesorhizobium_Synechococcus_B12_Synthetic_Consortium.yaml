id: CommunityMech:000315
name: Mesorhizobium TaiHu-Synechococcus PCC 7002 Vitamin B12 Synthetic Consortium
description: >
  A synthetic consortium built by co-culturing the marine cyanobacterium Synechococcus sp. PCC 7002
  (Syn7002) — a model strain that lacks the gene cluster for vitamin B12 biosynthesis and therefore
  depends on other microbes for it — with a bloom-forming Microcystis community from Lake Taihu,
  then purifying the result. Metagenomics showed the early community consisted mainly of Syn7002,
  Mesorhizobium sp. TaiHu (MesTH) and Pseudomonas sp. TaiHu (PseTH); PseTH declined once the
  community stabilised, leaving the cyanobacterium and MesTH as the persistent pair. Electron
  microscopy found rod-shaped bacteria clustered around Syn7002 cells. Metatranscriptomics showed
  vitamin B12 biosynthesis and transport genes significantly upregulated in MesTH, and B12-positive
  control experiments supported complementarity between the two strains, so the community is a
  worked example of a vitamin auxotrophy being satisfied by a partner rather than by the medium.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Establish a stable partner community for a vitamin B12-auxotrophic cyanobacterium and
    identify which member supplies the vitamin and by what route.
  assembly_strategy: Co-culture Synechococcus sp. PCC 7002 with a bloom-forming Microcystis
    community from Lake Taihu, then purify; characterise the resulting consortium by metagenomics,
    metatranscriptomics and strain transcriptomics, with vitamin B12-positive controls.
  measurement_endpoints:
  - Community membership and relative abundance over stabilisation
  - Expression of vitamin B12 biosynthesis and transport genes in MesTH
  - Growth of Syn7002 with and without supplied vitamin B12
  evidence:
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we established a synthetic microbial consortium by co-culturing Syn7002 with a
      bloom-forming Microcystis community, followed by purification
    explanation: States the assembly route — co-culture with a natural bloom community, then
      purification — which is what makes this a synthetic consortium rather than a field sample.
environment_term:
  preferred_term: laboratory co-culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The consortium was assembled and characterised in culture; its source community came from
    a freshwater lake bloom.
modeled_environment:
