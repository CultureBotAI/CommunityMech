ecological_interactions:
- name: Vitamin B12 Provision from Mesorhizobium TaiHu to Synechococcus PCC 7002
  description: >
    Syn7002 lacks the vitamin B12 biosynthesis gene cluster, and MesTH significantly upregulates
    B12 biosynthesis and transport genes in the consortium. Together with B12-positive control
    experiments, this supports MesTH supplying the small amount of B12 Syn7002 requires, making the
    partnership a vitamin-mediated cross-feeding rather than a shared-medium coexistence.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Mesorhizobium sp. TaiHu (MesTH)
    term:
      id: NCBITaxon:68287
      label: Mesorhizobium
  target_taxon:
    preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  metabolites:
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
    notes: The cyanobacterium cannot synthesise it; the paper reports MesTH supplying the small
      amount required.
  evidence:
  - reference: PMID:41790499
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The results further suggest that MesTH promotes the growth of Syn7002 in the community
      by providing the small amount of vitamin B12 needed for its growth
    explanation: PARTIAL - the paper states this as what the results "suggest", supported by
      expression data and B12-positive controls rather than by direct measurement of transfer
      between the strains, so provision is well-evidenced but not demonstrated isotopically.
- name: Close Spatial Association of Partner Bacteria with Syn7002 Cells
  description: >
    Electron microscopy found numerous rod-shaped bacteria clustered around Syn7002 cells,
    indicating a physical association between the cyanobacterium and its partner bacteria rather
    than mere co-occurrence in the medium.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41790499
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Electron microscopy revealed numerous rod-shaped bacteria clustered around Syn7002
      cells, indicating close spatial associations between species
    explanation: PARTIAL - microscopy establishes spatial association but does not identify which
      taxon the rod-shaped cells belong to, nor whether the association is required for the
      exchange, so it is recorded at community level without a named partner.
environmental_factors:
- name: Vitamin B12-positive control supplementation
  description: >
    Growth experiments with supplied vitamin B12 were used as a positive control alongside the
    expression data, and are part of what supports complementarity between the two strains.
  evidence:
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Combined with vitamin B12-positive control experiments, these results confirm potential
      vitamin B12 complementarity between the two strains
    explanation: Records the supplementation control as a tested condition and the basis, with the
      expression data, for the complementarity claim.
