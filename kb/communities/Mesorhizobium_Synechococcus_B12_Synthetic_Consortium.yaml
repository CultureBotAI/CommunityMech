ecological_interactions:
- name: Microcystis Disappearance During Salinity Passaging
  description: Increasing salinity during Syn7002 co-cultivation with a Lake Taihu bloom inoculum was accompanied
    by disappearance of Microcystis and persistence of associated epibionts. This is a treatment-associated compositional
    result, not proof of niche partitioning, an exclusive salinity mechanism or the cause of later B12 complementarity.
    Microcystis is the source inoculum, not a confirmed member of the final pair.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  - preferred_term: bloom-forming Microcystis community (source inoculum)
    term:
      id: NCBITaxon:1125
      label: Microcystis <cyanobacteria>
  evidence:
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Syn7002 was co-cultured with algal sediment collected from a cyanobacterial bloom in Lake TaiHu

      '
    explanation: 'Supports the Microcystis-bloom source inoculum used to seed the Syn7002 synthetic community.

      '
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'the salinity gradient was gradually increased, leading to the disappearance of Microcystis

      '
    explanation: 'Supports salinity passaging as the pressure that removed the original Microcystis source while
      epibionts persisted.

      '
- name: Syn7002-MesTH-PseTH Community Sorting
  description: Across successive streak-purification rounds, Syn7002, MesTH and PseTH were the major early components;
    relative PseTH abundance declined and MesTH became dominant after the second round. This preserves compositional
    stabilization without asserting PseTH extinction, competitive exclusion, absolute viable growth or B12 availability
    as the isolated cause. Purification and changing conditions are part of the observation, not an ecological arrow
    to later assays.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  - preferred_term: Mesorhizobium sp. TaiHu (MesTH)
    term:
      id: NCBITaxon:68287
      label: Mesorhizobium
  - preferred_term: Pseudomonas sp. TaiHu (PseTH)
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  evidence:
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Syn7002, PseTH and MesTH constituted the major components of the community
    explanation: 'Supports the three dominant early members resolved during Syn7002 synthetic-community assembly.

      '
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: MesTH became the dominant component after the second round
    explanation: 'Supports MesTH replacing PseTH as the dominant partner as the consortium stabilized.

      '
- name: Vitamin B12 Provision from Mesorhizobium TaiHu to Synechococcus PCC 7002
  description: HYPOTHESIZED - MesTH supplies B12 needed by auxotrophic Syn7002 in the washed, B12-free BG11 coculture.
    Positive growth rescue, B12-supplemented controls and genomic/transcript evidence support this proposed cross-feeding.
    Targeted LC-MS/MS did not detect free B12 in day-20 pelleted cultures; that is not an extracellular assay, proof
    of rapid utilization or demonstration of donor-to-recipient transfer. Delivery by release versus contact and
    the necessity of MesTH B12 biosynthesis were not selectively resolved.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Mesorhizobium sp. TaiHu (MesTH)
    term:
      id: NCBITaxon:68287
      label: Mesorhizobium
  target_taxon:
    preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  metabolites:
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
    notes: Proposed transferred cofactor. The pellet non-detection does not quantify secretion, transfer or uptake.
  biological_processes:
  - preferred_term: cobalamin biosynthetic process
    term:
      id: GO:0009236
      label: cobalamin biosynthetic process
  downstream:
  - target: MesTH Growth Rescue of B12-Limited Syn7002
    description: HYPOTHESIZED - B12 supplied by MesTH could relieve the auxotroph limitation and explain positive
      Syn7002 growth rescue. Coculture and added-B12 controls support this mechanism without directly measuring
      vitamin delivery or selectively disrupting the donor pathway.
  evidence:
  - reference: PMID:41790499
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The results further suggest that MesTH promotes the growth of Syn7002 in the community by providing
      the small amount of vitamin B12 needed for its growth
    explanation: PARTIAL - source-explicit proposed provision supported by positive rescue and expression. Pellet
      B12 was undetected; the limitation is not merely absence of isotopic tracing, but unresolved delivery and
      pathway necessity.
- name: Close Spatial Association of Partner Bacteria with Syn7002 Cells
  description: SEM showed rod-shaped bacteria clustered around Syn7002 in fixed, dehydrated coculture material.
    MesTH morphology is compatible with the rods, but morphology alone does not independently resolve every cell
    identity. Close association is a positive observation, not experimentally demonstrated colonization facilitation,
    mandatory contact or vitamin transfer.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  downstream:
  - target: Vitamin B12 Provision from Mesorhizobium TaiHu to Synechococcus PCC 7002
    description: HYPOTHESIZED - proximity could facilitate local B12 availability or contact-associated delivery.
      The source leaves extracellular release versus direct contact unresolved; microscopy does not establish that
      proximity is required or sufficient for transfer.
  evidence:
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Electron microscopy revealed numerous rod-shaped bacteria clustered around Syn7002 cells, indicating
      close spatial associations between species
    explanation: 'Supports physical clustering of rod-shaped partner bacteria around Syn7002 cells without assigning
      those cells to a specific bacterial taxon.

      '
- name: MesTH Vitamin B12 Biosynthesis and Transport Response
  description: MesTH showed B12 biosynthesis/transport-associated transcript changes during community formation,
    while Syn7002 had lower reported transporter expression. Figure 4 presents log2 fold changes relative to the
    initial stage; these are not absolute cross-species vitamin-output measurements or a matched coculture-versus-monoculture
    induction test. Transcription supports the proposed B12 role, not secretion, uptake flux or pathway necessity.
    Nitrogen-related expression is likewise not direct nitrogen fixation or assimilation.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  - preferred_term: Mesorhizobium sp. TaiHu (MesTH)
    term:
      id: NCBITaxon:68287
      label: Mesorhizobium
  metabolites:
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
  biological_processes:
  - preferred_term: cobalamin biosynthetic process
    term:
      id: GO:0009236
      label: cobalamin biosynthetic process
    notes: Genomic/transcriptional support for biosynthetic capacity, not measured B12 production flux.
  downstream:
  - target: Vitamin B12 Provision from Mesorhizobium TaiHu to Synechococcus PCC 7002
    description: HYPOTHESIZED - MesTH biosynthetic and transport capacity could support B12 availability to Syn7002.
      Transcript profiles are consistent with this proposal but do not establish that their changes drive secretion
      or donor-to-recipient transfer.
  evidence:
  - reference: PMID:41790499
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'vitamin B12 biosynthesis and transport-related genes were more highly expressed in MesTH compared
      to Syn7002

      '
    explanation: Source-reported expression comparison, with Figure 4 using within-time-series fold changes. It
      is not an absolute cross-species synthesis/output comparison or direct transfer measurement.
- name: MesTH Growth Rescue of B12-Limited Syn7002
  description: Adding washed MesTH to washed Syn7002 in B12-free BG11 promoted the cyanobacterial growth endpoint
    relative to the unsupplemented alga-only condition; supplied B12 was the positive control. Growth was followed
    by absorbance and culture appearance over 20 days. Preserve the positive rescue without claiming directly measured
    photosynthetic flux, reciprocal benefit, universal long-term survival or that B12 is the sole mediator. Washing
    does not by itself quantify residual or intracellular vitamin stores.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Synechococcus sp. PCC 7002 (Syn7002)
    term:
      id: NCBITaxon:32049
      label: Picosynechococcus sp. PCC 7002
  - preferred_term: Mesorhizobium sp. TaiHu (MesTH)
    term:
      id: NCBITaxon:68287
      label: Mesorhizobium
  metabolites:
  - preferred_term: vitamin B12
    term:
      id: CHEBI:176843
      label: vitamin B12
  evidence:
  - reference: PMID:41790499
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'the presence of MesTH promoted the growth of Syn7002 compared to the group without vitamin B12 supplementation

      '
    explanation: 'Supports MesTH-mediated growth rescue of B12-limited Syn7002.

      '
