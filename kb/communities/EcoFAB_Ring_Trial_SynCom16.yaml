ecological_interactions:
- name: Rhodococcus-, Methylobacterium-, and Mycobacterium-Dominated SynCom16 Root Assembly
  description: In the absence of the fast-growing competitor Paraburkholderia sp. OAS925, SynCom16 assembled a distinct root-associated
    community on Brachypodium distachyon at 22 days after inoculation across the five ring-trial laboratories, with Rhodococcus
    sp. OAS809 (68 +- 33% of root reads), Methylobacterium sp. OAE515 (15 +- 20%), and Mycobacterium sp. OAE908 (14 +- 27%)
    accounting for nearly all root reads.
  interaction_type: COMPETITIVE_RELEASE
  scope: COMMUNITY_LEVEL
  participating_taxa: &id001
