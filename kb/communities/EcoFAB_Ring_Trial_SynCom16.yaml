discussions:
- discussion_id: ecofab_syncom16_dominant_trio_and_interlab_variance
  prompt: What interspecies interactions and root-exudate preferences allow Rhodococcus sp. OAS809, Methylobacterium sp. OAE515,
    and Mycobacterium sp. OAE908 to dominate SynCom16 roots when Paraburkholderia sp. OAS925 is absent, and why did Lab E
    show higher Methylobacterium/Mycobacterium root reads than Labs A-D?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Rhodococcus-, Methylobacterium-, and Mycobacterium-Dominated SynCom16 Root Assembly
  - ecological_interactions#SynCom16 Shoot Biomass Reduction and Exometabolite Remodeling
  rationale: While omitting Paraburkholderia sp. OAS925 in SynCom16 reproducibly revealed competitive release of Rhodococcus
    sp. OAS809 (68 +- 33%), Methylobacterium sp. OAE515 (15 +- 20%), and Mycobacterium sp. OAE908 (14 +- 27%) on roots and
    removed the root fresh-weight penalty seen in SynCom17, 16S relative abundance and bulk spent-medium LC-MS/MS profiles
    do not resolve pairwise cross-feeding among the 16 strains or the specific microbial factor causing shoot fresh-weight
    reduction.
  evidence:
  - reference: PMID:40920748
    reference_title: Breaking the reproducibility barrier with standardized protocols for plant-microbiome research.
    supports: SUPPORT
    evidence_source: full_text
    snippet: In its absence (SynCom16), other isolates showed high relative abundance in the root microbiome with increased
      variability across laboratories, namely Rhodococcus sp. OAS809 (68 ± 33%), Mycobacterium sp. OAE908 (14 ± 27%), and
      Methylobacterium sp. OAE515 (15 ± 20%).
    explanation: Documents the three-strain root dominance pattern in SynCom16 and its inter-sample variance across the five
      ring-trial laboratories.
  posed_by: antigravity
  posed_date: '2026-11-05'
