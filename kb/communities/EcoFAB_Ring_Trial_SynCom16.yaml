  description: Half-strength MS medium used across all five ring trial laboratories.
growth_media:
- name: R2A (bacterial preculture); half-strength Murashige-Skoog (MS) basal salts for the EcoFAB 2.0 plant system
  temperature: '27'
  temperature_unit: °C
  shaking_speed: '200'
  shaking_speed_unit: rpm
  light_regime: 14 h photoperiod (16 h for lab C) / 10 h dark
  light_intensity: 110-140
  light_intensity_unit: µmol/m²/s
  vessel_type: EcoFAB 2.0 device
  protocol_url: https://dx.doi.org/10.17504/protocols.io.kxygxyydkl8j/v1
  preparation_notes: SynCom strains were grown from single colonies in R2A liquid at 27 °C (the Paraburkholderia RFP strain
    grown overnight in R2A shaken at 200 rpm at 27 °C), washed in ½ MS basal salts, and used to inoculate 3-day-old B. distachyon
    seedlings in EcoFAB 2.0 devices; plants were grown in a chamber at 26 °C (light) / 20 °C (dark) with 110-140 µmol/m²/s
    PPFD and 70% humidity.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The Paraburkholderia sp. OAS925 expressing RFP was grown overnight in 7 mL of R2A medium with Kan 20 mg/L, shaken
      at 200 rpm at 27 °C.
    explanation: Names R2A medium, 200 rpm shaking, and 27 °C for the bacterial preculture.
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The plates were then moved to the growth chamber with a 14 h photoperiod (16 h for lab C) at 26 °C and 10 h dark
      at 20 °C with photosynthetic photon flux density (PPFD) at 110–140 µmol/m2/s and 70% humidity if tunable.
    explanation: Names the plant growth-chamber photoperiod, light/dark temperatures, light intensity, and humidity.
