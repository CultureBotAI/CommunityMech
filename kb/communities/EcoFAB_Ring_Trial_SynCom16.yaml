environmental_factors:
- name: Light Regime
  value: 14 h photoperiod (16 h for lab C) / 10 h dark
  description: Controlled growth-chamber photoperiod at 26 °C (light, 110-140 umol/m2/s PPFD) and 20 °C (dark) for Brachypodium
    distachyon Bd21-3 in EcoFAB 2.0 devices.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The plates were then moved to the growth chamber with a 14 h photoperiod (16 h for lab C) at 26 °C and 10 h dark
      at 20 °C with photosynthetic photon flux density (PPFD) at 110–140 µmol/m2/s and 70% humidity if tunable.
    explanation: Specifies the 14 h photoperiod (16 h for lab C) at 26 °C, 10 h dark at 20 °C, and 110-140 umol/m2/s PPFD
      growth-chamber regime.
- name: Hydroponic Medium
  value: 0.5x Murashige and Skoog basal salts (pH 5.5-6.0)
  description: Half-strength Murashige and Skoog basal salts medium (9 mL pre-inoculation, resuspended to 10 mL at inoculation)
    used in EcoFAB 2.0 devices across all five participating laboratories.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: After 3 days, germinated seeds were transferred to sterile EcoFAB 2.0 devices with 9 mL of ½ MS basal salts (pH
      5.5–6.0) and placed back in the chamber. After 4 days, plants were inoculated with Mock, SynCom16, or SynCom17, resuspended
      from 100 µL stocks to 10 ml using sterile ½ MS basal salts.
    explanation: Documents the ½ MS basal salts (pH 5.5-6.0) medium and SynCom16 inoculation into EcoFAB 2.0 devices.
growth_media:
- name: Preferred isolate media (2-8 days at 27 °C); half-strength Murashige-Skoog (MS) basal salts (pH 5.5-6.0) for the EcoFAB
    2.0 plant system
  temperature: '27'
  temperature_unit: °C
  light_regime: 14 h photoperiod (16 h for lab C) / 10 h dark
  light_intensity: 110-140
  light_intensity_unit: µmol/m²/s
  vessel_type: EcoFAB 2.0 device
  protocol_url: https://dx.doi.org/10.17504/protocols.io.kxygxyydkl8j/v1
  preparation_notes: Each verified switchgrass rhizosphere isolate was grown from a single colony for 2-8 days at 27 °C, centrifuged
    at 5,000 g, washed with ½ MS basal salts, and combined at 2e7 cells/mL per strain in 20% glycerol; 100 uL stocks were
    resuspended to 10 mL in sterile ½ MS basal salts (pH 5.5-6.0, 1e5 CFU/plant) to inoculate B. distachyon Bd21-3 seedlings
    in EcoFAB 2.0 devices maintained at 26 °C (14 h light, 16 h for lab C; 110-140 µmol/m²/s PPFD) and 20 °C (10 h dark) with
    70% humidity.
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 2–8 days at 27 °C, cultures were centrifuged at 5,000 g and washed with ½ Murashige and Skoog (MS) basal
      salts medium. The washed cultures were used to create SynComs by measuring OD600, converting to CFU, and combining them
      to 2e7 cells/ml each (1:1 ratio) in 20% glycerol for cryopreservation
    explanation: Documents the 2-8 day 27 °C isolate cultivation, 5,000 g centrifugation, ½ MS basal salts washing, and 2e7
      cells/mL equimolar SynCom assembly.
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The plates were then moved to the growth chamber with a 14 h photoperiod (16 h for lab C) at 26 °C and 10 h dark
      at 20 °C with photosynthetic photon flux density (PPFD) at 110–140 µmol/m2/s and 70% humidity if tunable.
    explanation: Documents the plant growth-chamber photoperiod, light/dark temperatures, light intensity, and humidity.
