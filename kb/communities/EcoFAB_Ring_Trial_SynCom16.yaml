id: CommunityMech:000513
name: EcoFAB Ring Trial SynCom16
description: A 16-member synthetic bacterial community (SynCom16) assembled from switchgrass (Panicum virgatum) rhizosphere
  isolates across 16 genera (omitting the fast-growing Paraburkholderia sp. OAS925 present in SynCom17, CommunityMech:000025)
  and evaluated across five independent laboratories (n = 7 biological replicates per lab) on Brachypodium distachyon Bd21-3
  in EcoFAB 2.0 sterile hydroponic devices. In the absence of Paraburkholderia sp. OAS925, SynCom16 root colonization at 22
  days after inoculation was dominated by Rhodococcus sp. OAS809 (68 +- 33% of root reads), Methylobacterium sp. OAE515 (15
  +- 20%), and Mycobacterium sp. OAE908 (14 +- 27%), produced reproducible spent-medium exometabolite shifts across participating
  laboratories, and reduced Brachypodium shoot fresh weight relative to axenic plants without altering root fresh weight.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Benchmark inter-laboratory reproducibility of plant phenotypes, 16S rRNA amplicon community assembly, and spent-medium
    exometabolomics in EcoFAB 2.0 devices using the 16-member switchgrass rhizosphere community SynCom16 (lacking Paraburkholderia
    sp. OAS925) alongside SynCom17 and axenic controls.
  assembly_strategy: Equimolar OD600 mixture of 16 sequenced switchgrass rhizosphere bacterial isolates spanning Actinomycetota,
    Alphaproteobacteria, Betaproteobacteria, Gammaproteobacteria, and Bacteroidota, omitting Paraburkholderia sp. OAS925.
  inoculation_strategy: Mix single-strain cultures at equal OD600 in 0.5x MS liquid medium and inoculate 3-day-old sterile
    Brachypodium distachyon Bd21-3 seedlings in EcoFAB 2.0 devices to a final starting OD600 of 0.01 across five participating
    laboratories (A-E, n = 7 per lab).
  perturbation_design: Multi-laboratory ring trial comparing axenic control (mock-inoculated), SynCom16 (16 isolates without
    Paraburkholderia sp. OAS925), and SynCom17 (SynCom16 + Paraburkholderia sp. OAS925) harvested at 22 days after inoculation.
  measurement_endpoints:
  - 16S rRNA amplicon sequencing of root and spent-medium compartments at 22 DAI
  - LC-MS/MS untargeted exometabolomics of sterile spent medium
  - Brachypodium distachyon shoot fresh weight, root fresh weight, and root system architecture
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In its absence (SynCom16), other isolates showed high relative abundance in the root microbiome with increased
      variability across laboratories, namely Rhodococcus sp. OAS809 (68 ± 33%), Mycobacterium sp. OAE908 (14 ± 27%), and
      Methylobacterium sp. OAE515 (15 ± 20%).
    explanation: Defines SynCom16 as the 16-strain switchgrass rhizosphere synthetic community lacking Paraburkholderia sp.
      OAS925.
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'consisted of four treatments with seven biological replicates each ( Fig 1a ): an axenic (mock-inoculated) sterile
      plant control, SynCom16-inoculated plants, SynCom17-inoculated plants, and plant-free medium control.'
    explanation: Documents the ring-trial experimental design across four treatments (including SynCom16 and SynCom17) with
      seven biological replicates per laboratory.
environment_term:
  preferred_term: EcoFAB 2.0 hydroponic device
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: 'Fabricated ecosystem (EcoFAB 2.0) devices for standardized hydroponic plant growth. Plants grown in 0.5x Murashige-Skoog
    medium with NH4NO3 nitrogen source under controlled light conditions (16h/8h light/dark cycle). Protocol available at
    https://dx.doi.org/10.17504/protocols.io.kxygxyydkl8j/v1.

    '
