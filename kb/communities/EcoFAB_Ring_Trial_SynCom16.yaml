  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In its absence (SynCom16), other isolates showed high relative abundance in the root microbiome with increased
      variability across laboratories, namely Rhodococcus sp. OAS809 (68 ± 33%), Mycobacterium sp. OAE908 (14 ± 27%), and
      Methylobacterium sp. OAE515 (15 ± 20%).
    explanation: Quantifies the dominance of Rhodococcus sp. OAS809, Mycobacterium sp. OAE908, and Methylobacterium sp. OAE515
      in SynCom16 root colonization across the five laboratories.
- name: SynCom16 Shoot Biomass Reduction and Exometabolite Remodeling
  description: Across participating laboratories in the EcoFAB 2.0 ring trial, SynCom16 inoculation significantly decreased
    Brachypodium distachyon shoot fresh weight and dry weight relative to axenic controls (Fig 2b) and increased a distinct
    cluster of nucleoside/nucleotide rhizosphere exometabolites (Cluster 3, Fig 5).
  scope: COMMUNITY_LEVEL
  participating_taxa: *id001
  biological_processes:
  - preferred_term: primary metabolic process
    term:
      id: GO:0044238
      label: primary metabolic process
  evidence:
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: When plant biomass data were combined across laboratories, we observed a significant decrease in shoot fresh
      weight and dry weight of plants inoculated with SynCom17, and to a lesser extent SynCom16, relative to the axenic treatment
      ( Fig 2b ).
    explanation: Demonstrates that SynCom16 significantly decreased Brachypodium shoot fresh weight and dry weight relative
      to axenic controls across the participating laboratories.
  - reference: PMID:40920748
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A third, much smaller cluster consisting primarily of nucleosides(tides) increased in the SynCom16 or both SynCom
      treatments.
    explanation: Documents the SynCom16-associated increase in Cluster 3 nucleoside/nucleotide rhizosphere exometabolites
      across the ring-trial laboratories.
