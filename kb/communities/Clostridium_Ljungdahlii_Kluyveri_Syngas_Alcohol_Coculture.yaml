id: CommunityMech:000202
name: Clostridium ljungdahlii-Clostridium kluyveri Syngas Alcohol Coculture
description: >
  A defined anaerobic synthetic coculture that combines the acetogenic syngas
  fermenter Clostridium ljungdahlii with the chain-elongating bacterium
  Clostridium kluyveri in a continuously fed syngas bioprocess with in-line
  product extraction. C. ljungdahlii converts syngas into ethanol and acetate,
  while C. kluyveri uses ethanol for reverse-beta-oxidation chain elongation to
  butyrate and caproate. The same community also produced longer-chain alcohols
  including butanol, hexanol, and traces of octanol within a narrow pH range.
  The system is relevant to DOE carbon utilization and renewable fuels because
  it converts C1 gases into C4-C8 fuels and chemicals through microbial
  cross-feeding.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Broaden syngas fermentation product spectra by combining an
    acetogenic C1 gas fermenter with a chain-elongating partner in one
    continuously fed bioprocess.
  assembly_strategy: Pair C. ljungdahlii and C. kluyveri in a continuous
    syngas-fed reactor with gas stripping and product condensation.
  perturbation_design: Operate the coculture across a narrow pH window and use
    in-line product extraction to recover longer-chain alcohols.
  measurement_endpoints:
  - Syngas consumption
  - Ethanol and acetate production
  - Butyrate and caproate production
  - Butanol, hexanol, and octanol production
  - Reactor pH response
  - Coculture resilience during continuous operation
  evidence:
  - reference: PMID:27877166
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: combining two wild-type bacterial strains into a single, continuously fed bioprocessing step
    explanation: Supports the engineered two-member continuous bioprocess design.
  - reference: PMID:27877166
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: gas stripping and product condensing within the syngas recirculation line
    explanation: Supports in-line product extraction as part of the system design.
