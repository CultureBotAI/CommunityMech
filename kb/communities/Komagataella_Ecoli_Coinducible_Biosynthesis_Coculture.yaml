id: CommunityMech:000343
name: Komagataella-E. coli Co-inducible Biosynthesis Coculture
description: >-
  A defined two-member engineered yeast-bacterium consortium pairing
  Komagataella phaffii with Escherichia coli for co-inducible relayed
  biosynthesis of natural products. Low-level glucose-responsive and
  blue-light-responsive transcriptional systems were rebuilt separately for the
  two hosts so a single signal could co-induce compound synthesis in
  coculture. After pathway redirection, genome mining, and rewiring of
  acyl-donor degradation targets, the living consortium produced the reporter
  molecule simvastatin from a simple carbon source and also supported inducible
  biosynthesis of (2S)-naringenin.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >-
    Establish a yeast-bacterium synthetic consortium that supports co-growth of
    Komagataella phaffii and Escherichia coli and coordinates natural-product
    biosynthesis without engineered interactions.
  assembly_strategy: >-
    Pair K. phaffii with E. coli under selected co-growth conditions, rebuild
    low-level glucose-responsive and blue-light-responsive transcriptional
    systems separately in the host chassis, and redirect biosynthetic pathways
    plus acyl-donor degradation targets so the coculture can make reporter
    natural products.
  measurement_endpoints:
  - K. phaffii-E. coli co-growth under selected conditions
  - Single-signal co-induced compound synthesis in coculture
  - Simvastatin production by the living consortium
  - Inducible (2S)-naringenin production by the living consortium
  notes: >-
    The accessible PubMed abstract supports species-level membership,
    co-induction logic, a simple-carbon-source consortium culture, and the two
    reporter compounds, but it does not name the exact strains, the exchanged
    biosynthetic intermediate, or which pathway segment was assigned to each
    host.
  evidence:
  - reference: PMID:42492893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This study explores yeast-bacterium consortium without engineered
      interactions for the co-inducible relayed synthesis of natural products.
    explanation: >-
      Supports the design goal of a yeast-bacterium consortium for
      co-inducible relayed biosynthesis.
  - reference: PMID:42492893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Low-level glucose- and blue light-responsive transcriptional systems are
      rebuilt separately for each host, allowing single-signal co-induced
      activation of compound synthesis in coculture.
    explanation: >-
      Supports the separately rebuilt induction systems and single-signal
      coculture activation endpoint.
