id: CommunityMech:000481
name: Bifidobacterium longum DSM20219 and Bacillus subtilis SOM8 Alginate Biofilm Probiotic Co-Culture
description: Engineered probiotic co-culture of oxygen-sensitive anaerobic Bifidobacterium longum DSM20219 and biofilm-forming
  Bacillus subtilis SOM8 co-encapsulated in sodium alginate hydrogel beads. Bacillus subtilis SOM8 promotes interspecies cell
  aggregation, extracellular polymeric matrix development, and biofilm formation within the alginate matrix, enhancing B.
  longum DSM20219 survival by ~3-log CFU/g (>7-log CFU/g) in simulated gastric and intestinal fluids and maintaining >6-log
  CFU/g over 28 days of aerobic storage.
