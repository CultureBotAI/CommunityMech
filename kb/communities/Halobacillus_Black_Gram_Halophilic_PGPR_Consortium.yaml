id: CommunityMech:000472
name: Halobacillus Multi-Strain Halophilic PGPR Consortium for Black Gram Salinity Tolerance
description: Compatible three-strain halophilic plant growth-promoting bacterial (HPGPB) consortium comprising Halobacillus
  marinus MKM3, Halobacillus halophilus MKM4, and Halobacillus halophilus MKM11 applied to black gram (Vigna mungo L. varieties
  VBN8 and VBN11) under 50 and 100 mM NaCl stress. The consortium improves ionic balance, reduces Na+ accumulation and lipid
  peroxidation, enhances antioxidant enzyme activities, and increases grain yield by up to 38% under saline greenhouse conditions.
