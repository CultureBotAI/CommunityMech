- name: Metal removal and pH endpoint
  value: pH 6.1; 100% Zn2+, >99% Fe2+, >94% Al3+ removed
  description: >-
    The consortium neutralized the initially pH-2.9 sAMD and removed nearly all
    of the three principal dissolved metals over 160-200 days.
