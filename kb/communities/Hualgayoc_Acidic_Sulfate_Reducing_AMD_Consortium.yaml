  ph: 2.9
  temperature: 30
  temperature_unit: C
  atmosphere: ANAEROBIC
  headspace_gas: N2/CO2 80:20
  light_regime: dark
  inoculum_source: previously enriched Hualgayoc aSRB consortium
  inoculum_size: 10
  inoculum_unit: percent v/v
