discussions:
- discussion_id: HUALGAYOC_MINOR_ACIDOGENS
  prompt: >-
    Stage-1 Negativicutes and Clostridiaceae may have fermented glycerol to
    acetate before sulfate reduction became active, but they were not resolved
    as named MAG members in the source; this record therefore keeps the
    high-quality aSRB MAGs as members and treats the minor fermenters as an
    open compositional detail.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  rationale: >-
    Resolving the acidogenic fermenters with MAGs would clarify how much of the
    early glycerol-to-acetate flux was performed by Desulfosporosinus versus
    non-aSRB community members.
