  downstream:
  - target: Acetate-Fed Acididesulfobacillus Sulfate Reduction
    description: >-
      Acididesulfobacillus sp. MAG013 is inferred to consume acetate produced
      during glycerol oxidation after the consortium raises the pH.
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Desulfosporosinus initiated sulfate reduction at pH ~3.0 with glycerol
      as the carbon source and acetate as the waste product.
    explanation: >-
      Supports the first inferred phase of sulfate reduction and acetate
      production from glycerol.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      While genes coding for glycerol, pyruvate, and acetyl-CoA oxidation (from
      glycerol to acetate) were found in both MAGs
    explanation: >-
      Supports genomic capacity for glycerol oxidation to acetate in the two
      dominant sulfate-reducing MAGs.
- name: Acetate-Fed Acididesulfobacillus Sulfate Reduction
  description: >-
    Once pH increased to about 4.0, Acididesulfobacillus sp. MAG013 was
    inferred to oxidize acetate fully to CO2 while continuing sulfate reduction,
    creating a carbon-flow network that removed acetate and limited organic-acid
    toxicity in the acidic enrichment.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
