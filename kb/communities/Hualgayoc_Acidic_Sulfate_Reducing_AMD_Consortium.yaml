environmental_factors:
- name: Synthetic AMD acidity and sulfate
  value: pH 2.9; 50.53 mM sulfate
  description: >-
    The main AMD bioremediation batch used a pH-2.9 synthetic AMD with 50.53 mM
    sulfate.
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
