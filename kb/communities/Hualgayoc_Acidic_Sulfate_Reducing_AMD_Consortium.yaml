      preferred_term: glycerol
      term:
        id: CHEBI:17754
        label: glycerol
  preparation_notes: >-
    Synthetic AMD was formulated from metal and iron stocks to mimic average
    BSA-100 AMD chemistry. The pH-2.9 medium was supplemented with vitamins,
    25 mM glycerol, and 10% enriched aSRB inoculum, with more inoculum added on
    days 32 and 86.
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The experiment was performed in 1,000 mL Schott bottles containing 500 mL
      of sAMD.
    explanation: Supports the AMD treatment vessel and working volume.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The final sAMD mixture contained a theoretical value of 50.53 mM sulfate
      and a pH of 2.9.
    explanation: Supports the synthetic AMD sulfate concentration and pH.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The bottles were then supplemented with vitamins, glycerol as a carbon
      source (25 mM), and with the previously enriched aSRB consortium (10%).
    explanation: >-
      Supports the glycerol concentration and 10% enrichment inoculum in the
      AMD experiment.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Bottles were incubated in the dark at 30°C and monitored for 160 days for
      physicochemical parameters
    explanation: Supports the dark 30 C incubation and monitoring period.
