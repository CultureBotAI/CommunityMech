ecological_interactions:
- name: Glycerol-to-Acetate Sulfate Reduction
  description: >-
    Desulfosporosinus sp. MAG003 and possibly other early enrichment members
    initiated sulfate reduction at roughly pH 3.0 with glycerol as the supplied
    carbon and electron source, producing acetate that could inhibit cells
    unless consumed by a downstream partner.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
