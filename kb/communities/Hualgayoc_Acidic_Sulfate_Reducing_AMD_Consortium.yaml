      label: Desulfosporosinus
    gtdb_grounding_status: UNRESOLVED
    notes: >-
      High-quality sulfate-reducing MAG003 was assigned only to
      Desulfosporosinus sp.; the study reported no species-level close
      relative.
  strain_designation:
    strain_name: MAG003
    isolation_source: day-160 Hualgayoc synthetic-AMD enrichment metagenome
  abundance_level: DOMINANT
  abundance_value: >-
    68.3% of the aSRB inoculum by 16S rRNA profiling; 20% of classified
    day-160 metagenomic reads at genus level
  functional_role:
  - PRIMARY_DEGRADER
  - SYNTROPHIC_PARTNER
  - CROSS_FEEDER
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Taxonomic classification based on 115 bacterial marker genes showed
      affiliation of MAG003 to Desulfosporosinus sp. and MAG013 to
      Acididesulfobacillus sp.
    explanation: Supports the genus-level assignment of MAG003.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Regarding the sulfur cycle, the occurrence of sat, aprAB, and dsrAB genes
      confirmed the presence of the whole dissimilatory sulfate reduction
      pathway in both MAGs.
    explanation: >-
      Supports MAG003 as a sulfate-reducing member because both curated MAGs
      encoded the complete dissimilatory sulfate-reduction pathway.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Desulfosporosinus (68.3%) is able to oxidize glycerol to acetate
    explanation: >-
      Supports Desulfosporosinus as the dominant glycerol-oxidizing aSRB in the
      inoculum for the synthetic-AMD experiment.
