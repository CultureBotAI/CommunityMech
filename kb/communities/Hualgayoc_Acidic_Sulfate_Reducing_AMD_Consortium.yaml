id: CommunityMech:000353
name: Hualgayoc Acidic Sulfate-Reducing AMD Consortium
description: >-
  An engineered acidophilic sulfate-reducing bacterial enrichment derived from
  acidic sediments of the abandoned BSA-100 mining tunnel in Hualgayoc,
  Cajamarca, Peru, and assayed for bioremediation of synthetic acid mine
  drainage at pH 2.9. The glycerol-fed, sulfate-amended enrichment raised the
  synthetic AMD pH to 6.1 and removed 100% of Zn2+, more than 99% of Fe2+, and
  more than 94% of Al3+ after 160-200 days. Genome-resolved metagenomics
  recovered two high-quality dominant sulfate-reducing MAGs, Desulfosporosinus
  sp. MAG003 and Acididesulfobacillus sp. MAG013, whose inferred carbon
  metabolisms suggest a cooperative route in which Desulfosporosinus starts
  sulfate reduction on glycerol at pH around 3.0 and Acididesulfobacillus
  continues sulfate reduction on acetate once the culture rises to pH around
  4.0.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: AMD
engineering_design:
  objective: >-
    Enrich indigenous acidophilic sulfate-reducing bacteria from acidic BSA-100
    mine-tunnel sediments and test whether the consortium can neutralize
    pH-2.9 synthetic AMD while removing high dissolved Fe, Al, and Zn.
  assembly_strategy: >-
    Acidic sediment from BSA-100 was used as a 10% inoculum into anoxic pH-2.5
    mineral salts medium containing yeast extract, L-cysteine, sulfate, and
    glycerol. Three serial transfers selected the aSRB-containing enrichment
    before 10% transfer to a glycerol-amended synthetic AMD medium.
  passaging_regimen: >-
    Three pH-2.5 enrichment transfers were followed by a 160- to 200-day batch
    synthetic-AMD treatment in which additional enrichment inoculum was supplied
    on days 32 and 86 to restart or reinforce sulfate-reducing activity.
  perturbation_design: >-
    The synthetic AMD challenge started at pH 2.9 and included 50.53 mM sulfate
    with Fe2+, Al3+, and Zn2+ as the main dissolved metals.
  measurement_endpoints:
  - pH, oxidation-reduction potential, sulfide, sulfate, glycerol, and acetate
  - Dissolved Fe, Al, Zn, and minor metal concentrations
  - Mineral formation by X-ray diffraction and microscopy
  - 16S rRNA amplicon profiles and day-160 metagenome-assembled genomes
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we used an indigenous aSRB-containing consortium to remove metals
      and neutralize a synthetic AMD (sAMD) system starting at pH 2.9
    explanation: >-
      Establishes the design goal of applying an indigenous acidophilic
      sulfate-reducing enrichment to pH-2.9 synthetic acid mine drainage.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Subsequently, more inoculum was added at days 32 and 86 to enhance
      sulfate reduction activity.
    explanation: Supports the reinoculation schedule during the AMD batch run.
