growth_media:
- name: pH-2.5 glycerol sulfate aSRB enrichment medium
  ph: 2.5
  temperature: 30
  temperature_unit: C
  atmosphere: ANAEROBIC
  headspace_gas: N2/CO2 80:20
  light_regime: dark
  inoculum_source: BSA-100 acidic sediment mixture
  inoculum_size: 10
  inoculum_unit: percent w/v
  vessel_type: 100 mL serum bottle with 50 mL medium
  composition:
  - name: glycerol
    concentration: 5
    unit: mM
    chebi_term:
      preferred_term: glycerol
      term:
        id: CHEBI:17754
        label: glycerol
  - name: sodium sulfate
    concentration: 10
    unit: mM
  - name: yeast extract
    concentration: 0.1
    unit: g/L
  - name: L-cysteine
    concentration: 0.5
    unit: g/L
  preparation_notes: >-
    Mineral salts medium was adjusted to pH 2.5, degassed with N2, sealed under
    an N2/CO2 headspace, supplied with sediment at 10% w/v, and transferred
    three times under the same static, anoxic, dark 30 C conditions.
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      100 mL glass serum bottles were filled with 50 mL of mineral salts medium
      (MSM)
    explanation: Supports the initial enrichment vessel and working volume.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The medium was supplemented with 0.1 g L−1 of yeast extract, 0.5 g L−1 of
      L-cysteine, and 1.42 g L−1 (10 mM) of Na2SO4 as an electron acceptor.
    explanation: Supports the yeast extract, L-cysteine, and sulfate amendments.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      glycerol was added to the medium as an electron donor and carbon source
      from a 1 M autoclaved anoxic stock to obtain a final concentration of 5
      mM.
    explanation: Supports the glycerol enrichment amendment.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Three transfers were performed in total.
    explanation: Supports the serial-transfer count for the aSRB enrichment.
