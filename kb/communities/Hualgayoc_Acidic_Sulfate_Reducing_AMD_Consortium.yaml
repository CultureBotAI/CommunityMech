    explanation: Supports the starting pH and sulfate concentration.
- name: Main dissolved metals in synthetic AMD
  value: Fe2+ 40.25 mM; Al3+ 5.39 mM; Zn2+ 3.97 mM
  description: >-
    The pH-2.9 synthetic AMD challenge contained high ferrous iron, aluminum,
    and zinc concentrations based on the average chemistry of AMD sampled from
    BSA-100.
  evidence:
  - reference: PMID:42029028
    supports: SUPPORT
