    explanation: Supports the genus-level assignment of MAG013.
  - reference: PMID:42029028
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Regarding the sulfur cycle, the occurrence of sat, aprAB, and dsrAB genes
