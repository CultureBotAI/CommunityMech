id: CommunityMech:000358
name: Bacillus A1-A3 Naphthalene Biofilm Consortium
description: 'A defined two-isolate Bacillus consortium, Consortium 3, assembled from Bacillus paranthracis isolate A1 and
  Bacillus licheniformis isolate A3 after enrichment of petroleum-contaminated soil from Ras Gharib, Egypt on polycyclic aromatic
  hydrocarbons. The A1/A3 pair was one of four consortia built from the three strongest phenanthrene- and naphthalene-degrading
  isolates. Consortium 3 was induced to grow as a glass-attached biofilm, showed the highest reported synergistic interaction
  during planktonic naphthalene degradation, reached 94.69% naphthalene degradation as a biofilm culture, and its preformed
  biofilm degraded 81.47% of naphthalene in artificially contaminated soil. Phenanthrene behaved differently: individual isolates
  outperformed the consortia, and the authors attributed the lower consortium rates to antagonistic interactions under the
  more complex PAH substrate.'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine high-performing indigenous PAH-degrading Bacillus isolates from petroleum-contaminated soil to test whether
    planktonic and biofilm consortia improve phenanthrene or naphthalene degradation.
  assembly_strategy: Select isolates A1, A3, and B8-1 after enrichment on phenanthrene or naphthalene as sole carbon sources,
    standardize each isolate by OD600, and construct Consortium 3 from A1 plus A3.
  inoculation_strategy: Consortium 3 was assembled from Bacillus paranthracis A1 and Bacillus licheniformis A3; the publication
    reports 3458 uL of A1 plus 1560 uL of A3 after OD600 standardization.
  perturbation_design: Compare the three selected isolates and four derived consortia in planktonic and biofilm forms for
    7-day phenanthrene and naphthalene degradation, then test a preformed Consortium 3 biofilm in soil artificially contaminated
    with naphthalene.
  measurement_endpoints:
  - biofilm formation by crystal violet OD595 assay
  - HPLC quantification of phenanthrene and naphthalene degradation
  - naphthalene degradation in artificially contaminated soil
  - 16S rRNA identification of the selected isolates
  notes: B8-1 was identified as Bacillus paramycoides and used in Consortia 1, 2, and 4, but it is not a member of the curated
    A1/A3 Consortium 3. The article lists three GenBank accessions for the selected 16S rRNA sequences but the accessible
    flattened full text does not unambiguously map PV848451, PV848453, and PV848454 onto A1, A3, and B8-1.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Three isolates (A1, A3, and B8-1) were selected as the most potent phenanthrene and naphthalene degraders.
    explanation: Supports the screen that selected the source isolate set used to construct the consortia.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The consortia were composed as follows: Consortium 1 (B8-1 and A1), Consortium 2 (B8-1 and A3), Consortium 3
      (A1 and A3), and Consortium 4 (B8-1, A1, and A3).'
    explanation: Identifies Consortium 3 as the two-member A1/A3 consortium and places it among the four constructed consortia.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both the individual isolates and the consortia were able to form biofilm on the glass surface.
    explanation: Supports biofilm induction as a tested phenotype of the developed consortia.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The HPLC results exhibited that the biofilm of isolate A1 degraded 60.98% of phenanthrene, and the biofilm of
      the consortium 3 degraded 81.47% of naphthalene in soil samples
    explanation: Supports the artificially contaminated soil test of a preformed Consortium 3 naphthalene-degrading biofilm.
