    pH before sterilization.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The broth media was prepared, and the pH value was adjusted to 7.0 ± 0.2 using 1 N HCl or 1 N NaOH before sterilization.
    explanation: Supports the pH used for the MSM enrichment medium.
- name: Naphthalene in artificially contaminated soil
  value: '200'
  unit: mg/g
  description: A 5 g soil sample was artificially contaminated with naphthalene before testing Consortium 3 biofilm degradation.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A 5 g sample of the soil was artificially contaminated with 200 mg/g of phenanthrene or naphthalene.
    explanation: Supports the PAH loading used in the artificial-soil biofilm test.
- name: Optimized PAH degradation temperature and pH
  value: 37 deg C and pH 7
  description: Phenanthrene and naphthalene degradation by the selected isolates was maximal at 37 deg C and pH 7.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results showed that the highest growth and degradation rate of phenanthrene and naphthalene were achieved
      at 37 °C and pH 7.
    explanation: Supports the temperature and pH used as optimized PAH degradation conditions.
growth_media:
- name: Mineral salt medium PAH degradation assay
  composition: []
  ph: '7.0'
  temperature: '37'
  temperature_unit: °C
  shaking_speed: '150'
  shaking_speed_unit: rpm
  incubation_time: '7'
  incubation_time_unit: d
  vessel_type: sealed glass tubes for biofilm-mediated degradation; tubes for planktonic degradation
  preparation_notes: Overnight individual isolates and consortia were inoculated into 7 mL MSM with 200 mg/L phenanthrene
    or naphthalene for planktonic assays. For biofilm-mediated assays, each isolate or consortium was first grown as a static
    biofilm in TSB on the walls of glass tubes, washed, overlaid with 7 mL MSM plus 200 mg/L PAH, sealed, and incubated for
    seven days.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Degradation of the PAHs, phenanthrene or naphthalene, was analysed using High Performance Liquid Chromatography
    explanation: Supports HPLC quantification for both phenanthrene and naphthalene degradation assays.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The analysis was conducted to determine the degradation efficiency at an initial concentration of 200 mg L⁻¹.
    explanation: Supports the 200 mg/L starting PAH concentration for HPLC-quantified degradation.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For planktonic–mediated biodegradation, individual isolates and consortia were grown overnight and inoculated
      in tubes containing 7 mL MSM medium supplemented with 200 mg L⁻¹phenanthrene.
    explanation: Supports the tube-based planktonic MSM PAH degradation setup.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 48 h, free planktonic cells were carefully removed from the glass tube, and the biofilm formed inside the
      walls was rinsed once with sterile water. Afterwards, 7 mL of MSM medium containing 200 mg L⁻¹ phenanthrene was added
      to each tube.
    explanation: Supports the washed, preformed biofilm setup before addition of MSM plus PAH.
- name: Trypticase soy broth static biofilm induction medium
  composition: []
  temperature: '37'
  temperature_unit: °C
  inoculum_size: '0.2'
  inoculum_unit: OD550
  incubation_time: '48'
  incubation_time_unit: h
  vessel_type: glass tubes
  preparation_notes: Fresh-grown cell cultures were diluted in TSB, transferred to glass tubes, and incubated statically for
    48 h to form crystal-violet-stained biofilms on the tube walls.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: fresh-grown cell cultures were diluted to OD550 = 0.2 in Trypticase soy broth (TSB) medium. One mL of this suspension
      was transferred to a glass tube containing 1 mL of TSB medium. Then the tubes were incubated at 37 °C under static conditions
      for 48 h.
    explanation: Supports the OD550, TSB, glass-tube, temperature, and static-incubation details of the biofilm induction
      step.
- name: Artificial naphthalene-contaminated soil biofilm assay
  composition:
  - name: naphthalene
    concentration: '200'
    unit: mg/g soil
    chebi_term:
      preferred_term: naphthalene
      term:
        id: CHEBI:16482
        label: naphthalene
    from_source: community_curated
  temperature: '37'
  temperature_unit: °C
  incubation_time: '7'
  incubation_time_unit: d
  vessel_type: 100 mL conical flasks with preformed biofilms
  preparation_notes: Consortium 3 biofilms were preformed for 48 h in static 100 mL conical flasks with 50 mL TSB. The planktonic
    culture was removed, 5 g of uncontaminated soil was added and artificially contaminated with naphthalene, and the closed
    flasks were incubated for seven days before HPLC analysis.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The selected isolate-developed biofilm was developed in advance at 37 °C for 48 h under static conditions in
      100 mL conical flasks containing 50 mL of TSB medium.
    explanation: Supports the preformed flask-biofilm step used before the soil degradation assay.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A 5 g sample of the soil was artificially contaminated with 200 mg/g of phenanthrene or naphthalene. Then the
      flasks were tightly closed and incubated at 37 °C for 7 days.
    explanation: Supports the soil mass, artificial naphthalene contamination, temperature, closure, and incubation length
      of the soil assay.
