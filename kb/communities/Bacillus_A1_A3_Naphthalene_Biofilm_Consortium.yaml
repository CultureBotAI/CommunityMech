ecological_interactions:
- name: Consortium 3 naphthalene synergy
  description: The A1/A3 Consortium 3 improved naphthalene degradation relative to the A1 and A3 monocultures in both planktonic
    and biofilm growth modes, including 92.43% planktonic and 94.69% biofilm naphthalene biodegradation in the seven-day HPLC
    assay.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  - preferred_term: Bacillus licheniformis A3
    term:
      id: NCBITaxon:1402
      label: Bacillus licheniformis
  metabolites:
  - preferred_term: naphthalene
    term:
      id: CHEBI:16482
      label: naphthalene
  downstream:
  - target: Consortium 3 soil naphthalene removal
    description: The A1/A3 Consortium 3 biofilm was selected for a follow-up naphthalene-removal assay in artificially contaminated
      soil.
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The result demonstrated that the naphthalene biodegradation rates of 41.01, 38.92, 75.54, 44.71, 92.43, and 64.47%
      for the planktonic cultures
    explanation: Supports the 92.43% planktonic naphthalene degradation reported for Consortium 3 and the lower A1 and A3
      monoculture values.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: whereas were 87.72, 64.57, 77.45, 86.88, 94.69, and 79.74% for the biofilm cultures of isolates A1, A3, consortium
      1, consortium 2, consortium 3, and consortium 4, respectively.
    explanation: Supports the 94.69% biofilm naphthalene degradation reported for Consortium 3.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This finding demonstrated the synergistic interaction between the consortia`s members, with the highest synergistic
      interaction between the planktonic isolates (A1 and A3) in the consortium 3
    explanation: Supports the authors' interpretation that A1 and A3 interacted synergistically during naphthalene degradation.
- name: Consortium phenanthrene antagonism
  description: 'The same isolate combinations were less effective on phenanthrene: individual isolates degraded more phenanthrene
    than the developed consortia in the planktonic and biofilm assays, and the authors interpreted the lower consortium performance
    as antagonism caused by nutrient stress and competition.'
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus paranthracis A1
    term:
      id: NCBITaxon:2026186
      label: Bacillus paranthracis
  - preferred_term: Bacillus licheniformis A3
    term:
      id: NCBITaxon:1402
      label: Bacillus licheniformis
  metabolites:
  - preferred_term: phenanthrene
    term:
      id: CHEBI:28851
      label: phenanthrene
  evidence:
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Surprisingly, the biodegradation rates by the individual isolates were higher than those of the consortium. This
      observation may relate to an antagonistic effect of the consortium isolates
    explanation: Supports phenanthrene antagonism among the developed consortia rather than a positive phenanthrene interaction.
  - reference: PMID:42587276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the case of phenanthrene, a complex substrate, it promotes antagonistic interactions and negative growth
    explanation: Supports the substrate-dependent interpretation that phenanthrene promoted a negative consortium interaction.
