id: CommunityMech:000372
name: Pseudomonas-Klebsiella-Alcaligenes Fe2+ Nitrogen-Removal SynCom
description: A defined three-member synthetic bacterial consortium composed of the aerobic denitrifier Pseudomonas stutzeri,
  the facultative anaerobic denitrifier Klebsiella sp., and the heterotrophic nitrifying-aerobic denitrifying bacterium Alcaligenes
  sp. for Fe2+-regulated deep nitrogen removal. The 2026 Environmental Research abstract reports that the Fe2+ treatment increased
  nitrate-N removal efficiency by 20-30% relative to other iron species and that metagenomic analysis associated Fe2+ with
  a shift in carbon and nitrogen metabolic networks, including higher dissimilatory nitrate reduction to ammonium pathway
  abundance and lower denitrification pathway abundance.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct a synthetic bacterial consortium for enhanced nitrogen removal and test whether Fe2+ chemical regulation
    improves multi-process carbon and nitrogen metabolism.
  assembly_strategy: Combine Pseudomonas stutzeri, Klebsiella sp., and Alcaligenes sp. as a composite nitrogen-removal consortium
    with aerobic denitrification, facultative anaerobic denitrification, and heterotrophic nitrifying-aerobic denitrifying
    capabilities.
  perturbation_design: Compare five iron species alone and in combination with polyacrylamide for effects on nitrogen-removal
    performance, oxidative stress, and Fe2+-responsive carbon and nitrogen metabolic networks.
  measurement_endpoints:
  - nitrate-N removal efficiency
  - oxidative stress responses
  - metagenomic analysis of Fe2+-responsive metabolic processes
  - denitrification and dissimilatory nitrate reduction to ammonium pathway abundance
  notes: The inspected PubMed abstract names the three source taxa, the iron-species and polyacrylamide perturbations, and
    the Fe2+-associated nitrate-removal and metagenomic endpoints. It does not report strain designations, inoculation ratios,
    the five tested iron species, growth-medium composition, iron doses, or polyacrylamide doses.
  evidence:
  - reference: PMID:42520901
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, a synthetic bacterial consortium was constructed, comprising the aerobic denitrifier Pseudomonas
      stutzeri, the facultative anaerobic denitrifier Klebsiella sp., and the heterotrophic nitrifying-aerobic denitrifying
      bacterium Alcaligenes sp.
    explanation: Supports the exact three-taxon synthetic consortium and member capabilities.
  - reference: PMID:42520901
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The effects of five iron species as well as their combined effects with polyacrylamide (PAM), on nitrogen removal
      performance and oxidative stress responses of the consortium were investigated
    explanation: Supports the iron-species and polyacrylamide perturbation design.
