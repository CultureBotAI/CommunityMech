- name: Polyacrylamide mass-transfer perturbation
  value: polyacrylamide
  unit: PAM amendment
  description: Polyacrylamide was tested in combination with the iron treatments and attenuated the specific regulatory effects
    of individual iron species through physical mass-transfer limitation.
  evidence:
  - reference: PMID:42520901
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The addition of PAM attenuated the specific regulatory effects of different iron species through physical mass-transfer
      limitation.
    explanation: Supports polyacrylamide as a mass-transfer perturbation of the iron-species effects.
