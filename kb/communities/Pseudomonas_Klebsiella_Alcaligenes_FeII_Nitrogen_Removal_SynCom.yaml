ecological_interactions:
- name: Composite nitrogen-removal metabolic network
  description: Pseudomonas stutzeri, Klebsiella sp., and Alcaligenes sp. were combined into a synthetic consortium spanning
    aerobic denitrification, facultative anaerobic denitrification, and heterotrophic nitrification-aerobic denitrification.
    Fe2+ chemical regulation increased nitrate-N removal efficiency relative to other iron species and shifted the metagenomic
    carbon and nitrogen network toward higher dissimilatory nitrate reduction to ammonium pathway abundance and lower denitrification
    pathway abundance.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
