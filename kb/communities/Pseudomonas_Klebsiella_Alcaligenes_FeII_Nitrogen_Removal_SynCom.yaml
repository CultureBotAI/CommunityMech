      label: nitrate
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  biological_processes:
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  evidence:
  - reference: PMID:42520901
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: comprising the aerobic denitrifier Pseudomonas stutzeri, the facultative anaerobic denitrifier Klebsiella sp.,
      and the heterotrophic nitrifying-aerobic denitrifying bacterium Alcaligenes sp.
    explanation: Supports the complementary nitrogen-metabolism capacities represented in the consortium.
  - reference: PMID:42520901
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'Metagenomic analysis revealed that Fe2+ modulated the carbon and nitrogen metabolic networks: in the carbon
      metabolic network, enrichment of the por gene in the glycolytic pathway generated substantial reducing power in the
      form of reduced ferredoxin; concomitantly, the transcript abundance of the dissimilatory nitrate reduction to ammonium
      pathway increased from 775 to 802, whereas that of the denitrification pathway decreased from 1259 to 1222.'
    explanation: Supports the Fe2+-associated shift in carbon and nitrogen network abundance.
