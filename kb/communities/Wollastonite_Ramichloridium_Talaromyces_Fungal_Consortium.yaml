ecological_interactions:
- name: Hypothesized CMS-1 Extracellular Polymer Cross-Feeding
  description: 'HYPOTHESIZED: CMS-1 extracellular products may support hzt-3′ metabolism in the mixed fungal culture.
    The source proposes this direction from bulk polysaccharide, protein and metabolite patterns; it does not trace
    CMS-1-derived material into hzt-3′. Medium sucrose consumption also contributes to the measured carbohydrate
    decline. Retain the proposed interaction without presenting direct transfer or recipient-specific production
    as demonstrated.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ramichloridium apiculatum CMS-1
    term:
      id: NCBITaxon:470080
      label: Ramichloridium apiculatum
  target_taxon:
    preferred_term: Talaromyces pseudofuniculosus hzt-3′
    term:
      id: NCBITaxon:2015341
      label: Talaromyces pseudofuniculosus
  metabolites:
  - preferred_term: polysaccharide
    term:
      id: CHEBI:18154
      label: polysaccharide
  - preferred_term: protein
    term:
      id: CHEBI:36080
      label: protein
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Mixed-Culture Organic-Acid and Amino-Acid Upregulation
    description: 'HYPOTHESIZED: consumption of CMS-1 products could enable greater hzt-3′ acid and amino-acid production.
      Bulk culture comparisons support metabolic changes but do not isolate this transfer as their necessary cause
      or distinguish it from consumption of supplied sucrose.'
  evidence:
  - reference: PMID:42478817
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: In mixed culture, CMS-1 synthesized extracellular polysaccharides and proteins that were utilized by
      hzt-3′
    explanation: An author-proposed transfer mechanism inferred from bulk measurements, not direct donor-to-recipient
      tracing.
- name: Mixed-Culture Organic-Acid and Amino-Acid Upregulation
  description: 'The tested 20% CMS-1 plus 80% hzt-3′ culture showed increased total organic acids and selected amino
    acids relative to pure cultures. Pure CMS-1 chiefly produced oxalic acid, while pure hzt-3′ chiefly produced
    gluconic acid. These are bulk concentrations, not gene-expression measurements or proof of recipient-specific
    synthesis after cross-feeding. Individual compounds did not all increase: mixed-culture oxalic acid was much
    lower.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ramichloridium apiculatum CMS-1
    term:
      id: NCBITaxon:470080
      label: Ramichloridium apiculatum
  - preferred_term: Talaromyces pseudofuniculosus hzt-3′
    term:
      id: NCBITaxon:2015341
      label: Talaromyces pseudofuniculosus
  metabolites:
  - preferred_term: oxalic acid
    term:
      id: CHEBI:16995
      label: oxalic acid
  - preferred_term: gluconic acid
    term:
      id: CHEBI:24266
      label: gluconic acid
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  downstream:
  - target: Optimized Wollastonite Calcium and Silicon Leaching
    description: 'PARTIAL: increased acidic metabolites and lower pH are consistent with enhanced acid dissolution
      and complexation driving wollastonite leaching. The culture-ratio comparison supports this mechanism but does
      not selectively establish which acid or amino acid is necessary, or partition chemical dissolution from physical
      disruption.'
  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The strain CMS-1 primarily produced oxalic acid (0.66 ± 0.033 mg/mL), while strain hzt-3′ mainly generated
      gluconic acid (1.60 ± 0.0798 mg/mL).
    explanation: Supports the distinct dominant organic acids measured for each fungal strain.
  - reference: PMID:42478817
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: hzt-3′, which upregulated the production of gluconic acid, isocitric acid, L-glutamine, and L-tyrosine
    explanation: The abstract assigns the mixed-culture change to hzt-3′; bulk assays do not independently establish
      cell-specific flux.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The total organic acid production ranked as follows: 20% CMS-1 + 80% hzt-3′ > 100% hzt-3′ > 100% CMS-1.'
    explanation: Results reports the mixed culture above both pure cultures; individual acids need not all increase.
- name: Optimized Wollastonite Calcium and Silicon Leaching
  description: 'The 20% CMS-1 plus 80% hzt-3′ input ratio gave the greatest wollastonite leaching among the tested
    ratios: 79.95% +/- 6.37% calcium and 18.59% +/- 0.11% silicon at day 12. Residue analyses support altered mineral
    structure. These positive outcomes do not demonstrate niche partitioning, quantify a separate hyphal-force contribution
    or measure net CO2 sequestration.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Ramichloridium apiculatum CMS-1
    term:
      id: NCBITaxon:470080
      label: Ramichloridium apiculatum
  - preferred_term: Talaromyces pseudofuniculosus hzt-3′
    term:
      id: NCBITaxon:2015341
      label: Talaromyces pseudofuniculosus
  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The 20% CMS-1 + 80% hzt-3′ ratio achieved leaching efficiency of 79.95% ± 6.37% for Ca2+ and 18.59%
      ± 0.11% for Si4+
    explanation: Supports the optimum mixed-culture ratio and Ca/Si leaching efficiencies.
  - reference: PMID:42478817
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: surface cracks and grooves on leaching residues indicated additional biophysical disruption
    explanation: Residue morphology is consistent with disruption but does not isolate a causal hyphal-force contribution.
