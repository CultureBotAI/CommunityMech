id: CommunityMech:000404
name: Wollastonite Ramichloridium-Talaromyces Fungal Consortium
description: A defined two-fungus mixed culture of Ramichloridium apiculatum CMS-1 and Talaromyces pseudofuniculosus hzt-3′
  grown with wollastonite in modified Czapek liquid medium. The source study varied the CMS-1:hzt-3′ inoculation ratio and
  found that 20% CMS-1 plus 80% hzt-3′ gave the strongest Ca2+ and Si4+ leaching, with CMS-1-derived extracellular polysaccharides
  and proteins cross-feeding hzt-3′ organic-acid and amino-acid production.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Test whether a defined fungal mixed culture can synergistically accelerate wollastonite bioleaching as a biological
    activation strategy for silicate mineral carbonation.
  assembly_strategy: Combine the mineral-rich-soil isolates R. apiculatum CMS-1 and T. pseudofuniculosus hzt-3′ as spore suspensions
    across six CMS-1:hzt-3′ starting ratios in modified Czapek liquid medium supplemented with wollastonite powder.
  inoculation_strategy: Inoculate 1 mL of mixed fungal spore suspension into 100 mL of modified Czapek liquid medium with
    0.5 g wollastonite in 250 mL conical flasks; the tested ratios were 100:0, 80:20, 60:40, 40:60, 20:80, and 0:100 CMS-1:hzt-3′.
  perturbation_design: Vary the initial CMS-1:hzt-3′ fungal inoculation proportion while measuring element leaching and extracellular
    metabolite profiles.
  measurement_endpoints:
  - Ca2+ leaching efficiency
  - Si4+ leaching efficiency
  - extracellular polysaccharides and proteins
  - organic acid and amino acid production
  - pH of the leaching solution
  - FT-IR, XRD, SEM-EDS, and XPS analysis of wollastonite residues
  evidence:
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study systematically investigated their dissolution patterns on wollastonite using a mixed culture of Ramichloridium
      apiculatum CMS-1 and Talaromyces pseudofuniculosus hzt-3′
    explanation: Supports the exact two-fungus mixed culture and the wollastonite-leaching design.
  - reference: PMID:42478817
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The mixed-strain proportions were set to six ratios: 100% CMS-1, 80% CMS-1 + 20% hzt-3′, 60% CMS-1 + 40% hzt-3′,
      40% CMS-1 + 60% hzt-3′, 20% CMS-1 + 80% hzt-3′, and 100% hzt-3′.'
    explanation: Supports the ratio-perturbation design.
