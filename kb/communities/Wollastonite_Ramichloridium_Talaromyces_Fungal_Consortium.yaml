- name: Optimized Wollastonite Calcium and Silicon Leaching
  description: The 20% CMS-1 plus 80% hzt-3′ inoculation ratio produced the strongest wollastonite dissolution among the tested
    ratios, reaching 79.95% calcium leaching and 18.59% silicon leaching and visibly disrupting wollastonite residue structure.
  interaction_type: NICHE_PARTITIONING
