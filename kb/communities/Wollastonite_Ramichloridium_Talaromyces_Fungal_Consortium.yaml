- name: Mixed-Culture Organic-Acid and Amino-Acid Upregulation
  description: The 20% CMS-1 plus 80% hzt-3′ mixed culture had elevated organic acids and amino acids relative to pure cultures;
    CMS-1 chiefly produced oxalic acid, while hzt-3′ chiefly generated gluconic acid and increased secretion of gluconic acid,
    isocitric acid, L-glutamine, and L-tyrosine after receiving CMS-1 extracellular products.
