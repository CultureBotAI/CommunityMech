    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Remarkably, in all strain combinations tested, co-inoculation of milk with Lh and Ld resulted in reduced acidification
      rates compared with the corresponding monocultures, regardless of the specific Ld and Lh strains used
    explanation: Supports the lower maximum acidification rate (umax) of the C001.15 + T1104 co-culture relative to monocultures.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain T1104 showed lower ΔpHmax than the conspecific strain C5I3 and exhibited a such limited acidification
      ability in monoculture that co-cultivation with Lh strain C001.15 resulted in lower final pH values and, consequently,
      a higher ΔpHmax compared with the T1104 monoculture (p < 0.05). Nonetheless, even under these conditions, Lh + Ld co-cultures
      remained less effective in acidification than Lh monoculture (p < 0.05).
    explanation: Documents the set 1 Delta pHmax exception where C001.15 + T1104 exceeded the slow T1104 monoculture while
      remaining below the C001.15 monoculture.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consistent with ΔpHmax values, an exception was observed in inoculation set 1, where the Lh + Ld co-culture,
      represented by C001.15 and T1104, produced total lactate amount comparable to those of St + Lh and St + Ld co-cultures
      (p > 0.05) ( Figure 8 ), but significantly lower than the corresponding tri-culture (p < 0.05) ( Figure 8 ). In this
      Lh + Ld combination, L-lactate represented 67.42% of total lactate
    explanation: Quantifies the set 1 C001.15 + T1104 total lactate exception and its 67.42% L-lactate composition.
- name: Set 1 triculture D-lactate accumulation
  description: At the end of the 160 h milk fermentation, D-lactate levels in the set 1 C001.15/RBC06/T1104 triculture were
    significantly higher than in the T1104 monoculture (p < 0.05), and D- and L-lactate were produced in comparable amounts
    in the triculture. Because L. helveticus C001.15 produces a racemic lactate mixture and S. thermophilus RBC06 monoculture
    produced 67.2% L-lactate (with 32.8% D-lactate), bulk triculture D-lactate is recorded as a mixed-culture metabolite readout
    rather than exclusive T1104 production.
