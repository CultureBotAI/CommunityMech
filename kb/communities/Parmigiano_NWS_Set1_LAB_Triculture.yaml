  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all inoculation sets, tri-cultures consistently displayed the highest μmax values (p < 0.05), followed
      by the co-cultures St + Lh and St + Ld.
    explanation: Supports the highest maximum milk acidification rate in the set 1 C001.15/RBC06/T1104 triculture.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across all three strain combinations, total lactic acid production was highest in tri-cultures, followed by St
      + Lh and St + Ld co-cultures (p < 0.05)
    explanation: Supports the highest total lactic acid production in the set 1 triculture relative to monocultures and 1:1
      co-cultures.
- name: RBC06-containing pairwise acidification and lactate stimulation
  description: In set 1 pairwise 1:1 co-cultures containing Streptococcus thermophilus RBC06 (RBC06 + T1104 and RBC06 + C001.15),
    maximum acidification rates (umax) and total lactate concentrations significantly exceeded those of the corresponding
    monocultures (p < 0.05). In the RBC06 + C001.15 pair, L-lactate accounted for 86.73% of total lactate, whereas in the
    RBC06 + T1104 pair production was dominated by D-lactate. These two-member phenotypes are preserved as separate pairwise
    comparison outcomes without asserting a subset-to-triculture causal arrow.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus C001.15
    term:
      id: NCBITaxon:1587
      label: Lactobacillus helveticus
  - preferred_term: Streptococcus thermophilus RBC06
    term:
      id: NCBITaxon:1308
      label: Streptococcus thermophilus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis T1104
    term:
      id: NCBITaxon:29397
      label: Lactobacillus delbrueckii subsp. lactis
  metabolites:
  - preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By contrast, in St + Ld co-cultures, μmax values were significantly higher than those observed in the corresponding
      Ld and St monocultures (p < 0.05) ( Figure 7A ), indicating a mutual benefit from co-cultivation. A similar enhancement
      was observed in Lh + St co-cultures, where all strain combinations exhibited significantly higher acidification rates
      than their respective monocultures (p < 0.05)
    explanation: Supports higher maximum acidification rates in both St + Ld (RBC06 + T1104) and Lh + St (C001.15 + RBC06)
      co-cultures relative to monocultures.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under St + Lh conditions, L-lactate predominates, accounting for 86.73% of total lactate in the co-culture of
      strains RBC06 and C001.5 and 74.08% in the co-culture of strains C001.27 and LBB04. Similarly, in St + Ld co-cultures,
      total lactate concentrations also exceeded those of the respective monocultures, with production dominated by D-lactate
    explanation: Quantifies the 86.73% L-lactate share in the set 1 RBC06 + C001.15 co-culture (printed as C001.5 in this
      sentence) and D-lactate predominance in St + Ld co-cultures.
- name: C001.15-T1104 reduced acidification rate and Set 1 Delta pHmax/lactate exception
  description: Co-inoculation of L. helveticus C001.15 with L. delbrueckii subsp. lactis T1104 reduced maximum acidification
    rate (umax) relative to the corresponding monocultures and remained less effective in Delta pHmax than the C001.15 monoculture
    (p < 0.05). Unlike sets 2 and 3, however, the set 1 C001.15 + T1104 pair exceeded the very low Delta pHmax of the T1104
    monoculture (p < 0.05) and produced total lactate comparable to the set 1 St + Lh and St + Ld co-cultures (p > 0.05) but
    lower than the set 1 triculture (p < 0.05), with L-lactate representing 67.42% of total lactate.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactobacillus helveticus C001.15
    term:
      id: NCBITaxon:1587
      label: Lactobacillus helveticus
  - preferred_term: Lactobacillus delbrueckii subsp. lactis T1104
