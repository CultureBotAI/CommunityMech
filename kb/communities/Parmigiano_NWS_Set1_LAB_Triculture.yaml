ecological_interactions:
- name: Set 1 triculture milk acidification and total lactate enhancement
  description: The set 1 C001.15/RBC06/T1104 1:1:1 triculture displayed the highest maximum acidification rate (umax) and
    highest total lactic acid production compared with the set 1 monocultures and pairwise co-cultures (p < 0.05) at constant
    total inoculum (2 x 10^7 CFU/mL). These community-level fermentation readouts establish enhanced mixed-culture acidification
    and total lactate accumulation without isolating per-strain cell counts or specific exchanged metabolites.
  scope: COMMUNITY_LEVEL
  participating_taxa:
