id: CommunityMech:000517
name: Parmigiano NWS Set 1 LAB Triculture
description: A defined three-strain lactic-acid-bacterial triculture assembled from Parmigiano Reggiano natural whey starter
  (NWS) isolates in inoculation set 1. Cristofolini et al. 2026 combined Lactobacillus helveticus C001.15, Streptococcus thermophilus
  RBC06, and Lactobacillus delbrueckii subsp. lactis T1104 in a 1:1:1 milk triculture at 2 x 10^7 CFU/mL total inoculum in
  40 mL partially skimmed UHT milk at 42 degrees C for 160 h to evaluate how NWS partner strains modulate milk acidification
  and lactate enantiomer accumulation alongside poorly cultivable L. delbrueckii subsp. lactis T1104 (PMID:41859451).
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Reconstruct a simplified three-species Parmigiano Reggiano natural-whey-starter consortium (inoculation set 1)
    to test how S. thermophilus RBC06 and L. helveticus C001.15 alter milk acidification and D-/L-lactate production when
    combined with the slow-acidifying L. delbrueckii subsp. lactis isolate T1104.
  assembly_strategy: Combine L. helveticus C001.15, S. thermophilus RBC06, and L. delbrueckii subsp. lactis T1104 at a 1:1:1
    species ratio in 40 mL partially skimmed UHT milk at a constant total final concentration of 2 x 10^7 CFU/mL.
  perturbation_design: Compare monocultures (St, Lh, and Ld), 1:1 pairwise co-cultures (St + Lh, St + Ld, and Lh + Ld), and
    1:1:1 tricultures (St + Lh + Ld) across natural-whey-starter strain sets while keeping total inoculum concentration constant.
  measurement_endpoints:
  - maximum milk acidification rate (umax)
  - maximum acidification efficiency (Delta pHmax)
  - D- and L-lactate concentrations after 160 h fermentation
  evidence:
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: set 1 (Lh C001.15, St RBC06, Ld T1104)
    explanation: Names the exact three natural-whey-starter strains assembled in inoculation set 1 for milk cross-feeding
      assays.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the strains S. thermophilus RBC06 and C001.27, L. helveticus C001.15 and LBB04, and L. delbrueckii subsp. lactis
      T1104 and C5I3 were originally isolated from NWS using M17 and MRS media
    explanation: Establishes the Parmigiano Reggiano natural-whey-starter isolation origin of the set 1 strains.
  - reference: PMID:41859451
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Milk fermentations were performed using single monocultures (St, Lh, and Ld), 1:1 co-cultures (St + Lh, St +
      Ld, and Lh + Ld), and 1:1:1 tri-cultures (St + Lh + Ld)
    explanation: Supports the monoculture, pairwise co-culture, and 1:1:1 triculture experimental perturbation design.
