id: CommunityMech:000425
name: CICC Three-Strain Probiotic M-MV Luteolin Consortium
description: Defined anaerobic co-culture of Bifidobacterium longum CICC25033, Clostridium butyricum CICC23847, and Limosilactobacillus
  reuteri CICC6131 used to produce mixed-species probiotic membrane vesicles (M-MVs). Hou et al. grew the strains singly,
  pairwise, and as a 1:1:1 three-strain combination in MRS broth, observed higher viable counts in co-culture and with cell-free
  supernatants from partner strains, isolated M-MVs from the supernatant of the co-culture, found a distinct M-MV proteomic
  profile with antioxidant activity, and loaded luteolin into the resulting M-MVs for in-vitro and DSS-induced mouse-colitis
  assays.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Test whether co-culturing three probiotic species can produce mixed-species membrane vesicles with distinct proteomic
    and antioxidant properties for luteolin encapsulation.
  assembly_strategy: Resuscitate B. longum CICC25033, C. butyricum CICC23847, and L. reuteri CICC6131 freeze-dried powders
    obtained from the China Center of Industrial Culture Collection, then compare mono-cultures, pairwise 1:1 combinations,
    and the 1:1:1 three-strain co-culture.
  inoculation_strategy: Inoculate the three-strain combination at 1% into fresh MRS broth at a 1:1:1 ratio; supplement groups
    containing C. butyricum with 0.1 mg/mL L-cysteine hydrochloride.
  perturbation_design: Compare the co-cultured three-strain M-MVs against B-MVs, C-MVs, and L-MVs from matched mono-cultures,
    then compare blank M-MVs, free luteolin, and luteolin-loaded M-MVs.
  measurement_endpoints:
  - viable cell counts after mono-, pairwise-, and three-strain anaerobic culture
  - viable cell counts after growth with cell-free supernatants from partner strains
  - membrane-vesicle morphology and particle-size distribution by TEM and DLS
  - vesicle proteins by SDS-PAGE and LC-MS/MS
  - DPPH and ABTS radical-scavenging activity
  - luteolin loading, solubility, and simulated gastrointestinal stability
  - RAW264.7 cytotoxicity and cellular uptake
  - DSS-induced mouse-colitis histology, antioxidant, inflammatory, and 16S readouts
  evidence:
  - reference: PMID:42604006
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each probiotic strain, their pairwise combinations (1:1) and a three-strain combination (1:1:1) were inoculated
      at 1% into fresh MRS broth
    explanation: Supports the mono-culture, pairwise, and 1:1:1 assembly design.
  - reference: PMID:42604006
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: From the supernatant of the co-cultured three strains, we isolated M-MVs
    explanation: Links the three-strain co-culture to the mixed-species membrane-vesicle output.
  - reference: PMID:42604006
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lut, a flavonoid with antioxidant and anti-inflammatory properties, was loaded into M-MVs
    explanation: Supports luteolin loading into the mixed-species vesicles.
