ecological_interactions:
- name: Three-Strain Co-Culture Growth Enhancement
  description: B. longum CICC25033, C. butyricum CICC23847, and L. reuteri CICC6131 grew without detectable antagonism when
    paired or assembled as a 1:1:1 MRS co-culture, and cell-free supernatants from partner strains enhanced mono-culture growth,
    especially for L. reuteri. The authors attributed these responses to a putative cross-feeding relationship.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42604006
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: viable cell counts in the co-cultured strains increased significantly
    explanation: Supports higher viable counts in co-cultures than in mono-cultures.
  - reference: PMID:42604006
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This could be attributed to a cross-feeding relationship
    explanation: Supports the source's cross-feeding interpretation for the growth enhancement.
  - reference: PMID:42604006
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each probiotic strain was cultured in MRS medium supplemented with 1% cell-free supernatant
    explanation: Supports the partner-supernatant experiment used to assay diffusible growth effects.
