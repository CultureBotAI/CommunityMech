discussions:
- discussion_id: rammelsberg_exact_system_scope
  prompt: Which strain-specific exchanges and feedbacks are established in the Rammelsberg enrichment?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Iron Oxidation and Ferric Iron Generation
  - ecological_interactions#Cobalt and Copper Mobilization from Sulfide Minerals
  - ecological_interactions#Sulfur Oxidation and Acid Generation
  rationale: The correct primary study is doi:10.1016/j.hydromet.2020.105443;105484 concerns Finnish secondary ore,
    while PMID:39770610 is a general review. The inoculum contained four named strains and indigenous organisms
    were detected. Dominance by the two recorded Acidithiobacillus taxa does not establish a defined two-member
    community or reciprocal fitness. General iron/sulfur chemistry is not a demonstrated partner-specific recycling/passivation
    feedback, and intrinsic carbon fixation is not commensal exchange. Retain supported community processes and
    the iron-to-mineral-dissolution arrow without the other three feedback arrows or carbon-fixation interaction.
    Non-graph identity, industrial-scale and citation claims require separate curation under issue1753.
  evidence:
  - reference: doi:10.1016/j.hydromet.2020.105443
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Some indigenous bacteria (~19%) were detected at the end of the leaching tests in STR
    explanation: The exact study explicitly reports additional community members.
  - reference: doi:10.1016/j.hydromet.2020.105443
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mixed consortium containing mainly At. ferrooxidans and At. thiooxidans remained stable throughout
      the experiment.
    explanation: Supports these taxa as dominant, not exclusive or proven reciprocal beneficiaries.
