environmental_factors:
- name: pH
  value: 1.5-2.5
  unit: pH units
  description: 'Extremely acidic pH range maintained by sulfuric acid production from At. thiooxidans
    sulfur oxidation. Low pH is critical for ferric iron solubility (prevents ferric hydroxide precipitation),
    optimal enzymatic activity of acidophilic iron and sulfur oxidizers, and metal solubilization from
    sulfide minerals. The acidic environment excludes neutrophilic competitors, ensuring acidophilic consortium
    dominance. pH 1.5-2.5 represents optimal growth conditions for both At. ferrooxidans and At. thiooxidans.

    '
  evidence:
  - reference: PMID:39770610
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, its use in biometallurgical applications poses environmental issues through its
      effect on the pH levels in bioleaching systems, which produce acid mine drainage in rivers and lakes
      adjacent to mines
    explanation: Documents optimal pH range for Acidithiobacillus species
- name: Temperature
  value: 30-35
  unit: °C
  description: 'Mesophilic temperature range optimal for At. ferrooxidans and At. thiooxidans growth and
    metabolic activity. The Rammelsberg consortium is adapted to mesophilic conditions (optimal ~35°C),
    distinguishing it from thermophilic bioleaching systems. Mesophilic operation reduces energy costs
    compared to thermophilic processes while maintaining high metal recovery efficiency (91% Co, 57% Cu).

    '
  evidence:
  - reference: PMID:39770610
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ferrooxidans catalyzes the extraction of elements by generating iron (III) ions in oxic conditions,
      which are able to react with metal sulfides
    explanation: Documents optimal temperature for At. ferrooxidans
- name: Pulp Density
  value: '10'
  unit: '% (w/v)'
  description: 'High solids concentration (10% pulp density = 100 g tailings per liter) achieved through
    consortium adaptation via succession from low to high pulp density. The adapted consortium showed
    high bioleaching efficiency at 10% pulp density, demonstrating industrial scalability. High pulp density
    is critical for economic viability of bioleaching operations, maximizing metal throughput per reactor
    volume while maintaining acceptable kinetics and metal recovery.

    '
  evidence:
  - reference: doi:10.1016/j.hydromet.2020.105484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mining of non-ferrous metals produces the largest volume of metal-containing, extractive
      waste in Europe, and about 29% of all the waste produced in the EU-28
    explanation: Documents adaptation to 10% pulp density
- name: Reactor Configuration
  value: 2 L stirred tank reactors
  unit: liters
  description: 'Bioleaching performed in 2-liter stirred tank reactors (STR) with controlled agitation
    and aeration. Stirred tank configuration provides homogeneous mixing, efficient gas-liquid mass transfer
    for oxygen supply, prevention of particle settling, and controlled environmental conditions (pH, temperature,
    dissolved oxygen). This represents industrial-relevant bioreactor design suitable for scale-up to
    commercial cobalt recovery operations.

    '
  evidence:
  - reference: doi:10.1016/j.hydromet.2020.105484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The study aimed to characterize the mineralogy of the secondary ore and perform bioleaching
      in 2 L-stirred tank reactors, with three microbial cultures growing at 42, 48 and 55 °C
    explanation: Documents reactor configuration
- name: Bioleaching Duration and Metal Recovery
  value: '13'
  unit: days
  description: 'Metal recovery kinetics showed 91% cobalt and 57% copper extraction after 13 days of bioleaching
    from bulk tailings (Co 0.02%, Cu 0.12%) at 10% pulp density. From flotation concentrate (Co 0.06%,
    Cu 0.57%), recovery was 66% cobalt and 33% copper. The 13-day bioleaching duration represents a practical
    time frame for industrial operations, balancing metal recovery efficiency against residence time and
    reactor productivity. The Rammelsberg system demonstrates that even low-grade cobalt tailings (0.02%
    Co) can be efficiently processed for critical battery material recovery through bioleaching.

    '
  evidence:
  - reference: doi:10.1016/j.hydromet.2020.105484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The first step of the NEMO concept consists of removing the sulfides remaining from primary
      bioleaching and extracting the metals in the residual material (known as ‘secondary ore’) using
      either enhanced bioleaching or an alkaline autoclave conversion processes
    explanation: Quantifies metal recovery kinetics
- name: Oxygen Supply
  value: Aerobic
  unit: condition
  description: 'Continuous aeration supplies oxygen as the terminal electron acceptor for both At. ferrooxidans
    (iron oxidation: 4Fe²⁺ + O₂ + 4H⁺ → 4Fe³⁺ + 2H₂O) and At. thiooxidans (sulfur oxidation: S²⁻ + 2H₂O
    + 2O₂ → SO₄²⁻ + 4H⁺). Adequate dissolved oxygen is rate-limiting for bioleaching kinetics, as both
    primary energy-generating pathways require oxygen. Stirred tank reactor design with controlled agitation
    ensures efficient oxygen mass transfer to maintain aerobic conditions throughout the high-density
    pulp.

    '
  evidence:
  - reference: PMID:39770610
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It has emerged as a key player in biomining and bioleaching technologies thanks to its unique
      ability to mobilize a wide spectrum of elements, such as Li, P, V, Cr, Fe, Ni, Cu, Zn, Ga, As, Mo,
      W, Pb, U, and its role in ferrous iron oxidation and reduction
    explanation: Documents aerobic oxygen requirement
- name: Tailings Mineralogy and Metal Grades
  value: Framboidal pyrite with surface-associated cobalt
  description: 'Rammelsberg tailings are derived from a polymetallic massive sulfide deposit containing
    cobalt (0.02% in bulk, 0.06% in concentrate), copper (0.12% in bulk, 0.57% in concentrate), and nickel.
    Mineralogical analysis revealed that cobalt occurs on the surface of framboidal pyrite (a spherical
    aggregate form of pyrite with high surface area). The surface-association of cobalt makes it particularly
    amenable to microbial bioleaching attack, as bacteria and ferric iron can access cobalt without requiring
    complete pyrite dissolution. This mineralogy contributes to the high 91% cobalt recovery efficiency
    achieved by the consortium.

    '
  evidence:
  - reference: doi:10.1016/j.hydromet.2020.105484
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the framework of the European project NEMO (Near-zero-waste recycling of low-grade sulfidic
      mining waste for critical-metal, mineral and construction raw-material production in a circular
      economy), new ways to valorize sulfidic tailings are being developed through the recovery of valuable
      metals and critical raw materials and the transformation of the residual in clean mineral fraction
      to be used for the mass production of cement, concrete and construction products
    explanation: Documents cobalt mineralogy and accessibility to bioleaching
