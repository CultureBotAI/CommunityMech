    iron support microbial iron(II)-to-iron(III) conversion that promotes metal-sulfide dissolution. The primary
    paper contrasts these dynamics with an inhibited abiotic control; it does not establish a rate-limiting step
    or reciprocal fitness between the two dominant taxa. The listed Acidithiobacillus taxa are dominant recorded
