    label: mine tailing
  notes: 'Sulfidic mine tailings from the Rammelsberg polymetallic massive sulfide deposit in the Harz
    Mountains, Germany. The tailings contain low-grade cobalt (0.02% in bulk tailings, 0.06% in flotation
    concentrate), copper (0.12% in bulk tailings, 0.57% in concentrate), and nickel. Cobalt is primarily
    associated with framboidal pyrite surfaces. The bioleaching system operates at 10% pulp density (100
    g tailings per liter) in stirred tank reactors with controlled aeration and pH. The consortium was
    adapted through succession from low to high pulp density, demonstrating industrial scalability for
    battery material recovery from mine waste.

    '
