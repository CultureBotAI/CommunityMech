    notes: 'Mesophilic chemolithoautotrophic iron-oxidizing bacterium that obtains energy from oxidation
      of ferrous iron (Fe²⁺) to ferric iron (Fe³⁺) and reduced sulfur compounds. This organism is one
      of the two dominant members of the Rammelsberg bioleaching consortium and plays a critical role
      in metal solubilization through both direct enzymatic oxidation of iron-sulfide minerals and indirect
      oxidation via production of ferric iron as a chemical oxidant. At. ferrooxidans thrives in highly
      acidic environments (pH 1.5-2.5) and operates optimally at mesophilic temperatures (30-35°C). The
      species exhibits autotrophic carbon fixation via the Calvin cycle, using CO₂ as sole carbon source
      while deriving energy from inorganic iron and sulfur oxidation. In the Rammelsberg system, At. ferrooxidans
      oxidizes ferrous iron released from pyrite dissolution, regenerating ferric iron that drives further
      mineral attack and cobalt mobilization.

      '
