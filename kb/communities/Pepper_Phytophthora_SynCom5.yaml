ecological_interactions:
- name: Individual-Isolate PGPR Trait Measurements
  description: The five selected isolates showed distinct in-vitro PGPR trait profiles, including phosphate solubilization,
    IAA, siderophore and ammonia production and biofilm-associated assays. Preserve the positive screens without
    assigning every activity equally to every member. Table1 and narrative trait rankings differ, so the selection
    rationale does not establish a unique highest producer. These traits were assayed individually before assembly,
    not re-quantified in rhizosphere soil, and compatibility screens do not establish reciprocal fitness or synergistic
    trait expression.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:26020
      label: phosphate
    notes: Trait measured in individual isolate screens; not a measured plant delivery flux or proof of equal activity
      by every member.
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Trait measured in individual isolate screens; not a measured plant delivery flux or proof of equal activity
      by every member.
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
    notes: Trait measured in individual isolate screens; not a measured plant delivery flux or proof of equal activity
      by every member.
  downstream:
  - target: Pepper Growth and Visible Symptoms Under Pathogen Challenge
    description: HYPOTHESIZED - Nutrient-mobilization and phytohormone traits of the selected isolates could contribute
      to challenged-host growth. The traits were not re-quantified in soil and were not selectively perturbed, so
      the host comparison does not isolate their mediation.
  evidence:
  - reference: PMID:40508300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The SynCom members exhibited phosphate solubilization, indole-3-acetic acid production, catalase activity,
      siderophore synthesis, and strong antagonism against P. capsici
    explanation: Abstract summary of isolate screens; full Table1 shows heterogeneous traits rather than uniformly
      strong activity.
- name: Isolate Antagonism Against Phytophthora capsici
  description: Individual dual-culture assays showed substantially stronger P. capsici inhibition by S. roseicoloratus
    T14 and, secondarily, P. frederiksbergensis A6 than by the other three isolates. Table1 reports 58.4% and 17.6%
    inhibition for T14 and A6, respectively; it does not show uniformly strong antagonism by all five members. Co-occurring
    enzyme or siderophore phenotypes do not identify the inhibition mechanism. P. capsici is an oomycete; chitinase
    activity does not demonstrate degradation of its wall or a host antifungal defense response.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
    notes: Siderophore is a separately screened trait, not an established mediator of pathogen inhibition; strong
      siderophore production is not demonstrated for A6.
  downstream:
  - target: Pepper Growth and Visible Symptoms Under Pathogen Challenge
    description: HYPOTHESIZED - The measured isolate antagonism may contribute to improved host performance under
      pathogen challenge. The pot study lacked a SynCom-only control and direct disease scoring or pathogen-load
      measurements, so it cannot isolate pathogen suppression from growth promotion or attribute the host response
      to these two strains alone.
  evidence:
  - reference: PMID:40508300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The SynCom members exhibited phosphate solubilization, indole-3-acetic acid production, catalase activity,
      siderophore synthesis, and strong antagonism against P. capsici
    explanation: Preserves measured isolate antagonism; primary Table1 resolves T14/A6 dominance. Does not identify
      enzyme-mediated killing or competition for a particular resource.
  participating_taxa:
  - preferred_term: Streptomyces sp.
    term:
      id: NCBITaxon:1931
      label: Streptomyces sp.
  - preferred_term: Pseudomonas sp.
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
- name: Pepper Growth and Visible Symptoms Under Pathogen Challenge
  description: In the controlled pot experiment, the full five-member SynCom plus pathogen treatment improved root
    length, height, biomass, stem diameter and chlorophyll compared with the pathogen-only control. The authors
    also report reduced visible wilting and necrosis. Section3.5 explicitly states that direct disease-severity
    scoring and pathogen-load measurements were not performed, and that there was no SynCom-only control. Preserve
    measured growth and visible protection without converting them into quantified pathogen suppression, strain-resolved
    colonization or an IAA-mediated host mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:40508300
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynCom reduced disease severity and enhanced the growth of pepper plants.
    explanation: The abstract summarizes a positive result; the full paper clarifies that disease protection used
      visual/physiological proxies rather than direct disease scores or pathogen load.
