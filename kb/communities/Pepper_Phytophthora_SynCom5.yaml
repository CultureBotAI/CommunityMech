    explanation: Reports the growth-chamber temperature regime for the pepper plant experiment.
discussions:
- discussion_id: pepper-syncom5-assay-and-mediator-boundaries
  prompt: Which isolate traits and community changes mediate the positive host response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
