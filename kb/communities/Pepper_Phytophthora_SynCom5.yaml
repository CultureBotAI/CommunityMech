ecological_interactions:
- name: Complementary PGPR Trait Pool
  description: The five-member pepper SynCom combines phosphate solubilization, indole-3-acetic-acid
    production, siderophore synthesis, ammonia production, and biofilm formation to provide complementary
    plant growth-promoting functions.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: phosphate
    term:
      id: CHEBI:26020
      label: phosphate
    notes: Plant-accessible phosphorus pool mobilized by SynCom phosphate-solubilizing activity
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Auxin produced by SynCom members during plant-growth promotion assays
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
    notes: Iron-mobilizing chelator produced by SynCom members
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Pepper Growth Under Phytophthora Challenge
    description: The complementary PGPR trait set contributes nutrient-mobilization and phytohormone
      functions to the growth improvement observed in P. capsici-challenged pepper plants.
  evidence:
  - *id001
- name: Direct Phytophthora capsici Antagonism
  description: SynCom members show strong direct antagonism against Phytophthora capsici and secrete
    biocontrol-associated enzymes and siderophores, led by Streptomyces roseicoloratus T14 and Pseudomonas
    frederiksbergensis A6 inhibition activity.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: siderophore
    term:
      id: CHEBI:26672
      label: siderophore
    notes: Iron-chelating antagonist trait screened across the pepper SynCom members
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: Pepper Growth Under Phytophthora Challenge
    description: Direct Phytophthora antagonism supplies the disease-suppression component of the SynCom's
      pepper-protection phenotype under pathogen pressure.
  evidence:
  - *id001
- name: Pepper Growth Under Phytophthora Challenge
  description: The complete five-member SynCom reduces Phytophthora capsici disease severity while improving
    pepper root length, plant height, biomass, stem diameter, and chlorophyll content.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Plant-growth-promoting auxin from the full SynCom trait suite
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Bacillus, Flavobacterium, Cytobacillus, Streptomyces, and Pseudomonas isolates from healthy pepper
    rhizosphere.
  description: Pepper plants challenged with P. capsici after SynCom application.
  evidence:
  - *id001
related_ingredients:
- preferred_term: indole-3-acetic acid
  chebi_term:
    id: CHEBI:16411
    label: indole-3-acetic acid
  relevance: Plant growth-promoting auxin produced by members of the 5-isolate pepper rhizosphere
    SynCom — Bashizi et al. 2025 list indole-3-acetic acid production as one of the screened biocontrol
    traits underlying the SynCom's growth-promoting and Phytophthora-suppressive activity.
  evidence:
  - reference: PMID:40508300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The SynCom members exhibited phosphate solubilization, indole-3-acetic acid production,
      catalase activity, siderophore synthesis, and strong antagonism against P. capsici
    explanation: Establishes IAA production as a shared functional trait of the SynCom members that
      drives plant growth promotion alongside pathogen suppression.
growth_media:
- name: tryptic soy broth (TSB)
  temperature: '30'
  temperature_unit: °C
  shaking_speed: '180'
  shaking_speed_unit: rpm
  vessel_type: shake flask (liquid TSB); tryptic soy agar (TSA) plates for isolation
  preparation_notes: 'Rhizosphere strains isolated on tryptic soy agar (TSA); growth of the five SynCom
    isolates monitored in TSB at 30°C, 180 rpm. Dual-culture antagonism assays against P. capsici
    incubated at 25°C for 5 days. Pepper plant assay conducted in a controlled growth chamber
    (day/night 18-23°C and 12-16°C).'
  evidence:
  - reference: PMID:40508300
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: were monitored in tryptic soy broth (TSB) at 30 °C with shaking at 180 rpm
    explanation: Reports the medium, temperature, and shaking speed used to grow the SynCom isolates.
  - reference: PMID:40508300
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The experiment was conducted in a controlled growth chamber at Kyungpook National University
      under day/night temperatures of 18–23 °C and 12–16 °C
    explanation: Reports the growth-chamber temperature regime for the pepper plant experiment.
