    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynCom reduced disease severity and enhanced the growth of pepper plants.
    explanation: The abstract summarizes a positive result; the full paper clarifies that disease protection used
      visual/physiological proxies rather than direct disease scores or pathogen load.
