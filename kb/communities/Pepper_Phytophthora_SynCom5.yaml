  - ecological_interactions#Isolate Antagonism Against Phytophthora capsici
  - ecological_interactions#Pepper Growth and Visible Symptoms Under Pathogen Challenge
  rationale: Individual screens, host growth and visible symptom improvement are distinct. Section3.5 rules out
    direct disease scoring/pathogen load and a SynCom-only comparison. Community composition and nitrate/K/Ca responses
    are additional positive findings not yet independently represented as graph nodes; ammonium/nitrite differences
    are not significant in Results despite stronger Discussion claims. PICRUSt/FUNGuild outputs are predictions,
    not measured metabolic flux or pathogen load. New structure requires scoped Edison review; no new topology is
    added here. Source protocol and identity inconsistencies remain a separate metadata issue.
  evidence:
