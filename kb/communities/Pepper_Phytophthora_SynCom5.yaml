  temperature: '30'
  temperature_unit: °C
  shaking_speed: '180'
  shaking_speed_unit: rpm
  vessel_type: shake flask (liquid TSB); tryptic soy agar (TSA) plates for isolation
  preparation_notes: 'Rhizosphere strains isolated on tryptic soy agar (TSA); growth of the five SynCom
    isolates monitored in TSB at 30°C, 180 rpm. Dual-culture antagonism assays against P. capsici
    incubated at 25°C for 5 days. Pepper plant assay conducted in a controlled growth chamber
    (day/night 18-23°C and 12-16°C).'
  evidence:
