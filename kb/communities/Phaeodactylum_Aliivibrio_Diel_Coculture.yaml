id: CommunityMech:000446
name: Phaeodactylum-Aliivibrio Diel Co-culture
description: >-
  A defined two-member marine algae-bacteria co-culture pairing the model
  diatom Phaeodactylum tricornutum CCAP 1055/1 with the heterotrophic marine
  bacterium Aliivibrio fischeri MCCC 1H00019. Chen et al. 2026 grew the pair
  in EASW medium supplemented with 30% marine broth under a 12 h light/12 h
  dark cycle and used 4-day and 8-day samples to show bacterial surface
  colonization, competitive rather than growth-promoting behavior, a day-6
  extracellular-polymeric-substance peak followed by day-8 depletion, and
  time-dependent rewiring of P. tricornutum photosynthetic physiology,
  transcriptomic rhythmicity, and model-inferred biomass flux.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: >-
    Build a defined Phaeodactylum tricornutum and Aliivibrio fischeri
    algae-bacteria co-culture to test how bacterial presence alters diatom diel
    physiology and transcriptional rhythmicity.
  assembly_strategy: >-
    Axenize P. tricornutum CCAP 1055/1, wash the algal culture with sterile
    EASW to remove antibiotics, and inoculate A. fischeri MCCC 1H00019 into an
    EASW plus 30% marine broth co-culture medium at initial densities of
    1x10^6 algal cells/mL and 4x10^4 bacterial cells/mL.
  perturbation_design: >-
    Compare axenic P. tricornutum in EASW control medium, axenic
    P. tricornutum in EASW plus 30% marine broth, and paired
    P. tricornutum/A. fischeri co-cultures sampled at day 4 and day 8.
  measurement_endpoints:
  - algal cell density
  - A. fischeri CFU abundance
  - extracellular polymeric substance composition
  - chlorophyll a fluorescence
  - maximum quantum yield of photosystem II
  - P. tricornutum rhythmic transcript abundance
  - genome-scale biomass flux
  evidence:
  - &defined_coculture
    reference: PMID:42668638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a defined co-culture of the diatom Phaeodactylum tricornutum with
      the marine bacterium Aliivibrio fischeri
    explanation: >-
      Identifies the two-member P. tricornutum/A. fischeri co-culture design.
  - &co4d_co8d
    reference: PMID:42668638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The two co-culture groups correspond to the exponential growth phase (day
      4, Co4d) and the stationary phase (day 8, Co8d), respectively.
    explanation: >-
      Supports the early and prolonged co-culture sampling design.
