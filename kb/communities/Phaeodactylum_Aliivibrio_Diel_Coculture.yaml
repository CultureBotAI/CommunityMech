ecological_interactions:
- name: Aliivibrio Surface Colonization of Phaeodactylum
  description: >-
    SEM imaging showed A. fischeri colonizing P. tricornutum cell surfaces in
    the 30% marine broth co-culture, with filamentous structures likely
    corresponding to EPS from one or both partners.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Aliivibrio fischeri MCCC 1H00019
    term:
      id: NCBITaxon:668
      label: Aliivibrio fischeri
  target_taxon:
    preferred_term: Phaeodactylum tricornutum CCAP 1055/1
    term:
      id: NCBITaxon:2850
      label: Phaeodactylum tricornutum
  evidence:
  - reference: PMID:42668638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Scanning electron microscopy (SEM) analysis demonstrated significant
      colonization of P. tricornutum cell surfaces by A. fischeri
    explanation: >-
      Supports bacterial attachment to the diatom cell surface in co-culture.
- name: Amino Acid Resource Competition
  description: >-
    Rather than supporting a direct growth-promotion effect of A. fischeri on
    P. tricornutum, the EASW/30% marine broth co-culture showed nutrient
    depletion and pigment dynamics consistent with early competition for
    amino-acid resources.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Phaeodactylum tricornutum CCAP 1055/1
    term:
      id: NCBITaxon:2850
      label: Phaeodactylum tricornutum
  - preferred_term: Aliivibrio fischeri MCCC 1H00019
    term:
      id: NCBITaxon:668
      label: Aliivibrio fischeri
  evidence:
  - reference: PMID:42668638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results are more consistent with a competitive effect in co-culture
      than with a growth-promoting role of A. fischeri.
    explanation: >-
      Supports the authors' interpretation that the bacterium imposed
      competitive rather than positive dynamics.
  - reference: PMID:42668638
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The observed nutrient depletion patterns and pigment dynamics suggest
      early-phase competition for amino acid resources between P. tricornutum
      and A. fischeri
    explanation: >-
      Supports amino-acid competition as an inferred constraint in the early
      algae-bacteria co-culture.
environmental_factors:
- name: EPS depletion during prolonged co-culture
  value: peak at day 6 followed by day-8 reduction
  description: >-
    EPS in the P. tricornutum/A. fischeri 30% marine broth co-culture peaked at
    day 6 and then declined by day 8, a pattern interpreted as a possible
    outcome of nutrient depletion, biomass dilution, or bacterial EPS catabolism.
  evidence:
  - reference: PMID:42668638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Quantitative assessment of EPS production in the 30% marine broth
      co-culture of P. tricornutum with A. fischeri revealed a peak at day 6,
      followed by a marked reduction by day 8
    explanation: Supports the reported temporal EPS response in the co-culture.
- name: Rhythmic gene decrease by day 8
  value: 7,215 rhythmic genes in Co8d versus 8,619 in the axenic control
  description: >-
    The prolonged day-8 co-culture had fewer rhythmic P. tricornutum genes than
    the axenic control, consistent with progressive disruption of diatom
    transcriptomic rhythmicity during bacterial co-culture.
  evidence:
  - reference: PMID:42668638
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      we identified 8,619, 9,387, 8,444, and 7,215 rhythmic genes in the
      Control, HAC, Co4d, and Co8d groups, respectively
    explanation: >-
      Quantifies the rhythmic-gene counts across the experimental groups.
- name: Biphasic modeled biomass flux
  value: +81% in Co4d; -87% in Co8d
  description: >-
    Genome-scale metabolic modeling predicted higher P. tricornutum 24 h
    biomass flux in the early day-4 co-culture but a strong flux decrease after
    prolonged day-8 co-culture.
  evidence:
  - reference: PMID:42668638
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      After 4 days of co-culture (Co4d), the total 24-h biomass flux increased
      by approximately 81% relative to the axenic control
    explanation: Supports the early modeled biomass-flux increase.
  - reference: PMID:42668638
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      prolonged co-culture (Co8d) led to a marked decline, reducing fluxes by
      87% (24-h), 89% (daytime), and 84% (nighttime).
    explanation: Supports the modeled biomass-flux decrease after 8 days.
