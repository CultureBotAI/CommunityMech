discussions:
- discussion_id: richness_graph_evidence_scope
  prompt: Which ecological and molecular changes explain the time-dependent richness-function relationship?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The primary study measures nitrate disappearance, productivity, changing composition and yield-derived
    biodiversity effects. It does not resolve the proposed molecular mechanisms of larger gains at low initial richness.
    The two workflow nodes and their remaining arrow are removed; the four biological observations or analytical
    results remain without invented mechanistic directions.
