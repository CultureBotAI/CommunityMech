ecological_interactions:
- name: Early Richness-Function Correlation
  description: Higher initially assigned richness was associated with greater productivity at days 3, 30 and 60,
    but with greater nitrate-reduction activity only at days 3 and 30. The source operationally measured nitrate
    disappearance, not complete denitrification to gaseous products. These panel-level associations are time-dependent;
    initial richness is not proof of invariant realized membership throughout propagation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  evidence:
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'A significant positive correlation was observed between community richness and functions, represented
      by productivity (biomass) and denitrification rate

      '
    explanation: 'Supports productivity and nitrate-reduction rate as richness-dependent SDC outcomes.

      '
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: no association between denitrification rate and richness was detected (P > 0.05) at the 60th, 90th,
      120th, 150th, and 180th days
    explanation: Bounds the nitrate-reduction association separately from the productivity result.
- name: Larger Functional Increases at Lower Initial Richness
  description: Communities assigned lower initial richness showed larger increases in productivity and nitrate-reduction
    activity across the transfer series, while the initially positive richness-function association became undetectable
    later. This does not establish identical final performance or identify beneficial mutations as the cause; composition
    changed during propagation and the proposed molecular mechanisms remain unresolved.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  evidence:
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'microbial community functions with lower richness exhibited greater increases than those with higher
      richness

      '
    explanation: 'Supports the stronger productivity and denitrification increases in lower-richness communities.

      '
- name: Complementarity-Dominated BEF Partitioning
  description: Additive partitioning of biomass-based yields attributed more of the net biodiversity effect to complementarity
    than selection. Complementarity increased over time, with larger increases at lower initial richness. This is
    a statistical decomposition, not direct measurement of substrate exchange, niche differentiation or a molecular
    mediator of nitrate reduction.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  evidence:
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Biodiversity effect analysis revealed positive BEF relationships largely attributable to complementary
      effects

      '
    explanation: 'Supports complementarity as the dominant biodiversity effect in the SDC BEF relationship.

      '
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we partitioned the net biodiversity effect on productivity into complementarity and selection using
      an additive partitioning equation
    explanation: Defines the biomass/productivity-based analysis rather than pathway-resolved nitrate flux.
- name: Mixture-Associated Relative Yield Differences
  description: Mixture and corresponding monoculture yields differed among the constituent Shewanella taxa, and
    the authors used relative yields to infer community interaction effects. Those aggregate comparisons do not
    identify a specific pairwise interaction, exchanged metabolite, or causal genetic change.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'inferred species interactions by comparing the contribution of each species in their mix-cultures
      and their corresponding monocultures

      '
    explanation: 'Supports using mix-culture and monoculture comparisons to infer SDC species-interaction effects.

      '
environmental_factors:
- name: Serial nitrate-richness gradient
  value: 1, 2, 4, 8, and 12 species across 180 days
  description: >
    The Shewanella design varied initial richness while holding nitrate medium
    and serial transfer conditions fixed for the experimental-evolution run.
  evidence:
  - *id001
related_ingredients:
- preferred_term: nitrate
  chebi_term:
    id: CHEBI:17632
    label: nitrate
  relevance: The terminal electron acceptor reduced by every Shewanella member — nitrate-reduction
    rate is the canonical denitrification function quantified across the richness gradient and is the
    primary BEF outcome the SDCs are evolved on (Wu et al. 2023).
  evidence:
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: they are important denitrifiers since all known Shewanella species could reduce nitrate
      using a variety of different electron donors
    explanation: Names nitrate as the substrate every SDC member reduces — the defining biochemistry
      tracked across the SDCs.
growth_media:
- name: modified marine broth 2216
  temperature: '25'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  incubation_time: '72'
  incubation_time_unit: h
  inoculum_size: '3'
  inoculum_unit: '% v/v'
  vessel_type: Balch tube
  preparation_notes: >-
    Modified marine broth 2216 (Becton, Dickinson) supplemented with 20 mM
    NaNO3 as the electron acceptor; SDCs propagated by transferring 3% (300 µL
    of the 10 mL culture) into fresh medium every 3 days (72 h).
  evidence:
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Shewanella species/strains were cultured anaerobically in three
      replicate Balch tubes at 25°C in the modified marine broth 2216 (Becton,
      Dickinson) supplemented with 20 mM NaNO3 as the electron acceptor.
    explanation: Names anaerobic Balch-tube cultivation at 25°C in modified marine broth 2216 with nitrate.
  - reference: PMID:37154752
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All SDCs were grown and propagated in the modified marine broth 2216 by
      transferring 3% (300 μL) of the final volume (10 mL) into a fresh medium
      after 72 h when all Shewanella bacteria reached their saturation stages,
      and each transfer was 3 days.
    explanation: Documents 72 h batch cycles and 3% serial-transfer propagation of the SDCs.
