  downstream:
  - target: E. coli Stimulation of Cyanobacterial Growth
    description: 'HYPOTHESIZED/PARTIAL: photosynthate-supported heterotroph activity could contribute to the observed
      cyanobacterial growth benefit through metabolite return or byproduct absorption. The study does not isolate
      sucrose uptake as its cause or identify a necessary exchanged compound; positive and negative effects depend
      on culture context.'
  evidence:
