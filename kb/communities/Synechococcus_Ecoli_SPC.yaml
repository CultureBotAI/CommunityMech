      label: Escherichia coli
- name: E. coli growth on cyanobacterial photosynthate
  description: E. coli W delta-cscR grew on cyanobacterial photosynthate and maintained viability in continuous
    coculture for more than two weeks. Early batch growth was not primarily attributable to sucrose export; improved
    sucrose utilization contributed to later PHB production in separately functionalized strains. No product-removal
    feedback mechanism establishing syntrophy is shown by carbon feeding alone.
  scope: COMMUNITY_LEVEL
