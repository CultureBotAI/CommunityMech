growth_media:
- name: CoB BG-11 (BG-11-based cyanobacteria/bacteria co-culture medium)
  temperature: '35'
  temperature_unit: °C
  ph: '8.3'
  atmosphere: AEROBIC
  headspace_gas: 2% CO2
  light_regime: constant light (some experiments 16 h light:8 h dark)
  light_intensity: '80'
  light_intensity_unit: µmol PAR
  shaking_speed: '150'
  shaking_speed_unit: rpm
  vessel_type: Multitron Infors HT shaking incubator
  preparation_notes: >-
    S. elongatus propagated in BG-11 + 1 g/L HEPES (pH 8, 35 °C, constant light); prokaryote
    co-culture medium CoB BG-11 = BG-11 + 106 mM NaCl, 4 mM NH4Cl, 25 mM HEPPSO (pH 8.3).
    E. coli pre-grown at 37 °C; 2% sucrose added to acclimate; IPTG added to induce sucrose export.
  evidence:
  - reference: PMID:28127397
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All acclimating cultures and co-cultures were grown at 35 °C, 150 rpm, 2% CO2, in light
      (PAR = ~80 μmol with 15 W Gro-Lux Sylvania fluorescent bulbs) within a Multitron Infors HT incubator
    explanation: General co-culture conditions (temperature, shaking, CO2, light) for the cyanobacterium/heterotroph
      consortia.
  - reference: PMID:28127397
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CoB BG-11 consists of BG-11 supplemented with 106 mM NaCl, 4 mM NH4Cl and 25 mM HEPPSO,
      pH 8.3-KOH
    explanation: Defined prokaryote co-culture medium for the Synechococcus/E. coli consortium.
