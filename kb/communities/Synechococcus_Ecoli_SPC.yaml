    7942 (engineered to secrete sucrose via the cscB+ transporter) with Escherichia coli.
  assembly_strategy: Bottom-up co-culture assembled from engineered Synechococcus elongatus PCC 7942 cscB+
    and Escherichia coli in defined medium under continuous illumination.
  measurement_endpoints:
  - Interaction-level mechanistic characterization
  - Member-level abundance and persistence tracking
