ecological_interactions:
- name: Photosynthetic carbon supply to E. coli
  description: CscB+ S. elongatus fixes carbon and exports sucrose, but E. coli W and W delta-cscR grew during early
    batch coculture independently of induced sucrose export. The source infers substantial use of other photosynthates
    at that stage; their identities, including the proposed extracellular polymers, were not resolved. The earlier
    85% carbon-export capability is not a concentration or a measurement of this dyad.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
