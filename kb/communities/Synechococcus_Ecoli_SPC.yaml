discussions:
- discussion_id: spc-ecoli-assay-and-mediator-boundaries
  prompt: Which strain- and condition-specific interactions explain growth and persistence in this dyad?
  rationale: The source combines batch, continuous, density-dependent and production assays. Keep their positive
    results without treating every partner or strain as persistent for weeks to months. Cyanobacterial growth stimulation
    is observed, but metabolite return and byproduct absorption remain hypotheses. Light-associated inhibition is
    supported without identifying oxygen as the exclusive cause. For Bacillus, the canonical168 production assay
    is distinct from 3610 perturbation experiments. For E. coli, the early non-sucrose inference differs from later
    sucrose-sensitive production; for yeast, W303Clump is not parental W303. No new causal node, direction, cultivation
    protocol or strain optimization is added.
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  attaches_to:
  - ecological_interactions#Photosynthetic carbon supply to E. coli
  - ecological_interactions#E. coli growth on cyanobacterial photosynthate
  - ecological_interactions#E. coli Stimulation of Cyanobacterial Growth
  evidence:
  - reference: PMID:28127397
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: we hypothesize that these benefits arise from emergent cross-feeding of metabolite(s) and/or absorption
      of byproducts
    explanation: Source-explicit proposed mediator of cyanobacterial stimulation, not a measured transfer mechanism.
