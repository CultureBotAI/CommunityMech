  vessel_type: serum bottles with butyl rubber stoppers
  preparation_notes: 'Medium prepared under strict anaerobic conditions for thermophilic cultivation
    at 55 degrees C. Medium boiled and cooled under N2/CO2 atmosphere, dispensed anaerobically into serum
    bottles, sealed with butyl rubber stoppers, and autoclaved. Reducing agents (Na2S, cysteine, and
    titanium(III) citrate) added from sterile anaerobic stock solutions after autoclaving. Final pH
    adjusted to 7.0. Resazurin used as redox indicator. The consortium requires coaggregation between
    P. thermopropionicum and M. thermautotrophicus for efficient interspecies hydrogen transfer at thermophilic
    temperatures.

    '
