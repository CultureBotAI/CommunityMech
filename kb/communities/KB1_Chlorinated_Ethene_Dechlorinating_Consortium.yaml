id: CommunityMech:000132
name: KB-1 Chlorinated Ethene Dechlorinating Consortium
description: KB-1 is a natural anaerobic bioaugmentation consortium used for reductive dechlorination of
  chlorinated ethenes in contaminated groundwater. The culture contains Dehalococcoides-related
  organohalide-respiring bacteria that convert tetrachloroethene and trichloroethene through chlorinated
  intermediates to ethene. Nondechlorinating acetogens, including Acetobacterium and Sporomusa, support
  the community by providing cobamide-related cofactors needed by Dehalococcoides.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Bioaugment contaminated aquifers with a dechlorinating enrichment culture capable of complete
    conversion of chlorinated ethenes to ethene.
  assembly_strategy: Naturally derived enrichment culture maintained for anaerobic organohalide respiration
    and injected into contaminated groundwater after electron-donor amendment.
  perturbation_design: Field bioaugmentation after methanol and acetate amendment; laboratory tests in
    TCE- or VC-amended mineral media with vitamin and pH perturbations.
  measurement_endpoints:
  - Tetrachloroethene and trichloroethene depletion
  - Ethene production
  - Dehalococcoides detection by PCR and sequence assays
  - Vinyl chloride dechlorination at low pH
  evidence:
  - reference: PMID:12523427
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the chlorinated ethenes in the microcosms were completely converted to ethene
    explanation: Supports the bioaugmentation purpose and complete dechlorination phenotype.
environment_term:
  preferred_term: contaminated groundwater
  term:
    id: ENVO:01001004
    label: groundwater
  notes: KB-1 was applied to chlorinated-ethene contaminated groundwater at Kelly Air Force Base.
