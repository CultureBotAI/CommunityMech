ecological_interactions:
- name: Reductive Dechlorination to Ethene
  description: Dehalococcoides-related organisms in KB-1 use chlorinated ethenes as electron acceptors under
    anaerobic conditions, driving sequential reductive dechlorination of PCE and TCE to ethene in laboratory
    microcosms and field groundwater.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: Dehalococcoides spp. in KB-1
    term:
      id: NCBITaxon:61434
      label: Dehalococcoides
  metabolites:
  - preferred_term: trichloroethene
    term:
      id: CHEBI:16602
      label: trichloroethene
  - preferred_term: chloroethene
    term:
      id: CHEBI:28509
      label: chloroethene
    notes: Vinyl chloride intermediate in chlorinated-ethene dechlorination.
  - preferred_term: ethene
    term:
      id: CHEBI:18153
      label: ethene
  evidence:
  - reference: PMID:12523427
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: PCE, TCE, and cis-1,2-DCE within the PTA were all below
    explanation: Supports field depletion of chlorinated ethenes after KB-1 injection.
  - reference: PMID:12523427
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: ethene production accounted for the observed mass loss
    explanation: Supports ethene as the dechlorination end product.
- name: Acetogen Cobamide Support
  description: Acetobacterium and Sporomusa provide a supporting acetogenic guild in KB-1. Acetobacterium
    can synthesize the cobalamin lower ligand DMB, supporting Dehalococcoides dechlorination in vitamin-free
    medium and highlighting a cofactor-mediated syntrophic dependency.
  interaction_type: CROSS_FEEDING
