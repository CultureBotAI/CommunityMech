ecological_interactions:
- name: Reductive Dechlorination to Ethene
  description: KB-1 bioaugmentation produced ethene in laboratory microcosms and the Kelly Air Force Base field
    test. Field ethene accounted for chlorinated-ethene mass loss and KB-1-associated Dehalococcoides spread downgradient.
    These are consortium outcomes, not assignment of every PCE/TCE reaction to Dehalococcoides. Separate vitamin-free
    KB-1 enrichment experiments also sustained TCE-to-ethene conversion. The canonical taxa are a community subset,
    not a proven three-member inoculant or reciprocal syntrophy.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: trichloroethene
    term:
      id: CHEBI:16602
      label: trichloroethene
  - preferred_term: chloroethene
    term:
      id: CHEBI:28509
      label: chloroethene
    notes: Vinyl chloride intermediate in chlorinated-ethene dechlorination.
  - preferred_term: ethene
    term:
      id: CHEBI:18153
      label: ethene
  evidence:
  - reference: PMID:12523427
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: PCE, TCE, and cis-1,2-DCE within the PTA were all below
    explanation: Supports field depletion of chlorinated ethenes after KB-1 injection.
  - reference: PMID:12523427
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: ethene production accounted for the observed mass loss
    explanation: Supports ethene as the dechlorination end product.
  - reference: PMID:31441646
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Acetobacterium supports complete TCE dechlorination by Dehalococcoides
    explanation: Supports the separate KB-1 laboratory endpoint, not proof that this mechanism caused the earlier
      field response.
  participating_taxa:
  - preferred_term: Dehalococcoides spp. in KB-1
    term:
      id: NCBITaxon:61434
      label: Dehalococcoides
  - preferred_term: Acetobacterium spp. in KB-1
    term:
      id: NCBITaxon:33952
      label: Acetobacterium woodii
  - preferred_term: Sporomusa spp. in KB-1
    term:
      id: NCBITaxon:2375
      label: Sporomusa
- name: Acetogen Cobamide Support
  description: 'Vitamin-free KB-1 transfers sustained TCE dechlorination with increased Acetobacterium abundance
    and cobalamin, supported by a DMB-biosynthesis operon. These positive community experiments support Acetobacterium-associated
    cofactor provision. PARTIAL - donor-resolved transfer, exclusive mediation and the return benefit remain unresolved.
    The canonical Acetobacterium woodii label is not verified as the source population Acetobacterium sp. KB-1;
    its grounding remains #1526. Acid inhibition is distinct from cofactor shortage: DMB did not rescue stalled
    low-pH dechlorination, whereas pH adjustment did.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  biological_processes:
  - preferred_term: vitamin metabolic process
    term:
      id: GO:0006766
      label: vitamin metabolic process
  evidence:
  - reference: PMID:31441646
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Acetobacterium supports complete TCE dechlorination by Dehalococcoides
    explanation: Supports community cofactor support; full primary transfers, gene analysis and Table 1 strengthen
      the interpretation without establishing a traced exclusive transfer or A. woodii identity.
  - reference: PMID:31441646
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: substantial increase in cobalamin
    explanation: Supports the positive cofactor measurement, not an independently isolated mediator of the field
      outcome.
  participating_taxa:
  - preferred_term: Dehalococcoides spp. in KB-1
    term:
      id: NCBITaxon:61434
      label: Dehalococcoides
  - preferred_term: Acetobacterium spp. in KB-1
    term:
      id: NCBITaxon:33952
      label: Acetobacterium woodii
  downstream:
  - target: Reductive Dechlorination to Ethene
    description: PARTIAL - Acetobacterium-associated cofactor availability can support Dehalococcoides dechlorination
      in the vitamin-free KB-1 laboratory cultures. Community transfers, cofactor measurements and biosynthetic
      genes support this route, but do not isolate its exclusive contribution or establish its mediation of the
      separate field bioaugmentation result.
- name: Sporomusa DMB-Guided Cobalamin Support
  description: 'Controlled cocultures tested a Sporomusa sp. KB-1 isolate with Dehalococcoides strains BAV1, GT
    and FL2. DMB amendment changed donor cobamide chemistry and restored partner dechlorination and growth; without
    DMB, the phenolic cofactors did not support those requirements. FL2 still produced both VC and ethene. The explicit
    canonical participant is the KB-1-derived donor only: these external recipient strains are not established as
    the record''s KB-1 Dehalococcoides population. This positive conditional partner-support result is not demonstrated
    mediation of the field endpoint.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  - preferred_term: 5,6-dimethylbenzimidazole
    term:
      id: CHEBI:15890
      label: 5,6-dimethylbenzimidazole
  biological_processes:
  - preferred_term: vitamin metabolic process
    term:
      id: GO:0006766
      label: vitamin metabolic process
  evidence:
  - reference: PMID:31441646
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the lower ligand of cobalamin, and Sporomusa are dominant acetogens
    explanation: Supports Sporomusa presence in KB-1, not identity of the external Dehalococcoides recipients in
      the separate coculture experiment.
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sporomusa ovata and Sporomusa sp. strain KB-1, as Dehalococcoides partner populations
    explanation: Identifies the KB-1-derived donor isolate in the controlled partner experiment, not an intact KB-1
      consortium assay.
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dehalococcoides dechlorination activity and growth occurred in M. barkeri and Sporomusa sp. co-cultures
      amended with 10 µM 5',6'-dimethylbenzimidazole
    explanation: Preserves positive DMB-conditional dechlorination and growth. The full primary text distinguishes
      BAV1, GT and FL2 and their different final products; it does not establish a field-site mechanism.
  participating_taxa:
  - preferred_term: Sporomusa spp. in KB-1
    term:
      id: NCBITaxon:2375
      label: Sporomusa
