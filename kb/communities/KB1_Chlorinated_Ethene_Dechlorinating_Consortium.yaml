environmental_factors:
- name: Anaerobic contaminated groundwater
  value: Reducing conditions after methanol and acetate amendment
  description: The Kelly Air Force Base field test amended groundwater with methanol and acetate before KB-1
    injection to establish reducing conditions for reductive dechlorination.
  evidence:
  - reference: PMID:12523427
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: amended with methanol and acetate to establish reducing conditions
    explanation: Supports anaerobic reducing conditions as a field environmental factor.
- name: pH limit for vinyl chloride dechlorination
  value: Sustained VC-to-ethene dechlorination at pH 5.5; inhibition below pH 5.0
  description: Low pH affects vinyl chloride reductase activity and dechlorination performance in KB-1.
  evidence:
  - reference: PMID:31441646
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: VC to ethene was achieved at pH as low as 5.5
    explanation: Supports the low-pH operating limit for KB-1 vinyl chloride dechlorination.
