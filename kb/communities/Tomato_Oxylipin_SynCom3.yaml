discussions:
- discussion_id: tomato_causal_scope_batch121
  prompt: Which microbial contributions and individual divinyl ethers mediate SynCom3 protection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#SynCom3-associated biofilm and host defense
  - ecological_interactions#SynCom3-induced leaf oxylipin responses
  - ecological_interactions#Divinyl Ether-Dependent Botrytis Protection
  rationale: The abstract supports complementary functions, host oxylipin activation and a real biosynthesis perturbation,
    not merely correlation. Detailed primary methods would resolve the inhibition target, individual-compound necessity
    and biofilm mediation. Reciprocal bacterial benefit and cross-feeding are not established. Preserve both existing
    directions and positive protection without inventing a new mechanism.
  evidence:
  - reference: PMID:37549573
    snippet: the inhibited biosynthesis of antimicrobial divinyl ethers, including colneleic and colnelenic acid,
      fully abolished the community-induced plant disease resistance
