ecological_interactions:
- name: SynCom3-associated biofilm and host defense
  description: The three-genus tomato-root inoculum combines pathogen-inducible Asticcacaulis with stably colonizing
    Arachidicoccus and Phenylobacterium. The abstract attributes host-defense triggering to the inducible member
    and biofilm promotion to the stable colonizers, with protection similar to the 38-member precursor. These positive
    complementary phenotypes do not measure reciprocal bacterial fitness or metabolite exchange. Exact strain identities
    and selective biofilm mediation are not resolved by the inspected abstract.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: SynCom3-induced leaf oxylipin responses
    description: 'SynCom3 treatment intensified oxylipin responses in infected tomato leaves. PARTIAL for biofilm
      formation as the mediator: the abstract links complementary community functions to protection but does not
      isolate biofilm formation as the unique cause of leaf pathway activation.'
  evidence:
  - reference: PMID:37549573
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the phytopathogen-inducible species triggering plant defense responses and the stably-colonizing species
      promoting biofilm formation
    explanation: Abstract-level attribution of complementary functions; detailed biofilm assay context was not available.
  - reference: PMID:37549573
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The simplified community exhibited similar protective effects as the 38-species community
    explanation: Preserves the positive protection comparison while distinguishing the final inoculum from its precursor.
- name: SynCom3-induced leaf oxylipin responses
  description: The simplified community intensified oxylipin-pathway activation in Botrytis-infected tomato leaves.
    This is a host response to the bacterial treatment, not microbial mutualism or evidence that the bacteria themselves
    synthesize the listed divinyl ethers. The downstream biosynthesis perturbation provides stronger mechanistic
    evidence than association alone.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: oxylipin
    term:
      id: CHEBI:61121
      label: oxylipin
  - preferred_term: colneleic acid
    term:
      id: CHEBI:60956
      label: colneleic acid
  - preferred_term: colnelenic acid
    term:
      id: CHEBI:60959
      label: colnelenic acid
  downstream:
  - target: Divinyl Ether-Dependent Botrytis Protection
    description: 'The host oxylipin branch supplies divinyl ethers implicated in protection: inhibiting their biosynthesis
      abolished the community-induced resistance, while SlLOX5/SlDES1 overexpression with higher divinyl-ether levels
      increased resistance. Retain this pathway-level perturbation evidence without claiming separate necessity
      of each compound or bacterial-to-plant transfer.'
  evidence:
  - reference: PMID:37549573
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the activation of oxylipin pathways in the phytopathogen-infected leaves was significantly intensified
      by the simplified community
    explanation: Supports oxylipin-pathway activation as the plant defense mechanism intensified by the simplified
      tomato rhizosphere community.
- name: Divinyl Ether-Dependent Botrytis Protection
  description: Inhibiting divinyl-ether biosynthesis abolished SynCom-induced tomato resistance to Botrytis cinerea.
    Conversely, SlLOX5/SlDES1-overexpressing plants with higher divinyl-ether levels had stronger resistance than
    wild type. Preserve this positive pathway-level evidence for colneleic/colnelenic-acid-associated defense. The
    abstract does not specify the inhibition method or establish that each named compound is independently indispensable,
    sufficient alone, or transferred from bacteria.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: colneleic acid
    term:
      id: CHEBI:60956
      label: colneleic acid
  - preferred_term: colnelenic acid
    term:
      id: CHEBI:60959
      label: colnelenic acid
  evidence:
  - reference: PMID:37549573
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the inhibited biosynthesis of antimicrobial divinyl ethers, including colneleic and colnelenic acid,
      fully abolished the community-induced plant disease resistance
    explanation: Supports dependence on the perturbed biosynthetic branch, not separate necessity of each listed
      compound.
  - reference: PMID:37549573
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: transgenic plants overexpressing SlLOX5 and SlDES1, with higher levels of divinyl ethers, displayed
      stronger resistance against B. cinerea compared to wild-type plants
    explanation: Preserves the complementary positive host perturbation reported in the abstract.
environmental_factors:
