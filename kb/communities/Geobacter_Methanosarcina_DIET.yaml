      label: Geobacter metallireducens
  biological_processes:
  - preferred_term: protein secretion by the type VI secretion system
    term:
      id: GO:0033103
      label: protein secretion by the type VI secretion system
  downstream:
  - target: Ethanol Oxidation and Direct Electron Transfer
    description: NEGATIVE edge - the wild-type T6SS-expressing state of G. metallireducens
      delays establishment of the DIET partnership (>30 d lag vs very little lag for the
      Hcp-deficient mutant). Demonstrated by knockout phenotype in this exact coculture, but
      the mutant is pleiotropic, so the causal attribution to the T6SS specifically is
      HYPOTHESIZED rather than proven.
  evidence:
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: there was a lag period of more than 30 d in co-cultures initiated with wild-type
      G. metallireducens
    explanation: Wild-type baseline for the delay, measured in the G. metallireducens-M. barkeri
      ethanol coculture that this record describes.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, there was very little lag in co-cultures initiated with the Hcp-deficient
      G. metallireducens strain
    explanation: Knockout arm of the perturbation - removing the T6SS structural protein Hcp
      largely removes the lag, which is the basis for the negative causal edge.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The hcp-deficient mutant also established DIET quicker with Methanosarcina barkeri
    explanation: Confirms the phenotype specifically for the M. barkeri partner of this community.
  - reference: PMID:37650614
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: the mutant also reduced Fe(III) oxide faster than the wild-type strain, a phenotype
      not expected from the loss of the T6SS
    explanation: Records the pleiotropy confounder - the reason this edge is curated as
      T6SS-associated rather than T6SS-caused.
