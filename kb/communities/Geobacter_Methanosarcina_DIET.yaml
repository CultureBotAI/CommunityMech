    term:
      id: CHEBI:16183
      label: methane
    concentration: End product of methanogenesis
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
    concentration: Electron acceptor for methanogenesis
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:24837373
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: M. barkeri is the second methanogen found to accept electrons via DIET and the first methanogen known
      to be capable of using either H2 or electrons derived from DIET for CO2 reduction
    explanation: Supports the reported DIET capability and historical dual H2/DIET context, not present-day uniqueness,
      all-methane CO2 attribution or DIET-only growth.
- name: Hcp-Associated Delay of DIET Establishment
  description: In the G. metallireducens-M. barkeri comparison, wild-type Geobacter cocultures had a methane-production
    lag exceeding 30 days, while hcp-deficient cocultures had little lag. This is a measured genotype-associated
    establishment phenotype, not niche partitioning or demonstrated toxin delivery. Discovery RNA-seq and GAC/AQDS
    comparisons used the G. sulfurreducens partner, not M. barkeri. Altered extracellular-electron-transfer transcripts
    and the mutant Fe(III)-oxide phenotype expose pleiotropy. T6SS-specific inhibition of the archaeon remains HYPOTHESIZED;
    protein secretion or killing was not measured by the lag comparison.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Geobacter metallireducens
    term:
      id: NCBITaxon:28232
      label: Geobacter metallireducens
  - preferred_term: Methanosarcina barkeri
    term:
      id: NCBITaxon:2208
      label: Methanosarcina barkeri
  downstream:
  - target: Ethanol Oxidation and Direct Electron Transfer
    description: 'HYPOTHESIZED NEGATIVE: The wild-type Hcp/T6SS-associated state may delay DIET establishment relative
      to the hcp deletion strain. The exact coculture demonstrates a lag difference, but altered electron-transfer
      physiology prevents assigning the delay selectively to T6SS antagonism. The sign refers to establishment timing,
      not proven archaeal killing.'
  evidence:
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: there was a lag period of more than 30 d in co-cultures initiated with wild-type G. metallireducens
    explanation: Wild-type baseline for the delay, measured in the G. metallireducens-M. barkeri ethanol coculture
      that this record describes.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, there was very little lag in co-cultures initiated with the Hcp-deficient G. metallireducens
      strain
    explanation: Supports the hcp-deletion lag phenotype in the exact pair. Deletion changes more than the presence
      of T6SS machinery, so the phenotype does not isolate a secretion-specific mechanism.
  - reference: PMID:37650614
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The hcp-deficient mutant also established DIET quicker with Methanosarcina barkeri
    explanation: Confirms the phenotype specifically for the M. barkeri partner of this community.
  - reference: PMID:37650614
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: the mutant also reduced Fe(III) oxide faster than the wild-type strain, a phenotype not expected from
      the loss of the T6SS
    explanation: Records the pleiotropy confounder - the reason this edge is curated as T6SS-associated rather than
      T6SS-caused.
