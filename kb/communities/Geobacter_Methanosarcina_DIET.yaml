ecological_interactions:
- name: Ethanol Oxidation and Direct Electron Transfer
  description: G. metallireducens oxidizes ethanol to acetate and supplies electrons to M. barkeri through DIET.
    Pilin-deficient cocultures did not establish ethanol-to-methane conversion without amendment, whereas granular
    activated carbon enabled the tested mutant cocultures. Thus the pili-associated requirement is condition-dependent,
    not universal in conductive-material-amended cultures. The methanogen entry proteins remain unresolved; the
    donor reaction should not be described as direct ethanol-carbon oxidation to CO2.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Geobacter metallireducens
    term:
      id: NCBITaxon:28232
      label: Geobacter metallireducens
  target_taxon:
    preferred_term: Methanosarcina barkeri
    term:
      id: NCBITaxon:2208
      label: Methanosarcina barkeri
