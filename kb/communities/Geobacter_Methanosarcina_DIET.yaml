ecological_interactions:
- name: Ethanol Oxidation and Direct Electron Transfer
  description: 'Geobacter metallireducens oxidizes ethanol to acetate and CO2, transferring
    electrons directly to Methanosarcina barkeri via electrically conductive pili
    (e-pili). This direct interspecies electron transfer (DIET) bypasses the need
    for diffusible electron carriers like H2 or formate. The pili serve as biological
    electrical conduits for long-range electron transfer between cells. Pilin-deficient
    G. metallireducens mutants cannot initiate cocultures, demonstrating the essential
    role of pili in DIET. However, conductive materials like granular activated carbon
    can substitute for pili, showing that DIET can be mediated by abiotic conductors.

    '
