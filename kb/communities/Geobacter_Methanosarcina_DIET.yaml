    term:
      id: GO:0006068
      label: ethanol catabolic process
  downstream:
  - target: DIET-Linked Carbon Dioxide Reduction to Methane
    description: DIET delivers ethanol-derived electrons to M. barkeri for CO2 reduction. This electron-supply arrow
      supports the CO2 route, not an attribution of all bulk methane to that route; acetate conversion is a separate
      missing branch.
  evidence:
  - reference: PMID:24837373
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cocultures formed aggregates that shared electrons via DIET during the stoichiometric conversion of
      ethanol to methane
    explanation: Demonstrates that the G. metallireducens-M. barkeri coculture coupled ethanol conversion to aggregate-mediated
      DIET.
  - reference: PMID:24837373
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cocultures could not be initiated with a pilin-deficient G. metallireducens strain, suggesting that
      long-range electron transfer along pili was important for DIET
    explanation: Supports the pilin-deficient initiation phenotype under the tested unamended conditions, not a
      universal requirement in GAC-amended cocultures or identification of the methanogen entry machinery.
  - reference: PMID:24837373
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Amendments of granular activated carbon permitted the pilin-deficient G. metallireducens isolates to
      share electrons with M. barkeri
    explanation: Supports conductive-material rescue of the tested pilin-deficient cocultures; it does not prove
      direct physical contact is required under this amendment.
- name: DIET-Linked Carbon Dioxide Reduction to Methane
  description: M. barkeri accepts DIET electrons for CO2 reduction to methane. Bulk ethanol-to-methane conversion
    also includes acetate metabolism; its stoichiometry is not an isotope measurement assigning every methane molecule
    to a route. The 2014 first-report wording is historical, not timeless uniqueness. Whether DIET-driven CO2 reduction
    alone supports methanogen growth, without acetate metabolism, was proposed for future testing rather than established
    here.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Geobacter metallireducens
    term:
      id: NCBITaxon:28232
      label: Geobacter metallireducens
  - preferred_term: Methanosarcina barkeri
    term:
      id: NCBITaxon:2208
      label: Methanosarcina barkeri
  metabolites:
