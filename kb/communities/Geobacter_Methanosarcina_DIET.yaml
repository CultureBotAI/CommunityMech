- name: T6SS-Associated Delay of DIET Establishment
  description: 'Geobacter metallireducens expresses a type VI secretion system (T6SS) during
    the initiation of DIET cocultures, and this is associated with a long delay before the
    partnership becomes productive. Cocultures started with wild-type G. metallireducens showed
    a lag of more than 30 days before methane production, whereas cocultures started with an
    Hcp-deficient (T6SS structural protein) mutant had very little lag and established DIET
    with M. barkeri faster. The sign of this edge is NEGATIVE: the wild-type T6SS-expressing
    state suppresses the rate at which the DIET partnership is established. The molecular
    attribution is confounded and must not be curated as demonstrated antagonism toward the
    archaeon - the same mutant also reduced Fe(III) oxide faster than wild type, a phenotype
    not expected from loss of the T6SS, and the authors state that the effect of T6SSs on
    archaeal cells still requires study. Encoded as a delay of establishment, not as
    predation, killing, or toxin delivery to M. barkeri.

    '
  interaction_type: COMPETITION
  source_taxon:
    preferred_term: Geobacter metallireducens
    term:
