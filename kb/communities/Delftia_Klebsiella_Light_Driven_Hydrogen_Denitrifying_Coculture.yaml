id: CommunityMech:000481
name: Delftia acidovorans YP-3 and Klebsiella oxytoca DX-3 Light-Driven Hydrogen-Producing Denitrifying Co-Culture
description: Catalyst-free, light-driven defined bacterial co-culture pairing the light-responsive electroactive bio-photosensitizer
  bacterium Delftia acidovorans YP-3 with hydrogen-producing and nitrate-reducing Klebsiella oxytoca DX-3 for simultaneous
  wastewater nitrogen removal and biohydrogen recovery. Through direct contact and soluble redox-active mediators that lower
  electron-transfer resistance and stimulate NADH metabolism, the YP-3/DX-3 co-culture generates 345.52 mL/L H2 in 48 h and
  achieves 90.25% nitrate removal with minimal nitrite accumulation in synthetic swine wastewater.
