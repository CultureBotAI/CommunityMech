id: CommunityMech:000460
name: Panax Bacillus-Serratia Root-Rot Biocontrol SynCom
description: >-
  A two-member Bacillus subtilis/Serratia marcescens synthetic microbial
  consortium, BS, pairing the antagonistic strains XY-6 and XB-7, isolated from
  root-rot-affected Panax notoginseng plantation soil, for Fusarium root-rot
  biocontrol. Deng et al. 2026 selected Bacillus subtilis XY-6 as the core
  strain after antagonistic screening, combined compatible strains with XY-6 in
  1:1 volume ratios, and found that the XY-6/XB-7 consortium improved
  greenhouse disease suppression beyond the single strains, directly inhibited
  Fusarium solani LP2 through cell-free filtrates, activated host antioxidant
  defenses, and reshaped the P. notoginseng rhizosphere mycobiome.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Assemble a two-strain Bacillus subtilis/Serratia marcescens SynCom for
    sustainable biological control of Fusarium-induced root rot in the medicinal
    crop Panax notoginseng.
  assembly_strategy: >-
    Select Bacillus subtilis XY-6 as the core biocontrol isolate, screen
    pairwise compatibility with other antagonistic isolates, and combine XY-6
    with the compatible Serratia marcescens strain XB-7 at a 1:1 volume ratio
    after resuspension in sterile water.
  perturbation_design: >-
    Compare B. subtilis XY-6, S. marcescens XB-7, Hafnia alvei XA-2, and their
    two-strain or three-strain SynComs against a water control in greenhouse
    Panax notoginseng pots using continuous-cropping soil, Fusarium disease
    pressure, plant defense assays, cell-free filtrate antagonism, and endpoint
    rhizosphere amplicon profiling.
  measurement_endpoints:
  - Fusarium root-rot disease suppression
  - Panax notoginseng root fresh and dry weights
  - root malondialdehyde content
  - peroxidase and superoxide dismutase activities
  - Fusarium solani LP2 mycelial growth under cell-free filtrates
  - rhizosphere bacterial and fungal community composition
  - rhizosphere fungal co-occurrence network metrics
  notes: >-
    The study reports genus-level Bacillus and Serratia enrichment after BS
    treatment and interprets it as establishment of the inoculants; strain-
    resolved colonization of XY-6 and XB-7 was not directly quantified.
  evidence:
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Bacillus subtilis-Serratia marcescens synthetic microbial consortium (BS)
      comprising antagonistic strains XY-6 and XB-7.
    explanation: >-
      Identifies the BS SynCom as the engineered B. subtilis/S. marcescens
      two-strain consortium curated by this record.
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compatible strains were combined with XY-6 at a 1:1 (v/v) ratio to form
      SynComs after resuspension in sterile water
    explanation: >-
      Supports the function-guided, equal-volume assembly strategy used to form
      candidate XY-6-centered SynComs.
