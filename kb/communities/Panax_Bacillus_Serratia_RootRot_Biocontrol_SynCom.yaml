ecological_interactions:
- name: XY-6/XB-7 Fusarium Root-Rot Suppression
  description: >-
    In greenhouse Panax notoginseng assays, the equal-volume BS consortium of
    Bacillus subtilis XY-6 and Serratia marcescens XB-7 suppressed
    Fusarium-induced root rot more effectively than the individual bacterial
    strains.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  evidence:
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      BS application significantly enhanced disease suppression (56%) compared
      with single-strain treatments
    explanation: >-
      Supports the greenhouse disease-suppression phenotype of the two-member BS
      consortium.
- name: BS Cell-Free Filtrate Antagonism
  description: >-
    Sterile filtrates prepared from the two member cultures and mixed 1:1 had
    stronger direct inhibitory effects on Fusarium solani LP2 mycelial growth
    than either strain filtrate alone.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cell-free filtrates derived from the BS consortium exhibited the strongest
      inhibitory effects on F. solani LP2 mycelial growth
    explanation: >-
      Supports enhanced in vitro Fusarium antagonism by the combined BS filtrate.
- name: BS Host-Systemic Resistance Activation
  description: >-
    BS treatment mitigated oxidative stress in P. notoginseng roots and
    increased peroxidase and superoxide dismutase activities under Fusarium
    challenge and continuous-cropping soil conditions.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  evidence:
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      BS markedly enhanced the activities of key antioxidant enzymes, with
      peroxidase (POD) activity increasing
    explanation: >-
      Supports host defense-enzyme activation after BS application in the
      P. notoginseng assays.
- name: BS Rhizosphere Fungal-Community Remodeling
  description: >-
    Endpoint rhizosphere amplicon profiling linked BS treatment to stronger
    fungal-community restructuring than the individual strains, including higher
    fungal richness, Mortierellomycota enrichment, Ascomycota reduction, and a
    more connected fungal co-occurrence network.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in symbiotic interaction
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  evidence:
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      The microbial community structure in the rhizosphere underwent substantial
      modifications following inoculation
    explanation: >-
      Supports endpoint rhizosphere microbial restructuring after SynCom
      application.
  - reference: PMID:41872736
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Analysis of co-occurrence networks demonstrated that the BS consortium
      specifically improved the structural robustness and interconnectedness of
      fungal community networks
    explanation: >-
      Supports the BS-associated increase in rhizosphere fungal network
      complexity.
