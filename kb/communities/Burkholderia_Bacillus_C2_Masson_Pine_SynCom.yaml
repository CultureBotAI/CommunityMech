id: CommunityMech:000501
name: Burkholderia-Bacillus C2 Masson Pine SynCom
description: A five-strain C2 synthetic plant growth-promoting rhizobacterial community assembled from Trichoderma koningiopsis-conditioned
  Pinus massoniana rhizosphere isolates. The community combines Burkholderia cepacia RW1, Bacillus siamensis RW5, Bacillus
  amyloliquefaciens RW6, Bacillus velezensis RW7, and Bacillus vallismortis RW8 and was tested alongside the two-member HT
  SynCom (CommunityMech:000347) against Fusarium oxysporum damping-off in Masson pine seedlings. Relative to the pathogen
  challenge control, C2 reduced disease incidence by 50%, increased seedling height by 10.18%, enhanced protective enzyme
  activity, alleviated membrane damage, and activated the resistance genes PR1, FLS2, and CAT1.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Build a five-strain PGPR SynCom (C2) from Trichoderma koningiopsis-conditioned Masson pine rhizosphere isolates
    and test whether the community suppresses Fusarium oxysporum damping-off while promoting Pinus massoniana seedling growth.
  assembly_strategy: Profile the bacterial community enriched by T. koningiopsis in the Masson pine rhizosphere, isolate 153
    PGPR strains from the T. koningiopsis-inoculated treatment, screen eight antagonistic isolates against F. oxysporum, and
    combine Burkholderia cepacia RW1, Bacillus siamensis RW5, Bacillus amyloliquefaciens RW6, Bacillus velezensis RW7, and
    Bacillus vallismortis RW8 as the five-member C2 SynCom.
  perturbation_design: Compare individual inhibitory isolates and synthetic communities (C1, C2, HT, 2K) for in vitro F. oxysporum
    inhibition, then challenge Masson pine seedlings with F. oxysporum with or without C2 SynCom inoculation.
  measurement_endpoints:
  - F. oxysporum inhibitory effect
  - Masson pine damping-off disease incidence
  - Masson pine seedling height
  - Protective enzyme activity and membrane-damage physiology
  - Plant hormone and MAPK signaling gene expression (PR1, FLS2, CAT1)
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Synthetic PGPR communities were constructed from isolated strains to validate their effects on disease suppression
      and growth promotion.
    explanation: Supports the isolated-strain PGPR SynCom construction strategy.
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C2 = RW5, RW1, RW6, RW7, RW8
    explanation: Figure 4 defines C2 as the five-strain SynCom containing RW5, RW1, RW6, RW7, and RW8.
