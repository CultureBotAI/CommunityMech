ecological_interactions:
- name: C2 SynCom Suppression of Fusarium oxysporum
  description: The five-member C2 SynCom (Burkholderia cepacia RW1, Bacillus siamensis RW5, Bacillus amyloliquefaciens RW6,
    Bacillus velezensis RW7, and Bacillus vallismortis RW8) was among four mixtures inhibiting Fusarium oxysporum more strongly
    than individual isolates in vitro (single-strain inhibition ranged from 33.81% to 59.52%). C2 is distinct from the reduced
    two-member HT mixture (RW5, RW8).
  scope: COMMUNITY_LEVEL
