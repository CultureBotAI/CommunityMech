ecological_interactions:
- name: Ninety-Two-Percent Pleuromutilin Degradation
  description: The defined five-strain artificial consortium achieved reported pleuromutilin degradation of 91.97%.
    Preserve this positive community-level endpoint without asserting product-removal cooperation, partner-specific
    flux, complete mineralization or a superiority comparison not stated in the accessible abstract. SYNTROPHY does
    not require obligacy, but a measured community degradation endpoint is not itself the product-removal mechanism.
  scope: COMMUNITY_LEVEL
