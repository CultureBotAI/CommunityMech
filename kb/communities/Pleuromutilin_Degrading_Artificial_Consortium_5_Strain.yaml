ecological_interactions:
- name: Cooperative pleuromutilin biodegradation by the artificial consortium
  description: The five-strain artificial consortium collectively degrades the antibiotic
    pleuromutilin, reaching a degradation rate of 91.97%; potential degradation products and
    metabolic pathways were proposed. In the parent natural community, functional specialization
    across core taxa was identified under pleuromutilin stress.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
