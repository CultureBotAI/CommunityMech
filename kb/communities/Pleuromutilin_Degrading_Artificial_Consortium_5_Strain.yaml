ecological_interactions:
- name: En4 Gradient Enrichment and Domestication
  description: >
    The natural En4 consortium was developed for efficient pleuromutilin
    degradation by gradient enrichment and domestication under pleuromutilin
    selection.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  metabolites:
  - preferred_term: pleuromutilin
    term:
      id: CHEBI:8269
      label: Pleuromutilin
  downstream:
  - target: Pleuromutilin-Stress Core Specialization
    description: >
      Gradient enrichment and domestication imposed pleuromutilin stress on
      En4, enabling community analysis of stress-associated diversity loss and
      core-taxon specialization.
  - target: Fourteen-Degrader Bacterial Isolation
    description: >
      The domesticated natural En4 consortium was the source community for
      isolating pleuromutilin-degrading bacteria.
  evidence:
  - reference: PMID:42133144
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      A natural microbial consortium (En4) was developed in this study to
      achieve efficient degradation of pleuromutilin through gradient
      enrichment and domestication
    explanation: >
      Supports gradient enrichment and domestication of the natural En4
      pleuromutilin-degrading consortium.
- name: Pleuromutilin-Stress Core Specialization
  description: >
    Pleuromutilin stress reduced diversity in the natural consortium and
    selected specialized core taxa, chiefly within Proteobacteria and including
    pollutant-degrading genera enriched during the enrichment.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  metabolites:
  - preferred_term: pleuromutilin
    term:
      id: CHEBI:8269
      label: Pleuromutilin
  downstream:
  - target: Five-Strain Artificial Consortium Construction
    description: >
      Functional specialization in the pleuromutilin-selected parent
      consortium established the source pool that was reduced to the
      five-strain artificial degradation consortium.
  evidence:
  - reference: PMID:42133144
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      pleuromutilin stress significantly reduced microbial diversity, and core
      communities with functional specialization were identified across
      multiple taxa
    explanation: >
      Supports pleuromutilin-associated diversity loss and functional
      specialization across core taxa in the natural consortium.
  - reference: PMID:42133144
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      bacterial genera that have the potential to degrade pollutants, such as
      Allorhizobium-Neorhizobium-Pararhizobium-Rhizobium and Cupriavidus were
      significantly enriched
    explanation: >
      Supports enrichment of pollutant-degrading bacteria under pleuromutilin
      stress.
