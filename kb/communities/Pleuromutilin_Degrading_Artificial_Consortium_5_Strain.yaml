discussions:
- discussion_id: pleuromutilin-parent-versus-defined-community
  prompt: Which compatibility and degradation mechanisms belong to the defined five-strain community?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  rationale: 'Natural En4 enrichment showed reduced diversity and enriched pollutant-associated genera; preserve
    those positives as parent-community context, not interactions among the five selected strains. Assembly/isolation
    workflow remains in the record description. Public Table S1 lists bacterial and fungal isolates and identifies
    W12, rather than same-species W10, as the selected Pseudomonas songnenensis in Table S2. Table S2 reports no
    inhibition zones, not cross-feeding or long-term stability. Table S3 supports differential metabolomics, not
    compound provenance or partner flux. Main text remains inaccessible; source DOCX tables were read by OOXML,
    not rendered pages. Missing compatibility/pathway topology remains #1715 pending a reviewed, explicitly authorized
    Edison report; no new structure is added. Non-graph isolate and strain identity remains #1716. The local SYNTROPHY
    definition does not assert obligacy. The retained outcome and proposed-products nodes remain untyped because
    they do not themselves establish product-removal feedback, not because obligatory dependence is unproven.'
