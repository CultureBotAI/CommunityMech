    evidence_source: IN_VITRO
    snippet: 'an efficient artificial microbial consortium comprising five strains: Stenotrophomonas
      pavanii, Stenotrophomonas maltophilia, Lysinibacillus sphaericus, Lysinibacillus mangiferihumi,
      and Pseudomonas songnenensis, was constructed, achieving a degradation rate of 91.97%.'
