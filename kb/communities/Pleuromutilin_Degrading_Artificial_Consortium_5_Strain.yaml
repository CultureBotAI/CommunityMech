- name: Proposed Artificial-Consortium Degradation Products and Pathways
  description: 'HYPOTHESIZED: metabolomic profiling of the artificial five-strain consortium motivated proposed
    pleuromutilin degradation products and pathways. Public Supplement Table S3 compares pleuromutilin and glucose
    conditions by untargeted metabolomics. Differential abundance and database spectral assignments do not alone
    establish that every metabolite derives from pleuromutilin or identify a strain-resolved transfer route.'
  scope: COMMUNITY_LEVEL
