id: CommunityMech:000300
name: Pleuromutilin-degrading Artificial Consortium (5-strain)
description: A defined five-strain artificial microbial consortium constructed to degrade the
  antibiotic pleuromutilin, assembled from bacteria isolated out of a natural consortium (En4) that
  was itself developed by gradient enrichment and domestication under pleuromutilin stress. The
  consortium comprises Stenotrophomonas pavanii, Stenotrophomonas maltophilia, Lysinibacillus
  sphaericus, Lysinibacillus mangiferihumi, and Pseudomonas songnenensis, and achieves a
  pleuromutilin degradation rate of 91.97%. In the parent natural community, pleuromutilin stress
  reduced microbial diversity and selected core taxa with functional specialization (notably
  Proteobacteria, and enriched pollutant-degrading genera such as
  Allorhizobium-Neorhizobium-Pararhizobium-Rhizobium and Cupriavidus), and potential degradation
  products and metabolic pathways were proposed for the artificial consortium.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
environment_term:
  preferred_term: pleuromutilin-contaminated environment (enrichment-derived)
  term:
    id: ENVO:01000313
    label: anthropogenic environment
  notes: The abstract does not state a specific source habitat (soil/water); the consortium was
    enrichment-derived under pleuromutilin (an anthropogenic antibiotic) stress and is intended for
    remediation of pleuromutilin-contaminated environments, so it is grounded to the general
    ENVO "anthropogenic environment".
