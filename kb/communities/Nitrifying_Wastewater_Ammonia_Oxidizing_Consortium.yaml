id: CommunityMech:000433
name: Nitrifying Wastewater Ammonia-Oxidizing Consortium
description: >
  A top-down, model aerobic ammonia-oxidizing consortium for wastewater
  treatment risk and performance assessment. Long-read metagenomics recovered
  64 high-quality bacterial MAGs from the starting material, which was dominated
  by an unclassified Nitrosospira MAG carrying expected ammonia-oxidation
  capabilities and also contained a lower-abundance Nitrobacter MAG and
  Legionella MAGs monitored during virulence-gene risk assessment. The
  consortium was grown in synthetic pond water under an aerobic/anoxic redox
  gradient to test nitrogen cycling, community composition, and activity by
  metagenomics, metatranscriptomics, and nitrogen chemistry.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Evaluate a top-down cultivated nitrifying consortium for ammonia removal in
    wastewater-treatment settings and use multi-omics to assess functional
    performance and biosafety risks across wastewater-like redox conditions.
  assembly_strategy: >
    Use a freshly received batch of a model nitrifying consortium in development
    for wastewater treatment as 10% inoculum into synthetic pond water serum
    bottle cultures.
  perturbation_design: >
    Grow parallel aerobic and anoxic treatments, with anoxic nitrate-reduction,
    iron-reduction, and sulfate-reduction variants, to expose the consortium to
    a redox gradient representative of wastewater treatment plants.
  measurement_endpoints:
  - ammonia, nitrite, and nitrate chemistry over the incubation
  - PacBio long-read metagenome-assembled genomes from the starting material
  - short-read metagenomics of enrichment cultures
  - metatranscriptomics of nitrogen cycling pathways
  - virulence factor and antibiotic resistance gene screens
  evidence:
  - &model_consortium
    reference: PMID:41457319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: model aerobic ammonia-oxidizing consortium under conditions representative of wastewater
    explanation: >
      Establishes that the source studied an aerobic ammonia-oxidizing
      consortium in a wastewater-treatment context.
  - &redox_gradient
    reference: PMID:41457319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: consortium was grown along a redox gradient typical of wastewater
    explanation: >
      Supports the aerobic/anoxic redox-gradient design used to evaluate
      consortium activity and off-target nitrogen reactions.
