ecological_interactions:
- name: Nitrifier Guild Metabolic Handoff
  description: >
    The consortium contains ammonia-oxidizing and nitrite-oxidizing guilds
    whose sequential nitrogen transformations were monitored under aerobic and
    anoxic redox conditions; Nitrosospira represented the dominant AOB MAG and
    Nitrobacter represented an NOB MAG in the starting material.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
