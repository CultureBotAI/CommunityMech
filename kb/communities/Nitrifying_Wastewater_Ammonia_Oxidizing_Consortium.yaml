      wastewater consortium.
growth_media:
- name: synthetic pond water aerobic nitrifying culture
  atmosphere: AEROBIC
  preparation_notes: >
    Aerobic cultures were prepared in 150 mL serum bottles containing 90 mL of
    synthetic pond water medium plus 10% live consortium inoculum and were
    purged daily with sterile atmospheric air on working days.
  evidence:
  - &synthetic_pond_water
    reference: PMID:41457319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biotic samples were inoculated at 10% (vol/vol) using biomass from a freshly received batch of the consortium
    explanation: >
      Supports the inoculation of synthetic pond water cultures from a fresh
      consortium batch.
  - reference: PMID:41457319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aerobic cultures were filled with basal medium stored on the bench and purged daily
    explanation: >
      Supports aerobic cultivation using the basal synthetic pond water medium.
- name: synthetic pond water anoxic redox-gradient cultures
  atmosphere: ANAEROBIC
  preparation_notes: >
    Anoxic cultures used N2-bubbled synthetic pond water and were dispensed in
    a 97% N2/3% H2 glovebox; nitrate-reduction bottles used the nitrate already
    in the medium, while iron- and sulfate-reduction bottles were amended to
    1 mM Fe3+ or SO42-, respectively.
  evidence:
  - *synthetic_pond_water
  - reference: PMID:41457319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      The medium used for anaerobic treatments was bubbled under a sterile flow
      of N2 for 30 min
    explanation: >
      Supports N2-prepared synthetic pond water cultivation for the anoxic
      redox-gradient arms.
