ecological_interactions:
- name: Four-substrate rumen consortium specialization
  description: Serial 72 h enrichment on alfalfa, barley straw, CMC, or xylan selected different late bacterial profiles from
    the same pooled rumen-fluid inoculum, with the CMC and xylan enrichments producing the strongest Bray-Curtis separation
    from the alfalfa and barley-straw lines.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Xylan chain-elongation-associated phenotype
    description: The xylan enrichment diverged toward a distinct late community that accumulated caproate.
  evidence:
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Xylan- and CMC-enriched consortia exhibited the greatest compositional shifts, forming discrete clusters that
      were distinct from BS and alfalfa communities.
    explanation: Supports substrate-dependent compositional divergence during enrichment.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Across generations, total VFA concentrations declined on all substrates, with the sharpest decreases observed
      for xylan and BS.
    explanation: Supports substrate- and generation-dependent fermentation outcomes.
- name: CMC Bacteroides core selection
  description: The carboxymethyl-cellulose line reproducibly selected a Bacteroides-dominated core with Sporanaerobacter,
    Streptococcus, and Sphaerochaeta across G3, G6, and G10. The record treats this as substrate enrichment of a CMC-adapted
    guild, not as a resolved pairwise lactate-propionate exchange.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: CMC enrichments showed strong selective pressure, leading to Bacteroides dominating at G3, G6, and G10.
    explanation: Supports strong CMC substrate selection for a Bacteroides-rich community.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Bacteroides, Sporanaerobacter, Streptococcus, and Sphaerochaeta were consistently classified as core genera with
      CMC from G3 through G10.
    explanation: Identifies the recurrent CMC core genera.
- name: Xylan chain-elongation-associated phenotype
  description: The xylan line selected a Caproiciproducens-, Lactobacillus-, and Megasphaera-rich late community and developed
    caproate production by G10, a profile the paper interprets as consistent with reverse beta-oxidation but not yet supported
    by direct flux measurements.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In xylan enrichments, caproic acid (C6) increased from negligible levels at G0 to 6.33 mM at G10
    explanation: Supports caproate accumulation as a late xylan-enrichment phenotype.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Caproiciproducens, Lactobacillus and Megasphaera, increased substantially across generations and became major
      genera by G6 and G10.
    explanation: Identifies the genera that increased into the xylan G10 community.
