- name: alfalfa and xylan cryopreservation perturbation
  value: one month at -80 C before 72 h revival
  description: Active G10 alfalfa and xylan cultures were cryopreserved for one month and revived in fresh MC medium with
    their respective substrate, after which core bacterial composition and fermentation profiles were retained.
  evidence:
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cryopreserved consortia retained core community structure and fermentation characteristics upon revival.
    explanation: Supports structural and functional recovery after cryopreservation.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Cryopreserved samples clustered near their respective enrichments, confirming preservation of major community
      members despite minor restructuring.
    explanation: Supports post-revival retention of major community members in the 16S composition analysis.
