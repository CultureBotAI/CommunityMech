- name: MC-minus glycerol cryopreservation and revival medium
  composition:
  - name: glycerol
    concentration: '15'
    unit: '% v/v final'
    from_source: community_curated
  - name: alfalfa or xylan substrate
    concentration: '0.3'
    unit: g per revival vial
    from_source: community_curated
  temperature: '39'
  temperature_unit: C
  atmosphere: ANAEROBIC
  headspace_gas: CO2
  inoculum_source: active G10 alfalfa or xylan culture revived after one month at -80 C
  incubation_time: '72'
  incubation_time_unit: h
  preparation_notes: Active G10 alfalfa and xylan cultures were mixed 1:1 with anaerobic fresh MC-minus medium plus glycerol
    to 15% v/v final glycerol, flash-frozen in liquid nitrogen, stored at -80 C for one month, thawed under CO2, and revived
    for 72 h into the corresponding 0.3 g substrate in fresh MC medium.
  evidence:
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: flash-frozen in liquid nitrogen and subsequently moved to a −80 °C freezer and stored for one month.
    explanation: Supports liquid-nitrogen freezing followed by one month at -80 C.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Once thawed, contents of the vials were inoculated into 24 mL of fresh MC medium containing 0.3 g of the respective
      substrate (either alfalfa or xylan) and incubated at 39 °C for 72 h
    explanation: Supports revival into fresh MC medium with the matching alfalfa or xylan substrate.
