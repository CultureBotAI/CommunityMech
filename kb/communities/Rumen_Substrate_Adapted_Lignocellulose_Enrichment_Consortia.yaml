id: CommunityMech:000389
name: Rumen Substrate-Adapted Lignocellulose Enrichment Consortia
description: 'A laboratory panel of rumen-derived anaerobic enrichment consortia selected for 10 serial 72 h generations on
  four lignocellulosic substrates: alfalfa, barley straw, carboxymethyl cellulose, or a 1:1 arabinoxylan/acetylated-xylan
  mixture. The enrichments were derived from pooled rumen fluid from cannulated beef heifers in MC medium and were tracked
  by gas production, volatile fatty acids, and 16S V1-V2 amplicon sequencing. Substrate-specific late consortia showed divergent
  bacterial profiles, including Prevotella-dominated barley-straw enrichments, Bacteroides-rich CMC enrichments, and xylan
  enrichments associated with Caproiciproducens, Megasphaera, Lactobacillus, and caproate accumulation; alfalfa and xylan
  G10 cultures also retained core community structure after one month of cryopreservation and revival.'
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Use ecology-guided serial enrichment of rumen fluid to assemble stable, functionally specialized consortia on
    four structurally distinct plant-cell-wall substrates.
  assembly_strategy: Pool rumen fluid collected from four sites within each of four cannulated beef heifers, dilute it 1:4
    into MC medium, inoculate anaerobic serum vials supplied with alfalfa, barley straw, carboxymethyl cellulose, or xylan,
    and serially transfer the respective substrate-adapted enrichments every 72 h through G10.
  passaging_regimen: Initial G0 vials carried 30 mL of rumen-fluid/MC inoculum over 0.3 g substrate in 125 mL serum vials;
    subsequent G1-G10 passages moved 6 mL from the prior culture into 24 mL fresh MC medium plus 0.3 g of the same substrate
    in sealed 50 mL vials under CO2.
  measurement_endpoints:
  - gas pressure after 24 h, 48 h, and 72 h
  - volatile fatty acid profiles by gas chromatography
  - 16S V1-V2 amplicon sequencing across RF, G0, G3, G6, G10, and revived samples
  - Bray-Curtis beta diversity and genus-level differential abundance
  - post-cryopreservation gas production and VFA profiles for alfalfa and xylan enrichments
  evidence:
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study aimed to assemble substrate-adapted rumen microbial consortia using an ecology-guided enrichment approach.
    explanation: Supports the ecology-guided enrichment objective.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Rumen fluid collected from cannulated Angus × Hereford heifers was sequentially enriched over 10 generations
      on four substrates with distinct cell wall characteristics: alfalfa, barley straw, carboxymethyl cellulose (CMC), and
      xylan.'
    explanation: Identifies the rumen-derived four-substrate serial enrichment design.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fermentation parameters, including gas production and volatile fatty acids (VFAs), and bacterial community dynamics
      were analyzed
    explanation: Identifies the principal functional and community-composition readouts.
  - reference: PMID:42197533
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: selected consortia (alfalfa and xylan) were evaluated for stability following one month of cryopreservation.
    explanation: Supports cryopreservation challenge testing of the alfalfa and xylan G10 consortia.
