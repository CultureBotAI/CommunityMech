    label: exopolysaccharide
  relevance: >
    Candida albicans augments production of exopolysaccharides (EPS), the
    matrix polymer that lets cospecies biofilms accrue more biomass and harbor
    more viable S. mutans cells than single-species biofilms.
  evidence:
  - reference: PMID:24566629
    supports: SUPPORT
