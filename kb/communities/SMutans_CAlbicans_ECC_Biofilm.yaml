    id: CHEBI:28808
    label: mannan
  relevance: >
    Fungal mannan, together with beta-glucan, provides binding sites for the
    S. mutans GtfB enzyme, supporting glucosyltransferase activity in the
    cospecies biofilm matrix.
  evidence:
  - reference: PMID:24566629
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also found that Candida-derived β1,3-glucans contribute to the EPS
      matrix structure, while fungal mannan and β-glucan provide sites for GtfB
      binding and activity.
    explanation: Names fungal mannan as a GtfB binding site in the biofilm matrix.
growth_media:
- name: UFYTE (ultrafiltered tryptone-yeast extract) broth with 1% sucrose
  temperature: '37'
  temperature_unit: °C
  atmosphere: CAPNOPHILIC
  headspace_gas: 5% CO2
  incubation_time: '42'
  incubation_time_unit: h
  vessel_type: biofilm (saliva-coated hydroxyapatite surface)
  preparation_notes: Cospecies biofilms of S. mutans UA159 (~2 x 10^6 CFU/mL) and C. albicans SC5314
    (~2 x 10^4 CFU/mL) grown in UFYTE broth containing 1% (30 mM) sucrose; grown undisturbed for the first
    18 h, then medium changed twice daily until 42 h.
  evidence:
  - reference: PMID:24566629
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: tryptone-yeast extract (UFYTE) broth containing 1% (30 mM) sucrose
    explanation: Biofilm growth medium is UFYTE broth with 1% sucrose.
  - reference: PMID:24566629
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: at 37°C under 5% CO2
    explanation: Biofilms cultivated at 37 °C under 5% CO2 (capnophilic).
