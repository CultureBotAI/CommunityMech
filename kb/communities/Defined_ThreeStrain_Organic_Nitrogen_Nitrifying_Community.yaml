id: CommunityMech:000397
name: Defined Three-Strain Organic-Nitrogen Nitrifying Community
description: A simplified synthetic nitrifying microbial community pairing Bacillus badius NBRC 15713 with Nitrosomonas europaea
  NBRC 14298 and Nitrobacter winogradskyi NBRC 14297 for sequential ammonification and nitrification under organic nitrogen
  conditions. The co-culture achieved complete ammonification and nitrification under selected organic nitrogen conditions,
  accumulated approximately 56 mg-N/L nitrate-nitrogen with no residual nitrite-nitrogen, and yielded RT-qPCR profiles linking
  N. europaea and N. winogradskyi abundance changes to inorganic nitrogen concentrations during cultivation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Build a reduced, reproducible bacterial model that links organic-nitrogen ammonification to downstream nitrification.
  assembly_strategy: Combine the three NBRC strains Bacillus badius NBRC 15713, Nitrosomonas europaea NBRC 14298, and Nitrobacter
    winogradskyi NBRC 14297.
  measurement_endpoints:
  - nitrate-nitrogen accumulation
  - residual nitrite-nitrogen
  - inorganic nitrogen concentrations
  - N. europaea and N. winogradskyi relative abundance by RT-qPCR
  evidence:
  - &id001
    reference: PMID:42668143
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'A simplified synthetic nitrifying microbial community capable of sequential ammonification and nitrification
      under organic conditions was constructed using three defined strains: Bacillus badius NBRC 15713, Nitrosomonas europaea
      NBRC 14298, and Nitrobacter winogradskyi NBRC 14297.'
    explanation: Supports the defined three-strain construction and its sequential ammonification/nitrification function under
      organic nitrogen conditions.
  - &id003
    reference: PMID:42668143
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This co-culture achieved complete ammonification and nitrification under selected organic nitrogen conditions,
      with NO₃⁻-N accumulation of approximately 56 mg-N/L and no residual NO₂⁻-N detected.
    explanation: Supports the measured nitrate accumulation and lack of residual nitrite after complete ammonification and
      nitrification.
  - &id002
    reference: PMID:42668143
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: RT-qPCR analysis showed that changes in the relative abundance of N. europaea and N. winogradskyi were associated
      with changes in inorganic nitrogen concentrations during cultivation
    explanation: Supports RT-qPCR measurement of nitrifier relative abundance alongside inorganic nitrogen concentrations.
