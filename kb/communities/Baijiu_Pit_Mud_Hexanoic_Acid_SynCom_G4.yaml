id: CommunityMech:000365
name: Baijiu Pit Mud Hexanoic Acid SynCom G4
description: An ethanol-fed, hexanoic-acid-producing synthetic community constructed from Chinese baijiu fermentation pit
  mud using a top-down strategy. The G4 SynCom was dominated by Clostridium sensu stricto 12, primarily Clostridium kluyveri
  at 86%, with Clostridium sensu stricto 18 and Pseudoclavibacter also reported among dominant prokaryotes. Functional predictions
  and fermentation profiling linked the G4 community to reverse beta-oxidation-mediated hexanoic acid formation; under optimized
  pH 7.9, 37.6 C, 8.2% inoculum, and 77% loading-volume conditions, SynCom G4 reached 4.69 g/L hexanoic acid.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct an ethanol-based hexanoic-acid-producing SynCom from Chinese baijiu fermentation pit mud and use it
    as a simplified model to study prokaryotic succession, community assembly, and core synthetic pathways during hexanoic
    acid production.
  assembly_strategy: Build the G4 hexanoic-acid-producing SynCom from pit mud using a top-down strategy.
  measurement_endpoints:
  - prokaryotic community diversity and enrichment succession
  - ecological assembly process
  - functional-prediction links to the reverse beta-oxidation pathway
  - hexanoic acid yield
  evidence:
  - &id001
    reference: PMID:42442429
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, an ethanol-based HA-producing synthetic community (SynCom) was constructed from the pit mud using
      a top-down strategy, and dominated by Clostridium sensu stricto 12 (primarily Clostridium kluyveri, 86%), Clostridium
      sensu stricto 18 and Pseudoclavibacter.
    explanation: Supports the ethanol-based SynCom, top-down pit-mud construction strategy, and dominant prokaryotes in the
      G4 community.
  - reference: PMID:42442429
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Ecological analysis revealed that community assembly exhibited significant diversity dynamics during enrichment.
    explanation: Supports the community-assembly analysis endpoint.
