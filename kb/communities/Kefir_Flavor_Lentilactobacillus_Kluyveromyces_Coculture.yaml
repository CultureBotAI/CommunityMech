id: CommunityMech:000332
name: Kefir Flavor Lentilactobacillus-Kluyveromyces Coculture
description: >
  A defined cross-kingdom coculture of milk-kefir isolates Lentilactobacillus
  kefiri SLAM023B and Kluyveromyces marxianus SLAM005Y. One study reports
  complementary flavor-metabolism roles and enhanced ester synthesis during
  milk kefir fermentation; a second publication evaluates the same exact pair
  as a combined probiotic preparation in animal host models.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Characterize cooperative flavor-compound formation by an exact kefir-derived bacterial-yeast coculture.
  assembly_strategy: Coculture genome-sequenced L. kefiri SLAM023B and K. marxianus SLAM005Y isolated from milk kefir and compare their combined flavor metabolism with strain-resolved roles.
  measurement_endpoints:
  - genome-based metabolic pathway predictions
  - flavor-associated metabolites
  - ester synthesis
  - correlation-supported metabolic complementarity
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we investigated flavor compound biosynthesis and development by kefir-derived lactic acid bacteria and yeast during kefir fermentation, integrating genome-based predictions with metabolite validation
    explanation: Supports the coculture objective and combined genomic and metabolite measurements.
