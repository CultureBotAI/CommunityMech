      label: fermentation
  evidence:
  - reference: PMID:42217781
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: no significant effect of L. kefiri SLAM023B or strain interaction was detected
    explanation: Results, five yeast-associated volatiles; absence of a bacterial main effect or strain interaction,
      not absence of yeast production.
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: with notable interaction effects
    explanation: Results, heptanal, hexanal, 1-hexanol, hexanoic acid and octanoic acid; distinct from the ester
