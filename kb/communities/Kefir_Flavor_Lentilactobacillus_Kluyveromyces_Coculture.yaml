ecological_interactions:
- name: Complementary flavor metabolism and potential cross-feeding
  description: >
    K. marxianus SLAM005Y produces fruity fusel alcohols while L. kefiri
    SLAM023B contributes fatty-acid-derived precursors. Their coculture
    increases ester synthesis, and correlation analysis supports complementary
    roles and a potential, rather than directly demonstrated, cross-feeding
    mechanism.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ethyl acetate
    term:
      id: CHEBI:27750
      label: ethyl acetate
  - preferred_term: isoamyl acetate
    term:
      id: CHEBI:31725
      label: isoamyl acetate
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: K. marxianus SLAM005Y produced fruity fusel alcohols, whereas L. kefiri SLAM023B contributed fatty acid-derived precursors.
    explanation: Supports the complementary strain-resolved flavor-metabolism roles.
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The coculture of the 2 strains significantly enhanced ester synthesis, particularly ethyl acetate and isoamyl acetate
    explanation: Supports the community-level ester-synthesis phenotype and named products.
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Correlation analysis supported the complementary metabolic roles and potential cross-feeding mechanisms between the strains
    explanation: Supports cross-feeding as a correlation-backed potential mechanism, not a directly resolved transfer pathway.
