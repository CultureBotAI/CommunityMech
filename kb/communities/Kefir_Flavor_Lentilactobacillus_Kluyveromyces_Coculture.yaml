- name: Coculture Flavor And Growth Responses
  description: In static milk at 25 degrees C for 48 hours, coculture increased viable counts and changed volatile
    profiles. Results report interactions for selected fatty-acid/aldehyde endpoints, but not for five yeast-associated
    volatiles including ethyl acetate and isoamyl acetate. Measurements are normalized GC-MS peak areas, not sensory-panel
    scores. PARTIAL - abstract enhancement wording, Table3 means and a later Discussion comparator conflict; original
    figures need reconciliation. Higher counts and modest acidification do not identify a transferred growth factor
    or reproduce complete kefir fermentation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ethyl acetate
    term:
      id: CHEBI:27750
      label: ethyl acetate
  - preferred_term: isoamyl acetate
    term:
      id: CHEBI:31725
      label: isoamyl acetate
  biological_processes:
