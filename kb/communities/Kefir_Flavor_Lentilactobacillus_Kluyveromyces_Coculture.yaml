ecological_interactions:
- name: Dominant Kefir Genera Prioritization
  description: >
    Metagenomic profiling of the source kefir grains and fermented milk kefir
    identified Lactobacillus and Kluyveromyces as predominant genera, focusing
    downstream flavor-metabolism work on lactic acid bacteria and yeast from the
    same milk-kefir ecosystem.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: SLAM023B-SLAM005Y Coculture Genome Sequencing
    description: >
      The dominant bacterial and yeast genera guided isolation and sequencing
      of L. kefiri SLAM023B and K. marxianus SLAM005Y from milk kefir.
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Metagenomic analysis identified Lactobacillus and Kluyveromyces as predominant
      genera in both kefir grains and fermented milk kefir
    explanation: >
      Supports the strain-selection context linking the defined two-strain
      coculture to predominant bacteria and yeast in the source kefir.
- name: SLAM023B-SLAM005Y Coculture Genome Sequencing
  description: >
    Lentilactobacillus kefiri SLAM023B and Kluyveromyces marxianus SLAM005Y were
    isolated from milk kefir and hybrid sequenced, creating a strain-resolved
    genomic basis for interpreting metabolic cooperation in their defined
    coculture.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: KEGG Flavor Pathway Reconstruction
    description: >
      The hybrid genome sequences supplied the isolate genomes used for KEGG
      flavor-pathway functional annotation.
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lentilactobacillus kefiri SLAM023B and Kluyveromyces marxianus SLAM005Y were
      isolated and subjected to hybrid genome sequencing
    explanation: >
      Identifies the exact isolates and supports their genome sequencing before
      the strain-resolved functional analysis.
- name: KEGG Flavor Pathway Reconstruction
  description: >
    KEGG functional annotation of the L. kefiri and K. marxianus genomes
    identified amino-acid and fatty-acid metabolism plus alcohol, aldehyde, and
    acid interconversion pathways that can generate kefir flavor compounds.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  biological_processes:
  - preferred_term: amino acid metabolic process
    term:
      id: GO:0006520
      label: amino acid metabolic process
  downstream:
  - target: Strain-Resolved Flavor Precursor Partitioning
    description: >
      The pathway reconstruction provided the basis for assigning fruity fusel
      alcohol production to K. marxianus and fatty-acid-derived precursor
      production to L. kefiri.
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Functional annotation via Kyoto Encyclopedia of Genes and Genomes pathway mapping
      revealed featured pathways including AA and fatty acid metabolism
    explanation: >
      Supports the genome-based reconstruction of strain pathways relevant to
      flavor metabolism.
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: interconversion of alcohol, aldehyde, and acid, contributing to the formation
      and generation of flavor compounds
    explanation: >
      Supports the annotated pathway classes that connect the genomes to flavor
      compound formation.
- name: Strain-Resolved Flavor Precursor Partitioning
  description: >
    The two kefir isolates partitioned flavor-metabolic roles, with K. marxianus
    SLAM005Y contributing fruity fusel alcohols and L. kefiri SLAM023B
    contributing fatty-acid-derived precursors for coculture flavor formation.
  scope: COMMUNITY_LEVEL
  interaction_type: NICHE_PARTITIONING
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Coculture Acetate-Ester Enhancement
    description: >
      The complementary alcohol and fatty-acid precursor roles were observed in
      the same defined pair whose coculture significantly enhanced acetate ester
      synthesis.
  - target: Correlation-Supported Potential Cross-Feeding
    description: >
      The strain-resolved roles and coculture metabolite profiles were analyzed
      for correlation support of potential cross-feeding between the bacterial
      and yeast isolates.
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: K. marxianus SLAM005Y produced fruity fusel alcohols, whereas L. kefiri SLAM023B
      contributed fatty acid-derived precursors
    explanation: >
      Supports the reported partitioning of flavor-associated metabolic roles
      between the yeast and bacterial isolates.
- name: Coculture Acetate-Ester Enhancement
  description: >
    Coculturing SLAM023B and SLAM005Y significantly increased ester synthesis,
    especially ethyl acetate and isoamyl acetate, and also shifted additional
    flavor metabolites toward fruity, creamy, and cheese-like fermentation
    characteristics.
  scope: COMMUNITY_LEVEL
  interaction_type: MUTUALISM
  metabolites:
  - preferred_term: ethyl acetate
    term:
      id: CHEBI:27750
      label: ethyl acetate
  - preferred_term: isoamyl acetate
    term:
      id: CHEBI:31725
      label: isoamyl acetate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Correlation-Supported Potential Cross-Feeding
    description: >
      The enhanced and shifted coculture flavor-metabolite profile was included
      in the correlation analysis that supported complementary roles and
      potential cross-feeding.
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The coculture of the 2 strains significantly enhanced ester synthesis, particularly
      ethyl acetate and isoamyl acetate
    explanation: >
      Supports the two-strain coculture as the context for enhanced acetate
      ester synthesis and names the principal esters.
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increases in ethyl octanoate and C6 and C8 fatty acids introduced fruity and
      cheese-like characteristics, whereas levels of grassy aldehydes were reduced
    explanation: >
      Supports the broader coculture flavor-metabolite shift accompanying the
      acetate ester increase.
- name: Correlation-Supported Potential Cross-Feeding
  description: >
    Correlation analysis linked the strain-resolved flavor roles and coculture
    metabolite shifts, supporting complementary metabolism and potential
    bacterial-yeast cross-feeding as an explanation for kefir flavor development.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42217781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Correlation analysis supported the complementary metabolic roles and potential
      cross-feeding mechanisms between the strains
    explanation: >
      Supports potential cross-feeding as a correlation-backed interpretation,
      not as a directly resolved metabolite-transfer pathway.
