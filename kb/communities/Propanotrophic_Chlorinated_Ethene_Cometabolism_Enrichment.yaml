    snippet: the order would be prmACDB, an order previously been reported for
      propane monooxygenase operons in other Mycobacterium strains
    explanation: Supports the prmACDB group-6 SDIMO assignment for the
      Mycobacterium operons; partial because the abstract notes expression
      was not examined.
- name: Substrate-Specific Selection Across Chlorinated Ethenes
  description: >
    cDCE, TCE, and 1,1-DCE select for taxonomically distinct propanotrophic
    guilds within the same starting inocula: cDCE selects for
    Mycolicibacterium/Mycobacterium, TCE selects for Rhodococcus, and
    1,1-DCE re-selects for Pseudonocardia. This is competition mediated by
    differential tolerance/transformation of each chlorinated substrate
    rather than direct interaction between the guilds.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: trichloroethene
    term:
      id: CHEBI:16602
      label: trichloroethene
  - preferred_term: cis-1,2-dichloroethene
    term:
      id: CHEBI:18882
      label: 1,2-dichloroethene
  - preferred_term: 1,1-dichloroethene
    term:
      id: CHEBI:34031
      label: 1,1-dichloroethene
  biological_processes:
