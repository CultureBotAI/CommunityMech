    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TCE-degrading cultures were dominated by Rhodococcus
    explanation: Establishes Rhodococcus dominance under TCE selection in the
      propane-amended enrichments.
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Functional gene analysis identified both group 5 (prmABCD) and
      putative group 6 propane monooxygenases
    explanation: Supports group-5 propane monooxygenase as the operon present
      in the Rhodococcus MAGs driving propane-cometabolic TCE oxidation.
- name: Propane-Cometabolic cDCE Degradation by Mycolicibacterium and Mycobacterium
  description: Mycolicibacterium dominates and Mycobacterium follows in all
    four cDCE-amended enrichments; both genera carry propane monooxygenase
    operons (with prmACDB ordering for the Mycobacterium MAGs, suggestive of
    group-6 SDIMOs) that drive cometabolic cDCE oxidation while propane is
    the growth substrate.
  interaction_type: CROSS_FEEDING
