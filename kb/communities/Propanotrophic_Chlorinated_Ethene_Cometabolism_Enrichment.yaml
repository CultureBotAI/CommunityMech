id: CommunityMech:000271
name: Propanotrophic Chlorinated Ethene Cometabolism Enrichment Cultures
description: >
  Propane-enriched aerobic mixed cultures derived from three Michigan State
  University Long-Term Ecological Research agricultural soils (Soils T2, T3,
  T4) and from impacted-site sediment at a West Coast Naval Station (Site 1),
  evaluated for cometabolic biodegradation of three chlorinated ethenes -
  trichloroethene (TCE), cis-1,2-dichloroethene (cDCE), and
  1,1-dichloroethene (1,1-DCE) - in the presence of propane as growth
  substrate. Substrate-specific selection drove distinct dominance patterns:
  cDCE-amended cultures were dominated by Mycolicibacterium followed by
  Mycobacterium, TCE-amended cultures were dominated by Rhodococcus
  (R. opacus or R. wratislaviensis from agricultural soils;
  Mycolicibacterium/Mycobacterium/Rhodococcus mixture from the impacted site
  sediment), and the subset of 1,1-DCE-degrading cultures was dominated by
  Pseudonocardia (with a truncated propane monooxygenase alpha subunit
  suggesting alternative enzymes drive 1,1-DCE transformation). The
  enrichments express group 5 (prmABCD) and putative group 6 propane
  monooxygenases. The system supports development of propane-based
  bioaugmentation strategies for mixed chlorinated solvent contamination
  under aerobic conditions.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate the sustainability of cometabolic chlorinated-ethene
    biodegradation in propane-enriched mixed communities, determine which
    propanotrophs survive selection under individual chlorinated ethenes,
    and recover MAGs for the dominant propanotrophs and their propane
    monooxygenase operons.
  assembly_strategy: Enrich mixed propanotrophic communities by repeated
    transfer of soil- and sediment-derived inocula in mineral medium with
    propane as the sole carbon and energy source, then amend with TCE, cDCE,
    or 1,1-DCE for successive transfers to track sustained cometabolic
    biodegradation and substrate-driven community selection.
  perturbation_design: 160 mL serum-bottle microcosms with 10 g (wet weight)
    soil/sediment in 30 mL liquid mineral medium, propane (0.8-1.2 mg/L) plus
    individual chlorinated ethenes (TCE/cDCE at 4-5 mg/L; 1,1-DCE at 0.5-1
    mg/L); up to five successive 1:9 or 1:2 dilution transfers, with
    cross-substrate tests to assess whether cultures enriched on one ethene
    also degrade the others.
  measurement_endpoints:
  - TCE, cDCE, 1,1-DCE biodegradation kinetics
  - Propane consumption coupled to chlorinated-ethene removal
  - Whole-genome shotgun sequencing of community composition
  - Metagenome-assembled genome (MAG) recovery (CheckM >=80% completeness,
    <=20% contamination)
  - Propane monooxygenase operon and flanking-gene structure
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: propane-enriched mixed cultures (derived from agricultural soils
      and an impacted site sediment) which previously degraded 1,4-dioxane, were
      evaluated for their capacity to also degrade trichloroethene (TCE), cis-1,2-dichloroethene
      (cDCE), and 1,1-dichloroethene (1,1-DCE) over successive transfers
    explanation: Supports the propane-enrichment assembly strategy and the
      three-chlorinated-ethene cometabolism scope of the study.
