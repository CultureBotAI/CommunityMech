      label: response to xenobiotic stimulus
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Whole genome sequencing analyses revealed pronounced substrate-dependent
      selection of microbial communities
    explanation: Directly supports substrate-driven community selection as the
      central finding of the study.
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: substrate-specific pressures govern propanotrophic community structure
      and function, and highlight distinct roles of key actinobacterial genera
      in chlorinated ethene cometabolism
    explanation: Supports interpretation that substrate-specific selection drives
      distinct actinobacterial guild membership.
- name: 1,1-DCE-Driven Inhibition of Propanotrophs
  description: 1,1-DCE biodegradation is restricted to a subset of cultures
    and stalls at elevated concentrations; propane biodegradation slowed
    during 1,1-DCE exposure and resumed when TCE was substituted, consistent
    with inhibitory or toxic effects on propanotrophs at the elevated
    concentrations tested. The paper does not separate inhibition by the
    parent 1,1-DCE from inhibition by its transformation products.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: 1,1-dichloroethene
    term:
      id: CHEBI:34031
      label: 1,1-dichloroethene
  - preferred_term: propane
    term:
      id: CHEBI:32879
      label: propane
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 1,1-DCE removal was absent at elevated concentrations, both trends
      consistent with inhibitory or toxic effects
    explanation: Supports 1,1-DCE-driven inhibition of the propanotrophic
      community as the mechanism for the restricted degradation range.
environmental_factors:
- name: Propane as growth substrate
  value: 0.8-1.2 mg/L per amendment
  description: Propane supplied as the sole carbon and energy source drives
    propane monooxygenase expression in the propanotrophic guilds and
    fortuitously oxidizes the chlorinated ethenes as cometabolic substrates.
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: propane-enriched mixed cultures (derived from agricultural soils
      and an impacted site sediment)
    explanation: Establishes propane as the growth substrate driving cometabolic
      activity in the enrichments.
- name: Chlorinated ethene contaminant concentration
  value: TCE and cDCE at 4-5 mg/L; 1,1-DCE at 0.5-1 mg/L
  description: Initial chlorinated ethene concentrations were tuned per
    substrate; TCE and cDCE were tolerated at 4-5 mg/L while 1,1-DCE
    biodegradation required lower concentrations (0.5-1 mg/L) and stalled
    at the higher 4-5 mg/L range, consistent with inhibitory effects.
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TCE (4 to 5 mg/L), cDCE (4 to 5 mg/L) and 1,1-DCE (0.5 to 1 mg/L)
      were added to the active microcosms and abiotic controls
    explanation: Documents the concentration ranges used for each chlorinated
      ethene in the microcosms.
- name: Inoculum source
  value: KBS-LTER agricultural soils T2/T3/T4 + West Coast Naval Station Site 1 sediment
  description: Four propanotrophic inocula were used - three agricultural soils
    from the Michigan State University KBS Long-Term Ecological Research site
    and one impacted-site sediment from a West Coast Naval Station - to test
    whether community composition under chlorinated-ethene selection is
    influenced by source.
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The propanotropic enrichment cultures were developed from a previous
      study examining the biodegradation of 1,4-dioxane using inocula from various
      sources (three agricultural soils, impacted site sediment)
    explanation: Documents the four inoculum sources for the enrichments.
- name: Aerobic incubation
  value: orbital shaker at 120 rpm, room temperature
  description: Aerobic incubation at room temperature with 120 rpm orbital
    shaking in 160-mL serum bottles supports cometabolic oxidation; propane
    monooxygenases require O2 and the system is positioned as an alternative
    to anaerobic reductive dechlorination at oxic contaminated sites.
  evidence:
  - reference: doi:10.1016/j.jenvman.2026.129957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All microcosms were incubated at room temperature on an orbital shaker
      operated at 120 rpm
    explanation: Documents the aerobic shaken-incubation conditions used for
      the enrichments.
