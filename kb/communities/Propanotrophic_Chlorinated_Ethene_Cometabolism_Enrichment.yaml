ecological_interactions:
- name: Propane-Cometabolic TCE Degradation by Rhodococcus
  description: Rhodococcus opacus and R. wratislaviensis populations dominate
    TCE-amended enrichments and degrade TCE while propane is supplied as the
    growth substrate. The Rhodococcus MAGs carry the group-5 propane
    monooxygenase operon (prmABCD); functional gene analysis identified both
    group 5 and putative group 6 propane monooxygenases in the community
    but expression was not examined, so the specific enzyme responsible for
    TCE oxidation in vivo is not directly demonstrated.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Rhodococcus opacus
    term:
      id: NCBITaxon:37919
      label: Rhodococcus opacus
  metabolites:
