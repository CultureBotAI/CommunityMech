- name: Higher Gross Light Crude Oil Removal
  description: After 75 days, gravimetric light-crude-oil removal was about 62% in the Plackett-Burman-selected
    four-strain consortium versus about 25-39% in individual cultures. The authors explicitly did not subtract abiotic-control
    removal from these gross percentages, unlike the baseline used for GC-MS biodegradation. Both monocultures and
    consortium started at 1e8 CFU/mL per strain, so total starting CFUs were higher in the consortium; this is not
    a total-inoculum-matched synergy test. Stable relative abundance after day 7 and inferred MetaMIS interactions
    suggest possible cooperation, not directly demonstrated niche partitioning or the mechanism of this comparative
    endpoint. Neither the n-alkane nor PAH percentage alone selectively explains the gross-removal advantage.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: alkane
    term:
      id: CHEBI:18310
      label: alkane
  evidence:
  - reference: doi:10.3389/fmars.2022.962071
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Individually, bacterial oil removal by these microorganisms was evaluated by gravimetry, reaching 39%
      at maximum after 75 days, whereas in consortium it was ~62%.
    explanation: Supports the positive gross gravimetric consortium-versus-individual comparison. Primary Methods
      2.4/2.7 and Results 3.3.1 limit causal interpretation through per-strain inocula and unsubtracted abiotic
      removal.
  participating_taxa:
