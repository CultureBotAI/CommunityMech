ecological_interactions:
- name: Consortium n-Alkane Biodegradation
  description: GC-MS with an abiotic-control baseline measured C8-C38 n-alkane depletion in the four-strain consortium
    and individual cultures. Consortium values reached about 60% at day 30 and about 45% at day 75; chain-length
    fractions differed, and time-dependent abiotic loss of shorter alkanes affects these relative estimates. These
    measurements support hydrocarbon transformation, not complete mineralization, obligatory niche partitioning
    or strain-resolved in-consortium flux. Similar monoculture preferences and MetaMIS predictions do not assign
    the consortium result exclusively to Pseudomonas or Alcanivorax.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: alkane
    term:
      id: CHEBI:18310
      label: alkane
  biological_processes:
  - preferred_term: alkane catabolic process
    term:
      id: GO:0043448
      label: alkane catabolic process
  evidence:
  - reference: doi:10.3389/fmars.2022.962071
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also measured biodegradation levels by Gas Chromatography/Mass Spectrometry (GC-MS) observing 12
      polyaromatic hydrocarbons (PAHs) degradation analyzed and n-alkanes degradation with a preference for specific
      chain length
    explanation: The abstract supports the measured hydrocarbon class and chain-length differences. Publisher Methods
      2.7-2.8 and Results 3.3.2 bound the quantitative/time-dependent interpretation; it is not a selectively demonstrated
      cause of the comparative gross-removal advantage.
  participating_taxa:
  - preferred_term: Pseudomonas sp. GOM
    term:
      id: NCBITaxon:306
      label: Pseudomonas sp.
  - preferred_term: Halopseudomonas aestusnigri GOM5
