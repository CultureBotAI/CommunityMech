  - preferred_term: Alcanivorax sp. GOM
    term:
      id: NCBITaxon:1872427
      label: Alcanivorax sp.
- name: Consortium Polyaromatic Hydrocarbon Biodegradation
  description: GC-MS monitored 12 aromatic analytes, with different susceptibilities; not all 12 were substantially
    biodegraded. The consortium aggregate PAH estimate reached about 16% at day 75 relative to the abiotic baseline.
    The main text identifies fluorene, dibenzothiophene, methylated phenanthrenes and pyrene among susceptible compounds,
    while others were hardly biodegraded. This does not establish generic phenanthrene degradation, complete mineralization
    or a necessary division of labor. The canonical four participants identify the assayed consortium, not four
    proven owners of each degradation reaction.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: fluorene
    term:
