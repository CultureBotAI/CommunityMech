    snippet: We also measured biodegradation levels by Gas Chromatography/Mass Spectrometry (GC-MS) observing 12
      polyaromatic hydrocarbons (PAHs) degradation analyzed and n-alkanes degradation with a preference for specific
      chain length
    explanation: The abstract reports the GC-MS panel, while publisher Results 3.3.3 states heterogeneous susceptibility
      and hardly biodegraded analytes. Twelve analyzed compounds must not become twelve substantial positive degradation
      results.
  participating_taxa:
