discussions:
- discussion_id: gom_abiotic_inoculum_and_mediation
  prompt: Which processes explain the consortium gross-removal advantage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Consortium n-Alkane Biodegradation
  - ecological_interactions#Consortium Polyaromatic Hydrocarbon Biodegradation
  - ecological_interactions#Higher Gross Light Crude Oil Removal
  rationale: Equal-total-inoculum controls, abiotic-adjusted mass balance and selective partner or metabolic perturbations
    would separate starting cell number, hydrocarbon transformation, other removal processes and true interaction
    effects. The paper infers a signed network from relative-abundance time series using MetaMIS; these predictions
    and possible biosurfactant/cometabolic roles are not newly curated causal nodes here. Two class-to-bulk arrows
    are removed because neither establishes mediation of the comparative gross endpoint. Existing cache has an abstract
    and one Methods sentence despite a FULL TEXT marker; the publisher main body, Methods, tables and captions were
    read separately. Non-graph claims of significant degradation and metadata remain preserved, not certified.
  posed_by: codex
  posed_date: '2026-10-06'
