environmental_factors:
- name: Chlorella nutrient activation
  value: 0.1x standard commercial medium for 2 days
  description: C. vulgaris was nutrient-activated before AM-AB assembly by pre-cultivation under suboptimal nutrient
    concentrations relative to the standard commercial medium.
  evidence:
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. vulgaris was activated separately in suboptimal nutrient concentrations
    explanation: Supports the microalgal activation step before AM-AB assembly.
- name: Nitrogen removal
  value: 99.9% after 6 h
  description: The AM-AB consortium removed 99.9% of nitrogen after six hours of wastewater treatment.
  evidence:
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: nitrogen removal efficiency of 99.9% after 6-h treatment
    explanation: Quantifies rapid nitrogen removal by the AM-AB consortium.
- name: Phosphate removal
  value: '<0.01 mg/L after 2 h'
  description: The AM-AB treatment removed phosphate to below 0.01 mg/L within two hours.
  evidence:
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: complete removal of phosphate
    explanation: Supports the phosphate removal endpoint for the AM-AB consortium.
- name: Total-nitrogen specific removal rate
  value: 49.81 mg/g/h
  description: The maximum specific removal rate for total nitrogen reached 49.81 mg per gram per hour in the AM-AB treatment.
  evidence:
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The maximum specific removal rate for total nitrogen reached 49.81
    explanation: Supports the reported maximum total-nitrogen specific removal rate.
- name: BOD reduction
  value: 81.73%
  description: Biological oxygen demand decreased by 81.73% during AM-AB wastewater treatment.
  evidence:
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium achieved 81.73% BOD reduction
    explanation: Quantifies biological oxygen demand reduction by the consortium.
