id: CommunityMech:000444
name: AM-AB Chlorella-MLSS Wastewater Consortium
description: A microalga-bacteria wastewater-treatment consortium assembled by combining activated Chlorella vulgaris with
  separately activated mixed liquor suspended solids (MLSS) bacteria in an outdoor high-rate algal pond. Kumar et al. 2026
  called this pairing an activated microalgae-activated bacteria, or AM-AB, consortium and reported rapid nitrogen,
  phosphate, and biological oxygen demand removal during biological wastewater treatment.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Pair activated C. vulgaris with activated MLSS bacteria to improve biological wastewater treatment and biomass
    production in an outdoor high-rate algal pond.
  assembly_strategy: Activate C. vulgaris separately in suboptimal nutrient concentrations, activate bacterial MLSS separately,
    and incorporate the activated MLSS into activated C. vulgaris to assemble the AM-AB consortium.
  perturbation_design: Evaluate wastewater-treatment kinetics after incorporating activated MLSS into activated C. vulgaris.
  measurement_endpoints:
  - total nitrogen removal
  - phosphate removal
  - ammonia substrate affinity
  - biological oxygen demand reduction
  - biomass production
  evidence:
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Chlorella vulgaris and mixed liquor suspended solids (MLSSs) bacterial consortium for wastewater treatment in an
      outdoor high-rate algal pond (HRAP)
    explanation: Identifies C. vulgaris, the MLSS bacterial consortium, wastewater treatment, and the outdoor HRAP setting.
  - reference: PMID:42429207
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Separately activated bacterial MLSS was incorporated into activated C. vulgaris, making an AM-AB consortium
    explanation: Supports the assembly step that combines activated MLSS bacteria with activated C. vulgaris.
