  changes: Retain whole-C6 plate inhibition without bilateral competition or automatic greenhouse benefit.; Bound
    auxin production to the calibrated colorimetric assay without assigning reciprocal benefit or plant delivery.;
    Preserve measured Arabidopsis root shortening without turning a correlation into a hormone-mediated growth benefit.;
    Keep positive member supernatants and the negative whole-C6 supernatant outcome together.; Keep positive member
    volatile assays distinct from the non-significant whole-C6 mixture result. Issue#1941; reports/causal_graph_review/decisions/20261008-four-records-batch121.yaml
  llm_assisted: true
discussions:
- discussion_id: c6_causal_scope_batch121
  prompt: Why do C6 individual-member phenotypes differ from the assembled mixture and host assays?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#C6 Dual-Culture AG8 Radial Inhibition
  - ecological_interactions#C6 Salkowski auxin-assay output
  - ecological_interactions#C6-associated Arabidopsis primary-root shortening
  - ecological_interactions#C6 cell-free contrast with inhibitory member cultures
  - ecological_interactions#C6 volatile contrast with inhibitory member cultures
  rationale: All four members showed individual secretion-associated and volatile inhibition, but the corresponding
    positive mixture results were absent under the tested conditions. C6 retained direct plate inhibition and a
    measured Salkowski signal; it shortened Arabidopsis primary roots but was not among the significant wheat-protection
    mixtures. These contrasts need mechanistic resolution, not erased nulls or invented assay-to-assay causal arrows.
    The paper labels a negative correlation as r-squared; this notation is not copied as a valid variance-explained
    statistic or silently repaired.
  evidence:
  - reference: PMID:36118206
    snippet: SynComs (C1, C3, C4, C7, C8, C9, and C10) significantly reduced wheat root rot score
  - reference: PMID:36118206
    snippet: the cell-free supernatants from the rest of the eight bacteria and 10 SynComs did not show any antifungal
      activities
  posed_by: codex
  posed_date: '2026-10-08'
