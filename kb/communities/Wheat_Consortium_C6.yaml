ecological_interactions:
- name: C6 Dual-Culture AG8 Radial Inhibition
  description: The assembled C6 inhibited Rhizoctonia solani AG8 radial growth in dual culture, with reported inhibition
    of 34.48% (SD 5.91) in Table 2. This is a positive fungal-growth outcome, not evidence that both bacterial and
    fungal fitness declined. Plate inhibition does not establish the mediator or guarantee host protection.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Streptomyces sp. B6
    term:
      id: NCBITaxon:1883
      label: Streptomyces
  - preferred_term: Chryseobacterium sp. B7
    term:
      id: NCBITaxon:59732
      label: Chryseobacterium
  - preferred_term: Pseudomonas sp. B12
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Sphingomonas sp. B17
    term:
      id: NCBITaxon:13687
      label: Sphingomonas
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In vitro dual-culture assay showed eight SynComs, including C1-C4, C6-C8, and C10, inhibited the growth
      of R. solani AG8 to varying degrees
    explanation: Places C6 among the SynComs with significant AG8 radial-growth inhibition.
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 6(C6)34.48 ± 5.91
    explanation: Table 2 reports the whole-mixture plate inhibition estimate and standard deviation.
- name: C6 Salkowski auxin-assay output
  description: C6 culture supernatant gave an IAA-calibrated Salkowski estimate of 11.76 ug/mL (SD 2.83) in Table
    3. This is a whole-mixture colorimetric output, not structural identification of every reactive compound, member-resolved
    synthesis, delivery to plant roots or mutualism. No selective hormone perturbation links it to the separate
    Arabidopsis root-length result.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: IAA-calibrated Salkowski interpretation; not independently resolved molecular identity or plant delivery.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'including 10 single strains and all 10 SynComs, produced auxin at various concentrations

      '
    explanation: Reports the authors auxin interpretation; Methods specify colorimetry calibrated with IAA.
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 6(C6)11.76 ± 2.83
    explanation: Table 3 gives the C6 assay estimate and standard deviation.
- name: C6-associated Arabidopsis primary-root shortening
  description: C6 was among the nine mixtures that significantly shortened primary roots of plate-grown Arabidopsis
    after cocultivation. Shorter primary roots are the measured endpoint, not demonstrated growth promotion or reciprocal
    benefit. The across-treatment association with a separate auxin assay does not establish IAA as the necessary
    mediator. This Arabidopsis phenotype is not a wheat disease-protection result; C6 was not among the mixtures
    with significant greenhouse root-rot reduction or fresh-root-weight improvement.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
    notes: Candidate explanation from a separate assay correlation, not demonstrated hormone mediation.
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Similar reductions in the primary root length of Arabidopsis seedlings were observed in all SynComs
      except C5

      '
    explanation: Reports the primary-root reduction in the living Arabidopsis plate assay; not increased wheat growth.
- name: C6 cell-free contrast with inhibitory member cultures
  description: 'Cell-free cultures of each C6 member inhibited AG8 when the strains were tested separately, but
    the assembled C6 was among all ten mixtures whose supernatants showed no reported antifungal activity. Keep
    both observations: individual secretion-associated inhibition cannot be assigned to the mixed culture. This
    contrast does not identify an inhibitor, prove degradation of a particular fungal wall component, or show why
    the mixture lost the measured phenotype.'
  scope: COMMUNITY_LEVEL
