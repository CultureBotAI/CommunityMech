ecological_interactions:
- name: Equal-Ratio Mixed-Genus C6 Assembly
  description: >
    Streptomyces sp. B6, Chryseobacterium sp. B7, Pseudomonas sp. B12,
    and Sphingomonas sp. B17 were combined at equal ratios as the random
    mixed-genus C6 consortium within a broader ten-SynCom wheat-rhizosphere
    design.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: C6 Dual-Culture AG8 Radial Inhibition
    description: >
      The assembled four-member C6 inoculum was tested directly against
      Rhizoctonia solani AG8 mycelial growth.
  - target: C6 Auxin Production
    description: >
      The assembled four-member C6 inoculum was tested for aggregate
      indole-3-acetic acid production in culture supernatant.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      SynCom 6(C6) Streptomyces sp. B6, Chryseobacterium sp. B7,
      Pseudomonas sp. B12, Sphingomonas sp. B17
    explanation: Table 1 names the four bacterial isolates that make up SynCom 6.
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      SynComs were obtained by mixing the individuals in equal ratios
    explanation: >
      Supports the mixed inoculum construction used for C6 and the other
      wheat-rhizosphere SynComs.
- name: C6 Dual-Culture AG8 Radial Inhibition
  description: >
    C6 inhibited Rhizoctonia solani AG8 radial growth in the direct
    dual-culture agar assay, placing it among the eight inhibitory SynComs in
    the ten-consortium panel.
