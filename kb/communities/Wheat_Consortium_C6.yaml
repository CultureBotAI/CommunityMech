id: CommunityMech:000077
name: Wheat Synthetic Consortium C6
description: 'A four-member mixed-genus wheat-rhizosphere synthetic consortium
  (SynCom 6/C6) composed of Streptomyces sp. B6, Chryseobacterium sp. B7,
  Pseudomonas sp. B12, and Sphingomonas sp. B17. Yin et al. reported that C6
  inhibited Rhizoctonia solani AG8 radial growth in dual culture and produced
  auxin in vitro as a whole consortium.

  '
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
engineering_design:
  objective: Test whether a four-member mixed-genus wheat-rhizosphere SynCom could
    inhibit Rhizoctonia solani AG8 and express plant-growth-promotion traits.
  assembly_strategy: Bottom-up assembly of Streptomyces sp. B6, Chryseobacterium
    sp. B7, Pseudomonas sp. B12, and Sphingomonas sp. B17 as SynCom 6.
  measurement_endpoints:
  - In vitro Rhizoctonia solani AG8 radial-growth inhibition by dual culture
  - Wheat root rot score and fresh root weight under AG8 challenge
  - Auxin production by SynCom culture supernatants
  - Volatile, hydrogen cyanide, and cell-free supernatant effects on AG8
  notes: SynCom 6 was one of the mixed-genus consortia assembled from the
    14-member wheat-rhizosphere strain panel.
  perturbation_design: The designed assay panel compared water controls, 14 single
    wheat-rhizosphere isolates, and 10 SynCom mixtures across AG8 inhibition,
    auxin, volatile, hydrogen cyanide, and cell-free supernatant phenotypes.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 6(C6) Streptomyces sp. B6, Chryseobacterium sp. B7,
      Pseudomonas sp. B12, Sphingomonas sp. B17
    explanation: Table 1 names the four bacterial isolates that make up SynCom 6.
