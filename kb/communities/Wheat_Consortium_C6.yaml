- name: C6 volatile contrast with inhibitory member cultures
  description: Each of the four C6 member strains inhibited AG8 in the physically separated volatile assay, but
    C6 was not one of the four significantly inhibitory mixtures, identified as C2-C4 and C7. Retain the individual
    positives and mixture contrast without assigning a positive volatile mechanism to C6, identifying particular
    emitted compounds, or claiming that volatile effects are absent under every possible condition.
