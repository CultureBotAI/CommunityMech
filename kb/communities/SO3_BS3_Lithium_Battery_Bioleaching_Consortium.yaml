ecological_interactions:
- name: BS3 ethanol detoxification of brewing wastewater
  description: Bacillus subtilis BS3 converts residual ethanol in brewing wastewater to acetate via heterologous alcohol dehydrogenase
    and aldehyde dehydrogenase, removing an inhibitor of S. oneidensis extracellular electron transfer.
  interaction_type: COMMENSALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bacillus subtilis 168 BS3
    term:
