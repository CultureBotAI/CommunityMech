  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The generated electrons were then used to reduce NCM via the EET mechanism. Specifically, the electrons generated
      from strain SO3 could be either directly transferred to NCM via outer membrane c‐Cyts MtrC and OmcA, or first transferred
      to riboflavin molecules via MtrC and OmcA.
    explanation: Supports MtrC/OmcA- and riboflavin-mediated electron transfer from SO3 to NCM in the final SO3-BS3 consortium.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: strain BS3 in the SO3‐BS3 consortium eliminated the ethanol inhibition on EET of S. oneidensis by converting
      residual ethanol in the brewing wastewater into acetate via the Adh‐AldH dual enzyme cascade reaction. Also, strain
      BS3 synthesized riboflavin, which was employed as an electron shuttle for promoting the EET of S. oneidensis.
    explanation: Supports the BS3 contribution to the riboflavin-enhanced NCM reduction phenotype.
environmental_factors:
- name: Total leached Li, Ni, Co, and Mn
  value: 102.4 mg/L total dissolved metal ions after 14 days
  description: The SO3-BS3 consortium released 80.8 mg/L Li, 8.5 mg/L Ni, 5.2 mg/L Co, and 7.9 mg/L Mn from 0.2 g/L NCM black
    mass, corresponding to about 100%, 35.1%, 58.4%, and 61.8% leaching efficiencies, respectively.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Specifically, the total leached metal ions reached 102.4 mg L−1, which comprised 80.8, 8.5, 5.2, and 7.9 mg L−1
      for Li, Ni, Co, and Mn, respectively
    explanation: Quantifies the final dissolved Li, Ni, Co, and Mn concentrations in the SO3-BS3 NCM-leaching assay.
- name: Ni and Co cytotoxicity
  value: 6 mg/L Ni2+ and 3 mg/L Co2+ challenge
  description: Leached Ni2+ and Co2+ inhibited predecessor strains; IrrE expression in SO3 and BS3 improved growth and reduced
    cell death under the same Ni/Co challenge.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When exposed to 6 mg L−1 Ni2+ and 3 mg L−1 Co2+, the growth of strain SO2 was notably inhibited
    explanation: Supports the nickel and cobalt stress condition used to evaluate the IrrE improvement in S. oneidensis.
