discussions:
- discussion_id: SO3_BS3_SCALE_UP_STABILITY
  prompt: The source established a 14-day laboratory proof of concept but explicitly left larger-scale, long-term stability
    unresolved, especially under natural variation in raw brewing-wastewater composition.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - growth_media#Moutai brewing wastewater with spent NCM black mass
  rationale: Raw brewing wastewater varied by batch and the authors identified large-scale reproducibility as a future optimization
    target, so the current record should not assert demonstrated industrial stability.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: full_text
    snippet: the long‐term stability and reproducibility of the microbial consortium at a larger scale needed to be thoroughly
      considered, in particular under the condition of natural fluctuations in raw brewing wastewater compositions
    explanation: Records the authors' stated scale-up uncertainty without asserting it as a demonstrated limitation.
