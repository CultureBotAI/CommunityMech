  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  downstream:
  - target: MtrC/OmcA and riboflavin NCM reduction
    description: Removing ethanol relieves inhibition of the S. oneidensis EET machinery that reduces NCM for metal oxide
      leaching.
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: strain BS3 in the SO3‐BS3 consortium eliminated the ethanol inhibition on EET of S. oneidensis by converting
      residual ethanol in the brewing wastewater into acetate via the Adh‐AldH dual enzyme cascade reaction.
    explanation: Directly supports the BS3-to-SO3 detoxification interaction in the final SO3-BS3 consortium.
- name: MtrC/OmcA and riboflavin NCM reduction
  description: Shewanella oneidensis SO3 catabolizes lactate from brewing wastewater and transfers electrons to NCM black
    mass either directly through outer-membrane cytochromes MtrC/OmcA or indirectly through riboflavin, reducing NCM metal
    oxides and releasing Li, Ni, Co, and Mn into solution.
  scope: COMMUNITY_LEVEL
