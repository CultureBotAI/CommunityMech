id: CommunityMech:000385
name: SO3-BS3 Lithium-ion Battery Bioleaching Consortium
description: A two-member engineered Shewanella oneidensis MR-1 and Bacillus subtilis 168 synthetic consortium for metal oxide
  leaching from spent LiNixCoyMn1-x-yO2 lithium-ion battery cathode black mass using Moutai brewing wastewater as the organic
  leaching medium. The final SO3-BS3 design pairs S. oneidensis SO3, engineered for riboflavin synthesis and Deinococcus IrrE-mediated
  metal-ion stress resistance, with B. subtilis BS3, engineered for ethanol detoxification, riboflavin production, and IrrE-mediated
  resistance. In anaerobic bottle cultures with 0.2 g/L black mass, the SO3-BS3 consortium increased total dissolved Li, Ni,
  Co, and Mn to 102.4 mg/L by reducing NCM through MtrC/OmcA- and riboflavin-mediated extracellular electron transfer.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: Recycle spent NCM lithium-ion battery cathode black mass by using brewing wastewater organics as reductants and
    an engineered S. oneidensis/B. subtilis division of labor to catalyze metal oxide reduction and leaching.
  assembly_strategy: Combine the SO3 S. oneidensis MR-1 derivative carrying a Ptac::ribADEHC-irrE pHG13 plasmid with the BS3
    B. subtilis 168 derivative carrying P43::adh-aldH-irrE on pCE2 in the high-riboflavin BSG3 background. SO3 catabolizes
    lactate and transfers electrons to NCM directly via MtrC/OmcA and indirectly through riboflavin, while BS3 removes inhibitory
    ethanol, adds riboflavin, and uses IrrE to tolerate Ni and Co stress.
  inoculation_strategy: Grow each member in chloramphenicol-supplemented LB, inoculate overnight cultures into brewing wastewater
    at 1% v/v with 0.5 mM IPTG, subculture, transfer to anaerobic bottles, add 0.2 g/L NCM black mass, and ferment anaerobically
    at 30 degrees Celsius for 14 days.
  measurement_endpoints:
  - Total dissolved Li, Ni, Co, and Mn after NCM black-mass leaching
  - Ethanol depletion from brewing wastewater
  - Riboflavin production and microbial-fuel-cell power density
  - Ni and Co cytotoxicity resistance after irrE expression
  - MtrC/OmcA deletion effects on extracellular electron transfer and NCM reduction
  evidence:
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study developed microbial consortia comprising engineered S. oneidensis and B. subtilis, which enabled efficient
      recycling of spent LIBs utilizing brewing wastewater as the leaching agent to achieve metal oxide leaching.
    explanation: States that the record denotes engineered S. oneidensis/B. subtilis consortia designed for spent-lithium-ion-battery
      metal oxide leaching in brewing wastewater.
  - reference: PMID:42733304
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To relieve the cytotoxicity of Ni2+ and Co2+, the global transcriptional regulator IrrE was overexpressed in
      strains SO2 and BS2, resulting in the formation of the SO3‐BS3 consortium.
    explanation: Supports the final SO3-BS3 design as the IrrE-enhanced consortium assembled to improve metal-ion stress tolerance.
