ecological_interactions:
- name: Sphingomonas desiccabilis rare-earth-element bioleaching from basalt
  description: >
    Sphingomonas desiccabilis colonised basalt slides and mobilised rare earth
    elements (the lanthanides plus yttrium) into the chamber fluid, raising mean leached
    REE concentrations above non-biological controls under microgravity, simulated Mars
    gravity, and simulated Earth gravity. Gravity regime had no significant effect on
    the final yields, demonstrating that microbe-mineral REE bioleaching proceeds with
    comparable efficacy across gravitational conditions. The basalt substrate contained
    all measured lanthanides (La, Ce, Pr, Nd, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu).
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Sphingomonas desiccabilis CP1D
    term:
      id: NCBITaxon:429134
      label: Sphingomonas desiccabilis
