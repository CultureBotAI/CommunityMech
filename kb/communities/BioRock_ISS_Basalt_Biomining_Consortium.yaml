- name: 50% R2A medium (BioRock spaceflight cultivation)
  temperature: '20.16'
  temperature_unit: °C
  atmosphere: AEROBIC
  vessel_type: miniature biomining reactor culture chamber (KUBIK incubator, ISS)
  inoculum_source: single-strain cultures pre-grown in R2A, applied to olivine basalt slides
  preparation_notes: >
    The medium used for the BioRock experiment was R2A at 50% v/v of the published
    component concentrations, approved for spaceflight and supporting growth of all
    three panel members. Overnight cultures were pre-grown in 100% v/v R2A at 20-22 C to
    stationary phase; five millilitres of 50% R2A were used per sample chamber.
