    evidence_source: IN_VITRO
    snippet: Content of rare earth elements (REEs; reported as μg/g
    explanation: Anchors the basalt REE content table quantifying the leached lanthanides.
- name: Vanadium bioleaching by Sphingomonas desiccabilis and Bacillus subtilis
  description: >
    Both Sphingomonas desiccabilis and Bacillus subtilis enhanced leaching of vanadium
    from basalt relative to sterile controls (by 184.92 to 283.22%) under microgravity,
    simulated Mars gravity, and simulated Earth gravity. Vanadium is a valuable steel
    additive, and its microbial mobilisation from basalt without a significant gravity
    effect supports biomining and bioremediation on other Solar System bodies.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Bacillus subtilis NCIB 3610
    term:
      id: NCBITaxon:1423
      label: Bacillus subtilis
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  evidence:
  - reference: PMID:33868198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sphingomonas desiccabilis and Bacillus subtilis enhanced the leaching of vanadium under the three gravity conditions compared to sterile controls by 184.92 to 283.22%
    explanation: Quantifies vanadium bioleaching by both S. desiccabilis and B. subtilis.
  - reference: PMID:33868198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: One element of interest in mining is vanadium (V)
    explanation: Identifies vanadium as the target element for this bioleaching interaction.
- name: Microbial specificity of basalt bioleaching among panel members
  description: >
    The three panel members differed in bioleaching outcome: Sphingomonas desiccabilis
    enhanced REE leaching, Bacillus subtilis reduced REE bioleaching efficacy, and
    Cupriavidus metallidurans showed no difference from non-biological controls. This
    species-dependent partitioning of bioleaching activity mirrors the microbial
    specificity of the process observed on Earth.
  interaction_type: NICHE_PARTITIONING
  source_taxon:
    preferred_term: Sphingomonas desiccabilis CP1D
    term:
      id: NCBITaxon:429134
      label: Sphingomonas desiccabilis
  target_taxon:
    preferred_term: Cupriavidus metallidurans CH34
    term:
      id: NCBITaxon:119219
      label: Cupriavidus metallidurans
  evidence:
  - reference: PMID:33173035
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacillus subtilis exhibited a reduction in bioleaching efficacy and Cupriavidus metallidurans showed no difference compared to non-biological controls
    explanation: Documents the species-specific differences in bioleaching outcome among the three members.
  - reference: PMID:33173035
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: showing the microbial specificity of the process, as on Earth
    explanation: States that bioleaching is microbially specific, supporting niche partitioning among members.
