id: CommunityMech:000303
name: BioRock ISS Basalt Biomining Consortium
description: >
  A defined three-species bacterial panel flown as the ESA BioRock experiment on
  board the International Space Station to test microbial bioleaching of economically
  important elements from basaltic rock under microgravity, simulated Mars gravity,
  and simulated Earth gravity (with ground 1 x g controls). Sphingomonas desiccabilis
  CP1D (DSM 16792), Bacillus subtilis NCIB 3610 (DSM 10), and Cupriavidus metallidurans
  CH34 (DSM 2839) were each cultivated on slides of olivine basalt (collected near
  Gufunes, Reykjavik, Iceland; chosen as an analogue of Moon/Mars surface material)
  inside a purposely designed miniature biomining reactor housed in the KUBIK
  incubator. Sphingomonas desiccabilis enhanced mean leached concentrations of rare
  earth elements (the lanthanides plus yttrium) relative to non-biological controls
  in all gravity regimes, while Bacillus subtilis reduced REE bioleaching efficacy and
  Cupriavidus metallidurans showed no difference, demonstrating the microbial
  specificity of the process as on Earth. A companion analysis showed that
  Sphingomonas desiccabilis and Bacillus subtilis both enhanced vanadium leaching by
  184.92 to 283.22% relative to sterile controls, and a third study found no
  significant differences in final bacterial cell concentrations between gravity
  regimes. Gravity level had no significant effect on mean leaching in any case,
  establishing the principle of biomining and associated bioindustrial processes on
  Solar System bodies with non-1 x g gravity.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: >
    Test whether microbial bioleaching of rare earth elements and vanadium from
    basaltic rock can be achieved under extraterrestrial (microgravity and simulated
    Mars) gravity, using a defined panel of three bacteria in a miniature space
    biomining reactor.
  assembly_strategy: >
    A defined panel of three bacterial species (Sphingomonas desiccabilis CP1D,
    Bacillus subtilis NCIB 3610, Cupriavidus metallidurans CH34), each grown as a
    single-strain culture on identical basalt slides in an identical medium and
    hardware, was compared against non-biological (sterile) controls across gravity
    regimes.
  perturbation_design: >
    Gravity regime was the primary designed variable: true microgravity, simulated
    Mars gravity, and simulated Earth gravity generated by an onboard centrifuge in the
    KUBIK incubator, plus ground 1 x g controls.
  measurement_endpoints:
  - Leached concentrations of rare earth elements in chamber fluid vs non-biological controls
  - Leached vanadium concentration vs sterile controls
  - Final bacterial cell counts and optical densities across gravity regimes
  evidence:
  - reference: PMID:33173035
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: test hypotheses on the bioleaching of REEs from basaltic rock in microgravity and simulated Mars and Earth gravities using three microorganisms and a purposely designed biomining reactor
    explanation: States the experimental objective, the three-organism panel, the basalt substrate, and the purpose-built biomining reactor.
  - reference: PMID:33868198
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: conducted the ESA BioRock experiment on board the International Space Station
    explanation: Identifies the community as the ESA BioRock ISS biomining experiment.
environment_term:
  preferred_term: BioRock ISS basalt biomining reactor (laboratory/spaceflight culture)
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >
    The community is a controlled spaceflight cultivation rather than a sampled natural
    community. Bacteria were grown on slides of olivine basalt (a Moon/Mars surface
    analogue collected near Gufunes, Reykjavik, Iceland) inside a purpose-built
    miniature biomining reactor in the KUBIK incubator in the Columbus module of the
    International Space Station, under microgravity, simulated Mars gravity, and
    simulated Earth gravity, with ground 1 x g controls.
