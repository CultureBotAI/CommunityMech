metal_notes: >
  Primary function is biomining: bioleaching of rare earth elements and vanadium from
  basalt on the ISS. The basalt REE content table quantified all fourteen lanthanides
  (La, Ce, Pr, Nd, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu); yttrium is listed as a
  targeted REE (scandium is mentioned generally but was not quantified in the leaching
  table). Vanadium was actively leached by S. desiccabilis and B. subtilis (enhanced
  184.92-283.22% over sterile controls). Iron is a major constituent of the olivine
  basalt substrate rather than a specific mining target.
