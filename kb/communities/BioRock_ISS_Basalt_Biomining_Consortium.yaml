  description: >
    The experiment compared true microgravity with simulated Mars and simulated Earth
    gravity generated by an onboard centrifuge in the KUBIK incubator, alongside ground
    1 x g controls. Gravity had no significant effect on mean leaching or on final cell
    concentrations.
