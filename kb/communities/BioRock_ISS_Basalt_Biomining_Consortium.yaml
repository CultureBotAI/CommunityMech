  value: olivine basalt slides (Gufunes, Reykjavik, Iceland)
  description: >
    Bacteria were cultivated on slides of olivine basalt collected near Gufunes,
    Reykjavik, Iceland, chosen as an analogue of Moon/Mars surface material and as the
    source rock for the leached rare earth elements and vanadium.
