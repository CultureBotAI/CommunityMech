environmental_factors:
- name: DCF enrichment concentration
  value: '24'
  unit: mg/L
  description: Activated sludge was initially selected in MSM containing 24 mg/L DCF before the glucose-amended subculture
    that yielded the MC.
  evidence:
  - reference: PMID:41718267
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sterile 250 mL Erlenmeyer flasks (autoclave Auster-G, P-Selecta with one cycle at 120 °C, inlet pressure of 103
      kPa, for 20 min) were inoculated with 10 mL of activated sludge and 150 mL of MSM, supplemented with DCF at an initial
      concentration of 24 mg L−1
    explanation: Supports the initial activated-sludge enrichment volume, vessel, sterilization setup, and 24 mg/L DCF selective
      pressure.
- name: DCF biodegradation assay concentration
  value: '10'
  unit: mg/L
  description: The triplicate MC biodegradation assay was spiked with 10 mg/L DCF sodium salt.
  evidence:
  - reference: PMID:41718267
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biodegradation assays were conducted in sterile 250 mL Erlenmeyer flasks covered with a cotton plug containing
      50 mL of MSM solution supplemented with glucose (3 g L−1), spiked with 10 mg L−1 DCF sodium salt
    explanation: Supports the flask vessel, working volume, MSM medium, glucose concentration, and DCF sodium-salt dose used
      for the MC biodegradation assay.
