id: CommunityMech:000379
name: Diclofenac Activated Sludge Microbial Consortium
description: A laboratory microbial consortium enriched from activated sludge sampled at the San Jerónimo WWTP in Seville,
  Spain, by diclofenac selection and a glucose-supplemented MSM subculture. The MC degraded all 10 mg/L diclofenac in a glucose-amended
  mineral-salts flask assay within 5 days, producing extracellular 4'-hydroxy-diclofenac, 5-hydroxy-diclofenac, and putative
  nitro-DCF. 16S and ITS metabarcoding at the beginning and after 28 days showed a shift from Burkholderia-, Klebsiella-,
  Ochrobactrum-, Chthoniobacter-, and Malassezia-rich starting profiles to final bacterial and fungal profiles dominated by
  Burkholderia and Talaromyces, respectively.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Select a DCF-degrading microbial consortium from WWTP activated sludge and evaluate DCF removal, transformation
    products, toxicity, and bacterial/fungal community dynamics under glucose-amended batch-culture conditions.
  assembly_strategy: Inoculate activated sludge from the San Jerónimo WWTP into MSM amended with 24 mg/L DCF, incubate for
    21 days at 30 °C with shaking, and recover the MC after 7 additional days in the DCF plus 3 g/L glucose subculture.
  perturbation_design: Revive the stored MC, wash it with MSM, and inoculate triplicate 50 mL MSM cultures containing 3 g/L
    glucose and 10 mg/L DCF sodium salt to an initial OD600 of approximately 1.0, with abiotic controls and CSWD.1/CSWD.2
    isolate cultures run in parallel.
  measurement_endpoints:
  - DCF dissipation by HPLC
  - 4'-OH-DCF, 5-OH-DCF, and NO2-DCF transformation products
  - Aliivibrio fischeri ecotoxicity after 28 days
  - 16S rRNA V3/V4 bacterial metabarcoding
  - ITS2 fungal metabarcoding
  notes: CSWD.1 and CSWD.2 were Pseudomonas isolate controls selected in parallel with the MC and are not curated as MC members.
    The paper detected persistent 4'-OH-DCF and tentatively identified NO2-DCF after 28 days, so complete parent-DCF disappearance
    did not equal complete detoxification.
  evidence:
  - reference: PMID:41718267
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A microbial consortium, along with individual strains capable of degrading DCF, was obtained through enrichment
      cultures using activated sludge from the San Jerónimo WWTP
    explanation: Supports the activated-sludge origin and diclofenac enrichment strategy used to obtain the microbial consortium.
  - reference: PMID:41718267
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A degrading MC and 4 isolates were obtained after 7 days of enrichment in the presence of DCF and glucose.
    explanation: Supports the glucose-supplemented subculture that yielded the DCF-degrading MC.
  - reference: PMID:41718267
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biodegradation assays supplemented with glucose showed limited removal (45.5%) by CSWD.1, whereas CSWD.2 and
      the MC achieved complete elimination (100%) of 10 mg L-1 DCF in 21 and 5 days, respectively.
    explanation: Supports complete 10 mg/L DCF removal by the MC within 5 days in the glucose-supplemented biodegradation
      assay.
