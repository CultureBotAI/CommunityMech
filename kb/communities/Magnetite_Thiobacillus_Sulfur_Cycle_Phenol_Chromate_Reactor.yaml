    description: Dissimilatory Fe(III) reduction of crystalline magnetite under sulfate-reducing conditions generates Fe(II)
      that reacts with trace dissolved oxygen (DO) to prevent re-oxidation of reduced Cr(III).
  evidence:
  - reference: doi:10.1016/j.cej.2020.124801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results showed that, under the low-concentration sulphate conditions, the effluent concentration of both
      Cr(VI) (18.0 mg/L vs 187.7 mg/L) and phenol (354.2 mgCOD/L vs 1256.0 mgCOD/L) in the reactor with magnetite was significantly
      lower than that without magnetite.
    explanation: Quantifies the reduction in effluent Cr(VI) and phenol concentrations achieved by magnetite supplementation
      under low-sulfate conditions.
  - reference: doi:10.1016/j.cej.2020.124801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further analysis by X-ray Diffraction (XRD) and X-ray photoelectron spectroscopy (XPS) observed the disappearance
      of the crystalline structure in magnetite as well as the loss of iron via the dissimilatory Fe(III) reduction in the
      aggregates.
    explanation: Demonstrates dissimilatory Fe(III) reduction of crystalline magnetite within the sulfate-reducing reactor
      aggregates.
  - reference: doi:10.1016/j.cej.2020.124801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Considered that the re-oxidation of the reduced Cr(III) might occur in the aggregates without magnetite, the
      generated Fe(II) might react with the slight dissolved oxygen (DO) to reduce the re-oxidation of the reduced Cr(III),
      which further achieved the transformation of Fe(III)/Fe(II).
    explanation: Supports the downstream transition from dissimilatory Fe(III) reduction to Fe(II)-mediated scavenging of
      trace dissolved oxygen and stabilization of reduced Cr(III).
- name: Dissimilatory Fe(II)-Mediated Dissolved Oxygen Scavenging and Cr(III) Stabilization
  description: Fe(II) generated via dissimilatory Fe(III) reduction of magnetite reacts with slight dissolved oxygen (DO)
    in the sulfate-reducing aggregates, preventing re-oxidation of reduced Cr(III) and completing the Fe(III)/Fe(II) redox
    cycle.
