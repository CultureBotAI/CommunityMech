- name: Sulfur-Cycle-Coupled Anaerobic Phenol Degradation and Cr(VI) Reduction
  description: Whole microbial sulfur cycling in the magnetite-amended anaerobic bioreactor significantly lowers effluent
    phenol (354.2 mgCOD/L vs 1256.0 mgCOD/L without magnetite) and Cr(VI) (18.0 mg/L vs 187.7 mg/L without magnetite) under
    low-concentration sulfate conditions while driving dissimilatory Fe(III) reduction of crystalline magnetite.
