id: CommunityMech:000493
name: Magnetite-Mediated Thiobacillus Sulfur-Cycle Phenol and Chromate Bioreactor
description: Magnetite-supplemented anaerobic sulfur-cycle bioreactor community enriched in chemolithotrophic sulfur-oxidizing
  Thiobacillus species for simultaneous anaerobic phenol degradation and hexavalent chromium (Cr(VI)) reduction via Fe(III)/Fe(II)
  transformation. Magnetite serves as an Fe(III) source that enriches Thiobacillus species to oxidize elemental sulfur to
  sulfate, completing the microbial sulfur cycle, increasing aggregate sulfur retention (6.85% vs 4.49% without magnetite),
  and lowering effluent Cr(VI) (18.0 mg/L vs 187.7 mg/L) and phenol (354.2 mgCOD/L vs 1256.0 mgCOD/L) under low-concentration
  sulfate conditions (doi:10.1016/j.cej.2020.124801).
