    explanation: Shows that enriched Thiobacillus species oxidize elemental sulfur to sulfate and reduce sulfur loss in the
      magnetite reactor.
- name: Coupled Anaerobic Phenol Degradation and Cr(VI) Reduction via Fe(III)/Fe(II) Transformation
  description: Whole sulfur cycling and dissimilatory Fe(III)/Fe(II) transformation in the magnetite-amended reactor significantly
    lower effluent Cr(VI) (18.0 mg/L vs 187.7 mg/L) and phenol (354.2 mgCOD/L vs 1256.0 mgCOD/L) while Fe(II) scavenges trace
    dissolved oxygen to prevent Cr(III) re-oxidation.
