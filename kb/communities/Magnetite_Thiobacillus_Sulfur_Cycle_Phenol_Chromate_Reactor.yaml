  evidence:
  - reference: doi:10.1016/j.cej.2020.124801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further analysis by X-ray Diffraction (XRD) and X-ray photoelectron spectroscopy (XPS) observed the disappearance
      of the crystalline structure in magnetite as well as the loss of iron via the dissimilatory Fe(III) reduction in the
      aggregates. However, under the sulphate-reducing conditions, the evident peaks of both Fe2O3 and FeO were detected in
      the aggregates.
    explanation: Confirms transformation of crystalline magnetite into Fe2O3 and FeO via dissimilatory Fe(III) reduction under
      sulfate-reducing conditions.
  - reference: doi:10.1016/j.cej.2020.124801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Considered that the re-oxidation of the reduced Cr(III) might occur in the aggregates without magnetite, the
      generated Fe(II) might react with the slight dissolved oxygen (DO) to reduce the re-oxidation of the reduced Cr(III),
      which further achieved the transformation of Fe(III)/Fe(II).
    explanation: Explains how Fe(II) generated via dissimilatory Fe(III) reduction scavenges trace dissolved oxygen to prevent
      Cr(III) re-oxidation.
