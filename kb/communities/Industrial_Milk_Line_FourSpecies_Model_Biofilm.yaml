discussions:
- discussion_id: milk_biofilm_mechanistic_and_perturbation_scope
  prompt: Which molecular and spatial mechanisms determine the condition-specific biofilm response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Biofilm Community Composition and Growth Interactions
  - ecological_interactions#Thiocillin-Biosynthesis-Dependent Kocuria Suppression
  - ecological_interactions#Condition-Specific Biofilm Response to Perturbation
  rationale: 'Retain both genetic-intervention arrows and positive omission/growth findings. The assay distinguishes
    initial/transient from continuous changes; it is not a mature-biofilm recovery experiment. Purified-molecule
    or complementation controls would further separate thiocillin I from biosynthetic-locus effects, without negating
    the existing knockout evidence. Protection of Kocuria by the other members could involve spatial shielding or
    adsorption but was not selectively resolved. Canonical Pseudomonas CLL49 spelling is preserved despite CCL49
    elsewhere in the paper. Prior cultivation-arm correction under #529 remains unchanged. Non-graph taxon roles
    and origin claims are preserved, not recertified.'
  posed_by: codex
  posed_date: '2026-10-06'
