- name: Thiocillin-Biosynthesis-Dependent Kocuria Suppression
  description: B. cereus tclE-H deletion removed anti-Kocuria activity in the plate assay and, when substituted
    into the four-species biofilm, increased Kocuria abundance by about 50-fold. This is positive genetic evidence
    for thiocillin-biosynthesis-dependent suppression, interpreted by the authors as thiocillin I action. Activity
    was mainly pellet-associated or unstable; a freely diffusible bulk-medium route is not established. The main
    text did not report complementation or a purified-thiocillin rescue. The observed negative growth effect does
    not require reciprocal harm to Bacillus.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:34964290
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: thiocillin I synthesized by the B. cereus strain
    explanation: Supports the positive controlled model-biofilm finding, interpreted within the tested community,
      endpoint and perturbations; not a universal ecological mechanism.
  - reference: PMID:34964290
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: impact on robustness by mutational analysis
    explanation: Supports the positive controlled model-biofilm finding, interpreted within the tested community,
      endpoint and perturbations; not a universal ecological mechanism.
  participating_taxa:
  - preferred_term: Bacillus cereus
    term:
      id: NCBITaxon:1396
      label: Bacillus cereus
  - preferred_term: Kocuria varians
    term:
      id: NCBITaxon:1272
      label: Kocuria varians
  downstream:
  - target: Biofilm Community Composition and Growth Interactions
    description: Replacing wild-type B. cereus with the tclE-H deletion mutant increased Kocuria abundance and changed
      the 72-hour four-species composition, supporting a causal contribution of the thiocillin-biosynthesis-dependent
      negative interaction under the tested biofilm conditions. This does not establish every mechanism in the wider
      interaction network.
  - target: Condition-Specific Biofilm Response to Perturbation
    description: The tclE-H mutant substitution changed the community response to initial Bacillus depletion and
      to continuous substrate/medium changes. The genetic intervention supports a condition-specific contribution
      to the measured response, not universal robustness, a mature-biofilm recovery trajectory or a fully isolated
      thiocillin I rescue mechanism.
- name: Condition-Specific Biofilm Response to Perturbation
  description: Wild-type biofilms established similar 72-hour compositions after the tested initial physiological-state
    and Bacillus-inoculum changes, while glass substitution and especially undiluted medium altered the community.
    The thiocillin-biosynthesis mutant changed responses to particular transient and continuous perturbations. This
    is an endpoint comparison during establishment, not a recovery time course after disrupting an already mature
    biofilm, a general colonization-facilitation mechanism or robustness to every disturbance. Neither community
    resisted strong continuous changes uniformly.
  scope: COMMUNITY_LEVEL
  biological_processes:
