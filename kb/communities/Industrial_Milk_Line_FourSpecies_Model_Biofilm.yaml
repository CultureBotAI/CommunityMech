id: CommunityMech:000152
name: Industrial Milk-Line Four-Species Model Biofilm
description: >
  A laboratory four-species bacterial biofilm model derived from an industrial milk pasteurization-line
  biofilm. The community contains Rhodocyclus sp., Pseudomonas fluorescens, Kocuria varians, and Bacillus
  cereus, forms reproducible biofilms, and was used to resolve dynamic positive and negative interspecies
  interactions, including a Bacillus cereus thiocillin I-mediated negative interaction that shapes species
  distribution and robustness.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Build a reproducible four-species biofilm model from a dairy-processing biofilm to study
    interaction networks, perturbation robustness, and molecular determinants of species distribution.
  assembly_strategy: Select four culturable bacterial species from an industrial milk pasteurization-line
    biofilm consortium and assemble them under laboratory biofilm growth conditions.
  perturbation_design: Initial transient perturbations, continuous perturbations, species-subset biofilms,
    and Bacillus cereus mutational analysis were used to infer interaction effects on robustness.
  measurement_endpoints:
  - biofilm growth dynamics
  - equilibrium species composition
  - perturbation robustness
  - positive and negative interaction network inference
  - thiocillin I mutational analysis
  evidence:
  - reference: doi:10.1002/mbo3.1254
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we constructed a biofilm community from four species
    explanation: Supports deliberate construction of the four-species model biofilm.
