ecological_interactions:
- name: Biofilm Community Composition and Growth Interactions
  description: Controlled species-subset biofilms and fitted growth curves support dynamic positive and negative
    effects in this four-species model. Rhodocyclus adhesion/early growth was facilitated, Pseudomonas development
    was delayed, and Kocuria abundance was suppressed. These distinct measured effects do not establish a community-wide
    cooperation benefit, competitive niche partitioning or a resolved physical shielding mechanism. Bacillus ATCC14579T
    was a laboratory substitution; canonical strain labels are preserved.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.1002/mbo3.1254
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: network of dynamic, positive, and negative interactions
    explanation: Supports the positive controlled model-biofilm finding, interpreted within the tested community,
      endpoint and perturbations; not a universal ecological mechanism.
  - reference: doi:10.1002/mbo3.1254
    supports: SUPPORT
    evidence_source: IN_VITRO
