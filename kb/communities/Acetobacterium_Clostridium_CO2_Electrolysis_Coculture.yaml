id: CommunityMech:000173
name: Acetobacterium woodii-Clostridium drakei CO2 Electrolysis Coculture
description: >
  A defined anaerobic synthetic coculture that combines a lactate-producing Acetobacterium woodii
  mutant with Clostridium drakei to convert CO2 and H2 into longer-chain products. A. woodii fixes
  CO2 with H2 and is engineered to release lactate, which C. drakei uses as an intermediate for
  chain elongation to caproic acid. The system is DOE-relevant because it couples microbial CO2
  valorization with in situ water electrolysis or CO2/H2 gas feeding for production of value
  chemicals.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert CO2 and H2 into lactate-mediated caproic acid production in a two-species
    anaerobic coculture.
  assembly_strategy: Bottom-up coculture assembled from a recombinant lactate-producing A. woodii
    strain and C. drakei wild type.
  perturbation_design: Studies tested in situ water electrolysis with an All-in-One electrode,
    direct H2 sparging, mixotrophic or autotrophic operation, and bioreactor optimization of the
    same A. woodii plus C. drakei species pair.
  measurement_endpoints:
  - Lactate accumulation
  - Caproic acid production
  - CO2 and H2 utilization
  - Hydrogen limitation under in situ electrolysis
  - Bioreactor productivity and product spectrum
  evidence:
  - reference: PMID:36619880
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Novel synthetic co-culture
    explanation: Supports the engineered synthetic coculture design.
  - reference: PMID:36619880
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: true carbon-negative production of value chemicals from CO2
    explanation: Supports the CO2-valorization objective for value-chemical production.
