  evidence:
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'A linear regression analysis indicated that the concentration of E. amylovora decreased over time in groups treated
      with antibacterial agents: antibacterial (A), pathway (P), antibacterial+pathway (AP), and antibacterial+network+pathway
      (ANP). For the control, the slope change over time was not statistically significant, with an R2 of 0.0227 (P > 0.05).
      The R2 values of the linear regression equations over time for each treatment are as follows: A was 0.7639 (P < 0.001),
      N was 0.52 (P < 0.001), ANP was 0.506 (P < 0.001), P was 0.354 (P < 0.01), AP was 0.2563 (P < 0.05), NP was 0.0141
      (P > 0.05), A+N was 0.0326 (P > 0.05).'
    explanation: Shows that the full ANP treatment produced a significant negative Erwinia density trajectory in apple flower
      exudate.
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When SynCom was co-cultivated with E. amylovora in extracts of apple flowers, a decrease in E. amylovora density
      was observed compared to its monoculture.
    explanation: Interprets the apple-flower-exudate co-culture as a nutrient-limited pathogen-density suppression assay.
environmental_factors:
- name: Fuji apple flower exudate nutrient limitation
  description: The nutrient-competition assay used disinfected Fuji apple flowers sonicated in water and filtered to produce
    the flower-exudate medium mixed with A+N+P SynCom cells and rifampicin-resistant E. amylovora TS3128.
  evidence:
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Apple flowers (cv. Fuji) were disinfected with 0.5 g in 70% ethanol for 30 s and then washed twice with ddH2O.
      The washed flowers were dried and then sonicated in 5 mL of ddH2O for 30 min. After sonication, the solution was filtered
      through a 0.45 μm filter, and to remove any residual debris, the supernatant was separated by centrifugation at 1,077
      ×g for 5 min.
    explanation: Describes the Fuji apple flower extraction, filtration, and centrifugation used to generate the limited-nutrient
      assay medium.
growth_media:
- name: R2A agar or broth with 0.5% mannitol
  temperature: '28'
  temperature_unit: °C
  incubation_time: 2-4
  incubation_time_unit: days
  preparation_notes: The follow-up genome analysis cultured SynCom strains on R2A agar or in broth supplemented with 0.5%
    mannitol before genome sequencing and nutrient utilization assays.
  evidence:
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All strains were cultured at 28°C for 2–4 days on R2A agar (0.5 g casamino acid hydrolysate, 0.5 g yeast extract,
      0.5 g proteose peptone, 0.5 g dextrose, 0.5 g soluble starch, 0.3 g dipotassium phosphate, 0.05 g magnesium sulfate,
      0.3 g sodium pyruvate and 15 g agar per L, pH 7.0–7.4) or broth media supplemented with 0.5% mannitol.
    explanation: Gives the R2A recipe and culture temperature/time used for the analyzed SynCom strains.
- name: Fuji apple flower exudate co-culture
  temperature: '28'
  temperature_unit: °C
  inoculum_size: 0.5 SynCom; 0.1 E. amylovora TS3128
  inoculum_unit: OD600
  inoculum_source: Equalized A, N, P, and A+N+P SynCom groups plus rifampicin-resistant Erwinia amylovora TS3128
  incubation_time: '72'
  incubation_time_unit: h
  preparation_notes: SynCom groups were mixed at OD600 0.5, combined 1:1:1 with OD600 0.1 Erwinia amylovora TS3128 and Fuji
    apple flower exudate, incubated shaking at 28 °C, and enumerated on 1/5 TSA with 50 micrograms/mL rifampicin at
    0, 24, 48, and 72 h.
  evidence:
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The E. amylovora suspension was adjusted to OD600 0.1, and the flower extract and SynCom mixture, containing
      the pathogen in a 1:1:1 ratio, were cultured at 28°C in a shaking incubator.
    explanation: Specifies the pathogen inoculum, flower-exudate/SynCom mixing ratio, and 28 °C shaking incubation.
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom strains were adjusted to an OD600 0.5 and mixed according to their respective groups. These mixtures were
      combined with OD600 0.1 E. amylovora and flower extracts in proportion.
    explanation: Gives the SynCom OD600 and confirms proportional combination with Erwinia and apple flower extracts.
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Subsequently, the cell density of E. amylovora was determined at 0, 24, 48, and 72 h on 1/5 TSA (6 g tryptic
      soy broth, 20 g agar per L) with 50 μg/mL rifampicin.
    explanation: Specifies the sampling times, 1/5 tryptic soy agar medium, and rifampicin concentration used to enumerate
      Erwinia amylovora density during co-cultivation.
