id: CommunityMech:000377
name: Apple Fire Blight A+N+P SynCom
description: 'A nine-member bacterial synthetic community assembled from three apple fire-blight biocontrol design groups:
  Streptomyces recifensis SN1E1 and Paenibacillus polymyxa AF2927 as direct anti-Erwinia amylovora strains, Labrys miyagiensis
  NBRC101365, Labrys okinawensis DSM18385, Novosphingobium mathurense SM117, Novosphingobium endophyticum EGI60015, and Terriglobus
  aquaticus 03SUJ4 as healthy apple network taxa, and Kitasatospora papulosa AF6313 plus Pseudomonas lundensis AB23 as pathway-associated
  strains. The full A+N+P mixture eliminated visible disease in Fuji apple fruit wounds, matched oxytetracycline at 1.67%
  disease severity in rose flowers, and reduced Erwinia amylovora TS3128 density in apple flower exudate during follow-up
  co-cultivation assays.'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Construct a defined SynCom that suppresses apple fire blight by combining direct anti-Erwinia amylovora activity,
    healthy-apple network taxa, and strains aligned to metabolic pathways enriched in non-infected apples.
  assembly_strategy: Assemble two antibacterial strains, five strains representing healthy-apple keystone network taxa, and
    two pathway-associated strains into A, N, and P groups; assay A, N, P, two-group combinations, and the full A+N+P nine-member
    community against Erwinia amylovora.
  inoculation_strategy: Normalize strains to OD600 0.2 for apple-fruit and rose-flower biocontrol assays or OD600 0.5 for
    apple-flower-exudate competition assays, combine equal amounts within each SynCom group, and combine group mixtures equally
    when multiple A/N/P groups are treated together.
  perturbation_design: Challenge untreated, Erwinia-only, single-group, two-group, and A+N+P SynCom treatments in Fuji apple
    fruit wounds, rose flower ovaries, two apple-plant inoculation protocols, and apple flower exudate co-cultures with rifampicin-resistant
    E. amylovora TS3128.
  measurement_endpoints:
  - Erwinia amylovora TS3128 inhibition zones
  - Fuji apple fruit fire-blight disease severity
  - rose flower fire-blight disease severity
  - apple plant fire-blight disease severity
  - apple root and stem endosphere bacterial composition
  - network/pathway strain genome features
  - Biolog PM1 and PM2A carbon source use
  - E. amylovora density in apple flower exudate
  notes: This record represents the full A+N+P formulation. Lee et al. 2025 reported 33.4% disease severity for EA+A+N+P in
    the apple-plant assay; the 5.4% apple-plant value cited in the abstract belongs to EA+P, not to the full nine-member community.
  evidence:
  - reference: PMID:40223277
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, a total of nine individual strains were employed to evaluate the suppression of fire blight. Two
      of the nine were selected for their antibacterial activity, five were nominated keystone taxa based on the apple microbiome
      network, and two were obtained as microbiota community metabolite-responsible agents. Table 1 presents the SynCom members
      and references.
    explanation: Defines the three antibacterial/network/pathway strain classes used to build the nine-member apple SynCom.
  - reference: PMID:40223277
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'In planta biological control assay for fire blight disease suppression in apple fruits involved nine experimental
      groups: untreated, EA (E. Amylovora), EA+each single group (A, N, P) inoculation, EA+combinations of two groups (A+N,
      N+P, A+P), and EA+three-groups combination (A+N+P).'
    explanation: Shows that the full A+N+P SynCom was directly tested against Erwinia amylovora in the apple-fruit challenge.
  - reference: PMID:40223277
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: All strains were suspended in sterile water and subsequently diluted to an OD600 of 0.2. For each group, an equal
      amount of each strain was combined, and then 1% CMC was added in a 1/10 ratio.
    explanation: Specifies the apple-fruit SynCom normalization and equal within-group mixing.
  - reference: PMID:40223277
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom mixture was prepared following the same procedures as in previous assay using fruits.
    explanation: Connects the rose-flower assay to the fruit-assay SynCom preparation.
  - reference: PMID:40223277
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: OD600 of 0.2 SynCom strains mixed with 1/10 of 1% CMC, were sprayed onto 15 plant surfaces. After 24 hours, scissors
      dipped in E. amylovora suspension (OD600 of 0.2) were used to cut 1st or 2nd leaf stems.
    explanation: Captures the cutting-inoculation apple-plant challenge protocol.
  - reference: PMID:40223277
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The assay was repeated by preparing same SynCom mixture and pathogenic suspension. The mixture was applied with
      a brush to incisions along the plant bark. After the SynCom dried, the same areas were inoculated with the pathogen.
    explanation: Captures the second apple-plant challenge protocol by brushing SynCom and pathogen into bark incisions.
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom consists of nine strains in total, including five keystone taxa (N group) within the microbiota network.
      Two strains were selected based on differences in metabolic pathways (P group), and two were antibacterial strains (A
      group) ( Lee et al., 2025 ).
    explanation: Confirms that the follow-up genomic and nutrient-competition paper studied the same nine-strain A/N/P SynCom
      design.
  - reference: PMID:40468884
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom was prepared by mixing strains adjusted to OD600 0.5 concentration in equal amounts for each group (A,
      N, and P groups). When more than two SynCom groups were treated, the mixture of each group was mixed in equal amounts
      for each group.
    explanation: Specifies the OD600 0.5 SynCom normalization and equal group mixing used in the apple-flower-exudate assay.
