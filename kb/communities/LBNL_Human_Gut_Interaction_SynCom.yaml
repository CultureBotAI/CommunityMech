ecological_interactions:
- name: Pairwise Model Prediction Of Community Dynamics
  description: A generalized Lotka-Volterra model trained on monospecies and pairwise time series predicted much
    of the tested 11- and 12-member community dynamics; additional full-community training improved predictions.
    PARTIAL - model success supports important pairwise effects in these conditions, not absence of higher-order
    effects, perfect prediction or universal acetate cross-feeding. Abundance inputs combined 16S proportions with
    OD600, not direct viable-cell counts.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This method was employed to decipher microbial interactions in a diverse human gut microbiome synthetic
      community.
    explanation: Defines the tested synthetic gut community; this context statement does not itself identify a metabolite
      mediator.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: pairwise interactions are major drivers of multi‐species community dynamics
    explanation: Supports the fitted model and experimental predictive comparison within the tested assemblages;
      higher-order effects are not categorically excluded.
  participating_taxa:
  - preferred_term: human gut bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Inferred Positive-Negative Ecological Network Topology
  description: The fitted 12-species gut network contains frequent negative and positive interaction coefficients,
    including coupled positive/negative pairwise motifs. These are effective ecological effects inferred from abundance
    dynamics. Their signs do not uniquely identify nutrient competition, cross-feeding, niche partitioning or molecular
    mechanisms; conditioned-medium and metabolomics results provide complementary but imperfect support.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Modeled Pairwise Coexistence Feedback
    description: PARTIAL - in the fitted pairwise gLV models, coupled positive and negative effects create negative
      feedback that limits the higher-fitness partner and permits coexistence with the lower-fitness partner across
      a broader tested growth-rate range than mutual inhibition. This preserves the source-supported model mechanism,
      not proof of a universal or molecularly resolved feedback in the entire gut community.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The inferred ecological network exhibits a high proportion of negative and frequent positive interactions.
    explanation: Supports signs of inferred gLV interaction coefficients, not uniquely identified molecular mechanisms.
  participating_taxa:
  - preferred_term: human gut bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Modeled Pairwise Coexistence Feedback
  description: Within the inferred pairwise gLV models, a positive/negative motif implements negative feedback that
    balances monospecies fitness differences and supports coexistence over a broader tested parameter range than
    mutual inhibition. The CH-ER pair provides an experimentally coexisting example. PARTIAL - the mathematical
    mechanism is model-bounded; neither its molecular mediator nor universal stability of the full 12-member system
    follows from this analysis.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: positive and negative interaction topology enables robust coexistence by implementing a negative feedback
      loop
    explanation: Supports a negative-feedback coexistence mechanism in analyzed pairwise gLV motifs, not demonstrated
      niche partitioning or a traced metabolite loop.
  participating_taxa:
  - preferred_term: human gut bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
environmental_factors:
- name: model-guided synthetic community design
  value: Lower-order assemblages were used to predict higher-dimensional human gut SynCom dynamics.
  description: Initial species proportions and lower-order community combinations were varied to predict
