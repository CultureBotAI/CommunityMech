cultivation_setup:
- cultivation_mode: OTHER
  system_type: OTHER
  instrument_detail: 96-well deep-well plates under a gas-permeable seal (Breathe Easy), arrayed by a Biomek liquid-handling
    robot.
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: Each strain inoculated at 0.01 OD600, so a multi-species assemblage starts at 0.01 x n; incubated
    without shaking. A parallel aliquot was read in a 384-well plate with shaking for OD600 every 30 min.
  notes: 'Serial-transfer cultivation: fresh-medium transfers every 24 h at 1:20 over 72 h. OTHER is used because
    the controlled vocabulary has no exact serial-transfer mode; the paper does not specify same-vessel draw-and-fill.
    Total initial density scales with community size (0.01 OD600 per strain), with distinct PW2 major/minor inocula.
    Deep-well cultures were static; parallel 384-well aliquots were shaken for OD600 readings. Separate monospecies
    metabolomics cultures supplemented only ER and FP with 33 mM acetate; this is not evidence of acetate cross-feeding
    in the community.'
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The microbial communities were arrayed using a liquid‐handling robot (Biomek) into 96‐well deep‐well
      plates covered with a gas‐permeable seal (Breathe Easy) and incubated at 37°C without shaking
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In multi‐species assemblages, the total initial OD600 was 0.01 OD600 × n, where n represents the
      number of strains in the community
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Serial transfers were performed at 24‐h intervals into fresh media using a 1:20 dilution.
    explanation: Exact repeated-transfer protocol; no continuous dilution rate or culture residence time inferred.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In parallel, aliquots of the communities were transferred into a 384‐well absorbance plate and grown
      in a Tecan Infinite F200 Pro plate reader with shaking for OD600 measurements at 30‐min intervals.
    explanation: Shaking applies to the parallel optical measurement, not the static deep-well community culture.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ER and FP were grown in ABB media supplemented with 33 mM acetate (Sigma).
    explanation: Bacterial culturing for metabolomics subsection only; no traced interspecies acetate transfer
      is shown.
discussions:
- discussion_id: lbnl_gut_effective_interactions_and_molecular_mechanisms
  prompt: Which molecular mechanisms realize the inferred signed interactions and feedback?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Pairwise Model Prediction Of Community Dynamics
  - ecological_interactions#Inferred Positive-Negative Ecological Network Topology
  - ecological_interactions#Modeled Pairwise Coexistence Feedback
  rationale: 'Remove the analytical inference-to-topology arrow, but retain topology-to-coexistence as a model-bounded
    causal mechanism. Acetate in the cited passage is a prior-literature example; separate metabolomics cultures
    supplemented ER and FP with acetate, which does not prove cross-feeding throughout this graph. Co-consumption/secretion
    only yields an ecological effect when relevant substrates limit growth, and conditioned-medium signs do not
    always match inferred coefficients. Higher-order effects, parameter uncertainty and OD-scaled abundance remain
    limitations. Canonical NCBITaxon:2 is only an aggregate placeholder for the 12-species experimental roster;
    #1548 tracks its grounding and non-graph metadata. No original figure pixels, separate supplements, raw data
    or executable model reproduction was performed.'
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: gut_roster_protocol_reassessment_20261115
  prompt: Which stock-resolved molecular transfers explain the model-inferred signed interactions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  - cultivation_setup
  - ecological_interactions
  rationale: The November2026 reassessment replaces the old aggregate roster and unsupported acetate-mediator
    assertion. Main Methods, Appendix, EV1-EV4 and stock grounding were inspected. Monospecies metabolite depletion/secretion
    and conditioned-medium responses nominate mechanisms but do not demonstrate direct transfer between named
    stocks. Acetate addition is confined to the ER/FP metabolomics protocol; it does not establish a community-wide
    mediator. CA GTDB is unresolved and PC has two crosswalk candidates; no individual stock genome is assigned.
    The previous October discussion records its historical review scope and remains unchanged.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the metabolite profiles failed to predict the influential role of EL in mediating community assembly,
      fitness, and diversity
    explanation: Explicit limit of the metabolomics-to-mechanism inference.
  posed_by: codex
  posed_date: '2026-11-15'
