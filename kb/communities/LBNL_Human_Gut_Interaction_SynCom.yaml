  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Pairwise Interaction-Dominated Community Dynamics
  description: Time-resolved measurements of lower-order assemblages showed that pairwise interactions,
    rather than higher-order interactions, are major drivers of the synthetic gut community dynamics.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Positive-Negative Ecological Network Topology
    description: Pairwise inference resolved both negative and positive interactions that together
      define the ecological network topology of the synthetic gut community.
  evidence:
  - *id001
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: pairwise interactions are major drivers of multi-species community dynamics
    explanation: Supports pairwise interactions, rather than only higher-order terms, as the principal
      drivers of the modeled synthetic gut community.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cross‐feeding of metabolic by‐products such as acetate in the gut microbiota is a prevalent
      mechanism that could alter environmental pH
    explanation: Names acetate as a representative cross-fed byproduct in the
      gut interactions modeled for the SynCom.
- name: Positive-Negative Ecological Network Topology
  description: The inferred human-gut SynCom network contains many negative interactions and frequent
    positive interactions that form the interaction topology of the community.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Robust Coexistence Feedback
    description: The mixed positive and negative topology enables feedback that balances differences
      in monospecies fitness and supports robust coexistence.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The inferred ecological network exhibits a high proportion of negative and frequent
      positive interactions.
    explanation: Supports the topology inferred from lower-order synthetic gut assemblages.
- name: Robust Coexistence Feedback
  description: Positive and negative interactions implement a stabilizing negative feedback loop that
    balances monospecies fitness differences and enables robust coexistence.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: positive and negative interaction topology enables robust coexistence by implementing
      a negative feedback loop
    explanation: Supports coexistence as an emergent property of the inferred interaction topology.
environmental_factors:
- name: model-guided synthetic community design
  value: Lower-order assemblages were used to predict higher-dimensional human gut SynCom dynamics.
  description: Initial species proportions and lower-order community combinations were varied to predict
    higher-dimensional dynamics.
  evidence:
  - *id001
related_ingredients:
- preferred_term: acetate
  chebi_term:
    id: CHEBI:15366
    label: acetic acid
  relevance: Canonical gut-microbial cross-fed by-product — Venturelli et al. 2018 invoke acetate as
    the paradigmatic cross-fed metabolite whose secretion and consumption between gut species alters
    environmental pH and underlies the conditioned-media interaction phenotypes they map.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cross‐feeding of metabolic by‐products such as acetate in the gut microbiota is a prevalent
      mechanism that could alter environmental pH
    explanation: Names acetate as the exemplar cross-fed metabolite mediating pairwise interactions
      in the gut SynCom.
growth_media:
- name: Anaerobic Basal Broth (ABB) (Oxoid)
  temperature: '37'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: 85% N2 / 5% H2 / 10% CO2
  incubation_time: '72'
  incubation_time_unit: h
  vessel_type: 96-well deep-well plate
  preparation_notes: Cultured in a Coy anaerobic chamber; synthetic assemblages arrayed
    into 96-well deep-well plates and incubated at 37°C without shaking; communities
    serially transferred at ~24 h intervals using a 1:20 dilution over 72 h.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: into 15 ml of Anaerobic Basal Broth (ABB) media (Oxoid) in an anaerobic
      chamber and incubated at 37°C without shaking.
    explanation: Names ABB medium, anaerobic chamber, 37°C, and no shaking for the
      synthetic human gut community.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cells were cultured in an anaerobic chamber (Coy Lab Products) using mixed
      gas tanks containing 85% N2, 5% H2, and 10% CO2.
    explanation: Gives the anaerobic chamber gas mix (85% N2, 5% H2, 10% CO2).
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 96-well deep-well plates under a gas-permeable seal (Breathe
    Easy), arrayed by a Biomek liquid-handling robot.
  operating_temperature: 37.0
  operating_temperature_unit: °C
  controls_notes: Each strain inoculated at 0.01 OD600, so a multi-species assemblage
    starts at 0.01 x n; incubated without shaking. A parallel aliquot was read in a
    384-well plate with shaking for OD600 every 30 min.
  notes: 'The inoculation rule is the interesting part and is why it is recorded
    verbatim: the community''s starting density scales with its size rather than being
    held constant, so a larger assemblage begins denser. Two of the pairwise designs
    depart from it deliberately (PW2 at 0.0158 and 0.0008 OD600 for major and minor
    strains). The deep-well plate is the culture; the shaken plate-reader aliquot is
    measurement, and its shaking is not the community''s condition.'
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The microbial communities were arrayed using a liquid‐handling robot
      (Biomek) into 96‐well deep‐well plates covered with a gas‐permeable seal
      (Breathe Easy) and incubated at 37°C without shaking
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In multi‐species assemblages, the total initial OD600 was 0.01 OD600 × n,
      where n represents the number of strains in the community
