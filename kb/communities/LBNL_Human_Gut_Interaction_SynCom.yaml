id: CommunityMech:000122
name: LBNL Human Gut Interaction SynCom
description: A diverse synthetic human gut microbiome community used with model-guided time-series experiments
  to infer pairwise ecological interactions and metabolic drivers of coexistence.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Infer ecological interaction structure and metabolic design principles in a synthetic human
    gut microbiome community.
  assembly_strategy: Defined human gut species were assembled into lower-order and higher-order consortia
    for time-resolved community measurements.
  perturbation_design: Initial species proportions and lower-order community combinations were varied
    to predict higher-dimensional dynamics.
  measurement_endpoints:
  - time-resolved abundance dynamics
  - ecological interaction network
  - extracellular metabolites
  - coexistence stability
  evidence:
  - &id001
    reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This method was employed to decipher microbial interactions in a diverse human gut microbiome
      synthetic community.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: human gut microbiome
  term:
    id: UBERON:0001007
    label: digestive system
  notes: Synthetic human-associated intestinal community studied in vitro.
taxonomy:
- taxon_term:
    preferred_term: human gut bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: NO_GTDB_EQUIVALENT
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Pairwise Gut Community Interactions
  description: Pairwise positive and negative interactions structure multi-species community dynamics.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: model-guided synthetic community design
  value: Lower-order assemblages were used to predict higher-dimensional human gut SynCom dynamics.
  description: Initial species proportions and lower-order community combinations were varied to predict
    higher-dimensional dynamics.
  evidence:
  - *id001
related_ingredients:
- preferred_term: acetate
  chebi_term:
    id: CHEBI:15366
    label: acetic acid
  relevance: Canonical gut-microbial cross-fed by-product — Venturelli et al. 2018 invoke acetate as
    the paradigmatic cross-fed metabolite whose secretion and consumption between gut species alters
    environmental pH and underlies the conditioned-media interaction phenotypes they map.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cross-feeding of metabolic by-products such as acetate in the gut microbiota is a prevalent
      mechanism that could alter environmental pH
    explanation: Names acetate as the exemplar cross-fed metabolite mediating pairwise interactions
      in the gut SynCom.
growth_media:
- name: Anaerobic Basal Broth (ABB) (Oxoid)
  temperature: '37'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  headspace_gas: 85% N2 / 5% H2 / 10% CO2
  incubation_time: '72'
  incubation_time_unit: h
  vessel_type: 96-well deep-well plate
  preparation_notes: Cultured in a Coy anaerobic chamber; synthetic assemblages arrayed
    into 96-well deep-well plates and incubated at 37°C without shaking; communities
    serially transferred at ~24 h intervals using a 1:20 dilution over 72 h.
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: into 15 ml of Anaerobic Basal Broth (ABB) media (Oxoid) in an anaerobic
      chamber and incubated at 37°C without shaking.
    explanation: Names ABB medium, anaerobic chamber, 37°C, and no shaking for the
      synthetic human gut community.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cells were cultured in an anaerobic chamber (Coy Lab Products) using mixed
      gas tanks containing 85% N 2 , 5% H 2 , and 10% CO 2 .
    explanation: Gives the anaerobic chamber gas mix (85% N2, 5% H2, 10% CO2).
