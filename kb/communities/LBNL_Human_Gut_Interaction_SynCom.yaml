- name: Modeled Pairwise Coexistence Feedback
  description: The fitted CH-ER pairwise gLV model contains a positive CH-to-ER coefficient and a negative ER-to-CH
    coefficient, forming the source's model-bounded negative-feedback coexistence motif (Figure4B/C). Source/target
    name the positive limb; the reverse inhibitory limb is part of the coupled motif. CH is Peptacetobacter hiranonis
    DSM13275 (paper Clostridium hiranonis); ER is Agathobacter rectalis ATCC33656 (paper Eubacterium rectale).
    The model comparison supports coexistence across broader tested growth-rate regimes than mutual inhibition,
    not a demonstrated molecular mediator or a feedback involving all twelve members.
  scope: PAIRWISE
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: positive and negative interaction topology enables robust coexistence by implementing a negative
      feedback loop
    explanation: Supports a negative-feedback coexistence mechanism in analyzed pairwise gLV motifs, not demonstrated
      niche partitioning or a traced metabolite loop.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The inferred pairwise network for the CH, ER community exhibited coupled positive and negative interactions
    explanation: Figure4B/C and retained CodeEV1 T3 specify the CH-ER motif. This is computational pairwise attribution,
      not twelve-member or molecular-transfer evidence.
