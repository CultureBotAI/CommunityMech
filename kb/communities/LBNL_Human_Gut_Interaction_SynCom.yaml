id: CommunityMech:000122
name: LBNL Human Gut Interaction SynCom
description: A defined twelve-stock anaerobic human-gut model studied in laboratory serial-transfer cultures.
  Monospecies, pairwise and full/single-dropout assemblages support fitted effective ecological interactions and
  model-bounded coexistence analyses; metabolomics suggests candidate mechanisms rather than demonstrating specific
  interspecies metabolite transfer.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Infer effective ecological interaction structure and test model predictions in a defined twelve-stock
    human gut model.
  assembly_strategy: The twelve Methods stocks were combined as monospecies, pairwise, full-community and single-species
    dropout assemblages. Full and dropout arms below describe intended inoculated membership, not an assertion
    of constant realized composition.
  perturbation_design: PW1 used approximately equal initial OD600 contributions; PW2 used reciprocal 95:5 proportions,
    with Methods specifying major/minor inocula of 0.0158/0.0008 OD600. Full and all twelve single-stock dropout
    assemblages were monitored with serial 1:20 transfers every 24 h over 72 h.
  measurement_endpoints:
  - time-resolved abundance dynamics
  - ecological interaction network
  - extracellular metabolites
  - coexistence stability
  evidence:
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This method was employed to decipher microbial interactions in a diverse human gut microbiome synthetic
      community.
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For PW2, the major and minor strains were inoculated at 0.0158 and 0.0008 OD600, respectively.
    explanation: PW2 inoculation rule, separate from PW1 and full/dropout designs.
  - reference: PMID:29930200
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: time‐resolved measurements of relative abundance of the full (12‐member) and all single‐species dropout
      communities
    explanation: Defines the full and all single-dropout arm set; Figure3 and DatasetEV3 distinguish their membership.
