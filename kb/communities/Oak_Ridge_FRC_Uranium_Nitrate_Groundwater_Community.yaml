  downstream:
  - target: Contaminant-Selected Rhodanobacter Dominance
    description: Rhodanobacter tolerance to the low-pH U(VI)-Mn(II)-Al(III)-Cd(II)-
      Zn(II)-Co(II)-Ni(II) ion mixture identifies a selective mechanism for the
      Rhodanobacter enrichment observed in the most contaminated FRC wells.
  - target: Mixed Metal and Nitrate Reduction Potential
    description: Mixed metal tolerance defines the contaminated groundwater guilds
      that retain uranium, nitrate, and iron reduction potential under the high-stress
      conditions of well FW113-47.
  evidence:
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: low pH and high UO_{2}^{2+}, Mn^{2+}, Al^{3+}, Cd^{2+}, Zn^{2+}, Co^{2+},
      and Ni^{2+} are both (a) selectively inhibitory of a Pseudomonas isolate from an uncontaminated
      well vs. a Rhodanobacter isolate from a contaminated well
    explanation: Supports low pH and mixed metal ions as selective pressures favoring
      Rhodanobacter over less tolerant Oak Ridge groundwater isolates.
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: few isolates aside from Rhodanobacter can tolerate these eight ions.
    explanation: Supports the site-wide rarity of mixed-ion tolerance outside
      Rhodanobacter isolates.
