id: CommunityMech:000136
name: Oak Ridge FRC Uranium-Nitrate Groundwater Community
description: A natural contaminated-groundwater microbial community from the U.S. DOE Oak Ridge Field
  Research Center, where groundwater wells span strong gradients in acidity, nitrate, uranium, and other
  metal contaminants. Clone-library and isolate studies link geochemistry to community structure, with
  lower diversity in highly contaminated wells and enrichment of organisms capable of uranium, nitrate,
  and iron reduction. This record represents the field community, distinct from existing defined ENIGMA
  denitrifying SynCom records derived from Oak Ridge isolates.
