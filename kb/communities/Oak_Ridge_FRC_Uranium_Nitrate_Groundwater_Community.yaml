  description: Low pH plus U(VI), Mn(II), Al(III), Cd(II), Zn(II), Co(II), and Ni(II)
    form a mixed-ion stress regime that Rhodanobacter isolates from contaminated Oak Ridge
    FRC wells tolerate better than most non-Rhodanobacter isolates from the site.
