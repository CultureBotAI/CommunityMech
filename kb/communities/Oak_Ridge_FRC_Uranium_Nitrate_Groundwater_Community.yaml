ecological_interactions:
- name: Low-pH Mixed-Ion Rhodanobacter Tolerance
  description: 'R2A dose-response and mixture assays support differential tolerance to low pH and seven metal ions:
    uranyl, manganese, aluminium, cadmium, zinc, cobalt and nickel. Eight Rhodanobacter isolates from contaminated
    wells grew under the pH-4 mixture, whereas 186 tested isolates from uncontaminated wells did not. This is an
    isolate-panel result, not a whole-groundwater-community perturbation or universal genus trait; strain provenance
    is confounded with genus, and some Pseudomonas isolates tolerate neutral-pH mixtures.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: uranyl ion
    term:
      id: CHEBI:43515
      label: dioxouranium(2+)
  - preferred_term: manganese(2+)
    term:
      id: CHEBI:29035
      label: manganese(2+)
  - preferred_term: aluminium(3+)
    term:
      id: CHEBI:49470
      label: aluminium(3+)
  - preferred_term: cadmium(2+)
    term:
      id: CHEBI:48775
      label: cadmium(2+)
  - preferred_term: zinc(2+)
    term:
      id: CHEBI:29105
      label: zinc(2+)
  - preferred_term: cobalt(2+)
    term:
      id: CHEBI:48828
      label: cobalt(2+)
  - preferred_term: nickel(2+)
    term:
      id: CHEBI:49786
      label: nickel(2+)
  biological_processes:
  - preferred_term: response to metal ion
    term:
      id: GO:0010038
      label: response to metal ion
  downstream:
  - target: Contaminant-Selected Rhodanobacter Dominance
    description: PARTIAL - Differential survival under low-pH mixed-metal stress supplies an experimentally supported
      selection mechanism for field Rhodanobacter enrichment when relevant ions reach inhibitory concentrations.
      This combines isolate perturbations with field abundance/geochemistry, not an in situ manipulation or proof
      that nitrate toxicity selects Rhodanobacter. Organic matter, speciation and strain provenance limit transfer
      of thresholds to groundwater.
  evidence:
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: few isolates aside from Rhodanobacter can tolerate these eight ions.
    explanation: Preserves the observed mixture-tolerance result; the eight selective ions include protons, not
      eight metals.
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: selectively inhibitory of non-Rhodanobacter isolates from uncontaminated wells
    explanation: Supports differential isolate susceptibility, not a universal property of all Pseudomonas or field
      populations.
- name: Contaminant-Selected Rhodanobacter Dominance
  description: PARTIAL - Rhodanobacter genus enrichment in the most contaminated groundwater wells is consistent
    with the experimentally supported acid/mixed-metal tolerance mechanism. The field association and isolate perturbations
    support selective filtering, not demonstrated niche partitioning, species-resolved denitrification flux or universal
    Rhodanobacter resistance. Nitrate is a correlated co-contaminant and possible electron acceptor, not a selectively
    toxic driver in the tested strain comparison.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: uranyl ion
    term:
      id: CHEBI:43515
      label: dioxouranium(2+)
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  evidence:
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: In the most contaminated wells, the microbial community is enriched in the Rhodanobacter genus.
    explanation: Directly supports genus-level field enrichment, not a resolved species assignment.
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: few isolates aside from Rhodanobacter can tolerate these eight ions.
    explanation: Supplies the isolate-selection mechanism with strain/condition limits.
- name: Mixed Metal and Nitrate Reduction Potential
  description: PARTIAL - The four-well 16S clone-library study associates taxa in FW113-47 with previously recognized
    uranium-, nitrate- and iron-reducing capabilities and identifies bioremediation potential across the wells.
    The accessible abstract does not quantify community reduction rates or metabolite exchange. This redox-capacity
    inference is distinct from the later mixed-ion isolate-tolerance experiment; it does not demonstrate cross-feeding
    or prove that tolerant Rhodanobacter drive uranium immobilization.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  biological_processes:
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  evidence:
  - reference: PMID:22988623
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Metal-reducing bacteria were present in all four wells, which may suggest that there is potential for
      successful bioremediation of the groundwater at the Oak Ridge FRC.
    explanation: Supports taxon-associated redox potential in the field survey, not measured reduction flux, chemical
      speciation or interspecies transfer.
  - reference: PMID:22988623
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: The high concentrations of contaminants present in well FW113-47 stimulated the growth of organisms
      capable of reducing uranium (Shewanella and Pseudomonas), nitrate (Pseudomonas, Rhodanobacter and Xanthomonas)
      and iron (Stenotrophomonas), and which were unique to this well.
    explanation: Supports taxon-associated redox potential in the field survey, not measured reduction flux, chemical
      speciation or interspecies transfer.
environmental_factors:
- name: Groundwater pH, nitrate, uranium, and metals
  value: pH 3 to 7; nitrate 44 to 23,400 mg/L; uranium 0.73 to 60.36 mg/L
  description: Oak Ridge FRC groundwater wells span strong geochemical gradients that correlate with bacterial
    diversity and contaminant-linked membership.
  evidence:
  - reference: PMID:22988623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Four groundwater wells (GW835, GW836, FW113-47 and FW215-49) with a wide range of pH
      (3 to 7), nitrate (44 to 23,400 mg L(-1)), uranium (0.73 to 60.36 mg L(-1)) and other metal contamination,
      were investigated.
    explanation: Supports the field geochemical conditions used in this record.
- name: Diversity loss under high contamination
  value: lower gene diversity in highly contaminated well FW113-47
  description: Highly contaminated groundwater showed lower bacterial gene diversity than less contaminated
    wells, indicating contaminant filtering of the community.
  evidence:
  - reference: PMID:22988623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Microbial diversity decreased in relation to the contamination levels of the wells.
    explanation: Supports contaminant-associated loss of diversity.
- name: Selective metal ion stress
  value: low pH with UO2(2+), Zn(2+), Co(2+), Ni(2+), and other selective ions
  description: Ion-mixture assays indicate that uranium and multiple heavy-metal ions contribute to the
    selective pressure favoring Rhodanobacter over less tolerant groundwater isolates.
  evidence:
  - reference: PMID:30523276
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: low pH and high UO_{2}^{2+}, Mn^{2+}, Al^{3+}, Cd^{2+}, Zn^{2+}, Co^{2+},
      and Ni^{2+} are both (a) selectively inhibitory of a Pseudomonas isolate from an uncontaminated
      well vs. a Rhodanobacter isolate from a contaminated well
    explanation: Supports the nickel, cobalt, zinc, and uranium metal-contaminant relevance recorded
      for this community.
related_ingredients:
- preferred_term: uranyl ion
  chebi_term:
    id: CHEBI:43515
    label: dioxouranium(2+)
  relevance: Uranyl is the dominant aqueous U(VI) species in the contaminated
    Oak Ridge FRC groundwater and is the substrate stimulated U-reducing
    organisms (Shewanella, Pseudomonas) act on; any environment-analog medium
    designed to recapitulate FRC reducing zones would need uranyl as the
    primary metal contaminant.
  evidence:
  - reference: PMID:22988623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: stimulated the growth of organisms capable of reducing uranium
      (Shewanella and Pseudomonas)
    explanation: Anchors uranyl as the metal-contaminant substrate driving
      the bioremediation-relevant microbial guild at FRC.
- preferred_term: nitrate
  chebi_term:
    id: CHEBI:17632
    label: nitrate
  relevance: Nitrate is the co-contaminant (44 to 23,400 mg/L) that defines
    the redox landscape of FRC wells alongside uranium; a cultivation medium
    for FRC nitrate-reducers (Pseudomonas, Rhodanobacter, Xanthomonas) would
    need nitrate at high concentration as both selective stressor and electron
    acceptor.
  evidence:
  - reference: PMID:22988623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: nitrate (44 to 23,400 mg L(-1))
    explanation: Anchors nitrate as the quantitatively dominant inorganic
      co-contaminant alongside uranium in FRC groundwater.
- preferred_term: iron(3+)
  chebi_term:
    id: CHEBI:29034
    label: iron(3+)
  relevance: Iron is the third redox-active metal at FRC, with iron-reducing
    organisms (Stenotrophomonas) selectively stimulated in the most
    contaminated wells; an environment-analog medium would need Fe(III) as
    an electron acceptor option.
  evidence:
  - reference: PMID:22988623
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: iron (Stenotrophomonas), and which were unique to this well
    explanation: Anchors iron reduction as a selectively stimulated metabolic
      activity in FRC contaminated groundwater.
