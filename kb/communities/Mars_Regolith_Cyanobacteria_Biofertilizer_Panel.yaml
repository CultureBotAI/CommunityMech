# No ecological_interactions block: the four members were assayed individually in the
# regolith extract (never co-cultured), so no interspecies interaction was measured. The
# biofertilizer effect on Lemna minor is a downstream application of end-of-life biomass,
# captured in the description and environmental_factors rather than as an interaction.
environmental_factors:
- name: Mars regolith simulant (MGS-1) extract as sole nutrient resource
  value: MGS-1 regolith extract culture medium
  description: >
    The panel was grown using only martian resources — water and a Mars Global Simulant
    (MGS-1) regolith extract used as culture medium — under an Earth-like atmosphere,
    testing In-Situ Resource Utilization for phototroph cultivation on Mars.
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grow using only the resources existing in Mars, i.e., water and Martian regolith stimulant (MGS-1)
    explanation: Supports MGS-1 regolith extract plus water as the sole nutrient resource.
- name: End-of-life biomass biofertilization of Lemna minor
  value: Lemna minor dry-weight stimulation
  description: >
    End-of-life cyanobacteria/microalga biomass was applied as a biofertilizing agent to
    the macrophyte Lemna minor, stimulating dry-weight biomass to levels comparable to
    standard synthetic medium; the highest yield was reached with Arthrospira platensis.
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: possible contribution of end-of-life cyanobacteria/microalga as biofertilizing agents
    explanation: Supports the biofertilizing use of end-of-life biomass on the Lemna minor plant model.
growth_media:
- name: MGS-1 Mars Global Simulant aqueous regolith extract (test medium)
  preparation_notes: Regolith suspended in ultrapure water at 4:1 (v:w), autoclaved 121 C for 1 h, particulates
    settled at room temperature, centrifuged 4,111 x g at 14 C for 5 min, and the overlying fraction re-autoclaved
    at 121 C for 30 min. Elemental composition was determined by total X-ray fluorescence; it is not restated
    here as a component list because the source reports it as a measured spectrum rather than a formulated
    recipe.
  temperature: 20
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  light_regime: '16 h light : 8 h dark photoperiod, cool white fluorescent tubes'
  light_intensity: 7
  light_intensity_unit: umol photons m-2 s-1
  vessel_type: 100 mL Erlenmeyer flask containing 50 mL of medium
  incubation_time: 25
  incubation_time_unit: d
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Suspensions of the regolith in ultrapure water were prepared following a 4:1 (v:w) ratio,\
      \ and then autoclaved at 121\xB0C for 1 h. The autoclaved suspension was left for the settling of\
      \ particulate material at room temperature, and then centrifuged (4,111 \xD7 g, 14\xB0C, 5 min)\
      \ for the final collection of the overlying fraction. This aqueous extract was autoclaved again\
      \ (121\xB0C, 30 min) to ensure sterilization."
    explanation: Gives the extract preparation and sterilisation.
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This simulant was used to prepare an aqueous extract serving as the growth medium for cyanobacteria
      and microalgae
    explanation: States the extract served as the growth medium for the cyanobacteria and microalgae.
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A Martian regolith extract was produced and used as a culture medium to grow these species.
      Their growth was assessed during a period of 25 days, using optical density and fluorometric parameters.
    explanation: Gives the 25-day growth assessment period.
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cultures were kept in 100 mL Erlenmeyer vessels with 50 mL of medium in an incubation\
      \ chamber at 20 \xB1 2\xB0C with 16-h light:8-h dark photoperiod (7 \u03BCmol of photons m\u2013\
      2 s\u20131; Quantum meter MQ-200, Apogee Instruments, Logan, UT, United States) provided by cool\
      \ white fluorescent tubes."
    explanation: Gives vessel, working volume, temperature, photoperiod and light intensity.
- name: Woods Hole MBL synthetic medium (maintenance and control)
  preparation_notes: Long-term laboratory maintenance medium for Anabaena cylindrica PCC 7122, Nostoc
    muscorum UTAD_N213 and Chlorella vulgaris. For the experiment all species were held at 17% synthetic
    medium / 83% ultrapure water, the maximal dilution supporting growth.
  temperature: 20
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  light_regime: '16 h light : 8 h dark photoperiod, cool white fluorescent tubes'
  light_intensity: 7
  light_intensity_unit: umol photons m-2 s-1
  vessel_type: 100 mL Erlenmeyer flask containing 50 mL of medium
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cultures are established for many years in our laboratory in Woods Hole MBL synthetic medium
      ( Nichols, 1973 ) or in Spirulina medium (for the culturing of A. platensis).
    explanation: Names MBL synthetic medium as the maintenance medium.
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All species were progressively acclimated for more than 6 months to a minimum nutrient supply
      (17% of synthetic media and 83% of ultrapure water, determined in preliminary trials as the maximal
      dilution supporting cell growth within the defined experimental period).
    explanation: Gives the 17%/83% nutrient-limited acclimation.
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cultures were kept in 100 mL Erlenmeyer vessels with 50 mL of medium in an incubation\
      \ chamber at 20 \xB1 2\xB0C with 16-h light:8-h dark photoperiod (7 \u03BCmol of photons m\u2013\
      2 s\u20131; Quantum meter MQ-200, Apogee Instruments, Logan, UT, United States) provided by cool\
      \ white fluorescent tubes."
    explanation: Gives vessel, temperature, photoperiod and light intensity.
- name: Spirulina medium (Arthrospira platensis only)
  preparation_notes: Used specifically for A. platensis UTEX LB 2340 rather than MBL medium; the record
    is a panel in which species were cultured separately, so the base medium differs by species and both
    are recorded rather than collapsed into one.
  temperature: 20
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  vessel_type: 100 mL Erlenmeyer flask containing 50 mL of medium
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cultures are established for many years in our laboratory in Woods Hole MBL synthetic medium
      ( Nichols, 1973 ) or in Spirulina medium (for the culturing of A. platensis).
    explanation: Names Spirulina medium as the medium used for A. platensis.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: FLASK
  instrument_detail: '100 mL Erlenmeyer vessels holding 50 mL of medium in an incubation chamber, illuminated
    by cool white fluorescent tubes on a 16 h light : 8 h dark photoperiod at 7 umol photons m-2 s-1 (Quantum
    meter MQ-200, Apogee Instruments).'
  working_volume: 50
  working_volume_unit: mL
  operating_temperature: 20
  operating_temperature_unit: "\xB0C"
  temperature_controlled: true
  controls_notes: Incubation chamber held 20 +/- 2 C. No pH or dissolved-oxygen control is reported, so
    ph_controlled and do_controlled are left unset rather than asserted.
  notes: Species were grown separately as a panel, not as a co-culture, so this setup describes the shared
    chamber conditions; the base medium differs by species (see growth_media). Growth was followed for
    25 days by optical density and fluorometry, after which end-of-life biomass was tested as a biofertiliser
    for Lemna minor over a further 7 days.
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cultures were kept in 100 mL Erlenmeyer vessels with 50 mL of medium in an incubation\
      \ chamber at 20 \xB1 2\xB0C with 16-h light:8-h dark photoperiod (7 \u03BCmol of photons m\u2013\
      2 s\u20131; Quantum meter MQ-200, Apogee Instruments, Logan, UT, United States) provided by cool\
      \ white fluorescent tubes."
    explanation: Gives vessel, working volume, chamber temperature, photoperiod and light intensity.
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A Martian regolith extract was produced and used as a culture medium to grow these species.
      Their growth was assessed during a period of 25 days, using optical density and fluorometric parameters.
    explanation: Gives the batch growth period and how growth was measured.
