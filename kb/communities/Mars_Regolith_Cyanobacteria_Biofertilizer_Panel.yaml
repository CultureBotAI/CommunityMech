id: CommunityMech:000309
name: Mars Regolith Cyanobacteria/Microalga Biofertilizer Panel
description: >
  A defined four-member panel of photosynthetic microorganisms evaluated for their
  ability to grow using only martian resources (water and Mars Global Simulant MGS-1
  regolith extract) under an Earth-like atmosphere, as candidates to support Mars
  colonization through oxygen and biomass production. The panel comprises three
  cyanobacteria — Anabaena cylindrica, Nostoc muscorum (NCBI Taxonomy: Desmonostoc
  muscorum), and Arthrospira platensis (NCBI Taxonomy: Limnospira platensis) — and the
  green microalga Chlorella vulgaris. Each species was grown separately in a martian
  regolith extract culture medium and monitored for 25 days by optical density and
  fluorometric parameters; Nostoc muscorum grew best, while Arthrospira platensis and
  Chlorella vulgaris did not thrive on the regolith extract. End-of-life biomass was
  then tested as a biofertilizing agent for the macrophyte Lemna minor, stimulating
  plant biomass to levels comparable to standard synthetic medium. The panel is an
  In-Situ Resource Utilization model for bioregenerative life support on Mars. Members
  were assayed individually, so the record captures a shared capacity to grow on
  martian regolith resources rather than measured interspecies interactions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: EXTREME_ENVIRONMENT
engineering_design:
  objective: >
    Evaluate whether cyanobacteria and a green microalga can grow using only martian
    resources (water plus Mars regolith simulant MGS-1 extract) under an Earth-like
    atmosphere, and whether their end-of-life biomass can act as a biofertilizer, as
    candidates to support Mars colonization.
  assembly_strategy: >
    Assemble a four-member photosynthetic panel (Anabaena cylindrica, Nostoc muscorum,
    Arthrospira platensis, Chlorella vulgaris), produce a martian regolith (MGS-1)
    extract as culture medium, and grow each species separately; then apply end-of-life
    biomass as a biofertilizing agent to the macrophyte model Lemna minor.
  perturbation_design: >
    Culture medium was the primary designed variable: a Mars regolith (MGS-1) extract
    versus standard synthetic medium, with growth monitored for 25 days.
  measurement_endpoints:
  - Growth of each species on Mars regolith extract over 25 days (optical density, fluorometric parameters)
  - Biofertilizing effect of end-of-life biomass on Lemna minor dry-weight biomass
  - FTIR-ATR spectral differences (polysaccharide-related) in plants grown with vs without regolith
  evidence:
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grow using only the resources existing in Mars, i.e., water and Martian regolith stimulant (MGS-1)
    explanation: States the objective of growing the panel using only martian resources (water plus MGS-1 regolith).
  - reference: PMID:35865930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: possible contribution of end-of-life cyanobacteria/microalga as biofertilizing agents
    explanation: Supports the biofertilizer arm of the design using end-of-life biomass.
environment_term:
  preferred_term: Mars regolith (MGS-1) extract culture assay (laboratory culture)
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >
    The community is a controlled laboratory culture assay in a Mars regolith simulant
    (MGS-1) extract under an Earth-like atmosphere, not a sampled natural community. The
    ENVO grounding reflects the controlled experimental setting; the martian regolith
    resource context is captured in modeled_environment and environmental_factors.
