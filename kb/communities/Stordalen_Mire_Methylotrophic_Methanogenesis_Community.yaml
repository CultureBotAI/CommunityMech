growth_media: []
related_ingredients:
- preferred_term: methanol
  chebi_term:
    id: CHEBI:17790
    label: methanol
  relevance: Methanol is the dominant methylated oxygen substrate exploited by
    Stordalen Mire methanogens (Methanosarcinales, Methanobacteriales) and by
    bacterial methylotrophs across the thaw gradient; any cultivation medium
    designed around this community would need methanol as a primary C1 substrate.
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the use of methylated oxygen compounds (e.g., methanol)
    explanation: Anchors methanol as the headline methylated substrate routed
      through Stordalen methanogens in the Ellenbogen et al. multi-omics study.
- preferred_term: methylamines
  chebi_term:
    id: CHEBI:16830
    label: methylamine
  relevance: Methylamines are the primary substrates implicated for
    Methanomassiliicoccales in this community and define one of the two main
    methylotrophic methanogenesis routes the paper documents at Stordalen.
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: primarily implicated methyl sulfides and methylamines
    explanation: Anchors methylamines as one of the two primary methylated
      substrate classes driving methanogenesis in the Mire.
- preferred_term: acetate
  chebi_term:
    id: CHEBI:30089
    label: acetate
  relevance: Bacterial methylotrophs at Stordalen produce acetate as a
    by-product that then feeds acetoclastic methanogenesis in the fen and bog
    stages of the thaw gradient, making acetate an environmentally pivotal
    intermediate for any cultivation medium targeting the community.
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: some methylotrophic bacteria are known to produce methanogenic
      by-products like acetate
    explanation: Anchors acetate as a methylotrophy-derived by-product feeding
      into Stordalen methanogenesis.
