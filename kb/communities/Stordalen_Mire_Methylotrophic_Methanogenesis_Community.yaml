- name: Proposed Methylated-Substrate Niche Partitioning
  description: 'HYPOTHESIZED/PARTIAL: metabolite detection and differing methyltransferase expression led the authors
    to propose methylated-substrate niche partitioning in the fen. Retain this source proposal, not demonstrated
    substrate uptake, reduced competition or an established bog-and-fen partitioning mechanism.'
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methanol
    term:
      id: CHEBI:17790
      label: methanol
  downstream:
  - target: Methanogenic Methylotrophic Potential and Expression
    description: 'HYPOTHESIZED/PARTIAL: differing inferred substrate preferences could support co-occurring methylotrophic
      pathways among fen methanogens. The expression and metabolite evidence motivates this existing direction but
      does not isolate niche partitioning as its cause, measure substrate-specific flux or demonstrate reduced competition.'
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Metabolomic analyses revealed the presence of diverse methylated compounds in the Mire
    explanation: Supports detected environmental methylated compounds, not uptake by a particular methanogen or
      reduced competition.
    computational_provenance:
      prediction_type: OTHER
      parameters: Source-reported metabolomic compound identification by LC-MS/NMR interpreted alongside genome-resolved
        omics. Metabolite presence does not assign uptake to a particular population; raw spectra were not reanalyzed.
  - reference: PMID:38063415
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Our expression data also hint at methylotrophic niche partitioning that may occur in the fen
    explanation: Explicitly supports the authors qualified fen niche interpretation, not demonstrated competition
      reduction.
    computational_provenance:
      prediction_type: OTHER
      parameters: Source integration of methanogen gene assignments and mapped transcript expression with environmental
        metabolites. Substrate preferences and fen niche partitioning are interpretations, not direct uptake or
        competition measurements.
  participating_taxa:
  - preferred_term: Stordalen Mire methanogenic archaea
    term:
      id: NCBITaxon:2157
      label: Archaea
- name: Thaw-Stage Methylotrophic Expression Patterns
  description: Field omics support bacterial methylotrophic expression in palsa and both bacterial and methanogenic
    methylotrophic expression in bog and fen. This is a habitat-associated expression pattern, not measured pathway-specific
    production rates or evidence that the pattern itself causes the same activities. No niche-partitioning classification
    is assigned to this gradient observation.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the most frozen non-methanogenic palsa found to host bacterial methylotrophy
    explanation: Supports the source habitat-associated omics interpretation, not direct pathway-rate measurements
      or a separate causal driver.
    computational_provenance:
      prediction_type: OTHER
      parameters: Source comparison of annotated methylotrophy-associated transcripts across palsa, bog and fen
        field samples. Expression is used as an activity indicator, not a measured methane production rate.
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: partially thawed bog and fully thawed fen seen to house both methanogenic and bacterial methylotrophic
