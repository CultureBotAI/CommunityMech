    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Of the 36 methanogen MAGs identified as being active in this data set, 10 expressed genes for methylotrophy
    explanation: Supports methylotrophy-associated transcript evidence in methanogen MAGs, not direct methane flux
      or thermodynamic dependence.
