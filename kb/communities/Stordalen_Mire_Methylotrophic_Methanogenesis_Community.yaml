- name: Methylated-Compound Substrate Niche Partitioning
  description: Metabolomics detected diverse methylated compounds, and
    methanogen orders differed in inferred methylated substrate use, suggesting
    substrate-based partitioning of methylotrophic activity in bog and fen
    methanogen communities.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methanol
    term:
      id: CHEBI:17790
      label: methanol
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Metabolomic analyses revealed the presence of diverse methylated compounds in the Mire
    explanation: Supports availability of methylated substrates in the community environment.
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Methanosarcinales and Methanobacteriales MAGs, these data indicated the use of
      methylated oxygen compounds
    explanation: Supports substrate differentiation among methanogenic groups.
- name: Thaw-Stage Activity Gradient
  description: Palsa hosted bacterial methylotrophy, while partially thawed bog
    and fully thawed fen hosted both methanogenic and bacterial methylotrophic
    activity, indicating functional changes along the permafrost thaw gradient.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the most frozen non-methanogenic palsa found to host bacterial methylotrophy
    explanation: Supports palsa-stage bacterial methylotrophic activity.
  - reference: PMID:38063415
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: partially thawed bog and fully thawed fen seen to house both methanogenic and
      bacterial methylotrophic activities
    explanation: Supports bog and fen stages with both methanogenic and bacterial methylotrophy.
