id: CommunityMech:000254
name: Stordalen Mire Methylotrophic Methanogenesis Community
description: >
  Natural thaw-gradient peat microbial communities from Stordalen Mire in
  Arctic Sweden, curated around genome-resolved multi-omics evidence for direct
  and indirect methylotrophic routes to methane production. The study expanded
  genomic representation of native methanogens, identified methanogenic MAGs
  with methylotrophic potential and transcriptional activity, detected broad
  bacterial anaerobic methylotrophic potential, and observed active
  methylotrophy across palsa, bog, and fen stages of permafrost thaw. The
  community is DOE-relevant through USDOE Office of Science BER, PNNL EMSL, and
  JGI involvement and links permafrost thaw, wetland carbon cycling, and methane
  emissions.
ecological_state: PERTURBED
community_origin: NATURAL
community_category: METHANOGENESIS
environment_term:
  preferred_term: thawing permafrost peatland
  term:
    id: ENVO:00000044
    label: peatland
  notes: Stordalen Mire is represented as a thawing permafrost peatland mosaic
    with palsa, bog, and fen habitats; ENVO bog is used as the closest validated
    wetland habitat term already used in this repository for peat methanogenesis
    communities.
