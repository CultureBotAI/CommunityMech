ecological_interactions:
- name: Rare Soil CPR and DPANN Sequence Detection
  description: CPR and DPANN sequences were recovered from small-particle concentrates, while paired bulk samples
    gave low or undetectable coverage and no recovered CPR/DPANN draft genomes. The reported 100- to 1,000-fold
    enrichment is a sample-processing comparison, not natural population growth. Abundances of roughly 1 to 100
    cells per gram are coverage-based estimates, not direct counts; nondetection does not establish ecological absence.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34402646
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: enriched 100- to 1,000-fold compared to that in bulk soil
    explanation: Supports technical relative enrichment in the recovered fraction, not biological population expansion.
  - reference: PMID:34402646
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we estimate each of these organisms comprises approximately 1 to 100 cells per gram of soil
    explanation: The source explicitly reports an estimate, not a direct cell count.
- name: Reduced Genomic Inventories and Hypothesized Resource Dependence
  description: 'HYPOTHESIZED: reduced metabolic inventories in most recovered CPR and DPANN draft genomes suggest
    dependence on resources from other organisms. Incomplete genomes and uncharacterized functions limit absence-based
    inference. No partner, transfer route or neutral effect on a host was demonstrated, so this is not assigned
    a commensal fitness relationship.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34402646
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: 'suggesting they live anaerobic lifestyles and depend on resources from other organisms

      '
    explanation: Supports a genome-based resource-dependence hypothesis, not measured transfer or an unaffected
      host.
    computational_provenance:
      prediction_type: OTHER
      model_source: Comparative metabolic inventories of the recovered CPR and DPANN draft genomes in the primary
        study.
- name: Predicted Respiratory Components in Soil CPR
  description: 'Specific soil CPR lineages carried predicted respiratory components; the claim is not extended to
    DPANN or every CPR lineage. HYPOTHESIZED: these components may support some aerobic respiratory activity. Missing
    quinone-biosynthesis genes and incomplete assemblies limit that inference. Phylogenetic analysis suggests lateral
    acquisition, but neither realized respiration nor an adaptive benefit in soil was measured.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:34402646
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: suggests the possibility of some aerobic respiratory capacity
    explanation: Supports a qualified genome-based functional hypothesis rather than demonstrated respiration.
    computational_provenance:
      prediction_type: PHYLOGENETIC_INFERENCE
      model_source: Comparative genomic inventories and the primary study maximum-likelihood phylogeny; supplementary
        software details were not independently reviewed.
  - reference: PMID:34402646
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: This analysis suggests that this gene cluster has been laterally transferred from other bacteria
    explanation: Supports phylogenetic inference of lateral transfer rather than observed historical acquisition
      or measured fitness.
    computational_provenance:
      prediction_type: PHYLOGENETIC_INFERENCE
      model_source: Comparative genomic inventories and the primary study maximum-likelihood phylogeny; supplementary
        software details were not independently reviewed.
  participating_taxa:
