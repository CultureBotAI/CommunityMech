id: CommunityMech:000391
name: Wheat Crown-Rot TB Cross-Kingdom SynCom
description: A minimal two-member cross-kingdom wheat-rhizosphere SynCom, named TB by Zhou et al. 2026, that mixed Trichoderma
  harzianum T19 with Bacillus rugosus PM16 and was soil-drenched onto Fusarium-pseudograminearum-challenged Triticum aestivum
  cv. Hechun 213 seedlings. The controlled tissue-culture-chamber pot experiment tested sterile-water, Fusarium-only, SynCom-only,
  and Fusarium-plus-SynCom treatments in non-sterile topsoil; after 45 days the authors scored wheat crown rot, profiled rhizosphere
  16S/ITS communities, and measured rhizosphere metabolites.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Construct a minimal fungal-bacterial wheat rhizosphere SynCom to suppress Fusarium pseudograminearum wheat crown
    rot and promote wheat growth under pathogen pressure.
  assembly_strategy: Combine equal volumes of a Trichoderma harzianum T19 spore suspension and a Bacillus rugosus PM16 bacterial
    suspension immediately before wheat-pot soil drenching.
  inoculation_strategy: Grow T19 conidia in carboxymethyl cellulose liquid medium at 28 °C for 5 days, adjust the spore suspension
    to 10^6 spores/mL, grow PM16 in nutrient broth at 37 °C for 8 h to OD600 = 0.1, resuspend the cells in sterile water,
    and mix the suspensions 1:1 by volume before applying 200 mL per pot on day 7.
  perturbation_design: Compare sterile-water, Fusarium pseudograminearum, TB SynCom, and combined TB-Fusarium soil-drench
    treatments in randomized blocks with six independent biological replicates and ten wheat plants per replicate.
  measurement_endpoints:
  - wheat crown rot disease index at 45 days after pathogen inoculation
  - wheat growth, chlorophyll, root, and thousand-kernel-weight traits
  - rhizosphere soil full-length 16S rRNA and ITS amplicon profiles
  - rhizosphere soil LC-MS metabolomics profiles
  - rhizosphere soil pH, nutrient availability, and enzyme activities
  evidence:
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We constructed a minimal cross-kingdom synthetic community (SynCom) consisting of Trichoderma harzianum T19 and
      Bacillus rugosus PM16, and evaluated its effects on wheat growth and WCR suppression.
    explanation: Identifies the two-member fungal-bacterial TB SynCom design and its wheat crown-rot biocontrol objective.
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Wheat (Triticum aestivum L., cv. Hechun 213) was subjected to four treatments: a sterile-water control (CK),
      inoculation with F. pseudograminearum (Fp), inoculation with the minimal cross-kingdom SynCom (TB), and co-inoculation
      with Fp and TB (TB-Fp).'
    explanation: Supports the four-treatment SynCom/Fusarium pot-experiment design.
