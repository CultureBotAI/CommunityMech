    explanation: Identifies PM16 as Bacillus rugosus.
ecological_interactions:
- name: Fusarium pseudograminearum WCR suppression by TB
  description: Soil drenching with the T. harzianum T19 / B. rugosus PM16 TB SynCom suppressed Fusarium-pseudograminearum-driven
    wheat crown rot in the controlled pot experiment, alongside improved wheat biomass, chlorophyll content, and yield-related
    traits.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Trichoderma harzianum T19
    term:
      id: NCBITaxon:5544
      label: Trichoderma harzianum
  - preferred_term: Bacillus rugosus PM16
    term:
      id: NCBITaxon:2715209
      label: Bacillus rugosus
  - preferred_term: Fusarium pseudograminearum Fp-XJ-07
    term:
      id: NCBITaxon:101028
      label: Fusarium pseudograminearum
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynCom significantly suppressed WCR and promoted wheat growth under pathogen pressure, improving biomass,
      chlorophyll content, and yield-related traits.
    explanation: Reports the WCR suppression and growth promotion measured in the TB SynCom treatment under Fusarium pathogen
      pressure.
- name: TB-associated rhizosphere remodeling
  description: TB SynCom inoculation remodeled the resident wheat rhizosphere community, including enrichment of beneficial
    taxa and reduction of pathogen-associated fungi, during the 45-day Fusarium challenge assay.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: regulation of defense response
    term:
      id: GO:0031347
      label: regulation of defense response
  evidence:
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation remodeled the rhizosphere microbiome by enriching beneficial taxa (e.g., Mortierella) and
      reducing pathogen-associated fungi
    explanation: Supports TB-driven restructuring of the wheat rhizosphere microbiome.
growth_media:
- name: wheat non-sterile topsoil pot assay
  temperature: 25
  temperature_unit: °C
  light_regime: 16 h light / 8 h dark
  incubation_time: 45
  incubation_time_unit: days
  inoculum_size: '200'
  inoculum_unit: mL/pot
  vessel_type: pot
  preparation_notes: Each pot contained 1100 g air-dried non-sterile topsoil passed through a 2-mm sieve. Fusarium conidia
    were soil-drenched on day 0, and the TB SynCom was soil-drenched on day 7; disease was scored 45 days after pathogen inoculation.
  evidence:
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The pot experiment was conducted in the tissue culture chamber at Xinjiang Normal University (Urumqi, Xinjiang,
      China) under controlled conditions (25°C, 16 h light/8 h dark).
    explanation: Reports the controlled 25 °C, 16 h light/8 h dark chamber conditions.
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Fp inoculation was performed on Day 0 by soil drenching each pot with 200 mL of a conidial suspension (106 spores/mL).
      TB was applied on Day 7 using the same soil-drenching method (200 mL per pot).
    explanation: Supports the day-0 Fusarium challenge and day-7 200 mL TB SynCom soil-drench application.
- name: TB inoculum liquid precultures
  temperature_unit: °C
  vessel_type: liquid preculture
  preparation_notes: T19 conidia were precultured in carboxymethyl cellulose liquid medium at 28 °C for 5 days and adjusted
    to 10^6 spores/mL; PM16 was precultured in nutrient broth at 37 °C for 8 h and adjusted to OD600 = 0.1.
  evidence:
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The conidia of Trichoderma strain T19 were added to carboxymethyl cellulose liquid medium and incubated at 28°C
      for 5 days.
    explanation: Reports the T19 liquid preculture medium and incubation.
  - reference: PMID:41821943
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain PM16 was cultured in nutrient broth at 37°C for 8 h, and the cell density was adjusted to OD600 = 0.1
    explanation: Reports the PM16 nutrient-broth preculture conditions.
