growth_media:
- name: tryptic soy broth (TSB)
  temperature: '30'
  temperature_unit: °C
  shaking_speed: '150'
  shaking_speed_unit: rpm
  preparation_notes: 'Chemotactic SynCom strains (two Pseudomonas, one Bacillus) grown in TSB
    (tryptone 15 g/L, soy peptone 5 g/L, NaCl 5 g/L); activated on TSB agar at 30°C for 12 h
    before inoculum preparation.'
  evidence:
  - reference: PMID:40670700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Chemotactic bacterial strains were first grown overnight in TSB medium at 30 °C
      with shaking at 150 rpm
    explanation: Reports the medium (TSB), temperature (30°C), and shaking speed (150 rpm) used
      to grow the chemotactic SynCom strains.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: Two-stage solid-state fermentation of a composite organic
    fertilizer (vermicompost, distiller's grains, cow dung and oil cake in five
    formulations, S1-S5).
  operating_temperature: 23.0
  operating_temperature_unit: °C
  controls_notes: Each SynCom strain inoculated into the composite nutrient at 5%
    (v/w) with its screened prebiotic; moisture held at 40% throughout to keep the
    compost aerated and loose; turned every 12 h; fermented approximately 7-10 days
    in three replicates.
  notes: 'This record was refused in an earlier pass of #183 on the grounds that the
    paper gave conditions only for individual strains (30 C, 170 rpm in TSB) and for a
    96-well chemotaxis assay. That was wrong — it gives the SynCom''s own solid-state
    fermentation conditions further into the Methods, and I stopped reading too early.
    The moisture figure is a control rather than a description: the paper says 40% is
    maintained specifically to ensure aeration and looseness, so it is doing the job
    agitation does in a liquid culture.'
  evidence:
  - reference: PMID:40670700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The moisture content was adjusted to 40%, and fermentation was carried out
      at 23 °C
  - reference: PMID:40670700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: During fermentation, the mixture was turned every 12 h, and a moisture
      content was maintained at 40% to ensure aeration and looseness of the compost
discussions:
- discussion_id: tobacco_causal_scope_batch120
  prompt: How much of the tobacco field benefit specifically depends on chemotaxis or the tested broth effects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Strain-specific prebiotic enhancement
  - ecological_interactions#Antagonism by cheA-positive SynCom isolates
  - ecological_interactions#Tobacco Field Protection and Yield Enhancement
  rationale: The field comparison combines the inoculum, prebiotics and fertilizer matrix. It does not isolate chemotaxis,
    and the authors explicitly identify non-chemotactic controls as future work. cheA PCR and Tax4Fun inference
    should not stand in for measured root migration, strain persistence or active metabolic pathways. The paper
    also differs between Results and Discussion on resource counts and has tomato wording in some captions despite
    a tobacco trial; those details are not silently reconciled or used to erase the positive field outcome.
  evidence:
  - reference: PMID:40670700
    snippet: future studies should include non-chemotactic SynCom as experimental controls
  posed_by: codex
  posed_date: '2026-10-08'
