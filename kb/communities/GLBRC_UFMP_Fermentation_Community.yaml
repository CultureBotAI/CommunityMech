id: CommunityMech:000029
name: GLBRC Ultra-Filtered Milk Permeate Fermentation Community
description: 'A fermentative microbial community maintained in a 282-day continuous bioreactor experiment
  fed ultra-filtered milk permeate (UFMP), a low-value dairy coproduct. Originally inoculated from an
  acid-phase digester at the Nine Springs Wastewater Treatment Plant (Madison, WI). Metagenome-assembled
  genomes (MAGs) revealed functional partitioning between phyla: Actinobacteriota members (Olsenella,
  Bifidobacterium, Pauljensenia) degrade lactose via the Leloir pathway and bifid shunt, producing acetic,
  lactic, and succinic acids. Firmicutes members (Clostridium, Agathobacter) perform chain elongation
  via reverse beta-oxidation, converting lactic acid, ethanol, or lactose into butyric, hexanoic, and
  octanoic acids. This cross-feeding between Actinobacteriota (acid producers) and Firmicutes (chain elongators)
  forms the core metabolic network enabling conversion of dairy waste into renewable chemicals via the
  carboxylate platform.

  '
ecological_state: STABLE
community_origin: NATURAL
community_category: BIOTECHNOLOGY
engineering_design:
  objective: 'Characterize the microbial community converting dairy coproducts (ultra-filtered milk permeate)
    into renewable chemicals via carboxylate platform fermentation.

    '
  assembly_strategy: 'Inoculated from an acid-phase digester; enriched through continuous bioreactor operation
    over 282 days.

    '
  perturbation_design: 'Continuous feed of UFMP at 0.5 L/day, pH 5.5, 35 degrees C, 6-day hydraulic retention
    time.

    '
  measurement_endpoints:
  - Metagenome sequencing and MAG reconstruction
  - Metabolic pathway analysis from genome annotations
  - Product quantification (organic acids, medium-chain fatty acids)
  evidence:
  - reference: PMID:37324413
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Fermentative microbial communities have the potential to serve as biocatalysts for the conversion
      of low-value dairy coproducts into renewable chemicals

      '
    explanation: Describes the engineering objective of the bioreactor community
environment_term:
  preferred_term: Anaerobic bioreactor (35C, pH 5.5, 6-day retention time)
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: 'Anaerobic continuous stirred-tank reactor fed ultra-filtered milk permeate (UFMP) at 0.5 L/day.
    Operated at 35 degrees C, pH controlled at 5.5, with a 6-day hydraulic retention time. Total operation
    period was 282 days.

    '
