ecological_interactions:
- name: Lactose Degradation to Organic Acids
  description: 'Actinobacteriota members (Olsenella, Bifidobacterium, Pauljensenia) degrade lactose via
    the Leloir pathway and the bifid shunt, producing acetic, lactic, and succinic acids as primary fermentation
    products. These short-chain acids serve as substrates for downstream chain elongation by Firmicutes.

    '
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactose
    term:
      id: CHEBI:17716
      label: lactose
    notes: Primary substrate from ultra-filtered milk permeate
  - preferred_term: acetic acid
    term:
      id: CHEBI:15366
      label: acetic acid
    notes: Product of Leloir pathway and bifid shunt
  - preferred_term: lactic acid
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    notes: Product of lactose fermentation; substrate for chain elongation
  - preferred_term: succinic acid
    term:
      id: CHEBI:30031
      label: succinate(2-)
    notes: Produced primarily by Pauljensenia sp.
  evidence:
  - reference: PMID:37324413
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'members of the Actinobacteriota phylum are important in the degradation of lactose, via
      the Leloir pathway and the bifid shunt, and the production of acetic, lactic, and succinic acids

      '
    explanation: Documents lactose degradation pathways of Actinobacteriota members
- name: Chain Elongation to Medium-Chain Fatty Acids
  description: 'Firmicutes members (Clostridium, Agathobacter) perform reverse beta-oxidation (chain elongation)
    using lactic acid, ethanol, or lactose as electron donors and carbon sources to produce butyric (C4),
    hexanoic (C6), and octanoic (C8) acids. This represents a key cross-feeding interaction where Actinobacteriota-produced
    lactic acid fuels Firmicutes chain elongation.

    '
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactic acid
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    notes: Electron donor and carbon source for chain elongation
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
    notes: Alternative electron donor for chain elongation
  - preferred_term: butyric acid
    term:
      id: CHEBI:30772
      label: butyric acid
    notes: C4 chain elongation product
  - preferred_term: hexanoic acid
    term:
      id: CHEBI:30776
      label: hexanoic acid
    notes: C6 chain elongation product
  - preferred_term: octanoic acid
    term:
      id: CHEBI:28837
      label: octanoic acid
    notes: C8 chain elongation product
  evidence:
  - reference: PMID:37324413
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'members of the Firmicutes phylum contribute to the chain-elongation-mediated production
      of butyric, hexanoic, and octanoic acids, with different microbes using either lactose, ethanol,
      or lactic acid as the growth substrate

      '
    explanation: Documents chain elongation by Firmicutes using multiple substrates
- name: Actinobacteriota-Firmicutes Cross-Feeding Network
  description: 'The core metabolic interaction in the community is cross-feeding between Actinobacteriota
    (which produce lactic acid from lactose) and Firmicutes (which consume lactic acid for chain elongation).
    This syntrophic relationship enables the full conversion of lactose into medium-chain fatty acids
    via a two-step metabolic cascade.

    '
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Olsenella (Actinobacteriota)
    term:
      id: NCBITaxon:133926
      label: Olsenella uli
    notes: Representative of Actinobacteriota acid producers
  target_taxon:
    preferred_term: Clostridium (Firmicutes)
    term:
      id: NCBITaxon:1485
      label: Clostridium
    notes: Representative of Firmicutes chain elongators
  metabolites:
  - preferred_term: lactic acid
    term:
      id: CHEBI:422
      label: (S)-lactic acid
    notes: Key cross-feeding metabolite between Actinobacteriota and Firmicutes
  evidence:
  - reference: PMID:37324413
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'members of the Actinobacteriota phylum are important in the degradation of lactose, via
      the Leloir pathway and the bifid shunt, and the production of acetic, lactic, and succinic acids

      '
    explanation: Actinobacteriota produce lactic acid consumed by Firmicutes chain elongators
