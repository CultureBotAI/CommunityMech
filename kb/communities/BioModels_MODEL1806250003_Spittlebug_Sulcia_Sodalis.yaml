ecological_interactions:
- name: Sulcia Essential Amino Acid Provisioning
  description: COMPUTATIONAL - the spittlebug model predicts Sulcia export of 7 essential amino acids and reciprocal
    host nutrient supply. Across the three modeled insects, Sulcia EAA output accounts for 66-80% of host-derived
    nitrogen input. This is nitrogen-weighted transport-flux accounting, not an elemental-nitrogen concentration
    or a host-specific measured percentage. MUTUALISM denotes modeled reciprocal nutrition, not experimentally traced
    transfer.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Sulcia
    term:
      id: NCBITaxon:336809
      label: Candidatus Karelsulcia
  target_taxon:
    preferred_term: Philaenus spumarius
    term:
      id: NCBITaxon:36667
      label: Philaenus spumarius
  metabolites:
  - preferred_term: L-leucine
    term:
      id: CHEBI:15603
      label: L-leucine
    notes: Essential amino acid produced by Sulcia
  - preferred_term: L-isoleucine
    term:
      id: CHEBI:17191
      label: L-isoleucine
    notes: Essential amino acid produced by Sulcia
  evidence:
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Sulcia and Hodgkinia with genomes of ≤0.3 Mb are calculated to recycle ∼30 to 80% of host-derived nitrogen
      to essential amino acids returned to the host
    explanation: The abstract pools Sulcia and Hodgkinia; the main results distinguish their nitrogen efficiencies.
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our simulations reveal extensive bidirectional flux of multiple metabolites between each symbiont and
      the host
    explanation: Supports the extensive metabolic exchange between Sulcia and the spittlebug host.
  - reference: PMID:30254121
    snippet: For Sulcia, EAA output was equivalent to 66 to 80% of host-derived N
    explanation: The main result supplies the Sulcia-specific range across systems, unlike the pooled abstract range.
    evidence_source: COMPUTATIONAL
    supports: SUPPORT
- name: Sodalis Metabolic Complementarity
  description: COMPUTATIONAL - Sodalis exports histidine, methionine, tryptophan and threonine; threonine overlaps
    Sulcia output, while synthesized arginine/lysine were not exported. Its predicted EAA return corresponds to
    15% of host-derived nitrogen input, not the entire pooled abstract range. The model predicts reciprocal host
    support and two exclusively exchanged symbiont intermediates. Near metabolic segregation is not a universal
    absence of exchange; direct host regulatory control remains a PARTIAL interpretation.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Sodalis
    term:
      id: NCBITaxon:84565
      label: Sodalis
  target_taxon:
    preferred_term: Philaenus spumarius
    term:
      id: NCBITaxon:36667
      label: Philaenus spumarius
  evidence:
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Baumannia and Sodalis with genomes of ≥0.6 Mb recycle 10 to 15% of host nitrogen
    explanation: The abstract gives a pooled range; main results assign 15% to Sodalis. These are model flux fractions,
      not measured concentrations.
  - reference: PMID:30254121
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: near-complete metabolic segregation (i.e., near absence of metabolic cross-feeding) between the two
      symbionts, a likely mode of host control over symbiont metabolism
    explanation: Near segregation is a model result; its interpretation as active host control is a hypothesis,
      not experimentally demonstrated regulation.
  - reference: PMID:30254121
    snippet: 15% for Sodalis
    explanation: Main results assign 15% nitrogen recycling to Sodalis, rather than the pooled abstract range.
    evidence_source: COMPUTATIONAL
    supports: SUPPORT
- name: Host-Mediated Complementary Endosymbiont Metabolism
  description: COMPUTATIONAL - Sulcia and Sodalis provide complementary nutrition to the spittlebug host while receiving
    host metabolites. The model contains two exclusively exchanged symbiont intermediates. PARTIAL - this organization
    motivates host-control hypotheses but does not demonstrate regulatory mediation or complete exclusion of bacterial
    cross-feeding. The partner nodes are components of this summary, not independently demonstrated upstream causal
    events.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:30254121
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Our simulations reveal extensive bidirectional flux of multiple metabolites between each symbiont and
      the host
    explanation: 'Supports the host-symbiont exchange through which the two bacterial partners provision the spittlebug.

      '
  - reference: PMID:30254121
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: near-complete metabolic segregation (i.e., near absence of metabolic cross-feeding) between the two
      symbionts, a likely mode of host control over symbiont metabolism
    explanation: Supports the source's likely host-control interpretation; direct regulation is not established
      by predicted segregation.
