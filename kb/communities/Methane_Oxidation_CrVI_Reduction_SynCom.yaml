ecological_interactions:
- name: Methylocystis Hypoxic Methane Oxidation
  description: MAG analysis assigned Methylocystis, reported at 6.30% abundance, as the methane-oxidizing core under
    hypoxic conditions. This is the source's taxon assignment, not an isolated-strain electron-flux measurement
    or proof that only this genus oxidizes methane. Hypoxia does not make this an established oxygen-independent
    methane pathway; the study describes aerobic methanotrophs under low oxygen.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Methylocystis sp.
    term:
      id: NCBITaxon:133
      label: Methylocystis
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  downstream:
  - target: Extracellular Electron Transfer to Cr(VI)
    description: PARTIAL - methane oxidation can supply reducing equivalents for the proposed EET routes. Inhibiting
      oxidation reduced Cr(VI) reduction, supporting functional coupling, but the abstract does not resolve how
      much reaches chromium through Methylocystis cytochromes/pili versus partner-associated routes.
  evidence:
  - reference: PMID:41932525
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: under hypoxic conditions, Methylocystis (6.30%) was the core microorganism driving methane oxidation
    explanation: MAG-based assignment in the experimental enrichment, not a purified-strain flux or exclusive functional
      attribution.
- name: Extracellular Electron Transfer to Cr(VI)
  description: The source proposes Methylocystis EET via multiheme c-type cytochromes and conductive pili, or jointly
    with dominant Hyphomicrobium and Thiobacillus. Preserve these alternative route assignments from MAG/multi-omics
    analysis, not a single demonstrated serial transfer chain, obligatory syntrophy, measured metabolite exchange
    or selective proof of each protein and partner. The three named genera are a reported subset of the enrichment,
    not its complete composition or a verified three-isolate coculture.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Methylocystis sp.
    term:
      id: NCBITaxon:133
      label: Methylocystis
  - preferred_term: Hyphomicrobium sp.
    term:
      id: NCBITaxon:82
      label: Hyphomicrobium sp.
  - preferred_term: Thiobacillus sp.
    term:
      id: NCBITaxon:919
      label: Thiobacillus
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: chromate(2-)
    term:
      id: CHEBI:35404
      label: chromate(2-)
    notes: Canonical chromate representation of reported Cr(VI); exact challenge salt/speciation is not established
      by the abstract.
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  downstream:
  - target: Methane-Driven Chromium Reduction
    description: PARTIAL - proposed extracellular transfer could deliver methane-derived electrons to Cr(VI). Positive
      removal and the methane-inhibition result support coupling, not selective demonstration that this EET route
      is the sole mediator; inhibitor specificity and route-specific controls require the unavailable Methods.
  evidence:
  - reference: PMID:41932525
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: It achieved extracellular electron transfer (EET) through multiheme c-type cytochromes and conductive
      pili, or jointly with dominant genera such as Hyphomicrobium and Thiobacillus, to couple methane oxidation
      with Cr(VI) reduction.
    explanation: Source-reported alternative EET routes from community/MAG evidence. Abstract scope does not resolve
      partner-specific transfer, cytochrome/pilus necessity or flux allocation.
- name: Methane-Driven Chromium Reduction
  description: The enrichment reached a maximum reported Cr(VI) removal load of 20.63 mg/L/d. Inhibiting methane
    oxidation reduced Cr(VI)-reduction efficiency, a positive perturbation result supporting coupling. Omics associated
    the system with quorum-sensing and methane-metabolism proteins, ABC substrate-binding protein and porin expression;
    these are not selectively established mediators. The abstract does not resolve inhibitor off-target effects,
    chromium mass balance, exact reduced-product speciation, or each genus' share. Named participants are a subset,
    not a tested minimal consortium.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: chromate(2-)
    term:
      id: CHEBI:35404
      label: chromate(2-)
    notes: Canonical chromate representation of reported Cr(VI); exact challenge salt/speciation is not established
      by the abstract.
  biological_processes:
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  evidence:
  - reference: PMID:41932525
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: to couple methane oxidation with Cr(VI) reduction
    explanation: Supports methane as the oxidized electron donor and Cr(VI) as the reduced chromium species in the
      community-level electron-transfer process.
  - reference: PMID:41932525
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: significant enrichment of differentially expressed proteins involved in quorum sensing and methane
      metabolism
    explanation: Supports differential protein enrichment, not demonstrated quorum-sensing mediation of chromium
      reduction.
  - reference: PMID:41932525
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: inhibiting the methane oxidation would directly reduce the efficiency of Cr(VI) reduction
    explanation: Supports the positive methane-oxidation inhibition result; specificity and route-level mediation
      cannot be assessed from the abstract alone.
