    notes: >-
      The eukaryotic host, an anaerobic ciliate in the family Tropidoatractidae
      (order Metopida, class Armophorea), described in the source as the new
      species Tropidoatractus magnetotacticus. PRIMARY_DEGRADER is deliberately
      not among its roles: the source establishes that the host ferments and
      releases H2, and says nothing about what substrate it degrades, so
      "degrades complex substrates" would be an assumption about a ciliate's diet
      rather than a finding.

      NCBITaxon:3469242 is the taxon NCBI
      registered for the sequenced material and its canonical label is still the
      provisional "Tropidoatractus sp. MC-2025a"; the published binomial is carried
      in preferred_term until NCBI adopts it. GTDB covers Bacteria and Archaea only,
      so a eukaryote has no counterpart there and never will.
