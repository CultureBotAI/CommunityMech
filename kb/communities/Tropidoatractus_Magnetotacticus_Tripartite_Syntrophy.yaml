cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  temperature_controlled: false
  ph_controlled: false
  instrument_detail: >-
    Bulk sediment held as a microcosm and subsampled repeatedly over about two
    years. No medium, no feeding and no defined culture: the community was never
    cultivated, only kept alive in its own sediment.
  controls_notes: >-
    Cells for sequencing were concentrated by the capillary racetrack method on a
    Magnetodrome microscope stage with a 2 mT field applied antiparallel to the
    capillary's long axis, then collected by syringe. That is a magnetic sorting
    step, not a growth condition.
  notes: >-
    Recorded so the provenance of the sequenced material is legible, not because
    this community was cultured. The microcosm died after two years and no further
    material was available, so nothing here can be re-sampled.

    temperature_controlled and ph_controlled are false because the sediment sat at
    room temperature in a dark room with no control of either; that is read off the
    described storage rather than from a statement that neither was controlled.
  evidence:
  - reference: PMID:42475569
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: it was stored at room temperature in a dark room
    explanation: Sources the storage temperature and the absence of light.
