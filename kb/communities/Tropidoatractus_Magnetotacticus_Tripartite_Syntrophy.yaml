id: CommunityMech:000337
name: Tropidoatractus magnetotacticus Magnetotactic Ciliate Tripartite Syntrophy
description: >
  A natural tripartite anaerobic symbiosis inside a single ciliate cell, found in
  freshwater rainforest stream sediment near Libreville, Gabon. The host,
  Tropidoatractus magnetotacticus sp. nov., produces H2 in hydrogenosomal
  mitochondrion-related organelles. Two intracellular prokaryotic partners consume
  it: a magnetotactic sulfate-reducing bacterial population in the
  Thermodesulfobacteriota that encodes and expresses a magnetosome gene cluster,
  and an endosymbiotic hydrogenotrophic methanogen affiliated with Methanoregula.
  The bacterial partner biomineralizes chains of ferrimagnetic magnetite
  nanoparticles inside the host, so the eukaryote's magnetotaxis is a trait
  acquired from a symbiont rather than one it encodes itself.

  "Tripartite" names three functional guilds, not three genomes. The sulfate
  reducer bin splits by GC content into a magnetosome-bearing and a
  magnetosome-free population, and refined binning yielded six MAGs for the
  former, two for the methanogen, and four sub-bins for the ciliate.

  The whole syntrophic network is built from gene presence and transcript
  expression. No metabolite concentration or flux was measured, no FISH
  confirmation succeeded, and the source microcosm died after two years, so
  nothing here rests on a cultivated or re-samplable system.
ecological_state: STABLE
community_origin: NATURAL
community_category: SYNTROPHY
