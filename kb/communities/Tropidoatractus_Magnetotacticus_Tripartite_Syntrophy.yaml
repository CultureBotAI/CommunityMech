- name: Symbiont-conferred magnetotaxis
  description: >-
    The magnetosome gene cluster is encoded and expressed by the bacterial partner,
    not by the ciliate, and the magnetite chains it builds give the host cell a
    magnetic moment. The host's magnetotaxis is therefore a trait supplied by a
    symbiont.

    Two limits belong with this claim. The physical identity of the rod-shaped
    bacteria seen by electron microscopy with the genome carrying the magnetosome
    gene cluster is inferred from metagenomics, because every FISH attempt failed
    on low cell numbers. And what the magnetotaxis is for in the field is
    hypothesis: the source suggests it might guide the anaerobic host down into
    anoxic sediment, and says outright that whether the observed south-seeking
    orientation reflects native behaviour is unclear.

    interaction_type is MUTUALISM because the source frames the whole association as
    reciprocal, but note that InteractionTypeEnum has no value for a symbiont
    supplying a behavioural capability rather than a metabolite. See issue 749.
  interaction_type: MUTUALISM
