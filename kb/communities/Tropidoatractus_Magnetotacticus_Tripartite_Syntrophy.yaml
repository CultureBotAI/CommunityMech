- name: Tripartite electron sink improving host energetics
  description: >-
    Taken together the two internal partners act as sinks for H2 and other
    fermentation products, which the source reads as improving the efficiency of the
    host's own energy metabolism. This is the return leg that makes the association
    syntrophy rather than one-way consumption, and it has no single source or target
    because both partners contribute.
