discussions:
- discussion_id: thor_causal_graph_scope_batch119
  prompt: Which CI04-variant biofilm and metabolite mechanisms transfer experimentally to the UW101 THOR community?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Koreenceine production and UW101 growth inhibition
  - ecological_interactions#Koreenceine-Driven Transcriptional Regulation
  - ecological_interactions#Bacillus protection in the UW101 THOR community
  rationale: The founding study used CI04; the 2022 Methods name UW101. In CI04 assays, both partners enhanced P.
    koreensis biofilm and the triple culture sustained it longer, but this does not establish the corresponding
    UW101 phenotype. Likewise, CI04 metabolite accumulation and spo0H tests do not resolve the UW101 protection
    mechanism. Strain-matched biofilm and chemical perturbations are needed before restoring that node or asserting
    a specific route. The UW101 locus-deletion, population and expression results remain experimental evidence.
  evidence:
  - reference: PMID:35435700
    snippet: Bacillus cereus UW85 (B), Flavobacterium johnsoniae UW101 (F), Pseudomonas koreensis CI12 (P)
  - reference: PMID:30837345
    snippet: F. johnsoniae CI04 and B. cereus UW85 each increased the maximum biofilm formed by P. koreensis CI12
      at 18 h
  posed_by: codex
  posed_date: '2026-10-08'
curation_history:
- timestamp: '2026-10-08T13:32:40Z'
  curator: codex
  action: REVIEW_CAUSAL_GRAPH
  changes: Retain locus-dependent UW101 inhibition without asserting bilateral fitness harm.; Retain experimental
    transcriptional dependence with correct denominators and direct/indirect limits.; Retain UW101 protection with
