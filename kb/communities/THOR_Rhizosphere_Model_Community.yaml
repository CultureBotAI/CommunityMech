  shaking_speed: vigorous
  vessel_type: liquid culture; 1/10-strength tryptic soy agar (TSA) plates for propagation
  preparation_notes: THOR members propagated on 1/10-strength TSA and grown in liquid 1/2-strength
    TSB; competition assays also used LB and soybean root exudate, and biofilm assays were
    incubated at 20°C.
  evidence:
  - reference: PMID:30837345
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial strains were propagated on 1/10-strength tryptic soy agar (TSA) and grown
      in liquid culture in 1/2-strength tryptic soy broth (TSB) at 28°C with vigorous shaking
    explanation: Reports the cultivation medium (1/2-strength TSB, 1/10 TSA), temperature (28°C),
      and shaking used to grow THOR members.
