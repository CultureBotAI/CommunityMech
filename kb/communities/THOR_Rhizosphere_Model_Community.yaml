ecological_interactions:
- name: Koreenceine production and UW101 growth inhibition
  description: P. koreensis CI12 produces koreenceine and inhibits F. johnsoniae UW101 in the 2022 THOR study. Deleting
    the koreenceine locus or reducing the initial P. koreensis inoculum increases UW101 populations. P. koreensis
    and B. cereus growth are not impaired by coculture under the tested conditions, so this one-sided inhibition
    does not establish mutual negative fitness effects. This UW101 assay must not be conflated with the founding
    CI04 root-exudate experiment.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Pseudomonas koreensis CI12
    term:
      id: NCBITaxon:198620
      label: Pseudomonas koreensis
  target_taxon:
    preferred_term: Flavobacterium johnsoniae UW101
    term:
      id: NCBITaxon:986
      label: Flavobacterium johnsoniae
  metabolites:
  - preferred_term: koreenceine
    term:
      id: CHEBI:22315
      label: alkaloid
    notes: Koreenceine is represented at the chemical-class level because a specific CHEBI term was not identified
      during curation.
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Koreenceine-Driven Transcriptional Regulation
    description: 'The wild-type versus koreenceine-locus-deletion comparison supports koreenceine-dependent gene
      regulation in UW101 and B. cereus. PARTIAL for the direct molecular route: antibiotic exposure and indirect
      physiological effects can both contribute. This arrow starts from koreenceine production, not an assumption
      that reduced UW101 growth causes all transcriptional changes or that B. cereus growth is inhibited.'
  evidence:
  - reference: PMID:35435700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: both deletion of the koreenceine locus and reduction of P. koreensis inoculum size increase F. johnsoniae
      populations
    explanation: Two perturbations support population inhibition in the UW101 study; they are not equivalent transcriptional
      perturbations.
  - reference: PMID:35435700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the growth of P. koreensis and B. cereus was not affected by coculture
    explanation: Bounds the growth phenotype and prevents coding the interaction as demonstrated bilateral competition.
  - reference: PMID:35435700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacillus cereus UW85 (B), Flavobacterium johnsoniae UW101 (F), Pseudomonas koreensis CI12 (P)
    explanation: The Methods explicitly identify the three strains in this study.
- name: Koreenceine-Driven Transcriptional Regulation
  description: At the assayed early time point, the P. koreensis koreenceine locus accounts for 85% of the greater-than-twofold
    pairwise response in UW101 and 22% in B. cereus. These are proportions of differentially regulated genes, not
    of each whole genome or of all three-member responses. Locus deletion supports dependence, while direct sensing
    and indirect effects of altered growth remain unresolved. B. cereus changes expression without a measured growth
    defect. Reducing P. koreensis initial abundance, unlike deleting the locus alone, increases its own response
    to UW101.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: koreenceine
    term:
      id: CHEBI:22315
      label: alkaloid
    notes: Chemical-class placeholder for the koreenceine family.
  biological_processes:
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
  evidence:
  - reference: PMID:35435700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In pairwise interactions, the koreenceine biosynthetic cluster is responsible for 85 and 22% of differentially
      regulated genes in F. johnsoniae and B. cereus, respectively.
    explanation: Quantifies koreenceine-dependent gene-expression changes in the two strains responding to P. koreensis
      in pairwise cocultures.
    confidence_score: 0.9
  - reference: PMID:35435700
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: likely a combination of direct effects from koreenceine and indirect effects due to slower growth rate
      of F. johnsoniae in the presence of an antibiotic
    explanation: The authors explicitly retain direct and indirect explanations for the locus-dependent expression
      response.
- name: Bacillus protection in the UW101 THOR community
  description: 'Adding B. cereus UW85 to P. koreensis CI12 and F. johnsoniae UW101 raises UW101 abundance relative
    to the inhibited pair in the 2022 study. This is a three-member protective effect, not facilitation of P. koreensis
    colonization. PARTIAL: the proposed chemical explanation draws on the earlier CI04 variant, where B. cereus
    reduced accumulated koreenceines A and C and its spo0H mutant lost protection. Those CI04 measurements neither
    quantify A/C changes in UW101 culture nor isolate reduced biosynthesis from other routes of reduced metabolite
    accumulation.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: koreenceine
    term:
      id: CHEBI:22315
      label: alkaloid
    notes: Chemical-class placeholder for the koreenceine family.
  biological_processes:
  - preferred_term: negative regulation of biological process
    term:
      id: GO:0048519
      label: negative regulation of biological process
  downstream:
  - target: Koreenceine production and UW101 growth inhibition
    description: 'B. cereus addition reduces the population inhibition of UW101 in the three-member assay. PARTIAL
      for mediation by altered koreenceine accumulation: the detailed metabolite and spo0H comparisons were performed
      with CI04, not UW101, and do not uniquely demonstrate a biosynthesis-suppression mechanism in the UW101 community.'
  evidence:
  - reference: PMID:35435700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. koreensis reduced growth of F. johnsoniae when they were grown as a pair, but F. johnsoniae abundance
      was higher when B. cereus was also present
    explanation: Directly supports protection in the UW101 experiment, not a uniquely resolved chemical mechanism.
  - reference: PMID:30837345
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The addition of B. cereus to cocultures of P. koreensis and F. johnsoniae severely reduced the accumulation
      of koreenceine A and C, with a minor effect on the level of koreenceine B
    explanation: Mechanistic context from the founding CI04 variant only; not direct measurement of UW101 cultures.
  participating_taxa:
  - preferred_term: Bacillus cereus UW85
    term:
      id: NCBITaxon:1396
      label: Bacillus cereus
  - preferred_term: Pseudomonas koreensis CI12
    term:
      id: NCBITaxon:198620
      label: Pseudomonas koreensis
  - preferred_term: Flavobacterium johnsoniae UW101
    term:
      id: NCBITaxon:986
      label: Flavobacterium johnsoniae
cultivation_setup:
- cultivation_mode: BATCH
  operating_temperature: 28.0
  operating_temperature_unit: °C
  instrument_detail: >-
    Liquid culture in half-strength tryptic soy broth at 28 °C with vigorous shaking, with
    strains propagated on 1/10-strength tryptic soy agar. Interactions were also assayed on
    plates and across three media - LB, half-strength TSB, and soybean root exudate - because
    which interactions appear depends on the medium: the inhibition among these strains shows
    up predominantly under the lower-nutrient condition.
  notes: >-
    No `system_type` or `working_volume`. The source says "liquid culture" and names the
    broth, never the vessel or the fill, and the interaction assays run on both plates and in
    liquid - so a single vessel value would misdescribe half the experiments rather than
    approximate them.

    Nutrient level is recorded as part of the setup rather than as an environmental factor
    because it is a manipulated variable here: dilute TSA and TSB are chosen, and the paper's
    point is that antagonism among the three members is medium-dependent. A record showing
    only "TSB" would lose the half-strength, which is where the interactions are.

    Media and temperature are stated for the strains generally, which for a three-member
    model community assembled from those strains is also the coculture's condition; the
    coculture sentences name the same media (#529).
  evidence:
  - reference: PMID:30837345
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial strains were propagated on 1/10-strength tryptic soy agar (TSA) and grown
      in liquid culture in 1/2-strength tryptic soy broth (TSB) at 28°C with vigorous shaking
    explanation: Temperature, agitation, and the two dilute media the community is grown on.
  - reference: PMID:30837345
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Rhizosphere isolates were grown alone or in coculture with P. koreensis CI12 in soybean
      root exudate
    explanation: Cocultures were run in root exudate as well as defined broth.

