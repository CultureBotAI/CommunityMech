ecological_interactions:
- name: Koreenceine-Mediated Inhibition
  description: Pseudomonas koreensis produces koreenceine, an alkaloid antibiotic that inhibits Flavobacterium
    johnsoniae and strongly structures transcriptional responses within THOR. Removing koreenceine or
    changing the starting abundance of P. koreensis increases F. johnsoniae populations, indicating that
    the antibiotic is a major regulatory and competitive mechanism in this model community.
  interaction_type: COMPETITION
  source_taxon:
    preferred_term: Pseudomonas koreensis CI12
    term:
      id: NCBITaxon:198620
      label: Pseudomonas koreensis
  target_taxon:
    preferred_term: Flavobacterium johnsoniae UW101
    term:
      id: NCBITaxon:986
      label: Flavobacterium johnsoniae
  metabolites:
  - preferred_term: koreenceine
    term:
      id: CHEBI:22315
      label: alkaloid
    notes: Koreenceine is represented at the chemical-class level because a specific CHEBI term was not
      identified during curation.
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:30837345
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: P. koreensis produces a novel family of alkaloid antibiotics that inhibit growth of F. johnsoniae
    explanation: Supports koreenceine-mediated inhibition by P. koreensis.
  - reference: PMID:35435700
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mediated either directly or indirectly by its production of the antibiotic koreenceine
    explanation: Supports koreenceine as a major driver of community transcriptional response.
- name: Bacillus Modulation of Pseudomonas Antibiotic Production
  description: Bacillus cereus modulates the inhibitory interaction between P. koreensis and F. johnsoniae
    by suppressing production of the P. koreensis alkaloid antibiotic family. This creates a higher-order
    interaction where the effect of P. koreensis on F. johnsoniae changes in the presence of B. cereus.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Bacillus cereus UW85
    term:
      id: NCBITaxon:1396
      label: Bacillus cereus
  target_taxon:
    preferred_term: Pseudomonas koreensis CI12
    term:
      id: NCBITaxon:198620
      label: Pseudomonas koreensis
  metabolites:
  - preferred_term: koreenceine
    term:
      id: CHEBI:22315
      label: alkaloid
    notes: Chemical-class placeholder for the koreenceine family.
  biological_processes:
  - preferred_term: negative regulation of biological process
    term:
      id: GO:0048519
      label: negative regulation of biological process
  evidence:
  - reference: PMID:30837345
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: production is inhibited by B. cereus
    explanation: Supports B. cereus modulation of P. koreensis antibiotic production.
- name: Emergent Three-Member Biofilm Formation
  description: The complete THOR community produces a stronger biofilm phenotype than its individual
    members, demonstrating an emergent community property that is not captured by monoculture behavior.
    This makes THOR useful for studying how pairwise and higher-order interactions shape aggregate
    community outputs.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  metabolites: []
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
