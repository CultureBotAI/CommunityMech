id: CommunityMech:000079
name: THOR Rhizosphere Model Community
description: 'The Hitchhikers Of the Rhizosphere (THOR) is a genetically tractable
  three-member model microbiome assembled from Bacillus cereus, Pseudomonas koreensis,
  and Flavobacterium johnsoniae. The community was developed from rhizosphere-associated
  isolates to study microbial community assembly, competition, biofilm formation, secondary
  metabolism, and higher-order interactions under controlled laboratory conditions.
  P. koreensis produces the antibiotic koreenceine, which inhibits F. johnsoniae and
  drives community transcriptional responses, while B. cereus modulates antibiotic production
  and participates in emergent colony expansion and biofilm phenotypes.

  '
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Create a genetically tractable reduced-complexity rhizosphere model for dissecting
    microbial community behavior.
  assembly_strategy: Bottom-up assembly of three rhizosphere-associated bacterial isolates spanning
    Firmicutes, Proteobacteria, and Bacteroidetes.
  measurement_endpoints:
  - Pairwise and three-member biofilm production
  - Colony expansion
  - Interspecies inhibition by koreenceine
  - Comparative metatranscriptomics
  notes: THOR is synthetic as a defined experimental community, but its members are rhizosphere-associated
    organisms selected from naturally interacting isolates.
  evidence:
  - reference: PMID:30837345
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We developed a model community with representatives from three dominant rhizosphere taxa
    explanation: Supports the design rationale for a reduced-complexity rhizosphere model community.
