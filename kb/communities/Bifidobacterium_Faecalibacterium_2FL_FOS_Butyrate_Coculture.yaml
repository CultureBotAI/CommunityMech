discussions:
- discussion_id: bifido_faecali_2fl_fos_flux_unresolved
  prompt: Does B. bifidum-derived acetate directly enter F. prausnitzii butyrate, and how much of the 10:90 2′-FL/FOS butyrate
    peak is controlled by pH or residual substrate depletion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Putative B. bifidum metabolite support of F. prausnitzii butyrate output
  - environmental_factors#2′-FL/FOS substrate ratio
  rationale: The paper measured only a 24 h endpoint, did not measure or control culture pH, did not quantify residual 2′-FL
    or FOS, and did not trace metabolic flux. Those source limitations leave the exact acetate-transfer contribution and pH/substrate
    constraints unresolved even though butyrate peaked in the 10:90 2′-FL/FOS co-culture.
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the culture pH was neither measured nor controlled
    explanation: Names the unresolved pH constraint.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: residual 2′-FL and FOS concentrations after 24 h were not quantified
    explanation: Names the unresolved substrate-depletion constraint.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the metabolic flux was not directly measured in this study
    explanation: Names the direct-flux measurement gap for the inferred cross-feeding step.
  posed_by: codex
  posed_date: '2026-09-21'
