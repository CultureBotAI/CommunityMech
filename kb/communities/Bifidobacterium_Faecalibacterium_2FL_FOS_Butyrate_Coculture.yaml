id: CommunityMech:000401
name: Bifidobacterium-Faecalibacterium 2′-FL/FOS Butyrate Coculture
description: Defined two-strain anaerobic gut coculture containing Bifidobacterium bifidum JCM1254 and Faecalibacterium prausnitzii
  A2-165 (JCM31915). The strains were grown in 48-well batch cultures of sugar- and volatile-fatty-acid-free YCFA broth supplied
  with 0.5% total carbohydrate as 2′-fucosyllactose, fructooligosaccharides, or mixtures of the two. Monocultures showed B.
  bifidum responding to 2′-FL-rich substrates and F. prausnitzii growing in FOS-containing conditions; in the two-member coculture,
  total OD600 and lactate/acetate accumulation increased under 2′-FL-rich conditions, but butyrate peaked specifically at
  10% 2′-FL plus 90% FOS, indicating ratio-dependent substrate complementarity and metabolite-mediated interaction.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Test whether the mixing ratio of 2′-fucosyllactose and fructooligosaccharides nonlinearly controls butyrate output
    in a minimal B. bifidum / F. prausnitzii gut coculture.
  assembly_strategy: Combine Bifidobacterium bifidum JCM1254 and Faecalibacterium prausnitzii A2-165 from OD600-standardized
    YCFA− suspensions in the same 48-well-plate well.
  perturbation_design: Compare monocultures and two-strain cocultures across no-substrate, 2′-FL-only, FOS-only, and mixed
    2′-FL/FOS treatments while holding total carbohydrate at 0.5% (w/v).
  measurement_endpoints:
  - OD600 after 24 h
  - F. prausnitzii and B. bifidum relative abundance by qPCR
  - Lactate, acetate, and butyrate concentrations by liquid chromatography
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Faecalibacterium prausnitzii A2-165 (JCM31915) and Bifidobacterium bifidum JCM1254
    explanation: Names the two exact JCM strains assembled in the co-culture.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For co-culture experiments, 8 μL of the OD600-adjusted suspension of each species was added to the same well
    explanation: Supports the equalized two-strain co-inoculation into one 48-well-plate well.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 2′-FL and FOS were mixed at various weight ratios while maintaining a total carbohydrate concentration of 0.5%
      (w/v)
    explanation: Defines the 2′-FL/FOS perturbation series at constant total carbohydrate.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The relative abundance of F. prausnitzii and B. bifidum in the co-culture was quantified using qPCR
    explanation: Supports qPCR as the species-composition readout.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The concentrations of the organic acids were calculated from calibration curves generated using authentic standards
    explanation: Supports quantitative organic-acid measurement as an endpoint.
