ecological_interactions:
- name: 2′-FL/FOS ratio-dependent butyrate peak
  description: 'Mixed 2′-FL/FOS substrates uncoupled total co-culture growth from butyrate production: OD600 and lactate/acetate
    were highest under 2′-FL-rich conditions, whereas butyrate was maximal at 10% 2′-FL plus 90% FOS. The authors interpreted
    that nonlinear optimum as a balance between FOS-supported F. prausnitzii abundance and metabolites supplied by active
    B. bifidum.'
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  participating_taxa:
