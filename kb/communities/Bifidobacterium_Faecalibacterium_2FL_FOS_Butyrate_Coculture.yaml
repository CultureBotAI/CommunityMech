    evidence_source: IN_VITRO
    snippet: butyrate production was highest at 10% 2′-FL and 90% FOS
    explanation: Supports the nonmonotonic butyrate maximum in the mixed-substrate co-culture.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: conditions that maximized total co-culture growth did not necessarily maximize butyrate production
    explanation: Supports the non-growth-proportional butyrate response in the co-culture.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: this study showed that the mixing ratio of 2′-FL and FOS could nonlinearly regulate butyrate production through
      substrate complementarity and metabolite-mediated interactions between B. bifidum and F. prausnitzii
    explanation: Supports the source interpretation that the co-culture butyrate peak reflects substrate complementarity and
      metabolite-mediated interaction.
- name: Putative B. bifidum metabolite support of F. prausnitzii butyrate output
  description: B. bifidum alone grew best and accumulated lactate and acetate as 2′-FL increased, but did not produce detectable
    butyrate. In co-culture, F. prausnitzii persisted best in FOS-containing conditions and butyrate peaked at the 10:90 2′-FL/FOS
    ratio, consistent with B. bifidum-derived acetate or other fermentation products contributing to butyrate formation when
    enough F. prausnitzii biomass was maintained. Stable-isotope flux was not measured.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bifidobacterium bifidum JCM1254
    term:
      id: NCBITaxon:1681
      label: Bifidobacterium bifidum
  target_taxon:
    preferred_term: Faecalibacterium prausnitzii A2-165
    term:
      id: NCBITaxon:853
      label: Faecalibacterium prausnitzii
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: carbohydrate fermentation
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, butyrate production was not detected under any of the tested conditions
    explanation: Shows that B. bifidum monocultures accumulated lactate and acetate but not butyrate.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: butyrate production was highest at 10% 2′-FL and 90% FOS
    explanation: Supports the nonmonotonic butyrate maximum in the mixed-substrate co-culture.
  - reference: PMID:42655156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: acetate and possibly other fermentation products derived from B. bifidum may have contributed to butyrate formation
      by F. prausnitzii
    explanation: Supports the authors’ inferred B. bifidum-to-F. prausnitzii metabolite contribution while leaving direct
      flux unresolved.
