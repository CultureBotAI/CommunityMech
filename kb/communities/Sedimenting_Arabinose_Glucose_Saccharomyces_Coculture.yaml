id: CommunityMech:000329
name: Sedimenting Arabinose-Glucose Saccharomyces Coculture
description: >
  A defined two-member Saccharomyces cerevisiae coculture that partitions
  glucose and arabinose fermentation between specialist strains. ACE2 deletion
  gives the arabinose specialist a multicellular, fast-sedimenting phenotype,
  allowing selective biomass retention during sequential-batch cultivation and
  faster mixed-sugar conversion.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Shorten mixed glucose-arabinose conversion time by selectively concentrating the slower arabinose specialist between sequential-batch cycles.
  assembly_strategy: Pair a glucose-specialist S. cerevisiae strain with a diploid ACE2-deletion arabinose-specialist S. cerevisiae strain selected for fast sedimentation.
  passaging_regimen: Anaerobic sequential-batch cultivation with a biomass-settling phase between cultivation cycles.
  perturbation_design: Compare sedimenting and non-sedimenting arabinose specialists and increase biomass settling from 30 minutes to 1 hour.
  measurement_endpoints:
  - time to full arabinose conversion in monoculture
  - mixed-sugar batch duration in coculture
  - glucose and arabinose depletion timing
  - effect of settling duration on biomass retention and conversion kinetics
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increasing the biomass concentration through selective sedimentation of a slow-fermenting strain in sequential batch fermentations
    explanation: Supports the engineering objective and cultivation strategy.
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Deletion of ACE2 in a diploid, arabinose-specialist Saccharomyces cerevisiae strain yielded a multicellular, fast-sedimenting phenotype
    explanation: Supports the genetic and phenotypic design of the arabinose specialist.
