    snippet: Deletion of ACE2 in a diploid, arabinose-specialist Saccharomyces cerevisiae strain yielded a multicellular, fast-sedimenting phenotype
    explanation: Identifies the engineered arabinose specialist and its sedimenting phenotype.
ecological_interactions:
- name: Glucose-Arabinose Substrate Specialization
  description: The two S. cerevisiae strains occupy distinct metabolic niches as glucose and arabinose specialists during mixed-substrate fermentation.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Co-cultures of a glucose-specialist S. cerevisiae strain with the sedimenting arabinose specialist on a glucose-arabinose mixture
    explanation: Supports the exact two-specialist composition and substrate partitioning.
- name: Selective Sedimentation Accelerates Mixed-Sugar Conversion
  description: Retention of the fast-sedimenting arabinose specialist raises its biomass concentration across cycles, shortening coculture batch time and approaching simultaneous sugar depletion.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: showed a 29% shorter batch time than corresponding co-cultures with the non-sedimenting arabinose specialist
    explanation: Supports improved coculture kinetics attributable to the sedimenting specialist.
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Increasing the biomass settling period to 1 h further reduced the batch time to 8.1 ± 0.1 h and resulted in near-simultaneous depletion of both sugars
    explanation: Supports the effect of longer settling on batch duration and depletion timing.
