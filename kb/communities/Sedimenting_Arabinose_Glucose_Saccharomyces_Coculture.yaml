discussions:
- discussion_id: yeast_graph_evidence_scope
  prompt: How far does the selective-retention benefit transfer beyond the tested defined-medium process?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The source supports the specialist coculture comparison and settling-associated conversion benefit,
    but industrial transfer remains conditional. Retain the two existing directions with an explicit limitation
    on specialization alone as a cause. Do not equate faster batch conversion with faster intrinsic growth or mutualism.
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: if selective sedimentation of specific slow-fermenting strains can be implemented under relevant process
      conditions
    explanation: The authors make process transfer conditional rather than establishing universal performance.
