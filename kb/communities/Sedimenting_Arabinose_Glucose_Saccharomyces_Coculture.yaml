ecological_interactions:
- name: Glucose-Arabinose Substrate Specialization
  description: The two yeast specialists partition glucose and arabinose use in the tested defined-medium coculture.
    The slower arabinose conversion is the bottleneck for complete mixed-sugar depletion. This substrate specialization
    does not itself demonstrate reciprocal facilitation or explain the improvement obtained with selective biomass
    retention.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Selective Sedimentation Accelerates Mixed-Sugar Conversion
    description: 'PARTIAL: separating sugar use makes the slow arabinose specialist a target for selective retention.
      The faster overall conversion requires the sedimenting phenotype and repeated settling treatment; specialization
      alone was not shown to cause the batch-time improvement.'
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Co-cultures of a glucose-specialist S. cerevisiae strain with the sedimenting arabinose specialist
      on a glucose-arabinose mixture
    explanation: Supports the exact two-specialist composition and substrate partitioning.
- name: Selective Sedimentation Accelerates Mixed-Sugar Conversion
  description: Under the reported sequential-batch settling regime, cocultures containing the sedimenting arabinose
    specialist had a 29% shorter batch time than those with its non-sedimenting counterpart. The authors attribute
    the improvement to selective biomass retention. This is a process-level conversion outcome, not a separate niche-partitioning
    interaction or evidence of faster intrinsic growth.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Near-Simultaneous Mixed-Sugar Depletion
    description: Longer settling increased retained biomass and accelerated arabinose conversion, bringing its depletion
      closer to glucose depletion in the tested sequential-batch coculture. This supports the retention-to-timing
      direction under the reported treatment, not a universal relation between settling and performance.
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: showed a 29% shorter batch time than corresponding co-cultures with the non-sedimenting arabinose specialist
    explanation: Supports improved coculture kinetics attributable to the sedimenting specialist.
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Increasing the biomass settling period to 1 h further reduced the batch time to 8.1 ± 0.1 h and resulted
      in near-simultaneous depletion of both sugars
    explanation: Supports the effect of longer settling on batch duration and depletion timing.
- name: Near-Simultaneous Mixed-Sugar Depletion
  description: The reported longer-settling treatment yielded near-simultaneous glucose and arabinose depletion
    and a batch time of 8.1 hours. This is the measured timing outcome of the tested two-specialist process, distinct
    from the underlying substrate partitioning and not proof of an interstrain benefit.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42461012
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Increasing the biomass settling period to 1 h further reduced the batch time to 8.1 ± 0.1 h and resulted
      in near-simultaneous depletion of both sugars
    explanation: Supports matched glucose and arabinose depletion as the downstream process outcome of extending
      selective sedimentation.
