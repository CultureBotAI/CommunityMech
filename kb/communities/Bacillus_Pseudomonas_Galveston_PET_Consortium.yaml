    explanation: Supports the LCFBM base medium composition.
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For PET plastic growth, the cultures were grown in triplicate in LCFBM supplemented with 1% (wt/vol) PET granules
    explanation: Supports PET as the LCFBM substrate.
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grown statically for 7 weeks
    explanation: Supports the PET incubation mode and duration.
