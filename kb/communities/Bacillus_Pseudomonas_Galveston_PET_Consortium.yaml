discussions:
- discussion_id: pet_hgt_directionality
  prompt: Which predicted horizontal-gene-transfer candidates are directional, recent PET-relevant transfers rather than older
    shared hydrocarbon-soil adaptation?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - ecological_interactions#Bacillus-Pseudomonas PET division of labor
  rationale: The study reports enriched accessory-genome HGT signatures but explicitly interprets most of them as survival,
    biofilm, stress, regulatory, and core metabolic flexibility rather than direct PET-degradation functions.
  evidence:
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: full_text
    snippet: no specific transferred gene set was sufficient to explain PET degradation as a recently acquired pathway
    explanation: Supports leaving HGT direction and PET-specificity as interpretive rather than asserted causal edges.
  posed_by: codex
  posed_date: '2026-09-14'
- discussion_id: pseudomonas_10_13_2_resolution
  prompt: Can Pseudomonas strains 10 and 13.2 be assigned distinct strain-specific PET or MHET functions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Pseudomonas sp. 10
  - taxonomy#Pseudomonas sp. 13.2
  rationale: The two strains remain distinct BioSamples and community members, but the 2026 comparative analysis collapsed
    them into one 10/13.2 unit because of near-complete genomic identity and unresolved contributions under consortium conditions.
  evidence:
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: full_text
    snippet: Pseudomonas strains 10 and 13.2 collapsed into a single operational unit for comparative analyses
    explanation: Supports not assigning different 2026 comparative functions to Pseudomonas strains 10 and 13.2.
  posed_by: codex
  posed_date: '2026-09-14'
