ecological_interactions:
- name: Bacillus-Pseudomonas PET division of labor
  description: 'Bacillus and Pseudomonas members have overlapping but unevenly distributed capacities: Bacillus strains are
    associated more strongly with PET surface colonization and extracellular hydrolysis, while Pseudomonas strains are associated
    more strongly with aromatic-intermediate transport, redox balancing, and downstream assimilation.'
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
