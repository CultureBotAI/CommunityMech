    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the investigation of MHET degradation, 5 mL tubes containing LCFBM were supplemented with 0.2% (wt/vol) MHET
    explanation: Supports the MHET medium and tube volume.
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: incubated aerobically for 21 days
    explanation: Supports the aerobic 21-day MHET incubation.
