    term:
      id: CHEBI:53259
      label: poly(ethylene terephthalate) macromolecule
  - preferred_term: terephthalic acid
    term:
      id: CHEBI:15702
      label: terephthalic acid
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PET depolymerization, oligomer transformation, intermediate detoxification, and downstream aromatic metabolism
      are distributed across the community
    explanation: Supports a community-level division of PET-degradation functions.
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacillus contributing more strongly to extracellular hydrolysis, surface association, and persistence, while
      Pseudomonas are more strongly associated with aromatic transport, redox balancing, and downstream assimilation
    explanation: Supports the reported Bacillus/Pseudomonas functional partitioning.
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the full consortium showed the most complete PET-associated transformation
    explanation: Supports keeping the strongest PET-transforming unit at community scope.
  - reference: PMID:42627158
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: individual isolates retained partial and strain-specific activities
    explanation: Supports treating monoculture PET activity as partial rather than complete.
