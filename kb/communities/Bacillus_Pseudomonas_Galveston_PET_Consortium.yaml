id: CommunityMech:000370
name: Bacillus-Pseudomonas Galveston PET Consortium
description: A naturally occurring five-member bacterial consortium isolated from petroleum-polluted coastal soil in Galveston
  Bay, Texas, and examined for polyethylene terephthalate (PET) biodegradation in carbon-free basal medium with PET granules
  or MHET. The consortium contains Bacillus thuringiensis 9.1, Bacillus cereus 13.1, and Pseudomonas species strains 9.2,
  10, and 13.2. Integrated comparative genomics, secreted-proteome profiling, HPLC, and LC-MS analyses support a distributed
  PET-degradation model in which Bacillus strains contribute more strongly to extracellular hydrolysis, polymer-surface association,
  and persistence, while Pseudomonas strains contribute more strongly to aromatic transport, redox balancing, and downstream
  assimilation of PET-derived intermediates.
