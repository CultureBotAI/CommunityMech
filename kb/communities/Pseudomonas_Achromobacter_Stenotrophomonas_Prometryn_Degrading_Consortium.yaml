id: CommunityMech:000470
name: Pseudomonas, Achromobacter, and Stenotrophomonas Prometryn-Degrading Consortium
description: Defined 1:1:1 synthetic bacterial consortium composed of Pseudomonas sp. ZM-1, Achromobacter sp. ZM-2, and Stenotrophomonas
  sp. ZM-3 isolated from long-term prometryn-contaminated cornfield soil in Harbin, China. The consortium synergistically
  degrades the methylthio-s-triazine herbicide prometryn (96.87% removal in 12 h in liquid culture and 96.3% removal over
  30 days in soil microcosms) and alleviates prometryn phytotoxicity in maize (Zea mays).
