ecological_interactions:
- name: Cooperative Tri-Strain Degradation of Prometryn Herbicide
  description: Pseudomonas sp. ZM-1, Achromobacter sp. ZM-2, and Stenotrophomonas sp. ZM-3 cooperatively degrade prometryn
    in a 1:1:1 synthetic consortium, achieving 96.8% removal within 15 h in liquid medium and 96.3% removal in soil microcosms.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: Pseudomonas sp. ZM-1
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  target_taxon:
    preferred_term: Achromobacter sp. ZM-2
    term:
      id: NCBITaxon:222
      label: Achromobacter
  biological_processes:
  - preferred_term: xenobiotic catabolic process
    term:
      id: GO:0042178
      label: xenobiotic catabolic process
  downstream:
  - target: Alleviation of Prometryn Phytotoxicity and Restoration of Maize Growth
    description: 'DIRECTLY IMPLIED: Rapid consortium-mediated prometryn removal in soil reduces herbicide exposure and restores
      maize growth.'
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The 1:1:1 synthetic consortium removed 96.8% of prometryn in 15 h, showing markedly superior degradation efficiency
      compared with single strains, and its 12-h degradation rate reached 96.87% with a half-life of 2.2 h following response
      surface optimization.
    explanation: Demonstrates synergistic prometryn degradation by the 1:1:1 three-strain consortium.
- name: Alleviation of Prometryn Phytotoxicity and Restoration of Maize Growth
  description: Cooperative prometryn degradation by Achromobacter sp. ZM-2 and Stenotrophomonas sp. ZM-3 in contaminated soil
    alleviates herbicide phytotoxicity in maize (Zea mays), restoring plant growth to 95-97% of uncontaminated control levels.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Achromobacter sp. ZM-2
    term:
      id: NCBITaxon:222
      label: Achromobacter
  target_taxon:
    preferred_term: Stenotrophomonas sp. ZM-3
    term:
      id: NCBITaxon:40323
      label: Stenotrophomonas
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42795638
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Maize pot experiments confirmed that the consortium significantly alleviated prometryn phytotoxicity at the tested
      concentration, restoring plant growth parameters to 95-97% of the uncontaminated control.
    explanation: Demonstrates alleviation of prometryn phytotoxicity in maize pot experiments.
