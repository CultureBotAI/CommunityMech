- name: Root Exudate Gluconeogenic Acid Cross-Feeding
  description: PSY rice root exudates are elevated in gluconeogenic acids,
    primarily amino acids, that stimulate the H2-oxidizing rhizosphere bacteria
    enriched for gluconeogenic-acid utilization genes. The source is the plant
    host (abiotic-from-the-microbial-perspective), so this is curated as a
    community-level interaction.
  interaction_type: CROSS_FEEDING
