id: CommunityMech:000216
name: PSY Transgenic Rice Rhizosphere Methane-Mitigating Community
description: >
  A rice rhizosphere microbial community whose H2 cycling and methanogenesis are
  reshaped by host overexpression of PLANT PEPTIDES CONTAINING SULFATED TYROSINE
  (PSY) genes. Two independent transgenic rice genotypes (PSY1 and PSY2) reduced
  cumulative CH4 emissions by 38 percent and 58 percent over 70 days relative to
  controls. Genome-resolved metatranscriptomic, metagenomic, metabolomic, and
  metabolic modeling data from PSY rhizosphere soils show lower ratios of CH4
  production versus consumption gene activities (largely hydrogenotrophic),
  decreased H2-producing gene activity, and increased bacterial H2 oxidation
  pathways. Assembled genomes of rhizosphere H2-oxidizing bacteria are enriched
  in gluconeogenic-acid utilization genes, and their activity is likely
  stimulated by elevated gluconeogenic-acid amino acids in PSY rice root
  exudates, lowering H2 available for hydrogenotrophic methanogens.
ecological_state: ENGINEERED
community_origin: NATURAL
community_category: RHIZOSPHERE
engineering_design:
  objective: Reduce methane emissions from rice paddies by engineering the host
    plant to reshape rhizosphere microbial H2 cycling.
  assembly_strategy: Overexpress PSY genes in two independent rice genotypes
    (PSY1 and PSY2) and propagate the natural rhizosphere microbial community
    around the transgenic roots.
  perturbation_design: Compare cumulative CH4 emissions and rhizosphere
    metatranscriptomes, metagenomes, and metabolomes between PSY transgenic
    rice and control rice over 70 days of growth.
  measurement_endpoints:
  - Cumulative CH4 emissions over 70 days
  - Ratios of CH4 production versus consumption gene activities
  - H2 production versus oxidation gene and pathway activities
  - Gluconeogenic-acid content of root exudates
  - Gene content of H2-oxidizing rhizosphere bacterial genomes
  evidence:
  - reference: PMID:41582156
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: two independent rice genotypes overexpressing genes for PLANT
      PEPTIDES CONTAINING SULFATED TYROSINE (PSY) reduce cumulative CH4
      emissions by 38% (PSY1) and 58% (PSY2) over 70 days of growth compared
      with controls
    explanation: Supports the PSY transgenic engineering strategy and the
      observed CH4 reductions.
  - reference: PMID:41582156
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a powerful strategy to mitigate CH4 emissions from increasingly
      widespread rice cultivation
    explanation: Supports the methane-mitigation objective.
