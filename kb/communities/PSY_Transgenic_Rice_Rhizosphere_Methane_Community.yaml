    term:
      id: GO:0015948
      label: methanogenesis
  downstream:
  - target: Reduced Methane Emissions and Proposed H2 Limitation
    description: HYPOTHESIZED - Greater bacterial H2 consumption could reduce substrate available for hydrogenotrophic
      methanogenesis and contribute to lower methane. Transcript patterns and individual metabolic models support
      this mechanism indirectly; H2 depletion, pairwise competition and the fraction of methane reduction mediated
      by this route were not directly isolated.
  evidence:
  - reference: PMID:41582156
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: increased activity of bacterial H2 oxidation pathways
    explanation: Supports the proposed guild-level competition mechanism through transcript/model interpretation,
      not direct H2-pool or pairwise perturbation measurements.
  - reference: PMID:41582156
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: decreased CH4 emissions are due to a lower amount of H2 available for hydrogenotrophic methanogenesis
    explanation: Supports the proposed guild-level competition mechanism through transcript/model interpretation,
      not direct H2-pool or pairwise perturbation measurements.
- name: PSY Root Exudate Effects and Proposed Bacterial Substrate Preference
  description: The living rice host, not an abiotic source, produces exudates with altered composition. Axenic seedling
    metabolomics found enriched gluconeogenic compounds, largely amino acids, without a significant total-carbon
    difference. Adding whole PSY1 or PSY2 exudates to soil caused lower CH4 than Kitaake exudates; water controls
    produced no detected CH4. HYPOTHESIZED - Genomic substrate preferences and PSY1 transcript associations suggest
    selective support of H2-consuming bacteria, but a specific amino-acid transfer or uptake-mediated mechanism
    was not isolated. Seedling exudates are not direct samples of mature soil-grown root flux.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: rhizosphere H2-oxidizing bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
  - preferred_term: amino acid catabolic process
    term:
      id: GO:0009063
      label: amino acid catabolic process
  downstream:
  - target: Proposed H2 Oxidation Competition with Methanogenesis
    description: PARTIAL - Altered exudate composition may support biomass and activity of H2-consuming guilds enriched
      for gluconeogenic-acid use, indirectly contributing to the proposed H2 competition. The model predicts little
      direct effect of exudate enrichment on H2 oxidation itself; increased oxidation responds mainly to O2. Whole-exudate
      methane suppression is experimentally supported but does not resolve this specific mediator.
  evidence:
  - reference: PMID:41582156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Soils treated with Kitaake exudates exhibited consistently higher CH4 emissions than those treated
      with PSY1 or PSY2 exudates
    explanation: Direct whole-exudate soil amendment supports a methane response, not attribution to individual
      amino acids.
  - reference: PMID:41582156
    supports: PARTIAL
    evidence_source: OTHER
    snippet: their activities are likely stimulated by elevated levels of gluconeogenic acids, primarily amino acids,
      in PSY root exudates
    explanation: Author-proposed substrate preference mechanism; not directly traced uptake.
- name: Reduced H2-Producing Transcripts and Modeled H2 Supply
  description: PSY1 rhizospheres showed lower expression of H2-producing hydrogenases and nitrogenase markers than
    Kitaake at specified sampling stages. Individual dFBA models predict less H2 production with enriched PSY1 exudate
    compounds, even where producer biomass increases. This distinguishes gene-expression measurements and modeled
    flux from reduced producer abundance or directly measured H2 supply. It is not by itself a -/- competition phenotype.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: rhizosphere H2-producing bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  metabolites:
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  downstream:
  - target: Reduced Methane Emissions and Proposed H2 Limitation
    description: HYPOTHESIZED - Lower H2-generating activity could restrict substrate supply for hydrogenotrophic
      methanogenesis. Gene-expression patterns and predicted H2 flux are consistent with this direction, but do
      not measure the shared H2 pool or isolate the causal contribution to greenhouse CH4 reduction.
  evidence:
  - reference: PMID:41582156
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: decreased activity of H2-producing genes
    explanation: Supports lower transcript activity in PSY1 rhizospheres, not direct H2 flux.
  - reference: PMID:41582156
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: suppressed H2 production in the PSY rhizosphere
    explanation: Metabolic-model prediction, not an in-vivo H2 measurement.
- name: Reduced Methane Emissions and Proposed H2 Limitation
  description: Greenhouse rice grown in agronomic soil emitted less cumulative CH4 with PSY1 (about 38%) and PSY2
    (about 58%) than Kitaake over 70 days. Repeated timepoints were integrated at tub level, not as repeat observations
    of the same destructively sampled plant. Microbial omics and metabolic modeling focused on PSY1. HYPOTHESIZED
    - Lower H2 production and greater bacterial consumption restrict hydrogenotrophic methanogenesis; inferred oxygenation
    and methane oxidation may also contribute. Lower measured CH4 is demonstrated, but the H2-mediated fraction,
    oxygen concentration and in-situ H2 pool are unresolved.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:41582156
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: reduce cumulative CH4 emissions by 38% (PSY1) and 58% (PSY2) over 70 days of growth compared with controls.
    explanation: Direct greenhouse emission phenotype; downstream microbial omics focused on PSY1.
  - reference: PMID:41582156
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Metabolic modeling using metagenomic and metabolomic data predicts elevated H2 oxidation and suppressed
      H2 production
    explanation: Supports the modeled hydrogen mechanism, not measured H2 depletion.
