discussions:
- discussion_id: psy-exudate-perturbation-versus-hydrogen-mediation
  prompt: How should the demonstrated whole-exudate methane response be linked without equating it with resolved
    amino-acid or hydrogen mediation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Proposed H2 Oxidation Competition with Methanogenesis
  - ecological_interactions#PSY Root Exudate Effects and Proposed Bacterial Substrate Preference
  - ecological_interactions#Reduced H2-Producing Transcripts and Modeled H2 Supply
  - ecological_interactions#Reduced Methane Emissions and Proposed H2 Limitation
  rationale: Three existing arrows remain explicitly partial or hypothesized. The direct exudate-to-methane link
    merits extension review; a one-community Edison dry run is not a report or spend authorization. Individual dFBA
    models are not a coupled methanogen competition experiment. Preserve living-host effects, greenhouse CH4 and
    soil-exudate perturbations while separating PSY1 omics, seedling sampling, oxygen inference, transcripts and
    model flux. Specific compounds, H2 addback and field transfer need further evidence.
  evidence:
  - reference: PMID:41582156
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Soils treated with Kitaake exudates exhibited consistently higher CH4 emissions than those treated
      with PSY1 or PSY2 exudates
    explanation: Direct whole-exudate soil amendment supports a methane response, not attribution to individual
      amino acids.
  posed_by: codex
