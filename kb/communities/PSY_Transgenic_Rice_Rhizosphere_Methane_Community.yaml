ecological_interactions:
- name: Proposed H2 Oxidation Competition with Methanogenesis
  description: HYPOTHESIZED - PSY1 rhizospheres had higher transcription of bacterial H2-consuming hydrogenases,
    supporting the proposal that bacterial H2 use restricts substrate for hydrogenotrophic methanogens. This is
    not a measured H2 pool or isolated pairwise competition experiment. Individual genome-scale models predict increased
    H2 oxidation mainly with higher O2; elevated exudate compounds have little direct effect on oxidation but support
    biomass. Canonical Bacteria and Archaea IDs denote the named functional guilds, not all members of those domains.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: rhizosphere H2-oxidizing bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
    preferred_term: hydrogenotrophic methanogens
    term:
      id: NCBITaxon:2157
      label: Archaea
