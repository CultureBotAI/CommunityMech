    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We set out to measure the preference of C. elegans for the odors of the twelve bacterial species that
      comprise CeMbio.
    explanation: Supports the individual-member odor experiment, not a whole-consortium preference or facilitated
      colonization.
environmental_factors:
- name: NGM and peptone-free NGM plate environment
  value: NGM or PFM plates seeded with CeMbio bacterial inoculum
  description: CeMbio colonization experiments varied plate medium and sampling time to test gut colonization
    dynamics under laboratory C. elegans growth conditions.
  evidence:
  - reference: PMID:32669368
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Synchronized C. elegans L1 animals were raised at 20° on 6 cm plates containing either NGM or peptone-free NGM (PFM)
    explanation: Supports NGM/PFM plate conditions for community colonization assays.
- name: culture medium and temperature
  value: LB at 25-28 C; nematodes at 20 C
  description: CeMbio strains can be grown together using simple rich medium protocols and applied to
    synchronized C. elegans larvae under standard nematode growth conditions.
  evidence:
  - reference: PMID:32669368
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All CeMbio strains grow in Luria broth medium (LB; 10 g/l tryptone, 5 g/l yeast extract, 5 g/l NaCl
    explanation: Supports shared LB growth conditions for the bacterial strains.
growth_media:
