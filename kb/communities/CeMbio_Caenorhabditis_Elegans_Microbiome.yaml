- name: Strain-Resolved Metabolic Diversity
  description: Genome-scale models and Biolog phenotyping showed diverse metabolic capabilities among the
    twelve members, including variable predicted carbon-source utilization that can shape community assembly
    and competition in the worm gut.
  interaction_type: NICHE_PARTITIONING
