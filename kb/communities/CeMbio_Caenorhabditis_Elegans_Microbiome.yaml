  temperature_unit: C
  atmosphere: AEROBIC
  preparation_notes: CeMbio strains are cryopreserved in glycerol/LB and can be grown in LB or on LB agar
    before mixing into inocula for C. elegans plate assays.
  evidence:
  - reference: PMID:32669368
