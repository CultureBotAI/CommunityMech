ecological_interactions:
- name: Multi-Strain C. elegans Gut Colonization
  description: CeMbio members colonized C. elegans individually and in mixtures, with medium-, time- and strain-dependent
    abundance. This establishes gut association, not member-to-member colonization facilitation or mediation of
    host development.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: CeMbio v1.0 bacterial strain consortium
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
    preferred_term: Caenorhabditis elegans
    term:
      id: NCBITaxon:6239
      label: Caenorhabditis elegans
  biological_processes:
  - preferred_term: multi-organism process
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:32669368
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: all CeMbio strains can establish themselves in the worm gut as community members
    explanation: Supports the core colonization interaction for the defined community.
- name: Community Effects on Nematode Development
  description: The complete CeMbio mixture accelerated developmental timing relative to OP50 food in N2 and CB4856
    worms. Individual members had heterogeneous effects. Adult-fraction timing is not direct biomass growth or evidence
    that both host and bacteria benefit.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: CeMbio v1.0 bacterial strain consortium
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
    preferred_term: Caenorhabditis elegans
    term:
      id: NCBITaxon:6239
      label: Caenorhabditis elegans
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:32669368
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the CeMbio community as a whole significantly enhanced growth rates for both host strains compared
      to growth on E. coli OP50
    explanation: The paper calls this growth rate, but the measured endpoint is developmental timing; it does not
      measure reciprocal fitness.
- name: Strain-Resolved Metabolic Diversity
  description: COMPUTATIONAL - gapseq/FBA models and substrate phenotyping distinguish member metabolic capacities.
    PARTIAL - the authors propose niche differentiation as a contributor to assembly; pathway counts did not explain
    individual colonization or community competitive fitness. Model agreement after training is not independent
    validation or measured gut flux.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: CeMbio v1.0 bacterial strain consortium
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Multi-Strain C. elegans Gut Colonization
    description: HYPOTHESIZED - differentiated nutrient-use capacities could favor community assembly. The source
      proposes this explanation but does not demonstrate that these capacities cause gut colonization patterns.
  evidence:
  - reference: PMID:32669368
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: The greatest differences in the predicted metabolic capabilities among the strains is observed in both
      biosynthesis and degradation of amino acids, carbohydrates, cofactors and vitamins
    explanation: Supports modeled capacity differences or their phenotype comparison, not causal in-gut resource
      partitioning.
  - reference: PMID:32669368
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: The carbon source utilization by the whole CeMbio community is highlighted in yellow.
    explanation: Supports modeled capacity differences or their phenotype comparison, not causal in-gut resource
      partitioning.
- name: CeMbio Odor Preference and Food-Seeking
  description: Individual-member odor assays favored JUb66, CEent1 and BIGb0393 relative to OP50. Inaccessible bacteria
    on the lid supplied volatile cues; these were not mixed-community, feeding or colonization assays. The preferred
    members are not all Enterobacteriaceae.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: CeMbio v1.0 bacterial strain consortium
    term:
      id: NCBITaxon:2
      label: Bacteria
  target_taxon:
