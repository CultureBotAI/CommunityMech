id: CommunityMech:000159
name: CeMbio Caenorhabditis elegans Microbiome
description: >
  CeMbio is a defined, ecologically informed twelve-strain bacterial community representing the natural
  Caenorhabditis elegans microbiome. The v1.0 community includes Enterobacter hormaechei CEent1,
  Lelliottia amnigena JUb66, Acinetobacter guillouiae MYb10, Sphingomonas molluscorum JUb134,
  Stenotrophomonas indicatrix JUb19, Pseudomonas lurida MYb11, Pseudomonas berkeleyensis MSPm1,
  Comamonas piscis BIGb0172, Pantoea nemavictus BIGb0393, Ochrobactrum vermis MYb71,
  Sphingobacterium multivorum BIGb0170, and Chryseobacterium scophthalmum JUb44. The resource pairs
  a genetically tractable host with cultured, genome-sequenced, CGC-distributed commensal isolates that
  colonize the worm gut as a community, alter nematode developmental timing, and support follow-up
  behavioral and metabolic studies with the same reference composition.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Build a simplified but natural C. elegans microbiome resource for mechanistic host-microbiome
    experiments in a genetically tractable animal model.
  assembly_strategy: Select cultured C. elegans-associated or habitat-associated bacterial isolates that
    represent the most common OTUs from natural C. elegans microbiome meta-analysis and can be grown and
    maintained with standard laboratory methods.
  inoculation_strategy: Grow each bacterial strain, mix equal volumes of washed cultures to create the
    CeMbio inoculum, and seed synchronized C. elegans larvae on NGM or peptone-free NGM plates.
  measurement_endpoints:
  - strain-resolved gut colonization
  - bacterial community composition in worms and lawns
  - C. elegans developmental timing
  - diagnostic PCR primer specificity
  - genome sequences and metabolic network reconstructions
  evidence:
  - reference: PMID:32669368
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we introduce CeMbio, a simplified natural Caenorhabditis elegans microbiota
    explanation: Supports the resource identity and its simplified-natural microbiome design objective.
