id: CommunityMech:000291
name: Pseudomonas stutzeri + Rhodococcus Naphthalene-degrading Biochar-bridged Engineered Consortium
description: Two-member engineered bioremediation consortium in which genetically engineered
  Pseudomonas stutzeri (overexpressing nahAc and nahB) and a Rhodococcus strain (overexpressing
  nahH and catA) are co-anchored on S-N-doped biochar to mineralize naphthalene. Pseudomonas
  stutzeri acts as an oxidative bio-anode that initiates naphthalene degradation and releases
  electrons, while the conductive biochar matrix mediates direct interspecies electron transfer
  (DIET) and extracellular electron transfer (EET) to Rhodococcus, which serves as a reductive
  bio-cathode driving oxygenolytic ring-cleavage catalysis. The resulting bioelectrochemical
  syntrophic circuit achieved >98.3% naphthalene removal and 89.5% mineralization by circumventing
  diffusive bottlenecks.
