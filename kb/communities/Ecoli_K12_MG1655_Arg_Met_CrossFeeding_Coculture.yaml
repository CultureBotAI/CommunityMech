  prompt: How do nutrient heterogeneity and reporter sensitivity mediate the Arg/Met fluorescence response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#ΔargA-ΔmetJ methionine cross-feeding
  - ecological_interactions#ΔmetA-ΔargR arginine cross-feeding
