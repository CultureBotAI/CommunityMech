environmental_factors:
- name: Arginine and methionine reciprocal auxotrophy
  value: ΔargA-ΔmetJ requires Arg and overproduces Met; ΔmetA-ΔargR requires Met and overproduces Arg
  description: The reciprocal amino-acid requirements and overproduction phenotypes make growth depend on extracellular Arg
    and Met exchange.
  evidence:
  - reference: PMID:42592155
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ΔargA-ΔmetJ required arginine (Arg) to grow but overproduced methionine (Met), while ΔmetA-ΔargR needed Met but
      overproduced Arg
    explanation: Supports the complementary Arg/Met requirements and overproduction phenotypes.
- name: Strain-ratio heterogeneity
  value: ΔargA-ΔmetJ:ΔmetA-ΔargR pre-culture ratios varied from 1:2/2:1 to 1:8/8:1
  description: The study varied the initial ratio of the two strains to test whether uneven strain distribution creates metabolite
    heterogeneity and changes cell noise.
  evidence:
  - reference: PMID:42592155
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultured ΔargA-ΔmetJ and ΔmetA-ΔargR under three different levels of heterogeneity in strain distribution
    explanation: Supports strain-ratio heterogeneity as a designed perturbation.
- name: Spatial structure
  value: shaken liquid, pre-mixed agar, and adjacent unmixed agar co-cultures
  description: Liquid shaking cultures were compared with agar-plate communities where the two populations were either well
    mixed or adjacent.
  evidence:
  - reference: PMID:42592155
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-cultured in liquid cultures with shaking (low), in agar plates with two populations well pre-mixed (medium)
      or placed adjacently without pre-mixing (high)
    explanation: Supports liquid and agar spatial-heterogeneity treatments.
