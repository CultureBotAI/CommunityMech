- name: Arg-Met obligate mutualism increases cell noise
  description: 'In the tested nutrient-limited Arg/Met coculture, reciprocal exchange was associated with higher
    single-cell fluorescent-reporter coefficient of variation than in supplemented monocultures. Mean amino-acid
    matching controls supported a heterogeneity interpretation. Reporter amino-acid sensitivity and experimental
    context matter: this is not a direct measurement of intrinsic transcriptional noise, a universal protein-noise
    effect or evidence that noise causes community collapse. MUTUALISM denotes the restricted reciprocal-growth
    model, not every supplementation condition.'
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
