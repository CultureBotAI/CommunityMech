id: CommunityMech:000455
name: E. coli K-12 MG1655 Arg-Met Cross-Feeding Coculture
description: A defined two-member synthetic Escherichia coli K-12 MG1655 coculture built from complementary double-mutant
  amino-acid auxotrophs. The ΔargA-ΔmetJ mutant requires arginine and overproduces methionine, while the ΔmetA-ΔargR mutant
  requires methionine and overproduces arginine, producing an obligate Arg/Met mutualism that the study used to test how metabolic
  cross-feeding changes single-cell fluorescence noise under liquid, strain-ratio, and spatial heterogeneity perturbations.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct an isogenic E. coli amino-acid cross-feeding system to test whether reciprocal metabolic exchange amplifies
    phenotypic heterogeneity and gene-expression noise within each strain population.
  assembly_strategy: Pair engineered E. coli K-12 MG1655 ΔargA-ΔmetJ and ΔmetA-ΔargR mutants whose complementary auxotrophy
    and overproduction phenotypes force reciprocal methionine and arginine exchange.
  perturbation_design: Compare mono-cultures with co-cultures, fluorescent reporter swaps, externally added Arg or Met commensalism
    controls, amino-acid gradients, strain-ratio heterogeneity levels, and liquid or agar spatial structures.
  measurement_endpoints:
  - single-cell GFP and BFP fluorescence by flow cytometry
  - co-culture and mono-culture cell noise at 8 h and 24 h
  - arginine and methionine secretion by LC-MS
  - strain-distribution heterogeneity inside shaken tubes
  - strain-ratio variation across spatial heterogeneity treatments
  notes: The article also reports fluorescent-protein swaps, a second ΔargA-ΔtrpR/ΔtrpC-ΔargR auxotrophic pair, and BL21-GFP
    pairings with environmental isolates; this record captures the primary ΔargA-ΔmetJ plus ΔmetA-ΔargR Arg/Met pair because
    it is the mechanistic system used throughout the main strain-distribution and spatial-heterogeneity experiments.
  evidence:
  - reference: PMID:42592155
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: metabolic cross-feeding system consisting of two genetically engineered double-mutant strains of E. coli, ΔargA-ΔmetJ
      and ΔmetA-ΔargR
    explanation: Supports the two-member engineered E. coli design.
  - reference: PMID:42592155
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study utilized four engineered E. coli K-12 MG1655 double-mutant strains, ΔargA-ΔmetJ, ΔargA-ΔtrpR, ΔmetA-ΔargR
      and ΔtrpC-ΔargR
    explanation: Supports K-12 MG1655 as the strain background for the engineered mutants.
  - reference: PMID:42592155
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Experiments 3–6: To test whether nutrient heterogeneity could alter noise, we experimentally manipulated low,
      medium and high levels of AA, strain ratio and spatial structure heterogeneity in synthetic consortia'
    explanation: Supports the amino-acid, strain-ratio, and spatial perturbation design.
