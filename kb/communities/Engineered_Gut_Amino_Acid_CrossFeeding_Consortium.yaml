- name: Beneficial Interaction Shift
  description: A Bayesian dynamical model fitted to in-vitro strain-specific qPCR growth trajectories inferred two
    positive effects from B. fragilis toward E. coli and S. Typhimurium, with weaker evidence for several negative
    interactions than in the WT consortium. These are model-inferred net effects under inoculum perturbations, not
    direct molecular exchange measurements or proof that antagonism vanished. They do not establish reciprocal benefit
    among every member or identify the same interaction network in vivo.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Cross-Feeding Increased Population Evenness
    description: 'PARTIAL: Engineered nutritional dependencies and altered inferred net interactions are consistent
      with the greater evenness observed in separate in-vitro endpoint assays. The interaction-shift node was not
      selectively perturbed to establish mediation. Extension of this pathway to the day-10 mouse-gut endpoint is
      HYPOTHESIZED; in-vitro network inference does not measure in-vivo exchange.'
  evidence:
  - reference: doi:10.1128/mSystems.00352-19
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: genetic modifications alleviated antagonistic interactions and resulted in beneficial interactions
    explanation: The abstract conclusion is based on in-vitro growth perturbations and statistical network inference,
      not direct measurement of every molecular interaction.
  - reference: PMID:31409662
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: although some inferred negative interactions are still present
    explanation: Reduced confidence in negative edges is not evidence that all antagonism disappeared.
