discussions:
- discussion_id: gut_crossfeeding_model_and_in_vivo_mediation
  prompt: Which nutritional interactions mediate the diet-dependent mouse-gut evenness endpoint?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Engineered Amino Acid Cross-Feeding
  - ecological_interactions#Beneficial Interaction Shift
  - ecological_interactions#Cross-Feeding Increased Population Evenness
  rationale: 'Keep unequal supernatant rescue distinct from community growth. The Bayesian model used in-vitro qPCR
    time series with inoculum perturbations; its net interaction edges do not identify molecular flux or prove an
    all-to-all mutualistic network. Higher-order effects were not supported by those data, not biologically excluded.
    Separate the 27-hour trajectory assays from 24-hour supplementation endpoints and day-10 fecal DNA-qPCR. Low-protein
    diet changes more than a single measured amino-acid flux, and the standard-diet evenness trend was nonsignificant.
    Do not extrapolate to longitudinal stability, conventional microbiota or clinical benefit. Canonical B. fragilis
    AMBIGUOUS grounding is preserved, not resolved. Non-graph cache-access wording remains #1457; cache pointer/casing
    issues remain #1094/#1091. No new genetic engineering procedures or pairwise mechanisms are added.'
  posed_by: codex
  posed_date: '2026-10-06'
