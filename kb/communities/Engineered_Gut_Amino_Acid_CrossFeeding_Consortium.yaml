- name: Cross-Feeding Increased Population Evenness
  description: The engineered four-member consortium had higher Pielou evenness in anaerobic endpoint cultures,
    especially without supplemented cross-fed amino acids, despite lower overall growth in the unsupplemented in-vitro
    setting. In gnotobiotic mice, day-10 fecal strain-specific DNA-qPCR supported greater evenness for the engineered
    consortium on the low-protein diet; the standard-diet trend was not statistically significant. This is a composition
    endpoint, not longitudinal stability, a conventional microbiome or a host-health benefit. The assay does not
    directly measure amino-acid flux in the gut.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
  evidence:
  - reference: PMID:31409662
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Engineered cross-feeding increased population evenness
    explanation: Supports the engineered-versus-WT composition outcome, not selective mediation by each inferred
      interaction.
  - reference: PMID:31409662
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: low-protein diet showed significantly greater population evenness
    explanation: Supports the diet-specific day-10 gnotobiotic-mouse endpoint, not a significant standard-diet effect
      or measured in-vivo exchange.
  - reference: PMID:31409662
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: although this trend was not statistically significant
    explanation: The standard-diet evenness trend did not meet the reported significance criterion.
