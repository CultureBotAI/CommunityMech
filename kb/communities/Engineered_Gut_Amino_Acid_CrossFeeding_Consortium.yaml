ecological_interactions:
- name: Engineered Amino Acid Cross-Feeding
  description: Engineered auxotrophy and amino acid overproduction supported consortium growth without external
    addition of the designated cross-fed amino acids. LC-MS production measurements and supernatant-rescue assays
    show unequal capacities, not complete measured all-to-all transfer. B. fragilis was not rescued by the tested
    overproducer supernatants although it grew in coculture. These observations support community-level nutritional
    dependence without identifying a dedicated transporter or proving all partner-specific fluxes. Canonical participants
    describe the studied four-member consortium.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: amino acid
    term:
      id: CHEBI:33709
      label: amino acid
    notes: Generic exchanged amino-acid class, not a complete quantified partner-to-partner flux map.
  biological_processes:
  - preferred_term: cellular amino acid biosynthetic process
    term:
      id: GO:0008652
      label: amino acid biosynthetic process
  downstream:
  - target: Beneficial Interaction Shift
    description: 'PARTIAL: The combined dependency/overproduction intervention introduced nutritional support and
      changed the in-vitro growth trajectories used to infer interaction structure. Unequal rescue and remaining
      negative-interaction uncertainty prevent interpreting this as a measured fully mutualistic all-to-all network.'
  evidence:
  - reference: doi:10.1128/mSystems.00352-19
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each strain is auxotrophic for three amino acids and overproduces one
    explanation: Supports the reciprocal amino acid auxotrophy and overproduction design.
  - reference: doi:10.1128/mSystems.00352-19
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cross-feeding capabilities of each strain were assessed
    explanation: Supports experimental testing of cross-feeding capacity between engineered strains.
  - reference: PMID:31409662
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B. fragilis growth was not rescued by any of the strains
    explanation: The supernatant result limits complete reciprocal-rescue claims; coculture growth differs.
