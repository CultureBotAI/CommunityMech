id: CommunityMech:000151
name: Engineered Gut Amino Acid Cross-Feeding Consortium
description: >
  A four-species engineered mammalian-gut consortium in which Escherichia coli, Salmonella enterica
  serovar Typhimurium, Bacteroides thetaiotaomicron, and Bacteroides fragilis were modified to create
  amino acid auxotrophies and amino acid overproduction. The design converts a consortium otherwise
  shaped by antagonistic interactions into one with engineered beneficial cross-feeding, increasing
  population evenness in anaerobic in vitro culture and in low-protein-diet gnotobiotic mice.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Engineer positive amino acid cross-feeding into a defined multispecies mammalian-gut
    consortium to test whether metabolite exchange can shape consortium composition and population
    evenness.
  assembly_strategy: Four genetically tractable gut-associated bacterial species were engineered so each
    strain carried amino acid auxotrophies and overproduced a different amino acid.
  perturbation_design: In vitro anaerobic batch cocultures varied amino acid supplementation and starting
    inoculum; gnotobiotic mice were fed standard or low-protein chow before consortium composition was
    quantified.
  measurement_endpoints:
  - amino acid overproduction
  - auxotroph rescue in spent medium
  - strain-specific qPCR growth trajectories
  - population evenness
  - gnotobiotic mouse fecal strain abundance
  evidence:
  - reference: doi:10.1128/mSystems.00352-19
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: introduced metabolic dependencies and metabolite overproduction into four bacterial species
    explanation: Supports the engineered metabolic dependency and overproduction design.
