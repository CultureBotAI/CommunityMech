ecological_interactions:
- name: Keystone-Taxa SynCom Suppression of Fusarium oxysporum
  description: >
    The recombined three-member SynCom (Pseudomonas, Duganella, Brevibacterium) antagonises the
    soilborne pathogen Fusarium oxysporum on strawberry and tomato more strongly than any single
    constituent strain, indicating an emergent community-level antifungal activity.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a synthetic community (SynCom) of keystone taxa exhibited enhanced antifungal effects
      against Fusarium oxysporum in both strawberry and tomato, compared to individual strains
    explanation: States both the antagonism and that the community effect exceeds the sum of its
      individual members, which is what makes this a community-level interaction.
- name: D-mannitol Enrichment of Pseudomonas in the Chlorella Phytomicrobiome
  description: >
    Applying 2% D-mannitol — a polyol associated with the microalga and its methanol extract —
    shifted the plant-associated microbiota and markedly increased Pseudomonas abundance,
    implicating an algal-derived compound as a recruitment signal for a keystone member.
  interaction_type: COLONIZATION_FACILITATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chlorella fusca CHK0059
    term:
      id: NCBITaxon:3073
      label: Scenedesmus fuscus
  target_taxon:
    preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
  - preferred_term: D-mannitol
    term:
      id: CHEBI:16899
      label: D-mannitol
    notes: Applied at 2%; the treatment under which Pseudomonas enrichment was observed.
  evidence:
  - reference: PMID:41937467
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: a notable increase in Pseudomonas abundance following 2% D-mannitol treatment
    explanation: PARTIAL - establishes that D-mannitol enriches Pseudomonas, but the paper reports
      an abundance shift under treatment rather than demonstrating that the microalga secretes
      D-mannitol in planta, so the algal origin of the signal remains inferred.
growth_media:
- name: R2A broth, Chlorella fusca CHK0059 culture
  composition:
  - name: R2A
    concentration: 3.15
    unit: g/L
    from_source: true
  temperature: 28.0
  temperature_unit: CELSIUS
  incubation_time: 5.0
  incubation_time_unit: DAYS
  light_regime: 16 h light / 8 h dark
  vessel_type: Broth culture, from a single colony picked off R2A agar
  preparation_notes: >-
    The alga's own culture, which is what the SynCom is assembled from. Extracted from the
    cached open-access full text rather than the abstract - #183 lists this record among
    those lacking growth conditions because the conditions are Methods-level, and the
    Methods are reachable now (PMC full text cached).
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'inoculate the single fresh CHK0059 colony to R2A broth (MB cell R2A 3.15 g per L),
      temperature; 28°C, period; 5 days, light; 16 h and dark; 8 hr in a day'
    explanation: Names the medium, temperature, duration and photoperiod in one sentence.
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C. fusca CHK0059 were streaked on R2A medium (MB cell R2A 3.15 g, Agar 20 g per L)
    explanation: The solid form the single colony was picked from.
- name: Treated-sample incubation, viability assay
  temperature: 27.0
  temperature_unit: CELSIUS
  vessel_type: Shaking incubator
  preparation_notes: >-
    The assay leg rather than the maintenance culture - samples were sampled at 12, 24, 36
    and 48 h, and viability read by dilution plating back onto R2A.
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the samples were cultured in a 27°C shaking incubator for designated time intervals
      (12 h, 24 h, 36 h, and 48 h)
    explanation: Names the assay temperature, agitation and sampling schedule.

environmental_factors:
- name: D-mannitol amendment
  value: '2%'
  description: >
    D-mannitol (CHEBI:16899) applied at 2% as one of the tested substances, alongside Chlorella
    itself and a Chlorella methanol extract. This is the condition under which Pseudomonas
    enrichment was observed, so it is the perturbation that links an algal-associated polyol to
    recruitment of a keystone member.
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: By applying various substances, including Chlorella, Chlorella methanol extract
      (methanol extract), and D-mannitol
    explanation: Lists the applied substances that define the tested conditions.
