  preferred_term: strawberry and tomato plant-associated environment
  term:
    id: ENVO:01001001
    label: plant-associated environment
  notes: Keystone taxa were identified within plant hosts treated with Chlorella and the SynCom was
    assayed on strawberry and tomato.
modeled_environment:
- preferred_term: strawberry rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: The rhizosphere compartment is not asserted from the 2026 SynCom paper, which does not state
    the sampling compartment; it comes from the 2025 precursor study of the same strain
    (PMID:40064531), which places the CHK0059-correlated keystone bacteria in the strawberry
    rhizosphere. That citation is carried as evidence on the Pseudomonas taxon entry, since
    EnvironmentDescriptor takes no evidence of its own.
