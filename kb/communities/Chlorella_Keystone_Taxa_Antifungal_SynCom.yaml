ecological_interactions:
- name: Chlorella-Substance Microbiome Restructuring
  description: In-vitro strawberry rhizosphere microbiome fractions changed composition and diversity during 12-
    and 36-hour exposure to live or sterilized CHK0059, methanol extract or D-mannitol. Responses differed by substance
    and time. Only Pseudomonas among the selected network groups was detected in these fractions; this is not demonstrated
    commensalism, in-plant recruitment or transfer from CHK0059 to the inoculated strains.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Chlorella fusca CHK0059
    term:
      id: NCBITaxon:3073
      label: Scenedesmus fuscus
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
  - preferred_term: D-mannitol
    term:
      id: CHEBI:16899
      label: D-mannitol
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'By applying various substances, including Chlorella, Chlorella methanol extract (methanol extract),
      and D-mannitol, we observed changes in microbial distribution and diversity

      '
    explanation: Supports substance-associated changes in cultured rhizosphere fractions. Methods, Results and Figure
      S4 distinguish this in-vitro relative-abundance assay from later inoculated plant experiments.
- name: Keystone-Taxa SynCom Suppression of Fusarium oxysporum
  description: PARTIAL - the four bacterial isolates, alone or in mixtures and sometimes with CHK0059, altered symptom-based
    Fusarium wilt disease indices in strawberry and tomato. Treat8 contains all four bacteria plus pathogen; Treat9
    additionally contains CHK0059. Results depend on arm, host and time; the full mixture does not uniformly outperform
    each single isolate. Disease reduction is not a fungal-load measurement or demonstrated competition, direct
    antibiosis, host-defense activation or formal synergy.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudoduganella rivuli FT92W
    term:
      id: NCBITaxon:2666085
      label: Pseudoduganella rivuli
  - preferred_term: Brevibacterium
    term:
      id: NCBITaxon:1696
      label: Brevibacterium
  - preferred_term: Fusarium oxysporum
    term:
      id: NCBITaxon:5507
      label: Fusarium oxysporum
  - preferred_term: Chlorella fusca CHK0059
    term:
      id: NCBITaxon:3073
      label: Scenedesmus fuscus
  evidence:
  - reference: PMID:41937467
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: a synthetic community (SynCom) of keystone taxa exhibited enhanced antifungal effects against Fusarium
      oxysporum in both strawberry and tomato, compared to individual strains
    explanation: The abstract labels effects antifungal. Primary treatment definitions and Figures 4/5 support host
      disease outcomes, not universal superiority or a separately measured upstream antagonism mechanism.
- name: Keystone Plant-Growth-Promoting Trait Pool
  description: PARTIAL - separate isolate screens found protease activity for 8C3D12; phosphate-solubilization,
    protease, CAS and Nfb responses for 6C7F4; CAS and Nfb responses for FT92W; and CAS plus Salkowski responses
    for REN4. Supplementary Table S2 additionally reports a positive FT92W Salkowski/IAA screen. Nfb color change
    is not measured nitrogen flux, and Salkowski color is not chemically resolved IAA. These screens do not establish
    colonization facilitation, community complementarity or necessary mediation of plant protection.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudoduganella rivuli FT92W
    term:
      id: NCBITaxon:2666085
      label: Pseudoduganella rivuli
  - preferred_term: Brevibacterium
    term:
      id: NCBITaxon:1696
      label: Brevibacterium
  evidence:
  - reference: PMID:41937467
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The FT92W and the 6C7F4 strains showed multiple PGP activities
    explanation: Main text supports separate FT92W and 6C7F4 PGP screens. Methods and actual Supplementary Figure
      S7 identify Nfb/CAS/plate assays; Table S2 also lists a positive FT92W IAA screen. These are proxies, not
      nitrogen flux or demonstrated community mediation.
  - reference: PMID:41937467
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'REN4 strain demonstrated siderophore production and indole-3-acetic acid (IAA) production abilities

      '
    explanation: Supports reported REN4 screening responses. The Methods use CAS and Salkowski assays; chemical
      IAA identity and in-plant causal necessity were not isolated.
- name: Strawberry Fusarium Wilt Disease-Index Reduction
  description: Under F. oxysporum f. sp. fragariae F9 challenge, the four-bacterium Treat8 had about 20% strawberry
    wilt disease index at week 5 versus about 60% for pathogen-only F, consistent with Figure 4. Treat9 adds CHK0059.
    Table S3 reports Treat8 mean shoot weight 1.47 g versus 0.43 g for F, while the single-isolate Treat3 mean was
    2.24 g. These are host symptom and growth endpoints, not proof of direct fungal inhibition or universal mixture
    superiority.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudoduganella rivuli FT92W
    term:
      id: NCBITaxon:2666085
      label: Pseudoduganella rivuli
  - preferred_term: Brevibacterium
    term:
      id: NCBITaxon:1696
      label: Brevibacterium
  - preferred_term: Fusarium oxysporum
    term:
      id: NCBITaxon:5507
      label: Fusarium oxysporum
  - preferred_term: strawberry
    term:
      id: NCBITaxon:3747
      label: Fragaria x ananassa
  - preferred_term: Chlorella fusca CHK0059
    term:
      id: NCBITaxon:3073
      label: Scenedesmus fuscus
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the SynCom treatment group showed a disease index 20% percentage
    explanation: Results plus visually inspected Figure 4 support the approximate week-5 Treat8/F contrast; it is
      not a terminal week-7 estimate or a fungal-burden assay.
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'The only SynCom treatment (Treat8) had an average shoot weight of 1.47 g

      '
    explanation: Table S3 corroborates Treat8 mean shoot weight 1.47 g, F 0.43 g and single-isolate Treat3 2.24
      g. SynCom-only means without alga, not without pathogen.
- name: Tomato Fusarium Wilt Disease-Index Reduction
  description: Under F. oxysporum f. sp. lycopersici challenge, the Results report week-4 mean tomato wilt disease
    indices of 25% for four-bacterium Treat8 and 18% for Treat9 with CHK0059, below pathogen-only F (about 68-75%).
    Single-isolate FT92W Treat2 is reported at 22.2%; Figure 5 shows overlapping post-hoc groups among effective
    arms. Thus lower disease severity does not establish universal full-mixture superiority, direct antagonism,
    competition or a specific host-defense mechanism.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudoduganella rivuli FT92W
    term:
      id: NCBITaxon:2666085
      label: Pseudoduganella rivuli
  - preferred_term: Brevibacterium
    term:
      id: NCBITaxon:1696
      label: Brevibacterium
  - preferred_term: Fusarium oxysporum
    term:
      id: NCBITaxon:5507
      label: Fusarium oxysporum
  - preferred_term: tomato
    term:
      id: NCBITaxon:4081
      label: Solanum lycopersicum
  - preferred_term: Chlorella fusca CHK0059
    term:
      id: NCBITaxon:3073
      label: Scenedesmus fuscus
  evidence:
  - reference: PMID:41937467
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Treat1, Treat2, Treat6, Treat7, Treat8, and Treat9 had lower disease index percentages

      '
    explanation: The primary Results and Figure 5 identify reduced symptom-based disease indices in multiple arms,
      including a single isolate. This supports treatment-specific host protection, not necessary synergy or direct
      pathogen inhibition.
- name: D-mannitol Enrichment of Pseudomonas in the Chlorella Phytomicrobiome
  description: In-vitro rhizosphere microbiome-fraction assays showed higher Pseudomonas relative abundance with
    exogenous 2% D-mannitol at 36 hours; Figure S4 also shows lower relative abundance in live and sterilized CHK0059
    arms. This compositional response is not absolute Pseudomonas growth, recruitment of 8C3D12 or 6C7F4 in plants,
    demonstrated algal mannitol secretion, or commensalism. A carbon-source mechanism is HYPOTHESIZED, not traced
    algal-to-bacterial transfer.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
  - preferred_term: D-mannitol
    term:
      id: CHEBI:16899
      label: D-mannitol
    notes: Applied at 2%; the treatment under which Pseudomonas enrichment was observed.
  evidence:
  - reference: PMID:41937467
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: a notable increase in Pseudomonas abundance following 2% D-mannitol treatment
    explanation: Supports a relative-abundance response under exogenous mannitol. Primary Methods/Results and Figure
      S4 distinguish it from absolute counts, strain-resolved recruitment and algal secretion.
