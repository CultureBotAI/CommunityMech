  attaches_to:
  - ecological_interactions#Chlorella-Substance Microbiome Restructuring
  - ecological_interactions#Keystone-Taxa SynCom Suppression of Fusarium oxysporum
  - ecological_interactions#Keystone Plant-Growth-Promoting Trait Pool
