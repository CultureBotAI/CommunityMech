id: CommunityMech:000313
name: Chlorella fusca CHK0059 Keystone-Taxa Antifungal SynCom
description: 'A four-isolate bacterial synthetic community selected from Chlorella-associated plant microbiome networks:
  Pseudomonas 8C3D12, Pseudoduganella rivuli FT92W (KACC 21474), Pseudomonas 6C7F4 and Brevibacterium renqingii
  REN4 (KCTC 49366). The two Pseudomonas isolates share a genus-level taxonomy entry here; three bacterial taxonomy
  entries do not mean three isolates. Table 1 distinguishes the network label Duganella from the inoculated Pseudoduganella
  strain. Treat8 combines all four bacteria with Fusarium challenge; Treat9 also contains C. fusca CHK0059. Host
  disease-index responses depend on treatment, host and time, without demonstrated universal superiority to single
  isolates or formal synergy. Separate in-vitro strawberry rhizosphere microbiome-fraction assays show compositional
  responses to live/killed Chlorella, methanol extract and mannitol. Algal mannitol secretion, strain-specific recruitment
  and the mechanism mediating plant protection remain unresolved. The 2025 precursor names Rhizomicrobium rather
  than Brevibacterium as its third correlated genus; the two studies do not establish identical keystone sets.'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Test plant disease and growth responses to four selected bacterial isolates, their mixtures and combinations
    with CHK0059; separately test microbiome-fraction responses to substance amendments.
  assembly_strategy: Bottom-up assembly of Pseudomonas 8C3D12 and 6C7F4, Pseudoduganella rivuli FT92W and Brevibacterium
    REN4. Compare singles, the 8C3D12/FT92W pair and all four bacteria, with or without CHK0059, under host-specific
    Fusarium challenge. Selection from network associations is not proof of in-plant recruitment.
  measurement_endpoints:
  - In-vitro microbiome-fraction composition and diversity at 12 and 36 hours
  - Pseudomonas relative abundance under substance treatments including 2% D-mannitol
  - Strawberry and tomato Fusarium wilt symptom-based disease indices
  - Plant phenotypes and separate isolate PGP screening assays
  evidence:
  - reference: PMID:41937467
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: a synthetic community (SynCom) of keystone taxa exhibited enhanced antifungal effects against Fusarium
      oxysporum in both strawberry and tomato, compared to individual strains
    explanation: The abstract summarizes disease effects. Table 1 and Figures 4/5 identify the four isolates and
      treatment arms; the results do not establish universal superiority or mechanistic mediation.
