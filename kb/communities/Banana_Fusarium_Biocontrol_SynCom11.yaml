  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At the end of the experiment, 35 dpt, symptom severity in SynCom-treated plants was significantly (P < 0.05)
      reduced by 35% compared to control ( Figures 4B,E ). Also, while in the control plants the vascular browning was 2.3
      (on a 0–4 scale), in SynCom-treated plants it was 1.4 (P < 0.05; Figure 4C ).
    explanation: Quantifies the 35% symptom-severity reduction and vascular-browning decrease (2.3 to 1.4) in Biocontrol Trial
      B with SynCom 1.1.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At transplanting, Foc density in the soil was significantly lower in the SynCom-treated samples but no significant
      difference occurred later on
    explanation: Documents that soil Foc suppression by SynCom 1.1 was transient at transplanting and did not persist at later
      time points.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Another experiment with inoculated soil but without banana plants showed that the transient or null effect of
      SynCom 1.1 on Foc TR4 in the soil was not dependent on the initial pathogen inoculum density (103, 105, or 107 CFU g–1)
      over 32 days ( Supplementary Figure S2 ).
    explanation: Confirms in unplanted soil microcosms across three pathogen inoculum densities that SynCom 1.1 does not cause
      sustained bulk-soil eradication of Foc TR4, bounding why Trial B symptom suppression is not modeled as downstream of
      bulk-soil pathogen removal.
- name: Intra-SynCom 1.1 Diffusible-Metabolite and Volatile Cross-Inhibition
  description: 'Cellophane-agar (PDA) and overlapping-plate assays among the seven SynCom 1.1 members demonstrated widespread
    intra-community antagonism: agar-diffusible metabolites of Pseudomonas sp. P1A1 completely inhibited Bacillus sp. BT1,
    Streptomyces sp. St2AOB1, and P1A1 itself while partially inhibiting P1C1 and BN8.2; Pseudomonas sp. P1C1 inhibited all
    tested bacterial members (including itself) while sparing Trichoderma virens T2C1.4; volatiles emitted by Bacillus sp.
    BT1 completely inhibited T2C1.4 while Pseudomonas spp. and Bacillus spp. volatiles stressed T2C1.4; and Foc R1/TR4 metabolites
    and commercial fusaric acid inhibited multiple bacterial members (especially BT1 and St2AOB1).'
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
