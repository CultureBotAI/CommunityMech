  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On these plates, Pseudomonas sp. PS5 and Trichoderma sp. T2C1.4 grew like in the control; therefore, they were
      resistant to metabolites produced by P1A1. In contrast, Bacillus sp. BT1 and Streptomyces sp. St2AOB1 did not grow at
      all, indicating they were sensitive to these metabolites. Pseudomonas sp. P1C1 and Bacillus sp. BN8.2 showed a faint
      growth (partially sensitive to the metabolites of P1A1).
    explanation: Documents the cellophane-PDA cross-inhibition profile of Pseudomonas sp. P1A1 against the other SynCom 1.1
      isolates.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas sp. P1C1 (third row of plates in Figure 5 ) inhibited all tested bacteria (including itself) but
      not the fungus Trichoderma sp. T2C1.4.
    explanation: Documents broad antibacterial cross-inhibition by Pseudomonas sp. P1C1 across all bacterial SynCom 1.1 members.
  - reference: PMID:35992653
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: fusaric acid, known as one of the secondary metabolites of Fusarium species, might be involved in such an interaction
    explanation: Supports fusaric acid as a candidate mediator of Foc antagonism toward SynCom 1.1 isolates based on exogenous
      EC50 assays.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Trichoderma sp. T2C1.4 showed some stress (no pigmentation and/or reduced growth) when exposed to Pseudomonas
      spp. and Bacillus spp. volatiles. Finally, volatiles emitted by Bacillus sp. BT1 completely inhibited this fungus.
    explanation: Demonstrates volatile-mediated inhibition of Trichoderma virens T2C1.4 by Bacillus sp. BT1 and stress from
      Pseudomonas spp. and Bacillus spp. volatiles in overlapping-plate assays.
- name: SynCom 1.1 Multi-Trait Biocontrol and PGP Enzyme/Metabolite Repertoire
  description: 'In vitro physiological characterization (Table 1) showed that the seven SynCom 1.1 isolates partition biocontrol
    and plant-growth-promotion traits across taxa: Bacillus spp. BN8.2 and BT1 were the sole producers of 2,3-butanediol,
    Pseudomonas spp. PS5, P1A1, and P1C1 were the sole phytase producers, and Trichoderma virens T2C1.4 (with weak activity
    in Streptomyces sp. St2AOB1) expressed ACC deaminase activity alongside shared catalase, siderophore, phosphatase, protease,
    HCN, and ammonia traits.'
