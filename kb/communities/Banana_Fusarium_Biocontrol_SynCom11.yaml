id: CommunityMech:000518
name: Banana Fusarium Wilt Biocontrol SynCom 1.1
description: 'A defined seven-isolate cross-kingdom synthetic microbial community (SynCom 1.1) assembled from banana rhizosphere
  isolates on Tenerife Island (Canary Islands, Spain) for biological control of Fusarium oxysporum f. sp. cubense tropical
  race 4 (Foc TR4). Prigigallo et al. 2022 constructed SynCom 1.1 from the seven most effective in vitro Foc antagonists across
  four genera: three Pseudomonas spp. isolates (Pseudomonas chlororaphis subsp. piscium PS5, Pseudomonas sp. P1A1, and Pseudomonas
  sp. P1C1), two Bacillus spp. isolates (Bacillus velezensis BN8.2 and Bacillus sp. BT1), one Streptomyces sp. isolate (St2AOB1),
  and one Trichoderma virens isolate (T2C1.4). In greenhouse Biocontrol Trial B on ''Gran Enana'' banana plants challenged
  with 5.105 CFU g^-1 soil Foc TR4, SynCom 1.1 reduced Fusarium wilt symptom severity by 35% and lowered the vascular browning
  index from 2.3 to 1.4 at 35 days post-transplanting (P < 0.05), while cellophane-agar and overlapping-plate assays revealed
  intra-community cross-inhibition among members and bidirectional antagonism with Foc that guided the subsequent reduction
  to the three-member SynCom 1.2 (PMID:35992653).'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Assemble an intermediate seven-member cross-kingdom biocontrol consortium (SynCom 1.1) composed exclusively of
    highly antagonistic banana rhizosphere isolates (>=75% of maximum in vitro Foc inhibition per taxon) to control banana
    Fusarium wilt and map member compatibility.
  assembly_strategy: Select the seven strongest Foc antagonists from the 44-isolate SynCom 1.0 library spanning Pseudomonas
    spp. (P1A1, P1C1, PS5), Bacillus spp. (BN8.2, BT1), Streptomyces sp. (St2AOB1), and Trichoderma virens (T2C1.4), and apply
    them to soil prior to 'Gran Enana' banana transplanting.
  perturbation_design: Greenhouse pot trial (Biocontrol Trial B) with steam-sterilized soil inoculated with 5.105 CFU g^-1
    Foc TR4 with or without SynCom 1.1; plant-free soil persistence experiment across 10^3, 10^5, and 10^7 CFU g^-1 Foc TR4
    over 32 days; and in vitro cellophane-agar diffusible-metabolite and overlapping-plate volatile cross-inhibition assays
    among the seven SynCom 1.1 members and Foc R1/TR4.
  measurement_endpoints:
  - Fusarium wilt disease incidence over 35 days post-transplanting
  - Fusarium wilt symptom severity and vascular browning index (0-4 scale)
  - Fusarium spp. soil CFU g^-1 dynamics
  - in vitro biocontrol and PGP enzyme/metabolite traits (Table 1)
  - cellophane-agar and volatile cross-inhibition matrix among the seven SynCom 1.1 isolates
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 1.1 was conceived as a community exclusively composed of highly antagonistic isolates (at least 75% of
      the maximum value of in vitro Foc inhibition per taxon). This consortium included three Pseudomonas spp. isolates (P1A1,
      P1C1, and PS5), two Bacillus spp. isolates (BN8.2 and BT1), one Streptomyces sp. isolate (St2AOB1), and one Trichoderma
      sp. isolate (T2C1.4)
    explanation: Defines the exact seven-isolate composition and selection criterion of SynCom 1.1.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a small one such as SynCom 1.1 (seven highly effective isolates) provided similar disease control (35% symptom
      severity reduction)
    explanation: Supports the 35% symptom-severity reduction achieved by the seven-isolate SynCom 1.1 in Biocontrol Trial
      B.
