ecological_interactions:
- name: SynCom 1.1 Biocontrol Trial B Symptom and Vascular-Browning Reduction
  description: In Biocontrol Trial B on 'Gran Enana' banana plants grown in steam-sterilized soil challenged with 5.105 CFU
    g^-1 soil of Fusarium oxysporum f. sp. cubense tropical race 4 (Foc TR4), SynCom 1.1 significantly reduced Fusarium wilt
    symptom severity by 35% at 35 days post-transplanting (P < 0.05) and lowered the vascular browning index from 2.3 to 1.4
    on a 0-4 scale (P < 0.05), while disease incidence over time did not differ from untreated controls and bulk-soil Foc
    CFU reduction was transient (significant only at transplanting in planted pots and null across 10^3, 10^5, or 10^7 CFU
    g^-1 in unplanted soil over 32 days).
  scope: COMMUNITY_LEVEL
  participating_taxa:
