    term:
      id: CHEBI:18053
      label: 1-aminocyclopropanecarboxylic acid
    notes: Substrate in the in vitro ACC deaminase screen of the seven SynCom 1.1 isolates.
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolates of SynCom 1.1 displayed several biocontrol and/or plant growth promotion-related traits ( Table 1 ).
      Some of them were shared among isolates and genera while others showed specificity.
    explanation: Supports the shared and genus-specific biocontrol/PGP trait distribution across the seven SynCom 1.1 members.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For instance, Bacillus spp. were the sole isolates producing 2,3 butanediol, Pseudomonas spp. had phytase activity,
      while ACC deaminase activity was found only in Streptomyces sp. St2AOB1 and Trichoderma sp. T2C1.4.
    explanation: Directly enumerates the genus-specific partitioning of 2,3-butanediol (Bacillus spp.), phytase (Pseudomonas
      spp.), and ACC deaminase (Streptomyces sp. St2AOB1 and Trichoderma virens T2C1.4) across SynCom 1.1.
