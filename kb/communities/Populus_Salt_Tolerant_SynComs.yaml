ecological_interactions:
- name: Physiological Salt-Stress Resistance
  description: 'The primary abstract reports that the effective Populus SynCom treatments increased host salt-stress
    resistance through reduced oxidative stress, osmolyte adjustment and ion balance. Preserve these positive host
    physiological findings. PARTIAL: the accessible abstract supports the proposed physiological explanation but
    does not expose mediator-specific interventions or distinguish each formulation for each assay.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to salt stress
    term:
      id: GO:0009651
      label: response to salt stress
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Salt Stress Growth Protection
    description: 'PARTIAL: reduced oxidative stress, osmolyte adjustment and ion balance are the primary authors
      reported explanation for improved salt-stress resistance and growth. Retain this existing biological direction
      without claiming that a particular physiological mediator was experimentally necessary or sufficient.'
  evidence:
  - reference: PMID:40904019
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: these SynComs can increase resistance to salt stress by directly reducing oxidative stress, adjusting
      osmolytes and balancing ions.
    explanation: Supports reported host physiological mechanisms in the abstract; full perturbation methods remain
      unavailable.
- name: Salt-Adapted Root-Associated Consortia
  description: The abstract reports recruitment of specific root-associated bacterial consortia associated with
    enhanced poplar salt adaptation after SynCom treatment. Preserve this positive root-community observation. It
    does not identify the recruited taxa in the accessible text, demonstrate reciprocal symbiosis or isolate recruitment
    as the necessary cause of host benefit.
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Salt Stress Growth Protection
    description: 'PARTIAL: the primary authors propose that recruited root-associated consortia enhance poplar adaptation
      and complement host physiological responses. Preserve this proposed direction; the accessible abstract does
      not establish recruitment-mediated growth by depletion, transfer or rescue experiments.'
  evidence:
  - reference: PMID:40904019
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: these SynComs were observed to recruit specific root-associated bacterial consortia that enhance the
      adaptability of poplar to salt stress
    explanation: Supports the reported recruitment/adaptation explanation, not a resolved causal mediation experiment.
- name: Salt Stress Growth Protection
  description: Among five alternative function-driven formulations, SynCom5, SynCom7 and SynCom9 showed the strongest
    growth improvement in salt-stressed hybrid Poplar 84K (Populus alba x Populus glandulosa). Preserve this experimental
    host endpoint without collapsing the three formulations into a single nine-strain coculture or claiming that
    individual members are necessary.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  - preferred_term: response to salt stress
    term:
      id: GO:0009651
      label: response to salt stress
  evidence:
  - reference: PMID:40904019
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom5, SynCom7 and SynCom9 showing the most significant improvement in the growth of hybrid Poplar
      84K (Populus alba × Populus glandulosa)
    explanation: 'Identifies the three SynCom formulations with the strongest measured growth protection under salt
      stress.

      '
