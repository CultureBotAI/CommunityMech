id: CommunityMech:000386
name: Anaerobic Indole-Degrading Sludge Consortium
description: A long-term acclimated anaerobic sludge consortium established to transform the nitrogen heterocycle indole under
  laboratory conditions. Meng et al. (2026) combined anaerobic degradation assays, metabolite profiling, metatranscriptomics,
  and genome-resolved metagenomics after 120 days of acclimation; the enrichment stably degraded 100 mg/L indole but did not
  effectively remove skatole under the same strategy. Abstract-level MAG and transcript evidence implicated Bacteroidota,
  Chloroflexota, Desulfobacterota, and Methanobacterium populations in a candidate division of labor linking upstream indole
  oxidation, anthranilate-like aromatic-CoA processing, and methanogenesis-associated carbon flow.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Acclimate anaerobic sludge to degrade indole and resolve candidate organisms and transcripts participating in
    anaerobic indole transformation.
  assembly_strategy: Long-term laboratory acclimation of an anaerobic sludge consortium under indole selection for 120 days.
  measurement_endpoints:
  - Indole removal after anaerobic acclimation
  - Skatole removal under the same acclimation strategy
  - Oxindole, dioxindole, isatin, and anthranilic acid metabolite detection
  - Differential metatranscriptomic responses after indole addition
  - MAG-resolved candidate functional assignment
  evidence:
  - reference: PMID:42735627
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we established a long-term acclimated anaerobic sludge consortium and combined degradation assays, metabolite
      profiling, metatranscriptomics, and genome-resolved metagenomics to investigate the functional basis of anaerobic indole
      degradation.
    explanation: Supports the laboratory acclimation strategy and the multi-omics design used to study the indole-degrading
      consortium.
  - reference: PMID:42735627
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 120 days of acclimation, the consortium stably degraded 100 mg/L indole, whereas skatole was not effectively
      removed under the same strategy
    explanation: Supports the 120-day acclimation period and the indole-selective degradation phenotype.
