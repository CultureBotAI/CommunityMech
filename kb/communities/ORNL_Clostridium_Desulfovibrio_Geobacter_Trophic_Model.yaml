discussions:
- discussion_id: kg-ornl-exchanged-products-and-edge-strength
  prompt: Which donor-recipient fluxes and limitation mechanisms can be resolved beyond the measured bulk substrates
    and model estimates?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Sulfate-Linked Dependence of D. vulgaris
  - ecological_interactions#Fumarate-Linked Dependence of G. sulfurreducens
  rationale: The complete exact-system primary main text is now inspected, superseding the prior full-text-access
    limitation. It reports bulk cellobiose, acetate, fumarate/succinate and sulfate measurements, qPCR and microscopy
    supporting the maintained trophic community. Hydrogen and ethanol transfer could not be distinguished, and species-specific
    carbon/electron allocations were modeled. The later OptCom study of the same composition predicts a different
    hydrogen/ethanol allocation under biomass objectives and an assumed hydrogen recipient; those predictions are
    not new measured transfer. Elevated-fumarate upsets and possible succinate inhibition remain associated observations,
    not selective perturbation proof. No products from the separate two-species fuel-cell system are imported, and
    the modeled fourth-member extension is not part of this community.
  evidence:
  - reference: doi:10.1186/1471-2180-10-149
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: D. vulgaris and G. sulfurreducens derived carbon and energy from the metabolic products
    explanation: Supports trophic dependence; the now-inspected main text constrains the unresolved flux allocation
      rather than leaving all named products unknown.
