    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: D. vulgaris and G. sulfurreducens derived carbon and energy from the metabolic products
    explanation: Supports G. sulfurreducens dependence on metabolic products from C. cellulolyticum.
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: provided with sulfate and fumarate respectively as electron acceptors
    explanation: Supports fumarate as the electron acceptor paired with G. sulfurreducens in the abstract.
- name: Electron Donor and Acceptor Limitation
  description: Residual-substrate measurements and carbon/electron modeling indicated cellobiose limitation for
    C. cellulolyticum, electron-donor limitation for D. vulgaris and fumarate-acceptor limitation for G. sulfurreducens.
    This is an experimentally informed inference, not demonstrated ecological niche partitioning. Elevated-fumarate
    trials were associated with succinate accumulation and culture upset, but selective succinate causation was
    not isolated.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellobiose
    term:
      id: CHEBI:17057
      label: cellobiose
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  - preferred_term: fumarate
    term:
      id: CHEBI:29806
      label: fumarate(2-)
  evidence:
  - reference: doi:10.1186/1471-2180-10-149
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: growth of C. cellulolyticum and D. vulgaris were electron donor limited
    explanation: Supports the limitation interpretation from a model informed by measured residual substrates, not
      a direct resource-competition or selective limitation-rescue experiment.
  - reference: doi:10.1186/1471-2180-10-149
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: G. sulfurreducens was electron acceptor limited
    explanation: Supports the limitation interpretation from a model informed by measured residual substrates, not
      a direct resource-competition or selective limitation-rescue experiment.
