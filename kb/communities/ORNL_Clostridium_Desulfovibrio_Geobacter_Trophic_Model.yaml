ecological_interactions:
- name: Cellobiose Fermentation Supports Partner Growth
  description: Cellobiose fermentation by C. cellulolyticum supported the maintained three-species anaerobic chemostat
    community. Cellobiose depletion, acetate accumulation, sulfate consumption and fumarate reduction support trophic
    coupling. Individual metabolite allocations in the carbon/electron-flow model remain estimates, not independently
    traced interspecies fluxes; the exact hydrogen-versus-ethanol contribution to D. vulgaris was unresolved.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Clostridium cellulolyticum
    term:
      id: NCBITaxon:1521
      label: Ruminiclostridium cellulolyticum
  metabolites:
  - preferred_term: cellobiose
    term:
      id: CHEBI:17057
      label: cellobiose
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Sulfate-Linked Dependence of D. vulgaris
    description: C. cellulolyticum fermentation supplies carbon and reducing equivalents that support D. vulgaris
      growth with supplied sulfate. Maintained coculture and sulfate depletion support this dependence under the
      tested medium; hydrogen/ethanol partitioning is proposed rather than selectively measured, and reciprocal
      obligate dependence of the fermenter is not established.
  - target: Fumarate-Linked Dependence of G. sulfurreducens
    description: Fermentation-derived substrates support G. sulfurreducens growth with supplied fumarate; measured
      acetate availability, fumarate depletion and succinate formation support the trophic interpretation. The allocation
      of acetate specifically to G. sulfurreducens is model-based rather than isotope-traced, so the arrow does
      not assert an independently measured donor-recipient flux.
  evidence:
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cellobiose served as the carbon and energy source for C. cellulolyticum
    explanation: Supports the curated cellobiose-fed fermentative role for C. cellulolyticum.
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: D. vulgaris and G. sulfurreducens derived carbon and energy from the metabolic products
    explanation: Supports cross-feeding from C. cellulolyticum fermentation products to both partners.
- name: Sulfate-Linked Dependence of D. vulgaris
  description: D. vulgaris Hildenborough persisted using fermentation-derived nutrients with sulfate supplied as
    electron acceptor. Sulfate was depleted but remained available, supporting electron-donor limitation. Hydrogen
    and ethanol were proposed donors, but their relative transfer could not be distinguished by the measurements.
    This is supported trophic dependence under the tested medium, not proof of reciprocal obligate syntrophy with
    C. cellulolyticum.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium cellulolyticum
    term:
      id: NCBITaxon:1521
      label: Ruminiclostridium cellulolyticum
  target_taxon:
    preferred_term: Desulfovibrio vulgaris Hildenborough
    term:
      id: NCBITaxon:882
      label: Nitratidesulfovibrio vulgaris str. Hildenborough
  metabolites:
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  biological_processes:
  - preferred_term: sulfate reduction
    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: D. vulgaris and G. sulfurreducens derived carbon and energy from the metabolic products
    explanation: Supports D. vulgaris dependence on metabolic products from C. cellulolyticum.
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: provided with sulfate and fumarate respectively as electron acceptors
    explanation: Supports sulfate as the electron acceptor paired with D. vulgaris in the abstract.
- name: Fumarate-Linked Dependence of G. sulfurreducens
  description: G. sulfurreducens persisted with C. cellulolyticum fermentation products and supplied fumarate. Fumarate
    depletion, residual acetate and succinate production support fumarate-linked respiration and acceptor limitation.
    Acetate use and its species-specific allocation are interpreted through the metabolic model; the source does
    not directly trace every exchange or establish absolute exclusion of alternate interspecies routes.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium cellulolyticum
    term:
