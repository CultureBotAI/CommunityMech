id: CommunityMech:000176
name: ORNL Clostridium-Desulfovibrio-Geobacter Trophic Model Community
description: >
  A three-species anaerobic continuous-culture model community established to study trophic
  and electron-acceptor interactions relevant to subsurface anaerobic environments.
  Clostridium cellulolyticum ferments cellobiose, while Desulfovibrio vulgaris Hildenborough
  and Geobacter sulfurreducens depend on fermentation products and use sulfate and fumarate,
  respectively, as supplied electron acceptors.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Establish a tractable continuous-culture anaerobic model ecosystem for quantifying
    trophic interactions, population dynamics, carbon flow, and electron flow among fermentative,
    sulfate-respiring, and fumarate-respiring bacterial members.
  assembly_strategy: Bottom-up three-member coculture assembled from C. cellulolyticum,
    D. vulgaris Hildenborough, and G. sulfurreducens with cellobiose as the shared carbon and
    energy input and sulfate and fumarate as partner-specific electron acceptors.
  perturbation_design: Continuous-culture operation enabled qPCR population monitoring and
    proposed carbon/electron-flow modeling of the defined three-species community.
  measurement_endpoints:
  - qPCR population monitoring
  - Presence of all three members
  - Carbon and electron flow modeling
  - Electron donor limitation
  - Electron acceptor limitation
  evidence:
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: constructed a model microbial community comprised of three species
    explanation: Supports the designed three-species model-community objective.
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grown under continuous culture conditions
    explanation: Supports the continuous-culture engineering context.
  - reference: doi:10.1186/1471-2180-10-149
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Proposed metabolic modeling of carbon and electron flow of the three-species community
    explanation: Supports the modeled carbon and electron-flow endpoint.
