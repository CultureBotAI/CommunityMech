- discussion_id: bacillus_tobacco_syncom_colonization_mechanism
  prompt: >-
    Which metabolites and colonization dynamics connect Bacillus G12/Y4/X25
    co-cultivation to tobacco root signaling, pathogen inhibition, and
    persistence in tobacco rhizosphere or endophytic niches?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#SynCom Indole-3-Acetic Acid Enhancement
  - engineering_design#assembly_strategy
  rationale: >-
    The open PMC article reports strain compatibility, IAA production,
    glasshouse disease/root phenotypes, field disease/yield outcomes, and
    endpoint rhizosphere amplicon profiling, but states that strain-level
    ecological niche differentiation, rhizosphere colonization ability,
    persistence, tissue-colonization complementarity, and causal metabolite
    tracking remain to be validated.
