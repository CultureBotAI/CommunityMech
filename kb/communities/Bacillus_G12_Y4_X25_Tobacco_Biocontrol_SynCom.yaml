growth_media:
- name: Luria-Bertani broth
  temperature: '30'
  temperature_unit: °C
  shaking_speed: '180'
  shaking_speed_unit: rpm
  inoculum_source: >-
    Bacillus amyloliquefaciens G12, Bacillus pumilus Y4, and Bacillus
    velezensis X25 glycerol stocks
  preparation_notes: >-
    Strains were reactivated in LB medium, each strain was grown from an LB-agar
    single colony in LB broth at 30°C and 180 rpm to OD600 1.0 +/- 0.1 for
    monoculture fermentation, and the SynCom inoculum was assembled by culturing
    the three broths to OD600 0.3, mixing them equally, and continuing the
    co-culture to OD600 1.0 +/- 0.1.
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For single‐strain fermentation, activated cultures were streaked on LB
      agar, and a single colony was inoculated into LB broth, incubated at 30 °C
      and 180 rpm
    explanation: >-
      Reports the LB agar/broth medium, 30°C temperature, and 180 rpm shaking
      used to prepare activated single-strain cultures.
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mixed in equal volumes (1:1:1, v/v/v)
    explanation: >-
      Reports the equal-volume mixing ratio used for the three-broth SynCom
      culture.
