id: CommunityMech:000373
name: Bacillus G12-Y4-X25 Tobacco Biocontrol SynCom
description: >-
  A three-member Bacillus synthetic microbial community assembled from Bacillus
  amyloliquefaciens G12, Bacillus pumilus Y4, and Bacillus velezensis X25 to
  combine complementary antagonistic activities against Fusarium oxysporum and
  Phytophthora nicotianae, the causal agents of tobacco Fusarium root rot and
  black shank. G12 was isolated from the tobacco rhizosphere and the Y4 and X25
  endophytes from tobacco tissues in Luoyang, China. The strains showed only
  mild mutual inhibition in pairwise plate confrontations, the 1:1:1 SynCom
  produced more indole-3-acetic acid than any single strain, and glasshouse and
  two-site field assays linked the consortium to reduced soil-borne disease,
  improved tobacco root traits, and higher middle-leaf-based estimated yield.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Construct a three-strain Bacillus SynCom that integrates antagonism of
    Fusarium oxysporum and Phytophthora nicotianae with plant growth promotion
    for tobacco Fusarium root rot and black shank management.
  assembly_strategy: >-
    Combine the tobacco-rhizosphere isolate Bacillus amyloliquefaciens G12 with
    the tobacco endophytes Bacillus pumilus Y4 and Bacillus velezensis X25 after
    prior strain characterization showed that G12 antagonized F. oxysporum and
    that Y4 and X25 inhibited P. nicotianae.
  inoculation_strategy: >-
    Reactivate strains in LB, culture the three broths to OD600 0.3, mix them in
    equal 1:1:1 volumes, and continue incubation to OD600 1.0 +/- 0.1 before
    application.
  perturbation_design: >-
    Compare G12, Y4, X25, the SynCom, a pathogen-only FO/PN challenge control, a
    commercial Bacillus subtilis microbial agent, and Thiram under glasshouse
    challenge conditions; then compare single-strain applications, the SynCom, an
    LB blank, the commercial agent, and Thiram by two root-irrigation events in
    two tobacco field plots under natural soil-borne disease pressure.
  measurement_endpoints:
  - pairwise Bacillus inhibition rates
  - SynCom growth kinetics and indole-3-acetic acid production
  - tobacco Fusarium root rot and black shank disease incidence and severity
  - defense-related enzyme activities
  - root activity and root morphology
  - tobacco transcriptome responses
  - middle-leaf-based estimated field yield
  - rhizosphere bacterial and fungal diversity
  notes: >-
    Kong et al. 2026 explicitly cautioned that ecological niche differentiation,
    rhizosphere colonization ability, persistence, and tissue-colonization
    complementarity among the assembled Bacillus strains were not directly
    assessed.
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, the SynCom was assembled primarily to combine complementary
      antagonistic activities against the two major tobacco pathogens together
      with compatible plant growth‐promoting potential.
    explanation: >-
      Supports the design objective and function-guided assembly of the
      three-member Bacillus SynCom.
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mixed in equal volumes (1:1:1, v/v/v)
    explanation: Supports the equal-volume three-strain SynCom assembly step.
