ecological_interactions:
- name: Mild-Inhibition Three-Strain SynCom Compatibility
  description: >-
    Pairwise plate confrontations among Bacillus amyloliquefaciens G12,
    Bacillus pumilus Y4, and Bacillus velezensis X25 all stayed in the Type II
    mild-inhibition class below 25%, consistent with the limited interstrain
    growth interference used to assemble the tobacco SynCom.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pairwise plate confrontation assays showed that all interactions among the
      three Bacillus strains exhibited mild inhibition
    explanation: Supports low pairwise antagonism among the three Bacillus members.
- name: SynCom Indole-3-Acetic Acid Enhancement
  description: >-
    The equal-volume Bacillus co-culture produced 11.57 +/- 0.24 mg/L
    indole-3-acetic acid, significantly more than the G12, Y4, or X25
    monocultures, providing a measured community-level plant-growth-promoting
    phenotype while leaving the underlying metabolic interaction unresolved.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
  biological_processes:
  - preferred_term: indole-3-acetic acid biosynthetic process
    term:
      id: GO:0009684
      label: indoleacetic acid biosynthetic process
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The SynCom produced significantly more IAA than any single strain
    explanation: >-
      Supports the SynCom-level IAA increase relative to each constituent
      monoculture.
- name: Tobacco FO/PN Glasshouse Disease Suppression
  description: >-
    In two 21-day glasshouse experiments on He Luo No. 1 tobacco seedlings, the
    SynCom reduced Fusarium oxysporum/Phytophthora nicotianae disease severity
    under both preventive and curative timing, with preventive treatment lowering
    disease index from 54.07 to 9.26.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Preventive application was more effective, lowering DI by 82.87% compared
      to the pathogen control
    explanation: >-
      Supports disease-index suppression by the SynCom under preventive
      glasshouse application against the FO/PN challenge.
- name: Tobacco Root Activity Improvement
  description: >-
    Under pathogen stress, SynCom-treated roots showed stronger dehydrogenase
    signal and 20.27-45.38% higher root activity than single-strain preventive
    treatments, indicating improved root metabolic recovery by the consortium.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: tobacco
    term:
      id: NCBITaxon:4097
      label: Nicotiana tabacum
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      SynCom significantly enhanced root activity compared with single‐strain
      treatments
    explanation: >-
      Supports a community-level root-activity improvement in the glasshouse
      challenge assay.
- name: Two-Site Field Disease Suppression and Yield Increase
  description: >-
    In two yellow-soil field sites near Luoyang, two SynCom root-irrigation
    treatments reduced naturally co-occurring Fusarium root rot and black shank
    while increasing middle-leaf-based estimated yield relative to the
    single-strain and commercial microbial treatments.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: tobacco
    term:
      id: NCBITaxon:4097
      label: Nicotiana tabacum
  biological_processes:
  - preferred_term: defense response
    term:
      id: GO:0006952
      label: defense response
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:42388034
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      SynCom achieved 34.7–40.0% disease suppression and 37.5–41.3% yield
      increases across sites
    explanation: >-
      Supports the two-site field disease-suppression and yield endpoints for
      the Bacillus SynCom.
