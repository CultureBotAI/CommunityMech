id: CommunityMech:000137
name: East River Floodplain Core Microbiome
description: A natural floodplain-soil microbial community from the DOE-supported East River watershed
  in Colorado. Metagenomic and metatranscriptomic sampling across upper, middle, and lower East River
  meander-bound floodplains reconstructed 248 representative subspecies-level genomes and identified a
  core floodplain microbiome. The core community is enriched in aerobic respiration, aerobic carbon monoxide
  oxidation, thiosulfate oxidation, nitrification, methanol and formate oxidation, and carbon fixation
  capacities that vary with soil organic carbon and floodplain position.
ecological_state: STABLE
community_origin: NATURAL
community_category: CARBON_SEQUESTRATION
environment_term:
  preferred_term: floodplain soil
  term:
    id: ENVO:00001998
    label: soil
  notes: Soil samples were collected from meander-bound floodplains along the East River, Colorado. The
    ENVO term records the soil habitat, while this record's name and notes capture the floodplain setting.
taxonomy:
- taxon_term:
    preferred_term: Betaproteobacteria-dominated core floodplain microbiome
    term:
      id: NCBITaxon:28216
      label: Betaproteobacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      curated: true
      curation_note: 'Sharpened from c__Gammaproteobacteria, which the rank-for-rank vote returns because
        NCBI calls Betaproteobacteria a class (#451). GTDB demoted it - the clade is the order
        Burkholderiales inside Gammaproteobacteria - and 41903 of the 41937 named-species genomes behind
        this grounding are Burkholderiales, the remainder being 31 in Enterobacterales and 3 in
        Pseudomonadales. The class term was not wrong, only silent: c__Gammaproteobacteria is where GTDB
        also puts NCBI Gammaproteobacteria itself, so the vote said only "Proteobacteria of some kind"
        about an entry whose whole content is that it is Betaproteobacteria. This case is why the
        module docstring no longer claims to enumerate demotions: it defeats both screens used to find
        the others, being neither unanimous (0.999) nor name-preserving (GTDB renamed while demoting, so
        Betaproteobacteria and Burkholderiales share one letter).'
      gtdb_id: GTDB:o__Burkholderiales
      gtdb_taxon: Burkholderiales
      gtdb_lineage: d__Bacteria;p__Pseudomonadota;c__Gammaproteobacteria;o__Burkholderiales
      ncbi_source_id: NCBITaxon:28216
      majority_fraction: 0.999
      support_genomes: 41903
      total_genomes: 41937
      is_reclassified: true
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at o__ rank; 3 GTDB taxa under the NCBI taxon]
    notes: Betaproteobacteria had the highest number of representative genomes and dominated the operationally
      defined core floodplain microbiome.
  functional_role:
  - PRIMARY_DEGRADER
  - PRIMARY_PRODUCER
  abundance_level: DOMINANT
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Betaproteobacteria was the group with the highest number of representative genomes (80)
      in all three floodplains.
    explanation: Supports Betaproteobacteria as a major reconstructed lineage across the East River floodplains.
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The core floodplain microbiome was dominated by Betaproteobacteria, with lower abundances
      of Nitrospirae, Rokubacteria, Gemmatimonadetes, Gammaproteobacteria, Deltaproteobacteria, and
      Candidatus Letescibacteria
    explanation: Supports Betaproteobacteria dominance in the defined core floodplain microbiome.
- taxon_term:
    preferred_term: Nitrospirae core floodplain members
    term:
      id: NCBITaxon:1234
      label: Nitrospira
    gtdb_grounding_status: NOT_ATTEMPTED
    notes: Nitrospirae were among abundant reconstructed lineages and are consistent with the highly transcribed
      nitrification genes reported for the floodplain soils.
  functional_role:
  - PRIMARY_PRODUCER
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the most highly transcribed genes were relatively rare amoCAB and nxrAB (for nitrification)
      genes
    explanation: Supports active nitrification capacity in the floodplain soil community.
