ecological_interactions:
- name: Core Floodplain Aerobic and Sulfur Oxidation Capacity
  description: The cross-site core floodplain microbiome is enriched in aerobic respiration, carbon monoxide
    oxidation, and thiosulfate oxidation, indicating shared redox capacity across meander-bound floodplain
    soils.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: core floodplain bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  metabolites:
  - preferred_term: thiosulfate
    term:
      id: CHEBI:16094
      label: thiosulfate(2-)
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
  - preferred_term: sulfur compound metabolic process
    term:
      id: GO:0006790
      label: sulfur compound metabolic process
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: we identified a core floodplain microbiome that is enriched in capacities for aerobic
      respiration, aerobic CO oxidation, and thiosulfate oxidation with the formation of elemental sulfur.
    explanation: Supports shared aerobic and sulfur oxidation capacity in the core community.
- name: Low-Organic-Carbon Chemolithotrophic Activity
  description: Floodplain soils with lower organic carbon show increased activity of genes for methanol,
    formate, sulfide, hydrogen, and ammonia oxidation, nitrite oxidoreduction, nitrate and nitrite reduction,
    and carbon fixation, suggesting functional niche shifts along carbon gradients.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: East River floodplain bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  metabolites:
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: nitrification
    term:
      id: GO:0019329
      label: ammonia oxidation
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Within all three meanders, low soil organic carbon correlated with high activity of genes
      involved in methanol, formate, sulfide, hydrogen, and ammonia oxidation, nitrite oxidoreduction,
      and nitrate and nitrite reduction.
    explanation: Supports organic-carbon-linked functional shifts in the floodplain soil community.
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the most highly transcribed genes were relatively rare amoCAB and nxrAB (for nitrification)
      genes, followed by genes involved in methanol and formate oxidation, and nitrogen and CO2 fixation.
    explanation: Supports active nitrification, one-carbon oxidation, nitrogen fixation, and carbon fixation
      gene expression in the community.
environmental_factors:
- name: East River meander-bound floodplain position
  value: upper, middle, and lower East River floodplain soils
  description: Samples were collected along upper, middle, and lower reaches of the East River watershed,
    enabling comparison of floodplain microbiomes across meanders.
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We intensively sampled the microbiomes of floodplain soils located in the upper, middle,
      and lower reaches of the East River, Colorado.
    explanation: Supports the watershed-scale floodplain sampling design.
- name: Soil organic carbon gradient
  value: low soil organic carbon associated with increased chemolithotrophic and nitrogen-cycling activity
  description: Soil organic carbon is a key environmental gradient linked to expression of oxidation and
    nitrogen-cycling genes in all three meanders.
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Within all three meanders, low soil organic carbon correlated with high activity of genes
      involved in methanol, formate, sulfide, hydrogen, and ammonia oxidation, nitrite oxidoreduction,
      and nitrate and nitrite reduction.
    explanation: Supports soil organic carbon as a structuring environmental factor.
