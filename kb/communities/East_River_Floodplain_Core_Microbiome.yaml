discussions:
- discussion_id: east_river_core_capacity_transcription_scope
  prompt: Which genomes and environmental mechanisms link conserved capacity to measured flux?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Core Floodplain Biogeochemical Potential Reservoir
  - ecological_interactions#Core Floodplain Aerobic and Sulfur Oxidation Capacity
  - ecological_interactions#Low-Organic-Carbon-Associated Gene Transcription in Floodplain L
  rationale: 'Core capacity enrichment is a part/whole description, not a causal consequence requiring an arrow.
    Gene inventories did not predict one-time expression, and the 2016 RNA study sampled only L. Direct flux and
    selective environmental perturbations are missing. The canonical Nitrospira genus ID cannot stand in for the
    paper''s Nitrospirae phylum; Acidobacteriota are non-core and overall more transcriptionally active at higher
    organic carbon. Neither is assigned an unsupported graph link just to suppress disconnected warnings. Taxonomy
    and non-graph scope remain under #1421; no GTDB withholding policy is changed.'
  posed_by: codex
  posed_date: '2026-10-06'
curation_history:
- timestamp: '2026-10-06T08:01:03Z'
  curator: codex
  action: REVIEW_CAUSAL_GRAPH
  changes: 'Retain operational core genomic potential with a partial source-supported participant roster.; Retain
    core gene-content enrichment without part-whole causality or realized flux.; Retain low-carbon-associated transcription
    at floodplain L with explicit taxonomic and temporal limits. Issue #1418; reports/causal_graph_review/decisions/20261006-three-records-batch35.yaml'
  llm_assisted: true
