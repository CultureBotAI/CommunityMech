ecological_interactions:
- name: Core Floodplain Biogeochemical Potential Reservoir
  description: The 2015 operational core comprises 42 representative genomes detected in at least 89 of 94 samples
    without a significant association to any one floodplain. Their gene inventories define biogeochemical potential,
    not measured activation or flux. Listed Betaproteobacteria and Gemmatimonadota participants are partial higher-level
    core groupings, not a complete roster or an assertion that every genome encodes every pathway. Widely represented
    capacities did not predict the later transcription snapshot.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: thiosulfate
    term:
      id: CHEBI:16094
      label: thiosulfate(2-)
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: sulfur compound metabolic process
    term:
      id: GO:0006790
      label: sulfur compound metabolic process
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Widely represented genetic capacities did not predict in situ activity at one time point, but rather
      they define a reservoir of biogeochemical potential available as conditions change.
    explanation: Supports representing the conserved floodplain genomes as a conditional reservoir of redox and
      carbon-fixation capacity.
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Genomes affiliated with Acidobacteria, Bacteroidetes, and Chloroflexi were not part of the core floodplain
      microbiome
    explanation: Explicitly excludes Acidobacteria from the operational core; abundance in the broader dataset is
      not core membership.
  participating_taxa:
  - preferred_term: Betaproteobacteria-dominated core floodplain microbiome
    term:
      id: NCBITaxon:28216
      label: Betaproteobacteria
  - preferred_term: Gemmatimonadota floodplain representatives
    term:
      id: NCBITaxon:142182
      label: Gemmatimonadota
- name: Core Floodplain Aerobic and Sulfur Oxidation Capacity
  description: The operational core genome set is enriched in capacities for aerobic respiration, aerobic CO or
    other small-molecule oxidation, and thiosulfate oxidation. This is comparative gene-content enrichment, not
    measured reaction rates, cooperation or niche partitioning. The two canonical participant groups are a partial
    core roster; no universal per-taxon pathway assignment or substrate specificity for every CODH-like homolog
    is implied.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: thiosulfate
    term:
      id: CHEBI:16094
      label: thiosulfate(2-)
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
  - preferred_term: sulfur compound metabolic process
    term:
      id: GO:0006790
      label: sulfur compound metabolic process
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: we identified a core floodplain microbiome that is enriched in capacities for aerobic respiration,
      aerobic CO oxidation, and thiosulfate oxidation with the formation of elemental sulfur.
    explanation: Supports shared aerobic and sulfur oxidation capacity in the core community.
  participating_taxa:
  - preferred_term: Betaproteobacteria-dominated core floodplain microbiome
    term:
      id: NCBITaxon:28216
      label: Betaproteobacteria
  - preferred_term: Gemmatimonadota floodplain representatives
    term:
      id: NCBITaxon:142182
      label: Gemmatimonadota
- name: Low-Organic-Carbon-Associated Gene Transcription in Floodplain L
  description: In the September 2016 floodplain L RNA snapshot, lower organic carbon correlated with increased transcription
    of selected C1, sulfur, hydrogen and nitrogen redox genes and carbon-fixation genes. This is not a carbon manipulation,
    measured flux, a result independently sampled in all three floodplains or activation of the entire 2015 core.
    Betaproteobacteria are included only as a broad grouping linked to CBB carbon-fixation capacity/activity; their
    overall transcription favored higher organic carbon. Other low-carbon-active groups are not reliably represented
    by the canonical taxonomy, so this is explicitly a partial participant list.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: nitrification
    term:
      id: GO:0019329
      label: ammonia oxidation
  - preferred_term: carbon fixation
    term:
      id: GO:0015977
      label: carbon fixation
  evidence:
  - reference: PMID:34022966
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Within all three meanders, low soil organic carbon correlated with high activity of genes involved
      in methanol, formate, sulfide, hydrogen, and ammonia oxidation, nitrite oxidoreduction, and nitrate and nitrite
      reduction.
    explanation: The abstract uses all-three-meander wording, but primary Methods and Results restrict the 2016
      RNA sampling to floodplain L. Retained as a source statement with this explicit limitation, not evidence of
      three independent transcript surveys.
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the most highly transcribed genes were relatively rare amoCAB and nxrAB (for nitrification) genes,
      followed by genes involved in methanol and formate oxidation, and nitrogen and CO2 fixation.
    explanation: Supports relative gene transcription in the RNA snapshot, not measured nitrification or carbon
      flux and not a per-taxon assignment of every gene.
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: we resampled floodplain L for metatranscriptomics and metagenomics
    explanation: Locates the RNA study in the middle floodplain rather than all three sites.
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Activity of the Calvin Benson Bassham (CBB) pathway for CO2 fixation is linked to Betaproteobacteria,
      Deltaproteobacteria, Gammaproteobacteria, and NC10
    explanation: Supports the limited higher-level Betaproteobacteria participant for carbon fixation, not every
      low-carbon-associated function or every core genome.
  participating_taxa:
  - preferred_term: Betaproteobacteria-dominated core floodplain microbiome
    term:
      id: NCBITaxon:28216
      label: Betaproteobacteria
environmental_factors:
- name: East River meander-bound floodplain position
  value: upper, middle, and lower East River floodplain soils
  description: Samples were collected along upper, middle, and lower reaches of the East River watershed,
    enabling comparison of floodplain microbiomes across meanders.
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We intensively sampled the microbiomes of floodplain soils located in the upper, middle,
      and lower reaches of the East River, Colorado.
    explanation: Supports the watershed-scale floodplain sampling design.
- name: Soil organic carbon gradient
  value: low soil organic carbon associated with increased chemolithotrophic and nitrogen-cycling activity
  description: Soil organic carbon is a key environmental gradient linked to expression of oxidation and
    nitrogen-cycling genes in all three meanders.
  evidence:
  - reference: PMID:34022966
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Within all three meanders, low soil organic carbon correlated with high activity of genes
      involved in methanol, formate, sulfide, hydrogen, and ammonia oxidation, nitrite oxidoreduction,
      and nitrate and nitrite reduction.
    explanation: Supports soil organic carbon as a structuring environmental factor.
