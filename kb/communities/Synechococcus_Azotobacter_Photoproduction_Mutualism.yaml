id: CommunityMech:000207
name: Synechococcus-Azotobacter Photoproduction Mutualism
description: >
  A designed two-member light-driven microbial mutualism pairing sucrose-exporting
  cscB Synechococcus elongatus PCC 7942 with the diazotroph Azotobacter
  vinelandii AV3. The engineered cyanobacterium fixes carbon under illumination
  and exports sucrose, while A. vinelandii fixes nitrogen and can produce
  industrially relevant biopolymers such as polyhydroxybutyrate and alginate.
  The coculture was engineered to grow without added fixed carbon or fixed
  nitrogen and is relevant to DOE interests in photosynthetic bioproduction,
  carbon utilization, and nitrogen self-sufficient synthetic consortia.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Engineer a nitrogen- and carbon-self-sufficient photosynthetic coculture for chemical
    photoproduction from simple inorganic inputs.
  assembly_strategy: Pair sucrose-exporting cscB S. elongatus with diazotrophic A. vinelandii AV3 so
    that photosynthetic carbon export and biological nitrogen fixation support mutual growth.
  perturbation_design: Compare coculture growth with and without fixed carbon or nitrogen and test
    dependence on a sucrose-exporting S. elongatus partner.
  measurement_endpoints:
  - Coculture growth without fixed carbon or nitrogen
  - Sucrose-exporter dependence
  - Polyhydroxybutyrate production
  - Potential alginate production
  evidence:
  - reference: PMID:27232890
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a new microbial mutualism between Azotobacter vinelandii AV3 and cscB Synechococcus elongatus
    explanation: Supports the engineered exact-member mutualism curated in this record.
  - reference: PMID:27232890
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grows in the absence of fixed carbon or nitrogen
    explanation: Supports the design objective of carbon- and nitrogen-self-sufficient coculture growth.
