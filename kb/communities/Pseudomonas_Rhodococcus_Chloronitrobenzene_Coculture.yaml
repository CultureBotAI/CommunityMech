id: CommunityMech:000181
name: Pseudomonas-Rhodococcus Chloronitrobenzene Coculture
description: >
  A defined two-member aerobic laboratory coculture for chloronitrobenzene bioremediation.
  Pseudomonas putida HS12 was isolated using nitrobenzene enrichment and performs the
  first partial reductive and acetylation steps on 3- and 4-chloronitrobenzene.
  Rhodococcus sp. strain HS51 degrades the chlorohydroxyacetanilide intermediates,
  allowing the coculture to mineralize 3- and 4-chloronitrobenzenes when an additional
  carbon source is supplied.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Assemble a two-strain coculture capable of mineralizing chloronitrobenzene
    pollutants that neither member alone was reported to fully mineralize.
  assembly_strategy: Combine nitrobenzene-enriched Pseudomonas putida HS12 with
    chlorohydroxyacetanilide-degrading Rhodococcus sp. strain HS51 to complete sequential
    transformation and mineralization of 3- and 4-chloronitrobenzene.
  perturbation_design: Test the coculture on 3- and 4-chloronitrobenzene with an added
    carbon source.
  measurement_endpoints:
  - 3-chloronitrobenzene mineralization
  - 4-chloronitrobenzene mineralization
  - Chlorohydroxyacetanilide intermediate turnover
  - Proposed degradation pathway
  evidence:
  - reference: PMID:10049867
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: degradation of CNBs by coculture of two microbial strains was attempted
    explanation: Supports the designed two-strain coculture objective for chloronitrobenzene degradation.
  - reference: PMID:10049867
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: was isolated and combined with P. putida HS12 to give a coculture
    explanation: Supports the assembly of Rhodococcus sp. strain HS51 with P. putida HS12.
  - reference: PMID:10049867
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This coculture was confirmed to mineralize 3- and 4-CNBs
    explanation: Supports mineralization of the target chloronitrobenzene compounds as the endpoint.
