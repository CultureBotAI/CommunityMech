ecological_interactions:
- name: Wastewater Minor SARS-CoV-2 Allele Profiling
  description: Computational SNV analysis of sampled wastewater RNA identified sub-consensus SARS-CoV-2 alleles.
    Minor variants describe a mixed population; they are not all resolved strain haplotypes. Concordant allele frequencies
    can support linkage of particular variants but do not prove complete donor genomes or infectivity.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:33468686
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Using a pipeline for single nucleotide variant calling in a metagenomic context, we characterized minor
      SARS-CoV-2 alleles in the wastewater
    explanation: Supports computational minor-allele detection from environmental sequence data, not universal strain-resolved
      haplotypes or viral replication in sewage.
- name: Regional Clinical Genotype Concordance
  description: Major wastewater SARS-CoV-2 consensus genotypes matched clinical genomes sampled in the same region.
    This is sequence concordance between sampled populations, not proof of specific transmission events, complete
    coverage of local infections or viral activity within sewage.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:33468686
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The major consensus SARS-CoV-2 genotypes detected in the sewage were identical to clinical
    explanation: 'Supports the sewage-versus-clinical genotype concordance of predominant SARS-CoV-2 genotypes in
      the region.

      '
- name: Preclinical Local Lineage-Introduction Signal
  description: PARTIAL - four recurrent wastewater variants absent from the available California clinical genomes
    but seen elsewhere supported the authors' inference of possible recent lineage introductions. The inference
    depends on clinical sampling and sequence detection; it is not confirmed transmission, a dated introduction
    or demonstrated infectivity.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:33468686
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: wastewater sequencing can provide evidence for recent introductions of viral lineages before they are
      detected by local clinical sequencing
    explanation: Supports a sampling-sensitive introduction inference, not confirmation that absence from available
      clinical genomes equals absence from the region.
