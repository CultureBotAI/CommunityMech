    explanation: Identifies cinnamate as the consortium's carbon and energy source.
- preferred_term: benzoate
  chebi_term:
    id: CHEBI:30746
    label: benzoic acid
  relevance: >
    Central intermediate of the pathway; produced from cinnamate by P. cinnamivorans
    and then syntrophically degraded by Syntrophus sp. with the methanogen.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cinnamate was first transformed to benzoate via beta-oxidation and subsequently
      completely degraded into acetate, CH(4), and CO(2)
    explanation: Anchors benzoate as the beta-oxidation intermediate between cinnamate and final products.
- preferred_term: acetate
  chebi_term:
    id: CHEBI:30089
    label: acetate
  relevance: >
    Terminal degradation product of benzoate breakdown by the syntrophic Syntrophus
    sp.-methanogen association.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: degraded benzoate to acetate,
    explanation: Identifies acetate as a product of benzoate degradation.
- preferred_term: methane
  chebi_term:
    id: CHEBI:16183
    label: methane
  relevance: >
    Final mineralization product generated by the methanogen (Methanobacterium formicicum)
    closing the syntrophic degradation pathway.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cinnamate was first transformed to benzoate via beta-oxidation and subsequently
      completely degraded into acetate, CH(4), and CO(2)
    explanation: Lists CH(4) (methane) among the complete degradation products.
- preferred_term: carbon dioxide
  chebi_term:
    id: CHEBI:16526
    label: carbon dioxide
  relevance: >
    Final mineralization product of complete cinnamate/benzoate degradation under
    methanogenic conditions.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cinnamate was first transformed to benzoate via beta-oxidation and subsequently
      completely degraded into acetate, CH(4), and CO(2)
    explanation: Lists CO(2) (carbon dioxide) among the complete degradation products.
- preferred_term: 2-bromoethanesulfonic acid (BESA)
  relevance: >
    Methanogenesis inhibitor used experimentally to block the methanogen; under BESA
    the pathway halts at benzoate, demonstrating P. cinnamivorans' role in benzoate production.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the presence of bromoethanesulfonic acid (BESA), cinnamate was transformed
      to benzoate
    explanation: Anchors BESA as the inhibitor whose presence stops degradation at benzoate.
