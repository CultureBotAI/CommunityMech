ecological_interactions:
- name: Cinnamate β-Oxidation to Benzoate
  description: Papillibacter cinnamivorans converts cinnamate to benzoate, providing the intermediate for subsequent
    syntrophic degradation. Conversion still occurred with the methanogenesis inhibitor BESA. The authors propose
    beta-oxidation; the accessible abstract does not resolve its enzyme steps or establish a commensal fitness relationship.
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Papillibacter cinnamivorans
    term:
      id: NCBITaxon:100176
      label: Papillibacter cinnamivorans
  metabolites:
  - preferred_term: cinnamate
    term:
      id: CHEBI:23252
      label: cinnamic acids
    notes: Class-level cinnamic-acids grounding retained; this does not identify a specific stereoisomer or demonstrate
      fatty-acid metabolism.
  - preferred_term: benzoate
    term:
      id: CHEBI:30746
      label: benzoic acid
  downstream:
  - target: Syntrophic Benzoate Degradation
    description: Benzoate formed by P. cinnamivorans supplies substrate for the Syntrophus-methanogen association.
      The reported stepwise conversion and BESA-associated arrest at benzoate support this substrate connection
      without resolving every enzyme step.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the presence of bromoethanesulfonic acid (BESA), cinnamate was transformed to benzoate, whereas
      under methanogenic conditions without BESA, cinnamate was first transformed to benzoate via beta-oxidation
      and subsequently completely degraded into acetate, CH(4), and CO(2)
    explanation: Supports cinnamate-to-benzoate conversion and the inhibitor comparison. The abstract proposes beta-oxidation
      but does not establish the fatty-acid GO process or a commensal relationship.
- name: Syntrophic Benzoate Degradation
  description: Syntrophus sp. and the methanogen form the association reported to degrade benzoate to acetate, methane
    and carbon dioxide. Syntrophic interdependence is reported during growth on cinnamate. HYPOTHESIZED - H2 transfer
    is a candidate coupling mechanism, not an experimentally identified electron carrier in the accessible abstract.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Syntrophus sp.
    term:
      id: NCBITaxon:43773
      label: Syntrophus <bacteria>
  target_taxon:
    preferred_term: Methanobacterium formicicum
    term:
      id: NCBITaxon:2162
      label: Methanobacterium formicicum
  metabolites:
  - preferred_term: benzoate
    term:
      id: CHEBI:30746
      label: benzoic acid
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  biological_processes:
  - preferred_term: benzoate metabolic process
    term:
      id: GO:0018874
      label: benzoate metabolic process
  downstream:
  - target: Methanogenesis
    description: HYPOTHESIZED - benzoate oxidation could supply H2 as reducing equivalents for CO2-reducing methanogenesis.
      The observed association and methane product support metabolic coupling, but the accessible abstract does
      not discriminate electron carriers or trace carbon and electron flux between partners.
  evidence:
  - reference: PMID:12432464
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Papillibacter cinnamivorans was responsible for benzoate production from cinnamate, whereas a syntrophic
      association between Syntrophus sp. and the methanogen degraded benzoate to acetate, CH(4), and CO(2)
    explanation: Supports the syntrophic association and its mixed end products, not partner-resolved H2 production
      or consumption. Methane is a product of the association, not assigned to Syntrophus alone.
- name: Methanogenesis
  description: PARTIAL - Methanobacterium formicicum replaced the original Methanobacterium isolate in the reconstituted
    consortium, and methane was reported among its degradation products. HYPOTHESIZED - consumption of partner-derived
    H2 with CO2 reduction explains a possible methanogenic route, but the accessible abstract does not resolve that
    transfer. Acetate remains among the reported products; complete mineralization of all cinnamate carbon is not
    established.
  interaction_type: SYNTROPHY
  scope: COMMUNITY_LEVEL
  source_taxon:
    preferred_term: Methanobacterium formicicum
    term:
      id: NCBITaxon:2162
      label: Methanobacterium formicicum
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
    notes: CO2 is reported among consortium products; its use in the proposed hydrogenotrophic route is not directly
      traced in the accessible abstract.
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: methane biosynthetic process
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:12432464
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: In the presence of bromoethanesulfonic acid (BESA), cinnamate was transformed to benzoate, whereas
      under methanogenic conditions without BESA, cinnamate was first transformed to benzoate via beta-oxidation
      and subsequently completely degraded into acetate, CH(4), and CO(2)
    explanation: Supports methane among the consortium products and the BESA comparison. It does not demonstrate
      a specific H2/CO2 transfer route or complete conversion of all carbon to inorganic products; acetate is also
      reported.
