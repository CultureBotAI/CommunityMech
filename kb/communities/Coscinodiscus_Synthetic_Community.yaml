  downstream:
  - target: Community Growth and Pairwise Model
    description: PARTIAL - the measured partner- and phase-specific effects combine into the observed predominantly
      inhibitory all-member algal trajectory. A generalized Lotka-Volterra model fitted to monocultures and pairwise
      cultures reproduces that trajectory with separate early/late parameter sets; this supports the proposed contribution
      without isolating chemical mediators or proving higher-order interactions universally absent.
  evidence:
  - reference: PMID:36300970
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The activity of bacteria can even change during the aging of an algal culture from inhibitory to stimulatory
      or vice versa
    explanation: Supports phase-dependent response. Primary Results and Figs. 2-3 text distinguish partner-specific
      algal and bacterial trajectories, not a universal positive fitness sign or resolved chemical mechanism.
- name: Bacterial Nutrient Supplement Responses
  description: Minimal-medium supplementation with a pooled 13-amino-acid mixture plus vitamins improved growth
    of Rose1, Crocei1 and CS1; CS4 did not respond. DMSP or glucose supplied as carbon alone did not promote any
    of the four bacteria. These are direct nutrient-response assays, not merely genomic predictions. Genome analysis
    separately predicted amino-acid deficits, Rose1 niacin deficiency and Crocei1/CS1 vitamin B12 biosynthesis deficits.
    The pooled rescue does not establish which individual nutrient was limiting, its exact B12 chemical form, or
    donation by the diatom.
  scope: COMMUNITY_LEVEL
