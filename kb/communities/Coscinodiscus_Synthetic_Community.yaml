  downstream:
  - target: Bacterial DMSP Catabolic Potential
    description: HYPOTHESIZED - diatom-derived DMSP could provide substrate for the genomic catabolic potential
      of CS4 and Rose1. No partner-resolved release, consumption or flux was measured, and added DMSP as the carbon-only
      supplement did not promote growth under the tested minimal-medium conditions.
  evidence:
  - reference: PMID:36300970
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Crocei1 grew to significantly higher density
    explanation: 'Primary Results, pairwise bacterial growth paragraph (Fig. 3d): supports increased Crocei1 abundance
      in diatom coculture, not a measured chemical mediator. qPCR was calibrated against cells; it is not viable
      coculture plating. Short excerpt verified against the publisher preview; absent from the abstract-only local
      cache.'
- name: Bacterial DMSP Catabolic Potential
  description: BLASTP comparisons of predicted bacterial proteins support DMSP demethylation/cleavage potential
    in CS4 and Rose1. Crocei1 had weak homologs and CS1 lacked the key DmdA sequence, although downstream homologs
    suggest possible MMPA use. This is sequence-based potential, not measured DMSP consumption, DMS release or diatom-to-bacterium
    flux. DMSP carbon-only supplementation did not promote growth; that negative growth result does not itself prove
    absence of catabolic activity.
  scope: COMMUNITY_LEVEL
