    evidence_source: IN_VITRO
    snippet: all other bacteria grew better
    explanation: Primary Results nutrient-supplementation paragraph and Fig. 5 caption report improved Rose1/Crocei1/CS1
      growth with amino acids plus vitamins, with CS4 as the nonresponding comparison. Methods describe the pooled
      mixture. Not individual B12/B3 rescue or diatom transfer. Short excerpt verified in publisher preview, absent
      from abstract-only cache.
- name: Community Growth and Pairwise Model
  description: The all-member culture generally had lower algal cell counts than the axenic control, especially
    before day 17; the paper also describes a very-late survival benefit. Bacteria performed similarly or slightly
    better than in mono/pairwise cultures, so this is not reciprocal competitive harm. A generalized Lotka-Volterra
    model fitted to mono/pairwise data with distinct days 1-17 and 17-41 parameter sets predicted the algal community
    trajectory; a neutral model failed. Bacterial-bacterial terms were unnecessary for this tested fit, not proven
    universally absent, and chemical cross-feeding was not thereby established.
