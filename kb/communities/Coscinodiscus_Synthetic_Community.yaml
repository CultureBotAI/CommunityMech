- name: Growth Phase-Dependent Bacterial Effects
  description: 'In pairwise cultures, CS4 and Rose1 prolonged algal stationary-phase survival; Crocei1 inhibited
    the diatom across phases. CS1 initially suppressed algal growth, followed by recovery to control-like density
    after day 9, not necessarily growth above control. Reciprocal bacterial responses differed: Crocei1 benefited,
    CS1 was inhibited significantly on days 11-21, and CS4/Rose1 showed no significant diatom effect. These measured
    responses do not support one global mutualism label or identify their chemical mediators.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Coscinodiscus radiatus
    term:
      id: NCBITaxon:33642
