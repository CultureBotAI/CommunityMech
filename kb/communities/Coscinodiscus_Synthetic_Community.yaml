- name: Bacterial Auxotrophy and Nutrient Dependence
  description: 'Genome analysis revealed extensive auxotrophic requirements among the bacteria, with Croceibacter
    Crocei1 showing the highest dependence on external nutrients. Most bacteria required amino acids and
    vitamins (Rose1 needed niacin/B3, while Crocei1 and CS1 needed vitamin B12), indicating strong reliance
    on diatom-derived compounds for growth. This auxotrophy drives the dependence of bacteria on the photosynthetic
    diatom and shapes community assembly and dynamics.

    '
