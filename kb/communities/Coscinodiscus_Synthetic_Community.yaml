ecological_interactions:
- name: Candidate Diatom Resource Provision
  description: The phototrophic diatom is a candidate supplier of bacterial resources. Coculture increased Crocei1
    abundance, but did not significantly increase CS4 or Rose1 and inhibited CS1 after day 9. Thus diatom presence
    has partner-specific effects; neither universal bacterial dependence nor direct release and transfer of DMSP,
    amino acids or vitamins was established. Photosynthetic resource provision is a proposed mediator rather than
    a measured metabolite flux.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Coscinodiscus radiatus
    term:
      id: NCBITaxon:33642
      label: Coscinodiscus radiatus
  metabolites:
