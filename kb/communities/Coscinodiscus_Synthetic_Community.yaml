  preparation_notes: 'f/2 medium (Guillard and Ryther 1962, Guillard 1975) is the standard growth medium
    for marine diatoms and phytoplankton. The medium is prepared with filtered natural seawater or artificial
    seawater (30 ppt salinity) enriched with f/2 nutrients, trace metals, and vitamins. Silicate (sodium
    metasilicate) is essential for diatom growth as it is required to build the biomineralized silica
    frustule cell wall. Autoclaved f/2 medium may produce silica precipitate. The medium supports both
    photosynthetic diatom growth and heterotrophic bacterial growth on diatom-derived organic compounds.

    '
