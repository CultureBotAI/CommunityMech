ecological_interactions:
- name: Non-antagonistic PGPB consortium assembly
  description: >
    The four consortium members were combined only after dual-culture antagonism
    testing showed a complete absence of inhibition zones, i.e., the strains
    coexist without mutual antagonism. This compatibility was a selection
    criterion for building the multi-strain inoculant.
  interaction_type: COMMENSALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: absence of antagonism, assessed
    explanation: Supports selection of strains showing absence of antagonism for the consortium.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: of inhibition zones were used for consortium
    explanation: Supports that only strains with no inhibition zones were combined into the consortium.
- name: PGPB rhizosphere colonization and functional-gene enrichment
  description: >
    Inoculation with the PGPB consortium significantly increased the copy number
    of nitrogen-fixation (nifH) and phosphate-solubilization/mineralization
    marker genes (phoD alkaline phosphatase, BPP phytase) in the lettuce
    rhizosphere of non-amended regolith simulants, consistent with colonization
    of the rhizosphere and enrichment of nitrogen-fixation and
    phosphorus-cycling functions.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Lactuca sativa (lettuce host)
    term:
      id: NCBITaxon:4236
      label: Lactuca sativa
  biological_processes:
