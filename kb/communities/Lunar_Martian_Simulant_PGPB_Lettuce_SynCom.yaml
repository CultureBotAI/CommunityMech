id: CommunityMech:000304
name: Lunar and Martian Simulant PGPB Lettuce SynCom
description: >
  A defined four-strain plant growth-promoting bacterial (PGPB) consortium
  designed for space-agriculture (In-Situ Resource Utilization) research,
  composed of Azotobacter chroococcum 76A, Priestia megaterium EL5,
  Methylobacterium populi VP2, and Kosakonia pseudosacchari TL13. The strains
  belong to the microbial collection of the Department of Agricultural Sciences
  of the University of Naples Federico II and were selected for complementary
  plant growth-promoting traits (nitrogen fixation, phosphate solubilization,
  phytohormone biosynthesis) and for mutual non-antagonism in dual-culture
  assays. In a greenhouse pot experiment, the consortium was combined with
  green compost derived from plant residues (pH 8.25, low C/N ratio) to improve
  lettuce (Lactuca sativa cv. Grand Rapids) growth on commercial Lunar
  (LHS-1) and Martian (MMS-1) regolith simulants with zero external chemical
  input aside from the compost. Compost amendment increased lettuce biomass and
  nutrient bioavailability, and PGPB inoculation enhanced leaf biomass and
  mineral nutritional content while significantly increasing the copy number of
  functional marker genes for nitrogen fixation (nifH), alkaline phosphatase
  (phoD), and phytase (BPP) in non-amended substrates. The system is a
  Bioregenerative Life Support System model relevant to regolith-agriculture and
  long-term space missions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >
    Test whether a selected consortium of plant growth-promoting bacteria,
    combined with green compost, can improve lettuce growth and nutrient
    bioavailability on Lunar and Martian regolith simulants with zero external
    input aside from the compost.
  assembly_strategy: >
    Assemble a four-member PGPB consortium (Azotobacter chroococcum 76A,
    Priestia megaterium EL5, Methylobacterium populi VP2, Kosakonia
    pseudosacchari TL13) from an in-house microbial collection, selecting
    strains for plant growth-promoting traits and for complete absence of
    mutual inhibition in dual-culture antagonism assays; produce freeze-dried
    inocula by fermentor cultivation and apply to lettuce grown on regolith
    simulants with and without compost amendment.
  measurement_endpoints:
  - Lettuce leaf biomass, leaf number, leaf area, and growth index
  - Foliar and substrate macro- and micro-nutrient content and bioavailability
  - Copy number of nifH, phoD, and BPP functional marker genes in the rhizosphere
  - Bacterial diversity and community composition by high-throughput 16S sequencing
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: role of selected consortium of plant growth-promoting
    explanation: States the design goal of testing a selected PGPB consortium for space agriculture.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: zero external input aside from green compost
    explanation: Supports the zero-external-input design constraint with green compost as the only amendment.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: absence of antagonism, assessed
    explanation: Supports the assembly strategy of selecting mutually non-antagonistic strains.
