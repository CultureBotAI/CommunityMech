  value: Lunar Highlands Simulant (LHS-1) and Mojave Mars Simulant (MMS-1)
  description: >
    Lettuce was grown on commercial Lunar (LHS-1, Exolith Lab) and Martian
    (MMS-1, The Martian Garden) regolith simulants, with quartz sand as an inert
    control substrate.
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: commercial Lunar (LHS-1) and Martian (MMS-1)
    explanation: Supports the use of LHS-1 and MMS-1 regolith simulants as substrates.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mojave Mars Simulant (MMS-1
    explanation: Identifies MMS-1 as the Mojave Mars Simulant used in the experiment.
- name: Regolith alkalinity and nutrient limitation
  value: alkaline pH (9 to 10), organic-matter-poor
  description: >
    Regolith simulants are alkaline (pH 9 to 10), lack organic matter, and carry
    anomalous or toxic chemical species (e.g., perchlorates in Mars regolith),
    making them nutrient-deficient substrates for plant growth.
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: REVIEW
    snippet: alkaline pH (9 to 10)
    explanation: Supports the alkaline pH range characteristic of regolith.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: REVIEW
    snippet: perchlorates in Mars rego
    explanation: Supports the presence of toxic perchlorates in Mars regolith.
- name: Green compost amendment
  value: green compost, pH 8.25, low C/N ratio, 20% v/v
  description: >
    A commercial green compost derived from pruning waste and grass cuttings
    (alkaline pH 8.25, low C/N ratio indicating good nitrogen availability) was
    incorporated at 20% (v/v) as the only external amendment, simulating in-situ
    recycling of plant residues.
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: alkaline pH (8.25) and a low C/N ratio
    explanation: Supports the compost pH and low C/N ratio.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: zero external input aside from green compost
    explanation: Supports green compost as the sole external amendment.
- name: Greenhouse climate
  value: mean air temperature 13 C; 10/14 photoperiod
  description: >
    The pot experiment was conducted in a greenhouse with mean air temperature
    13 C (min 8, max 17) and a 10/14 photoperiod.
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 10/14 photoperiod
    explanation: Supports the greenhouse photoperiod used during cultivation.
growth_media:
- name: PGPB inoculum production media (per-strain fermentor cultivation)
  atmosphere: AEROBIC
  ph: '7.00'
  shaking_speed: '130'
  shaking_speed_unit: rpm
  inoculum_size: 2% (v/v) of ~1e8 CFU/mL cell suspension
  preparation_notes: >
    Each strain was cultivated separately in a strain-specific complex medium:
    Brain Heart Infusion (BHI) for K. pseudosacchari TL13, Yeast Mannitol Broth
    (YMB) for A. chroococcum 76A, Plate Count Broth (PCB) for P. megaterium EL5,
    and Nutrient Broth (NB) for M. populi VP2. Fermentations were run at 30 C
    (K. pseudosacchari, P. megaterium), 28 C (A. chroococcum), and for M. populi,
    at pH 7.00, 130 rpm agitation, air sparging 0.5 vvm, with antifoam added.
    Biomass was centrifuged and freeze-dried; inocula were resuspended to 1e6
    CFU/mL per strain and applied to lettuce by a root-dip method plus repeated
    collar application after transplanting.
  evidence:
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: pH 7.00, agitation at 130 rpm, air sparging at 0.5
    explanation: Supports the fermentation pH, agitation, and aeration conditions for inoculum production.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: freeze-dried for long term
    explanation: Supports freeze-drying of the biomass for inoculum storage.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: root dip method
    explanation: Supports the root-dip inoculation method used to apply the consortium to lettuce.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: STIRRED_TANK_BIOREACTOR
  instrument_detail: 14 L fermentor used to produce each strain's biomass for the inoculum
