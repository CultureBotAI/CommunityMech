    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly increased the relative abun
    explanation: Supports that PGPB inoculation increased the relative abundance of marker functional genes.
  - reference: doi:10.1007/s00374-025-01923-3
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increase in functional genes linked with nitrogen fixation and phosphorus
    explanation: Supports enrichment of nitrogen-fixation and phosphorus-solubilization functional genes upon inoculation.
- name: PGPB-enhanced lettuce growth and mineral nutrition
  description: >
    On nutrient-limited regolith simulants, the PGPB consortium enhanced lettuce
    leaf biomass and mineral nutritional content, a beneficial plant-microbe
    interaction in which the bacteria promote host growth in the rhizosphere.
