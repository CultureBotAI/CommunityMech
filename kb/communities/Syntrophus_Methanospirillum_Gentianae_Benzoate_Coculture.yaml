- name: Hydrogen-scavenging sulfate reducer perturbation
  value: BES-inhibited methanogenic coculture plus H2-oxidizing sulfate reducer
  description: Adding a hydrogen-oxidizing sulfate reducer to the BES-inhibited
    methanogenic coculture drove benzoate below the detection limit, supporting
    hydrogen scavenging as a perturbation of the two-member methanogenic system.
