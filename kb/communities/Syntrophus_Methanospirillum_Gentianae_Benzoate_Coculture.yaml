- name: Minimum Energy Threshold for Syntrophic Growth
  description: During growth of the methanogenic coculture, calculated free energy available to S. gentianae was
    -50 to -55 kJ per mol benzoate. The authors inferred an approximate -45 kJ/mol requirement for growth and energy
    conservation. This is a condition-dependent energetic constraint of the fermenter, not a second partner-directed
    syntrophy event or an invariant value for every suspension or perturbation.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Syntrophus gentianae
    term:
      id: NCBITaxon:43775
      label: Syntrophus gentianae
  metabolites:
  - preferred_term: benzoate
    term:
      id: CHEBI:16150
      label: benzoate
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  - preferred_term: benzoate metabolic process
    term:
      id: GO:0018874
      label: benzoate metabolic process
  downstream:
  - target: Methanogenic Benzoate Degradation
    description: 'DIRECTLY IMPLIED: the fermenter must conserve sufficient energy to sustain growth-associated benzoate
      conversion. The observed endpoint correlates with residual substrate and calculated free energy; the inferred
      approximate growth threshold is not an independently manipulated universal constant.'
  evidence:
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: change of free energy available for Syntrophus gentianae ranged between -50 and -55 kJ mol-1
    explanation: Calculated energy availability during growth is assigned to the fermenting bacterium.
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: minimum energy required for growth and energy conservation of the benzoate-fermenting bacterium S.
      gentianae is approximately -45 kJ (mol benzoate)-1
    explanation: The authors infer an approximate growth requirement; dense suspensions and inhibited cultures are
      distinct conditions.
- name: Product Inhibition of Benzoate Degradation
  description: Accumulated hydrogen and acetate constrain methanogenic benzoate degradation thermodynamically. Acetate
    and separately added propionate also lower degradation rate; propionate is not identified as a benzoate product
    here. These are metabolite and energetic constraints on the coculture, not competition between S. gentianae
    and M. hungatei. Rescue with added sulfate reducers or Methanosaeta changes community composition and is not
    an unmodified two-member outcome.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  biological_processes:
  - preferred_term: benzoate metabolic process
    term:
      id: GO:0018874
      label: benzoate metabolic process
  downstream:
  - target: Minimum Energy Threshold for Syntrophic Growth
    description: Product accumulation changes the free energy available to the fermenter, bringing growth-associated
      benzoate conversion toward its energetic limit. Acetate also partly uncouples substrate degradation from energy
      conservation, so this does not assert that product addition changes a fixed intrinsic threshold.
  evidence:
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Accumulated acetate proved to be thermodynamically inhibitory
    explanation: Supports acetate accumulation as a thermodynamic inhibitor in the coculture.
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Addition of acetate or propionate to benzoate-degrading cocultures also lowered the rate
    explanation: Distinguishes acetate/product inhibition from the separate propionate-addition treatment; no reciprocal
      intertaxon harm is established.
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both hydrogen and acetate inhibit benzoate degradation thermodynamically
    explanation: Supports hydrogen and acetate inhibition of methanogenic benzoate degradation.
