id: CommunityMech:000187
name: Syntrophus-Methanospirillum Gentianae Benzoate Coculture
description: >
  A defined anaerobic syntrophic coculture in which Syntrophus gentianae
  degrades benzoate in association with the methanogen Methanospirillum
  hungatei. The system is relevant to DOE anaerobic carbon cycling,
  wastewater digestion, and aromatic-compound bioconversion because it links
  methanogenic benzoate degradation, thermodynamic thresholds, acetate
  inhibition, and methane formation in a tractable two-member community.
ecological_state: STABLE
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Measure the energetics and thermodynamic limits of methanogenic
    benzoate degradation by Syntrophus gentianae in syntrophic coculture.
  assembly_strategy: Pair Syntrophus gentianae with Methanospirillum hungatei
    under methanogenic benzoate-degrading culture conditions.
  perturbation_design: Track benzoate degradation energetics and test how
    hydrogen, acetate, propionate, bromoethanesulfonate, and sulfate-reducing
    partner additions affect the methanogenic coculture.
  measurement_endpoints:
  - Benzoate degradation
  - Methane and acetate formation
  - Residual benzoate concentration
  - Free energy available to the fermenting bacterium
  - Effects of acetate, propionate, hydrogen, BES, and sulfate reducer addition
  evidence:
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Energetics of methanogenic benzoate degradation by Syntrophus gentianae in syntrophic coculture
    explanation: Supports the experimental objective around methanogenic benzoate degradation by S. gentianae.
  - reference: PMID:33657722
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Growing cocultures of Syntrophus gentianae with Methanospirillum hungatei degraded benzoate
    explanation: Supports the exact two-member coculture design and benzoate-degrading phenotype.
