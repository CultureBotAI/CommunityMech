discussions:
- discussion_id: fos_lactobacillus_hepg2_active_metabolites_unresolved
  prompt: Which FOS-derived microbial metabolite or metabolite combination causally reduces HepG2 lipid accumulation and Cd36
    expression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Whole-community organic-acid profile broadening
  - engineering_design
  rationale: Finazzi et al. measured community-level organic-acid profiles and exposed HepG2 cells to extracted bacterial
    metabolites, but the study reports that the specific metabolites responsible for the observed host-cell response were
    not identified.
  evidence:
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the specific metabolites responsible for the observed effect on host cells were not identified
    explanation: States the source-level limitation on causal metabolite assignment.
  proposed_experiments:
  - name: Fractionated FOS-fermentation metabolite add-back
    description: Fractionate FOS-grown whole-community supernatants and add individual organic acids or reconstructed mixtures
      back to palmitate-induced HepG2 cells to test lipid accumulation and Cd36 expression.
    approach: metabolite fractionation and targeted add-back
    model_systems:
    - FOS-grown seven-strain in vitro human-gut community
    - palmitate-induced steatotic HepG2 cells
    perturbations:
    - organic-acid depletion
    - single-metabolite add-back
    - defined metabolite-mixture add-back
    readouts:
    - Oil Red O lipid staining
    - Cd36 RT-qPCR
    - targeted SCFA and organic-acid quantification
    decision_criterion: A fraction or reconstructed metabolite mixture that reproduces both reduced lipid accumulation and
      lower Cd36 expression would nominate a causal metabolite set for follow-up.
  posed_by: codex
  posed_date: '2026-09-28'
