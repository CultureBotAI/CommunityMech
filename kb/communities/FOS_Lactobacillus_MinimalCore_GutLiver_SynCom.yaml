ecological_interactions:
- name: FOS-driven whole-community strain modulation
  description: In 2% FOS DP ~ 10 whole-community cultures, L. plantarum PBS067, L. reuteri PBS072, and E. coli ATCC 25922
    increased to about 10^8 bacterial counts/mL after 48 h, while B. cellulosilyticus CL02T12C19 and F. plautii 1_3_50AFAA
    reached about 10^7 bacterial counts/mL. L. acidophilus PBS066 was a tracked member, but its lower growth was consistent
    with the absence of scrB expression in this condition.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: in the whole community, FOS promotes the growth of L. plantarum PBS067, L. reuteri PBS072, and E. coli reaching
      values of bacterial counts around ~108 at 48 h
    explanation: Supports the dominant LP/LR/EC 48 h response in FOS-grown whole communities.
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: B. cellulosilyticus and F. plautii showed values of ~107 bacterial counts/mL
    explanation: Supports the lower BC/FP 48 h FOS-grown whole-community counts.
- name: Community-context Lactobacillus FOS-pathway expression
  description: 'Lactobacillus FOS-utilization genes were not expressed as a fixed monoculture program: L. reuteri sacK1 remained
    active in the probiotic consortium at 48 h, while L. plantarum sacA/sacK1 were expressed earlier in the consortium and
    at 48 h in the seven-strain reconstructed whole community.'
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Lactiplantibacillus plantarum PBS067
    term:
      id: NCBITaxon:1590
      label: Lactiplantibacillus plantarum
  - preferred_term: Lactobacillus acidophilus PBS066
    term:
      id: NCBITaxon:1579
      label: Lactobacillus acidophilus
  - preferred_term: Limosilactobacillus reuteri PBS072
    term:
      id: NCBITaxon:1598
      label: Limosilactobacillus reuteri
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the differential expression of LP genes (sacA and sacK1) between the monoculture and the probiotic consortium
      at 48 h suggests that interspecies interactions modulate the transcriptional regulation of FOS utilization pathways
    explanation: Supports community-context regulation of L. plantarum FOS genes.
  - reference: PMID:42781020
