id: CommunityMech:000466
name: FOS Lactobacillus-Minimal Core Gut-Liver SynCom
description: A defined seven-strain in vitro human-gut model assembled by supplementing a four-strain minimal core with a
  probiotic Lactobacillus formulation and culturing the resulting whole community in modified MRS medium with 2% fructooligosaccharides.
  The probiotic arm contained Lactiplantibacillus plantarum PBS067, Lactobacillus acidophilus PBS066, and Limosilactobacillus
  reuteri PBS072, while the minimal core contained Bacteroides cellulosilyticus CL02T12C19, Clostridium symbiosum WAL-14673,
  Flavonifractor plautii 1_3_50AFAA, and Escherichia coli ATCC 25922. Finazzi et al. quantified strain dynamics by RT-qPCR,
  assayed Lactobacillus FOS-utilization genes, profiled SCFAs and organic acids by GC-MS, and tested culture-derived metabolites
  on palmitate-induced steatotic HepG2 cells.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Test whether FOS-driven metabolism of a defined three-strain Lactobacillus probiotic formulation alters strain
    dynamics and metabolite output in a four-strain minimal human-gut core, and whether the resulting microbial metabolites
    modulate lipid accumulation in a palmitate-induced steatotic HepG2 assay.
  assembly_strategy: Combine L. plantarum PBS067, L. acidophilus PBS066, and L. reuteri PBS072 as the probiotic consortium;
    combine F. plautii, C. symbiosum, B. cellulosilyticus, and E. coli as the minimal core; and merge both groups as a reconstructed
    whole community.
  inoculation_strategy: Inoculate each member at OD600 = 0.05 into the combined probiotic, minimal-core, or whole-community
    growth assays.
  perturbation_design: Grow single strains, the probiotic consortium, the minimal core, and the whole seven-strain community
    in mMRS with either 2% FOS DP ~ 10 or 1% glucose as reference sole carbon sources.
  measurement_endpoints:
  - OD600 growth in single-strain FOS assays
  - strain-specific RT-qPCR counts after FOS or glucose growth
  - Lactobacillus sacA, scrB, and sacK1 expression by RT-qPCR
  - organic-acid and SCFA profiles by GC-MS
  - Oil Red O lipid accumulation in palmitate-induced HepG2 cells
  - HepG2 Cd36 expression after treatment with bacterial metabolite extracts
  evidence:
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a previously validated four-strain minimal core community ( De Giani et al., 2024 ; Finazzi et al., 2025 ), was
      supplemented with the probiotic formulation and cultured in the presence of fructooligosaccharides
    explanation: Supports the minimal-core plus probiotic assembly scope.
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: strains were inoculated at initial OD600nm equal to 0.05 combined to obtain the probiotic consortium
    explanation: Supports OD600-normalized co-inoculation into defined consortia.
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lactobacillus strain growth and modulation, transcriptional activation of FOS-related genes, and short-chain
      fatty acid (SCFA) metabolic profiles were characterized
    explanation: Supports the microbial abundance, expression, and metabolite readouts.
  - reference: PMID:42781020
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microbiota-derived metabolites were then tested on palmitate-induced steatotic HepG2 cells
    explanation: Supports the downstream hepatocyte metabolite-assay arm.
