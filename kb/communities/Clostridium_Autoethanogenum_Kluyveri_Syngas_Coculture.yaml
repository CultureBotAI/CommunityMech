id: CommunityMech:000172
name: Clostridium autoethanogenum-Clostridium kluyveri Syngas Coculture
description: >
  A defined anaerobic synthetic coculture combining the acetogenic syngas fermenter Clostridium
  autoethanogenum with the chain-elongating bacterium Clostridium kluyveri. C. autoethanogenum
  converts carbon monoxide or syngas into acetate and ethanol, while C. kluyveri consumes these
  products for chain elongation, producing C4 and C6 fatty acids and higher alcohols. The system is
  relevant to DOE carbon utilization and renewable fuels because it couples gas fermentation with
  microbial upgrading of CO/syngas-derived intermediates in one growth vessel.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Integrate syngas fermentation and chain elongation to produce medium-chain fatty acids
    and higher alcohols from carbon monoxide or syngas.
  assembly_strategy: Bottom-up two-species coculture assembled from C. autoethanogenum and C.
    kluyveri in anaerobic gas-fed cultivation.
  perturbation_design: Studies compared monocultures and cocultures on CO or syngas, tested acetate
    supplementation, examined pH effects, and later modeled strategies to increase butyrate and
    hexanoate production.
  measurement_endpoints:
  - Coculture growth on CO or syngas
  - Acetate and ethanol formation
  - Butyrate and caproate production
  - Butanol and hexanol production
  - Metabolic shift during co-cultivation
  - Community flux balance model predictions
  evidence:
