      label: Pseudomonas chlororaphis
  - preferred_term: Pseudomonas thivervalensis JI6
    term:
      id: NCBITaxon:86265
      label: Pseudomonas thivervalensis
  - preferred_term: Ilyonectria robusta
    term:
      id: NCBITaxon:1079257
      label: Ilyonectria robusta
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the five-strain consortia CL95 and CL94 showed substantial inhibition rates of 73%
    explanation: Supports 73% colony-growth inhibition in the plate assay, not a resource-competition mechanism
      or field efficacy value.
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Six consortia exhibited control efficacy exceeding 50%, with CL95 showing the highest efficacy at 66.67%,
      followed closely by CL92 at 62.96%.
    explanation: Supports the reported 66.67% field disease-control phenotype, not direct proof of its molecular
      mediator or of pathogen-suppression-caused plant growth.
- name: CL95 plant growth promotion
  description: CL95 was among six selected field treatments that reduced disease and increased ginseng growth. Separate
    plate screens reported nitrogen-fixation, phosphate-solubilization and potassium-release zone phenotypes; Table
    S5 lists CL95 zones of 13.00, 15.50 and 19.00 mm, respectively. Those screens are functional proxies, not measurements
    of nutrient flux into the plant or proof that any one plate phenotype mediates the field response. Improved
    host growth and higher consortium performance do not by themselves establish reciprocal fitness benefits for
    the host and all five bacterial strains.
  scope: COMMUNITY_LEVEL
  participating_taxa:
