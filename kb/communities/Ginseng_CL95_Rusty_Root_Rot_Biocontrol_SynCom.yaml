      by Pikovaskaia's medium.
    explanation: >-
      Identifies phosphate solubilization as one of the measured growth-promotion
      assays.
growth_media:
- name: LB preculture and strain-specific fermentation broth
  temperature: '28'
  temperature_unit: °C
  shaking_speed: '180'
  shaking_speed_unit: rpm
  inoculum_size: '2.0'
  inoculum_unit: OD600
  inoculum_source: >-
    Bacillus velezensis NJ13, Bacillus velezensis NT35, Bacillus
    amyloliquefaciens FG14, Pseudomonas chlororaphis TU26, and Pseudomonas
    thivervalensis JI6 single-strain colonies
  preparation_notes: >-
    CL95 members were first cultured on LB solid medium for 24 h, transferred to
    LB liquid broth shaken at 180 rpm for seed cultures, inoculated into
    strain-specific fermentation broths, normalized to OD600 2.0, and mixed 1:1
    before biocontrol assays. Field colonization assays drenched three-year-old
    healthy ginseng plants with 100 mL of mixed consortium at 1 x 10^6 cfu/mL.
  evidence:
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For consortium preparation, individual biocontrol strains were firstly
      cultured on LB solid medium at 28 °C for 24 h. Single colonies were
      transferred to LB liquid broth and incubated at 28 °C with shaking
      (180 rpm) to prepare seed cultures liquid, and then were inoculated into
      fermentation broth.
    explanation: >-
      Supports LB solid preculture, LB liquid seed culture, 28 degrees C, 180
      rpm shaking, and transfer into fermentation broth.
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Three-year-old healthy ginseng plants grown in the field were irrigated
      with the consortium at a concentration of 1 × 106 cfu/mL ( Table S6 ).
      Each ginseng plant was treated with a 100 mL infusion.
    explanation: >-
      Supports the field colonization assay inoculum density and per-plant
      inoculation volume.
