ecological_interactions:
- name: CL95 Ilyonectria robusta suppression
  description: CL95 inhibited Ilyonectria robusta in plate and wounded-ginseng-root assays and had the highest reported
    field rusty-root-rot control efficacy among the tested treatments, 66.67%. Plate colony-growth inhibition was
    73%; that endpoint is distinct from disease control. These experiments support whole-consortium antagonistic
    capacity and field disease suppression, not a selectively established resource-competition mechanism or a causal
    attribution to any one member. Fungal qPCR measures DNA abundance, not necessarily viable pathogen numbers.
    Plant growth improved under the same field treatment, but suppression was not selectively manipulated to establish
    it as the mediator of growth.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus velezensis NJ13
    term:
      id: NCBITaxon:492670
      label: Bacillus velezensis
  - preferred_term: Bacillus velezensis NT35
    term:
      id: NCBITaxon:492670
      label: Bacillus velezensis
  - preferred_term: Bacillus amyloliquefaciens FG14
    term:
