discussions:
- discussion_id: ginseng_cl95_member_level_mechanisms
  prompt: Which CL95 member strains and secreted metabolites directly suppress Ilyonectria robusta or drive the
    measured ginseng growth-promotion and rhizosphere enzyme phenotypes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#CL95 Ilyonectria robusta suppression
  - ecological_interactions#CL95 plant growth promotion
  - ecological_interactions#CL95 colonization and rhizosphere enzyme response
  rationale: Tian et al. 2026 connected CL95 to strong pathogen suppression, plant growth promotion, tissue/rhizosphere
    colonization, and soil-enzyme responses, but did not assign the community phenotypes to a specific member or
    molecule. Plate antagonism does not isolate resource competition, and improved host growth does not measure
    reciprocal bacterial fitness. Selective-CFU recovery, plate nutrient-screen zones, soil enzyme activities, defense-gene
    expression and amplicon correlations were measured in distinct assays; they do not selectively establish a colonization,
    nutrient-flux, induced-systemic-resistance or microbiome-recruitment mediation chain. In particular, defense
    transcription is positive host-response evidence, not a pathway-blockade test of necessity. The suppression-to-growth
    arrow is removed because it encodes joint treatment outcomes rather than isolated mediation. Resolve strain-specific
    marker readout, relevant perturbations and the abstract/main-text soil-enzyme percentage discrepancy before
    assigning exact member effects or new causal branches.
  posed_by: codex
  posed_date: '2026-09-14'
