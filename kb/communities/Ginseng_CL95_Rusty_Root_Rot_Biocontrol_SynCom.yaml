      CL95

      13.00±0.253e

      15.50±0.133c

      19.00±0.431d'
    explanation: Cached Supplementary Table S5 reports these CL95 zone diameters. They are plate-screen endpoints,
      not isotope-measured nitrogen fixation, nutrient transfer to ginseng, or field flux.
- name: CL95 colonization and rhizosphere enzyme response
  description: Antibiotic-selection colony counts support recovery of labeled bacteria from ginseng tissues and
    rhizosphere soil after CL95 treatment over the 63-day experiment, with higher recovery than single-strain treatments.
    The Methods name labeled NJ13, NT35 and FG14 strains mixed with unlabeled partners; these counts do not independently
    track all five CL95 members or show that every member benefits. Tissue-specific time courses motivate the authors'
    proposed upward-migration trajectory but do not directly track individual cells moving between tissues. Separately,
    CL95 treatment increased measured rhizosphere phosphatase, sucrase, catalase and urease activities during root
    expansion. These soil activities do not identify their producing organism or establish a colonization-to-enzyme-to-growth
    causal chain, reciprocal mutualism or a specific biofilm mechanism.
