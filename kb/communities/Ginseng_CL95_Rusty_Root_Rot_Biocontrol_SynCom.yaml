  evidence:
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the biocontrol bacteria CL95 showed excellent colonization efficiency, which was significantly better
      than single strain treatment
    explanation: Supports the reported selective-CFU recovery contrast. The Methods use labeled Bacillus strains
      with unlabeled partners; this is not independent tracking or measured fitness of all five members.
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Compared with the single strain CL1, the soil phosphatase activity of CL95 treatment increased by 100%,
      the sucrase activity increased by 140%, the catalase activity increased by 180%, and the urease activity increased
      by 150%.
    explanation: The primary Results report these four soil-activity increases versus CL1 at root expansion, not
      bacterial enzyme production or causal mediation. The 180% catalase value exceeds the abstract's summarized
      100%-150% range; no independently verified figure values are claimed.
