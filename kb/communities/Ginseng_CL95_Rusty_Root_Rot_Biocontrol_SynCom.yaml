id: CommunityMech:000376
name: Ginseng CL95 Rusty Root Rot Biocontrol SynCom
description: >-
  A five-member synthetic bacterial community built from ginseng-associated
  biocontrol strains to suppress Ilyonectria robusta rusty root rot while
  promoting Panax ginseng growth. Tian et al. screened 98 consortia built from
  ten isolates and identified CL95, a 1:1 mixture of Bacillus velezensis NJ13,
  Bacillus velezensis NT35, Bacillus amyloliquefaciens FG14, Pseudomonas
  chlororaphis TU26, and Pseudomonas thivervalensis JI6, as the most effective
  field treatment, with 66.67% rusty-root-rot control efficacy.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Construct a strain-compatible, high-richness ginseng-root biocontrol SynCom
    that improves rusty-root-rot suppression and plant growth relative to
    single-strain applications.
  assembly_strategy: >-
    CL95 combined NJ13, NT35, FG14, TU26, and JI6 at equal OD-normalized volumes
    as one of 98 factorial biocontrol formulations assembled from ten
    candidate ginseng endophytic and rhizobacterial strains.
  inoculation_strategy: >-
    Grow candidate bacteria on LB agar at 28 degrees C, expand single colonies
    in LB liquid broth at 28 degrees C and 180 rpm, transfer them into
    strain-specific fermentation broths, standardize the resulting suspensions
    to OD600 2.0, and mix single-strain suspensions 1:1.
  perturbation_design: >-
    Compare single-strain and multi-strain consortia against Ilyonectria
    robusta in plate, wounded-root, mycelial-biomass, and spore-germination
    assays, then test selected consortia by soil drenching three-year-old
    ginseng plants in rusty-root-rot field plots.
  measurement_endpoints:
  - Ilyonectria robusta plate inhibition
  - wounded ginseng-root lesion size and depth
  - field rusty-root-rot disease index and control efficacy
  - ginseng root length, fresh weight, diameter, and chlorophyll content
  - nitrogen fixation, phosphate solubilization, and potassium release zones
  - ginseng tissue and rhizosphere colonization by antibiotic-labeled strains
  - rhizosphere urease, catalase, sucrase, and phosphatase activity
  notes: >-
    The source publication's Table S1 names NJ13 as methylotrophicus; this
    record grounds NJ13 to Bacillus velezensis because NCBI Taxonomy resolves
    Bacillus methylotrophicus to the current Bacillus velezensis species.
  evidence:
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Bacterial suspensions were standardized to an optical density (OD600) of
      2.0 using sterile water. Subsequently, a combinatorial design was employed
      to mix standardized single-strain suspensions at a 1:1 ratio, resulting in
      a total of 98 distinct biocontrol consortium formulations
    explanation: >-
      Describes the OD-normalized equal-ratio factorial design that produced the
      candidate SynCom set.
  - reference: PMID:42305112
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: |-
      CL95
      5
      NJ13+NT35+FG14+TU26+JI6
    explanation: >-
      Defines CL95 as the five-strain NJ13/NT35/FG14/TU26/JI6 formulation in
      Supplementary Table S3.
