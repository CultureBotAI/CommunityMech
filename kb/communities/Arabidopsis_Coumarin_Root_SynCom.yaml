id: CommunityMech:000094
name: Arabidopsis Coumarin Root SynCom
description: >
  A hydroponic 22-member Arabidopsis root-isolate SynCom used to detect
  strain-level rhizosphere community shifts caused by phytoalexin, flavonoid,
  and coumarin exudates. Under iron deficiency, F6'H1-dependent catecholic
  coumarins suppress the coumarin-sensitive isolate Pseudomonas sp. Root329
  through a peroxide-linked mechanism that contributes to the overall
  wild-type-like community profile.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Determine how Arabidopsis specialized metabolites shape root-associated bacterial community
    composition.
  assembly_strategy: 22-member synthetic community of Arabidopsis thaliana root endophyte isolates.
  perturbation_design: Plant mutants deficient in secreted phytoalexins, flavonoids, and coumarins.
  measurement_endpoints:
  - community shifts
  - rhizosphere colonization
  - metabolite-dependent recruitment
  evidence:
  - &id001
    reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We employed a reduced synthetic community (SynCom) of Arabidopsis thaliana root-isolated
      bacteria to detect community shifts that occur in the absence of the secreted small-molecule phytoalexins,
      flavonoids, and coumarins.
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We designed a 22-member SynCom from A. thaliana root endophyte isolates collected
      from loamy soil in Cologne
    explanation: Confirms the member count and isolate source for the hydroponic root SynCom.
