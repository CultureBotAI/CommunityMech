id: CommunityMech:000094
name: Arabidopsis Coumarin Root SynCom
description: A reduced Arabidopsis root-isolate SynCom used to detect rhizosphere community shifts caused
  by phytoalexin, flavonoid, and coumarin exudates.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Determine how Arabidopsis specialized metabolites shape root-associated bacterial community
    composition.
  assembly_strategy: Reduced synthetic community of Arabidopsis thaliana root-isolated bacteria.
  perturbation_design: Plant mutants deficient in secreted phytoalexins, flavonoids, and coumarins.
  measurement_endpoints:
  - community shifts
  - rhizosphere colonization
  - metabolite-dependent recruitment
  evidence:
  - &id001
    reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We employed a reduced synthetic community (SynCom) of Arabidopsis thaliana root-isolated
      bacteria to detect community shifts that occur in the absence of the secreted small-molecule phytoalexins,
      flavonoids, and coumarins.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Arabidopsis root SynCom used to test plant specialized metabolite effects on rhizosphere assembly.
taxonomy:
- taxon_term:
    preferred_term: Arabidopsis root-isolated bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:d__Bacteria
      gtdb_taxon: Bacteria
      gtdb_lineage: d__Bacteria
      ncbi_source_id: NCBITaxon:2
      majority_fraction: 1.0
      support_genomes: 1603049
      total_genomes: 1603049
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at d__ rank; 1 GTDB taxa under the NCBI taxon]
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Coumarin-Dependent Recruitment
  description: Plant exuded specialized metabolites structure which bacteria persist in the rhizosphere.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Reduced synthetic community of Arabidopsis thaliana root-isolated bacteria.
  description: Plant mutants deficient in secreted phytoalexins, flavonoids, and coumarins.
  evidence:
  - *id001
related_ingredients:
- preferred_term: coumarin
  chebi_term:
    id: CHEBI:28794
    label: coumarin
  relevance: Coumarins are the central class of root-exuded specialized metabolites
    studied in this SynCom; loss of coumarin biosynthesis in the f6'h1 mutant drives
    the iron-dependent shift in root-associated bacterial community composition.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lack of coumarin biosynthesis in f6'h1 mutant plant lines causes a shift
      in the root microbial community specifically under iron deficiency
    explanation: Names coumarin biosynthesis as the perturbation that reshapes the
      synthetic root microbiome, anchoring coumarin as central to this community.
- preferred_term: iron(3+)
  chebi_term:
    id: CHEBI:29034
    label: iron(3+)
  relevance: Iron availability gates the community effect; the coumarins exuded by
    Arabidopsis act as iron-mobilizing molecules that sculpt the bacterial community
    under iron-limited conditions, making ferric iron a defining environmental driver.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: iron-mobilizing coumarins in sculpting the A. thaliana root bacterial
      community
    explanation: Links iron mobilization by coumarins to community structuring, anchoring
      ferric iron as a central species in this iron-deficiency-dependent system.
growth_media:
- name: quarter-strength tryptic soy broth (root-isolate SynCom inoculum); hydroponic Murashige and
    Skoog medium for the Arabidopsis host
  inoculum_source: Arabidopsis thaliana root-isolated bacteria grown to saturation
  vessel_type: hydroponics platform
  preparation_notes: SynCom strains were grown to saturation in quarter-strength tryptic soy broth and
    washed with phosphate-buffered saline before root inoculation; the Arabidopsis host was grown
    hydroponically, with the medium around 13-day-old seedlings inoculated with the SynCom and the root
    community profiled at 20 days; iron-deficient Murashige and Skoog media were used to test the
    coumarin-dependent community shift.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All SynCom strains were grown to saturation in quarter-strength tryptic soy broth and washed
      with phosphate-buffered saline before root inoculation.
    explanation: Names quarter-strength tryptic soy broth as the growth medium and PBS wash for the
      SynCom inoculum.
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The media surrounding hydroponically grown 13-d-old A. thaliana seedlings was inoculated with
      a 22-member SynCom
    explanation: Gives the hydroponic host cultivation and the 13-day seedling stage at inoculation.
