    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas sp. Root329 was found to consistently respond positively to lines
      that lack biosynthesis and release of oxidized coumarins
    explanation: Identifies Pseudomonas sp. Root329 as the SynCom member that
      reproducibly expands when plant roots lack oxidized coumarin production.
ecological_interactions:
- name: Iron-Limited Catecholic Coumarin Exudation
  description: Iron-deficient Arabidopsis roots exude the catecholic coumarins sideretin, fraxetin and esculetin.
    Biosynthesis/release mutants alter the root community, but exudation is not itself evidence of reciprocal competition.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: coumarins
    term:
      id: CHEBI:23403
      label: coumarins
    notes: Class grounding; activity here concerns the tested catecholic compounds, not every coumarin.
  - preferred_term: iron(3+)
    term:
      id: CHEBI:29034
      label: iron(3+)
  downstream:
  - target: Catecholic Coumarin Peroxide Generation
    description: The exuded catecholic compounds supply the chemical species shown separately to generate peroxide
      in iron-deficient MS medium; this connection does not measure peroxide concentration at the colonized root.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Sideretin, fraxetin, and esculetin are confirmed major coumarins exuded by wild-type roots under iron
      deficiency
    explanation: Names the wild-type, iron-deficiency coumarins upstream of the SynCom community shift.
- name: Catecholic Coumarin Peroxide Generation
  description: Purified sideretin, fraxetin and esculetin generated hydrogen peroxide in iron-deficient MS medium
    over 24 hours. This is cell-free redox chemistry; the separate nutrient-agar inhibition and catalase-rescue
    assays test a bacterial consequence.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: coumarins
    term:
      id: CHEBI:23403
      label: coumarins
    notes: Class grounding; activity here concerns the tested catecholic compounds, not every coumarin.
  - preferred_term: iron(3+)
    term:
      id: CHEBI:29034
      label: iron(3+)
  - preferred_term: hydrogen peroxide
    term:
      id: CHEBI:16240
      label: hydrogen peroxide
  downstream:
  - target: Pseudomonas Root329 Coumarin Sensitivity
    description: PARTIAL - peroxide generation and abolition of sideretin inhibition by catalase support peroxide
      involvement in Root329 sensitivity. Chemistry in iron-deficient MS and inhibition on nutrient agar are separate
      assays, not a direct root-community peroxide measurement.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Hydrogen peroxide was generated by the catecholic coumarins sideretin, fraxetin, and esculetin in iron-deficient
      Murashige and Skoog media over a 24-h period
    explanation: Links the catecholic coumarins to peroxide production in the same iron-deficient medium context.
- name: Pseudomonas Root329 Coumarin Sensitivity
  description: Purified sideretin strongly inhibited Pseudomonas Root329 on nutrient agar, while fraxetin had a
    weaker effect. Catalase and soluble iron relieved sideretin inhibition. Sensitivity differed among tested pseudomonads,
    so this is not a genus-wide susceptibility claim.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. Root329
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
  - preferred_term: coumarins
    term:
      id: CHEBI:23403
      label: coumarins
    notes: Class grounding; activity here concerns the tested catecholic compounds, not every coumarin.
  - preferred_term: hydrogen peroxide
    term:
      id: CHEBI:16240
      label: hydrogen peroxide
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Pseudomonas-Weighted Coumarin Community Shift
    description: PARTIAL - Root329's compound sensitivity is a candidate explanation for its root relative-abundance
      response to coumarin biosynthesis and supplementation. The experiments do not isolate peroxide as the mediator
      within the intact root community or establish absolute depletion.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: severe growth inhibition of Pseudomonas sp. Root329 by the predominant wild-type coumarin sideretin,
      and moderate inhibition by fraxetin
    explanation: Supports direct inhibition of the focal Pseudomonas isolate by purified oxidized coumarins.
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: inhibitory activity of sideretin on Pseudomonas sp. Root329 could be abolished with addition of catalase
    explanation: Supports peroxide involvement in the sideretin-mediated inhibition.
- name: Pseudomonas-Weighted Coumarin Community Shift
  description: Root329 relative abundance increased in f6'h1 roots and declined after coumarin supplementation,
    with partial restoration of the community profile. In-silico removal/rescaling of Root329 reduced the profile
    difference; this was not a physical Root329 dropout. Separate reduced-community experiments retained the response.
    Supplied scopoletin can be converted by the plant, so complementation does not imply identical direct antimicrobial
    activity for every added compound.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. Root329
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
  - preferred_term: coumarins
    term:
      id: CHEBI:23403
      label: coumarins
    notes: Class grounding; activity here concerns the tested catecholic compounds, not every coumarin.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Pseudomonas sp. Root329 became less abundant at the f6 ′ h1 root with the addition of either coumarin
    explanation: Supports a root relative-abundance response and partial chemical complementation, not absolute
      bacterial depletion.
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Removing Pseudomonas sp. Root329 by in silico rescaling substantially diminished the community profile
      shift between wild type and f6 ′ h1
    explanation: Supports the compositional contribution of Root329 by in-silico rescaling, not physical strain
      removal.
environmental_factors:
- name: defined synthetic community design
  value: 22-member synthetic community of Arabidopsis thaliana root endophyte isolates.
  description: >
    Plant mutants deficient in secreted phytoalexins, flavonoids, and coumarins
    were screened with a hydroponic root-isolate SynCom whose members could be
    tracked by 16S rRNA gene amplicon sequencing.
  evidence:
  - *id001
- name: iron-deficient Murashige and Skoog medium
  value: iron-deficient hydroponic medium
  description: >
    The f6'h1 and wild-type SynCom comparison and the coumarin chemical
    complementation assay were performed under iron deficiency, the condition
    that induces root production and exudation of oxidized coumarins.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lack of coumarin biosynthesis in f6'h1 mutant plant lines causes a shift in
      the root microbial community specifically under iron deficiency
    explanation: Establishes iron deficiency as the environmental condition
      gating the coumarin-dependent SynCom profile shift.
related_ingredients:
- preferred_term: coumarin
  chebi_term:
    id: CHEBI:28794
    label: coumarin
  relevance: Coumarins are the central class of root-exuded specialized metabolites
    studied in this SynCom; loss of coumarin biosynthesis in the f6'h1 mutant drives
    the iron-dependent shift in root-associated bacterial community composition.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: lack of coumarin biosynthesis in f6'h1 mutant plant lines causes a shift
      in the root microbial community specifically under iron deficiency
    explanation: Names coumarin biosynthesis as the perturbation that reshapes the
      synthetic root microbiome, anchoring coumarin as central to this community.
- preferred_term: iron(3+)
  chebi_term:
    id: CHEBI:29034
    label: iron(3+)
  relevance: Iron availability gates the community effect; the coumarins exuded by
    Arabidopsis act as iron-mobilizing molecules that sculpt the bacterial community
    under iron-limited conditions, making ferric iron a defining environmental driver.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: iron-mobilizing coumarins in sculpting the A. thaliana root bacterial
      community
    explanation: Links iron mobilization by coumarins to community structuring, anchoring
      ferric iron as a central species in this iron-deficiency-dependent system.
- preferred_term: hydrogen peroxide
  chebi_term:
    id: CHEBI:16240
    label: hydrogen peroxide
  relevance: >
    Hydrogen peroxide is the reactive oxygen species generated by catecholic
    coumarins in iron-deficient Murashige and Skoog medium and implicated by
    catalase rescue in sideretin-mediated inhibition of Pseudomonas sp. Root329.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Hydrogen peroxide was generated by the catecholic coumarins sideretin, fraxetin,
      and esculetin in iron-deficient Murashige and Skoog media
    explanation: Names hydrogen peroxide as the ROS produced by iron-mobilizing
      coumarins in the iron-deficient assay medium.
growth_media:
- name: quarter-strength tryptic soy broth (root-isolate SynCom inoculum); hydroponic Murashige and
    Skoog medium for the Arabidopsis host
  inoculum_source: Arabidopsis thaliana root-isolated bacteria grown to saturation
  vessel_type: hydroponics platform
  preparation_notes: SynCom strains were grown to saturation in quarter-strength tryptic soy broth and
    washed with phosphate-buffered saline before root inoculation; the Arabidopsis host was grown
    hydroponically, with the medium around 13-day-old seedlings inoculated with the SynCom and the root
    community profiled at 20 days; iron-deficient Murashige and Skoog media were used to test the
    coumarin-dependent community shift.
  evidence:
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All SynCom strains were grown to saturation in quarter-strength tryptic soy broth and washed
      with phosphate-buffered saline before root inoculation.
    explanation: Names quarter-strength tryptic soy broth as the growth medium and PBS wash for the
      SynCom inoculum.
  - reference: PMID:31152139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The media surrounding hydroponically grown 13-d-old A. thaliana seedlings was inoculated with
      a 22-member SynCom
    explanation: Gives the hydroponic host cultivation and the 13-day seedling stage at inoculation.
discussions:
- discussion_id: coumarin_root_peroxide_mediation
  prompt: Does root-local peroxide mediate absolute Root329 suppression under native conditions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Iron-Limited Catecholic Coumarin Exudation
  - ecological_interactions#Catecholic Coumarin Peroxide Generation
  - ecological_interactions#Pseudomonas Root329 Coumarin Sensitivity
  - ecological_interactions#Pseudomonas-Weighted Coumarin Community Shift
  rationale: PMID:31152139 distinguishes cell-free chemistry, nutrient-agar catalase rescue, plant complementation
    and computational rescaling. Their combination supports a mechanism but does not isolate peroxide mediation
    at the root. Absolute abundances, strain-specific susceptibility and transfer beyond the controlled plant system
    remain unresolved.
  posed_by: codex
  posed_date: '2026-10-05'
