    description: HYPOTHESIZED - sulfate-supported D. vulgaris H2 consumption could limit the proposed transfer to
      M. hungatei. Zero hydrogenotrophic flux is model-inferred, not proven cessation of methanogen activity.
  - target: Cellulose Cross-Feeding to Methane
    description: PARTIAL - the model attributes lower methane output to reduced H2 availability for hydrogenotrophic
