discussions:
- discussion_id: kg-dv-acetate-co2-to-mc-methanogenesis
  prompt: Does D. vulgaris fermentation of lactate to acetate and CO2 causally enhance acetoclastic methanogenesis
    by M. concilii, i.e. is there a second (D. vulgaris-derived) carbon route to methane beyond the direct R. cellulolyticum
    → M. concilii hand-off?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#R. cellulolyticum acetate cross-feeding to M. concilii
  rationale: If confirmed, D. vulgaris would be a secondary acetate/CO2 supplier to the acetoclastic methanogen,
    adding a parallel carbon route to methane and changing how the causal graph attributes methane output between
    the two carbon sources. The source paper proposes it mechanistically ("it may be") but does not demonstrate
    the D. vulgaris → M. concilii carbon edge directly, so it is recorded here as a knowledge gap rather than asserted
    as an ecological interaction.
  evidence:
  - reference: PMID:36847519
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Mechanistically, it may be that D. vulgaris enhances methanogenesis by producing the substrates CO2,
      acetate, and H2 and removing lactate
    explanation: The authors state the D. vulgaris → methanogen carbon contribution as a hypothesis ("it may be"),
      not a demonstrated causal edge — the basis for filing it as a knowledge gap.
- discussion_id: cellulose_quad_transfer_identifiability
  prompt: Which donor substrates and pressure-dependent exchanges uniquely explain the sulfate response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cellulose Cross-Feeding to Methane
  - ecological_interactions#R. cellulolyticum acetate cross-feeding to M. concilii
  - ecological_interactions#R. cellulolyticum lactate cross-feeding to D. vulgaris
  - ecological_interactions#Proposed D. vulgaris H2 syntrophy to M. hungatei
  - ecological_interactions#M. hungatei H2 removal relieves R. cellulolyticum product inhibition
  - ecological_interactions#D. vulgaris–M. hungatei competition for H2
  rationale: PMID:36847519 admits alternative optimal flux solutions and poorly constrained Dv exchanges. Protein
    abundance does not validate every flux direction, and persistent Mh protein prevents equating fitted zero flux
    with eradication. Preserve the existing open Dv-to-Mc hypothesis; no route from the separate 2025 panel is imported.
    Control means no added sulfate, not chemically sulfate-free.
  posed_by: codex
  posed_date: '2026-10-05'
