id: CommunityMech:000089
name: Cellulose-to-Methane Quad-Culture SynCom
description: A four-species anaerobic synthetic community coupling cellulose degradation, sulfate reduction,
  and methanogenesis.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: METHANOGENESIS
engineering_design:
  objective: Resolve higher-order cross-feeding, competition, and synergy during anaerobic conversion
    of cellulose to methane and carbon dioxide.
  assembly_strategy: Rational functional-guild assembly of cellulolytic, sulfate-reducing, hydrogenotrophic
    methanogenic, and acetoclastic methanogenic members.
  perturbation_design: Control cultures were compared with sulfate addition using metaproteomics, metabolite
    profiling, and stoichiometric modeling.
  measurement_endpoints:
  - methane production
  - cellulose degradation
  - sulfate reduction
  - cross-feeding fluxes
  evidence:
  - &id001
    reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we constructed a quad-culture consisting of a cellulolytic bacterium (Ruminiclostridium
      cellulolyticum), a hydrogenotrophic methanogen (Methanospirillum hungatei), an acetoclastic methanogen
      (Methanosaeta concilii), and a sulfate-reducing bacterium (Desulfovibrio vulgaris).
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: laboratory bioreactor
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Anaerobic cellulose-degrading laboratory quad-culture with sulfate perturbation.
taxonomy:
- taxon_term:
    preferred_term: Ruminiclostridium cellulolyticum
    term:
      id: NCBITaxon:1521
      label: Ruminiclostridium cellulolyticum
  functional_role:
  - PRIMARY_DEGRADER
  evidence:
  - *id001
- taxon_term:
    preferred_term: Methanospirillum hungatei
    term:
      id: NCBITaxon:323259
      label: Methanospirillum hungatei JF-1
  functional_role:
  - SYNTROPHIC_PARTNER
  evidence:
  - *id001
- taxon_term:
    preferred_term: Methanosaeta concilii
    term:
      id: NCBITaxon:2223
      label: Methanothrix soehngenii
  functional_role:
  - SYNTROPHIC_PARTNER
  evidence:
  - *id001
- taxon_term:
    preferred_term: Desulfovibrio vulgaris
    term:
      id: NCBITaxon:881
      label: Nitratidesulfovibrio vulgaris
  functional_role:
  - SYNTROPHIC_PARTNER
  evidence:
  - *id001
ecological_interactions:
- name: Cellulose Cross-Feeding to Methane
  description: Cellulose fermentation products are exchanged with methanogens and sulfate reducers, producing
    methane and modulating competition.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Rational functional-guild assembly of cellulolytic, sulfate-reducing, hydrogenotrophic methanogenic,
    and acetoclastic methanogenic members.
  description: Control cultures were compared with sulfate addition using metaproteomics, metabolite profiling,
    and stoichiometric modeling.
  evidence:
  - *id001
related_ingredients:
- preferred_term: cellulose
  chebi_term:
    id: CHEBI:18246
    label: (1->4)-beta-D-glucan
  relevance: The starting substrate of the quad-culture — R. cellulolyticum hydrolyzes cellulose,
    initiating the cellulose-to-methane anaerobic degradation cascade modeled by the SynCom (Wang et al.
    2023).
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: distinct key metabolic processes in the anaerobic degradation of cellulose to methane and
      CO2
    explanation: Names cellulose as the substrate the quad-culture anaerobically degrades.
- preferred_term: acetate
  chebi_term:
    id: CHEBI:15366
    label: acetic acid
  relevance: Cross-fed intermediate — acetate produced by the cellulolytic R. cellulolyticum is the
    handoff substrate consumed by the acetoclastic methanogen M. concilii, the central cross-feeding
    flux in the quad-culture's cellulose-to-methane cascade.
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cross-feeding of acetate from a cellulolytic bacterium to an acetoclastic methanogen
    explanation: Names acetate as the cross-fed intermediate between the cellulolytic bacterium and
      acetoclastic methanogen.
- preferred_term: dihydrogen
  chebi_term:
    id: CHEBI:18276
    label: dihydrogen
  relevance: Cross-fed gas — H₂ is competed for between the sulfate-reducing D. vulgaris and the
    hydrogenotrophic methanogen M. hungatei; sulfate addition shifts this competition, redistributing
    methane vs sulfide production fluxes.
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: competition of H2 between a sulfate reducing bacterium and a hydrogenotrophic methanogen
    explanation: Names dihydrogen as the competed substrate between sulfate-reducer and
      hydrogenotrophic methanogen.
- preferred_term: methane
  chebi_term:
    id: CHEBI:16183
    label: methane
  relevance: One of two end-products (with CO2) of the quad-culture's anaerobic cellulose degradation
    — methane output decreases with sulfate addition as electrons divert to sulfate reduction.
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sulfate addition enhanced sulfate reduction and decreased methane and CO2 productions
    explanation: Names methane as an end-product of the cellulose-degradation cascade that responds
      to sulfate-mediated electron-flow redistribution.
- preferred_term: sulfate
  chebi_term:
    id: CHEBI:16189
    label: sulfate
  relevance: The added electron acceptor — sulfate addition strengthens metabolic handoffs from
    R. cellulolyticum to M. concilii / D. vulgaris and intensifies M. hungatei × D. vulgaris H₂
    competition, redirecting community flux from methanogenesis toward sulfate reduction.
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sulfate addition strengthened metabolic handoffs from R. cellulolyticum to M. concilii
      and D. vulgaris and intensified substrate competition between M. hungatei and D. vulgaris
    explanation: Names sulfate as the perturbation electron acceptor that reshapes community-level
      handoffs and competition.
