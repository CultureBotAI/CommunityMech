ecological_interactions:
- name: Cellulose Cross-Feeding to Methane
  description: The four-member culture converts cellulose to methane through cross-feeding. Methane output and cellulose
    degradation showed different higher-order responses. Organism-resolved exchange routes require the assay and
    modeling qualifications below; higher total output does not establish reciprocal fitness.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cooperated via cross-feeding to produce methane using cellulose
    explanation: Supports community-level substrate conversion, unlike a membership-only snippet; it does not resolve
      every individual transfer.
- name: R. cellulolyticum acetate cross-feeding to M. concilii
  description: R. cellulolyticum-derived acetate supports the acetoclastic M. concilii route. Culture outcomes support
    this direction, while the sulfate-associated increase in handoff is inferred from fitted stoichiometric fluxes,
    not directly traced carbon transfer.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ruminiclostridium cellulolyticum
    term:
      id: NCBITaxon:1521
      label: Ruminiclostridium cellulolyticum
  target_taxon:
    preferred_term: Methanosaeta concilii
    term:
      id: NCBITaxon:2223
      label: Methanothrix soehngenii
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: acetoclastic methanogenesis
    term:
      id: GO:0019385
      label: methanogenesis, from acetate
  downstream:
  - target: Cellulose Cross-Feeding to Methane
    description: Acetate cross-fed to M. concilii drives acetoclastic methanogenesis, one of the two routes to community
      methane output.
  evidence:
  - reference: PMID:36847519
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: cross-feeding of acetate from a cellulolytic bacterium to an acetoclastic methanogen
    explanation: Names the directed acetate hand-off from the cellulolytic bacterium (R. cellulolyticum) to the
      acetoclastic methanogen (M. concilii).
  - reference: PMID:36847519
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: sulfate addition increased both the production of acetate and lactate by R. cellulolyticum and their
      consumption by M. concilii and D. vulgaris
    explanation: Supports the fitted sulfate-associated increase, not a directly traced transfer measurement.
- name: R. cellulolyticum lactate cross-feeding to D. vulgaris
  description: PARTIAL - the source proposes lactate transfer from R. cellulolyticum to D. vulgaris, but could not
    resolve lactate versus alternative intermediates. Lactate oxidation to H2 was unfavorable at the studied H2
    pressures; pyruvate or alanine remain possible donors.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
