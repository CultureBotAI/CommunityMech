id: CommunityMech:000407
name: Microhabitat Mineral Fungal-Bacterial SOM SynCom
description: A four-member artificial soil-organic-matter microcosm inoculum consisting of Curtobacterium sp. PTCC 1316,
  Trichoderma harzianum IBRC-M30059, Phanerochaete chrysosporium IBRC-M30144, and Pseudomonas fluorescens IBRC-M10752.
  Maqami et al. 2026 used the synthetic fungi-plus-bacteria consortium as an experimentally simplified alternative to a
  native agricultural-soil microbiome in 500 mL glass-jar microcosms containing sterilized bentonite or palygorskite clay,
  calcium carbonate, quartz sand, and wheat-straw or alfalfa-shoot litter, then quantified respiration kinetics and microbial
  biomass carbon over a 90-day incubation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Construct a simplified cross-kingdom soil inoculum to test how selected bacterial and fungal litter-decomposition
    guilds respond to clay mineralogy, calcium carbonate level, and plant-litter quality in artificial SOM microcosms.
  assembly_strategy: Combine two fast-growing copiotrophic bacteria, Curtobacterium sp. and P. fluorescens, with two saprotrophic
    fungi, T. harzianum and P. chrysosporium, to represent soluble-carbon use and extracellular-enzyme attack on structural
    carbohydrates and lignin.
  inoculation_strategy: Inoculate the bacterial community into mineral-litter microcosms at 10^8 cells per gram of clay and
    the fungal community at 20 mg of mycelia per gram of clay.
  perturbation_design: Compare the fungi-plus-bacteria consortium with a native agricultural-soil microbiome across palygorskite
    versus bentonite clay, 0%, 10%, and 20% clay, 7.5% and 15% calcium carbonate, and wheat versus alfalfa litter additions.
  measurement_endpoints:
  - soil microbial respiration
  - cumulative carbon dioxide evolution over 90 days
  - wheat-litter first-order mineralization parameters
  - alfalfa-litter sigmoidal mineralization parameters
  - microbial biomass carbon at 15, 30, 60, and 90 days
  evidence:
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We constructed an artificial microbial inoculum consisting of Curtobacterium sp., Trichoderma harzianum, Phanerochaete
      chrysosporium and Pseudomonas fluorescens
    explanation: Identifies the four-member artificial fungal-bacterial inoculum.
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The four species are functionally important in SOM cycling and were selected to represent complementary stages of litter
      decomposition.
    explanation: Supports the design rationale for combining bacterial soluble-carbon users with saprotrophic fungal decomposers.
