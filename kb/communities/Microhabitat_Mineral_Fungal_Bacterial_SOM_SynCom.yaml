discussions:
- discussion_id: som_syncom_no_abiotic_carbonate_partition
  prompt: What fraction of CaCO3-amended CO2 efflux was microbial respiration rather than abiotic carbonate-derived CO2?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Mineral-litter SOM turnover by the fungal-bacterial inoculum
  - environmental_factors#Calcium carbonate content
  rationale: The study measured total CO2 efflux but explicitly reports that abiotic CO2 release from CaCO3 was not separated,
    so carbonate-associated respiration endpoints are curated as net microcosm outcomes.
  posed_by: codex
  posed_date: '2026-09-21'
- discussion_id: som_syncom_unquantified_mineral_mechanisms
  prompt: Which enzyme-sorption or molecular-scale organo-mineral stabilization pathways drove the palygorskite and CaCO3
    effects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Mineral-litter SOM turnover by the fungal-bacterial inoculum
  rationale: The authors interpret respiration and biomass patterns through clay microhabitat engineering, enzyme retention,
    and stabilization hypotheses, but state that the underlying enzyme-sorption and molecular-scale stabilization pathways
    were not directly quantified.
  posed_by: codex
  posed_date: '2026-09-21'
