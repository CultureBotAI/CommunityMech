ecological_interactions:
- name: Mineral-litter SOM turnover by the fungal-bacterial inoculum
  description: The synthetic Curtobacterium / Trichoderma / Phanerochaete / Pseudomonas inoculum was assayed for net wheat-
    and alfalfa-litter turnover in clay-CaCO3-quartz microcosms, where total CO2 efflux and microbial biomass carbon were
    shaped by clay mineralogy, calcium carbonate level, litter chemistry, and comparison to native-soil inoculum.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Curtobacterium sp. PTCC 1316
    term:
      id: NCBITaxon:2034
      label: Curtobacterium
  - preferred_term: Trichoderma harzianum IBRC-M30059
    term:
      id: NCBITaxon:5544
      label: Trichoderma harzianum
  - preferred_term: Phanerochaete chrysosporium IBRC-M30144
    term:
      id: NCBITaxon:2822231
      label: Phanerodontia chrysosporium
  - preferred_term: Pseudomonas fluorescens IBRC-M10752
    term:
      id: NCBITaxon:294
      label: Pseudomonas fluorescens
  evidence:
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: native communities generated higher cumulative C loss but lower rate constants, while the synthetic consortium drove faster
      mineralization and higher biomass on palygorskite.
    explanation: Summarizes the article's core comparison between native-soil microbiome and synthetic fungi-plus-bacteria
      inocula.
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, mixed fungal and bacterial inocula generally supported higher MBC in both litter types.
    explanation: Supports higher microbial biomass carbon for the mixed fungal-bacterial inoculum.
environmental_factors:
- name: Clay mineral type and content
  value: bentonite or palygorskite at 0, 10, or 20
  unit: '% w/w'
  description: Sterilized bentonite and palygorskite were supplied as factorial habitat-structure treatments.
  evidence:
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: clay (palygorskite or bentonite at three levels of 0, 10, and 20% w/w)
    explanation: Reports the clay types and dose series used in the mineral-litter microcosms.
- name: Calcium carbonate content
  value: 7.5 or 15
  unit: '% w/w'
  description: Calcium carbonate was supplied as a second mineral treatment to test carbonate modulation of clay-microbe-litter
    dynamics.
  evidence:
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: calcium carbonate (at two levels of 7.5 and 15% w/w)
    explanation: Reports the two CaCO3 treatments used in the microcosms.
- name: Litter quality
  value: wheat straw or alfalfa shoots
  unit: plant litter type
  description: Wheat straw represented a recalcitrant high-C:N litter, while alfalfa shoots represented a more labile nitrogen-rich
    litter.
  evidence:
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: litter (wheat or alfalfa, equivalent of 2% carbon w/w)
    explanation: Reports the wheat and alfalfa litter treatments and carbon-standardized amendment rate.
- name: Controlled incubation
  value: 22
  unit: °C
  description: Mineral-litter microcosms were incubated at 22 °C with moisture controlled to 33 kPa for 90 days, then destructively
    sampled at 15, 30, 60, and 90 days.
  evidence:
  - reference: PMID:42218210
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: incubated at 22 C under controlled moisture conditions corresponding to a matric potential of 33 kPa throughout the incubation
      period
    explanation: Supports the incubation temperature, moisture target, and 90-day experiment duration.
