id: CommunityMech:000432
name: Four-Species Aerobic Lung Microbiome Model
description: A simplified artificial lung microbiome model assembled as an aerobic four-species co-culture of Pseudomonas
  koreensis, Rothia aeria, Neisseria cinerea, and Streptococcus downei. The model was maintained for 10 days at 34°C in brain
  heart infusion medium and validated with qPCR, viability PCR, conventional microbiology, and metaproteomics to provide a
  controlled platform for lung microbiome interaction and pulmonary-drug studies.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Establish a reproducible, simplified in vitro bacterial co-culture that models representative members of the
    human lung microbiome under controlled aerobic laboratory conditions.
  assembly_strategy: Combine the four representative bacterial species P. koreensis, R. aeria, N. cinerea, and S. downei into
    an artificial lung microbiome model.
  measurement_endpoints:
  - 10-day co-culture stability
  - Quantitative PCR
  - Viability PCR
  - Conventional microbiological viability assays
  - Metaproteomic mass spectrometry
  - Bioinformatic inference of potential microbe-microbe interactions
  evidence:
  - reference: PMID:42545019
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we developed a simplified artificial lung microbiome model composed of four representative bacterial species
    explanation: Supports the source's objective of making a simplified artificial lung microbiome model.
  - reference: PMID:42545019
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We successfully established a stable 10-day co-culture at 34°C using brain heart infusion medium
    explanation: Supports the 10-day BHI co-culture implementation and incubation temperature.
  - reference: PMID:42545019
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Integrated bioinformatic analyses revealed a variety of potential microbe-microbe interactions, which were supported
      by metaproteomic analysis using mass spectrometry.
    explanation: Supports metaproteomics as an interaction-supporting endpoint while not asserting individual pairwise edges.
