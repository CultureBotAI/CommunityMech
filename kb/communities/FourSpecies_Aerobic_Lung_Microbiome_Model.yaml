discussions:
- discussion_id: lung_full_text_causal_expansion
  prompt: Which observed phenotypes and proposed mechanisms belong in the four-species causal graph?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'The openly available primary main body (PMID:42545019; PMC13595950) now supports source review beyond
    the abstract. The record still has no interaction nodes and remains needs_research under #1461. Day-10 vPCR
    persistence, total CFU, DNA-qPCR and protein fractions are distinct readouts. P. koreensis-containing bicultures
    alkalinize, and community pH recovers after acid perturbation, but total CFU does not resolve member-specific
    compositional resilience. Siderophore uptake, partner-resolved acid/pyruvate exchange, ammonia mediation and
    AI-2 coordination require hypothesis-qualified treatment, not inferred flux or selective causality from proteins
    alone. Predicted antimicrobial pathways produced no inhibition zones in the tested agar assay, not proof of
    universal absence. Nutrient-rich BHI and pH 9-10 are not physiological healthy-airway conditions. Challenge
    organisms are not members of the canonical four-species record. One-community Edison dry run completed; specific
    credit authorization requested and no provider job or spend made. Add no speculative nodes or arrows while research
    is pending. Source body, tables and captions read; figure images, supplements and raw data not inspected. Strain
    and model metadata remain #1463.'
  posed_by: codex
  posed_date: '2026-10-06'
