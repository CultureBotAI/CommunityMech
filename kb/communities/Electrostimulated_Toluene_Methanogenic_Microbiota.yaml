id: CommunityMech:000440
name: Electrostimulated Toluene Methanogenic Microbiota
description: An anaerobic methanogenic toluene-degrading microbiota whose syntrophic hydrocarbon conversion was stimulated
  at 800 mV. Wu et al. (2024) compared electro-stimulated and non-electro-stimulated methanogenic microbiota with bamA amplification
  and metagenomic sequencing, and inferred a shift from a Syntrophobacteraceae MAG116-centered, acetoclastic methanogen-associated
  network toward anode-recruited Desulfoprunum MAG10, hydrogen-producing Aminidesulfovibrio MAG60, and cathode-recruited hydrogenotrophic
  Methanobacterium MAG74 interactions that boosted methane production from toluene.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Enhance anaerobic conversion of toluene to methane by electro-stimulating a methanogenic microbiota.
  assembly_strategy: Laboratory electro-stimulation at 800 mV compared with a non-electro-stimulated methanogenic toluene-degrading
    microbiota.
  measurement_endpoints:
  - Toluene degradation efficiency
  - Methane production efficiency
  - bamA amplification
  - Genome-resolved metagenomic sequencing
  - Anode and cathode recruitment of electroactive MAGs
  evidence:
  - reference: PMID:38865893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: electro-stimulation at 800 mV promoted toluene degradation and methane production efficiencies
    explanation: Supports the applied electro-stimulation treatment and the enhanced toluene-to-methane phenotype.
  - reference: PMID:38865893
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Hydrocarbon-degrading gene bamA amplification and metagenomic sequencing analyses
    explanation: Supports the gene-targeted and metagenomic readouts used to resolve candidate toluene degraders and syntrophs.
