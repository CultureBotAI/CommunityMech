ecological_interactions:
- name: Coordinated Pathogen Suppression
  description: Bacterial and fungal antagonists suppress Fusarium wilt while avoiding detrimental cross-inhibition.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: SynCom 1.2 combined Pseudomonas chlororaphis subsp. piscium PS5, Bacillus velezensis BN8.2, and
    Trichoderma virens T2C1.4.
  description: Non-simultaneous soil application was used to reduce cross-inhibition among biocontrol
    members.
  evidence:
  - *id001
related_ingredients:
- preferred_term: fusaric acid
  chebi_term:
    id: CHEBI:5199
    label: Fusaric acid
  relevance: Fusarium oxysporum secondary metabolite implicated in cross-talk between the pathogen Foc
    TR4 and the SynCom 1.2 biocontrol members — Prigigallo et al. 2022 invoke fusaric acid as a candidate
    mediator of the bidirectional antagonism observed in their in vitro interaction study.
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: fusaric acid, known as one of the secondary metabolites of Fusarium species, might be involved
      in such an interaction
    explanation: Establishes fusaric acid as a Foc-derived secondary metabolite involved in the pathogen
      × SynCom interaction the redesigned biocontrol consortium addresses.
growth_media:
- name: LB broth (Luria-Bertani)
  temperature: '27'
  temperature_unit: °C
  incubation_time: '3'
  incubation_time_unit: days
  shaking_speed: '250'
  shaking_speed_unit: rpm
  vessel_type: 50 mL tubes containing 20 mL LB broth
  inoculum_source: banana rhizosphere isolates
  preparation_notes: Bacterial SynCom members (Pseudomonas chlororaphis subsp. piscium PS5 and Bacillus
    velezensis BN8.2) were grown in LB broth, then centrifuged and washed with sterile distilled water
    before use. Isolates were originally recovered on genus-selective agar media (King's B for Pseudomonas,
    nutrient agar for Bacillus, starch-casein-KNO3 agar for Streptomyces, and Trichoderma harzianum-selective
    medium for Trichoderma) with 7 days incubation at 27°C. The three SynCom 1.2 members were applied to
    soil non-simultaneously to reduce cross-inhibition.
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas spp. and Bacillus spp. isolates were grown in 50 mL tubes containing 20 mL LB broth
      and incubated at 27°C at 250 rpm for 3 days.
    explanation: Reports the liquid culture medium (LB broth), vessel, temperature (27°C), shaking speed
      (250 rpm), and incubation time (3 days) for the SynCom bacterial members.
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'After 7 days of incubation at 27°C'
    explanation: Reports the 27°C incubation temperature used for recovering the fungal/actinomycete isolates
      on selective agar media.
