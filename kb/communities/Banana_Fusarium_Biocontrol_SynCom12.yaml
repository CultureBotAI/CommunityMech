ecological_interactions:
- name: SynCom1.0 and SynCom1.1 Pot Biocontrol
  description: The 44-member SynCom1.0 and seven-member SynCom1.1 each reduced banana Fusarium-wilt symptom severity
    by about 35% in pot experiments. These are host disease outcomes for earlier mixtures, not reciprocal-fitness
    measurements or tests of the canonical three-member SynCom1.2 alone.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a small one such as SynCom 1.1 (seven highly effective isolates) provided similar disease control (35%
      symptom severity reduction)
    explanation: 'Supports the intermediate seven-isolate consortium whose biocontrol activity and cross-inhibition
      profile informed SynCom 1.2.

      '
- name: SynCom1.1 Cross-Inhibition Mapping
  description: In-vitro assays showed inhibition of Foc TR4 by selected biocontrol isolates, inhibition among some
    SynCom1.1 members, and inhibition of beneficial isolates by the pathogen. COMPETITION denotes the reported reciprocal
    negative effects, not every isolate pair. PARTIAL - fusaric-acid sensitivity supports a candidate mediator,
    but production by the tested Foc strain and necessary mediation of the soil response were not established in
    the inspected main text.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: fusaric acid
    term:
      id: CHEBI:5199
      label: Fusaric acid
    notes: Exogenous sensitivity was tested; production by this pathogen strain and necessary mediation remain unverified.
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: revealed that beneficial microorganisms not only antagonized the pathogen but also some of the SynCom
      constituents
    explanation: 'Shows why explicit compatibility mapping was needed before reducing the biocontrol community to
      SynCom 1.2.

      '
  - reference: PMID:35992653
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: fusaric acid, known as one of the secondary metabolites of Fusarium species, might be involved in such
      an interaction
    explanation: The source explicitly proposes fusaric acid as a possible mediator; sensitivity assays do not establish
      its production or necessity in this interaction.
- name: Staggered SynCom1.2 Soil Biocontrol
  description: Non-simultaneous application of PS5, BN8.2 and T2C1.4 delayed Fusarium-wilt progression. Benefit
    in the higher-pathogen-pressure trial C was transient; the lower-pressure trial D showed stronger disease-endpoint
    protection. Staggering was intended to reduce cross-inhibition, but reduced inhibition in soil was not directly
    demonstrated and is not inferred from disease scores alone.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:35992653
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: A non-simultaneous soil application of these isolates (to diminish cross-inhibition) delayed FWB progress
      over time
    explanation: Supports the application strategy and measured delay; the parenthetical purpose is not a measurement
      of reduced soil cross-inhibition.
