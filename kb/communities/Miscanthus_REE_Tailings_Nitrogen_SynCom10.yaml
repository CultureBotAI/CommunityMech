  description: The live Miscanthus-root SynCom reduced ammonia nitrogen in REE
    tailing soil, both by itself and more strongly when inoculated with Miscanthus
    plants.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
