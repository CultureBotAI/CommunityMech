ecological_interactions:
- name: Nitrogen Transformation in REE Tailings
  description: The ten-strain root-derived SynCom was selected for nitrification and denitrification capabilities
    and plant growth promotion in ammonia-nitrogen-polluted REE tailings. The five named participants are the existing
    grouped taxonomy entries, not five strains or ten fully resolved strain identities. Capability and community-level
    outcomes do not establish every member contribution or reciprocal microbial fitness benefit.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
  biological_processes:
  - preferred_term: nitrification
    term:
      id: GO:0019329
      label: ammonia oxidation
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  downstream:
  - target: Live-SynCom Ammonia Nitrogen Removal
    description: PARTIAL - The SynCom nitrogen-cycle capabilities support biological transformation as a contributor
      to the observed ammonia-nitrogen reduction. The primary abstract attributes removal jointly to microbial transformation
      and plant-associated uptake; the available evidence does not partition their quantitative contributions or
      establish every participating strain as necessary.
  evidence:
  - reference: PMID:39481489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This SynCom, consisting of 10 bacterial strains, included species of the genera Burkholderia (5) Paraburkholderia
      (1), Curtobacterium (1), Leifsonia (1) and Sinomonas (2).
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:39481489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: possessing nitrification and denitrification capabilities, to help REEs mine plants efficiently convert
      pollutant AN into nutrients
    explanation: Supports nitrification and denitrification as the SynCom capabilities coupled to ammonia-nitrogen
      removal in rare-earth tailings.
  participating_taxa:
  - preferred_term: Burkholderia sp.
    term:
      id: NCBITaxon:32008
      label: Burkholderia
  - preferred_term: Paraburkholderia sp.
    term:
      id: NCBITaxon:1822464
      label: Paraburkholderia
  - preferred_term: Curtobacterium sp.
    term:
      id: NCBITaxon:2034
      label: Curtobacterium
  - preferred_term: Leifsonia sp.
    term:
      id: NCBITaxon:110932
      label: Leifsonia
  - preferred_term: Sinomonas sp.
    term:
      id: NCBITaxon:37927
      label: Sinomonas atrocyanea
- name: Live-SynCom Ammonia Nitrogen Removal
  description: The SynCom alone reduced tailing-soil ammonia nitrogen by 24.8%; with Miscanthus the reduction was
    32.6%, compared with 25.5% for plants alone. These positive community/plant treatment effects are retained without
    calling ammonia-nitrogen disappearance a measured complete nitrogen balance, universal strain cooperation or
    reciprocal fitness gain.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  biological_processes:
  - preferred_term: nitrification
    term:
      id: GO:0019329
      label: ammonia oxidation
  - preferred_term: denitrification
    term:
      id: GO:0019333
      label: denitrification pathway
  downstream:
  - target: Miscanthus Biomass Stimulation
    description: HYPOTHESIZED - Reduced ammonia-nitrogen stress and altered nitrogen availability could contribute
      to the shoot/root biomass increase after live SynCom inoculation. The primary abstract reports both outcomes
      but does not isolate this mediation from other growth-promoting activities or the reverse contribution of
      larger plants to nitrogen uptake; this arrow is not a selectively demonstrated causal direction.
  evidence:
  - reference: PMID:39481489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: this SynCom alone achieved a significant reduction of 24.8% in AN content in tailing soil
    explanation: Quantifies ammonia-nitrogen removal by the live SynCom in REE tailing soil.
  - reference: PMID:39481489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When the SynCom inoculated with plants, the reduction in AN was even more significant (32.6%)
    explanation: Supports the stronger ammonia-nitrogen removal observed when the SynCom was paired with Miscanthus
      plants.
  participating_taxa:
