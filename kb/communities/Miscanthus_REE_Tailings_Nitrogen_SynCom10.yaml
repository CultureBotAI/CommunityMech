  - preferred_term: Sinomonas sp.
    term:
      id: NCBITaxon:37927
      label: Sinomonas atrocyanea
- name: Miscanthus Biomass Stimulation
  description: Live SynCom inoculation increased Miscanthus shoot and root biomass by 39.8% and 49.7%, respectively,
    relative to dead SynCom inoculation. Seven nitrogen-cycle strains were particularly enriched, consistent with
    selective root association. These results establish positive inoculation effects and enrichment, not proof that
    enrichment itself causes biomass gain or a quantitative measurement of plant nitrogen uptake mediated by each
    strain.
  scope: COMMUNITY_LEVEL
