ecological_interactions:
- name: Anaerobic Fermentation and Short-Chain Fatty Acid Output
  description: SIHUMIx bioreactor studies measured community short-chain fatty acid output. The transit-time study
    reports lower butyrate and selected other acids at shorter transit time; total SCFA, acetate and propionate
    did not change significantly with transit time. These bulk endpoints do not identify donor-recipient exchange
    or establish BP5 mediation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: doi:10.3390/microorganisms7120641
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a reduction in butyrate, methyl butyrate, isobutyrate, valerate, and isovalerate concentrations
    explanation: Supports measured acid-output differences in the distinct transit-time experiment, not cross-feeding
      or BP5 causation.
- name: Community-Specific Small Protein Expression
  description: Six novel small proteins were detected only in the community comparison. This is positive expression
    evidence, but single-strain and community cultivation conditions differed, so community-specific regulation
    is not isolated. Antimicrobial predictions and the limited positive synthetic-CR2 assay do not establish colonization
    facilitation or a native BP5-mediated exchange mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: six of these sProteins were only identified in the SIHUMIx community
    explanation: Supports community-specific protein expression.
  - reference: PMID:33622394
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Two of these novel sProteins have a potential antimicrobial function
    explanation: The abstract describes potential antimicrobial function; predictions are not proof of community
      colonization facilitation.
- name: Predicted Blautia Exchange After BP5-Neighbor Reaction Knockout
  description: 'COMPUTATIONAL: constraint-based modelling predicted altered B. producta exchanges after in silico
    removal of rxn15467, a valine-biosynthesis reaction encoded near BP5. The predictions included reduced acetate
    production and increased choline uptake/betaine production. This was not a BP5 knockout; genomic proximity and
    community-only detection leave BP5 mediation HYPOTHESIZED. Predicted exchange is not measured transfer or an
    established cause of SCFA outcomes in the separate transit-time study.'
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: choline
    term:
      id: CHEBI:15354
      label: choline
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:33622394
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: An in silico knockout of (R)-2,3-dihydroxy-3-methylbutanoate hydrolyase which is in close genomic neighborhood
      to BP5 and catalyzes the second-to-last step in valine biosynthesis, led to a reduced metabolite production
      and concurrently increased metabolite consumption by B. producta for the SIHUMIx community members.
    explanation: Supports the simulated neighboring-enzyme perturbation and predicted exchange, not a BP5 perturbation
      or measured cross-feeding.
cultivation_setup:
- cultivation_mode: CHEMOSTAT
  system_type: BIOREACTOR_UNSPECIFIED
  working_volume: 250.0
  working_volume_unit: mL
  instrument_detail: >-
    In vitro bioreactors run chemostatically on a complex intestinal medium, held anaerobic
    by continuously gassing the vessels with nitrogen. Each of the eight species was grown
    individually for 72 h first, then the reactor was inoculated with 1e9 cells of each, so
    the community starts from a defined and equal-per-strain inoculum rather than from a
    mixed culture.
  notes: >-
    `system_type` is BIOREACTOR_UNSPECIFIED on purpose. The source says "in vitro
    bioreactors" and refers to a prior paper for the design; it never says stirred-tank, and
    guessing the vessel would put an unevidenced enum value where a reader would take it as
    read from this paper.

    Operating temperature is absent for the same reason. The 37 °C and 175 rpm in this paper
    belong to the sentence about strains "cultivated separately" in BHI - those are the
    eight precultures, not the community, and recording them here is the error class #529
    covers. The bioreactor's own temperature is in the cited prior work.

    The 250 mL is the medium volume the inoculum went into, which is the closest thing the
    source gives to a working volume; it is not called that.
  evidence:
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The SIHUMIx community was cultivated in chemostatic bioreactors
    explanation: Sources both the chemostat mode and the bioreactor system type.
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: continuously cultivated in complex intestinal medium (Supplement Table 2) and
      maintained under anaerobic conditions by continuously gassing the bioreactor vessels
      with nitrogen
    explanation: Continuous operation, the medium, and how anaerobiosis was maintained.
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the eight bacterial species were cultivated individually for 72 h before inoculation
      of the bioreactor with 1 × 109 bacterial cells per strain (total cell number = 8 × 109
      cells in 250 mL medium)
    explanation: The inoculation scheme and the 250 mL the community was grown in.

