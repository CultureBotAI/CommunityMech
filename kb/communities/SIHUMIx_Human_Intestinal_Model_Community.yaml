ecological_interactions:
- name: Anaerobic Fermentation and Short-Chain Fatty Acid Output
  description: SIHUMIx is maintained as an anaerobic intestinal model in which community metabolism can
    be followed through short-chain fatty acid measurements. The community includes primary carbohydrate
    degraders and secondary fermenters that together support acetate, propionate, and butyrate output
    under controlled bioreactor conditions.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: doi:10.3390/microorganisms7120641
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a reduction in butyrate, methyl butyrate, isobutyrate, valerate, and isovalerate concentrations
    explanation: Supports short-chain fatty acid output as a measured community function.
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The reduced complexity compared to the intestinal microbiome allows researchers to use the in vitro model system
    explanation: Supports use of SIHUMIx to analyze controlled community metabolism and interactions.
- name: Community-Specific Small Protein Expression
  description: SIHUMIx metaproteomic comparisons found small proteins expressed only in multi-species
    community cultivation, including candidates with potential antimicrobial function. These observations
    indicate that community context changes functional gene-product expression relative to single-strain
    growth.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: interspecies interaction between organisms
  evidence:
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: six of these sProteins were only identified in the SIHUMIx community
    explanation: Supports community-specific protein expression.
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two of these novel sProteins have a potential antimicrobial function
    explanation: Supports potential interaction-relevant antimicrobial functions.
environmental_factors:
- name: Anaerobic Atmosphere
  value: Nitrogen-gassed anaerobic bioreactor
  description: SIHUMIx is cultivated under anaerobic conditions suitable for gut-associated anaerobes.
  evidence:
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: maintained under anaerobic conditions by continuously gassing the bioreactor vessels with nitrogen
    explanation: Supports anaerobic cultivation conditions.
- name: Temperature
  value: '37'
  unit: degrees Celsius
  description: SIHUMIx member strains are cultivated at host-relevant temperature.
  evidence:
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: under anaerobic conditions at 37 °C
    explanation: Supports the cultivation temperature.
- name: Transit Time Perturbation
  value: 12 h, 24 h, and 48 h transit-time simulations
  description: SIHUMIx has been used to test resistance of community structure and function to physiological
    colonic transit-time changes.
  evidence:
  - reference: doi:10.3390/microorganisms7120641
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SIHUMIx showed high structural stability when TT changed
    explanation: Supports transit time as an experimentally varied ecological factor.
