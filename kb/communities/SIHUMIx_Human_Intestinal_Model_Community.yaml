id: CommunityMech:000080
name: SIHUMIx Human Intestinal Model Community
description: 'SIHUMIx is an extended simplified human intestinal microbiota consisting
  of eight bacterial strains used as a reduced-complexity in vitro model of the human
  gut microbiome. The community includes common intestinal anaerobes and facultative
  bacteria spanning major gut-associated lineages, and it is maintained under anaerobic
  bioreactor conditions in complex intestinal medium. SIHUMIx supports controlled
  metaproteomic, metabolomic, metatranscriptomic, and community stability studies,
  including analysis of short-chain fatty acid output and community-specific small
  proteins.

  '
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Provide a reduced-complexity human intestinal model community for controlled
    in vitro studies of community structure, metabolism, and multi-omics readouts.
  assembly_strategy: Bottom-up assembly of eight defined human intestinal bacterial strains.
  measurement_endpoints:
  - Community structure by species-specific proteins and cytometric fingerprinting
  - Short-chain fatty acid production
  - Metaproteomics and metatranscriptomics
  - Community-specific small protein expression
  notes: SIHUMIx extends the earlier SIHUMI model by adding Clostridium butyricum.
  evidence:
  - reference: PMID:33622394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We studied the simplified human intestinal microbiota (SIHUMIx) consisting of eight bacterial species
    explanation: Supports SIHUMIx as an eight-species reduced-complexity intestinal model.
