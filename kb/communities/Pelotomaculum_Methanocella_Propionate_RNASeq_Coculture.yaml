  description: HYPOTHESIZED - RNA-seq changes suggest flagellum-related signaling and amino-acid exchange during syntrophy.
    The source specifically hypothesizes amino-acid transfer from M. conradii to P. thermopropionicum; transcript changes
    do not directly demonstrate transfer or a single direction for both signaling and nutrient exchange.
  interaction_type: MUTUALISM
