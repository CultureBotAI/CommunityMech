  downstream:
  - target: Propionate Oxidation Coupled to Methanogenesis
    description: 'PARTIAL - formate turnover is inferred to support syntrophic electron transfer. Its effect depends on conditions:
      adding 20 mM formate immediately halted propionate oxidation, which resumed after formate consumption; adding 5 mM 2-BES
      abolished propionate oxidation and methane production. The source did not find comparable inhibition after H2/CO2 addition,
      so this edge does not assert a measured low-H2 requirement in that experiment.'
  evidence:
  - reference: PMID:30038609
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: flavin-based electron bifurcation/confurcation systems in both organisms were also upregulated
    explanation: Supports electron bifurcation/confurcation as a coculture response.
  - reference: PMID:30038609
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: formate was produced and utilized by P. thermopropionicum and M. conradii, respectively
    explanation: Supports formate transfer from the syntroph to the methanogen.
  - reference: PMID:30038609
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The addition of formate halted propionate oxidation and CH4 production immediately
    explanation: Supports the inhibition condition; the methods specify a 20 mM formate addition.
  - reference: PMID:30038609
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Methane production and propionate oxidation were completely inhibited after the addition of 2-BES
    explanation: Supports the methanogenesis-inhibition perturbation; the methods specify 5 mM 2-BES.
