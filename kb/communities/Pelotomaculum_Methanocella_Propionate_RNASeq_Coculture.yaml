discussions:
- discussion_id: peloto_expression_and_transfer_causality
  prompt: Which transcript changes and exchange routes are causal drivers of the syntrophic phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Propionate Oxidation Coupled to Methanogenesis
  - ecological_interactions#Catabolism and Methanogenesis Upregulation in Coculture
  - ecological_interactions#Formate and Electron Bifurcation Strategy
  - ecological_interactions#Signal Transduction and Amino Acid Exchange
  rationale: PMID:30038609 compares pyruvate-grown bacterial and H2/CO2-grown archaeal monocultures with a propionate-fed
    coculture at a different growth rate. The authors caution that these differences affect transcription. Parallel catabolic,
    formate-handling and signaling responses do not establish an ordered causal chain. Amino-acid transfer from M. conradii
    to P. thermopropionicum is explicitly hypothesized and requires direct transfer or perturbation evidence.
