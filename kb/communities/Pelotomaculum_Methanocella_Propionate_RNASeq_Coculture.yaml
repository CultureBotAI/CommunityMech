id: CommunityMech:000190
name: Pelotomaculum-Methanocella Propionate RNA-Seq Coculture
description: >
  A defined anaerobic syntrophic coculture pairing the propionate-oxidizing
  bacterium Pelotomaculum thermopropionicum with the hydrogenotrophic methanogen
  Methanocella conradii. RNA-seq comparisons against monocultures showed
  coordinated transcriptional shifts in catabolism, methanogenesis, electron
  bifurcation/confurcation, formate handling, signal transduction, and amino
  acid exchange. The system is relevant to DOE interests in anaerobic carbon
  cycling, methane production, syntrophic propionate degradation, and
  transcriptome-guided bioreactor microbiology.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: >
    Compare monocultures and defined syntrophic cocultures to identify how
    P. thermopropionicum and M. conradii coordinate metabolism during
    propionate-oxidizing methanogenic growth.
  assembly_strategy: >
    Construct cocultures of propionate-oxidizing P. thermopropionicum and
    hydrogenotrophic M. conradii, then compare transcriptomes to corresponding
    monoculture controls.
  perturbation_design: >
    Compare monoculture and coculture transcriptomes and test inhibition of
    syntrophic activity by formate and 2-bromoethanesulphonate.
  measurement_endpoints:
  - Strand-specific mRNA sequencing
  - Differential transcript abundance
  - Propionate-oxidizing catabolism
  - Methanogenesis gene expression
  - Formate and electron bifurcation/confurcation gene expression
  evidence:
  - reference: PMID:30038609
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transcriptome analysis was performed on these cultures using strand-specific mRNA sequencing
    explanation: Supports the RNA-seq-centered experimental design.
  - reference: PMID:30038609
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: constructed cocultures of propionate-oxidizing Pelotomaculum thermopropionicum and hydrogenotrophic Methanocella conradii
    explanation: Supports the exact two-member coculture assembly.
