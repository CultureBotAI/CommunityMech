- name: Formate and Electron Bifurcation Strategy
  description: PARTIAL - increased formate-dehydrogenase and putative electron-bifurcation/confurcation transcripts, together
    with formate and 2-BES perturbations, support the authors' inference that formate contributes to electron transfer and
    redox balance during syntrophy. These observations do not directly quantify interspecies formate flux or enzyme activity.
