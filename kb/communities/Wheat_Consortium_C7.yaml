ecological_interactions:
- name: C7 Dual-Culture and Volatile Inhibition of R. solani AG8
  description: The assembled four-strain consortium SynCom 7 (C7) significantly inhibited Rhizoctonia solani AG8 radial growth
    in dual-culture PDA plate assays (25.15 +- 6.80%, p <= 0.05, Dunn test, Table 2) and was one of only four SynComs (C2-C4
    and C7) whose volatile organic compounds significantly inhibited R. solani AG8 radial growth in divided Petri dish assays
    (Fig. 4B). By contrast, C7 cell-free supernatant showed no antifungal activity despite individual supernatants of B5,
    B6, B7, and B11 inhibiting AG8 by 40.62-76.56% (Table 4).
