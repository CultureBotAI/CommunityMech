discussions:
- discussion_id: c7_cfs_vs_plate_and_soil_protection_gap
  prompt: Why does assembled SynCom 7 (C7) lack antifungal activity in its cell-free supernatant (Table 4) when all four of
    its individual constituent strains (B5, B6, B7, and B11) produce strongly inhibitory cell-free supernatants (40.62-76.56%),
    and how do its volatile emission, direct contact antagonism, and auxin production combine in soil to protect wheat against
    R. solani AG8?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#C7 Dual-Culture and Volatile Inhibition of R. solani AG8
  - ecological_interactions#C7 Greenhouse Wheat Protection and Salkowski Auxin Output
  rationale: 'Every single member of C7 (Pseudomonas sp. B5: 40.62 +- 9.10%, Streptomyces sp. B6: 57.53 +- 15.53%, Chryseobacterium
    sp. B7: 76.56 +- 3.60%, Pseudomonas sp. B11: 48.45 +- 18.90%) produced cell-free supernatants that inhibited R. solani
    AG8 in Table 4, yet the mixed C7 supernatant lost detectable activity, while C7 retained dual-culture (25.15 +- 6.80%)
    and volatile inhibition (Fig. 4B) and significantly protected wheat in AG8-infested soil (Fig. 2C, Supplementary Fig.
    1). Resolving inter-strain regulation of secreted metabolites and in-soil colonization requires targeted metabolomic and
    persistence tracking.'
  evidence:
  - reference: PMID:36118206
    reference_title: Synthetic microbial consortia derived from rhizosphere soil protect wheat against a soilborne fungal
      pathogen.
    supports: SUPPORT
    evidence_source: full_text
    snippet: the cell-free supernatants from the rest of the eight bacteria and 10 SynComs did not show any antifungal activities
    explanation: Documents the loss of cell-free supernatant antifungal activity across all 10 assembled SynComs including
      C7.
  - reference: PMID:36118206
    reference_title: Synthetic microbial consortia derived from rhizosphere soil protect wheat against a soilborne fungal
      pathogen.
    supports: SUPPORT
    evidence_source: full_text
    snippet: While not assessed here, investigation of the fate of those inoculations in the soil after plant growth is needed
      to address their persistence and stability
    explanation: Confirms that post-inoculation persistence and stability of SynCom members in soil were not measured.
