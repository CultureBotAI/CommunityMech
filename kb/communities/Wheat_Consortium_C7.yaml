id: CommunityMech:000514
name: Wheat Synthetic Consortium C7
description: A four-member wheat-rhizosphere synthetic bacterial consortium (SynCom 7 / C7) assembled in equal OD600 ratios
  from Pseudomonas sp. B5, Streptomyces sp. B6, Chryseobacterium sp. B7, and Pseudomonas sp. B11 (Yin et al. 2022, PMID:36118206).
  SynCom 7 inhibited Rhizoctonia solani AG8 radial growth in dual-culture plates (25.15 +- 6.80%, Table 2) and volatile organic
  compound assays (Fig. 4B), produced 10.87 +- 2.54 ug/mL auxin in Salkowski assays (Table 3), and significantly reduced wheat
  root rot score while increasing fresh root weight in AG8-inoculated greenhouse soil compared with uninoculated controls
  (Fig. 2C, Supplementary Fig. 1), whereas its cell-free supernatant showed no antifungal activity (Table 4).
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
engineering_design:
  objective: 'Evaluate whether the four-strain multi-genus wheat-rhizosphere consortium SynCom 7 (C7: Pseudomonas sp. B5,
    Streptomyces sp. B6, Chryseobacterium sp. B7, and Pseudomonas sp. B11) suppresses Rhizoctonia solani AG8 and protects
    wheat against root rot.'
  assembly_strategy: Bottom-up equal-ratio combination (SynCom 7 / C7) of four antifungal wheat-rhizosphere isolates spanning
    three bacterial genera (Pseudomonas spp. B5 and B11, Streptomyces sp. B6, and Chryseobacterium sp. B7).
  inoculation_strategy: Grow each bacterium on 1/4x TSA at 25 degrees Celsius for 48 h, resuspend in sterile ddH2O to OD600
    = 0.1 or 1.0, and mix the four strains in equal volume ratios prior to plate and pot assays.
  perturbation_design: Compare SynCom 7 (C7) against sterile ddH2O and AG8-only controls, 14 single bacterial isolates, and
    9 sibling SynComs (C1-C6, C8-C10) across dual-culture AG8 inhibition, volatile inhibition, cell-free supernatant, Salkowski
    auxin, Arabidopsis root-architecture, and greenhouse wheat root-rot assays.
  measurement_endpoints:
  - In vitro Rhizoctonia solani AG8 radial-growth inhibition in dual culture (Table 2)
  - Bacterial volatile inhibition of R. solani AG8 radial growth (Fig. 4B)
  - Greenhouse wheat root rot score and fresh root weight in AG8-inoculated soil (Fig. 2C, Supplementary Fig. 1)
  - Salkowski colorimetric auxin concentration (Table 3) and cell-free supernatant assay (Table 4)
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 7(C7) Pseudomonas sp. B5, Streptomyces sp. B6, Chryseobacterium sp. B7, Pseudomonas sp. B11
    explanation: Table 1 defines the four bacterial isolates assembled into SynCom 7 (C7).
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynComs were obtained by mixing the individuals in equal ratios. Then, the same volume of bacterial suspension
      was applied for sample treatments.
    explanation: Documents the equal-ratio suspension assembly protocol for C1-C10.
