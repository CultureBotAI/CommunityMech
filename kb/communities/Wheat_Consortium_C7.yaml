- name: C7 Greenhouse Wheat Protection and Salkowski Auxin Output
  description: In three-week greenhouse pot assays with R. solani AG8-inoculated soil, SynCom 7 (C7) significantly reduced
    wheat (cv. Alpowa) root rot score (Fig. 2C) and increased wheat fresh root weight compared with controls (Supplementary
    Fig. 1), and produced 10.87 +- 2.54 ug/mL auxin in Salkowski colorimetric assays (Table 3). Because overall SynComs did
    not outperform the best single strains and post-inoculation soil persistence was not measured, plate inhibition and auxin
    production are not linked by directed downstream causal edges to greenhouse disease suppression.
