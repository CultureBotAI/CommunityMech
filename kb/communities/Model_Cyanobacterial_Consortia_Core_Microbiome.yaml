id: CommunityMech:000214
name: Model Cyanobacterial Consortia Core Microbiome
description: >
  A laboratory framework of 108 stable cyanobacteria-heterotroph consortia
  generated by coculturing five well-characterized model cyanobacterial strains
  with microorganisms filtered from three distinct freshwater sources.
  Metagenomic analysis across the 108 consortia identified a 25-species
  noncyanobacterial core microbiome that recurred independently of cyanobacterial
  host species or inoculum source, with statistically supported core functions
  in micronutrient biosynthesis, metabolite transport, and anoxygenic
  photosynthesis, and a significant enrichment of plasmids in core species
  suggesting plasmid-mediated symbiotic roles.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Identify a reproducible core noncyanobacterial microbiome that
    assembles around model cyanobacterial hosts and characterize its shared
    functional repertoire.
  assembly_strategy: Coculture five well-characterized model cyanobacterial
    strains with microbial communities filtered from three distinct freshwater
    sources to generate 108 replicated stable consortia.
  perturbation_design: Vary cyanobacterial host species and freshwater inoculum
    source to test whether the recruited core microbiome is host- or
    inoculum-dependent.
  measurement_endpoints:
  - Identity and recurrence of core noncyanobacterial taxa
  - Core functional categories (micronutrient biosynthesis, metabolite transport,
    anoxygenic photosynthesis)
  - Plasmid content and plasmid-encoded functions in core species
  - Reproducibility of consortium composition across host and inoculum variation
  evidence:
  - reference: PMID:40626910
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: coculturing five well-characterized model cyanobacterial strains with
      microorganisms filtered from three distinct freshwater sources, generating
      108 stable consortia
    explanation: Supports the experimental design and number of replicated consortia.
  - reference: PMID:40626910
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: forming a 25-species core microbiome
    explanation: Supports the recurrent 25-species core noncyanobacterial microbiome.
