    explanation: Preserves the reported positive H2-mediated partnership; the full paper bounds the requirement
      using inhibition and an alternative hydrogen-consuming partner.
- name: Methanoculleus Hydrogenotrophic Methanogenesis
  description: Methanoculleus consumes H2 and produces methane, providing the hydrogen sink for Phox-21 in the methanogenic
    enrichment. Phosphite oxidation and methane production were approximately stoichiometric; isotope and isolate-substrate
    tests support H2/CO2-derived rather than acetate-derived methane. Low H2 enables the proposed intracellular
    energy-conserving pathway, not an otherwise endergonic net phosphite-oxidation reaction. The syntrophic pair
    is embedded in an enrichment, not a demonstrated two-member pure culture.
