id: CommunityMech:000290
name: Phosphitivorax-Methanoculleus Lithosyntrophic Phosphite-Oxidizing Methanogenic Culture
description: An anoxic, methanogenic enrichment culture defining "lithosyntrophy," an obligate
  syntrophic interaction in which the electrons driving hydrogenotrophic methanogenesis originate
  from an inorganic compound. Candidatus Phosphitivorax anaerolimi Phox-21 oxidizes phosphite
  (oxidation state +3) to phosphate coupled to hydrogenogenesis, in an obligate energetic dependency
  on a hydrogenotrophic methanogen, Methanoculleus sp. Electrons derived from phosphite drive H2
  production via an electron-confurcating hydrogenase; the methanogen consumes the H2 to keep the
  reaction thermodynamically favorable, establishing interspecies electron transfer that links the
  phosphorus and carbon redox cycles in anoxic ecosystems.
