ecological_interactions:
- name: Lithosyntrophic interspecies H2 transfer
  description: Obligate syntrophy in which phosphite-derived electrons drive H2 production in Phox-21
    via an electron-confurcating hydrogenase; the hydrogenotrophic methanogen Methanoculleus sp.
    consumes the H2, keeping phosphite oxidation thermodynamically favorable. This "lithosyntrophy"
    sources the reducing equivalents for methanogenesis from an inorganic compound rather than
    canonical organic substrates.
