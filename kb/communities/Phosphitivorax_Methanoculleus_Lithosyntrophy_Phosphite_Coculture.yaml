    snippet: Candidatus Phosphitivorax anaerolimi Phox-21 oxidizes phosphite (HPO32-, oxidation state +3) to phosphate
      coupled to hydrogenogenesis in an obligate energetic dependency on a hydrogenotrophic methanogen, Methanoculleus
