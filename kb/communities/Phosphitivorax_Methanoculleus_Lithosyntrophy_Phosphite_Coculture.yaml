- name: Lithosyntrophic interspecies H2 transfer
  description: Phox-21 supplies phosphite-derived reducing equivalents to Methanoculleus as H2. Methanogenic phosphite
    oxidation was inhibited by BES and by excess H2; growth and oxidation were restored with hydrogenotrophic sulfate
    reducer G11 in BES. These experiments support a required low-H2 sink under tested conditions, not universal
    dependence on this exact methanogen. Net chemical phosphite oxidation remains exergonic; the proposed H2-sensitive
    bottleneck concerns intracellular electron transfer and energy conservation.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
