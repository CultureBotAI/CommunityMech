id: CommunityMech:000302
name: SynCom MetG2 Rhizobacteria Sugarcane Stress Resilience
description: A rhizobacteria synthetic community (SynCom) named MetG2 inoculated onto sugarcane in a
  greenhouse experiment to enhance stress resilience through targeted modulation of plant-microbe
  interactions. Shotgun metagenome and metatranscriptome sequencing revealed temporal shifts in the
  rhizosphere microbial community, with up-regulation of genes for flagellar assembly, chemotaxis,
  quorum sensing, and biofilm formation (particularly within Proteobacteria), indicating active
  microbial movement toward root surfaces, alongside enrichment of genes for nutrient acquisition,
  hormone synthesis, siderophore production, and VOC synthesis. Sugarcane responded with up-regulation
  of hormone-related and nutrient-transporter genes and induction of stress-resistance genes,
  supporting MetG2 as a sustainable strategy to enhance crop productivity and resilience.
