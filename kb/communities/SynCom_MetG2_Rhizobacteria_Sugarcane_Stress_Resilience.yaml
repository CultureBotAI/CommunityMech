  rationale: The indexed publisher Introduction and experimental-design preview name four MetG2 strains,
    unlike the record's broad responding-phylum wrapper. The previews disagree between Chiliseed2 and
    Chileseed2; their equivalence remains unverified. These are membership leads, not newly accepted strain
    identities. The unsupported species-level sugarcane grounding has been replaced by an explicit Saccharum
    parent-rank anchor, but the experimental host species/cultivar and inoculant roster still require
    source verification under issue1847; the record remains needs_research. The host-response participant
    now names only the plant, and the colonization-expression participant names the documented responding
    phylum, not the host or the defined inoculant. Preserve the proposed functional contribution without
    treating co-occurring expression, gene enrichment and host response as a demonstrated causal sequence.
