ecological_interactions:
- name: Rhizosphere colonization-associated gene expression
  description: After MetG2 inoculation, the rhizosphere showed increased expression of flagellar assembly, chemotaxis,
    quorum-sensing and biofilm-associated genes, particularly within Proteobacteria. The authors interpret this
    as movement toward roots; the reviewed evidence is molecular, not direct tracking of cells or proof that one
    organism facilitates another's colonization. Responding native rhizosphere taxa must not be equated with the
    defined MetG2 inoculant.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: bacterial-type flagellum assembly
    term:
      id: GO:0044780
      label: bacterial-type flagellum assembly
  - preferred_term: chemotaxis
    term:
      id: GO:0006935
      label: chemotaxis
  - preferred_term: quorum sensing
    term:
      id: GO:0009372
      label: quorum sensing
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: doi:10.1016/j.rhisph.2025.101142
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: an up-regulation of genes related to flagellar assembly, chemotaxis, quorum sensing, and biofilm formation,
      particularly within Proteobacteria, indicating active microbial movement toward root surfaces
    explanation: Supports gene upregulation and the authors colonization interpretation; it does not directly observe
      root movement or establish facilitation.
- name: Rhizosphere enrichment of plant-associated functional genes
  description: Rhizosphere genes associated with nutrient acquisition, hormone synthesis, siderophore production
    and VOC synthesis were enriched after MetG2 inoculation. The source interprets these changes as potentially
    beneficial microbial activities. Gene enrichment is not direct measurement of secreted products, transfer to
    the host or reciprocal fitness, and is not assigned exclusively to the inoculated strains or to one responding
    phylum.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Sugarcane hormone and nutrient-transporter response
    description: 'HYPOTHESIZED/PARTIAL: the enriched microbial functions are proposed to contribute to the host
      transcriptional response in the MetG2-associated plant-microbe system. The reviewed omics evidence does not
      identify a transferred causal signal, establish that gene enrichment precedes the host response, or isolate
      mediation by the inoculant from the native rhizosphere community.'
  evidence:
  - reference: doi:10.1016/j.rhisph.2025.101142
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: genes associated with nutrient acquisition, hormone synthesis, siderophore production, and volatile
      organic compound (VOC) synthesis were enriched, suggesting stimulated beneficial microbial activities
    explanation: Supports functional gene enrichment and its proposed beneficial interpretation, not demonstrated
      mutualism or metabolite transfer.
- name: Sugarcane hormone and nutrient-transporter response
  description: Sugarcane showed increased expression of hormone-related and nutrient-transporter genes after MetG2
    inoculation, together with stress-response transcription. These are positive molecular responses, not by themselves
    a quantified stress-tolerance phenotype or reciprocal microbial benefit. The canonical Saccharum officinarum
    grounding and inoculant membership require separate identity resolution; this observation is stated at the source's
    sugarcane level.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.1016/j.rhisph.2025.101142
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Sugarcane plants also exhibited dynamic responses, including the up-regulation of hormone-related genes
      (auxin, cytokinin, salicylic acid) and nutrient transporter genes
    explanation: Supports the sugarcane hormone and nutrient-transporter gene response after MetG2 inoculation.
  - reference: doi:10.1016/j.rhisph.2025.101142
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Stress resistance genes such as trehalose 6-phosphate phosphatase, phenylalanine ammonia-lyase, expansin,
