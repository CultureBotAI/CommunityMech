- name: Sugarcane hormone and nutrient-transporter response
  description: Sugarcane showed increased expression of hormone-related and nutrient-transporter genes
    after MetG2 inoculation, together with stress-response transcription. These are positive molecular
    responses, not by themselves a quantified stress-tolerance phenotype or reciprocal microbial benefit.
    The named participant is the study host at a parent-only Saccharum anchor; species and cultivar remain
    unverified. This is not transcription by the bacterial inoculant or a response demonstrated across
    the genus.
  scope: COMMUNITY_LEVEL
