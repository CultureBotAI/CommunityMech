    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Exometabolite uptake pattern points to a key role for ecological resource partitioning in the assembly marine bacterial communities transforming recent photosynthate.
    explanation: Supports the ecological framing of diatom exometabolites as recent photosynthate used by marine bacteria.
