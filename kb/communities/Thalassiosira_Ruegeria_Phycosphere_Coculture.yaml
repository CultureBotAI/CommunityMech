id: CommunityMech:000162
name: Thalassiosira-Ruegeria Phycosphere Coculture
description: >
  A defined two-member marine phytoplankton-bacterium model community composed of the diatom
  Thalassiosira pseudonana CCMP1335 and the heterotrophic roseobacter Ruegeria pomeroyi DSS-3.
  The coculture is used to study bacterial recognition by a diatom, phytoplankton-derived metabolite
  transfer, and bacterial use of recent photosynthate in a controlled marine algal medium.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Build a tractable two-member marine phycosphere model for testing diatom-bacterium
    recognition and exchange of phytoplankton-derived metabolites.
  assembly_strategy: Grow axenic T. pseudonana CCMP1335 in organic carbon-free L1 +Si medium, then
    inoculate washed R. pomeroyi DSS-3 cells into the diatom culture for pairwise coculture assays.
  perturbation_design: Compare axenic diatom cultures, bacterial monoculture controls, and pairwise
    T. pseudonana plus R. pomeroyi cocultures with transcriptomic and metabolomic measurements.
  measurement_endpoints:
  - diatom differential gene expression
  - intracellular metabolite changes
  - bacterial transporter and catabolic gene expression
  - exometabolite uptake by mass spectrometry
  - public RNA-seq and metabolomics datasets
  evidence:
  - reference: PMID:28631440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterium Ruegeria pomeroyi DSS-3 triggered differential expression of >80 genes in diatom Thalassiosira pseudonana CCMP1335
    explanation: Supports the two-member model-system design and the diatom response endpoint.
  - reference: PMID:33097854
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pairwise co-culture systems were established with the diatom Thalassiosira pseudonana as the sole source of substrates for Ruegeria pomeroyi DSS-3
    explanation: Supports the pairwise coculture design and the role of the diatom as the substrate source.
