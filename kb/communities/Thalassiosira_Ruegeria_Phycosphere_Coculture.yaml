discussions:
- discussion_id: ruegeria-recognition-mediation-and-b12-extension
  prompt: Which signaling steps mediate the transcript response, and how should B12-dependent growth support be
    represented separately?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'The 2017 PDF Figure 1 and Results support rescue of B12-limited diatom growth; that reciprocal interaction
    is missing from the current graph. Edison dry run completed, but the authorized real invocation stopped before
    submission because the configured key loader returned no key. New topology remains #1883, not silently replaced
    by the chitin response. Two existing arrows were removed because co-occurring transcript changes and shared
    substrate names do not establish those directions. Receptor/cue identity and causal mediation require further
    evidence; assay-metadata reconciliation is #1885.'
  attaches_to:
  - ecological_interactions#Putative Diatom Recognition Response to Ruegeria
