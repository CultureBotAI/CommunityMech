ecological_interactions:
- name: Putative Diatom Recognition Response to Ruegeria
  description: In the 2017 B12-limited coculture experiment, T. pseudonana CCMP1335 differentially expressed genes
    with annotations consistent with recognition and signaling in response to R. pomeroyi DSS-3. The proposed plant-like
    cascade is inferred from homology and transcript patterns, not selectively demonstrated. Little attachment was
    observed during exponential growth. This is a directed diatom response to bacterial presence, not a measured
    colonization benefit or proof that recognition causes the separate chitin/lipid transcriptional response.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ruegeria pomeroyi DSS-3
    term:
      id: NCBITaxon:246200
      label: Ruegeria pomeroyi DSS-3
  target_taxon:
    preferred_term: Thalassiosira pseudonana CCMP1335
    term:
      id: NCBITaxon:296543
      label: Thalassiosira pseudonana CCMP1335
  biological_processes:
  - preferred_term: cell communication
    term:
      id: GO:0007154
      label: cell communication
    notes: Putative communication inferred from transcription and annotation; the chemical cue and pathway mediation
      are unresolved.
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:28631440
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterium Ruegeria pomeroyi DSS-3 triggered differential expression of >80 genes in diatom Thalassiosira
      pseudonana CCMP1335
    explanation: Supports differential transcription; recognition-pathway function is a hypothesis, not a colonization
      or mediation assay.
- name: Phytoplankton Metabolite Transfer to Ruegeria
  description: 'Diatom-derived organic compounds support R. pomeroyi growth when the diatom is the only organic-carbon
    source. Individual substrate assignments have different evidence strengths: in the 2020 R. pomeroyi column of
    Table 1, DMSP and N-acetyl-D-glucosamine are supported by gene expression, whereas proline and guanosine have
    net exometabolite-drawdown evidence. These are three separate bacterial pair cultures, not a mixed three-bacterium
    competition experiment. Neither transcript induction nor net concentration changes alone trace a compound-specific
    transfer flux or demonstrate that bacterial consumption causes the diatom chitin response.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Thalassiosira pseudonana CCMP1335
    term:
      id: NCBITaxon:296543
      label: Thalassiosira pseudonana CCMP1335
  target_taxon:
    preferred_term: Ruegeria pomeroyi DSS-3
    term:
      id: NCBITaxon:246200
      label: Ruegeria pomeroyi DSS-3
  metabolites:
  - preferred_term: dimethylsulfoniopropionate
    term:
      id: CHEBI:16457
      label: S,S-dimethyl-beta-propiothetin
    notes: Gene-expression inference (G; functionally verified genes for DMSP) in the R. pomeroyi pair in 2020 Table
      1; candidate uptake, not an individually traced transfer flux.
  - preferred_term: N-acetyl-D-glucosamine
    term:
      id: CHEBI:506227
      label: N-acetyl-D-glucosamine
    notes: Gene-expression inference (G) in the R. pomeroyi pair in 2020 Table 1; candidate uptake, not an individually
      traced transfer flux.
  - preferred_term: proline
    term:
      id: CHEBI:26271
      label: proline
    notes: Net metabolite drawdown (M) in the R. pomeroyi pair in 2020 Table 1; candidate uptake, not an individually
      traced transfer flux.
  - preferred_term: guanosine
    term:
      id: CHEBI:16750
      label: guanosine
    notes: Net metabolite drawdown (M) in the R. pomeroyi pair in 2020 Table 1; candidate uptake, not an individually
      traced transfer flux.
