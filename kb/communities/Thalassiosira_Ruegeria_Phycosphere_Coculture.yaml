- name: Diatom Chitin and Lipid Response During Coculture
  description: 'In the 2017 study, cocultured diatoms downregulated lipid biosynthesis and upregulated chitin metabolism
    genes relative to B12-replete axenic controls. These are measured transcriptional changes, not demonstrated
    Ruegeria-to-diatom substrate feeding, polymer production fluxes or selectively established outputs of a recognition
    cascade. The bacterium also supported B12-limited diatom growth, a distinct relationship missing from the present
    topology and tracked in #1883; it must not be inferred from this chitin/lipid node. The later L1 substrate-partitioning
    assay does not negate the earlier B12-limited benefit.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Ruegeria pomeroyi DSS-3
    term:
      id: NCBITaxon:246200
      label: Ruegeria pomeroyi DSS-3
  target_taxon:
    preferred_term: Thalassiosira pseudonana CCMP1335
    term:
      id: NCBITaxon:296543
      label: Thalassiosira pseudonana CCMP1335
