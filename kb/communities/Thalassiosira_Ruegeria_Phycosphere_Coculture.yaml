    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Co-cultured diatoms also downregulated lipid biosynthesis genes and upregulated chitin metabolism genes.
    explanation: Supports diatom metabolic reprogramming during coculture with the bacterial partner.
