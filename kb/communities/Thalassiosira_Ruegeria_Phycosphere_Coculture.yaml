environmental_factors:
- name: organic carbon-free L1 +Si medium
  value: L1 +Si medium without added organic carbon
  description: Axenic diatoms were grown in organic carbon-free L1 +Si medium before bacterial inoculation,
    making diatom-derived compounds the relevant organic substrate source for R. pomeroyi in coculture.
  evidence:
  - reference: PMID:33097854
