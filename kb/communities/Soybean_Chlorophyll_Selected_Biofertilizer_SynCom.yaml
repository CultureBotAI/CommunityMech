id: CommunityMech:000129
name: Soybean Chlorophyll-Selected Biofertilizer SynCom
description: A plant-guided soybean rhizosphere SynCom selected through iterative chlorophyll-based microbiome
  engineering to improve nodulation and biomass in soil.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Develop a multi-member soybean biofertilizer SynCom using host-mediated microbiome engineering.
  assembly_strategy: A starting consortium of Bradyrhizobium spp. and non-rhizobial soil isolates was
    recurrently selected using leaf chlorophyll content.
  perturbation_design: Eight consecutive gnotobiotic selection rounds were followed by evaluation in non-sterile
    soil.
  measurement_endpoints:
  - leaf chlorophyll content
  - rhizosphere community composition
  - nodule number
  - plant biomass
  - nitrogen transformation potential
  evidence:
  - &id001
    reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a synthetic microbial community (SynCom) was developed through a host-mediated microbiome
      engineering approach guided by leaf chlorophyll content as a rapid, non-destructive plant trait.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: soybean rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Soybean-associated rhizosphere community selected under gnotobiotic and non-sterile soil conditions.
taxonomy:
- taxon_term:
    preferred_term: soybean rhizosphere bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
    gtdb_grounding_status: UNRESOLVED
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
- taxon_term:
    preferred_term: Bradyrhizobium
    term:
      id: NCBITaxon:374
      label: Bradyrhizobium
    gtdb_grounding_status: GROUNDED
    gtdb_classification:
      gtdb_id: GTDB:g__Bradyrhizobium
      gtdb_taxon: Bradyrhizobium
      gtdb_lineage: d__Bacteria;p__Pseudomonadota;c__Alphaproteobacteria;o__Rhizobiales;f__Xanthobacteraceae;g__Bradyrhizobium
      ncbi_source_id: NCBITaxon:374
      majority_fraction: 0.995
      support_genomes: 592
      total_genomes: 595
      is_reclassified: false
      mapping_source: kg-microbe NCBI2GTDB.tsv.gz; GTDB release latest (built 2026-07-25) [grounded at g__ rank; 3 GTDB taxa under the NCBI taxon]
  functional_role:
  - PRIMARY_PRODUCER
  evidence:
  - *id001
ecological_interactions:
- name: Plant-Guided Beneficial Rhizosphere Assembly
  description: Recurrent host-mediated selection favored nodulating Bradyrhizobium and associated beneficial
    rhizosphere taxa.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: chlorophyll-guided recurrent selection
  value: Rhizosphere communities from superior soybean performers were pooled and propagated across selection
    rounds.
  description: Eight consecutive gnotobiotic selection rounds were followed by evaluation in non-sterile
    soil.
  evidence:
  - *id001
related_ingredients:
- preferred_term: indole-3-acetic acid
  chebi_term:
    id: CHEBI:16411
    label: indole-3-acetic acid
  relevance: Screened PGPR trait — IAA production by each candidate isolate was quantified by HPLC
    and used (alongside siderophore production and phosphate solubilization) to characterize PGPR
    activity in the plant-guided selection rounds underlying the soybean biofertilizer SynCom.
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: IAA production was evaluated in G2MY broth supernatants by high-performance liquid
      chromatography using purified IAA (Sigma-Aldrich, Buenos Aires, Argentina) as a standard
    explanation: Names IAA as the HPLC-quantified plant-growth-promoting trait of the candidate
      SynCom members.
- preferred_term: siderophore
  chebi_term:
    id: CHEBI:26672
    label: siderophore
  relevance: Second screened PGPR trait — siderophore production was scored in CAS-agar plate assays
    for each isolate. Iron-scavenging supports plant Fe nutrition and is one of the PGPR axes the
    plant-guided selection acted on.
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolates were evaluated for known PGPR properties in plate assays for phosphate
      solubilization in NBRIP agar and siderophore production in CAS agar
    explanation: Names siderophore production as one of the assayed PGPR traits underlying SynCom
      selection.
growth_media:
- name: G2MY (rhizosphere propagation); YMA/TSA/SDA (isolate maintenance)
  temperature_range: '28-37'
  temperature_unit: °C
  preparation_notes: Soil isolates plated on YMA, TSA and SDA and incubated at 28°C and 37°C; the
    rhizosphere microbiota was propagated in G2MY liquid medium for reinoculation. Soybean plants were
    grown in a greenhouse with 30-day selection cycles under gnotobiotic conditions.
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SDA (Oxoid, Dardilly, France) and incubated at 28°C and 37°C
    explanation: Media (YMA/TSA/SDA) and incubation temperatures for isolate cultivation.
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the rhizosphere microbiota was grown in G2MY
    explanation: G2MY medium used to propagate the rhizosphere microbiota for reinoculation.
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: After 30 days in the greenhouse, the rhizosphere and nodules were recovered
    explanation: 30-day greenhouse cycle for the plant-associated selection rounds.
