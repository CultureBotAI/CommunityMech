ecological_interactions:
- name: Nodule-Associated Bradyrhizobium Genotype Pattern
  description: Nodule-isolate fingerprints and marker evidence were consistent with B. diazoefficiens-like genotypes
    during recurrent selection. The source interprets this pattern as selection but also notes an early pattern
    before selection and unresolved pressures. This observation does not establish reciprocal fitness benefits,
    quantify nitrogen-fixation flux or isolate the genotype pattern as the cause of later plant phenotypes.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bradyrhizobium
    term:
      id: NCBITaxon:374
      label: Bradyrhizobium
  biological_processes:
  - preferred_term: nodulation
    term:
      id: GO:0009877
      label: nodulation
  evidence:
  - reference: PMID:42007760
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Taken together, these results suggest that selective pressures during recurrent selection of plants
      with high leaf chlorophyll contents favored B. diazoefficiens genotypes within the nodulating population.
    explanation: Preserves the authors' inference qualifier and the nodule-population scope; does not identify the
      causal selection pressure.
- name: Rhizosphere Community Composition Across Selection Rounds
  description: Rhizosphere profiles shifted from initial Bacillus-related dominance toward greater relative representation
    of Pseudomonadales, Burkholderiales and Sphingomonadales and reduced Rhizobiales representation. This is community-composition
    evidence, not demonstrated niche partitioning, microbial cooperation or IAA/siderophore-mediated succession.
    Co-occurrence and inferred functions do not establish those mechanisms.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: increased representation of Pseudomonadales, Burkholderiales, and Sphingomonadales at the expense of
      Rhizobiales
    explanation: Supports the relative-abundance pattern across selection rounds, not an isolated competition or
      facilitation mechanism.
- name: HR6 Nonsterile-Soil Plant Phenotypes
  description: In non-sterile-soil pots, the Results report higher HR6+HN6 nodule number, total nodule dry weight
    and shoot dry weight. Table 1 gives higher means but shared significance letters with both the uninoculated
    and E109 controls for these three endpoints; this is not uniformly significant superiority over both controls.
    Chlorophyll content did not differ among treatments. These are host phenotypes, not field deployment, direct
    nitrogen-fixation flux, reciprocal microbial fitness benefits or proof that a selected genotype caused the response.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: nodulation
    term:
      id: GO:0009877
      label: nodulation
  evidence:
  - reference: PMID:42007760
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: HR6 promoted higher nodule number, nodule dry weight, and shoot dry weight
    explanation: Retains the Results wording; Table 1 shared significance groups limit any stronger comparator claim
      for nodule number, total nodule dry weight and shoot dry weight.
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynComs HR6 and HR8 were evaluated in pots filled with non-sterile soil from the UNLP experimental
      field at Los Hornos
    explanation: Supports a pot experiment using field-derived non-sterile soil, not an in-field deployment.
environmental_factors:
- name: chlorophyll-guided recurrent selection
  value: Rhizosphere communities from superior soybean performers were pooled and propagated across selection
    rounds.
  description: Eight consecutive gnotobiotic selection rounds were followed by evaluation in non-sterile
    soil.
  evidence:
  - *id001
related_ingredients:
- preferred_term: indole-3-acetic acid
  chebi_term:
    id: CHEBI:16411
    label: indole-3-acetic acid
  relevance: Screened PGPR trait — IAA production by each candidate isolate was quantified by HPLC
    and used (alongside siderophore production and phosphate solubilization) to characterize PGPR
    activity in the plant-guided selection rounds underlying the soybean biofertilizer SynCom.
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: IAA production was evaluated in G2MY broth supernatants by high-performance liquid
      chromatography using purified IAA (Sigma-Aldrich, Buenos Aires, Argentina) as a standard
    explanation: Names IAA as the HPLC-quantified plant-growth-promoting trait of the candidate
      SynCom members.
- preferred_term: siderophore
  chebi_term:
    id: CHEBI:26672
    label: siderophore
  relevance: Second screened PGPR trait — siderophore production was scored in CAS-agar plate assays
    for each isolate. Iron-scavenging supports plant Fe nutrition and is one of the PGPR axes the
    plant-guided selection acted on.
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Isolates were evaluated for known PGPR properties in plate assays for phosphate
      solubilization in NBRIP agar ( 59 ) and siderophore production in CAS agar ( 60 )
    explanation: Names siderophore production as one of the assayed PGPR traits underlying SynCom
      selection.
growth_media:
- name: G2MY (rhizosphere propagation); YMA/TSA/SDA (isolate maintenance)
  temperature_range: '28-37'
  temperature_unit: °C
  preparation_notes: Soil isolates plated on YMA, TSA and SDA and incubated at 28°C and 37°C; the
    rhizosphere microbiota was propagated in G2MY liquid medium for reinoculation. Soybean plants were
    grown in a greenhouse with 30-day selection cycles under gnotobiotic conditions.
  evidence:
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SDA (Oxoid, Dardilly, France) and incubated at 28°C and 37°C
    explanation: Media (YMA/TSA/SDA) and incubation temperatures for isolate cultivation.
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the rhizosphere microbiota was grown in G2MY
    explanation: G2MY medium used to propagate the rhizosphere microbiota for reinoculation.
  - reference: PMID:42007760
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: After 30 days in the greenhouse, the rhizosphere and nodules were recovered
    explanation: 30-day greenhouse cycle for the plant-associated selection rounds.
