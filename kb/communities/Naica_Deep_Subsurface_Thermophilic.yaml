- name: Electron Donor Limitation Filters Sulfate Reduction
  description: The sulfate-rich Naica aquifer lacks evidence that sulfate
    reduction is a dominant terminal metabolism; dsrAB marker amplification was
    unsuccessful, appreciable hydrogen sulfide was not detected, and the paper
    argues that both organic matter and hydrogen are extremely low. This electron-donor limitation constrains
    sulfate reduction despite the aquifer's sulfate abundance.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  metabolites:
