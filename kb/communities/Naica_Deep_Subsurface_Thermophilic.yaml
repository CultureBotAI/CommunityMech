id: CommunityMech:000046
name: Naica Deep Subsurface Thermophilic Community
description: >
  Deep saline hydrothermal waters from the Naica Mine crystal cave system in Chihuahua, Mexico. The
  assayed water samples were collected from the deepest accessible mineshafts, at approximately 700-760 m,
  and yielded a low-diversity prokaryotic community that included basal Thaumarchaeota, Thermoplasmatales-
  affiliated Euryarchaeota, Candidate Division OP3, Firmicutes, and Alpha/Beta-proteobacteria. Archaeal
  ammonia monooxygenase genes supported nitrification by thermophilic chemolithoautotrophic Thaumarchaeota,
  while unsuccessful sulfate-reducer marker amplification and low electron-donor availability argued
  against sulfate reduction as a dominant metabolism.
