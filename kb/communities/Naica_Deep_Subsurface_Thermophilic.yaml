- name: Putative Electron-Donor Limitation of Sulfate Reduction
  description: PARTIAL - Failed dsrA amplification and reported lack of appreciable hydrogen sulfide led the authors
    to infer that sulfate reduction, if present, was not dominant in the sulfate-rich aquifer. They proposed low
    organic matter and hydrogen as an electron-donor constraint. Negative PCR is not pathway absence, and this explanation
    was not a donor-rescue experiment or demonstration of competition. Co-occurring AamoA detection does not establish
    a causal link to ammonia oxidation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: organic molecular entity
    term:
      id: CHEBI:50860
      label: organic molecular entity
  - preferred_term: hydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  biological_processes:
  - preferred_term: sulfate reduction
    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: doi:10.3389/fmicb.2013.00037
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We failed to amplify dsrA genes encoding the dissimilatory sulfite reductase
    explanation: Directly supports failed marker amplification, not absence of sulfate reducers or dominant-metabolism
      certainty.
  - reference: doi:10.3389/fmicb.2013.00037
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: At any rate, for sulfate reduction to occur, either organic matter or inorganic electron donors, typically
      H2, must be present to fuel the redox reaction. However, both appear to be extremely low in the aquifer
    explanation: Supports proposed donor scarcity; no isolated donor-limitation perturbation or competitive fitness
      effect is demonstrated.
