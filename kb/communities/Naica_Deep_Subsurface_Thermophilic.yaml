discussions:
- discussion_id: naica_gene_detection_and_donor_limitation
  prompt: Which observations distinguish activity and causal mediation from inferred potential?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-07'
  rationale: Distinguish high-GC thermophily inference and AamoA capacity from measured growth and metabolic rates.
    Low-biomass sampling, primer detection limits and contamination considerations bound negative and positive detections.
    The source presents sulfate reduction as not dominant if present; hydrogen-sulfide absence includes unpublished
    observations. Test donor rescue and oxidation rates before adding causal arrows among co-occurring environmental
    explanations. Canonical taxonomic groundings are retained; non-graph physiological metadata needs separate reconciliation.
  attaches_to:
  - ecological_interactions#Inferred Thermophily of Naica Archaeal and OP3 Lineages
  - ecological_interactions#Putative Thermophilic Archaeal Ammonia Oxidation
  - ecological_interactions#Putative Electron-Donor Limitation of Sulfate Reduction
