      label: dissimilatory sulfate reduction
  downstream:
  - target: Thermophilic Ammonia Oxidation
    description: Electron-donor scarcity constrained sulfate reduction in the same energy-limited aquifer
      where archaeal AamoA genes supported ammonia oxidation by Thaumarchaeota.
  evidence:
  - reference: doi:10.3389/fmicb.2013.00037
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We failed to amplify dsrA genes encoding the dissimilatory sulfite reductase, which further
      reinforces the idea that Naica-associated microbial communities do not
    explanation: Supports the lack of a dominant sulfate-reduction signal in the
      assayed Naica water samples.
  - reference: doi:10.3389/fmicb.2013.00037
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: At any rate, for sulfate reduction to occur, either organic matter or inorganic electron
      donors, typically H2, must be present to fuel the redox reaction. However, both appear
      to be extremely low in the aquifer
    explanation: Supports electron-donor limitation as the reason sulfate
      reduction is not a dominant terminal metabolism.
