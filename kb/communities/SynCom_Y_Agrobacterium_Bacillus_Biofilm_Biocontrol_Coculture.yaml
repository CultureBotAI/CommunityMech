growth_media:
- name: LBGM
  temperature: '30'
  temperature_unit: °C
  inoculum_size: '10'
  inoculum_unit: '% v/v'
  incubation_time: '24-72'
  incubation_time_unit: h
  vessel_type: 24-well plate
  preparation_notes: Biofilm formation assay. Strains precultured in TSB overnight at 25 °C with
    shaking at 150 rpm, OD600 adjusted to 0.8, then inoculated at 10% (v/v) into 2 mL LBGM medium
    per well. Single-species suspensions added directly to 24-well plates; mixed-species biofilms
    mixed in equal volumes before plating. Incubated statically at 30 °C and sampled at 24, 48,
    and 72 h.
  evidence:
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Subsequently, they were inoculated at 10% ( v / v ) into 2 mL of LBGM medium. For
      single-species biofilms, the bacterial suspension was directly introduced into 24-well plates.'
    explanation: Biofilm medium (LBGM), inoculum size (10% v/v), and vessel (24-well plate).
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Samples were incubated statically at 30 °C for 24, 48, and 72 h to compare the
      biofilm-forming capacities
    explanation: Static incubation at 30 °C; biofilm sampled at 24, 48, and 72 h.
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Glycerol-preserved strains were inoculated into TSB and cultured overnight at 25 °C
      with shaking at 150 rpm.
    explanation: Preculture conditions (TSB, overnight, 25 °C, 150 rpm) prior to biofilm inoculation.
