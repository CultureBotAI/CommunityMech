discussions:
- discussion_id: syncom-y-growth-versus-transfer-and-biocontrol
  prompt: Which predicted exchanges mediate biofilm synergy and the pot-level biocontrol outcome?
  rationale: Preserve reciprocal biofilm-associated abundance, EPS, metabolic activity, FA tolerance and disease
    suppression. Forward additions are positive; tested reverse additions did not significantly enhance LSQ16 biofilm.
    Neither result directly measures interspecies transfer. The primary discussion explicitly leaves rhizosphere
    synergy unverified. Modeling methods name CarveMe, Cobra toolbox and FBA but do not state versions or genome
    input accessions; the cited SRA range belongs to RNA-seq. Main text and captions were read, not separate supplementary
    data or raw datasets.
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  attaches_to:
  - ecological_interactions#Synergistic biofilm and EPS formation in co-culture
  - ecological_interactions#SynCom Y Fusaric Acid and Wilt Resistance
  - ecological_interactions#Predicted cross-feeding from A. deltaense LSQ16 to B. velezensis WB
  - ecological_interactions#Predicted metabolite return from B. velezensis WB to A. deltaense LSQ16
  evidence:
  - reference: PMID:42125264
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Whether the two strains form a synergistic relationship in the rhizosphere still requires validation
      via root colonization assays.
    explanation: Explicit limitation separating in-vitro biofilm findings from rhizosphere mechanism.
