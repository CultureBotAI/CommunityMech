id: CommunityMech:000272
name: SynCom Y Agrobacterium-Bacillus Biofilm Biocontrol Co-culture
description: Two-species synthetic bacterial community (SynCom Y) of Agrobacterium deltaense LSQ16 and
  Bacillus velezensis WB, simplified from a larger biocontrol SynCom Q by stepwise strain omission.
  Co-cultivation synergistically enhances multispecies biofilm formation, extracellular polysaccharide
  production, and metabolic activity, improving suppression of watermelon Fusarium wilt. Genome-scale
  modeling predicts interspecies metabolite exchange (amino acids, purines, phosphates); exogenous
  L-ornithine and guanine enhance B. velezensis biofilm formation, consistent with cross-feeding-supported
  cooperation.
