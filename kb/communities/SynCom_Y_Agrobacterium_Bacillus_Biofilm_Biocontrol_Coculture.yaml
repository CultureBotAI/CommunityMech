    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Moreover, exogenous supplementation of l-ornithine and guanine further enhanced the biofilm-forming
      capacity of B. velezensis WB.
    explanation: Positive exogenous additions support biofilm responsiveness, not experimentally confirmed donation
      by LSQ16.
  - reference: PMID:42125264
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: A. deltaense LSQ16 may supply malate, O-acetylcarnitine, guanine, guanosine, l-ornithine, and phosphate
      to B. velezensis WB
    explanation: Explicit model-predicted forward direction; measured transfer is not established.
    computational_provenance:
      prediction_type: FLUX_BALANCE_ANALYSIS
