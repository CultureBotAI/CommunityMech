      simulated_medium: LBGM
      parameters: FBA assessed potential exchanges in LBGM; software versions are not specified in the reviewed
        methods. SRR33382738-SRR33382752 identifies RNA-seq, not verified genome inputs.
- name: Predicted metabolite return from B. velezensis WB to A. deltaense LSQ16
  description: 'HYPOTHESIZED/PARTIAL: models predict WB-to-LSQ16 return of L-serine, pyroglutamic acid, myristic
    acid and suberoylglycine. Metabolite abundance patterns are consistent with some predictions, but additions
    of tested reverse-direction candidates did not significantly enhance LSQ16 monoculture biofilm biomass. This
    negative endpoint does not prove that exchange is absent; it prevents describing a beneficial return flux as
    experimentally validated.'
