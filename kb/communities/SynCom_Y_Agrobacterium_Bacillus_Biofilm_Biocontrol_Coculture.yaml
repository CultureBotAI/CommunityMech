        role: prediction of exchangeable metabolites
      model_source: de-novo draft genome-scale metabolic models reconstructed from the two strain
        genomes (no published model identifier)
      input_accession: SRA:SRR33382738-SRR33382752
      simulated_medium: LBGM
      parameters: FBA to identify all potentially exchangeable metabolites in the two-species consortium;
        CarveMe version not reported in source.
