ecological_interactions:
- name: Synergistic biofilm and EPS formation in co-culture
  description: Co-cultivation of the two strains synergistically enhances multispecies biofilm
    formation, extracellular polysaccharide (EPS) production, and metabolic activity relative to
    monocultures (measured, emergent).
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Agrobacterium deltaense LSQ16
    term:
      id: NCBITaxon:1183412
      label: Agrobacterium deltae
  target_taxon:
    preferred_term: Bacillus velezensis WB
    term:
      id: NCBITaxon:492670
      label: Bacillus velezensis
  evidence:
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared with monocultures, co-cultivation also markedly increased extracellular
      polysaccharide production and metabolic activity.
    explanation: Measured emergent synergy (biofilm, EPS, metabolic activity) in co-culture vs monocultures.
    confidence_score: 0.9
- name: Predicted cross-feeding from A. deltaense LSQ16 to B. velezensis WB
  description: Genome-scale metabolic modeling predicts LSQ16 donates metabolites to WB (including
    L-ornithine, guanine, guanosine, malate, phosphate). Two predicted donations (L-ornithine,
    guanine) were experimentally confirmed to enhance WB biofilm; the remainder are model-only.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Agrobacterium deltaense LSQ16
    term:
      id: NCBITaxon:1183412
      label: Agrobacterium deltae
  target_taxon:
