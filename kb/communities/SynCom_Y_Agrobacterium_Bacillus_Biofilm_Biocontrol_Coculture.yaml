    term:
      id: CHEBI:26020
      label: phosphate
  evidence:
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, exogenous supplementation of l-ornithine and guanine further enhanced the
      biofilm-forming capacity of B. velezensis WB.
    explanation: Experimental validation that two predicted LSQ16->WB donations (L-ornithine, guanine)
      enhance WB biofilm formation.
    confidence_score: 0.9
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Predictive results indicated metabolite exchange between the two strains involved amino
      acids, purines, phosphates, and other compounds.
    explanation: Model-predicted (not measured) donations; guanosine, malate and phosphate are model-only.
    confidence_score: 0.4
    computational_provenance:
