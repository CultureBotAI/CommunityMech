ecological_interactions:
- name: Synergistic biofilm and EPS formation in co-culture
  description: Co-culture increased biofilm biomass, EPS and metabolic activity relative to monocultures. Species-specific
    qPCR also supported increased cell-equivalent abundance of both strains in the biofilm fraction, supporting
    reciprocal benefit in that assay. WB abundance did not increase in the planktonic fraction. This conditional
    biofilm mutualism is not proof of reciprocal metabolite delivery or of the same interaction operating on watermelon
    roots.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Agrobacterium deltaense LSQ16
    term:
      id: NCBITaxon:1183412
      label: Agrobacterium deltae
  target_taxon:
    preferred_term: Bacillus velezensis WB
    term:
      id: NCBITaxon:492670
      label: Bacillus velezensis
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: SynCom Y Fusaric Acid and Wilt Resistance
    description: 'HYPOTHESIZED/PARTIAL: enhanced EPS-rich biofilm formation could contribute to fusaric-acid tolerance
      and the positive pot-level biocontrol outcome. Separate in-vitro and pot comparisons do not isolate biofilm
      mediation or establish that the in-vitro partnership occurs in the rhizosphere.'
  evidence:
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared with monocultures, co-cultivation also markedly increased extracellular polysaccharide production
      and metabolic activity.
    explanation: Measured emergent synergy (biofilm, EPS, metabolic activity) in co-culture vs monocultures.
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Quantitative PCR under co-culture conditions confirmed that mixed-species biofilm formation promotes
      the growth of both strains
    explanation: Supports reciprocal biofilm-associated growth, distinct from merely observing more total community
      biomass.
- name: SynCom Y Fusaric Acid and Wilt Resistance
  description: The two-strain biofilm tolerated fusaric-acid exposure better than either monoculture in vitro. Separately,
    SynCom Y reduced watermelon wilt in pots, with reported disease incidence 18.33% and control efficacy 79.13%.
    Preserve both positive outcomes without equating biofilm tolerance with pathogen killing or asserting that EPS,
    a specific exchanged metabolite or root colonization was experimentally isolated as the cause of disease suppression.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: fusaric acid
    term:
      id: CHEBI:5199
      label: Fusaric acid
  evidence:
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The two-strain biofilm showed a notable biomass decrease at 17 μg/mL FA, indicating enhanced resistance
      to FA compared with single-species biofilms
    explanation: SynCom Y tolerated higher fusaric acid before biofilm biomass decreased than either single-species
      biofilm.
  - reference: PMID:42125264
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynCom Y, composed of A. deltaense LSQ16 and B. velezensis WB, exhibited a disease incidence of
      18.33% and a control efficacy of 79.13%
    explanation: Watermelon pot trials showed stronger Fusarium wilt control by SynCom Y than by single-strain treatments.
  participating_taxa:
