- name: Predicted cross-feeding from A. deltaense LSQ16 to B. velezensis WB
  description: 'HYPOTHESIZED/PARTIAL: genome-scale models predict LSQ16-to-WB exchange of several metabolites. Exogenous
    L-ornithine and guanine increased WB biofilm biomass, and co-culture metabolite abundances were consistent with
    the proposed direction. Supplementation demonstrates a physiological response, not direct donor-to-recipient
    transfer. Malate and guanosine were also included in supplementation tests; the reported positive validation
    centers on ornithine and guanine. Other predicted exchanges are not established measured fluxes.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Agrobacterium deltaense LSQ16
    term:
