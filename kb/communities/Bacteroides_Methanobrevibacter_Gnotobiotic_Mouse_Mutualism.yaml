    term:
      id: CHEBI:15740
      label: formate
    concentration: B. thetaiotaomicron-derived methanogenesis substrate
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    concentration: Product of M. smithii methanogenesis
  biological_processes:
  - preferred_term: methanogenesis
    term:
      id: GO:0015948
      label: methanogenesis
  evidence:
  - reference: PMID:16782812
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: B. thetaiotaomicron-derived formate is used by M. smithii for methanogenesis
    explanation: Supports formate transfer from the bacterial member to the archaeal methanogen.
- name: Methanogen-Directed Fructan Fermentation
  description: Methanobrevibacter smithii redirects B. thetaiotaomicron metabolism toward dietary fructan
    fermentation and acetate production, unlike the D. piger comparator.
  interaction_type: CROSS_FEEDING
  source_taxon:
    preferred_term: Methanobrevibacter smithii
    term:
      id: NCBITaxon:2173
      label: Methanobrevibacter smithii
  target_taxon:
    preferred_term: Bacteroides thetaiotaomicron
    term:
      id: NCBITaxon:818
      label: Bacteroides thetaiotaomicron
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    concentration: Product increased during B. thetaiotaomicron-M. smithii biassociation
  evidence:
  - reference: PMID:16782812
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: M. smithii directs B. thetaiotaomicron to focus on fermentation of dietary fructans to acetate
    explanation: Supports the methanogen-specific effect on bacterial fermentation output.
- name: Biassociation Enhances Colonization Density
  description: Cocolonization with M. smithii and B. thetaiotaomicron increased representation of both
    species in the distal intestines of gnotobiotic mice relative to monoassociated controls.
  interaction_type: MUTUALISM
  source_taxon:
    preferred_term: Methanobrevibacter smithii
