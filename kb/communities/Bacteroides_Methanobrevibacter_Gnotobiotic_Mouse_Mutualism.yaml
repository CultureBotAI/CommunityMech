growth_media:
- name: gnotobiotic mouse gut (autoclaved polysaccharide-rich chow diet)
  light_regime: 12-h light cycle (lights on at 0600 h)
  inoculum_size: '10^8'
  inoculum_unit: microbes per strain (single gavage)
  vessel_type: gnotobiotic isolator
  preparation_notes: NMRI/KI germ-free mice were housed in gnotobiotic isolators on a strict 12-h light
    cycle and fed a standard autoclaved polysaccharide-rich chow diet ad libitum; each mouse was colonized
    by a single gavage of 10^8 microbes per strain, with B. thetaiotaomicron harvested from overnight
    stationary-phase cultures, D. piger from 4-day cultures and M. smithii from serum bottles after a
    5-day incubation.
