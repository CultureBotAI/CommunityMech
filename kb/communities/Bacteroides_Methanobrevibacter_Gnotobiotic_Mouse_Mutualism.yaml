id: CommunityMech:000142
name: Bacteroides-Methanobrevibacter Gnotobiotic Mouse Mutualism
description: A defined host-associated gnotobiotic mouse community used to test archaeal-bacterial
  mutualism in the gut. Germ-free mice were colonized with Bacteroides thetaiotaomicron with or without
  Methanobrevibacter smithii or Desulfovibrio piger, revealing a specific interaction in which M. smithii
  redirects B. thetaiotaomicron toward dietary fructan fermentation to acetate while using B. thetaiotaomicron
  formate for methanogenesis.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Test how a prominent human gut methanogenic archaeon affects bacterial polysaccharide
    metabolism, microbial fitness, and host energy balance in gnotobiotic mice.
  assembly_strategy: Germ-free mice were colonized with Bacteroides thetaiotaomicron alone or in defined
    biassociation with Methanobrevibacter smithii or Desulfovibrio piger.
  measurement_endpoints:
  - quantitative PCR colonization density
  - Bacteroides thetaiotaomicron transcriptional profiling
  - cecal short-chain fatty acids
  - methanogenesis gene expression
  - host adiposity
  evidence:
  - &gnotobiotic_design
    reference: PMID:16782812
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: we colonized germ-free mice with Bacteroides thetaiotaomicron
    explanation: Supports the defined gnotobiotic mouse experimental design.
