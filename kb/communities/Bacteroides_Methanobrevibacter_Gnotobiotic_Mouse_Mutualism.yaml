ecological_interactions:
- name: Formate Transfer To Methanogenesis
  description: Bacteroides thetaiotaomicron produces formate that is consumed by Methanobrevibacter smithii
    for methanogenesis, creating an archaeal-bacterial cross-feeding interaction.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: Bacteroides thetaiotaomicron
    term:
