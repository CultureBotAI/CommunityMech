id: CommunityMech:000364
name: Sclerotinia Sclerotia 12-Strain Biocontrol SynCom
description: A twelve-strain bacterial synthetic community assembled from isolates recovered from Sclerotinia sclerotiorum
  sclerotia after 5 days in flooded non-autoclaved soil. The SynCom spans Caballeronia, Cupriavidus, Massilia, Paraburkholderia,
  Ralstonia and Trinickia isolates, was co-cultured with mature fungal sclerotia in 10 mL tubes, and was resolved spatiotemporally
  by a 10x Genomics Xenium panel targeting all twelve members. Sclerotia inoculated with the full SynCom reached 100% mortality
  by day 14, and the dropout design identified Trinickia sp. MC, proposed in the paper as Trinickia sclerotiorum sp. nov.
  type strain MC, as the apparent key bacterial contributor.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Assemble a twelve-strain synthetic community from enriched sclerotium-associated flooded-soil bacteria to test
    whether the 5-day Sclerotinia sclerotiorum sclerotium microbiome causally promotes sclerotia mortality.
  assembly_strategy: Isolate morphologically distinct colonies from 5-day SF sclerotia on Nutrient agar, 10% TSA, R2A and
    modified Pseudomonas cepacia azelaic acid tryptamine medium; Sanger-sequence full-length 16S rRNA genes; then select twelve
    strains matching 5-day enriched ASVs across six bacterial genera.
  inoculation_strategy: Harvest each member at OD600 0.5, dilute to 10⁶ CFU/mL in double-distilled water, and assemble the
    full SynCom from equal volumes of the twelve suspensions.
  perturbation_design: Co-culture ten mature S. sclerotiorum sclerotia with the full twelve-strain SynCom or 2^3 dropout designs
    removing Trinickia sp. MC, Massilia sp. R20 plus Massilia sp. TB221, or the other nine SynCom members, then score sclerotia
    survival over 1, 3, 5, 7 and 14 days.
  measurement_endpoints:
  - sclerotia mortality
  - 'four antagonistic phenotypes: mycelia inhibition, germination inhibition, sclerotia-derived mycelia inhibition, and mycophagy'
  - Xenium spatial signal density across five concentric sclerotium layers
  - Trinickia sp. MC whole-genome ANI and dDDH
  evidence:
  - &id001
    reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among these strains, 12 strains matching 9 enriched ASVs (>97.0% identity) based on the ANCOM-BC2 and DESeq2
      at 5-day were selected for SynCom assembly, including Caballeronia zhejiangensis N8 (ASV75), Cupriavidus sp. N4 (ASV113),
      Massilia sp. R20 (ASV249), Massilia sp. TB221 (ASV49), Massilia sp. RB201 (ASV249), Massilia sp. RB202 (ASV249), Paraburkholderia
      sp. I59 (ASV2), Paraburkholderia phenoliruptrix TB211 (ASV2), Paraburkholderia phymatum R7 (ASV51), Paraburkholderia
      sp. T17 (ASV178), Ralstonia sp. R4 (ASV55), and Trinickia sp. MC (ASV69)
    explanation: Names the complete twelve-strain bacterial SynCom and the enriched amplicon sequence variants represented
      by each strain.
  - &id004
    reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The full SynCom was composed of equal volume of 12 bacteria members (12 ×10⁶ CFU/mL)
    explanation: Supports equal-volume assembly of the full twelve-member inoculum.
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial suspensions of each SynCom member were harvested at OD₆₀₀ = 0.5 and adjusted to 10⁶ CFU/mL
      with ddH₂O
    explanation: Supports the density-normalized bacterial suspensions used to assemble the SynCom and dropout inocula.
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The panel comprises 28 specific bacterial padlock probes targeting the 16S rRNA, gyrB, recA, and lepA
      gene transcripts across 12 SynCom members
    explanation: Supports spatial profiling by a custom Xenium probe panel spanning all twelve SynCom members.
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The coordinates of these stratified zones were imported back into Xenium Explorer to extract the signal
      density (transcripts /mm²) for each target bacteria or fungal gene
    explanation: Supports Xenium signal-density measurements across stratified sclerotium zones.
