discussions:
- discussion_id: trinickia_mc_species_ncbitaxon_gap
  prompt: Has Trinickia sclerotiorum sp. nov. MC been assigned an NCBITaxon species identifier or stable strain genome assembly
    accession that should replace the current genus-level grounding?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Trinickia sclerotiorum sp. nov. MC
  rationale: The 2026 paper describes MC as a novel Trinickia species using core-gene phylogeny, ANI and dDDH, but the local
    NCBITaxon snapshot resolves Trinickia and not the proposed species name.
  evidence:
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: full_text
    snippet: These results indicate TsMC does not belong to any known Trinickia species and thus we describe this strain as
      a new species, Trinickia sclerotiorum sp. nov. type strain MC
    explanation: Supports the novel-species status that is not yet available as a species-level local NCBITaxon term.
  posed_by: codex
  posed_date: '2026-09-13'
- discussion_id: sclerotia_syncom_partial_abundance_coverage
  prompt: Which additional bacteria in the 5-day flooded-soil sclerotium microbiome account for the abundance not captured
    by the twelve-strain SynCom?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - engineering_design
  - ecological_interactions#Twelve-Strain SynCom Suppression of Sclerotinia Sclerotia
  rationale: The SynCom covered most of the 5-day SF microbiome at genus level but only 56.3% at species level, so the full
    flooded-soil sclerotium microbiome may include interaction complexity absent from the defined assembly.
  evidence:
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: full_text
    snippet: As our SynCom represents only 56.3% bacterial abundance of 5-day SF microbiome, higher level of the complexity
      in the bacteria-bacteria interaction may not be captured in this study
    explanation: Records the authors' caveat about the partial species-level coverage of the defined SynCom.
  posed_by: codex
  posed_date: '2026-09-13'
