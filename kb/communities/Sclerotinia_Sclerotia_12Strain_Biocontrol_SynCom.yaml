ecological_interactions:
- name: Twelve-Strain SynCom Suppression of Sclerotinia Sclerotia
  description: The full twelve-strain bacterial SynCom antagonizes mature Sclerotinia sclerotiorum sclerotia in static tube
    co-culture, increasing mortality after 1 day and reaching complete sclerotia mortality by 14 days.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Sclerotinia sclerotiorum
    term:
      id: NCBITaxon:5180
      label: Sclerotinia sclerotiorum
    gtdb_grounding_status: NO_GTDB_EQUIVALENT
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: When sclerotia were inoculated with the SynCom, sclerotia mortality was significantly increased after 1-day co-culture
      with the SynCom, gradually reaching 100.0% mortality by 14-day co-culture
    explanation: Supports full-SynCom causality for the sclerotium mortality phenotype.
- name: Trinickia MC Key Contribution to Sclerotia Mortality
  description: 'The dropout experiment identified Trinickia sp. MC as the dominant single contributor: removing MC reduced
    sclerotia mortality, and MC mono-inoculation alone accelerated sclerotia mortality.'
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Trinickia sclerotiorum sp. nov. MC
    term:
      id: NCBITaxon:2571160
      label: Trinickia
  target_taxon:
    preferred_term: Sclerotinia sclerotiorum
    term:
      id: NCBITaxon:5180
      label: Sclerotinia sclerotiorum
    gtdb_grounding_status: NO_GTDB_EQUIVALENT
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: Twelve-Strain SynCom Suppression of Sclerotinia Sclerotia
    description: Trinickia sp. MC is the strongest member-level contributor resolved by the dropout series.
  evidence:
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: dropping TsMC significantly decreased mortality and its mono-inoculation alone could accelerate sclerotia mortality
    explanation: Supports Trinickia sp. MC as the dominant dropout-validated contributor to sclerotia mortality.
- name: Spatial Invasion of Sclerotia by SynCom Members
  description: Xenium spatial profiling of inoculated sclerotia showed that Massilia sp. TB221 and R20 were early interior
    colonizers by day 3, while Ralstonia sp. R4 and Trinickia sp. MC progressively increased in interior layers at days 5
    to 7 and MC exceeded every other member across all five layers by day 14.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By 3-day co-culture, Massilia sp. TB221 and Massilia sp. R20 had reached the interior sclerotia
      (layer 1 to 4)
    explanation: Supports Massilia sp. TB221 and Massilia sp. R20 as early interior sclerotium colonizers.
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At 5- to 7-day co-culture, the relative abundance of Ralstonia sp. R4 and Trinickia sp. MC increased
      progressively in the interior layers
    explanation: Supports later interior enrichment of Ralstonia sp. R4 and Trinickia sp. MC.
  - reference: PMID:42523014
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By 14-day co-culture, when sclerotia viability was completely suppressed, the relative abundance of Trinickia
      sp. MC exceeded all other SynCom members simultaneously across layer 1 to 5
    explanation: Supports Trinickia sp. MC dominance across all five sclerotium layers at day 14.
