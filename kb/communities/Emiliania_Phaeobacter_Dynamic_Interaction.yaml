  downstream:
  - target: Algal Growth Promotion and Late Killing with Proposed IAA Mediation
    description: 'HYPOTHESIZED: Tryptophan-enhanced IAA production could contribute to initial algal promotion and
      late killing. Added tryptophan accelerated coculture bleaching, but also changed attachment; bulk coculture
      IAA was undetectable and pathway mutants retained production. The experiment therefore does not isolate IAA
      mediation or show that measured bacterial IAA reached the exogenous toxic dose.'
  evidence:
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial production of indole-3-acetic acid and attachment to algae are significantly increased by
      tryptophan
    explanation: Summarizes tryptophan responses; separate precursor-addition and exudate-bioavailability assays
      must not be collapsed into a fully traced endogenous exchange.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: all produced IAA is fully labeled
    explanation: Supports conversion of added labeled tryptophan in bacterial culture, not tracing of algal-derived
      precursor through coculture.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This indicates that algal exudates contain bioavailable tryptophan
    explanation: Auxotroph growth supports precursor availability without quantifying endogenous IAA transfer.
- name: Algal Growth Promotion and Late Killing with Proposed IAA Mediation
  description: 'P. inhibens coculture initially increased algal yield, followed by late bleaching and increased
    algal death. Day-17 Sytox staining was reported as 94% dead in coculture versus 21% in axenic algae; day-20
    TUNEL labeling showed more fragmented DNA. HYPOTHESIZED: IAA mediates both phases. Added IAA promoted growth
    at 1 and 100 micromolar but was harmful at 1000 micromolar; these are not measured coculture exposures. IAA
    was undetectable in coculture, and tested pathway mutants still produced IAA and bleached algae. The experiments
    do not establish IAA necessity, nutrient-consuming predation, a unique death pathway or natural-bloom termination.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Phaeobacter inhibens DSM 17395
    term:
      id: NCBITaxon:391619
      label: Phaeobacter inhibens DSM 17395
  target_taxon:
    preferred_term: Emiliania huxleyi CCMP3266
    term:
      id: NCBITaxon:2903
      label: Emiliania huxleyi
  metabolites:
  - preferred_term: indole-3-acetic acid
    term:
      id: CHEBI:16411
      label: indole-3-acetic acid
  evidence:
  - reference: PMID:27855786
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Both algal growth enhancement and algal death are driven by the bacterially-produced phytohormone indole-3-acetic
      acid
    explanation: The abstract gives a strong IAA interpretation; main-body nondetection and non-null mutants leave
      endogenous mediation unresolved.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: in these conditions IAA was undetectable
    explanation: The proposed local uptake/phycosphere accumulation was not a measured coculture exposure.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: these mutants were still capable of producing IAA
    explanation: These mutants are not IAA-null necessity tests.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: while in the pure culture only 21% are dead by day 17
    explanation: The primary comparison supports a host-death effect beyond a metabolite-only interpretation.
cultivation_setup:
- cultivation_mode: BATCH
  operating_temperature: 18.0
  operating_temperature_unit: °C
  instrument_detail: >-
    Standing cultures in a Percival chamber at 18 °C under a 12/12 h light/dark cycle, in
    L1-Si - a seawater-based medium with additional phosphorus. The coculture is assembled
    sequentially: algae are inoculated first and the bacteria introduced four days later, then
    followed for 20 days.
  notes: >-
    The medium is non-permissive for one partner on purpose. Phaeobacter does not grow in
    L1-Si alone - the paper shows it flat in the absence of algae - so the bacterium's growth
    in coculture IS the measurement of dependence. Recording "L1-Si" as a neutral medium would
    lose that; it is chosen precisely because the bacterium cannot use it.

    Fifth instance of this shape in the sweep, after the thiamine-free P20, the B12-free BG11,
    the amino-acid-free M9, and the fumarate excluded from the syntrophy record. In each the
    medium is defined by what the partner cannot do without help.

    The four-day offset is part of the design rather than scheduling: the alga is established
    before the bacterium arrives, so the bacterium meets a functioning phycosphere rather than
    bare medium.

    Standing, not shaken - relevant for a phycosphere interaction, where the exchange happens
    in the diffusive boundary layer around the algal cell and agitation would disrupt it.

    The 1/2YTSS named for Phaeobacter is its routine rich medium, not this experiment's (#529).

    No `system_type` or `working_volume`: the source gives the chamber but not the vessel.
  evidence:
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Algae were grown in standing cultures in a Percival chamber (Percival Scientific, IA,
      USA) at 18°C under a light/dark cycle of 12/12 hr
    explanation: Temperature, photoperiod, and that the cultures are standing rather than shaken.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To grow a co-culture, we inoculated algae into L1-Si medium and, after four days,
      introduced bacteria into the algal culture
    explanation: The medium and the sequential, four-day-offset assembly of the coculture.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Of note, alone these bacteria do not grow in the L1-Si medium
    explanation: Why the medium choice is the experiment — it is non-permissive for the bacterium.

