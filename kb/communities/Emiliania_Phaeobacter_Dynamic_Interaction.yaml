id: CommunityMech:000143
name: Emiliania huxleyi-Phaeobacter inhibens Dynamic Interaction
description: >
  A defined marine algal-bacterial co-culture model between the coccolithophore Emiliania
  huxleyi CCMP3266 and the Roseobacter-group bacterium Phaeobacter inhibens DSM 17395. The interaction
  is dynamic: attached bacteria initially promote algal growth but later kill aging algal hosts. Evidence
  supports algal nutrient provisioning to the heterotrophic bacterium, bacterial attachment to naked algal
  cells, and indole-3-acetic acid production stimulated by algal-exuded tryptophan.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: Establish a simplified coccolithophore-bacterium model for dissecting marine algal-bacterial
    physical attachment, metabolite exchange, growth promotion, and algal killing.
  assembly_strategy: Emiliania huxleyi CCMP3266 was grown axenically in L1-Si medium, then Phaeobacter
    inhibens DSM 17395 was added after four days of algal growth.
  measurement_endpoints:
  - bacterial colony-forming units in co-culture
  - bacterial attachment to algal cells
  - algal growth and death
  - indole-3-acetic acid production
  - tryptophan exudation
