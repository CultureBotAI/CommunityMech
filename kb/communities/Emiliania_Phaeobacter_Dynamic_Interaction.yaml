ecological_interactions:
- name: Algal Nutrient Provisioning Supports Bacterial Growth
  description: E. huxleyi CCMP3266 supports P. inhibens DSM 17395 growth in otherwise nonpermissive L1-Si medium.
    Nutrient-rescue comparisons support algal supply of usable nutrient forms; DMSP can contribute sulfur but did
    not alone provide an adequate carbon supply in the tested context. Bacterial growth was monitored as colony-forming
    units, which may represent rosettes rather than single cells. Nutrient support does not by itself demonstrate
    a causal step from general biomass increase to the specific tryptophan/IAA response.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Emiliania huxleyi CCMP3266
    term:
      id: NCBITaxon:2903
      label: Emiliania huxleyi
  target_taxon:
    preferred_term: Phaeobacter inhibens DSM 17395
    term:
      id: NCBITaxon:391619
      label: Phaeobacter inhibens DSM 17395
  evidence:
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: E. huxleyi can provide all four essential nutrients
    explanation: Supports algal provisioning of nutrients needed for heterotrophic bacterial growth.
  - reference: PMID:27855786
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CFU may include rosettes as well as individual bacteria
    explanation: Limits CFU interpretation; a colony-forming unit need not equal one bacterium.
- name: Tryptophan-Enhanced Bacterial Attachment And IAA Production
  description: Algal exudates supported tryptophan-auxotroph growth, establishing bioavailable tryptophan. In separate
    bacterial cultures, added tryptophan increased IAA production and isotope labeling demonstrated conversion of
    the added precursor into IAA. Added tryptophan also increased bacterial attachment in coculture, particularly
    to naked algal cells. These assays do not trace the complete endogenous algal-to-bacterial-to-algal flux or
    measure de novo tryptophan biosynthesis in the recipient. The E. coli auxotroph is an assay reporter, not a
    community member.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Emiliania huxleyi CCMP3266
    term:
      id: NCBITaxon:2903
      label: Emiliania huxleyi
  target_taxon:
    preferred_term: Phaeobacter inhibens DSM 17395
    term:
      id: NCBITaxon:391619
      label: Phaeobacter inhibens DSM 17395
  metabolites:
