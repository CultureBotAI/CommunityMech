    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic mutualism between C. sorokiniana and A. brasilense can be modulated
    explanation: Supports condition-dependent mutualism in the illuminated nutrient-shift experiment, not every
      physiological endpoint in all three publications.
  - reference: doi:10.1007/s00248-018-1282-1
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Overall, populations of bacteria and microalgae were larger when co-immobilized.
    explanation: The abstract gives the overall population trend; Results show time/medium-specific exceptions,
      including the nutrient-rich-start bacterial comparison.
- name: Tryptophan, Thiamine, and IAA Exchange
  description: PARTIAL - algal exudates supported bacterial IAA production; supplementation required tryptophan
    plus thiamine diphosphate rather than tryptophan alone. This supports algal-resource use by Cd. Within co-immobilized
    cultures, bulk-medium tryptophan and IAA were undetected; enzyme and ipdC expression measurements support proposed
    local exchange but do not directly quantify its flux. IPDC activity alone is neither uniquely bacterial nor
    specific to IAA production.
  interaction_type: CROSS_FEEDING
