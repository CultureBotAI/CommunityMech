  - target: Nutrient-Modulated Synthetic Mutualism
    description: HYPOTHESIZED - close proximity could facilitate exchange of growth-supporting resources. The studies
      propose this link, but aggregation was not selectively disrupted to demonstrate that it causes the nutrient-dependent
      population benefits.
  evidence:
  - reference: doi:10.1007/s00248-018-1282-1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Formation of aggregates made of microalgae and bacteria occurred
    explanation: Supports observed mixed aggregation, not its necessity for mutualism or a colonization-facilitation
      type.
  - reference: doi:10.1093/femsec/fiw077
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microorganisms were immobilized individually and co-immobilized in alginate beads
    explanation: Supports the investigator-imposed bead format, not a partner-caused colonization mechanism.
- name: IAA-Linked Starch Accumulation Response
  description: In dark, aerobic, glucose-fed assays with or without ammonium, Cd and Sp6 cocultures increased algal
    starch and AGPase activity. Synthetic IAA gave a transient response, and the Sp6-derived IAA-attenuated SpM7918
    retained smaller starch effects. Most cocultures reduced algal population growth; starch is a physiological
    endpoint, not reciprocal fitness. The Cd tryptophan/IAA correlation under N starvation was nonsignificant, and
    the intracellular regulatory step remains unresolved.
  scope: PAIRWISE
