discussions:
- discussion_id: chlorella_cd_local_transfer_and_starch_mediation
  prompt: How much bead-local metabolite transfer occurs, and is Cd-derived IAA necessary for the starch response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Nutrient-Modulated Synthetic Mutualism
  - ecological_interactions#Tryptophan, Thiamine, and IAA Exchange
  - ecological_interactions#Co-Immobilization and Cell Aggregation
  - ecological_interactions#IAA-Linked Starch Accumulation Response
  rationale: Bulk non-detection does not exclude short-distance transfer, but enzyme activity does not quantify
    partner-resolved flux. The IAA-attenuated comparator is derived from Sp6 rather than Cd. Exact-Cd loss/rescue,
    transfer measurements and a selective proximity perturbation would distinguish IAA mediation and aggregation
    dependence without conflating illuminated growth with dark glucose-fed starch assays.
  posed_by: codex
  posed_date: '2026-10-05'
