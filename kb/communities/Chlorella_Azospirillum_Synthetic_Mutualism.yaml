ecological_interactions:
- name: Nutrient-Modulated Synthetic Mutualism
  description: 'C. sorokiniana UTEX 2714 and A. brasilense Cd show nutrient- and time-dependent population benefits
    in illuminated bead cultures. The initial 12-hour nutrient-rich, N-free or C-free treatment was followed by
    transfer to SGM. Mutualism is not uniform across comparisons: after the nutrient-rich start, later bacterial
    counts did not differ significantly from individually immobilized controls.'
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chlorella sorokiniana UTEX 2714
    term:
      id: NCBITaxon:3076
      label: Chlorella sorokiniana
