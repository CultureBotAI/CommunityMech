  downstream:
  - target: IAA-Linked Starch Accumulation Response
    description: PARTIAL - bacterial IAA can promote algal starch/AGPase responses in the separate dark, glucose-fed
      assay. Synthetic IAA and wild-type versus IAA-attenuated strain comparisons support mediation, but SpM7918
      is an Sp6-derived comparator, not a Cd mutant; exact-strain IAA necessity and the contribution of local resource
      transfer remain unresolved.
  evidence:
  - reference: doi:10.1093/femsec/fiw077
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: using tryptophan and thiamine released by the microalga
    explanation: The primary text supports exudate-dependent bacterial IAA synthesis and cofactor supplementation.
      Local bead-scale transfer is inferred; the tested cofactor supplement was thiamine diphosphate, not a direct
      identification of the extracellular thiamine species.
  - reference: doi:10.1007/s00248-018-1282-1
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: production of signal molecules tryptophan and indole-3-acetic acid
    explanation: The nutritional study measures signal molecules but finds no bulk IAA in N-free/C-free-start treatments.
      Its proposed short-distance transfer is not direct flux measurement.
- name: Co-Immobilization and Cell Aggregation
  description: Co-immobilization experimentally places both members in alginate beads; mixed aggregates were observed
    with condition- and time-dependent patterns. N-free-start attachment weakened later, whereas large C-free-start
    clusters developed late. This is engineered proximity and observed organization, not demonstrated partner-mediated
    colonization facilitation.
  scope: PAIRWISE
  source_taxon:
