  - reference: doi:10.1016/j.resmic.2016.02.005
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: measured the relations between tryptophan production, the phytohormone indole-3-acetic acid
    explanation: This abstract excerpt identifies measured variables, not the complete causal result. Primary Results,
      Table 1 and Figures 3-5 support starch/AGPase effects and comparator/synthetic-IAA evidence; they do not prove
      Cd-specific genetic necessity.
  - reference: doi:10.1016/j.resmic.2016.02.005
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: created by co-immobilization in alginate beads
    explanation: Supports the bead assay format only. The paper's mutualism framing does not turn a starch endpoint,
      often accompanied by reduced algal counts, into reciprocal fitness.
