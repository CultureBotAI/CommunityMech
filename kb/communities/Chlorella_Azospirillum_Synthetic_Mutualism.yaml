id: CommunityMech:000191
name: Chlorella-Azospirillum Synthetic Mutualism
description: >
  A defined algal-bacterial synthetic mutualism pairing the freshwater green
  microalga Chlorella sorokiniana UTEX 2714 with the plant-growth-promoting
  bacterium Azospirillum brasilense Cd. The pair has been studied in
  co-immobilized alginate bead systems and related culture formats to test how
  nutrient availability shapes mutualistic population growth, tryptophan,
  thiamine, and indole-3-acetic acid exchange, starch accumulation, and
  algal-bacterial aggregation. The system is relevant to environmental
  biotechnology, microalgal biomass production, and algal-bacterial interaction
  design.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: >
    Evaluate how nutritional conditions and exchanged signal molecules shape
    synthetic mutualism between a green microalga and a plant-growth-promoting
    bacterium.
  assembly_strategy: >
    Pair Chlorella sorokiniana UTEX 2714 with Azospirillum brasilense Cd in
    laboratory culture, including co-immobilization in alginate beads.
  perturbation_design: >
    Compare nutrient-rich, nitrogen-free, and carbon-free initial conditions,
    and use tryptophan, thiamine, and indole-3-acetic acid measurements to
    resolve exchanged resources and signaling chemistry.
  measurement_endpoints:
  - Microalgal and bacterial population growth
  - Tryptophan, thiamine, and indole-3-acetic acid production or consumption
  - Starch accumulation
  - Algal-bacterial aggregation
  evidence:
  - reference: doi:10.1007/s00248-018-1282-1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: formation of synthetic mutualism was assessed by changes in population growth
    explanation: Supports the design goal of testing mutualism through population and physiological endpoints.
  - reference: doi:10.1093/femsec/fiw077
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mutual exchange of resources involved in producing and releasing the phytohormone indole-3-acetic acid
    explanation: Supports the exchange-focused design for this algal-bacterial system.
