id: CommunityMech:000367
name: Mediterranean AM Fungal Six-Species SynCom
description: A six-species arbuscular mycorrhizal fungal synthetic community assembled from southern-Spain isolates and followed
  for three years in soil mesocosms designed to mimic a semi-arid Mediterranean ecosystem. The mesocosms used Retama sphaerocarpa,
  Lavandula latifolia, Thymus mastichina, and Rosmarinus officinalis as monoculture or pairwise plant covers while tracking
  AM fungal root colonization by nested PCR-TTGE of SSU rDNA and rhizosphere spore morphotypes every three months. The abstract
  reports species-specific establishment, persistence, and sporulation trajectories, with Septoglomus constrictum showing
  the most consistent persistence and sporulation under the semi-arid Mediterranean conditions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Track how plant cover shapes the establishment, persistence, and sporulation of a defined arbuscular mycorrhizal
    fungal SynCom under semi-arid Mediterranean mesocosm conditions.
  assembly_strategy: Assemble six arbuscular mycorrhizal fungal species isolated from southern Spain into the initial SynCom.
  perturbation_design: Cultivate four characteristic southern-Spain plant species either as monocultures or in every pairwise
    association to compare plant-cover effects over time.
  measurement_endpoints:
  - AM fungal establishment in plant roots
  - AM fungal persistence across a three-year time course
  - rhizosphere spore abundance by morphotype
  - root-colonizing fungi detected by nested PCR-TTGE of SSU rDNA
  evidence:
  - &id001
    reference: PMID:42661004
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The initial AM SynCom was composed of six species (Rhizophagus clarus, Septoglomus constrictum, Funneliformis
      coronatum, R. intraradices, F. mosseae and S. viscosum), all isolated from southern Spain.
    explanation: Supports the six arbuscular mycorrhizal fungal species and the shared southern-Spain isolate origin of the
      initial SynCom.
  - reference: PMID:42661004
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A mesocosm system was designed to mimic the environmental conditions of a semi-arid Mediterranean ecosystem,
      allowing the assessment of changes in AM fungal establishment, persistence, and sporulation within the SynCom.
    explanation: Supports the mesocosm design and the establishment, persistence, and sporulation endpoints tracked for the
      SynCom.
  - &id003
    reference: PMID:42661004
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Retama sphaerocarpa, Lavandula latifolia, Thymus mastichina and Rosmarinus officinalis were selected and cultivated
      either in monoculture or in pairwise combinations, covering all possible dual associations.
    explanation: Supports the four-host plant-cover design and the monoculture versus pairwise mesocosm treatments.
