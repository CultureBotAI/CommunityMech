ecological_interactions:
- name: AM Fungal Establishment and Sporulation Trajectory
  description: The six-member arbuscular mycorrhizal fungal SynCom established and persisted with species-specific trajectories
    in plant roots and the rhizosphere spore pool; plant species composition had only a limited influence on overall AM fungal
    community structure in the abstract-level summary.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  evidence:
  - &id004
    reference: PMID:42661004
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Changes in the AM SynCom, both colonizing plant roots and the spores in the rhizosphere, were monitored every
      three months over three years.
    explanation: Supports the three-year, quarterly monitoring schedule and the root and rhizosphere-spore compartments.
  - &id005
    reference: PMID:42661004
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fungi colonizing roots were identified through nested PCR-TTGE of the SSU rDNA, while AM fungal spores were quantified
      based on morphotype.
    explanation: Supports the two measurement methods used to follow the fungal SynCom.
  - reference: PMID:42661004
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Results indicate that plant species composition exerted only a limited influence on the AM fungal community structure,
      whereas pronounced species-specific differences in establishment, persistence, and sporulation shaped community trajectories
      over time.
    explanation: Supports the abstract-level conclusion that fungal species identity, more than plant-cover composition, shaped
      SynCom trajectories.
  - *id002
