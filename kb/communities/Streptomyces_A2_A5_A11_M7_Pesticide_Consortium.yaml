ecological_interactions:
- name: Non-antagonistic community-level growth enhancement
  description: The exact four-strain mixture showed non-antagonism and greater aggregate biomass than the corresponding
    pure cultures in the reported pesticide experiment. These observations do not measure reciprocal benefit to
    each member. The 2013 paper includes other mixtures, including a six-member immobilized system whose results
    are not assigned to this four-member record.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: chlorpyrifos
    term:
      id: CHEBI:34631
      label: chlorpyrifos
  - preferred_term: pentachlorophenol
    term:
      id: CHEBI:17642
      label: pentachlorophenol
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:23865051
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Results revealed that the strains did not have any antagonistic effects and showed tolerance against
      the pesticides mixture. In fact, the growth of mixed cultures was significantly higher than in pure cultures.
    explanation: Supports the reported screen and aggregate growth comparison; not quantified reciprocal benefit
      or the performance of every source formulation.
  - reference: PMID:41678860
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: revealing their metabolic versatility and potential cooperative work, fundamental for the degradation
      of xenobiotic compounds.
    explanation: Preserves the source authors potential-cooperation interpretation without classifying all members
      as mutualistic.
- name: C1 Herbicide-Catabolism Gene Detection
  description: The 2026 source detected at least one herbicide-catabolism-associated gene in each C1 member. This
    supports distributed genetic potential, not measured expression, enzyme activity or a demonstrated contribution
    of each member to removal.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: atrazine
    term:
      id: CHEBI:15930
      label: atrazine
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: C1 Atrazine Growth and Removal
    description: 'HYPOTHESIZED/PARTIAL: the detected catabolic genes could underlie the reported C1 atrazine growth/removal
      phenotype. The accessible abstract reports gene presence and community outcomes but does not isolate gene
      activity or member-specific contributions as causal mediators.'
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the presence of at least one of the genes that encode enzymes involved in the herbicide degradation
      was detected in all C1 members.
    explanation: Supports distribution of herbicide-catabolic potential across all four consortium members.
- name: C1 Atrazine Growth and Removal
  description: The exact A2-A5-A11-M7 consortium showed growth and atrazine removal in the source nutrient-role
    comparisons. Preserve these observed liquid-culture outcomes without treating parent-compound removal as complete
    mineralization or measured reciprocal partner benefit.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: atrazine
    term:
      id: CHEBI:15930
      label: atrazine
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: C1 Atrazine Phytotoxicity Reversal
    description: 'HYPOTHESIZED/PARTIAL: atrazine removal could contribute to the reported decrease in phytotoxicity
      after C1 treatment. The accessible abstract does not establish parent-compound depletion as the sole cause,
      resolve transformation-product effects or demonstrate complete mineralization.'
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results demonstrated the ability of C1 to remove atrazine and use it as a carbon or nitrogen
      source
    explanation: Supports C1 atrazine removal under both nutrient-role treatments.
- name: C1 Atrazine Phytotoxicity Reversal
  description: The source phytotoxicity tests found that C1 treatment reversed the measured herbicide toxicity,
    with differing outcomes across the nutrient-role comparisons. Preserve this positive tested endpoint without
    attributing it exclusively to parent-compound depletion or generalizing it to all toxicity endpoints.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: atrazine
    term:
      id: CHEBI:15930
      label: atrazine
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phytotoxicity tests demonstrated the ability of C1 to reverse the herbicide toxicity, especially with
      atrazine as a carbon source.
    explanation: Supports the reported post-treatment phytotoxicity endpoint, not an isolated depletion-mediated
      causal mechanism.
environmental_factors:
- name: Atrazine concentration
  value: 25 and 50
  unit: mg/L
  description: C1 was selected after testing growth and removal with atrazine supplied as the only carbon source at both concentrations.
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: four actinomycetota consortia (C1, C2, C3, and C4) were tested about their ability to grow and remove 25 and 50 mg L-1 of atrazine as the only carbon source.
    explanation: Supports the two tested atrazine concentrations and carbon-source condition.
- name: Atrazine nutrient role
  value: sole carbon source or sole nitrogen source
  description: The consortium grew with atrazine supplied separately as its sole carbon or nitrogen source.
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: no statistically significant differences (p > 0.05) were observed between the growth values detected with atrazine as a carbon (2.98 ± 0.13 g L-1) or nitrogen source (2.88 ± 0.18 g L-1).
    explanation: Supports growth under both nutrient-role treatments.
- name: Atrazine phytotoxicity reversal
  value: strongest with atrazine as carbon source
  description: Treated liquid systems showed reduced herbicide phytotoxicity.
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phytotoxicity tests demonstrated the ability of C1 to reverse the herbicide toxicity, especially with atrazine as a carbon source.
    explanation: Supports detoxification of the atrazine-treated system.
- name: Lindane removal in immobilized mixed culture
  value: '81'
  unit: percent
  description: The four strains immobilized together in cloth sachets reached the reported maximum after 96 hours.
  evidence:
  - reference: PMID:22840534
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: reaching a maximum removal of 81% after 96 h for consortium I, consisting of the four immobilized strains together.
    explanation: Supports the immobilized-consortium lindane endpoint.
