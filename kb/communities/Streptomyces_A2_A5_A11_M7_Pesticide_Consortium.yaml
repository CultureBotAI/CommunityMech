metal_notes: The curated exact composition is represented for pesticide degradation; metal-remediation studies using different Streptomyces combinations are not attributed to this record.
discussions:
- discussion_id: c1_gene_presence_and_outcome_mediation
  prompt: Do the detected genes and atrazine removal independently establish the mechanisms of C1 performance and
    reduced phytotoxicity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Non-antagonistic community-level growth enhancement
  - ecological_interactions#C1 Herbicide-Catabolism Gene Detection
  - ecological_interactions#C1 Atrazine Growth and Removal
  - ecological_interactions#C1 Atrazine Phytotoxicity Reversal
  rationale: Retain the exact four-member observations. Aggregate biomass and compatibility are not reciprocal benefit.
    Gene detection does not establish expression or flux, and treatment-associated phytotoxicity reversal does not
    isolate its mediator. Keep the two existing directions qualified; do not transfer six-member immobilized-culture
    results. The 2026 abstract and bounded 2013 results were read, not full methods or all source formulations.
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the presence of at least one of the genes that encode enzymes involved in the herbicide degradation
      was detected in all C1 members.
    explanation: Supports distribution of herbicide-catabolic potential across all four consortium members.
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Phytotoxicity tests demonstrated the ability of C1 to reverse the herbicide toxicity, especially with
      atrazine as a carbon source.
    explanation: Supports the reported post-treatment phytotoxicity endpoint, not an isolated depletion-mediated
      causal mechanism.
