id: CommunityMech:000335
name: Streptomyces A2-A5-A11-M7 Pesticide-Bioremediation Consortium
description: >
  A repeatedly studied defined consortium of four Argentine Streptomyces soil
  and sediment isolates: A2, A5, A11, and M7. The unchanged composition has
  been evaluated across liquid cultures, immobilized cultures, soil slurries,
  microcosms, and mesocosms for lindane and other chlorinated pesticides, and
  most recently for atrazine removal and detoxification.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine four compatible pesticide-tolerant Streptomyces isolates as a reusable bioaugmentation consortium for chlorinated-pesticide removal.
  assembly_strategy: Mix Streptomyces sp. A2, A5, A11, and M7, originally isolated from organochlorine-pesticide-contaminated Argentine soils and sediments.
  measurement_endpoints:
  - microbial growth
  - pesticide removal
  - specific dechlorinase activity
  - strain survival
  - phytotoxicity
  - soil enzymatic activity
  evidence:
  - reference: PMID:41678860
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The best growth and removal efficiency were detected for C1, constituted by Streptomyces sp. A2, A5, A11, and M7.
    explanation: Confirms the unchanged composition and its later selection for atrazine removal.
environment_term:
  preferred_term: pesticide-bioremediation laboratory and soil systems
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The exact consortium has been studied in defined liquid media, immobilization systems, soil slurries, and controlled soil microcosms and mesocosms.
