id: CommunityMech:000390
name: Microalgae-Cyanobacteria Bioactive Peptide Consortia
description: A bounded controlled-photobioreactor biomass panel comprising two marine microalgae-cyanobacteria consortia supplied
  by Microalgae Solutions S.L. for protein extraction, LC-MS/MS proteome identification, and Alcalase hydrolysis. Consortium
  C1 combined Chlorella vulgaris with Arthrospira platensis, while consortium C2 combined Kamptonema sp., Nannochloropsis
  oculata, Tetraselmis suecica, and Chlorella vulgaris. Both biomasses were grown in flat photobioreactors in modified Guillard
  F/2 medium, lyophilized, characterized for macromolecular composition, extracted at pH 10/pH 5, and hydrolyzed to evaluate
  release of antioxidant peptides.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Evaluate two marine microalgae-cyanobacteria consortia as protein-rich biomass sources for Alcalase-released
    antioxidant peptides.
  assembly_strategy: 'Supply and compare two lyophilized consortial biomasses: C1 (Chlorella vulgaris plus Arthrospira platensis)
    and C2 (Kamptonema sp., Nannochloropsis oculata, Tetraselmis suecica, and Chlorella vulgaris).'
  measurement_endpoints:
  - Protein, carbohydrate, lipid, moisture, and inorganic-material contents of C1 and C2
  - C1 and C2 proteins detected by RP-LC-MS/MS
  - Soluble protein yield after pH 10 solubilization and pH 5 precipitation
  - Peptide release and antioxidant capacity after Alcalase hydrolysis
  - In silico Alcalase digestion of C1 and C2 proteins
  evidence:
  - reference: PMID:42188319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, the potential of two microalgae-cyanobacteria consortia, consortium 1 (C1) consisting of Chlorella
      vulgaris and Arthrospira platensis, and consortium 2 (C2) consisting of Kamptonema sp., Nannochloropsis oculata, Tetraselmis
      suecica, and Chlorella vulgaris, as a source of bioactive peptides was evaluated
    explanation: Identifies the two C1/C2 consortia and the bioactive-peptide design objective.
  - reference: PMID:42188319
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: evaluating the impact of the incubation time on peptide release and the antioxidant capacity of hydrolysates
    explanation: Supports peptide release and hydrolysate antioxidant capacity as measured endpoints.
