ecological_interactions:
- name: Cellulose Hydrolysis During Solid-State Fermentation
  description: 'The eight-strain synthetic community degraded 34.91% of the cellulose fraction of corn straw under
    the tested optimum solid-state fermentation conditions: 10% inoculum (w/v), 4% nitrogen source ratio and 23
    days. This community-level conversion does not establish reciprocal fitness benefits among its members.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
    term:
      id: CHEBI:18246
      label: (1->4)-beta-D-glucan
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  downstream:
  - target: Core Corn Straw Lignocellulose Decomposition
    description: Cellulose hydrolysis converts one of the three major corn-straw fractions targeted by the SynCom's
      solid-state degradation process.
  evidence:
  - reference: PMID:37774801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The synthetic microbial community was employed to degrade corn straw via solid-state fermentation.
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:37774801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the degradation rates of cellulose, hemicellulose, and lignin were 34.91%, 45.94%, and 23.34%, respectively.
    explanation: Quantifies cellulose degradation by the synthetic microbial community.
- name: Hemicellulose Xylan Hydrolysis
  description: The community degraded 45.94% of corn-straw hemicellulose under the tested optimum conditions. Proteomics
    associates xylanases and beta-xylosidase with lignocellulose degradation; enzyme necessity, sufficiency and
    strain-specific contributions are not established by the available abstract.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hemicellulose
    term:
      id: CHEBI:61266
      label: hemicellulose
  biological_processes:
  - preferred_term: xylan catabolic process
    term:
      id: GO:0045493
      label: xylan catabolic process
  downstream:
  - target: Core Corn Straw Lignocellulose Decomposition
    description: Hemicellulose xylan hydrolysis contributes a second measured corn-straw fraction to whole-lignocellulose
      conversion.
  evidence:
  - reference: PMID:37774801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The synthetic microbial community was employed to degrade corn straw via solid-state fermentation.
    explanation: Supports the defined synthetic community design and represented community context.
  - reference: PMID:37774801
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Proteomic analysis revealed that lignin 1,4-β-xylanase, β-xylosidase and endo-1,4-β-xylanase were closely
      related to lignocellulose degradation.
    explanation: Preserves the primary wording as a proteomic association, not a necessity test or proof that xylanases
      are ligninases.
  - reference: PMID:37774801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the degradation rates of cellulose, hemicellulose, and lignin were 34.91%, 45.94%, and 23.34%, respectively.
    explanation: Directly supports the measured hemicellulose fraction without relying on proteomic mechanism inference.
- name: Lignin Breakdown During Solid-State Fermentation
  description: The community degraded 23.34% of the corn-straw lignin fraction alongside cellulose and hemicellulose
    conversion. A selective effect of lignin removal on polysaccharide accessibility is HYPOTHESIZED from the available
    abstract, not resolved by the joint fraction measurements.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lignin
    term:
      id: CHEBI:6457
      label: lignin
  biological_processes:
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  downstream:
  - target: Core Corn Straw Lignocellulose Decomposition
    description: Lignin breakdown directly contributes conversion of the aromatic fraction to overall corn-straw
      decomposition. Additional opening of an accessibility barrier for cellulose or hemicellulose is HYPOTHESIZED;
      simultaneous fraction degradation does not isolate that mediation.
  evidence:
  - reference: PMID:37774801
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The synthetic microbial community was employed to degrade corn straw via solid-state fermentation.
