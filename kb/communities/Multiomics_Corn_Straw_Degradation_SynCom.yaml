ecological_interactions:
- name: Cellulose Hydrolysis During Solid-State Fermentation
  description: The eight-strain synthetic community enzymatically degrades the cellulose fraction of
    corn straw during optimized solid-state fermentation.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: cellulose
