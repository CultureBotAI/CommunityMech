discussions:
- discussion_id: corn_fraction_conversion_and_enzyme_causality
  prompt: Which selective mechanisms explain the measured community responses?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-07'
  rationale: Preserve all three component-to-whole contributions and the measured fraction reductions. Full Methods
    are not available through Europe PMC; the abstract supports community conversion but not reciprocal member fitness,
    enzyme necessity or isolated lignin-barrier mediation. Its unusual proteomic wording is quoted verbatim, not
    repaired into an unsupported ligninolytic enzyme assignment. Resolve strain roles and perturbations before adding
    member-level structure.
