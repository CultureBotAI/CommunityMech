      label: cellulose catabolic process
  downstream:
  - target: Core Corn Straw Lignocellulose Decomposition
    description: Cellulose hydrolysis converts one of the three major corn-straw fractions targeted by
      the SynCom's solid-state degradation process.
  evidence:
