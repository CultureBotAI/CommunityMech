id: CommunityMech:000464
name: Bacteroides-Desulfovibrio Carrageenan H2S Coculture
description: A defined in vitro two-species human-gut bacterial coculture in which Bacteroides thetaiotaomicron degrades
  carrageenan, releases inorganic sulfate, and fuels dissimilatory sulfate reduction and hydrogen sulfide production by
  Desulfovibrio desulfuricans.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Test a carrageenan-mediated gut-bacterial cross-feeding pathway in which carrageenan desulfation by Bacteroides
    thetaiotaomicron supplies sulfate to Desulfovibrio desulfuricans.
  assembly_strategy: Pair Bacteroides thetaiotaomicron with Desulfovibrio desulfuricans in in vitro co-culture assays that
    evaluate carrageenan-driven sulfate release and hydrogen sulfide production.
  measurement_endpoints:
  - hydrogen sulfide production
  - transcriptomic response of carrageenan desulfation and depolymerization genes
  - metabolomic accumulation of dissimilatory sulfate-reduction intermediates
  - glycerophospholipid metabolism
  - bacterial cysteine synthesis
  evidence:
  - &id001
    reference: PMID:42565261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study elucidated a syntrophic pathway wherein Bacteroides thetaiotaomicron (B. theta) degrades CGN via specific
      sulfatases and glycoside hydrolases, releasing inorganic sulfate.
    explanation: Names Bacteroides thetaiotaomicron as the carrageenan-degrading partner and identifies inorganic sulfate
      release as its supported contribution.
  - &id002
    reference: PMID:42565261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This sulfate fuels the growth and metabolic activity of the sulfate-reducing bacterium Desulfovibrio desulfuricans
      (D. desulfuricans).
    explanation: Names Desulfovibrio desulfuricans as the sulfate-reducing partner supported by Bacteroides-released sulfate.
  - &id003
    reference: PMID:42565261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In vitro co-culture experiments demonstrated that this cross-feeding interaction significantly enhanced hydrogen sulfide
      (H2S) production.
    explanation: Supports the defined in vitro co-culture design and the hydrogen sulfide endpoint.
  - &id004
    reference: PMID:42565261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transcriptomic and metabolomic analyses revealed that CGN, particularly κ-type, upregulated B. theta genes encoding
      key desulfation and depolymerization enzymes.
    explanation: Supports carrageenan-responsive B. thetaiotaomicron desulfation and depolymerization gene expression as
      a measured endpoint.
  - &id005
    reference: PMID:42565261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: D. desulfuricans showed increased expression of genes in the dissimilatory sulfate reduction pathway (sat, aprAB, dsr),
      accompanied by marked accumulation of pathway intermediates and H2S.
    explanation: Supports Desulfovibrio sulfate-reduction gene expression and sulfate-reduction metabolomic readouts.
