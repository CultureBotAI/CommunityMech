ecological_interactions:
- name: Streptococcus Formate and Carbon Dioxide Support
  description: 'PARTIAL mechanistic model: supplementation and transcriptome responses in S. thermophilus CNRZ1066
    with L. bulgaricus ATCC BAA-365 support formate-related nutritional assistance. Carbon-dioxide provision is
    inferred rather than a quantified transfer in that study; urease experiments distinguish CO2-responsive from
    unresponsive lactobacillus strains. This species-level record combines exact strain-pair studies, not one universally
    beneficial pair.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Streptococcus thermophilus
