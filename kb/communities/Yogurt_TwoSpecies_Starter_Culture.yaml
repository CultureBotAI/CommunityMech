discussions:
- discussion_id: yogurt_strain_stage_and_mediator_boundaries
  prompt: Which return-flow mechanisms and benefits hold for each tested strain pair and growth stage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Streptococcus Formate and Carbon Dioxide Support
  - ecological_interactions#Lactobacillus Proteolytic Nitrogen Support
  - ecological_interactions#Urease-Dependent Acidification Acceleration
  - ecological_interactions#Streptococcus Nox-Dependent Milk Fermentation
  rationale: Keep the CNRZ1066/ATCC BAA-365 nutritional model, LMG 18311/ATCC 11842 expression study, 1131/2038
    Nox experiment and urease strain panel separate. In the LMG 18311 pair, faster acidification accompanied lower
    final lactobacillus counts. In the Nox study, early effects did not imply a higher final Streptococcus yield.
    Nutrient supplementation and knockout phenotypes remain positive evidence without universal mutualism or proven
    mediation.
  evidence:
  - reference: PMID:19114510
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the coculture resulted in a threefold decrease of the final bacterial counts
    explanation: Faster coculture acidification did not imply a final population benefit to both partners.
  posed_by: codex
  posed_date: '2026-10-08'
