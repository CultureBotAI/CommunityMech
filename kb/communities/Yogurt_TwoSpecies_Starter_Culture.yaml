    snippet: earlier l-lactate and formate accumulation
    explanation: Earlier formate accumulation was measured in the separate 1131/2038 oxygen study, not in all yogurt
      strain pairs.
- name: Lactobacillus Proteolytic Nitrogen Support
  description: L. bulgaricus proteolysis supplies peptides and amino acids that support S. thermophilus in milk.
    The CNRZ1066/ATCC BAA-365 experiments support this contribution but show that it does not satisfy all sulfur
    and branched-chain amino-acid demands. LMG 18311/ATCC 11842 expression responses are contextual evidence, not
    a direct nitrogen-flux measurement or proof of reciprocal final growth benefit.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Lactobacillus delbrueckii subsp. bulgaricus
    term:
