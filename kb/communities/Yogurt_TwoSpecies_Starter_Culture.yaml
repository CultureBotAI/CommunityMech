  downstream:
  - target: Streptococcus Formate and Carbon Dioxide Support
    description: 'HYPOTHESIZED mediation: nitrogen support can sustain S. thermophilus growth and hence potential
      return metabolites. The cited strain-pair experiments do not selectively establish proteolysis as the cause
      of formate/CO2 return flow; this is not a demonstrated universal feedback loop.'
  evidence:
  - reference: PMID:20889781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Proteolysis by L. bulgaricus supplies both strains with amino acids
    explanation: Supports nitrogen cross-feeding from proteolytic L. bulgaricus to S. thermophilus.
  - reference: PMID:19114510
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: implicated mainly in the metabolism of nitrogen
    explanation: Coculture nitrogen-metabolism responses support nutritional involvement but do not identify a measured
      transfer flux.
- name: Urease-Dependent Acidification Acceleration
  description: Urease-deficient S. thermophilus mutants and supplementation experiments support a contribution of
    urease to rapid yogurt acidification across the tested strain combinations. Ammonia shortage mainly limits S.
    thermophilus, whereas CO2 shortage affects responsive L. bulgaricus strains. The culture-level benefit is not
    equivalent to direct reciprocal benefit of every strain pair; ammonia effects were stronger and coculture could
    mask the deficiency.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:30594386
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: urease deficiency inhibits the fermentative acceleration of protocooperation
    explanation: Supports urease as a mechanism that accelerates two-species yogurt fermentation.
  - reference: PMID:30594386
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: NH3 and CO2 that it generates
    explanation: The full abstract distinguishes ammonia nutrition of S. thermophilus from CO2 responsiveness of
      L. bulgaricus.
  participating_taxa:
