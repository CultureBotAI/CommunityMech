- name: Streptococcus Nox-Dependent Milk Fermentation
  description: In the S. thermophilus 1131/L. bulgaricus 2038 pair, disrupting S. thermophilus nox reduced oxygen
    removal and slowed skim-milk acidification. Pre-fermentation deoxygenation mainly accelerated early S. thermophilus
    growth and formate/lactate accumulation, not L. bulgaricus growth; final Streptococcus counts converged. This
    is a fermentation phenotype, not colonization facilitation. A direct Nox-to-Pfl mechanism remains HYPOTHESIZED.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Streptococcus Formate and Carbon Dioxide Support
    description: 'PARTIAL: Oxygen removal promotes early formate accumulation in the 1131/2038 system, and the nox
      mutant lacks detected formate in the tested monoculture. Protection of oxygen-sensitive Pfl is HYPOTHESIZED;
      the study also considers other Nox functions and does not establish the CO2 branch or universal transfer to
      L. bulgaricus.'
  evidence:
  - reference: PMID:24936380
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: dissolved oxygen (DO) suppresses yogurt fermentation
    explanation: Supports dissolved oxygen as an inhibitory environmental factor in this coculture.
  - reference: PMID:24936380
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Nox of S. thermophilus 1131 contributes greatly to yogurt fermentation
    explanation: Supports S. thermophilus NADH oxidase as an oxygen-removal mechanism promoting fermentation.
  - reference: PMID:24936380
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: deoxygenated fermentation primarily increased the cell number of S. thermophilus 1131 rather than that
      of L. bulgaricus 2038
    explanation: Preserves the principal early beneficiary of oxygen removal.
  participating_taxa:
  - preferred_term: Streptococcus thermophilus
    term:
      id: NCBITaxon:1308
      label: Streptococcus thermophilus
  - preferred_term: Lactobacillus delbrueckii subsp. bulgaricus
    term:
      id: NCBITaxon:1585
      label: Lactobacillus delbrueckii subsp. bulgaricus
