id: CommunityMech:000164
name: Yogurt Two-Species Starter Culture
description: >
  A defined thermophilic dairy fermentation community composed of Streptococcus thermophilus and
  Lactobacillus delbrueckii subsp. bulgaricus. The two lactic-acid bacteria form the canonical yogurt
  starter association, where metabolite exchange accelerates milk acidification: S. thermophilus provides
  formate, carbon dioxide, and urease-dependent ammonia/carbon dioxide effects that stimulate the
  lactobacillus, while proteolytic activity of L. delbrueckii subsp. bulgaricus releases peptides and
  amino acids that support the more weakly proteolytic streptococcus.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Use a reproducible two-species lactic-acid bacterial starter to ferment milk into yogurt and
    resolve metabolite-exchange mechanisms that accelerate acidification.
  assembly_strategy: Co-inoculate milk with S. thermophilus and L. delbrueckii subsp. bulgaricus strains
    under thermophilic dairy fermentation conditions.
  perturbation_design: Multiple studies compared monocultures, cocultures, strain combinations, oxygen
    removal, urease mutants, and NADH oxidase mutants to identify interaction mechanisms.
  measurement_endpoints:
  - acidification rate
  - pH decrease
  - dissolved oxygen concentration
  - formate accumulation
  - lactate accumulation
  - transcriptomic response during coculture
  evidence:
  - reference: PMID:30594386
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: protocooperation between Streptococcus thermophilus and Lactobacillus delbrueckii ssp. bulgaricus
    explanation: Supports the two-species yogurt starter as a protocooperative community.
  - reference: PMID:20889781
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Yogurt fermentation by Streptococcus thermophilus and Lactobacillus bulgaricus
    explanation: Supports this pair as a canonical mixed-culture yogurt fermentation.
