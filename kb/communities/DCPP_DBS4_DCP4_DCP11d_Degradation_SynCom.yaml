id: CommunityMech:000410
name: DCPP DBS4-DCP-4-DCP-11d Degradation SynCom
description: A metabolic-model-selected three-strain synthetic community composed of Sphingopyxis sp. DBS4, Sphingopyxis sp.
  DCP-4, and Achromobacter sp. DCP-11d. Lin et al. built genome-scale metabolic models from five DCPP-enrichment isolates,
  simulated 15 DBS4-containing two- to five-strain combinations, selected DBS4&DCP-4&DCP-11d as the optimal three-member DCPP
  degrader, and experimentally verified its DCPP removal and predicted metabolite exchange in mineral medium and DCPP-contaminated
  soil.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Use genome-scale metabolic modelling to simplify a five-isolate DCPP-degrading enrichment into a defined SynCom
    that retains high DCPP degradation.
  assembly_strategy: Construct community models for DBS4-containing strain combinations among Sphingopyxis sp. DBS4, Sphingopyxis
    sp. DCP-4, Bosea sp. DCP-2, Pigmentiphaga sp. DCP-6d, and Achromobacter sp. DCP-11d; select the highest-performing three-strain
    design, DBS4&DCP-4&DCP-11d, for in vitro metabolite validation and DCPP-degradation assays.
  inoculation_strategy: Inoculate each strain in a candidate SynCom at equal representation in simulations and experiments,
    then compare model-selected two-, three-, four-, and five-strain consortia.
  perturbation_design: Assay DCPP removal in mineral medium with DCPP as the target carbon source, in DCPP-contaminated soil
    microcosms, and after glucose addition as a predicted biostimulation perturbation.
  measurement_endpoints:
  - Predicted biomass in multi-strain community models
  - DCPP degradation in mineral medium
  - DCPP degradation in contaminated soil
  - LC-MS detection of predicted exchanged metabolites
  - DBS4 degradation response to exchanged metabolites and 2,4-DCP
  evidence:
  - reference: PMID:42613016
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the combination of DBS4, DCP‐4 and DCP‐11d (DBS4&DCP‐4&DCP‐11d) showed the maximum biomass production
    explanation: Supports metabolic-model selection of DBS4, DCP-4, and DCP-11d as the best three-strain DCPP-degradation
      SynCom.
  - reference: PMID:42613016
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: optimal three‐strain SynCom DBS4&DCP‐4&DCP‐11d was comparable to that of the four‐ or five‐strain SynCom
    explanation: Supports experimental validation that the simplified three-strain SynCom retained degradation activity comparable
      to larger designs.
  - reference: PMID:42613016
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The initial inoculation ratio was set to 1:1 in model simulations
    explanation: Supports equal initial representation in the community-model simulations.
  - reference: PMID:42613016
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: same 1:1 inoculation ratio was applied in experimental validation
    explanation: Supports using the same equal-strain ratio in the wet-lab validation experiments.
