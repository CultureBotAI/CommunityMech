- name: DBS4 to DCP-11d 2,4-DCP detoxification
  description: The community model predicted 2,4-DCP flow from DBS4 to DCP-11d; experiments then confirmed that the intermediate
    2,4-DCP inhibits DBS4 DCPP degradation and that DCP-11d relieves this inhibition by consuming 2,4-DCP.
  interaction_type: CROSS_FEEDING
