  description: The 15-member inoculum showed more balanced 16S relative profiles with Brachypodium than in liquid
    culture. In the three-week weekly-transfer 0.2X MS experiment, six strains were undetectable or below 0.1%
    relative abundance; three taxa dominated. Plant experiments reported persistence of members, with unequal
    abundances. These sequencing observations do not establish equal stability of all 15 strains in vitro, absolute
    viable counts or reciprocal mutualism.
