  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Individual SynCom isolates were cultivated in R2A media
    explanation: Methods/Seed germination and SynCom preparation and Figure S8; duration 24–72 h, not the original
      seven-day isolation protocol.
- name: 0.2X MS for weekly-transfer liquid community culture
  temperature: '24'
  temperature_unit: °C
  light_regime: 16 h light (reported)
  preparation_notes: 5 mL inoculum into 45 mL 0.2X MS; weekly 5-to-45 mL transfers for three weeks; 50% relative
    humidity. Initial inoculum contains 4x10^7 cells per member. Agitation and the unreported dark interval are
    not inferred.
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mixture was incubated in a plant growth chamber
    explanation: Methods/Testing the persistence of the SynCom in vitro; 16-h light, 24°C and 50% humidity apply
      to this liquid assay.
- name: 0.2X MS watering medium for potted Brachypodium
  temperature: '24'
  temperature_unit: °C
  light_regime: 16 h light (reported)
  preparation_notes: Sterilized pots with autoclaved calcined clay; seedlings germinated separately on 0.5X MS
    plus 0.4% phytagel for 3–5 days. Pot watering schedules and SynCom/buffer amendment are scoped in treatment_arms.
    Host chamber humidity was 50%; this temperature is not asserted for isolate preparation.
