    manner. MA-N2 sp. RCC-150 showed root-tip enrichment under drought and salt stress; some other strains were
    instead enriched at the base. HYPOTHESIZED - exudate-guided recruitment and metabolite return could contribute,
    but isolate carbon-use assays and spatial relative abundance do not trace migration, exchange or selective
    mediation of recovery. The 15 entries identify the sequenced panel, not a uniform root-tip preference. No
    movement of individually tracked cells was measured.
