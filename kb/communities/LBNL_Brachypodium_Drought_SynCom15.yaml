id: CommunityMech:000088
name: LBNL Brachypodium Drought SynCom15
description: The defined 15-stock bacterial inoculum assembled from Brachypodium rhizobiome isolates. In plant
  experiments it improved measured growth endpoints after drought followed by rewatering; sustained drought did
  not show those improvements. The administered SynCom is not the complete observed root microbiome, which also
  contained other bacteria. Liquid-culture persistence was unequal.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Test a network- and cultivation-guided 15-stock bacterial inoculum for persistence and effects on
    Brachypodium under drought, rewatering and salinity.
  assembly_strategy: Network analysis and cultivation-guided selection of 15 rhizobiome strains spanning five
    bacterial phyla.
  perturbation_design: Separate three-week weekly-transfer liquid assay and host control/drought/rewatered-drought/salinity
    arms with SynCom or buffer.
  measurement_endpoints:
  - SynCom stability
  - plant recovery from drought
  - root-tip colonization
  - plant growth-promoting traits
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we present a systematic approach using a combination of network analysis and cultivation-guided
      methods to construct a 15-member SynCom from the rhizobiome of Brachypodium distachyon.
    explanation: Supports the defined synthetic community design and represented community context.
  inoculation_strategy: 'Distinct preparations: 5 mL liquid-assay inoculum contained 4x10^7 cells of each member
    and was added to 45 mL 0.2X MS. For plant experiments, individual suspensions were adjusted to 4.1x10^7 cells
    before final inoculum preparation; plants received 1 mL of mixed inoculum in 30 mM phosphate buffer. The preparation
    count is not asserted as cells/mL or a per-plant dose.'
environment_term:
  preferred_term: laboratory environment
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Physical setting of chamber-grown liquid cultures and potted Brachypodium in autoclaved calcined clay;
    original rhizobiome provenance is not the liquid assay substrate.
