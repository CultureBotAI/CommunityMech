related_ingredients:
- preferred_term: trehalose
  chebi_term:
    id: CHEBI:27082
    label: trehalose
  relevance: Osmoprotectant disaccharide whose biosynthesis genes were detected in SynCom-member
    genomes — implicated in the Brachypodium drought-stress resilience the SynCom confers.
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Genomic analysis of the individual strains was performed to reveal encoded plant growth-promoting
      traits, including genes for the synthesis of osmoprotectants (trehalose and betaine)
    explanation: Identifies trehalose biosynthesis as an encoded osmoprotectant trait of the SynCom
      members.
- preferred_term: glycine betaine
  chebi_term:
    id: CHEBI:17750
    label: glycine betaine
  relevance: The second of two osmoprotectants whose biosynthesis genes are encoded by SynCom-member
    genomes — contributes to SynCom-mediated drought tolerance in Brachypodium.
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: encoded plant growth-promoting traits, including genes for the synthesis of osmoprotectants
      (trehalose and betaine)
    explanation: Identifies glycine betaine biosynthesis as an encoded osmoprotectant trait of the SynCom
      members.
growth_media:
- name: R2A (SynCom member cultivation); 0.2X MS for in-planta drought assay
  temperature: '24'
  temperature_unit: °C
  incubation_time: '24-72'
  incubation_time_unit: h
  light_regime: 16-h light, 8-h dark
  preparation_notes: SynCom member isolates grown in R2A to log phase, then combined
    at equal cell numbers (4x10^7 cells each) and applied to Brachypodium distachyon
    in 0.2X Murashige and Skoog (MS) medium; plants held in a growth chamber at 24°C,
    16-h light, 50% humidity. Strains were originally isolated on 1X R2A and RCH2
    minimal media incubated at 30°C in the dark for 7 days.
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Individual SynCom isolates were cultivated in R2A media for 24–72 h until
      they reached log phase
    explanation: Names R2A medium and 24–72 h cultivation to log phase for the SynCom
      member strains.
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mixture was incubated in a plant growth chamber with conditions set
      at 16-h light, 24°C temperature, and 50% humidity.
    explanation: Gives the in-planta growth-chamber conditions (24°C, 16-h light,
      50% humidity) for the SynCom drought assay.
cultivation_setup:
- cultivation_mode: SEMI_CONTINUOUS
  system_type: OTHER
  instrument_detail: Plant growth chamber, 16 h light, 50% relative humidity.
  working_volume: 50.0
  working_volume_unit: mL
  operating_temperature: 24.0
  operating_temperature_unit: °C
  controls_notes: 5 mL inoculum containing equal cell numbers (4 x 10^7 cells) of each
    of the 15 members into 45 mL of 0.2X Murashige and Skoog medium; 5 mL transferred
    into 45 mL fresh medium weekly over three weeks.
  notes: This is the in vitro persistence experiment, where the 15 members were grown
    together as a community and tracked by 16S over three weeks. It is not the in
    planta work in the same paper, where the SynCom is inoculated at the base of the
    shoot and the conditions are the plant's.
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we cultured 5 mL of the inoculum, containing equal cell numbers (4×107
      cells) of each SynCom member, in 45 mL of 0.2X MS (Murashige and Skoog) media
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The mixture was incubated in a plant growth chamber with conditions set
      at 16-h light, 24°C temperature, and 50% humidity
