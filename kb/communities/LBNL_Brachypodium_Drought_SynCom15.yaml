ecological_interactions:
- name: Genomic Osmoprotectant and Ion-Transport Prediction
  description: Genome annotations of individual members predict osmoprotectant and ion-transport potential, including
    trehalose/betaine-related genes. PARTIAL - gene presence does not establish expression, synthesis, secretion,
    transfer to Brachypodium or necessary mediation of drought recovery. This is member functional potential, not
    demonstrated interstrain cross-feeding.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: trehalose
    term:
      id: CHEBI:27082
      label: trehalose
    notes: Contextual genome-predicted osmoprotectant potential, not measured transfer or host delivery.
  - preferred_term: glycine betaine
    term:
      id: CHEBI:17750
      label: glycine betaine
    notes: Contextual genome-predicted osmoprotectant potential, not measured transfer or host delivery.
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40862137
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Genomic analysis of the individual strains was performed to reveal encoded plant growth-promoting traits
    explanation: Supports encoded functional potential; no expression, flux or necessary host-protection mechanism
      is established.
  - reference: PMID:40862137
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: genes for the synthesis of osmoprotectants (trehalose and betaine) and Na+/K+ transporters
    explanation: Supports encoded functional potential; no expression, flux or necessary host-protection mechanism
      is established.
  participating_taxa:
  - preferred_term: Brachypodium rhizobiome bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Member-Level PGP Phenotypes
  description: Individual SynCom isolates showed positive results in selected plant-growth-promoting trait assays,
    including colorimetric and substrate-depletion readouts. These are member-level phenotypes, not direct community
    flux measurements. PARTIAL - their contribution to plant recovery, and the roles of specific metabolites or
    enzymes in planta, were not selectively established.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: some predicted traits were validated by laboratory phenotypic assays
    explanation: Supports positive isolate-level phenotypic assays, not validation of every genomic prediction or
      a necessary plant-benefit mediator.
  participating_taxa:
  - preferred_term: Brachypodium rhizobiome bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Host-Associated Persistence Compared With Liquid Culture
  description: The 15-member inoculum showed more balanced 16S relative profiles with Brachypodium than in liquid
    culture. In the three-week weekly-transfer 0.2X MS experiment, six strains were undetectable or below 0.1% relative
    abundance; three taxa dominated. Plant experiments reported persistence of members, with unequal abundances.
    These sequencing observations do not establish equal stability of all 15 strains in vitro, absolute viable counts
    or reciprocal mutualism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: After 3 weeks of growth in planta, the relative abundance of strains was more evenly distributed
    explanation: Direct in-planta Results supporting host-associated relative persistence; paired with a separate
      in-vitro excerpt showing loss or low detection of six strains.
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: six of the 15 strains were undetectable or had a relative abundance below 0.1% after 3 weeks
    explanation: 'Direct Results qualification of the broad stability abstract: six strains were undetectable or
      below 0.1% after three weeks in vitro.'
  participating_taxa:
  - preferred_term: Brachypodium rhizobiome bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Brachypodium Drought Recovery Promotion
  description: SynCom-amended Brachypodium showed better shoot weight, shoot height, root length and leaf-number
    outcomes after drought followed by rewatering than unamended plants. The Results report no significant differences
    in these endpoints during sustained drought. PARTIAL - osmoprotectant and ion-transporter genes are proposed
    contributors, not selectively demonstrated causes of recovery.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:40862137
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: plants amended with the SynCom recovered better than those without
    explanation: Supports positive whole-plant recovery after rewatering, not significant improvement during sustained
      drought or demonstrated gene/metabolite mediation.
  participating_taxa:
  - preferred_term: Brachypodium rhizobiome bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Strain-Dependent Root Spatial Distribution
  description: After 21 days, 16S profiles differed between root tips and bases in a strain- and condition-dependent
    manner. MA-N2 sp. RCC-150 showed root-tip enrichment under drought and salt stress; some other strains were
    instead enriched at the base. HYPOTHESIZED - exudate-guided recruitment and metabolite return could contribute,
    but isolate carbon-use assays and spatial relative abundance do not trace migration, exchange or selective mediation
    of recovery.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:40862137
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: preferential colonization of SynCom strains around root tips under stress
    explanation: Supports the observed spatial pattern and the source-proposed root-metabolite explanation; does
      not establish uniform tip preference, traced migration or metabolic exchange.
  - reference: PMID:40862137
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: likely due to active interactions between plant root metabolites and bacteria
    explanation: Supports the observed spatial pattern and the source-proposed root-metabolite explanation; does
      not establish uniform tip preference, traced migration or metabolic exchange.
  participating_taxa:
  - preferred_term: Brachypodium rhizobiome bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
