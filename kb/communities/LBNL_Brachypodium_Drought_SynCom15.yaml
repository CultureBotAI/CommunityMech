      the dark for seven days.
- name: R2A for individual-isolate inoculum preparation
  incubation_time: 24-72
  incubation_time_unit: h
  preparation_notes: Individual isolates were grown to log phase, purity checked, washed three times and resuspended
    in 30 mM phosphate buffer. SYBR-green flow cytometry informed equal cell-number adjustment to 4.1x10^7 cells
    for the final plant inoculum. The source does not specify the temperature of this preparation step; plant
    chamber conditions are not borrowed.
