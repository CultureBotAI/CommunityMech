      name it. This quotation supports the paper stock name. Current taxon/assembly identity is separately supported
      by BioSample SAMN42017412 and its linked BioProject, as recorded in strain_designation notes; those accessions
      are not claimed to appear in this paper quotation.
  abundance_observations:
  - treatment_arm_id: liquid-ms
    timepoint_id: inoculum
    measurement_basis: source-reported cell count in the 5 mL starting inoculum; not a concentration, viable count
      or 16S read fraction
    absolute_abundance: 40000000.0
    absolute_abundance_unit: cells per member in the starting 5 mL inoculum
    description: Methods reports equal 4x10^7 cells of each member for the liquid assay. This is distinct from
      the 4.1x10^7 preparation count for plant inoculation.
    evidence:
    - reference: PMID:40862137
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: containing equal cell numbers
      explanation: Methods/Testing the persistence of the SynCom in vitro gives the 4x10^7 cell count in the 5
        mL inoculum; no concentration conversion is made.
