id: CommunityMech:000485
name: Dexing Copper Mine Bioleaching Heap Surface Community
description: An acidophilic chemolithoautotrophic microbial community inhabiting the surface layer of industrially bioleached
  low-grade copper tailings at the Dexing Copper Mine heap (Jiangxi Province, China), dominated by Acidithiobacillus ferrivorans-like
  and Acidithiobacillus ferrooxidans-like populations alongside Thiobacillus-like and Leptospirillum ferrooxidans-like guilds
  that partition Calvin-Benson-Bassham and rTCA carbon fixation, nitrogen fixation, ferrous iron oxidation, sulfur oxidation,
  and hydroxyl radical detoxification (PMID:26781463, doi:10.1186/s12863-016-0330-4).
