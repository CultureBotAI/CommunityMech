    description: Aerobic Fe(II) oxidation in acidic tailings generates Fenton-type reactive oxygen stress that requires community
      peroxiredoxin detoxification.
  evidence:
  - reference: PMID:26781463
    supports: SUPPORT
    evidence_source: FIELD_STUDY
    snippet: Functional analysis illustrated that the principal participants related to the key metabolic pathways (carbon
      fixation, nitrogen metabolism, Fe(II) oxidation and sulfur metabolism) were mainly identified to be Acidithiobacillus-like,
      Thiobacillus-like and Leptospirillum-like microorganisms, indicating their vital roles.
    explanation: Establishes the division of Fe(II) oxidation and sulfur metabolism across Acidithiobacillus, Thiobacillus,
      and Leptospirillum.
  - reference: doi:10.1186/s12863-016-0330-4
