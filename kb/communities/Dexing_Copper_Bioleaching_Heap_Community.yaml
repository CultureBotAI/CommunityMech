    supports: SUPPORT
    evidence_source: FIELD_STUDY
    snippet: Our results indicated that genes coding for Rubisco were enriched in the metagenome, most of which were affiliated
      with Acidithiobacillus-like populations (Additional file 5 ).
    explanation: Documents Rubisco enrichment in Acidithiobacillus-like populations for autotrophic carbon fixation.
  - reference: doi:10.1186/s12863-016-0330-4
    supports: SUPPORT
