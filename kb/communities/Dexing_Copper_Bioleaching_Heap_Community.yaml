      coding genes (LcPxn1, LcPxn3 and LdPxn1) were mostly assigned to a Leptospirillum-like populations, indicating its key
      role in the detoxification of hydroxyl radicals.
    explanation: Links Leptospirillum-like peroxiredoxin genes to hydroxyl radical detoxification in the bioleaching heap.
