    label: mine tailing
  notes: Surface-layer low-grade copper mine tailings undergoing industrial acid bioleaching at the Dexing Copper Mine heap,
    Jiangxi Province, China (PMID:26781463, doi:10.1186/s12863-016-0330-4).
