    snippet: The relevant genes were largely found in Leptospirillum-like and had the highest similarity to those from L.
      ferrooxidans-like species, suggesting the vital position of Leptospirillum-like organisms in bioleaching systems with
      limited fixed nitrogen from external sources.
    explanation: Documents nitrogen fixation gene enrichment in L. ferrooxidans-like populations.
- name: Coupled Ferrous Iron and Reduced Sulfur Oxidation in Copper Tailings
