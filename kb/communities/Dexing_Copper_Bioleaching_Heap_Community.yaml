  description: Acidithiobacillus, Thiobacillus, and Leptospirillum ferrooxidans partition autotrophic carbon fixation (Rubisco
    and PRK in the CBB cycle alongside rTCA enzymes) and nitrogen fixation/assimilation to sustain primary production in nutrient-poor
    acidic copper tailings.
