    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom C1, composed of four different Pseudomonas members, significantly reduced wheat root rot and
      increased root weight, compared with the controls
    explanation: Supports the host-protection outcome measured for the whole C1 consortium.
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: None of them was significantly better than a single strain
    explanation: Bounds claims of emergent superiority without erasing the significant C1 host outcome.
