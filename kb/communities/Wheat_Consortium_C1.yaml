growth_media:
- name: 1/4 x tryptic soy agar (TSA)
  temperature: '25'
  temperature_unit: °C
  incubation_time: '48'
  incubation_time_unit: h
  vessel_type: Petri dish
  preparation_notes: Wheat-rhizosphere strains were maintained on 1/4x TSA / 1x
    TSB at 25°C; SynCom members were grown on 1/4x TSA plates before assembly.
    Liquid TSB cultures were grown shaking at 250 rpm, 25°C.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each bacterium was grown in a Petri dish with 1/4 x TSA medium at 25°C
      for 48 h
    explanation: Reports the medium, temperature and incubation time for SynCom
      member cultivation.
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: were grown on 1/4 x tryptic soy agar/1 x tryptic soy broth (TSA/TSB,
      BD, Franklin Lakes, NJ) at 25°C
    explanation: Confirms the TSA/TSB medium and 25°C maintenance temperature for
      the strains.
