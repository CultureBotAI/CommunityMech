id: CommunityMech:000076
name: Wheat Synthetic Consortium C1
description: 'A four-member wheat-rhizosphere synthetic consortium (SynCom 1/C1)
  composed of Pseudomonas sp. B5, Pseudomonas sp. B11, Pseudomonas sp. B12, and
  Pseudomonas sp. P25. Yin et al. reported that C1 inhibited Rhizoctonia solani
  AG8 radial growth in dual culture and significantly reduced wheat root rot
  while increasing wheat fresh root weight under AG8 challenge.

  '
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: RHIZOSPHERE
engineering_design:
  objective: Test whether a four-Pseudomonas wheat-rhizosphere SynCom could inhibit
    Rhizoctonia solani AG8 and protect wheat from root rot.
  assembly_strategy: Bottom-up assembly of four Pseudomonas isolates from a wheat
    rhizosphere strain collection as SynCom 1.
  measurement_endpoints:
  - In vitro Rhizoctonia solani AG8 radial-growth inhibition by dual culture
  - Wheat root rot score and fresh root weight under AG8 challenge
  - Auxin production by SynCom culture supernatants
  - Volatile, hydrogen cyanide, and cell-free supernatant effects on AG8
  notes: SynCom 1 grouped four Pseudomonas isolates from the 14-member antifungal
    strain panel and the paper compared whole-SynCom outcomes with individual
    strain phenotypes.
  perturbation_design: The designed assay panel compared water controls, 14 single
    wheat-rhizosphere isolates, and 10 SynCom mixtures across AG8 inhibition,
    auxin, volatile, hydrogen cyanide, and cell-free supernatant phenotypes.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 1(C1) Pseudomonas sp. B5, Pseudomonas sp. B11, Pseudomonas
      sp. B12, Pseudomonas sp. P25
    explanation: Table 1 names the four Pseudomonas isolates that make up SynCom
      1.
