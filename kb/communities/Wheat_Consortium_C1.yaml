ecological_interactions:
- name: C1 SynCom inhibition of R. solani AG8 radial growth
  description: The assembled C1 inhibited Rhizoctonia solani AG8 radial growth in dual culture, with reported inhibition
    of 37.00% (SD 6.57) in Table 2. This is a positive fungal-growth outcome, not evidence that both bacterial and
    fungal fitness declined. Plate inhibition does not establish the mediator or guarantee host protection.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. B5
    term:
