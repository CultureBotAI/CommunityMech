related_ingredients:
- preferred_term: indole-3-acetic acid
  chebi_term:
    id: CHEBI:16411
    label: indole-3-acetic acid
  relevance: Bacterial auxin produced by all 10 SynComs in Yin et al. 2022 — the IAA concentration
    correlates negatively with primary root length, indicating IAA-mediated root growth modulation as
    a SynCom-driven plant-physiology effect.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a large proportion of the tested bacteria, including 10 single strains and all 10 SynComs,
      produced auxin at various concentrations
    explanation: Names auxin (IAA) production as a SynCom-wide trait correlated with Arabidopsis root
      growth changes.
- preferred_term: hydrogen cyanide
  chebi_term:
    id: CHEBI:18407
    label: hydrogen cyanide
  relevance: Antifungal volatile produced by Pseudomonas sp. P25 in the wheat-rhizosphere strain
    collection — one of the antagonistic mechanisms tested against Rhizoctonia solani AG8 in Yin
    et al. 2022.
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Some bacteria can produce hydrogen cyanide, an inorganic compound, that showed antagonistic
      activity against pathogens
    explanation: Establishes hydrogen cyanide as a tested antifungal mechanism in the SynCom-member
      collection.
