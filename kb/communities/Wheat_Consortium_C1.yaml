    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In vitro dual-culture assay showed eight SynComs, including C1-C4, C6-C8, and C10, inhibited the growth
      of R. solani AG8 to varying degrees
    explanation: Places C1 among the SynComs with significant AG8 radial-growth inhibition.
  - reference: PMID:36118206
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom 1(C1)37.00 ± 6.57
    explanation: Table 2 reports the whole-mixture plate inhibition estimate and standard deviation.
- name: C1 SynCom protection of wheat under AG8 challenge
  description: C1 reduced root-rot scores and increased fresh root weight of AG8-challenged Alpowa wheat in the
    three-week greenhouse soil assay. Preserve this positive whole-mixture benefit. The study did not show superiority
    over the best individual strain or establish reciprocal microbial benefit, bilateral competition, inoculum persistence,
    or a unique IAA/volatile mechanism. Only B5 among the four C1 members significantly reduced disease when tested
    individually.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Pseudomonas sp. B5
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. B11
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. B12
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  - preferred_term: Pseudomonas sp. P25
    term:
