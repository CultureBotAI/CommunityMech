discussions:
- discussion_id: c1_causal_scope_batch121
  prompt: Which processes explain C1 protection beyond its separate laboratory phenotypes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#C1 SynCom inhibition of R. solani AG8 radial growth
  - ecological_interactions#C1 SynCom protection of wheat under AG8 challenge
  rationale: C1 is protective in soil, yet individual-versus-mixture phenotypes differ. The paper reports no antifungal
    activity from any SynCom cell-free supernatant and identifies C2-C4/C7, not C1, as significant volatile mixtures.
    Lower C1 auxin and volatile outputs are not selective proof that these routes are impossible. Inoculum persistence
    was explicitly not assessed. Equal-ratio preparation remains in metadata and the earlier removal of workflow
    arrows remains intact.
  evidence:
  - reference: PMID:36118206
    snippet: None of them was significantly better than a single strain
  - reference: PMID:36118206
    snippet: the cell-free supernatants from the rest of the eight bacteria and 10 SynComs did not show any antifungal
      activities
  - reference: PMID:36118206
    snippet: While not assessed here, investigation of the fate of those inoculations in the soil after plant growth
      is needed to address their persistence and stability
  posed_by: codex
  posed_date: '2026-10-08'
