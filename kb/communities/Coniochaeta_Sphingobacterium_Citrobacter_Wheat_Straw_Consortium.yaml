    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:31769802
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: inter-kingdom interactions (e.g. amensalism)
    explanation: Supports a competitive or inhibitory interaction signal among fungal and bacterial members.
