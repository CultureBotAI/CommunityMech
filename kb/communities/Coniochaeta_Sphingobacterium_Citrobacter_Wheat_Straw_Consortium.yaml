id: CommunityMech:000195
name: Coniochaeta-Sphingobacterium-Citrobacter Wheat Straw Consortium
description: >
  A three-member bacterial-fungal synthetic consortium cultivated on wheat straw
  to study division of labor during lignocellulose degradation. The community
  combines the fungus Coniochaeta sp. 2T2.1 with the bacterium originally
  reported as Sphingobacterium multivorum w15 and later proposed as
  Sphingobacterium paramultivorum w15, plus Citrobacter freundii so4. The
  system is relevant to DOE bioenergy because it links a Joint Genome Institute
  fungal genome resource to transcriptomic and metatranscriptomic evidence for
  cellulose, xylan, hemicellulose, lignin-modification, detoxification, and
  vitamin B2-associated functions in a model lignocellulose-degrading
  consortium.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Resolve eco-enzymological roles of fungal and bacterial members in a wheat
    straw-degrading synthetic consortium.
  assembly_strategy: Combine Coniochaeta sp. 2T2.1 with Sphingobacterium w15 and
    Citrobacter freundii so4 in wheat straw-driven cultures.
  perturbation_design: Compare fungal monoculture with the tripartite consortium
    and, in a later exact-composition study, compare consortium metatranscriptomes
    at 180 and 60 rpm across early, middle, and late time points.
  measurement_endpoints:
  - Fungal transcriptome response
  - Metatranscriptomic CAZy expression
  - Wheat straw degradation percentage
  - Hemicellulose degradation functions
  - Lignin-modification gene expression
  - Vitamin B2-associated gene expression
  evidence:
  - reference: PMID:31769802
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: wheat straw-driven cultures
    explanation: Supports wheat straw as the experimental substrate and design context.
  - reference: PMID:36991472
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: two shaking speeds (180 and 60 rpm)
    explanation: Supports the later exact-composition shaking-speed perturbation design.
