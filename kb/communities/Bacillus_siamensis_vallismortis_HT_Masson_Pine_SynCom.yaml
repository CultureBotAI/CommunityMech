id: CommunityMech:000347
name: Bacillus siamensis-vallismortis HT Masson Pine SynCom
description: >-
  A two-strain HT synthetic plant growth-promoting rhizobacterial community
  assembled from Trichoderma koningiopsis-conditioned Pinus massoniana
  rhizosphere isolates. The community combines Bacillus siamensis RW5 and
  Bacillus vallismortis RW8 and was tested against Fusarium oxysporum
  damping-off in Masson pine seedlings. Relative to the pathogen challenge
  control, HT reduced disease incidence by 36.67%, increased seedling height by
  9.44%, enhanced protective enzyme activity, alleviated membrane damage, and
  activated the resistance genes PR1, FLS2, and CAT1.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: >-
    Build a simplified PGPR SynCom from Trichoderma koningiopsis-conditioned
    Masson pine rhizosphere isolates and test whether the reduced community
    suppresses Fusarium oxysporum damping-off while promoting Pinus massoniana
    seedling growth.
  assembly_strategy: >-
    Profile the bacterial community enriched by T. koningiopsis in the Masson
    pine rhizosphere, isolate PGPR strains from the T. koningiopsis-inoculated
    treatment, screen them for F. oxysporum inhibition, and combine Bacillus
    siamensis RW5 with Bacillus vallismortis RW8 as the two-member HT SynCom.
  perturbation_design: >-
    Compare individual inhibitory isolates and synthetic communities for in
    vitro F. oxysporum inhibition, then challenge Masson pine seedlings with
    F. oxysporum with or without SynCom inoculation.
  measurement_endpoints:
  - F. oxysporum inhibitory effect
  - Masson pine damping-off disease incidence
  - Masson pine seedling height
  - Protective enzyme activity and membrane-damage physiology
  - Plant hormone and MAPK signaling gene expression
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Synthetic PGPR communities were constructed from isolated strains to
      validate their effects on disease suppression and growth promotion.
    explanation: >-
      Supports the isolated-strain PGPR SynCom construction strategy.
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: HT = RW5, RW8
    explanation: >-
      Figure 4 defines HT as a reduced two-strain SynCom containing RW5 and RW8.
