ecological_interactions:
- name: HT SynCom Suppression of Fusarium oxysporum
  description: The two-member HT SynCom, B. siamensis RW5 plus B. vallismortis RW8, was among four mixtures inhibiting
    Fusarium oxysporum more strongly than individual isolates in vitro. This is measured inhibition, not demonstrated
    reciprocal competitive harm or proof that plate inhibition mediates seedling protection. HT is distinct from
    the five-member C2 mixture.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Fusarium oxysporum
    term:
      id: NCBITaxon:5507
      label: Fusarium oxysporum
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Four synthetic communities (SynComs) (C1, C2, HT, and 2K) were further constructed, exhibiting superior
      inhibitory effects against F. oxysporum compared to individual strains.
    explanation: Supports HT as one of four constructed SynComs that inhibited the fungal pathogen more strongly
      than individual isolates.
- name: HT SynCom Masson Pine Damping-Off Protection
  description: HT inoculation increased Fusarium-challenged Masson pine seedling height by 9.44% and reduced disease
    incidence by 36.67% relative to the control. These are HT-specific plant outcomes, not demonstrated reciprocal
    benefit to the bacteria or proof that defense expression is downstream of protection.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Pinus massoniana
    term:
      id: NCBITaxon:88730
      label: Pinus massoniana
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Compared to the control, the C2 and HT SynComs increased seedling height by 10.18% and 9.44%, and reduced
      disease incidence by 50% and 36.67%, respectively.
    explanation: 'Supports the HT in vivo outcome: 9.44% higher seedling height and 36.67% lower disease incidence
      in Masson pine seedlings.'
- name: Protective Enzyme and Resistance-Gene Activation
  description: C2 and HT treatments enhanced protective enzyme activity, reduced membrane injury and altered PR1,
    FLS2 and CAT1 expression. PARTIAL - plant-hormone and MAPK signaling mediation is the source's interpretation;
    expression and parallel physiological outcomes do not alone establish pathway necessity.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Pinus massoniana
    term:
      id: NCBITaxon:88730
      label: Pinus massoniana
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: These treatments also enhanced protective enzyme activity and alleviated membrane damage.
    explanation: Supports the host physiology arm of the HT and C2 protection response.
  - reference: PMID:42144568
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: At the molecular level, the C2 and HT SynComs boost plant resistance by modulating the plant hormone
      and mitogen-activated protein kinase (MAPK) signaling pathways, thereby activating the expression of crucial
      resistance genes such as PR1, FLS2, and CAT1.
    explanation: Supports reported expression and the source's signaling interpretation; necessary pathway mediation
      was not verified from the abstract and selected composition excerpts.
