ecological_interactions:
- name: HT SynCom Suppression of Fusarium oxysporum
  description: >-
    The two-member HT PGPR SynCom, composed of B. siamensis RW5 and
    B. vallismortis RW8, suppresses Fusarium oxysporum more effectively than the
    individual inhibitory isolates and links a T. koningiopsis-assembled Bacillus
    pair to fungal damping-off biocontrol.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Fusarium oxysporum
    term:
      id: NCBITaxon:5507
      label: Fusarium oxysporum
  downstream:
  - target: HT SynCom Masson Pine Damping-Off Protection
    description: >-
      In vitro suppression of F. oxysporum was carried into seedling challenge
      assays, where HT reduced disease incidence and promoted Masson pine
      growth.
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Four synthetic communities (SynComs) (C1, C2, HT, and 2K) were further
      constructed, exhibiting superior inhibitory effects against F. oxysporum
      compared to individual strains.
    explanation: >-
      Supports HT as one of four constructed SynComs that inhibited the fungal
      pathogen more strongly than individual isolates.
- name: HT SynCom Masson Pine Damping-Off Protection
  description: >-
    HT inoculation protects Fusarium-challenged Pinus massoniana seedlings by
    reducing damping-off disease incidence by 36.67%, increasing seedling height
    by 9.44%, enhancing protective enzyme activity, alleviating membrane damage,
    and modulating plant hormone and MAPK signaling to activate PR1, FLS2, and
    CAT1.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Pinus massoniana
    term:
      id: NCBITaxon:88730
      label: Pinus massoniana
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  downstream:
  - target: Protective Enzyme and Resistance-Gene Activation
    description: >-
      The disease-suppressive C2 and HT SynComs also enhanced protective enzyme
      activity, reduced membrane injury, and activated plant defense genes.
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Compared to the control, the C2 and HT SynComs increased seedling height
      by 10.18% and 9.44%, and reduced disease incidence by 50% and 36.67%,
      respectively.
    explanation: >-
      Supports the HT in vivo outcome: 9.44% higher seedling height and 36.67%
      lower disease incidence in Masson pine seedlings.
- name: Protective Enzyme and Resistance-Gene Activation
  description: >-
    C2 and HT treatment enhanced protective enzyme activity, alleviated membrane
    damage, and upregulated key Masson pine resistance genes downstream of plant
    hormone and MAPK signaling pathways.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Pinus massoniana
    term:
      id: NCBITaxon:88730
      label: Pinus massoniana
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      These treatments also enhanced protective enzyme activity and alleviated
      membrane damage.
    explanation: >-
      Supports the host physiology arm of the HT and C2 protection response.
  - reference: PMID:42144568
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      At the molecular level, the C2 and HT SynComs boost plant resistance by
      modulating the plant hormone and mitogen-activated protein kinase (MAPK)
      signaling pathways, thereby activating the expression of crucial
      resistance genes such as PR1, FLS2, and CAT1.
    explanation: >-
      Supports the plant defense signaling response associated with C2 and HT.
