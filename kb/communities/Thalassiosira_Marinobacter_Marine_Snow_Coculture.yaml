- name: Chemotaxis-Mediated Attachment
  description: Diatom homogenate or culture supernatant attracted HP15, and chemotaxis-associated mutants had a
    smaller attached bacterial fraction in coculture than wild type. These perturbations support HP15 chemotaxis/motility
    contributions to bacterial attachment to the diatom, not a demonstrated growth or colonization benefit to the
    diatom. Mutant biofilm impairment was assayed on abiotic surfaces and is distinct from diatom aggregation.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Marinobacter adhaerens HP15
    term:
      id: NCBITaxon:225937
      label: Marinobacter adhaerens HP15
  target_taxon:
    preferred_term: Thalassiosira weissflogii
    term:
      id: NCBITaxon:1577725
      label: Conticribra weissflogii
  biological_processes:
  - preferred_term: chemotaxis
    term:
      id: GO:0006935
      label: chemotaxis
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Condition-Dependent Diatom Aggregation
    description: 'HYPOTHESIZED: chemotaxis-dependent attachment may enable the close association underlying the
      earlier HP15 aggregation phenotype. The reviewed chemotaxis abstract demonstrates reduced attachment, not
      selective mediation of the aggregation endpoint; aggregation effects cannot be assumed in every environmental
      treatment.'
  evidence:
  - reference: PMID:22820333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: chemotaxis might be important for the interaction of M. adhaerens with diatoms
    explanation: Supports chemotaxis as an interaction mechanism in M. adhaerens.
  - reference: PMID:22820333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the fraction of bacteria attaching to the diatom decreased significantly for mutants
    explanation: Supports attachment impairment in chemotaxis mutants relative to wild-type HP15.
- name: Aggregate Sinking and Carbon Export Interpretation
  description: The existing marine-snow model interpretation concerns measured aggregate sinking and possible carbon
    export, not ecological niche partitioning. In the 2011 assay, aggregate size predicted sinking velocity while
    bacterial presence did not change the size-sinking relationship. Warmer 2014 treatments had depressed aggregation
    and sinking, especially with acidification. A resulting reduction in ocean carbon sequestration is an extrapolation,
    not a measured field flux or a demonstrated universal HP15 benefit.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
    notes: CO2/pCO2 is a photosynthetic substrate and imposed environmental condition, not a demonstrated exchanged
      product of this outcome.
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:20827289
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: may enhance the efficiency of the biological pump
    explanation: The abstract proposes biological-pump relevance; it does not report measured ocean carbon export.
  - reference: PMID:25375640
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: potentially reduced carbon sequestration after diatom blooms
    explanation: Carbon sequestration is explicitly a conditional extrapolation of laboratory aggregate measurements.
  participating_taxa:
