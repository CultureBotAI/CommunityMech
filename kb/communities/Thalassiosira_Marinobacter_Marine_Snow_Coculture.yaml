discussions:
- discussion_id: hp15-aggregation-mediation-and-conditions
  prompt: Which attachment and polymer properties causally control HP15-associated aggregation under each assay
    condition?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: 'Mutant attachment, aggregate-free TEP, total TEP, aggregation and sinking are distinct measurements.
    Polymer chemistry/stickiness and exact mediation remain unresolved; the 2014 null bacterial effects and inverse
    temperature response constrain the earlier model. Full chemotaxis and MEPS bodies were not available for this
    review. Non-graph overstatements are tracked in #1884.'
  attaches_to:
  - ecological_interactions#Condition-Dependent Diatom Aggregation
  - ecological_interactions#Condition-Dependent TEP Formation
  - ecological_interactions#Chemotaxis-Mediated Attachment
  - ecological_interactions#Aggregate Sinking and Carbon Export Interpretation
  evidence:
  - reference: PMID:25375640
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: aggregation rates and sinking velocity of aggregates were depressed in warmer treatments
    explanation: The abstract supplies a direct counterexample to universally increased aggregation with increased
      TEP.
  posed_by: codex
