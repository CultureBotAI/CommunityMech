id: CommunityMech:000259
name: Thalassiosira-Marinobacter Marine Snow Coculture
description: >
  A defined marine diatom-bacterium coculture pairing the centric diatom
  Thalassiosira weissflogii, currently represented in NCBI Taxonomy as
  Conticribra weissflogii, with the diatom-attaching heterotrophic bacterium
  Marinobacter adhaerens HP15. The system is used to study phycosphere
  attachment, transparent exopolymer particle formation, aggregate formation,
  and sinking-particle processes relevant to the marine biological carbon pump.
  Multiple publications use the same exact diatom-bacterium model, including
  studies of aggregation requirements, chemotaxis-mediated attachment, and
  temperature/pCO2 perturbations.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: PHYTOPLANKTON
engineering_design:
  objective: >
    Establish a tractable two-member diatom-bacterium model for testing how
    diatom-attaching bacteria alter TEP production, aggregation, attachment,
    and sinking-particle dynamics.
  assembly_strategy: >
    Incubate photosynthetically active T. weissflogii cultures with the
    attaching bacterial strain Marinobacter adhaerens HP15 in controlled
    laboratory marine coculture assays.
  perturbation_design: >
    Compare axenic diatom controls and cocultures with attaching or
    non-attaching bacterial isolates; follow-up exact-composition studies
    tested chemotaxis mutants and varied temperature and pCO2.
  measurement_endpoints:
  - diatom aggregate formation
  - transparent exopolymer particle abundance
  - aggregate sinking velocity
  - bacterial attachment to diatom cells and TEP aggregates
  evidence:
  - reference: PMID:20827289
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The role of individual T. weissflogii-attaching and free-living new bacterial isolates for TEP production and diatom aggregation was investigated in vitro.
    explanation: Supports the laboratory design around T. weissflogii-attaching bacterial isolates and aggregation endpoints.
