    explanation: Supports M. adhaerens HP15 as the bacterial member in the exact model.
ecological_interactions:
- name: Condition-Dependent Diatom Aggregation
  description: In the 2011 rolling-tank assay, active T. weissflogii cocultured with attaching bacteria including
    HP15 formed substantially more aggregates than axenic controls. This is a community aggregation outcome, not
    a universal bacterial requirement or a separate colonization interaction. The 2014 temperature/pCO2 experiment
    found no effect of HP15 on total aggregate volume. Inactivated cells in the 2011 Results aggregated much less,
    not uniformly zero; the inactivation treatment may also have altered exudates and surface properties, so it
    does not isolate photosynthesis as the sole mediator.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:20827289
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: specific diatom-attaching bacteria were required for aggregation
    explanation: The 2011 abstract supports the assay-specific requirement, not universal HP15 dependence across
      studies.
  - reference: PMID:20827289
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: T. weissflogii did not aggregate in axenic culture
    explanation: Axenic active-diatom controls in the 2011 assay lacked aggregation; this is not the result of every
      later experiment.
  - reference: doi:10.4056/sigs.922139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: it showed specific attachment to diatom cells. In vitro it led to exopolymer formation and aggregation
      of these algal cells to form marine snow particles
    explanation: The HP15 genome paper independently identifies the exact attaching strain and its reported aggregation
      phenotype; it does not establish universal dependence.
  - reference: PMID:25375640
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: total aggregate volume was independent of the presence of M. adhaerens HP15
    explanation: The 2014 paper explicitly reports a null bacterial effect under that experiment; this bounds the
      earlier phenotype.
  participating_taxa:
  - preferred_term: Thalassiosira weissflogii
    term:
      id: NCBITaxon:1577725
      label: Conticribra weissflogii
  - preferred_term: Marinobacter adhaerens HP15
    term:
      id: NCBITaxon:225937
      label: Marinobacter adhaerens HP15
- name: Condition-Dependent TEP Formation
  description: TEP formation and aggregation were associated with the diatom-HP15 model in earlier work. TEP is
    a measured community polymer outcome, not proof of directed feeding from the diatom to HP15. The 2014 study
    found no bacterial effect on total TEP generated; warmer treatments generated more TEP but less aggregation.
    The 2011 aggregate-free-water measurements and 2014 total-TEP measurements must not be treated as identical
    endpoints. Chitin-containing fibres in a SEM caption document physical association, not the identity of all
    TEP or a measured chitin-transfer flux.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Condition-Dependent Diatom Aggregation
    description: 'PARTIAL: TEP can provide an adhesive matrix enabling diatom aggregation, but the amount-aggregation
      relationship is condition dependent. The 2011 association is not a selective mediation test; the 2014 higher-TEP/lower-aggregation
      result rules out a universal monotonic effect, and polymer stickiness was not directly resolved.'
  evidence:
  - reference: PMID:22820333
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: induce transparent exopolymeric particle and aggregate formation
    explanation: The chemotaxis abstract recounts the model aggregation/TEP phenotype; it does not measure TEP uptake
      as food.
  - reference: PMID:20827289
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TEP formation and phytoplankton aggregation
    explanation: Supports the two measured outcomes, not a demonstration that TEP quantity alone causes aggregation.
  - reference: doi:10.3354/meps09894
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: a co-incubation sample containing the diatom Thalassiosira weissflogii (left) and Marinobacter adhaerens
      HP15 embedded in a network of chitincontaining fibres extruding from the diatom cell
    explanation: 'PARTIAL: retained caption documents HP15 in chitin-containing fibres. The full paper was not accessible;
      this does not identify all TEP or establish polymer-feeding causality.'
  - reference: PMID:25375640
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: had no effect on the amount of TEP generated
    explanation: The later experiment bounds general claims of HP15 enhancement of TEP.
  participating_taxa:
  - preferred_term: Thalassiosira weissflogii
    term:
