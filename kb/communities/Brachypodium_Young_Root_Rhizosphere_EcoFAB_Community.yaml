growth_media:
- name: natural grassland soil, Angelo Coast Range Reserve south meadow (0-10 cm), 2 mm sieved
  inoculum_source: upper 0-10 cm of soil from the south meadow field site at the Angelo Coast Range Reserve,
    northern California (39 44 21.4 N, 123 37 51.0 W), collected August 2020
  preparation_notes: Transported on ice, stored at 4 C, and passed through a 2 mm sieve; the soil is the
    growth substrate and the microbial inoculum at once, so no formulated medium exists for this record.
    Soil was deliberately NOT sterilised -- every other component was -- because the resident community
    is the subject. Seeds were de-husked, surface-sterilised in 70% ethanol then 50% household bleach
    for 5 min each, and germinated on sterile 0.8% noble agar before transfer.
  temperature: 19.9
  temperature_unit: "\xB0C"
  atmosphere: AEROBIC
  light_regime: greenhouse, 16-h photoperiod; day 19.9 C / night 17.9 C, 87.5% relative humidity
  incubation_time: 14
  incubation_time_unit: d
  vessel_type: EcoFAB (15 g soil), test tube (15 g soil) or plastic pot (600 g soil)
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "Soil for plant growth was collected from the south meadow field site at the Angelo Coast\
      \ Range Reserve in northern California (39\xB0 44\u2032 21.4\u2032\u2032 N 123\xB0 37\u2032 51.0\u2032\
      \u2032 W) in August 2020. The upper layer (0\u201310\u2009cm) was collected in clean collection\
      \ bags, immediately transported on ice and stored at 4\u2009\xB0C until further processing."
    explanation: Gives the soil source, location and date.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The collected soil was passed through a 2\u2009mm sieve to remove larger particles"
    explanation: Gives the 2 mm sieving step.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "Cold-treated Brachypodium distachyon seeds were de-husked, surface-sterilized in 70% ethanol\
      \ followed by 50% household bleach for 5\u2009min each and rinsed thoroughly in sterile water. They\
      \ were germinated on sterile 0.8% noble agar plates under sunlight at room temperature for two days."
    explanation: Gives seed surface-sterilisation and germination on noble agar.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Except for soil, all components were sterilized by UV sterilization or autoclaving. In addition,
      approximately half of all containers were kept sterile in closed Microbox containers (Sac O2, Belgium)
      while others were kept open to the environment.
    explanation: States soil was the one component not sterilised, and the open/closed split.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The plants were placed in a greenhouse with a 16-h photoperiod, 87.5% relative humidity,\
      \ and average day and nighttime temperatures of 19.9\u2009\xB0C and 17.9\u2009\xB0C respectively."
    explanation: Gives greenhouse photoperiod, humidity and day/night temperatures.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Plants were harvested from all containers 14 days after sowing when the primary root had
      reached bottom of EcoFAB
    explanation: Gives the 14-day growth period.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 'Standardised fabricated ecosystem (EcoFAB): oval polydimethylsiloxane cast, 7.7
    x 5.7 x 0.5 cm, holding 15 g soil, compared against test tubes (15 g) and 10 x 10 x 10.5 cm tapered
    plastic pots (600 g). Roughly half of all containers were held sterile inside closed Microbox containers
    (Sac O2, Belgium); the rest were open to the environment.'
  manufacturer_model: EcoFAB (PDMS, fabricated in-house); Microbox (Sac O2, Belgium)
  operating_temperature: 19.9
  operating_temperature_unit: "\xB0C"
  temperature_controlled: true
  controls_notes: 'Greenhouse control of photoperiod (16 h), relative humidity (87.5%) and day/night temperature
    (19.9 / 17.9 C). Watering was the manipulated variable: once at 100% holding capacity at transfer,
    then 15% holding capacity every 2 days (open) or 4 days (closed). No pH or dissolved-oxygen control
    applies to a soil container, so both are left unset.'
  notes: 'A plant-growth container comparison, not a bioreactor: system_type is OTHER because no CultivationSystemEnum
    value denotes a fabricated plant ecosystem. The community is the resident soil microbiome, so the
    soil is substrate and inoculum together and there is no formulated medium.'
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The weight of soil in test tube and EcoFAB was kept at 15\u2009g each while the pot contained\
      \ 600\u2009g. The vertical distance between the sown seed to the bottom of the container was 8\u2009\
      cm for EcoFAB and 9\u2009cm for both pot and test tube."
    explanation: Gives soil mass and geometry per container type.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Except for soil, all components were sterilized by UV sterilization or autoclaving. In addition,
      approximately half of all containers were kept sterile in closed Microbox containers (Sac O2, Belgium)
      while others were kept open to the environment.
    explanation: Gives the sterile-closed versus open containment design.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "Germinated seedlings were transferred into the containers taking care to place it 0.5\u2009\
      cm below the soil surface, watered once at 100% capacity with sterile water. Subsequent watering\
      \ was done at 15% holding capacity, every 2 and 4 days for the open and closed containers respectively."
    explanation: Gives the watering regime that differed between open and closed containers.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: "The plants were placed in a greenhouse with a 16-h photoperiod, 87.5% relative humidity,\
      \ and average day and nighttime temperatures of 19.9\u2009\xB0C and 17.9\u2009\xB0C respectively."
    explanation: Gives the controlled greenhouse conditions.
related_ingredients:
- preferred_term: root exudates
  chebi_term:
    id: CHEBI:50860
    label: organic molecular entity
  relevance: Root exudates differ across the developing primary root (tip vs
    base) and define the labile-carbon source that distinguishes the
    rhizosphere niche from bulk soil; an environment-analog medium must
    supply a tip-vs-base-distinguishable exudate mixture, not a uniform
    background.
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Root exudation patterns are known to vary along distinct parts
      of the root even in juvenile plants giving rise to spatially distinct
      microbial niches
    explanation: Anchors variable root exudation as the substrate gradient
      generating the spatially distinct rhizosphere niches sampled in the
      EcoFAB design.
- preferred_term: labile root carbon
  chebi_term:
    id: CHEBI:50860
    label: organic molecular entity
  relevance: The absence of easily available, labile carbon and nutrients
    in bulk soil — as opposed to the labile pool concentrated near roots —
    is the explicit functional contrast the paper identifies; any
    cultivation medium for this rhizosphere community must supply a
    labile-carbon-rich phase distinct from a nutrient-limited control.
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the absence of easily available, labile carbon and nutrients
      in bulk soil relative to roots
    explanation: Anchors labile root carbon as the dimension separating
      rhizosphere from bulk-soil microbial function.
