ecological_interactions:
- name: Root-Driven Rhizosphere Effect
  description: A strong rhizosphere effect enriches Actinobacteria,
    Bacteroidetes, Firmicutes, and Proteobacteria OTUs relative to bulk soil.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a strong rhizosphere effect resulting in significant enrichment of
      several OTUs
    explanation: Supports the rhizosphere-effect community shaping.
- name: Tip-Versus-Bulk Functional Gradient
  description: Genes for metabolic pathways and root colonization are enriched
    in root tips, whereas nutrient-limitation and environmental-stress genes
    dominate in bulk soil, indicating gradients in labile carbon and nutrients.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: genes associated with different metabolic pathways and root
      colonization were enriched in root tips
    explanation: Supports the functional enrichment in root tips.
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: genes associated with nutrient-limitation and environmental stress
      were prominent in the bulk soil compared to root tips
    explanation: Supports the bulk-soil stress and nutrient-limitation signature.
- name: Compositional Invariance Across Containers and Root Zones
  description: 16S rRNA community composition did not differ between root tips
    and root base or across EcoFABs versus pot and tube containers, indicating
    container-independent rhizosphere assembly at the 16S level.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:37280433
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: microbial community composition did not differ between root tips
      and root base or across different growth containers
    explanation: Supports compositional invariance across spatial zones and
      containers.
