id: CommunityMech:000225
name: Brachypodium Young Root Rhizosphere EcoFAB Community
description: >
  A young Brachypodium distachyon primary-root rhizosphere community analyzed
  at two spatially distinct zones (root tip and root base) using EcoFABs
  fabricated ecosystems and conventional pot and tube containers with natural
  soil. 16S rRNA gene analysis shows a strong rhizosphere effect with
  significant enrichment of OTUs belonging to Actinobacteria, Bacteroidetes,
  Firmicutes, and Proteobacteria, while community composition did not differ
  between root tips and root base or across growth containers. Bulk
  metagenomic functional analysis revealed enrichment of metabolic-pathway and
  root-colonization genes in root tips, whereas nutrient-limitation and
  environmental-stress genes were enriched in bulk soil, indicating
  root-driven gradients in labile carbon and nutrient availability.
