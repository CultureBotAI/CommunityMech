ecological_interactions:
- name: Ferrous Iron Oxidation for Metal Dissolution
  description: The Leptospirillum ferriphilum-dominated FeOB culture, with Sulfobacillus benefaciens as the other
    named member, regenerates ferric iron from ferrous iron in acidic PCB systems. Redox potential is used to infer
    iron oxidation; this is not an iron-transporter or carbon-fixation assay. Culture-level activity does not establish
    obligate syntrophy or resolve each member's contribution. Faster oxidation after subculture did not accelerate
    batch metal dissolution in this experiment.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Leptospirillum ferriphilum
    term:
      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
  - preferred_term: Sulfobacillus benefaciens
    term:
      id: NCBITaxon:453960
      label: Sulfobacillus benefaciens
  metabolites:
  - preferred_term: Fe(II)
    term:
      id: CHEBI:29033
      label: iron(2+)
    concentration: Substrate from PCB iron content and recycled from metal dissolution
  - preferred_term: Fe(III)
    term:
      id: CHEBI:29034
      label: iron(3+)
    concentration: Generated oxidant for metal dissolution
  downstream:
  - target: Base Metal Exposure in PCB Leachate
    description: 'Regenerated Fe(III) can oxidatively dissolve PCB metals and is reduced to Fe(II), exposing the
      culture to dissolved metals. This is an oxidant/substrate feedback, not a claim that faster biological regeneration
      increased the measured batch dissolution rate: initial ferric consumption and acidic dissolution dominated
      those batches.'
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study aimed to investigate the capacity of an acidophilic iron-oxidizing culture, mainly composed
      of Leptospirillum ferriphilum, to oxidize iron in PCB-enriched environments
    explanation: Supports iron oxidation by the L. ferriphilum-dominated culture in PCB-enriched leachates
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This culture was mainly made up of L. ferriphilum and Sulfobacillus benefaciens, with L. ferriphilum
      being the predominant species
    explanation: Documents the Leptospirillum-Sulfobacillus FeOB membership used to generate ferric lixiviant
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: FeOB uses the resulting Fe(II) as a source of energy to regenerate the ferric iron
    explanation: Defines the biological regeneration step in the source's iron-redox mechanism.
- name: Base Metal Exposure in PCB Leachate
  description: Ferric reduction and acidic dissolution released metals from solid PCBs in the 2.2-L stirred-tank
    assays. The listed Cu, Zn and Ni concentrations belong to the 1% and 2% solid-PCB treatments, not the separate
    equivalent-leachate flask series. Metal dissolution supplies Fe(II) for microbial reoxidation while creating
    mixed-metal exposure. Dissolution reached its maximum after seven days regardless of subculture; the shorter
    iron-oxidation lag did not accelerate this batch endpoint. These are chemical/culture observations, not interspecies
    competition.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Leptospirillum ferriphilum
    term:
      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
  - preferred_term: Sulfobacillus benefaciens
    term:
      id: NCBITaxon:453960
      label: Sulfobacillus benefaciens
  metabolites:
  - preferred_term: copper(2+)
    term:
      id: CHEBI:29036
      label: copper(2+)
    concentration: 2.6 and 4.2 g/L in 1% and 2% solid-PCB STR assays, respectively
  - preferred_term: zinc(2+)
    term:
      id: CHEBI:29105
      label: zinc(2+)
    concentration: 303 and 543 mg/L in 1% and 2% solid-PCB STR assays, respectively
  - preferred_term: nickel(2+)
    term:
      id: CHEBI:49786
      label: nickel(2+)
    concentration: 30 and 52 mg/L in 1% and 2% solid-PCB STR assays, respectively
  downstream:
  - target: Ferrous Iron Oxidation for Metal Dissolution
    description: Oxidative metal dissolution reduces Fe(III) to Fe(II), replenishing the substrate that the FeOB
      culture can reoxidize. This chemically coupled return path is supported by the reaction scheme and the immediate
      redox drop after PCB addition, not merely by transferring a leachate to another subculture.
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The culture pre-adapted to 1% (w/v) PCB content successfully thrived in leachates with the equivalent
      of 6% of PCBs, containing 8.5 g L–1 Cu, 8 g L–1 Fe, 1 g L–1 Zn, 92 mg L–1 Ni, 12.6 mg L–1 Pb, and 4.4 mg L–1
      Co, among other metals
    explanation: Separate flask tolerance context at 6% equivalent leachate, not evidence for the listed 1/2% solid-PCB
      stirred-tank concentrations.
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Leachates of 1% (w/v) PCBs reached a maximum of 2.6 g L–1 Cu, 30 mg L–1 Ni, and 303 mg L–1 Zn, whereas
      leachates of 2% (w/v) PCBs contained up to 4.2 g L–1 Cu, 52 mg L–1 Ni, and 543 mg L–1 Zn.
    explanation: Main Results explicitly assign the concentration series to the 1% and 2% solid-PCB reactors.
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: indicating that Fe(III) was being reduced
    explanation: The immediate redox drop after PCB addition supports ferric reduction in the same batch system.
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: maximum dissolution yield after 7 days as in the previous experiments, regardless of the subculture
    explanation: Improved iron-oxidation lag did not improve this batch dissolution endpoint.
- name: PCB Toxicity and Microbial Adaptation
  description: PCB exposure delayed culture iron oxidation. In solid-PCB stirred tanks, the adapted culture had
    pre-oxidation lags of 11 days at 1% and 18 days at 2%. Serial 2% subcultures shortened the lag from 18 to 13
    to 7 days; after a ten-day storage pause it lengthened to 11 days before shortening again. Separately, no growth
    or microbial iron-oxidation activity was observed at 8% equivalent chemical leachate during the 25-day flask
    assay; this is not a universal above-8% threshold. Operational adaptation does not identify genetic resistance,
    altered membranes or a specific toxic compound. Planktonic counts omit attached biomass and are affected by
    solids.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Leptospirillum ferriphilum
    term:
      id: NCBITaxon:178606
      label: Leptospirillum ferriphilum
  - preferred_term: Sulfobacillus benefaciens
    term:
      id: NCBITaxon:453960
      label: Sulfobacillus benefaciens
  biological_processes:
  - preferred_term: response to toxic substance
    term:
      id: GO:0009636
      label: response to toxic substance
  downstream:
  - target: Ferrous Iron Oxidation for Metal Dissolution
    description: PCB exposure delays iron-oxidizing activity, while serial transfer under the tested 2% solid-PCB
      conditions shortens the pre-oxidation lag. This operational history changes the onset of culture activity;
      the molecular adaptation mechanism is unresolved and the faster onset did not accelerate batch metal dissolution.
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the inhibiting effect of PCBs limited the microbial activity by delaying the onset of the
      exponential iron oxidation
    explanation: Supports an inhibitory delay, not a measured specific toxin or genetic response.
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: thrived in leachates with the equivalent of 6% of PCBs
    explanation: Documents FeOB-culture tolerance of leachates equivalent to 6% PCB load
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Successive subcultures boosted the activity of the culture by reducing this delay by up to 2.6 times
    explanation: Supports the serial-subculture effect on lag, not a demonstrated genetic adaptation mechanism.
environmental_factors:
- name: Extreme Acidity
  value: 1.2 ± 0.1
  unit: pH
  description: 'Extremely low pH maintained by sulfuric acid generation from sulfur oxidation. This acidity
    prevents metal hydroxide precipitation, keeps Fe³⁺ soluble, and creates selective pressure favoring
    acidophiles while excluding contaminants. pH 1.2 is among the most acidic industrial bioprocesses,
    requiring specialized acid-tolerant organisms.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: pH was daily adjusted to 1.2 with H2SO4
    explanation: Documents the low-pH stirred-tank reactor operation
- name: Temperature
  value: '35'
  unit: °C
  description: 'Moderate mesophilic reactor temperature used for the batch and continuous-flow FeOB
    bioleaching reactors. Temperature selection balances microbial growth rate, metal dissolution kinetics,
    and operational expenses.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All the bioleaching reactors in batch and continuous-flow modes operated at 35°C
    explanation: Documents the operating temperature in batch and continuous-flow bioleaching reactors
- name: Aeration with CO2 Enrichment
  value: 60 L/h with 1% CO2
  unit: L/h
  description: 'High aeration rate provides oxygen as the terminal electron acceptor for iron oxidation.
    CO₂ enrichment supplies inorganic carbon for chemolithoautotrophic fixation by acidophiles, reducing
    the need for organic carbon supplements. Agitation keeps the gas, liquid, and PCB solids mixed in
    the stirred-tank reactor.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: with an airflow enriched with 1% CO2 of 60 L h–1, and agitation at 650 rpm
    explanation: Quantifies the bioleaching airflow and agitation rate
- name: PCB Leachate Load
  value: 2-8% equivalent PCB leachate tested; growth through 6%
  unit: '% w/v'
  description: 'The adapted culture was challenged with chemical PCB leachates representing 2, 4, 6,
    and 8% PCB loads; a culture pre-adapted to 1% PCB thrived at the 6% equivalent leachate load despite
    high dissolved copper, iron, zinc, nickel, lead, and cobalt.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The culture pre-adapted to 1% (w/v) PCB content successfully thrived in leachates with the
      equivalent of 6% of PCBs, containing 8.5 g L–1 Cu, 8 g L–1 Fe, 1 g L–1 Zn, 92 mg L–1 Ni, 12.6
      mg L–1 Pb, and 4.4 mg L–1 Co, among other metals
    explanation: Documents the 6% equivalent PCB leachate that the pre-adapted FeOB culture tolerated
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: thrived in leachates with the equivalent of 6% of PCBs
    explanation: Documents FeOB growth at the 6% equivalent PCB load
- name: PCB-Delayed Iron Oxidation
  value: delayed onset of exponential iron oxidation
  description: 'PCB leachate toxicity delayed the onset of exponential iron oxidation, and successive
    subculturing reduced the delay by up to 2.6 times under batch conditions.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Successive subcultures boosted the activity of the culture by reducing this delay
      by up to 2.6 times under batch conditions
    explanation: Documents batch adaptation reducing the PCB-dependent iron-oxidation delay
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the inhibiting effect of PCBs limited the microbial activity by delaying the onset of the exponential iron oxidation
    explanation: Documents PCB-driven inhibition of microbial activity through
      delayed onset of exponential iron oxidation.
