    evidence_source: IN_VITRO
    snippet: Successive subcultures boosted the activity of the culture by reducing this delay
      by up to 2.6 times under batch conditions
    explanation: Documents batch adaptation reducing the PCB-dependent iron-oxidation delay
  - reference: doi:10.3389/fmicb.2021.669738
