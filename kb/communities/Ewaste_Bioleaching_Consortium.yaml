discussions:
- discussion_id: ewaste_redox_feedback_toxicity_and_adaptation
  prompt: Which toxic components and physiological changes determine the iron-oxidation lag?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Ferrous Iron Oxidation for Metal Dissolution
  - ecological_interactions#Base Metal Exposure in PCB Leachate
  - ecological_interactions#PCB Toxicity and Microbial Adaptation
  rationale: 'Retain the FeIII/FeII chemical-biological feedback rather than a subculture-workflow cycle. Retain
    the operational adaptation-to-oxidation link without claiming measured genetic detoxification, membrane changes
    or obligatory syntrophy. In these batches metal dissolution reached maximum after seven days regardless of subculture,
    despite faster iron oxidation. Distinguish equivalent-leachate flask toxicity from solid-PCB stirred-tank concentrations
    and continuous-startup results. Non-graph acidity, assay-regime and organism-role claims remain #1448; preserve
    the prior #596 vessel evidence correction. No new nodes or arrows are required.'
