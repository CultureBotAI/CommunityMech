- name: Base Metal Exposure in PCB Leachate
  description: 'Ferric iron generated by the FeOB culture was used to leach spent printed circuit boards,
    creating acidic PCB leachates containing elevated copper, iron, zinc, nickel, lead, cobalt, and other
    metals. The pre-adapted FeOB culture retained growth and iron oxidation in leachate representing
    up to 6% PCB content, linking the ferric-iron regeneration step to continued activity under mixed
    base-metal exposure.

    '
