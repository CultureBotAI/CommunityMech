environmental_factors:
- name: Extreme Acidity
  value: 1.2 ± 0.1
  unit: pH
  description: 'Extremely low pH maintained by sulfuric acid generation from sulfur oxidation. This acidity
    prevents metal hydroxide precipitation, keeps Fe³⁺ soluble, and creates selective pressure favoring
    acidophiles while excluding contaminants. pH 1.2 is among the most acidic industrial bioprocesses,
    requiring specialized acid-tolerant organisms.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: pH was daily adjusted to 1.2 with H2SO4
    explanation: Documents the low-pH stirred-tank reactor operation
- name: Temperature
  value: '35'
  unit: °C
  description: 'Moderate mesophilic reactor temperature used for the batch and continuous-flow FeOB
    bioleaching reactors. Temperature selection balances microbial growth rate, metal dissolution kinetics,
    and operational expenses.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All the bioleaching reactors in batch and continuous-flow modes operated at 35°C
    explanation: Documents the operating temperature in batch and continuous-flow bioleaching reactors
- name: Aeration with CO2 Enrichment
  value: 60 L/h with 1% CO2
  unit: L/h
  description: 'High aeration rate provides oxygen as the terminal electron acceptor for iron oxidation.
    CO₂ enrichment supplies inorganic carbon for chemolithoautotrophic fixation by acidophiles, reducing
    the need for organic carbon supplements. Agitation keeps the gas, liquid, and PCB solids mixed in
    the stirred-tank reactor.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: with an airflow enriched with 1% CO2 of 60 L h–1, and agitation at 650 rpm
    explanation: Quantifies the bioleaching airflow and agitation rate
- name: PCB Leachate Load
  value: 2-8% equivalent PCB leachate tested; growth through 6%
  unit: '% w/v'
  description: 'The adapted culture was challenged with chemical PCB leachates representing 2, 4, 6,
    and 8% PCB loads; a culture pre-adapted to 1% PCB thrived at the 6% equivalent leachate load despite
    high dissolved copper, iron, zinc, nickel, lead, and cobalt.

    '
  evidence:
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The culture pre-adapted to 1% (w/v) PCB content successfully thrived in leachates with the
      equivalent of 6% of PCBs, containing 8.5 g L–1 Cu, 8 g L–1 Fe, 1 g L–1 Zn, 92 mg L–1 Ni, 12.6
      mg L–1 Pb, and 4.4 mg L–1 Co, among other metals
    explanation: Documents the 6% equivalent PCB leachate that the pre-adapted FeOB culture tolerated
  - reference: doi:10.3389/fmicb.2021.669738
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: thrived in leachates with the equivalent of 6% of PCBs
    explanation: Documents FeOB growth at the 6% equivalent PCB load
- name: PCB-Delayed Iron Oxidation
  value: delayed onset of exponential iron oxidation
  description: 'PCB leachate toxicity delayed the onset of exponential iron oxidation, and successive
    subculturing reduced the delay by up to 2.6 times under batch conditions.

    '
  evidence:
