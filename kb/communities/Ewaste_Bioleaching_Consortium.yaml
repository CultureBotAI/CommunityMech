id: CommunityMech:000026
name: E-waste Bioleaching Consortium
description: 'An engineered acidophilic iron-oxidizing culture adapted for recovering valuable base metals
  from spent printed circuit boards (PCBs). This culture was dominated by Leptospirillum ferriphilum
  with Sulfobacillus benefaciens as an additional FeOB member. The community operates at extremely low
  pH and moderate temperature in PCB-enriched leachates, oxidizing ferrous iron to generate ferric iron
  (Fe³⁺) that dissolves base metals from PCB components. PCB leachates are toxic to the consortium, delaying
  the onset of exponential iron oxidation, but successive subculturing adapts the consortium to PCB toxicity
  and reduces that delay by up to 2.6-fold. This biotechnological approach offers an environmentally
  friendly alternative to pyrometallurgical e-waste processing by using an acidophilic community to
  regenerate the ferric iron lixiviant needed for metal recovery.

  '
