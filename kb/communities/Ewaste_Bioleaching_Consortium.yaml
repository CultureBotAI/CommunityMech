    notes: 'Dominant iron-oxidizing bacterium in the e-waste bioleaching consortium. Leptospirillum can
      potentially thrive in bioleaching environments as they have greater capacity for iron oxidation
      activity than other iron-oxidizing bacteria (FeOB). This obligate chemolithoautotroph oxidizes Fe²⁺
      at extremely low pH (1.2) and moderate temperature (35°C). Adapted through successive subculturing
      to tolerate PCB toxicity, reducing the pre-oxidation lag phase by 2.6-fold. Leptospirillum provides
      the bulk of Fe³⁺ generation needed to expose the culture to PCB-derived copper, zinc, nickel,
      cobalt, and lead leachates.

      '
