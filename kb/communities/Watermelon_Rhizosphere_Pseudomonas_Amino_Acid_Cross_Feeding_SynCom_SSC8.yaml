id: CommunityMech:000479
name: Watermelon Growth-Promoting Synthetic Bacterial Community SSC8
description: Simplified synthetic bacterial community (SSC8) promoting the growth of ungrafted watermelon (Citrullus lanatus),
  structured by directional metabolic complementarity where positive pairwise interactions account for 55% of combinations.
  Stutzerimonas azotifigens (reported as Pseudomonas azotifigens) strain Q6 acts as a central community driver that benefits
  from all other members and engages in mutualistic amino acid cross-feeding (including L-lysine and L-cysteine) with three
  partner strains.
