id: CommunityMech:000463
name: NDC-6 Psychrotolerant Nitrogen Removal SynCom
description: A six-strain psychrotolerant composite microbial agent for low-temperature nitrogen removal, generated by coculturing
  nitrifying consortium NC1 (Pseudomonas veronii HN1, Pseudomonas poae HN2, and Pseudomonas peli HN3) with aerobic-denitrifying
  consortium DC1 (Aeromonas sp. AD1, Pseudomonas extremaustralis AD2, and Serratia liquefaciens AD3) at a 1:1 inoculation
  ratio.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Construct a low-temperature composite microbial agent that combines psychrotolerant nitrification and aerobic
    denitrification functions for nitrogen-containing wastewater treatment.
  assembly_strategy: Coculture the NC1 nitrifying module and the DC1 aerobic-denitrifying module at a 1:1 inoculation ratio
    to form the six-strain NDC-6 agent.
  measurement_endpoints:
  - NH4+-N removal
  - NO3--N removal
  - total nitrogen removal
  - chemical oxygen demand removal
  - hao, napA, nirS, nirK, cnorB, and nosZ expression
  evidence:
  - &id001
    reference: PMID:41504900
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a composite microbial agent, designated NDC-6, was generated by coculturing a psychrotolerant nitrifying consortium
      NC1 (Pseudomonas veronii HN1, P. poae HN2, and P. peli HN3) and an aerobic denitrifying consortium DC1 (Aeromonas sp.
      AD1, P. extremaustralis AD2, and Serratia liquefaciens AD3) at a 1:1 inoculation ratio
    explanation: Identifies NDC-6, its NC1 and DC1 sub-consortia, all six member strains, and the 1:1 assembly ratio.
  - &id002
    reference: PMID:41504900
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 3 days of incubation at 10 °C, NDC-6 achieved removal efficiencies of 89.3%, 88.1%, 85.5%, and 95.3% for
      NH4+-N, NO3--N, total nitrogen (TN), and chemical oxygen demand (COD)
    explanation: Quantifies the three-day low-temperature nitrogen-removal and COD-removal performance of the complete NDC-6
      community.
  - reference: PMID:41504900
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: functional gene (hao, napA, nirS, nirK, cnorB, and nosZ) expression analyses revealed that under low-temperature
      and aerobic conditions, NDC-6 achieved NR primarily through dual pathways of bacterial assimilation and dissimilation
    explanation: Links NDC-6 low-temperature aerobic nitrogen removal to functional gene expression in nitrification and denitrification
      pathways.
