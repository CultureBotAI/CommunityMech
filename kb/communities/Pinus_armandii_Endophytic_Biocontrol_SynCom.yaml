ecological_interactions:
- name: Functionally complementary biocontrol SynCom assembly
  description: The community was assembled from endophytic isolates selected for complementary plant
    growth-promoting and antagonistic functions and for pairwise compatibility, yielding a
    functionally complementary and stable synthetic community rather than any single-strain effect.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42322490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: this study screened endophytic bacteria with superior plant growth-promoting (PGP) and
      antagonistic functions to construct a functionally complementary and stable synthetic microbial
      community (SynCom).
    explanation: Members were chosen for complementary PGP and antagonistic functions, a community-level
      niche/functional partitioning.
- name: Community antagonism of the blister rust pathogen
  description: Constituent strains were selected for antagonistic potential against the blister rust
    pathogen, assessed by dual-culture assays and inhibition of urediniospore germination; the
    assembled SynCom enhanced blister rust-associated host defense responses.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42322490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: antagonistic potential using dual-culture assays and inhibition of urediniospore germination.
    explanation: Members were screened for antagonism (dual-culture inhibition, urediniospore germination
      suppression) against the rust pathogen.
