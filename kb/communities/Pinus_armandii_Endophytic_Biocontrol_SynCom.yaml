- name: Blister Rust-Associated Defense Enzyme Induction
  description: SynCom treatment increased host polyphenol oxidase (PPO) and peroxidase (POD) activities by 19.1%
    and 157.3% relative to controls in the pot experiment. Preserve these positive defense-associated enzyme endpoints.
    They do not alone demonstrate priming, resistance to infection or disease control; the abstract explicitly calls
    for subsequent in planta biocontrol evaluation.
