discussions:
- discussion_id: pine-assay-compatibility-and-host-causality
  prompt: Which strain functions mediate the observed seedling responses and actual blister-rust protection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Compatibility of Selected Endophytic Isolates
  - ecological_interactions#Antagonistic Activity of Selected Endophytic Isolates
  - ecological_interactions#Pinus Seedling Growth Promotion
  - ecological_interactions#Blister Rust-Associated Defense Enzyme Induction
  rationale: 'Preserve compatibility, isolate antagonism, growth and enzyme responses as separate positive findings.
    Public Supplement Figures S1-S3 and Table S2 separate Phomopsis inhibition, cell-free urediniospore inhibition
    and compatibility; these assays do not demonstrate stable community coexistence or direct inhibition by the
    complete SynCom. Both removed arrows conflated isolate selection/screening with causal mediation of host outcomes.
    No untested IAA/nitrogen exchange or reciprocal mutualism is assigned. Disease-challenge, strain-removal and
    mediator perturbations would resolve mechanisms. Main text remains inaccessible, while both public supplements
    were read and all six PDF pages visually inspected. Non-graph priming/stability and assay-scope claims remain
    #1709.'
  evidence:
  - reference: PMID:42322490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: nine strains with significant antagonistic activity
    explanation: Supports the positive isolate-screen result. Public supplements distinguish Phomopsis plates from
      the cell-free urediniospore assay and delimit which isolates overlap the final SynCom; not a whole-SynCom
      inhibition experiment.
  - reference: PMID:42322490
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom treatment enhanced defense-related enzyme activities, increasing polyphenol oxidase (PPO) and
      peroxidase (POD) activities by 19.1% and 157.3% relative to the control
    explanation: Supports the measured host enzyme increases, not demonstrated infection resistance or a specific
      isolate-mediated mechanism.
  posed_by: codex
