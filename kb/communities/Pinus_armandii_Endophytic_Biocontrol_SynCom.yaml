- name: Antagonistic Activity of Selected Endophytic Isolates
  description: Selected isolates showed antagonistic activity in vitro. Public Supplement Table S2 and Figure S1
    identify Phomopsis sp. as the plate-inhibition target, distinct from the separate urediniospore-germination
    assay with cell-free fermentation supernatants (Figure S2). NA11, NA3 and RE7 occur among the tested inhibitory
    isolates and in the final SynCom; RC1 and OB3 are not among the nine spore-assay treatments. Preserve isolate
    inhibition without assigning every result to the complete five-strain community or asserting that direct pathogen
    inhibition caused host defense-enzyme induction.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42322490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: nine strains with significant antagonistic activity
    explanation: Supports the positive isolate-screen result. Public supplements distinguish Phomopsis plates from
      the cell-free urediniospore assay and delimit which isolates overlap the final SynCom; not a whole-SynCom
      inhibition experiment.
  participating_taxa:
