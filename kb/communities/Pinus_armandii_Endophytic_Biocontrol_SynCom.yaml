ecological_interactions:
- name: Compatibility of Selected Endophytic Isolates
  description: The five constituent strains were selected using pairwise compatibility tests. Public Supplement
    Figure S3 shows an agar/filter-disc assay with no inhibition zones among the tested strains. Preserve assay-specific
    compatibility, not demonstrated long-term stable coexistence, resource partitioning or a causal contribution
    of complementarity to seedling growth. Screened nitrogen-fixing/IAA traits do not establish ammonia or IAA exchange
    within this SynCom.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42322490
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on pairwise compatibility tests, a SynCom was constructed
    explanation: The abstract supports compatibility-based selection; public Supplement Figure S3 specifies the
      no-inhibition-zone assay, not long-term stability or growth mediation.
  participating_taxa:
