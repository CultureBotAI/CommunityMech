id: CommunityMech:000280
name: Pinus armandii Endophytic Biocontrol SynCom
description: A five-strain synthetic bacterial community (SynCom) assembled from endophytic bacteria
  isolated from multiple tissues of Pinus armandii to promote seedling growth and prime blister
  rust-associated defense responses. The optimized, functionally complementary SynCom comprises
  Pseudomonas koreensis RC1, Paenibacillus terrae RE7, Bacillus velezensis OB3 and NA3, and Bacillus
  subtilis NA11, selected for plant growth-promoting traits (nitrogen fixation, phosphate and potassium
  solubilization, IAA production) and antagonism of the rust pathogen. In pot experiments the SynCom
  increased seedling height and biomass and raised defense-related polyphenol oxidase and peroxidase
  activities relative to the control.
