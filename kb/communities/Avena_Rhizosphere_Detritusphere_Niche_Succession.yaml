ecological_interactions:
- name: Functional Succession Outpaces Compositional Change
  description: Metatranscriptomic functional profiles changed faster than 16S-based community composition across
    days 3, 6, 12 and 22 in paired rhizosphere and bulk soils with or without root detritus. This is transcriptional
    succession, not measured reaction flux; soil drying covaried with the final sampling time.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:31953507
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the succession of microbial functions occurred at a faster time scale than compositional changes
    explanation: Supports the relative timing of transcriptional and compositional change, not faster measured carbon
      turnover.
  - reference: PMID:31953507
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: soil habitat significantly affected both community composition and overall gene expression
    explanation: Supports habitat-associated expression and composition differences in the microcosms; final-timepoint
      drying is not isolated from succession.
- name: Four Decomposition-Gene Expression Response Groups
  description: PARTIAL - decomposition-gene expression identifies Rhizosphere, Detritusphere, Aging Root and Low
    Response groups among 24 responsive reference populations. Low Response lacks a clear habitat preference. NICHE_PARTITIONING
    records the source interpretation, not four proven substrate specialists; 80-percent-identity transcript mapping
    aggregates populations rather than resolving individual strains.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: polysaccharide
    term:
      id: CHEBI:18154
      label: polysaccharide
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  downstream:
  - target: Proposed Niche-Differentiated Guild Coexistence
    description: HYPOTHESIZED - differing expression responses to root resources could reduce resource overlap and
      permit guild coexistence. Clustering and diversity patterns do not directly test resource partitioning or
      its necessity for coexistence.
  evidence:
  - reference: PMID:31953507
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: identified four distinct microbial guilds populated by taxa whose functional succession patterns suggest
      specialization
    explanation: The abstract supports expression-defined groups. Published Results and Figure 4 identify the Low
      Response group; substrate specialization is inferred, not a one-to-one mapping of four groups to four habitats.
- name: Rhizosphere Upregulates Carbohydrate Depolymerization Transcripts
  description: Carbohydrate-depolymerization genes were upregulated in rhizosphere treatments. These transcript
    responses indicate expressed functional potential, not measured enzyme activity or polymer flux; the combined
    treatment did not have the greatest response at every timepoint.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  downstream:
  - target: Predicted Soil Carbon Cycling Consequences of Guild Succession
    description: HYPOTHESIZED - increased expression could increase enzyme-mediated processing of root polymers
      and thereby alter soil-carbon transformations. Transcript abundance alone does not establish this flux or
      its downstream persistence and mineral-association consequences.
  evidence:
  - reference: PMID:31953507
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Carbohydrate depolymerization genes were consistently upregulated in the rhizosphere
    explanation: Supports gene upregulation; the main Results separate transcript expression from population-abundance
      proxies and do not establish enzyme flux.
- name: Proposed Niche-Differentiated Guild Coexistence
  description: PARTIAL - habitat/time-dependent expression and diversity patterns support the authors' niche-differentiation
    interpretation. At day 22, combined-treatment taxonomic diversity was numerically highest but shared significance
    groups with detritus-amended bulk soil. Detritus did not significantly increase rhizosphere functional diversity.
    These contrasts do not demonstrate a causal coexistence mechanism.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:31953507
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: both taxonomic and functional diversity were highest in the combined rhizosphere-detritusphere
    explanation: The abstract summarizes diversity maxima; Figure 2 and Results limit the statistical comparison.
      The combined habitat is not significantly more diverse in every comparison.
  - reference: PMID:31953507
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: suggesting coexistence of rhizosphere guilds is facilitated by niche differentiation
    explanation: Supports the authors' proposed explanation for coexistence, not an experimental test of its necessity.
- name: Predicted Soil Carbon Cycling Consequences of Guild Succession
  description: HYPOTHESIZED - expression-defined decomposer guilds could help predict root-polymer processing and
    subsequent soil-carbon cycling. This study proposes a modeling framework; it does not measure guild-resolved
    carbon persistence or mineral association.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: polysaccharide
    term:
      id: CHEBI:18154
      label: polysaccharide
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:31953507
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Metatranscriptome-defined guilds provide a framework to model rhizosphere succession and its consequences
      for soil carbon cycling
    explanation: Supports prospective modeling relevance; the main discussion identifies carbon-persistence consequences
      as needing experimental tests, not as measured outcomes.
