    term:
      id: NCBITaxon:434
      label: Acetobacter
  biological_processes:
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:24242251
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Only flies with both Acetobacter and Lactobacillus had triglyceride contents restored to the level in conventional flies.
    explanation: Supports a non-additive community effect involving both bacterial groups and host triglyceride allocation.
