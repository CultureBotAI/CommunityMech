id: CommunityMech:000160
name: Drosophila Five-Species Gnotobiotic Gut Microbiota
description: >
  A defined five-species Drosophila melanogaster gut microbiota assembled from fly-gut isolates of
  Acetobacter pomorum, Acetobacter tropicalis, Lactobacillus brevis, Lactobacillus fructivorans, and
  Lactobacillus plantarum. The community was used to colonize axenic Drosophila and test how
  Acetobacter-Lactobacillus interactions shape host development, glucose, triglyceride allocation, and
  host-genotype-dependent microbiota effects.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Reconstitute a low-diversity Drosophila gut microbiota with cultured Acetobacter and
    Lactobacillus isolates to test host nutritional traits and interspecies effects.
  assembly_strategy: Mix equal parts of five fly-gut bacterial isolates representing dominant Acetobacter
    and Lactobacillus members of the laboratory Drosophila gut microbiota.
  inoculation_strategy: Add a defined bacterial suspension to sterile food immediately after aseptic
    transfer of surface-sterilized Drosophila eggs.
  perturbation_design: Compare axenic, conventional, monoassociated, dual-species, and five-species
    gnotobiotic flies.
  measurement_endpoints:
  - development time to pupation and eclosion
  - glucose content
  - triglyceride content
  - bacterial abundance in flies
  - host genotype effects on microbiota-dependent nutritional traits
  evidence:
  - reference: PMID:24242251
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Gnotobiotic flies were constructed with one or a set of five of the Acetobacter and Lactobacillus species
    explanation: Supports the defined gnotobiotic assembly strategy and the five-member experimental design.
