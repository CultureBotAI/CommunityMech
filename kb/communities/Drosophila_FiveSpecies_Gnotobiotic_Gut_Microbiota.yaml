ecological_interactions:
- name: Acetobacter-Lactobacillus Nutrient Allocation Interaction
  description: Acetobacter and Lactobacillus members jointly restore host triglyceride phenotypes that
    are not restored by Lactobacillus alone, linking interspecies effects to host nutrient allocation.
  interaction_type: CROSS_FEEDING
  source_taxon:
