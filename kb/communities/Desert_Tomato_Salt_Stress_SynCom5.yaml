id: CommunityMech:000096
name: Desert-Derived Tomato Salt Stress SynCom5
description: A five-member desert-root bacterial SynCom that protects tomato plants from high salt stress
  in non-sterile soil.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Engineer a simplified desert microbiome SynCom that confers abiotic salt-stress resilience
    to tomato.
  assembly_strategy: Five bacterial strains originating from the root of Indigofera argentea were assembled
    into a SynCom.
  perturbation_design: High salt stress in natural non-sterile soil substrate.
  measurement_endpoints:
  - tomato salt-stress resilience
  - SynCom strain penetrance
  - salt-stress gene expression
  - ion accumulation
  evidence:
  - &id001
    reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we show that a SynCom of five bacterial strains, originating from the root of the desert
      plant Indigofera argentea, protected tomato plants growing in a non-sterile substrate against a
      high salt stress.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Five bacterial strains from desert plant roots applied to tomato in non-sterile substrate.
taxonomy:
- taxon_term:
    preferred_term: desert root bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Desert Microbiome Salt Protection
  description: Desert root isolates improve tomato salt-stress tolerance in a natural soil microbiome
    context.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Five bacterial strains originating from the root of Indigofera argentea were assembled into a
    SynCom.
  description: High salt stress in natural non-sterile soil substrate.
  evidence:
  - *id001
related_ingredients:
- preferred_term: sodium chloride
  chebi_term:
    id: CHEBI:26710
    label: sodium chloride
  relevance: The defining abiotic stressor — high salt (NaCl) in non-sterile soil is the stress the
    desert-derived 5-strain SynCom protects tomato against (Schmitz et al. 2022).
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a SynCom of five bacterial strains, originating from the root of the desert plant Indigofera
      argentea, protected tomato plants growing in a non-sterile substrate against a high salt stress
    explanation: Identifies high salt stress as the abiotic challenge the SynCom alleviates.
growth_media:
- name: tryptic soy broth (TSB)
  temperature: '28'
  temperature_unit: °C
  inoculum_size: 5 × 10^8
  inoculum_unit: CFU/mL
  preparation_notes: SynCom strains cultured in TSB at 28 °C; fast-growing strains in 1/10th TSB for 1 day and slow-growing strains in ½-strength TSB for 5 days; rhizobial strains in yeast extract mannitol (YEM) for 3-4 days; cells washed three times in 0.9% NaCl and combined into an equimolar SynCom at 5 × 10^8 CFU/mL.
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial strains were cultured in tryptic soy broth medium (TSB) at 28 °C. Fast growing strains were cultivated in 1/10th TSB for 1 day and slow growing strains were cultivated in ½ strength TSB for 5 days.
    explanation: Names the TSB medium and 28 °C cultivation temperature used for the SynCom strains.
