ecological_interactions:
- name: SynCom C promotion of salt-stressed tomato biomass
  description: The five-member Jizan SynCom C increased tomato shoot biomass
    under 200 mM NaCl, whereas its five component strains tested separately did
    not significantly promote biomass.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to salt stress
    term:
      id: GO:0009651
      label: response to salt stress
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynCom C was the only inoculum that significantly promoted tomato growth
      compared to the inoculum-free control
    explanation: Supports the five-member SynCom C-specific biomass phenotype
      under 200 mM NaCl.
- name: SynCom C activation of root SOS marker expression
  description: SynCom C triggered an early tomato root salt-stress response,
    including significant upregulation of SOS1, SOS2, and WRKY8 four days after
    salt imposition.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to salt stress
    term:
      id: GO:0009651
      label: response to salt stress
  downstream:
  - target: SynCom C reduction of shoot sodium-potassium imbalance
    description: Early SOS pathway marker activation in SynCom C-treated roots
      is consistent with improved ion homeostasis and the lower shoot Na+/K+
      ratio measured later in salt-stressed tomato.
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SOS1, SOS2 and WRKY8 expression was significantly upregulated in the
      root of tomato plants treated with SynCom C
    explanation: Supports SynCom C-triggered activation of tomato salt-stress
      marker genes in roots.
- name: SynCom C reduction of shoot sodium-potassium imbalance
  description: SynCom C-treated salt-stressed tomato plants accumulated a lower
    shoot Na+/K+ ratio than uninoculated controls, consistent with lower ion
    toxicity under salt stress.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: sodium(1+)
    term:
      id: CHEBI:29101
      label: sodium(1+)
  - preferred_term: potassium(1+)
    term:
      id: CHEBI:29103
      label: potassium(1+)
  biological_processes:
  - preferred_term: sodium ion transport
    term:
      id: GO:0006814
      label: sodium ion transport
  downstream:
  - target: SynCom C promotion of salt-stressed tomato biomass
    description: The reduced Na+/K+ ratio in SynCom C-inoculated shoots is a
      physiological marker of lower salt stress that accompanied the
      SynCom-level tomato biomass increase.
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Na+/K+ ratio was significantly lower in SynCom C inoculated plants
    explanation: Supports lower shoot sodium-potassium imbalance in
      SynCom C-treated tomato under saline conditions.
  - *id001
- name: SynCom C five-strain salt protection
  description: SynCom C was the strongest reduced community from a 20-combination
    screen of non-redundant three- to five-strain subsets of the 15-strain Jizan
    library in salt-stressed tomato.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to salt stress
    term:
      id: GO:0009651
      label: response to salt stress
  downstream:
  - target: SynCom C activation of root SOS marker expression
    description: The reduced five-strain SynCom C was carried forward into the
      validation assay that showed community-specific induction of root SOS1,
      SOS2, and WRKY8 salt-stress marker expression.
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the five member SynCom C performed the best and was the only one
      significantly different to the control
    explanation: Supports SynCom C as the best-performing reduced Jizan
      community under salt stress.
environmental_factors:
- name: defined synthetic community design
  value: Five bacterial strains originating from the root of Indigofera argentea were assembled into a
    SynCom.
  description: High salt stress in natural non-sterile soil substrate.
  evidence:
  - *id001
related_ingredients:
- preferred_term: sodium chloride
  chebi_term:
    id: CHEBI:26710
    label: sodium chloride
  relevance: The defining abiotic stressor — high salt (NaCl) in non-sterile soil is the stress the
    desert-derived 5-strain SynCom protects tomato against (Schmitz et al. 2022).
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: a SynCom of five bacterial strains, originating from the root of the desert plant Indigofera
      argentea, protected tomato plants growing in a non-sterile substrate against a high salt stress
    explanation: Identifies high salt stress as the abiotic challenge the SynCom alleviates.
growth_media:
- name: tryptic soy broth (TSB)
  temperature: '28'
  temperature_unit: °C
  inoculum_size: 5 × 10^8
  inoculum_unit: CFU/mL
  preparation_notes: SynCom strains cultured in TSB at 28 °C; fast-growing strains in 1/10th TSB for 1 day and slow-growing strains in ½-strength TSB for 5 days; rhizobial strains in yeast extract mannitol (YEM) for 3-4 days; cells washed three times in 0.9% NaCl and combined into an equimolar SynCom at 5 × 10^8 CFU/mL.
  evidence:
  - reference: PMID:35444261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Bacterial strains were cultured in tryptic soy broth medium (TSB) at 28 °C. Fast growing strains were cultivated in 1/10th TSB for 1 day and slow growing strains were cultivated in ½ strength TSB for 5 days.
    explanation: Names the TSB medium and 28 °C cultivation temperature used for the SynCom strains.
