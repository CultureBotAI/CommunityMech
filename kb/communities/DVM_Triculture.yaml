ecological_interactions:
- name: Lactate Oxidation and H2/Acetate Production
  description: In the constructed 2019 DVM cultures, D. vulgaris fermented lactate to acetate and hydrogen under
    no-added-sulfate conditions. M. maripaludis uses hydrogen, whereas M. barkeri can use hydrogen and acetate;
    acetate is not a substrate for both methanogens. The tri-culture and Dv-Mm pair showed full lactate conversion,
    but residual acetate remained in the tri-culture and Dv-Mb pair. Sulfate availability shifts the balance toward
    donor respiration. The experimental Dv was a laboratory Hildenborough variant with two syntrophy-enabling polymorphisms,
    not an unqualified wild-type strain.
