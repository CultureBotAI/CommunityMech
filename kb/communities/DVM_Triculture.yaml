id: CommunityMech:000021
name: DVM Tri-culture
description: 'A three-member synthetic consortium consisting of Desulfovibrio vulgaris (Dv), Methanococcus
  maripaludis (Mm), and Methanosarcina barkeri (Mb) that converts lactate to methane under varying sulfate
  conditions. D. vulgaris oxidizes lactate to acetate, CO2, and H2. Both methanogens (Mm and Mb) can consume
  the H2 produced by Dv, with Mm being a hydrogenotrophic methanogen and Mb capable of using both H2-CO2
  and acetate for methanogenesis. The community demonstrates differential responses to geochemical gradients,
  particularly sulfate availability. In the absence of sulfate, all three species co-exist and methane
  production increases by almost 100% compared to Dv-Mm co-cultures. However, increasing sulfate levels
  shift community dynamics as Dv preferentially uses sulfate as an electron acceptor, creating competitive
  situations for both methanogens. This system provides insights into how geochemical gradients (particularly
  sulfate) regulate microbial interactions and methane production in anaerobic environments.

  '
ecological_state: STABLE
community_origin: NATURAL
community_category: METHANOGENESIS
environment_term:
  preferred_term: laboratory bioreactor
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: 'Laboratory synthetic community designed to study the impact of sulfate gradients on syntrophic
    lactate degradation and methanogenesis. The system demonstrates how geochemical conditions (sulfate
    availability) regulate interspecies interactions and community productivity. All three species can
    co-exist under anaerobic conditions with varying sulfate concentrations, providing a model for understanding
    sulfate-mediated competition in natural anaerobic environments such as sediments and wetlands.

    '
