environmental_factors:
- name: Anaerobic Conditions
  value: Strict anaerobic
  description: All three organisms are obligate anaerobes requiring anoxic conditions
  evidence:
  - reference: doi:10.1098/rsif.2019.0129
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Syntrophic interactions among sulfate reducers and aceto/hydrogenotrophic and obligate hydrogenotrophic
      methanogens form a key component of these communities, yet, the impact of these different syntrophic
      routes on methane production and their stability against sulfate availability are not well understood
    explanation: Establishes strict anaerobic requirement for tri-culture
- name: Sulfate Gradient
  value: Variable (0 to increasing concentrations)
  description: 'Sulfate concentration serves as a key geochemical gradient regulating community dynamics
    and methane production. In the absence of sulfate, all three species co-exist syntrophically with
    enhanced methane production. Increasing sulfate shifts D. vulgaris metabolism toward sulfate reduction,
    creating competitive pressure on both methanogens and reducing overall methane production. This gradient
    mimics natural environments where sulfate availability varies spatially and temporally.

    '
  evidence:
  - reference: doi:10.1098/rsif.2019.0129
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Syntrophic interactions among sulfate reducers and aceto/hydrogenotrophic and obligate hydrogenotrophic
      methanogens form a key component of these communities, yet, the impact of these different syntrophic
      routes on methane production and their stability against sulfate availability are not well understood
    explanation: Demonstrates sulfate gradient as primary driver of community response
- name: Hydrogen Partial Pressure
  value: Must be maintained at low levels for syntrophy
  description: 'Low H2 partial pressure is critical for syntrophic lactate oxidation by D. vulgaris. Both
    methanogens help maintain low H2 levels, but their effectiveness varies with sulfate availability.
    Under high sulfate, D. vulgaris can produce and consume H2 independently, reducing the dependency
    on methanogenic H2 removal.

    '
  evidence:
  - reference: PMID:16345708
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results suggest that H(2) produced by the Desulfovibrio species during growth with lactate
      inhibited acetate degradation by M
    explanation: Demonstrates critical role of H2 partial pressure in regulating syntrophy
- name: Lactate Availability
  value: Primary carbon and energy source
  description: 'Lactate serves as the primary substrate for the tri-culture, with D. vulgaris performing
    the initial oxidation. The complete degradation of lactate to methane and CO2 requires the coordinated
    activity of all three species under low-sulfate conditions.

    '
  evidence:
  - reference: PMID:16345708
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: vulgaris was grown in the absence of added sulfate in coculture with Methanosarcina barkeri
      (type strain), which uses both H(2)-CO(2) and acetate for methanogenesis, lactate was stoichiometrically
      degraded to CH(4) and presumably to CO(2)
    explanation: Establishes lactate as primary substrate for tri-culture metabolism
- name: Community Productivity Response
  value: 100% increase in no-sulfate conditions
  description: 'System productivity, measured as methane production from lactate, increases by almost
    100% in tri-cultures compared to Dv-Mm co-cultures when sulfate is absent. This demonstrates synergistic
    effects of having both hydrogenotrophic (M. maripaludis) and acetotrophic/hydrogenotrophic (M. barkeri)
    methanogens working together to consume all products of lactate oxidation.

    '
  evidence:
  - reference: doi:10.1098/rsif.2019.0129
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We find that tri-cultures with both routes increase methane production by almost twofold
      compared to co-cultures and are stable in the absence of sulfate
    explanation: Quantifies enhanced productivity from tri-culture interactions
