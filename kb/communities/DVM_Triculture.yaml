- name: Dual-pathway Methanogenesis by M. barkeri
  description: M. barkeri contributed to the higher methane output of the no-added-sulfate DVM tri-culture, while
    substantial acetate remained. Separate monocultures supplied with 30 mM acetate produced more methane with higher
    hydrogen pressure, including about 60 mM versus 20 mM methane with 80% versus no added headspace hydrogen. Mass
    balances in no-added-sulfate Dv-Mb pairs require hydrogen utilization in addition to acetate use. PARTIAL -
