- name: Sulfate-mediated Competition
  description: With 30 mM lactate, sulfate was added at 0, 7.5 or 15 mM across three 21-day culturing periods. Methane
    production and methanogen gene abundance declined with sulfate, with M. barkeri more sensitive than M. maripaludis;
    acetate remained available. Dv-Mb methane production was already impaired at 7.5 mM, while the Dv-Mm pair showed
    a diminishing trend at 15 mM. PARTIAL - sulfate-enabled donor respiration and competition for hydrogen provide
    the source-supported explanation, strengthened by Mb monoculture hydrogen perturbations and pair mass balances.
    These assays do not selectively isolate that mechanism in the tri-culture or establish acetate competition,
    lactate use by the methanogens, or an irreversible loss of every methanogen.
  interaction_type: COMPETITION
