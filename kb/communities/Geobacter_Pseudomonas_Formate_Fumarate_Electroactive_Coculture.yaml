id: CommunityMech:000201
name: Geobacter-Pseudomonas Formate-Fumarate Electroactive Coculture
description: >
  A defined electroactive syntrophic coculture pairing Geobacter sulfurreducens
  with Pseudomonas aeruginosa in a restricted formate-fumarate medium. The
  community was used to study interspecies electron transfer and adaptive shifts
  from syntrophy toward competition. Early coculture growth depends on
  cooperative metabolism and direct interspecies electron transfer associated
  with Geobacter cytochromes, while adapted cocultures show increased Geobacter
  dominance and hydrogen/formate-linked electron-transfer features. The system
  is relevant to DOE biogeochemistry and bioelectrochemical applications because
  Geobacter-Pseudomonas interactions connect extracellular electron transfer,
  metal cycling, and microbial community modeling.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: DIET
engineering_design:
  objective: Establish a two-member electroactive coculture to resolve how
    Geobacter-Pseudomonas syntrophy, direct interspecies electron transfer, and
    adaptive competition change during serial transfer.
  assembly_strategy: Pair G. sulfurreducens with P. aeruginosa in restricted
    medium containing formate and fumarate so coculture growth requires
    cooperative metabolism.
  perturbation_design: Compare initial and serially adapted cocultures, quantify
    organism abundance, test Pseudomonas phenazine effects, and profile genomic
    and proteomic changes.
  measurement_endpoints:
  - Coculture growth
  - Relative Geobacter and Pseudomonas abundance
  - Direct interspecies electron transfer-associated proteins
  - Hydrogen interspecies transfer-associated proteins
  - Whole-genome variant selection
  - Phenazine-1-carboxylic acid inhibition
  evidence:
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A syntrophic coculture of Geobacter sulfurreducens and Pseudomonas aeruginosa was established and evolved in restricted medium
    explanation: Supports the defined Geobacter-Pseudomonas syntrophic coculture design.
  - reference: PMID:32265334
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: whole-genome sequencing of the cocultures before and after adaptive evolution
    explanation: Supports genome-scale tracking of adaptive changes in the coculture.
