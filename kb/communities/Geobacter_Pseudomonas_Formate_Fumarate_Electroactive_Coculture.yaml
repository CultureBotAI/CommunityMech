discussions:
- discussion_id: geobacter_pseudomonas_transfer_routes
  prompt: Which electron-transfer routes support early and adapted cocultures?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Restricted-Medium Cooperative Growth
  - ecological_interactions#Cytochrome-Associated Interspecies Electron Transfer
  - ecological_interactions#Geobacter-Dominated Coculture Adaptation
  rationale: Preserve the reported omcZ/omcS growth defect and phz-mutant growth while distinguishing the authors'
    DIET interpretation from selective route proof. Primary full 2018 perturbation controls, flux measurements,
    complementation and route-specific tests would resolve cytochrome pleiotropy and the inferred later HybA/FdnG
    roles. Pseudomonas supplies electrons to Geobacter in the described model. Later hydrogen-transfer and formate-use
    hypotheses are bounded in the existing adaptation node; no unsupported new transfer arrow or experimentally
    resolved route switch is added.
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: geobacter_pseudomonas_competition_mediators
  prompt: What causes increased Geobacter dominance during coculture adaptation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Geobacter-Dominated Coculture Adaptation
  - ecological_interactions#Inhibitory Response to Added Phenazine-1-Carboxylic Acid
  rationale: 'Abundance, sequence variants and protein changes do not selectively establish competition, killing,
    or a variant-to-dominance mechanism. PHZ-1-CA inhibition used added commercial material; coculture concentrations
    were below detection and this exposure did not select the observed variants. Test endogenous concentrations,
    alternative mediators, matched media and complemented variants while measuring both partners'' viable growth.
    Do not infer complete Geobacter independence from dominance: isolation attempts failed. Results/Table 2 and
    main Methods differ on the MIC duration units; no precise duration is asserted here. The initial-growth-to-later-dominance
    arrow is removed as serial-transfer chronology, not restored as biological causation.'
  posed_by: codex
  posed_date: '2026-10-06'
