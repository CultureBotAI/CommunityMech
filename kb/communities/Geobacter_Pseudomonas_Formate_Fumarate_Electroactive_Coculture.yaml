      label: Pseudomonas aeruginosa
- name: Inhibitory Response to Added Phenazine-1-Carboxylic Acid
  description: 'Added commercial phenazine-1-carboxylic acid inhibited growth in Geobacter pure-culture and coculture
    MIC assays conducted in their respective media. This demonstrates inhibitory capacity, not endogenous Pseudomonas-to-Geobacter
    chemical pressure in the studied cocultures: PHZ-1-CA was below detection in all cocultures. The tested PHZ-1-CA
    exposure did not select the coculture-associated tetR/fabI variants at the reported frequency threshold, and
    those variants also arose with phenazine-deficient Pseudomonas. Other antibiotics or non-antibiotic functions
    remain possible. No selection or dominance arrow is assigned to this measured added-compound response; a negative
    result for this compound and test does not exclude every phenazine derivative or exposure condition.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Geobacter sulfurreducens
    term:
      id: NCBITaxon:35554
      label: Geobacter sulfurreducens
  metabolites:
  - preferred_term: phenazine-1-carboxylic acid
    term:
      id: CHEBI:62412
      label: phenazine-1-carboxylic acid
    notes: Commercial compound added in the MIC assay; endogenous PHZ-1-CA remained below detection in the tested
      cocultures.
  evidence:
  - reference: PMID:32265334
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pseudomonas-derived phenazine-1-carboxylic acid (PHZ-1-CA) for its potential to inhibit Geobacter growth
    explanation: The abstract identifies the test compound. The primary Methods specify commercial PHZ-1-CA addition,
      not purification from these cocultures; its measured effect is not evidence of endogenous secretion.
  - reference: PMID:32265334
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Despite its inhibitory properties, PHZ-1-CA did not drive variant selection
    explanation: Supports inhibitory capacity and the compound-specific negative selection result. It does not prove
      endogenous antagonism, absence of all phenazine effects, or variant-caused dominance.
