    snippet: preferential utilization of formate and fumarate by P. aeruginosa and G. sulfurreducens respectively
    explanation: Supports complementary donor/acceptor use in the restricted medium, not carbon cross-feeding or
      an electron flux in the reverse direction.
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pure cultures did not yield significant growth while substantial growth was observed in cocultures
    explanation: Supports the initial coculture versus pure-culture growth contrast in this medium, not an all-media
      or all-adaptation-stage dependence claim.
