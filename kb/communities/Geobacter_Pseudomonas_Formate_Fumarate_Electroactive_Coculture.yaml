    snippet: upregulation in DIET-associated cytochromes
    explanation: SWATH-MS is an experimental protein-abundance measurement. Its mechanistic implication is partial,
      not a direct flux assay or proof that all growth requires DIET.
  - reference: PMID:28992596
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: DIET plays a critical role in the establishment of syntrophy
    explanation: The abstract interprets the combined protein and mutant evidence as DIET involvement. Retain that
      positive interpretation while distinguishing it from exclusive-route or resolved molecular-mechanism proof.
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: syntrophy was not reliant on phenazine
    explanation: The abstract reports growth of phenazine-deficient Pseudomonas cocultures; phenazine production
      is not established as necessary for early syntrophy.
  - reference: PMID:28992596
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: however appeared to rely on cytochromes as evidenced from the stunted growth
    explanation: The following primary abstract text identifies Geobacter omcZ and omcS mutant cocultures. This
      is positive growth-perturbation evidence, not solely protein association; full controls were unavailable.
  - reference: PMID:32265334
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: reliance on Pseudomonas spp. for providing electron donors through DIET
    explanation: The 2020 Results identify the proposed donor direction as Pseudomonas to Geobacter. This interpretation
      supports endpoint correction, not a measured numerical flux.
- name: Geobacter-Dominated Coculture Adaptation
  description: Across the tested Pseudomonas strains, Geobacter dominance increased between initial cocultures and
    the thirteenth transfer, as supported by qPCR and FISH. Geobacter fabI and tetR variants increased in frequency,
    with tetR-associated CyaE and RND-efflux protein changes. These are population and molecular observations, not
    proof that either variant causes dominance or that Geobacter directly inhibits or preys on Pseudomonas. The
    authors interpret a shift toward competition, but Geobacter could not be isolated from either early or adapted
    cocultures under the tested conditions, so complete loss of partner dependence was not established. qPCR can
    include inactive cells or extracellular DNA; FISH supports the abundance contrast. Adapted HybA and FdnG increases
    motivate hydrogen-transfer and increased direct formate-use interpretations; protein abundance alone does not
    quantify their fluxes, distinguish every transfer route or show that either mediates dominance.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:32265334
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: transition from syntrophy to competition
    explanation: The primary abstract says the observed dominance suggests competition. This is an interpretation,
      not a selective inhibition, predation, or causal variant assay.
  - reference: PMID:32265334
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: fabI and tetR genes emerged that were strongly selected for throughout coculture evolution
    explanation: Whole-genome sequencing supports selection of these variants in the laboratory cocultures. Their
      temporal association with dominance and protein changes does not assign a causal contribution to either variant;
      this is experimental sequence evidence, not in-silico prediction.
  - reference: PMID:32265334
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Geobacter sp. dominance increases with adaptation within the cocultures
    explanation: Supports measured increasing Geobacter dominance. The primary qPCR/FISH comparisons and isolation
      attempts bound what this abundance observation says about competition and partner dependence.
  participating_taxa:
  - preferred_term: Geobacter sulfurreducens
    term:
      id: NCBITaxon:35554
      label: Geobacter sulfurreducens
  - preferred_term: Pseudomonas aeruginosa
    term:
