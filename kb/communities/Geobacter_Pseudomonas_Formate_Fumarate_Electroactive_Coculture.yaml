ecological_interactions:
- name: Restricted-Medium Cooperative Growth
  description: Initial Geobacter sulfurreducens and Pseudomonas aeruginosa cocultures grew substantially in restricted
    formate-fumarate medium, whereas the corresponding pure cultures did not show significant growth. Formate serves
    as the donor preferentially used by Pseudomonas and fumarate as the acceptor used by Geobacter. This supports
    early cooperative metabolism under the tested conditions, not universal inability of either species to grow
    alone or complete partner independence after adaptation. The observation is a community growth outcome, not
    a Geobacter-to-Pseudomonas electron flux.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  - preferred_term: fumarate
    term:
      id: CHEBI:29806
      label: fumarate(2-)
  biological_processes:
