- name: Cytochrome-Associated Interspecies Electron Transfer
  description: Initial cocultures showed increased DIET-associated cytochrome abundance, and the primary abstract
    reports stunted growth in Geobacter omcZ- and omcS-deficient cocultures while phenazine-deficient Pseudomonas
    cocultures still grew. These observations support cytochrome-associated syntrophy and the authors' DIET interpretation.
    Pseudomonas is the inferred electron donor and Geobacter the recipient in the formate-donor/fumarate-acceptor
    system, not the reverse. Protein abundance is not direct electron-flux measurement, and the accessible evidence
    does not establish an exclusive transfer route or rule out pleiotropic mutant effects. The 2018 full Methods
    and perturbation controls were unavailable for this review; the 2020 primary Results explicitly describe Geobacter
    reliance on Pseudomonas electron donation.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
