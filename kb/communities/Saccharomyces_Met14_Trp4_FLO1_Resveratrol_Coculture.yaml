ecological_interactions:
- name: Met-Trp4 Coauxotrophic Cross-Feeding
  description: The Met-Trp4 coauxotrophic yeast pair forms a mutually dependent growth system in the tested medium
    lacking the complementary required nutrients. This growth relationship is distinct from the resveratrol pathway
    handoff and does not by itself establish enhanced product titer or unconditional dependence in supplemented
    environments.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Saccharomyces cerevisiae 007 met14 module A FLO1 cell 1
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  - preferred_term: Saccharomyces cerevisiae 007 trp4 module B FLO1 cell 2
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  evidence:
  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: two auxotrophic cells, cell 1 and cell 2, must be present simultaneously to form cross-feeding for
      growth
    explanation: Supports the mutual dependence of the engineered two-member auxotrophic yeast cocultures.
- name: Resveratrol Pathway Division of Labor
  description: The existing met14 module-A and trp4 module-B partners divide the resveratrol pathway around p-coumaric
    acid. The reported module assignment and product/intermediate measurements support the intended metabolic handoff,
    but do not directly quantify intercellular transfer flux or show that it alone explains the FLO1-associated
    production increment.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Saccharomyces cerevisiae 007 met14 module A FLO1 cell 1
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  target_taxon:
    preferred_term: Saccharomyces cerevisiae 007 trp4 module B FLO1 cell 2
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  metabolites:
  - preferred_term: p-coumaric acid
    term:
      id: CHEBI:32374
      label: trans-4-coumaric acid
  downstream:
  - target: FLO1 Adhesion-Enhanced Resveratrol Production
    description: 'PARTIAL: the divided pathway supplies the precursor-to-product route in the tested FLO1 coculture,
      enabling resveratrol synthesis. It does not independently explain the increase over the no-FLO1 control; adhesion-dependent
      transfer efficiency was not isolated as the mediator.'
  evidence:
  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Module A contained FjTAL, catalyzing L-tyrosine to p-coumaric acid, while module B contained At4CL
      and VvVST1, converting p-coumaric acid to resveratrol
    explanation: Supports the assigned two-module pathway and intended precursor handoff, not a directly measured
      intercellular flux or isolated cause of the FLO1 increment.
- name: FLO1 Adhesion-Enhanced Resveratrol Production
  description: The tested Met-Trp4 A-B:FLO1 coculture produced more resveratrol than its no-FLO1 counterpart, the
    corresponding FLO1 noncross-feeding control and the full-pathway monoculture. This is an aggregate production
    endpoint, not by itself a mutualistic fitness measurement. The higher titer co-occurred with precursor accumulation
    and lower biomass in this configuration; it does not establish more efficient precursor conversion or a universal
    benefit of adhesion across yeast pairs.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Saccharomyces cerevisiae 007 met14 module A FLO1 cell 1
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  - preferred_term: Saccharomyces cerevisiae 007 trp4 module B FLO1 cell 2
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  evidence:
  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, the pair Met-Trp4, in the presence of FLO1, always increased production
    explanation: Supports FLO1 adhesion as beneficial for resveratrol production in the Met-Trp4 background.
  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Met–Trp4A–B:FLO1 produced 0.67 μM of resveratrol, a 2.47-fold increase compared to Mctrl
    explanation: Quantifies the Met-Trp4 A-B:FLO1 endpoint against the full-pathway monoculture control.
