id: CommunityMech:000445
name: Saccharomyces Met-Trp4 FLO1 Resveratrol Coculture
description: >-
  A defined two-member synthetic Saccharomyces cerevisiae coculture that
  combines Met-Trp4 coauxotrophic cross-feeding, FLO1-mediated cell adhesion,
  and division of labor across the de novo resveratrol pathway. In the
  Met-Trp4 A-B:FLO1 configuration, a met14 knockout derivative of the
  nonflocculating 007 deletion background carries the FjTAL upstream module
  that converts L-tyrosine to p-coumaric acid, while a trp4 knockout partner
  carries the At4CL and VvVST1 downstream module that converts p-coumaric acid
  to resveratrol. After 48 h in SM medium, the FLO1 adhesion variant produced
  more resveratrol than the no-FLO1 Met-Trp4 A-B coculture, noncross-feeding
  controls, and a monoculture carrying the full pathway.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >-
    Combine cross-feeding, FLO1-mediated cell adhesion, and resveratrol-pathway
    division of labor in a synthetic yeast coculture.
  assembly_strategy: >-
    Pair a 007-derived met14 knockout Saccharomyces cerevisiae cell-1 lineage
    carrying module A with a 007-derived trp4 knockout cell-2 lineage carrying
    module B, then use the FLO1 adhesion version of the Met-Trp4 A-B coculture
    for the strongest resveratrol proof of concept.
  perturbation_design: >-
    Compare Met-Trp4 A-B:FLO1 against the corresponding no-FLO1 Met-Trp4 A-B
    coculture, no-cross-feeding module A/module B controls, and a monoculture
    control expressing the complete resveratrol pathway.
  measurement_endpoints:
  - OD600 after 48 h
  - p-coumaric acid concentration
  - Resveratrol concentration
  - Resveratrol production normalized by OD600
  evidence:
  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we used three coculture pairs (Lys–Ade, Trp2–Trp4 and Met–Trp4), each
      with or without the incorporating of FLO1co adhesion pairs
    explanation: >-
      Supports the use of Met-Trp4 FLO1 yeast pairs as one tested cross-feeding
      and adhesion design.
  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In each coculture, one strain was engineered with module A (FjTAL) and the
      other with module B (At4CL and VvVST1)
    explanation: >-
      Supports the division of labor between the FjTAL and At4CL/VvVST1
      resveratrol modules.
