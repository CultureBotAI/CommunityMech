      term:
        id: CHEBI:17234
        label: glucose
  preparation_notes: >-
    SM medium was prepared with yeast nitrogen base without amino acids, 20 g/L
    glucose, and amino acids from the Mülleder et al. recipe; resveratrol
    production assays inoculated two washed strains into 480 μl of SM at a
    combined starting OD600 of 0.8 and incubated 500 μl cultures for 48 h.
  evidence:
