  - reference: PMID:41491832
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All cultures were incubated at 30 °C and 250 rpm for 48 h in InforsHT
      Multitron incubators
    explanation: >-
      Supports the 30 °C, 250 rpm, 48 h incubation for the resveratrol
      bioproduction assay.
