ecological_interactions:
- name: C2 suspended-culture hexamine, formaldehyde, and COD removal
  description: In suspended AS broth containing 50 mg/L hexamine at 37 degrees Celsius, the 1:1:1 Brevundimonas diminuta SRCHD03,
    Brucella pseudintermedia SRCHD05, and Ochrobactrum sp. SRCHD06 consortium (C2) achieved 64.20%, 77.26%, and 89.07% hexamine
    reduction, 37.12%, 41.69%, and 41.57% formaldehyde reduction, and 7.39%, 18.85%, and 26.86% COD reduction at 24, 48, and
    72 h, improving hexamine and COD removal over the two-member C1 baseline (SRCHD05 + SRCHD06). Adding structured biofilm
    former SRCHD03 (20 h log phase, 121 min 4 s doubling time; the sole isolate showing complete monoculture removal of hexamine-derived
    ammonia at 72 h) to strong COD reducers SRCHD05 (42%) and SRCHD06 (36%) still resulted in net ammonia accumulation (15.71%,
    21.64%, and 23.51%) in C2, and reversible hexamine-formaldehyde-ammonia chemistry in nutrient-containing AS broth supports
    a single COMMUNITY_LEVEL node with 0 directed downstream edges.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    notes: Ammonia was produced as a hexamine breakdown by-product in the suspended-C2 assay (Table 2); a consortium ammonia
      sink is not established.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C2 64.20 77.26 89.07 37.12 41.69 41.57 7.39 18.85 26.86 15.71 21.64 23.51
    explanation: Quantifies the 24 h, 48 h, and 72 h bulk hexamine, formaldehyde, and COD reduction percentages and ammonia
      production percentages for Consortium C2 in suspended AS broth.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Only SRCHD03 showed complete removal of produced ammonia (from the breakdown of hexamine into ammonia and formaldehyde)
      at 72 h of incubation.
    explanation: Documents the 72 h monoculture ammonia-removal phenotype of isolate SRCHD03, which did not prevent net ammonia
      accumulation in the three-member C2 co-culture (Table 2).
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: COD analysis revealed that isolates SRCHD05 and SRCHD06 were more efficient among the selected isolates. They
      could reduce COD by 42 and 36% after 72 h of incubation at 37 °C from an initial load of 11,900 mg/L, respectively
    explanation: Provides the 72 h monoculture COD-reduction baselines for SRCHD05 (42%) and SRCHD06 (36%), the two core COD-reducing
      members combined with SRCHD03 in Consortium C2.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth curve data of the selected isolates revealed that the isolate SRCHD07 was the fastest growing strain
      among the selected five isolates, with a log phase of 12 h and doubling time of 49 min and 6 s. Isolates SRCHD06 (14
      h log phase, 128 min and 12 s doubling time), SRCHD05 (13.5 h log phase, 73 min and 2 s doubling time), SRCHD03 (20
      h log phase, 121 min and 4 s doubling time), and SRCHD04 (25 h log phase, 80 min, and 6 s doubling time) took longer
      time to reach growth saturation ( Figure 3 ).
    explanation: Quantifies the monoculture growth kinetics of C2 constituents SRCHD03 (20 h log phase, 121 min 4 s doubling
      time), SRCHD05 (13.5 h log phase, 73 min 2 s doubling time), and SRCHD06 (14 h log phase, 128 min 12 s doubling time).
