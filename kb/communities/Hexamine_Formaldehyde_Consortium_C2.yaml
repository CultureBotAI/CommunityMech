id: CommunityMech:000506
name: Hexamine Formaldehyde Consortium C2
description: Consortium C2 is a defined three-member hexamine- and formaldehyde-removing bacterial formulation assembled from
  environmental isolates Brevundimonas diminuta SRCHD03, Brucella pseudintermedia SRCHD05, and Ochrobactrum sp. SRCHD06 at
  a 1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius. Over 24, 48, and 72 h of suspended-culture
  incubation, C2 achieved 64.20%, 77.26%, and 89.07% hexamine reduction, 37.12%, 41.69%, and 41.57% formaldehyde reduction,
  and 7.39%, 18.85%, and 26.86% COD reduction while producing 15.71%, 21.64%, and 23.51% ammonia.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate the defined 3-isolate combination Consortium C2 (SRCHD03, SRCHD05, SRCHD06 at a 1:1:1 ratio) for removal
    of hexamine, its formaldehyde by-product, and chemical oxygen demand in suspended AS broth as part of the C1-C6 consortium
    development series.
  assembly_strategy: Select five hexamine-, formaldehyde-, and COD-removing environmental isolates (SRCHD03, SRCHD04, SRCHD05,
    SRCHD06, and SRCHD07) and test defined equal-ratio combinations C1-C6 in 50 mg/L hexamine AS broth at 37 degrees Celsius.
  inoculation_strategy: Combine Brevundimonas diminuta SRCHD03, Brucella pseudintermedia SRCHD05, and Ochrobactrum sp. SRCHD06
    at a 1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius and sample cell-free supernatants at 24,
    48, and 72 h.
  perturbation_design: Compare Consortium C2 across 24, 48, and 72 h incubation intervals against sibling consortia in the
    C1-C6 combinatorial assembly series in AS broth supplemented with 50 mg/L hexamine at 37 degrees Celsius.
  measurement_endpoints:
  - hexamine removal
  - formaldehyde removal
  - chemical oxygen demand removal
  - ammonia production
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on their hexamine, formaldehyde, and COD removal ability, five isolates were selected for consortium development
    explanation: Supports the bioremediation phenotype screen used to select the five isolates for C1-C5 consortium development.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '2 SRCHD03: SRCHD05: SRCHD06 (1:1:1) C2'
    explanation: Reports the Table 1 Consortium C2 assembly combining isolates SRCHD03, SRCHD05, SRCHD06 at a 1:1:1 ratio.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C2 64.20 77.26 89.07 37.12 41.69 41.57 7.39 18.85 26.86 15.71 21.64 23.51
    explanation: Quantifies Consortium C2 24 h, 48 h, and 72 h hexamine reduction, formaldehyde reduction, COD reduction,
      and ammonia production in suspended AS broth.
