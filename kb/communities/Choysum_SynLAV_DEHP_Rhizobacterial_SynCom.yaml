discussions:
- discussion_id: synlav-endpoint-colonization
  prompt: Only Pseudomonas L29, Sphingomonas L75 and Flavobacterium L11 targeted ASVs were reported after SynLAV
    inoculation of LAV rhizospheres; no targeted SynLAV ASVs were reported in HAV. Methods specify a 10-day endpoint
    whereas Results say two weeks. Are the inoculated strains viable and persistent at a consistently defined endpoint?
  kind: CURATION_TODO
  status: OPEN
  rationale: Initial five-isolate membership is known, but greater-than-99% V3-V4 sequence identity is an indicator
    rather than unique viable-strain detection. Rhodococcus L44 and Gordonia L115 were not reported as targeted
    ASVs in LAV. The source timing discrepancy and strain persistence require clarification; pot-level DEHP responses
    are not evidence that every member persists or dominates.
  evidence:
  - reference: PMID:42482240
    reference_title: Rhizobacterial functional assemblies modulate accumulation of phthalates in choysum (Brassica
      parachinensis L.)
    supports: SUPPORT
    evidence_source: full_text
    snippet: Pseudomonas sp. L29, Sphingomonas sp. L75, and Flavobacterium sp. L11) detected in the rhizosphere
      soil of LA V
    explanation: Names the three targeted ASVs reported in LAV; the primary text has inconsistent timing and uses
      short-amplicon identity as a presence indicator, not a viability assay.
- discussion_id: synlav_dehp_mediation
  prompt: Does reduced soil DEHP availability mediate the lower plant DEHP concentration?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#SynLAV DEHP degradation in choysum pots
  - ecological_interactions#Choysum DEHP accumulation reduction
  rationale: The source proposes this mechanism from isolate residual-DEHP screens, pot concentration endpoints
    and abundance associations. It does not isolate mineralization, quantify total plant burden, resolve each strain
    contribution or perturb the proposed soil-availability mediator independently of plant physiology. Cross-inoculation
    Methods specify 10 days but Results say two weeks; the accepted manuscript may be corrected in its final version.
  posed_by: codex
  posed_date: '2026-10-05'
