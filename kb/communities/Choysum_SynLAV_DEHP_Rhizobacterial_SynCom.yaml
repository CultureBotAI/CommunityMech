id: CommunityMech:000403
name: Choysum SynLAV DEHP-Degrading Rhizobacterial SynCom
description: A five-member synthetic rhizobacterial community assembled from the low-accumulation choysum rhizosphere isolates
  Flavobacterium sp. L11, Pseudomonas sp. L29, Sphingomonas sp. L75, Rhodococcus sp. L44, and Gordonia sp. L115. The isolates
  were selected as non-antagonistic, DEHP-degrading representative strains, mixed at equal ratios after OD600 0.5 normalization,
  and tested in choysum pots containing 100 mg/kg DEHP-contaminated soil.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Assemble a simplified low-accumulation-variety choysum SynCom enriched for DEHP degradation and test whether
    it lowers DEHP residues and plant accumulation in DEHP-contaminated rhizosphere soil.
  assembly_strategy: Select five genus-distinct choysum rhizosphere isolates that lacked visible pairwise antagonism and individually
    removed 22-54% DEHP after 72 h, normalize each suspension to OD600 0.5 in PBS, and mix the isolates in equal ratios to
    make SynLAV.
  inoculation_strategy: Dilute the SynCom to OD600 0.2 in PBS and inoculate two-week-old choysum seedlings grown in 100 mg/kg
    DEHP-contaminated soil with 5 mL SynCom suspension per plant.
  perturbation_design: Compare SynLAV and SynHAV cross-inoculation on low-accumulation and high-accumulation choysum varieties
    under 100 mg/kg DEHP soil stress.
  measurement_endpoints:
  - rhizosphere soil DEHP residues
  - plant DEHP accumulation
  - fresh plant weight
  - targeted 16S rRNA ASV detection of inoculated SynCom strains
  - individual isolate DEHP degradation after 72 h
  evidence:
  - reference: PMID:42482240
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The simplified SynComs of LA V (named SynLA V) and HA V (named SynHA V) were designed by selecting representative
      rhizobacterial isolates, respectively.
    explanation: Names SynLAV as the simplified SynCom built from LAV rhizobacterial isolates.
  - reference: PMID:42482240
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: candidate isolates without inhibiting effects on one another were selected. As shown in Table S2, the selected
      five members of SynLA V harbored DEHP-degradation rates ranging from 22% to 54% and negligible PGP activity
    explanation: Supports non-antagonistic selection and the 22-54% 72 h DEHP-degradation range for the five selected SynLAV
      members.
  - reference: PMID:42482240
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the SynLA V or SynHA V were obtained by mixing the isolates in equal ratios
    explanation: Supports equal-ratio assembly after PBS OD600 normalization.
  - reference: PMID:42482240
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the seedlings of LA V or HA V were inoculated with 5 mL of each SynCom inoculum, respectively.
    explanation: Supports the per-seedling SynCom inoculum volume in the cross-inoculation design.
