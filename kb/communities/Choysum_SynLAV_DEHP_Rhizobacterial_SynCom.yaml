  prompt: The 10-day targeted-ASV endpoint detected Pseudomonas sp. L29, Sphingomonas sp. L75, and Flavobacterium sp. L11
    after SynLAV inoculation of LAV rhizospheres; Rhodococcus sp. L44 and Gordonia sp. L115 were not reported among the targeted
    ASVs at that endpoint.
  kind: CURATION_TODO
  status: OPEN
  rationale: The record can support initial SynLAV membership and pot-level DEHP reduction, but a future time-series or strain-specific
    assay would be needed to decide whether all five strains persist in the LAV rhizosphere through the endpoint.
  evidence:
  - reference: PMID:42482240
    reference_title: Rhizobacterial functional assemblies modulate accumulation of phthalates in choysum (Brassica parachinensis
      L.)
    supports: SUPPORT
    evidence_source: full_text
    snippet: Pseudomonas sp. L29, Sphingomonas sp. L75, and Flavobacterium sp. L11) detected in the rhizosphere soil of LA
      V
    explanation: Documents which SynLAV members were detected as targeted ASVs in the LAV rhizosphere at the endpoint.
