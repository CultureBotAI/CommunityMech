ecological_interactions:
- name: SynLAV DEHP degradation in choysum pots
  description: PARTIAL - SynLAV inoculation lowered measured rhizosphere-soil DEHP residues in choysum pots containing
    100 mg/kg DEHP relative to PBS controls. Individual constituent isolates separately showed 22-54% residual-DEHP
    disappearance after 72 hours in 100 mg/L MSM assays, not measured mineralization or demonstrated community complementarity.
    Pot residue measurements do not by themselves isolate biodegradation from other dissipation processes or establish
    which inoculated strains performed it.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: DEHP
    term:
      id: CHEBI:17747
      label: bis(2-ethylhexyl) phthalate
    concentration: 100 mg/kg in pot soil and 100 mg/L in individual isolate MSM degradation assays
    notes: The paper abbreviates di(2-ethylhexyl) phthalate as DEHP.
  downstream:
  - target: Choysum DEHP accumulation reduction
    description: HYPOTHESIZED - lower rhizosphere-soil DEHP availability could reduce the external supply available
      for plant uptake, contributing to the lower plant concentration. Co-occurring soil/plant concentration changes
      and abundance regressions do not isolate this mediation from plant uptake, internal metabolism or other dissipation
      processes.
  evidence:
  - reference: PMID:42482240
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "SynLAV\tFlavobacterium sp. L11\tProteobacteria\t22%\tIAA"
    explanation: The first SynLAV table row establishes the 22% 72 h DEHP-degradation activity of L11. This is an
      individual-isolate residual-DEHP assay, not a pot-level flux or community-complementarity measurement; source
      phylum text is not an ontology grounding.
  - reference: PMID:42482240
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Pseudomonas sp. L29\tProteobacteria\t46%\tP"
    explanation: The SynLAV table establishes the 46% 72 h DEHP-degradation activity of L29. This is an individual-isolate
      residual-DEHP assay, not a pot-level flux or community-complementarity measurement; source phylum text is
      not an ontology grounding.
  - reference: PMID:42482240
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Sphingomonas sp. L75\tActinobacteria\t37%\tP, NF"
    explanation: The SynLAV table establishes the 37% 72 h DEHP-degradation activity of L75. This is an individual-isolate
      residual-DEHP assay, not a pot-level flux or community-complementarity measurement; source phylum text is
      not an ontology grounding.
  - reference: PMID:42482240
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Rhodococcus sp. L44\tActinobacteria\t54%"
    explanation: The SynLAV table establishes the 54% 72 h DEHP-degradation activity of L44. This is an individual-isolate
      residual-DEHP assay, not a pot-level flux or community-complementarity measurement; source phylum text is
      not an ontology grounding.
  - reference: PMID:42482240
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Gordonia sp. L115\tActinobacteria\t42%"
    explanation: The SynLAV table establishes the 42% 72 h DEHP-degradation activity of L115. This is an individual-isolate
      residual-DEHP assay, not a pot-level flux or community-complementarity measurement; source phylum text is
      not an ontology grounding.
  - reference: PMID:42482240
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynLA V significantly reduced rhizosphere soil DEHP residues and plant DEHP accumulation in comparison
      to uninoculated controls.
    explanation: Supports the inoculation-associated rhizosphere-soil residue endpoint. Primary Figure 4 and GC-MS
      Methods distinguish concentration measurements from the proposed degradation mechanism.
- name: Choysum DEHP accumulation reduction
  description: SynLAV inoculation decreased measured DEHP concentration in choysum plants relative to PBS controls,
    especially in the low-accumulation variety. Figure 4 reports mg/kg, not total accumulated plant mass. This host
    endpoint is distinct from soil residues; neither it nor the Figure 5 abundance regressions demonstrates that
    soil biodegradation uniquely mediates the response or that all five inoculated strains persist.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: DEHP
    term:
      id: CHEBI:17747
      label: bis(2-ethylhexyl) phthalate
    concentration: 100 mg/kg in pot soil
    notes: The paper abbreviates di(2-ethylhexyl) phthalate as DEHP.
  evidence:
  - reference: PMID:42482240
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynLA V significantly reduced rhizosphere soil DEHP residues and plant DEHP accumulation in comparison
      to uninoculated controls.
    explanation: Supports lower plant DEHP concentration after inoculation; Figure 4 uses mg/kg. It does not establish
      total plant burden or unique soil-to-plant causal mediation.
