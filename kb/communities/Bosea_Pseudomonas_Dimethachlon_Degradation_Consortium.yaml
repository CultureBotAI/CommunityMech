id: CommunityMech:000334
name: Bosea-Pseudomonas Dimethachlon-Degradation Consortium
description: >
  A defined two-strain consortium reconstructed from the dimethachlon-enriched
  community JHJ-2. Bosea sp. S6 transforms dimethachlon into the toxic
  intermediate 3,5-dichloroaniline, and Pseudomonas sp. KH-1 consumes that
  intermediate, completing a sequential degradation and detoxification handoff.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine complementary transformation steps to remove dimethachlon and its toxic 3,5-dichloroaniline metabolite from contaminated soil.
  assembly_strategy: Isolate strains S6 and KH-1 from the JHJ-2 enrichment and reconstruct them as a defined two-strain consortium.
  measurement_endpoints:
  - dimethachlon removal
  - 3,5-dichloroaniline removal
  - zebrafish toxicity of transformation products
  - soil bioaugmentation performance
  evidence:
  - reference: PMID:41326129
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A synthetic consortium was constructed, comprising Bosea sp. S6, which transforms dimethachlon to 3,5-dichloroaniline, and Pseudomonas sp. KH-1, which degrades 3,5-dichloroaniline
    explanation: Supports the exact composition, reconstruction, and complementary design.
environment_term:
  preferred_term: dimethachlon-contaminated soil bioaugmentation system
  term:
    id: ENVO:00002116
    label: contaminated soil
  notes: The synthetic consortium was applied to dimethachlon-contaminated soil after construction from isolates recovered from enrichment JHJ-2.
