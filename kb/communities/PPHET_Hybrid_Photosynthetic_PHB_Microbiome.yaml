ecological_interactions:
- name: Engineered Phototroph Integration
  description: Synechocystis sp. PCC 6803 PPT1 was integrated into the retained non-cyanobacterial fraction of WCRM.
    Microscopy, plating, repeated propagation and colony PCR supported replacement and persistence of the engineered
    phototroph. PPHET preserved high PHB production comparable to axenic PPT1 and greater than WCRM. This is an
    experimental community-composition intervention and functional integration, not an isolated priority-effect
    or colonization-facilitation mechanism.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  downstream:
  - target: Nitrate-Limited Photoautotrophic PHB Production
    description: 'Replacing the native phototroph with PHB-optimized PPT1 gives the hybrid community high PHB-production
      capacity: PPHET reached 48% PHB/CDW, compared with 50% for axenic PPT1 and about 10% for WCRM under the matched
      small-scale regime. This supports the engineered phototroph contribution, not proof that every increment arises
      exclusively in PPT1 or from colonization facilitation.'
  evidence:
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Microscopy analysis validated the successful colonisation and replacement of the original phototrophic
      strain with PPT1 or GFP
    explanation: Main text reports integration; separate supplementary images were not audited.
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PPHET reached similar PHB levels, up to 48% PHB/CDW
    explanation: The engineered hybrid retains the high-production phenotype relative to WCRM.
- name: Nitrate-Limited Photoautotrophic PHB Production
  description: In the 19-day small-scale BG110 regime with 5 mM nitrate and 10 mM bicarbonate, followed by a 50
    mM bicarbonate boost after nitrate depletion, PPHET reached up to 48% PHB/CDW versus 50% for PPT1 and about
    10% for WCRM, with three biological replicates. HPLC measured bulk PHB; BODIPY-positive non-Synechocystis cells
    suggest additional producers but do not resolve each taxon or its PHB flux. These production phenotypes do not
    demonstrate reduced competition through niche partitioning.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hydrogencarbonate
    term:
      id: CHEBI:17544
      label: hydrogencarbonate
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  - preferred_term: poly(3-hydroxybutyrate)
    term:
      id: CHEBI:53389
      label: poly(3-hydroxybutyrate)
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  evidence:
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PPHET reached similar PHB levels, up to 48% PHB/CDW
    explanation: Supports high PHB accumulation by the hybrid microbiome.
  - reference: PMID:41559821
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: other members of the community stained positive for BODIPY
    explanation: BODIPY-positive non-Synechocystis cells suggest additional PHB accumulators; bulk HPLC does not
      quantify their individual contributions.
- name: Dark Acetate PHB Accumulation
  description: After photoautotrophic growth, 30 mM acetate and 10 mM bicarbonate in BG110 supported further dark
    PHB accumulation in PPHET but not axenic PPT1. At two weeks, dark PPHET reached about 38% PHB/CDW but only about
    23 mg/L, versus about 55% and 250 mg/L in light, reflecting different biomass. BODIPY granules localized primarily
    to non-cyanobacterial cells in darkness. This supports condition-dependent metabolic flexibility, not measured
    inter-member transfer or demonstrated competition-reducing niche separation.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: poly(3-hydroxybutyrate)
    term:
      id: CHEBI:53389
      label: poly(3-hydroxybutyrate)
  evidence:
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In darkness, only PPHET continued to accumulate PHB, reaching ~38% PHB/CDW
    explanation: Direct small-scale dark-production comparison; percentage is distinct from volumetric yield.
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PHB granules localised primarily in heterotrophic members of the community
    explanation: Microscopy supports localization, not species-resolved PHB flux.
- name: PPHET Stress Resilience and Scaled PHB Production
  description: PPHET retained pigmentation, biomass and PHB under increased light and recovered from transient 38
    C heat stress better than axenic PPT1. Small-scale high-light PHB averaged about 300 versus 100 mg/L; nonsterility
    alone had only a minor small-scale effect. In nonsterile scale-up, PPT1 collapsed after added illumination while
    PPHET kept growing. Separate PPHET production runs reached 33% PHB/CDW (about 250 mg/L) in a 4 L high-light
    flat panel and 22% (about 70 mg/L) in an 8 L non-aerated dark acetate reactor. These support community-associated
    resilience and production, not proven oxygen-scavenging mediation, anaerobiosis from lack of aeration, or equivalent
    yield across reactors.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PPHET maintained pigmentation during heat stress and resumed growth upon return to standard conditions.
    explanation: Positive recovery after heat stress; the mechanism is unresolved.
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PPHET reached 33% PHB/CDW (~250 mg L−1)
    explanation: Scaled flat-panel result, distinct from the small-scale 48% result.
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: yielded 22% PHB/CDW (~70 mg L−1)
    explanation: Separate 8 L dark reactor result, not the photoautotrophic yield.
