id: CommunityMech:000359
name: PPHET Hybrid Photosynthetic PHB Microbiome
description: 'A hybrid photosynthetic microbiome that combines the engineered polyhydroxybutyrate-producing cyanobacterium
  Synechocystis sp. PCC 6803 PPT1 with the non-cyanobacterial fraction of a wild cyanobacteria-rich microbiome (WCRM). The
  engineered phototroph replaced the native cyanobacterial component of WCRM while retaining a heterotrophic community dominated
  by Proteobacteria/Pseudomonadota and Bacteroidota. PPHET accumulated up to 48% PHB per cell dry weight in nitrogen-limited
  small-scale photoautotrophic cultures, continued to accumulate PHB under dark acetate-fed conditions in which PHB granules
  localized primarily to heterotrophic members, and retained PHB production in non-sterile 4 L flat-panel and 8 L dark scaled
  reactors.

  '
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOTECHNOLOGY
engineering_design:
  objective: 'Replace native phototrophs from a stable cyanobacteria-rich natural microbiome with a genetically engineered
    Synechocystis PCC 6803 strain to combine natural microbiome robustness with synthetic PHB production.

    '
  assembly_strategy: 'Selectively isolate the non-cyanobacterial WCRM fraction on BG11 agar-agar, resuspend colonies in BG11,
    serially dilute the heterotroph pool, and use it to inoculate exponentially growing axenic PPT1 cultures.

    '
  perturbation_design: 'Compare axenic PPT1, PPHET, and WCRM under nitrogen-limited photoautotrophic PHB production, non-sterile
    cultivation, elevated light, heat shock, dark acetate-fed induction, and larger flat-panel or glass-vessel reactor conditions.

    '
  measurement_endpoints:
  - OD750 growth
  - Chlorophyll a accumulation
  - Polyhydroxybutyrate titer and percent PHB per cell dry weight
  - 16S rRNA amplicon community composition
  - BODIPY-stained PHB granule localization
  - pH and oxygen under stress conditions
  evidence:
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: creating what we term a hybrid microbiome
    explanation: 'Supports the strategy of replacing native phototrophs in the source microbiome with the engineered Synechocystis
      strain.

      '
  - reference: PMID:41559821
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We refer to the new hybrid culture with PPT1 as core species as PPHET consortia
    explanation: Names the engineered hybrid culture as PPHET.
