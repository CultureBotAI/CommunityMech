  rationale: 'Zini et al. propose heterotrophic oxygen scavenging as a possible mechanism for high-light tolerance but report
    it as qualitative support rather than a direct pairwise mechanism, so the record tracks it as a hypothesis instead of
    an asserted interaction.

    '
  evidence:
