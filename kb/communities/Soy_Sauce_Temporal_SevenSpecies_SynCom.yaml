  unit: '% w/w salt'
  description: The laboratory moromi mash for SynCom fermentation used the same mature-koji and brine preparation as the traditional
    soy-sauce fermentation, yielding 18% salt.
  evidence:
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: One kilogram of the mature koji was combined with 2 L of brine to make a moromi mash containing 18% (w/w) salt.
    explanation: Specifies the salt concentration of the soy-sauce moromi mash.
growth_media:
- name: soy sauce moromi mash with temporal SynCom inoculation
  temperature: '30'
  temperature_unit: °C
  salinity: '18'
  salinity_unit: '% w/w salt'
  inoculum_size: LAB strains at 1.0 x 10^8 CFU/g on days 0, 5, and 10
  inoculum_unit: CFU/g
  incubation_time: '40'
  incubation_time_unit: days
  vessel_type: sterile beaker or tray for koji; 5 L gauze-covered beaker for moromi
  preparation_notes: Koji was prepared in a sterile beaker and tray for the SynCom assay; mature koji was combined with brine
    for 40 days of 30 C soy-sauce moromi fermentation with LAB added on days 0, 5, and 10 and yeasts added 25 days after
    brine-fermentation initiation.
  evidence:
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Preparation of soy sauce moromi mash was the same as traditional soy sauce fermentation. Fermentation was performed
      at 30 °C for 40 d.
    explanation: Connects the synthetic-community moromi preparation to the 30 C, 40-day fermentation condition.
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: W. paramesenteroides, L. plantarum, T. halophilus, P. pentosaceus, P. acidilactici, and S. epidermidis were inoculated
      at the assigned time (0 d, 5 d, or 10 d) with the same concentration (1.0 × 108 CFU/g). Z. rouxii and C. orthopsilosis
      were added on 25 days after initiation of brine fermentation.
    explanation: Specifies the LAB inoculation concentration and late yeast addition time used in SynCom fermentations.
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Briefly, in 0–24 h, koji was prepared in a sterile beaker at 30 °C and 90% relative humidity. Then the koji was
      crushed and transferred to a sterile tray and incubated under the same conditions.
    explanation: Describes the sterile beaker and tray conditions used for SynCom koji-making before moromi assembly.
