discussions:
- discussion_id: soy_sauce_temporal_syncom_industrial_transfer
  prompt: Which temporal inoculation times, ratios, and process controls make the seven-species soy-sauce SynCom robust in
    industrial moromi systems?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - engineering_design#Soy Sauce Temporal Seven-Species SynCom
  - cultivation_setup#soy sauce moromi mash with temporal SynCom inoculation
  rationale: The source reports homogeneous laboratory fermentations and explicitly states that oxygen gradients, uneven salt
    distribution, and differing aeration regimes in industrial moromi could alter SynCom behavior.
  posed_by: codex
  posed_date: '2026-09-14'
  evidence:
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: full_text
    snippet: Moreover, soy sauce fermentations in this work were performed under homogeneous lab conditions. Industrial production
      of soy sauce moromi systems features oxygen gradients, uneven salt distribution, and different aeration regimes, which
      likely alter SynCom behaviors.
    explanation: Names the laboratory-scale limitation and the industrial gradients that could alter temporal SynCom behavior.
