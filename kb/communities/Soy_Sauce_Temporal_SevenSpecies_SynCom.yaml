id: CommunityMech:000378
name: Soy Sauce Temporal Seven-Species SynCom
description: A laboratory-scale temporal synthetic microbial community for soy sauce moromi fermentation. Chen et al. 2026
  distilled a nine-member candidate set to seven core species and tested delayed inoculation schemes in which Aspergillus
  oryzae 3.042 made koji, Weissella paramesenteroides WP-8 was added at day 0, Lactiplantibacillus plantarum JL-20 at day
  5, Pediococcus pentosaceus PP-11 plus Tetragenococcus halophilus R44 at day 10, and Zygosaccharomyces rouxii ZQ-01 plus
  Candida orthopsilosis CV-13 at day 25. The best W->L->P+T->Z+C formulation raised glutamic acid, 4-ethylguaiacol, and total
  volatile production relative to the traditional-fermentation control under homogeneous 40-day laboratory conditions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct a temporal seven-species SynCom from core soy-sauce moromi microbes to improve glutamate and volatile
    flavor-compound production during controlled soy sauce fermentation.
  assembly_strategy: Select soy-sauce taxa by dominance, co-occurrence, volatile-association, and omission assays, retain
    seven species for the functional core, use Aspergillus oryzae for koji-making, and compare temporal lactic-acid bacterial
    inoculation orders before adding the two yeasts in late fermentation.
  inoculation_strategy: 'Use the W->L->P+T->Z+C temporal order: W. paramesenteroides on day 0, L. plantarum on day 5, P. pentosaceus
    plus T. halophilus on day 10, LAB at 1.0 x 10^8 CFU/g on their assigned days, and Z. rouxii plus C. orthopsilosis
    on day 25.'
  perturbation_design: Use omission fermentations to test candidate core-strain function and compare seven temporal inoculation
    orders for the retained lactic-acid bacteria against a traditional soy-sauce fermentation control.
  measurement_endpoints:
  - moromi pH, amino acid nitrogen, total acid, total nitrogen, and reducing sugar
  - glutamic acid content
  - 4-ethylguaiacol content
  - volatile alcohol, ester, and phenolic compound production
  - sensory umami, sweetness, and smoky-taste scores
  counter_selection:
  - criterion: The omission assay left Pediococcus acidilactici PP-7 and Staphylococcus epidermidis HC-1 out of the final
      seven-species core after integrating umami-amino-acid and 4-EG indicator results.
    excluded_count: 2
    evidence:
    - reference: PMID:42195939
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Omissions of microorganisms other than P. acidilactici or S. epidermidis significantly reduced production of
        4-EG, which was decreased by 42.8%, 45.6%, and 56.5% with the omissions of L. plantarum, Z. rouxii, or C. orthopsilosis
        compared to the control group
      explanation: Supports P. acidilactici and S. epidermidis as candidates that were not carried into the final seven-species
        core.
    - reference: PMID:42195939
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Integrating both soy sauce fermentation indicators, the core microbes for soy sauce fermentation were identified
        as seven microbial species: W. paramesenteroides, L. plantarum, T. halophilus, P. pentosaceus, A. oryzae, Z. rouxii,
        and C. orthopsilosis.'
      explanation: Identifies the seven microbial species retained as the soy-sauce fermentation core after indicator-based
        omission assays.
  notes: The article also nominated P. acidilactici PP-7 and S. epidermidis HC-1 during the initial nine-member core screen;
    they are intentionally omitted from this record because the indicator-integrated core named seven microbial species.
  evidence:
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study identified seven functionally important core microbes, including Weissella paramesenteroides, Lactiplantibacillus
      plantarum, Tetragenococcus halophilus, Pediococcus pentosaceus, Zygosaccharomyces rouxii, Candida orthopsilosis, and
      Aspergillus oryzae for soy sauce fermentation, based on dominant taxa, co-occurrence relationships, and volatile-associated
      taxa analysis.
    explanation: Summarizes the study's seven-species core and its correlation-guided selection logic.
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The synthetic microbial community was assembled with inoculation of dominant lactic acid bacteria (LAB) in the
      immediate early phase, other LAB in early and middle phases, and yeasts in the late phase.
    explanation: Supports the staged temporal assembly principle for the soy-sauce SynCom.
