ecological_interactions:
- name: Four-phase temporal soy sauce inoculation
  description: The final seven-species community was assembled by separating dominant LAB, other LAB, and yeasts across the
    immediate-early, early/middle, and late moromi phases while A. oryzae made the koji substrate.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: W->L->P+T->Z+C soy-sauce flavor output
    description: The four-stage ordering led to the W->L->P+T->Z+C group that outperformed other temporal LAB orderings in
      the 40-day assay.
  evidence:
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on the identified core microbes, soy sauce fermentation conducted with different synthetic communities
      was performed to optimize the assembly of SynCom.
    explanation: Supports testing multiple temporal SynComs to optimize assembly.
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: W → L → P+T → Z+C +W. paramesenteroides +L. plantarum +P. pentosaceus +T. halophilus
    explanation: Names the best temporal LAB order from Table 1.
- name: W->L->P+T->Z+C soy-sauce flavor output
  description: The W->L->P+T->Z+C SynCom increased 40-day glutamic acid, 4-ethylguaiacol, and total volatile output relative
    to the traditional fermentation control and had higher alcohol, ester, and phenolic compound levels than the other tested
    SynComs.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  metabolites:
  - preferred_term: glutamic acid
    term:
      id: CHEBI:18237
      label: glutamic acid
  - preferred_term: 4-ethylguaiacol
    term:
      id: CHEBI:179252
      label: 4-Ethyl-2-methoxyphenol
  evidence:
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 40 days of fermentation, glutamic acid content in SynCom group W→L→P+T→Z+C reached 8.5 g/L, which was 1.06
      times higher than that of the control group.
    explanation: Supports elevated glutamic acid after 40 days in the best temporal SynCom.
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Concurrently, the 4-EG content and total volatiles reached 71.32 μg/L ( Figure 6 b) and 2855.44 μg/L ( Figure
      6 c) in SynCom group W→L→P+T→Z+C, respectively, representing increases of 1.11 times and 1.25 times compared to the
      control group.
    explanation: Supports elevated 4-ethylguaiacol and total volatiles after 40 days in the best temporal SynCom.
  - reference: PMID:42195939
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In terms of volatiles, SynCom group W→L→P+T→Z+C exhibited significantly higher levels of alcohols, esters, and
      phenolic compounds than those in other SynCom groups
    explanation: Supports the volatile-class improvement of the best temporal SynCom relative to other SynCom orderings.
