ecological_interactions:
- name: Methane Removal and Mutualistic Growth
  description: The M. alcaliphilum 20Z/Chlorella sp. HS2 coculture enhanced growth of both members under saline
    conditions (>3.0%), supporting the authors' mutualistic-growth interpretation. Increased methane provision in
    enclosed bottles led to saturated methane removal. Positive growth and removal are retained, without assigning
    all benefits to measured reciprocal O2/CO2 transfer or implying obligatory dependence.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chlorella sp. HS2
