id: CommunityMech:000192
name: Methylomicrobium-Chlorella Methane Sequestration Coculture
description: >
  A defined halotolerant methanotroph-microalga coculture pairing
  Methylomicrobium alcaliphilum 20Z, currently represented by NCBI as
  Methylotuvimicrobium alcaliphilum 20Z, with Chlorella sp. HS2. The
  two-member system was assembled to test biological methane and carbon dioxide
  mitigation through metabolic coupling in saline culture, with increased
  methane removal, improved growth of both members, pH recovery, and greater
  biomass carbon sequestration reported in coculture. The system is relevant to
  DOE interests in methane mitigation, carbon capture and utilization,
  photosynthetic-methanotrophic consortia, and C1 bioconversion.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: CARBON_SEQUESTRATION
engineering_design:
  objective: >
    Assemble a two-member methanotroph-microalga consortium for biological
    methane and carbon dioxide sequestration under saline conditions.
  assembly_strategy: >
    Co-cultivate Methylomicrobium alcaliphilum 20Z with Chlorella sp. HS2 in
    saline laboratory culture to couple methane oxidation with algal carbon
    capture and oxygenic photosynthesis.
  perturbation_design: >
    Test saline coculture above 3.0% salinity, vary initial inoculum ratios,
    and increase methane provision in enclosed serum bottles.
  measurement_endpoints:
  - Methane removal
  - Growth of both microbial partners
  - Biomass carbon sequestration
  - Culture pH recovery
  - Inoculum-ratio effects on biomass yield
  evidence:
  - reference: doi:10.1016/j.biortech.2024.130607
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: methane removal potential of the identified halotolerant consortium
    explanation: Supports the stated design objective for methane sequestration by a coupled consortium.
  - reference: doi:10.1016/j.biortech.2024.130607
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Initial inoculum ratio did not result in a substantial difference in biomass yield.
    explanation: Supports inoculum ratio as an explicitly tested design variable.
