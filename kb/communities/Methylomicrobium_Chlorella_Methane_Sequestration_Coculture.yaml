discussions:
- discussion_id: chlorella_exact_pair_mediators_and_model_scope
  prompt: Which processes mediate the positive growth, pH and biomass-carbon effects in the exact 20Z/HS2 pair?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Methane Removal and Mutualistic Growth
  - ecological_interactions#Methane and Carbon Dioxide Mitigation
  - ecological_interactions#Saline Metabolic Coupling and pH Recovery
  rationale: 'Preserve mutual growth enhancement, methane removal and biomass carbon sequestration. The exact-pair
    primary abstract was read; publisher full text returned 403, so no absence-of-controls claim is made. Both cited
    model papers (doi:10.1016/j.mex.2022.101652 and doi:10.20517/mrr.2023.70) actually study M. buryatense 5GB1/A.
    platensis. Their complete main texts support kinetic/computational context, not independent exact-pair evidence.
    DynamiCom nitrogen exchange is a prediction awaiting experimental validation, not an HS2 mechanism. Remove those
    graph evidence items without inventing new nitrogen-exchange structure. #1608 addresses graph scope.'
  posed_by: codex
  posed_date: '2026-10-07'
