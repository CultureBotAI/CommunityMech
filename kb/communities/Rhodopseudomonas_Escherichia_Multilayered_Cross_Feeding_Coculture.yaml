id: CommunityMech:000469
name: Rhodopseudomonas palustris and Escherichia coli Multilayered Cross-Feeding Coculture
description: Defined synthetic bacterial coculture pairing phototrophic nitrogen-fixing Rhodopseudomonas palustris CGA676
  with fermentative Escherichia coli PFM2 in an obligate bidirectional carbon-and-nitrogen cross-feeding relationship evolved
  for 650-800 generations alongside matched monocultures. Beyond engineered carbon (organic acids from glucose fermentation)
  and nitrogen (ammonium from N2 fixation) exchange, the coculture engages in additional cross-feeding of adenine and iron
  that represses biosynthesis and scavenging gene expression in the recipient and limits rather than promotes emergent metabolic
  dependencies.
