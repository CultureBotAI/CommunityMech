- name: Floral-fruity aroma emergence under three-fungus inoculation
  description: Pu'er tea inoculated with the three-fungus starter was associated with a distinct floral-fruity aroma, while
    combined ROAV and VIP analyses prioritized geraniol, phenylethyl alcohol, trans-β-ionone, and 1-octen-3-ol as aroma-active
    volatiles.
  scope: COMMUNITY_LEVEL
