id: CommunityMech:000430
name: Pu'er Floral-Fruity Fungal SynCom
description: A defined three-fungus starter for controlled ripe Pu'er tea pile fermentation. Yan et al. 2026 inoculated
  sun-dried green tea leaves with a patented Saccharomyces cerevisiae, Rhizopus arrhizus, and Aspergillus niger starter
  at a 2:1:2 weight ratio, then integrated sensory evaluation, physicochemical measurements, volatile and non-volatile
  metabolomics, and metagenomic sequencing across six fermentation stages to profile the emergence of a floral-fruity
  aroma.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Use a patented three-fungus synthetic starter to generate and mechanistically profile floral-fruity aroma during
    ripe Pu'er tea fermentation.
  assembly_strategy: Assemble Saccharomyces cerevisiae, Rhizopus arrhizus, and Aspergillus niger in a 2:1:2 weight ratio
    for inoculation into Yunnan sun-dried green tea leaves.
  inoculation_strategy: Inoculate the fungal starter at 0.1% weight/weight of tea leaves and add water at 30% weight/weight
    of the leaf mass before covered solid-state pile fermentation at ambient temperature.
  measurement_endpoints:
  - descriptive sensory evaluation across six fermentation stages
  - physicochemical profiles of the tea pile and leaves
  - volatile profiling by HS-SPME-GC x GC-TOFMS
  - non-volatile metabolomics by UHPLC-Q-Exactive/MS
  - metagenomic sequencing of microbial succession
  - Random Forest prediction of genera associated with aroma-active volatiles
  notes: The article reports patent identifiers for the three starter components, not culture-collection accessions or formal
    strain names. Machine-learning associations linked the prioritized aroma compounds to Sphingomonas, Rothia, and Bacteroides
    in the broader fermentation succession, so this record keeps the starter's floral-fruity aroma output at community scope
    and does not assign a compound-specific biosynthetic edge to any inoculated fungus.
  evidence:
  - reference: PMID:42331835
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: synthetic fungal consortium composed of Saccharomyces cerevisiae, Rhizopus arrhizus, and Aspergillus niger
    explanation: Identifies the three starter taxa used for the ripe Pu'er tea fungal SynCom.
  - reference: PMID:42331835
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The three strains were mixed at a ratio of 2:1:2 (w/w).
    explanation: Supports the starter composition ratio.
  - reference: PMID:42331835
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The starter was inoculated at a rate of 0.1% (w/w) of the tea leaves.
    explanation: Supports the starter inoculation rate.
  - reference: PMID:42331835
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Random forest modeling identified several microbial genera with potential associations with the volatile compounds
    explanation: Supports the Random Forest analysis used to associate successional microbial genera with measured aroma volatiles.
