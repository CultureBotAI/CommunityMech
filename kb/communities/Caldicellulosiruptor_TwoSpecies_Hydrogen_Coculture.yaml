id: CommunityMech:000185
name: Caldicellulosiruptor Two-Species Hydrogen Coculture
description: >
  A de novo constructed, continuous-flow, hydrogen-producing coculture pairing
  Caldicellulosiruptor saccharolyticus DSM 8903 with the strain reported as
  Caldicellulosiruptor kristjanssonii DSM 12137. The system was designed to test
  whether two extreme thermophilic sugar-fermenting Caldicellulosiruptor strains
  could stably coexist while converting glucose and xylose, major lignocellulosic
  hydrolysate sugars, to hydrogen-rich fermentation products.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Construct a defined thermophilic coculture for high-yield fermentative
    hydrogen production from glucose and xylose.
  assembly_strategy: Combine C. saccharolyticus DSM 8903 with C. kristjanssonii
    DSM 12137 in a continuous-flow stirred tank reactor.
  perturbation_design: Test carbon-sufficient and carbon-limited chemostat states
    across different dilution rates and compare mixed glucose/xylose, glucose-only,
    and xylose-only feeds.
  measurement_endpoints:
  - Hydrogen yield and production rate
  - Residual glucose and xylose
  - Biomass concentration
  - Acetate and minor lactate formation
  - Species-specific qPCR abundance
  evidence:
  - reference: PMID:21192828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Constructing defined co-cultures of known H2 producers
    explanation: Supports the design goal of assembling a defined hydrogen-producing coculture.
  - reference: PMID:21192828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: were combined in a co-culture for H2 production
    explanation: Supports the coculture assembly and biohydrogen objective.
  - reference: PMID:21192828
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: continuous-flow stirred tank reactor
    explanation: Supports the continuous-flow reactor design.
