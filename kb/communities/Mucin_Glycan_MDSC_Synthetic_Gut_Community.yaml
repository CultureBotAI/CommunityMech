ecological_interactions:
- name: Mucin-Type-Dependent MDSC Restructuring
  description: >-
    After four sequential transfers, the MDSC stabilized into distinct
    species-level compositions on PGM, PGM plus BSM, and PGM plus added
    sialylated glycans, with BSM alone supporting limited growth.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Substrate-Dependent Mucin Glycan Degradation
    description: >-
      Community composition tracked with different O- and N-glycan degradation
      patterns on the four mucin substrate regimes.
  evidence:
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After four transfers, the composition of the community differed as a result of mucin type condition
    explanation: Supports mucin-type-dependent restructuring of the synthetic community.
- name: Substrate-Dependent Mucin Glycan Degradation
  description: >-
    The MDSC degraded PGM O-glycans, PGM plus BSM O-glycans, and PGM plus
    added sialylated glycans in sequential batch culture, but showed limited
    growth and only minimal O-glycan degradation when BSM was supplied alone.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  evidence:
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, glycan degradation and metabolite production were also affected by mucin type
    explanation: Supports the substrate-dependent mucin glycan degradation and metabolic output of the MDSC.
- name: Mucin-Type-Dependent Fermentation Profile
  description: >-
    HPLC measurements of acetate, propionate, butyrate, formate, succinate,
    lactate, ethanol, glucose, and 1,2-propanediol showed that PGM, BSM,
    PGM/BSM, and PGM plus sialylated glycans yielded distinct metabolite
    profiles.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  - preferred_term: propionate
    term:
      id: CHEBI:17272
      label: propionate
  - preferred_term: butyrate
    term:
      id: CHEBI:17968
      label: butyrate
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Incubation of the MDSC with different mucin types resulted in distinct metabolite profiles
    explanation: Supports mucin-type-dependent extracellular metabolite output.
