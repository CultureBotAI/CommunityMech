id: CommunityMech:000392
name: Mucin Glycan-Degrading MDSC Synthetic Gut Community
description: >-
  A 14-strain in vitro synthetic community of human colonic mucus-associated
  mucin glycan degraders, secondary degraders, and hydrogen consumers. The MDSC
  was assembled from Akkermansia, Bacteroides, Phocaeicola, Ruminococcus,
  Lachnospiraceae, Faecalibacterium, and Desulfovibrio type strains, grown
  anaerobically in sequential 24 h serum-bottle batches at 37 C, and compared
  across porcine gastric mucin, bovine submaxillary mucin, mixed PGM/BSM, and
  PGM plus two sialylated-glycan conditions. Mucin type drove distinct
  stabilized community compositions, mucin glycan degradation patterns, and
  metabolite profiles after four transfers.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: >-
    Test how distinct porcine gastric and bovine submaxillary mucin glycan
    landscapes shape an in vitro synthetic mucosal-gut community.
  assembly_strategy: >-
    Combine 14 anaerobic strains selected as mucin glycan degraders,
    secondary degraders, and hydrogen consumers that commonly reside in the
    human colonic mucus layer.
  inoculation_strategy: >-
    Individually preculture each strain anoxically, combine precultures 1:1 by
    OD600, and inoculate serum bottles at 5% v/v.
  passaging_regimen: >-
    Incubate each bottle statically for 24 h at 37 C, transfer 1% v/v into
    fresh medium, and repeat for four transfers to adapt the community and
    reach a stable composition by 96 to 120 h.
  perturbation_design: >-
    Compare porcine gastric mucin, bovine submaxillary mucin, equal mixed
    PGM/BSM, and PGM plus the sialylated glycans 3'-sialylgalacto-N-biose and
    6'-alpha-sialyl-N-acetyllactosamine.
  measurement_endpoints:
  - 16S rRNA amplicon sequencing integrated with qPCR
  - Porous graphitized carbon LC-MS/MS O-glycan profiling
  - MALDI-TOF MS N-glycan profiling
  - HPLC metabolite profiling
  evidence:
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: MDSC consisted of primary mucin degraders and cross-feeders that scavenge released glycans, metabolites and/or gases
    explanation: Supports the functional design of the in vitro mucin glycan-degrading synthetic community.
environment_term:
  preferred_term: anaerobic laboratory serum-bottle culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: >-
    The 14-strain MDSC was serially transferred in anoxic serum bottles with
    defined mucin substrates.
modeled_environment:
- preferred_term: human colonic mucus layer
  term:
    id: ENVO:2100002
    label: intestine environment
  notes: >-
    The strains were selected as common residents of the human colonic mucus
    layer and used as an in vitro model of mucin-driven gut community function.
