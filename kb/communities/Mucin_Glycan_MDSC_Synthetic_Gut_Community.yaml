growth_media:
- name: Anoxic bicarbonate buffered mucin medium
  composition:
  - name: yeast extract
    concentration: '1'
    unit: g/L
  temperature: '37'
  temperature_unit: C
  atmosphere: ANAEROBIC
  inoculum_size: '5'
  inoculum_unit: '% v/v'
  incubation_time: '24'
  incubation_time_unit: h
  shaking_speed: '0'
  shaking_speed_unit: rpm
  vessel_type: serum bottle
  preparation_notes: >-
    The anoxic bicarbonate buffered medium was reduced with cysteine-HCl and
    supplied with PGM, BSM, equal PGM/BSM, or PGM plus sialylated glycans as the
    carbon source. The 5% v/v mixed inoculum was prepared from individual
    precultures combined in a 1:1 ratio based on OD600.
  evidence:
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The medium was an anoxic bicarbonate buffered medium prepared as described previously
    explanation: Supports the base anoxic bicarbonate buffered medium.
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Serum bottles were incubated without shaking at 37°C for 24 h
    explanation: Supports the serum-bottle incubation temperature, duration, and static growth condition.
cultivation_setup:
- cultivation_mode: OTHER
  system_type: SERUM_BOTTLE
  instrument_detail: static anoxic serum bottles with 1% v/v transfer to fresh medium every 24 h
  operating_temperature: 37
  operating_temperature_unit: °C
  temperature_controlled: true
  controls_notes: >-
    Four mucin substrate conditions were carried out in triplicate, and a PGM
    plus BSM bottle without bacteria was used as a negative control.
  notes: >-
    Community samples were taken at the initial inoculation and at each 24 h
    batch endpoint through 120 h.
  evidence:
  - reference: PMID:42109165
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In total, the community was transferred four times to adapt to the carbon source and reach a stable composition
    explanation: Supports the four-transfer sequential batch design.
