- name: Polydopamine-Driven Cell-to-Cell Coaggregation
  description: The source reports increased coaggregation of Shewanella oneidensis MR-1 and Rhodopseudomonas palustris
    with the material-associated cell interface. This is a two-member physical community observation, not itself
    a donor-to-recipient metabolic transfer or evidence of syntrophic feedback.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: cell aggregation
    term:
      id: GO:0098743
      label: cell aggregation
  downstream:
  - target: Shift Toward Contact-Dependent Electron Transfer
    description: 'PARTIAL: the material-associated interface supports contact between the two members and is reported
      to favor contact-dependent electron transfer. The abstract does not isolate coaggregation from the interface''s
      conductive properties as the causal mediator of the transfer-mode shift.'
  evidence:
  - reference: PMID:42285537
    supports: SUPPORT
