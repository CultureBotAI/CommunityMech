- name: Shift Toward Contact-Dependent Electron Transfer
  description: The primary abstract reports a shift from H2-mediated transfer toward contact-dependent electron
    transfer in the tested two-species community, with Shewanella as donor and Rhodopseudomonas as acceptor. Retain
    that direction without treating a shift in the dominant mode as elimination of all mediated transfer or as evidence
    of product-removal feedback.
