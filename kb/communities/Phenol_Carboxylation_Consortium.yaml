- name: M. hungatei H2 Scavenging and Methanogenesis
  description: 'M. hungatei supplied a methanogenic electron sink: 5 mM 2-BES blocked aromatic degradation, and
    elevated H2 stopped phenol and 4-hydroxybenzoate degradation. These perturbations support low-H2 syntrophy under
    the methanogenic conditions, not merely co-occurrence. Hydrogen was detected, while the authors did not exclude
    formate or other carriers. Dependence is conditional: AQDS enabled acetate production without methane in BES-treated
    culture; attempts at axenic isolation with AQDS failed.'
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methanospirillum hungatei
    term:
      id: NCBITaxon:2203
      label: Methanospirillum hungatei
