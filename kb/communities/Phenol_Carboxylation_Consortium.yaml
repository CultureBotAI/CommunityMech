- name: M. hungatei H2 Scavenging and Methanogenesis
  description: >
    Methanospirillum hungatei provides the methanogenic sink for the
    S. aromaticivorans syntrophy. Inhibition of methanogenesis with 2-BES and
    exposure to high hydrogen partial pressure both stopped aromatic-substrate
    degradation, supporting H2 scavenging as a required syntrophic electron sink.
