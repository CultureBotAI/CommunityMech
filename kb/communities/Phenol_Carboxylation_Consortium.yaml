id: CommunityMech:000053
name: Phenol Carboxylation Consortium
description: >
  A purified two-member anaerobic syntrophic coculture in which
  Syntrophorhabdus aromaticivorans strain UI(T) oxidizes phenol, p-cresol,
  4-hydroxybenzoate, isophthalate, and benzoate in association with the
  hydrogenotrophic methanogen Methanospirillum hungatei DSM 864. The
  M. hungatei partner supplies the H2-scavenging methanogenic sink needed for
  strain UI(T) to mineralize aromatic substrates to acetate and methane, and
  blocking methanogenesis or raising hydrogen partial pressure halts phenol
  and 4-hydroxybenzoate degradation.
