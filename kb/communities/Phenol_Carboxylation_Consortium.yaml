discussions:
- discussion_id: phenol-route-and-electron-carrier-boundaries
  prompt: Which enzymes and electron carriers implement the observed syntrophic phenol conversion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Phenol Oxidation by Syntrophorhabdus
  - ecological_interactions#M. hungatei H2 Scavenging and Methanogenesis
  - ecological_interactions#Community Aromatic Conversion to Acetate and Methane
  rationale: Preserve all three existing positive causal arrows and the BES/high-H2 perturbations. Intermediates
    suggest a route but do not identify its enzymes; the authors allow hydrogen and/or formate transfer. AQDS replaces
    the methanogenic electron sink under the tested inhibited condition, without establishing a pure isolate. Acetate/methane
    conversion is not complete carbon mineralization. The alternative Desulfovibrio culture is a separate experimental
    condition, not a third member of this canonical pair; no new topology is required for these repairs.
  evidence:
  - reference: PMID:18281436
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The actual mechanisms employed by strain UIT cells for the metabolism of phenol remain unclear
    explanation: Primary Discussion distinguishes intermediate measurements from the unresolved enzymatic route.
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The addition of 5 mM 2-BES to a coculture with M. hungatei completely inhibited the degradation of
      isophthalate, phenol, and 4-hydroxybenzoate.
    explanation: Blocking methanogenesis stopped aromatic-substrate degradation in the M. hungatei coculture.
