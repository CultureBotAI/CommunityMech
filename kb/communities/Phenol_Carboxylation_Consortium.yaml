- name: Phenol Oxidation by Syntrophorhabdus
  description: S. aromaticivorans UI(T) oxidized phenol in coculture with M. hungatei. Transient 4-hydroxybenzoate
    and benzoate were measured and subsequently consumed. PARTIAL - These intermediates support a proposed carboxylation/dehydroxylation
    route, but the paper explicitly leaves the actual enzymes and mechanism unresolved; they are not demonstrated
    interspecies carbon cargo.
