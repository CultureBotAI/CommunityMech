  downstream:
  - target: Phenol Oxidation by Syntrophorhabdus
    description: Methanogenic electron disposal maintains conditions allowing UI(T) phenol oxidation; BES inhibition
      and high-H2 inhibition support this direction. This applies to the methanogenic treatment, not an absolute
      requirement for this partner when an alternative acceptor such as AQDS is supplied.
  - target: Community Aromatic Conversion to Acetate and Methane
    description: The active methanogenic sink allows aromatic conversion to continue and supplies the methane component
      of the acetate/methane endpoint. AQDS-treated inhibited cultures produced acetate without methane, separating
      conversion from the methanogenic product.
  evidence:
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The addition of 5 mM 2-BES to a coculture with M. hungatei completely inhibited the degradation of
      isophthalate, phenol, and 4-hydroxybenzoate.
    explanation: Blocking methanogenesis stopped aromatic-substrate degradation in the M. hungatei coculture.
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: degradation of phenol and 4-hydroxybenzoate was completely stopped when the cultures were exposed to
      a gas phase containing a high partial pressure of hydrogen
    explanation: Raising H2 pressure blocked degradation, supporting the need for H2 scavenging.
- name: Community Aromatic Conversion to Acetate and Methane
  description: The defined UI(T)-M. hungatei coculture utilized phenol, p-cresol, isophthalate, 4-hydroxybenzoate
    and benzoate for growth and produced acetate and methane. Preserve these positive conversion and product measurements.
    Acetate remains an organic product, and Table 2 reports residual substrate at 100 days; this is not complete
    mineralization or universal complete removal. Absence of fermentative growth in the tested inhibited cultures
    does not negate the AQDS alternative-electron-acceptor result.
