environmental_factors:
- name: Strict anaerobic cultivation
  value: 50-ml serum vials; 20 ml medium; 37 C; no shaking
  description: >
    Strain UI(T) and M. hungatei were maintained under strict anaerobic
    laboratory culture conditions for the syntrophic substrate utilization and
    inhibition assays.
  evidence:
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All cultivations were performed anaerobically in 50-ml serum vials containing
      20 ml medium at 37°C without shaking.
    explanation: Supports the strictly anaerobic batch-culture conditions.
- name: Methanogenesis and hydrogen partial pressure
  value: obligate
  description: >
    Methanogenesis and low hydrogen partial pressure were both required for
    phenol and 4-hydroxybenzoate degradation by the M. hungatei coculture:
    2-BES inhibited methanogenesis, and externally supplied hydrogen stopped
    degradation.
  evidence:
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The addition of 5 mM 2-BES to a coculture with M. hungatei completely inhibited
      the degradation of isophthalate, phenol, and 4-hydroxybenzoate.
    explanation: Supports methanogenesis as required for aromatic-substrate degradation.
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: degradation of phenol and 4-hydroxybenzoate was completely stopped when the cultures were
      exposed to a gas phase containing a high partial pressure of hydrogen
    explanation: Supports low H2 as a required syntrophic condition.
- name: AQDS terminal electron acceptor
  value: AQDS can replace the methanogen under 2-BES
  description: >
    Anthraquinone-2,6-disulfonate provided an alternate terminal electron
    acceptor for strain UI(T), converting phenol or isophthalate to acetate in
    the presence of the methanogenesis inhibitor 2-BES and therefore testing the
    electron-acceptor role normally supplied by the methanogen.
  evidence:
  - reference: PMID:18281436
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: AQDS was able to replace methanogen as an electron acceptor and only acetate
      (and CO2) was produced
    explanation: Supports AQDS as an abiotic electron-acceptor bypass for methanogen-dependent syntrophy.
