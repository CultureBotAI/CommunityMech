ecological_interactions:
- name: Cyanobacterial Organic-Carbon Provisioning
  description: Illuminated XZ-Cy5/XZ-Ab1 coculture supports organic-carbon provision from the cyanobacterium to
    the heterotroph. The abstract reports heterotrophic growth benefit and direct NanoSIMS detection of photoautotroph-derived
    carbon after 13CO2 labeling. Retain this experimentally supported cross-feeding without assigning an identified
    secreted molecule or extending the carbon tracer result to nitrogen or oxygen transfer.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Thermoleptolyngbya sichuanensis XZ-Cy5
