id: CommunityMech:000454
name: Thermoleptolyngbya-Chelatococcus Arsenic Detoxification Coculture
description: A defined light-driven coculture pairing the hot-spring cyanobacterium "Thermoleptolyngbya sichuanensis" XZ-Cy5
  with the mat-derived heterotroph Chelatococcus sp. XZ-Ab1. Qing et al. 2026 used pure-culture and coculture comparisons,
  arsenite oxidation assays, 13CO2 NanoSIMS tracing, and genome analyses to show that XZ-Cy5 supplied photoautotroph-derived
  organic carbon to Chelatococcus sp. XZ-Ab1, while Chelatococcus detoxified arsenite to arsenate and thereby promoted XZ-Cy5
  growth under arsenic stress.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Resolve how a thermophilic cyanobacterium and a mat-derived heterotroph cooperate to detoxify arsenite under
    light-driven growth conditions.
  assembly_strategy: Pair the dominant hot-spring cyanobacterium "T. sichuanensis" XZ-Cy5 with the arsenite-oxidizing heterotroph
    Chelatococcus sp. XZ-Ab1 isolated from the same high-arsenic photosynthetic microbial mat.
  perturbation_design: Compare arsenite oxidation and growth in the photosynthetic mat, pure XZ-Cy5, pure Chelatococcus sp.
    XZ-Ab1 supplied with organic carbon and oxygen, and the two-member coculture under light.
  measurement_endpoints:
  - arsenite oxidation
  - cyanobacterial chlorophyll and photosynthetic activity
  - heterotrophic growth
  - 13CO2 NanoSIMS carbon tracing
  - metagenomic and genomic metabolic-complementarity analysis
  evidence:
  - reference: PMID:42468699
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A co-culture system demonstrated mutualistic interactions
    explanation: Supports the engineered two-member coculture used to test the arsenic-detoxifying cyanobacterium-heterotroph
      mutualism.
  - reference: PMID:42468699
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Following growth of the co-culture using 13CO2, NanoSIMS isotope tracing provided direct evidence
    explanation: Supports NanoSIMS isotope tracing as a measurement endpoint for the coculture.
