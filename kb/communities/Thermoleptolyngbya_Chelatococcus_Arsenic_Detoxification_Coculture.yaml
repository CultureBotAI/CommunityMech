- name: Chelatococcus Arsenite Detoxification
  description: Chelatococcus sp. XZ-Ab1 used cyanobacterium-derived carbon and oxygen to oxidize toxic arsenite to less-toxic
    arsenate, relieving arsenite stress that otherwise damaged XZ-Cy5 chlorophyll content and photosynthetic activity.
  interaction_type: MUTUALISM
  scope: PAIRWISE
