    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Chelatococcus sp. XZ-Ab1 promoted growth of "T. sichuanensis" XZ-Cy5
    explanation: Directly cites the reported reciprocal cyanobacterial growth benefit, not only monoculture toxicity.
  - reference: PMID:42468699
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: oxidizing toxic As(Ⅲ) to the less toxic arsenate
    explanation: Supports Chelatococcus-mediated detoxification of arsenite into arsenate.
  - reference: PMID:42468699
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: exposure of a growing culture to 5 mM As(Ⅲ) led to rapid loss of chlorophyll and photosynthetic activity
    explanation: Supports arsenite as a toxic stressor for pure XZ-Cy5 cultures.
  - reference: PMID:42468699
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: a pure culture of the mat-derived heterotroph Chelatococcus sp. XZ-Ab1 could oxidize As(Ⅲ) quickly
      with the addition of organic carbon and oxygen
    explanation: Supports oxidation in supplemented heterotroph culture, not a demonstrated oxygen-source requirement
      in coculture.
