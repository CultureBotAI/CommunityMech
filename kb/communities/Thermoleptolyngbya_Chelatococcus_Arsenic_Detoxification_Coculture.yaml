    evidence_source: IN_VITRO
    snippet: '"T. sichuanensis" XZ-Cy5 secreted organic carbon to facilitate heterotrophic growth of Chelatococcus
      sp. XZ-Ab1'
    explanation: Supports the direction of organic-carbon cross-feeding from the cyanobacterium to Chelatococcus.
  - reference: PMID:42468699
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: direct evidence of photoautotroph-derived carbon from "T. sichuanensis" XZ-Cy5 to Chelatococcus sp.
      XZ-Ab1
    explanation: Supports isotope-tracing evidence for cyanobacterium-derived carbon reaching the heterotrophic
      partner.
- name: Chelatococcus Arsenite Detoxification
  description: 'Chelatococcus sp. XZ-Ab1 oxidizes arsenite to less-toxic arsenate and promotes XZ-Cy5 growth in
    coculture. Together with the reciprocal heterotrophic benefit from photosynthetic carbon, this supports mutualism
    under the tested arsenic-stress conditions. The cyanobacterial monoculture did not oxidize arsenite, whereas
    the heterotroph did so when supplied organic carbon and oxygen. PARTIAL for the exact oxygen-supply route in
    coculture: genomic interpretation and a supplemented pure-culture comparison are not direct tracing of cyanobacterial
    oxygen into arsenite oxidation. No nitrogen transfer or thermodynamic product-removal dependence is asserted.'
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chelatococcus sp. XZ-Ab1
    term:
      id: NCBITaxon:3034027
      label: Chelatococcus sp. XZ-Ab1
  target_taxon:
    preferred_term: Thermoleptolyngbya sichuanensis XZ-Cy5
    term:
      id: NCBITaxon:3031812
      label: Thermoleptolyngbya sichuanensis XZ-Cy5
  biological_processes:
