    notes: 'Iron-oxidizing chemolithoautotroph present in the chemocline and upper layers of stratified
      pit lakes. Leptospirillum oxidizes ferrous iron (Fe²⁺) to ferric iron (Fe³⁺) for energy at extremely
      low pH (1.5-3.0), fixing CO₂ autotrophically via the Calvin-Benson-Bassham cycle. In the chemocline,
      Leptospirillum works alongside Ferrovum and Acidithiobacillus to maintain intense Fe²⁺ oxidation
      activity where oxygen is available. The organism is obligately acidophilic and specialized for iron
      oxidation without utilizing sulfur compounds. Leptospirillum contributes to the formation of iron
      oxide precipitates and helps maintain the redox boundary between oxic and anoxic zones.

      '
