    notes: 'Facultatively heterotrophic acidophilic bacterium that consumes algal-derived organic carbon
      in the oxic surface layers of stratified pit lakes. Acidiphilium is a mixotrophic genus capable
      of both aerobic respiration on organic compounds and facultative iron reduction under microaerobic
      conditions. In the Iberian pit lake system, Acidiphilium metabolizes dissolved organic carbon and
      algal exudates produced by Coccomyxa onubensis photosynthesis, playing a critical role in the heterotrophic
      carbon cycle. The organism complements autotrophic primary producers by recycling nutrients and
      organic matter, supporting the food web in the extremely acidic (pH < 3) environment where few heterotrophs
      can survive. Acidiphilium is commonly detected in acid mine drainage and represents a key component
      of the heterotrophic community alongside Actinobacteria and Acidimicrobiales.

      '
