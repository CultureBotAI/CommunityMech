      oxic layers of stratified pit lakes. At. ferrooxidans oxidizes Fe²⁺ to Fe³⁺ and reduced sulfur compounds
      (sulfide, elemental sulfur, thiosulfate) to sulfuric acid, contributing to acidification and metal
      solubilization. The organism fixes CO₂ via the Calvin cycle and thrives at pH 1.5-2.5. At. ferrooxidans
      complements specialized iron oxidizers by removing sulfur compounds and providing metabolic flexibility
      in the dynamic chemocline environment where both iron and sulfur substrates are available.

      '
