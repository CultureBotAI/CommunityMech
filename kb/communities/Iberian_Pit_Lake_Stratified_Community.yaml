environmental_factors:
- name: Upper Layer pH
  value: 2.2-3.1
  unit: pH units
  description: 'Extremely acidic pH in the oxic mixolimnion (0-3m depth), maintained by continuous pyrite
    oxidation and sulfuric acid production from sulfur-oxidizing bacteria. This acidity selects for specialized
    acidophiles including Coccomyxa, Acidiphilium, Leptospirillum, and Acidithiobacillus.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We found that active green alga Coccomyxa onubensis dominated the upper layer and chemocline
    explanation: Documents surface water acidity
- name: Deep Layer pH
  value: 3.0-4.5
  unit: pH units
  description: 'The anoxic monimolimnion (35m depth) exhibits less extreme pH than surface waters due
    to sulfate reduction (consuming H⁺), metal sulfide precipitation (releasing OH⁻), and carbonate buffering.
    This pH gradient creates distinct ecological niches for surface vs. subsurface acidophiles.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Predicted activity for iron(III) reduction was only detected in the deep layer affiliated
      with Proteobacteria
    explanation: Documents subsurface pH increase with depth
- name: Oxygen Stratification
  value: Oxic to anoxic
  unit: stratification gradient
  description: 'Sharp oxygen gradient defines three layers: oxic mixolimnion (dissolved oxygen present,
    supporting aerobic iron and sulfur oxidizers), chemocline transition zone (steep oxygen gradient,
    ~11m depth, 2m thick), and anoxic monimolimnion (no measurable oxygen, supporting anaerobes). Trace
    nanomolar oxygen (<10⁻⁵ M) penetrates deep layer, enabling cryptic sulfide oxidation by Thermoplasmatales.
    The permanent anoxia in deep waters permits sulfate reduction and methanogenesis.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We argue that sulfide precipitation is not limited by microbial genetic potential but rather
      by the quantity and quality of organic carbon reaching the deep layer as well as by oxygen additions
      to the groundwater enabling sulfur oxidation
    explanation: Documents oxygen stratification
  - reference: PMID:36123522
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: oxygen additions to the groundwater enabling sulfur oxidation
    explanation: Documents trace oxygen in bulk anoxic waters
- name: Iron Concentration Gradient
  value: 2-113
  unit: mM Fe
  description: 'Dramatic vertical iron gradient with surface waters containing ~2 mM Fe (predominantly
    Fe³⁺ from oxidation) increasing to 17-113 mM Fe at depth (predominantly Fe²⁺ from reduction). This
    50-fold concentration increase reflects iron accumulation in the permanently stratified monimolimnion
    where Fe³⁺ reduction exceeds reoxidation. The high Fe²⁺ reservoir provides substrate for iron-oxidizing
    chemolithoautotrophs when it diffuses upward to the chemocline.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The chemocline had activity for iron(II) oxidation carried out by populations of Ca
    explanation: Quantifies iron stratification gradient
- name: Sulfate Concentration
  value: 26-126
  unit: mM
  description: 'High sulfate concentrations throughout water column (26 mM in upper layer, 41-126 mM in
    deep layer) from pyrite (FeS₂) oxidation provide abundant electron acceptor for sulfate-reducing bacteria.
    The 5-fold sulfate increase with depth indicates sulfate accumulation from ongoing pyrite oxidation
    exceeds sulfate reduction, though biosulfidogenesis actively consumes sulfate in the chemocline (peak
    H₂S 120 µM). This sulfate reservoir drives the sulfur biogeochemical cycle and metal precipitation.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Addition of organic carbon and elemental sulfur should stimulate sulfate reduction and limit
      reoxidation of sulfide minerals
    explanation: Quantifies sulfate concentrations across depth gradient
- name: Permanent Stratification
  value: Meromictic
  unit: lake type
  description: 'The pit lake exhibits permanent chemical and thermal stratification (meromixis) with no
    seasonal or interannual mixing events. Temperature differences between surface and bottom reach 15°C,
    and density gradients from dissolved salts prevent turnover. This permanent stratification allows
    establishment of distinct microbial communities in each layer, accumulation of nutrients and metals
    at depth (phosphate 0.26 µM → 32 µM, nitrogen 8.2 µM → 33 µM), and maintenance of steep geochemical
    gradients essential for coupled redox processes. The stable chemocline (~11m) persists as a biogeochemical
    hotspot for iron oxidation, sulfate reduction, and metal precipitation.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Cueva de la Mora is a permanently stratified acidic pit lake and a model system
      for extreme acid mine drainage (AMD) studies
    explanation: Documents the meromictic acidic-pit-lake setting without relying on the 2009
      no-content cache stub.
- name: Microbial Diversity Gradient
  value: 72-206
  unit: ASVs per sample
  description: 'Microbial diversity increases dramatically with depth, from 46-72 amplicon sequence variants
    in the upper oxic layer to 119-167 ASVs in the chemocline and 192-206 ASVs in the deep anoxic layer.
    This counterintuitive pattern (higher diversity in more extreme conditions) reflects niche diversification
    in the heterogeneous anoxic environment where multiple anaerobic metabolisms (fermentation, sulfate
    reduction, Fe³⁺ reduction, methanogenesis) coexist, and microniches on settling particles or minerals
    support specialist populations.

    '
  evidence:
  - reference: PMID:36123522
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Using a combination of amplicon sequencing, metagenomics and metatranscriptomics we performed
      a taxonomically resolved analysis of microbial contributions to carbon, sulfur, iron, and nitrogen
      cycling
    explanation: Quantifies diversity increase with depth
related_ingredients:
- preferred_term: sulfate
  chebi_term:
    id: CHEBI:16189
    label: sulfate
  relevance: Sulfate is the quantitatively dominant anion in the Iberian
    Pyrite Belt pit lakes — present at high concentrations alongside
    dissolved heavy metals — and is the central electron-acceptor pool
    structuring the acidic stratified community; an environment-analog
    medium must supply sulfate at concentrations matching the IPB regime.
  evidence:
  - reference: PMID:23840525
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Both pit lakes are acidic and showed high concentrations of
      sulfate and dissolved metals
    explanation: Anchors sulfate as the central anion of the pit lake
      hydrochemistry.
- preferred_term: iron(2+)
  chebi_term:
    id: CHEBI:29033
    label: iron(2+)
  relevance: Fe(II) is the substrate the IPB iron-oxidising bacteria
    (Leptospirillum, Acidithiobacillus ferrooxidans) consume in the upper
    oxic layers; a cultivation medium for the oxidising guild must supply
    Fe(II) at low pH.
  evidence:
  - reference: PMID:23840525
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: iron oxidizing bacteria (Leptospirillum, Acidithiobacillus
      ferrooxidans) and facultative iron reducing bacteria and archaea
    explanation: Anchors Fe(II) oxidation as one half of the redox axis
      structuring the stratified pit lake community.
- preferred_term: iron(3+)
  chebi_term:
    id: CHEBI:29034
    label: iron(3+)
  relevance: Fe(III) — produced by upper-layer oxidisers — is the electron
    acceptor the facultative iron-reducers (Acidiphilium, Ferroplasma,
    Acidithiobacillus ferrooxidans in reducing mode) in the bottom layer
    consume, closing the iron cycle across the chemocline; the medium
    needs both oxidation states available to recapitulate the stratified
    redox structure.
  evidence:
  - reference: PMID:23840525
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: facultative iron reducing bacteria and archaea
      (Acidithiobacillus ferrooxidans, Acidiphilium, Actinobacteria,
      Acidimicrobiales, Ferroplasma) detected in the bottom layer
    explanation: Anchors Fe(III) reduction as the bottom-layer half of the
      redox axis closing the stratified iron cycle.
