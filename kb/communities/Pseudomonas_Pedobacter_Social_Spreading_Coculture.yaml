environmental_factors:
- name: low-nutrient high-salt hard agar
  value: TSB-NK medium with 2% agar, requiring low nutrient and high NaCl conditions for Pf0-1 plus V48 social spreading
  description: Social spreading is conditional on medium composition; high nutrient conditions prevent
    spreading, and the canonical Pf0-1 plus V48 pair requires added salt under low-nutrient conditions.
  evidence:
  - reference: PMID:30700513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: low-nutrient conditions are insufficient to promote social spreading without high salt concentrations
    explanation: Supports the low-nutrient and high-salt environmental requirement.
  - reference: PMID:34288708
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While Pf0-1+V48 require low nutrient but high NaCl conditions
    explanation: Supports the same environment dependence in the exact-pair follow-up study.
- name: hard agar surface
  value: 2% agar surface not permissive for monoculture motility
  description: The emergent behavior is observed on a hard agar surface where each individual species
    remains sessile under the tested conditions.
  evidence:
  - reference: PMID:30700513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On hard agar, which is not permissive for motility of the monoculture of either species
    explanation: Supports the hard-surface condition and monoculture contrast.
growth_media:
- name: TSB-NK hard agar social spreading medium
  temperature: '25'
