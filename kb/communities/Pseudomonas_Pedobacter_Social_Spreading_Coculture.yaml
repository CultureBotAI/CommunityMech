id: CommunityMech:000161
name: Pseudomonas-Pedobacter Social Spreading Coculture
description: >
  A two-species soil-bacterial model community composed of Pseudomonas fluorescens Pf0-1 and
  Pedobacter sp. V48. When mixed on low-nutrient, high-salt hard agar, the two sessile monocultures
  produce an emergent interspecies social spreading phenotype in which both bacteria comigrate across
  the agar surface. The system is used to study contact-dependent and environment-dependent emergent
  motility in small soil microbial communities.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Build a tractable two-species soil model community for mechanistic study of emergent
    interspecies motility and spatial organization.
  assembly_strategy: Mix Pseudomonas fluorescens Pf0-1 with Pedobacter sp. V48 on low-nutrient,
    high-salt hard agar and compare the coculture with each monoculture.
  perturbation_design: Test contact requirements, nutrient level, salt concentration, initial species
    ratios, fluorescent strain tagging, and related Pseudomonas/Pedobacter isolate pairs.
  measurement_endpoints:
  - colony expansion on hard agar
  - comigration of both species through the spreading colony
  - spatial organization by fluorescent microscopy
  - nutrient and salt dependence of social spreading
  - related-isolate induction of social spreading
  evidence:
  - reference: PMID:30700513
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In our two-species model community, we find an emergent trait resulting from the interaction of the soil bacteria Pseudomonas fluorescens Pf0-1 and Pedobacter sp. V48.
    explanation: Supports the identity, model-community design, and emergent-interaction objective.
