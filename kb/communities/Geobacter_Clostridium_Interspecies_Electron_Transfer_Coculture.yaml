- name: Coculture-Associated Glycerol Fermentation Product Shift
  description: 'At 72 h, the two responsive cultures among four initial cocultures had higher 1,3-propanediol and
    butyrate yields than Clostridium pasteurianum monocultures: 241 +/- 8 versus 176 +/- 13 and 105 +/- 6 versus
    76 +/- 7 mmol/mol glycerol, respectively. Butanol and ethanol yields were lower: 188 +/- 9 versus 225 +/- 5
    and 43 +/- 4 versus 54 +/- 2 mmol/mol glycerol. These correspond to +37%, +38%, -16% and -20%; they are not
    averages over all four initial cocultures or universal coculture responses. Significant Geobacter growth occurred
    in eight of twelve later cultures, and the reported growth/product regressions use those responders. Clostridium
    growth was reduced, so useful product yields do not establish mutual benefit. The measured conditional product
    shift is retained independently of its unresolved electron-transfer or cobamide mediator.'
  scope: COMMUNITY_LEVEL
  metabolites:
