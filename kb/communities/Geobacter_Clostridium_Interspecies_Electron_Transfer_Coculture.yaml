id: CommunityMech:000031
name: Geobacter-Clostridium Interspecies Electron Transfer Coculture
description: 'A two-member consortium consisting of Geobacter sulfurreducens and Clostridium
  pasteurianum in which interspecies electron transfer modulates glycerol fermentation.
  G. sulfurreducens acts as an exoelectrogen and grows using C. pasteurianum as its sole
  electron acceptor; the resulting electron uptake induces a metabolic shift in
  C. pasteurianum''s glycerol fermentation pathway, redirecting carbon flux away from
  ethanol and butanol production toward increased 1,3-propanediol (PDO) and butyrate
  production (+37% and +38% respectively). The shift is driven by a strikingly small
  electron uptake - under 0.6% of the electrons consumed by C. pasteurianum - and the
  relationship between G. sulfurreducens growth and the metabolite shift is non-linear.

  MECHANISM CONTESTED - do not read this record as establishing contact-dependent DIET.
  The discovery study (PMID:28287150) did not demonstrate physical contact, conductive
  pili, or nanowires in this coculture; its own discussion reports heterogeneous
  nanowire-rich and nanowire-poor cells and proposes growth on conductive materials as a
  future way to "ensure electrical connections", i.e. connection was not established. The
  same group''s mechanistic follow-up (PMID:34939136) concluded the interaction is
  MEDIATED, proposing a diffusible cobamide acting on glycerol dehydratase, with a
  transmembrane flavin-bound polyferredoxin / cytochrome b5-rubredoxin electron-entry
  route offered only as a putative reinforcement. Both mechanisms remain putative; see
  discussion kg-geobacter-clostridium-contact-dependence-contested.

  '
