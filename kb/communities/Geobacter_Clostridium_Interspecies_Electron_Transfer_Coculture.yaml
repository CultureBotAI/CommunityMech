discussions:
- discussion_id: kg-geobacter-clostridium-contact-dependence-contested
  prompt: 'Is the G. sulfurreducens-induced metabolic shift in C. pasteurianum actually caused by contact-dependent
    direct interspecies electron transfer along conductive pili, or by a diffusible mediator (candidate: a cobamide)
    released by G. sulfurreducens?

    '
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - ecological_interactions#Proposed Acetate Oxidation and Interspecies Electron Transfer
  - ecological_interactions#Coculture-Associated Glycerol Fermentation Product Shift
  rationale: 'The prior contact-dependent DIET assertion was withdrawn in #256/#262; #295 corrected a remaining
    generic-background citation. This review also qualifies the broader IET interpretation: qPCR growth and an assumed
    electron balance do not directly measure uptake or selectively prove its mediation of the product shift. The
    2017 Discussion proposes, rather than measures, nanowire-rich/planktonic inoculum heterogeneity and suggests
    conductive biofilms as future work. The record name and filename already use interspecies electron transfer
    rather than DIET, so the former pending-rename note is obsolete. The 2022 abstract describes mediated interaction
    and a putative cobamide model, with possible electron entry as reinforcement. Its full body remains inaccessible
    subscription content; the previously reported 0.22-um-filtered spent-medium result was not verified here and
    is not evidence for these graph decisions. Neither contact-dependent wiring, cobamide transfer nor a particular
    entry protein is asserted as established. Non-graph environmental, ingredient and overview text is preserved
    by this graph-scoped repair and is not scientifically certified by it.'
  evidence:
  - reference: PMID:34939136
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: It was assumed that this metabolic shift of the fermentative species resulted from an interspecies
      electron transfer
    explanation: The follow-up study characterizes the interspecies-electron-transfer reading of the original experiment
      as an assumption, not a demonstrated mechanism.
  - reference: PMID:34939136
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: C. pasteurianum-G. sulfurreducens interaction inducing a metabolic shift is mediated
    explanation: The abstract calls the interaction mediated, but the full experimental details were unavailable.
      This does not identify or verify the specific mediator, and is not treated as a selective contact-removal
      assay.
  - reference: PMID:34939136
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'a putative interaction model was proposed: G. sulfurreducens produces cobamide molecules that possibly
      modify C. pasteurianum metabolic pathway at the key enzyme glycerol dehydratase'
