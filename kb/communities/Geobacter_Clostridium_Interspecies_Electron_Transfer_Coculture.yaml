discussions:
- discussion_id: kg-geobacter-clostridium-contact-dependence-contested
  prompt: >
    Is the G. sulfurreducens-induced metabolic shift in C. pasteurianum actually caused by
    contact-dependent direct interspecies electron transfer along conductive pili, or by a
    diffusible mediator (candidate: a cobamide) released by G. sulfurreducens?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - ecological_interactions#Acetate Oxidation and Interspecies Electron Transfer
  - ecological_interactions#Glycerol Fermentation with Electron-Transfer-Induced Metabolic Shift
  rationale: >
    RE-SCOPED (was: this record asserted contact-dependent DIET as established). Caching the
    open-access full text of the discovery study (PMID:28287150, PMC5347079) showed the
    contact/nanowire mechanism was never supported by it. "Pili" and "nanowires" appear there
    only as general background about Geobacter species, and its own discussion states the
    opposite of what this record claimed: pre-cultures were "constituted of both nanowire-rich
    aggregates and nanowire-poor planktonic cells", and growing G. sulfurreducens on conductive
    material is offered as a future option "to ensure electrical connections" - i.e. electrical
    connection was NOT established in these experiments. Several evidence items had also cited
    that generic background sentence, or the unrelated "sole electron acceptor" sentence, as if
    they demonstrated contact-mediated transfer between these two organisms.

    Accordingly: `community_category` moved DIET -> SYNTROPHY (the schema defines DIET
    specifically as "Direct interspecies electron transfer", a mechanism claim no source
    supports here); pili/nanowire assertions were removed from the description, environment
    notes, taxon notes, and the interaction; the interactions were renamed to mechanism-neutral
    forms; and the "Cell Contact and Nanowire Formation" environmental factor became
    "Electrical Connection Between Cells", recording that connection was not established.

    The competing mechanism is NOT asserted in its place. The follow-up (PMID:34939136)
    concludes the interaction "is mediated" and proposes a diffusible cobamide acting on
    glycerol dehydratase, with a transmembrane flavin-bound polyferredoxin / cytochrome
    b5-rubredoxin electron-entry route offered only as putative reinforcement - and that paper
    calls its own model "putative". It is not open access, so only its abstract is
    snippet-verifiable here; its reported 0.22-um-filtered cell-free spent-medium result, which
    would show Geobacter cells are unnecessary for the shift, remains unverified against full
    text. STILL OPEN: which route actually carries the electrons, and whether the record's
    `name` and filename (both still say "DIET") should be changed - those affect external
    references and were left to a curator.
  evidence:
  - reference: PMID:34939136
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: It was assumed that this metabolic shift of the fermentative species resulted
      from an interspecies electron transfer
