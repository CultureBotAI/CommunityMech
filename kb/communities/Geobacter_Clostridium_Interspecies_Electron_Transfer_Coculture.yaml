ecological_interactions:
- name: Acetate Oxidation and Interspecies Electron Transfer
  description: 'Geobacter sulfurreducens oxidizes acetate and transfers electrons to
    Clostridium pasteurianum, growing with C. pasteurianum as its sole electron acceptor.
    The transferred electrons modulate C. pasteurianum''s fermentation metabolism, and the
    quantity involved is very small - under 0.6% of the electrons C. pasteurianum consumes -
    with a non-linear relationship between G. sulfurreducens growth and the size of the
    metabolite shift.

    ROUTE UNRESOLVED. The cited study does not establish how the electrons move. Conductive
    pili / nanowires appear in that paper only as general background about Geobacter species,
    and its discussion states that electrical connection was NOT ensured in these cocultures
    (cells were a mix of nanowire-rich aggregates and nanowire-poor planktonic cells, and
    growth on conductive material is proposed as a future way to ensure connection). A
    mechanistic follow-up (PMID:34939136) instead concluded the interaction is mediated by a
    diffusible molecule, candidate cobamide. Do not curate contact-dependent DIET, interspecies
    wiring, or cobamide transfer here as demonstrated; see discussion
    kg-geobacter-clostridium-contact-dependence-contested.

    '
