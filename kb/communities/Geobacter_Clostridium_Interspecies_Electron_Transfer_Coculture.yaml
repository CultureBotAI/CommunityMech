ecological_interactions:
- name: Proposed Acetate Oxidation and Interspecies Electron Transfer
  description: 'HYPOTHESIZED: Geobacter sulfurreducens growth in responsive cocultures, but not in the corresponding
    monoculture without a known electron acceptor, supports the authors'' proposed transfer of acetate-derived electrons
    to Clostridium pasteurianum. qPCR estimates cell growth; it does not directly measure electron uptake or current.
    The less-than-0.6% electron estimate assumes acetate as the Geobacter donor, 10% electron allocation to biomass
    and transfer of the remaining 90%; it is an inferred balance, not a measured flux. Significant Geobacter growth
    occurred in only two of four initial and eight of twelve subsequent cocultures. Contact-dependent transfer was
    not established. Nanowire-rich versus planktonic inoculum heterogeneity was a proposed explanation of variability,
    not a measured wiring result. The follow-up abstract calls the original IET interpretation an assumption and
    proposes a putative cobamide mechanism; neither that mechanism nor a specific electron-entry route is demonstrated
    here.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    concentration: Assumed Geobacter electron donor in the growth-based balance
    notes: Acetate consumption attributed to Geobacter was calculated from growth assumptions, not selectively traced.
  biological_processes:
  - preferred_term: acetate catabolic process
    term:
      id: GO:0045733
      label: acetate catabolic process
  downstream:
  - target: Coculture-Associated Glycerol Fermentation Product Shift
    description: 'HYPOTHESIZED: Acetate-derived electron transfer could alter Clostridium redox regulation and thereby
      its glycerol-fermentation product profile. Growth/product associations and an assumed electron balance motivate
      this direction, but do not selectively establish electron uptake as the mediator. The follow-up proposes cobamides
      and possible electron entry as alternatives or contributors, not verified replacements.'
