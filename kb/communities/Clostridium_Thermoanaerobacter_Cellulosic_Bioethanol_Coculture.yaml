ecological_interactions:
- name: Cellulose Hydrolysis Supporting Coculture Fermentation
  description: PARTIAL - LQRI hydrolysis is proposed to supply soluble sugars to noncellulolytic, saccharolytic
    X514. Lower sugar accumulation in coculture supports this model, not directly traced transfer. Cellulose is
    the feedstock and ethanol the output, not the exchanged compounds; improved ethanol production does not imply
    universally improved cellulose utilization.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium thermocellum LQRI
    term:
      id: NCBITaxon:572545
      label: Acetivibrio thermocellus DSM 2360
  target_taxon:
    preferred_term: Thermoanaerobacter pseudethanolicus strain X514
    term:
      id: NCBITaxon:399726
      label: Thermoanaerobacter sp. X514
  metabolites:
