id: CommunityMech:000168
name: Clostridium-Thermoanaerobacter Cellulosic Bioethanol Coculture
description: >
  A thermophilic, anaerobic, two-member laboratory coculture for consolidated cellulosic bioethanol
  production. The cellulolytic Clostridium thermocellum LQRI member hydrolyzes and ferments cellulose,
  while the non-cellulolytic Thermoanaerobacter pseudethanolicus strain X514 partner improves ethanol
  production from cellulose-derived fermentation intermediates. The system is DOE-relevant because it
  uses a defined coculture to increase ethanolic fermentation of recalcitrant cellulosic material under
  batch and cyclic fed-batch bioprocess conditions.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Improve cellulosic bioethanol fermentation by pairing a cellulolytic Clostridium thermocellum
    LQRI strain with a saccharolytic Thermoanaerobacter strain X514 partner.
  assembly_strategy: Bottom-up two-member anaerobic coculture assembled from cellulolytic C. thermocellum
    LQRI and saccharolytic Thermoanaerobacter pseudethanolicus strain X514.
  perturbation_design: Batch cocultures compared X514 with Thermoanaerobacter strain 39E, while cyclic
    fed-batch experiments varied cellulose concentration and pH control.
  measurement_endpoints:
  - Ethanol production
  - Cellulose fermentation performance
  - Fed-batch process stability
  - Vitamin B12 biosynthesis capacity
  evidence:
  - reference: PMID:21868218
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Engineering microbial consortia capable of efficient ethanolic fermentation of cellulose
    explanation: Supports the engineered consortium objective for cellulosic ethanol production.
  - reference: PMID:23275517
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cocultures of cellulolytic Clostridium thermocellum LQRI and saccharolytic Thermoanaerobacter pseudethanolicus strain X514
    explanation: Supports the exact two-member coculture design curated in this record.
