    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: Enhanced Ethanol Output in X514 Cocultures
    description: PARTIAL - access to LQRI-derived soluble sugars can support X514 fermentation and higher community
      ethanol output. Partner flux and the separate contributions of sugar removal and operating conditions remain
      unresolved.
  evidence:
  - reference: PMID:23275517
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: improve bioethanol production from the fermentation of recalcitrant cellulosic materials
    explanation: Supports the coculture process context. The primary fed-batch Discussion proposes soluble-carbon
      supply; bulk sugar concentrations do not directly trace donor-to-recipient transfer.
  - reference: PMID:23275517
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: tested in the semicontinuous fermentor as a model system
    explanation: Supports the coculture process context. The primary fed-batch Discussion proposes soluble-carbon
      supply; bulk sugar concentrations do not directly trace donor-to-recipient transfer.
- name: Enhanced Ethanol Output in X514 Cocultures
  description: The 2011 abstract reports greater ethanol output in C. thermocellum cocultures and stronger enhancement
    with X514 than 39E. The separate LQRI-X514 fed-batch study shows condition-dependent improvements relative to
    LQRI monoculture. This is a community product phenotype, not demonstrated ethanol donation from X514 to LQRI.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:21868218
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: improved ethanol production by 194-440%
    explanation: The reported 194-440% range summarizes multiple coculture comparisons, not one fixed X514 effect
      size or ethanol-transfer assay.
  - reference: PMID:21868218
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strain X514 enhanced ethanolic fermentation much more effectively
    explanation: Supports X514 versus 39E partner performance; it does not identify ethanol donation to LQRI.
  participating_taxa:
  - preferred_term: Clostridium thermocellum LQRI
    term:
      id: NCBITaxon:572545
      label: Acetivibrio thermocellus DSM 2360
  - preferred_term: Thermoanaerobacter pseudethanolicus strain X514
    term:
      id: NCBITaxon:399726
      label: Thermoanaerobacter sp. X514
- name: X514 B12 Biosynthesis and Proposed Fermentation Support
  description: PARTIAL - comparative genomes associate X514 performance with B12 biosynthesis capacity; supplementation
    improved 39E ethanol production. This supports a proposed cofactor-related contribution, not demonstrated vitamin
    donation to LQRI or commensalism. The separate fed-batch study supplied vitamins and does not establish B12
    autonomy.
  scope: PAIRWISE
  metabolites:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  biological_processes:
  - preferred_term: cobalamin biosynthetic process
    term:
      id: GO:0009236
      label: cobalamin biosynthetic process
  downstream:
  - target: Enhanced Ethanol Output in X514 Cocultures
    description: HYPOTHESIZED - B12 biosynthesis may support X514 fermentation and thereby contribute to coculture
      ethanol output. Comparative genomes and the 39E supplementation response support this proposal, but do not
      selectively establish the causal contribution in X514.
  evidence:
  - reference: PMID:21868218
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: complete vitamin B(12) biosynthesis pathway
    explanation: Supports genomic biosynthetic capacity and its association with performance, not measured vitamin
      export or recipient benefit.
  - reference: PMID:21868218
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: improved ethanol production in strain 39E by 203%
    explanation: Retains the positive 39E supplementation result without treating it as selective X514 perturbation;
      the mechanism paper is available here only as an abstract.
  source_taxon:
    preferred_term: Thermoanaerobacter pseudethanolicus strain X514
    term:
      id: NCBITaxon:399726
      label: Thermoanaerobacter sp. X514
