growth_media:
- name: defined anaerobic minimal medium (20 mM sodium acetate, 10 mM sodium nitrate, 0.1 g/L yeast extract)
  temperature: '30'
  temperature_unit: °C
  ph: '7.2'
  atmosphere: ANAEROBIC
  headspace_gas: "N2/CO2 80:20"
  vessel_type: Balch tubes (10 mL culture volume)
  preparation_notes: NO3- reduction growth studies were run in a defined minimal medium with 20 mM sodium acetate and 10 mM sodium NO3- plus 0.1 g/L yeast extract to support growth of 3H11 and R12; media were prepared in serum bottles and aliquoted into N2-CO2-flushed, pressurized Balch tubes. Starter cultures were grown in R2A liquid medium at 30 °C with shaking at 100 rpm.
  evidence:
  - reference: PMID:40349173
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: NO3- reduction growth studies were performed in Balch tubes (10-ml culture volume) at 30°C in a defined minimal medium as described previously containing 20 mM sodium acetate and 10 mM sodium NO3- at pH 7.2 with a 80:20 N2-CO2 headspace
    explanation: Names the Balch-tube anaerobic minimal medium, 30 °C, pH 7.2, 80:20 N2-CO2 headspace, acetate and nitrate.
  - reference: PMID:40349173
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Liquid R2A cultures were incubated at 30°C with shaking at 100 rpm.
    explanation: Names the R2A starter-culture temperature and shaking speed.
