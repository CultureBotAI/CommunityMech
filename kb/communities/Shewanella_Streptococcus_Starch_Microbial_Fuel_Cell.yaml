id: CommunityMech:000203
name: Shewanella-Streptococcus Starch-Fueled Microbial Fuel Cell Coculture
description: >
  A defined starch-fed microbial fuel cell community pairing the exoelectrogen
  Shewanella oneidensis MR-1 with the starch-fermenting lactic acid producer
  Streptococcus bovis 148. The system was tested in two configurations:
  two-step fermentation, where S. bovis first converted starch to lactic acid
  before S. oneidensis generated electricity, and parallel fermentation, where
  cultivation and fermentation by both organisms occurred simultaneously. The
  community is relevant to DOE bioenergy and bioelectrochemical systems because
  it couples conversion of a polymeric biomass substrate to lactate cross-feeding
  and extracellular electron transfer in a microbial fuel cell.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert starch into electrical current by coupling fermentative
    lactate production with Shewanella-mediated bioelectrochemical electron transfer.
  assembly_strategy: Pair S. bovis 148 as the starch-to-lactate fermenter with
    S. oneidensis MR-1 as the lactate-oxidizing exoelectrogen in a microbial
    fuel cell workflow.
  perturbation_design: Compare two-step fermentation and parallel fermentation
    configurations for starch-fueled microbial fuel cell operation.
  measurement_endpoints:
  - Starch conversion
  - Lactic acid production
  - Current generation
  - Current density
  - Power density
  evidence:
