id: CommunityMech:000405
name: Hexamine Formaldehyde Consortium C6
description: Consortium C6 is a six-member hexamine- and formaldehyde-removing bacterial formulation assembled from environmental
  isolates in AS broth containing hexamine. The consortium combines two Brevundimonas diminuta isolates, two Brucella pseudintermedia
  isolates, Ochrobactrum sp. SRCHD06, and Micrococcus luteus SRCHD02 in a 1:1:1:1:1:1 design. C6 outperformed smaller tested
  combinations in suspended culture, formed a strong biofilm, and retained hexamine, formaldehyde, and chemical-oxygen-demand
  removal after low-dose cobalt-60 gamma irradiation, especially in the polypropylene-Raschig-ring biofilm format.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Assemble a defined bacterial formulation for removal of hexamine, its formaldehyde by-product, and chemical oxygen
    demand under suspended and immobilized biofilm conditions compatible with low-radiation wastewater treatment.
  assembly_strategy: Select hexamine-, formaldehyde-, and COD-removing isolates, test C1-C6 equal-ratio combinations in 50
    mg/L hexamine AS broth at 37 degrees Celsius, and retain the six-isolate C6 consortium for irradiation and biofilm experiments.
  inoculation_strategy: Combine SRCHD02, SRCHD03, SRCHD04, SRCHD05, SRCHD06, and SRCHD07 at a 1:1:1:1:1:1 ratio; the most
    efficient C6 consortium was then assayed from a 1% inoculum in AS broth and as polypropylene-Raschig-ring biofilms in
    sterile Falcon tubes.
  perturbation_design: Compare untreated C6 with suspended and biofilm C6 cultures exposed to 3.75 Gy and 5.25 Gy 60Co gamma
    irradiation, then track hexamine, formaldehyde, and COD removal during repeated 48 h revival transfers or biofilm medium
    replacement.
  measurement_endpoints:
  - hexamine removal
  - formaldehyde removal
  - chemical oxygen demand removal
  - ammonia production or removal
  - growth curve and doubling time
  - crystal-violet biofilm formation
  - post-irradiation recovery under suspended and biofilm conditions
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on their hexamine, formaldehyde, and COD removal ability, five isolates were selected for consortium development
    explanation: Supports the bioremediation phenotype screen used before testing C1-C6 isolate combinations.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '6 SRCHD02: SRCHD03: SRCHD04: SRCHD05: SRCHD06: SRCHD07 (1:1:1: 1:1:1) C6'
    explanation: Reports the Table 1 C6 assembly as the SRCHD02, SRCHD03, SRCHD04, SRCHD05, SRCHD06, and SRCHD07 isolates
      mixed at an equal 1:1:1:1:1:1 ratio.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C6 84.24 91.96 95.26 34.34 48.10 49.23 7.78 38.86 46.48 3.89 19.54 28.57
    explanation: Quantifies C6 24 h, 48 h, and 72 h hexamine, formaldehyde, COD, and ammonia readouts in suspended AS broth.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The 24 h-old culture and biofilm on polypropylene Raschig rings in sterile Falcon tubes (two conditions) were
      irradiated at the requisite doses in triplicate.
    explanation: Supports the paired suspended-culture and immobilized-biofilm irradiation design.
