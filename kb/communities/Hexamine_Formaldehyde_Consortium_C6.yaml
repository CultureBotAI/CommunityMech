ecological_interactions:
- name: C6 hexamine and formaldehyde removal
  description: Consortium C6 removed hexamine, formaldehyde, and chemical oxygen demand from AS broth, with the biofilm format
    reaching 94.41% hexamine removal, 85.56% formaldehyde removal, and 37.64% COD removal within 24 h.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the biofilm system reported in this study, the consortium C6 could remove 94.41% hexamine 85.56% formaldehyde
      within 24 h of incubation, associated with 37.64% COD removal efficiency.
    explanation: Quantifies rapid hexamine, formaldehyde, and COD removal by immobilized C6 biofilms.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium C6 was the most efficient in terms of bioremediation, achieving hexamine, formaldehyde, and COD
      removal in 24, 48, and 96 h, respectively.
    explanation: Supports C6 as the strongest assayed consortium and distinguishes endpoint timing by analyte.
- name: Immobilized C6 post-irradiation recovery
  description: Polypropylene-Raschig-ring C6 biofilms retained stronger removal after 3.75 Gy and 5.25 Gy cobalt-60 gamma
    irradiation than suspended C6 cultures, with hexamine removal not significantly changed at 24 h and formaldehyde/COD performance
    reviving within 96 h.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the case of the biofilm-based system, there was no change in performance in terms of hexamine removal following
      irradiation (p-value between 0.29 and 0.5) even at 24th h of incubation.
    explanation: Supports retained hexamine removal by irradiated C6 biofilms.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The formaldehyde- and COD-removing abilities were much higher in the biofilm-based system, with revival within
      96 h of incubation.
    explanation: Supports 96 h recovery of formaldehyde and COD removal in the irradiated C6 biofilm system.
