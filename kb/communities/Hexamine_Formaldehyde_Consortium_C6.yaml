discussions:
- discussion_id: c6-molecular-division-of-labor
  prompt: The source quantified community-level C6 removal of hexamine, formaldehyde, and COD but did not resolve which isolate
    genes or exchange steps perform hexamine hydrolysis, formaldehyde assimilation or oxidation, ammonia handling, or post-irradiation
    biofilm recovery.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#C6 hexamine and formaldehyde removal
  rationale: The article explicitly leaves Ochrobactrum/Brevundimonas functional interactions for a future molecular study,
    so this record should not assert a pairwise metabolic edge inside C6.
  evidence:
  - reference: PMID:41743136
    reference_title: Bioremediation of hexamine and formaldehyde using a radio-tolerant bacterial consortium for efficient
      pollutant and COD removal
    supports: SUPPORT
    evidence_source: full_text
    snippet: Ochrobactrum sp. and Brevundimonas diminuta have been shown to harbor genes with functional interactions, which
      could be further detailed in a future study to understand the underlying molecular mechanism of bioremediation in the
      current context.
    explanation: Documents the authors' stated need for a future mechanistic study of the C6 molecular mechanism.
  posed_by: claude
  posed_date: '2026-09-21'
