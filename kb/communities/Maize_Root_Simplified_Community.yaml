growth_media:
- name: 1/2 Murashige and Skoog (MS) agar gnotobiotic maize-root system (members precultured
    on 0.1x TSA / tryptic soy broth)
  temperature: '30'
  temperature_unit: °C
  light_regime: 16 h light (day) / 8 h dark (night)
  inoculum_source: Maize root-derived bacterial isolates obtained by host-mediated selection
  vessel_type: Glass test tube (16 x 150 mm) double-tube gnotobiotic chamber for
    gnotobiotic root assembly
  preparation_notes: 'Community members were streaked on 0.1x TSA plates (30 °C, 24-48 h)
    and precultured in tryptic soy broth (TSB) shaken at 30 °C before inoculation. The
    simplified synthetic community was assembled on the roots of axenic maize seedlings
    grown in sterile 1/2 MS agar [0.8% (wt/vol)]
    within double-tube gnotobiotic chambers. Surface-sterilized seeds were germinated at
    30 °C before bacterial inoculation. Inoculated seedlings were kept at 25 °C with
    54% relative humidity under a 16 h light / 8 h dark cycle.'
  evidence:
  - reference: doi:10.21769/BioProtoc.2885
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Streak the seven bacterial strains ( Stenotrophomonas maltophilia ZK5342,
      Ochrobactrum pituitosum ZK5343, Curtobacterium pusillum ZK5344, Enterobacter cloacae
      ZK5345, Chryseobacterium indologenes ZK5346, Herbaspirillum frisingense ZK5347 and
      Pseudomonas putida ZK5348) on 0.1x TSA plates and incubate at 30 °C for 24-48 h.
    explanation: Bacterial member preculture medium (0.1x TSA) and incubation temperature
      (30 °C).
  - reference: doi:10.21769/BioProtoc.2885
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inoculate a single colony of each strain in 5 ml of tryptic soy broth (TSB)
      and shake at 120 rpm at 30 °C overnight.
    explanation: Tryptic soy broth preculture and incubation temperature (30 °C).
  - reference: doi:10.21769/BioProtoc.2885
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After an incubation of 50 to 55 h in total, choose the germinated maize seeds
      (Figure 1C) with a root of 1-2 cm for the following steps.
    explanation: Seed germination stage preceding community inoculation.
  - reference: doi:10.21769/BioProtoc.2885
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transfer the maize seeds adhered by bacteria and sterile seeds onto 20 ml ½ Murashige
      and Skoog (MS) agar (0.8%) in glass tubes (16 x 150 mm) by sterile forceps.
    explanation: Double-tube gnotobiotic chamber vessel used to grow the axenic maize seedlings
      on which the community assembles.
  - reference: doi:10.21769/BioProtoc.2885
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: '16 h of light (day) and 8 h of dark (night), 4 ,000 lx, 25 °C and a relative
      humidity of 54%.'
    explanation: Plant (Zea mays) growth chamber photoperiod, temperature, and humidity for
      axenic host seedlings.
