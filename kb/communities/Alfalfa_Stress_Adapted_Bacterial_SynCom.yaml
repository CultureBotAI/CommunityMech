discussions:
- discussion_id: alfalfa_syncom_strain_persistence
  prompt: Which of the five stress-adapted bacterial SynCom members persist in the alfalfa rhizosphere after inoculation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  - ecological_interactions
  rationale: The preprint measured plant, nodule, and nematode outcomes after SynCom inoculation but explicitly did not track
    the five inoculated strains in the rhizosphere.
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: OTHER
    snippet: SynCom strain dynamics in the rhizosphere were not tracked, so future studies using genome-resolved metagenomics
      or targeted molecular approaches could link functional persistence to plant outcomes.
    explanation: Identifies persistence of the inoculated strains as an unresolved rhizosphere question.
  posed_by: codex
  posed_date: '2026-09-27'
- discussion_id: alfalfa_root_results_discussion_discrepancy
  prompt: Which phase-specific root effects remain supported after reconciling results and discussion?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - ecological_interactions#Stress-adapted SynCom promotion of alfalfa root architecture
  - ecological_interactions#Stress-adapted SynCom promotion of recovery root nodulation
  rationale: The preprint's discussion describes broad significant improvement, but its results distinguish stress-phase root
    biomass from nonsignificant recovery and architectural responses. Recovery nodulation is supported; initial-phase nodules
    were not quantified. Strain dynamics and reciprocal microbial benefits were not measured, and no mediation from architecture
    to nodulation was isolated.
