  description: Bacillus sp. G3, Bacillus sp. G12, and Acinetobacter sp. G13 came from Poa pratensis in drought-prone southeastern
    Alberta soils, while Plantibacter flavus M251 and M259 came from plants growing in Nova Scotia oil-seep soils.
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Five plant root-associated bacteria (PAB) strains used included Bacillus sp. G3 and G12, and Acinetobacter sp.
      G13, which were isolated from Poa pratensis grasses growing in drought-prone soils of Southeastern Alberta, Canada,
      whereas Plantibacter flavus M251 and M259 were recovered from plants inhabiting hydrocarbon-rich oil seep soils in Nova
      Scotia, Canada.
    explanation: Supports the stress-affected plant-associated origins of all five strains.
- name: three-level alfalfa drought regime
  value: 30%, 50%, and 80% field capacity
  description: The growth-chamber assay maintained severe-drought, moderate-drought, and well-watered pots at 30%, 50%, and
    80% field capacity, respectively.
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: 'Drought stress was imposed by maintaining soil moisture at three levels of field capacity: severe drought (SD)
      at 30%, moderate drought (MD) at 50%, and well-watered (WW) control at 80%.'
    explanation: Defines the three soil-moisture regimes used to perturb alfalfa pots.
- name: non-sterilized alfalfa soil pots
  value: field soil:sand in LDPE-lined 6x5 inch pots
  description: Alfalfa was grown in a roughly 2:1 mixture of Dalhousie field soil and sand under controlled growth-chamber
    light, humidity, and temperature.
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The soil was then mixed with sand in an approximately 2:1 field soil-sand ratio and transferred to an LDPE-lined,
      6x5 in pots.
    explanation: Supports the non-sterilized field soil:sand potting setup.
