ecological_interactions:
- name: Stress-adapted SynCom promotion of alfalfa root architecture
  description: PARTIAL - the results report a SynCom main effect on root biomass during drought stress, but not recovery.
    Root volume and surface-area effects were not significant; diameter effects were marginal. The broader discussion statement
    does not establish uniform architectural improvement across phases or reciprocal microbial benefit.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: response to water deprivation
    term:
      id: GO:0009414
      label: response to water deprivation
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly increased root dry biomass, root volume, root surface area, and root diameter
      during both stress and recovery phases
    explanation: The discussion overgeneralizes the phase-specific results; it is not sufficient evidence of significant improvement
      in every listed trait during both phases.
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: During recovery, no significant (p > 0.05) effects of drought, SynCom, or their interaction were detected for
      root biomass
    explanation: The results explicitly limit the root-biomass finding; primary text was read separately from the local excerpt
      cache.
- name: Stress-adapted SynCom promotion of recovery root nodulation
  description: The five-strain SynCom increased alfalfa root nodule formation after rewatering, when nodulation was quantified
    across severe-drought, moderate-drought, and well-watered treatments.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SynCom inoculation significantly increased root nodule formation during the recovery phase.
    explanation: Supports increased alfalfa root nodulation after SynCom inoculation.
