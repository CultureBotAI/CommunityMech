id: CommunityMech:000458
name: Alfalfa Stress-Adapted Bacterial SynCom
description: A defined five-member bacterial SynCom assembled from plant-associated Bacillus sp. G3, Bacillus sp. G12, Acinetobacter
  sp. G13, Plantibacter flavus M251, and Plantibacter flavus M259 isolates from stress-affected Canadian environments. Shipar
  et al. validated the members for in-vitro plant growth-promoting and abiotic-stress traits, mixed equal volumes of OD600-standardized
  LB cultures, and applied the mixture twice to alfalfa grown in non-sterilized field soil under well-watered, moderate-drought,
  and severe-drought growth-chamber regimes.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Build a five-strain bacterial SynCom from stress-adapted plant-associated isolates and test whether the consortium
    improves alfalfa drought resilience and recovery in non-sterilized soil.
  assembly_strategy: Combine two Bacillus isolates, one Acinetobacter isolate, and two Plantibacter flavus isolates chosen
    from drought-prone grass roots or hydrocarbon-rich oil-seep plant environments with complementary plant-beneficial traits.
  inoculation_strategy: Culture each strain in LB broth to exponential phase, pellet and resuspend the cells in sterile distilled
    water at OD600 about 0.1, mix the five standardized suspensions in equal volumes, then apply 50 mL to soil before alfalfa
    transplantation and again as a basal drench one week after transplantation.
  perturbation_design: Compare SynCom-positive and SynCom-negative alfalfa pots at severe drought, moderate drought, and well-watered
    field-capacity levels, with destructive harvests after the drought phase and after rewatering for recovery.
  measurement_endpoints:
  - alfalfa shoot growth, biomass, SPAD, and photosystem II efficiency
  - root dry biomass, root volume, root surface area, and root diameter
  - root nodule counts after recovery
  - soil nematode abundance
  - in-vitro IAA production, PEG tolerance, salinity tolerance, and phosphate solubilization
  notes: The source reports growth-chamber phenotypes after soil inoculation but did not track individual SynCom strain persistence
    in the alfalfa rhizosphere.
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the present study, we assembled a five-strain bacterial synthetic community (SynCom; Bacillus sp. G3, Bacillus
      sp. G12, Acinetobacter sp. G13, Plantibacter flavus M251 and M259)
    explanation: Names the five-member bacterial synthetic community.
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Equal volumes of the five standardized suspensions were then combined to prepare the SynCom inoculum.
    explanation: Supports the equal-volume SynCom assembly strategy.
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Drought stress was imposed by maintaining soil moisture at three levels of field capacity
    explanation: Supports the three-level field-capacity drought perturbation design.
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Each treatment had four biological replicates, and because the experiment involved destructive harvests at two phases,
      a total of 48 pots were used for the entire experiment
    explanation: Supports the destructive two-phase growth-chamber design and four-replicate treatment layout.
