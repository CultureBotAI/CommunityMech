    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Fifty ml of bacterial suspension was then inoculated into the soil pre-transplantation and drenched into the
      base of the seedling one week post-transplantation.
    explanation: Supports the two alfalfa soil inoculations.
