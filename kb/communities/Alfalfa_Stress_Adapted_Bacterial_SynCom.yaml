- name: LB broth equal-volume SynCom preparation
  inoculum_size: '50'
  inoculum_unit: mL soil drench per application
  preparation_notes: Each strain was grown in LB broth to exponential phase, centrifuged at 4000 rpm for 15 min, resuspended
    in sterile distilled water at OD600 about 0.1, mixed in equal volumes, and applied to alfalfa soil before transplanting
    and one week after transplanting.
  evidence:
  - reference: doi:10.21203/rs.3.rs-7812930/v1
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Equal volumes of the five standardized suspensions were then combined to prepare the SynCom inoculum.
    explanation: Supports equal-volume assembly after single-strain LB broth culture.
