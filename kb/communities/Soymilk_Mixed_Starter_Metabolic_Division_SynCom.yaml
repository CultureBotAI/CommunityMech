ecological_interactions:
- name: Cooperative soymilk starter succession
  description: The mixed starter showed a cooperative succession in which Streptococcus thermophilus dominated the mid-stage
    and facilitated subsequent Lactiplantibacillus plantarum dominance in the late-stage of soymilk fermentation.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42637460
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Taxonomic analysis revealed a cooperative succession pattern, where S. thermophilus dominated the mid-stage fermentation,
      facilitating the subsequent dominance of L. plantarum in the late-stage.
    explanation: Supports the staged S. thermophilus-to-L. plantarum succession in soymilk.
- name: Lactobacillus bulgaricus auxotroph support
  description: Single-strain dropout and omics measurements supported a cross-feeding role for Lactobacillus delbrueckii subsp.
    bulgaricus in vitamin and amino acid supply to the auxotrophic soymilk-starter community.
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42637460
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the removal of L. bulgaricus led to the significant derepression of vitamin and amino acid biosynthetic gene
      clusters, providing transcriptional evidence that L. bulgaricus functions as a key cross-feeding bacterium to support
      the auxotrophic community via cross-feeding.
    explanation: Supports the L. bulgaricus dropout response and the inferred cross-feeding function.
