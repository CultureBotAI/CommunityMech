id: CommunityMech:000448
name: Soymilk Mixed-Starter Metabolic Division SynCom
description: A three-species lactic-acid-bacterial mixed starter culture for controlled soymilk fermentation, composed of
  Streptococcus thermophilus, Lactobacillus delbrueckii subsp. bulgaricus, and Lactiplantibacillus plantarum. Li et al. 2026
  used metatranscriptomics, non-targeted metabolomics, and single-strain dropout fermentations to resolve a cooperative succession
  in which S. thermophilus dominated mid-stage fermentation, L. plantarum subsequently dominated late-stage fermentation,
  and L. bulgaricus cross-fed the auxotrophic community.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Resolve the microbial succession, substrate-utilization roles, and nutrient exchange that underlie synergistic
    soymilk fermentation by a defined mixed starter culture.
  assembly_strategy: Grow a three-species soymilk starter containing Streptococcus thermophilus, Lactobacillus delbrueckii
    subsp. bulgaricus, and Lactiplantibacillus plantarum.
  perturbation_design: Use systematic single-strain exclusions during controlled soymilk fermentation to infer division of
    labor from compensatory transcriptional responses in the remaining strains.
  measurement_endpoints:
  - taxonomic succession across soymilk fermentation
  - metatranscriptomic reprogramming
  - non-targeted metabolomics
  - galactose-utilization response to Streptococcus thermophilus removal
  - vitamin and amino acid biosynthetic gene-cluster response to Lactobacillus delbrueckii subsp. bulgaricus removal
  notes: The PubMed abstract names the three starter species and the single-strain exclusion design, but it does not expose
    exact strain accessions, inoculation ratios, vessel geometry, fermentation time points, temperature, or the full soymilk
    medium formulation.
  evidence:
  - &id001
    reference: PMID:42637460
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mixed starter culture (Streptococcus salivarius subsp. thermophilus, Lactobacillus delbrueckii subsp. bulgaricus,
      and Lactiplantibacillus plantarum) during soymilk fermentation.
    explanation: Names the three lactic-acid-bacterial starter species and the soymilk fermentation setting.
  - reference: PMID:42637460
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: metatranscriptomics and non-targeted metabolomics were integrated to characterize the microbial succession and
      metabolic reprogramming
    explanation: Supports the multi-omics readout used to follow succession and metabolism in the starter community.
  - reference: PMID:42637460
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Controlled soymilk fermentation with systematic exclusion of single strains, omics results elucidated a sophisticated
      metabolic division of labor.
    explanation: Supports the controlled dropout design used to assign division-of-labor mechanisms to starter members.
