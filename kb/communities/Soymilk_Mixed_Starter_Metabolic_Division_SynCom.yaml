ecological_interactions:
- name: Observed Soymilk Starter Succession
  description: 'Taxonomic analysis of the mixed starter reported mid-stage S. thermophilus dominance followed by
    late-stage L. plantarum dominance. HYPOTHESIZED: the former facilitates the latter, as interpreted by the authors;
    the accessible abstract does not isolate the direction or mediator from succession alone.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42637460
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Taxonomic analysis revealed a cooperative succession pattern, where S. thermophilus dominated the mid-stage
      fermentation, facilitating the subsequent dominance of L. plantarum in the late-stage.
    explanation: Supports the reported observation and the authors' proposed interpretation; the accessible abstract
      does not establish the detailed causal mechanism.
    computational_provenance:
