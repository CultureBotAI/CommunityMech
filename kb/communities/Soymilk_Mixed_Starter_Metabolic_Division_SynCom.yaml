- name: Inferred Soymilk Nutrient Cross-Feeding
  description: 'L. bulgaricus dropout was associated with derepression of vitamin and amino acid biosynthetic gene
    clusters in the remaining starter. HYPOTHESIZED: L. bulgaricus supplies nutrients to other members. This transcriptional
    response is indirect support for cross-feeding, not traced transfer, identification of the exchanged compounds
    and recipients, or proof that supply caused the observed succession.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42637460
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the removal of L. bulgaricus led to the significant derepression of vitamin and amino acid biosynthetic
      gene clusters, providing transcriptional evidence that L. bulgaricus functions as a key cross-feeding bacterium
      to support the auxotrophic community via cross-feeding.
    explanation: Supports the reported observation and the authors' proposed interpretation; the accessible abstract
      does not establish the detailed causal mechanism.
    computational_provenance:
      prediction_type: STATISTICAL_INFERENCE
      model_source: Metatranscriptomic responses to single-strain dropout, interpreted alongside non-targeted metabolomics;
        abstract-level method description only.
