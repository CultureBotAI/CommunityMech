discussions:
- discussion_id: cellulose_mfc_metabolite_and_spatial_mediation
  prompt: Which exchanged products and spatial arrangements causally control current and partner fitness?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Cellulose Fermentation Feeding Electrode Respiration
  - ecological_interactions#Defined Binary Electricity Production
  - ecological_interactions#Observed Substrate-Dependent Spatial Distribution
  rationale: PMIDs:17695929 and 18725730 were reviewed through fresh primary abstracts and cached snippets; full
    bodies were not obtained through the attempted public DOI/search routes. Residual metabolites do not measure
    individual uptake, and FISH/qPCR localization does not establish its causal benefit. Partner-resolved metabolite
    flux, spatial perturbations and growth measurements are needed to separate these mechanisms. Preserve binary
    current and increased CMC degradation as measured endpoints.
