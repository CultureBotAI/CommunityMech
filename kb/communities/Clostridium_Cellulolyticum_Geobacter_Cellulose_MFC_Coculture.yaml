id: CommunityMech:000175
name: Clostridium cellulolyticum-Geobacter sulfurreducens Cellulose MFC Coculture
description: >
  A defined binary microbial fuel cell coculture pairing the cellulolytic fermenter
  Clostridium cellulolyticum with the electrochemically active bacterium Geobacter
  sulfurreducens. The community couples cellulose hydrolysis and fermentation to anode
  respiration: C. cellulolyticum metabolizes cellulose, while G. sulfurreducens uses
  fermentation products to transfer electrons to the anode. The same exact two-species
  composition was reported in an initial cellulose-to-electricity study and a follow-up
  cellulose-fed microbial biofilm ecology study. The system is relevant to DOE bioenergy
  because it converts cellulosic biomass into electricity in a controlled bioelectrochemical
  reactor.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Convert cellulose or carboxymethyl cellulose to electricity in a microbial fuel cell
    using a defined two-member cellulolytic and electroactive coculture.
  assembly_strategy: Bottom-up binary coculture assembled from C. cellulolyticum and G. sulfurreducens
    in two-chamber microbial fuel cells with cellulose-derived substrates supplied to the anode chamber.
  perturbation_design: Studies compared the coculture with pure cultures and compared soluble
    carboxymethyl cellulose with particulate MN301 cellulose to resolve electricity output, substrate
    degradation, and spatial biofilm organization.
  measurement_endpoints:
  - Electricity generation and power density
  - Cellulose or carboxymethyl cellulose degradation
  - Coulombic efficiency and COD removal
  - Residual metabolites
  - FISH and qPCR localization of partner populations
  evidence:
  - reference: PMID:17695929
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Electricity was generated from cellulose in an MFC
    explanation: Supports the design objective of generating electricity from cellulose in a microbial
      fuel cell.
  - reference: PMID:18725730
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: microbial ecology of cellulose-fed MFCs
    explanation: Supports the follow-up ecological characterization of the same cellulose-fed microbial
      fuel cell coculture.
