  downstream:
  - target: Defined Binary Electricity Production
    description: Fermentative conversion of cellulose supplies electron-donor products for G. sulfurreducens anode
      respiration, enabling current from substrates on which neither pure culture produced electricity. The conversion
      is supported by the binary-versus-pure-culture comparison; the accessible abstract does not resolve each metabolite
      contribution or transfer rate.
  evidence:
  - reference: PMID:17695929
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: requires a syntrophic microbial community
    explanation: The authors use syntrophy for the conversion model, but the repository type additionally asserts
      a metabolic benefit from product removal. The accessible abstract does not isolate that mechanism; CROSS_FEEDING
      preserves the supported supply model without that extra assertion.
  - reference: PMID:17695929
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Hydrogen, acetate, and ethanol were the main residual metabolites
    explanation: This is a residual-pool observation, not a partner-resolved uptake experiment. It does not establish
      that Geobacter consumes all three listed products.
- name: Defined Binary Electricity Production
  description: The binary coculture produced current from CMC and MN301 cellulose, whereas neither pure culture
    did so. CMC degradation increased from 42% in C. cellulolyticum monoculture to 64% in coculture. These measured
    conversion and substrate-degradation outcomes support division of labor, but do not by themselves establish
    reciprocal fitness benefits or a unique metabolite-removal mechanism.
