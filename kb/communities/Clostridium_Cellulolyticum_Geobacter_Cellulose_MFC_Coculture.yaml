- name: Observed Substrate-Dependent Spatial Distribution
  description: FISH and qPCR showed that most C. cellulolyticum cells were associated with suspended MN301 cellulose
    particles and most G. sulfurreducens cells with the electrode. With soluble CMC, both organisms occurred in
    suspension and biofilm samples. This is substrate-dependent spatial distribution, not a demonstrated requirement
    that physical separation causes or improves electricity generation, nor an isolated resource-partitioning mechanism.
