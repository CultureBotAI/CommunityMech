ecological_interactions:
- name: Cellulose Fermentation Feeding Electrode Respiration
  description: C. cellulolyticum fermentation supplies products that support G. sulfurreducens anode respiration
    in the defined cellulose-fed MFC. Binary current production and the negative pure-culture controls support functional
    complementarity. The primary abstract calls this syntrophy, but does not demonstrate obligate growth dependence
    or isolate product removal as the mechanism favoring the fermenter. Hydrogen, acetate and ethanol were reported
    as residual metabolites; that list does not establish uptake of every compound, especially ethanol, by Geobacter
    or quantify partner-specific transfer.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium cellulolyticum
