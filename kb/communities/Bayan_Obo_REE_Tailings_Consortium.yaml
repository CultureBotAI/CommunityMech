environment_term:
  preferred_term: mine tailing
  term:
    id: ENVO:00000003
    label: mine tailing
  notes: 'Rare-earth-rich tailings (RERT) from Bayan Obo mine, Inner Mongolia, China, the world''s largest
    REE deposit. Tailings are iron extraction residues obtained from 15 million tons of medium-poor oxidized
    ores after pre-enrichment, hydrogen mineral phase transformation, and milling processes. Primary REE
    minerals are bastnaesite (REE(CO₃)F, dominated by Ce, La) and monazite (REE-phosphate). The tailings
    contain five main light rare earth elements (La, Ce, Pr, Nd, Sm) that are targeted for bioleaching
    recovery. The Bayan Obo deposit represents a strategic global REE resource, and bioleaching of accumulated
    tailings offers dual benefits of critical material recovery and environmental remediation of legacy
    mining waste.

    '
