ecological_interactions:
- name: Bayan Obo Consortium REE Leaching
  scope: COMMUNITY_LEVEL
  description: 'An enriched acid-bioleaching consortium was reported to recover five main rare-earth elements from
    Bayan Obo tailings after 18 days: 82.78% for one-step and 83.51% for two-step processing. The primary source
    describes similar process efficiencies, not demonstrated synergy. The exact three-member roster, member-specific
    acids, sequential-inoculation mechanism and ionic speciation asserted elsewhere in this record are not verified
    by the accessed primary preview. This node does not assign those roles or causal feedback.'
  evidence:
  - reference: doi:10.1016/j.cej.2024.153492
    snippet: Bioleaching efficiencies of REMs are similar between one-step and two-step processes.
    explanation: The public primary-source highlight supports similar efficiencies; its abstract supplies the reported
      yield/time context. The local DOI cache is metadata-only, so independent local snippet validation remains
      unavailable.
    evidence_source: IN_VITRO
    supports: SUPPORT
environmental_factors:
- name: pH
  value: 1.5-2.5
  unit: pH units
  description: 'Extremely acidic pH range generated by bacterial sulfuric acid production and maintained
    throughout bioleaching. Low pH facilitates protonation and dissolution of carbonate-fluoride minerals
    (bastnaesite) and phosphate minerals (monazite), releasing REE cations into solution. The pH is controlled
    by balance between autotrophic acidification (At. ferrooxidans) and heterotrophic organic acid production
    (Acidiphilium, Streptomyces). Two-step process allows staged pH manipulation for optimal REE recovery.

    '
  evidence:
  - reference: PMID:38702568
    supports: PARTIAL
    evidence_source: REVIEW
    snippet: The review outlines the principles and distinctions of bioleaching,
      biosorption, and bioaccumulation
    explanation: Vítová & Mezricky 2024 outline bioleaching principles for REE
      recovery — Bayan Obo tailings are alkaline, but the acidolysis-based bioleaching
      mechanism the consortium employs is the canonical REE bioleaching mode (PARTIAL).
- name: Bioleaching Duration
  value: '18'
  unit: days
  description: 'Bioleaching duration of 18 days under optimal conditions achieves 82-83% total recovery
    of five main REE (La, Ce, Pr, Nd, Sm). This time frame represents a balance between REE recovery kinetics
    and operational throughput for industrial applications. The 18-day duration is substantially shorter
    than early actinobacterial bioleaching trials (20 days for 0.08% recovery) and demonstrates the efficiency
    of the optimized functional bacterial consortium approach.

    '
  evidence:
  - reference: PMID:38310848
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Bio-/leaching tests confirmed the generation of neutral mine drainage,
      the influence of organic substrate, and the leaching of higher concentrations
      of PTE and REE
    explanation: Cebekhulu et al. 2024 document the leaching outcome under organic
      substrate — abstract does not quote bioleaching duration/kinetics specifically
      (PARTIAL).
- name: Tailings Source and Composition
  value: 15 million tons
  unit: metric tons
  description: 'Bayan Obo rare-earth-rich tailings (RERT) are iron extraction residues from 15 million
    tons of medium-poor oxidized ores, representing a massive REE resource available for sustainable bioleaching
    recovery. The tailings contain bastnaesite (REE(CO₃)F dominated by Ce, La) and monazite (REE-phosphate)
    as primary REE carriers. Bayan Obo deposit in Inner Mongolia, China is the world''s largest REE reserve,
    making these tailings highly strategic for critical materials supply chains. Bioleaching enables recovery
    of valuable REE while remediating legacy mining waste.

    '
  evidence:
  - reference: PMID:38310848
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: These tailings, with significant concentrations of total organic carbon
      (TOC), were mainly colonized by bacteria belonging to the genera Sphingomonas,
      Novosphingobium and Solirubrobacter
    explanation: Cebekhulu et al. 2024 describe alkaline mine tailings characteristics
      (TOC, dominant bacterial genera) — generic alkaline-tailings characterization
      rather than Bayan Obo specifically (PARTIAL).
- name: Target REE Elements
  value: La, Ce, Pr, Nd, Sm
  description: 'The five main light rare earth elements targeted for bioleaching recovery are lanthanum
    (La), cerium (Ce), praseodymium (Pr), neodymium (Nd), and samarium (Sm). These elements are critical
    materials for permanent magnets (Nd, Pr), catalysts (Ce, La), and electronics. The 82-83% total recovery
    rate demonstrates high efficiency for mobilizing these strategic REE from Bayan Obo tailings. Light
    REE (LREE) are more abundant than heavy REE but still require sustainable recovery approaches to meet
    growing demand for clean energy and technology applications.

    '
  evidence:
  - reference: PMID:38702568
    supports: PARTIAL
    evidence_source: REVIEW
    snippet: successful methods, including advanced techniques for enhancing microbial
      strains to achieve higher REE recovery
    explanation: Vítová & Mezricky 2024 review REE-recovery enhancement methods —
      the abstract addresses general REE recovery rather than enumerating specific
      Bayan Obo target REEs (PARTIAL).
- name: Temperature
  value: ~30
  unit: °C
  description: 'Mesophilic temperature range typical for Acidithiobacillus ferrooxidans, Acidiphilium
    cryptum, and Streptomyces strains. Mesophilic operation reduces energy costs compared to thermophilic
    processes while maintaining high REE recovery efficiency.

    '
- name: Process Configuration
  value: One-step vs. two-step
  description: 'Two process configurations were compared: one-step (simultaneous inoculation of all bacteria)
    achieving 82.78% REE recovery, and two-step (Acidiphilium pre-culture followed by At. ferrooxidans
    addition) achieving 83.51% recovery. The two-step process demonstrates synergistic enhancement through
    controlled organic acid accumulation and sequential pH manipulation, though the difference in efficiency
    is modest (0.73 percentage points). Both configurations achieve industrially relevant REE recovery
    rates, with two-step offering slight advantage at the cost of additional operational complexity.

    '
  evidence:
  - reference: PMID:38702568
    supports: PARTIAL
    evidence_source: REVIEW
    snippet: principles and distinctions of bioleaching, biosorption, and bioaccumulation,
      offering a comparative analysis of their potential and limitations
    explanation: Vítová & Mezricky 2024 compare the three REE-recovery process
      modalities — supports the general one-step vs two-step framing but does not
      quote specific Bayan Obo numbers (PARTIAL).
- name: Mineral Targets
  value: Bastnaesite and monazite
  description: 'The primary REE-bearing minerals in Bayan Obo tailings are bastnaesite (REE(CO₃)F, dominated
    by Ce and La) and monazite (REE-phosphate). Bastnaesite is one of the main minerals used for industrial
    REE production globally. At Bayan Obo, bastnaesite and monazite co-occur in the ore minerals. The
    carbonate-fluoride structure of bastnaesite and phosphate structure of monazite require different
    dissolution mechanisms—acidolysis for bastnaesite and organic acid complexation for both—making the
    mixed acid-organic consortium particularly effective.

    '
  evidence:
  - reference: PMID:38310848
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: a sustainable alternative for reprocessing PMC alkaline tailings to
      recover REE
    explanation: Cebekhulu et al. 2024 frame alkaline mine tailings as a REE recovery
      resource — the abstract addresses alkaline mine tailings generally rather than
      Bayan-Obo-specific bastnaesite/monazite mineralogy (PARTIAL).
