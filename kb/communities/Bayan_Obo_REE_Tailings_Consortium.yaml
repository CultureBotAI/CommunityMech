environmental_factors:
- name: pH
  value: 1.5-2.5
  unit: pH units
  description: 'Extremely acidic pH range generated by bacterial sulfuric acid production and maintained
    throughout bioleaching. Low pH facilitates protonation and dissolution of carbonate-fluoride minerals
    (bastnaesite) and phosphate minerals (monazite), releasing REE cations into solution. The pH is controlled
    by balance between autotrophic acidification (At. ferrooxidans) and heterotrophic organic acid production
    (Acidiphilium, Streptomyces). Two-step process allows staged pH manipulation for optimal REE recovery.

    '
  evidence:
  - reference: PMID:38702568
    supports: PARTIAL
    evidence_source: REVIEW
    snippet: The review outlines the principles and distinctions of bioleaching,
      biosorption, and bioaccumulation
    explanation: Vítová & Mezricky 2024 outline bioleaching principles for REE
      recovery — Bayan Obo tailings are alkaline, but the acidolysis-based bioleaching
      mechanism the consortium employs is the canonical REE bioleaching mode (PARTIAL).
- name: Bioleaching Duration
  value: '18'
  unit: days
  description: 'Bioleaching duration of 18 days under optimal conditions achieves 82-83% total recovery
    of five main REE (La, Ce, Pr, Nd, Sm). This time frame represents a balance between REE recovery kinetics
    and operational throughput for industrial applications. The 18-day duration is substantially shorter
    than early actinobacterial bioleaching trials (20 days for 0.08% recovery) and demonstrates the efficiency
    of the optimized functional bacterial consortium approach.

    '
  evidence:
  - reference: PMID:38310848
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: Bio-/leaching tests confirmed the generation of neutral mine drainage,
      the influence of organic substrate, and the leaching of higher concentrations
      of PTE and REE
    explanation: Cebekhulu et al. 2024 document the leaching outcome under organic
      substrate — abstract does not quote bioleaching duration/kinetics specifically
      (PARTIAL).
- name: Tailings Source and Composition
  value: 15 million tons
  unit: metric tons
  description: 'Bayan Obo rare-earth-rich tailings (RERT) are iron extraction residues from 15 million
    tons of medium-poor oxidized ores, representing a massive REE resource available for sustainable bioleaching
    recovery. The tailings contain bastnaesite (REE(CO₃)F dominated by Ce, La) and monazite (REE-phosphate)
    as primary REE carriers. Bayan Obo deposit in Inner Mongolia, China is the world''s largest REE reserve,
    making these tailings highly strategic for critical materials supply chains. Bioleaching enables recovery
    of valuable REE while remediating legacy mining waste.

    '
  evidence:
