    notes: 'Autotrophic chemolithotrophic acidophile that oxidizes ferrous iron and reduced sulfur compounds
      to generate sulfuric acid. In the Bayan Obo REE bioleaching consortium, At. ferrooxidans plays a
      primary role in acidification of the tailings slurry, lowering pH to facilitate REE dissolution
      from bastnaesite and monazite minerals. The organism derives energy from iron and sulfur oxidation
      and fixes CO₂ autotrophically via the Calvin cycle. At. ferrooxidans contributes to synergistic
      REE recovery when co-cultured with heterotrophic acidophiles like Acidiphilium cryptum, with two-step
      processes (heterotroph first, then autotroph) achieving enhanced organic acid accumulation and pH
      control. The strain is well-adapted to acidic mine tailings environments and operates optimally
      at pH 1.5-2.5.

      '
