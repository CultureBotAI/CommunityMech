id: CommunityMech:000219
name: Asgard Archaea Wetland Soil Methanogenesis-Substrate Community
description: >
  A wetland soil community in which terrestrial Asgard archaea modulate
  potential methanogenesis substrates. Two complete genomes were reconstructed
  for soil-associated Atabeyarchaeia, a newly defined Asgard lineage, alongside
  a complete genome for Freyarchaeia. Metatranscriptomic data show in situ
  expression of [NiFe]-hydrogenases, pyruvate oxidation, Wood-Ljungdahl-pathway
  carbon fixation, amino acid metabolism, anaerobic aldehyde oxidation,
  hydrogen peroxide detoxification, and carbohydrate breakdown to acetate and
  formate. Soil-associated Asgard archaea are predicted to act as
  non-methanogenic acetogens, suggesting that they modulate wetland-soil
  methanogenesis substrate pools (H2, acetate, formate) and shape terrestrial
  carbon cycling.
