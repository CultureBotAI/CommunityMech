  description: HYPOTHESIZED - genomes and transcripts suggest non-methanogenic Asgard acetogens can produce or consume
    acetate, formate and hydrogen-linked carbon pools. Hydrogen consumption could reduce methanogen substrate supply,
    while acetate production could support acetoclastic methanogens; neither realized transfer nor the net methane
    effect was resolved.
