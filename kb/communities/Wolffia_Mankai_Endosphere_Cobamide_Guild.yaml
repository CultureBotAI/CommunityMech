id: CommunityMech:000360
name: Wolffia Mankai Endosphere Cobamide Guild
description: A host-filtered bacterial endosphere community from the edible aquatic plant Wolffia globosa Mankai, sampled
  from industrial rotating raceway cultivation. Amplicon and shotgun metagenomic analyses showed that Mankai medium, phyllosphere,
  and surface-sterilized internal-tissue fractions formed distinct communities; downstream MAG analysis of the endosphere
  found a low-diversity Proteobacteria/Pseudomonadota-dominated consortium in which Alphaproteobacterial members encoded near-complete
  cobamide biosynthesis pathways, while many Gammaproteobacteria and Bacteroidota lineages carried incomplete pathways enriched
  for cobamide salvage and remodeling. A MAG-derived functional-complementarity network placed Hyphomicrobium zavarzinii,
  Methylobacterium, Devosia, Labrys, and Ferrovibrionaceae among the inferred producer-side taxa, supporting a producer-salvager
  model for cobamide metabolism in the plant-associated niche.
