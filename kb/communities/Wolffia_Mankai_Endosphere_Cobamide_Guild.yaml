discussions:
- discussion_id: direct_cobamide_exchange_not_measured
  prompt: The cobamide producer-salvager structure is inferred from MAG annotations and network complementarity; direct exchange
    of cobamide intermediates among endosphere members remains unmeasured.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#MAG-Inferred Cobamide Producer-Salvager Guild
  rationale: Resolving this would distinguish true metabolite handoff from shared niche preference or correlated cobamide
    pathway potential.
  proposed_experiments:
  - experiment_id: mankai_cobamide_flux
    name: Trace cobamide exchange in controlled Mankai endosphere microcosms
    approach: stable-isotope tracing with metatranscriptomics
    model_systems:
    - Mankai-associated producer and salvager taxa
    perturbations:
    - producer depletion or inhibition
    - labeled cobamide-precursor pulse
    readouts:
    - cobamide intermediate incorporation
    - cob/cbi and salvage-gene expression
    decision_criterion: Labeled intermediates move from predicted producers into predicted salvagers in a producer-dependent
      manner.
  evidence:
  - reference: PMID:42304541
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Future work integrating transcriptomics, metabolite flux measurements, and controlled manipulation of key producer
      and salvager taxa will be essential to move from genomic potential and inferred interactions to directly measured cobamide
      exchange
    explanation: The primary source explicitly frames direct cobamide exchange as a future measurement need.
