ecological_interactions:
- name: Mankai Compartment Host Filtering
  description: Bacterial assemblages from cultivation medium, washed fronds, and surface-sterilized tissue clustered separately;
    the endosphere retained a lower-diversity, distinct subset of the broader plant-associated and medium-associated pool.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:42304541
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The pronounced differences in richness and composition between the medium, phyllosphere and endosphere (Fig. 
      2 ) indicate strong environmental and host filtering along the plant-water interface
    explanation: Supports compartment filtering across medium, phyllosphere, and endosphere fractions.
- name: MAG-Inferred Cobamide Producer-Salvager Guild
  description: 'Genome-resolved endosphere analysis predicted an uneven cobamide pathway architecture: Hyphomicrobium zavarzinii,
    Methylobacterium, Devosia, Labrys, Ferrovibrionaceae, and other Alphaproteobacteria encoded most biosynthetic steps, while
    many Gammaproteobacteria and Bacteroidota lineages had incomplete pathways and were inferred to salvage or remodel exogenous
    intermediates. The network edges represent MAG-derived metabolic compatibility, not direct metabolite-flux or abundance-correlation
    evidence.'
  interaction_type: CROSS_FEEDING
  scope: COMMUNITY_LEVEL
