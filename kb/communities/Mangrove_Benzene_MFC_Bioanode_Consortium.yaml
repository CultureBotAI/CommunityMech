    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Clearly, benzene addition has shifted the microbial community composition by diminishing Commamonas and enriching the Arcobacter and Bacillus populations
    explanation: Supports the substrate-driven shift from the sodium-acetate biofilm toward a Bacillus/Arcobacter-rich benzene bioanode.
- name: Benzene removal with voltage generation
  description: >
    The benzene-acclimated MFC bioanode removed 98.7 +/- 2.4% of the supplied
    benzene within 96 h and generated up to 902.3 +/- 20.6 mV during the
    high-benzene feed cycle.
  scope: COMMUNITY_LEVEL
