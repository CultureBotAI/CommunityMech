id: CommunityMech:000442
name: Mangrove Benzene MFC Bioanode Consortium
description: >
  An engineered electrogenic bioanode enrichment derived from mangrove sediment
  collected in Vitoria, Espirito Santo, Brazil and acclimated in dual-chamber
  microbial fuel cells first on 1000.0 mg L-1 sodium acetate and then on
  increasing benzene concentrations up to 330.0 mg L-1. In the benzene-fed
  biofilm, Bacillus and Arcobacter became the two dominant 16S rRNA genus-level
  assignments, while Pelobacter and Pseudomonas remained lower-abundance
  detected genera. The acclimated MFC removed 98.7 +/- 2.4% benzene over 96 h
  while generating voltage on the bioanode.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: >
    Enrich a mangrove-sediment bioanode community that combines benzene
    biodegradation with current generation in a dual-chamber microbial fuel
    cell.
  assembly_strategy: >
    Seed the anode chamber with a 20% mangrove sediment suspension in Lovley and
    Phillips medium, form a stable biofilm through two 1000.0 mg L-1
    sodium-acetate feeding cycles, and then acclimate the biofilm through
    stepwise replacement of sodium acetate with benzene.
  perturbation_design: >
    Compare sediment-inoculated biotic MFCs with an abiotic MFC containing only
    the culture medium and carbon source, and shift the biotic MFC feed through
    30.0, 80.0, 170.0, 250.0, and 330.0 mg L-1 benzene.
  measurement_endpoints:
  - MFC output voltage during sodium-acetate and benzene feed cycles
  - cyclic voltammetry, linear sweep voltammetry, and electrochemical impedance spectroscopy
  - genus-level 16S rRNA bioanode community composition
  - GC-FID benzene removal over the MFC operation
  - HPLC-RID and GC-TCD detection of benzene biodegradation products
  - Daphnia magna ecotoxicity of diluted benzene-spiked medium after degradation
  notes: >
    The paper resolves the inoculum and bioanode communities at 16S rRNA
    genus-level abundance. The taxonomy block records the final benzene-fed
    biofilm genera with unambiguous NCBI Taxonomy genus IDs; the lower-abundance
    genus written as Desulfurumonas in the source is left to the discussion
    until its orthography can be resolved against a stable taxonomy ID.
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sourced from mangrove sediments, capable of improving microbial fuel cell (MFC) performance in both energy generation and aromatic compound's biodegradation
    explanation: Supports the mangrove-derived MFC bioremediation objective.
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SA was gradually replaced by benzene at concentrations representing 10.0%, 25.0%, 50.0%, 75.0%, and 100.0% of the total carbon content
    explanation: Supports the stepwise benzene-acclimation strategy.
