discussions:
- discussion_id: benzene_mfc_bioanode_species_resolution
  prompt: Resolve the species or MAG identities, full final-biofilm composition, genus-specific benzene-degradation genes, and
    stable raw 16S read accessions for the benzene-fed mangrove MFC bioanode.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  - ecological_interactions#Benzene-fed bioanode niche shift
  rationale: >
    The ACS Omega full text reports genus-level 16S abundances in the final
    benzene-fed MFC but does not expose species-level identities, raw sequence
    accessions, or a direct metagenomic assignment of benzene-degradation and
    electron-transfer genes to each genus. The source also reports a genus
    spelled Desulfurumonas at 1.64% abundance; that member was not curated here
    until the label can be resolved against NCBI or GTDB.
  posed_by: codex
  posed_date: '2026-09-26'
