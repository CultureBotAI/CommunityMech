ecological_interactions:
- name: Benzene-fed bioanode composition shift
  description: After sequential acclimation from acetate to benzene, relative 16S genus profiles showed Bacillus
    at 32.93% and Arcobacter at 30.28%, with Pelobacter and Pseudomonas also detected. These four canonical genera
    are a resolved subset, not a complete or necessarily active consortium. The compositional change supports substrate-associated
    selection but does not measure absolute expansion, niche partitioning, species identity or taxon-specific benzene
    degradation/electron transfer. Feed composition and biofilm acclimation changed together; no selective genus
    removal established the mediator of increased power.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus
    term:
      id: NCBITaxon:1386
      label: Bacillus <firmicutes>
  - preferred_term: Arcobacter
    term:
      id: NCBITaxon:28196
      label: Arcobacter
  - preferred_term: Pelobacter
    term:
      id: NCBITaxon:18
      label: Pelobacter
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
  - &benzene
    preferred_term: benzene
    term: &benzene_term
      id: CHEBI:16716
      label: benzene
  downstream:
  - target: Benzene removal with voltage generation
    description: HYPOTHESIZED - substrate-associated community restructuring could increase the bioanode capacity
      for benzene conversion and electron transfer, as proposed by the authors. Whole-biofilm chemical and electrochemical
      measurements support performance, but relative genus enrichment does not isolate composition from substrate/acclimation
      effects or establish Bacillus and Arcobacter as necessary catalytic partners.
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Clearly, benzene addition has shifted the microbial community composition by diminishing Commamonas
      and enriching the Arcobacter and Bacillus populations
    explanation: Supports the substrate-driven shift from the sodium-acetate biofilm toward a Bacillus/Arcobacter-rich
      benzene bioanode.
- name: Benzene removal with voltage generation
  description: The acclimated whole-biofilm MFC removed 98.7 +/- 2.4% of benzene within 96 h while generating electricity.
    Maximum voltage was 902.3 +/- 20.6 mV in cycle VI (250 mg/L benzene); the final 330 mg/L cycle VII reached 899.9
    +/- 15.2 mV. Power density at 330 mg/L was 390.1 +/- 26 mW/m2 versus 238.8 +/- 19 with acetate, not a 100-fold
    acetate improvement. The abiotic control lacked sustained output voltage. Main-text GC/HPLC results report transient
    acetate/butyrate and final gaseous products, supporting whole-system conversion without tracing complete carbon
    fate or proving partner exchange. DET versus mediated transfer and catalytic roles of individual genera remain
    unresolved; the named participants are a partial roster.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Bacillus
    term:
      id: NCBITaxon:1386
      label: Bacillus <firmicutes>
  - preferred_term: Arcobacter
    term:
      id: NCBITaxon:28196
      label: Arcobacter
  - preferred_term: Pelobacter
    term:
      id: NCBITaxon:18
      label: Pelobacter
  - preferred_term: Pseudomonas
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  metabolites:
