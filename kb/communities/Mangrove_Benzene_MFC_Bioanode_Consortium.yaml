ecological_interactions:
- name: Benzene-fed bioanode niche shift
  description: >
    The shift from sodium acetate to benzene depleted the sodium-acetate-linked
    Comamonas signal and selected a benzene-fed bioanode in which Bacillus and
    Arcobacter together comprised 63.21% of genus-level 16S assignments.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  participating_taxa:
