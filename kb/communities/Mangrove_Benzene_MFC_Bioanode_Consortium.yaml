discussions:
- discussion_id: benzene_mfc_bioanode_species_resolution
  prompt: Resolve the species or MAG identities, full final-biofilm composition, genus-specific benzene-degradation
    genes, and stable raw 16S read accessions for the benzene-fed mangrove MFC bioanode.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy
  - ecological_interactions#Benzene-fed bioanode composition shift
  rationale: 'The ACS Omega full text reports genus-level 16S abundances in the final benzene-fed MFC but does not
    expose species-level identities, raw sequence accessions, or a direct metagenomic assignment of benzene-degradation
    and electron-transfer genes to each genus. The source also reports a genus spelled Desulfurumonas at 1.64% abundance;
    that member was not curated here until the label can be resolved against NCBI or GTDB.

    '
  posed_by: codex
  posed_date: '2026-09-26'
- discussion_id: benzene_mfc_composition_and_electron_transfer
  prompt: Which members and electron-transfer routes mediate whole-bioanode performance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Benzene-fed bioanode composition shift
  - ecological_interactions#Benzene removal with voltage generation
  rationale: 'Retain positive removal, product and electrochemical observations, while composition mediation remains
    HYPOTHESIZED. Relative genus profiles and other-strain literature cannot establish exact-system partner roles,
    niche partitioning, carbon balance or DET rather than MET. The prior #1124 removal of Bacillus PRIMARY_DEGRADER
    remains; Arcobacter non-graph role and Daphnia species metadata remain under #1586. Main Table 1 read, not separate
    supporting spectra/chromatograms or original figure pixels. #1583 repair adds no new structure.'
  posed_by: codex
  posed_date: '2026-10-06'
