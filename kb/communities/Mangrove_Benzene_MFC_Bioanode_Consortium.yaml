  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The percentage of benzene in the MFC decreased over time to 98.7 ± 2.4% after 96 h
    explanation: The Results sentence is awkwardly worded; abstract, Table 1 and Conclusion explicitly identify
      98.7% as removal, not residual benzene. This is a whole-system endpoint, not Bacillus-specific flux.
  - reference: PMID:41210787
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Maximum voltages observed in Cycles III, IV, V, VI, and VII were 678.5 ± 98.2, 542.4 ± 50.7, 768.6
      ± 10.8, 902.3 ± 20.6, and 899.9 ± 15.2 mV
    explanation: 'Supports the nonmonotonic cycle maxima: 902.3 mV at cycle VI/250 mg/L and 899.9 mV at cycle VII/330
      mg/L. It does not isolate community composition as their cause.'
