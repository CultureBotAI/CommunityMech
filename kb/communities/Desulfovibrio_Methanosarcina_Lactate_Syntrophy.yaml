  - target: Hydrogen Inhibition of Acetate Degradation
    description: PARTIAL - donor hydrogen production is implicated in delayed acetate use by coculture time courses
      and separate pure-culture hydrogen perturbation, not selective removal of donor hydrogen in the exact pair.
