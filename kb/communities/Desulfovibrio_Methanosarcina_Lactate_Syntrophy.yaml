id: CommunityMech:000150
name: Desulfovibrio-Methanosarcina Lactate Syntrophy
description: >
  A classic anaerobic two-member syntrophic coculture in which Desulfovibrio desulfuricans degrades lactate
  in the absence of added sulfate and Methanosarcina barkeri consumes fermentation products for methanogenesis.
  Lactate is first degraded to acetate and methane; later acetate is converted to methane and carbon dioxide,
  illustrating how hydrogen and substrate dynamics regulate coupled lactate oxidation and methanogenesis.
