id: CommunityMech:000439
name: Picocystis Activated-Sludge Refinery SWW Consortium
description: A laboratory algae-bacteria consortium combining Picocystis sp. with an aerobic activated-sludge bacterial consortium
  to treat petroleum refinery stripped wastewater (SWW). The study compared Picocystis monoculture and Picocystis plus bacteria
  in 2 L photobioreactors containing 10% or 25% SWW. The Pico-Bac consortium reached 72% COD reduction and 96.4% polyphenol
  reduction in 10% SWW, while hydrocarbon removal was highest at 80.4% in 25% SWW.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Compare Picocystis sp. alone with a Picocystis-activated sludge bacterial consortium for refinery stripped wastewater
    remediation and biodiesel-feedstock biomass production.
  assembly_strategy: Pair Picocystis sp. with an aerobic bacterial consortium sourced from activated sludge from a municipal
    wastewater treatment plant.
  perturbation_design: Culture Picocystis-only and Pico-Bac reactors in 10% and 25% petroleum refinery stripped wastewater.
  measurement_endpoints:
  - Algal growth and chlorophyll a
  - Picocystis lipid accumulation
  - COD, polyphenol, hydrocarbon, and oil-and-grease removal
  - Lepidium sativum seed phytotoxicity
  evidence:
  - reference: PMID:42397522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Picocystis sp. (Pico) alone and in consortium with aerobic bacteria (Pico-Bac)
    explanation: Identifies the algal monoculture and the algae-bacteria consortium treatment.
  - reference: PMID:42397522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: assessed in 2-L photobioreactors
    explanation: Supports the photobioreactor cultivation context.
