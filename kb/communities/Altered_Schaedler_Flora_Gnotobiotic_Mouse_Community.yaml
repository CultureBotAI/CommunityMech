      label: Lactobacillus
  - preferred_term: Mucispirillum schaedleri ASF457
    term:
      id: NCBITaxon:1379858
      label: Mucispirillum schaedleri ASF457
  - preferred_term: Parabacteroides ASF519
    term:
      id: NCBITaxon:375288
      label: Parabacteroides
  biological_processes:
