ecological_interactions:
- name: Stable Defined Murine Gut Colonization
  description: The ASF members are mouse-derived, culturable bacteria that can be stably maintained across
    generations in gnotobiotic mice, establishing a reduced-consortium context in which each member's
    abundance and GI-region distribution can be tracked by strain-specific PCR.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  - preferred_term: ASF Lactobacillus members
    term:
      id: NCBITaxon:1578
      label: Lactobacillus
  - preferred_term: Mucispirillum schaedleri ASF457
    term:
      id: NCBITaxon:1379858
      label: Mucispirillum schaedleri ASF457
  - preferred_term: Parabacteroides ASF519
    term:
      id: NCBITaxon:375288
      label: Parabacteroides
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: Oxygen-Sensitive ASF GI Niche Partitioning
    description: Long-term maintenance of the eight-member defined flora allows strain-resolved abundance
      measurements that reveal oxygen-linked dominance patterns along the upper and lower gut.
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: stably passed through multiple generations
    explanation: Supports stable colonization and transmission in gnotobiotic mouse facilities.
- name: Oxygen-Sensitive ASF GI Niche Partitioning
  description: ASF strain abundance in gnotobiotic mice is structured by gut oxygen availability, with
    microaerotolerant Lactobacillus murinus ASF361 occupying the upper GI tract and obligate anaerobic
    ASF members predominating in the cecal and colonic flora.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  - preferred_term: ASF Lactobacillus members
    term:
      id: NCBITaxon:1578
      label: Lactobacillus
  - preferred_term: Mucispirillum schaedleri ASF457
    term:
      id: NCBITaxon:1379858
      label: Mucispirillum schaedleri ASF457
  - preferred_term: Parabacteroides ASF519
    term:
      id: NCBITaxon:375288
      label: Parabacteroides
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  downstream:
  - target: ASF356/ASF492 Short-Chain Fatty Acid Fermentation
    description: Lower-gut dominance by obligate anaerobic members, including ASF356 and ASF492, positions
      fermentative Firmicutes to contribute short-chain fatty acids in the cecal and colonic community.
  evidence:
  - reference: PMID:15128534
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Individual strain abundance was dependent on oxygen sensitivity, with microaerotolerant
      Lactobacillus murinus ASF361 present at 10(5) to 10(7) cells/g of tissue in the upper
      GI tract and obligate anaerobic ASF strains being predominant in the cecal and colonic flora
    explanation: Quantifies oxygen-linked partitioning of ASF Lactobacillus and obligate-anaerobe
      members across mouse GI compartments.
- name: ASF356/ASF492 Short-Chain Fatty Acid Fermentation
  description: The clostridial ASF356 and eubacterial ASF492 members are major short-chain-fatty-acid
    producers in the ASF, linking stable lower-gut colonization by anaerobic Firmicutes to fermentative
    metabolite output.
  scope: COMMUNITY_LEVEL
  interaction_type: CROSS_FEEDING
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  downstream:
  - target: SCFA-Linked Colonic Treg Homeostasis
    description: SCFAs produced by gut bacteria provide a mechanistic metabolite axis for regulatory
      T-cell pool size and function in the colon.
- name: SCFA-Linked Colonic Treg Homeostasis
  description: Gut microbiota-derived short-chain fatty acids regulate the size and function of the colonic
    Foxp3-positive regulatory T-cell pool and connect ASF fermentation potential to host mucosal
    homeostasis.
  scope: COMMUNITY_LEVEL
  interaction_type: MUTUALISM
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  biological_processes:
  - preferred_term: immune response
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:23828891
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: short-chain fatty acids, gut microbiota-derived bacterial fermentation products,
      regulate the size and function of the colonic Treg pool and protect against colitis
    explanation: Establishes the microbial fermentation product-to-colonic Treg mechanism linked
      downstream of ASF SCFA production.
environmental_factors:
- name: gnotobiotic mouse gastrointestinal tract
  value: Defined flora maintained in gnotobiotic mice
  description: ASF is used in mice colonized with known murine gut bacteria to reduce complexity while
    preserving a stable intestinal community.
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: mice colonized with a consortium of known bacteria that naturally inhabit the murine gut
    explanation: Supports the murine gut host context.
- name: anaerobic gut community members
  value: Culturable mouse-derived intestinal bacteria
  description: ASF members were derived from mice and selected as a culturable, defined gut consortium.
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: REVIEW
    snippet: were all derived from mice, can be cultured in vitro
    explanation: Supports the origin and culturability of the defined community.
