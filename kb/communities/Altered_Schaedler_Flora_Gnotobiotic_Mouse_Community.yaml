    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: REVIEW
    snippet: stably passed through multiple generations
    explanation: Supports stable colonization and transmission in gnotobiotic mouse facilities.
- name: ASF Gastrointestinal Spatial Partitioning
  description: PARTIAL - strain-specific PCR measured regional ASF abundances, with microaerotolerant ASF361 prominent
    in the upper gut and obligate anaerobes predominant in the cecum and colon. Oxygen sensitivity is a proposed
    explanation for this spatial pattern, not an isolated oxygen-manipulation result.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  - preferred_term: ASF Lactobacillus members
    term:
      id: NCBITaxon:1578
      label: Lactobacillus
  - preferred_term: Mucispirillum schaedleri ASF457
    term:
      id: NCBITaxon:1379858
      label: Mucispirillum schaedleri ASF457
  - preferred_term: Parabacteroides ASF519
    term:
      id: NCBITaxon:375288
      label: Parabacteroides
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:15128534
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Individual strain abundance was dependent on oxygen sensitivity, with microaerotolerant Lactobacillus
      murinus ASF361 present at 10(5) to 10(7) cells/g of tissue in the upper GI tract and obligate anaerobic ASF
      strains being predominant in the cecal and colonic flora
    explanation: Supports spatial abundance differences; the oxygen explanation is interpretive and the paper discusses
      other possible determinants.
- name: ASF356/ASF492 Short-Chain Fatty Acid Fermentation
  description: ASF356 and ASF492 cultures produced acetate and propionate in the primary SCFA study. Their production
    exceeded some other tested isolates, but this does not quantify their relative contribution within the intact
    ASF community or demonstrate transfer to a microbial recipient.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:23828891
    snippet: ASF 356 and 492 and C. ramosum generated more propionate
    explanation: The primary results compare isolate-culture propionate and acetate production. This short excerpt
      was checked against the primary article; the independent local cache retains only its abstract.
    evidence_source: IN_VITRO
    supports: SUPPORT
- name: SCFA-Linked Colonic Treg Homeostasis
  description: PARTIAL - SCFA supplementation and Ffar2 experiments support regulation of colonic Treg abundance
    and function. ASF-colonized mice had luminal SCFAs, but necessary mediation by ASF356/ASF492 within the intact
    community was not isolated by the reviewed experiments. Reciprocal bacterial benefit is not established.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  biological_processes:
  - preferred_term: immune response
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:23828891
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: short-chain fatty acids, gut microbiota-derived bacterial fermentation products, regulate the size
      and function of the colonic Treg pool and protect against colitis
    explanation: Supports the general metabolite-to-host mechanism, not necessary mediation by particular ASF members.
