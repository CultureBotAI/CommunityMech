ecological_interactions:
- name: Stable Defined Murine Gut Colonization
  description: The ASF members are mouse-derived, culturable bacteria that can be stably maintained across
    generations in gnotobiotic mice.
  interaction_type: COLONIZATION_FACILITATION
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: stably passed through multiple generations
    explanation: Supports stable colonization and transmission in gnotobiotic mouse facilities.
- name: Host-Microbiota Mutualistic Model
  description: ASF provides a reduced-complexity model for studying mutualistic host-GI microbiota
    relationships while preserving a known consortium rather than a single isolate.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: REVIEW
    snippet: The gastrointestinal (GI) microbiota forms a mutualistic relationship with the host
    explanation: Supports the host-microbiota relationship represented by ASF mice.
- name: Genome-Enabled Member Interaction Model
  description: Draft genomes for all eight ASF members enable community-level study of member functions
    and interactions in a controlled murine gut setting.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:24723722
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We report here the draft genome sequences of the 8 bacteria that comprise the ASF
    explanation: Supports genome-enabled analysis of all ASF members.
environmental_factors:
- name: gnotobiotic mouse gastrointestinal tract
  value: Defined flora maintained in gnotobiotic mice
  description: ASF is used in mice colonized with known murine gut bacteria to reduce complexity while
    preserving a stable intestinal community.
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: mice colonized with a consortium of known bacteria that naturally inhabit the murine gut
    explanation: Supports the murine gut host context.
- name: anaerobic gut community members
  value: Culturable mouse-derived intestinal bacteria
  description: ASF members were derived from mice and selected as a culturable, defined gut consortium.
  evidence:
  - reference: PMID:26323627
    supports: SUPPORT
    evidence_source: REVIEW
    snippet: were all derived from mice, can be cultured in vitro
    explanation: Supports the origin and culturability of the defined community.
