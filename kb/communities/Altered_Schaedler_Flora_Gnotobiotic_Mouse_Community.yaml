id: CommunityMech:000144
name: Altered Schaedler Flora Gnotobiotic Mouse Community
description: The altered Schaedler flora (ASF) is an eight-member defined murine gut bacterial community
  used in gnotobiotic mice. The community was developed as a standardized, culturable intestinal flora
  from mouse-derived bacteria and has been used for decades to study host-microbiota relationships,
  member stability, spatial distribution, immune effects, and genome-informed community metabolism.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Provide a stable, defined murine gut microbiota for controlled gnotobiotic mouse studies.
  assembly_strategy: Eight mouse-derived bacterial members were assembled into a standardized consortium
    that can be cultured and stably transmitted in gnotobiotic mouse colonies.
  measurement_endpoints:
  - strain-specific PCR quantification
  - spatial distribution in the mouse gastrointestinal tract
  - host immune and disease phenotypes
  - draft genome sequencing
  evidence:
  - &asf_defined
    reference: PMID:26323627
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The altered Schaedler flora (ASF) is a model community of eight microorganisms
    explanation: Supports ASF as an eight-member defined gnotobiotic community.
environment_term:
  preferred_term: gnotobiotic mouse gastrointestinal tract
  term:
    id: ENVO:2100002
    label: intestine environment
  notes: ENVO human gut environment is used as the closest validated gut-environment term in this schema;
    the curated system is a murine gnotobiotic gastrointestinal community.
