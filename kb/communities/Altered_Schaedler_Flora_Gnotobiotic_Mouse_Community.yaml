ecological_interactions:
- name: Stable Defined Murine Gut Colonization
  description: The defined mouse-derived ASF bacteria can persist across generations in gnotobiotic mice. This establishes
    a stable colonization phenotype, not a demonstrated member-to-member colonization-facilitation mechanism.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: ASF Firmicutes members
    term:
      id: NCBITaxon:1239
      label: Bacillota
  - preferred_term: ASF Lactobacillus members
    term:
