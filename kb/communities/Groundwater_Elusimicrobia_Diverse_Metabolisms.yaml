ecological_interactions:
- name: Comparative Elusimicrobia Genomic Metabolic Repertoires
  description: The 94-genome survey compares habitat-associated groups with different inferred metabolic repertoires.
    These genomes represent multiple sites and lineages, not a demonstrated coexisting community. Both canonical
    habitat labels are retained despite sharing a taxon CURIE; the comparison does not establish niche partitioning
    or a causal sequence among the component findings.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:32681159
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Groundwater Elusimicrobia are metabolically diverse compared to gut microbiome Elusimicrobia
    explanation: Supports comparative genomic diversity, not experimentally demonstrated community niche partitioning.
  participating_taxa:
  - preferred_term: groundwater-associated Elusimicrobia
    term:
      id: NCBITaxon:641853
      label: Elusimicrobia
  - preferred_term: animal-associated Elusimicrobia
    term:
      id: NCBITaxon:641853
      label: Elusimicrobia
- name: Predicted Lineage-Specific Respiratory Capacities
  description: Selected groundwater-associated lineages encode respiratory machinery consistent with oxygen or nitrogen-oxide
    use. Capacities differ by lineage; they are not a universal complete respiratory or denitrification route and
    are not demonstrated cross-feeding. These are source-only genomic predictions, not measured growth or electron
    flux.
  scope: PAIRWISE
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
    notes: Associated with a predicted intrinsic pathway, not measured interspecies exchange.
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
    notes: Associated with a predicted intrinsic pathway, not measured interspecies exchange.
  - preferred_term: dioxygen
    term:
      id: CHEBI:15379
      label: dioxygen
    notes: Associated with a predicted intrinsic pathway, not measured interspecies exchange.
  evidence:
  - reference: PMID:32681159
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: reliant on oxygen or nitrate/nitrite-dependent respiration, or a variety of organic compounds
    explanation: Supports predicted capacities across different genomes, not a measured universal pathway or donor-recipient
      exchange.
  source_taxon:
    preferred_term: groundwater-associated Elusimicrobia
    term:
      id: NCBITaxon:641853
      label: Elusimicrobia
- name: Predicted Rnf-Associated Acetogenesis from H2 and CO2
  description: Genomic features in lineages VII, VIII and IX support predicted hydrogen/carbon-dioxide acetogenesis
    involving Wood-Ljungdahl and Rnf components. The study does not demonstrate acetogenic flux, obligatory Rnf
    dependence or transfer of acetate to a partner. The Rnf name is not evidence of nitrogen fixation.
  scope: PAIRWISE
  metabolites:
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
    notes: Associated with a predicted intrinsic pathway, not measured interspecies exchange.
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
    notes: Associated with a predicted intrinsic pathway, not measured interspecies exchange.
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
    notes: Associated with a predicted intrinsic pathway, not measured interspecies exchange.
  biological_processes:
