- name: Nitrogenase-Paralog Loci with Predicted Tetrapyrrole Function
  description: Genomic neighborhoods contain divergent nitrogenase-paralog genes, often near radical-SAM genes.
    Their proposed tetrapyrrole-related function remains unresolved. These loci do not demonstrate nitrogen fixation,
    a chemically identified cofactor, metabolite donation or commensalism.
  scope: PAIRWISE
  biological_processes:
  - preferred_term: tetrapyrrole metabolic process
    term:
      id: GO:0033013
      label: tetrapyrrole metabolic process
    notes: Hypothesized biochemical function, not an experimentally assigned product or activity.
  evidence:
  - reference: PMID:32681159
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: a new group of nitrogenase paralogs that co-occur with an extensive suite of radical S-Adenosylmethionine
      (SAM) proteins
    explanation: Supports encoded gene neighborhoods; it does not establish their biochemical products or ecological
      effects.
  - reference: PMID:32681159
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: predict that the gene clusters reduce a tetrapyrrole, possibly to form a novel cofactor
    explanation: The source explicitly predicts function; it does not report catalytic validation or cofactor identification.
  source_taxon:
