    term:
      id: GO:0015977
      label: carbon fixation
    notes: Predicted carbon-fixation potential; no measured flux assigned.
  evidence:
  - reference: PMID:32681159
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Rhodobacter nitrogen fixation (Rnf) complex-dependent acetogenesis with hydrogen and carbon dioxide
      as the substrates
    explanation: Supports a genomic acetogenesis prediction, not measured carbon fixation, pathway necessity or
      cross-feeding.
  source_taxon:
