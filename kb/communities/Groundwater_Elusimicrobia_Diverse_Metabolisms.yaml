discussions:
- discussion_id: elusimicrobia_genomic_capacity_and_ecological_context
  prompt: Which predicted capacities operate in these organisms and their actual communities?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Comparative Elusimicrobia Genomic Metabolic Repertoires
  - ecological_interactions#Predicted Lineage-Specific Respiratory Capacities
  - ecological_interactions#Predicted Rnf-Associated Acetogenesis from H2 and CO2
  - ecological_interactions#Nitrogenase-Paralog Loci with Predicted Tetrapyrrole Function
  rationale: Genome annotation and pathway-completeness thresholds are not cultivation, catalytic activity or exchange
    measurements. Determine strain-level pathway activity, partner identities and co-occurrence before assigning
    ecological interaction mechanisms. Establish the paralog product experimentally before equating it with nitrogen
    fixation or a specific cofactor. Preserve the two distinct habitat labels sharing one CURIE; groundwater predictions
    must not silently propagate to animal-associated organisms. The three former arrows were overview inclusion
    links, not causal evidence. Non-graph functional roles and evidence classifications are preserved outside this
    graph review, not certified.
  posed_by: codex
  posed_date: '2026-10-06'
