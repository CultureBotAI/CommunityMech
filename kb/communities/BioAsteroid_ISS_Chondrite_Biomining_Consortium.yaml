metal_relevance: PRIMARY
metal_notes: >
  Biomining of asteroidal L-chondrite material. The platinum-group element
  palladium was a primary target, with Penicillium simplicissimum enhancing its
  release in microgravity. Other elements with reported microbial leaching
  effects include iron, copper, nickel, cobalt, vanadium and zinc; only the
  metal/REE elements that map to schema enum values are listed here. Two rare
  earth elements — europium and lutetium — were bioleached in this study.
  Platinum, ruthenium, molybdenum and manganese are also reported in the source
  but have no corresponding schema enum value and are therefore omitted from the
  structured metal lists.
