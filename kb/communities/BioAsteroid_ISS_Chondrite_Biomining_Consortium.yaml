id: CommunityMech:000305
name: BioAsteroid ISS Chondrite Biomining Consortium
description: >
  The BioAsteroid experiment tested microbial biomining of asteroidal
  (L-chondrite) material under microgravity aboard the International Space
  Station (ISS). Two heterotrophic microorganisms — the bacterium Sphingomonas
  desiccabilis CP1D and the fungus Penicillium simplicissimum DSM 1078 — were
  flown both as single strains and as an artificial two-member consortium on
  crushed Northwest Africa (NWA) 869 L-chondrite meteorite fragments, in a 50%
  v/v R2A medium, inside BioMining Reactors housed in KUBIK incubators. The
  study measured leaching of 44 elements (including the platinum-group elements
  ruthenium, palladium and platinum, and other elements of industrial interest)
  from the meteorite and compared microbial versus abiotic (non-biological)
  leaching under microgravity and terrestrial gravity. Penicillium
  simplicissimum was the most effective bioleaching organism in microgravity,
  enhancing release of palladium, platinum and other elements relative to
  non-biological controls, while Sphingomonas desiccabilis formed a contiguous
  biofilm on the rock surface but performed similarly or worse than the abiotic
  control for most platinum-group elements. In the consortium, the fungus alone
  outperformed the mixture for palladium, suggesting an antagonistic effect of
  the bacterium. Metabolomic analysis showed distinct, microgravity-dependent
  changes in microbial metabolism, particularly for P. simplicissimum, with
  increased production of carboxylic acids and other molecules of potential
  biomining or pharmaceutical interest. The work demonstrates proof of principle
  for microbe-driven transformation of asteroidal material for in situ resource
  utilization in space.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOMINING
engineering_design:
  objective: >
    Test whether heterotrophic microorganisms (a bacterium and a fungus), alone
    and as an artificial consortium, can catalyse the release of technologically
    and economically important elements — including platinum-group elements —
    from L-chondrite asteroidal material under microgravity aboard the ISS, for
    in situ resource utilization in space.
  assembly_strategy: >
    Defined two-member artificial consortium of the bacterium Sphingomonas
    desiccabilis CP1D and the fungus Penicillium simplicissimum DSM 1078,
    desiccated onto crushed sterile L-chondrite meteorite fragments and grown in
    50% v/v R2A medium; single-strain cultures and non-biological controls were
    run in parallel, in microgravity (ISS) and terrestrial-gravity (Earth)
    conditions.
  perturbation_design: >
    Compared microbial versus abiotic leaching and microgravity (ISS) versus
    terrestrial gravity (Earth) for each treatment (bacterium, fungus,
    consortium, non-biological control).
  measurement_endpoints:
  - Dissolution of 44 elements from the meteorite (ICP-MS/ICP-OES of the liquid
    fraction), including platinum-group elements
  - Microbe-mineral interaction and biofilm/mycelium formation (SEM/EDS)
  - Microbial metabolome under microgravity versus terrestrial gravity
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: tested the use of microorganisms (bacteria and fungi) to extract 44 elements from L-chondrite asteroidal material
    explanation: States the objective of extracting elements from L-chondrite asteroidal material with bacteria and fungi.
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: An artificial microbial consortium, a common strategy in terrestrial biomining
    explanation: Supports the artificial-consortium assembly strategy.
