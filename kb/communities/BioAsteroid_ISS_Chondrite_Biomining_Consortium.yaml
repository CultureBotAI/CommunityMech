    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the fungus alone outperformed the consortium, possibly due to the antagonistic effects of the bacterium
    explanation: Documents bacterial antagonism of fungal palladium leaching in the consortium.
environmental_factors:
- name: Microgravity (ISS spaceflight)
  value: microgravity
  description: >
    The experiment was conducted under microgravity aboard the International
    Space Station, with samples installed in non-centrifuged (microgravity)
    slots of KUBIK incubators; terrestrial-gravity controls were run on Earth.
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: installation into the microgravity (non-centrifuged) slots within the two KUBIK (ESA) incubators
    explanation: Documents the microgravity cultivation condition aboard the ISS.
- name: Meteorite substrate (L-chondrite, NWA 869)
  value: Northwest Africa (NWA) 869 L3-6 chondrite regolith breccia
  description: >
    The microbe-mineral substrate was crushed Northwest Africa (NWA) 869
    meteorite, an L3-6 (L-chondrite) regolith breccia, fragmented to ~1-3.5 mm
    pieces; its dominant mineral phases are olivine and pyroxene with minor
    feldspar, melilite and iron sulfides.
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: was the Northwest Africa (NWA) 869 meteorite, a L3-6 chondrite regolith breccia
    explanation: Identifies the L-chondrite meteorite used as the leaching substrate.
- name: Incubation temperature and duration
  value: ~19.5-20 °C for 19 days
  description: >
    Samples were incubated for 19 days at approximately 19.5-20 °C (ISS incubator
    setpoint 20 °C; logged flight temperature 19.5 °C).
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Samples grew for 19 days at 19.5
    explanation: Documents the 19-day incubation at ~19.5 °C.
- name: Medium pH
  value: '7.2'
  unit: pH
  description: >
    Cultivation used a near-neutral 50% v/v R2A medium at pH 7.2, chosen to
    encourage the microorganisms to extract nutrients from the meteorite
    (heterotrophic, non-acidophilic bioleaching).
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The medium used for this experiment was a solution of 50% v/v R2A medium
    explanation: Documents the 50% v/v R2A medium; the source reports its pH as 7.2.
