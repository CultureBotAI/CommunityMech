ecological_interactions:
- name: Fungal bioleaching of platinum-group and critical elements from L-chondrite
  description: >
    Penicillium simplicissimum catalyses the release of platinum-group elements
    (palladium, platinum, ruthenium) and other critical elements (including
    phosphorus, vanadium and copper) from the L-chondrite meteorite, enhancing
    leaching relative to non-biological controls under microgravity. This is
    interpreted as heterotrophic bioleaching through proton, organic-acid and
    complexing-compound release.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Penicillium simplicissimum DSM 1078
    term:
      id: NCBITaxon:69488
      label: Penicillium simplicissimum
  metabolites:
  - preferred_term: palladium
    term:
      id: CHEBI:33363
      label: palladium
  - preferred_term: vanadium
    term:
      id: CHEBI:27698
      label: vanadium atom
  - preferred_term: copper(2+)
    term:
      id: CHEBI:29036
      label: copper(2+)
  - preferred_term: carboxylic acid
    term:
      id: CHEBI:33575
      label: carboxylic acid
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Penicillium simplicissimum enhanced the release of palladium, platinum and other elements in microgravity
    explanation: Documents fungal enhancement of platinum-group element release in microgravity.
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: enhanced bioleaching of phosphorus, vanadium and copper compared to the bacterium
    explanation: Documents fungal enhancement of phosphorus, vanadium and copper leaching.
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: increased production of carboxylic acids
    explanation: Links the fungus to increased carboxylic acid production, a candidate leaching mechanism.
- name: Bacterial and fungal biofilm colonization of the meteorite surface
  description: >
    Both the bacterium Sphingomonas desiccabilis and the fungus Penicillium
    simplicissimum colonize the L-chondrite surface. In consortium, the bacterium
    and the fungus interact in a similar fashion in both gravity conditions,
    forming a mixed filamentous (fungus) and rod-shaped-cell (bacterium) biofilm
    on the rock, providing the physical microbe-mineral contact required for
    bioleaching.
  interaction_type: COLONIZATION_FACILITATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Sphingomonas desiccabilis CP1D
    term:
      id: NCBITaxon:429134
      label: Sphingomonas desiccabilis
  target_taxon:
    preferred_term: Penicillium simplicissimum DSM 1078
    term:
      id: NCBITaxon:69488
      label: Penicillium simplicissimum
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  evidence:
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: formed a contiguous biofilm across many areas of the rock
    explanation: Documents S. desiccabilis biofilm formation on the meteorite surface.
  - reference: PMID:41617698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the bacterium and the fungus interacting in a similar fashion in both gravity conditions
    explanation: Documents co-colonization of the rock by the bacterium and the fungus in the consortium.
- name: Bacterial antagonism of fungal palladium leaching in the consortium
  description: >
    In the two-member consortium, palladium leaching was lower than for the
    fungus alone: Penicillium simplicissimum alone outperformed the consortium
    for palladium, an outcome the authors attribute to an antagonistic effect of
    the bacterium Sphingomonas desiccabilis on fungal palladium extraction.
  interaction_type: COMPETITION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Sphingomonas desiccabilis CP1D
    term:
      id: NCBITaxon:429134
      label: Sphingomonas desiccabilis
  target_taxon:
    preferred_term: Penicillium simplicissimum DSM 1078
    term:
      id: NCBITaxon:69488
      label: Penicillium simplicissimum
  metabolites:
  - preferred_term: palladium
    term:
      id: CHEBI:33363
      label: palladium
  evidence:
