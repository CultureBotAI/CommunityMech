- name: Multispecies Bacterial Consortium Supporting H2 Production
  description: 'Bacillus cereus, Stenotrophomonas goyi, and Microbacterium forte form a naturally occurring
    multispecies bacterial community that synergistically supports sustained algal hydrogen production
    in Chlamydomonas cultures. These three bacterial species work together to create optimal conditions
    for anaerobic algal H2 generation through complementary metabolic activities: oxygen scavenging to
    establish anaerobiosis necessary for hydrogenase activity, consumption of inhibitory photosynthetic
    oxygen, nutrient cycling and remineralization, and production of growth-promoting factors. Bacillus
    cereus contributes spore-forming resilience and metabolic versatility, enabling the consortium to
    persist through aerobic-anaerobic transitions. Stenotrophomonas goyi provides stress tolerance and
    may produce enzymes or secondary metabolites that benefit algal cells. Together with Microbacterium
    forte (the dominant mannitol consumer), this tripartite bacterial partnership sustains algal H2 production
    for 17-25 days at rates up to 313 mL H2/L, far exceeding axenic algal performance. The naturally co-evolved
    bacterial community demonstrates functional complementarity where no single bacterial species can
    replicate the full consortium benefit, highlighting the importance of microbial diversity in biotechnological
    H2 production systems.

    '
