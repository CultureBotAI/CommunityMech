id: CommunityMech:000014
name: Chlamydomonas-Bacterial Hydrogen Production Consortium
description: 'A synthetic algae-bacteria consortium for sustainable hydrogen production, composed of the
  green alga Chlamydomonas reinhardtii and three bacterial species: Microbacterium forte sp. nov., Bacillus
  cereus, and Stenotrophomonas goyi sp. nov. This mutualistic association produces up to 313 mL H2/L over
  17 days in high-cell density cultures. M. forte is the primary bacterial species responsible for improving
  algal hydrogen production, while the complete bacterial community enhances and sustains photobiological
  H2 generation through metabolic cooperation.

  '
