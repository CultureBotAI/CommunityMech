ecological_interactions:
- name: Streptococcal Exoglucan Entrapment of Selenomonas sputigena
  description: Streptococcus mutans exoglucans trap Selenomonas sputigena, suppress its motility, and create a structured
    mixed-species biofilm. The primary in-vitro surface-colonization comparison supports S. mutans-to-S. sputigena
    facilitation; it does not establish the reverse direction from acid output alone.
  interaction_type: COLONIZATION_FACILITATION
  scope: PAIRWISE
  source_taxon:
    preferred_term: Streptococcus mutans
    term:
      id: NCBITaxon:1309
      label: Streptococcus mutans
  target_taxon:
    preferred_term: Selenomonas sputigena
    term:
      id: NCBITaxon:69823
      label: Selenomonas sputigena
  metabolites:
  - preferred_term: glucan
    term:
      id: CHEBI:37163
      label: glucan
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Honeycomb Biofilm Acidogenesis
    description: Exoglucan entrapment immobilizes and supports S. sputigena in the mixed biofilm, leading to a honeycomb-like
      superstructure around S. mutans that enhances acidogenesis.
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that S. sputigena, a flagellated anaerobe with previously unknown role in supragingival biofilm,
      becomes trapped in streptococcal exoglucans, loses motility but actively proliferates to build a honeycomb-like
      multicellular-superstructure encapsulating S. mutans, enhancing acidogenesis.
    explanation: Documents matrix-mediated trapping and structured coassembly with S. mutans.
- name: Honeycomb Biofilm Acidogenesis
  description: Entrapped Selenomonas sputigena actively proliferates into a honeycomb-like multicellular superstructure
    that encapsulates Streptococcus mutans and enhances acidogenesis in the mixed-species biofilm. This is a mixed-biofilm
    structure and metabolic outcome, not a measurement of S. mutans establishment. Primary matrix-disruption results
    support the structural contribution to localized acidity.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glucan
    term:
      id: CHEBI:37163
      label: glucan
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: Rodent Coinfection Caries Outcome
    description: 'PARTIAL: the structured acidic biofilm is the proposed mediator of the rodent lesion outcome.
      The primary in-vitro disruption and ex-vivo enamel results support the structure-to-damage interpretation,
      while the rodent coinfection comparison does not independently isolate that mediator in vivo.'
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that S. sputigena, a flagellated anaerobe with previously unknown role in supragingival biofilm,
      becomes trapped in streptococcal exoglucans, loses motility but actively proliferates to build a honeycomb-like
      multicellular-superstructure encapsulating S. mutans, enhancing acidogenesis.
    explanation: Documents S. sputigena proliferation and S. mutans encapsulation as the mixed-biofilm architecture
      that heightens acidogenesis.
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The data suggest that the interspecies spatial structuring between S. sputigena and S. mutans is required
      to create a virulent acidic microenvironment.
    explanation: Direct primary result supporting the retained structural interpretation; not isolated in-vivo mediation.
  participating_taxa:
  - preferred_term: Streptococcus mutans
    term:
      id: NCBITaxon:1309
      label: Streptococcus mutans
  - preferred_term: Selenomonas sputigena
    term:
      id: NCBITaxon:69823
      label: Selenomonas sputigena
- name: Rodent Coinfection Caries Outcome
  description: In the reported rodent model, S. sputigena alone did not cause more caries than the control, whereas
    dual-species coinfection increased lesion severity. This community-associated host outcome does not itself demonstrate
    a colonization benefit to S. mutans or establish human causal direction.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: While incapable of causing caries on its own, when co-infected with S. mutans, S. sputigena causes
      extensive tooth enamel lesions and exacerbates disease severity in vivo.
    explanation: Supports S. sputigena as a pathobiont that heightens S. mutans virulence.
  participating_taxa:
