cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: Saliva-coated hydroxyapatite disc (2.7 +/- 0.2 cm2) held
    vertically to mimic a tooth-enamel surface.
  controls_notes: Mixed biofilms grown in BHIS medium with 1% sucrose, inoculated at
    10^7 CFU/mL for the partner species and 10^5 CFU/mL for S. mutans.
  notes: 'Recorded for the MIXED biofilm, which the paper grows alongside single-species
    biofilms as its comparison. The 37 C anaerobic chamber given earlier is where the
    strains were taken to exponential phase before inoculation, so it is preparation
    rather than the biofilm''s own condition (#529). Sucrose is not an incidental
    ingredient here: it is supplied to simulate the cariogenic conditions the study
    is about.'
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Single or mixed biofilms were grown on the apatitic surfaces in BHIS
      medium (107 CFU/mL for the new species and/or 105 CFU/mL S. mutans) supplemented
      with 1% sucrose
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a saliva-coated hydroxyapatite disc (2.7 ± 0.2 cm2; Clarkson Chromatography
      Products) was placed in a vertical position to mimic the tooth-enamel surfaces
      of human teeth
discussions:
- discussion_id: selenomonas_graph_evidence_and_model_scope
  prompt: How directly does the model establish mediation of disease in humans?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Primary results support S. mutans-assisted S. sputigena colonization, matrix-dependent structure and
    local acidity, ex-vivo enamel damage, and greater rodent disease under coinfection. Retain this experimental
    evidence and both directions; only the in-vivo mediation bridge is PARTIAL. Do not turn the reverse acidogenesis
    effect into a colonization-facilitation label. Human discovery data are cross-sectional. Exact molecular details
    remain unresolved; no new mechanisms or experimental procedures are added.
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: the cross-sectional nature of our human observational data, which limits the samples’ inferential potential
      regarding temporality and causality
    explanation: The primary discussion explicitly limits human causal inference.
  attaches_to:
  - ecological_interactions#Streptococcal Exoglucan Entrapment of Selenomonas sputigena
  - ecological_interactions#Honeycomb Biofilm Acidogenesis
  - ecological_interactions#Rodent Coinfection Caries Outcome
