ecological_interactions:
- name: Streptococcal Exoglucan Entrapment of Selenomonas sputigena
  description: >-
    Streptococcus mutans exoglucans trap Selenomonas sputigena, suppress its
    motility, and create a structured mixed-species biofilm.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Streptococcus mutans
    term:
      id: NCBITaxon:1309
      label: Streptococcus mutans
  target_taxon:
    preferred_term: Selenomonas sputigena
    term:
      id: NCBITaxon:69823
      label: Selenomonas sputigena
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      We show that S. sputigena, a flagellated anaerobe with previously unknown
      role in supragingival biofilm, becomes trapped in streptococcal
      exoglucans, loses motility but actively proliferates to build a
      honeycomb-like multicellular-superstructure encapsulating S. mutans,
      enhancing acidogenesis.
    explanation: Documents matrix-mediated trapping and structured coassembly with S. mutans.
- name: Pathobiont-Enhanced Cariogenicity
  description: >-
    Selenomonas sputigena is non-cariogenic alone but markedly worsens enamel
    lesion formation when coinfected with Streptococcus mutans.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Selenomonas sputigena
    term:
      id: NCBITaxon:69823
      label: Selenomonas sputigena
  target_taxon:
    preferred_term: Streptococcus mutans
    term:
      id: NCBITaxon:1309
      label: Streptococcus mutans
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      While incapable of causing caries on its own, when co-infected with S.
      mutans, S. sputigena causes extensive tooth enamel lesions and
      exacerbates disease severity in vivo.
    explanation: Supports S. sputigena as a pathobiont that heightens S. mutans virulence.
related_ingredients:
- preferred_term: glucan
  chebi_term:
    id: CHEBI:37163
    label: glucan
  relevance: >
    Streptococcus mutans produces extracellular glucans (exoglucans) that form
    the biofilm matrix in which Selenomonas sputigena becomes trapped, enabling
    the honeycomb-like multicellular superstructure central to this cariogenic
    community.
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      We show that S. sputigena, a flagellated anaerobe with previously unknown
      role in supragingival biofilm, becomes trapped in streptococcal
      exoglucans, loses motility but actively proliferates to build a
      honeycomb-like multicellular-superstructure encapsulating S. mutans,
      enhancing acidogenesis.
    explanation: Names streptococcal exoglucans (extracellular glucan) as the matrix entrapping S. sputigena.
growth_media:
- name: Brain Heart Infusion Supplemented (BHIS) medium
  temperature: '37'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  incubation_time: '48'
  incubation_time_unit: h
  vessel_type: apatitic (hydroxyapatite) disc biofilm
  preparation_notes: >-
    BHI broth supplemented with 5 g/L yeast extract, 5 mg/L hemin, 1 mg/L
    vitamin K1, and 0.5 g/L L-cysteine; single or mixed biofilms grown on
    apatitic surfaces in BHIS with 1% sucrose to simulate cariogenic conditions.
  evidence:
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Bacteria were grown in Brain Heart Infusion Supplemented (BHIS) medium
      (Brain Heart Infusion broth supplemented with 5 g/L yeast extract, 5 mg/L
      Hemin, 1 mg/L Vitamin K1, and 0.5 g/L L-cysteine) at 37 °C to exponential
      phase in an anaerobic chamber (Anaerobe Systems).
    explanation: Names the BHIS medium, 37 °C, and anaerobic-chamber cultivation of the biofilm members.
  - reference: PMID:37217495
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The cultures were incubated in the anaerobic chamber at 37 °C for 48 h.
    explanation: Documents 48 h anaerobic incubation at 37 °C.
