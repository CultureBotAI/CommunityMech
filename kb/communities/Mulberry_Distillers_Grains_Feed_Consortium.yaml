id: CommunityMech:000435
name: Mulberry-Distillers Grains Feed Solid-State Fermentation Consortium
description: >
  A designed four-species solid-state fermentation consortium assembled from
  Bacillus subtilis, Saccharomyces cerevisiae, Levilactobacillus brevis, and
  Lactiplantibacillus plantarum to convert mulberry leaves and distillers'
  grains into higher-nutrient animal feed. Zhang et al. compared three
  Bacillus/yeast/lactic-acid-bacterium inoculation recipes across mulberry
  leaves, distillers' grains, and mixed ML&DG substrates, including a 1:1:1:1
  four-species recipe, under 10% inoculation and five days of anaerobic
  solid-state fermentation.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >
    Use a designed Bacillus-yeast-LAB consortium to ferment mulberry leaves and
    distillers' grains into higher-nutrient feed, degrade antinutritional
    tannin and phytic acid, acidify the substrate, and retain protein and
    antioxidant activity.
  assembly_strategy: >
    Compare recipe A, Bacillus subtilis / Saccharomyces cerevisiae /
    Levilactobacillus brevis at 1:1:1; recipe B, B. subtilis / S. cerevisiae /
    Lactiplantibacillus plantarum at 1:1:1; and recipe C, B. subtilis /
    S. cerevisiae / L. brevis / L. plantarum at 1:1:1:1.
  perturbation_design: >
    Apply the designed inoculants at a 10% inoculation rate to mulberry leaves,
    distillers' grains, and mixed ML&DG substrates during short-term anaerobic
    solid-state fermentation.
  measurement_endpoints:
  - tannin degradation
  - phytic acid degradation
  - pH
  - lactic acid concentration
  - true protein retention
  - antioxidant activity
  - microbial community structure
  notes: >
    The PubMed abstract names the four species, the A/B/C inoculation ratios,
    the 10% inoculation rate, the ML/DG/ML&DG substrate panel, and five-day
    anaerobic fermentation. It does not expose strain accessions, the exact
    vessel or moisture setup, or a table linking every measured endpoint to
    each A/B/C inoculant and substrate arm.
  evidence:
  - &abc_recipes
    reference: PMID:42566139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      four strains including Bacillus subtilis, Saccharomyces cerevisiae,
      Levilactobacillus brevis and Lactiplantibacillus plantarum were mixed at
      three ratios
    explanation: >
      Identifies the four species and establishes that the study mixed them in
      three designed inoculation recipes.
  - &anaerobic_panel
    reference: PMID:42566139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      10% inoculation rate was adopted for short-term anaerobic fermentation
      lasting 5 days using ML, DG and their mixed substrates (ML&DG)
    explanation: >
      Supports the inoculation rate, five-day anaerobic cultivation window, and
      mulberry-leaf, distillers-grain, and mixed-substrate arms.
  - &waste_to_feed
    reference: PMID:42566139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      This waste-to-feed strategy establishes a sustainable model for circular
      agriculture by transforming low-value residues into functional feed
      resources.
    explanation: >
      Supports the waste-to-feed objective of the designed consortium.
