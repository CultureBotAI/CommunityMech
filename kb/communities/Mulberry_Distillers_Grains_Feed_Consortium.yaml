ecological_interactions:
- name: Anaerobic acidifying solid-state feed fermentation
  description: >
    The designed Bacillus-yeast-LAB inoculants fermented mulberry leaves,
    distillers' grains, and mixed ML&DG substrates anaerobically for five days,
    lowering the pH below 4.77, accumulating lactic acid, and degrading tannin
    and phytic acid. The abstract reports the response at the designed
    inoculant level and does not distinguish whether recipe A, B, or C produced
    every maximum endpoint.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lactic acid
    term:
      id: CHEBI:28358
      label: rac-lactic acid
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - *anaerobic_panel
  - &acidification_degradation
    reference: PMID:42566139
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      exogenous microbial inoculation effectively degraded tannin (50.81%) and
      phytic acid (52.66%), lowered the pH value below 4.77, and increased
      lactic acid content to 83.43 mg/g
    explanation: >
      Supports acidification, lactic acid accumulation, and tannin and phytic
      acid degradation by the exogenous consortium inoculants.
- name: Lactobacillus-associated quality enhancement
  description: >
    Microbial community analysis associated Lactobacillus dominance with the
    improved solid-state fermentation quality. Because the abstract reports the
    genus name Lactobacillus rather than variant-level readouts for the two
    renamed inoculated LAB species, this interaction is retained at
    community-level rather than attributed to L. brevis or L. plantarum alone.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
  evidence:
  - reference: PMID:42566139
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >
      Microbial analysis confirmed Lactobacillus as the dominant genus
      correlating with quality enhancement.
    explanation: >
      Supports a Lactobacillus-associated community shift, but not an exact
      one-to-one mapping to either inoculated LAB species under current
      Lactobacillaceae taxonomy.
