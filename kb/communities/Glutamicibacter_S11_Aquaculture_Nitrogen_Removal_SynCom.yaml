discussions:
- discussion_id: glutamicibacter_s11_methods_details
  prompt: Resolve S11 inoculation ratios, full wastewater or medium chemistry, sponge immobilization protocol, reactor
    geometry, operating temperature, and field-trial deployment details from the full article.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - engineering_design
  - growth_media
  - cultivation_setup
  rationale: The accessible PubMed abstract identifies the two member strains, S11 consortium identity, inorganic
    nitrogen endpoints, pH/C:N assay envelope, and headline sponge and industrial recirculating-aquaculture results,
    but Europe PMC reports the full article as subscription-only and not in PMC. Exact method details should be
    filled only after inspecting the version of record or author-accepted text.
  posed_by: codex
  posed_date: '2026-09-21'
- discussion_id: glutamicibacter_s11_flux_and_reciprocity
  prompt: Which nitrogen routes and partner effects explain S11 removal performance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Synergistic S11 ammonium and nitrite removal
  rationale: The accessible primary abstract identifies both strains as HNAD organisms and reports a positive consortium
    removal contrast, but does not resolve partner-specific viable growth, isotope flux, nitrogen mass balance,
    exchanged intermediates or pathway perturbations. Retain that positive HNAD characterization without assigning
    resolved graph-level ammonia-oxidation or denitrification flux. Full Methods and controls are unavailable for
    this review. Separate batch, sponge and industrial endpoints and do not equate residual concentration percentages
    with removal. Resolve these gaps before adding a reciprocal-benefit, route-specific or cross-feeding edge.
  posed_by: codex
  posed_date: '2026-10-06'
