ecological_interactions:
- name: Synergistic S11 ammonium and nitrite removal
  description: The two-strain S11 consortium removed ammonium and nitrite more efficiently than the corresponding
    single-strain cultures. The primary abstract reports 95% ammonium-N and 97% nitrite-N removal within 24 h at
    initial concentrations of 30 mg/L each, pH 6-9 and C/N at least 15, described as a 15%-25% improvement over
    monocultures. This positive whole-consortium removal phenotype does not by itself establish reciprocal microbial
    fitness, exchanged intermediates or a formal interaction mechanism. The authors characterize the isolates as
    heterotrophic nitrification-aerobic denitrification strains, but the accessible abstract does not partition
    consortium removal among oxidation, denitrification, assimilation and other sinks or provide a nitrogen mass
    balance. Sponge-immobilized recirculation and industrial trials are separate assay contexts, not steps in a
    demonstrated causal chain; reported industrial residual nitrite fractions are not removal percentages.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: Glutamicibacter arilaitensis NFB2-4
    term:
      id: NCBITaxon:256701
      label: Glutamicibacter arilaitensis
  - preferred_term: Glutamicibacter nicotianae CYN-C5
    term:
      id: NCBITaxon:37929
      label: Glutamicibacter nicotianae
  metabolites:
  - preferred_term: ammonium
    term:
      id: CHEBI:28938
      label: ammonium
  - preferred_term: nitrite
    term:
      id: CHEBI:16301
      label: nitrite
  evidence:
  - reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A synthetic consortium S11, composed of these two strains, exhibited marked synergistic nitrogen removal
    explanation: Supports the authors' reported consortium-level nitrogen-removal synergy, not reciprocal fitness
      or a resolved cross-feeding mechanism. The engineering-design evidence is preserved separately.
  - reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This represents a 15 %-25 % improvement over single-strain cultures.
    explanation: Supports the reported 15%-25% improvement relative to single-strain cultures; the abstract does
      not define it here as percentage points or establish mutualism.
environmental_factors:
- name: S11 assay pH and C/N range
  value: pH 6-9 and C/N >= 15
  description: The abstract reports S11 ammonium and nitrite removal under pH 6-9 and C/N at least 15.
  evidence:
  - reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: at pH 6-9 and C/N >= 15, it removed 95 % of NH4+-N and 97 % of NO2--N
    explanation: Supports the pH and carbon-to-nitrogen range for the S11 nitrogen-removal assay.
growth_media:
- name: S11 aquaculture wastewater nitrogen-removal assay
  ph_range: 6-9
  atmosphere: AEROBIC
  preparation_notes: S11 was assayed for NH4+-N and NO2--N removal at a 30 mg/L initial concentration of each inorganic
    nitrogen species and at C/N >= 15; the accessible PubMed abstract does not report the full wastewater or medium
    formulation.
  evidence:
  - reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: it removed 95 % of NH4+-N and 97 % of NO2--N (initial concentration 30 mg L-1 each) within 24 h
    explanation: Supports the assayed ammonium- and nitrite-nitrogen concentrations and 24 h endpoint.
cultivation_setup:
- cultivation_mode: CONTINUOUS
  system_type: BIOREACTOR_UNSPECIFIED
  instrument_detail: hydrophilic sponge-immobilized S11 consortium in a recirculating aquaculture system
  retention_time: 20
  retention_time_unit: min
  retention_time_type: HRT
  notes: The PubMed abstract reports sponge immobilization, a recirculating system, and a later industrial-scale recirculating
    aquaculture trial, but not the vessel geometry or exact reactor model.
  evidence:
  - reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After immobilizing the consortium on hydrophilic sponges, 76 % of NH4+-N and 96 % of NO2--N were removed
      at a hydraulic retention time of only 20 min in a recirculating system.
    explanation: Supports sponge immobilization and recirculating-system operation of the S11 consortium.
