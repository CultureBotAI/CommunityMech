id: CommunityMech:000411
name: Glutamicibacter S11 Aquaculture Nitrogen Removal SynCom
description: A two-strain synthetic Glutamicibacter consortium, S11, composed of Glutamicibacter arilaitensis NFB2-4
  and Glutamicibacter nicotianae CYN-C5. Su et al. isolated both heterotrophic nitrification-aerobic denitrification
  strains from cattle manure and aquaculture sediments, combined them as consortium S11, and reported synergistic
  ammonium- and nitrite-nitrogen removal in aquaculture wastewater assays, a hydrophilic sponge recirculating
  system, and an industrial-scale recirculating aquaculture trial.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Construct a two-strain Glutamicibacter consortium for inorganic nitrogen removal from aquaculture wastewater.
  assembly_strategy: Combine the heterotrophic nitrification-aerobic denitrification strains Glutamicibacter arilaitensis
    NFB2-4 and Glutamicibacter nicotianae CYN-C5 as the synthetic consortium S11.
  measurement_endpoints:
  - NH4+-N removal
  - NO2--N removal
  - nitrogen removal synergy relative to single-strain cultures
  - hydrophilic sponge recirculating-system performance
  - industrial-scale recirculating aquaculture performance
  evidence:
  - &strain_evidence
    reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two high efficiency heterotrophic nitrification-aerobic denitrification strains were isolated from cattle
      manure and aquaculture sediments and identified as G. arilaitensis NFB2-4 and G. nicotianae CYN-C5.
    explanation: Identifies the two source strains that were assembled into S11.
  - &s11_synergy_evidence
    reference: PMID:41260371
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A synthetic consortium S11, composed of these two strains, exhibited marked synergistic nitrogen removal
    explanation: Supports assembly of the two Glutamicibacter strains as synthetic consortium S11 and its synergistic
      nitrogen-removal phenotype.
environment_term:
  preferred_term: aquaculture wastewater nitrogen-removal assay
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The S11 consortium was constructed and tested in controlled aquaculture wastewater nitrogen-removal assays before
    recirculating-system and industrial-scale aquaculture trials.
