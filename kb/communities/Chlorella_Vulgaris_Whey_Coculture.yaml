id: CommunityMech:000422
name: Chlorella vulgaris Whey Co-culture
description: A defined microalgal co-culture pairing the Chlorella vulgaris culture abbreviated CVB with Chlorella
  vulgaris CCAP 211/19 in casein whey-based media for dairy-whey valorization. Kelarijani et al. 2026 reported that
  the Chlorella vulgaris co-culture exhibited synergistic growth relative to single cultures and to a four-species
  algal mix in the casein whey panel.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Test whether the Chlorella vulgaris co-culture improved dairy-whey valorization through microalgal growth
    in whey-supplemented medium.
  assembly_strategy: Pair the two Chlorella vulgaris cultures named in the four-microalga cultivation panel, the
    culture abbreviated CVB and Chlorella vulgaris CCAP 211/19, in casein whey-based media.
  measurement_endpoints:
  - cell proliferation
  - biomass yield
  - nitrate assimilation
  - ammonia assimilation
  - protein removal from whey
  evidence:
  - &whey_panel
    reference: PMID:42249951
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Different combinations of four-species-comprising Scenedesmus sp. (SC), Tetradesmus obliquus (TO), Chlorella vulgaris
      Beijerinck (CVB), and Chlorella vulgaris CCAP 211/19 (CV)-were cultivated in casein whey-based media
    explanation: Identifies both Chlorella vulgaris strains and the casein whey-based cultivation setting.
  - &chlorella_synergy
    reference: PMID:42249951
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the co-culture of Chlorella vulgaris strains exhibited synergistic growth, outperforming single cultures and the mixed
      culture of all four species
    explanation: Supports the two-strain Chlorella co-culture as a synergistic member combination from the tested panel.
environment_term:
  preferred_term: laboratory dairy-whey microalgal co-culture
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: The Chlorella vulgaris culture pair was assembled and assayed as a laboratory co-culture in casein whey-based
    media for dairy-whey valorization.
