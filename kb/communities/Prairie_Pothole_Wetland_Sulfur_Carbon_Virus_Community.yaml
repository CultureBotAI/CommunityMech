discussions:
- discussion_id: prairie-genomic-potential-and-viral-effect-sign
  prompt: Which predicted activities and viral effects control measured ecosystem rates?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  rationale: Retain the genomic findings and both proposed directions. Candidate genomes do not guarantee sulfate-reduction
    direction; alcohol use and viral host links remain inferred. Viral suppression versus release of labile substrates
    could lower or raise cycling rates. Exact activities, lysis and net effects need experiments; no new arrows
    were added.
