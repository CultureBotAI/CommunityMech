id: CommunityMech:000256
name: Prairie Pothole Wetland Sulfur-Carbon Virus-Host Community
description: >
  Natural wetland sediment microbial and viral communities from the Prairie
  Pothole Region of North America, curated around genome-resolved metagenomic
  evidence for high-rate sulfur and carbon cycling. The study recovered
  sulfate-reduction marker genes, candidate sulfate-reducing genomes,
  methanogenesis marker genes, putative methanogen genomes, and abundant novel
  viral populations predicted to target dominant sulfate reducers and
  methanogens. The community is DOE-relevant because DNA sequencing and
  analysis were conducted by the DOE Joint Genome Institute and because the
  system links wetland methane emissions, sulfate reduction, carbon
  mineralization, and virus-host controls.
