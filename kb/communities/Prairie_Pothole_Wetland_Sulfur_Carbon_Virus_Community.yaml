related_ingredients:
- preferred_term: sulfate
  chebi_term:
    id: CHEBI:16189
    label: sulfate
  relevance: Sulfate is the terminal electron acceptor sustaining the
    exceptionally high sulfate-reduction rates that define this Prairie
    Pothole community; any environment-analog cultivation medium would need
    sulfate as a primary anion at high concentration.
  evidence:
  - reference: PMID:30086797
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Sulfate reduction rates up to 22 μmol cm-3 day-1 have been
      measured in these wetland sediments
    explanation: Anchors sulfate as the dominant electron acceptor in PPR
      sediments at measured high turnover rates.
- preferred_term: methanol
  chebi_term:
    id: CHEBI:17790
    label: methanol
  relevance: Methanol is one of the electron donors the recovered sulfate-reducer
    genomes are predicted to utilize, linking C1 methylated compounds to the
    community's terminal sulfur metabolism.
  evidence:
  - reference: PMID:30086797
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: electron donors, such as methanol and other alcohols, methylamines,
      and glycine
    explanation: Anchors methanol as a predicted electron donor for PPR sulfate
      reducers from genome-resolved metabolism.
- preferred_term: ethanol
  chebi_term:
    id: CHEBI:16236
    label: ethanol
  relevance: Ethanol is present at millimolar concentrations in PPR sediment
    pore fluids and the authors hypothesize that alcohol-driven methanogenesis
    via F420-dependent alcohol dehydrogenases is a major fraction of in situ
    methane production.
  evidence:
  - reference: PMID:30086797
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: millimolar concentrations of ethanol and 2-propanol in sediment
      pore fluids
    explanation: Anchors ethanol as a quantitatively abundant porewater
      substrate in PPR sediments.
- preferred_term: propan-2-ol
  chebi_term:
    id: CHEBI:17824
    label: propan-2-ol
  relevance: 2-Propanol is similarly present at millimolar concentrations in
    porewater and is implicated alongside ethanol as a substrate driving
    Methanofollis-affiliated methanogenesis in this community.
  evidence:
  - reference: PMID:30086797
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: millimolar concentrations of ethanol and 2-propanol in sediment
      pore fluids
    explanation: Anchors 2-propanol as a quantitatively abundant porewater
      substrate alongside ethanol.
