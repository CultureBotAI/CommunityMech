ecological_interactions:
- name: Drought-Associated Genomic Transport Capacity
  description: Field sorghum rhizosphere metagenomes associate drought enrichment with carbohydrate, secondary-metabolite
    and iron transport/metabolism gene capacity. Ten of fifteen recovered Actinobacterial MAGs were drought-enriched;
    five were not. This is genomic potential, not microbial expression, iron flux or a demonstrated fitness effect
    of the genes. The canonical phylum participant is a partial grouping, not a universal responder or complete
    microbiome roster.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: drought-enriched rhizosphere Actinobacteria
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  metabolites:
  - preferred_term: iron
    term:
      id: CHEBI:24875
      label: iron cation
  biological_processes:
  - preferred_term: iron ion transport
    term:
      id: GO:0006826
      label: iron ion transport
  - preferred_term: carbohydrate transport
    term:
      id: GO:0008643
      label: carbohydrate transport
  evidence:
  - reference: PMID:34050180
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: bacterial iron transport and metabolism functionality is highly correlated with drought enrichment
    explanation: Supports iron metabolism as a drought-enrichment correlate. The comparative metagenomic result
      concerns gene capacity, not direct activity or selective microbial gene perturbation.
  - reference: PMID:34050180
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: carbohydrate and secondary metabolite transport functionalities are overrepresented within drought-enriched
      taxa
    explanation: Supports carbohydrate and secondary-metabolite transport overrepresentation. The comparative metagenomic
      result concerns gene capacity, not direct activity or selective microbial gene perturbation.
- name: Maize TOM1 Loss and Relative Actinobacteria Enrichment
  description: In a separate maize growth-chamber experiment using field-site soil, loss of TOM1, an exporter of
    the phytosiderophore mugineic acid, increased relative rhizosphere Actinobacteria under watered controls. The
    genotype difference was not significant under drought. This host perturbation supports iron-homeostasis involvement
    but does not establish absolute phylum growth, a sorghum knockout effect or causal selection of the field MAG
    gene repertoire.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: drought-enriched rhizosphere Actinobacteria
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  metabolites:
  - preferred_term: phytosiderophore
    term:
      id: CHEBI:38155
      label: phytosiderophore
  - preferred_term: iron
    term:
      id: CHEBI:24875
      label: iron cation
  evidence:
  - reference: PMID:34050180
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: loss of a plant phytosiderophore iron transporter impacts microbial community composition
    explanation: The abstract summarizes a host-transporter effect; primary Results locate it in maize, principally
      under watered control conditions, not a drought-specific sorghum gene perturbation.
- name: Iron Amendment Suppresses the Sc1 Drought Response
  description: Separate gnotobiotic sorghum assays inoculated either Streptomyces coelicolor Sc1 or Pseudomonas
    syringae Ps1, not their coculture or the field microbiome. Fe3+-EDTA amendment removed the significant drought-versus-control
    abundance contrast and Sc1-associated fresh-root-biomass benefit. This supports an iron-sensitive Sc1 response,
    not suppression of every actinobacterium or causal alteration of the field genomic repertoire. The retained
    phylum participant is only a broader taxonomic grouping for Sc1.
  scope: COMMUNITY_LEVEL
  participating_taxa:
  - preferred_term: drought-enriched rhizosphere Actinobacteria
    term:
      id: NCBITaxon:201174
      label: Actinomycetota
  metabolites:
  - preferred_term: iron
    term:
      id: CHEBI:24875
      label: iron cation
  evidence:
  - reference: PMID:34050180
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: exogenous application of iron disrupts the drought-induced enrichment of Actinobacteria, as well as
      their improvement in host phenotype during drought stress
    explanation: 'This pooled abstract statement is broader than the intervention: primary Results use separate
      single-isolate sorghum assays and report Sc1-associated root biomass, not a community-wide benefit or direct
      test of field genomic functions.'
