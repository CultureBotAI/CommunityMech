id: CommunityMech:000345
name: Pichia-Lactiplantibacillus CCMA Plant Beverage Coculture
description: >-
  A defined bacterial-yeast co-culture pairing Lactiplantibacillus plantarum
  CCMA 0743 with Pichia kluyveri CCMA 0615 to ferment a non-dairy beverage made
  from oats, almonds, and sunflower seeds. After 24 h of fermentation both
  partners remained highly viable, with 9.32 log CFU/mL L. plantarum and 7.05
  log CFU/mL P. kluyveri. The co-culture acidified the plant-based substrate,
  utilized carbohydrates, generated bioactive metabolites, increased linoleic
  acid, short-chain fatty acids, phenolic acids, vitamins B2 and B12, and GABA,
  and its fermented beverage promoted gut-microbiota recovery in a BALB/c mouse
  vancomycin-induced dysbiosis model.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: >-
    Ferment an oat-almond-sunflower plant-based beverage with a potential
    probiotic bacterial-yeast co-culture and test whether fermentation improves
    bioactive composition, nutrient bioaccessibility, and recovery from
    antibiotic-induced gut dysbiosis.
  assembly_strategy: >-
    Co-culture Lactiplantibacillus plantarum CCMA 0743 with Pichia kluyveri
    CCMA 0615 in a beverage composed of oats, almonds, and sunflower seeds.
  perturbation_design: >-
    Ferment the plant-based beverage for 24 h with the CCMA 0743/CCMA 0615
    co-culture, subject the fermented beverage to simulated gastrointestinal
    digestion, and administer the fermented beverage in a BALB/c
    vancomycin-induced gut dysbiosis model.
  measurement_endpoints:
  - L. plantarum and P. kluyveri viability after 24 h of fermentation
  - carbohydrate utilization and beverage acidification
  - short-chain fatty acid and bioactive metabolite production
  - simulated bioaccessibility of essential amino acids and B-complex vitamins
  - gut microbiota recovery after vancomycin-induced dysbiosis in BALB/c mice
  notes: >-
    The PubMed abstract supports the exact two-strain membership, plant-based
    substrate ingredients, 24 h fermentation period, viable counts after
    fermentation, metabolite categories increased by fermentation, simulated
    gastrointestinal digestion, and the BALB/c dysbiosis assay. It does not
    report the inoculation ratio, beverage ingredient proportions, or
    fermentation temperature.
  evidence:
  - reference: PMID:42637394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the potential probiotic co-culture Lactiplantibacillus plantarum CCMA
      0743 and Pichia kluyveri CCMA 0615
    explanation: Supports the exact two-strain co-culture used for fermentation.
  - reference: PMID:42637394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After 24 h of fermentation, the fermented beverage exhibited high
      microbial viability, with L. plantarum and P. kluyveri reaching 9.32 and
      7.05 log CFU/mL, respectively.
    explanation: >-
      Supports the 24 h fermentation endpoint and survival of both co-culture
      members at high viable counts.
  - reference: PMID:42637394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The process facilitated carbohydrate utilization, acidification, and the
      generation of bioactive metabolites.
    explanation: >-
      Supports fermentation-associated substrate use, acidification, and
      metabolite production by the defined co-culture.
  - reference: PMID:42637394
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: >-
      Administration of the fermented beverage promoted microbial recovery
    explanation: >-
      Supports testing the fermented co-culture beverage in a host dysbiosis
      recovery assay.
