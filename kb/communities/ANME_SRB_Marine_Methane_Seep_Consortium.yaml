ecological_interactions:
- name: Sulfate-Coupled Anaerobic Methane Oxidation
  description: ANME-SRB aggregates oxidize methane under anoxic conditions while sulfate is reduced by the
    bacterial partner. This syntrophy couples carbon and sulfur cycling in marine sediments and acts as
    an important methane sink at the seafloor.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: anaerobic methanotrophic archaea
    term:
      id: NCBITaxon:2157
      label: Archaea
  target_taxon:
    preferred_term: sulfate-reducing bacterial partners
    term:
      id: NCBITaxon:213118
      label: Desulfobacterales
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  evidence:
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Sulfate-coupled anaerobic oxidation of methane (AOM) is performed by multicellular consortia
    explanation: Directly supports sulfate-coupled AOM by multicellular ANME-SRB consortia.
  - reference: PMID:19383036
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Methane release from the oceans is controlled in large part by syntrophic interactions
    explanation: Supports the ecological significance of the syntrophic methane-oxidizing aggregates.
- name: Direct Interspecies Electron Transfer
  description: Comparative genomics indicates that conserved protein complexes move electrons from ANME
    cells to the SRB outer membrane, providing a mechanistic basis for partner coupling in sulfate-reducing
    methane-oxidizing consortia.
  interaction_type: SYNTROPHY
  source_taxon:
    preferred_term: anaerobic methanotrophic archaea
    term:
      id: NCBITaxon:2157
      label: Archaea
  target_taxon:
    preferred_term: sulfate-reducing bacterial partners
    term:
      id: NCBITaxon:213118
      label: Desulfobacterales
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: interspecies interaction between organisms
  downstream:
  - target: SRB sulfate reduction
    description: Electrons derived from methane oxidation are transferred to the sulfate-reducing partner.
  evidence:
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: direct interspecies electron transfer (DIET) from ANME to the SRB outer membrane
    explanation: Supports DIET as a candidate mechanism linking ANME and SRB metabolism.
