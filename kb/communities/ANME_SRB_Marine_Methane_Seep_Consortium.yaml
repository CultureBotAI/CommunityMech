id: CommunityMech:000134
name: ANME-SRB Marine Methane Seep Consortium
description: Natural marine methane-seep consortia in which anaerobic methanotrophic archaea (ANME) grow
  in syntrophic partnership with sulfate-reducing bacteria (SRB). These structured aggregates couple
  anaerobic oxidation of methane to sulfate reduction, limiting methane release from ocean sediments.
  The interaction is frequently organized as multicellular consortia containing ANME archaeal cells and
  bacterial sulfate reducers, with genomic evidence supporting direct interspecies electron transfer from
  ANME to the SRB partner.
