growth_media:
- name: Anaerobic artificial seawater sediment/rock microcosm (methane seep AOM incubation)
  composition:
  - name: methane
  - name: sulfate
  - name: pyruvate
  atmosphere: ANAEROBIC
  headspace_gas: Methane (CH4) supplied as the electron-donor substrate; some rock microcosms
    incubated without added electron donor or with pyruvate
  temperature: variable by sample (4, 24, or 50 degrees C)
  temperature_unit: °C
  temperature_range: '4-50'
  salinity: artificial seawater (NaCl-based marine salinity; exact concentration not stated)
  inoculum_source: Push-core seafloor sediment, carbonate rock, and microbial-mat samples from
    marine methane seeps (Costa Rica margin, southern Pescadero Basin, Santa Monica Basin)
  vessel_type: sediment/rock microcosm incubation
  preparation_notes: Samples were stored under an N2 atmosphere at 4°C prior to microcosm
    incubation. ANME-SRB consortia were incubated in (anaerobic) artificial seawater; sediment
    horizons received CH4 plus 250 μM L-Homopropargylglycine (HPG) at 4°C, and metabolic
    activity was confirmed by sulfide accumulation and BONCAT/HPG incorporation. Rock and
    push-core variants were incubated with CH4 (50°C), with pyruvate (24°C), or without added
    electron donor (24°C). Single active ANME:SRB aggregates were subsequently FACS-sorted for
    metagenomics.
  evidence:
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: was incubated in anaerobic artificial sea water without electron donor at 24°C
    explanation: Supports anaerobic artificial-seawater medium and 24°C incubation of the seep
      ANME-SRB material.
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: artificial sea water supplemented with pyruvate at 24°C
    explanation: Supports a pyruvate-amended artificial-seawater incubation variant at 24°C.
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 250 μM L-Homopropargylglycine (HPG) at 4°C
    explanation: Supports the CH4/HPG sediment microcosm incubation at 4°C for detecting active
      ANME-SRB consortia.
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: atmosphere at 4°C for sediment microcosm incubations
    explanation: Supports N2 storage atmosphere at 4°C prior to sediment microcosm incubation.
  - reference: PMID:37747940
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Push-core samples of seafloor sediment were collected from different locations on the Costa Rica margin
    explanation: Supports the seafloor methane-seep sediment origin of the incubated inoculum.

