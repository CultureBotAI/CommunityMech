id: CommunityMech:000357
name: E. coli GL10-XL12 D-Lactate Mixed-Sugar SynCom
description: A defined same-species Escherichia coli synthetic consortium in which two BL21 (DE3)-derived knockout strains
  partition glucose and xylose fermentation for optically pure D-lactate production. GL10 was engineered as the glucose-specialized
  strain, XL12 was engineered with glk and ptsI deletions to redirect it away from glucose toward xylose, and a 1:1 GL10:XL12
  coculture in M9 medium containing 5 g/L glucose plus 5 g/L xylose produced 3.76 g/L D-lactate after 36 h. Agitation and
  inoculation-ratio perturbations identified a higher 4.53 g/L D-lactate titer at a 1:5 GL10:XL12 ratio, and the same consortium
  was also tested on detoxified corn straw hydrolysate supplemented into M9 medium.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Alleviate carbon catabolite repression during mixed glucose/xylose fermentation and improve D-lactate production
    by separating glucose and xylose utilization into complementary engineered E. coli strains.
  assembly_strategy: Construct BL21 (DE3)-derived knockout strains GL10 and XL12 by CRISPR/Cas9, knock out D-lactate and byproduct-consuming
    pathways in both strains, disable glucose phosphorylation and phosphotransferase-system glucose uptake in XL12, and combine
    GL10 with XL12 for mixed-sugar co-fermentation.
  perturbation_design: Assay the synthetic consortium in M9 medium with 5 g/L glucose and 5 g/L xylose, then perturb shaking
    speed at 50, 150, and 250 rpm and GL10:XL12 inoculation ratio at 1:1, 1:5, and 1:15 before testing detoxified corn straw
    hydrolysate.
  measurement_endpoints:
  - glucose depletion and xylose utilization
  - bacterial growth by OD600
  - D-lactate titer at 36 h
  - D-lactate conversion yield and productivity
  - D-lactate optical purity
  notes: E. coli DH5alpha was used only as the plasmid-construction host, while E. coli BL21 (DE3) was the parental strain
    for knockout mutants. The paper reports carbon-source specialization of GL10 and XL12 but does not identify a direct metabolite
    transferred between the two engineered strains, so no pairwise cross-feeding edge is asserted.
  evidence:
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two division-of-labor engineered E. coli strains, XL12 and GL10, were constructed and characterized in terms
      of sugar utilization and D-lactate synthesis capabilities.
    explanation: Supports the two engineered strains and the design focus on sugar utilization plus D-lactate synthesis.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A co-culture strategy was implemented to improve metabolic orthogonality toward specific carbon sources within
      mixed sugars.
    explanation: Supports the mixed-sugar metabolic division-of-labor strategy.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The effects of shaking speed and inoculum ratio on D-lactate production from mixed sugar by the microbial consortium
      were investigated.
    explanation: Supports the agitation and inoculation-ratio perturbations curated for the consortium.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: E coli DH5α was used as a host for plasmid construction. E coli BL21 (DE3) was used as a parental strain for
      generating knockout mutants.
    explanation: Distinguishes the BL21-derived curated strains from the DH5alpha cloning host.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To redirect carbon flux, the ptsI gene (disabling the phosphotransferase system for glucose uptake) and glk gene
      (eliminating glucose phosphorylation) were deleted.
    explanation: Supports the glucose-uptake knockouts that bias XL12 toward the xylose-utilization role.
  - reference: PMID:42038008
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the bacterial consortium achieved 0.376 g/g sugar of D-lactate with 100% optical purity
    explanation: Supports optical purity as a measured consortium fermentation endpoint.
