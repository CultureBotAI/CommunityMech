id: CommunityMech:000396
name: Clostridial isoDCA Mini Consortium
description: A two-member engineered Clostridia consortium pairing Peptacetobacter hiranonis with Ruminococcus gnavus VPI
  C7-9 WT so the community converts host-derived taurocholic acid through cholic acid and deoxycholic acid to isodeoxycholic
  acid. Ionescu et al. also built a matched P. hiranonis plus R. gnavus KO consortium with rumgna_00694 disrupted as an isoDCA-negative
  control, enabling in vitro bile-acid conversion assays and antibiotic-treated mouse engraftment experiments that isolate
  the host effects of isoDCA.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Test how isodeoxycholic acid produced by native gut Clostridia from host-derived taurocholic acid modulates intestinal
    immune homeostasis.
  assembly_strategy: Pair Peptacetobacter hiranonis with either wild-type R. gnavus VPI C7-9 to form the isoDCA-positive consortium
    or the engineered R. gnavus rumgna_00694 knockout to form an isoDCA-negative isogenic control.
  inoculation_strategy: Grow each anaerobic member to OD600 0.800, mix equal 10 mL volumes of P. hiranonis and R. gnavus WT
    cultures, pellet the mixed culture, and resuspend it as a glycerol stock used for the defined isoDCA-positive inoculum.
  perturbation_design: Compare P. hiranonis plus R. gnavus WT with the matched P. hiranonis plus R. gnavus KO consortium to
    toggle isoDCA production on or off while holding the two-member community framework constant.
  measurement_endpoints:
  - thin-layer chromatography of bile acids in culture supernatants
  - fecal qPCR for Peptacetobacter hiranonis and Ruminococcus gnavus engraftment
  - fecal bile-acid metabolomics
  - ileal and colonic lamina propria RORgamma-t+Foxp3+ regulatory T cells
  - adoptive T cell transfer colitis outcomes
  evidence:
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Combining R. gnavus (WT or KO) with Peptacetobacter hiranonis created a two-member consortium
    explanation: Supports the two-member WT and KO consortium design.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a consortium of P. hiranonis and R. gnavus WT (isoDCA+ consortium) can produce isoDCA
    explanation: Supports the isoDCA-positive WT consortium as the target record.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 10 mL of P. hiranonis culture (OD600 = 0.800) was mixed with 10 mL of R. gnavus WT or KO culture
    explanation: Supports the equal-volume OD600-normalized construction of the frozen two-member inoculum.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Fecal isoDCA concentration
    explanation: Supports fecal isoDCA metabolomics as an in vivo endpoint.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Resulting pellet was aspirated and resuspended in 1mL sterile BHI-S medium supplemented with 15% (v/v) sterile
      glycerol
    explanation: Supports pelleting the equal-volume member mix and resuspending it as the frozen glycerol inoculum.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Abundance of both P. hiranonis and R. gnavus were checked before, during, and after the colonization period by
      qPCR with species-specific primers
    explanation: Supports species-specific fecal qPCR as an engraftment endpoint.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: isoDCA can induce both ileal and colonic lamina propria (LP) RORγt + Foxp3 + pTregs
    explanation: Supports ileal and colonic lamina propria RORγt+Foxp3+ regulatory T cells as measured immune endpoints.
  - reference: doi:10.64898/2026.08.11.743107
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: isoDCA-producing (isoDCA+) consortium protects from colitis in the CD45RB hi adoptive T cell transfer model
    explanation: Supports the adoptive T cell transfer colitis endpoint.
