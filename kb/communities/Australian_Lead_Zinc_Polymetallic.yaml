id: CommunityMech:000004
name: Australian Lead Zinc Polymetallic Tailings Consortium
description: >-
  A sulfidic mine-tailings community model centered on a weathered volcanogenic
  massive sulfide dump in arid Western Australia and related Pb-Zn tailings
  acidification studies. Oxidative weathering of S- and Fe-rich waste rock
  disperses mobile ions including zinc, sulfur, chloride, and aluminium, while
  Pb-Zn tailing impoundments at progressive acidification stages contain
  Acidithiobacillus, Leptospirillum, and Ferroplasma acidophiles associated
  with iron oxidation, sulfur oxidation, carbon fixation, nitrogen fixation, and
  acid mine drainage generation. The curated causal graph therefore represents
  acidophile-driven Fe/S oxidation, Pb-Zn tailings acidification, and pH-ordered
  community succession as community-level processes rather than unsupported
  species-by-species exchanges.
ecological_state: PERTURBED
community_origin: NATURAL
community_category: BIOREMEDIATION
environment_term:
  preferred_term: mine tailing
  term:
    id: ENVO:00000003
    label: mine tailing
  notes: >-
    Sulfidic mine tailings undergoing acidification and metal mobilization. The
    Australian primary site was a weathered, S- and Fe-rich volcanogenic
    massive sulfide tailings hillslope in an arid climate, while supporting
    Pb-Zn and copper tailings studies establish Acidithiobacillus,
    Leptospirillum, and Ferroplasma as recurring acidophile lineages in
    acidifying mine-tailings systems.
