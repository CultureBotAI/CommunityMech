  evidence:
  - reference: PMID:23574280
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: '16S rRNA pyrosequencing revealed a contrasting microbial composition between the six tailings:
      Proteobacteria-related sequences dominated T1-T3 with relative abundance ranging from 56 to 93%,
      whereas Ferroplasma-related sequences dominated T4-T6 with relative abundance ranging from 28 to
      58%'
    explanation: Shows a Ferroplasma-rich community shift across Pb-Zn tailings
      acidification stages.
  - reference: doi:10.1128/aem.00294-14
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Together, these results suggest that pH is primarily responsible for structuring whole communities
      in the extreme and heterogeneous mine tailings, although the diverse microbial taxa may respond
      differently to various environmental conditions.
    explanation: Supports pH-driven structuring of acid mine-tailings communities.
environmental_factors:
- name: Acidic pH Filtering
  value: 2.7 to 5.7
  unit: pH units in semiarid Pb-Zn tailings samples
  description: >-
    Semiarid Pb-Zn tailings had extremely and moderately acidic samples, and
    copper-tailing data showed pH as a primary correlate of whole-community
    structure. pH is curated as a qualitative acidophile-selection pressure
    rather than a precise vertical profile in this record.
  evidence:
  - reference: doi:10.1128/aem.02883-07
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Phylotype richness in these communities decreased from 42 in the OS control to 24 in the
      moderately acidic samples and 8 in the extremely acidic tailing samples
    explanation: Establishes a pH gradient across semiarid Pb-Zn tailing samples.
  - reference: doi:10.1128/aem.00294-14
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: pH is primarily responsible for structuring whole communities in the extreme and heterogeneous
      mine tailings
    explanation: Supports pH as a first-order driver of whole mine-tailing
      community structure.
- name: Pb-Zn Oxidation Stages
  value: primary to oxidized tailings
  unit: qualitative acidification stage
  description: >-
    Pb-Zn mine-tailings studies followed communities across abandoned or
    sequentially acidifying tailings and found distinct microbial populations
    associated with different oxidation and acidification states.
  evidence:
  - reference: doi:10.1128/aem.02458-10
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Analysis of spatial and temporal variations in the microbial community in the abandoned tailings
      impoundment of a Pb-Zn mine revealed distinct microbial populations associated with the different
      oxidation stages of the tailings
    explanation: Documents oxidation-stage structure in an abandoned Pb-Zn
      tailing impoundment.
  - reference: PMID:23574280
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Geochemical results showed that the six tailings (from T1 to T6) likely represented sequential
      stages of the acidification process of the mine tailings
    explanation: Establishes a staged Pb-Zn tailings acidification series.
- name: Ferroplasma-Rich Late Acidification Stages
  value: 28-58%
  unit: Ferroplasma-related 16S rRNA sequences in T4-T6
  description: >-
    Ferroplasma-related archaeal sequences dominated the later, extremely acidic
    Pb-Zn tailing stages, while Proteobacteria-related sequences dominated the
    earlier primary and slightly acidic stages.
  evidence:
  - reference: PMID:23574280
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: '16S rRNA pyrosequencing revealed a contrasting microbial composition between the six tailings:
      Proteobacteria-related sequences dominated T1-T3 with relative abundance ranging from 56 to 93%,
      whereas Ferroplasma-related sequences dominated T4-T6 with relative abundance ranging from 28 to
      58%'
    explanation: Quantifies the Ferroplasma-rich shift in late Pb-Zn
      acidification stages.
- name: S- and Fe-Rich Weathering Substrate
  value: elevated sulfur and iron
  unit: qualitative waste-rock composition
  description: >-
    The Australian tailings hillslope was contaminated by weathering waste rock
    rich in sulfur and iron, which dispersed elements down the tailings face and
    provides a qualitative basis for curating Fe/S oxidation and mobile-metal
    processes.
  evidence:
  - reference: PMID:22092956
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Weathering of waste rock, high in S and Fe, had resulted in a varying elemental dispersal
      down a face of the tailings hill
    explanation: Establishes S- and Fe-rich weathering at the Australian
      tailings site.
- name: Surface and Deeper Tailings Redox Potential
  value: surface oxidation and deeper reduction
  unit: qualitative depth trend
  description: >-
    Genome-resolved metagenomics of a highly stratified AMD-overlying tailings
    environment found sulfur and iron oxidation genes enriched near the surface
    and reductive nitrogen, sulfur, and iron processes enriched deeper in the
    profile. The evidence supports depth-related redox functional zoning, not a
    named Geobacter partner or a quantified oxygen profile.
  evidence:
  - reference: doi:10.1016/j.jhazmat.2023.130774
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Specifically, key genes involved in sulfur and iron oxidation were significantly enriched
      in the surface tailings, whereas those associated with reductive nitrogen, sulfur, and iron processes
      were enriched in the deeper layers
    explanation: Supports qualitative surface/depth functional stratification
      in AMD-overlying tailings.
- name: Arid Climate with Wetting-Drying Cycles
  value: arid to semiarid
  unit: climate classification
  description: >-
    The primary Western Australian study sampled an arid tailings hillslope, and
    an independent Pb-Zn mine-tailing survey compared communities in a semiarid
    tailings environment. This factor is retained as a setting constraint for
    mineral weathering and community selection, with no unsupported thermal
    niche assignment to Sulfobacillus.
  evidence:
  - reference: PMID:22092956
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: We investigated bacterial community assemblages and functions down a hill slope contaminated
      by tailings from a volcanogenic massive sulphide mine in arid Western Australia
    explanation: Documents arid climate setting
  - reference: doi:10.1128/aem.02883-07
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: This study employed phylogenetic analyses of 16S rRNA genes to compare the bacterial communities
      present in highly disturbed, extremely (pH 2.7) and moderately (pH 5.7) acidic lead-zinc mine tailing
      samples from a semiarid environment with those from a vegetated off-site (OS) control sample (pH
      8)
    explanation: Establishes semi-arid environmental conditions
- name: Genome-Resolved AMD Tailings Metabolism
  value: 406
  unit: intermediate- or high-quality metagenome-assembled genomes
  description: >-
    A genome-resolved AMD-tailings study recovered hundreds of MAGs and inferred
    nitrogen, sulfur, iron, and carbon cycling models from abundant microbial
    genomes. The factor captures metagenomic support for community-level
    metabolic potentials without relying on a later-retracted alkaline-tailings
    report.
  evidence:
  - reference: doi:10.1016/j.jhazmat.2023.130774
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Metabolic models involving nitrogen, sulfur, iron, and carbon cycles were proposed based
      on the functional potentials of the abundant microbial genomes, emphasizing syntrophy and the importance
      of lesser-known taxa in the degradation of complex carbon compounds
    explanation: Documents MAG-resolved diversity in stratified tailings
- name: Abandoned Pb-Zn Tailings
  value: abandoned
  unit: site status
  description: >-
    Abandoned Pb-Zn mine-tailings sites provide acidifying tailings matrices in
    which oxidation-stage and pH-linked microbial community structure can be
    observed outside active bioleaching operations.
  evidence:
  - reference: doi:10.1128/aem.02883-07
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: This study employed phylogenetic analyses of 16S rRNA genes to compare the bacterial communities
      present in highly disturbed, extremely (pH 2.7) and moderately (pH 5.7) acidic lead-zinc mine tailing
      samples from a semiarid environment with those from a vegetated off-site (OS) control sample (pH
      8)
    explanation: Establishes abandoned status of tailings system
