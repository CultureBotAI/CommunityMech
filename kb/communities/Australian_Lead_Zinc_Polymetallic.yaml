- name: pH-Structured Acidophile Succession
  description: >-
    Pb-Zn and copper tailing surveys show community shifts along acidification
    and pH gradients: Proteobacteria-rich early Pb-Zn stages give way to
    Ferroplasma-dominated later stages, A. ferrooxidans and Leptospirillum spp.
    persist in acidic Pb-Zn samples, and whole copper-tailing communities are
    primarily structured by pH. This node captures geochemical filtering of
    acidophile guilds rather than a commensal Ferroplasma-to-Acidithiobacillus
    edge.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
