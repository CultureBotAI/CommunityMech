    Ferroplasma acidophiles associated with sulfur oxidation, heavy-metal
    detoxification, carbon fixation, nitrogen fixation, and low-pH tolerance.
    These data support a community-level Fe/S oxidation module that regenerates
    ferric iron and acidity without requiring a direct mutualism between named
    strains.
