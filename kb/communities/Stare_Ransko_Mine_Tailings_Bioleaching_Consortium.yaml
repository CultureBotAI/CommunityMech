  evidence:
  - reference: doi:10.3390/min14030255
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This research focused on applying and comparing the performance of microorganisms with different temperature
      preferences, assessing the overall percentage recovery of elements (copper, zinc, arsenic, and iron) from mine tailings
      in the Staré Ransko region (Czech Republic).
    explanation: Establishes polymetallic Cu, Zn, As, and Fe bioleaching from Stare Ransko mine tailings.
  - reference: doi:10.3390/min14030255
    supports: SUPPORT
