    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The study observed that the most significant increase in solubilisation can be attributed to the additive cation
      in the case of copper (AF, AT, LF/Ag+ by 40.33%; ST/Ag+ by 44.39%) and arsenic (AF, AT, LF/Ag+ by 23.79%; ST/Ag+ by
      26.08%).
    explanation: Quantifies the 40.33% Cu and 23.79% As solubilization enhancement achieved by the AF, AT, LF consortium with
      Ag+ catalyst.
  - reference: doi:10.3390/min14030255
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After 24 days of extraction, the emergence of secondary minerals, namely CaSO4·2H2O and KFe3(SO4)2(OH)6, was
      identified.
    explanation: Documents secondary gypsum and jarosite formation after 24 days of bioleaching.
