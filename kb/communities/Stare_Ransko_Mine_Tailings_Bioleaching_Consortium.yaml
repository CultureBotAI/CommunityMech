      Sulfobacillus thermosulfidooxidans (ST).
    explanation: Documents the three-species mesophilic consortium (AF, AT, LF) driving the solubilization process.
- name: Silver-Catalyzed Copper and Arsenic Bioleaching and Secondary Sulfate Precipitation
  description: In the presence of 5 mg L-1 Ag+ ions (from AgNO3), the mesophilic AF-AT-LF consortium increases copper solubilization
    by 40.33% and arsenic solubilization by 23.79%, accompanied by precipitation of secondary gypsum (CaSO4.2H2O) and potassium
    jarosite (KFe3(SO4)2(OH)6) after 24 days.
