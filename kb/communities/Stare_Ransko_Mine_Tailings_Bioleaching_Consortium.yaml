id: CommunityMech:000486
name: Stare Ransko Mine Tailings Mesophilic Bioleaching Consortium
description: A defined three-species mesophilic acidophilic bacterial consortium comprising Acidithiobacillus ferrooxidans
  (AF), Acidithiobacillus thiooxidans (AT), and Leptospirillum ferrooxidans (LF) applied to solubilize copper, zinc, arsenic,
  and iron from mine tailings in the Stare Ransko region (Czech Republic) at pH 1.8, 150 rpm agitation, 71-100 um particle
  size, and 10% (w/v) pulp density, where 5 mg L-1 Ag+ catalyst addition increases copper solubilization by 40.33% and arsenic
  by 23.79% over 24 days (doi:10.3390/min14030255).
