id: CommunityMech:000289
name: Pseudomonas putida Pp-TE + Rhodococcus sp. RDK17 Terephthalic-acid Consortium
description: Two-strain synthetic consortium of an engineered degrader (Pseudomonas putida strain
  Pp-TE) and a native degrader (Rhodococcus sp. strain RDK17) grown with terephthalic acid (TPA),
  a primary polyethylene terephthalate (PET) monomer, as the sole carbon and energy source. Although
  both strains utilize TPA at comparable rates in monoculture, Pp-TE consistently outcompetes RDK17
  in batch and multitransfer coculture fermentations. Dominance is driven jointly by exploitative
  competition for TPA and by interference competition through the Pp-TE type VI secretion system,
  which impairs RDK17 growth via contact-dependent inhibition. Loss of TPA metabolism in Pp-TE
  abolishes its dominance, illustrating how interspecies interaction and metabolic capability
  co-determine consortium structure and overall TPA degradation.
