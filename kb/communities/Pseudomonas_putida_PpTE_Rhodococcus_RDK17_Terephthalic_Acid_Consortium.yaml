- name: Interference competition via type VI secretion system
  description: Pp-TE inhibits RDK17 through contact-dependent inhibition mediated by its type VI
    secretion system, which impairs RDK17 growth and reinforces Pp-TE dominance in coculture.
  interaction_type: COMPETITION
