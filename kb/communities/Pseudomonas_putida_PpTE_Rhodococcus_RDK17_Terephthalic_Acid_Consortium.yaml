ecological_interactions:
- name: Exploitative competition for terephthalic acid
  description: Both strains utilize TPA at comparable rates in monoculture, but they compete for TPA
    as the shared sole carbon and energy source in coculture; Pp-TE consistently outcompetes RDK17,
    partly through relative growth kinetics.
  interaction_type: COMPETITION
