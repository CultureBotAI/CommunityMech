    evidence_source: IN_VITRO
    snippet: the dominance of Pp-TE was primarily conferred by its type VI secretion system, which
      impaired the growth of RDK17 via contact-dependent inhibition
    explanation: Contact-dependent inhibition through the Pp-TE T6SS is interference competition
      against RDK17.
