id: CommunityMech:000056
name: Pseudo-nitzschia-Sulfitobacter Marine Association
description: 'A mutualistic marine diatom-bacteria association between Pseudo-nitzschia multiseries and
  Sulfitobacter sp. SA11, mediated by auxin and tryptophan signaling. The bacterium synthesizes the
  auxin indole-3-acetic acid (IAA) from diatom-secreted and endogenous tryptophan, promoting diatom
  cell division as part of a complex nutrient exchange that also includes diatom organosulfur compounds
  and bacterial ammonia.

  '
