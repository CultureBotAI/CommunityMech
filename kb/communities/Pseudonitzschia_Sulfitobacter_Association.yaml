  preparation_notes: 'f/2 medium (Guillard) is used for marine diatom Pseudo-nitzschia multiseries cultivation.
    The medium is prepared with natural seawater enriched with f/2 nutrients, metals, and vitamins. Silicate
    is essential for diatom frustule formation. P. multiseries can grow over a salinity range of 15-40
    psu and temperature range of 4-20°C, but optimal conditions are around 19°C and 30 ppt salinity. The
    diatom-bacteria association is maintained in co-culture with Sulfitobacter sp. SA11, which produces
    IAA auxin to promote diatom growth.

    '
