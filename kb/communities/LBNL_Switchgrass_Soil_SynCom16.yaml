ecological_interactions:
- name: Low-Nutrient Alpha-Diversity Enrichment
  description: In the initial equally mixed 18-strain community, dilution from 1X to 0.2X or 0.1X R2A lowered total
    OD600 while increasing Shannon diversity and evenness after three days. Pseudomonas remained relatively dominant.
    This assay preceded the final 16-member model and does not demonstrate increased absolute viable abundance,
    partner-specific facilitation or the same response in every community variant.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the Shannon diversity index and Pielou’s evenness, two α-diversity metrics, were lowest in the 1× medium
      and increased as the medium dilution increased
    explanation: Supports the measured nutrient-dilution diversity response in the initial 18-strain assay, not
      a result specific to the final 16-member model.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an equally mixed community of all 18 strains
    explanation: Identifies the 18-strain starting membership of the nutrient-dilution experiment.
  participating_taxa:
  - preferred_term: soil bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: Starting-Ratio Dependent Community Diversity
  description: Adjusting inoculum ratios to favor organisms that became relatively rare in equal mixtures increased
    Shannon diversity and evenness at two and six days in the tested panels, particularly 2X/3X cutoff communities
    without Pseudomonas. These are defined starting-composition effects, not a universal optimum or proof of a unique
    competition mechanism. The 17/18-strain starting-ratio panels and later 16-member dropout experiments are distinct;
    relative sequencing is not a direct viable-cell count.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: growth
    term:
      id: GO:0040007
      label: growth
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Starting ratios containing orders of magnitude more of slower-growing organisms (2× cutoff and 3× cutoff)
      resulted in higher Shannon diversity and evenness values than did the 4 equally mixed conditions
    explanation: Supports experimentally altered starting ratios and diversity outcomes, not permanent stability
      or universal optimality of one inoculum.
  participating_taxa:
  - preferred_term: soil bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
- name: EcoFAB Brachypodium Rhizosphere Colonization
  description: Equal mixtures of 17 or 18 isolates, without or with Pseudomonas, were inoculated onto 12-day-old
    Brachypodium in EcoFABs and profiled seven days later. Root-associated community composition differed from the
    inoculum. These are plant-colonization observations, not demonstrated reciprocal benefit; the single inoculum
    batch limits taxon-level before/after significance tests. Pseudomonas presence did not significantly change
    overall EcoFAB composition, unlike the in-vitro diversity response.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynComs grown on plants were significantly different from the original inoculant, as determined
      by the Bray-Curtis distance
    explanation: Supports root-associated composition after live-plant inoculation, not a demonstrated plant growth
      benefit or the identical final 16-member inoculum.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: an equally mixed community of 17 or 18 bacterial isolates
    explanation: Methods resolves the EcoFAB inoculum as 17 or 18 isolates rather than the final 16-member model.
  participating_taxa:
  - preferred_term: soil bacterial SynCom members
    term:
      id: NCBITaxon:2
      label: Bacteria
environmental_factors:
- name: defined synthetic community design
  value: Bottom-up assembly of 16 culturable soil microorganisms commonly found in plant rhizospheres,
    with tuned inoculum ratios and cryopreservation.
  description: Low-nutrient media, starting composition ratios, cryopreservation, and EcoFAB plant colonization
    were evaluated.
  evidence:
  - *id001
growth_media:
- name: R2A (Teknova, 1x)
  temperature: '30'
  temperature_unit: °C
  atmosphere: AEROBIC
  incubation_time: '72'
  incubation_time_unit: h
  vessel_type: 96-well plate
  preparation_notes: Communities grown in 200 μL 1x R2A in 96-well plates without
    shaking; individual isolates grown in 14 mL culture tubes in 1x R2A; higher community
    alpha-diversity achieved with low-nutrient (diluted 1x, 0.1x) R2A; cryopreserved
    with 20% glycerol at −80°C; also colonizes Brachypodium distachyon in EcoFAB devices
    at 24°C under a 16 h light/8 h dark regime.
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Communities were grown in 200 μL of liquid R2A medium in 96-well plates
      in aerobic conditions at 30°C without shaking.
    explanation: Names R2A medium, aerobic, 30°C, 96-well plate, no shaking for the
      SynCom.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Individual isolates were grown in 3 to 5 mL liquid cultures of 1× R2A
      medium (Teknova, cat number R0005) in 14 mL culture tubes in aerobic conditions
      at 30°C without shaking.
    explanation: Gives the Teknova 1× R2A medium and aerobic 30°C conditions for the
      member isolates.
