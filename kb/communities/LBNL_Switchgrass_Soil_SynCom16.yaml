id: CommunityMech:000087
name: LBNL Switchgrass Soil SynCom16
description: Methods-defined final 16-stock synthetic collection from soil and rhizosphere surrounding a single
  switchgrass plant. This record follows the deposited-stock roster in Coker et al. Methods; the study's earlier
  18/17-member nutrient, ratio and EcoFAB assays have different or incompletely reconciled membership and are
  retained as source-scoped discussions. Table S1 differs from the final Methods roster; those stock identities
  are not silently reconciled.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Provide a reproducible synthetic model of soil and rhizosphere communities for laboratory microbiome
    research.
  assembly_strategy: Bottom-up collection of the 16 deposited stocks listed in Methods/Isolate selection. Species
    identities are not resolved by this source; source genus and exact stock/deposit designations are preserved.
  perturbation_design: The paper develops this model through distinct nutrient, starting-ratio, dropout, cryopreservation
    and plant-colonization assays. Earlier 18/17-member assay results are not asserted as effects in this Methods-defined
    final 16 roster.
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The final 16-member community isolates and details on their isolation are available
    explanation: Defines which 16 deposited stocks this record represents; does not unify the paper's different
      experimental panels.
environment_term:
  preferred_term: laboratory environment
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: Physical setting of the liquid-medium cultivation and fabricated plant assays. Soil/rhizosphere denotes
    the origin and modeled context, not soil as the assay substrate.
modeled_environment:
- preferred_term: soil
  term:
    id: ENVO:00001998
    label: soil
  notes: The isolates originate from rhizosphere and soil surrounding one switchgrass plant; this is the ecological
    context modeled in laboratory cultures.
