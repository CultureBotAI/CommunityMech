discussions:
- discussion_id: lbnl_soil_variant_scope_and_ecological_mediators
  prompt: Which interactions explain diversity responses within each defined SynCom variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Methods-defined-final16
  rationale: Automated assembly and preservation are methodological results, not ecological causal arrows. Earlier
    nutrient, ratio and plant observations survive in the three discussions below; their 18/17-member panels cannot
    be mapped to this final 16 collection by deleting a domain placeholder. The final Methods list and Table S1
    disagree, so stock correspondence across panels remains uncertain. Taxon dropout results and proposed Lysobacter
    facilitation/fast-grower competition are separate observations or interpretations, not newly inferred partner-specific
    arrows. Relative sequencing, PMA and DNA spike-ins do not establish absolute viable counts for every stock.
    Main text, original figures 2/3/5 and separate Table S1 were inspected in this follow-up; previous immutable
    reviews remain preserved.
  posed_by: codex
  posed_date: '2026-10-06'
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These isolates are novel strains from unknown species
    explanation: Species identities and panel-specific mechanism remain unresolved.
- discussion_id: earlier18_nutrient_response
  prompt: 'Low-Nutrient Alpha-Diversity Enrichment: source-scoped observation in earlier assay panels.'
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - engineering_design#study-development
  rationale: In the initial equally mixed 18-strain community, dilution from 1X to 0.2X or 0.1X R2A lowered total
    OD600 while increasing Shannon diversity and evenness after three days. Pseudomonas remained relatively dominant.
    This assay preceded the final 16-member model and does not demonstrate increased absolute viable abundance,
    partner-specific facilitation or the same response in every community variant. Main Methods/Table S1 stock
    discrepancies prevent assigning this observation to the complete Methods-defined final 16 roster. The observation
    is retained; its graph interpretation for all final 16 members is withheld.
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the Shannon diversity index and Pielou’s evenness, two α-diversity metrics, were lowest in the 1×
      medium and increased as the medium dilution increased
    explanation: Supports the measured nutrient-dilution diversity response in the initial 18-strain assay, not
      a result specific to the final 16-member model.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an equally mixed community of all 18 strains
    explanation: Identifies the 18-strain starting membership of the nutrient-dilution experiment.
  posed_by: codex
  posed_date: '2026-11-15'
- discussion_id: earlier17_18_ratio_response
  prompt: 'Starting-Ratio Dependent Community Diversity: source-scoped observation in earlier assay panels.'
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - engineering_design#study-development
  rationale: Adjusting inoculum ratios to favor organisms that became relatively rare in equal mixtures increased
    Shannon diversity and evenness at two and six days in the tested panels, particularly 2X/3X cutoff communities
    without Pseudomonas. These are defined starting-composition effects, not a universal optimum or proof of a
    unique competition mechanism. The 17/18-strain starting-ratio panels and later 16-member dropout experiments
    are distinct; relative sequencing is not a direct viable-cell count. Main Methods/Table S1 stock discrepancies
    prevent assigning this observation to the complete Methods-defined final 16 roster. The observation is retained;
    its graph interpretation for all final 16 members is withheld.
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Starting ratios containing orders of magnitude more of slower-growing organisms (2× cutoff and 3×
      cutoff) resulted in higher Shannon diversity and evenness values than did the 4 equally mixed conditions
    explanation: Supports experimentally altered starting ratios and diversity outcomes, not permanent stability
      or universal optimality of one inoculum.
  posed_by: codex
  posed_date: '2026-11-15'
- discussion_id: earlier17_18_ecofab_colonization
  prompt: 'EcoFAB Brachypodium Rhizosphere Colonization: source-scoped observation in earlier assay panels.'
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - engineering_design#study-development
  rationale: Equal mixtures of 17 or 18 isolates, without or with Pseudomonas, were inoculated onto 12-day-old
    Brachypodium in EcoFABs and profiled seven days later. Root-associated community composition differed from
    the inoculum. These are plant-colonization observations, not demonstrated reciprocal benefit; the single inoculum
    batch limits taxon-level before/after significance tests. Pseudomonas presence did not significantly change
    overall EcoFAB composition, unlike the in-vitro diversity response. Main Methods/Table S1 stock discrepancies
    prevent assigning this observation to the complete Methods-defined final 16 roster. The observation is retained;
    its graph interpretation for all final 16 members is withheld.
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: The SynComs grown on plants were significantly different from the original inoculant, as determined
      by the Bray-Curtis distance
    explanation: Supports root-associated composition after live-plant inoculation, not a demonstrated plant growth
      benefit or the identical final 16-member inoculum.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: an equally mixed community of 17 or 18 bacterial isolates
    explanation: Methods resolves the EcoFAB inoculum as 17 or 18 isolates rather than the final 16-member model.
  posed_by: codex
  posed_date: '2026-11-15'
- discussion_id: methods_final16_vs_supplement_table_s1
  prompt: How do the Methods-defined final 16 stocks map to the earlier 18-stock Table S1 roster?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - taxonomy#Methods-defined-final16
  rationale: Main Methods includes Marmoricola OAE513 and Methylobacterium OAE515, while separate Table S1 includes
    Bacillus OAE603 and Methylobacterium OAE516, omits Marmoricola, and also includes Sphingomonas OAE905 and
    Pseudomonas simiae WCS417. No supplied evidence proves OAE515 and OAE516 are aliases or makes earlier 18/17
    panels equal to final 16 plus exclusions. Table S1's plant associations are genus-level literature context,
    not stock-specific ecological role measurements. Issue 1548 retains the unresolved panel correspondence.
  evidence:
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DSM 114042 (Marmoricola OAE513)
    explanation: Present in the final Methods roster.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DSM 113602 (Methylobacterium OAE515)
    explanation: Exact final Methods stock designation.
  - reference: PMID:36472419
    supports: SUPPORT
    evidence_source: supplement_table_S1
    snippet: OAE516
    explanation: 'Separate Table S1, table 1, row 12, Strain column: the adjacent Genus cell is Methylobacterium.
