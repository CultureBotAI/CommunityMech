discussions:
- discussion_id: lbnl_soil_variant_scope_and_ecological_mediators
  prompt: Which interactions explain diversity responses within each defined SynCom variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Low-Nutrient Alpha-Diversity Enrichment
  - ecological_interactions#Starting-Ratio Dependent Community Diversity
  - ecological_interactions#EcoFAB Brachypodium Rhizosphere Colonization
  rationale: 'Remove automated assembly and cryopreservation as ecological graph nodes, without rejecting their
    positive methodological results: automated assembly generally reduced between-assembler variation, and glycerol/R2A
    regrowth resembled unfrozen controls. Nutrient tests used 18 strains, ratio panels included/excluded Pseudomonas,
    and EcoFAB Methods specifies 17 or 18 isolates; these are not interchangeable with the final 16-member model
    excluding Pseudomonas and Sphingomonas. Taxon-dropout experiments support additional diversity effects, while
    proposed Lysobacter facilitation and three-fast-grower competition remain mechanistic interpretations, not new
    curated arrows. Relic-DNA controls and DNA spike-ins do not make all abundance values viable-cell counts. Canonical
    Bacteria remains an aggregate placeholder; #1548 tracks roster and non-graph metadata. Full main text/captions
    were read, not original images, separate supplements or raw data.'
  posed_by: codex
  posed_date: '2026-10-06'
