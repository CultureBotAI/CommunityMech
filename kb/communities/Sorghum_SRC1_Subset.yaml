ecological_interactions:
- name: Network and Exudate Guided SRC1 Assembly
  description: >
    SRC1 was assembled from sorghum bacterial isolates selected either for network-predicted
    community cohesion or for growth on host-specific root-exudate compounds.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Host-Associated SRC1 Cohesion
    description: >
      The cohesion- and exudate-guided isolate set was then tested across solid-medium,
      gnotobiotic sorghum, and native-field growth contexts.
  evidence:
  - reference: doi:10.1093/ismejo/wrae126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SRC1 was assembled from bacterial isolates identified either for their potential role in
      community cohesion through network analysis or for their ability to benefit from host-specific exudate
      compounds
- name: Host-Associated SRC1 Cohesion
  description: >
    SRC1 community cohesion was most robust with the sorghum host in laboratory conditions, while
    some lineages were lost during growth on solid medium or in the native field.
  scope: COMMUNITY_LEVEL
  interaction_type: COLONIZATION_FACILITATION
  biological_processes:
  - preferred_term: symbiotic process
    term:
      id: GO:0044403
      label: biological process involved in symbiotic interaction
  downstream:
  - target: Above- and Below-Ground Sorghum Growth Promotion
    description: >
      Sorghum-associated SRC1 growth connected the designed isolate mixture to above- and
      below-ground host growth phenotypes.
  evidence:
  - reference: doi:10.1093/ismejo/wrae126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SRC1 cohesion is most robust when cultivated in the presence of the plant host
      under laboratory conditions
    explanation: >
      Anchors the host-associated community cohesion that distinguished the gnotobiotic sorghum
      condition from in-vitro or native-field SRC1 growth.
- name: Above- and Below-Ground Sorghum Growth Promotion
  description: >
    The SRC1 SynCom promoted both above-ground and below-ground sorghum growth phenotypes in
    laboratory and native-field contexts.
  scope: COMMUNITY_LEVEL
  interaction_type: MUTUALISM
  biological_processes:
  - preferred_term: plant growth
    term:
      id: GO:0040007
      label: growth
  downstream:
  - target: Host Lignin Biosynthesis Dampening
    description: >
      Under laboratory conditions, the sorghum growth improvements were correlated with
      transcriptional dampening of host lignin biosynthesis.
  evidence:
  - reference: doi:10.1093/ismejo/wrae126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: SRC1 effectively promotes the growth of both above- and below-ground plant phenotypes
      in both laboratory and native field contexts
    explanation: >
      Reports the main plant-growth phenotype measured after SRC1 inoculation.
- name: Host Lignin Biosynthesis Dampening
  description: >
    In the laboratory sorghum host, SRC1-driven growth enhancement correlated with dampened
    transcription of lignin-biosynthesis genes.
  scope: COMMUNITY_LEVEL
  interaction_type: MUTUALISM
  biological_processes:
  - preferred_term: lignin biosynthetic process
    term:
      id: GO:0009809
      label: lignin biosynthetic process
  - preferred_term: regulation of secondary metabolite biosynthetic process
    term:
      id: GO:1900376
      label: regulation of secondary metabolite biosynthetic process
  evidence:
  - reference: doi:10.1093/ismejo/wrae126
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: these growth enhancements correlate with the transcriptional dampening of lignin
      biosynthesis in the host
    explanation: >
      Links the SRC1 growth phenotype to the host lignin-biosynthesis transcriptional response.
environmental_factors:
- name: Community design strategy
  value: network-based and exudate-responsive selection
  description: 'Strains selected based on network analysis identifying hub taxa and ability to utilize
    sorghum-specific root exudate compounds as carbon sources

    '
- name: Community size
  value: 16-20 member subset from 57-strain parent consortium
  description: 'Simplified subset derived from the full SRC1 community (57 strains) maintaining functional
    benefits with reduced complexity

    '
- name: Field testing
  value: validated in native field conditions
  description: 'Field experiments replicate laboratory findings, demonstrating that SRC1 promotes sorghum
    growth in real-world agricultural settings

    '
- name: Biomass enhancement
  value: increased shoot fresh and dry weight
  description: 'Live SRC1 treatment produces increased shoot biomass under well-watered conditions compared
    to mock-inoculated controls in both lab and field

    '
- name: Bioenergy crop application
  value: sorghum productivity improvement
  description: 'Engineered to enhance productivity of sorghum as a second-generation bioenergy feedstock
    crop through improved growth and potential lignin modification

    '
- name: Inoculation method
  value: 1 mg/mL biomass per strain
  description: 'SRC1 applied with standardized biomass concentration per strain, with only live treatment
    producing growth benefits

    '
