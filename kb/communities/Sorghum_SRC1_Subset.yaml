- name: unspecified solid media (in vitro); gnotobiotic in planta
  preparation_notes: SRC1 growth was assessed in vitro on solid media, in planta under gnotobiotic
    laboratory conditions, and in the field; community cohesion was most robust when cultivated with the
    Sorghum bicolor host under laboratory conditions. No medium composition, temperature, or pH is
    reported in the accessible abstract.
  evidence:
  - reference: doi:10.1093/ismejo/wrae126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth performance of SRC1 was assessed in vitro on solid media, in planta under gnotobiotic
      laboratory conditions, and in the field
    explanation: Names the three cultivation contexts (solid media in vitro, gnotobiotic in planta, field).
