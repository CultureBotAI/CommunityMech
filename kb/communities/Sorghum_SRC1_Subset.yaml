  relevance: Cell-wall phenolic polymer whose host biosynthesis is transcriptionally dampened when
    SRC1 colonizes Sorghum bicolor — the molecular host response that correlates with SynCom-driven
    above- and below-ground growth promotion in the original ISME J paper.
  evidence:
