  headspace_gas: N2/CO2 80:20
  vessel_type: serum bottles with butyl rubber stoppers
  preparation_notes: 'Medium prepared under strict anaerobic conditions using modified Hungate technique.
    Medium boiled and cooled under N2/CO2 atmosphere, dispensed anaerobically into serum bottles or tubes,
    sealed with butyl rubber stoppers, and autoclaved. Reducing agents (Na2S and cysteine) added from
    sterile anaerobic stock solutions after autoclaving to establish low redox potential. Final pH adjusted
    to 7.2. Resazurin used as redox indicator (colorless when reduced). S. fumaroxidans uses both H2 and
    formate as electron carriers for interspecies electron transfer to M. hungatei, with formate being
    the preferential carrier during syntrophic propionate oxidation.

    '
