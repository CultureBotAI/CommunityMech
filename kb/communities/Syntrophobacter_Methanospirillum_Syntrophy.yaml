    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It oxidized propionate syntrophically in co-culture with the hydrogen- and formate-utilizing
      Methanospirillum hungateii, and was able to oxidize propionate and other organic compounds in pure
      culture with sulfate or fumarate as the electron acceptor
    explanation: Demonstrates the core metabolic activity of S. fumaroxidans in propionate degradation
      with H2/formate transfer
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Formate dehydrogenase Fdh1 and hydrogenase Hox were the main confurcating enzymes used for
      energy conservation
    explanation: Demonstrates the enzymatic mechanism of H2 and formate production during syntrophic propionate
      oxidation
- name: Interspecies Electron Transfer and Methanogenesis
  description: 'Methanospirillum hungatei consumes the H2 and formate produced by S. fumaroxidans, combining
    them with CO2 to produce methane via hydrogenotrophic methanogenesis. This H2/formate removal maintains
    low partial pressures, making the thermodynamically unfavorable propionate oxidation by S. fumaroxidans
    energetically feasible. This interspecies electron transfer via both H2 and formate is a classic example
    of syntrophic metabolism in anaerobic environments critical for biogeochemical cycling.

    '
