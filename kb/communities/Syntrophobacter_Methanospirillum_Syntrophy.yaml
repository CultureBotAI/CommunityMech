- name: Interspecies Electron Transfer and Methanogenesis
  description: M. hungatei acts as the hydrogen/formate-using methanogenic partner of S. fumaroxidans. Carrier consumption
    supports methane formation and relieves the thermodynamic constraint on propionate oxidation. Low hydrogen partial
    pressure and low formate concentration are distinct constraints; formate is not a gas pressure. The comparative
    proteome suggests an important formate route but does not independently quantify exact-pair carrier partitioning.
