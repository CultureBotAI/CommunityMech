  - target: Syntrophic Propionate-to-Methane Conversion
    description: Methanogenic consumption of bacterially supplied reducing equivalents couples propionate oxidation
      to methane production. Cooperation is reciprocal, but the carrier transfer described here is bacterial-to-methanogen,
      not bidirectional donation.
