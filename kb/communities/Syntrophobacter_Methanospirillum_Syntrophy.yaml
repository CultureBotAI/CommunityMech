ecological_interactions:
- name: Propionate Oxidation and H2/Formate Production
  description: 'S. fumaroxidans oxidizes propionate in syntrophy with M. hungatei, releasing reducing equivalents
    through hydrogen and/or formate. The methylmalonyl-CoA pathway produces acetate and inorganic carbon. Partner
    consumption maintains low hydrogen partial pressure and formate concentration; these are different physical
    quantities. This is the tested methanogenic growth context, not universal partner dependence: sulfate or fumarate
    can support axenic growth. PARTIAL: comparative protein abundance and homology support proposed Fdh1/Hox confurcation
    and Fdh2/Hyn reverse-electron-transport roles, not direct demonstration of every enzyme assignment or the fraction
    of electrons carried by each route in this pair.'
