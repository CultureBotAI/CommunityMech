  description: In the presence of glucose, Burkholderia and Achromobacter isolates activate central carbon metabolism (glycolysis
    and TCA cycle) and express atzF and gst to cooperatively degrade mixed nicosulfuron, mesotrione, and atrazine.
  interaction_type: SYNTROPHY
