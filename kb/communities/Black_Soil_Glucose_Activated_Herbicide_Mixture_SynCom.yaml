id: CommunityMech:000485
name: Black-Soil Glucose-Activated Herbicide-Mixture Degrading Synthetic Community
description: Simplified four-isolate bacterial synthetic community (SynCom) constructed from keystone taxa—Burkholderia-Caballeronia-Paraburkholderia
  complex, Rhodanobacter, and Achromobacter—identified in a natural microbial consortium enriched from herbicide-stressed
  agricultural black soil in Northeast China. Activated by glucose supplementation that fuels glycolytic and TCA cycle energy
  supply and environmental acidification, the SynCom co-metabolically degrades a recalcitrant mixture of nicosulfuron (97.27%),
  mesotrione (68.00%), and atrazine (22.91%) via enriched catabolic genes including atzF (allophanate hydrolase) and gst (glutathione
  S-transferase).
