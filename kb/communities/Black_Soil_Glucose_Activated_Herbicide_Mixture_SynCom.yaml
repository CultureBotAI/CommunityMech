environmental_factors:
- name: Glucose Co-Substrate Supplementation and Herbicide Mixture
  value: Glucose-supplemented mineral salt medium (GSM) with atrazine, nicosulfuron, and mesotrione
  description: Glucose amendment activates glycolysis and TCA cycle flux, providing cellular energy and medium acidification
    required for co-metabolic degradation of nicosulfuron, mesotrione, and atrazine.
  evidence:
  - reference: PMID:41762466
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Significant herbicide degradation occurred only in the GSM system, with degradation rates of 97.27% for nicosulfuron,
      68.00% for mesotrione, and 22.91% for atrazine after 8 days.
    explanation: Demonstrates strict requirement for glucose supplementation to activate multi-herbicide degradation.
ecological_interactions:
