environmental_factors:
- name: Soil-microcosm GenX removal
  value: 80.6% removal by day 3
  description: Active Community G removed GenX over a 3-day sterile-soil microcosm time course while inactivated Community
    G controls remained near baseline.
  evidence:
  - reference: PMID:42422733
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Active Community G achieved 19.2% (day 1), 61.8% (day 2), and 80.6% (day 3) removal
    explanation: Quantifies the GenX removal time course in active Community G soil microcosms.
- name: Soil-microcosm GenX defluorination
  value: 69.6% defluorination efficiency by day 3
  description: Active Community G released fluoride in GenX-amended soil microcosms, consistent with C-F bond cleavage rather
    than only physical GenX disappearance.
  evidence:
  - reference: PMID:42422733
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Active Community G: 882.07 ± 113.82 ng/ml (69.6%)'
    explanation: Reports the day-3 fluoride concentration and derived defluorination efficiency for active Community G in
      soil microcosms.
