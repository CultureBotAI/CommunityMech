id: CommunityMech:000387
name: Community G GenX Biodegradation Consortium
description: 'A Prospector nanowell-derived bacterial consortium from cotton detritusphere enrichments that was re-tested
  for hexafluoropropylene oxide dimer acid (GenX) degradation. Community G underwent rapid taxonomic restructuring in sterile
  agricultural-soil microcosms amended with GenX: Salmonella enterica, Pseudomonas tolaasii, Stenotrophomonas sp. LM091, and
  Stenotrophomonas sp. MYb57 expanded by day 3, while Stenotrophomonas cyclobalanopsidis and Pseudomonas arcuscaelestis declined
  or disappeared. Active Community G removed 80.6% of GenX in the 3-day soil microcosm and reached 69.6% defluorination.'
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Select a high-density, functionally stable cotton-detritusphere bacterial consortium for PFOS/PFOA degradation
    and evaluate whether the selected community can also defluorinate the replacement ether-PFAS GenX.
  assembly_strategy: Use Prospector nanowell array enrichment from cotton detritusphere communities, serial passaging under
    PFOS and PFOA selective conditions, and full-length 16S rRNA profiling to identify the Community G consortium later advanced
    to GenX microcosm tests.
  inoculation_strategy: Revive stored Community G glycerol stocks, culture the consortium in M9 minimal medium, wash in phosphate-buffered
    saline, and standardize to OD600 0.05 before transfer into M9 plus GenX assays or sterile GenX-amended soil microcosms.
  measurement_endpoints:
  - GenX removal measured by LC-MS/MS
  - Fluoride release measured by SPADNS colorimetry
  - Community composition over 3 days by full-length 16S rRNA sequencing
  - Comparative PFOS and PFOA removal by GENIA and Community G
  evidence:
  - reference: PMID:42173377
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Eight communities (A-H) were characterized for PFAS degradation, fluoride liberation, and taxonomic composition
      via full-length 16S rRNA sequencing.
    explanation: Identifies Communities A-H, including Community G, as the Prospector-enriched PFAS-degrading consortia characterized
      before the GenX follow-up.
  - reference: PMID:42422733
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we demonstrate that synthetic bacterial consortia assembled through rational genomic design (GENIA) or
      microfluidic selection (Community G) achieve rapid GenX biodegradation
    explanation: States that the microfluidically selected Community G consortium was experimentally evaluated for GenX degradation.
