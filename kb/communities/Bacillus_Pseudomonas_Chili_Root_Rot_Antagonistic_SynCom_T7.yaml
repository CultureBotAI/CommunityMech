environmental_factors:
- name: Continuous Cropping Monoculture Regime
  value: Prolonged continuous cropping of Capsicum annuum
  description: Continuous cropping depletes native Bacillus and Pseudomonas populations and enriches pathogenic Fusarium species
    in the chili rhizosphere.
  evidence:
  - reference: PMID:42693392
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: High-throughput sequencing analysis indicated a marked increase in the abundance of Fusarium pathogens, accompanied
      by a significant decline in antagonistic bacteria from the genera Bacillus and Pseudomonas.
    explanation: Documents continuous-cropping dysbiosis in the chili rhizosphere.
