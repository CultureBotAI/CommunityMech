id: CommunityMech:000483
name: Bacillus and Pseudomonas Antagonistic Synthetic Community T7 Against Chili Root Rot
description: Synthetic bacterial community (T7 SynCom) constructed from core antagonistic rhizosphere biomarker isolates of
  Bacillus and Pseudomonas depleted during prolonged continuous cropping of chili pepper (Capsicum annuum). T7 SynCom directly
  antagonizes the root rot pathogen Fusarium solani, reduces chili root rot incidence, and induces systemic plant resistance
  by activating MAPK, ethylene, jasmonic acid, and salicylic acid immune signaling pathways.
