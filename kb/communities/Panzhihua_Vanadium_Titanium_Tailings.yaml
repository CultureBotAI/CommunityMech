    term:
      id: NCBITaxon:1336235
      label: Paenirhizobium selenitireducens ATCC BAA-1503
    gtdb_grounding_status: UNRESOLVED
    notes: 'Nitrogen-fixing alphaproteobacterium capable of selenium reduction and heavy metal tolerance,
      isolated from P. pinnata root nodules in V-Ti tailings. Three isolates were identified as R. selenitireducens,
      demonstrating nitrogen-fixing capacity and variable tolerance to Cu, Ni, Mn, and Zn. This species
      possesses unique metabolic capabilities including selenite reduction to elemental selenium, suggesting
      potential for metalloid detoxification in addition to nitrogen fixation. R. selenitireducens contributes
      to the functional diversity of the rhizobial community, providing complementary metal tolerance
      mechanisms and nitrogen enrichment. The organism forms effective symbioses with leguminous plants
      under metal stress conditions, promoting plant growth through nitrogen provision and IAA production.
      Like other tailings rhizobia, R. selenitireducens serves as a competent candidate for bioremediation
      of soils contaminated with multifarious metals due to its combined nitrogen-fixing and metal tolerance
      phenotypes.

      '
