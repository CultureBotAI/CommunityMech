environmental_factors:
- name: pH
  value: 6.5-7.5
  unit: pH units
  description: 'Circumneutral pH range in Panzhihua V-Ti magnetite tailings, buffered by carbonate and
    silicate minerals in the ore gangue. This pH distinguishes the system from acidic mine drainage environments
    and supports diverse neutrophilic bacteria including rhizobia, Bacillus, and metal reducers. At pH
    6.5-7.5, vanadate exists predominantly as H2VO4⁻ and HVO4²⁻ species, while vanadyl forms VO²⁺ and
    VO(OH)⁺ species. The pH is optimal for legume growth and nitrogen fixation (pH 6.5-7.5 for most rhizobia),
    enabling effective phytoremediation partnerships. Circumneutral pH maximizes the solubility difference
    between V(V) and V(IV), enhancing vanadium immobilization efficiency through microbial reduction.
    The pH also influences metal bioavailability, with many heavy metals (Cu, Ni, Zn) showing reduced
    toxicity at neutral pH compared to acidic conditions.

    '
  evidence:
  - reference: PMID:38181847
    supports: PARTIAL
    evidence_source: IN_VIVO
    snippet: In this alkaline V tailing pond, V and pH are major drivers to induce
      community variation, particularly for functional bacteria
    explanation: Zhang et al. 2024 frame pH (alongside V) as a primary community
      driver in a Panzhihua-region alkaline V tailing pond — supports pH as a
      controlling parameter but does not quote a specific Panzhihua pH range
      (PARTIAL).
- name: Total Vanadium Concentration
  value: '340'
  unit: mg/kg
  description: 'Total vanadium concentration in Panzhihua V-Ti magnetite tailings, approximately 2-fold
    higher than background soil levels (50-150 mg/kg). This reflects the world''s largest vanadium-titanium
    magnetite deposit and intensive V-Ti ore processing. Total vanadium includes both solid-phase V (oxides,
    silicates, magnetite-hosted) and potentially mobile V(V) in pore water. While lower than extreme vanadium
    contamination in some northern China tailings (10,500 mg/kg), the 340 mg/kg level still represents
    significant ecological risk requiring remediation. The concentration is high enough to select for
    metal-tolerant microorganisms but low enough to permit plant growth with appropriate rhizobial partnerships.
    Phytoremediation aims to stabilize vanadium through plant uptake, microbial reduction, and organic
    matter complexation.

    '
  evidence:
  - reference: doi:10.1016/j.scitotenv.2024.170082
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: Results showed that the atmospherically deposited heavy metals showed high mobility and were
      primarily presented in the soluble ionic fractions in the wet part and acid-exchangeable and reducible
      fractions in the dry part of atmospheric deposition
    explanation: Documents vanadium contamination in tailings context
- name: Polymetallic Contamination
  value: Cu 127 mg/kg, Ni 60 mg/kg, Mn 1200 mg/kg, Zn 155 mg/kg
  unit: mg/kg
  description: 'Panzhihua V-Ti tailings contain elevated concentrations of multiple heavy metals beyond
    vanadium: copper (127 mg/kg), nickel (60 mg/kg), manganese (1200 mg/kg), zinc (155 mg/kg), and titanium.
    This polymetallic contamination reflects the complex mineralogy of V-Ti magnetite ores and selective
    extraction processes that concentrate metals in tailings. The multi-metal stress environment selects
    for bacteria with broad metal tolerance, explaining the dominance of Bradyrhizobium (tolerant to Cu,
    Ni, Mn, Zn), Bacillus (diverse metal resistance), and Ochrobactrum (exceptional metal tolerance).
    Phytoextraction efficiency is enhanced for Cu (603% increase) and Ni (576% increase) with rhizobial
    inoculation, demonstrating effective polymetallic remediation. The presence of iron (abundant in magnetite)
    supports iron-reducing and iron-oxidizing bacteria that couple to vanadium redox cycling. Manganese
    (1200 mg/kg) provides alternative electron acceptor for metal-reducing bacteria. This polymetallic
    environment requires integrated bioremediation approaches addressing multiple contaminants simultaneously.

    '
  evidence:
  - reference: doi:10.1371/journal.pone.0106618
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: To provide a basis for using indigenous bacteria for bioremediation of heavy metal contaminated
      soil, the heavy metal resistance and plant growth-promoting activity of 136 isolates from V-Ti magnetite
      mine tailing soil were systematically analyzed
    explanation: Documents polymetallic contamination in Panzhihua tailings
  - reference: doi:10.3389/fmicb.2023.1078333
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: high tolerance against these four heavy metals
    explanation: Establishes multi-metal tolerance in rhizobia
- name: Temperature
  value: 20-30
  unit: °C
  description: 'Mesophilic temperature range in Panzhihua V-Ti tailings, reflecting the subtropical climate
    of Sichuan Province along the Jinsha River hot and arid valleys. This temperature regime is optimal
    for mesophilic bacteria including Bradyrhizobium (optimum 25-30°C), Bacillus (optimum 30-37°C), and
    Polaromonas (psychrotolerant, active 15-30°C). Legumes P. pinnata and L. leucocephala are adapted
    to warm climates and thrive in this temperature range. Seasonal temperature variation influences microbial
    activity and phytoremediation efficiency, with peak nitrogen fixation and metal reduction during warm
    months. The moderate temperature enables year-round microbial activity (unlike cold-climate tailings)
    while avoiding thermal stress on mesophilic organisms.

    '
