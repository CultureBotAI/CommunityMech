ecological_interactions:
- name: Pongamia Nodulation and Nitrogen-Enrichment Phenotypes
  description: Bradyrhizobium isolates from Pongamia pinnata nodules in Panzhihua tailings formed nodules and increased
    plant nitrogen and growth in separate nitrogen-free vermiculite pot assays. Results identify PP76 and other
    Bradyrhizobium isolates, while PP1 belongs to Rhizobium in the Results and must not be assigned to B. pachyrhizi.
    The abstract assigns twelve isolates to B. pachyrhizi, but species-level trees and labels are inconsistent.
    The canonical species endpoint therefore represents the authors provisional group assignment, not a verified
    PP1 identity. These are positive inoculation phenotypes with nifH evidence, not a measured ammonium-transfer
    flux, V-Fe nitrogenase demonstration, or mutualism between bacterial species. The same study also reports separate
    metal-tolerance phenotypes for PP76 and other isolates; internal Cd/Zn inconsistencies preclude unqualified
    metal-specific numerical assignments here.
  scope: PAIRWISE
