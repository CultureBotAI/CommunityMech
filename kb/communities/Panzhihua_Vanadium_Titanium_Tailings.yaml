- name: Metal Tolerance of Cultured Tailings Bacillus
  description: The 2014 Panzhihua bulk-soil isolate screen found multiple-metal tolerance among Bacillus isolates,
    including five strains tolerant to all six tested metals. These were isolate growth assays, not a demonstration
    that Bacillus transfers metabolites to rhizobia or enhances plant metal uptake. Keep this result separate from
    the 2023 nodule-isolate screen and the 2018 S. saheli YH1/Leucaena system, which reduced plant metal uptake.
    The previously assigned B. liaoningense phytoextraction percentages do not belong to B. pachyrhizi or to the
    cited YH1 experiment. Efflux, sequestration, ACC degradation and metal-redox mechanisms were not isolated by
    the tolerance assay.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Bacillus species
    term:
      id: NCBITaxon:1386
      label: Bacillus <firmicutes>
  evidence:
