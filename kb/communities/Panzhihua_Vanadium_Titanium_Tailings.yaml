    snippet: Metalliferous mine tailings have a negative impact on the soil environment near mining areas
      and render cultivable lands infertile
    explanation: Quantifies massive tailings accumulation
  - reference: doi:10.1371/journal.pone.0106618
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: To provide a basis for using indigenous bacteria for bioremediation of heavy metal contaminated
      soil, the heavy metal resistance and plant growth-promoting activity of 136 isolates from V-Ti magnetite
      mine tailing soil were systematically analyzed
    explanation: Documents tailings scale from cumulative mining
- name: Indigenous Microbiome Diversity
  value: 136 culturable isolates; 58% Bacillus, 21% Rhizobium, 10% Ochrobactrum
  description: 'The indigenous microbial community in Panzhihua V-Ti magnetite tailings comprises diverse
    metal-tolerant and plant growth-promoting bacteria adapted to extreme polymetallic stress. Systematic
    analysis of 136 culturable isolates revealed genus-level composition: Bacillus (79 isolates, 58%),
    Rhizobium (29 isolates, 21%), and Ochrobactrum intermedium (13 isolates, 10%). This community structure
    reflects selective pressures favoring spore-forming metal-resistant Bacillus, nitrogen-fixing metal-tolerant
    rhizobia, and metabolically versatile Ochrobactrum. Approximately 67% of isolates produce indoleacetic
    acid (IAA), demonstrating widespread plant growth-promoting capability. The indigenous microbiome
    provides the "seed bank" for phytoremediation, with legume plantings selectively enriching nitrogen-fixing
    rhizobia from this diverse background community. During P. pinnata revegetation, rhizobia populations
    increase dramatically, reshaping community structure toward nitrogen-fixing symbionts while maintaining
    metal tolerance functions. The culturable diversity likely underestimates total microbial diversity,
    as many metal-reducing, iron-cycling, and anaerobic organisms are not captured by standard cultivation.
    This indigenous microbiome represents a valuable resource for developing site-adapted bioremediation
    strategies without requiring exotic inoculant introduction.

    '
