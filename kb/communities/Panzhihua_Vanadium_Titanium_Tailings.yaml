    notes: 'Gram-positive spore-forming bacteria representing the most abundant genus (79 of 136 isolates,
      58%) in V-Ti magnetite mine tailing soil from Panzhihua. Bacillus species demonstrate exceptional
      heavy metal resistance and diverse plant growth-promoting activities including IAA production (67%
      of isolates), siderophore secretion, phosphate solubilization, and nitrogen fixation by some strains.
      The dominance of Bacillus reflects their adaptive advantages in extreme environments: spore formation
      for survival during desiccation and oxidative stress, diverse metal tolerance mechanisms (efflux
      pumps, metal-binding proteins, biofilm formation), and metabolic versatility. Bacillus species contribute
      to iron cycling through siderophore-mediated Fe(III) solubilization and potential Fe(III) reduction,
      facilitating iron bioavailability for plants while influencing vanadium mobility through redox coupling.
      The genus produces extracellular polysaccharides that bind and immobilize heavy metals, reducing
      their phytotoxicity. Bacillus represents a critical component of the indigenous tailings microbiome
      that supports plant establishment and metal detoxification during revegetation.

      '
