    notes: 'Alphaproteobacterium (13 isolates) with exceptional heavy metal tolerance and plant growth-promoting
      capabilities in V-Ti tailings. Four Ochrobactrum isolates from P. pinnata nodules were initially
      identified as O. anthropi, closely related to O. intermedium. Ochrobactrum species are known for
      extraordinary metal resistance (Cd, Pb, Zn, Cu, Ni, Co, Cr) through multiple mechanisms including
      metal efflux systems, intracellular sequestration, and biosorption. The genus demonstrates versatile
      metabolism including aerobic respiration, denitrification, and potential metal reduction activities.
      O. intermedium produces IAA, siderophores, and ACC deaminase, promoting plant growth under metal
      stress by reducing ethylene-mediated stress responses. Some Ochrobactrum strains can reduce toxic
      metals including Cr(VI) and potentially V(V), contributing to metal detoxification in tailings.
      The organism may form nitrogen-fixing nodule-like structures with some legumes, though with lower
      efficiency than true rhizobia. Ochrobactrum represents a metabolically flexible component of the
      tailings microbiome that bridges nitrogen fixation, metal tolerance, and redox transformations.

      '
