    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Five strains, the B. licheniformis KT-87 and KT-88 and the Bacillus sp. KT-72, KT-74 and KT-76 were
      tolerant against all the tested heavy metals.
    explanation: Supports a Bacillus isolate phenotype, not a plant phytoextraction or interbacterial cooperation
      mechanism.
- name: Ochrobactrum Isolate Growth-Promoter Production
  description: The 2014 bulk-soil collection included thirteen isolates identified as Ochrobactrum intermedium.
    In that collection, six Ochrobactrum isolates produced more than 60 micrograms/mL IAA, and KT80 had the highest
    reported IAA concentration, 83.05 micrograms/mL; two Ochrobactrum isolates were among the siderophore producers.
    The main-text wording does not unambiguously allocate IAA/siderophore co-production to both isolates. These
    are in-vitro production phenotypes, not demonstrated metabolite delivery to Bradyrhizobium, ACC deaminase activity,
    metal reduction or a community-resilience mechanism. The 2023 Ochrobactrum nodule isolates are a different collection
    with different species assignments; they cannot establish O. intermedium symbiotic nitrogen fixation.
