- name: Tailings Scale and Origin
  value: 570 million tons accumulated
  unit: metric tons
  description: 'Panzhihua V-Ti magnetite mining has generated approximately 570 million tons of accumulated
    tailing slurries, representing one of the world''s largest vanadium-titanium magnetite tailings repositories.
    The tailings are located by the Jinsha River in the southern Panxi rift valley, upstream of the Yangtze
    River, creating significant environmental risk to downstream ecosystems if metals mobilize. Panzhihua
    hosts the world''s largest vanadium-titanium magnetite deposit and is the world''s largest vanadium
    production city, with ongoing mining continuously adding to tailings volume. The massive scale of
    accumulation (570 million tons) necessitates cost-effective, sustainable remediation approaches such
    as legume-based phytoremediation rather than excavation or chemical treatment. In situ biological
    remediation using indigenous metal-tolerant microbiota represents the only economically viable strategy
    for addressing contamination at this scale. The tailings serve as both environmental liability and
    potential resource for metal recovery, with integrated phytoextraction-bioleaching approaches potentially
    recovering valuable metals while rehabilitating soil.

    '
