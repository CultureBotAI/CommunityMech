- name: Revegetation and Phytoremediation Setup
  value: Pongamia pinnata and Leucaena leucocephala legume plantings
  description: 'In situ phytoremediation of Panzhihua V-Ti magnetite tailings using nitrogen-fixing legumes
    Pongamia pinnata (Indian beech, karanja) and Leucaena leucocephala (white leadtree). P. pinnata forms
    symbioses with indigenous Bradyrhizobium pachyrhizi, B. liaoningense, Rhizobium selenitireducens,
    and R. pisi, achieving high nitrogen fixation (10-145% plant N increase) and enhanced metal phytoextraction
    (603% Cu, 576% Ni uptake). L. leucocephala, inoculated with Sinorhizobium saheli YH1, demonstrates
    reduced metal uptake and phytostabilization strategy. Two-year revegetation periods effectively shift
    microbial communities toward rhizobia-dominated assemblages, reshape soil structure, and improve soil
    quality through carbon sequestration and enzyme activation. The legume-rhizobia partnership provides
    self-sustaining nitrogen enrichment without fertilizer input, reducing operational costs while enabling
    plant establishment in nutrient-poor tailings. P. pinnata produces deep root systems that access deeper
    tailings zones and tolerate drought, making it ideal for hot arid valley conditions. The phytoremediation
    system represents an integrated approach combining nitrogen fixation, metal tolerance, carbon sequestration,
    and soil quality improvement for sustainable V-Ti tailings rehabilitation.

    '
