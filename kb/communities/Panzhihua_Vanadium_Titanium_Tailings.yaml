discussions:
- discussion_id: panzhihua-composite-community-boundaries
  prompt: Which sampled community and verified isolates support each Panzhihua graph claim?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Pongamia Nodulation and Nitrogen-Enrichment Phenotypes
  - ecological_interactions#Metal Tolerance of Cultured Tailings Bacillus
  - ecological_interactions#Ochrobactrum Isolate Growth-Promoter Production
  rationale: The record combines bulk-soil isolates, individually tested nodule isolates and separate plant-remediation
    communities. Positive nodulation, nitrogen enrichment, isolate tolerance and IAA production remain. Co-isolation
    does not establish functional redundancy, mutualism or compensatory resilience. Polaromonas occurrence in this
    exact Panzhihua system is unverified; PMID33125214 concerns its own vanadium-tailings system, already represented
    separately as CommunityMech:000055. Removing that node exposes an unresolved canonical-membership problem rather
    than concealing it through all-member community-level credit. The 2023 paper also conflicts internally on PP1
    identity and Cd/Zn assays. Canonical identity, top-level environment and trophic roles require separate review.
  evidence:
  - reference: doi:10.3389/fmicb.2023.1078333
    supports: PARTIAL
    evidence_source: OTHER
    snippet: twelve isolates were identified as Bradyrhizobium pachyrhizi
    explanation: Abstract species assignment; Results tree comparisons and strain names are inconsistent, so exact
      strain-to-species mapping remains unresolved.
  - reference: PMID:33125214
    supports: PARTIAL
    evidence_source: OTHER
    snippet: V V -reducing enrichments indicated that bacteria associated with Polaromonas
    explanation: External-system context only; no evidence of occurrence or vanadium reduction at this record’s
      Panzhihua sampling site.
  posed_by: codex
- discussion_id: panzhihua-positive-soil-carbon-result
  prompt: How should the positive Pongamia soil-carbon response be represented with the correct community identity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Pongamia Nodulation and Nitrogen-Enrichment Phenotypes
  - ecological_interactions#Metal Tolerance of Cultured Tailings Bacillus
  rationale: PMID38744211 reports significant increases in ROC, POC, DOC and MBC, three carbon-transformation enzyme
    measures, and carbon degradation/fixation/methane-oxidation gene abundance after long-term Pongamia remediation.
    This positive aggregate result is retained here, not discarded as merely hypothetical. SEM supports an inferred
    community-level pathway, not Bacillus-to-Bradyrhizobium commensalism or a reciprocal nitrogen/carbon feedback
    connecting different studies. The former DOC metabolite was incorrectly grounded as carbon dioxide. A graph
    node needs a correctly scoped community and source-resolved participants; converting this composite record to
    implicit all-member activity would falsely include Polaromonas. Authorized full text and identity repair precede
    new topology.
  evidence:
  - reference: PMID:38744211
    supports: SUPPORT
    evidence_source: IN_VIVO
    snippet: four soil active organic carbon components (ROC, POC, DOC, and MBC)
    explanation: Positive aggregate carbon result in a separate remediation study; does not resolve the proposed
      bacterial pair.
  - reference: PMID:38744211
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: The abundance of carbon transformation functional genes such as carbon degradation, carbon fixation,
      and methane oxidation were also significantly
    explanation: Gene-abundance changes are not measured pathway flux or a demonstrated nitrogen-to-carbon feedback.
  posed_by: codex
