id: CommunityMech:000051
name: Panzhihua Vanadium Titanium Tailings Community
description: 'A perturbed indigenous microbial community from vanadium-titanium magnetite mine tailings
  in Panzhihua, Sichuan, China, the world''s largest V-Ti magnetite deposit and largest vanadium production
  city. This community comprises nitrogen-fixing rhizobia (Bradyrhizobium pachyrhizi, Rhizobium species),
  metal-reducing bacteria, and indigenous microbiota that facilitate phytoremediation of polymetallic
  tailings containing vanadium (340 mg/kg), titanium, iron, copper, nickel, manganese, and zinc. The Panzhihua
  deposit has generated approximately 570 million tons of tailing slurries from mining activities, creating
  a massive contamination challenge requiring sustainable bioremediation. The indigenous microbial community
  has adapted to extreme metal stress through nitrogen fixation coupled with plant growth promotion, enabling
  successful legume-based phytoremediation with Pongamia pinnata and Leucaena leucocephala. Bradyrhizobium
  species demonstrate exceptional heavy metal tolerance while maintaining nitrogen-fixing capacity (increasing
  plant nitrogen content by 10-145%), promoting plant growth through IAA production, and facilitating
  metal phytoextraction (enhancing Cu and Ni uptake by 600%). Metal-reducing bacteria contribute to vanadium
  detoxification through dissimilatory V(V) reduction to less soluble V(IV), decreasing vanadium bioavailability
  and mobilization risk. The community drives transformation of soil organic carbon, increasing active
  carbon components and carbon transformation enzymes during revegetation, improving overall tailings
  soil quality. This system represents a critical model for coupling nitrogen fixation, metal tolerance,
  and phytoremediation in polymetallic mine tailings, addressing both resource recovery and environmental
  remediation challenges in the world''s largest vanadium-titanium deposit.

  '
ecological_state: PERTURBED
community_origin: NATURAL
community_category: BIOREMEDIATION
environment_term:
  preferred_term: mine tailings
  term:
    id: ENVO:00000003
    label: mine tailing
  notes: 'Vanadium-titanium magnetite mine tailings from Panzhihua, Sichuan Province, China, located by
    the Jinsha River in the southern Panxi rift valley. Panzhihua hosts the world''s largest vanadium-titanium
    magnetite deposit with approximately 570 million tons of accumulated tailings from V-Ti magnetite
    ore processing. The tailings contain elevated concentrations of vanadium (340 mg/kg, 2-fold higher
    than background), titanium, iron, copper (127 mg/kg), nickel (60 mg/kg), manganese (1200 mg/kg), and
    zinc (155 mg/kg). Environmental conditions are circumneutral pH (6.5-7.5), mesophilic temperature
    (20-30C), and oxidizing to moderately reducing depending on depth and revegetation status. The system
    is undergoing active in situ phytoremediation using nitrogen-fixing legumes (Pongamia pinnata, Leucaena
    leucocephala) that form symbioses with indigenous metal-tolerant rhizobia. Two-year revegetation periods
    have demonstrated significant shifts in microbial community structure toward rhizobia-dominated communities,
    with improvements in soil organic carbon content and enzyme activity. This perturbed environment represents
    a transition from barren contaminated tailings to rehabilitated vegetated soil through plant-microbe
    partnerships.

    '
taxonomy:
- taxon_term:
    preferred_term: Bradyrhizobium pachyrhizi
    term:
      id: NCBITaxon:280333
      label: Bradyrhizobium pachyrhizi
    gtdb_grounding_status: UNRESOLVED
    notes: 'Nitrogen-fixing alphaproteobacterium that forms root nodule symbioses with legumes in Panzhihua
      V-Ti magnetite tailings. Bradyrhizobium pachyrhizi is the dominant rhizobial genus in heavy metal
      contaminated tailings soil, comprising twelve of the metal-tolerant isolates from Pongamia pinnata
      nodules. Strain PP1 demonstrates exceptional characteristics: strongest nitrogen-fixing capacity
      among all isolates (increasing plant nitrogen content by 10-145% in shoots and 13-79% in roots),
      high tolerance to multiple heavy metals (Cu, Ni, Mn, Zn), and robust plant growth promotion through
      IAA production. The phenotype of strong N-fixing capacity coincides with resistance to multiple
      metal ions, explaining why Bradyrhizobium is the dominant genus in metal-contaminated soils. B.
      pachyrhizi establishes stable symbiotic relationships with P. pinnata in tailings, significantly
      improving plant biomass and metal phytoextraction efficiency. The organism contributes to soil quality
      improvement through nitrogen enrichment and stimulation of carbon transformation processes. Bradyrhizobium
      species possess adaptive mechanisms for metal detoxification including metal efflux systems, intracellular
      sequestration, and extracellular polysaccharide production that chelates metals. This species represents
      a critical biotechnology for coupling nitrogen fixation with heavy metal bioremediation in V-Ti
      tailings.

      '
