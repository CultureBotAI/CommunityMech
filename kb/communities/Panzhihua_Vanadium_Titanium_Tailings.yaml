    term:
      id: NCBITaxon:574561
      label: Rhizobium pisi
    gtdb_grounding_status: UNRESOLVED
    notes: 'Fast-growing nitrogen-fixing rhizobium traditionally associated with pea (Pisum sativum) but
      adapted to form nodules with P. pinnata in V-Ti tailings. One isolate was identified as R. pisi,
      demonstrating the promiscuity of rhizobial-legume associations under metal stress conditions. R.
      pisi contributes to nitrogen enrichment of tailings soil through symbiotic nitrogen fixation and
      produces plant growth-promoting substances including IAA. The presence of R. pisi indicates that
      phytoremediation legumes can recruit diverse rhizobial species from indigenous tailings microbiota,
      not limited to traditional host-specific symbionts. This metabolic flexibility enhances the resilience
      and effectiveness of legume-rhizobia partnerships in contaminated environments.

      '
