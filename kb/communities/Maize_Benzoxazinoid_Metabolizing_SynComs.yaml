ecological_interactions:
- name: Community-Dependent MBOA Redirection
  description: The seven-member metabolizing metSC formed predominantly HMPAA from MBOA, unlike LMB2 monoculture,
    which mainly formed AMPO. Removing Microbacterium LMB2 abolished marked MBOA degradation; removing any other
    single member still allowed HMPAA formation. LMB2 paired with five of six partners produced some HMPAA, with
    Bacillus LBA21 the exception. These perturbations support community-dependent conversion, not a unique required
    second partner or niche partitioning. Triplicate cultures were pooled for the principal metabolite profiles
    (n=1), and unstable intermediates, AMPO precipitation and unmeasured products preclude quantitative flux or
    carbon balance. A separate replicated five-hour LMB2 assay detected extracellular AMP, supporting intermediate
    availability, but BxdA localization, transport and partner acetylase identity remain unresolved. The canonical
    Bacteria entry is a roster placeholder, not a resolved strain.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: MBOA (6-methoxybenzoxazolin-2(3H)-one)
    term:
      id: CHEBI:195240
      label: 6-methoxy-2-benzoxazolinone
  downstream:
  - target: MBOA-Enhanced Metabolizing SynCom Performance
    description: PARTIAL - MBOA degradation could relieve antimicrobial inhibition and thereby support metSC performance,
      as proposed by the authors. The specific HMPAA redirection route was not selectively separated from degradation,
      HMPAA toxicity was not tested, and rich-medium detoxification is distinct from bulk growth in sole-carbon-source
      assays. This does not establish growth benefit to every member.
  evidence:
  - reference: PMID:40853002
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we designed two synthetic communities of maize root bacteria that share six common strains and differ
      in their ability to metabolize benzoxazinoids based on the seventh strain.
    explanation: Supports the contrasting seven-strain designs, not by itself the conversion mechanism.
  - reference: PMID:40853002
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the metSC formed HMPAA rather than AMPO
    explanation: Supports the measured alternative product in the primary Results; pooled profiles are qualitative,
      not replicated quantitative flux.
  participating_taxa:
  - preferred_term: maize root bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: MBOA-Tolerant Strain Enrichment
  description: MBOA changed relative 16S community composition in separate complex-medium flask experiments at 500
    and 2500 uM. Some tolerant members increased in fraction, but susceptible Chitinophaga LMN1 also increased,
    and Stenotrophomonas LST17 declined less in metSC than nonSC. Copy-number-adjusted relative profiles cannot
    resolve absolute growth of each member, and extraction bias may underrepresent Gram-positive inputs. This is
    not universal enrichment by tolerance, a measured niche-partitioning mechanism or independently established
    mediation of total growth. The single canonical bacterial placeholder does not identify the full roster.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: MBOA (6-methoxybenzoxazolin-2(3H)-one)
    term:
      id: CHEBI:195240
      label: 6-methoxy-2-benzoxazolinone
  evidence:
  - reference: PMID:40853002
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: MBOA shaped the differential compositions of both communities and increased the fraction of MBOA-tolerant
      strains.
    explanation: The abstract summarizes tolerant-strain enrichment; the primary Results also report increased susceptible
      LMN1 and explicitly limit absolute-growth inference from relative abundances.
  participating_taxa:
  - preferred_term: maize root bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
- name: MBOA-Enhanced Metabolizing SynCom Performance
  description: The metSC showed greater bulk growth than the alternate nonSC in the presence of MBOA. In separate
    minimal-medium assays it could grow with MBOA as the sole supplied carbon source, but bulk OD does not distinguish
    LMB2-only growth from use by other members. In complex medium, OD and total CFU supported higher metSC performance,
    while growth of both SynComs declined as MBOA increased. The authors interpret this mainly as detoxification
    in rich medium, not proof of HMPAA-specific protection, mutual benefit to all strains or enhanced maize performance
    in soil. The six shared strains and alternate seventh member are not resolved by the canonical Bacteria placeholder.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: MBOA (6-methoxybenzoxazolin-2(3H)-one)
    term:
      id: CHEBI:195240
      label: 6-methoxy-2-benzoxazolinone
  evidence:
  - reference: PMID:40853002
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: bacterial interaction results in alternative benzoxazinoid metabolization and increases community performance
      in the presence of these antimicrobial compounds.
    explanation: Supports community-level performance and the authors interaction interpretation; Results distinguish
      sole-carbon-source bulk growth from rich-medium inhibition and leave specific mediation unresolved.
  participating_taxa:
  - preferred_term: maize root bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  biological_processes:
  - preferred_term: biological process involved in interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
