id: CommunityMech:000101
name: Maize Benzoxazinoid-Metabolizing SynComs
description: Two maize root bacterial SynComs sharing six common strains and differing in a seventh benzoxazinoid-metabolizing
  member.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: RHIZOSPHERE
engineering_design:
  objective: Test how individual benzoxazinoid tolerance and metabolism traits combine at community scale.
  assembly_strategy: Two seven-strain synthetic communities of maize root bacteria with shared core strains
    and alternate benzoxazinoid-metabolizing capacity.
  perturbation_design: In vitro exposure to MBOA, a maize benzoxazinoid breakdown product.
  measurement_endpoints:
  - benzoxazinoid metabolization
  - community composition
  - strain interactions
  evidence:
  - &id001
    reference: PMID:40853002
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we designed two synthetic communities of maize root bacteria that share six common strains
      and differ in their ability to metabolize benzoxazinoids based on the seventh strain.
    explanation: Supports the defined synthetic community design and represented community context.
environment_term:
  preferred_term: rhizosphere
  term:
    id: ENVO:00005801
    label: rhizosphere
  notes: Maize root bacterial synthetic communities exposed to benzoxazinoid exudates.
taxonomy:
- taxon_term:
    preferred_term: maize root bacteria
    term:
      id: NCBITaxon:2
      label: Bacteria
  functional_role:
  - CROSS_FEEDER
  evidence:
  - *id001
ecological_interactions:
- name: Benzoxazinoid-Mediated Niche Partitioning
  description: Community members differ in benzoxazinoid tolerance and metabolism, redirecting metabolite
    fate.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - *id001
environmental_factors:
- name: defined synthetic community design
  value: Two seven-strain synthetic communities of maize root bacteria with shared core strains and alternate
    benzoxazinoid-metabolizing capacity.
  description: In vitro exposure to MBOA, a maize benzoxazinoid breakdown product.
  evidence:
  - *id001
related_ingredients:
- preferred_term: MBOA (6-methoxybenzoxazolin-2(3H)-one)
  chebi_term:
    id: CHEBI:195240
    label: 6-methoxy-2-benzoxazolinone
  relevance: MBOA is the maize benzoxazinoid breakdown product the SynComs were exposed
    to in vitro; the benzoxazinoid-metabolizing community redirects MBOA degradation
    toward an acetamide and can use MBOA as a sole carbon source, making it the central
    compound shaping community composition and function.
  evidence:
  - reference: PMID:40853002
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We exposed both communities to the benzoxazinoid MBOA (6-methoxybenzoxazolin-2(3H)-one)
      in vitro
    explanation: Names MBOA explicitly with its full chemical name (6-methoxybenzoxazolin-2(3H)-one),
      anchoring it as the benzoxazinoid the SynComs metabolize.
growth_media:
- name: 50% TSB (tryptic soy broth, 15 g/L)
  temperature: '28'
  temperature_unit: °C
  temperature_range: '25-28'
  incubation_time: '68'
  incubation_time_unit: h
  shaking_speed: '180'
  shaking_speed_unit: rpm
  vessel_type: 96-well plate
  preparation_notes: Strains routinely grown on 100% TSA plates or in liquid 50% TSB;
    SynComs grown in 96-well plates in 50% TSB supplemented with 500 µM MBOA for 68
    h; precultures grown to stationary phase over 4 days at 28°C, 180 rpm; community-structure
    assays used Erlenmeyer flasks; parallel minimal-medium assays used MBOA (500 or
    2,500 µM) or glucose as the sole carbon source.
  evidence:
  - reference: PMID:40853002
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'MRB collection, 8 ) were routinely grown on solid 100% TSA plates (30
      g/L tryptic soy broth and 15 g/L of agar, both Sigma-Aldrich) or in liquid 50%
      TSB medium (15 g/L tryptic soy broth) with 180 rpm shaking at 25–28°C.'
    explanation: Names 50% TSB medium, 180 rpm shaking, and 25–28°C for routine cultivation
      of the maize root bacteria.
  - reference: PMID:40853002
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pre-culture plates were covered with a Breathe-Easy membrane (Diversified
      Biotech, Dedham, USA) and grown until stationary phase for 4 days at 28°C and
      180 rpm.
    explanation: Gives preculture conditions (4 days, 28°C, 180 rpm) for the SynCom
      strains.
