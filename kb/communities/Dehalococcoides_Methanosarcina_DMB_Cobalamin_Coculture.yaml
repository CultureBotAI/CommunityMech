environmental_factors:
- name: DMB amendment
  value: 10 microM 5,6-dimethylbenzimidazole
  description: DMB was added to guide cobamide biosynthesis toward a cobalamin that supports Dehalococcoides
    activity and growth.
  evidence:
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: addition of DMB enabled guided biosynthesis and generated a cobalamin
    explanation: Supports the DMB-amended coculture condition.
- name: High cobalamin control
  value: 25 micrograms per liter CN-Cbl
  description: Higher cyanocobalamin amendment improved dechlorination and growth compared with limiting cobalamin.
  evidence:
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: up to 2.3-fold higher dechlorination rates
    explanation: Supports the positive cobalamin-amendment control.
- name: Limiting cobalamin stress
  value: 1 microgram per liter CN-Cbl
  description: Limiting cobalamin was depleted quickly and was associated with incomplete dechlorination.
  evidence:
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: reductive dechlorination of polychlorinated ethenes was incomplete
    explanation: Supports the limiting cobalamin stress condition.
