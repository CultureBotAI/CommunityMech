id: CommunityMech:000209
name: Dehalococcoides-Methanosarcina DMB-Guided Cobalamin Coculture
description: >
  A defined two-member chlorinated-ethene bioremediation coculture pairing
  Dehalococcoides mccartyi strain BAV1 with Methanosarcina barkeri strain Fusaro.
  D. mccartyi BAV1 is corrinoid auxotrophic and requires a cobalamin-type cofactor
  for organohalide respiration. M. barkeri Fusaro produces extracellular factor III,
  which did not by itself support Dehalococcoides reductive dechlorination activity,
  but addition of 5,6-dimethylbenzimidazole enabled guided biosynthesis of cobalamin
  that supported Dehalococcoides activity and growth. The system is relevant to DOE
  chlorinated-solvent groundwater bioremediation because it resolves a cofactor-mediated
  interaction controlling reductive dechlorination.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Test whether a methanogenic partner can support Dehalococcoides reductive dechlorination
    through cobamide production and guided cobalamin biosynthesis.
  assembly_strategy: Pair D. mccartyi BAV1 with M. barkeri Fusaro and amend with DMB to guide production
    of a cobalamin-like corrinoid compatible with Dehalococcoides organohalide respiration.
  perturbation_design: Compare cobalamin-limited cultures, high-cobalamin amendments, M. barkeri cocultures,
    and DMB-amended cocultures.
  measurement_endpoints:
  - Reductive dechlorination activity
  - Dehalococcoides growth
  - Extracellular cobamide production
  - Vinyl chloride accumulation or consumption
  evidence:
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: co-culture experiments were performed with the methanogen Methanosarcina barkeri strain Fusaro
    explanation: Supports the M. barkeri Fusaro coculture design.
  - reference: PMID:23479750
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: addition of DMB enabled guided biosynthesis and generated a cobalamin
    explanation: Supports the DMB-amended coculture as an activity- and growth-supporting design.
