ecological_interactions:
- name: Clostridial Hydrogen Supply for Reductive Debromination
  description: Clostridium strain Ma13 ferments glucose to supply hydrogen for reductive debromination by the highly
    enriched Dehalobacter FTH1 culture. The abstract supports this functional cross-feeding, not purity of the FTH1
    inoculum or a closed three-isolate community.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Clostridium sp.
    term:
      id: NCBITaxon:1485
      label: Clostridium
  target_taxon:
    preferred_term: Dehalobacter sp.
    term:
      id: NCBITaxon:56112
      label: Dehalobacter
  metabolites:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
  - preferred_term: hydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  downstream:
  - target: Dehalobacter Reductive Debromination of Tribromophenol
    description: 'Hydrogen generated from Clostridium glucose fermentation supplies the reductive Dehalobacter activity
      that converts 2,4,6-TBP toward phenol.

      '
  evidence:
  - reference: PMID:25461007
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Clostridium sp. strain Ma13 acting as a hydrogen supplier via glucose fermentation
    explanation: Anchors glucose as the electron-donor source fermented to hydrogen for debromination.
- name: Dehalobacter Reductive Debromination of Tribromophenol
  description: Combined Ma13 and enriched FTH1 activity converts 2,4,6-tribromophenol to phenol. Phenol supplies
    the substrate for strain DS introduced subsequently. This sequential resource delivery does not demonstrate
    a reciprocal benefit to FTH1 or obligate thermodynamic syntrophy.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Dehalobacter sp.
    term:
      id: NCBITaxon:56112
      label: Dehalobacter
  target_taxon:
    preferred_term: Desulfatiglans parachlorophenolica
    term:
      id: NCBITaxon:1261393
      label: Desulfatiglans parachlorophenolica
  metabolites:
  - preferred_term: 2,4,6-tribromophenol
    term:
      id: CHEBI:47696
      label: 2,4,6-tribromophenol
  - preferred_term: phenol
    term:
      id: CHEBI:15882
      label: phenol
  downstream:
  - target: Desulfatiglans Phenol Degradation
    description: Phenol formed by combined Ma13/FTH1 debromination provides the substrate for DS after its sequential
      introduction; this arrow describes the reported treatment sequence.
  evidence:
  - reference: PMID:25461007
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 2,4,6-TBP was debrominated to phenol by the combined action of Ma13 and FTH1
    explanation: Supports the Clostridium- and Dehalobacter-dependent conversion of tribromophenol to phenol.
  - reference: PMID:25461007
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 2,4,6-TBP was debrominated to phenol by the combined action of Ma13 and FTH1, then mineralized into
      CO2 by sequential introduction of DS
    explanation: Identifies phenol as the debromination intermediate channeled through the community.
- name: Desulfatiglans Phenol Degradation
  description: Desulfatiglans parachlorophenolica strain DS mineralizes the phenol intermediate after its sequential
    introduction. This is a recipient degradation outcome, not an observed DS-to-FTH1 benefit. The radiotracer confirmation
    used ring-labeled phenol, not labeled tribromophenol.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: phenol
    term:
      id: CHEBI:15882
      label: phenol
  downstream:
  - target: Anaerobic Halophenol Mineralization
    description: Sequential DS-mediated phenol degradation completes the aromatic mineralization route after debromination.
      Phenol radiotracing supports this terminal step, not a measured reciprocal benefit to the upstream culture.
  evidence:
  - reference: PMID:25461007
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 2,4,6-TBP was debrominated to phenol by the combined action of Ma13 and FTH1, then mineralized into
      CO2 by sequential introduction of DS
    explanation: Identifies phenol as the debromination intermediate channeled through the community.
  participating_taxa:
  - preferred_term: Desulfatiglans parachlorophenolica
    term:
      id: NCBITaxon:1261393
      label: Desulfatiglans parachlorophenolica
- name: Anaerobic Halophenol Mineralization
  description: The abstract reports anaerobic tribromophenol mineralization through glucose-fed hydrogen supply,
    debromination and subsequent DS-mediated phenol degradation. The three listed functional participants include
    an enriched FTH1 culture; they are not a proven exhaustive three-isolate membership. Sequential assembly and
    the phenol radiotracer assay must not be recast as simultaneous inoculation or direct tracing of labeled tribromophenol.
  scope: COMMUNITY_LEVEL
  metabolites:
