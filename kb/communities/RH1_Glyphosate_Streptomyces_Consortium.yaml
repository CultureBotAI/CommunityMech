discussions:
- discussion_id: rh1_glyphosate_pathway_genes
  prompt: Which genes and intermediate metabolites mediate glyphosate catabolism by the RH1 consortium?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#RH1 glyphosate biodegradation
  rationale: The paper explains that glyphosate degradation can proceed through the AMPA and sarcosine pathways and proposes
    phnJ, dadA, and soxA as future molecular targets; the authors state that functional genes were not directly characterized
    in this study. The RH1 record therefore asserts only the observed degradation, TOC, ATR-FTIR, and kinetic endpoints.
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although functional genes were not directly characterized in this study, the observed biodegradation behavior
      strongly indicates the involvement of conserved phosphonate-degrading genetic systems, warranting future molecular analyses
      targeting genes such as phnJ, dadA, and soxA.
    explanation: Supports leaving the proposed glyphosate-pathway genes as an open mechanistic gap.
