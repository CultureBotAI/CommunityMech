id: CommunityMech:000361
name: RH1 Glyphosate Streptomyces Consortium
description: A defined four-member actinobacterial consortium assembled from Streptomyces sp. SPA2, Streptomyces rochei IT,
  Streptomyces variabilis Herb, and Streptomyces griseoincarnatus SC for laboratory glyphosate biodegradation. The strains
  were mixed at a 1:1:1:1 ratio after separate ISP2 pre-culture and OD590 normalization, then incubated in mineral salt medium
  with glyphosate as the only carbon source. In 15-day 30 C shake-flask assays, RH1 removed glyphosate across 1-200 mg/L initial
  concentrations, reached 92.06% glyphosate removal and 91.03% total organic carbon reduction at 50 mg/L, and outperformed
  the matching single-strain treatments at that concentration. Higher glyphosate doses inhibited consortium growth and degradation,
  and the Haldane-Andrews model was the best fit to the initial-concentration growth-rate response.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Combine four compatible glyphosate-degrading Streptomyces isolates into actinobacterial consortium RH1 and quantify
    glyphosate degradation and substrate-inhibition kinetics.
  assembly_strategy: Use Streptomyces sp. SPA2, Streptomyces rochei IT, Streptomyces variabilis Herb, and Streptomyces griseoincarnatus
    SC, each previously validated for glyphosate degradation, after confirming the absence of visible antagonism among the
    tested actinobacteria on ISP2 agar.
  inoculation_strategy: Pre-culture each member separately in liquid ISP2 medium, normalize washed cell suspensions to OD590
    1.0, and mix the four strains in a 1:1:1:1 ratio for 4% inoculation into mineral salt medium containing glyphosate.
  perturbation_design: Expose RH1 to glyphosate supplied as the sole carbon source at 1, 10, 25, 50, 100, and 200 mg/L to
    measure concentration-dependent growth inhibition and biodegradation.
  measurement_endpoints:
  - dry-weight growth kinetics
  - colorimetric residual glyphosate quantification
  - total organic carbon reduction at 50 mg/L glyphosate
  - ATR-FTIR spectra of glyphosate before and after RH1 incubation
  - Haldane-Andrews, Yano and Koga, Tseng and Wayman, Webb, and Levenspiel model fits
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The bacterial strains Streptomyces sp. strain SPA2 (accession number pp413753), Streptomyces rochei. strain IT
      (accession number pp413751), Streptomyces variabilis. strain Herb (accession number pp413750), and Streptomyces griseoincarnatus.
      strain SC (accession number PP413754 ) previously isolated and tested for the degradation of glyphosate
    explanation: Names the four actinobacterial strains assembled into RH1 and links them to prior glyphosate-degradation
      assays.
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results showed an absence of antagonistic interactions among the tested actinobacteria, which indicates their
      potential compatibility for co-cultivation as a defined microbial consortium
    explanation: Supports the compatibility screen used before cultivating the four strains together.
