ecological_interactions:
- name: RH1 glyphosate biodegradation
  description: The four Streptomyces members were compatible in the antagonism assay and, as the RH1 mixed culture, degraded
    glyphosate at all tested initial concentrations. At 50 mg/L glyphosate, RH1 exceeded the previously reported single-strain
    removal and TOC-reduction rates. Pairwise exchange metabolites and glyphosate-catabolic genes were not directly resolved.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glyphosate
    term:
      id: CHEBI:27744
      label: glyphosate
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: RH1 total organic carbon reduction
    description: Glyphosate transformation by the mixed RH1 culture reduced TOC after 15 days at 50 mg/L initial glyphosate.
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The antagonism test of strains Herb, IT, SC, and SPA2 showed a negative result, which explains that these actinobacterial
      strains could be cultured together to form the consortium RH1.
    explanation: Supports compatibility among the four Streptomyces members before glyphosate-degradation testing.
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium RH1 degraded 92.06% of the initial glyphosate concentration (50 mg/L) within 15 days under optimal
      conditions (Temperature 30 °C, pH 7.2, and inoculum volume 4%).
    explanation: Supports the RH1 degradation endpoint and its comparison concentration.
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This rate of biodegradation is maximal compared to the single strains Herb, IT, SC, and SPA2, which degraded
      78.36%, 48.82%, 73.56%, and 68.22% respectively, at the same conditions
    explanation: Supports the consortium-level improvement over the four individual members.
- name: RH1 total organic carbon reduction
  description: At 50 mg/L initial glyphosate, the RH1 consortium removed 91.03% of measured total organic carbon over the
    15-day incubation, supporting substantial transformation of glyphosate-derived organic carbon.
  interaction_type: MUTUALISM
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: glyphosate
    term:
      id: CHEBI:27744
      label: glyphosate
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results of the reduction of total organic carbon by the actinobacteria consortium RH1, using glyphosate as
      the sole carbon source at a concentration of 50 mg/L, showed that the consortium was able to eliminate 91.03% of the
      total organic carbon during a 15-day incubation period.
    explanation: Supports TOC reduction by RH1 at the 50 mg/L glyphosate comparison point.
environmental_factors:
- name: Initial glyphosate concentration range
  value: 1, 10, 25, 50, 100, and 200
  unit: mg/L
  description: RH1 was challenged with a 1-200 mg/L initial glyphosate series.
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: glyphosate at different concentrations (1 mg/L, 10 mg/L, 25 mg/L, 50 mg/L, 100 mg/L, and 200 mg/L)
    explanation: Supports the tested initial glyphosate concentration range.
- name: High-glyphosate substrate inhibition
  value: 54.11% at 100 mg/L; 37.08% at 200 mg/L
  description: The two highest tested initial glyphosate concentrations inhibited RH1 growth and biodegradation relative to
    lower-dose cultures.
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At the highest tested concentration, 200 mg/L, a low percentage of biodegradation was observed (37.08%), as well
      as a moderate percentage (54.11%) at the concentration 100 mg/L.
    explanation: Supports reduced glyphosate degradation at the two highest tested concentrations.
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The highest glyphosate concentrations inhibit its own biodegradation by the consortium RH1.
    explanation: Supports substrate inhibition as the paper's interpretation of the high-concentration response.
- name: Maximum tested 50 mg/L glyphosate removal
  value: '92.06'
  unit: percent
  description: The RH1 consortium removed the reported fraction of 50 mg/L glyphosate in the 15-day assay.
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consortium RH1 degraded 92.06% of the initial glyphosate concentration (50 mg/L) within 15 days under optimal
      conditions
    explanation: Supports the 50 mg/L glyphosate-removal endpoint.
- name: Haldane-Andrews growth model fit
  value: R2 0.976, F 65.49, P 0.00074
  description: The Haldane-Andrews substrate-inhibition model best fit RH1 growth-rate data.
  evidence:
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The experimental data best fit the Haldane-Andrews kinetic model, having F, P, and R\n\n2\n values of 65.49,\
      \ 0.00074, and 0.976, respectively"
    explanation: Supports the selected growth-inhibition kinetic model.
