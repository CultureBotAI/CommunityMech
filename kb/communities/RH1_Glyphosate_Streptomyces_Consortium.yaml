      100 mL of Mineral salt medium (MSM) with glyphosate at different concentrations (1 mg/L, 10 mg/L, 25 mg/L, 50 mg/L,
      100 mg/L, and 200 mg/L)
    explanation: Supports the strain ratio, vessel, working volume, basal medium, and glyphosate dose series.
  - reference: PMID:42582159
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The flasks were incubated at 30 °C under agitation at 200 rpm for 15 days.
    explanation: Supports the incubation temperature, agitation speed, and assay duration.
