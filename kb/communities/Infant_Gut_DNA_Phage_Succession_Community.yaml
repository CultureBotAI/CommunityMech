    evidence_source: IN_VIVO
    snippet: more prevalent in full-term than in preterm infants
    explanation: Supports the birth-status effect.
- name: Host CRISPR-Cas locus prevalence
  value: maternal seeding plus CRISPR-Cas and stop-codon recoding
  description: Maternal seeding, host CRISPR-Cas locus prevalence, phage
    stop-codon reassignment, and phage diversity together contribute to stable
    viral colonization.
  evidence:
