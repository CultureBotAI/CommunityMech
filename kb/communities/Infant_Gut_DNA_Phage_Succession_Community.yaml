id: CommunityMech:000223
name: Infant Gut DNA Phageome Succession Community
description: >
  A longitudinal infant gut DNA bacteriophage community reconstructed from 819
  fecal metagenomes from 28 full-term and 24 preterm infants and their mothers
  across the first 3 years of life, using a large phage sequence database and
  strain-resolved analyses. Early-life phageome richness increases over time
  and reaches adult-like complexity by age 3. Approximately 9 percent of early
  phage colonizers persist for 3 years and are predominantly maternally
  transmitted phages infecting Bacteroides, with higher persistence in
  full-term infants. Phages with stop-codon reassignment are more likely to
  persist than non-recoded phages, and in-frame reassigned stop codons increase
  over the 3-year window. Maternal seeding, stop-codon reassignment, host
  CRISPR-Cas locus prevalence, and phage diversity together drive stable viral
  colonization.
