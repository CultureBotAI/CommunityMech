  term:
    id: ENVO:00001997
    label: acid mine drainage
  notes: 'Natural acid mine drainage from the Rio Tinto River, southwestern Spain (Huelva province), flowing
    100 km through the Iberian Pyrite Belt with massive sulfide ore deposits. The river exhibits constant
    acidic pH (mean 2.2, range 1.0-2.5) maintained by natural pyrite oxidation, not active mining. High
    metal concentrations include Fe (2.3 g/L), Cu (0.11 g/L), Zn (0.22 g/L). The river forms stromatolite-like
    iron oxide precipitates and supports complex microbial-eukaryotic communities despite extreme conditions.
    Temperature is temperate (15-25°C), oxygen-rich from surface flow.

    '
