- name: Complementary Iron and Sulfur Oxidation
  description: 'Acidithiobacillus ferrooxidans complements Leptospirillum iron oxidation by providing
    dual metabolic capability for both iron and sulfur oxidation. While Leptospirillum specializes in
    Fe²⁺ oxidation, At. ferrooxidans oxidizes both Fe²⁺ and reduced sulfur compounds to sulfuric acid,
    removing sulfur that would otherwise passivate mineral surfaces and inhibit iron oxidation. This metabolic
    partnership enhances overall iron cycling efficiency and maintains acidic conditions through sulfuric
    acid production. At. ferrooxidans contributes ~25% of prokaryotic community, providing functional
    redundancy in iron oxidation and additional sulfur removal capacity. The organism is chemolithoautotrophic,
    fixing CO₂ via Calvin cycle and contributing to the autotrophic carbon base alongside Leptospirillum.

    '
