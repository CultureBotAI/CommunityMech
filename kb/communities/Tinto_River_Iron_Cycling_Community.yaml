ecological_interactions:
- name: Iron Oxidation and Acid Generation
  description: 'PARTIAL: the 2003 river survey and isolate physiology support L. ferrooxidans and A. ferrooxidans
    as principal iron oxidizers. Their conversion of ferrous to ferric iron supplies the iron cycle; ferric iron
    also contributes to acidic buffering. Iron oxidation itself consumes protons and must not be equated with sulfuric-acid
    production. The field-derived model does not demonstrate mutual benefit or a universal species abundance, iron
    concentration or pH.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: Fe(II)
    term:
      id: CHEBI:29033
      label: iron(2+)
  - preferred_term: Fe(III)
    term:
      id: CHEBI:29034
      label: iron(3+)
  downstream:
  - target: Heterotrophic Carbon-Iron Coupling
    description: 'PARTIAL: oxidation supplies ferric iron that Acidiphilium can use as an electron acceptor during
      organic-carbon respiration, connecting the oxidative and reductive arms of the authors'' iron-cycle model.
      This is not a measured transfer of autotroph-derived organic carbon or a quantified in situ exchange flux.'
  evidence:
