- name: Fungal Organic Matter Degradation and Biofilm Formation
  description: 'Basidiomycota fungi including acidophilic black yeasts (Hortaea werneckii) contribute
    to organic matter degradation, biofilm formation, and nutrient cycling through extracellular enzyme
    secretion. Fungi decompose complex organic polymers from algal biomass and microbial necromass, releasing
    simpler compounds available to heterotrophic bacteria like Acidiphilium. Fungal hyphae and biofilms
    provide structural scaffolding for stromatolite-like iron oxide precipitates, enhancing community
    spatial organization. The acidophilic fungi tolerate extreme pH and metal concentrations, forming
    a eukaryotic decomposer guild that complements bacterial heterotrophs. Fungal presence indicates functional
    redundancy in organic matter processing, contributing to the ecosystem resilience observed in Rio
    Tinto despite extreme environmental stress.

    '
