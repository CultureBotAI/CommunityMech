  status: OPEN
  prompt: Which phototrophic or fungal products actually support Acidiphilium carbon and iron metabolism?
  rationale: 'The primary fungal isolation abstract (PMID15644909) includes basidiomycete and ascomycete yeasts;
    Basidiomycota presence is not rejected. It does not establish the removed exchange/scaffolding mechanism. Hortaea
    werneckii belongs to Ascomycota (NCBITaxon91943), so it cannot justify that Basidiomycota assignment. Taxon-specific
    carbon tracing and coordinated fungal identity curation are needed before reinstating a causal exchange. Non-graph
    identities, abundances and redox descriptions remain issue #1898.'
