- name: Heterotrophic Carbon-Iron Coupling
  description: 'Acidiphilium links iron and carbon cycles by consuming organic matter from algal exudates
    and autotroph biomass while also performing Fe²⁺ oxidation in mixotrophic mode. This coupling enables
    nutrient remineralization that sustains autotrophic production, creating a closed biogeochemical cycle
    despite extreme oligotrophic conditions.

    '
