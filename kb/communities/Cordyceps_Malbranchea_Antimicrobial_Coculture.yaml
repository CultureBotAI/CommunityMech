id: CommunityMech:000453
name: Cordyceps-Malbranchea Antimicrobial Coculture
description: A defined two-fungus coculture pairing Cordyceps militaris ZYb8 with Malbranchea ostraviensis SS1 for
  natural-product discovery. Yang et al. 2026 used LC-MS/MS molecular networking and compound isolation to show that the
  coculture produced eight previously undescribed aromatic compounds, including eutypoid G-K, gotjawalides A-B, and
  ocauxarthrol B, along with eleven known natural products; antibacterial assays on the isolated products found weak to
  moderate selective activity against Gram-positive and Gram-negative pathogens.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Recover and characterize antimicrobial specialized metabolites from a laboratory coculture of C. militaris
    ZYb8 and M. ostraviensis SS1.
  assembly_strategy: Grow C. militaris ZYb8 together with M. ostraviensis SS1 and profile the coculture by LC-MS/MS-based
    molecular networking before chromatographic isolation and structural elucidation of enriched compounds.
  measurement_endpoints:
  - LC-MS/MS molecular networking
  - natural-product isolation
  - NMR, HRESIMS, UV, and IR structure elucidation
  - antimicrobial activity by minimum inhibitory concentration
  evidence:
  - reference: PMID:42543088
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: LC-MS/MS-based molecular networking analysis
    explanation: Supports mass-spectrometry-guided metabolite profiling of the two-fungus coculture.
  - reference: PMID:42543088
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: were isolated from the coculture of Cordyceps militaris ZYb8 and Malbranchea ostraviensis SS1.
    explanation: Supports the exact two-strain fungal coculture and natural-product isolation workflow.
