id: CommunityMech:000508
name: Hexamine Formaldehyde Consortium C4
description: Consortium C4 is a defined three-member hexamine- and formaldehyde-removing bacterial formulation assembled from
  environmental isolates Brucella pseudintermedia SRCHD05, Ochrobactrum sp. SRCHD06, and Brucella pseudintermedia SRCHD07
  at a 1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius. Over 24, 48, and 72 h of suspended-culture
  incubation, C4 achieved 71.13%, 83.62%, and 91.11% hexamine reduction, 42.11%, 43.76%, and 45.64% formaldehyde reduction,
  and 4.81%, 14.26%, and 19.61% COD reduction while producing 19.98%, 23.67%, and 24.63% ammonia.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate the defined 3-isolate combination Consortium C4 (SRCHD05, SRCHD06, SRCHD07 at a 1:1:1 ratio) for removal
    of hexamine, its formaldehyde by-product, and chemical oxygen demand in suspended AS broth as part of the C1-C6 consortium
    development series.
  assembly_strategy: Select five hexamine-, formaldehyde-, and COD-removing environmental isolates (SRCHD03, SRCHD04, SRCHD05,
    SRCHD06, and SRCHD07) and test defined equal-ratio combinations C1-C6 in 50 mg/L hexamine AS broth at 37 degrees Celsius.
  inoculation_strategy: Combine Brucella pseudintermedia SRCHD05, Ochrobactrum sp. SRCHD06, and Brucella pseudintermedia SRCHD07
    at a 1:1:1 ratio in AS broth containing 50 mg/L hexamine at 37 degrees Celsius and sample cell-free supernatants at 24,
    48, and 72 h.
  perturbation_design: Compare Consortium C4 across 24, 48, and 72 h incubation intervals against sibling consortia in the
    C1-C6 combinatorial assembly series in AS broth supplemented with 50 mg/L hexamine at 37 degrees Celsius.
  measurement_endpoints:
  - hexamine removal
  - formaldehyde removal
  - chemical oxygen demand removal
  - ammonia production
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on their hexamine, formaldehyde, and COD removal ability, five isolates were selected for consortium development
    explanation: Supports the bioremediation phenotype screen used to select the five isolates for C1-C5 consortium development.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '4 SRCHD05: SRCHD06: SRCHD07 (1:1:1) C4'
    explanation: Reports the Table 1 Consortium C4 assembly combining isolates SRCHD05, SRCHD06, SRCHD07 at a 1:1:1 ratio.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C4 71.13 83.62 91.11 42.11 43.76 45.64 4.81 14.26 19.61 19.98 23.67 24.63
    explanation: Quantifies Consortium C4 24 h, 48 h, and 72 h hexamine reduction, formaldehyde reduction, COD reduction,
      and ammonia production in suspended AS broth.
