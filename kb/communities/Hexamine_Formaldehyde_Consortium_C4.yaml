ecological_interactions:
- name: C4 suspended-culture hexamine, formaldehyde, and COD removal
  description: In suspended AS broth containing 50 mg/L hexamine at 37 degrees Celsius, the 1:1:1 Brucella pseudintermedia
    SRCHD05, Ochrobactrum sp. SRCHD06, and Brucella pseudintermedia SRCHD07 consortium (C4) achieved 71.13%, 83.62%, and 91.11%
    hexamine reduction, 42.11%, 43.76%, and 45.64% formaldehyde reduction, and 4.81%, 14.26%, and 19.61% COD reduction at
    24, 48, and 72 h, accompanied by 19.98%, 23.67%, and 24.63% ammonia production. Adding the rapidly growing isolate SRCHD07
    (>66% hexamine and 38% formaldehyde reduction at 24 h in monoculture) increased 24-72 h hexamine and formaldehyde removal
    relative to C1-C3, but these bulk-chemistry outcomes in nutrient-containing AS broth do not establish complete mineralization,
    strain-resolved conversion, or consortium ammonia removal.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    notes: Ammonia was produced as a hexamine breakdown by-product in the suspended-C4 assay (Table 2); a consortium ammonia
      sink is not established.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C4 71.13 83.62 91.11 42.11 43.76 45.64 4.81 14.26 19.61 19.98 23.67 24.63
    explanation: Quantifies the 24 h, 48 h, and 72 h bulk hexamine, formaldehyde, and COD reduction percentages and ammonia
      production percentages for Consortium C4 in suspended AS broth.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The direct hexamine quantification data revealed all isolates to be efficient in removing hexamine after 48 h
      of incubation, while isolate SRCHD07 showed more than 66% reduction at 24th h of incubation ( Figure 2A ), indicating
      rapid removal of hexamine from the very beginning.
    explanation: Provides the 24 h monoculture hexamine-removal benchmark (>66%) for Brucella pseudintermedia SRCHD07, which
      distinguishes Consortium C4 from C1-C3.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The isolate SRCHD07 showed the highest formaldehyde reduction (38%) at 24 h of incubation, followed by SRCHD08,
      SRCHD09, and SRCHD10 (30.72, 25.40, and 23.21, respectively).
    explanation: Provides the 24 h monoculture formaldehyde-reduction benchmark (38%) for Brucella pseudintermedia SRCHD07.
