discussions:
- discussion_id: c4-molecular-division-of-labor
  prompt: The source quantified community-level Consortium C4 removal of hexamine, formaldehyde, and COD and simultaneous
    ammonia production in suspended AS broth, but did not resolve which member genes or inter-strain metabolic exchanges mediate
    hexamine hydrolysis, formaldehyde detoxification/assimilation, or post-inoculation strain abundance.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#C4 suspended-culture hexamine, formaldehyde, and COD removal
  rationale: The article explicitly leaves Ochrobactrum/Brevundimonas functional interactions for a future molecular study,
    so this record does not assert a pairwise metabolic edge inside Consortium C4. Bulk hexamine, formaldehyde, and COD reduction
    in nutrient-containing AS broth (1% tryptone, 0.5% yeast extract, 50 mg/L hexamine) do not establish complete mineralization,
    strain-resolved substrate flux, or post-inoculation persistence of every assembled isolate, and Table 2 reports ammonia
    production rather than consortium ammonia removal.
  evidence:
  - reference: PMID:41743136
    reference_title: Bioremediation of hexamine and formaldehyde using a radio-tolerant bacterial consortium for efficient
      pollutant and COD removal
    supports: SUPPORT
    evidence_source: full_text
    snippet: Ochrobactrum sp. and Brevundimonas diminuta have been shown to harbor genes with functional interactions, which
      could be further detailed in a future study to understand the underlying molecular mechanism of bioremediation in the
      current context.
    explanation: Documents the authors' stated need for a future molecular study to resolve inter-strain functional mechanisms.
  posed_by: antigravity
  posed_date: '2026-11-05'
