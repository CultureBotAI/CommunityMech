discussions:
- discussion_id: sfum-ddes-partitioning-of-sulfate-vs-iet-flux
  prompt: Although comparative proteomics confirms that S. fumaroxidans expresses both dissimilatory sulfate-reduction enzymes
    and interspecies formate/hydrogen transfer complexes while D. desulfuricans expresses AprA and FDH3 during growth on 20
    mM propionate and 20 mM sulfate, what fraction of propionate-derived electrons is routed through S. fumaroxidans' own
    sulfate reduction versus interspecies formate and H2 transfer to D. desulfuricans?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Syntrophic Propionate Oxidation with Interspecies Formate and Hydrogen Transfer
  rationale: The coculture cells of S. fumaroxidans and D. desulfuricans were not separated by Percoll gradient centrifugation
    (which was applied only to the S. fumaroxidans + M. hungatei coculture), and bulk substrate/product monitoring does not
    partition sulfate reduction flux between the two sulfate-reducing partners or separate formate versus H2 electron transfer
    flux quantitatively.
  evidence:
  - reference: PMID:29611893
    reference_title: Comparative proteome analysis of propionate degradation by Syntrophobacter fumaroxidans in pure culture
      and in coculture with methanogens.
    supports: SUPPORT
    evidence_source: full_text
    snippet: Only cells from the syntrophic coculture of S. fumaroxidans and M. hungatei were separated by Percoll gradient
      centrifugation (Percoll®, Sigma‐Aldrich, Missouri) as described elsewhere (De Bok et al., 2002b ).
    explanation: Confirms that Percoll physical cell separation was performed only for the M. hungatei coculture, not for
      the D. desulfuricans coculture.
  posed_by: antigravity
  posed_date: '2026-11-05'
