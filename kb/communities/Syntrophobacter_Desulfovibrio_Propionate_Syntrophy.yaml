ecological_interactions:
- name: Syntrophic Propionate Oxidation with Interspecies Formate and Hydrogen Transfer
  description: Syntrophobacter fumaroxidans MPOB (DSM 10017) oxidizes propionate via the methylmalonyl-CoA pathway in batch
    coculture with Desulfovibrio desulfuricans G11 (DSM 7057) on 20 mM propionate and 20 mM sulfate, simultaneously expressing
    its dissimilatory sulfate reduction pathway (Sat, HppA, AprAB, DsrAB, DsrC, QmoABC, DsrMKJOP, and the sulfate-specific
    confurcating complex HdrABC/HdrL Sfum_0819-0824) together with reverse electron transport and interspecies electron transfer
    enzymes (confurcating cytoplasmic Fdh1 and Hox, periplasmic Fdh2 and Hyn Sfum_2952-53, and fumarate reductase FrdABEF
    Sfum_4092-4095) that release formate and H2 to D. desulfuricans G11.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Syntrophobacter fumaroxidans
    term:
      id: NCBITaxon:119484
      label: Syntrophobacter fumaroxidans
  target_taxon:
    preferred_term: Desulfovibrio desulfuricans
    term:
      id: NCBITaxon:876
      label: Desulfovibrio desulfuricans
  metabolites:
  - preferred_term: propionate
    term:
      id: CHEBI:30768
      label: propionic acid
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  biological_processes:
  - preferred_term: propionate catabolic process
    term:
      id: GO:0019543
      label: propionate catabolic process
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
  downstream:
  - target: Hydrogen- and Formate-Coupled Dissimilatory Sulfate Reduction
    description: Interspecies formate and hydrogen released during propionate oxidation by S. fumaroxidans MPOB supply the
      electron donors required for dissimilatory sulfate reduction by D. desulfuricans G11 in the propionate-plus-sulfate
      coculture; separate formate versus hydrogen flux partitioning and relative sulfate-reduction rates between the two sulfate
      reducers were not independently resolved.
  evidence:
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The proteomic profiles of both bacteria in the coculture of S. fumaroxidans with D. desulfuricans give insight
      in the metabolic flexibility of S. fumaroxidans. Results showed a proteomic profile of S. fumaroxidans in which sulfate
      reduction took place, while energy conservation and IET mechanisms were also used similarly as in the syntrophic associations
      with methanogens. The proteomic analysis of the partner D. desulfuricans confirmed IET via formate and hydrogen carried
      on by S. fumaroxidans in a sulfate rich environment.
    explanation: Demonstrates that S. fumaroxidans combines sulfidogenic metabolism with interspecies formate and hydrogen
      transfer to D. desulfuricans during coculture growth on propionate and sulfate.
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Considering the high levels of Hyn and FrdABEF in the coculture with D. desulfuricans, we suggest that indeed
      Hyn is involved in RET with FrdABEF, whether reducing fumarate in fumarate conditions or reversibly oxidizing succinate
      in the coculture with D. desulfuricans (Fig. 4 ).
    explanation: Details the periplasmic hydrogenase Hyn and FrdABEF reverse electron transport mechanism active in S. fumaroxidans
      during coculture with D. desulfuricans.
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The abundance of the proteins involved in sulfate reduction confirm that D. desulfuricans was actively reducing
      sulfate for which it certainly needed electron donors which could only come from S. fumaroxidans in such growth condition.
    explanation: Directly links electron-donor transfer (formate and hydrogen) from S. fumaroxidans propionate oxidation to
      active sulfate reduction by D. desulfuricans.
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Two of the three predicted heterodisulfide reductases‐like enzymes in S. fumaroxidans were detected in this
      study, one associated with a flavin oxidoreductase complex Hdr/Flox (Sfum_1970–1977) and the other with a multicomplex
      that includes an HdrL, a MvhD and an FeS electron transfer protein: HdrABC/HdrL (Sfum_0819–0824). The Flox section of
      Hdr/Flox is produced in all conditions. HdrABC/HdrL was abundant when sulfate was present whereas only the subunits
      containing FAD/NAD‐binding domains were detected in syntrophic cultures.'
    explanation: Demonstrates that the heterodisulfide reductase-like multicomplex HdrABC/HdrL (Sfum_0819-0824) is abundant
      in S. fumaroxidans MPOB whenever sulfate is available (including the propionate-plus-sulfate coculture with D. desulfuricans
      G11) alongside constitutive Hdr/Flox (Sfum_1970-1977).
- name: Hydrogen- and Formate-Coupled Dissimilatory Sulfate Reduction
  description: Desulfovibrio desulfuricans G11 (DSM 7057), which cannot oxidize propionate directly, grows in a 1:2 ratio
    with S. fumaroxidans MPOB (317 core proteins detected in coculture versus >750 in axenic formate or H2 cultures, separated
    along PC1 explaining ~70% of proteomic variance) by coupling periplasmic formate dehydrogenase FDH3 (G11_11530-11545),
    periplasmic hydrogenase Hyd-3 (G11_06350-06355), cytoplasmic FDH1 (G11_05250-05260), and cytoplasmic Hyd-1 (G11_01905-01920)
    to dissimilatory sulfate reduction via highly abundant AprA (G11_01440).
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Syntrophobacter fumaroxidans
    term:
      id: NCBITaxon:119484
      label: Syntrophobacter fumaroxidans
  target_taxon:
    preferred_term: Desulfovibrio desulfuricans
    term:
      id: NCBITaxon:876
      label: Desulfovibrio desulfuricans
  metabolites:
  - preferred_term: formate
    term:
      id: CHEBI:15740
      label: formate
  - preferred_term: dihydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  - preferred_term: sulfate
    term:
      id: CHEBI:16189
      label: sulfate
  biological_processes:
  - preferred_term: dissimilatory sulfate reduction
    term:
      id: GO:0019420
      label: dissimilatory sulfate reduction
  evidence:
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although fewer D. desulfuricans proteins were detected in cells grown in coculture with S. fumaroxidans, proteins
      required for sulfate reduction such as AprA (G11_01440) were found among the ten most abundant proteins along with a
      periplasmic formate dehydrogenase (FDH3; G11_11530–11545)
    explanation: Confirms high abundance of sulfate-reduction enzyme AprA (G11_01440) and periplasmic formate dehydrogenase
      FDH3 (G11_11530) in D. desulfuricans G11 grown in coculture with S. fumaroxidans.
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: D. desulfuricans is a sulfate reducer that utilizes lactate, ethanol, hydrogen and formate in the presence of
      sulfate, but not acetate, propionate, butyrate or glucose (McInerney et al., 1979 ). Therefore, a syntrophic relationship
      with S. fumaroxidans, in which hydrogen and formate are produced, would be beneficial for D. desulfuricans.
    explanation: Explains why D. desulfuricans depends on S. fumaroxidans for hydrogen and formate electron donors in propionate-sulfate
      medium.
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The first principal component (PC1; ∼ 70% of total variance) clearly separates growth in coculture from axenic
      growth in formate or hydrogen. However, PC1 did not establish a difference between growth on hydrogen or on formate.
    explanation: Demonstrates by principal component analysis that the D. desulfuricans G11 proteome in syntrophic coculture
      with S. fumaroxidans MPOB forms a distinct state separated along PC1 (~70% of variance) from axenic formate- or H2-grown
      cells.
