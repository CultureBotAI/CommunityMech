id: CommunityMech:000510
name: Syntrophobacter-Desulfovibrio Propionate Syntrophy
description: A defined two-member anaerobic syntrophic coculture of the propionate-oxidizing bacterium Syntrophobacter fumaroxidans
  strain MPOBT (DSM 10017) and the sulfate-reducing bacterium Desulfovibrio desulfuricans strain G11 (DSM 7057) grown in batch
  culture with 20 mM propionate and 20 mM sulfate at 37 degrees Celsius under a pressurized (172 kPa) N2/CO2 (80:20, vol/vol)
  atmosphere. Comparative quantitative proteomics across pure-culture and syntrophic conditions showed that S. fumaroxidans
  simultaneously performed sulfidogenic metabolism and interspecies electron transfer (IET) via formate and hydrogen to D.
  desulfuricans at a 2:1 cell ratio, while D. desulfuricans expressed sulfate-reduction enzymes (including AprA, G11_01440)
  and periplasmic formate dehydrogenase (FDH3, G11_11530) to couple interspecies formate and H2 oxidation to sulfate reduction.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Characterize the proteomic profile and interspecies electron transfer (IET) mechanisms of Syntrophobacter fumaroxidans
    MPOBT (DSM 10017) grown in coculture with the non-methanogenic sulfate-reducing partner Desulfovibrio desulfuricans strain
    G11 (DSM 7057) on 20 mM propionate and 20 mM sulfate.
  assembly_strategy: Pair the propionate-oxidizing syntroph Syntrophobacter fumaroxidans MPOBT (DSM 10017) with the hydrogen-
    and formate-scavenging sulfate reducer Desulfovibrio desulfuricans strain G11 (DSM 7057), which cannot oxidize propionate
    directly, and adapt the coculture over at least five transfers prior to mid-exponential proteomic harvesting.
  inoculation_strategy: Inoculate triplicate 1 L batch flasks (550 mL basal medium with 20 mM propionate and 20 mM sulfate
    under 172 kPa N2/CO2 80:20 vol/vol at 37 degrees Celsius) with coculture cells adapted through at least five serial transfers.
  perturbation_design: Compare the S. fumaroxidans + D. desulfuricans coculture (20 mM propionate + 20 mM sulfate) against
    axenic S. fumaroxidans (20 mM propionate + 60 mM fumarate or 20 mM propionate + 20 mM sulfate), methanogenic cocultures
    with M. hungatei JF1T or M. formicicum MFT (30 mM propionate), and axenic D. desulfuricans G11 (20 mM sulfate + 40 mM
    formate or 1.7 atm H2/CO2).
  measurement_endpoints:
  - quantitative label-free proteomics (iBAQ and Z-score normalized abundance)
  - substrate consumption and product formation (propionate, sulfate, acetate, succinate, malate, sulfide)
  - phase-contrast microscopic partner ratio (2:1 S. fumaroxidans to D. desulfuricans)
  evidence:
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A coculture of S. fumaroxidans with Desulfovibrio desulfuricans strain G11 (DSM 7057; Sheik et al., 2017 ) was
      grown with 20 mM propionate and 20 mM sulfate. Axenic cultures of D. desulfuricans were grown with 20 mM sulfate and
      40 mM formate or hydrogen (1.7 atm H2/CO2 80:20 vol/vol).
    explanation: Establishes the defined coculture composition (S. fumaroxidans MPOBT with D. desulfuricans strain G11 / DSM
      7057) and substrate regime (20 mM propionate and 20 mM sulfate) alongside axenic D. desulfuricans controls.
  - reference: PMID:29611893
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By comparing the proteomic profile of S. fumaroxidans grown in coculture with D. desulfuricans with the proteomic
      profiles of the other known syntrophic lifestyles, and the sulfidogenic condition, we expect to be able to define the
      symbiotic relationship of S. fumaroxidans with D. desulfuricans.
    explanation: Documents the experimental design objective comparing the S. fumaroxidans + D. desulfuricans coculture against
      methanogenic syntrophic and axenic sulfidogenic lifestyles.
