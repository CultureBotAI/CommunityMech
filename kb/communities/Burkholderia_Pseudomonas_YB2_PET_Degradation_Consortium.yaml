id: CommunityMech:000426
name: Burkholderia-Pseudomonas YB2 PET Degradation Consortium
description: >
  A defined two-strain synthetic consortium, YB2, constructed from
  Burkholderia cepacia ZY1 and Pseudomonas harudinis G1B at an optimized 4:5
  inoculation ratio to improve polyethylene terephthalate (PET)
  depolymerization and downstream PET-hydrolysis-product conversion. At pH 7.0
  and 30 °C, YB2 reached 4.30% +/- 0.11% PET film mass loss after 3 days,
  outperformed the individual strains, released BHET, MHET, TPA, and ethylene
  glycol, and converted 96.4% of BHET plus 97.3% of MHET within 2 days.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: >
    Construct a two-strain consortium that pairs PET depolymerization activity
    with stronger downstream growth on BHET- and MHET-containing media to
    enhance PET degradation and hydrolysis-product conversion.
  assembly_strategy: >
    Compare Burkholderia cepacia ZY1 and Pseudomonas harudinis G1B as individual
    strains, then combine them as consortium YB2 at an optimized ZY1:G1B
    inoculation ratio of 4:5.
  perturbation_design: >
    Compare YB2 against the individual strains in PET film degradation and PET
    hydrolysis-product conversion assays.
  measurement_endpoints:
  - PET film mass loss
  - BHET conversion
  - MHET conversion
  - TPA utilization
  - ethylene glycol release and decline
  - PET surface erosion and ester-related structural changes
  notes: >
    The accessible PubMed cache is abstract-only because Europe PMC does not
    serve open full text for this Elsevier article; curation is therefore
    limited to abstract-supported strain membership, the 4:5 inoculation ratio,
    the pH 7.0 and 30 °C YB2 condition, and the reported PET/BHET/MHET/TPA/EG
    endpoints.
  evidence:
  - reference: PMID:42664909
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      Burkholderia cepacia ZY1 and Pseudomonas harudinis G1B were compared, and
      a two-strain consortium, YB2, was constructed at an optimal inoculation
      ratio of 4:5.
    explanation: Supports the two-member YB2 composition and optimized 4:5 inoculation ratio.
  - reference: PMID:42664909
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      YB2 achieved 4.30% ± 0.11% PET film mass loss after 3 d, significantly
      exceeding the individual strains.
    explanation: Supports enhanced PET film degradation by YB2 relative to either strain alone.
