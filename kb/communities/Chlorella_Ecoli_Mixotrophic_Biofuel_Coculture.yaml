  rationale: Gas, vitamin/hormone and organic-carbon exchange remain candidate mechanisms, not measured fluxes.
    Viable CFU and total bacterial biomass differ. Carbon tracing and matched antibiotic controls across substrates
    are needed to partition product effects. UTEX 2341 legacy identity is a separate grounding followup (#1300);
    the existing canonical taxon is not reverified here.
