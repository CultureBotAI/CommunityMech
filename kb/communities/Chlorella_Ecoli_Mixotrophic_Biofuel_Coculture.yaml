ecological_interactions:
- name: Bacterial Enhancement of Algal Biomass
  description: PARTIAL - in five-day separate-substrate assays, the alga reported as C. minutissima UTEX 2341 had
    200-587% greater qPCR-partitioned biomass productivity at 10 g/L substrate with E. coli ATCC 25922. Higher bacterial
    viable CFU at 96 hours supports a mutualism interpretation, not bacterial neutrality; bacterial total dry biomass
    was not uniformly enhanced. Benefits were concentration-dependent, and exact mediators were not isolated.
  interaction_type: MUTUALISM
  scope: PAIRWISE
  source_taxon:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  target_taxon:
    preferred_term: Chlorella minutissima
    term:
      id: NCBITaxon:3071
      label: Chlorella
  metabolites:
  - preferred_term: D-glucose
    term:
      id: CHEBI:4167
      label: D-glucopyranose
  - preferred_term: glycerol
    term:
      id: CHEBI:17754
      label: glycerol
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  downstream:
  - target: Increased Biofuel-Precursor Productivity
    description: PARTIAL - greater algal biomass can increase volumetric lipid and starch yield. The bulk product
      assays include both partners, and kanamycin suppressed starch in axenic glucose controls; biomass enhancement
      does not establish that every product-content difference is bacteria-mediated.
  evidence:
  - reference: PMID:24805253
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: grew more rapidly and to higher densities in the presence of E. coli
    explanation: Supports algal growth benefit, not bacterial neutrality or a resolved mediator. Reciprocal benefit
      is supported separately by viable bacterial counts, not uniformly greater bacterial biomass.
  - reference: PMID:24805253
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: produced 200-587% more algal biomass than the axenic C. minutissima cultures
    explanation: Supports the 10 g/L algal productivity comparison; lower-substrate outcomes are not uniformly enhanced.
  - reference: PMID:24805253
    snippet: viable cell counts at 96 hours at 10 g/L substrate were 51, 1600, and 6400 times higher in co-cultures
    explanation: Primary Results and Table 2 support higher viable bacterial counts. Tables 3-4 distinguish viability
      from total biomass; mechanism remains unresolved.
    evidence_source: IN_VITRO
    supports: PARTIAL
- name: Enhanced Mixotrophic Carbon Substrate Consumption
  description: At 10 g/L initial glucose, glycerol or acetate, five-day cocultures consumed 23-737% more bulk substrate
    than the summed monocultures. Lower-dose depletion limits that comparison. This is community-level substrate
    disappearance, not measured algal-to-bacterial carbon transfer.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: D-glucose
    term:
      id: CHEBI:4167
      label: D-glucopyranose
  - preferred_term: glycerol
    term:
      id: CHEBI:17754
      label: glycerol
  - preferred_term: acetate
    term:
      id: CHEBI:30089
      label: acetate
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
  downstream:
  - target: Increased Biofuel-Precursor Productivity
    description: HYPOTHESIZED - additional consumed substrate could supply carbon for increased lipid and starch
      production. Bulk uptake and product measurements do not trace carbon into either partner or separate this
      contribution from altered biomass and antibiotic-sensitive starch accumulation.
  evidence:
  - reference: PMID:24805253
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: consumed 23-737% more of the available carbon substrate
    explanation: Supports bulk substrate consumption at 10 g/L, not donor-recipient cross-feeding.
  - reference: PMID:24805253
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: than the sum of substrate consumed by E. coli and C. minutissima alone
    explanation: Supports comparison with summed monoculture consumption, not a resolved carbon-transfer route.
  participating_taxa:
  - preferred_term: Chlorella minutissima
    term:
      id: NCBITaxon:3071
      label: Chlorella
  - preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
- name: Increased Biofuel-Precursor Productivity
  description: At 10 g/L substrate, bulk coculture lipid and starch productivities exceeded axenic algal controls.
    These are combined-biomass endpoints, not reciprocal fitness measurements. In separate glucose controls, kanamycin
    suppressed starch at 10 g/L; untreated axenic algae had starch content comparable to cocultures. The product-content
    difference is therefore not wholly attributable to E. coli, although biomass and lipid benefits remain supported.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: lipid
    term:
      id: CHEBI:18059
      label: lipid
  - preferred_term: starch
    term:
      id: CHEBI:28017
      label: starch
  biological_processes:
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  - preferred_term: starch metabolic process
    term:
      id: GO:0005982
      label: starch metabolic process
  evidence:
  - reference: PMID:24805253
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: total lipid and starch productivity were elevated in co-cultures compared to axenic cultures
    explanation: Supports combined-culture productivity, not exclusively algal product content or a mutualism type.
      Table 5 identifies the starch-control confound.
  - reference: PMID:24805253
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: bacterial contamination was not detrimental to the production of biofuel precursors
    explanation: Supports production feasibility in this defined laboratory system, not a general reciprocal-fitness
      mechanism.
  - reference: PMID:24805253
    snippet: kanamycin appeared to significantly suppress starch levels
    explanation: Primary Results and Table 5 identify an antibiotic effect in the axenic controls; no matched glycerol
      or acetate antibiotic factorial is reported.
    evidence_source: IN_VITRO
    supports: SUPPORT
