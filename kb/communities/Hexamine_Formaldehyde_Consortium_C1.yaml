ecological_interactions:
- name: C1 suspended-culture hexamine, formaldehyde, and COD removal
  description: In suspended AS broth containing 50 mg/L hexamine at 37 degrees Celsius, the 1:1 Brucella pseudintermedia SRCHD05
    and Ochrobactrum sp. SRCHD06 consortium (C1) achieved 49.10%, 68.18%, and 86.74% hexamine reduction, 38.46%, 44.12%, and
    45.10% formaldehyde reduction, and 2.03%, 2.41%, and 19.86% COD reduction at 24, 48, and 72 h, accompanied by 5.90%, 16.11%,
    and 18.89% ammonia production. Single-isolate characterization showed that strong biofilm formers SRCHD05 (13.5 h log
    phase, 73 min 2 s doubling time) and SRCHD06 (14 h log phase, 128 min 12 s doubling time) were the most efficient individual
    COD reducers (42% and 36% at 72 h from an initial 11,900 mg/L load). Because hexamine breakdown into formaldehyde and
    ammonia is reversible and Nash's reagent quantifies both free and hexamine-bound formaldehyde in nutrient-containing AS
    broth (1% tryptone, 0.5% yeast extract), these bulk-chemistry endpoints are represented as a single COMMUNITY_LEVEL node
    with 0 directed downstream edges rather than an unverified multi-step mineralization or cross-feeding chain.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: hexamine
    term:
      id: CHEBI:6824
      label: hexamethylenetetramine
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
    notes: Ammonia was produced as a hexamine breakdown by-product in the suspended-C1 assay (Table 2); a consortium ammonia
      sink is not established.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C1 49.10 68.18 86.74 38.46 44.12 45.10 2.03 2.41 19.86 5.90 16.11 18.89
    explanation: Quantifies the 24 h, 48 h, and 72 h bulk hexamine, formaldehyde, and COD reduction percentages and ammonia
      production percentages for Consortium C1 in suspended AS broth.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: COD analysis revealed that isolates SRCHD05 and SRCHD06 were more efficient among the selected isolates. They
      could reduce COD by 42 and 36% after 72 h of incubation at 37 °C from an initial load of 11,900 mg/L, respectively
    explanation: Provides the single-isolate 72 h COD reduction baselines (42% for SRCHD05 and 36% for SRCHD06) for the two
      constituent strains of Consortium C1.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The remaining isolates showed an increase in ammonia concentration as an indication of hexamine degradation,
      but demonstrated an inability to remove ammonia
    explanation: Explains why Consortium C1 (composed of SRCHD05 and SRCHD06, neither of which removed ammonia in monoculture)
      exhibits net ammonia accumulation during hexamine degradation.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The growth curve data of the selected isolates revealed that the isolate SRCHD07 was the fastest growing strain
      among the selected five isolates, with a log phase of 12 h and doubling time of 49 min and 6 s. Isolates SRCHD06 (14
      h log phase, 128 min and 12 s doubling time), SRCHD05 (13.5 h log phase, 73 min and 2 s doubling time), SRCHD03 (20
      h log phase, 121 min and 4 s doubling time), and SRCHD04 (25 h log phase, 80 min, and 6 s doubling time) took longer
      time to reach growth saturation ( Figure 3 ).
    explanation: Quantifies the monoculture log-phase durations and doubling times for Consortium C1 constituents SRCHD05
      (13.5 h log phase, 73 min 2 s doubling time) and SRCHD06 (14 h log phase, 128 min 12 s doubling time).
  - reference: PMID:41743136
    supports: PARTIAL
    evidence_source: OTHER
    snippet: In acidic conditions, hexamine breaks down into ammonia and formaldehyde, both of which play an important role
      in water pollution. This being a reversible reaction, leads to the production of hexamine in the presence of formaldehyde
      and ammonia in wastewater, hence emphasizing the rapid removal of both formaldehyde and ammonia from wastewater.
    explanation: Documents the reversible chemical equilibrium between hexamine and its formaldehyde and ammonia breakdown
      products, which coupled with bulk supernatant assays prevents asserting a directed multi-node downstream enzymatic chain
      without intermediate flux measurements.
