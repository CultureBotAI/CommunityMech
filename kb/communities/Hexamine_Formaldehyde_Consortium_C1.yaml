id: CommunityMech:000505
name: Hexamine Formaldehyde Consortium C1
description: Consortium C1 is a defined two-member hexamine- and formaldehyde-removing bacterial formulation assembled from
  environmental isolates Brucella pseudintermedia SRCHD05 and Ochrobactrum sp. SRCHD06 at a 1:1 ratio in AS broth containing
  50 mg/L hexamine at 37 degrees Celsius. Over 24, 48, and 72 h of suspended-culture incubation, C1 achieved 49.10%, 68.18%,
  and 86.74% hexamine reduction, 38.46%, 44.12%, and 45.10% formaldehyde reduction, and 2.03%, 2.41%, and 19.86% chemical
  oxygen demand (COD) reduction while accumulating 5.90%, 16.11%, and 18.89% ammonia production as a hexamine breakdown by-product.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOREMEDIATION
engineering_design:
  objective: Evaluate the defined 2-isolate combination Consortium C1 (SRCHD05, SRCHD06 at a 1:1 ratio) for removal of hexamine,
    its formaldehyde by-product, and chemical oxygen demand in suspended AS broth as part of the C1-C6 consortium development
    series.
  assembly_strategy: Select five hexamine-, formaldehyde-, and COD-removing environmental isolates (SRCHD03, SRCHD04, SRCHD05,
    SRCHD06, and SRCHD07) and test defined equal-ratio combinations C1-C6 in 50 mg/L hexamine AS broth at 37 degrees Celsius.
  inoculation_strategy: Combine Brucella pseudintermedia SRCHD05 and Ochrobactrum sp. SRCHD06 at a 1:1 ratio in AS broth containing
    50 mg/L hexamine at 37 degrees Celsius and sample cell-free supernatants at 24, 48, and 72 h.
  perturbation_design: Compare Consortium C1 across 24, 48, and 72 h incubation intervals against sibling consortia in the
    C1-C6 combinatorial assembly series in AS broth supplemented with 50 mg/L hexamine at 37 degrees Celsius.
  measurement_endpoints:
  - hexamine removal
  - formaldehyde removal
  - chemical oxygen demand removal
  - ammonia production
  evidence:
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based on their hexamine, formaldehyde, and COD removal ability, five isolates were selected for consortium development
    explanation: Supports the bioremediation phenotype screen used to select the five isolates for C1-C5 consortium development.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: '1 SRCHD05: SRCHD06 (1:1) C1'
    explanation: Reports the Table 1 Consortium C1 assembly combining isolates SRCHD05, SRCHD06 at a 1:1 ratio.
  - reference: PMID:41743136
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C1 49.10 68.18 86.74 38.46 44.12 45.10 2.03 2.41 19.86 5.90 16.11 18.89
    explanation: Quantifies Consortium C1 24 h, 48 h, and 72 h hexamine reduction, formaldehyde reduction, COD reduction,
      and ammonia production in suspended AS broth.
