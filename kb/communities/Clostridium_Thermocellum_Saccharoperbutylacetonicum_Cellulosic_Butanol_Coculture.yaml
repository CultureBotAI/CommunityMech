id: CommunityMech:000208
name: Clostridium Thermocellum-Saccharoperbutylacetonicum Cellulosic Butanol Coculture
description: >
  A staged two-member coculture for producing n-butanol from crystalline cellulose.
  The cellulolytic thermophile Clostridium thermocellum, represented in NCBI
  Taxonomy as Acetivibrio thermocellus ATCC 27405, first hydrolyzes Avicel
  cellulose. The butanol-producing Clostridium saccharoperbutylacetonicum strain
  N1-4 is then added for solvent production. The system is DOE-relevant because
  it couples consolidated cellulose deconstruction to cellulosic butanol production,
  a liquid biofuel and bioproduct target.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Produce n-butanol directly from crystalline cellulose by pairing a cellulolytic thermophile
    with a solventogenic butanol producer.
  assembly_strategy: Incubate C. thermocellum on Avicel cellulose before adding C. saccharoperbutylacetonicum
    N1-4 so cellulose hydrolysis precedes mesophilic butanol production.
  perturbation_design: Vary the C. thermocellum preincubation time, initial cell densities, cellulose loading,
    and compare N1-4 with other solventogenic Clostridium partners.
  measurement_endpoints:
  - Butanol concentration
  - Acetone detectability
  - Cellulose loading response
  - Partner-strain comparison
  evidence:
  - reference: PMID:21764954
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Butanol production from crystalline cellulose by cocultured Clostridium thermocellum and Clostridium saccharoperbutylacetonicum N1-4
    explanation: Supports the exact community design and target product curated here.
  - reference: PMID:21764954
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Less butanol was produced by cocultured Clostridium acetobutylicum and Clostridium beijerinckii than by strain N1-4
    explanation: Supports the design choice of N1-4 as the solventogenic partner.
