ecological_interactions:
- name: Root flg22 Immune Suppression
  description: Live SynCom35 suppresses a sector of the Arabidopsis root flg22 response after establishment. Dyella
    MF79 is one tested suppressor, not the sole cause of whole-community transcriptional changes. Participants name
    the host and this canonical member, not the complete 35-strain roster.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: pattern recognition receptor signaling pathway
    term:
      id: GO:0002221
      label: pattern recognition receptor signaling pathway
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
  - preferred_term: regulation of innate immune response
    term:
      id: GO:0045088
      label: regulation of innate immune response
  downstream:
  - target: Suppression-Associated Root Colonization Facilitation
    description: Suppression can facilitate nonsuppressor root colonization under the tested conditions. MF79 wild-type
      retentate, unlike T2SS-mutant material, countered the flg22-associated reduction in Ochrobactrum MF370 colonization.
      This does not establish universal facilitation by every suppressor or reciprocal benefit.
  evidence:
  - reference: PMID:33879573
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a community of root commensal bacteria modulates a specific and evolutionarily conserved sector of
      the Arabidopsis immune system
    explanation: Supports community immune modulation. Primary Results and Figures 1-3 distinguish whole-community,
      monoassociation and acute reporter assays.
  participating_taxa:
  - preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  - preferred_term: Dyella japonica MF79
    term:
      id: NCBITaxon:231455
      label: Dyella japonica
- name: Community-Associated WRKY Transcript Suppression
  description: SynCom35 suppressed flg22-responsive WRKY transcripts. The host and MF79 participants represent a
    known subset of the inoculated system, not a demonstrated MF79-specific WRKY mechanism. A regulatory role in
    colonization homeostasis remains proposed.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: regulation of defense response
    term:
      id: GO:0031347
      label: regulation of defense response
  - preferred_term: regulation of transcription, DNA-templated
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  evidence:
  - reference: PMID:33879573
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: a community of root commensal bacteria modulates a specific and evolutionarily conserved sector of
      the Arabidopsis immune system
    explanation: The cached abstract supports broad immune modulation, not the WRKY-specific readout. That readout
      was checked in primary Results, cluster SC1, and the proposed regulatory role in Discussion at https://pmc.ncbi.nlm.nih.gov/articles/PMC8072228/.
      No claim that snippet matching validates the WRKY detail.
  participating_taxa:
  - preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  - preferred_term: Dyella japonica MF79
    term:
      id: NCBITaxon:231455
      label: Dyella japonica
- name: MF79 Type II Secretion-Dependent Immune Modulation
  description: MF79 secretion-system mutants and cell-free supernatants support T2SS-dependent suppression of the
    root flg22 response; T3SS was dispensable. The active secreted molecule remains unresolved. This strain-specific
    requirement is not assigned to every SynCom35 member.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Dyella japonica MF79
    term:
      id: NCBITaxon:231455
      label: Dyella japonica
  target_taxon:
    preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
  - preferred_term: modulation by symbiont of host defense response
    term:
      id: GO:0052031
      label: symbiont-mediated perturbation of host defense response
  downstream:
  - target: Root flg22 Immune Suppression
    description: MF79 T2SS function enables its extracellular suppressive activity in the root reporter assay. This
      arrow applies to the MF79 component of the suppression node, not necessity of T2SS for the entire SynCom35
      phenotype.
  evidence:
  - reference: PMID:33879573
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We highlight the importance of extracellular strategies for MTI suppression by showing that the type
      2, not the type 3, secretion system is required for the immunomodulatory activity of one robust MTI suppressor
    explanation: Supports the experimentally tested secretion-system requirement in one suppressor, not a resolved
      effector identity or whole-community T2SS requirement.
- name: Suppression-Associated Root Colonization Facilitation
  description: 'Suppressor-community precolonization enhanced subsequent colonization by tested nonsuppressors;
    MF79 retentate separately supported Ochrobactrum MF370 under flg22 challenge. Canonical participants are only
    a subset: Pseudomonas denotes the tested P. viridiflava challenge lineage, not a proven MF79/Pseudomonas mutualism.'
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: doi:10.1073/pnas.2100678118
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Suppressors and nonsuppressors co-occur in the root microbiome and the presence of the former can enhance
      the colonization ability of the latter
    explanation: Supports facilitation of tested nonsuppressors. The main body separates the smaller-community precolonization
      comparison from the MF79 retentate experiment; neither demonstrates reciprocal fitness.
  participating_taxa:
  - preferred_term: Arabidopsis thaliana
    term:
      id: NCBITaxon:3702
      label: Arabidopsis thaliana
  - preferred_term: Dyella japonica MF79
    term:
      id: NCBITaxon:231455
      label: Dyella japonica
  - preferred_term: Pseudomonas species
    term:
      id: NCBITaxon:286
      label: Pseudomonas
  interaction_type: COLONIZATION_FACILITATION
