- name: Negative Control Strain Baseline Response
  description: 'Escherichia coli DH5α serves as a negative control strain representing a bacterium that
    lacks evolved adaptations for plant root colonization and immune suppression. Unlike the SynComm 35
    members that suppress MAMP-triggered immunity, E. coli DH5α induces normal plant defense responses
    and colonizes poorly. The strain provides a baseline for measuring the specific immune-modulating
    capabilities of adapted root commensals. Comparison between E. coli and SynComm 35 demonstrates that
    immune suppression is not a general bacterial property but requires specific adaptations (Type II
    secretion systems, effector proteins, specialized metabolites) that evolved in plant-associated bacteria.
    This control validates that the observed immune suppression is due to specific bacterial strategies
    rather than non-specific bacterial presence.

    '
