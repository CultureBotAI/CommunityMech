- name: Community Member Metabolic Cooperation
  description: 'Microbacterium and Stenotrophomonas species cooperate metabolically within the SynComm
    35 community, sharing nutrients and metabolites in the rhizosphere environment. Microbacterium species
    degrade complex organic polymers and produce amino acids and vitamins that benefit other community
    members. Stenotrophomonas species mobilize phosphate and produce siderophores for iron acquisition,
    creating public goods accessible to the community. This cross-feeding network reduces competition
    for resources and stabilizes community structure during root colonization. The metabolic cooperation
    complements the immune suppression mediated by Dyella japonica, creating a multi-layered strategy
    for successful root colonization.

    '
