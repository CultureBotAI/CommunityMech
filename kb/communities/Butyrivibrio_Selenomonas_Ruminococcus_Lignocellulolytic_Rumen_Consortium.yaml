id: CommunityMech:000275
name: Butyrivibrio fibrisolvens + Selenomonas ruminantium + Ruminococcus albus Lignocellulolytic
  Rumen Consortium
description: A synthetic lignocellulolytic bacterial consortium designed from six bovine rumen
  microbial strains to enhance lignocellulose degradation for biofuel and enzyme production. Genome-scale
  community metabolic models were used with flux-based parameters (pairwise metabolic assistance, PMA;
  growth support index, PGSI) to predict compatible, mutualistic pairs, which were validated in
  experimentally grown cocultures. The strongest pairwise enzymatic synergism was observed for
  Butyrivibrio fibrisolvens with Selenomonas ruminantium (a 41% increase in endoglucanase activity), and
  a three-membered community of B. fibrisolvens, S. ruminantium, and Ruminococcus albus showed
  synergistic activity across all lignocellulosic substrates, indicating strong metabolic interplay
  among compatible species.
