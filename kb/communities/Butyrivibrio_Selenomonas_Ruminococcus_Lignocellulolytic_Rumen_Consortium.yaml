    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >
      Flux-based parameters, such as pairwise metabolic assistance (PMA) and
      growth support index (PGSI), were employed to investigate the
      coculture-based growth and metabolic synergies.
    explanation: >
      Identifies the flux-based metrics used to screen pairwise rumen-strain
      compatibility.
