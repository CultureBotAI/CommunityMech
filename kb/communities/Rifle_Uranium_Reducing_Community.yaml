    treatment level in some monitoring wells. This is a measured removal outcome, not a direct characterization
    of 2-5 nm uraninite or a demonstrated Geobacter-Anaeromyxobacter mutualism. Later sulfate reduction coincided
    with increasing groundwater uranium, not sustained removal at the initial effectiveness.
  scope: COMMUNITY_LEVEL
