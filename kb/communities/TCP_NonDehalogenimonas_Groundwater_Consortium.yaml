id: CommunityMech:000437
name: TCP Non-Dehalogenimonas Groundwater Consortium
description: A long-term domesticated non-Dehalogenimonas synergistic consortium optimized for bioremediation of 1,2,3-trichloropropane
  (TCP) in groundwater. The PubMed abstract reports complete TCP removal within 3.5 days after co-metabolic substrate stimulation,
  links the transformation to a Fusibacter, Desulfovibrio, Nitratidesulfovibrio, and Parabacteroides alliance, and describes
  a coupled metabolic module involving hydrogen production, cofactor synthesis, and reductive dechlorination.
ecological_state: ENGINEERED
community_origin: ENGINEERED
community_category: BIOREMEDIATION
engineering_design:
  objective: Enhance TCP degradation in groundwater bioremediation with broad-spectrum co-metabolic substrates rather than
    relying on Dehalogenimonas strains.
  assembly_strategy: Optimize a non-Dehalogenimonas synergistic consortium through long-term directed domestication and then
    test co-metabolic substrate amendments.
  measurement_endpoints:
  - 1,2,3-trichloropropane degradation rate
  - time to complete TCP removal
  - microbial community composition
  - metagenomic metabolic module reconstruction
  notes: The accessible PubMed abstract names the four genus-level members but does not expose species, strain accessions,
    the source inoculum, quantitative member abundances, exact co-metabolic-substrate dosing, or the long-term domestication
    transfer schedule.
  evidence:
  - reference: PMID:41736479
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: exploring broad-spectrum co-metabolic substrates to enhance the degradation efficiency of a non-Dehalogenimonas
      synergistic consortium optimized through long-term directed domestication
    explanation: Supports the domesticated consortium design and co-metabolic-substrate screen.
