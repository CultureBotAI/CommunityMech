      in engineered food chains
    explanation: Abstract supports the fungal carbohydrate-to-lactate food chain; Fig.1 distinguishes cellulose-derived
      hexoses from pentose-containing feedstocks.
- name: Lactate Supply and Redox Facilitation
  description: 'L. pentosus funnels carbohydrates to lactate and supplies acetate when metabolizing pentoses. Fungal
    oxygen consumption first lowers dissolved oxygen; subsequent LAB inoculation lowers redox potential further,
    enabling the obligate anaerobe. The membrane configuration, continuing fungal activity and LAB contribution
    work jointly: LAB alone cannot maintain anoxia. This supports resource and redox facilitation, not demonstrated
    reciprocal thermodynamic syntrophy.'
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
