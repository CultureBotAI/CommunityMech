ecological_interactions:
- name: Cellulose Hydrolysis to Soluble Sugars
  description: T. reesei hydrolysis supplies soluble carbohydrates to L. pentosus in the membrane reactor. Cellulose
    supplies hexose products; xylose belongs to the separately supplied pentose or hemicellulose fraction, not cellulose
    hydrolysis. This food-chain link does not establish reciprocal thermodynamic syntrophy.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
