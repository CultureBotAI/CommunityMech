  downstream:
  - target: Butyrate Production by Lactate-Acetate Co-fermentation
    description: L. pentosus supplies lactate and contributes to reducing conditions that enable C. tyrobutyricum
      co-fermentation. Acetate or glucose must also be available; acetate depletion and feed-rescue experiments
      support this requirement. Neither lactate alone nor LAB-alone oxygen removal is sufficient.
  evidence:
  - reference: PMID:32855308
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: A spatial niche enabled in situ cellulolytic enzyme production by an aerobic fungus next to facultative
      anaerobic lactic acid bacteria and the product-forming anaerobes
    explanation: Abstract supports spatial coexistence; accepted manuscript main text and Fig.S3 distinguish fungal
      oxygen consumption from the additional LAB-associated redox decrease. SI physiology discussion argues that
      LAB alone cannot sustain anoxia. The abstract is not itself an oxygen-flux partition experiment.
- name: Butyrate Production by Lactate-Acetate Co-fermentation
  description: 'C. tyrobutyricum converts lactate with a co-substrate to butyrate. Lactate alone is insufficient:
    acetate depletion stops utilization, and acetate addition restores it; glucose can also serve as co-substrate.
    These experiments support the recipient conversion, not an exclusive source of every acetate molecule. Acetate
    feed, lower oxygen transfer and addition of L. brevis are separate experimental arms. The three-member consortium
    produced the reported beechwood yield after steam pretreatment; the four-member arm is not that benchmark.'
  scope: COMMUNITY_LEVEL
