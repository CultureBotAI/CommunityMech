ecological_interactions:
- name: BC600 Biochar-Consortium Coupling
  description: The strategy amends a native Dhc-containing groundwater consortium with Zizania latifolia husk biochar
    produced at 600 degrees C. The author-uploaded proof distinguishes consortium D345 from CWV2; the graph does
    not treat the isolate and the complete community as identical.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: trichloroethene
    term:
      id: CHEBI:16602
      label: trichloroethene
  downstream:
  - target: BC600 Colonization and Activity Enhancement
    description: BC600 amendment supplies sorptive surfaces and is associated with enhanced microbial colonization
      and activity in the tested consortium. Amendment effects depend on dose and inoculum conditions; this does
      not establish that adsorption itself is biological dechlorination.
  evidence:
  - reference: PMID:41442978
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: integrates biochar derived from Zizania latifolia (water bamboo) husks with a native microbial consortium
    explanation: Supports amendment of the native D. mccartyi-containing consortium with Zizania-derived biochar.
- name: BC600 Colonization and Activity Enhancement
  description: BC600 was selected for adsorption performance and practical cost considerations and was associated
    with enhanced microbial colonization and activity. The proof reports slightly greater sorption for BC700, so
    BC600 is not asserted to have the strongest adsorption. Sorption and biological transformation remain distinct
    processes.
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: trichloroethene
    term:
      id: CHEBI:16602
      label: trichloroethene
  downstream:
  - target: Biochar-Accelerated TCE Degradation
    description: PARTIAL - biochar-associated microbial colonization and activity could contribute to faster TCE
      transformation, alongside sorption and bioavailability effects. The amendment comparison does not selectively
      isolate colonization as the causal mediator, and TCE disappearance through adsorption is not itself degradation.
  evidence:
  - reference: PMID:41442978
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Biochar (BC600) demonstrated optimal adsorption while enhancing microbial colonization and activity
    explanation: The abstract supports adsorption and enhanced colonization/activity. Its optimal wording does not
      establish that BC600 sorption exceeds BC700 or selectively isolate colonization from adsorption as the mediator.
- name: Biochar-Accelerated TCE Degradation
  description: BC600 amendment accelerated TCE transformation in the tested native-consortium experiments. Removal
    includes a sorption contribution and must not be equated wholesale with biological degradation. Dose and inoculum
    comparisons differ; faster TCE transformation alone does not imply lower vinyl-chloride accumulation.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Dehalococcoides mccartyi strain CWV2
    term:
      id: NCBITaxon:61435
      label: Dehalococcoides mccartyi
  metabolites:
  - preferred_term: trichloroethene
    term:
      id: CHEBI:16602
      label: trichloroethene
  evidence:
  - reference: PMID:41442978
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: leading to accelerated TCE degradation
    explanation: Supports the reported amendment-associated degradation outcome, not a general causal arrow from
      faster TCE loss to lower vinyl chloride across all assay conditions.
- name: Vinyl Chloride Accumulation Mitigation
  description: A separate high-inoculum BC600 experiment reported lower peak vinyl-chloride accumulation, consistent
    with support for downstream dechlorination. In lower-inoculum comparisons, biochar could instead increase vinyl
    chloride while unamended controls retained TCE. CWV2 vinyl-chloride-to-ethene capability and the consortium
    amendment outcome are related but distinct observations.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Dehalococcoides mccartyi strain CWV2
    term:
      id: NCBITaxon:61435
      label: Dehalococcoides mccartyi
  metabolites:
  - preferred_term: chloroethene
    term:
      id: CHEBI:28509
      label: chloroethene
  - preferred_term: ethene
    term:
      id: CHEBI:18153
      label: ethene
  evidence:
  - reference: PMID:41442978
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a strain capable of completely dechlorinating VC to non-toxic ethene
    explanation: Supports VC-to-ethene dechlorination by D. mccartyi CWV2.
  - reference: PMID:41442978
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 50 % reduction of VC accumulation
    explanation: The abstract reports a reduction greater than 50 percent. The author-uploaded proof places this
      in a separate high-inoculum experiment; it is not a universal effect at every dose, inoculum or time point.
- name: Hydrogen- and Electroactive-Guild Dechlorination Stability
  description: Community profiling associated biochar with relative-abundance shifts among putative hydrogen-producing
    and electroactive guilds. HYPOTHESIZED - those guilds could support dechlorination through reducing-equivalent
    supply. Relative profiles do not demonstrate hydrogen or electron flux, direct interspecies electron transfer,
    selective guild necessity or long-term field stability.
  scope: COMMUNITY_LEVEL
  target_taxon:
    preferred_term: Dehalococcoides mccartyi strain CWV2
    term:
      id: NCBITaxon:61435
      label: Dehalococcoides mccartyi
  metabolites:
  - preferred_term: hydrogen
    term:
      id: CHEBI:18276
      label: dihydrogen
  evidence:
  - reference: PMID:41442978
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Microbial community analysis further indicated that biochar promoted syntrophic hydrogen producers
      and electroactive bacteria, ensuring long-term dechlorination stability.
    explanation: Supports community-composition observations and the authors' proposed interpretation. Relative
      abundance is not measured reducing-equivalent flux or a selective guild perturbation, and field persistence
      requires separate validation.
