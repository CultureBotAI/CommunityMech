id: CommunityMech:000301
name: Dehalococcoides mccartyi CWV2 Dechlorinating Consortium
description: A native groundwater microbial consortium enriched in Dehalococcoides mccartyi
  (Dhc) strain CWV2, a strain capable of completely dechlorinating vinyl chloride (VC) to
  non-toxic ethene. The consortium remediates trichloroethene (TCE)-contaminated groundwater;
  amendment with biochar (BC600) derived from Zizania latifolia husks enhances microbial
  colonization and activity, accelerating TCE degradation and reducing VC accumulation.
  Community analysis indicates biochar promotes syntrophic hydrogen producers and electroactive
  bacteria that supply reducing equivalents and ensure long-term dechlorination stability.
