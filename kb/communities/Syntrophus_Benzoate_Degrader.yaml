    explanation: Supports the named hydrogen user and coculture product balance.
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The anaerobic bacterium Syntrophus aciditrophicus metabolized benzoate in pure culture in the absence
      of hydrogen-utilizing partners or terminal electron acceptors.
    explanation: Prevents the low-hydrogen requirement of the syntrophic route from becoming a universal dependence
      claim.
- name: Community Benzoate Conversion to Acetate and Methane
  description: 'The two-member benzoate coculture produced approximately three mol acetate and 0.75 mol methane
    per mol benzoate, as summarized in the primary abstract. This is substrate conversion, not complete mineralization:
    acetate remains organic carbon. The reported pure-culture product balance differs, including cyclohexane carboxylate
    accumulation.'
