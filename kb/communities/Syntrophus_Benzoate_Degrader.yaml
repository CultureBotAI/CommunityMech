  evidence:
  - reference: doi:10.1128/aem.67.4.1728-1738.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Time course experiments relating methane production to benzoate consumption
      in “ S. aciditrophicus ”- M. hungatei cocultures indicated that the amount
      of methane produced per mole of benzoate consumed was much less than theoretically
      predicted (0.75 mol of methane per mol of benzoate) during the initial stages
      of benzoate metabolism.
    explanation: Establishes M. hungatei as the methanogenic partner that
      produces methane in benzoate-grown cocultures.
ecological_interactions:
- name: Syntrophus Benzoate Metabolism
  description: 'S. aciditrophicus strain SB metabolizes benzoate in coculture with
    hydrogen-using partners and transiently produces cyclohexane carboxylate,
    cyclohex-1-ene carboxylate, pimelate, and glutarate during growth on
    benzoate. These Syntrophus reactions initiate the methanogenic coculture
    conversion of benzoate to acetate and methane.

    '
