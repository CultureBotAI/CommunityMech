    explanation: Identifies the methanogenic pairing used for metabolism of the alicyclic substrates.
- name: Interspecies Hydrogen Transfer and Methanogenesis
  description: 'M. hungatei is the hydrogen-using methanogen in the benzoate coculture. Hydrogen consumption provides
    an electron sink for the syntrophic conversion to acetate and methane. This does not mean benzoate metabolism
    is impossible without a partner: S. aciditrophicus pure cultures ferment benzoate with cyclohexane carboxylate
    accumulation and a different acetate yield.'
