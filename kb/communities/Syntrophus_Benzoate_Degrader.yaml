    explanation: 'The primary passage identifies these transient intermediates or their coenzyme A derivatives;
      it does not assign every enzyme assay to this methanogenic pair. The contiguous excerpt avoids the known bracket-stripping
      validator bug #622 without silently changing quoted text.'
