  evidence:
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The pure culture of S. aciditrophicus produced approximately 0.5 mol of cyclohexane
      carboxylate and 1.5 mol of acetate per mol of benzoate, while a coculture
      of S . aciditrophicus with the hydrogen-using methanogen Methanospirillum
      hungatei produced 3 mol of acetate and 0.75 mol of methane per mol of
      benzoate.
    explanation: Demonstrates methane-producing syntrophy between S. aciditrophicus
      and M. hungatei.
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Degradation proceeds only if the concentration of hydrogen produced during
      benzoate oxidation is continuously maintained at a low level by a hydrogen-using
      microorganism ( 12 , 19 , 24 , 26 ).
    explanation: Confirms the low-hydrogen requirement that the methanogen satisfies.
- name: Community Benzoate Mineralization to Acetate and Methane
  description: 'The two-member S. aciditrophicus-M. hungatei coculture consumes
    benzoate and completes the methanogenic community outcome by producing acetate
    and methane at the stoichiometry predicted for syntrophic benzoate degradation.

    '
