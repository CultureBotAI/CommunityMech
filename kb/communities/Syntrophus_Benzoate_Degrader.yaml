    notes: 'Hydrogen-utilizing methanogen paired with S. aciditrophicus in the
      two-member benzoate coculture. It couples H2 consumption to methane
      production during community benzoate metabolism.

      '
  functional_role:
  - SYNTROPHIC_PARTNER
