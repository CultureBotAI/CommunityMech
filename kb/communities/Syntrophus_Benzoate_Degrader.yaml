environmental_factors:
- name: Anaerobic Conditions
  value: Strict anaerobic
  description: Both organisms are obligate anaerobes requiring anoxic conditions
  evidence:
  - reference: doi:10.1128/aem.67.4.1728-1738.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All media and stock solutions were prepared anaerobically by the techniques
      described by Balch and Wolfe ( 6 ).
    explanation: Establishes anaerobic preparation of the coculture medium.
- name: Hydrogen Partial Pressure
  value: Must be maintained at low levels
  description: 'Low H2 partial pressure is critical for syntrophic benzoate degradation. The methanogen
    must continuously remove H2 to maintain thermodynamically favorable conditions for benzoate oxidation
    by S. aciditrophicus.

    '
  evidence:
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Degradation proceeds only if the concentration of hydrogen produced during
      benzoate oxidation is continuously maintained at a low level by a hydrogen-using
      microorganism ( 12 , 19 , 24 , 26 ).
    explanation: Demonstrates that H2 removal is essential for syntrophic metabolism.
