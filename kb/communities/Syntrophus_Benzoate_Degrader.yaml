  evidence:
  - reference: doi:10.1128/aem.67.4.1728-1738.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, we investigated the pathway for syntrophic benzoate metabolism
      in “ Syntrophus aciditrophicus ” strain SB by identifying and quantifying
      metabolites produced during growth of this organism with benzoate, cyclohexane
      carboxylate, and cyclohex-1-ene carboxylate in cocultures with hydrogen-utilizing
      partners
    explanation: Demonstrates S. aciditrophicus strain SB syntrophic metabolism
      with hydrogen-utilizing partners.
  - reference: doi:10.1128/aem.67.4.1728-1738.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: During growth of the “ S. aciditrophicus ”- M. hungatei cocultures with
      benzoate, cyclohexane carboxylate, cyclohex-1-ene carboxylate, pimelate,
      and glutarate were detected as their TMS derivatives.
    explanation: Identifies the alicyclic and dicarboxylate intermediates
      produced during benzoate-grown S. aciditrophicus-M. hungatei coculture.
- name: Interspecies Hydrogen Transfer and Methanogenesis
  description: 'M. hungatei functions as the hydrogen-using methanogen in the
    S. aciditrophicus coculture. Hydrogen consumption keeps the concentration
    of hydrogen produced during benzoate oxidation low, a thermodynamic requirement
    for anaerobic benzoate degradation through interspecies hydrogen transfer.

    '
