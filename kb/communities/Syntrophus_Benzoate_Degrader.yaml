  preferred_term: anaerobic sediments
  term:
    id: ENVO:00002007
    label: sediment
  notes: 'Syntrophus aciditrophicus strain SB was isolated from sewage-treatment
    sediment and grown in benzoate-fed syntrophic coculture under strict anaerobic
    conditions with Methanospirillum hungatei.

    '
