  syntrophic benzoate-degrading coculture.
growth_media:
- name: sulfate-free benzoate basal medium
  temperature: '37'
  temperature_unit: °C
  atmosphere: ANAEROBIC
  preparation_notes: >-
    S. aciditrophicus-M. hungatei cocultures grown in sulfate-free (<5 µM) benzoate basal medium;
    all media prepared anaerobically by the Balch-Wolfe technique; test substrate at 1.2-1.7 mM.
    The earlier coculture study used basal medium containing 1.2-1.5 mM sodium benzoate
    under an 80% N2-20% CO2 headspace.
  evidence:
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cocultures of S. aciditrophicus and M. hungatei were established and
      grown in sulfate-free (<5 μM) benzoate basal medium as described previously
      ( 8 ).
    explanation: Names the sulfate-free benzoate basal medium for the S. aciditrophicus-M. hungatei
      coculture.
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All cultures were incubated at 37°C.
    explanation: Incubation temperature for the syntrophic benzoate-degrading coculture.
  - reference: doi:10.1128/aem.67.12.5520-5525.2001
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All media and stock solutions were prepared anaerobically by using the
      techniques described by Balch and Wolfe ( 3 ).
    explanation: Establishes strict anaerobic preparation of the culture medium.
