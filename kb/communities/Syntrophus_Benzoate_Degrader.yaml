id: CommunityMech:000071
name: Syntrophus Benzoate Degrader
description: 'A two-member anaerobic syntrophic coculture consisting of Syntrophus aciditrophicus
  SB, which metabolizes benzoate and alicyclic intermediates in coculture with hydrogen-using partners,
  and Methanospirillum hungatei, a hydrogenotrophic methanogen. S. aciditrophicus-M. hungatei cocultures
  convert benzoate to acetate and methane while keeping hydrogen low enough for syntrophic benzoate
  degradation to proceed under methanogenic, strictly anaerobic conditions.

  '
