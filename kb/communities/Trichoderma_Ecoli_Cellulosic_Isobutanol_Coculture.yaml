id: CommunityMech:000205
name: Trichoderma-E. coli Cellulosic Isobutanol Coculture
description: >
  A synthetic fungal-bacterial consortium designed for direct conversion of cellulosic
  biomass to isobutanol. The community divides labor between Trichoderma reesei, which
  secretes cellulases that hydrolyze lignocellulosic biomass into soluble saccharides,
  and Escherichia coli, which metabolizes those saccharides into the target biofuel
  product. The study demonstrated conversion of microcrystalline cellulose and pretreated
  corn stover to isobutanol, making the system relevant to DOE lignocellulosic biofuel
  and consolidated bioprocessing goals.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: LIGNOCELLULOSE
engineering_design:
  objective: Convert microcrystalline cellulose and pretreated corn stover directly to
    isobutanol using a two-member fungal-bacterial consortium with divided hydrolysis and
    fermentation functions.
  assembly_strategy: Pair a cellulase-secreting Trichoderma reesei cellulolytic specialist
    with an Escherichia coli fermentation specialist that consumes soluble saccharides.
  perturbation_design: Mathematical modeling and experimental tests were used to evaluate
    population stability, composition tuning, and bioprocessing performance.
  measurement_endpoints:
  - Cellulose and pretreated corn stover conversion
  - Isobutanol titer
  - Isobutanol yield
  - Population composition and stability
