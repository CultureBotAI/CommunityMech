ecological_interactions:
- name: Cross-Kingdom Fungal-Bacterial Lignocellulose Hydrolysis and Humification
  description: The four-species cross-kingdom SynCom (Bacillus licheniformis, Bacillus subtilis, Aspergillus nidulans, and
    Aspergillus rugulosus) stimulates lignocellulose-degrading enzyme and urease activities during green waste co-vermicomposting,
    reducing the C/N ratio and increasing humic substance content.
  interaction_type: SYNTROPHY
  metabolites:
  - preferred_term: lignocellulose
    term:
      id: CHEBI:180683
      label: lignocellulose
  biological_processes:
  - preferred_term: cellulose catabolic process
    term:
      id: GO:0030245
      label: cellulose catabolic process
  - preferred_term: lignin catabolic process
    term:
      id: GO:0046274
      label: lignin catabolic process
  evidence:
  - reference: PMID:42780861
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared with other treatments, 5% SynComs showed the strongest stimulatory effect on lignocellulose-degrading
      enzyme and urease activities, effectively reduced the C/N ratio, and increased the germination index, humic substance
      content, nitrate nitrogen content, and overall quality score.
    explanation: Demonstrates stimulated lignocellulolytic and urease activities and humification by the SynCom.
  scope: COMMUNITY_LEVEL
- name: Coordinated Carbohydrate Esterase Enrichment and Nitrification Enhancement
  description: Inoculation of the four-species cross-kingdom SynCom enriches carbohydrate esterases, glycosyltransferases,
    and the nitrification gene hao in the vermicomposting microbiome, enhancing lignocellulose degradation product transformation
    and nitrate accumulation.
  interaction_type: SYNTROPHY
  metabolites:
  - preferred_term: nitrate
    term:
      id: CHEBI:17632
      label: nitrate
  biological_processes:
  - preferred_term: nitrogen cycle metabolic process
    term:
      id: GO:0071941
      label: nitrogen cycle metabolic process
  evidence:
  - reference: PMID:42780861
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: SynComs further increased the abundances of carbohydrate esterases and glycosyltransferases, as well as the relative
      abundance of the nitrification gene hao, thereby enhancing the potential for lignocellulose degradation, degradation
      product transformation, and nitrification.
    explanation: Demonstrates coordinated enhancement of lignocellulose degradation and nitrification by the SynCom.
  scope: COMMUNITY_LEVEL
