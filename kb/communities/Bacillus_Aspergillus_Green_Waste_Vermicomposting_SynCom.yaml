    evidence_source: IN_VITRO
    snippet: The SynCom was constructed using the three strains isolated in this study together with one laboratory-preserved
      strain, comprising two bacterial species ( Bacillus licheniformis and Bacillus subtilis ) and two fungal species ( Aspergillus
      nidulans and Aspergillus rugulosus ).
    explanation: Explicitly names Bacillus licheniformis, Bacillus subtilis, Aspergillus nidulans, and Aspergillus rugulosus
      as the four member species of the lignocellulose-degrading SynCom.
  - reference: PMID:42780861
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Finally, three culturable strains with no antagonistic activity against the laboratory-preserved lignin-modifying
      fungus Aspergillus nidulans were selected ( Yu et al., 2018 ): Bacillus licheniformis and Bacillus subtilis , which
      exhibited cellulase, LiP, or MnP activities, and Aspergillus rugulosus , which exhibited cellulase and Lac activities.'
    explanation: Documents the complementary cellulase, lignin peroxidase (LiP), manganese peroxidase (MnP), and laccase (Lac)
      activities of the four non-antagonistic SynCom members.
