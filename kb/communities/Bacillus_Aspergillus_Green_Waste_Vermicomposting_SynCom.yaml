id: CommunityMech:000474
name: Bacillus and Aspergillus Lignocellulose-Degrading Co-Vermicomposting SynCom
description: Synthetic lignocellulose-degrading cross-kingdom microbial consortium (SynCom) composed of Bacillus licheniformis,
  Bacillus subtilis, Aspergillus nidulans, and Aspergillus rugulosus applied at 5% inoculation during earthworm (Eisenia fetida)
  co-vermicomposting of high-lignin green waste and cattle manure. The SynCom stimulates lignocellulolytic enzyme and urease
  activities, enriches carbohydrate esterases, glycosyltransferases, and nitrification gene hao, reduces the C/N ratio, and
  increases humic substance and nitrate nitrogen content.
