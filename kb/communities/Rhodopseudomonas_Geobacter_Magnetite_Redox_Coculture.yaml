- name: Anaerobic Magnetite Fe(III) Reduction
  description: G. sulfurreducens reduces magnetite Fe(III), storing supplied electrons as reduced Fe(II) and charging
    the mineral. The demonstrated reversal requires suitable electron-donor and environmental conditions; it is
    not evidence of direct reciprocal nutrient exchange.
