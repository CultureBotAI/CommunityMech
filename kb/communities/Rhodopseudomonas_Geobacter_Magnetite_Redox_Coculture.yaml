id: CommunityMech:000268
name: Rhodopseudomonas-Geobacter Magnetite Redox Coculture
description: >
  A defined laboratory coculture in which the phototrophic Fe(II)-oxidizing
  bacterium Rhodopseudomonas palustris TIE-1 and the anaerobic Fe(III)-reducing
  bacterium Geobacter sulfurreducens cycle electrons through magnetite. The
  system demonstrates that mixed-valence magnetite can act as a recyclable
  electron donor and electron acceptor, effectively functioning as a naturally
  occurring biogeochemical battery under changing light and redox conditions.
  This community is DOE-relevant because mineral-mediated electron flow shapes
  subsurface elemental cycling and can influence contaminant fate in sediments,
  aquifers, and engineered remediation settings.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: METAL_REDUCTION
engineering_design:
  objective: >
    Test whether Fe ions bound in magnetite can serve as shared electron sinks
    and sources for Fe-metabolizing bacteria with complementary metabolisms.
  assembly_strategy: >
    Pair the phototrophic Fe(II)-oxidizing strain Rhodopseudomonas palustris
    TIE-1 with the anaerobic Fe(III)-reducing bacterium Geobacter sulfurreducens
    in magnetite-containing laboratory cocultures.
  perturbation_design: >
    Vary environmental conditions that alter the balance of phototrophic
    Fe(II) oxidation and anaerobic Fe(III) reduction, including light-dependent
    activity and organic-electron-donor availability.
  measurement_endpoints:
  - Fe(II)/Fe(III) ratio in magnetite
  - magnetic and spectroscopic measurements
  - reversible oxidation and reduction of magnetite
  evidence:
  - reference: PMID:25814583
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: changing environmental conditions enable the sharing of electrons in mixed-valent iron oxides between bacteria with different metabolisms
    explanation: Supports the experimental design around electron sharing through mixed-valence magnetite.
  - reference: PMID:25814583
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: through magnetic and spectroscopic measurements
    explanation: Supports the curated measurement endpoints used to track magnetite redox state.
