ecological_interactions:
- name: Magnetite-Mediated Electron Sharing
  description: 'The two recorded bacteria exchange electrons with a shared mixed-valence magnetite reservoir: R.
    palustris TIE-1 withdraws electrons during phototrophic Fe(II) oxidation, whereas G. sulfurreducens supplies
    electrons during Fe(III) reduction. This is mineral-mediated redox cycling, not a direct nutrient transfer from
    TIE-1 to Geobacter.'
  scope: COMMUNITY_LEVEL
  metabolites:
  - preferred_term: magnetite
    term:
      id: CHEBI:50821
      label: ferrosoferric oxide
    notes: Mixed-valence Fe3O4 mineral that serves as the shared electron reservoir.
  - preferred_term: Fe(II)
    term:
      id: CHEBI:29033
      label: iron(2+)
  - preferred_term: Fe(III)
    term:
      id: CHEBI:29034
      label: iron(3+)
  downstream:
  - target: Biogeochemical Battery Function
    description: Opposed microbial electron withdrawal and supply allow magnetite to function as the shared redox
      reservoir under the tested externally controlled conditions.
  evidence:
  - reference: PMID:25814583
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: sharing of electrons in mixed-valent iron oxides between bacteria with different metabolisms
    explanation: Supports magnetite-mediated electron sharing between metabolically distinct bacteria.
  - reference: PMID:25814583
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: bioavailable as electron sinks and electron sources
