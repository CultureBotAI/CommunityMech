  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although there was poor linear correlation in the assay, the E. coli ΔpurH mutant did not increase in frequency
      relative to the parent ( Fig. S1C ). Thus, our results suggest that a ΔpurH mutant does not have a competitive advantage
      over E. coli PFM2 in the presence of adenine, thus verifying that there was no benefit for PFM2 adenine auxotrophs in
      coculture.
    explanation: Proves that E. coli PFM2 ΔpurH fails to gain a competitive advantage over prototrophic PFM2 across initial
      frequencies 0.01–0.99 in coculture with R. palustris CGA676.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: One reason why E. coli PFM2 adenine auxotrophs would not have an advantage in coculture is if adenine availability
      repressed gene expression, thereby decreasing gene cost for the ancestor.
    explanation: Explains why cross-fed adenine eliminates the selective benefit of purH loss-of-function by repressing ancestral
      gene expression.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: WT and ΔpurH mutants were distinguished by counting CFUs on M9 agar with cations and 25 mM glucose and on LB
      agar and then determining ΔpurH populations from the difference.
    explanation: Details the selective M9 glucose agar vs permissive LB agar CFU enumeration used to measure relative frequencies
      of WT PFM2 and PFM2 ΔpurH.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The E. coli ΔpurH mutant required adenine for growth, but despite the availability of adenine, the ΔpurH mutant
      did not grow faster than the parent ( Fig. S1A and B ).
    explanation: Confirms that adenine auxotrophy via ΔpurH deletion confers no growth-rate advantage over prototrophic PFM2
      when exogenous adenine is present.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: E. coli MG1655 is inhibited by adenine due to an rph mutation that disrupts pyrE regulation ( 38 ), leading to
      suboptimal precursor distribution between purine and pyrimidine synthesis in the presence of adenine ( 39 ). E. coli
      PFM2 does not experience this toxicity because the rph mutation is repaired ( 28 , 29 ).
    explanation: Explains why the rph-repaired E. coli PFM2 genetic background was chosen for testing the Black Queen Hypothesis
      without confounding adenine toxicity.
