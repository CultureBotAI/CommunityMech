    snippet: For example, R. palustris externalizes enough of the purine, adenine, to support an E. coli adenine auxotroph
      population ( 25 , 26 ).
    explanation: Establishes that R. palustris externalizes sufficient adenine to support an E. coli adenine auxotroph population
      in coculture.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cocultures were started from various initial frequencies (targeting 0.01–0.99) of each E. coli strain (WT vs
      ΔpurH or WT vs. ΔpurH::kmR) for a total initial cell density of ~106 colony-forming units (CFU)/mL. R. palustris CGA676
      was inoculated to an initial density of ~106 CFU/mL. Frequencies were determined upon inoculation and after 5 days.
    explanation: Specifies the experimental three-member mutual-invasion inoculation design (~10^6 CFU/mL R. palustris CGA676
      paired with ~10^6 CFU/mL mixed E. coli PFM2 WT and ΔpurH across 0.01-0.99 initial frequencies).
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We verified that the same is true for E. coli PFM2 by RT-qPCR quantification of purH transcript; coculture PFM2
      purH levels were 20% of those in monoculture ( Fig. 3C ). Adding adenine to monocultures resulted in a purH transcript
      level that was 12% of that observed without adenine, suggesting that the low expression in coculture was due to adenine
      availability ( Fig. 3C ).
    explanation: Directly supports the outgoing downstream causal edge to Node 2 by proving that R. palustris-excreted adenine
      in coculture represses E. coli PFM2 purH transcription to 20% of monoculture levels.
- name: Repression of Prototrophic E. coli purH Expression Eliminating Fitness Advantage of PFM2 ΔpurH in Mutual-Invasion
    Competition
  description: In 5-day mutual-invasion competition assays across initial frequencies targeting 0.01 to 0.99 in coculture
    with R. palustris CGA676, engineered adenine-auxotrophic E. coli PFM2 ΔpurH did not increase in frequency relative to
    prototrophic E. coli PFM2 (Fig. S1C). Because adenine cross-fed from R. palustris CGA676 represses purH transcript levels
    in prototrophic E. coli PFM2 to 20% of monoculture levels (Figure 3C), the ancestral strain lowers its purine synthesis
    gene expression cost without gene loss, eliminating any competitive fitness advantage for PFM2 ΔpurH.
