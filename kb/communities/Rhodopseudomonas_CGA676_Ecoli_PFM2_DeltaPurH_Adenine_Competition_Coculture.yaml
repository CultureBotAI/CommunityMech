ecological_interactions:
- name: Ammonium and Adenine Cross-Feeding from R. palustris CGA676 to Prototrophic E. coli PFM2 and Auxotrophic PFM2 ΔpurH
  description: In anaerobic MDC medium containing 25 mM glucose as the sole carbon source and N2 as the sole nitrogen source,
    phototrophic Rhodopseudomonas palustris CGA676 fixes N2 into excreted ammonium (NH4+) and externalizes the purine adenine
    at levels sufficient to support an E. coli adenine auxotroph (ΔpurH) population alongside prototrophic E. coli PFM2, while
    both E. coli strains ferment glucose into organic acids that provide essential carbon to R. palustris.
