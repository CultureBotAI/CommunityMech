id: CommunityMech:000541
name: Rhodopseudomonas palustris CGA676 and Escherichia coli PFM2/PFM2 ΔpurH Adenine Competition Coculture
description: Defined three-strain synthetic bacterial mutual-invasion competition coculture pairing phototrophic nitrogen-fixing
  and adenine-excreting Rhodopseudomonas palustris CGA676 (~10^6 CFU/mL) with prototrophic Escherichia coli PFM2 and engineered
  adenine-auxotrophic Escherichia coli PFM2 ΔpurH (~10^6 CFU/mL total initial E. coli density across initial frequencies from
  0.01 to 0.99) in anaerobic M9-derived coculture medium (MDC) supplemented with 25 mM glucose under N2 headspace and constant
  illumination at 30 degrees C by Chuang et al. 2026 (PMID:42117636). Constructed to directly test the Black Queen Hypothesis
  prediction that adenine cross-feeding from R. palustris should confer a fitness advantage on E. coli purine-biosynthesis
  loss-of-function mutants, 5-day invasion-from-rare competition assays demonstrated that E. coli ΔpurH did not increase in
  frequency relative to ancestral prototrophic PFM2 across the 0.01–0.99 initial frequency gradient (Fig. S1C), because partner-supplied
  adenine represses purH transcription in prototrophic PFM2 to 20% of monoculture levels (Figure 3C), lowering ancestral gene
  expression cost and eliminating selective advantage for purH deletion.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: SYNTROPHY
engineering_design:
  objective: Directly test whether an engineered adenine auxotroph (Escherichia coli PFM2 ΔpurH) gains a Black Queen fitness
    advantage over prototrophic E. coli PFM2 when coinoculated in coculture with ammonium- and adenine-excreting Rhodopseudomonas
    palustris NifA* (CGA676).
  assembly_strategy: Construct E. coli PFM2 ΔpurH via lambda Red recombination using constructs amplified from the ΔpurH::kmR
    KEIO mutant JW3970 followed by FLP-mediated excision of the km resistance cassette, and coinoculate R. palustris CGA676
    (~10^6 CFU/mL) with mixed E. coli WT (PFM2) and ΔpurH (~10^6 CFU/mL total) across initial frequencies targeting 0.01–0.99.
  inoculation_strategy: Start cocultures from various initial frequencies (targeting 0.01–0.99) of each E. coli strain (WT
    vs ΔpurH) for a total initial E. coli cell density of ~10^6 CFU/mL alongside R. palustris CGA676 at an initial density
    of ~10^6 CFU/mL.
  perturbation_design: Vary the initial frequency of E. coli PFM2 ΔpurH relative to prototrophic E. coli PFM2 from 0.01 to
    0.99 in invasion-from-rare competition cocultures with R. palustris CGA676 over 5 days and determine frequencies by counting
    CFUs on M9 agar with cations and 25 mM glucose vs LB agar (Fig. S1C).
  measurement_endpoints:
  - CFU counts upon inoculation and after 5 days on LB agar (WT + ΔpurH)
  - CFU counts upon inoculation and after 5 days on M9 agar with cations and 25 mM glucose (WT only)
  - change in E. coli ΔpurH frequency across 0.01-0.99 initial frequencies
  - RT-qPCR quantification of purH transcript levels in monoculture vs coculture
  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also directly compared the fitness of E. coli PFM2 versus a ΔpurH mutant by coinoculating them in coculture
      with R. palustris NifA* (CGA676). We used a range of initial frequencies to simultaneously test for possible coexistence
      by mutual invasion, where an equilibrium frequency can be extrapolated from the x-intercept by linear regression analysis
      ( 10 , 32 – 34 ). Although there was poor linear correlation in the assay, the E. coli ΔpurH mutant did not increase
      in frequency relative to the parent ( Fig. S1C ).
    explanation: Documents the design and result of the three-strain mutual-invasion competition experiment pairing R. palustris
      CGA676, E. coli PFM2, and E. coli PFM2 ΔpurH.
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Competition assays were conducted in an invasion-from-rare format to consider coexistence by the mutual invasion
      criterion, where each population can increase when rare ( 32 , 34 ). Cocultures were started from various initial frequencies
      (targeting 0.01–0.99) of each E. coli strain (WT vs ΔpurH or WT vs. ΔpurH::kmR) for a total initial cell density of
      ~106 colony-forming units (CFU)/mL. R. palustris CGA676 was inoculated to an initial density of ~106 CFU/mL. Frequencies
      were determined upon inoculation and after 5 days.
    explanation: Specifies the ~10^6 CFU/mL initial densities, 0.01–0.99 frequency gradient, and 5-day duration of the competition
      assay.
