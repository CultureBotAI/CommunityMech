discussions:
- discussion_id: rph_frameshift_adenine_toxicity_vs_bqh_cost_saving_in_ecoli
  prompt: Why did purine biosynthesis mutations emerge at low frequency in earlier cocultures pairing R. palustris with Escherichia
    coli MG1655 (Figure 4A) whereas E. coli PFM2 ΔpurH gained no competitive advantage over prototrophic PFM2 in coculture
    with R. palustris CGA676?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - ecological_interactions#Repression of Prototrophic E. coli purH Expression Eliminating Fitness Advantage of PFM2 ΔpurH
    in Mutual-Invasion Competition
  rationale: PMID:42117636 shows that E. coli MG1655 carries an rph frameshift mutation that causes pyrimidine starvation
    and growth inhibition in the presence of adenine, which is alleviated by deleting purH (Figure 4B); in contrast, E. coli
    PFM2 has a repaired rph+ allele and represses purH transcription 5-fold in coculture, eliminating both adenine toxicity
    and BQH gene-cost selection.
  evidence:
  - reference: PMID:42117636
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: E. coli MG1655 is inhibited by adenine due to an rph mutation that disrupts pyrE regulation ( 38 ), leading to
