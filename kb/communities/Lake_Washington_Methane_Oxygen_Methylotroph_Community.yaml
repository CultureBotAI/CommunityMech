- name: Modeled Methylomonas-To-Methylobacter Formaldehyde Transfer
  description: 'An OptCom genome-scale model of Methylomonas sp. LW13 and Methylobacter tundripaludum 21/22 reports
    conditional formaldehyde transfer from Methylomonas to Methylobacter. With imposed MB:ML growth ratios, uptake
    occurs in the synthetic 0.05:1 scenario but not the sediment 9.3:1 scenario. These ratios are constraints, not
    predicted abundances. PARTIAL - optimization, borrowed biomass/maintenance parameters and a formaldehyde-inhibition
    constraint shape this result; no transfer was experimentally validated here. Conflicting wording elsewhere in
    the source remains unresolved under #1554, so this is a qualified reported prediction, not verified flux.'
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylomonas
    term:
      id: NCBITaxon:416
      label: Methylomonas
  target_taxon:
    preferred_term: Methylobacter
    term:
      id: NCBITaxon:429
      label: Methylobacter
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Shared external substrate in the model, not donor-to-recipient transfer.
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
    notes: Modeled export to the environment by both taxa, not partner-directed exchange.
  - preferred_term: formaldehyde
    term:
      id: CHEBI:16842
      label: formaldehyde
    notes: Conditional modeled Methylomonas-to-Methylobacter transfer; source wording discrepancies and lack of
      experimental validation remain explicit.
  biological_processes:
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  evidence:
  - reference: PMID:32655999
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: Methylobacter takes up some of the secreted formaldehyde from Methylomonas as a carbon source in addition
      to methane under the synthetic condition
    explanation: Results explicitly reports direction and synthetic-condition uptake; the main-text inconsistencies
      remain unresolved.
  - reference: PMID:32655999
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: the experimentally observed species abundance ratio was imposed on the growth rates
    explanation: The sediment/synthetic abundance ratios constrain the optimization; they are not recovered model
      predictions.
