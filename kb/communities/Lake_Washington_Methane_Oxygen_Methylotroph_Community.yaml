ecological_interactions:
- name: Methanotroph-Methylotroph Guild Coupling
  description: Methane-fed sediment microcosms co-enrich Methylococcaceae and non-methanotrophic Methylophilaceae.
    PARTIAL - growth and prior stable-isotope studies support inferred methane-derived carbon coupling between guilds,
    but this experiment does not identify the transferred compound, directly trace methanol donation or establish
    reciprocal benefit. Family-level coupling is not a resolved strain pair or a universal partnership.
  interaction_type: CROSS_FEEDING
  scope: PAIRWISE
  source_taxon:
    preferred_term: Methylococcaceae methanotrophs
    term:
      id: NCBITaxon:403
      label: Methylococcaceae
  target_taxon:
