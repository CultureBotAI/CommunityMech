      label: Methylophilaceae
  metabolites:
  - preferred_term: methane
    term:
      id: CHEBI:16183
      label: methane
    notes: Externally supplied methane supports the enrichment; methane is not established as the directly transferred
      donor-to-recipient compound.
  biological_processes:
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  evidence:
  - reference: PMID:25755930
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: likely involves communities composed of different functional guilds
    explanation: Supports the guild-level interpretation, not a resolved carbon mediator or reciprocal benefit in
      this microcosm.
  - reference: PMID:25755930
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: rather than a single type of microbe
    explanation: Supports the guild-level interpretation, not a resolved carbon mediator or reciprocal benefit in
      this microcosm.
  - reference: PMID:25755930
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: we do not have information regarding how a methanotroph can provide carbon to a community of non-methanotrophs
    explanation: Explicit limitation on the transfer mechanism; prior isotope studies are contextual evidence.
- name: Oxygen-Regime Dependent Guild Composition
  description: Under repeated methane feeding and daily gas resetting, initial oxygen regimes changed 16S relative
    guild composition after 10 and 16 weeks. Higher-oxygen treatments favored Methylosarcina/Methylophilus, whereas
    lower-oxygen treatments favored Methylobacter/Methylotenera, with intermediate mixtures and replicate exceptions.
    Low treatments became hypoxic before replenishment; these were not constant dissolved-oxygen levels. This establishes
    treatment-dependent composition, not a unique molecular partnership mechanism or absolute viable abundance.
    Listed participants are the reliable canonical aggregate/families/genera, not the incorrectly grounded Methylosarcina
    species.
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: methane metabolic process
    term:
      id: GO:0015947
      label: methane metabolic process
  downstream:
  - target: Methanotroph-Methylotroph Guild Coupling
    description: PARTIAL - changing the oxygen-feeding regime selects different relative abundances of methanotroph
      and methylotroph genera within the methane-fed guilds. This alters the observed guild composition, not a demonstrated
      specific carbon-transfer reaction or reciprocal benefit; the treatments also differ in time spent hypoxic.
  evidence:
  - reference: PMID:25755930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: different species persisted under different oxygen tensions
    explanation: Supports controlled oxygen-regime effects on relative guild composition, with intermediate/replicate
      variation rather than exclusive partner pairs.
  - reference: PMID:25755930
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: oxygen availability is at least one major factor determining specific partnerships in methane oxidation
    explanation: Supports controlled oxygen-regime effects on relative guild composition, with intermediate/replicate
      variation rather than exclusive partner pairs.
