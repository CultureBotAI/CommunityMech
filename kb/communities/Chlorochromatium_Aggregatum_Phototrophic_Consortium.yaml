ecological_interactions:
- name: Phototroph To Central Bacterium Metabolite Exchange
  description: Chlorobium chlorochromatii epibionts are inferred to supply carbon, nitrogen, sulfur sources,
    and vitamins to the metabolically reduced central bacterium.
