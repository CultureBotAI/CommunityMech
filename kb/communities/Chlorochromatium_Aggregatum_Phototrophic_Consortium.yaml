    explanation: Supports central-bacterium sensing and motility toward resources used by the epibiont.
- name: Possible Quinone-Mediated Electron Exchange
  description: Genome-based models propose that quinones and quinols could shuttle electrons between the
    central bacterium and epibiont, potentially coupling central-bacterium ATP synthesis to phototrophic
    energy conversion.
  interaction_type: SYNTROPHY
