id: CommunityMech:000141
name: Chlorochromatium aggregatum Phototrophic Consortium
description: A structured freshwater phototrophic bacterial consortium in which one central motile
  heterotrophic beta-proteobacterium, Candidatus Symbiobacter mobilis, is surrounded by approximately
  15 green sulfur bacterial Chlorobium chlorochromatii epibionts. Genome analyses support a highly
  specialized symbiosis involving metabolite exchange, central-bacterium sensing and motility toward
  light and sulfide, cell-cell adhesion, and possible quinone-mediated electron exchange.
