    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: electron cycling mechanisms, particularly those mediated by quinones
    explanation: Supports the proposed electron-transfer mechanism.
environmental_factors:
- name: anoxic sulfide-reduced medium
  value: Anaerobic sulfide-containing culture conditions
  description: Earlier physiology work maintained the consortium at high numbers in anoxic sulfide-reduced
    medium, consistent with the sulfide-dependent phototrophic lifestyle.
  evidence:
  - reference: PMID:9446684
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: maintained at high numbers in anoxic sulfide-reduced medium
    explanation: Supports the culture environment used for maintaining the consortium.
- name: light and sulfide gradients
  value: Light and sulfide are sensed by the central bacterium and used by the epibiont.
  description: The consortium's ecology depends on navigation toward resources that support anoxygenic
    photosynthesis by the green sulfur bacterial epibionts.
  evidence:
  - reference: PMID:24267588
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: can sense and move towards light and sulfide
    explanation: Supports light and sulfide as directional ecological factors.
