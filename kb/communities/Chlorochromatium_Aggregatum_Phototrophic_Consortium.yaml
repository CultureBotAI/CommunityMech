discussions:
- discussion_id: chlorochromatium_exchange_and_sensory_causality
  prompt: Which metabolite and electron fluxes, and which sensory proteins, are necessary in the intact consortium?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - ecological_interactions#Phototroph To Central Bacterium Metabolite Exchange
  - ecological_interactions#Central Bacterium Navigation For Epibiont Resources
  - ecological_interactions#Possible Quinone-Mediated Electron Exchange
  rationale: The genomic model, recombinant photosensor assays and fraction HPLC do not resolve partner-specific
    exchange, electron flow or shared protonmotive force. Sulfide sensing and indirect signaling remain unresolved.
    The 1998 growth assay required external 2-oxoglutarate; epibiont axenic growth excludes mutual obligate growth.
    Direct transfer, mediator perturbation/rescue and intact-consortium sensory tests are needed. Main-text quinone
    figure numbering differs from the supplement list; no unseen supplemental panel is certified.
  posed_by: codex
  posed_date: '2026-10-05'
