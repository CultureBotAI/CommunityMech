- name: Central Bacterium Navigation For Epibiont Resources
  description: The central bacterium contributes motility and sensing, including movement toward light
    and sulfide that directly benefit the attached phototrophic epibionts.
  interaction_type: COLONIZATION_FACILITATION
  source_taxon:
    preferred_term: Candidatus Symbiobacter mobilis central bacterium
