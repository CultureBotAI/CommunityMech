ecological_interactions:
- name: Phototroph To Central Bacterium Metabolite Exchange
  description: HYPOTHESIZED - genome reconstruction and prior physiology suggest transfer of fixed-carbon/nitrogen
    compounds and cofactors from Chlorobium chlorochromatii to the central bacterium. The epibiont can grow axenically,
    whereas independent central-bacterium growth has not been obtained. Exact donor-to-recipient fluxes are unresolved,
    and the intact-consortium physiology assay required external 2-oxoglutarate. Photosynthetic CO2 and sulfide
    inputs are not identified exchanged products.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chlorobium chlorochromatii CaD3 epibiont
    term:
      id: NCBITaxon:340177
      label: Chlorobium chlorochromatii CaD3
  target_taxon:
    preferred_term: Candidatus Symbiobacter mobilis central bacterium
    term:
      id: NCBITaxon:1436290
      label: Candidatus Symbiobacter mobilis
  biological_processes:
  - preferred_term: photosynthesis
    term:
      id: GO:0015979
      label: photosynthesis
  downstream:
  - target: Possible Quinone-Mediated Electron Exchange
    description: HYPOTHESIZED - provision of epibiont-derived menaquinone-7 or a soluble intermediate could supply
      the quinone pool required by the proposed bidirectional electron shuttle. Neither quinone transfer nor shared
      protonmotive force was demonstrated; bulk/fraction quinone detection is not flux evidence.
  evidence:
  - reference: PMID:24267588
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: extensive metabolic exchange, involving carbon, nitrogen, and sulfur sources as well as vitamins
    explanation: The genome-based model proposes broad exchange. Full Results discuss candidate sugars, amino acids
      and vitamins; no direct transfer assay establishes all these fluxes or a self-sufficient carbon economy.
- name: Central Bacterium Navigation For Epibiont Resources
  description: PARTIAL - the central bacterium supplies the consortium flagellum, and intact consortia exhibit chemotaxis
    to sulfide and a scotophobic response. The 2013 study demonstrated recombinant central-bacterium photosensor
    activity in E. coli, supporting a direct-sensing model, but did not establish its necessity in intact consortia.
    Sulfide sensors remain unidentified and indirect epibiont signaling is not excluded. Navigation can position
    attached phototrophs at resources; colonization facilitation and its effect on metabolite transfer were not
    measured.
  scope: PAIRWISE
  source_taxon:
    preferred_term: Candidatus Symbiobacter mobilis central bacterium
    term:
      id: NCBITaxon:1436290
      label: Candidatus Symbiobacter mobilis
  target_taxon:
    preferred_term: Chlorobium chlorochromatii CaD3 epibiont
    term:
      id: NCBITaxon:340177
      label: Chlorobium chlorochromatii CaD3
  metabolites:
  - preferred_term: hydrogen sulfide
    term:
      id: CHEBI:16136
      label: hydrogen sulfide
    concentration: Attractant/resource for the consortium
  downstream:
  - target: Phototroph To Central Bacterium Metabolite Exchange
    description: HYPOTHESIZED - navigation toward light and sulfide could improve resource access for the attached
      phototroph and thereby support production of metabolites available to the central bacterium. Taxis is observed,
      but its causal effect on partner-resolved metabolite flux was not isolated.
  evidence:
  - reference: PMID:24267588
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: can sense and move towards light and sulfide
    explanation: The genomic interpretation supports central sensory capacity. The full source distinguishes recombinant
      photosensor characterization from unresolved in-consortium causality and unidentified sulfide sensors.
  - reference: PMID:24267588
    snippet: Recombinant bacteriophytochromes produced in these three strains were purified and characterized by
      absorbance spectroscopy.
    explanation: The Results describe E. coli expression and spectroscopy of central-bacterium Cenrod_2641, not
      a sensory knockout or necessity test in the intact consortium.
    evidence_source: IN_VITRO
    supports: PARTIAL
  - reference: PMID:9446684
    snippet: sulfide, thiosulfate, 2-oxoglutarate, and citrate served as a chemoattractant
    explanation: Supports measured consortium chemotaxis. The abstract infers epibiont signaling rather than isolating
      the sensory protein or its effect on partner exchange.
    evidence_source: IN_VITRO
    supports: SUPPORT
- name: Possible Quinone-Mediated Electron Exchange
  description: HYPOTHESIZED - quinone or intermediate transfer and bidirectional quinone/quinol cycling could couple
    central-bacterium energy conservation to epibiont photosynthesis, potentially sharing protonmotive force through
    cell contacts. HPLC detected menaquinone-7 in intact consortia and central-bacterium-enriched fractions, not
    purified central cells or traced interspecies transfer. The authors explicitly require experimental tests of
    this electron-shuttling model.
  interaction_type: SYNTROPHY
  scope: PAIRWISE
  source_taxon:
    preferred_term: Chlorobium chlorochromatii CaD3 epibiont
    term:
      id: NCBITaxon:340177
      label: Chlorobium chlorochromatii CaD3
  target_taxon:
    preferred_term: Candidatus Symbiobacter mobilis central bacterium
    term:
      id: NCBITaxon:1436290
      label: Candidatus Symbiobacter mobilis
  evidence:
  - reference: PMID:24267588
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: electron cycling mechanisms, particularly those mediated by quinones
    explanation: Supports an explicitly proposed quinone-transfer/electron-cycling model, not measured interspecies
      electron flux, shared protonmotive force or obligatory respiratory coupling.
  - reference: PMID:24267588
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: we hypothesize that menaquinone-7, or a soluble quinone intermediate synthesized by Chl. chlorochromatii
    explanation: Supports an explicitly proposed quinone-transfer/electron-cycling model, not measured interspecies
      electron flux, shared protonmotive force or obligatory respiratory coupling.
  - reference: PMID:24267588
    snippet: Only menaquinone-7 was detected in extracts prepared from intact consortia and fractions enriched in
      the central bacterium.
    explanation: HPLC provides chemical-presence evidence in intact/enriched material; enrichment is not purification,
      and detection does not demonstrate transfer direction or shuttling.
    evidence_source: IN_VITRO
    supports: PARTIAL
