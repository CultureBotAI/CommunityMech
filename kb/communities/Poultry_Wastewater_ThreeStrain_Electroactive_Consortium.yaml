ecological_interactions:
- name: Proposed Electroactive Consortium Complementarity
  description: 'HYPOTHESIZED: metabolic complementarity and biofilm organization among Lysinibacillus sphaericus
    A1, Bacillus cereus A2 and Lactococcus lactis A4 may explain improved mixed-inoculum performance. The three-strain
    versus pure-culture comparison demonstrates a treatment difference, not measured resource partitioning, interspecies
    electron transfer or the individual necessity of a strain. Section 2.1.1 standardizes culture OD600 but leaves
    total mixed-versus-single inoculum volume ambiguous.'
  scope: COMMUNITY_LEVEL
  downstream:
  - target: Consortium-Enhanced Anode Power Output
    description: 'HYPOTHESIZED: complementary microbial metabolism and biofilm organization may increase electron
      delivery and thus power output. Retain the authors proposed mechanism for the positive mixed-versus-pure comparison;
      no strain-resolved electron-transfer or complementarity perturbation isolates this mechanism.'
  - target: Consortium-Enhanced Chemical Oxygen Demand Removal
    description: 'HYPOTHESIZED: complementary metabolism may improve utilization of oxidizable substrates and hence
      COD reduction. COD is an aggregate assay in amended, sterilized wastewater, not proof of native-wastewater
      mineralization; Section 3.3 inconsistencies prevent certifying the exact reported ranking from concentrations.'
  evidence:
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: selecting complementary strains with diverse metabolic functions can substantially improve system performance
    explanation: Supports the authors proposed complementarity interpretation, not a directly established niche-partitioning
      mechanism.
  participating_taxa:
  - preferred_term: Lysinibacillus sphaericus A1
    term:
      id: NCBITaxon:1421
      label: Lysinibacillus sphaericus
  - preferred_term: Bacillus cereus A2
