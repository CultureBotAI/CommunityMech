ecological_interactions:
- name: Complementary electroactive consortium performance
  description: >
    Combining the three electroactive strains produced an emergent improvement
    in power output and chemical oxygen demand removal relative to the pure
    cultures, consistent with the source's interpretation of complementary
    metabolic functions.
  interaction_type: NICHE_PARTITIONING
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: selecting complementary strains with diverse metabolic functions can substantially improve system performance
    explanation: Supports metabolic complementarity as the proposed basis for the consortium-level improvement.
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared with single cultures, the consortium produced approximately 15% higher power density than L. sphericus A1, about 29% higher than B. cereus A2, and more than threefold higher than L. lactis A4.
    explanation: Quantifies the emergent power-density improvement over each pure culture.
