discussions:
- discussion_id: poultry-complementarity-and-cod-source-discrepancy
  prompt: Which mechanisms and reconciled measurements explain the mixed-culture advantage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  rationale: 'Both existing mechanism-to-performance directions remain HYPOTHESIZED; positive power and reported
    COD results remain. Full primary methods/results/discussion were read. SEM biofilm morphology is not strain-resolved
    transfer or causal complementarity. The OD600-normalized inoculation wording does not unambiguously establish
    equal total starting biomass. Section 3.3 percentages and concentrations appear crossed, and COD does not identify
    degradation pathways or distinguish amended from native substrates. Independent raw data or author clarification
    is needed before a numerical correction. Non-graph reported 84.4% remains unchanged, not certified, under #1716.'
  attaches_to:
  - ecological_interactions#Proposed Electroactive Consortium Complementarity
  - ecological_interactions#Consortium-Enhanced Anode Power Output
  - ecological_interactions#Consortium-Enhanced Chemical Oxygen Demand Removal
