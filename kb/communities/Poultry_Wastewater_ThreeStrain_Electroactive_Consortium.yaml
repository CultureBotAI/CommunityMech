      label: Lactococcus lactis
- name: Consortium-Enhanced Anode Power Output
  description: During the 30-day dual-chamber MFC study, the consortium reached a reported maximum power density
    of 170 mW/m2, approximately 15% above L. sphaericus A1, 29% above B. cereus A2 and more than threefold above
    L. lactis A4. Preserve this positive tested-system comparison, not a claim that output remained higher at every
    time point. The matrix was nutrient-amended and sterilized, not raw wastewater.
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared with single cultures, the consortium produced approximately 15% higher power density than
      L. sphericus A1, about 29% higher than B. cereus A2, and more than threefold higher than L. lactis A4.
    explanation: Quantifies the emergent power-density improvement over each pure culture.
  participating_taxa:
  - preferred_term: Lysinibacillus sphaericus A1
    term:
      id: NCBITaxon:1421
      label: Lysinibacillus sphaericus
  - preferred_term: Bacillus cereus A2
    term:
      id: NCBITaxon:1396
      label: Bacillus cereus
  - preferred_term: Lactococcus lactis A4
    term:
      id: NCBITaxon:1358
      label: Lactococcus lactis
- name: Consortium-Enhanced Chemical Oxygen Demand Removal
  description: 'The abstract reports the consortium had the greatest COD removal (84.4%) in amended, sterilized
    model wastewater. Preserve that reported result with a source discrepancy: Section 3.3 pairs consortium 84.4%
    with 2150-to-436 mg/L and L. sphaericus 79.7% with 2150-to-335 mg/L, which yield approximately 79.7% and 84.4%,
    respectively. Do not silently swap these values or certify the exact quantitative ranking. COD cannot distinguish
    native-organic degradation, supplement consumption, biomass assimilation and abiotic changes.'
  scope: COMMUNITY_LEVEL
  evidence:
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The highest COD removal (84.4%) was also recorded
    explanation: Supports the abstract-reported 84.4%, not reconciled agreement with the inconsistent Section 3.3
      concentrations.
  participating_taxa:
  - preferred_term: Lysinibacillus sphaericus A1
    term:
      id: NCBITaxon:1421
      label: Lysinibacillus sphaericus
  - preferred_term: Bacillus cereus A2
    term:
