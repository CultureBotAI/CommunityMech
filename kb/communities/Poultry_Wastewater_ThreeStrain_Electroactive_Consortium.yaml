id: CommunityMech:000330
name: Poultry-Wastewater Three-Strain Electroactive Consortium
description: >
  A defined equal-volume consortium of Lysinibacillus sphaericus A1, Bacillus
  cereus A2, and Lactococcus lactis A4 tested in dual-chamber microbial fuel
  cells containing amended, sterilized poultry slaughterhouse wastewater. The
  consortium produced more power and removed more chemical oxygen demand than
  the constituent strains tested separately during the 30-day experiment.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Compare electricity generation and chemical oxygen demand removal by three pure cultures and their defined consortium in poultry-wastewater microbial fuel cells.
  assembly_strategy: Standardize each strain to OD600 0.8 +/- 0.05 and combine 1 mL of each culture in equal volumes in the anode chamber.
  measurement_endpoints:
  - power density
  - voltage and current density
  - chemical oxygen demand removal
  - anode-associated biofilm morphology
  evidence:
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study evaluated the electrochemical activity and COD removal efficiency of three individual bacterial strains
    explanation: Supports the comparative microbial fuel-cell design and its principal endpoints.
  - reference: PMID:41594859
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A volume of 1 mL of each culture was introduced into the anode chambers of the MFCs, either individually or as an equal-volume mixture to form the microbial consortium.
    explanation: Supports the inoculum volume and equal-volume consortium assembly.
