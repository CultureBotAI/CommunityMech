ecological_interactions:
- name: Total-carbon-driven community state shifts
  description: The full 16-member SynCom reproducibly shifted among states along the total-carbon gradient, with A. caviae
    dominating low total carbon, P. chlororaphis rising to high abundance with A. caviae at intermediate carbon, and C. koseri
    dominating high carbon. The source attributed these state transitions principally to total carbon availability, with R2A-derived
    resource complexity acting as a secondary modulator.
  interaction_type: COMPETITION
  scope: COMMUNITY_LEVEL
  biological_processes:
  - preferred_term: interspecies interaction between organisms
    term:
      id: GO:0044419
      label: biological process involved in interspecies interaction between organisms
  evidence:
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we observed a repeatable state shift pattern in the serially transferred multispecies synthetic community
    explanation: Supports state shifts as a repeatable community-level outcome of the serial-transfer SynCom.
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: total carbon availability was the principal driver of community-level state transitions
    explanation: Identifies total carbon availability as the primary driver of the SynCom state transitions.
environmental_factors:
- name: total carbon concentration
  value: 0.031 to 4 g C/L
  description: Eight total-carbon concentrations were generated by 1:2 serial dilution of glucose/R2A media with carbon-free
    M9 minimal medium.
  evidence:
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: generate eight total carbon concentrations ranging from 0.031 to 4
    explanation: Supports the range and count of total-carbon concentrations in the resource grid.
- name: R2A-derived carbon fraction
  value: 0 to 100% of total carbon
  description: Twelve mixtures varied the fraction of carbon supplied by R2A medium versus glucose while holding total carbon
    constant before serial dilution.
  evidence:
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the proportion of R2A-derived carbon ranged from 0 to 100% of total carbon
    explanation: Supports the resource-complexity gradient across R2A-derived carbon fractions.
growth_media:
- name: M9 glucose/R2A carbon-gradient media
  composition:
  - name: M9 minimal medium salts
  - name: D-glucose
    chebi_term:
      preferred_term: D-glucose
      term:
        id: CHEBI:17634
        label: D-glucose
  - name: R2A Broth powder
  inoculum_source: equal-volume pooled HAMBI 16-species pre-culture
  inoculum_size: '1'
  inoculum_unit: '% transferred every 48 h'
  incubation_time: '16'
  incubation_time_unit: d
  vessel_type: 96-well deep-well plate
  preparation_notes: Glucose minimal medium and R2A medium were each prepared at 4 g C/L in M9 minimal medium, mixed to 12
    R2A-derived carbon fractions, and then diluted with carbon-free M9 to eight total-carbon concentrations.
  evidence:
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Glucose minimal media were prepared by adding glucose stock to M9 minimal medium
    explanation: Supports use of glucose-supplemented M9 minimal medium in the 96-condition grid.
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: R2A medium was prepared by dissolving R2A Broth powder (Neogen, UK) in M9 minimal medium
    explanation: Supports R2A broth powder as the complex-resource source.
cultivation_setup:
- cultivation_mode: BATCH
  system_type: OTHER
  instrument_detail: 1 mL cultures in 96-well deep-well plates with 1% serial transfer every 48 h.
  working_volume: 1.0
  working_volume_unit: mL
  controls_notes: Each of 96 resource conditions was replicated eight times and propagated in fresh media with the same glucose/R2A
    carbon composition at every transfer.
  evidence:
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: new 96-well deep-well plates containing 1 ml of fresh growth medium
    explanation: Supports the deep-well plate cultivation system and 1 mL working volume.
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Every 48 h, 1% of each culture from the previous plates was transferred
    explanation: Supports the serial-transfer interval and inoculum fraction.
