  preferred_term: serially passaged laboratory SynCom
  term:
    id: ENVO:01001405
    label: laboratory environment
  notes: This is a defined in-vitro HAMBI SynCom assayed in synthetic M9/R2A/glucose media rather than a natural sample community.
