id: CommunityMech:000423
name: HAMBI Carbon-Gradient 16-species SynCom
description: A 16-species HAMBI synthetic bacterial community serially transferred for 16 days in a fully factorial panel
  of 96 glucose/R2A resource environments spanning eight total-carbon concentrations and 12 levels of R2A-derived carbon.
  The experiment tested how total carbon availability and resource complexity structure community-state shifts, with Aeromonas
  caviae, Pseudomonas chlororaphis, and Citrobacter koseri dominating low-, intermediate-, and high-carbon states.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: OTHER
engineering_design:
  objective: Test whether resource complexity and total carbon availability alter composition, diversity, and state transitions
    in a defined 16-species synthetic community.
  assembly_strategy: Assemble 16 bacterial strains from the HAMBI culture collection into a modified version of a previously
    used synthetic community spanning aquatic, soil, and host-associated origins.
  inoculation_strategy: Pre-culture each strain for one growth cycle, equalize optical density, pool the cultures at equal
    volume, and inoculate eight replicate communities for each of 96 resource conditions.
  passaging_regimen: Serially transfer each 1 mL deep-well culture every 48 h for 16 days, moving 1% of the culture into fresh
    medium with the same R2A and glucose-derived carbon concentrations.
  perturbation_design: Cross eight total-carbon concentrations from 0.031 to 4 g C/L with 12 resource-complexity levels generated
    by varying the fraction of carbon supplied by R2A.
  measurement_endpoints:
  - OD600 at each 48 h transfer
  - endpoint 16S rRNA amplicon-derived relative abundances
  - monoculture growth traits of the three dominant species across glucose-derived carbon levels
  - pH in the 16-species community and in individual species grown on glucose
  - Shannon diversity and t-SNE/DBSCAN community-state clustering
  evidence:
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: transferring a 16-species synthetic community in 96 different resource environments
    explanation: Supports the bounded 16-member, 96-environment experimental design.
  - reference: PMID:42367191
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After pre-culturing each of the 16 species of the community for one growth cycle, we adjusted the optical density
      of each culture, pooled them at equal volume
    explanation: Supports equal-volume pooling after individual pre-culture and OD adjustment.
