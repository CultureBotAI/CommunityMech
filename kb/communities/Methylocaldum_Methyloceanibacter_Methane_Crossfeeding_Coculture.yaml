id: CommunityMech:000169
name: Methylocaldum-Methyloceanibacter Methane Cross-Feeding Coculture
description: >
  A defined aerobic methane-fed laboratory coculture pairing the marine methanotroph Methylocaldum
  marinum S8 with the facultative methylotroph Methyloceanibacter caenitepidi Gela4. M. marinum S8
  oxidizes methane and supports syntrophic growth of M. caenitepidi Gela4 on methane-derived carbon.
  Transcriptome and chemical analyses indicate that acetate, rather than methanol alone, is likely a
  major cross-fed carbon source in this model methanotroph-methylotroph community.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: CARBON_SEQUESTRATION
engineering_design:
  objective: Resolve methane-derived carbon cross-feeding from a marine methanotroph to a facultative
    methylotroph under defined coculture conditions.
  assembly_strategy: Bottom-up two-strain coculture assembled from isolated Methylocaldum marinum S8 and
    Methyloceanibacter caenitepidi Gela4.
  perturbation_design: M. caenitepidi Gela4 transcriptomes in methanol pure culture were compared with
    Gela4 cells grown in methane-fed coculture with M. marinum S8.
  measurement_endpoints:
  - Coculture growth
  - Species composition by microscopy and read mapping
  - RNA-seq expression profiles
  - Methanol and organic-acid concentrations
  evidence:
  - reference: PMID:30870453
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: grows syntrophically with the methanotroph, Methylocaldum marinum S8
    explanation: Supports the defined syntrophic coculture design.
  - reference: PMID:30870453
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: genomic analyses of the two strains, as well as RNA-Seq and chemical analyses
    explanation: Supports the multi-modal experimental design used to infer the interaction mechanism.
