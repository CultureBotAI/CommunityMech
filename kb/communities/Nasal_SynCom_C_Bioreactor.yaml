environmental_factors:
- name: Day-20 Staphylococcus aureus challenge
  value: Sa C, Sa A, or no S. aureus after 20 days of SynCom C stabilization
  description: SynCom C was first maintained without S. aureus and then challenged with one of two excluded S. aureus isolates
    at a 1000-fold lower OD600 than the established nasal microbiome.
  evidence:
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We first maintained stable nasal microbiomes of the SynCom without S. aureus
    explanation: Supports the S. aureus-free stabilization phase.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we added two different S. aureus strains ( i.e. , Sa C or Sa A) (Table S2) to the bioreactor on Day 20
    explanation: Supports the timing and identity of the S. aureus perturbation.
growth_media:
- name: synthetic nasal medium 3
  temperature: '30'
  temperature_unit: degrees Celsius
  ph: '6.5'
  atmosphere: MICROAEROBIC
  inoculum_source: equal-ratio frozen SynCom C aliquot
  inoculum_size: '2.5'
  inoculum_unit: mL of OD600nm=1 SynCom
  incubation_time: '20'
  incubation_time_unit: d
  vessel_type: 250 mL continuously fed glass bioreactor
  preparation_notes: Synthetic nasal medium was supplied in continuous mode at the optimized 1 d-1 dilution rate and pH 6.5.
    SynCom C was inoculated on Day 0 and stabilized to Day 20 before S. aureus challenge.
  evidence:
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a continuous mode, a dilution rate of 1 d-1
    explanation: Supports continuous operation at the optimized 1 per day dilution rate.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a temperature of 30xlink:href=" a pH of 6.5, and a medium concentration with SNM 3
    explanation: Supports the 30 degrees Celsius optimal operating temperature; the cached article text has a malformed
      degree-symbol artifact after 30.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a pH of 6.5, and a medium concentration with SNM 3
    explanation: Supports the pH 6.5 synthetic nasal medium 3 condition.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We inoculated 1 mL of fresh nasal-swab specimens or 2.5 mL of the SynCom (OD600nm=1) into the bioreactor on Day
      0.
    explanation: Supports the Day-0 SynCom inoculum volume and OD600.
cultivation_setup:
- cultivation_mode: CONTINUOUS
  system_type: CHEMOSTAT_VESSEL
  instrument_detail: 250 mL glass bioreactors supplied with synthetic nasal medium by peristaltic pumps and mixed with magnetic
    stirrers at 250 rpm.
  feed_or_dilution_rate: 1.0
  feed_or_dilution_rate_unit: 1/d
  ph_controlled: true
  do_controlled: false
  temperature_controlled: true
  controls_notes: pH was actively controlled; microaerobic conditions were maintained with a large air filter and measured
    with a real-time oxygen sensor.
  evidence:
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We operated six 250-mL, glass bioreactors (DWK Life Sciences, Mainz, Germany) as axenic chemostats in a continuously-fed
      mode
    explanation: Supports the glass continuous chemostat vessel configuration.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We maintained a fully stirred liquid within the bioreactors using a magnetic stirrer
    explanation: Supports stirred operation for homogeneous liquid conditions.
