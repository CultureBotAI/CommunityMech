id: CommunityMech:000395
name: Nasal SynCom C Bioreactor
description: A nine-strain synthetic nasal community assembled from LaCa collection isolates recovered from Volunteer 1 and
  cultivated in a continuously fed glass bioreactor with synthetic nasal medium to maintain a stable S. aureus-free nasal
  microbiome before Day-20 S. aureus strain challenges.
ecological_state: ENGINEERED
community_origin: SYNTHETIC
community_category: BIOTECHNOLOGY
engineering_design:
  objective: Develop a defined bottom-up nasal microbiome in a continuous bioreactor to test strain-specific Staphylococcus
    aureus colonization resistance.
  assembly_strategy: Combine nine LaCa collection nasal strains from Volunteer 1 in equal proportions while excluding both
    S. aureus challenge isolates.
  inoculation_strategy: Wash rich-medium precultures, resuspend each strain in a phosphate-buffered saline-glycerol solution
    to OD600 5, combine them equally into SynCom C, freeze aliquots, and inoculate 2.5 mL of OD600 1 SynCom into each bioreactor
    on Day 0.
  perturbation_design: Operate five SynCom C bioreactors through Day 20 before adding no S. aureus, Sa C, or Sa A to duplicate
    challenge bioreactors.
  measurement_endpoints:
  - daily optical density at 600 nm
  - total bacterial and S. aureus qPCR copy numbers
  - 16S-ITS-23S rRNA operon amplicon profiles
  counter_selection:
  - criterion: Excluded Staphylococcus aureus isolates Sa A and Sa C were reserved as Day-20 challenge strains rather than
      resident members of the nine-strain SynCom C inoculum.
    excluded_count: 2
    evidence:
    - reference: doi:10.64898/2026.03.16.712028
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Staphylococcus aureus Sa A Vol. A BHI Overnight Aerobiosis Excluded
      explanation: Table S2 marks S. aureus Sa A as excluded from SynCom C.
    - reference: doi:10.64898/2026.03.16.712028
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Staphylococcus aureus Sa C Vol. C BHI Overnight Aerobiosis Excluded
      explanation: Table S2 marks S. aureus Sa C as excluded from SynCom C.
    - reference: doi:10.64898/2026.03.16.712028
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: For the decolonization experiment, we added two different S. aureus strains
      explanation: The excluded S. aureus strains were introduced later as perturbations.
  evidence:
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We designed a single SynCom from nine nasal strains that were isolated from Volunteer 1
    explanation: Supports the defined nine-strain SynCom C construction from one nasal donor.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We then assembled the SynCom by combining the resuspended nasal strains in an equal ratio.
    explanation: Supports the equal-ratio assembly strategy.
  - reference: doi:10.64898/2026.03.16.712028
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Following stabilization, we added to duplicate bioreactors two S. aureus strains
    explanation: Supports the post-stabilization S. aureus challenge design.
