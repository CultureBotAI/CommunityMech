cache_dir: references_cache
# Explicit supplement locators require the catalog's exact local source files.
source_catalog: conf/reference_sources/catalog.json
skip_prefixes:
  - BIOPROJECT
unknown_prefix_severity: WARNING
# Evidence snippets quote the source. Bracket contents are part of that
# evidence, including scientific notation and numbered citations (#622).
literal_bracket_patterns:
  - '.*'
