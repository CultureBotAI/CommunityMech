# CommunityMech QC config — drives the kg_microbe_qc dashboard generator
# (lives in culturebotai-claw/src/kg_microbe_qc/; invoked via `just gen-qc-dashboard`).
#
# Each slot is checked against every MicrobialCommunity YAML in kb/communities.
# threshold = coverage required to pass (0.0-1.0); required=true reports FAIL,
# false reports WARN.

repo_name: CommunityMech
yaml_dir: ../kb/communities
pattern: "*.yaml"

slots:
  # core identity (must be 100%)
  - path: id
    threshold: 1.0
    required: true
  - path: name
    threshold: 1.0
    required: true
  - path: description
    threshold: 1.0
    required: true

  # classification (high coverage expected)
  - path: ecological_state
    threshold: 0.90
    required: false
  - path: community_category
    threshold: 0.90
    required: false
  - path: environment_term
    threshold: 0.85
    required: false

  # biology (high coverage expected)
  - path: taxonomy
    threshold: 0.90
    required: false
  - path: ecological_interactions
    threshold: 0.85
    required: false
  # 2 of 312 (0.6%), not 90%. The threshold asserted a target two orders of
  # magnitude away from reality, so this slot has been a permanent WARN that
  # clears only if somebody backfills 310 records — a gate nobody can act on is
  # one everybody learns to skip past (#325).
  #
  # 0.0 matches the `discussions` precedent below: honest about there being
  # almost no data, never blocking. Raise it when coverage is actually growing,
  # which it now can — since #395 every `gtdb_ground.py` write appends an event,
  # so any grounding sweep records itself.
  #
  # NOT a statement that provenance does not matter. The corpus timestamp on the
  # dashboard rests on those 2 records, and the generator labels it as such
  # ("from 2 of 312 records"), so the gap is visible rather than silent.
  - path: curation_history
    threshold: 0.0
    required: false

  # enrichment (partial coverage acceptable)
  - path: environmental_factors
    threshold: 0.50
    required: false
  - path: related_ingredients
    threshold: 0.40
    required: false
  - path: associated_datasets
    threshold: 0.30
    required: false

  # new shared section (no data yet → low bar, never blocking)
  - path: discussions
    threshold: 0.0
    required: false
