limitations:
- The complete 44,444-character 2011 projection, Table 1, all 38 references, five
  captions and all five original figures were read. The 2013 hydrogen-assay body is
  current-claim-critical and remains inaccessible; the 2015 extension remains abstract/metadata/highlight
  scope.
- Both follow-up APIs returned only coredata despite HTTP 200. Linking Hub pages are
  redirects; direct publisher browser routes returned 403. OpenAlex supplies no OA/PDF
  route. Bounded public discovery did not recover focal bodies; no author contact,
  paid access or challenge bypass occurred.
- No supplementary declaration or link was found in the inspected 2011 HTML. This
  is not a global data-absence claim, and unavailable follow-up resource declarations
  cannot be certified.
- Figure 1 Results and panel b show 0/24/48/72/96 h, whereas the caption lists 0/24/48/60/72
  h. The 5.8 g/L Figure 4 substrate-loading result and 7.9 g/L abstract/Figure 5 endpoint
  are different assay contexts.
- Staging, temperature and glucose-bearing inoculum are coupled. Mixed crude extracts
  normalized by thiolase constrain enzyme interpretation; bulk OD is not strain-resolved
  abundance. No raw-data, sequence or image reanalysis was performed.
- Direct ATCC 13564 catalogue access was unavailable, while primary Methods and local
  authority support N1-4 identity. Its HMT derivative is distinct. No catalogue growth
  protocol or species aggregate is substituted.
- Lead/root source reading, child selected-section authority work and sibling full-cache/current-issue
  reading have separate pinned scopes. Adapter filename discovery is explicitly reused
  with fresh runtime checks. Original 28-input inspection/native receipts remain unchanged;
  final review binds 30 inputs.
