- evidence_id: identity
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Bacterial strains and culture media., sole paragraph
  summary: The paper explicitly names C. thermocellum NBRC103400 (ATCC 27405) and
    N1-4 (ATCC 13564). C. beijerinckii NCIMB 8052 and C. acetobutylicum ATCC 824 are
    comparator partners, not additional focal members.
  support: supports
  accessed_at: '2026-10-21T23:22:09.268969Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: nbrc-recipe
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Bacterial strains and culture media., sole paragraph,
    NBRC medium 979 formulation
  summary: Per liter, NBRC 979 contains (NH4)2SO4 1.3 g; MgCl2·6H2O 2.6 g; KH2PO4
    1.43 g; K2HPO4·3H2O 7.2 g; CaCl2·2H2O 0.13 g; sodium glycerophosphate 6 g; FeSO4·7H2O
    1.1 mg; glutathione 0.25 g; yeast extract 4.5 g; resazurin 1 mg; and cellobiose
    5 g or assay-specific Avicel. Preparation pH is 7.0. Butanol is not supplied.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269063Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: cgm-recipe
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Bacterial strains and culture media., sole paragraph,
    CGM formulation
  summary: CGM contains per liter KH2PO4 0.75 g; K2HPO4 0.982 g; NaCl 1 g; MnSO4 0.01
    g; p-aminobenzoic acid 0.004 g; MgSO4 0.348 g; FeSO4 0.01 g; asparagine 2 g; yeast
    extract 5 g; (NH4)2SO4 2 g; and glucose 40 g, at pH 6.5. This is a separate member/inoculum
    medium, not a mixed-culture pH setpoint.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269135Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: vessels
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Bacterial strains and culture media., final sentence;
    Coculture of C. thermocellum NBRC103400 and strains producing butanol., sole paragraph
  summary: Anaerobic cultures use test tubes with butyl rubber stoppers after nitrogen
    replacement of the headspace. No agitation value or tube capacity is established
    by these passages. The setup is not an unspecified absence of vessel information.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269207Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
  quote: test tubes
- evidence_id: staging
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Coculture of C. thermocellum NBRC103400 and strains
    producing butanol., sole paragraph
  summary: Cellobiose-grown thermophile cells are centrifuged, washed and resuspended
    without added carbon at OD600 0.2 or 2. Six mL suspension plus six mL Avicel medium
    is cultured at 60 °C, with reported starting OD600 0.1 or 1. Exponential N1-4
    cells collected after 24 h are washed and suspended in 4% glucose CGM at OD600
    1.3 or 13; one mL is added after cooling to 30 °C, with reported N1-4 OD600 0.1
    or 1. The volumes imply nominal 12 then 13 mL, not vessel capacity or an endpoint
    species ratio.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269278Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: staging-control
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: RESULTS → Effect of C. thermocellum culture period on butanol production.,
    paragraphs 1–3; Figure 1
  summary: Preincubated cultures produce more butanol than simultaneous addition.
    Temperature, inoculation timing and glucose carried with N1-4 are coupled; the
    experiment supports a process contribution without selectively tracing partner-to-partner
    carbon. Bulk OD is not species-resolved abundance. Results and Figure 1b list
    0/24/48/72/96 h; the caption instead lists 0/24/48/60/72 h.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269352Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: temperature
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: RESULTS → Effect of N1-4 growth temperature on cellulase activity., paragraphs
    1–2; Figure 3
  summary: The tested 25–42 °C range gives the highest reported butanol at 30 °C;
    production is low, not zero, at 42 °C. This does not justify the current absolute
    claim that either single temperature makes one member unable to work. Analytical
    speeds elsewhere do not establish culture agitation.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269422Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: product
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: Abstract; RESULTS → Optimizing butanol production using a cocultured C.
    thermocellum and strain N1-4.; Effectiveness of strain N1-4 as a butanol producer
    in a coculture system.; Figures 4–5
  summary: Butanol is a measured output. The abstract reports 7.9 g/L after nine days
    with 4% Avicel. Figure 5 shows an approximately 8 g/L endpoint in the partner
    comparison, without separately specifying a nine-day peak. The Figure 4 substrate-loading
    comparison reports 5.8 g/L at 40 g/L. Preserve these distinct assay contexts rather
    than silently replacing the curated endpoint.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269493Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: recipient-boundary
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: INTRODUCTION, paragraphs 1–4; DISCUSSION, paragraph 4
  summary: Hydrolysis by C. thermocellum and subsequent N1-4 solventogenesis support
    the latter as a recipient. No inspected evidence establishes the thermophile utilizing
    an N1-4 metabolite. The acetone-addition control found no decrease after ten days
    at 1 g/L, arguing against that specific proposed uptake route without disproving
    all possible reciprocal use.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269563Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: selectivity
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Preparation of cell extracts.; Enzyme assays.;
    RESULTS → Assays of enzymes associated with acetone production.; Table 1; DISCUSSION,
    paragraph 4
  summary: Crude-extract enzyme activities are normalized by N1-4-specific thiolase
    because both strains occur in extracts. Acetone-pathway activities remain measurable,
    while acetone and isopropanol are below detection in the reported coculture. These
    assays constrain explanations but do not establish pathway shutdown, live-cell
    flux or interspecies hydrogen transfer.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269633Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: analysis
  kind: primary_source
  reference: PMID:21764954; DOI:10.1128/AEM.00706-11
  locator: MATERIALS AND METHODS → Analytical procedure.; Preparation of cell extracts.;
    Enzyme assays.
  summary: Fermentation products use HPLC; residual cellulose follows the cited Desvaux
    method. GC-TCD measures CO2 in the acetoacetate-decarboxylase assay, not general
    fermentation-product titers. Extraction buffer pH 7.6, DTT, bead disruption at
    3,500 rpm and centrifugation at 20,000 × g are analytical preparation, not cultivation
    conditions.
  support: supports
  accessed_at: '2026-10-21T23:22:09.269703Z'
  snapshot_sha256: 4b1767de95e562c7dda9aa99ef1044fbfe97f9ac279b2fe977a859522ebb72c5
- evidence_id: hydrogen
  kind: primary_source
  reference: PMID:22999358; DOI:10.1016/j.jbiosc.2012.08.020
  locator: Complete fresh indexed abstract
  summary: Lower hydrogen output is associated with selective butanol and very low
    acetone; hydrogenase selection is proposed. Full assay details remain unavailable,
    so neither a selective perturbation nor partner-resolved hydrogen donation is
    certified. The existing graph already preserves this limit.
  support: supports
