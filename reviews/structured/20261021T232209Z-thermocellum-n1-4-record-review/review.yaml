- evidence_id: record
  kind: record_content
  reference: kb/communities/Clostridium_Thermocellum_Saccharoperbutylacetonicum_Cellulosic_Butanol_Coculture.yaml
  locator: Whole maintained YAML
  summary: Two source strains, three interaction nodes and two qualified arrows are
