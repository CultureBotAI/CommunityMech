assessments:
- assessment_id: identity
  area: identity
  topic: Focal membership and aliases
  outcome: concern
  summary: Both focal strain identities are correct, but the rice-study explanation
    misidentifies an alias as a different strain.
  target_ids:
  - CommunityMech:000208
  evidence_ids:
  - identity
  - rice
  - strain
  details: Keep comparator strains and N1-4(HMT) outside focal membership; correct
    only the bounded resource explanation.
- assessment_id: grounding
  area: grounding
  topic: Ontology and GTDB
  outcome: concern
  summary: All term labels and the current GTDB core are valid; release/build provenance
    needs correction.
  target_ids:
  - CommunityMech:000208
  evidence_ids:
  - ontology
  - gtdb
  - derivative
  details: Preserve 0.93/14 and N1-4 UNRESOLVED. Broad fermentation is contextual
    and does not assert exclusive ATP machinery.
- assessment_id: roles
  area: scope
  topic: Functional roles and abundance
  outcome: concern
  summary: The donor CROSS_FEEDER annotation lacks evidence of recipient utilization.
  target_ids:
  - CommunityMech:000208
  evidence_ids:
  - recipient-boundary
  - schema
  - semantics
  details: Retain its PRIMARY_DEGRADER role and N1-4 recipient/fermenter roles. No
    optional abundance field or fixed proportion is required; inoculum OD is not endpoint
    abundance.
- assessment_id: staged-node
  area: graph
  topic: ecological_interactions[0] and downstream[0]
  outcome: supported
  summary: The directed cross-feeding model and partial contribution to solventogenesis
    preserve the positive staging result and its confounders.
  target_ids:
  - CommunityMech:000208
  evidence_ids:
  - staging
  - staging-control
  details: Cellulose is feedstock and butanol an output. Soluble-carbon transfer is
    inferred; temperature and glucose carryover prevent exclusive flux attribution.
- assessment_id: selectivity-node
  area: graph
  topic: ecological_interactions[1]
  outcome: supported
  summary: The community output node correctly preserves low-acetone and crude-extract
    controls.
  target_ids:
  - CommunityMech:000208
  evidence_ids:
  - selectivity
  - product
  details: Below detection is not absolute zero; normalized enzyme activity does not
    prove pathway shutdown or live flux. Both participants are appropriately listed.
- assessment_id: redox-node
