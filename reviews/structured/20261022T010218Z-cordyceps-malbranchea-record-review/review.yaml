limitations:
- Full Methods, Results, authentic supplementary materials, assay matrix and complete
  27-reference bibliography were not recovered. The direct publisher routes returned
  403 and the anonymous API supplied coredata only. An indexed preview is not a whole
  primary article.
- Two conventional PDF candidates are CAS substance-search exports without authenticated
  focal article linkage. Only their content classification was inspected; no spectral,
  stereochemical or biological conclusion is derived from them and no figure-pixel
  read is claimed.
- Direct marker submissions verify exact species/isolate/accession identity but have
  no DOI/PMID cross-reference. The indexed publisher declaration supplies article
  association. Its Xishan Park statement conflicts with ENA ZYb8 locality at Zixi
  Mountain, Chuxiong Prefecture; the discrepancy remains unresolved.
- No compound-level raw assay, sequence alignment, spectral reconstruction or producer-resolved
  analysis was performed. The Abstract supports a selective active subset, not activity
  of every compound, monoculture induction, reciprocal benefit or clinical efficacy.
- The local exact-strain taxonomy search is bounded and is not a claim of global live
  NCBI absence. Fungal species IDs and separate strain names remain appropriate; marker
  accessions are not assembly identifiers.
- The low completeness score reflects literal rubric thresholds, including a zero
  roles block, and does not justify inventing optional roles, abundance or unavailable
  cultivation conditions. The capped quality score does not convert partial source
  access into completed scientific review.
notes:
- Seven cache excerpts are accounted for as six strict fresh Abstract matches and
  one explicitly labeled DOI metadata projection. Two node excerpts are bound by their
  exact selectors and SHA256 values; the only direct quotation in this bundle contains
  two words.
- The exact two nodes and all actual fungal participants were assessed individually.
  There are zero downstream arrows, with no additional causal relation required merely
  to make the network denser.
- Original source responses, failed access routes, preliminary/final support, history
  and prior review contexts remain immutable. The source audit’s isolated wording
  slip is rendered here as eight new plus eleven known compounds.
- Actual corpus diagnostics exit 1 with 44 warnings across 16 of 477 records and zero
  errors; the optional adapter is unavailable in the owned runtime. Both are explicit
  nonrequired contextual checks. Parent alone saves after independent whole-candidate
