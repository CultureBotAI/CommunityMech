- All 29 snippets match direct sources; exact abstract quotes can still require qualification
  by the main results.
- Native completeness 40 and capped quality 100/raw 101 do not certify the unresolved
  findings.
- Earlier graph review and issue 1265 are historical scoped repairs; this review does
