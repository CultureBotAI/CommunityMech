limitations:
- Three independent single-strain cultures were compared; no mixed culture, interspecies
  transfer, reciprocal fitness or combined consortium benefit was tested. Existing
  engineering prose already states this separation.
- Fourteen nonradioactive lanthanides were assayed. General REE definitions do not
  establish yttrium targeting or presence in this basalt. Bulk acid-preserved ICP-MS
  elemental concentrations do not determine free Ce3+, Nd3+ or other ionic speciation.
- Pooled and element-specific tests differ. Higher means do not imply significance
  in every condition; nonsignificant comparisons are not equivalence tests. ISS final-count
  results do not erase significant ground-versus-flight contrasts.
- Vanadium main Table 1/Results define 184.92–283.22% of controls, despite abstract
  wording. REE Figure 3/Supplementary Table 3 also use ambiguous difference wording
  for ratios; no unencoded numeric claim was imported.
- The 5 mL culture receives 1 mL fixative after 21 days; 6 mL analytical volume and
  post-fixation acid/pH cannot be assigned to growth conditions. Continued storage
  leaching and two contaminated control exclusions remain source limitations.
- No raw ICP or growth-data reanalysis, statistical rerun, direct ion-speciation measurement,
  catalogue protocol substitution or paid provider. REE MOESM2 is a peer-review file,
  not scientific SI or a reporting summary; no full peer-review audit claimed.
- Additional pinned cross-citation caches concern other experiments and were not used
  as focal BioRock evidence.
notes:
- No canonical, cache, history, generated or saved-review files changed. All 28 inspected
