assessments:
- assessment_id: identity
  area: identity
  topic: Independent panel versus synthetic community
  outcome: concern
  summary: The experiment is correctly identified, but its record class/title/origin
    imply a community that the assay did not assemble.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - panel
  - schema
  - record
  dimensions:
  - name: community_scope
    value: Three separately cultured bacterial strains
    definition: A comparison panel with sterile controls; not a coculture or a demonstrated
      consortium.
    evidence_ids:
    - panel
  - name: source_strain
    value: CP1D/DSM 16792; NCIB 3610/DSM 10; CH34/DSM 2839
    definition: Exact paper strains and direct catalogue aliases are verified; no
      substitute isolates or catalogue protocols.
    evidence_ids:
    - panel
    - resources
  - name: environment
    value: Laboratory spaceflight reactors with ground controls
    definition: Olivine basalt from Gufunes is a lunar/Martian material analogue;
      regolith is modeled context, not the actual culture location.
    evidence_ids:
    - cultivation
  - name: medium
    value: 50% R2A shared assay medium
    definition: Separate pre-flight preparation and separate ground auxiliary assays
      must not be collapsed.
    evidence_ids:
    - cultivation
  - name: experimental_setting
    value: 21-day ISS and parallel ground single-strain assays
    definition: Biological controls, gravity conditions, fixation and analytical fractions
      define the comparisons.
    evidence_ids:
    - panel
    - cultivation
  - name: evidence_tier
    value: IN_VITRO elemental/cell-count observations
    definition: No direct interspecies mechanism, free-ion speciation or proof of
      gravity equivalence.
    evidence_ids:
    - chemistry
    - cell-counts
  - name: grounding_status
    value: Labels valid, chemical assertion scope excessive
    definition: Verified taxonomy/ENVO labels fit the assays; ionic ingredient labels
      overstate the measurement.
    evidence_ids:
    - ontology
    - chemistry
- assessment_id: taxonomy
  area: grounding
  topic: Taxa, strains and functional roles
  outcome: supported
  summary: All three reported strain identities are verified; no invented role is
    needed for C. metallidurans.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - panel
  - resources
  - ontology
  - schema
  details: PRIMARY_DEGRADER can describe complex mineral-substrate degradation in
    the local schema; it is not limited to organic matter. Preserve strain-specific
    biomining outcomes without assigning consortium membership or universal activity.
    The S. desiccabilis significance note is assessed separately below.
- assessment_id: node-0
  area: graph
  topic: ecological_interactions[0]
  outcome: supported
  summary: Retain the qualified fourteen-lanthanide S. desiccabilis endpoint.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - ree
  - chemistry
  - ree-si
  details: Existing text correctly separates higher means from pooled Mars/Earth significance
    and microgravity p=0.124, excludes Y/Sc and disclaims ion speciation and coculture
    effects.
- assessment_id: node-1
  area: graph
  topic: ecological_interactions[1]
  outcome: supported
  summary: Retain the corrected vanadium percent-of-control endpoint.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - vanadium
  - vanadium-si
  details: Existing text correctly states 184.92–283.22% of controls, 84.92–183.22%
    increases, ISS significance and nonsignificant ground contrasts. Participating
    taxa summarize separate assays, not joint growth.
- assessment_id: node-2
  area: graph
  topic: ecological_interactions[2]
  outcome: supported
  summary: Retain bounded comparative strain specificity.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - ree
  - ree-si
  details: B. subtilis pooled decreases are significant in microgravity/Mars, not
    simulated Earth p=0.055 or ground. C. metallidurans pooled comparisons are nonsignificant.
    This does not establish niche partitioning or reciprocal fitness.
- assessment_id: arrows
  area: graph
  topic: Directed causal graph
  outcome: supported
  summary: Zero arrows remain appropriate; comparative specificity is a summary, not
    a cause of the individual outcomes.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - record
  - history
  - panel
  details: No arrows are added from common assay design, shared mineral substrate
    or pooled species comparisons. Graph claims remain usable as bounded assay observations
    while record-level panel representation is adjudicated.
- assessment_id: chemistry
  area: grounding
  topic: Yttrium and related ingredient specificity
  outcome: concern
  summary: A generic REE definition is misused as evidence of Y targeting; free Ce3+/Nd3+
    are not determined by these analyses.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - chemistry
  - ree-si
  - schema
  - chemical-candidates
  details: Iron substrate presence is supported and does not require active mining.
    The enum means present OR processed; unmeasured Y is not proven absent from basalt,
    but current source support establishes neither its measured presence nor targeting.
    Preserve elemental Ce/Nd results without asserting neutral atoms or free ions.
- assessment_id: results
  area: quantity
  topic: Non-graph outcomes and statistical scope
  outcome: concern
  summary: Description, taxon note and metal notes contradict the corrected graph
    and condition-specific primary results.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - ree
  - vanadium
  - cell-counts
  - record
  details: Correct the V denominator, restrict S. desiccabilis significance to tested
    comparisons, and separate ISS-only final-count conclusions from ground contrasts.
    Avoid translating nonsignificance into equivalence or blanket gravity independence.
- assessment_id: cultivation
  area: scope
  topic: Preparation, assay and auxiliary culture conditions
  outcome: concern
  summary: The shared assay medium is valid, but the record generalizes S. desiccabilis
    preparation to all strains and omits recoverable protocol structure.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - cultivation
  - cells-si
  details: Retain overnight R2A only for S. desiccabilis; spores for B. subtilis;
    TSA/lyoprotectant/freeze-drying for C. metallidurans. Recover exact 50% R2A recipe,
    pH 7.2, unstirred 5 mL cultivation and separate ground 20.62°C. Keep 6 mL post-fixation
    fluid and auxiliary fresh-cell six-well assays separate.
- assessment_id: resources
  area: provenance
  topic: Experiment data and reusable culture links
  outcome: concern
  summary: The three publication links are valid; the source-linked REE dataset is
    missing.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - resources-source
  - resources
  details: Add verified DataShare metadata with measured-data scope. DSM catalogue
    identity does not make its maintenance recipe the BioRock protocol. A reusable
    R2A recipe link needs exact 50% correspondence, not name matching.
- assessment_id: history
  area: provenance
  topic: Evidence, prior repairs and current issue scope
  outcome: supported
  summary: All 29 snippets are exact matches; historical graph repair does not certify
    unresolved non-graph wording.
  target_ids:
  - CommunityMech:000303
  evidence_ids:
  - snippets
  - history
  - source-scope
  details: Preserve issue 1265 closure and 1268 open follow-up as distinct scopes.
    Current scientific coverage includes critical figures/SI that were unread in the
    older decision, without retroactively changing its historical limitation.
- assessment_id: validation
  area: schema
