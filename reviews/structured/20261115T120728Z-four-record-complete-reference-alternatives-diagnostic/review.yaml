- '425: preserve all three CICC stocks, the existing B.longum ambiguity and C.butyricum
  block. Live coculture, partner supernatants, mixed-species vesicles, luteolin cargo
  and animal doses are distinct. Cross-feeding is not traced transfer; MsrA necessity
  and dosing/timing findings1629/1630 remain.'
- '460: preserve XB-7/PX678127 as source stock/16S marker, XY-6 and its block, and
  BS versus alternative Hafnia treatments or Fusarium challenge. Monoculture filtrates
  mixed1:1 are not coculture metabolites. Disease comparators, rootMDA/POD/SOD, source
  discrepancy and relative fungal/network findings1674 remain separate.'
- '446: preserve MCCC1H00019, diatomCCAP1055/1 and its NO_GTDB_EQUIVALENT, conditions
  and notes. Keep all three native alternatives including the unexpected Vibrio harveyi
  label. RNA-seq does not place the bacterial stock genome. Attachment/competition,
  matched day8 physiology, missing axenic transcriptome, modeled flux and EPS findings1698/1701
  remain unresolved.'
