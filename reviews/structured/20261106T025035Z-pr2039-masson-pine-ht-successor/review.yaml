limitations:
- Full main text and all captions were read; Figs.4-7 pixels were inspected. Other
  figure pixels and raw data were not reanalyzed. Public primary HTML was shared by
  a separate reviewer; authorship here remains distinct from independent approval.
- Three supplementary DOCX routes returned HTML challenges. Main HTML lists Methods
  S1-S3 and Tables S1-S6, but their contents remain unread. Table S1 cannot resolve
  RW5/H4 or RW8/TK2 aliases here. No access control was bypassed.
- The source conflicts on HT disease reduction, outcome timing, named-gene treatment
  scope and CAT1 direction. No exact effects were recalculated from bars and no convenient
  source version was silently selected.
- The abstract associates 153 isolates with Trichoderma treatment; main Results describes
  isolation across four treatments. HT membership is explicit, but exact original
  isolate-treatment provenance remains unresolved without the supplementary table.
- Both OQ accessions are partial 16S records, not strain genomes. PRJNA1166410 resolves
  as a host transcriptome project; twelve samples and treatment assignments are source
  statements, not independently audited repository counts.
- Host physiology, transcript enrichment, gene direction and pathway necessity are
  distinct. No metabolite exchange, selective pathway intervention or protection-to-expression
  edge is inferred. Existing mediation discussion remains an evidence-watch outcome,
  not a demand for new experiments.
- Historical GTDB metrics were not recomputed. Optional structured adapter availability
  was checked only in PATH and two conventional checkout paths; the full public iModulonDB
  dataset catalog has no matching target dataset.
- 'Both required corpus network commands completed with their existing exit 1: 44
  warnings, zero errors across 16/503 records. The target itself has no network findings.
  The quality-score cap does not erase six open curation findings.'
notes:
- Initial native inspect preceded assessment; all immutable scientific inputs were
  rechecked. The audit helper was extended for fresh retrieval/replay and formatted
  before final inspection; both final helper files and all source/receipt bytes are
  frozen.
- Original single-target issue keys and exact previous occurrences are preserved.
  No terminal disposition is created for any grouped review, and no other grouped
  target is silently dropped.
- Canonical records, caches, histories and generated products remain unchanged. JSON
  candidates are passed to the native validate/save workflow; saved YAML and Markdown
  are never hand-edited.
