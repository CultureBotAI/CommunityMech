- Partial technical diagnostic with scientific_review:false. Scoped completion is
  not full scientific review, source-snippet validation, generated-page integration,
  final corpus QC or completion of the repair campaign.
- Each79/79 result is the same named-binomial reference population under crosswalk761d5537,
  not79 genomes from DBS4 or DCP-4 and not independent stock-genome evidence. The
  exact study-stock species and assemblies remain unassigned.
- Primary evidence is the retained PMID42613016 abstract and selected PMC13485441
  main-text passages. This bounded pass performs no new complete-paper, supplement,
  figure-pixel, strain-sequence or assembly audit.
- The source distinguishes five screened isolates from the selected three-member consortium.
  DBS4 and DCP-4 remain separate Sphingopyxis stocks, and Achromobacter DCP-11d remains
  an unchanged third member with its prior correspondence.
- Modeled exchange and measured metabolite or inhibition evidence remain distinct.
  D-glucosamine was not detected; liquid30mg/L and soil5mg/kg conditions are not interchangeable.
  No traced-flux, quantitative cross-feeding contribution or complete-mineralization
  claim is added. Existing issue596 and historical needs_research findings remain
  open.
