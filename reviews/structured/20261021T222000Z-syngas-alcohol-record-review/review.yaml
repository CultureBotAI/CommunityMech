evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Clostridium_Ljungdahlii_Kluyveri_Syngas_Alcohol_Coculture.yaml
  locator: Whole maintained record
  summary: The two-member continuous syngas system has four nodes and two qualified
    arrows. Current graph wording separates measured products, inferred intermediate
    flux, proposed reduction and phase-dependent performance.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466286Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Materials and methods → Microbial strains and medium composition
  summary: The source identifies C. ljungdahlii PETC and C. kluyveri DSM 555, obtained
    from ATCC. Their separate 35 °C precultures are distinct from the 37 °C continuous
    coculture. Species-level identities remain valid; source strain descriptors can
    be added without forcing a rank change.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466341Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: recipe
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Materials and methods → Microbial strains and medium composition
  summary: The paper gives the full mineral, vitamin and trace-element stock formulations
    and their 60/20/20 mL additions, variable antifoam, final 1 mM cysteine after
    N2 sparging, and continuous sodium-sulfide addition. Published stock concentrations
    must remain distinct from final-medium concentrations; the stated formulation
    should not be doubled again.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466435Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: operation
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Materials and methods → Reactor and condenser setup; Figure 1
  summary: The 2 L Biostat M uses a 1 L working volume at 37 °C. Agitation changes
    from 200 to 400 rpm at hour 475; 2 M KOH initially controls pH, with 2 M acetic
    acid added after hour 1510. The missing acid identity is directly recoverable.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466511Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
  quote: 2 M acetic acid
- evidence_id: flows
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Materials and methods → Reactor and condenser setup; Figure 1
  summary: Fresh 60/35/5 CO/H2/CO2 enters the headspace at 30–80 mL/min. Gas recycles
    through the broth at 1.6 L/min and the condenser is held at 1 °C. Broth recycles
    at 180 mL/min; 75% of effluent is cell-free and 25% contains cells. Medium flow
    changes from 80 to 40 mL/h at hour 1150. Preserve CONTINUOUS operation and separate
    gas, liquid and cell-bleed quantities.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466583Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: stages
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Results → A narrow, but not ideal, pH spectrum available for the production
    of longer-chain alcohols, paragraphs 2–5; Figure 4
  summary: C. ljungdahlii was established before C. kluyveri inoculation at hour 670.
    Pump failures, pH excursions and temporary batch/fed-batch episodes interrupt
    the overall continuous run. Five phases vary pH and medium flow; they are not
    independent replicated pH experiments.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466652Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: speciation
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Introduction, paragraph 4; Results → A narrow, but not ideal, pH spectrum
    available for the production of longer-chain alcohols, paragraphs 5–6
  summary: The paper distinguishes named carboxylates from pH-dependent undissociated
    acids proposed as reduction substrates. It calls the C6 and C8 products medium-chain
    carboxylates, separately from C4 butyrate. A measured analytical pool is not proof
    that all molecules share one protonation state.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466721Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: products
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Results → n-octanol (C8) observed for first time in a syngas fermentation
    system, paragraphs 3–5; Table 1; Figures 4–5
  summary: Butanol, hexanol and trace octanol are community products. Caprylate remains
    below the reported detection limit. Abstract/results phase-2 octanol rate differs
    from Table 1; no numeric octanol rate is encoded in the current record, and no
    correction is guessed. Reactor and condensate concentrations/rates have separate
    scopes.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466789Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: flux
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Introduction, paragraphs 5 and 7; Results → A narrow, but not ideal, pH
    spectrum available for the production of longer-chain alcohols, paragraph 1; Table
    2
  summary: C2 supply and chain elongation support the two retained arrows. Total intermediate
    production and approximately two-thirds ethanol use are stoichiometric estimates.
    Reduction by C. ljungdahlii is the proposed likely mechanism; the paper does not
    exclude C. kluyveri contribution or trace partner-resolved carbon flux.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466857Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: abundance
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Materials and methods → Analysis, paragraph 3; Results → n-octanol (C8)
    observed for first time in a syngas fermentation system, paragraph 1; Figures
    2–3
  summary: PCR is qualitative and the morphologies do not reliably identify species.
    Both partners nevertheless show sustained functional activity in this two-member
    process. Native ABUNDANT can remain an ordinal designation; neither a fixed percentage
    nor quantitative PCR is required.
  support: supports
  accessed_at: '2026-10-21T22:20:00.466927Z'
  snapshot_sha256: 1cf9e4323868798a2f4540ed7e4ceea943bd657965ebef33fe0ee3e24687d582
- evidence_id: analysis
  kind: primary_source
  reference: PMID:27877166; DOI:10.3389/fmicb.2016.01773
  locator: Materials and methods → Analysis; Table 1 notes and Table 2 formulas
  summary: Daily reactor and condensate samples come from one reactor. Table 1 separates
    concentrations, carbon-normalized rates, selectivities and specificities; Table
