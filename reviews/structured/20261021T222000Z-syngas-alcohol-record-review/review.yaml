findings:
- finding_id: align-carboxylate-identities
  issue_key: cm-000202-align-carboxylate-identities
  category: grounding
  severity: major
  native_severity: P2
  normalization_reason: Neutral and anionic forms are distinct chemical identities.
  rule_id: review-checklist.claim-specific-scope-and-grounding
  status: open
  certainty: confirmed
  title: Align named carboxylates with chemical forms
  description: Three related ingredients name carboxylate anions while their ontology
    terms identify neutral acids. The C4 butyrate entry also uses medium-chain terminology
    contrary to this paper's explicit C6/C8 convention. For retained anion claims
    use verified butyrate CHEBI:17968, hexanoate CHEBI:17120 and octanoate CHEBI:25646,
    or explicitly rename and scope a neutral-acid entry to the source's undissociated
    reduction-substrate context. Do not equate whole analytical pools with one protonation
    state, alter the already qualified graph, or infer detected octanoate. Use C4
    butyrate wording without imposing a universal chain-length taxonomy.
  target_ids:
  - CommunityMech:000202
  field_paths:
