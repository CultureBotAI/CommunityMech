assessments:
- assessment_id: identity
  area: identity
  topic: Exact model and biological actors
  outcome: concern
  summary: MODEL1806250005 is the intended iNA533 cicada model; the host should remain
    external to microbial membership.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - record
  - methods
  - schema
  - resources
  dimensions:
  - name: community_scope
    value: Two endosymbiotic bacteria modeled with their insect host
    definition: Three biological model compartments do not make the insect a microbial
      community member.
    evidence_ids:
    - schema
    - resources
  - name: source_strain
    value: Field-derived Sulcia and Hodgkinia associated with N. canicularis
    definition: The paper names Sulcia muelleri and Hodgkinia cicadicola from the
      cicada bacteriomes; the record uses compatible genus-level terms, without a
      culture-collection strain.
    evidence_ids:
    - methods
    - ontology
  - name: environment
    value: ENVO:01001002 animal-associated environment; modeled intracellular bacteriome
      and external hemolymph
    definition: Fresh primary host/bacteriocyte context supports the broad canonical
      ENVO term, while the preferred term preserves the focal insect habitat.
    evidence_ids:
    - methods
    - environment-authority
  - name: medium
    value: In-silico minimal hemolymph with constrained exchange
    definition: Use computational_provenance.simulated_medium, preserving published
      run bounds and the S5o cystathionine detail; no growth_media recipe is warranted.
    evidence_ids:
    - methods
    - supplement
    - model-boundary
  - name: experimental_setting
    value: Genome/transcriptome-informed FBA and FVA
    definition: N. canicularis mature nymphs were collected at Lansing, Ithaca, and
      retained for up to three days after adult molt; two transcriptome samples informed
      reconstruction, not a dynamic stability assay.
    evidence_ids:
    - methods
  - name: evidence_tier
    value: Computational predictions with explicit assumptions
    definition: Nitrogen accounting, reciprocal benefit and absence of exclusively
      bacterial exchange are model outputs; host-control mediation and ecological
      equilibrium were not demonstrated.
    evidence_ids:
    - sulcia
    - hodgkinia
    - reciprocal
    - inference
  - name: grounding_status
    value: Valid host species, Sulcia and Hodgkinia genera, amino acids and broad
      GO term
    definition: Canonical Karelsulcia and Hodgkinia labels match the encoded genera.
      Preserve Sulcia grounding, unresolved Hodgkinia mapping and host NO_GTDB_EQUIVALENT;
      no forced mapping.
    evidence_ids:
    - ontology
- assessment_id: taxonomy
  area: grounding
  topic: Membership, roles and names
  outcome: concern
  summary: Remove the host from the membership list while retaining its supported
    graph endpoints.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - schema
  - ontology
  - methods
  - reciprocal
  details: The microbial partners and broad syntrophic-metabolism roles are compatible
    with model-predicted cooperative metabolism. No extra obligacy or product-removal
    test is imported into these broad category/role definitions. The current source-based
    bacterial ranks are retained; no unverified exact strain or extra taxon is added.
    Historical GTDB mapping statistics were not re-certified.
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Sulcia provisioning'
  outcome: supported
  summary: Retain the COMPUTATIONAL Sulcia → N. canicularis provisioning and modeled
    reciprocal benefit.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - sulcia
  - methods
  - supplement
  details: Eight EAA exports, including the two encoded L-amino acids, support the
    node. Nitrogen accounting uses weighted transport flux relative to host-derived
    nitrogen input, not concentration or a tracer measurement. The current 66–80%
    wording is explicitly pooled across systems; the cicada figure/table gives approximately
    72%. No downstream arrow is needed.
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Hodgkinia complementarity'
  outcome: supported
  summary: Retain the COMPUTATIONAL Hodgkinia → N. canicularis interpretation and
    its limitations.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - hodgkinia
  - reciprocal
  - methods
  details: The two exported EAAs are histidine and methionine. The source-reported
    approximately 30% nitrogen return (30.606% in S1i) differs from the 15% share
    of total EAA release. Reciprocal host support and absence of exclusively bacterial
    exchange are modeled outcomes, not evidence against all host-mediated exchange.
    Host regulatory control remains PARTIAL.
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Host-mediated complementarity'
  outcome: supported
  summary: Retain community-level modeled reciprocal nutrition with PARTIAL host-control
    interpretation.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - reciprocal
  - methods
  - inference
  - supplement
  details: The modeled actors are Sulcia, Hodgkinia and their cicada host. Figure
    4c and the main text report no metabolites transferred exclusively between bacterial
    partners; this is compatible with shared host-derived inputs and complementary
    nutrient outputs. It does not experimentally establish host regulation. GO:0044419
    is compatible with interspecies processes. The zero-arrow graph avoids treating
    component interactions as demonstrated upstream causes of their summary.
- assessment_id: state
  area: evidence
  topic: Ecological state versus computational steady state
  outcome: concern
  summary: STABLE is not established as ecological equilibrium by the inspected source.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - schema
  - inference
  - methods
  details: The source describes an ancient, vertically transmitted natural association
    and optimizes constrained metabolic fluxes. It does not measure community dynamics
    or recovery to equilibrium. NATURAL remains appropriate to the modeled biological
    association; creating a model does not imply ENGINEERED biological origin.
- assessment_id: conditions
  area: completeness
  topic: Structured computational provenance
  outcome: concern
  summary: Recoverable model/run settings remain only in source text and the existing
    discussion.
  target_ids:
  - CommunityMech:000008
  evidence_ids:
  - schema
  - methods
  - supplement
  - model-boundary
  details: Record FBA/FVA, COBRA Toolbox 3.0, MATLAB/Gurobi without invented versions,
    iNA533 and source accessions, objective and simulated hemolymph. Distinguish ordinary
    growth from maintenance-cost simulations. BioModels glucose/ammonium defaults
    of −1000 differ from published −100 run bounds; stored zero flux fields are not
    observed optimal outputs. The discussion already captures important assumptions
    and should be preserved.
- assessment_id: resources
