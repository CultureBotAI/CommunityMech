- Partial diagnostic with scientific_review:false. Native validation success does
  not complete whole-record scientific review, full corpus QC, reference-snippet coverage
  or the broader campaign.
- Primary examination covers the retained abstract and selected Table1, molecular-identification,
  ordered accession, growth and limitation passages. No new supplementary TableS1,
  figure-pixel, raw-sequence, experimental-stock genome or complete-paper review is
  claimed.
- The study calls the selected isolate T8 and deposits OR857502 as a16S marker. The
  canonical selected member lacks strain_designation; that state is preserved, not
  silently filled or newly certified. A marker accession is not an assembly or independently
  established GTDB placement.
- Both Cytobacillus_firmus and Cytobacillus_firmus_A remain unselected. No ambiguity-route
  genome denominator, stock-identity probability, experimental abundance or formal
  taxonomic rename is inferred.
- The exact crosswalk SHA256 establishes bytes, not its upstream release. File mtime
  is not a release label; NCBI observations use file-stat provenance, not a complete
  content hash or ontology-release assertion.
- Bacillus/Flavobacterium stored blocks, unresolved Streptomyces/Pseudomonas, all
  five source members, aliases and generic objective-evidence reuse remain unchanged.
  The host and oomycete challenge are not consortium members.
- Three community-level nodes and two HYPOTHESIZED arrows retain heterogeneous individual
