assessments:
- assessment_id: identity
  area: identity
  topic: Natural functional guild versus a measured stable community
  outcome: concern
  summary: Stable ID, name, NATURAL origin and AMD category resolve coherently to
    a cross-study guild synthesis. Description, STABLE state and abundance assignments
    imply a measured global assemblage more strongly than the cited evidence permits.
    Six taxonomic descriptors are not proof of one coexisting community.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - amd-review
  - turkish-ponds
  - history
  dimensions:
  - name: community_scope
    value: Cross-study AMD heterotrophic guild; six named taxa
    definition: The cited review and isolate studies supply different scopes and sites.
    evidence_ids:
    - record
    - amd-review
  - name: experimental_setting
    value: Natural AMD, sediment microcosms and separate cultured isolates
    definition: No common six-member experiment was established in the inspected sources.
    evidence_ids:
    - jf5-metabolism
    - ferrimicrobium
    - acidisphaera
    - turkish-ponds
  - name: source_category
    value: Review synthesis plus isolate physiology, field surveys and comparative
      genomics
    definition: Do not collapse these evidence classes into a single natural community
      assay.
    evidence_ids:
    - amd-review
    - jf5-metabolism
    - acidiphilium-genomes
  - name: biomass_state
    value: Environmental populations and separately cultivated isolates
    definition: No frozen common sample, assemblage biomass or shared growth experiment
      is identified.
    evidence_ids:
    - record
    - turkish-ponds
- assessment_id: taxonomic-grounding
  area: grounding
  topic: Six NCBI descriptors and five GTDB blocks
  outcome: supported
  summary: Term labels and GTDB coherence/domain gates pass. A. capsulatum is explicitly
    GTDB UNRESOLVED. The two Acidiphilium NCBI species map to the same GTDB species
    with reclassification wording preserved; the genomic paper corroborates related
    classification concerns but does not license erasing source-strain distinctions.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - acidiphilium-genomes
  - jf5-identity
  dimensions:
  - name: taxon_rank
    value: Six NCBITaxon species; five GROUNDED GTDB entries and one UNRESOLVED
    definition: Canonical species grounding is not strain identity or a field abundance
      measurement.
    evidence_ids:
    - record
  - name: source_strains
    value: JF-5; Ferrimicrobium T23(T); Acidisphaera HS-AP3T and three other isolates
    definition: Strain identities are specific to the supporting experiments.
    evidence_ids:
    - jf5-identity
    - ferrimicrobium
    - acidisphaera
  - name: gtdb_grounding
    value: cryptum and multivorum map to GTDB:s__Acidiphilium_multivorum
    definition: The declared mapping counts and majority fractions were checked for
      coherence, not regenerated from the original mapping release.
    evidence_ids:
    - record
    - acidiphilium-genomes
- assessment_id: taxon-0
  area: evidence
  topic: 'taxonomy[0]: Acidiphilium multivorum'
  outcome: concern
  summary: The 1986 citation explicitly provides only genus-level support. The detailed
    substrate list is a JF-5 assay whose published identity is cryptum-related. GTDB
    synonymy makes this a strain/provenance issue rather than proof of a wrong species.
    DOMINANT, syntrophy, growth optima and full ecological-service claims need a source
    for the actual member.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - 1986-species
  - jf5-identity
  - jf5-metabolism
  - acidiphilium-genomes
- assessment_id: taxon-1
  area: evidence
  topic: 'taxonomy[1]: Ferrimicrobium acidiphilum'
  outcome: concern
  summary: T23(T) supports organic-carbon requirement and dual iron physiology. PRIMARY_PRODUCER
    conflicts with obligate heterotrophy. Global commonness, named-country distribution
    and cytochrome 605 rate limitation are not established by the attached abstract/general
    review excerpt.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - ferrimicrobium
  - ferrimicrobium-role
  - turkish-ponds
- assessment_id: taxon-2
  area: evidence
  topic: 'taxonomy[2]: Acidiphilium cryptum'
  outcome: concern
  summary: JF-5 supports bounded Fe(III)-coupled substrate oxidation. The 2024 review
    supports separate nanoparticle applications, but its robust-fermentation sentence
    does not show fermentative metabolism of this species. COMMON abundance, syntrophy
    and all-member physiological claims exceed these strain/context observations.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - jf5-identity
  - jf5-metabolism
  - heterotroph-review
- assessment_id: taxon-3
  area: evidence
  topic: 'taxonomy[3]: Acidocella facilis'
  outcome: concern
  summary: Aerobic heterotrophy is consistent with genus-level review and the original
    facilis description. The generic heterotroph count in two Turkish ponds is not
    species-specific facilis occurrence. Absolute inability to reduce Fe(III), precise
    niches, cross-feeding and COMMON abundance require more exact evidence.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - heterotroph-review
  - 1986-species
  - turkish-ponds
- assessment_id: taxon-4
  area: evidence
  topic: 'taxonomy[4]: Acidisphaera rubrifaciens'
  outcome: concern
  summary: Isolate morphology, aerobic pigments, pH 3.5-6.0 with optimum 4.5-5.0 and
    illumination response are supported by the primary abstract. RARE abundance and
    occurrence in sunlit AMD surface biofilms are ecological extensions. PMID and
    DOI citations duplicate one source; taxon-establishment sentence alone does not
    convey all physiology.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - acidisphaera
- assessment_id: taxon-5
  area: evidence
  topic: 'taxonomy[5]: Acidobacterium capsulatum'
  outcome: concern
  summary: Review supports AMD origin and qualified lineage carbohydrate utilization.
    The genomic-capabilities excerpt covers some acidobacteria rather than a measured
    capsulatum phenotype. RARE is not quantified by the cited source. Missing functional_role
    reduces the native presence score without authorizing an invented relational role.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - acidobacteria
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Organic Carbon Scavenging and Remineralization'
  outcome: supported
  summary: 'The review supports a guild-level positive environmental effect: heterotroph
    removal of inhibitory organic material can enable iron oxidizers. Four named participants
    are representative taxa, not four measured donor-recipient pairs. PARTIAL wording
    preserves that boundary; no sign for an unaffected partner or nitrogen/phosphate
    flux is asserted.'
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - amd-review
  details: 'Paths: ecological_interactions[0].participating_taxa[0:4], metabolites[0],
    evidence[0]. Mechanism is DOC removal; direction is toward reduced organic inhibition
    of external iron-oxidizing primary producers, which are not named targets in this
    node. Experimental context is literature synthesis across AMD sites. Exact quote
    and source locator are in amd-review. No downstream edge originates here.'
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Ferric Iron Reduction and Ferrous Iron Regeneration'
  outcome: supported
  summary: JF-5-related Acidiphilium physiology supports Fe(III) as electron acceptor
    and oxidation of glucose and other substrates. Sediment microcosms support stimulated
    Fe(II) formation under selected amendments. The description correctly excludes
    a demonstrated handoff to an autotroph or Ferrimicrobium.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - jf5-metabolism
  - jf5-identity
  details: 'Paths: ecological_interactions[1].participating_taxa[0], metabolites[0:4],
    biological_processes[0], evidence[0]. Participant grounding is A. cryptum; precise
    source identity is JF-5. Direction: Fe(III) to Fe(II) coupled to substrate oxidation.
    Source supports the listed malate/citrate/succinate organic-acid examples. The
    iron(2+) note that product is available to autotrophs is contextual possibility,
    not observed cross-feeding; align it with the explicit description limit.'
- assessment_id: edge-1-0
  area: graph
  topic: ecological_interactions[1].downstream[0] to Organic Carbon Scavenging and
    Remineralization
  outcome: supported
  summary: 'The one retained arrow is a qualified enabling relationship: Fe(III) respiration
    permits organic-substrate oxidation in JF-5. Its target is the anaerobic component
    of the broader carbon-removal guild. PARTIAL and the explicit lack of community
    detoxification measurements correctly limit the transfer across scales.'
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - jf5-metabolism
  - history
  details: 'Source node participant: A. cryptum-related JF-5. Target node participants:
    A. multivorum, A. cryptum, Ferrimicrobium acidiphilum and Acidocella facilis as
    a broader guild. Sign: positive enabling, without a quantitative effect size or
    inferred directed species pair. Mechanism: electron acceptance during substrate
    oxidation. Context: isolate assay and sediment microcosms, not a four-member coculture.
    Source: PMID10427060 abstract and jf5-metabolism verbatim quote. No additional
    downstream arrows occur in the full target.'
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Heterotrophic Iron Oxidation by Ferrimicrobium'
  outcome: supported
  summary: The node confines Fe(II) oxidation-enhanced yield and oxygen-free Fe(III)
    reduction to T23(T) physiology. It explicitly excludes a tested transfer to Acidiphilium.
    Ferrous/ferric iron and organic-carbon annotations fit the characterization.
  target_ids:
  - CommunityMech:000001
  evidence_ids:
  - record
  - ferrimicrobium
  - ferrimicrobium-role
  details: 'Paths: ecological_interactions[2].participating_taxa[0], metabolites[0:3],
    evidence[0:2]. Participant: F. acidiphilum T23(T), not the Yellowstone Ferrithrix
    isolate. Direction: Fe(II) oxidation in one assay; Fe(III) reduction with glycerol
    without oxygen in another. No partner-specific sign or downstream arrow is asserted.
    Source quote and abstract locator: ferrimicrobium.'
