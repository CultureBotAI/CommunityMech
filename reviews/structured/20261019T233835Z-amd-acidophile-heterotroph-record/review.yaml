  snapshot_sha256: 18668fb98513ea39d7400d2a8ffa3a7efc143fd5e71decb5570729c220407162
  quote: D-glucose, D-xylose, and lactose as carbon sources
- evidence_id: heterotroph-review
  kind: primary_source
  reference: doi:10.3389/fmicb.2024.1374800
  locator: PMC11141062, Basic aspects paragraph and biotechnology applications paragraph;
    retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11141062/fullTextXML
  accessed_at: '2026-10-19T23:33:04.496242Z'
  support: supports
  summary: Review supports alternative electron acceptors in some strains, genus-level
