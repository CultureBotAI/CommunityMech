  snapshot_sha256: 97e661256529b7bdff567b4502898ba19187c5348dbe21f9dc1c5798da7c1620
  quote: strict respiratory metabolism
- evidence_id: acidiphilium-genomes
  kind: primary_source
  reference: doi:10.1128/msystems.00867-20
  locator: PMC7677001, Results first paragraph and genomic metabolic-potential analysis;
