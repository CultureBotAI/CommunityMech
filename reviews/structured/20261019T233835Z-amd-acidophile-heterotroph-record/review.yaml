- evidence_id: amd-review
  kind: primary_source
  reference: doi:10.3389/fmicb.2015.00475
  locator: PMC4448039, Bacterial diversity section, Acidiphilium/Acidocella paragraph;
    introduction environmental context; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4448039/fullTextXML
  accessed_at: '2026-10-19T23:33:02.641419Z'
  support: supports
  summary: Review supports organic-lysate/exudate removal by AMD heterotrophs and
    mentions several genera from different sites. It does not establish this exact
    six-member community or its stability.
  snapshot_sha256: 14d633ca7c58b9e92d52de327e20c25a369c1c7122c1f21d51ecea60a3fa0a7f
  quote: by removing organic components (lysates, exudates) that can be toxic to the
    primary producers
- evidence_id: jf5-metabolism
  kind: primary_source
  reference: PMID:10427060
  locator: Abstract, substrate tests, sediment microcosms and final interpretation;
    DOI 10.1128/AEM.65.8.3633-3640.1999; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID%3A10427060+AND+SRC%3AMED&format=json&resultType=core&pageSize=10
  accessed_at: '2026-10-19T23:32:57.206526Z'
  support: supports
  summary: JF-5 connects Fe(III) respiration to substrate oxidation. Sediment microcosms
    were measured at 12 degrees C. Glucose and cellobiose stimulated Fe(II), while
    acetate inhibited it. The assay does not measure interspecies iron transfer.
  snapshot_sha256: 409ddff886c9c080a2d6fc0e7dfb4778dc52c6b87a43aedbf94a1f6a8c18e2cc
  quote: coupling the reduction of Fe(III) to the complete oxidation
- evidence_id: jf5-identity
  kind: primary_source
  reference: PMID:10427060
  locator: Abstract, 16S rRNA identification paragraph; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID%3A10427060+AND+SRC%3AMED&format=json&resultType=core&pageSize=10
  accessed_at: '2026-10-19T23:32:57.206526Z'
  support: supports
  summary: JF-5 was assigned by 99.6% 16S similarity to an Australian A. cryptum isolate.
    That is source-strain provenance, not direct proof that every named A. multivorum
    member shares the complete assay phenotype.
  snapshot_sha256: 409ddff886c9c080a2d6fc0e7dfb4778dc52c6b87a43aedbf94a1f6a8c18e2cc
  quote: closely related to an Australian isolate of Acidiphilium cryptum
- evidence_id: ferrimicrobium
  kind: primary_source
  reference: doi:10.1099/ijs.0.65409-0
  locator: PMID19406797 abstract; T23(T) versus Y005(T) strain characterization; retrieved
    https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI%3A10.1099%2Fijs.0.65409-0&format=json&resultType=core&pageSize=10
  accessed_at: '2026-10-19T23:32:59.489043Z'
  support: supports
  summary: T23(T), the Welsh mine isolate, is Ferrimicrobium acidiphilum; Y005(T)
    is Ferrithrix thermotolerans from Yellowstone. T23(T) gains growth yield from
    Fe(II) oxidation; both reduce Fe(III) with glycerol without oxygen. No partner
    exchange was measured.
  snapshot_sha256: 95a1071ab3d8932f3f0f3e4d711a3f0fd4354dbb403da696a9bdea1f7950a1cd
  quote: Ferrous iron oxidation enhanced growth yields of the novel mesophilic actinobacterium
    T23(T)
- evidence_id: ferrimicrobium-role
  kind: primary_source
  reference: doi:10.1099/ijs.0.65409-0
  locator: PMID19406797 abstract, comparison with Acidimicrobium ferrooxidans; retrieved
    https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI%3A10.1099%2Fijs.0.65409-0&format=json&resultType=core&pageSize=10
  accessed_at: '2026-10-19T23:32:59.489043Z'
  support: refutes
  summary: The cited characterization expressly identifies both new isolates as requiring
    organic carbon, contradicting the record PRIMARY_PRODUCER role as defined by the
    schema.
  snapshot_sha256: 95a1071ab3d8932f3f0f3e4d711a3f0fd4354dbb403da696a9bdea1f7950a1cd
  quote: both isolates were obligate heterotrophs
- evidence_id: acidisphaera
  kind: primary_source
  reference: PMID:10939661
  locator: Abstract, growth physiology, illumination and pH sentences; same publication
    as DOI10.1099/00207713-50-4-1539; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID%3A10939661+AND+SRC%3AMED&format=json&resultType=core&pageSize=10
  accessed_at: '2026-10-19T23:32:57.207202Z'
  support: supports
  summary: Four isolates, with type strain HS-AP3T, produced bacteriochlorophyll and
    had light-enhanced aerobic growth. They were chemo-organotrophs and did not grow
    anaerobically in light. Their pH range and optimum are reported, but community
    carbon transfer and CO2 fixation were not measured.
  snapshot_sha256: e5b8be1d3b4d8601306501508d18d9c652ef91acb91e42615cd6f14d7a2e4b09
  quote: aerobic growth was stimulated by continuous incandescent illumination
- evidence_id: acidobacteria
  kind: primary_source
  reference: doi:10.3389/fmicb.2016.00744
  locator: PMC4885859, historical cultivation paragraph and Carbohydrate metabolism
    paragraph; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4885859/fullTextXML
  accessed_at: '2026-10-19T23:33:03.119524Z'
  support: supports
  summary: Review documents Japanese AMD origin of A. capsulatum and carbohydrate
