  reference: OAK local ncbitaxon.db
  locator: rdfs:subClassOf ancestry of NCBITaxon1334117,795749 and1090
  summary: Both source families descend through Ignavibacteria to Ignavibacteriota1134404,
    not Chlorobiota1090. Thus the current modern-clade mapping is wrong even though
    its label matches its ID. GTDB mapping based on that wrong anchor is not source-member
    confirmation.
  support: supports
  accessed_at: '2026-10-20T07:37:08.791556Z'
