- finding_id: c8s4-000210-zymomonas-ecoli-abundance-levels
  issue_key: c8s4-000210-zymomonas-ecoli-abundance-levels
  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: Both obligate mutualist partners in Zymomonas_Ecoli_Exometabolomics_Obligate_Mutualism
    (CommunityMech:000210) omit abundance_level despite defined two-member coculture
    support in PMID:26885935
  description: 'In kb/communities/Zymomonas_Ecoli_Exometabolomics_Obligate_Mutualism.yaml
    (CommunityMech:000210), both Zymomonas mobilis (taxonomy[0], NCBITaxon:542, strain
    ZM4 ZMO0748 cysteine synthase mutant, functional_role: [CROSS_FEEDER]) and Escherichia
    coli (taxonomy[1], NCBITaxon:562, strain BW25113 Keio amino-acid auxotrophs proA,
    pheA, and ilvA, functional_role: [CROSS_FEEDER]) omit abundance_level. The cited
    study (PMID:26885935, doi:10.1021/acssynbio.5b00236) explicitly reports that ''Three
    sets of cocultures between the Z. mobilis auxotroph and each of the three E. coli
    auxotrophs were monitored by optical density for growth and analyzed by flow cytometry
    to confirm high cell counts for each species.'' Setting abundance_level: DOMINANT
    on both taxonomy[0] and taxonomy[1] while preserving discussions[0] (zymomonas_sulfur_identity_and_release_routes)
    raises the review-communities s_ab abundance_level rubric component from 0/5 to
    5/5 (0/2 -> 2/2 taxa with abundance_level).'
  target_ids:
  - CommunityMech:000210
  field_paths:
  - taxonomy[0].abundance_level
  - taxonomy[1].abundance_level
  evidence_ids:
