evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Chinese_Distillers_Grains_Dual_Fungal_Lignin_Consortium.yaml
  locator: Entire maintained YAML, two taxa, two interaction nodes, zero arrows and
    both discussions
  summary: The record describes a deliberately constructed two-fungus solid-state
    lignin-conversion system. Its graph already distinguishes proposed temporal function
    from measured bulk endpoints. Overview dominance wording is less explicit than
    that graph qualification.
  support: supports
  accessed_at: '2026-10-21T17:34:22.759164Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:42660361
  locator: 'Abstract: system construction and named members'
  summary: The direct abstract identifies Phanerochaete chrysosporium and Pleurotus
    eryngii in a constructed solid-state fermentation using Chinese Distillers’ grains.
    These are microbial members; the substrate is not a member. The abstract does
    not directly establish strain identifiers, mixture proportions or the complete
    preparation protocol.
  support: supports
  accessed_at: '2026-10-21T17:34:22.759243Z'
  snapshot_sha256: 9e72b100e32701a63885eb78d0b5bc19e1277a6bcf8d0145599bce3e6e0eec59
- evidence_id: bulk
  kind: primary_source
  reference: PMID:42660361
  locator: 'Abstract: lignin degradation and extracellular enzyme activity endpoints'
  summary: The paper reports 58.66% lignin degradation. Laccase and manganese peroxidase
    peak at day 10, at 38.54 and 50.36 U/g respectively; lignin peroxidase peaks at
    day 15 at 51.67 U/g. These are abstract-reported bulk endpoints. Without the full
    main, the total duration, assay denominator details, replicates, controls, uncertainty
    and relative superiority remain unverified.
  support: supports
  accessed_at: '2026-10-21T17:34:22.759386Z'
  snapshot_sha256: 9e72b100e32701a63885eb78d0b5bc19e1277a6bcf8d0145599bce3e6e0eec59
- evidence_id: temporal
  kind: primary_source
  reference: PMID:42660361
  locator: 'Abstract: integrated transcriptomic and metabolomic analyses'
  summary: The authors infer temporal functional division from combined omics. Early
    P. chrysosporium AA2 peroxidase expression and later P. eryngii AA1 laccase/aromatic-catabolic
    expression support an attributed staging hypothesis, not a measured population
    ranking, partner-resolved carbon flux or reciprocal fitness demonstration.
  support: supports
  accessed_at: '2026-10-21T17:34:22.759495Z'
  snapshot_sha256: 9e72b100e32701a63885eb78d0b5bc19e1277a6bcf8d0145599bce3e6e0eec59
  quote: temporal division of labor
- evidence_id: pathways
  kind: primary_source
  reference: PMID:42660361
  locator: 'Abstract: metabolic pathway reconstruction'
  summary: Reconstructed H/G- and S-derived aromatic routes provide the authors’ metabolic
    interpretation. The abstract does not establish traced interpartner transfer,
    a necessary metabolite mediator or individual enzyme-specific flux. No additional
    molecular node or arrow is required.
  support: supports
  accessed_at: '2026-10-21T17:34:22.759543Z'
  snapshot_sha256: 9e72b100e32701a63885eb78d0b5bc19e1277a6bcf8d0145599bce3e6e0eec59
- evidence_id: substrate
  kind: primary_source
  reference: PMID:42660361
  locator: 'Abstract: opening substrate statement'
  summary: Chinese Distillers’ grains are the recalcitrant lignin-containing substrate.
    The current environmental factor and CHEBI lignin ingredient express substrate
    context; no fermentation outcome remains stored as an environmental parameter.
  support: supports
  accessed_at: '2026-10-21T17:34:22.759582Z'
  snapshot_sha256: 9e72b100e32701a63885eb78d0b5bc19e1277a6bcf8d0145599bce3e6e0eec59
