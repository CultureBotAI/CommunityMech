assessments:
- assessment_id: identity
  area: identity
  topic: Three-reactor study and simplified community boundary
  outcome: supported
  summary: The record keeps the pH-specific source boundaries and does not describe
    a deliberately assembled two-isolate culture. Minimal is the source label for
    a simplified community, not proof that only two organisms exist. Up to 56% is
    a pH-specific maximum, not the fraction of the entire consortium or a constant
    abundance.
  target_ids:
  - CommunityMech:000434
  evidence_ids:
  - record
  - abstract
  - dominance
  dimensions:
  - name: community_scope
    value: Three acidic nitrification reactors with pH-specific communities
    definition: The simplified community is dominated by two described populations;
      not a verified two-isolate minimal synthetic consortium.
    evidence_ids:
    - abstract
    - dominance
  - name: source_strain
    value: Novel candidatus species plus genus-only environmental partner
    definition: No exact strain or MAG accession is supplied by the inspected abstract.
    evidence_ids:
    - abstract
  - name: experimental_setting
    value: Aerobic acidic bioreactors
    definition: Setting and conditions are source-reported; physical reactor and feed
      details remain unresolved.
    evidence_ids:
    - abstract
  - name: medium
    value: Unresolved from inspected abstract
    definition: No medium identity is inferred from process name or pH.
    evidence_ids:
    - abstract
  - name: source_category
    value: 'Primary abstract: genome-resolved meta-omics plus chemical measurements'
    definition: The whole article was not retrievable in this review.
    evidence_ids:
    - abstract
    - publisher
    - publisher-xml
- assessment_id: taxonomy
  area: grounding
  topic: taxonomy[0..1] and participant descriptors
  outcome: supported
  summary: NCBITaxon:3120726 and NCBITaxon:1763 resolve to the declared family and
    genus. Broad grounding is explicit, not silent species substitution. Current taxonomy
    search does not resolve the candidatus name. GTDB UNRESOLVED is honest; coherence
    gates do not constitute a new mapping. Species-specific partner identity and genome-level
    evidence remain unknown.
  target_ids:
  - CommunityMech:000434
  evidence_ids:
  - record
  - abstract
  - ontology
  - taxonomy-search
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Putative acidic carbon and nitrogen cycling
    linkage'
  outcome: supported
  summary: Both declared participants are represented, with community scope and explicitly
    putative linkage. The attached computational evidence supports potential carbon/nitrogen
    cycling, not an identified donor, recipient or transferred metabolite. Concurrent
    stress-response expression does not establish interspecies detoxification, rescue
    or reciprocal benefit.
  target_ids:
  - CommunityMech:000434
  evidence_ids:
  - record
  - abstract
  - linkage
  details: 'Participants: family-grounded candidatus ammonia oxidizer NCBITaxon:3120726
    and genus-grounded Mycobacterium NCBITaxon:1763. Direction: unresolved and unasserted.
    Mechanism: potential carbon/nitrogen cycling from genome/transcript evidence.
    Context: simplified most-acidic reactor community. Exact quote/locator: linkage;
    PMID:42762737 abstract.'
- assessment_id: edges
  area: graph
  topic: ecological_interactions[0].downstream
  outcome: not_applicable
  summary: No directed causal arrows occur in the whole target. Their absence is appropriate
    because the inspected source does not resolve transfer direction or causal partner
    dependence.
