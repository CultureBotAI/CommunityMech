  topic: related_ingredients[0..2]
  outcome: supported
  summary: The chemical names and IDs match the substrate and reactive-nitrogen species
    named in the abstract. These entries are not evidence of interspecies transfer.
    Bulk acidity alone does not justify replacing a source-named enzymatic substrate
    by a different protonation-state annotation. Exact flux and partner-specific fate
    remain unverified.
