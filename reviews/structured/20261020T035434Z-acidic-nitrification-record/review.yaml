  topic: environment_term and environmental_factors[0..1]
  outcome: supported
  summary: Bioreactor grounding matches the experimental setting. Reactive-nitrogen
    descriptions preserve the abstract qualifier likely and treat gene expression
    as an inferred response. They do not prove complete denitrification flux or obligate
    anaerobic growth in aerobic reactors. No unsupported active-pH-control assertion
    remains.
  target_ids:
