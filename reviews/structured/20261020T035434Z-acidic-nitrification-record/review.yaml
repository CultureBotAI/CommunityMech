limitations:
- Full article, supplements and raw data were not available through the inspected
  routes; abstract conclusions cannot supply missing Methods or exact exchange mechanisms.
- Europe PMC marks subscription access while Crossref advertises a Creative Commons
  license. Actual requests returned 403/429; no definitive paywall or permanent absence
  claim is made.
- NCBI name search returned zero exact-name results at access time. Broad fallback
  IDs resolve; unresolved GTDB mappings were not silently replaced.
- Optional expression-source runner unavailable; public catalog does not resolve exact
  source populations.
- Both required corpus network checks retain unrelated warning failures.
notes:
- Only a new immutable review bundle is written; no records, caches, histories or
  generated products changed.
- All original local input hashes remain unchanged.
- Short source quotes total fewer than 25 words and are shared across assessments.
