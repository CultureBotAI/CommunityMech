- evidence_id: ev-aerobic-denitrification-qq-pmid38277828
  kind: primary_source
  reference: PMID:38277828
  locator: kb/communities/Aerobic_Denitrification_QQ_SynCom.yaml
  accessed_at: '2026-11-09T05:14:00Z'
  support: supports
  summary: PMID:38277828 (doi:10.1016/j.watres.2024.121162) establishes that Acinetobacter
    baumannii N1 (NCBITaxon:470), Pseudomonas aeruginosa N2 (NCBITaxon:287), and Aeromonas
    hydrophila (NCBITaxon:644) were constructed as a defined three-member synthetic
    microbial community (SMC) driving efficient aerobic denitrification.
  quote: To improve denitrification efficiency, a synthetic microbial community (SMC)
    composed of denitrifiers Acinetobacter baumannii N1 (AC), Pseudomonas aeruginosa
    N2 (PA) and Aeromonas hydrophila (AH) were constructed. The nitrate (NO3--N) reduction
    efficiency of the SMC reached 97 % with little nitrite (NO2--N) accumulation,
    compared to the single-culture systems and co-culture systems.
- evidence_id: ev-aerobic-denitrification-disturbance-pmid40020349
  kind: primary_source
  reference: PMID:40020349
  locator: kb/communities/Aerobic_Denitrification_Disturbance_SynCom.yaml
  accessed_at: '2026-11-09T05:14:15Z'
  support: supports
  summary: PMID:40020349 (doi:10.1016/j.watres.2025.123270) establishes that Pseudomonas
    aeruginosa N2 (NCBITaxon:287), Acinetobacter baumannii N1 (NCBITaxon:470), and
    Aeromonas hydrophila (NCBITaxon:644) form a defined three-member synthetic microbial
    community (SMC) that maintains ~93% aerobic denitrification efficiency under dibutyl
    phthalate and levofloxacin disturbances.
  quote: Here, dibutyl phthalate (DBP) and levofloxacin (LOFX) were used as environmental
    disturbances to study their effects on the aerobic denitrification functional
    stability of SMC composed of Pseudomonas aeruginosa N2 (PA), Acinetobacter baumannii
    N1(AC) and Aeromonas hydrophila (AH).
- evidence_id: ev-achromobacter-enterobacter-sl8-sl12-pmid42307251
  kind: primary_source
  reference: PMID:42307251
  locator: kb/communities/Achromobacter_Enterobacter_SL8_SL12_Cadmium_Immobilization_Coculture.yaml
  accessed_at: '2026-11-09T05:14:30Z'
  support: supports
  summary: PMID:42307251 (doi:10.1128/spectrum.01081-26) establishes that Achromobacter
    sp. SL8 (NCBITaxon:222) and Enterobacter sp. SL12 (NCBITaxon:547) are primary
    cadmium-detoxifying and cadmium-immobilizing bacterial partners in the defined
    SL8-SL12 coculture (and in their corresponding single-strain isolate baselines
    CommunityMech:000533 and CommunityMech:000534).
  quote: After a 7-day incubation period, RE-Cd values reached 82.6% and 69.55% for
    SL8, 63.4% and 70.8% for SL12, and 82.6% and 80.9% for the co-cultured strains
    at initial Cd concentrations of 50 mg/L and 100 mg/L, respectively.
