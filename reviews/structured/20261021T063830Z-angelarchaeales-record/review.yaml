assessments:
- assessment_id: identity
  area: identity
  topic: Genome survey versus one ecological community
  outcome: concern
  summary: The source identity is verified, but a lineage-wide, multi-site genome
    collection is presented as one community. Source locations and the CuMMO-positive
    subset must remain distinct from co-occurring membership.
  target_ids:
  - CommunityMech:000234
  evidence_ids:
  - record
  - scope
  - primary
  - pubmed
  - crossref
  dimensions:
  - name: source_strain
    value: Species-level MAG representatives; no cultured strain
    definition: Twenty CuMMO-positive representatives are a subset of a larger lineage
      collection.
    evidence_ids:
    - scope
  - name: community_scope
    value: Multi-site lineage/genome survey
    definition: Not one measured assemblage of twenty co-occurring species.
    evidence_ids:
    - scope
  - name: experimental_setting
    value: Field-derived metagenomes plus computational analysis
    definition: Sequence, predicted structure and marker abundance do not establish
      in-vivo substrate flux.
    evidence_ids:
    - primary
    - scope
    - cummo
  - name: medium
    value: No cultivation medium reported for Angelarchaeales in this study
    definition: Empty growth_media is appropriate for the inspected genomic study.
    evidence_ids:
    - primary
  - name: evidence_tier
    value: Computational potential and ecological association
    definition: No direct enzyme-substrate or interspecies transfer experiment was
      inspected.
    evidence_ids:
    - primary
    - cummo
    - heterotrophy
- assessment_id: taxonomy
  area: grounding
  topic: taxonomy[0] and functional roles
  outcome: concern
  summary: The phylum ID and GTDB block are coherent at their encoded rank, but functions
    belong to the surveyed order/subset. PRIMARY_PRODUCER conflicts with lack of detected
    carbon-fixation pathways; PRIMARY_DEGRADER is at most inferred catabolic potential.
  target_ids:
  - CommunityMech:000234
  evidence_ids:
  - record
  - ontology
  - producer
  - schema
  - scope
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Archaeal CuMMO-Driven Aerobic Oxidation'
  outcome: supported
  summary: Candidate CuMMO activity is appropriately qualified.
  target_ids:
  - CommunityMech:000234
  evidence_ids:
  - record
  - cummo
  - primary
  details: 'Participants: surveyed CuMMO-encoding Angelarchaeales genomes, represented
    by one broad taxon entry. Candidate oxygen-dependent activity has no resolved
    substrate or measured direction of carbon/nitrogen flux. Source PMID 34987183,
    exact section locator and bounded verbatim excerpt in linked evidence; no new
    causal edge is warranted.'
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Blue Copper Protein Electron Transport Repertoire'
  outcome: supported
  summary: BCP enrichment and gene context support the stated candidate repertoire.
  target_ids:
  - CommunityMech:000234
  evidence_ids:
  - record
  - bcp
  - primary
  details: 'Participants: surveyed lineage genomes; no interspecies source/target.
    Electron transport and enzyme coupling remain computational interpretations. Source
    PMID 34987183, exact section locator and bounded verbatim excerpt in linked evidence;
    no new causal edge is warranted.'
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Peptide and Amino Acid Heterotrophy'
  outcome: supported
  summary: Peptide and amino-acid catabolic potential is supported as an encoded repertoire.
  target_ids:
  - CommunityMech:000234
  evidence_ids:
  - record
  - heterotrophy
  - primary
  details: 'Participants: surveyed lineage genomes; no donor species or measured substrate
    uptake. Do not generalize all detailed Angelarchaeales-1 pathways to every member.
    Source PMID 34987183, exact section locator and bounded verbatim excerpt in linked
    evidence; no new causal edge is warranted.'
- assessment_id: node-3
  area: graph
  topic: 'ecological_interactions[3]: CuMMO-Heterotrophic Metabolic Context'
  outcome: supported
  summary: Co-encoding and reconstructed context support the explicit coupling hypothesis.
  target_ids:
