- evidence_id: scope
  kind: primary_source
  reference: PMID:34987183
  locator: 'Results: genome identification and order definition; abundance analysis;
    Methods: genome set selection'
  summary: Twenty CuMMO-positive species representatives are drawn from a larger lineage
    survey across distinct environments. They do not establish one co-occurring 20-member
    community. Marker-based abundance is restricted to sites already known to contain
    the lineage.
  support: supports
  accessed_at: '2026-10-20T07:38:32.444671Z'
  quote: 185 samples taken from six environments
- evidence_id: producer
  kind: primary_source
  reference: PMID:34987183
  locator: 'Results: General metabolic features of Ca. Angelarchaeales'
  summary: No identified carbon-fixation pathway supports the record’s autotrophic
    role. Predicted oxidation does not itself establish primary production. Peptide/amino-acid
    metabolism is genomic potential rather than measured uptake.
  support: supports
  accessed_at: '2026-10-20T07:38:32.444671Z'
  quote: did not identify carbon fixation pathways
- evidence_id: cummo
  kind: primary_source
  reference: PMID:34987183
  locator: 'Results: catalytic residues and AlphaFold prediction; Discussion'
  summary: Conserved residues and predicted structure support candidate CuMMO activity.
    No ammonia/methane/hydrocarbon substrate or in-vivo flux is resolved.
  support: supports
  accessed_at: '2026-10-20T07:38:32.444671Z'
  quote: exact substrate specificity
- evidence_id: bcp
  kind: primary_source
  reference: PMID:34987183
  locator: 'Results: BCP enrichment, BCP subtype analysis and co-localized energy
    conversion machinery'
  summary: Enriched protein inventories and gene context support candidate electron
    transfer. Several protein families lack assigned biochemical functions; no direct
    CuMMO coupling was demonstrated.
  support: supports
  accessed_at: '2026-10-20T07:38:32.444671Z'
  quote: functional predictions
- evidence_id: heterotrophy
  kind: primary_source
  reference: PMID:34987183
  locator: 'Results: General metabolic features and Angelarchaeales-1 metabolic reconstruction;
    Methods: genome annotation'
  summary: Encoded transport/protease/catabolic capacity supports heterotrophic potential.
    Detailed coupling reconstruction centers on Angelarchaeales-1 and must not become
    a measured pathway in every lineage member.
  support: supports
  accessed_at: '2026-10-20T07:38:32.444671Z'
  quote: amino acid and peptide transport systems
- evidence_id: environment
  kind: primary_source
  reference: PMID:34987183
  locator: 'Results: sites and abundance; Discussion: selected-site limitation and
    possible anaerobic metabolism'
  summary: Soils and aquifer sediments occur across multiple sites, with marine genomes
    also discussed in the wider survey. No common equilibrium state or extreme condition
    is established. The source’s aerobic inference and discussion of possible anaerobic
    fermentation are preserved as uncertain, not made obligate.
  support: supports
  accessed_at: '2026-10-21T06:38:30.991754Z'
- evidence_id: schema
  kind: authority
  reference: src/communitymech/schema/communitymech.yaml
  locator: FunctionalRoleEnum, EcologicalStateEnum, CommunityCategoryEnum and EvidenceSourceEnum
  summary: PRIMARY_PRODUCER means autotrophic carbon fixation; STABLE means equilibrium
    and EXTREME_ENVIRONMENT means extreme conditions. IN_VIVO includes field studies,
    so environmental sampling itself is not a mislabeled in-vivo experiment.
  support: supports
  accessed_at: '2026-10-21T06:38:30.991756Z'
