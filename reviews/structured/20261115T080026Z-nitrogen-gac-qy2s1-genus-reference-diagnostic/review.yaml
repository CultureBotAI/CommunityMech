limitations:
- Partial technical diagnostic with scientific_review:false. Database correspondence
  and scoped gates do not complete whole-record scientific review, source-snippet
  validation, generated-page integration, the repair campaign or final corpus QC.
- Native denominators are named-binomial reference populations under the exact761d5537
  crosswalk, not genomes sequenced from the study stocks or MAGs. Klebsiella44527/44529
  has two GTDB genera despite a displayed rounded fraction1.0; unanimity must not
  be inferred. Lentimicrobium3/3 is a thin reference population.
- The nitrogen-removal primary evidence here is retained abstract text; the GAC and
  QY2S1 sources are selected retained main-text passages. This bounded pass performs
  no new complete-paper, supplement, figure, strain sequence or assembly audit. Separate
  supplementary-reference mismatches remain owned by1996.
- The whole-record native route report ran locally at1d5bfe5a, source binding/staging
  at295c7d2b, and actual guarded application/checks on isolated M5 at23d84a2d. Local
  native Python was3.13.12 and M5 native Python3.13.2. Post-application checks are
  not a clean-tree run. File mtime in mapping_source is not a database release; local
  NCBI identity/rank observations are stat-bound, not a full database checksum.
- 372 retains unknown strain identities, nitrate removal versus total nitrogen-removal
  distinctions, FeII/PAM conditions, and every Stutzerimonas/Pseudomonas alternative.
  Reference correspondence does not establish species, assemblies, cross-feeding or
  a nitrogen-removal pathway.
- 349 retains study MAG labels, existing domain mappings and all unselected taxon
  alternatives. The study's GTDB R214 analysis provenance is not the release of the
  present crosswalk. Genus correspondence does not identify exact MAG assemblies or
  prove the proposed electron-transfer/auxiliary roles.
- 424 retains source-specific dehalogenation and uncertain partner roles, Clostridium
  alternatives, the historical c13s5 correction chain and supplementary-reference
  failures. A historical note that grounding was not asserted remains historical,
  not a new biological claim.
- Term validation literally reports Validation passed without a reported assertion
  denominator. Strict successor admission and final integration tests are separate
  follow-up checks; no prior scientific issue is closed by this diagnostic.
