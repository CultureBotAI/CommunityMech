limitations:
- Partial technical review with scientific_review:false. Passing scoped commands does
  not establish complete scientific review, current source-snippet validation, generated-product
  integration, aggregate QC or campaign completion.
- The generic NCBI species-name route for Dolichospermum flos-aquae yields three ordered
  alternatives without a single classification block or inferred reference denominator.
  Those alternatives do not identify three candidate genomes for the experimental
  stock and do not replace or dispute the paper's separate GTDB-Tk v2.5.2/r226 placement
  of the recovered FBCC-A233 genome in the flosaquae cluster.
- Sphingorhabdus_B has 27/27 filtered reference genomes and Brevundimonas has 221/221.
  These are generic genus populations, not study-stock assignments, culture abundance,
  recovered study-genome counts or a complete culture census. The paper's ANI/alignment-fraction
  comparisons and unnamed genome clusters remain separate evidence.
- The native source proof retains the warning that Sphingorhabdus_B is not the type-anchored
  clade and that the type-bearing Sphingorhabdus lineage drew no genomes in this filtered
  population. The writer stores the reclassification flag but does not serialize that
  warning into the canonical block or native log. No new formal NCBI genus name or
  named species assignment is claimed.
- Source reading covered the whole current record, prior scientific review and historical
  caller/ledger, plus selected retained primary Methods, genome-identification results,
  Table 2 and Discussion passages. This diagnostic did not newly inspect complete
  supplements, original figure pixels, assemblies, raw sequence data or experimental
  fluxes.
- The FBCC-A233 designation, absent associate-stock fields, source names and quotations,
  stability and abundance annotations, cultivation settings, two COMMUNITY_LEVEL computational
  cofactor nodes, PARTIAL evidence and absence of causal arrows remain unchanged.
  Predicted cofactor pathways do not prove biotin or cobamide exchange, canonical
  cobalamin identity, uptake or growth dependence.
- The immutable prior full scientific review remains needs_curation. Issues 1406,
  2691, 2692 and 2693 remain unresolved by this generic correction; source-genome
  provenance is not completed by a generic genus mapping, and source-case, maintenance
  and abundance concerns are not waived.
- The exact crosswalk hash is 761d5537a7edb4b0133e88e7bbc85570cf3cb6f2555b9f9ce6cca3e1056a0ddd.
  Its upstream release and chronology are unestablished; file mtime is not a release
  identifier and is not the paper's r226 designation. NCBI label/rank authority is
  bound by database identity and stat, not a full database checksum.
- Original source reporting, binding and local staging ran at 3973ff3358bbc3edbbd97734602ad5fae7272e67
