evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Coniochaeta_Sphingobacterium_Citrobacter_Wheat_Straw_Consortium.yaml
  locator: Whole maintained YAML
  summary: The three-member synthetic, engineered wheat-straw consortium has four
    untyped interaction nodes and two PARTIAL arrows. Current member identities, historical
    names and qualified mechanistic claims are distinguished from the reversed bacterial
    genome assignments and incomplete cultivation representation.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368379Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Materials and methods → Strains, experimental setup and tripartite microbial
    consortium culture, sole paragraph
  summary: The source identifies Coniochaeta sp. 2T2.1 (NRRL Y-64006), Sphingobacterium
    paramultivorum w15 (DSM 106342) and Citrobacter freundii so4 (DSM 106340). NRRL
    is source-reported; no independent NRRL catalogue verification or Citrobacter
    type status is inferred.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368437Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
- evidence_id: rename
  kind: primary_source
  reference: PMID:34683378; DOI:10.3390/microorganisms9102057
  locator: Results and Discussion; Table 1; Table 4; Conclusions
  summary: The taxonomic study supports the historical multivorum w15 to paramultivorum
    assignment and DSM 106342 identity. Table 4 uses PHGU contig identifiers. Its
    16S sequence-variant proportions are not member abundance in the tripartite culture.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368532Z'
  snapshot_sha256: e9c83c289ea6727f9c1b2e831f2f16b6c6399162dfea1349b96aa0f3c4f5a662
- evidence_id: recipe
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Materials and methods → Strains, experimental setup and tripartite microbial
    consortium culture, sole paragraph
  summary: The experiment supplies 0.3 g washed wheat straw in 30 mL mineral medium
    in 100 mL Erlenmeyer flasks, at 28 °C and initial pH 6.2, with 60 or 180 rpm shaking.
    Each member starts at about 5–6 log cells/mL. The paragraph gives five mineral
    salts and 30 µL each of vitamin and trace-metal stocks. Cellulose, xylan and lignin
    are constituents of the straw, not independently supplied pure reagents.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368639Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
  quote: initial pH
- evidence_id: sampling
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Materials and methods → Microbial RNA extraction and sequencing, sole paragraph;
    Data analysis, sole paragraph
  summary: Three replicate flasks per shaking condition and time point are sampled
    at 1, 5 and 13 days. Fungal and bacterial RNA libraries are prepared separately.
    Laboratory harvest/centrifugation temperatures and sampling agitation are analytical
    operations, not cultivation setpoints; RNA expression does not by itself establish
    enzyme activity or cross-feeding flux.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368718Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
- evidence_id: mass-loss
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Results → Population dynamics of the consortium strains, and WS degradation
    performance → WS degradation levels, sole paragraph; Figure 1
  summary: The consortium loses 27.1 ± 2.4% straw mass at 60 rpm versus 16.2 ± 1.7%
    at 180 rpm after 13 days, with the reported comparison p < 0.001. This directly
    measured community endpoint should have its own Results/Figure evidence, separate
    from transcript-based mechanistic interpretation.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368799Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
- evidence_id: population
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Results → Population dynamics, sole paragraph; Figure 1; Discussion → The
    behavior of S. paramultivorum w15, C. freundii so4 and Coniochaeta.sp. 2T2.1 differed
    between two shaking conditions
  summary: CFU trajectories and fungal morphology differ across members and conditions.
    CFU, starting density and TPM are different observables; they do not establish
    persistent equal biomass fractions. The current COMMON labels can remain ordinal
    without a new numerical threshold.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368875Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
- evidence_id: recipient-roles
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Discussion → Putative complementary enzymatic mechanisms leading to division
    of labor, three paragraphs; Metabolic synergism may be promoted by low shaking
    speed, two introductory paragraphs; Conclusions, sole paragraph
  summary: The source proposes complementary substrate processing and bacterial consumption
    of glucose/xylose released during degradation. This can support qualified inferred
    CROSS_FEEDER roles. It explicitly lacks a full metabolic study; a proposed flexible
    aerobic/microaerophilic/anaerobic physiology does not establish so4 fermentation
    of primary-degradation products.
  support: supports
  accessed_at: '2026-10-22T00:30:36.368950Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
- evidence_id: vitamin
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Results → Vitamin B2 generation and metabolism in the SWT consortium, two
    paragraphs; Materials and methods → Strains, experimental setup and tripartite
    microbial consortium culture
  summary: All three members encode ribE, and the growth medium supplies riboflavin.
    Expression differences support a proposed contribution to vitamin metabolism,
    not exclusive w15 donation or a demonstrated partner requirement. Existing graph
    qualifiers correctly preserve this boundary.
  support: supports
  accessed_at: '2026-10-22T00:30:36.369026Z'
  snapshot_sha256: 79be59439865226a3812ac3545432d2e8a568e43ed82f1424af41ae38ecee50b
- evidence_id: rna-protocol
  kind: primary_source
  reference: PMID:31769802; DOI:10.1093/femsec/fiz186
  locator: Published Methods → Synthetic tripartite consortium experiment and RNA
    extraction, pages 2–3
  summary: The 2020 transcript comparison uses 100 mL mineral medium, 1% wheat straw,
    30 °C, 250 rpm, pH 6.8 and initial OD600 0.1 per member with a stated 1:1:1 inoculum
    ratio; RNA is sampled at 24 and 72 h. Glucose preculture and cell washing precede
    the production assay. These conditions must not be merged with the separate parallel
    degradation experiment.
  support: supports
  accessed_at: '2026-10-22T00:30:36.369101Z'
  snapshot_sha256: e281e38189fda6d34e19f1d15011aec86db0599c189b92a6040456f01fd6e68d
- evidence_id: growth-protocol
  kind: primary_source
  reference: PMID:31769802; DOI:10.1093/femsec/fiz186
  locator: Published Methods → Evaluation of 2T2.1 growth and wheat straw degradation
    within the tripartite consortium, page 4; Figure 4 caption, page 8
  summary: The parallel growth/degradation assay uses 25 mL in 100 mL flasks, 1% washed
    straw, 28 °C, 180 rpm, about 5 log cells/mL and a 10-day mass-loss endpoint. Figure
    4 specifies pH 7.2. Straw drying at 50 °C, plate antibiotics and preculture medium
    do not describe the tripartite production incubation.
  support: supports
  accessed_at: '2026-10-22T00:30:36.371117Z'
  snapshot_sha256: e281e38189fda6d34e19f1d15011aec86db0599c189b92a6040456f01fd6e68d
- evidence_id: fungal-response
  kind: primary_source
  reference: PMID:31769802; DOI:10.1093/femsec/fiz186
  locator: 'Published Results and Discussion → Fungal-bacterial interaction: synergy
    or antagonism?, pages 5–7; Figures 3 and 4; Table 2'
  summary: The bacterial pair is associated with reduced fungal CFU through 96 h,
    lower straw degradation than the fungal monoculture and altered fungal transcripts.
    This is not an isolated w15 effect or proof of reciprocal harm. Coarse prose percentages
    are not exact means inferred from the plotted distributions; the current nonnumeric
    graph avoids that precision problem.
  support: supports
  accessed_at: '2026-10-22T00:30:36.372854Z'
  snapshot_sha256: e281e38189fda6d34e19f1d15011aec86db0599c189b92a6040456f01fd6e68d
- evidence_id: mco
  kind: primary_source
  reference: PMID:31769802; DOI:10.1093/femsec/fiz186
  locator: Published Results and Discussion → Expression of novel fungal MCOs in the
    tripartite consortium, pages 8–9; Figure 5
  summary: Sequence, structural-model and transcript evidence supports proposed MCO
    functions and interactions. The source leaves functional characterization open;
    it does not directly measure a particular MCO causing lignin transformation or
    bacterial growth. Preserve the qualified mechanism and PARTIAL arrow.
  support: supports
  accessed_at: '2026-10-22T00:30:36.374608Z'
  snapshot_sha256: e281e38189fda6d34e19f1d15011aec86db0599c189b92a6040456f01fd6e68d
- evidence_id: si-workbooks
  kind: primary_source
  reference: PMID:36991472; DOI:10.1186/s13068-023-02289-0
  locator: Additional file 1, Table S1 library summary and seven sheet headers; Additional
    file 3, Table S3 family annotations and selected rows
  summary: Bounded workbook inspection confirms 36 separately prepared libraries,
