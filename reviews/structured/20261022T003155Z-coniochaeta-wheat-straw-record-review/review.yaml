actions:
- action_id: repair-genome-links
  description: Correct both member and dataset genome associations.
  finding_ids:
  - genome-accessions
  target_ids:
  - CommunityMech:000195
  owner_paths:
  - repository: CultureBotAI/CommunityMech
    path: kb/communities/Coniochaeta_Sphingobacterium_Citrobacter_Wheat_Straw_Consortium.yaml
    role: canonical_record
  acceptance_checks:
  - Assign PHGU01000000 to w15 and PHGV01000000 to so4 in all eight accession/URL
    selectors. Preserve the project-master forms PHGU00000000.1 and PHGV00000000.1
    as versioned provenance where useful.
  - Retain the three member identities, DSM 106342 and DSM 106340. Explain source
    so4 versus archive soB4 using the shared DSM identifier and submission title;
    do not infer an unrelated isolate or unsupported Citrobacter type status.
  - Keep valid PRJNA870051 and JGI 1019910 links. Optionally add the twelve verified
    2020 SRP studies listed in the resource receipt with their monoculture/coculture,
    24/72 h and triplicate design; keep separately prepared fungal and bacterial libraries
    distinct from independent cultures.
- action_id: recover-protocol
  description: Recover quantitative cultivation and source-local outcome evidence.
  finding_ids:
  - cultivation
  target_ids:
  - CommunityMech:000195
  owner_paths:
  - repository: CultureBotAI/CommunityMech
    path: kb/communities/Coniochaeta_Sphingobacterium_Citrobacter_Wheat_Straw_Consortium.yaml
    role: canonical_record
  acceptance_checks:
  - Represent 0.3 g washed wheat straw in 30 mL mineral medium, in 100 mL Erlenmeyer
    flasks. Retain cellulose/xylan/lignin as straw constituents or related substrates,
    not independently supplied purified ingredients unless a different assay is explicitly
    cited.
  - For the 2023 assay, add 28 °C, initial pH 6.2, separate 60/180 rpm conditions,
    approximately 5–6 log cells/mL per member and 1/5/13-day sampling. Do not infer
    continuous pH control, fixed member fractions or a gas concentration from shaking
    speed.
  - Recover the five mineral salts and the vitamin/trace-stock recipes from the sole
    named Methods paragraph. Keep 30 µL stock additions per 30 mL separate from stock
    concentrations, including supplied riboflavin. Preserve printed NaMoO4·2H2O/formula
    uncertainty and the duplicated g/L typographic issue rather than silently correcting
    source chemistry.
  - Keep the 2020 RNA assay (100 mL, 30 °C, 250 rpm, pH 6.8, OD600 0.1 each, 24/72
    h) separate from its parallel growth/loss assay (25 mL in 100 mL flasks, 28 °C,
    180 rpm, about 5 log cells/mL, 10-day loss, Figure 4 pH 7.2). Do not transfer
    preculture glucose, drying temperature, analytical operations or plating antibiotics
    into production culture.
  - Attach direct 2023 Results → WS degradation levels and Figure 1 evidence to the
    27.1 ± 2.4% versus 16.2 ± 1.7% community output at 13 days. Keep mechanism evidence
    PARTIAL, and preserve the supplementary 15-day caption discrepancy as a source
    limit.
  - Update the preparation note as recovered recipe completeness. Do not claim it
    previously asserted that the sources lacked a recipe, and do not overwrite the
    dated historical 2020 access failure.
- action_id: qualify-fermentation
  description: Match the so4 role to its actual evidence.
  finding_ids:
  - fermentation-role
  target_ids:
  - CommunityMech:000195
  owner_paths:
  - repository: CultureBotAI/CommunityMech
    path: kb/communities/Coniochaeta_Sphingobacterium_Citrobacter_Wheat_Straw_Consortium.yaml
    role: canonical_record
  acceptance_checks:
  - Retain SECONDARY_FERMENTER only with source-local support for fermentation of
    primary-degradation products and an accurate inference tier; otherwise omit the
    optional role. Consumer metabolism and aerobic/microaerophilic/anaerobic flexibility
    alone are insufficient.
  - Retain both source-qualified bacterial CROSS_FEEDER roles for inferred use of
    released glucose/xylose and the supported complex-substrate roles. Attach local
    evidence instead of demanding an identified donor-resolved flux, obligacy or reciprocal
    benefit.
  - Keep four qualified interaction nodes and two PARTIAL arrows, no exclusive riboflavin
    donor, no isolated w15 antagonism, no reciprocal competition and no demonstrated
    specific MCO flux.
