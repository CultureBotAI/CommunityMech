- Methods 2.4 FMT schedule differs from Results 3.3; this source conflict is retained
  rather than harmonized. FMT and constructed-SynCom feeding are separate experimental
  arms.
- Methods 2.8 concentration per mL versus Results 3.5 per L is unresolved. Equal-volume
  inoculum mixing does not determine a final feed dose or persistent in-host proportions.
- Main compatibility 78h differs from S10 24/48/72h composition sampling. S10 does
  not give medium/temperature. S11 preliminary combination curves do not establish
  statistical synergy or necessity.
- Methods eight selected qPCR genes differs from nine displayed Figure 6F panels.
  Pathway labels and gene RNA do not measure IgA protein, barrier-protein abundance
  or direct permeability; DAO remains ambiguous.
- Archive Carassius carassius217509 conflicts with paper C.auratus7957. Verified21baseline16S
  rows do not identify FMT/SynCom/RNA libraries, and no global archive-absence claim
  is made.
- Current stutzeri lineage is Stutzerimonas, despite the source legacy Pseudomonas
  name. Source isolate codes are not exact NCBI strain nodes or collection aliases;
  S9 comparator accessions are not focal deposits.
- Nine excerpts strictly match fresh/cache; one initial-case projection is explicit.
  The cache abstract_only header is stale relative to appended main, but original
  bytes are preserved. All eight focused native checks passed; these passes do not
  independently certify claim entailment.
