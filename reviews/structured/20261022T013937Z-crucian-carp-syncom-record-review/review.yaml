evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Crucian_Carp_Gut_Disease_Resistance_SynCom.yaml
  locator: Whole maintained YAML
  summary: Three bacterial genus descriptors, three untyped community-level nodes
    and two PARTIAL arrows. The graph carefully separates treatment outcomes from
    proposed mediation; stronger description wording and several metadata statements
    need repair.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330006Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Results 3.5 Construction of simplified communities and determination of
    disease resistance, paragraph 1; Supplementary Figure S9
  summary: The source identifies Cetobacterium somerae S3, Pseudomonas stutzeri J1
    and Paraclostridium bifermentans M1 by 16S sequencing. They represent three selected
    isolates, not every member of three genera. The phylogenetic figure includes comparator
    accessions that are not assigned to these focal isolate tips.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330093Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: comparisons
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Results 3.2 Crucian carp exhibiting distinct clinical symptoms harbor divergent
    intestinal microbial community structures; Results 3.4 Fecal microbiota transplantation
    accelerates restoration of intestinal microbiota; Figure 4D; Supplementary Figure
    S3
  summary: Mild-versus-severe symptom and FMT-versus-TRE comparisons are different
    experiments. The Cetobacterium p=.037 in S3 concerns mild/severe groups; p=.013
    in Figure 4D concerns FMT/TRE. The current abundance note attaches the latter
    value to the former comparison.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330387Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: protection
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Abstract; Results 3.5 Construction of simplified communities and determination
    of disease resistance, paragraph 2; Figure 5D–E; Methods 2.6 Quantification of
    pathogenic bacteria
  summary: Following 28 days of SynCom feeding, the challenged treatment group has
    60% survival versus 32.5% in controls and lower calibrated Aeromonas DNA loads
    in intestine and kidney. These support protective treatment effects. DNA qPCR
    is not a direct viable-pathogen count and the separate FMT survival comparison
    is not the SynCom result.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330466Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: responses
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Results 3.5 paragraph 2, Figure 5B–C; Results 3.6 Simplified microbial
    community reshaped the intestinal transcriptomic level, sole paragraph and Figure
    6; Discussion paragraph 4
  summary: Measured enzyme activities and gene-expression responses accompany treatment.
    IgA-production and tight-junction terms are pathway annotations; selected-gene
    RT-qPCR does not measure IgA protein, barrier-protein abundance or functional
    permeability. Increased DAO is an injury-associated marker interpreted as possible
    turnover/repair. No selective blockade or rescue isolates immune/barrier mediation.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330534Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: isolation
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Methods 2.7 Isolation and identification of differential microbes, sole
    paragraph
  summary: Gut homogenates are plated on BHI and LB agar, with 48-hour incubation
    under the reported anaerobic 28°C and aerobic conditions; purified colonies expand
    in 5 mL BHI/LB broth. These are isolation/expansion conditions, not established
    compatibility-culture temperature or a single mixed medium recipe.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330606Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: construction
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Methods 2.8 Construction of simplified microbial communities, sole paragraph
  summary: Activated colonies undergo overnight shaking culture to OD600 1.0, centrifugation
    at 5000×g for 10 minutes at 4°C, PBS resuspension and standardization to the stated
    1×10^8 CFU/mL before mixing equal volumes. Centrifuge temperature is not culture
    temperature. The source does not supply a precise shaking speed or complete medium
    formulation here.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330687Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
  quote: equal volumes
- evidence_id: compatibility
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Results 3.5 paragraph 2; Supplementary Figures S10–S11 and their captions
  summary: The main text reports pairwise/triple ratios 1:1 and 1:1:1 over 78 hours
    without observed antagonism. S10 instead displays composition at 24, 48 and 72
    hours and supplies no medium or temperature. S11 preliminary feeding curves favor
    the triple treatment but do not establish statistical synergy or necessity of
    each member.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330752Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: fmt
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Methods 2.4 Fecal microbiota transplantation experiment, paragraph 2; Results
    3.3 Fecal microbiota transplantation alleviates the clinical symptoms and inflammation
    caused by Aeromonas hydrophila infection, sole paragraph
  summary: Methods specifies seven antibiotic-feeding days followed by two consecutive
    gavages; Results describes three antibiotic days and gavage on days1 and 3. Preserve
    the source discrepancy and the separate FMT arm, rather than importing its dosing
    into the constructed three-isolate feeding experiment.
  support: supports
  accessed_at: '2026-10-22T01:39:37.330816Z'
  snapshot_sha256: daa2f38568db1c917f630d0abf5326625779758259a612d2c9a5e3a80a368fda
- evidence_id: deposition
  kind: primary_source
  reference: PMID:41280275; DOI:10.1016/j.synbio.2025.10.011
  locator: Data availability, sole paragraph; Methods 2.5 Microbiome analysis and
