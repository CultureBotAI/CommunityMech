limitations:
- The full 36-member composition, culture assembly history and underlying earlier
  consortium-baseline data were not independently resolved. A related fungal study
  sharing the patent is contextual evidence only; its strains/counts/conditions are
  not imported.
- The source uses single reactors and alkane chains as statistical replicates, clips
  negative values before rate analysis and reports earlier consortium results. GC-FID
  removal is not measured mineralization, partner flux, fitness, or ecological equilibrium.
- All main tables/figures were inspected, but genome reads, assembly files, GC-FID
  raw data and mass-balance recovery were not reanalyzed. No supplementary element/link
  was found in the exact XML/HTML inspected; this is not a global absence claim.
- Methods four flasks wording does not resolve biological replication; Figure 4 caption
  last 16 days and its 16–31-day interval are retained as source wording rather than
  silently harmonized.
- Nine 447–452 bp partial 16S entries identify markers, not whole genomes. Archive
  classifications do not compel species promotion; publication linkage is established
  through Table 1 rather than PMID archive crosslinks.
- Historical GTDB status and mapping statistics were not recomputed; optional adapter
  discovery and corpus network receipts retain their original runtime/scope boundaries.
notes:
- No canonical, cache, history or generated file was changed.
- All 26 repository inputs were pinned before assessment and rechecked.
- Direct source quotations total 14 words from the focal publication; related-study
  evidence is an assessor report with no direct quotation.
- Native quality 100 is capped from 111 and does not resolve the scientific limitations.
