assessments:
- assessment_id: identity
  area: identity
  topic: Parent consortium versus nine characterized representatives
  outcome: supported
  summary: The study and record identify the selected nine; complete 36-member composition
    remains unresolved.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - main
  - selection
  - table1
  - dataset
  dimensions:
  - name: community_scope
    value: Patented 36-organism microbial parent with nine selected bacteria
    definition: The nine-member table is not an exhaustive community roster or a demonstrated
      nine-member reconstructed consortium.
    evidence_ids:
    - selection
    - table1
    - baseline
  - name: source_strain
    value: RB4, OH4, RC5, RA2, PD6, PD7, RC6, PD5, PD8
    definition: All nine source codes map to short 16S records; closest-reference
      M3 is not either experimental Bacillus isolate.
    evidence_ids:
    - table1
    - dataset
    - taxon-followup
  - name: environment
    value: Laboratory oil/BH assay modeling a contaminated mangrove
    definition: Both ENVO terms fit their distinct actual versus modeled contexts;
      the source habitat does not prove equilibrium or assembly origin.
    evidence_ids:
    - methods
    - ontology
    - schema
  - name: medium
    value: Bushnell-Haas broth with paraffinic Recôncavo crude oil
    definition: The existing assay amounts, vessel, temperature and duration are supported;
      exact recipe identity, pH, atmosphere and shaking are not inferred.
    evidence_ids:
    - methods
  - name: experimental_setting
    value: Isolate assays compared with earlier complete-consortium results
    definition: Single reactors and chain-level statistical replicates limit generalization;
      four flasks wording does not establish biological replication.
    evidence_ids:
    - design
    - baseline
    - figure3
  - name: evidence_tier
    value: GC-FID removal and predicted genomic capacity
    definition: Removal differs by chain class and time; genomic annotations do not
      establish expression, flux, partner fitness or within-community succession.
    evidence_ids:
    - partition
    - figure3
    - figure4
  - name: grounding_status
    value: Valid labels with a material closest-reference identity mismatch
    definition: RB4/OH4 and the OH4 participant require scope-correct grounding; current
      genus-level identities elsewhere need not be promoted from short markers.
    evidence_ids:
    - ontology
    - taxon-followup
    - dataset
- assessment_id: taxonomy
  area: grounding
  topic: All nine source identities and PRIMARY_DEGRADER roles
  outcome: concern
  summary: All nine codes and light-alkane activity are source-supported, but M3 is
    over-specific grounding for RB4/OH4.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - table1
  - dataset
  - figure3
  - ontology
  - taxon-followup
  details: Maintain RB4/OH4 strain labels and distinguish Table 1 nearest relatives,
    live marker classifications and experimentally supported rank. Genus Bacillus
    1386 is a verified conservative option; archive B. cereus 1396 does not mandate
    promotion. RC5 remains Brevibacillus; RA2/PD6/PD7 Pseudomonas; RC6/PD5/PD8 Stenotrophomonas.
    The shared role excerpt concerns light-alkane removal, not equal performance across
    all fractions or all 36 organisms.
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Complete-consortium intermediate alkane synergy'
  outcome: supported
  summary: Retain the qualified comparison and PARTIAL cascade interpretation.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - design
  - baseline
  - figure3
  - main
  details: This community-level node compares complete-consortium intermediate C15–C28
    removal with selected isolate assays. It explicitly preserves the earlier baseline,
    single-reactor design and chain-replicate statistics. Byproduct cascading/toxic-intermediate
    avoidance is proposed, not measured transfer, reciprocal fitness or mineralization.
    No interaction type or downstream arrow is required.
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Rapid and delayed alkane-degradation partitioning'
  outcome: supported
  summary: Retain PARTIAL NICHE_PARTITIONING as an author-proposed temporal specialization
    model.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - partition
  - figure3
  - figure4
  - taxon-followup
  details: PD6, RC6, PD5 and OH4 are the explicit selected participants. AlkB annotations
    and isolate trajectories support the proposed rapid/delayed contrast; they do
    not directly measure reduced competition or succession inside the consortium.
    Correct the OH4 taxon alongside taxonomy, retain code identity, and do not infer
    biosurfactant necessity or transfer. Zero arrows are encoded and none should be
    invented.
- assessment_id: summary
  area: evidence
  topic: Top-level necessity and occupied-role claims
  outcome: concern
  summary: The abstract uses strong synergy language, but the summary drops material
    assay qualifications already preserved in the graph.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - record
  - design
  - baseline
  - partition
  - figure3
  - figure4
  details: Describe the reported comparative intermediate-removal result and proposed
    specialization without presenting complete-member necessity or observed within-consortium
    succession as established. Source interpretation is real; the defect is unqualified
    propagation beyond the measurements, not a fabricated citation.
- assessment_id: state-origin
  area: identity
  topic: Equilibrium and environmental provenance
  outcome: concern
  summary: STABLE lacks equilibrium evidence; NATURAL requires a clearer boundary
    between source habitat and the patented culture.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - selection
  - schema
  - related-patent-scope
  details: Neither removal over 31 days nor environmental isolation establishes an
    equilibrium community. Preserve the 36-organism source attribution and unresolved
    assembly history; do not automatically switch to SYNTHETIC or add organisms from
    another patent-associated study.
- assessment_id: cultivation
  area: completeness
  topic: Existing assay conditions and preparation scope
  outcome: supported
  summary: The medium and vessel block accurately captures the reported degradation
    assay.
  target_ids:
  - CommunityMech:000413
  evidence_ids:
  - methods
  - design
  details: Optional enrichment can separate 48 h plate cultivation and 250 mL stock-flask
    preparation from the 500 mL degradation vessel. Do not add an absolute inoculum
    density, pH, agitation or oxygen setting from a generic BH recipe, or confuse
    chromatograph temperatures/flows with cultivation. A named medium alone does not
    establish a unique CultureMech recipe.
- assessment_id: placement
