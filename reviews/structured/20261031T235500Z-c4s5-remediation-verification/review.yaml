  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: E. coli GL10-XL12 D-Lactate Mixed-Sugar SynCom (CommunityMech:000357) omits PRIMARY_DEGRADER
    functional_role and DOMINANT abundance_level on both engineered specialist strains
  description: 'CommunityMech:000357 (kb/communities/Ecoli_GL10_XL12_D_Lactate_Mixed_Sugar_SynCom.yaml,
    proportional Completeness Score 90/100; scripts/audit_completeness.py score 35/100) models the two-strain
    division-of-labor consortium of glucose-specialized Escherichia coli GL10 and xylose-utilizing Escherichia
    coli XL12 (NCBITaxon:562) for mixed glucose/xylose co-fermentation to optically pure D-lactate in
    M9 medium containing 5 g/L glucose and 5 g/L xylose (PMID:42038008, doi:10.1016/j.bidere.2026.100072).
    Both taxonomy entries omit functional_role: [PRIMARY_DEGRADER] and abundance_level: DOMINANT despite
