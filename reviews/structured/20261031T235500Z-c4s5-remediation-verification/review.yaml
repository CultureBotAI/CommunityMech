findings:
- finding_id: c4s4-000083-smutans-calbicans-roles-metabolites-and-sucrose
  issue_key: communitymech-c4s4-000083-smutans-calbicans-roles-metabolites-and-sucrose
  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: Streptococcus mutans-Candida albicans ECC Biofilm (CommunityMech:000083) omits source-backed
    functional_role and DOMINANT/ABUNDANT abundance_level on both co-species biofilm members, exopolysaccharide
    (CHEBI:72813) on ecological_interactions[1], and environmental_factors for 1% sucrose availability
  description: 'CommunityMech:000083 (kb/communities/SMutans_CAlbicans_ECC_Biofilm.yaml, proportional
    Completeness Score 80/100; scripts/audit_completeness.py score 25/100) models the cariogenic plaque
    biofilm co-infection of Streptococcus mutans UA159 (NCBITaxon:1309) and Candida albicans SC5314 (NCBITaxon:5476)
    in early childhood caries (PMID:24566629). In taxonomy, Streptococcus mutans omits functional_role:
    [PRIMARY_DEGRADER, CROSS_FEEDER] and abundance_level: DOMINANT, and Candida albicans omits functional_role:
    [SYNTROPHIC_PARTNER, CROSS_FEEDER] and abundance_level: ABUNDANT, despite verbatim support in the
    already-curated PMID:24566629 snippets (S. mutans GtfB synthesizes glucan exopolysaccharides from
    1% sucrose and binds fungal mannan and beta-1,3-glucan sites, while C. albicans augments EPS production
    and viable S. mutans carriage in cospecies biofilms inoculated at ~2 x 10^6 CFU/mL S. mutans and ~2
    x 10^4 CFU/mL C. albicans). In addition, ecological_interactions[1] (''Candida-Driven EPS Amplification
    of Streptococcus mutans'') omits metabolites exopolysaccharide (CHEBI:72813, which is already curated
    in related_ingredients[0] backed by the identical PMID:24566629 snippet), and environmental_factors
    is absent despite growth_media[0].evidence[0] (PMID:24566629) establishing 1% (30 mM) sucrose availability
    in UFYTE broth at 37 °C under 5% CO2.'
  target_ids:
  - CommunityMech:000083
  field_paths:
  - taxonomy[0].functional_role
  - taxonomy[0].abundance_level
  - taxonomy[1].functional_role
  - taxonomy[1].abundance_level
  - ecological_interactions[1].metabolites
  - environmental_factors
