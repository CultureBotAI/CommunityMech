  title: Defined Three-Strain Organic-Nitrogen Nitrifying Community (CommunityMech:000397) omits functional_role
    and ABUNDANT abundance_level across all three synthetic consortium members
  description: 'CommunityMech:000397 (kb/communities/Defined_ThreeStrain_Organic_Nitrogen_Nitrifying_Community.yaml,
    proportional Completeness Score 85/100; scripts/audit_completeness.py score 15/100) models the defined
    three-species nitrifying consortium of Bacillus badius NBRC 15713 (NCBITaxon:1455, Pseudobacillus
    badius), Nitrosomonas europaea NBRC 14298 (NCBITaxon:915), and Nitrobacter winogradskyi NBRC 14297
    (NCBITaxon:913) under selected organic nitrogen conditions (PMID:42668143, doi:10.1093/bbb/zbag131).
