  evidence_ids:
  - coupling
  - batch-products
  - cascade-products
  details: Retain the PAIRWISE CROSS_FEEDING direction from C. carboxidivorans to
    C. kluyveri. CO/CO2 feed and acetogen C2 production support the upstream substrate
    context; high-CO growth restriction does not erase continuing chain elongation.
    No molecule-resolved flux or hydrogen-transfer measurement is inferred.
- assessment_id: acid-node
  area: graph
  topic: 'ecological_interactions[1]: chain elongator to acetogen'
  outcome: supported
  summary: Partner-derived acids support longer-alcohol formation within the stated
    conditions.
  target_ids:
