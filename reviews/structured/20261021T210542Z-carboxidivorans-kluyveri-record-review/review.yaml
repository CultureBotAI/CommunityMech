evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Clostridium_Carboxidivorans_Kluyveri_CO_Chain_Elongation_Coculture.yaml
  locator: Whole maintained YAML
  summary: Two species, three nodes and two arrows describe C2 supply, organic-acid
    conversion and engineered reactor staging. Graph qualifications are sound; non-graph
    product and medium scope need repair.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265177Z'
- evidence_id: batch-products
  kind: primary_source
  reference: PMID:34669248; DOI:10.1111/1751-7915.13941
  locator: 'Results and discussion: Autotrophic co‐cultivation of C. carboxidivorans
    and C. kluyveri; Figures 3–6; Table 1'
  summary: At 144 h, 800 mbar inlet CO and pH 6, the matched coculture produces about
    three times the butanol and detectable hexanol versus the acetogen monoculture.
    At lower CO, products and growth differ. This is a condition-specific comparison;
    the paper also recognizes acetogen alcohol-forming capacity.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265245Z'
  snapshot_sha256: c80e657af6d15be058b1cd2aaa8335e07ae37669daa0163e8c316fc17ff18d17
- evidence_id: cascade-products
  kind: primary_source
  reference: PMID:37110426; DOI:10.3390/microorganisms11041003
  locator: 'Results and Discussion: 3.3. Co-Cultivation Studies in Two Bioreactors
    in Series with Varying pH and pCO, paragraphs 5–13; Figures 6–9; Table 1'
  summary: The matched cascade monoculture produces alcohols, including hexanol. The
    coculture changes acid supply and produces about 10% higher alcohol concentrations
    under the comparison conditions. Product balances support incoming-acid reduction
    plus inferred de novo synthesis; all downstream alcohol is not assigned to exchanged
    acids.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265336Z'
  snapshot_sha256: 69d6f30938a6843fd09bf15bafc68219a96552aa42b0b46ddc901b1785846a75
  quote: de novo synthesis
- evidence_id: sulfide
  kind: primary_source
  reference: PMID:37110426
  locator: 3.2. Continuous Sulfide Supply in Autotrophic Batch Processes with C. carboxidivorans;
    Figures 4–5; 3.3, paragraph 1
  summary: The controlled sulfide comparison is an acetogen monoculture batch experiment
    at 100 mbar inlet CO and pH 6. Feeding 0.05 mmol S per L per h starts at 24 h
    and improves growth/ethanol versus no added feed. That selected regime is then
    adopted in cascade reactor 1; the cascade does not separately isolate sulfide
    from the other operating choices.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265407Z'
  snapshot_sha256: 69d6f30938a6843fd09bf15bafc68219a96552aa42b0b46ddc901b1785846a75
- evidence_id: coupling
  kind: primary_source
  reference: PMID:37110426
  locator: 3.1. CO-Inhibition Studies with C. kluyveri in Stirred-Tank Reactors; 3.3.
    Co-Cultivation Studies in Two Bioreactors in Series with Varying pH and pCO; Figures
    2–3 and 6–9
  summary: Acetogen C2 products support chain elongation, and partner-derived acids
    support acetogen alcohol formation. C. kluyveri can continue chain elongation
    despite restricted growth. The source contrasts its results with prior batch behavior;
    no molecule-resolved interspecies hydrogen flux is established.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265470Z'
  snapshot_sha256: 69d6f30938a6843fd09bf15bafc68219a96552aa42b0b46ddc901b1785846a75
- evidence_id: batch-protocol
  kind: primary_source
  reference: PMID:34669248
  locator: 'Experimental procedure: Microorganisms and medium; Preculture; Stirred‐tank
    bioreactor and gas fermentation processes; Analytical methods'
  summary: DSM 15243 and DSM 555 are separately precultured at 37°C and 100 rpm, with
    5 g/L glucose for the acetogen or 10 g/L potassium acetate and 20 mL/L ethanol
    for C. kluyveri. Cells are harvested and resuspended in PBS. The 1-L working batch
    in a 2-L stirred reactor uses 37°C, pH 6, 1200 rpm and continuous gas supply.
    These are distinct stages; PBS pH and analytical temperatures are not culture
    setpoints.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265529Z'
  snapshot_sha256: c80e657af6d15be058b1cd2aaa8335e07ae37669daa0163e8c316fc17ff18d17
- evidence_id: cascade-protocol
  kind: primary_source
  reference: PMID:37110426
  locator: '2. Materials and Methods: 2.1. Microorganisms and Medium; 2.2. Preculture
    Preparations; 2.3. Stirred-Tank Bioreactor Set-Up for Gas-Fermentation Processes;
    Figure 1'
  summary: Cascade reactor 1 has 1 L working volume, pH 6, 100 mbar inlet CO, 0.042
    vvm and dilution 0.09 per h; reactor 2 has 1.5 L, pH 5, 800 mbar CO, 0.083 vvm
    and dilution 0.06 per h. Both operate at 37°C and 200 mbar inlet CO2 with N2 balance
    where applicable. Continuous operation follows a 24-h batch phase in reactor 1,
    with reactor 2 inoculated at that transition.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265596Z'
  snapshot_sha256: 69d6f30938a6843fd09bf15bafc68219a96552aa42b0b46ddc901b1785846a75
- evidence_id: inoculum
  kind: primary_source
  reference: PMID:34669248; PMID:37110426
  locator: Batch Autotrophic co-cultivation opening versus Stirred-tank bioreactor
    and gas fermentation processes; cascade 2.3, paragraphs 2 and 5
  summary: The batch Results state 0.5 g/L each, whereas Methods state 0.05 g/L each
    and 0.1 total. Cascade Methods also give 0.05 each but one parenthetical total
    of 1.0, versus 0.1 earlier. Preserve these source discrepancies explicitly; do
    not silently select or calculate a supposedly corrected source value.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265655Z'
  snapshot_sha256: 73843543e882aec2d5994bf83e30abac62581724f88c728740dcba6ed6de2000
- evidence_id: batch-si
  kind: primary_source
  reference: PMID:34669248 supplementary DOCX MBT2-15-1471-s001.docx
  locator: Tables S1–S3; Figures S1–S3
  summary: Table S2 gives stock dilution factors 33.3-fold minerals and 100-fold vitamins/trace
    elements, yeast extract 1 g/L and cysteine hydrochloride 0.4–0.5 g/L. MES is for
    heterotrophic flask preculture; polypropylene glycol is for reactor work. Tables
    S1/S3 concern probes and analytical FISH buffers. Calibration plots support the
    conversion between counts, OD and CDW, not an invariant culture composition.
  support: supports
  accessed_at: '2026-10-21T21:05:42.265781Z'
  snapshot_sha256: c86e87e29227384dd88fdd71e6057bd0a74096e5495807b504bb3f76da5dd9f7
- evidence_id: cascade-si
  kind: primary_source
  reference: PMID:37110426 supplementary PDF within microorganisms-11-01003-s001.zip
  locator: Table S1, pages 1–2; Figures S1–S2, pages 3–4
  summary: The medium table gives stock factors, 1 g/L yeast extract and 0.5 g/L cysteine
    hydrochloride, with MES/antifoam stage notes. HPLC/GC chromatograms document product
    analysis and reactor samples at 167 h. Eluents, extraction solvents, column temperatures
    and detector gas flows must not become cultivation conditions.
  support: supports
  accessed_at: '2026-10-21T21:05:42.266710Z'
  snapshot_sha256: 46eb395492633771df0a703010ec59e3417b7e8cd0f03c1bf0ad62d21098d1b4
- evidence_id: abundance
  kind: primary_source
  reference: PMID:37110426
  locator: 3.3, paragraphs 2–3, 9 and 13; Figures 6 and 8; Table 1
  summary: Calibrated steady-state CDW ratios of acetogen to C. kluyveri are 17:1
    in reactor 1 and 35.5:1 in reactor 2. Initial CDW equality, measured cell counts,
    biomass ratios and ordinal ABUNDANT express different things. Preserve the valid
    ordinal categories with source-specific context; neither endpoint ratio is a universal
    percentage.
  support: supports
  accessed_at: '2026-10-21T21:05:42.267196Z'
  snapshot_sha256: 69d6f30938a6843fd09bf15bafc68219a96552aa42b0b46ddc901b1785846a75
