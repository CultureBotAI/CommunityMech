limitations:
- Complete current-claim scientific review includes both mains, all 15 main figures
  and declared SI. Lead read all batch SI text/three labeled tables/three embedded
  image payloads and all four cascade SI pages. Root visual scope is its separately
  declared subset. No raw FISH event, chromatogram integration, kinetic fit, new statistical
  test or culture reproduction was performed.
- Both papers combine controlled monoculture experiments with coculture results. Sulfide
  comparison is monoculture batch; cascade conditions co-vary. Product balances support
  inferred de novo contributions but do not trace every carbon molecule or isolate
  every process variable.
- Source inoculum discrepancies remain unresolved and attributed. Batch SI supports
  the cysteine 0.4–0.5 g/L range. Stock factors, final medium, supplied substrates,
  exchange products and analytical reagents are distinct; author-described autotrophy
  does not imply a yeast-free sole-carbon medium.
- 'All 28 excerpt occurrences match their reference-specific fresh source/cache: 26
  abstract and 2 title. Repetition is counted by occurrence. Literal agreement alone
  does not validate attached interpretation. Both maintained cache headers still need
  metadata reconciliation; no cache was refreshed.'
- Species GTDB values are valid; release/build wording is not established by file
  mtime. Optional strain mappings have different support counts. Ordinal prominence
  is not endpoint biomass fraction; no abundance-percentage failure or forced role
  removal is asserted.
- Publication-indexed PHENOTYPE contexts are permitted and need not be removed. Exact
  public supplements are verified; no separate raw-data archive, missing deposition
  or media-database equivalence was inferred. No contact or paid source access occurred.
- Ignored-inclusive local provenance searches, current 1321 and timestamped 1322 reuse
  are explicit. Old XML paths remain historical metadata; fresh bytes independently
  match their hashes. Optional adapter discovery is reused from 403 with fresh runtime
  compatibility.
- All 27 inspected inputs remain unchanged. Eight focused native checks pass; same-batch
  corpus diagnostics retain their nonzero results. Completeness 95 and capped quality
  100 are rubric outputs, not blanket scientific certification.
