limitations:
- Accessible primary evidence is the complete publisher abstract and bibliographic
  metadata, not full Methods or supplementary experiments. Unsupported-in-inspected-source
  does not mean experimentally disproved.
- The source strain and original 78-genome GTDB mapping aggregate were not independently
  reconstructed. Focused checks verify canonical labels, internal coherence and domain.
- The local reference cache is explicitly selected/rewritten text. Primary abstract
  inspection supplements but does not repair that cache or certify every local EvidenceItem
  as exact.
- Corpus network recipes failed on warnings elsewhere; selected target has no native
  network finding. These required failures prevent a passing verdict.
- Reviewers did not author or edit the target during this session; earlier curation
  shares the codex identity, so person-level independence is unknown.
notes:
- No canonical record, source cache, history, generated product or scientific status
  was changed. Proposed curation remains separate work.
- No current issue-tracker status is inferred from historical links. No outbound communication
  or paid research was performed.
