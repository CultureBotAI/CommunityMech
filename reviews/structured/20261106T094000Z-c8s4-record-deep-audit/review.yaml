- evidence_id: ev-zymomonas-ecoli-pmid26885935
  kind: primary_source
  reference: PMID:26885935
  locator: kb/communities/Zymomonas_Ecoli_Exometabolomics_Obligate_Mutualism.yaml
  accessed_at: '2026-11-06T09:38:30Z'
  support: supports
  summary: PMID:26885935 (doi:10.1021/acssynbio.5b00236) establishes that Zymomonas
    mobilis (NCBITaxon:542) and Escherichia coli (NCBITaxon:562) auxotrophs were co-cultivated
    as a defined two-member obligate mutualism and confirmed by flow cytometry to
    reach high cell counts for each species.
  quote: Three sets of cocultures between the Z. mobilis auxotroph and each of the
    three E. coli auxotrophs were monitored by optical density for growth and analyzed
    by flow cytometry to confirm high cell counts for each species.
- evidence_id: ev-pphet-hybrid-pmid41559821
  kind: primary_source
  reference: PMID:41559821
  locator: kb/communities/PPHET_Hybrid_Photosynthetic_PHB_Microbiome.yaml
  accessed_at: '2026-11-06T09:39:00Z'
  support: supports
  summary: PMID:41559821 (PMC12819161, doi:10.1111/1751-7915.70302) establishes by
    16S rRNA amplicon sequencing that the PPHET hybrid microbiome is dominated by
    Cyanobacteria (~70%, Synechocystis sp. PCC 6803 PPT1) alongside an abundant (~30%)
    Proteobacteria and Bacteroidota non-cyanobacterial heterotrophic fraction.
  quote: At the phylum level, both were dominated by Cyanobacteria, Proteobacteria,
    and Bacteroidota, with Cyanobacteria representing ~70% of the total community
    (Figure  2a ).
- evidence_id: ev-thermoleptolyngbya-chelatococcus-pmid42468699
  kind: primary_source
  reference: PMID:42468699
  locator: kb/communities/Thermoleptolyngbya_Chelatococcus_Arsenic_Detoxification_Coculture.yaml
  accessed_at: '2026-11-06T09:39:20Z'
  support: supports
  summary: PMID:42468699 (doi:10.1016/j.biortech.2026.135440) establishes that Thermoleptolyngbya
    sichuanensis XZ-Cy5 (NCBITaxon:3031812) and Chelatococcus sp. XZ-Ab1 (NCBITaxon:3034027)
    form a defined two-member mutualistic arsenic-detoxifying co-culture.
  quote: A co-culture system demonstrated mutualistic interactions where "T. sichuanensis"
    XZ-Cy5 secreted organic carbon to facilitate heterotrophic growth of Chelatococcus
    sp. XZ-Ab1, while Chelatococcus sp. XZ-Ab1 promoted growth of "T. sichuanensis"
    XZ-Cy5 by oxidizing toxic As(Ⅲ) to the less toxic arsenate.
