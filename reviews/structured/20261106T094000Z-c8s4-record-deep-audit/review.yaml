  status: open
  certainty: confirmed
  title: Non-cyanobacterial WCRM heterotrophs (taxonomy[1]) in PPHET_Hybrid_Photosynthetic_PHB_Microbiome
    (CommunityMech:000359) omit abundance_level despite 16S community-composition
    support in PMID:41559821
  description: 'In kb/communities/PPHET_Hybrid_Photosynthetic_PHB_Microbiome.yaml
    (CommunityMech:000359), Synechocystis sp. PCC 6803 PPT1 (taxonomy[0], NCBITaxon:1148,
    functional_role: [PRIMARY_PRODUCER]) carries abundance_level: DOMINANT, whereas
    its co-cultivated heterotrophic partner fraction non-cyanobacterial WCRM heterotrophs
    (taxonomy[1], NCBITaxon:2, functional_role: [CROSS_FEEDER]) omits abundance_level.
    The cited open-access study (PMID:41559821, PMC12819161, doi:10.1111/1751-7915.70302)
    explicitly reports that ''At the phylum level, both were dominated by Cyanobacteria,
    Proteobacteria, and Bacteroidota, with Cyanobacteria representing ~70% of the
    total community (Figure  2a ).'' Setting abundance_level: ABUNDANT on taxonomy[1]
    (~30% non-cyanobacterial Proteobacteria/Bacteroidota heterotrophic fraction) while
    preserving discussions[0] (DISCUSSION-PPHET-OXYGEN-SCAVENGING) and discussions[1]
    (phb-production-assay-boundaries) raises the review-communities s_ab abundance_level
    rubric component from 2.5/5 to 5/5 (1/2 -> 2/2 taxa with abundance_level).'
  target_ids:
  - CommunityMech:000359
  field_paths:
