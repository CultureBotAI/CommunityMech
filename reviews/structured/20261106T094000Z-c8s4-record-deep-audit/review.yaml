  title: Chelatococcus sp. XZ-Ab1 (taxonomy[1]) in Thermoleptolyngbya_Chelatococcus_Arsenic_Detoxification_Coculture
    (CommunityMech:000454) omits abundance_level despite defined two-member co-culture
    support in PMID:42468699
  description: 'In kb/communities/Thermoleptolyngbya_Chelatococcus_Arsenic_Detoxification_Coculture.yaml
    (CommunityMech:000454), Thermoleptolyngbya sichuanensis XZ-Cy5 (taxonomy[0], NCBITaxon:3031812,
    functional_role: [PRIMARY_PRODUCER]) carries abundance_level: DOMINANT, whereas
    its paired arsenite-oxidizing mutualistic partner Chelatococcus sp. XZ-Ab1 (taxonomy[1],
    NCBITaxon:3034027, functional_role: [CROSS_FEEDER]) omits abundance_level. The
    cited study (PMID:42468699, doi:10.1016/j.biortech.2026.135440) explicitly establishes
    the two-strain mutualistic co-culture (''A co-culture system demonstrated mutualistic
    interactions where "T. sichuanensis" XZ-Cy5 secreted organic carbon to facilitate
    heterotrophic growth of Chelatococcus sp. XZ-Ab1, while Chelatococcus sp. XZ-Ab1
    promoted growth of "T. sichuanensis" XZ-Cy5 by oxidizing toxic As(Ⅲ) to the less
    toxic arsenate.''). Setting abundance_level: DOMINANT on taxonomy[1] while preserving
    discussions[0] (thermoleptolyngbya_chelatococcus_exact_culture_conditions) and
    discussions[1] (arsenic_causal_scope_batch120) raises the review-communities s_ab
    abundance_level rubric component from 2.5/5 to 5/5 (1/2 -> 2/2 taxa with abundance_level).'
