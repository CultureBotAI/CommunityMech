findings:
- finding_id: c5s4-000084-smutans-ssputigena-roles-abundance-and-sucrose
  issue_key: communitymech-c5s4-000084-smutans-ssputigena-roles-abundance-and-sucrose
  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: Streptococcus mutans-Selenomonas sputigena ECC Pathobiont Biofilm (CommunityMech:000084) omits source-backed functional_role and DOMINANT/ABUNDANT abundance_level on both co-species biofilm members and environmental_factors for 1% sucrose availability
  description: 'CommunityMech:000084 (kb/communities/SMutans_SSputigena_ECC_Pathobiont.yaml, proportional Completeness Score 80/100; scripts/audit_completeness.py score 15/100) models the two-species cariogenic dental biofilm of Streptococcus mutans UA159 (NCBITaxon:1309) and Selenomonas sputigena ATCC 35185 (NCBITaxon:69823) in early childhood caries (PMID:37216569, doi:10.1038/s41467-023-38354-2). In taxonomy, Streptococcus mutans omits functional_role: [PRIMARY_DEGRADER, CROSS_FEEDER] and abundance_level: DOMINANT, and Selenomonas sputigena omits functional_role: [SYNTROPHIC_PARTNER, CROSS_FEEDER] and abundance_level: ABUNDANT, despite verbatim support in the already-curated PMID:37216569 snippets (S. sputigena becomes trapped in S. mutans-derived exopolysaccharide glucans and builds a densely packed honeycomb-like multicellular superstructure encapsulating S. mutans at inoculation density 2 x 10^6 CFU/ml each in 1% sucrose UFTYE medium). In addition, environmental_factors is absent despite growth_media[0].evidence[0] (PMID:37216569) establishing 1% (w/v) sucrose supplementation in 50%-strength UFTYE broth at pH 7.0 under 5% CO2, 95% N2 at 37 °C.'
  target_ids:
  - CommunityMech:000084
  field_paths:
  - taxonomy[0].functional_role
  - taxonomy[0].abundance_level
  - taxonomy[1].functional_role
  - taxonomy[1].abundance_level
  - environmental_factors
