  issue_key: communitymech-c5s4-000085-smutans-vparvula-roles-abundance-and-sucrose
  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: Streptococcus mutans-Veillonella parvula ASC Cariogenic Biofilm (CommunityMech:000085) omits source-backed functional_role and DOMINANT/ABUNDANT abundance_level on both dual-species biofilm members and environmental_factors for 2% sucrose supplementation
  description: 'CommunityMech:000085 (kb/communities/SMutans_VParvula_ASC_Biofilm.yaml, proportional Completeness Score 80/100; scripts/audit_completeness.py score 15/100) models the dual-species cariogenic biofilm of Streptococcus mutans UA159 (NCBITaxon:1309) and Veillonella parvula (NCBITaxon:29466) mediated by lactic acid cross-feeding and autoinducer-2 quorum sensing (PMID:38945921, PMID:21896779). In taxonomy, Streptococcus mutans omits functional_role: [PRIMARY_DEGRADER, CROSS_FEEDER] and abundance_level: DOMINANT, and Veillonella parvula omits functional_role: [SYNTROPHIC_PARTNER, CROSS_FEEDER] and abundance_level: ABUNDANT, despite verbatim support in the already-curated PMID:38945921 and PMID:21896779 snippets (S. mutans ferments sucrose to lactic acid and EPS while V. parvula catabolizes S. mutans-derived lactic acid as its preferred carbon source and promotes dual-species biofilm formation in 1:1 co-inoculation at 10^5 CFU/mL). In addition, environmental_factors is absent despite growth_media[0].evidence[0] (PMID:38945921) establishing 2% sucrose supplementation in BHI medium under anaerobic incubation (80% N2, 10% H2, 10% CO2) at 37 °C.'
