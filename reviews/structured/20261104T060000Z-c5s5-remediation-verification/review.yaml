  description: 'CommunityMech:000385 (kb/communities/SO3_BS3_Lithium_Battery_Bioleaching_Consortium.yaml, proportional Completeness Score 90/100; scripts/audit_completeness.py score 20/100) models the mixed acidophilic bioleaching consortium of sulfur-oxidizing Alicyclobacillus spp. SO3 (NCBITaxon:29308) and iron-oxidizing Sulfobacillus spp. BS3 (NCBITaxon:28033) for metal recovery from spent LiNi1/3Co1/3Mn1/3O2 (NMC) lithium-ion battery cathodes (PMID:30339972, doi:10.1016/j.wasman.2018.10.013). In taxonomy, both Alicyclobacillus sp. (SO3 consortium) and Sulfobacillus sp. (BS3 consortium) omit functional_role: [PRIMARY_DEGRADER, CROSS_FEEDER] and abundance_level: DOMINANT despite verbatim support in the already-curated PMID:30339972 snippets showing biogenic H2SO4 production by SO3 and Fe3+ regeneration by BS3 in a 1:2 co-inoculation at 10% (v/v) total inoculum (~1 x 10^8 cells/mL). In addition, environmental_factors is absent despite growth_media[0].evidence[0] (PMID:30339972) establishing 1% (w/v) spent Li-ion battery cathode pulp density and a 3:2 elemental sulfur to pyrite mixed energy substrate ratio (5 g/L total).'
