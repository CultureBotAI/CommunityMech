limitations:
- Full scientific assessment means every current field was assessed; it does not mean
  every scientific uncertainty is resolved or that aggregate corpus QC passed.
- The Methods/Table S1 and earlier-panel correspondence remains open under issue1548;
  no similar-name alias, inferred membership, or stock-genome assignment is introduced.
- Native source matching establishes lexical correspondence with selected retained
  bytes. It does not independently validate experimental interpretation, lineage assignments
  or causal mechanisms.
- The actual full retained main article, Table S1 stock cells and Figures2/3/5 were
  read. Other supplementary cells and all raw numerical data were not comprehensively
  reanalyzed.
- Current catalogue availability, sequences, assembly quality, species identity, source
  statistics and experimental reproducibility were not independently recertified.
- Related-paper checks support the two populated stock-set relations only, not full
  scientific completion of the related records or equivalence of their protocols.
- Old reviews, failed matcher outputs, runtime revisions and application receipts
  remain immutable. The new review corrects its own current statements rather than
  rewriting historical evidence.
- The eight native M5 structural/history commands ran at 3b1 on the applied bcc working
  record. Their recorder captures commands/revision/status/logs and is not relabeled
  as a per-input hash wrapper. The original and final canonical observations and actual
  application chain remain distinct evidence.
- Normal-config reference execution and both actual current canonical measurements
  use published f480. The separate local full-corpus network command exited 1 for
  warnings and is not reported as a pass; Switchgrass has no listed network finding.
- Complete 1502-file runtime context is retained as an exact measured hash inventory
  and reverified before/after inspection; archived source inputs include the actual
  loaded article/catalog/asset/projection bytes and selected figures, not a claim
  to manual review of unrelated caches.
- This is a new full current assessment, not an edit to the prior native review. Generated
  products, aggregate QC, PR publication and merge approval remain separately controlled.
notes:
- Issue 2944 records the first actual builder refusal before inspection or draft output.
  Its copied network type subset omitted the native community-level UNKNOWN_TARGET
  warning override. The repaired builder uses the captured maintained issue_severity
  function on the unchanged raw audit; true errors still refuse, the corpus command
  remains failed with exit 1, and no target network finding is promoted to a global
  pass. Executed config 003 and the failed raw run remain unchanged.
- Issue 2938 records two inaccurate statements in the immutable prior assessment.
  Actual plant comparison omits Pseudomonas, not Burkholderia; current Allobosea 85413
  has no GTDB block, rather than a Bosea 34/34 assignment. The new primary, figure
  5, grounding and record assessments correct the interpretation without modifying
  canonical biology or historical evidence. There was no corresponding prior saved
  finding to close.
- Issues 2940 and 2941 record rejected unsaved authored 001 wording. Additive authored
  002 states the 2000/200/2-drop FSR tiers, highest tested alpha-diversity without
  Pseudomonas, and 24 C seed-germination scope. The exact rejected draft is captured
  as provenance; no authoritative saved review or canonical record used it, and no
  prior finding occurrence is invented.
- Issue 2942 records pre-execution config 001's missing ownership metadata and invalid
  terminal finding lineage. Additive config 002 retains only the genuine prior roster
  and routing findings, with maintained owners, and moves draft/prose corrections
  into these notes. The original config remains captured unchanged.
- Issue 2943 records the unexecuted builder's measurement-counter acceptance gap.
  The repaired guard requires actual per-assertion comparison and validity, exact
  calls/text/reference bindings, complete per-record processing, empty errors/drift
  and reconciled aggregate counts. Actual current 37/37 measurement bytes remain unchanged.
