assessments:
- assessment_id: lbnl-identity
  target_ids:
  - CommunityMech:000087
  area: identity
  topic: Methods-defined final collection and source-panel disagreement
  outcome: concern
  summary: The deposited final Methods roster contains sixteen individually named
    stocks. An engineered, synthetic soil/rhizosphere model is supported by the isolation
    and bottom-up assembly description. Earlier eighteen- and seventeen-member panels
    have different or incompletely reconciled membership. Table S1 has eighteen stock
    rows, names Methylobacterium OAE516 and Bacillus OAE603, and lacks Marmoricola,
    whereas final Methods names OAE515 and Marmoricola OAE513. The canonical record
    states that conflict; similar names do not establish aliases or stock equivalence.
  evidence_ids:
  - record
  - primary
  - table-s1
  - prior-review
  details: 'Assessed fields: id, name, description, ecological_state, community_origin,
    community_category, engineering_design, taxonomy'
- assessment_id: lbnl-environment
  target_ids:
  - CommunityMech:000087
  area: grounding
  topic: Physical assay setting versus source and modeled environment
  outcome: supported
  summary: ENVO:01001405 laboratory environment describes liquid cultures and fabricated
    plant assays. ENVO:00001998 soil describes isolation origin and the modeled ecological
    context, not soil as the substrate for every experiment. The source isolates came
    from soil/rhizosphere surrounding one switchgrass plant; this does not establish
    independent field replication. The represented-collection factor correctly identifies
    the final sixteen deposited stocks rather than a pooled assay.
  evidence_ids:
  - record
  - primary
  - grounding
  details: 'Assessed fields: environment_term, modeled_environment, environmental_factors'
- assessment_id: lbnl-media
  target_ids:
  - CommunityMech:000087
  area: scope
  topic: Separate isolate, community, plant and preservation protocols
  outcome: supported
  summary: Isolate precultures used 3–5 mL 1x R2A in 14 mL tubes, aerobic at 30°C
    without shaking for 5–7 days. Individual growth curves instead used starting OD600
    0.05 and 200 microliters of 0.1x R2A. Community cultures used 200 microliters
    in plates at 30°C without shaking, with assay-specific dilution and harvest. Seed
    germination at 24°C on 0.1x MS plates is not a member cultivation condition; the
    cited Methods does not separately specify the post-transfer EcoFAB temperature.
    Preservation used separate 20% glycerol/DMSO or lyophilized treatments, three
    days at -80°C and assay-specific regrowth; the record makes no long-term stability
    or universal 72-hour claim.
  evidence_ids:
  - record
  - primary
  details: 'Assessed fields: growth_media, engineering_design.perturbation_design'
- assessment_id: lbnl-nutrient
  target_ids:
  - CommunityMech:000087
  area: scope
  topic: Earlier eighteen-member nutrient experiment
  outcome: supported
  summary: The earlier eighteen-member experiment compared 1x, 0.2x and 0.1x R2A after
    three days. Lower nutrient concentration reduced bulk growth while increasing
    reported diversity/evenness. Relative taxonomic profiles are not absolute viable
    abundances, and this observation is not assigned to all final sixteen stocks.
    The source's figure/table labels do not resolve the remaining stock correspondence.
  evidence_ids:
  - record
  - primary
  - figure2
  details: 'Assessed fields: discussions[1]'
- assessment_id: lbnl-ratios
  target_ids:
  - CommunityMech:000087
  area: scope
  topic: Starting ratios and time-dependent community profiles
  outcome: supported
  summary: 'The source tests twenty-two starting combinations in the with/without-Pseudomonas
    panels and reports two- and six-day profiles. The source''s 3x cutoff is an FSR-based
    three-tier allocation: FSR below 0.05, between 0.05 and 1, and above 1 receive
    2000, 200 and 2 drops, respectively. It is not a threefold starting-density factor.
    The source reports the highest alpha-diversity among tested starting compositions
    for that allocation without Pseudomonas, not a universal biological optimum. Current
    prose preserves panel identity and temporal dependence instead of asserting one
    initial ratio, stable final abundance or a final-sixteen interaction mechanism.'
  evidence_ids:
  - record
  - primary
  - figure3
