  details: Retain NCBITaxon:80866 and NCBITaxon:571. YP-3/DX-3 are strain names, not
    exact strain taxon or genome nodes. ENGINEERED, SYNTHETIC, BIOTECHNOLOGY and anaerobic
    laboratory context fit. Both DOMINANT values can express co-equal prominence within
    the pair; do not transfer them to the entire sludge community.
