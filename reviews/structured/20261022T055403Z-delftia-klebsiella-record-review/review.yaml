- assessment_id: mechanism-scope
  area: evidence
  topic: Transfer routes and functional roles
  outcome: concern
  summary: Qualify the mechanism while preserving positive experimental evidence.
  target_ids:
  - CommunityMech:000481
  evidence_ids:
  - abstract
  - mechanism
  - batch
  - schema
  details: 'S10 is a membrane-separation perturbation, not merely a correlation: mixed
    cultures retain a greater H2 advantage. S6 shows spatial association; S7 shows
    electroactivity and extracellular riboflavin. These support contact-associated
    and soluble-route hypotheses but do not establish every carrier, electron flux
    or the product-removal criterion for SYNTROPHY. Supplied glucose/acetate alone
    do not meet SECONDARY_FERMENTER. ELECTRON_ACCEPTOR and the broad partner role
    may remain with explicit source-inferred scope; do not impose obligacy.'
