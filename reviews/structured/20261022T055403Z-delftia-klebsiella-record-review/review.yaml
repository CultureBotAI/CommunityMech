  - reactor
  details: Text S1 isolation differs from production. Text S3 distinguishes CV, EIS,
    H-cell, ETSA and microscopy. The photo-MFC has 25 mL liquid/5 mL headspace per
    chamber, 1 mL each inoculum at OD600 0.3, 30°C and 8000 Lux; EIS uses a 100 mL
    bottle. Figure S1 gives a 0.5 L working-volume stirred illuminated sludge reactor.
    Do not assign these to the unspecified production batch. Tables S1/S2 stock quantities
    and the following unlabeled formulation remain unresolved.
  dimensions:
  - name: medium
    value: XA and RCVBN formulations in SI Tables S1 and S2
    definition: Separate enrichment and assay recipes; unresolved stock footnotes
      and the unlabeled following formulation prevent a universal production-medium
      assignment.
