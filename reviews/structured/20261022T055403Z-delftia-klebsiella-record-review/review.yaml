    - cultivation
  - name: environment
    value: Illuminated laboratory co-culture and synthetic swine-wastewater sludge
      reactor
    definition: The photo-MFC uses 30°C and 8000 Lux; the drawn reactor has 0.5 L
      working volume, illumination and stirring. These stage-specific conditions must
      not be transferred to the unavailable production protocol; foil alone does not
      establish anoxia.
    evidence_ids:
    - cultivation
    - reactor
