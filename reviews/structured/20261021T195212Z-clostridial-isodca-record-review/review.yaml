limitations:
- The focal source remains bioRxiv version 1, not peer reviewed. Whole main/SI assessment
  completes current-claim review, not experimental reproduction or certification of
  every author interpretation.
- Initial 429 and XML404 responses are preserved. The successful fresh 39-page PDF
  has the correct title/DOI/version but a different hash from the unavailable historical
  file; byte identity is not asserted. Abstract-only PMC/OpenAlex flags did not supply
  the full text.
- 'All 22 encoded occurrences are supported: 18 strict PDF, one additional strict
  abstract and three explicit typography projections. The 2,413-byte selected cache
  is not a whole-paper archive and remains unchanged.'
- The in vitro transfer is cell-free P. hiranonis spent medium followed by R. gnavus,
  while the gavage stock combines live cultures. Neither establishes direct contact,
  reciprocal fitness or a fixed endpoint population ratio.
- Stock CFU calibration was measured. The source does not specify the secondary culture
  final volume, full commercial YCFAC recipe or actual culture vessel in the cited
  passage; no final bile-acid molarity or catalogue protocol is inferred.
- Host results retain model, tissue, time and panel scope. Colonic pTreg proportions
  and counts differ in significance; FXR evidence is weaker than TGR5. Several Figure
  4 standard-transfer comparisons are nonsignificant, and SI reports no late standard-transfer
  pTreg difference. No blanket significance or fully mediated persistent-pTreg mechanism
  is added.
- P. hiranonis exact strain remains unknown in the inspected complete main/SI. Primer
  citations do not identify it. WT catalogue aliases do not identify the engineered
  KO as a catalogue product.
- GTDB counts describe exact reference-ID mapping support, not study cells or sequenced
  consortium members. Species and optional strain denominators remain separate; file
  mtime is not a release identifier.
- PRJNA1503769 metadata was verified without raw-read analysis; 59 archive samples
  are not certified as 59 animals. The listed supplements were read, but a separate
  accompanying Source Data payload was not located in that bounded listing or analyzed.
  No global data-absence claim or author contact.
- Eight focused checks pass; same-batch corpus diagnostics retain nonzero outcomes.
  Optional adapter discovery is explicitly reused from 403 with fresh runtime compatibility.
  No later record, external code or paid provider was used.
notes:
- All 27 inspected inputs remain unchanged. Initial validator and preliminary support
  receipts are immutable; final summaries are separate.
- Current linked 974/975 are closed and PR 973 is merged; no new issue or comment
  was created. The in-record P. hiranonis strain question remains open.
- Zero major and four minor findings; completeness 70, quality 100/raw127. Parent
  and sibling whole-candidate audits precede any save.
