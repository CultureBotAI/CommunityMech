evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Clostridial_isoDCA_Mini_Consortium.yaml
  locator: Entire maintained YAML
  summary: Two microbial members, one pairwise interaction without downstream arrows,
    two media, a matched KO perturbation, five endpoint categories and one unresolved
    P. hiranonis strain discussion were read. The preprint is correctly an external
    bibliographic resource.
  support: supports
  accessed_at: '2026-10-21T19:52:12.883260Z'
- evidence_id: identity
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Abstract p1; Introduction p3; Results: Engineering isogenic consortia
    to interrogate the immunomodulatory effects of isoDCA, pp4–5'
  summary: The record denotes P. hiranonis plus R. gnavus VPI C7-9 WT, the isoDCA-positive
    pair. The rumgna_00694-disrupted R. gnavus derivative replaces WT in the negative-control
    pair. It is not a third member. ENGINEERED and SYNTHETIC describe the deliberate
    assembly; mice and their background microbiota are context rather than members
    of this defined pair.
  support: supports
  accessed_at: '2026-10-21T19:52:12.883336Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: genetic-control
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Methods: Clostridial engineering, pp16–17; Bacterial complementation,
    pp20–21; Figure 1B–D'
  summary: A group II intron disrupts rumgna_00694, encoding the terminal 3β-HSDH
    activity, in the VPI C7-9 parent originally acquired as ATCC 29149. PCR and TLC
    distinguish WT and functional KO. The source uses reference WGS AAYG00000000.2.
    The mutation is not inferred from a catalogue product, and its source locus spelling
    should remain intact.
  support: supports
  accessed_at: '2026-10-21T19:52:12.889814Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: conversion
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Results: Engineering isogenic consortia to interrogate the immunomodulatory
    effects of isoDCA, p5; Methods: Bacterial culture, pp19–20; Figure 1E–F, caption
    p28 and image p36'
  summary: P. hiranonis converts TCA to CA and DCA; R. gnavus WT converts partner-derived
    products to isoDCA, unlike KO. The experimental test uses centrifuged, sterile-filtered
    P. hiranonis spent medium followed by R. gnavus incubation. This supports the
    directed conversion node without demonstrating direct contact or simultaneous
    live coculture.
  support: supports
  accessed_at: '2026-10-21T19:52:12.895321Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
  quote: 0.22 μm sterile filtered
- evidence_id: provider-roles
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Introduction p3; Results: Engineering isogenic consortia to interrogate
    the immunomodulatory effects of isoDCA, p5; Discussion p13; Figure 1E'
  summary: Host-derived TCA is the input for P. hiranonis; its products supply R.
    gnavus. These source passages support both broad CROSS_FEEDER roles when their
    different providers are stated locally. The Discussion also calls P. hiranonis
    a primary degrader of TCA, but adding that optional role is not required. Membership-only
    taxonomy excerpts do not explain either utilization relation.
  support: supports
  accessed_at: '2026-10-21T19:52:12.900721Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: culture
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Methods: Bacterial culture, p19'
  summary: The source reports 37°C incubation inside a flexible vinyl anaerobic chamber
    with H2 2.5–3.0%, O2 below 50 ppm and an H2S scrubber. These are chamber conditions.
    BHI-S contains 37 g/L BHI powder, 5 g/L yeast extract and 1% v/v of a 10% w/v
    L-cysteine stock. Plates add 15 g/L agar; liquid media and plates reduce overnight.
    The chamber is not the culture vessel and does not identify a sealed-vessel headspace.
  support: supports
  accessed_at: '2026-10-21T19:52:12.906294Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: stock
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Methods: Bacterial culture, p19'
  summary: Individual colonies grow on BHI-S agar for 48–96 hours, then in 7 mL primary
    broth overnight or until turbid; secondary cultures grow 12–16 hours to OD600
    about 0.800. Dilution plating calibrated that OD to approximately 2×10^8 CFU/mL
    for each strain. Equal 10 mL member cultures are mixed, pelleted at 2500×g for
    10 minutes, resuspended in 1 mL BHI-S with 15% v/v glycerol and stored at −80°C.
    These are preparation quantities, not measured endpoint fractions.
  support: supports
  accessed_at: '2026-10-21T19:52:12.911907Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: assay
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Methods: Bacterial culture, pp19–20; Liquid-liquid extraction and thin
    layer chromatography of bile acids, p20'
  summary: Commercial YCFAC avoids BHI-S sterols. Approximately 7 mL refers to primary
    culture, not a documented final secondary fill volume. Secondary cultures receive
    8 μL of 100 mM bile acid and 50 μL primary inoculum before overnight growth at
    37°C. In the sequential test, P. hiranonis culture is centrifuged and filtered
    before a second 50 μL R. gnavus WT/KO inoculation and overnight incubation. Do
    not infer final substrate molarity, actual vessel type, or treat extraction/TLC
    reagents as microbial medium ingredients.
  support: supports
  accessed_at: '2026-10-21T19:52:12.917539Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: host-protocol
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Methods: Colonization of mice with Clostridial consortia, p21; CD45RBhi
    transfer model of murine colitis, pp24–25; Figures 2A, 3A and 4A'
  summary: Antibiotic depletion precedes daily 200 μL mixed-stock gavage for seven
    days, with cage changes during the first three days. Figure 2/3 day zero is weaning;
    Figure 4 uses a later T-cell-transfer timeline. Culture incubation, stock storage,
    colonization and host sampling must remain separate stages. The mice were not
    a two-species-only microbiome.
  support: supports
  accessed_at: '2026-10-21T19:52:12.923458Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: abundance
  kind: primary_source
  reference: doi:10.64898/2026.08.11.743107; PMID:42845388; bioRxiv version 1
  locator: 'Methods: PCR and qPCR of bacteria, pp17–18; Bacterial culture, p19; Figures
    2B–D, 3B/D and 4C–E'
  summary: Species qPCR is normalized to fecal mass with the stated scaling; total
    bacterial load uses a standard curve. Input CFU calibration was measured by dilution
    plating. Neither procedure makes the literal string Defined isoDCA-positive consortium
    member a quantitative abundance, nor establishes a fixed 50:50 endpoint ratio
    in mice.
  support: supports
  accessed_at: '2026-10-21T19:52:12.929252Z'
  snapshot_sha256: 3a7dc17b0163da654e408569cb30eea9d688d4357ddd1f59dcda2738da099f27
- evidence_id: host-outcomes
