limitations:
- Partial scoped technical and provenance assessment with scientific_review:false;
  no complete scientific record approval, corpus completion or issue closure is asserted.
- Native species-ID populations describe reference genomes keyed to the unchanged
  NCBI descriptors. They do not demonstrate experimental-stock membership, exact assembly
  identity, formal nomenclatural change or pathway genotype. Rounded majority fractions
  are retained without inventing integer numerators.
- The L. delbrueckii subsp. lactis NCBI rank and named cheese isolates remain intact
  although the GTDB correspondence is at species level. The existing S. thermophilus
  blocks are preserved.
- Preprint excerpts for 000396 and abstract coverage for 000397, 000426 and 000362
  are explicit source limits. This task does not fill their cultivation, experimental
  or mechanistic gaps.
- Record 000426 retains the unrelated G1B native null result/UNRESOLVED status. Record
  000313 retains the cultured-isolate versus network-ASV distinction and the Chlorella
  no-equivalent state. No missing mapping is turned into a species choice.
- The local NCBI read-only adapter supplies inspected label/rank/synonym rows. Its
  file-stat observations are not a database content hash or release certification.
  The exact crosswalk, native resolver, source caches and authored context are separately
  hash-bound.
- All original scientific assertions, historical source interpretations and remediation
  ledgers remain immutable. Historical successor admission, generated products, reference
  matching and final combined QC require separate integration outcomes.
