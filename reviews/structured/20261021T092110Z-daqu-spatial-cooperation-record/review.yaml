  - Inspect exact Methods, figures and supplements for the temporal transcriptomic
    population, fluorescent SynCom design and engineered application with indigenous
    background; do not presume identical or different populations.
  - Verify species/strains, labels, expression host, IPTG dose, controls, inoculum
    ratio, matrix, humidity, temperature and duration before numerical expansion.
  - Distinguish measured spatial/metabolic behavior, individual-based simulations
    and inferred flavor mediation; retain only source-supported causal directions.
