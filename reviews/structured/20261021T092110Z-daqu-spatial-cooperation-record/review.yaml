limitations:
- Main text and supplements were not retrieved. DOI HTTP 200 contains a redirect shell;
  public Elsevier XML HTTP 200 contains core metadata only. Root observed ScienceDirect
  403; bounded institutional searches supplied no usable main source, without proving
  global absence.
- Exact species/strains, fluorescent derivatives, amylase expression host, constructs,
  induction conditions, controls and cultivation parameters remain unreviewed. No
  default Bacillus subtilis or Saccharomyces cerevisiae identity is assumed.
- Temporal Daqu transcriptomics, fluorescent SynCom experiments, engineered application
  and resident-community restructuring may concern distinct experimental contexts;
  their precise relationships require Methods. This uncertainty is not a declared
  community misidentification.
- Abstract-reported cooperation and temporal succession do not resolve a transferred
  metabolite, direct substrate provenance or selective flavor mediation. No absence
  of uninspected experiments is inferred.
- Individual-based simulations are source-reported and must remain separate from experimental
  measurements; no model or raw transcriptomic data were reanalyzed.
- No dataset or reproducible-medium omission finding is inferred from inaccessible
  source details. Historical Bacillus GTDB mapping statistics were not recomputed;
  adapter discovery and full-corpus network receipts are transparently reused.
notes:
- Canonical records, caches, history and generated outputs remain unchanged.
- Direct excerpts total 18 words for this publication.
- All 25 repository inputs were pinned before assessment and rechecked; quality 100
  is capped from 126.3333333 and is not scientific certification.
