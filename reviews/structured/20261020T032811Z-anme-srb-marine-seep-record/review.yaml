    sulfur amendment to reduced methane oxidation; molecular toxic mechanism is unknown.
    Source: PMID:30559729 Results paragraph 37/Fig 5B; zero-sulfur evidence quote
    identifies the actual chemical forms. Three total downstream arrows occur in the
    full record; all target names resolve.'
