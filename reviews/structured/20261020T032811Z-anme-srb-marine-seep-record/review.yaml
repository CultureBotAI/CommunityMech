limitations:
- All four cited main articles were inspected through public full-text XML. Linked
  supplementary files were not exhaustively downloaded; the polysulfide text/caption
  boundary discrepancy remains explicit.
- Genomic mechanisms and modeling were assessed as source interpretations; no genome
  reconstruction, simulation or laboratory assay was reproduced. Original GTDB mapping
  counts were not independently recalculated.
- The related 000276 record was inspected for identity and introductory assay scope
  only, not reviewed again as part of this target. Its presence is not sufficient
  evidence for consolidation or a molecular conduit assignment.
- The optional structured-source adapter runner was unavailable; the public catalog
  fallback had no matching ANME/SRB dataset. Required corpus network gates fail on
  unrelated warnings while focused target checks pass.
- The reviewers did not create or modify the target in this session. Historical curation
  also used the codex identity, so person-level independence is unknown. The parent
  reviewer checked the draft and primary passages before saving in path order.
notes:
- No canonical record, reference cache, history or generated product was edited. Findings
  propose separately authorized curation only.
- All 21 stored snippets match current source passages after whitespace normalization.
  The four PMIDs identify four publications.
- Source snapshot URLs, timestamps and SHA256 hashes are retained in evidence; repository
  input hashes are retained in source.inputs.
