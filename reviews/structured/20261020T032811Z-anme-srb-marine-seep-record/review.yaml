  title: Desulfobacterales is too narrow for the represented partner guild
  description: The taxonomic descriptor and both pairwise nodes represent generic
    marine sulfate-reducing partners with Desulfobacterales. The cited 2023 paper
    includes four common clades in multiple orders, and NCBI independently places
    HotSeep-1 genus Desulfofervidus outside Desulfobacterales. This is not merely
    coarse conservative grounding; it excludes covered partners.
