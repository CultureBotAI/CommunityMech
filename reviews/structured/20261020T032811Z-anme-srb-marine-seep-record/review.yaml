summary: Natural ANME-SRB syntrophy and three qualified causal arrows are supported,
  but the record overnarrows the SRB guild, assigns a complex-substrate role to methane
  oxidation, overinterprets sulfur partner responses and tags chemical inhibition
  as an evolved interspecies process. Four major and three minor findings remain.
  All focused gates pass; corpus network warnings retain failed required checks.
