evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/ANME_SRB_Marine_Methane_Seep_Consortium.yaml
  locator: 'Entire 410-line maintained record: two taxonomic guild descriptors, four
    interaction nodes, three downstream arrows, four environmental factors, two related
    ingredients, one dataset, one medium and discussion/history'
  accessed_at: '2026-10-19T23:38:40.678792Z'
  support: supports
  summary: The target denotes the natural marine ANME-SRB consortium type, combining
    genomic/mechanistic synthesis with two sulfur-perturbation experiments. It is
    not a single cultured strain pair.
- evidence_id: sr-biology
  kind: primary_source
  reference: PMID:37747940
  locator: PMC10553843; DOI:10.1371/journal.pbio.3002292; abstract and Introduction;
    retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10553843/fullTextXML
  accessed_at: '2026-10-19T23:39:03.586130Z'
  support: supports
  summary: Murali et al. 2023, PLOS Biology, analyzes four common syntrophic SRB clades
    and their archaeal partners. The paper supports the natural multicellular partnership
    and heterogeneous partner associations.
  snapshot_sha256: 69704c54f4ea1afbbbda28969074a9482ca887e19cedda13ddf0c4bb1f65837f
  quote: obligate syntrophic partnership
- evidence_id: sr-diet
  kind: primary_source
  reference: PMID:37747940
  locator: Abstract, DIET complexes; Results conserved outer-membrane electron uptake;
    retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10553843/fullTextXML
  accessed_at: '2026-10-19T23:39:03.586130Z'
  support: supports
  summary: Comparative metagenomics supports conserved candidate electron-transfer
    machinery from ANME to the SRB outer membrane. Molecular conservation is not direct
    identification of every conductive structure in the mixed consortium type.
  snapshot_sha256: 69704c54f4ea1afbbbda28969074a9482ca887e19cedda13ddf0c4bb1f65837f
  quote: direct interspecies electron transfer (DIET)
- evidence_id: sr-taxonomy
  kind: primary_source
  reference: PMID:37747940
  locator: Main-text Fig1 caption and Results phylogenetic placement; extracted body
    paragraphs7-8; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10553843/fullTextXML
  accessed_at: '2026-10-19T23:39:03.586130Z'
  support: supports
  summary: The study places Seep-SRB1a within Desulfobacterales, Seep-SRB2 within
    Dissulfuribacterales, HotSeep-1 within Desulfofervidales, and Seep-SRB1g in a
    sister order to Desulfobacterales. Thus the record order is not a conservative
    ancestor of all its source-covered SRB.
  snapshot_sha256: 69704c54f4ea1afbbbda28969074a9482ca887e19cedda13ddf0c4bb1f65837f
  quote: Seep-SRB2 is a genus within the order Dissulfuribacterales
- evidence_id: sr-cultivation
  kind: primary_source
  reference: PMID:37747940
  locator: Methods, Sample collection and microcosm incubations; body paragraphs42-43;
    retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10553843/fullTextXML
  accessed_at: '2026-10-19T23:39:03.586130Z'
  support: supports
  summary: Source explicitly separates sediment methane/HPG incubations at 4°C, a
    no-donor 24°C push-core incubation, a pyruvate 24°C rock incubation, and methane
    50°C rock incubations. It also distinguishes N2 storage at 4°C from incubation.
    The record preparation notes largely preserve these variants.
  snapshot_sha256: 69704c54f4ea1afbbbda28969074a9482ca887e19cedda13ddf0c4bb1f65837f
  quote: supplemented with pyruvate at 24°C
- evidence_id: anme-genomics
  kind: primary_source
  reference: PMID:34986141
  locator: PMC9012536; DOI:10.1371/journal.pbio.3001508; abstract, Introduction and
    ANME metabolism; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9012536/fullTextXML
  accessed_at: '2026-10-19T23:39:00.909318Z'
  support: supports
  summary: Chadwick et al. 2022 describes environmental ANME diversity and genomic
    electron-transfer potential. Marine ANME are multiple clades, and absence of pure
    cultures is a source-era statement; broad domain grounding is expressly a coarse
    guild representation.
  snapshot_sha256: 94cb7ae781637f75318ea592f5a35ad7fd9ace351a2e7e40cba675dc2ff40c23
  quote: syntrophic partnership between anaerobic methanotrophic (ANME) archaea and
    sulfate-reducing bacteria (SRB)
- evidence_id: anme-data
  kind: primary_source
  reference: PMID:34986141
  locator: Abstract, Table1 accession column and Data Availability; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9012536/fullTextXML
  accessed_at: '2026-10-19T23:39:00.909318Z'
  support: supports
  summary: The paper reports 28 newly reconstructed genomes and a larger comparative
    collection. Actual genome accession values are supplied in Table 1, with alignments/annotation
    data in supplements. The record stores the publication PMID as its dataset accession
    rather than one of those data identifiers.
  snapshot_sha256: 94cb7ae781637f75318ea592f5a35ad7fd9ace351a2e7e40cba675dc2ff40c23
  quote: reconstruct 28 ANME genomes
- evidence_id: diet-model
  kind: primary_source
  reference: PMID:33975943
  locator: PMC8263020; DOI:10.1128/mBio.03620-20; Introduction paragraph2, model Results
    and limitations; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8263020/fullTextXML
  accessed_at: '2026-10-19T23:39:00.622050Z'
  support: supports
  summary: The 2021 article models electron transport and consortium size. Pili, cytochromes
    and S-layer-associated multiheme proteins motivate a possible DIET conduit, but
    the specific structures and parameters were incompletely characterized. This is
    a modeling hypothesis, not a causal perturbation proving each component.
  snapshot_sha256: f2fbfa873fd69fbfb2d7acf94dceef8c80ec321d4a36842b3748c2f1c2571118
  quote: this hypothesis awaits direct experimental confirmation
- evidence_id: sulfite
  kind: primary_source
  reference: PMID:30559729
  locator: PMC6286981; DOI:10.3389/fmicb.2018.02917; Methods microcosm assay and Results
    paragraph35/Fig5A; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6286981/fullTextXML
  accessed_at: '2026-10-19T23:39:01.500323Z'
  support: supports
  summary: Sediment 7142, dominated by ANME-2a/2c, showed reduced labeled methane
    oxidation after 1.0 mM sulfite addition. Readout was labeled dissolved inorganic
    carbon, so the observed consortium-rate decline should remain distinct from a
    proven cell-intrinsic toxic mechanism.
  snapshot_sha256: fde1e90f9e1a419140e2fb773b9ef8c8a8a9bf8340a73040c8c038df129d2595
  quote: immediate decrease in the rate of AOM
- evidence_id: zero-sulfur
  kind: primary_source
  reference: PMID:30559729
  locator: Results paragraph37 and Fig5B/caption; short-term sediment 7142 assay;
    retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6286981/fullTextXML
  accessed_at: '2026-10-19T23:39:01.500323Z'
  support: supports
  summary: Polythionate and polysulfide treatments inhibited methane oxidation. Main
    text associates 1.0 mM with polythionate and 0.25 mM with polysulfide, while the
    figure caption says greater than 0.25 mM polysulfide. This source difference and
    compound-specific doses should not become one continuous interchangeable range.
  snapshot_sha256: fde1e90f9e1a419140e2fb773b9ef8c8a8a9bf8340a73040c8c038df129d2595
  quote: polythionate and polysulfide
- evidence_id: srb-response
  kind: primary_source
  reference: PMID:30559729
  locator: Abstract and Results final sulfur-amendment paragraph; separate partner-enrichment
    observations; retrieved https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6286981/fullTextXML
  accessed_at: '2026-10-19T23:39:01.500323Z'
  support: refutes
  summary: The paper reports failure to obtain partner SRB growth/enrichment under
    sulfur amendments. That is not a demonstrated unchanged SRB response, and does
    not support environmental_factors wording that the partner was comparatively unaffected.
  snapshot_sha256: fde1e90f9e1a419140e2fb773b9ef8c8a8a9bf8340a73040c8c038df129d2595
  quote: growth in their syntrophic SRB partner was not observed
