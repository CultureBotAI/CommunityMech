- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Sulfate-Coupled Anaerobic Methane Oxidation'
  outcome: concern
  summary: Syntrophic methane oxidation coupled to bacterial sulfate reduction is
    source-supported, with methane, sulfate and carbon dioxide appropriate to the
    carbon/electron context. The source-to-target direction is archaeal oxidation
    toward bacterial electron acceptance. The represented SRB taxon inherits the over-narrow
    order grounding.
  target_ids:
  - CommunityMech:000134
  evidence_ids:
  - record
  - sr-biology
  - anme-genomics
  - sr-taxonomy
  details: 'Exact paths: ecological_interactions[0].source_taxon, target_taxon, interaction_type,
    metabolites[0:3], evidence[0:2]. Participants are ANME and associated SRB, not
    arbitrary members of Archaea/Desulfobacterales. Sign: positive syntrophic coupling.
    Context: natural consortium synthesis from comparative-genomic papers. Exact source
    quotes and locators are in sr-biology and anme-genomics. No outgoing arrow from
    this node.'
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Direct Interspecies Electron Transfer'
  outcome: concern
  summary: The node preserves computational support for candidate conserved electron-transfer
    components and marks the specific pili/multiheme conduit as hypothesized. Source
    direction ANME to SRB is correct. The molecular mechanism remains more specific
    than a generic observation of conductivity, and its SRB order inherits the taxonomy
    finding.
  target_ids:
  - CommunityMech:000134
  evidence_ids:
  - record
  - sr-diet
  - diet-model
  - sr-taxonomy
  details: 'Paths: ecological_interactions[1].source_taxon, target_taxon, biological_processes[0],
    evidence[0:2]. GO:0044419 fits a putative evolved interspecies process at this
    node. Participants: environmental ANME/SRB with different source clade associations.
    Proposed mechanism: conductive extracellular structures and multiheme cytochromes.
    Source 2021 explicitly lacked experimental confirmation; no claim that every pili-like
    structure is conductive is justified.'
- assessment_id: edge-1-0
  area: graph
  topic: ecological_interactions[1].downstream[0] to sulfate-coupled AOM
  outcome: supported
  summary: The HYPOTHESIZED arrow links transfer of methane-derived electrons from
    the archaeal partner to bacterial sulfate reduction. Positive enabling direction
    and computational evidence tier are preserved; it does not claim a component-specific
    intervention or measured mediation fraction.
  target_ids:
  - CommunityMech:000134
  evidence_ids:
  - record
  - sr-diet
  - diet-model
  - history
  details: 'Source node: Direct Interspecies Electron Transfer; target: Sulfate-Coupled
    Anaerobic Methane Oxidation. Participants: ANME to SRB, with target-taxonomy scope
    requiring curation. Mechanism: electron transfer enabling coupled metabolism.
    Context: comparative metagenomics and mathematical model. Exact quotes/locators:
    sr-diet and diet-model. The older conduit caveat is retained as a molecular question,
    not a claim that later conductance studies do not exist.'
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Sulfite Inhibition of ANME Methane Oxidation'
  outcome: concern
  summary: The measured immediate AOM decrease after 1.0 mM sulfite is supported for
    sediment 7142 with ANME-2a/2c. The node correctly treats sulfite as a chemical
    perturbation without a microbial source. Its generic evolved-interspecies-process
    GO annotation is not established by the chemical-dose experiment.
  target_ids:
  - CommunityMech:000134
  evidence_ids:
  - record
  - sulfite
  - authority
  details: 'Paths: ecological_interactions[2].target_taxon, participating_taxa[0],
    metabolites[0], biological_processes[0], evidence[0]. Sign: negative effect on
    labeled methane oxidation. Target guild: ANME, assay-specific clades 2a/2c. No
    donor organism or unaffected bacterial target is measured. Source ligand CHEBI:17359
    is correctly sulfite. This is a consortium readout attributed by authors to ANME
    inhibition, not a demonstrated intracellular molecular target.'
- assessment_id: edge-2-0
  area: graph
  topic: ecological_interactions[2].downstream[0] to sulfate-coupled AOM
  outcome: supported
  summary: The negative arrow is supported by decreased methane oxidation following
    sulfite addition. It need not assert a species competition relationship or the
    SRB response. The graph uses the chemical intervention as a source node and the
    measured consortium function as the target.
  target_ids:
  - CommunityMech:000134
  evidence_ids:
  - record
  - sulfite
  - history
  details: 'Context: short-term sediment 7142 microcosms; participants ANME-2a/2c
    with unisolated partners. Direction: sulfite addition suppresses AOM, not an identified
    SRB action against ANME. Mechanism at this evidence level is inhibitory perturbation;
    molecular toxic mechanism remains unestablished. Source: PMID:30559729 Results/Fig
    5A and sulfite exact quote.'
- assessment_id: node-3
  area: graph
  topic: 'ecological_interactions[3]: Zero-Valent Sulfur Inhibition of ANME Methane
    Oxidation'
  outcome: concern
  summary: Polythionate/polysulfide inhibition is supported in ANME-2a/2c-dominated
    microcosms, and the source argues against productive diffusible sulfur transfer.
    The node appropriately avoids elemental-sulfur CHEBI substitution. The biological-process
    annotation again implies an evolved interspecies process that this chemical intervention
    does not establish.
  target_ids:
  - CommunityMech:000134
  evidence_ids:
  - record
  - zero-sulfur
  - srb-response
  - authority
  details: 'Paths: ecological_interactions[3].target_taxon, participating_taxa[0],
    biological_processes[0], evidence[0]. Sign: negative AOM response. Chemical source:
    polythionate/polysulfide amendments; no microbial source organism. Source counterpart
    SRB enrichment failed; this is not an unaffected-partner demonstration. No unsupported
    single chemical CURIE is forced onto the mixture.'
- assessment_id: edge-3-0
  area: graph
  topic: ecological_interactions[3].downstream[0] to sulfate-coupled AOM
  outcome: supported
  summary: The negative arrow correctly carries the observed suppression of ANME-2a/2c
    methane oxidation to consortium AOM. It does not restore the rejected sulfur-cross-feeding
    interpretation. Dose and partner-response qualifications belong in the accompanying
    environmental metadata.
  target_ids:
