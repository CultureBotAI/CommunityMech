assessments:
- assessment_id: identity
  area: identity
  topic: Defined bacterial-archaeal mouse model
  outcome: supported
  summary: The focal pair resolves; D. piger is a comparator, not a third community
    member.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - record
  - main
  - pubmed
  - ontology
  dimensions:
  - name: community_scope
    value: B. thetaiotaomicron plus M. smithii
    definition: Monoassociation and a separate Bacteroides-D. piger comparison support
      the focal two-species experiment.
    evidence_ids:
    - main
    - record
  - name: source_strain
    value: Human fecal-derived isolates; exact codes unresolved
    definition: Species-level IDs are valid, but no culture accession or strain-specific
      GTDB candidate is inferred from the main text or gene-cluster archive.
    evidence_ids:
    - main
    - dataset
    - ontology
  - name: environment
    value: Distal gut of gnotobiotic NMRI/KI mice
    definition: Human gut-associated organisms were tested in mice; host adiposity
      is an experimental mouse endpoint, not established human therapy.
    evidence_ids:
    - main
    - methods
    - ontology
  - name: medium
    value: Autoclaved polysaccharide-rich host chow; microbial stock contexts separated
    definition: Current host light/chow/gavage facts are supported; exact in-vitro
      recipe, temperature and atmosphere remain unverified in SI.
    evidence_ids:
    - methods
    - source-scope
  - name: experimental_setting
    value: Monoassociation and sequential biassociation
    definition: Bacterial 14/28-day controls and bacterial 14-day then archaeal 14-day
      assembly must be distinguished from simultaneous inoculation.
    evidence_ids:
    - timing
    - methods
  - name: evidence_tier
    value: Measured paired densities; inferred syntrophic mediation
    definition: Population benefits are measured, while formate transfer, product
      removal and their necessity relative to hydrogen are inferred from combined
      assays.
    evidence_ids:
    - mutualism
    - formate-pool
    - formate-use
    - fructan-acetate
  - name: grounding_status
    value: Species and process labels verified
    definition: All nine term pairs match; historical GTDB ambiguity/statistics remain
      unchanged and exact experimental strains are unresolved.
    evidence_ids:
    - ontology
    - adapter
- assessment_id: roles
  area: grounding
  topic: Donor/recipient roles and local evidence
  outcome: concern
  summary: Methanobrevibacter roles are source-supported; Bacteroides CROSS_FEEDER
    needs a specified recipient mechanism.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - main
  - formate-use
  - schema
  details: Bacteroides is the described primary degrader and formate donor. Its benefit
    from archaeal product removal does not establish consumption of an archaeal metabolite.
    Attach functional evidence to primary degradation and identify a supported provider/uptake
    relation before retaining the recipient role; no reciprocal feeding is inferred.
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Inferred Formate Transfer To Methanogenesis'
  outcome: supported
  summary: Preserve the Bacteroides-to-Methanobrevibacter proposed formate route and
    PARTIAL evidence.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - formate-pool
  - formate-use
  - ontology
  - schema
  details: Formate is the proposed transferred substrate and methane the methanogenic
    product. In-vitro consumption and in-vivo transcripts support the source model,
    but unchanged formate pools do not quantify donor flux. SYNTROPHY describes proposed
    product removal without obligacy or a uniquely necessary formate sink. Place mechanism
    statements in notes rather than concentration fields.
- assessment_id: arrow-0
  area: graph
  topic: ecological_interactions[0].downstream[0] → Biassociation Enhances Colonization
    Density
  outcome: supported
  summary: Retain the PARTIAL link from proposed product removal to paired colonization
    benefits.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - formate-use
  - formate-pool
  - mutualism
  details: The arrow proposes that removal of bacterial formate benefits fermentation
    and both populations. The source does not isolate formate necessity or distinguish
    its contribution from hydrogen removal; measured mutualism does not remove that
    mediation uncertainty.
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Methanogen-Directed Fructan Fermentation'
  outcome: supported
  summary: Preserve the two-member community response and its qualified syntrophic
    explanation.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - fructan-acetate
  - main
  - schema
  details: The focal biassociation changes fructan utilization, bacterial expression/redox
    and acetate concentration compared with Bacteroides alone, unlike the D. piger
    comparator. The node does not establish a uniquely necessary sink or direct acetate
    production rate.
- assessment_id: arrow-1
  area: graph
  topic: ecological_interactions[1].downstream[0] → Biassociation Enhances Colonization
    Density
  outcome: supported
  summary: Retain the PARTIAL metabolic-response-to-colonization interpretation.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - fructan-acetate
  - mutualism
  details: Enhanced fructan fermentation could support bacterial expansion within
    the beneficial pair, but co-occurring metabolic changes and higher densities do
    not selectively establish pathway mediation. No automatic causal-strength upgrade
    is warranted.
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Biassociation Enhances Colonization Density'
  outcome: supported
  summary: MUTUALISM is supported by increased representation of both focal partners
    relative to monoassociation.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - mutualism
  - main
  - schema
  details: The paired density result is an in-vivo population benefit, not a demonstrated
    donor-specific flux or proof of obligacy. The comparator does not show the same
    response. Preserve the community-level two-member scope.
- assessment_id: ingredients
  area: evidence
  topic: Formate/methane certainty versus graph qualifications
  outcome: concern
  summary: Ingredient prose presents a proposed substrate/sink as the established
    metabolic basis of the interaction.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - record
  - formate-pool
  - formate-use
  - fructan-acetate
  details: Source interpretation supports formate use and methane as a methanogenesis
    product, but not a uniquely demonstrated driving sink. Acetate/fructan identities
    remain supported; neither additional transfer species nor measured methane rates
    are inferred.
- assessment_id: cultivation
  area: completeness
  topic: Colonization chronology and existing host conditions
  outcome: concern
  summary: The supported host/chow/light/dose block omits the recoverable sequential
    timing and control durations.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - timing
  - methods
  - record
  details: Each strain was administered by a single gavage; this should not imply
    a simultaneous two-strain inoculation. Keep D. piger stock preparation as comparator
    context, and do not treat analytical extraction conditions or in-vitro monogrowth
    as the host cultivation recipe.
- assessment_id: datasets
  area: evidence
  topic: DQ419923 gene sequence identity
  outcome: supported
  summary: The encoded resource correctly describes an article-linked M. smithii gene
    cluster.
  target_ids:
  - CommunityMech:000142
  evidence_ids:
  - dataset
  - main
  details: Its complete-sequence status applies to 13,648 bp, not a complete genome.
    No strain qualifier is present in the source feature. Expression data described
    as available from authors do not justify an invented public accession or a missing-dataset
    finding.
