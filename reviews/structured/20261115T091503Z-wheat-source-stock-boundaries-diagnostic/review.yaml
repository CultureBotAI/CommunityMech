summary: Two actual guarded M5 transitions separate the study's 16S-based FN0603/FWP1205
  identities from database reference populations, then store the complete pinned native
  descriptor results. FN0603 retains three name-route alternatives without selecting
  a study-stock species. FWP1205's exact NCBITaxon299767 descriptor records the native296-genome/.95
  correspondence without claiming an experimental-stock genome classification. Corrected
  notes, all five stocks, the other three mappings, biological content and old history
  remain unchanged in the second transition.
