limitations:
- Partial technical/source-provenance assessment with scientific_review:false. No
  whole-record scientific approval, corpus QC pass, automatic issue closure or release
  clearance follows from this bundle.
- The native crosswalk release is not established. FN0603's descriptor resolves by
  ncbi_name with no exact NCBITaxon158836 row. Its three options do not classify that
  study stock's genome or define a reference-genome denominator.
- The exact NCBITaxon299767 correspondence's total296 and majority fraction0.95 describe
  the reference population, not296 genomes from FWP1205 or a probability of that stock's
  identity. GROUNDED describes the stored descriptor correspondence, not a demonstrated
  experimental assembly placement.
- Primary evidence scope is the retained article's stated 16S V5-V7 identification
  method and five-stock roster. No independent reanalysis of marker resolution, exact-study
  genome placement, isolation-trait supplements, field outcomes or all mechanistic
  claims was performed.
- The first transition's eight checks establish the note-only intermediate and remain
  summarized in its bound checkpoint. They are not relabeled as final-byte checks.
  The eight required checks below are actual commands against final mapping bytes,
  including one new native sidecar.
- Local and M5 NCBI file-stat observations are retained separately; no whole-database
  checksum or release is certified. Source, crosswalk, native code, application and
  assessment inputs are hash-bound.
- Existing BCC-versus-NC treatment scope, EPS hypothesis, relative amplicon/viability
  boundaries, predicted pathways, yield/abundance findings and S1/S2 isolation-trait
  discussion remain preserved. Issue1952 is not cleared by this diagnostic.
- Reference validation, generated pages, actual composite historical admission and
  combined full QC remain separately accounted work. This bundle preserves both transition
  inputs for subsequent strict proof; it does not claim that integration has already
  passed.
