  details: Description and environmental-factor prose should distinguish source-proposed
    drivers from isolated causal mediation. Related-ingredient statements about active
    reductases and sediment products exceed gene inventories. Correct taxonomy[0]
    genome-resolved wording. Three-day sampling does not establish STABLE equilibrium.
    Preserve measured geochemistry, valid substrate chemistry and existing qualified
    methane/CO precursor hypotheses.
