limitations:
- Spatial DNA gene abundance does not establish expression, flux, host exchange or
  temporal equilibrium. Broad compartment descriptors are not isolates or reconstructed
  genomes.
- Results says PLM3 127 cm lacks selenium chemistry, but Appendix Table A4 reports
  PLM3 127–134 cm Se 0.90 ppb (SD 0.28), corroborated by Figure A3. PLM6 chemistry
  remains unavailable.
- Discussion and Figure 4b differ in the deep PLM6 CPR depth label. Retain generic
  deep hillslope exceptions. Methods/Figure 1 elevation and detected-HMM count differences
  are source-internal, not extra record findings.
- No raw sequence, model, tree or flux reanalysis was performed. Authentic article/image
  assets were recovered; failed HTML/challenge routes remain classified as access
  failures.
- Optional structured adapter unavailable in the owned runtime; no provider coverage
  or broad archive-absence claim.
