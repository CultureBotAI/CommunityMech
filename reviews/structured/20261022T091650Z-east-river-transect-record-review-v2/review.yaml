    or metabolic cooperation are demonstrated. Retain the literature-based host-dependence
    hypothesis in qualified notes; do not require obligacy or infer physiological
    inability.
  - Omit or specifically support PRIMARY_DEGRADER for each compartment. Retain PRIMARY_PRODUCER
    only as compartment-level carbon-fixation potential with exact codhC/codhD or
    RubisCO evidence, not a function of every organism.
  - Omit or substantiate riparian DOMINANT relative to the record; distinct composition
    is insufficient and no numerical cutoff applies. Preserve broad compartment identities
    and all GTDB UNRESOLVED statuses.
