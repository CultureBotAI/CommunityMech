  - CPR
  - semantics
  details: CPR partners and utilized metabolites are unknown. PRIMARY_DEGRADER requires
    source-local complex-substrate support; respiration/C1 markers and generic membership
    excerpts do not establish it for every compartment. Preserve qualified aggregate
    PRIMARY_PRODUCER with codhC/codhD and RubisCO evidence. Riparian distinctness
    does not establish DOMINANT prominence; use no percentage cutoff.
