  acceptance_checks:
  - Describe assembled scaffolds, rpS3 clusters and predicted metabolic genes; replace
    taxonomy[0] genome-resolved wording. Keep RNA co-extraction for another study
    separate from the focal DNA analysis.
  - Qualify groundwater/shale drivers in description and environmental_factors[1:2]
    as observed associations and proposed mechanisms. In related_ingredients, distinguish
    predicted enzyme substrates/products from measured activity, especially thiosulfate,
    sulfite and selenium. Total ICP-MS selenium does not establish measured selenite/selenate
    speciation or turnover; oxidation and mobilization remain proposed. Preserve existing
    valid geochemical measurements and already-qualified precursor hypotheses.
  - Omit STABLE unless source evidence establishes equilibrium; do not force another
    ecological state. Retain the four qualified nodes, three HYPOTHESIZED arrows and
    open discussion.
  - Preserve the PLM3 selenium table/text and deep CPR depth-label discrepancies without
    arbitrarily harmonizing them.
