    - domain
    - strain
- assessment_id: context
  area: identity
  topic: Origin, state, category and environment
  outcome: supported
  summary: ENGINEERED, SYNTHETIC, BIOTECHNOLOGY and laboratory environment fit the
    experimental assembly.
  target_ids:
