limitations:
- Scoped technical and provenance assessment with scientific_review:false and partial
  coverage; no full scientific record approval or corpus QC completion.
- The seven-genome population is keyed to species NCBITaxon:160791. Its rounded fraction
  0.86 is retained without inventing a majority numerator or asserting YL-JM2C membership
  in that population. PRJNA1397584 remains a BioProject, not an assembly accession.
- The paper's Cupriavidus necator JMP134 wording and canonical Cupriavidus pinatubonensis
  JMP134 identity remain distinct. Exact strain taxon 264198 supplies the native one-genome
  route; this does not independently verify another study stock or an uninspected
  assembly.
- Local NCBI label/rank and synonym rows were inspected through the existing read-only
  adapter. Stable database file-stat observations are not content hashes or release
  certification; exact crosswalk, source-cache and resolver bytes are bound separately.
- The prior forward intermediate cross-feeding, lack of reverse rescue, parent disappearance
  versus intermediate clearance, source limitations and non-graph biological-role
  issue 1753 remain unchanged. No closed-carbon-balance or new mechanism claim is
  made.
- The seven scoped validators and native history scaffolding are distinct from source-snippet
  matching, generated pages, strict historical successor admission and final combined
  QC. Those integration tasks retain their separate outcomes.
