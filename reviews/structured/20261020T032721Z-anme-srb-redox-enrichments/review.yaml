  outcome: supported
  summary: NCBITaxon:588814 is Ca. Methanophagales; the record explicitly retains
    GTDB Alkanophagales naming. The article names ANME-1 in the 50 C Desulfofervidus
    partnership. Roles as syntrophic partner and electron donor fit the mechanism;
    abundance text is qualitative partnership context.
