  accessed_at: '2026-10-20T03:27:21.878579Z'
- evidence_id: electrochemistry
  kind: primary_source
  reference: PMID:40845095
  locator: 'Results and Figures 1-3: dry conduction, redox properties, generator-collector
    measurements; Discussion'
  summary: Dry conductance and heat/oxygen/fixation responses support a biomolecular
    conductor. Live biomass redox peaks and generator-collector currents across a
    5 micrometer gap support redox transport. Multiheme cytochrome c is a plausible
    carrier class, not an identified protein conduit; the discussion retains alternatives
    and protein-level uncertainty.
  support: supports
  accessed_at: '2026-10-20T03:27:21.878581Z'
- evidence_id: conditions
  kind: primary_source
  reference: PMID:40845095
  locator: 'Materials and Methods: ANME/SRB enrichment cultures and Electrochemical
    analysis'
  summary: The defined seawater recipe, pH 7.3, trace elements without vitamins, N2
    sparging during medium preparation, and subsequent 5 mM bicarbonate/0.5 mM sulfide
    additions are reported. Preparation gas and dissolved additions do not identify
    culture headspace. The electrochemical PBS/Gelrite assays are distinct from growth
    conditions; Geobacter reactor headspace is a control protocol and cannot be copied
    to ANME cultivation.
  support: supports
  accessed_at: '2026-10-20T03:27:21.878582Z'
