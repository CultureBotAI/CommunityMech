  - culture-results
  - process-ontology
- assessment_id: taxon-1
  area: grounding
  topic: 'taxonomy[1]: Desulfofervidus'
  outcome: supported
  summary: NCBITaxon:1902583 is the named genus, with GTDB explicitly unresolved.
    Ca. D. auxilii/HotSeep-1 context is compatible with the primary phylogeny, without
    asserting a strain isolate. Syntrophic partner/electron acceptor roles fit the
    bacterial sulfate reduction process.
  target_ids:
  - CommunityMech:000276
  evidence_ids:
  - record
  - culture-results
  - srb-phylogeny
  - ontology-authority
- assessment_id: taxon-2
  area: grounding
  topic: 'taxonomy[2]: ANME-2a'
  outcome: supported
  summary: The record explicitly uses the broader ANME-2 cluster (NCBITaxon:588816)
    and unresolved GTDB status, retaining the narrower informal subclade in preferred
    wording. Presence in the 10 C and mixed 20 C enrichments and electron-donor role
    are supported; no species identity is inferred.
  target_ids:
  - CommunityMech:000276
  evidence_ids:
  - record
  - culture-results
- assessment_id: taxon-3
  area: grounding
  topic: 'taxonomy[3]: ANME-2c'
  outcome: supported
  summary: Ca. Methanogaster NCBITaxon:3386252 and its GTDB genus pass canonical/coherence
    checks. The source names ANME-2c in the mixed 20 C enrichment. This is clade-level
    participant representation, not proof of a cultured species or exact genome.
  target_ids:
  - CommunityMech:000276
  evidence_ids:
  - record
  - culture-results
- assessment_id: taxon-4
  area: grounding
  topic: 'taxonomy[4]: Seep-SRB1'
  outcome: concern
  summary: Presence and electron-accepting partner role are supported, but the asserted
    universal Desulfobacteraceae family parent is not established by an undifferentiated
    historical label. The primary phylogeny distinguishes Seep-SRB1a and Seep-SRB1g;
    resolve the sampled subclades before assigning a shared family.
  target_ids:
  - CommunityMech:000276
  evidence_ids:
  - record
  - culture-results
  - srb-phylogeny
  - srb1-scope
- assessment_id: taxon-5
  area: grounding
  topic: 'taxonomy[5]: Seep-SRB2'
  outcome: concern
  summary: Presence in the mixed 20 C enrichment and electron-accepting role are supported.
    Its Desulfobacterales NCBI/GTDB grounding conflicts with the primary phylogenetic
    placement in Dissulfuribacterales. A valid existing order is not a conservative
    parent merely because it contains other SRB.
  target_ids:
