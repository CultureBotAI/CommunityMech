  topic: 'ecological_interactions[1]: Redox-Conduction Direct Interspecies Electron
    Transport'
  outcome: concern
  summary: All six named lineage descriptors represent the three culture contexts.
    Redox conduction over micrometer distances is measured, while multiheme cytochrome
    c remains a compatible carrier class. Broad GO:0022900 does not itself assert
    membrane coupling or a proton gradient. The three direct evidence items support
    redox activity and transport, but copied SRB1/SRB2 taxonomy mappings remain defective.
  target_ids:
