findings:
- finding_id: srb-taxonomic-grounding
  issue_key: CommunityMech.000276.srb-taxonomic-grounding
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Informal SRB partner names are assigned unsupported taxonomic parents
  description: Seep-SRB2 is mapped to Desulfobacterales in the main taxonomy, GTDB
    lineage and two participant copies, whereas the inspected primary phylogeny places
    this clade in Dissulfuribacterales. Calling the former a conservative parent is
    not supported. The parallel Seep-SRB1-to-Desulfobacteraceae assertion also treats
    a historically polyphyletic name as one family without resolving the actual sampled
    subclades.
  target_ids:
  - CommunityMech:000276
