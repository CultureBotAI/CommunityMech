  evidence_ids:
  - record
  - article
  - bibliography
  - culture-results
  dimensions:
  - name: source_strain
    value: Informal ANME/SRB lineages in three enrichments; no named pure strain
    definition: Clade and partnership identities are the source resolution, not isolate
      identifiers.
    evidence_ids:
    - culture-results
  - name: community_scope
    value: ANME-1/Desulfofervidus; ANME-2a/Seep-SRB1; ANME-2a+2c/Seep-SRB1+2
    definition: Six taxonomy entries describe the union of three separately studied
      enrichments.
    evidence_ids:
    - record
    - culture-results
  - name: experimental_setting
    value: Sediment-free laboratory enrichments and biomass electrochemistry
    definition: Marine sediment describes inoculum origin; dry and live/PBS assays
      are distinguished.
    evidence_ids:
    - culture-results
    - conditions
  - name: medium
    value: Defined HEPES-buffered artificial seawater, pH 7.3
    definition: Common medium recipe with separate 50, 10 and 20 C culture settings;
      not one validated continuous temperature tolerance.
    evidence_ids:
    - conditions
  - name: source_category
    value: Primary full article in committed cache, live bibliographic metadata and
      inspected primary phylogeny XML
    definition: Cache frontmatter is stale; actual assessed full-text sections are
      explicit. Supplementary figures are uninspected.
    evidence_ids:
    - article
    - bibliography
    - srb-phylogeny
  - name: taxonomic_resolution
    value: ANME orders/clades/genus and SRB genus/family/order mappings
    definition: Canonical term validation passes; two SRB informal-label mappings
      require source-specific resolution.
    evidence_ids:
    - record
    - srb-phylogeny
  - name: ecological_state
    value: Long-maintained natural-origin enrichments
    definition: STABLE is compatible with maintained cultures but does not demonstrate
      equilibrium or identical natural-community abundance.
    evidence_ids:
    - culture-results
