  topic: 'ecological_interactions[2]: SRB sulfate reduction accepts methane-derived
    electrons'
  outcome: concern
  summary: Desulfofervidus, Seep-SRB1 and Seep-SRB2 are the bacterial recipients across
    the relevant enrichments. Methane-derived electron flow supports sulfate reduction;
    CHEBI:16189 and GO:0019420 fit the receiving process. Both evidence items support
    direction and pairing, while participant-copy taxonomy must be corrected alongside
    taxonomy entries.
  target_ids:
