  outcome: supported
  summary: ANME-1/2a/2c are the upstream archaeal participants within their respective
    cultures, methane is the substrate, and electron donation is the direction. CHEBI:16183
    and broad GO:0015947 fit this claim. The two attached evidence items support partnership
    and electron direction, not a specific isolated methane-oxidation enzyme.
  target_ids:
  - CommunityMech:000276
  evidence_ids:
  - record
  - culture-results
