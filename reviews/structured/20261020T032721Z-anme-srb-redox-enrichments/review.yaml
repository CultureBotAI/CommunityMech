  topic: Biological identity, scope and source strata
  outcome: supported
  summary: The target is a study-specific set of three natural-origin ANME/SRB enrichments.
    The PMID/DOI identity is verified. Pairing and condition notes preserve separate
    cultures; no strain-isolate identity, pure six-member community or synthetic assembly
    is justified.
  target_ids:
