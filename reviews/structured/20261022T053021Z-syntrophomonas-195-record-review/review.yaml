  details: 'Exact selector ecological_interactions[0].downstream[0]; source node0
    → node1. Upstream S.wolfei863 provides hydrogen to195243164. Exact description:
    Hydrogen from S. wolfei butyrate oxidation supplies the electron donor for strain-195
