  public routes. Main Methods, tables and figures suffice for current qualified claims;
  no supplemental thermodynamic-workbook or raw-microarray reanalysis is claimed.
- The isotope source is a permission-attributed dissertation reproduction, not a publisher
  PDF. Chapter 5 main was read completely; appendix captions and available axes were
  read without pixels or exhaustive raw-appendix/bibliography coverage. Its lactate-labelled
  S.wolfei arm and table/body enrichment differences remain explicit, without silently
  importing2015 conditions.
- The 2016 source has internal locus/normalizer and formate-dose inconsistencies.
  No new ambiguous gene or dose statement is promoted; protein assays and qRT-PCR
  retain their actual partners.
- Thirty canonical excerpts match strictly; one needs an explicit initial-capitalization
  projection. Native reference pass is not a certificate that31 excerpts match literally.
- Catalogue and reused reference-genome metadata retain their actual retrieval and
  read scopes. The colon-named Crossref cache is pinned discovery-only, not one of
