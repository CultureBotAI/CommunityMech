  - name: origin
    value: Cotton-detritusphere Prospector selection, later GenX testing
    definition: Upstream selection and focal application remain separate.
    evidence_ids:
    - origin
    - identity
  - name: membership
    value: Six named taxa are an observed subset
    definition: No complete roster or isolate-level recovery asserted.
    evidence_ids:
    - profiles
    - sequencing
  - name: source_coverage
    value: Complete focal main and actual SI; upstream abstract only
    definition: Sufficient for current claims, with original roster/protocol access
      limits.
    evidence_ids:
    - assets
    - upstream-access
  details: Retain author-supported synthetic/engineered scope, six named reference
    taxa and explicit incomplete roster. Do not import GENIA safety results or Community
    H reactor performance.
- assessment_id: roles
  area: scope
  topic: Four taxonomy functional_role annotations
  outcome: concern
  summary: Relative enrichment and computational prediction do not establish direct
    degradation by each member.
  target_ids:
