    role: canonical_record
  acceptance_checks:
  - Retain M9 component concentrations, liquid 500 ng/mL GenX, 200 µL total wells,
    28 °C, 150 rpm, dark, 72 h and stated controls; attach exact Methods 2.1 and 2.3
    evidence covering those claims. Resazurin is an assay indicator, not proof GenX
    is the sole growth carbon source.
  - Add 220 mL-capacity soil jars containing 80 g soil:sand at 3:1, 60% water-holding
    capacity maintained daily, 2,000 ng/mL GenX in pore water and 1 mL standardized
    inoculum, incubated at 28 °C in darkness. Record destructive day 0–3 sampling
    and source replicates without inventing a liquid working volume or soil agitation.
  - Link 80.6% removal and 69.6% defluorination to the sterile-soil stage. Keep GENIA
    indigenous-microbiome comparisons distinct and do not transfer Community H upstream
    reactor conditions.
  - Record the source discrepancy between 10 µL at 10^5 cells/mL and its approximate
    5 × 10^3 cells/well statement; do not silently replace the author-reported value.
    Keep stock/PBS preparation separate from controlled culture pH.
