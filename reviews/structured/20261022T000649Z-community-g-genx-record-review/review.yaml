limitations:
- The focal GenX article and actual supplements were fully reviewed. Upstream PMID42173377
  full main and SI remain unavailable; its abstract and focal Methods support current
  origin/substrate claims. The complete Community G roster and precise Figshare sample-to-condition
  mapping remain unresolved.
- Source 10 µL at 10^5 cells/mL implies 10^3 cells, but Methods reports approximately
  5 × 10^3 cells/well. Source GenX ammonium-salt wording conflicts with acid CAS/molecular
  mass. Neither discrepancy is silently resolved or counted as a new curator error.
- Actual Supplementary Figure S1 depicts docking despite Results 3.3 citing it for
  broad-PFAS comparisons. S2C image reports rho 0.15, p 0.27, n 57 versus caption
  0.12, 0.18. Figure 5 contains overlapping graphical traces; quantitative endpoints
  are attributed to source text/captions, not image reconstruction.
- Relative 16S profiles, gene homology and docking do not establish absolute viable
  trajectories, reciprocal harm, specific enzyme turnover or complete carbon mineralization.
  Positive community GenX loss and fluoride measurements remain reported evidence.
- Figshare archive metadata and scoped processed tables were inspected by the supporting
  reviewer, not raw sequences or a numerical reanalysis. Upstream PRJNA1370521 is
  described as raw 16S by indexed publisher text but as 45 isolate genomes/GENIA design
  by direct project metadata; no Community G dataset reassignment follows.
- 'All 18 excerpts strictly match cited fresh sources and caches: 14 focal XML and
  4 upstream MED. Completeness 20 versus historical cohort 87 reflects different metrics;
  optional role absence is not a separate defect. Fresh batch13 corpus baseline retains
  44 warnings across 16/477 communities, zero errors and both exit 1.'
notes:
- 'Completed scientific review: 1 major/2 minor, completeness 20/raw 111/capped 100.'
- Final source/root/child/support receipts precede candidate pins. Parent alone saves
  after whole independent acceptance.
