- evidence_id: origin
  kind: primary_source
  reference: PMID:42173377; DOI:10.1016/j.biortech.2026.134924
  locator: Fresh MED abstract, whole
  summary: Prospector nanowells selected eight enriched cotton-detritusphere communities
    A–H under PFOS/PFOA conditions. The abstract supports upstream origin and substrate
    context; its Community H scale-up and removal values are not Community G results.
    No upstream full-body or SI access is claimed.
  support: supports
  accessed_at: '2026-10-22T00:05:07.421761Z'
  snapshot_sha256: cc77fd3bd32e52f32fc73edb06b9e39606e786d0b0e222f9f4f65cad4b9a74ef
- evidence_id: identity
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Materials and methods → Bacterial consortia (2.1), sole paragraph
  summary: The focal study reuses communities A–H and distinguishes Community G microfluidic
    selection from GENIA rational assembly. Stored consortia were revived from 20%
    glycerol stocks, washed twice in PBS and resuspended in M9 at OD600 0.05.
  support: supports
  accessed_at: '2026-10-22T00:05:07.421894Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: profiles
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Results → Community G exhibits dynamic taxonomic restructuring during GenX
    degradation (3.2), paragraphs 1–2; GENIA maintains stable community composition
    while community G undergoes selective enrichment (3.6), paragraphs 3–4; Figure
    4C
  summary: The four highlighted taxa reach 22.3%, 22.3%, 17.3% and 16.6% relative
    abundance by day three. Two initially abundant taxa decline in the profiles. These
    relative observations do not establish absolute viable expansion, extinction or
    each member’s catalytic role. Figure 4C includes additional taxa beyond the six
    encoded participants.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422134Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: role-inference
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Results → Comparative genomic analysis reveals widespread PFAS-degrading
    gene distribution (3.8), paragraphs 1–4; Molecular docking predicts favorable
    GenX binding across multiple dehalogenase families (3.9), paragraphs 1–3; Discussion
    → Metabolic division of labor, guild architecture explains collective performance
    (4.3), sole paragraph; Figures 6–7
  summary: The paper interprets gene homology and docking as candidate functional
    guilds but explicitly acknowledges that gene copy numbers and ligand binding do
    not establish expression, substrate turnover or enzyme activity. Four unqualified
    member PRIMARY_DEGRADER annotations exceed their local enrichment evidence. Inferred
    roles may be described as hypotheses with appropriate evidence modes; no polymer-only
    criterion is imposed.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422238Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: chemical-endpoints
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Results → Temporal kinetics reveal rapid GenX defluorination in sterile
    soil microcosms (3.5), paragraphs 1–4; Fluoride release confirms genuine GenX
    defluorination (3.7) and Soil microcosm defluorination mirrors in vitro patterns
    (3.7.2); Figures 4D and 5D/F
  summary: The source reports Community G soil removal of 19.2%, 61.8% and 80.6% across
    days one to three, with day-three fluoride 882.07 ± 113.82 ng/mL and 69.6% defluorination.
    Heat-killed controls remain low. Positive community measurements do not establish
    complete carbon mineralization or assign function to a specific member.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422330Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: recipe
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Materials and methods → Bacterial consortia (2.1), sole paragraph; Chemicals
    and reagents (2.2), sole paragraph
  summary: The M9 formulation specifies Na2HPO4 6.78 g/L, KH2PO4 3 g/L, NaCl 0.5 g/L,
    NH4Cl 1 g/L, MgSO4 2 mM and CaCl2 0.1 mM. GenX is supplied substrate. Source reagent
    wording names an ammonium salt while CAS 13252-13-6 identifies the acid; no exact
    salt-to-acid grounding is inferred.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422420Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: microplate
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Materials and methods → Microplate screening assays (2.3), sole paragraph
  summary: Screening uses 190 µL M9 with 500 ng/mL GenX plus 10 µL standardized consortium
    suspension in 200 µL wells, 0.001% resazurin, 28 °C, 150 rpm, darkness and 72
    h. Quadruplicate assays include uninoculated, heat-killed and no-GenX controls.
    The stated 10^5 cells/mL and 10 µL imply 10^3 cells, whereas the source reports
    approximately 5 × 10^3 cells/well; preserve that discrepancy.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422512Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
  quote: orbital shaking
- evidence_id: soil
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Materials and methods → Microcosm biodegradation experiments (2.4), sole
    paragraph; Results → Soil microcosm validation reveals genia activity does not
    disrupt indigenous soil microbiomes (3.4), paragraphs 1–5; Figures 3–4
  summary: Separate 220 mL-capacity jars contain 80 g soil:sand at 3:1, 60% water-holding
    capacity, GenX 2,000 ng/mL in pore water and 1 mL standardized consortium inoculum.
    They incubate at 28 °C in darkness with daily moisture adjustment and destructive
    day 0–3 sampling. The downstream Community G time course uses sterile soil; indigenous-soil
    compatibility comparisons concern GENIA. Jar capacity is not a liquid working
    volume.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422603Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: analysis
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Materials and methods → Microcosm biodegradation experiments (2.4), sole
    paragraph; Materials and methods → Fluoride quantification (2.5), sole paragraph;
    LC-MS/MS quantification of GenX (2.6), sole paragraph; Results → Soil microcosm
    defluorination mirrors in vitro patterns (3.7.2), final paragraph
  summary: GenX disappearance is measured by LC-MS/MS and fluoride by SPADNS colorimetry
    with matrix controls. The source acknowledges soil extraction/recovery limitations
    and incomplete fluorine mass balance. Fluoride release supports partial defluorination,
    without proving complete mineralization or the hypothetical intermediates in Figure
    7.
  support: supports
  accessed_at: '2026-10-22T00:05:07.422693Z'
  snapshot_sha256: 7dbcf60b99cdc2249ee1d0f15d15844e7c507858853d7b577bfd6c2e855b7459
- evidence_id: sequencing
  kind: primary_source
  reference: PMID:42422733; DOI:10.3389/fmicb.2026.1848796
  locator: Materials and methods → Sequencing (2.8), sole paragraph; Bioinformatics
    analysis (2.9), sole paragraph; Results 3.6 and Figure 4C
  summary: Nanopore full-length 16S/Emu profiles support relative taxonomic assignments.
    Comparative genome homology and docking are separate computational analyses. Reference
    labels LM091 and MYb57 do not prove recovery of the original external reference
