  acceptance_checks:
  - Remove the four optional PRIMARY_DEGRADER annotations unless retained as explicit
    source-attributed hypotheses with appropriate computational evidence and uncertainty.
    Relative enrichment, genome homology and docking must not be presented as direct
    member-specific catalytic assays. No compulsory replacement role is proposed.
  - Preserve the six named subset entries, measured day-three percentages, ordinal
    prominence and qualified single-node/zero-arrow graph. Describe expansion, decline
    and disappearance as changes in relative profiles; do not infer absolute viable
    counts or reciprocal competitive harm.
  - Keep positive bulk removal and fluoride release. Do not claim complete mineralization,
    validated pathway flux or Community G indigenous-microbiome safety from GENIA
    comparisons.
- action_id: recover-soil-protocol
  description: Represent liquid screening and soil validation as separate stages.
  finding_ids:
