limitations:
- The required full-main scientific assessment is unavailable. Current public publisher
  HTML/PDF requests returned 403 and Europe PMC identifies subscription access without
  PMC full text; no bypass or purchase was attempted.
- The abstract explicitly reports cross-feeding. Lack of accessible main transfer/rescue
  Methods is not evidence that those experiments were absent; exact exchanged compounds,
  flux and selective mediation remain unverified.
- Five source media formulations are accessible, but their exact strain/assay assignments,
  temperature, vessel, aeration, shaking, inoculum ratio and field randomization were
  not recovered. Analytical extraction/MS conditions are not cultivation parameters.
- Soil baseline pH differs between precursor microcosm and field material. Thirty-day
  laboratory enzyme assays are not a field trial duration; field improvements are
  endpoint-specific.
- Figures S6-S8 and S10-S11 were visually inspected by the lead; the independent reviewer
  also inspected Tables S5-S6. Remaining supplementary figure pixels and the complete
  main figures were not independently assessed.
- B/G are local source strain codes; no unique deposited isolate identity was inferred.
  Historical GTDB fractions/counts/release and Bradyrhizobium candidate mappings were
  not recomputed.
- No deposited sequence accession was identified in the bounded accessible abstract/supplement;
  unavailable main data availability is not certified. The Figshare resource is a
  supplement, not raw omics data.
- Fresh optional-adapter discovery was limited to the owned runtime; the known external-checkout
  runner was not executed, and no strain-module coverage claim was made.
