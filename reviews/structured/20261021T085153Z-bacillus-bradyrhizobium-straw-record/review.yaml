assessments:
- assessment_id: identity
  area: identity
  topic: Defined pair and laboratory/field scope
  outcome: supported
  summary: The source resolves the two-isolate SynCom and separates its precursor
    selection, laboratory assays and field application.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - record
  - strains
  - context
  - field
  - ontology
  dimensions:
  - name: community_scope
    value: Two-member synthetic inoculant, not the entire soil microbiome
    definition: ENGINEERED, SYNTHETIC and LIGNOCELLULOSE fit the source; functional
      stability is an objective rather than a certified persistence measurement.
    evidence_ids:
    - record
    - strains
  - name: source_strain
    value: B. siamensis B and B. japonicum G
    definition: The local strain codes are explicit, but absent from structured strain
      fields; species taxIDs do not authenticate deposited isolate genomes.
    evidence_ids:
    - strains
    - ontology
    - datasets
  - name: environment
    value: Cropland soil with maize straw
    definition: ENVO soil is compatible; baseline microcosm and field soil chemistry
      are distinct from broth formulations.
    evidence_ids:
    - context
    - field
    - ontology
  - name: medium
    value: Five source formulations with unresolved experiment assignment
    definition: Public recipes are available; exact mapping to individual preparation
      and pair assays, temperature and inoculum are not certified.
    evidence_ids:
    - context
    - access-publisher
    - supplement
  - name: experimental_setting
    value: Dilution microcosms, laboratory pair assays and field straw-return comparisons
    definition: Thirty-day broth enzyme endpoints and field soil outcomes must remain
      separate; unavailable main Methods limit design verification.
    evidence_ids:
    - enzyme
    - field
    - context
  - name: evidence_tier
    value: Reported cross-feeding, measured activities/outcomes and proposed mediation
    definition: Random-forest metabolite rankings are candidate associations; acetylene
      reduction is not member-resolved nitrogen transfer.
    evidence_ids:
    - cross-feeding
    - enzyme
    - mediation
  - name: grounding_status
    value: Canonical species/chemical/process labels; inherited GTDB mappings
    definition: Bacillus is stored GROUNDED and Bradyrhizobium AMBIGUOUS; historical
      mapping counts, release and candidate membership were not recomputed.
    evidence_ids:
    - ontology
    - schema
    - adapter
- assessment_id: taxonomy
  area: grounding
  topic: Both member identities and functional roles
  outcome: concern
  summary: The roles are supported at the inspected scope, but source strain fields
    and nearest role-specific evidence need improvement.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - strains
  - enzyme
  - cross-feeding
  - ontology
  - schema
  details: S6-S7 support Bacillus degradation; explicit reciprocal-growth reporting
    supports Bradyrhizobium as a recipient. Candidate S10/S11 metabolites are not
    authenticated transferred molecules. Current taxonomy evidence quotes membership
    only, while B/G remain buried in design prose.
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Straw Humification Cross-Feeding'
  outcome: supported
  summary: Retain reported reciprocal support with the current explicit access and
    metabolite limits.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - cross-feeding
  - strains
  - supplement
  - ontology
  details: Participants are B. siamensis B and B. japonicum G, with reciprocal direction
    in laboratory co-culture. The nitrogen-fixation term is bounded by the activity
    context; neither N2 fixation nor ammonium accumulation alone proves transfer to
    Bacillus. Complete main rescue/transfer methods remain unassessed.
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Straw-Degrading Enzyme Stimulation'
  outcome: supported
  summary: The node accurately describes measured activity endpoints with its existing
    necessity and flux caveats.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - enzyme
  - strains
  - ontology
  details: Both source isolates form the tested pair; treatment-to-broth activities
    are assessed after 30 days against uninoculated and monoculture controls. S6 supports
    CMC-cellulase, xylanase, lignin-peroxidase and nitrogenase differences. Community-level
    terms do not attribute every enzyme to both members.
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Maize Straw Humification and Soil Organic Carbon
    Improvement'
  outcome: supported
  summary: Field outcomes are supported and the current description appropriately
    qualifies carbon-pump interpretation.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - field
  - strains
  - mediation
  details: The intervention is inoculation of the B/G pair into straw-return field
    soil; the response belongs to the whole soil system. Tables S5-S6 support selected
    carbon/degradation changes, not uniform improvements or a selectively traced microbial-carbon-pump
    route.
- assessment_id: edge-0-1
  area: graph
  topic: 'ecological_interactions[0].downstream[0]: cross-feeding -> enzyme stimulation'
  outcome: supported
  summary: The PARTIAL designation accurately preserves source attribution without
    claiming selective mediation.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - cross-feeding
  - enzyme
  - mediation
  details: Direction is reciprocal B/G growth support to measured pair enzyme activities
    in laboratory culture. Abstract attribution and S6 endpoints support a proposed
    link, while inaccessible main transfer/rescue methods prevent stronger causal
    certification.
- assessment_id: edge-1-2
  area: graph
  topic: 'ecological_interactions[1].downstream[0]: enzyme stimulation -> field carbon
    outcome'
  outcome: supported
  summary: The PARTIAL designation correctly separates laboratory activities from
    field humification/SOC and unresolved mediation.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - enzyme
  - field
  - mediation
  details: The same B/G inoculant is represented, but source and target measurements
    occur in distinct laboratory and field contexts. The direction follows the authors
    interpretation, not a verified enzyme-specific field intervention.
- assessment_id: ingredients
  area: grounding
  topic: Four substrate terms and carbon-flow interpretation
  outcome: concern
  summary: Chemical mappings and degradation context are compatible; the lignin relevance
    sentence needs the graph-level interpretation qualifier.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - ontology
  - enzyme
  - field
  - mediation
  details: S1 confirms straw cellulose/hemicellulose/lignin fractions and S7 supports
    laboratory degradation; these do not trace lignin-peroxidase-derived carbon into
    the humic pool. Table S6 does not show significant field lignin degradation above
    control. No metal phenotype or inferred metal contamination is required.
- assessment_id: cultivation
  area: completeness
  topic: Recoverable cultivation and environmental context
  outcome: concern
  summary: Accessible recipes, assay duration and soil baselines can improve context
    without inventing unavailable main protocols.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - context
  - supplement
  - record
  details: The environmental factor repeats engineering design. Capture actual source
    contexts separately; do not treat metabolomics extraction temperatures or analytical
    mobile-phase pH as growth conditions. Trace-metal recipe salts are ingredients,
    not evidence of a metal-processing function.
- assessment_id: provenance
  area: evidence
  topic: References, exact snippets, history and dataset boundaries
  outcome: supported
  summary: Citations and eleven snippets verify; prior graph decisions remain consistent
    with current limits.
  target_ids:
  - CommunityMech:000120
  evidence_ids:
  - pubmed
  - crossref
  - epmc
  - snippets
  - history
  - datasets
  - search
  details: No encoded CultureMech, MediaIngredientMech or sequence accession requires
    repair. Public supplement linkage is useful enrichment, while unavailable main
    data availability prevents a whole-study archive-absence claim.
