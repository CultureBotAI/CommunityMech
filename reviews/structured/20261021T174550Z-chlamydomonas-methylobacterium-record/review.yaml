- evidence_id: record
  kind: record_content
  reference: kb/communities/Chlamydomonas_Methylobacterium_Mutualism.yaml
  locator: Entire maintained YAML, both taxa, three interaction nodes and two arrows
  summary: The graph distinguishes the 2018 proline experiment from the 2024 IAA experiments.
    Non-graph identity, mechanisms, cultivation, metal and resource metadata remain
    inconsistent with those qualified claims.
  support: supports
  accessed_at: '2026-10-21T17:45:50.410236Z'
- evidence_id: identity-2018
  kind: primary_source
  reference: PMID:29385570
  locator: 'Materials and Methods: Strains, culture media and pre-culture conditions;
    Table 1; Results and Discussion: Methylobacterium complements the inability of
    Chlamydomonas to grow using peptides'
  summary: The focal algal strain is CC-1690 and the bacterium is M. aquaticum GR16T,
    DSM 16371. Table 1 reports drinking-water origin for the bacterium. The accidental
    M017 isolate from an algal laboratory culture is a different organism; its marker
    MG287145 does not belong to GR16T. The experimental pair is not demonstrated to
    be a naturally co-isolated freshwater community or at stable equilibrium.
  support: supports
  accessed_at: '2026-10-21T17:45:50.410725Z'
  snapshot_sha256: 4cddfcf7f5a4768cb6f9d5ad9047e7af73e943aac6c9933a2623c95a0592ef06
- evidence_id: hyp
  kind: primary_source
  reference: PMID:29385570
  locator: 'Results and Discussion: Methylobacterium complements the inability of
    Chlamydomonas to grow using peptides; Figure 1, especially the free-Hyp column'
  summary: No assayed methylobacterium complemented algal growth on free L-hydroxyproline.
    Certain hydroxyproline-containing peptides give different results. The current
    ingredient explanation wrongly turns the broad abstract sentence into a positive
    free-Hyp rescue claim. Preserve the negative substrate result and the distinction
    between the free amino acid and peptide forms.
  support: supports
  accessed_at: '2026-10-21T17:45:50.413867Z'
  snapshot_sha256: 4cddfcf7f5a4768cb6f9d5ad9047e7af73e943aac6c9933a2623c95a0592ef06
  quote: lack of growth on L-Hyp
- evidence_id: proline-exchange
  kind: primary_source
  reference: PMID:29385570
  locator: 'Results and Discussion: A Chlamydomonas–Methylobacterium obligate mutualism
    underlying growth on L-Pro; Figures 2–3'
  summary: Both partners grow together in the proline context when neither monoculture
    grows. Bacterial ammonium production, algal glycerol accumulation, lack of glycerol
    accumulation in coculture and bacterial glycerol supplementation support the source-described
    carbon/nitrogen exchange. These measurements do not establish a traced exclusive
    mediator, an oxygen-mediated benefit, IAA metabolism or a keystone removal experiment.
  support: supports
  accessed_at: '2026-10-21T17:45:50.416707Z'
  snapshot_sha256: 4cddfcf7f5a4768cb6f9d5ad9047e7af73e943aac6c9933a2623c95a0592ef06
- evidence_id: proline-model
  kind: primary_source
  reference: PMID:29385570
  locator: 'Results and Discussion: Methylobacterium genome analysis for L-Pro metabolism;
    A carbon–nitrogen metabolic circuit between Chlamydomonas and Methylobacterium;
    Figures 4–5'
  summary: The main figures distinguish putative genomic proline pathways and a proposed
    ecological exchange model from the growth and metabolite experiments. Hypotheses
    about cell-wall peptides and natural associations do not demonstrate coisolation
    or equilibrium. Unread supplementary Table S1 contains an ancillary genomic inventory;
    no exact encoded gene claim requires its certification.
  support: supports
  accessed_at: '2026-10-21T17:45:50.419085Z'
  snapshot_sha256: 4cddfcf7f5a4768cb6f9d5ad9047e7af73e943aac6c9933a2623c95a0592ef06
- evidence_id: cultivation-2018
  kind: primary_source
  reference: PMID:29385570
  locator: 'Materials and Methods: Strains, culture media and pre-culture conditions;
    Growth on amino acids and peptides; Figures 1–3 captions'
  summary: 'Algal TAP preculture contains 8 mM ammonium chloride and runs 2–3 days
    at 25 C, continuous light and 120 rpm. Bacterial MeM preculture is distinct: modified
    salts plus potassium nitrate 1 g/L, peptone 2.5 g/L and methanol 0.5%, for 2–3
    days at 25 C and 120 rpm. Experimental CYB has 8 mM indicated amino acid or peptide,
    adjusted pH 7.2±0.1, three CYB washes, initial algal A750 0.025 and bacterial
    A600 0.002, and 250 µL in V-bottom 96-well plates at 25 C under continuous light.
    Figure 1 reads amino acids after 8 days and peptides after 12; Figure 2 illustrates
    the proline pair after 11 days. No numerical light intensity is reported in these
    main methods. Preculture agitation must not be silently transferred to the plate
    assay.'
  support: supports
  accessed_at: '2026-10-21T17:45:50.422582Z'
  snapshot_sha256: 4cddfcf7f5a4768cb6f9d5ad9047e7af73e943aac6c9933a2623c95a0592ef06
- evidence_id: identity-2024
  kind: primary_source
  reference: PMID:38269098
  locator: 'STAR Methods: Key resources table; Experimental model and study participant
    details'
  summary: The later study uses C. reinhardtii CC-5325 and its separate lao1 mutant
    comparison with M. aquaticum GR16T/DSM 16371. These strain and assay contexts
    differ from the 2018 CC-1690/CYB experiment. General ecological discussion about
    phycospheres or rhizospheres does not establish a naturally sampled stable two-member
    community.
  support: supports
  accessed_at: '2026-10-21T17:45:50.425099Z'
  snapshot_sha256: 4fc9862bf561f624bc10f62481e89349c81eda5a0983e6e44cf443ed2afec46b
- evidence_id: algal-production
  kind: primary_source
  reference: PMID:38269098
  locator: 'Results: Chlamydomonas produces IAA from tryptophan using the extracellular
    L-amino acid oxidase LAO1; Figure 1; STAR Methods: LC-MS/MS analysis'
  summary: Wild-type versus lao1 comparisons and HPLC/MS evidence establish algal
    LAO1-dependent production of IAA from supplied tryptophan. The later enzymatic
    route remains incomplete. This source does not establish bacterial IAA production.
    The raw analytical dataset concerns the algal production time course, separately
    from coculture indole depletion.
  support: supports
  accessed_at: '2026-10-21T17:45:50.425926Z'
  snapshot_sha256: 4fc9862bf561f624bc10f62481e89349c81eda5a0983e6e44cf443ed2afec46b
- evidence_id: iaa-cooperation
  kind: primary_source
  reference: PMID:38269098
  locator: 'Results: IAA production in Chlamydomonas facilitates a mutualistic interaction
    with Methylobacterium aquaticum; Figure 3; Discussion; Limitations of the study'
  summary: Coculture depletes the indole signal from supplied IAA and both populations
    attain higher densities than their respective monocultures. Algal photosynthates
    are a proposed enabling factor; the bacterial catabolic pathway and algal contribution
    remain unresolved. Depletion uses Salkowski rather than the production assay’s
    HPLC/MS specificity. The supplied acetate in T-N prevents importing the 2018 autotrophic
    glycerol mechanism as a demonstrated explanation.
  support: supports
  accessed_at: '2026-10-21T17:45:50.426081Z'
  snapshot_sha256: 4fc9862bf561f624bc10f62481e89349c81eda5a0983e6e44cf443ed2afec46b
  quote: both microbes are necessary
- evidence_id: iaa-response
  kind: primary_source
  reference: PMID:38269098
  locator: 'Results: IAA prevents Chlamydomonas from multiplying and attenuates chlorophyll
    degradation under N limitation; Figures 2–3'
  summary: The measured responses are cell multiplication and chlorophyll content/degradation
    under the tested nitrogen-limited conditions. High IAA inhibits multiplication
    and attenuates chlorophyll loss; coculture relieves the displayed IAA-associated
    effects. This is not an assay of general stress survival, ecological keystone
    status or an oxygen-mediated benefit. Source panel crossreferences are imperfect;
    the actual displayed panels and assay descriptions govern the interpretation.
  support: supports
  accessed_at: '2026-10-21T17:45:50.426266Z'
  snapshot_sha256: 4fc9862bf561f624bc10f62481e89349c81eda5a0983e6e44cf443ed2afec46b
- evidence_id: cultivation-2024
  kind: primary_source
  reference: PMID:38269098
  locator: 'STAR Methods: Experimental model and study participant details; Method
    details: Chlamydomonas cell growth tests; Indole-3-acetic acid degradation tests;
    Figure 3 caption'
  summary: Algal TAP preculture is 2–3 days at 23 C under continuous light and 120
    rpm; bacterial MeMT preculture is 2–3 days at 28 C and 150 rpm. T-N is TAP without
    added ammonium, still containing acetate. Cells are washed three times for relevant
    assays. Growth tests use 48-well plates; the depletion protocol states initial
    algal density 1.5×10^6 cells/mL and bacterial A600 0.01 with one-week incubation
    and 120 rpm, while figure-specific captions/readouts use different initial density
    or five-/eight-day endpoints. Preserve source-specific assay attribution rather
