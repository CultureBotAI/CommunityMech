limitations:
- 'Both focal scientific main texts were read: the 2018 coauthor-hosted nine-page
  PDF through the scientific conclusions and the 2024 fresh full XML. Lead viewed
  all five 2018 figures/Table 1, all four 2024 figures and graphical abstract, and
  all 2024 SI tables and nine figures. Root visual scope is separately recorded and
  does not imply it viewed every SI image.'
- The 2018 reciprocal-BLAST supplementary Table S1 was not obtained. No exact gene-inventory
  claim in the current record depends on it; main Figure 4 remains explicitly putative.
  The 2024 Figure360 video was inventoried but not viewed. Completed current-claim
  review does not mean every ancillary asset or deposited raw file was inspected.
- The 2018 abstract overgeneralizes substrate rescue relative to the clear free-L-Hyp
  failure in main Results/Figure 1. The review preserves the exact source distinction
  instead of converting the positive ingredient statement into a supported fact. Hyp-containing
  peptides are different substrates.
- The two papers use different algal strains and experimental media. Natural habitat
  of a source organism, accidental M017 isolation, successful coculture growth and
  a conceptual rhizosphere diagram do not establish natural pair coisolation, stable
  equilibrium or field prevalence.
- 2018 glycerol/ammonium evidence supports source-described exchange but is not exclusive
  isotope-resolved transfer. The 2024 enabling algal factor and bacterial IAA catabolic
  pathway remain unresolved. Salkowski measures acidic indoles and production HPLC/MS
  is a different experiment; no detected ammonium in bacterial monocultures does not
  exclude coculture mineralization.
- 2024 prose/caption panel references and initial density/incubation descriptions
  vary across assays. Preserve exact Methods and actual figure-panel attribution;
  do not merge five-, seven- and eight-day endpoints or use a reagent-incubation temperature
  as a culture range. No new statistical or biochemical reanalysis resolves these
  source differences.
- The broad SYNTROPHIC_PARTNER role does not itself encode the stricter SYNTROPHY
  interaction test. Retaining it as source-qualified metabolic cooperation does not
  assert obligatory dependence or a demonstrated energetic product-removal constraint.
  No exact GTDB identity is available from the bounded local species lookup.
- Cross-Mech identity does not prove study-recipe equivalence. All five encoded routes
  fail at pinned current authorities, but the CCAP TAP ID is recovered at its actual
  path. Four old numbered ingredient aliases remain unresolved; this is not proof
  that they never existed. Chemical candidates do not resolve historical aliases or
  hydrate concentrations.
- Archive work is metadata-only. Mendeley version 1 has preprint-era metadata, and
  MassIVE is Partial Public for the algal analytical production experiment. No file
  completeness, raw spectrum validation, coculture data reuse or code execution is
  claimed.
- All nineteen existing snippets match fresh sources and caches, partitioned as fifteen
  2018 abstract and four 2024 body occurrences. The maintained caches remain abstract-only
  and selected licensed excerpts respectively. Lexical success does not validate their
  incorrect surrounding interpretation. The rights-restricted 2018 PDF/body remains
  scratch-only.
- Current issue 1292 owns the non-graph follow-up; closed 1290 is prior graph-repair
  provenance. Their text is not inherited source certification. Original inspection
  and the exact skill-input extension remain preserved, and all 25 inspected inputs
  are unchanged.
- Eight focused native checks pass; corpus-level diagnostic nonzero exits retain their
  original wider scope. Completeness 90 and raw quality 101/capped 100 are mechanical
  scores, not a declaration that the five source-backed findings are resolved. No
  canonical, cache, history, generated, paid-provider or author-contact action occurred.
notes:
- All 25 official inspected inputs remain unchanged. Original inspection and exact
  skill-input extension are preserved. No canonical, cache, history, generated or
  previously saved artifact was edited.
- Lead and root independently assessed full scientific mains with exact separate SI/visual
  scopes. Child owns immutable native/ontology receipts; sibling owns provenance,
  resources, snippets and score arithmetic.
- Three major and two minor findings give raw quality 101/capped 100; completeness
  is 90. Current-claim completion preserves the explicit optional-source and metadata-only
  limits.
