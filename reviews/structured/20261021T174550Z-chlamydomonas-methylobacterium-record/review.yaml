assessments:
- assessment_id: identity
  area: identity
  topic: Community membership and exact experimental identity
  outcome: concern
  summary: Retain both species while correcting the claimed naturally co-isolated
    stable community.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - identity-2018
  - identity-2024
  - ontology
  - schema
  details: The two studies assemble GR16T with different Chlamydomonas strains. A
    source strain’s drinking-water origin and the separate M017 contaminant do not
    establish joint freshwater isolation. Record the laboratory assembly and exact
    study-strain context. SYNTHETIC origin is supported; optional ecological_state
    can be omitted if no source-supported replacement is available. PHYTOPLANKTON
    can remain as the algae-associated community category without certifying field
    sampling.
- assessment_id: environment
  area: identity
  topic: Environment and nitrogen/light factors
  outcome: concern
  summary: Separate organism habitat context from the actual culture environment.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - identity-2018
  - identity-2024
  - cultivation-2018
  - cultivation-2024
  - schema
  details: The valid freshwater ENVO label is not proof of community provenance. Replace
    or scope environment_term and the Aquatic Environment factor to the experimental
    system without inferring an unmeasured natural habitat. Nitrogen limitation and
    continuous illumination are supported assay conditions; attach their actual Methods
    evidence rather than the broad nitrogen-introduction sentence or generic algal
    growth statement. Do not frame all nitrogen-stress effects as proven IAA mediation.
- assessment_id: taxon-alga
  area: evidence
  topic: 'taxonomy[0]: Chlamydomonas reinhardtii'
  outcome: concern
  summary: PRIMARY_PRODUCER and the species identity are supported; keystone and abundance
    prose are not.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - proline-exchange
  - identity-2018
  - identity-2024
  - schema
  - semantics
  details: Retain carbon fixation as the functional role and NO_GTDB_EQUIVALENT as
    appropriate to a eukaryote. State CC-1690 for the 2018 experiment and CC-5325/its
    lao1 comparison for 2024. Remove unsupported keystone and generalized increased-susceptibility
    interpretations. Move supported role prose out of abundance_value; do not invent
    a rank or quantitative abundance.
- assessment_id: taxon-bacterium
  area: evidence
  topic: 'taxonomy[1]: Methylobacterium aquaticum'
  outcome: concern
  summary: Retain the correct species and broad metabolic-cooperation role, with source-specific
    evidence.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - proline-exchange
  - algal-production
  - iaa-cooperation
  - schema
  - semantics
  - child-source
  details: The 2018 membership/exchange excerpt cannot support an IAA-based explanation.
    Correct bacterial IAA production to algal LAO1-dependent production and coculture-associated
    removal in the later experiment. Do not force a stricter thermodynamic definition
    on the broad SYNTROPHIC_PARTNER role or claim obligacy across all media. Species-level
    GTDB remains UNRESOLVED under the recorded exact-ID/name search; no strain mapping
    is inferred.
- assessment_id: node-proline
  area: evidence
  topic: 'ecological_interactions[0]: Algal Glycerol Provision in Proline-Dependent
    Mutualism'
  outcome: supported
  summary: Retain the condition-specific 2018 mutualism and its evidence.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - proline-exchange
  - proline-model
  - cultivation-2018
  details: The node correctly separates the CYB/proline/CC-1690 observations from
    oxygen benefit and 2024 IAA turnover. Metabolite measurements and glycerol supplementation
    support the source-described exchange without requiring new exclusive-flux or
    gene-causality claims. Its PARTIAL later-source excerpt is explicitly a mechanistic
    proposal.
- assessment_id: edge-photosynthate
  area: evidence
  topic: ecological_interactions[0].downstream[0]
  outcome: supported
  summary: Retain HYPOTHESIZED photosynthate support for later cooperative removal.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - proline-exchange
  - iaa-cooperation
  - cultivation-2024
  details: This link crosses distinct experimental contexts and already says that
    glycerol from the 2018 assay is not proven as the 2024 mediator. Acetate is supplied
    in T-N, and alternative algal metabolites/proteins remain possible. Do not upgrade
    the edge to demonstrated necessity or replace the mediator with oxygen.
- assessment_id: node-iaa
  area: evidence
  topic: 'ecological_interactions[1]: Cooperative IAA Degradation'
  outcome: supported
  summary: Retain reciprocal supplied-IAA growth and coculture-specific removal with
    its analytical limit.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - algal-production
  - iaa-cooperation
  - si-2024
  details: The node correctly attributes IAA production to the alga and does not identify
    the bacterial catabolic pathway. Salkowski indole reactivity is distinct from
    production HPLC/MS. Table S3 concerns monocultures only and does not exclude coculture
    nitrogen mineralization. Broad GO indole-catabolism annotation does not certify
    an exact IAA enzyme pathway.
- assessment_id: edge-response
  area: evidence
  topic: ecological_interactions[1].downstream[0]
  outcome: supported
  summary: Retain PARTIAL support for removal-associated cell-division and chlorophyll
    effects.
  target_ids:
  - CommunityMech:000015
  evidence_ids:
  - iaa-response
  - iaa-cooperation
  - si-2024
  details: IAA addition and coculture comparisons support the displayed response,
    while mediator necessity and exact pathway remain unresolved. No generic survival
    mechanism or broad ecological stress resilience follows. The edge does not require
    another node or stronger support tag.
- assessment_id: node-response
  area: evidence
  topic: 'ecological_interactions[2]: IAA-Associated Algal Cell Division and Chlorophyll
    Responses'
  outcome: supported
  summary: Retain the untyped community-level response node with its current limits.
