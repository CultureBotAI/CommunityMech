limitations:
- Partial technical diagnostic with scientific_review:false. Native validator success
  does not establish full scientific approval, fresh source-snippet certification,
  generated-product verification, aggregate QC completion or closure of earlier findings.
- Primary coverage consists of selected retained Methods single-strain/constructed-community
  experiments, whole-genome sequencing, strain annotation and in-situ design; Group41
  Results, genomic annotation, in-situ outcomes, Conclusion and data availability.
  Separate supplementary tables, original figure pixels, raw sequence data and deposited
  study assemblies were not independently audited. This is not a fresh complete paper
  or stock-collection review.
- The five optimized stocks remain distinct from the initial seven-member designs.
  Source whole-genome sequencing statements and BioProject PRJNA1297957 do not establish
  an independently checked assembly-to-stock or crosswalk-genome match. All stock
  strings and original NCBI names remain unchanged.
- Native species reference totals and majority fractions are L. delbrueckii 5812 total376/fraction1.0,
  P. acetatigenes 6076 total1/fraction1.0, E. lactis 6088 total574/fraction0.99 and
  P. mucosa 6360 total7/fraction1.0. These are totals and fractions, not explicit
  support numerators, experimental abundances, animal replication, bag counts or probabilities
  of source-stock placement. No numerator is reconstructed from a rounded fraction.
- L. delbrueckii uses a species-name fallback at the existing species anchor, without
  importing a subspecies grounding from another record. The other three routes use
  exact NCBI species IDs. Enterococcus_B lactis is a reference label, not a rename
  of stock 6088. Index0 S. equinus 5640 and all three equinus/pasteurianus/ruminicola
  alternatives remain unchanged; no source-genome adjudication was performed.
- Significant Group41 laboratory NDFD remains distinct from null dry-matter/gas endpoints,
  added-suspension concentrations from final-bottle concentrations, and genomic annotation
  from measured expression, flux or exchange. Cattle outcomes retain time-specific
  effects, nonsignificant 72-hour fiber trends and three animals per group; nested
  bags do not become independent animals. Durable engraftment and taxon-specific animal
  effects remain unproved. No node, arrow, phenotype or mechanistic claim is added.
- Captured issue1655 is CLOSED after an earlier graph correction; captured issue1658
  is OPEN and retains the non-graph provenance-vocabulary discrepancy. These snapshots
  are bounded historical evidence, not fresh issue-state checks at diagnostic save
  time. Current native schema/strict success does not erase that semantic limitation
  or establish a demonstrated validator failure.
- Crosswalk SHA256 761d5537 identifies exact bytes without an established release
  or chronology. Native mapping_source reflects file mtime, not release provenance.
  Local NCBI label/rank observations retain database identity/stat rather than a full
  database digest or certified release.
- Source preparation used its recorded earlier revision; actual M5 staging, application
  and all eight native commands used c9bb51a8b2a5591400dc8f170f043e59642116ce with
  Python 3.13.2 on named isolated branch review/gtdb-final-four-m5-20261116. The execution
  tree contains applied records and is not a clean-HEAD aggregate QC run. Local mirroring
  is a verified copy of actual M5 bytes, not a separate local application.
- Four statuses changed among five processed descriptors. Two native inline events
  and one native sidecar preserve previous history. Older unresolved-grounding notes
  remain historical observations, not a claim that the newly mapped descriptors still
  lack current correspondences. Later strict batch79 admission must authenticate the
  bounded current transition before projecting only its old hash/latest-event expectations,
  retaining current biology, other records and the separate Okeke historical handling.
- The native term command explicitly passed but did not emit an assertion denominator;
  none is invented. Complete saved-input checkpoints, public proof export, strict
  historical admission, current measured source comparisons, generated products and
  final combined QC remain separate required steps.
