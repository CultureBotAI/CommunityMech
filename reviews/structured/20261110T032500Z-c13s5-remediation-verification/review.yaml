findings:
- finding_id: c13s4-000424-qy2s1-bfr-consortium-abundance-levels
  issue_key: c13s4-000424-qy2s1-bfr-consortium-abundance-levels
  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: All four reductive-dehalogenation consortium members in QY2S1_Dehalogenimonas_BFR_Bioremediation_Consortium
    (CommunityMech:000424) populate free-text abundance_value but omit controlled abundance_level despite
    explicit phylum and genus dominance in PMID:42511722
  description: 'In kb/communities/QY2S1_Dehalogenimonas_BFR_Bioremediation_Consortium.yaml (CommunityMech:000424),
    Dehalogenimonas (taxonomy[0], NCBITaxon:670486, functional_role: [PRIMARY_DEGRADER, SYNTROPHIC_PARTNER]),
    Clostridium (taxonomy[1], NCBITaxon:1485, functional_role: [SECONDARY_FERMENTER, SYNTROPHIC_PARTNER]),
    Sedimentibacter (taxonomy[2], NCBITaxon:190972, functional_role: [SECONDARY_FERMENTER, SYNTROPHIC_PARTNER]),
    and Methanoculleus (taxonomy[3], NCBITaxon:45989, functional_role: [SYNTROPHIC_PARTNER, ELECTRON_ACCEPTOR])
    all populate free-text abundance_value strings but omit the controlled abundance_level enum. The cited
    open-access study (PMID:42511722, doi:10.3390/ijms27146379) explicitly establishes that ''More detailed
    analysis revealed a consistent microbial community composition among different systems, predominantly
    composed of the phyla Bacillota (formerly Firmicutes; 43.84 ± 3.76%~54.15 ± 7.28%), Chloroflexota
    (19.70 ± 4.90%~29.33 ± 5.27%), and Halobacteriota (11.72 ± 4.57%~27.33 ± 9.08%). At the genus level,
    these phyla were mainly represented by Clostridium and Sedimentibacter (class Clostridia) as the dominant
    fermenters, along with Dehalogenimonas (class Dehalococcoidia) as the key functional OHRB, and Methanoculleus
    (class Methanomicrobia) as the primary methanogens.'' Setting abundance_level: DOMINANT on taxonomy[0..3]
    raises the review-communities s_ab abundance_level rubric component from 0/5 to 5/5 (0/4 -> 4/4 taxa
    with abundance_level; proportional Completeness Score 95/100 -> 100/100; scripts/audit_completeness.py
    score 90/100).'
