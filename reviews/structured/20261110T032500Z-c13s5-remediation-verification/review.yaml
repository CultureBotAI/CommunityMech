- finding_id: c12s4-000374-achromobacter-enterobacter-sl8-sl12-functional-roles
  issue_key: c12s4-000374-achromobacter-enterobacter-sl8-sl12-functional-roles
  category: completeness
  severity: minor
  status: deferred
  certainty: confirmed
  title: Both cadmium-immobilizing coculture members in Achromobacter_Enterobacter_SL8_SL12_Cadmium_Immobilization_Coculture
    (CommunityMech:000374) omit functional_role despite direct Cd-detoxification support in PMID:42307251
  description: 'In kb/communities/Achromobacter_Enterobacter_SL8_SL12_Cadmium_Immobilization_Coculture.yaml
    (CommunityMech:000374), both Achromobacter sp. SL8 (taxonomy[0], NCBITaxon:222, abundance_level: DOMINANT)
    and Enterobacter sp. SL12 (taxonomy[1], NCBITaxon:547, abundance_level: DOMINANT) omit functional_role,
    despite direct Cd-detoxification and Cd-immobilization support in the cited open-access study (PMID:42307251,
    doi:10.1128/spectrum.01081-26: ''After a 7-day incubation period, RE-Cd values reached 82.6% and 69.55%
    for SL8, 63.4% and 70.8% for SL12, and 82.6% and 80.9% for the co-cultured strains at initial Cd concentrations
    of 50 mg/L and 100 mg/L, respectively.''). Setting functional_role: [PRIMARY_DEGRADER] on both taxonomy[0]
    and taxonomy[1] raises the review-communities s_fr functional_role rubric component from 0/10 to 10/10
    (Completeness Score 90/100 -> 100/100) and raises scripts/audit_completeness.py:calculate_completeness()
    from 40/100 to 90/100.'
  target_ids:
  - CommunityMech:000374
  field_paths:
  - taxonomy[0].functional_role
  - taxonomy[1].functional_role
  evidence_ids:
  - ev-c13s5-schema-validation
  - ev-c13s5-primary-sources
  rule_id: review-yaml-record:taxonomy-functional-role-completeness
  native_severity: P3
  normalization_reason: 'P3 minor under #2194 and schema policy #301: missing structured FunctionalRoleEnum
    value because PRIMARY_DEGRADER (''Degrades complex substrates'') does not match inorganic Cd2+ immobilization;
    schema permits omitting functional_role while abundance_value and ecological_interactions retain the
    supported heavy-metal immobilization process.'
  owner_paths:
  - repository: CultureBotAI/CommunityMech
    path: kb/communities/Achromobacter_Enterobacter_SL8_SL12_Cadmium_Immobilization_Coculture.yaml
    role: canonical_record
  tags:
  - actionable
  - stage5-candidate
  - functional-role
  - completeness
  disposition_reason: 'Deferred under existing open GitHub issue #2194 (and schema policy #301): FunctionalRoleEnum.PRIMARY_DEGRADER
    is defined in src/communitymech/schema/communitymech.yaml as ''Degrades complex substrates'' and must
    not be forced onto inorganic Cd2+ immobilization via CdS bioprecipitation, intracellular Cd accumulation,
    and N-H / amide C=O surface coordination (PMID:42307251). Preserved as an explicit vocabulary gap
    until FunctionalRoleEnum adds a heavy-metal-immobilizer / metal-detoxifier value.'
  external_issues:
