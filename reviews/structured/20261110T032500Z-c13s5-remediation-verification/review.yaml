- finding_id: c13s4-000438-wine-yeast-contact-consortium-abundance-levels
  issue_key: c13s4-000438-wine-yeast-contact-consortium-abundance-levels
  category: completeness
  severity: major
  status: resolved
  certainty: confirmed
  title: All three defined wine-yeast consortium members in Wine_Yeast_ThreeSpecies_Contact_Consortium
    (CommunityMech:000438) omit abundance_level despite explicit equimolar inoculation and 12-h population
    measurements in PMID:42176030
  description: 'In kb/communities/Wine_Yeast_ThreeSpecies_Contact_Consortium.yaml (CommunityMech:000438),
    Saccharomyces cerevisiae VIN13 (taxonomy[0], NCBITaxon:4932, functional_role: [SECONDARY_FERMENTER]),
    Lachancea thermotolerans IWBT Y1240 (taxonomy[1], NCBITaxon:381046, functional_role: [SECONDARY_FERMENTER]),
    and Torulaspora delbrueckii LO544 (taxonomy[2], NCBITaxon:4950, functional_role: [SECONDARY_FERMENTER])
    all omit abundance_level. The cited open-access study (PMID:42176030, doi:10.1007/s00253-026-13856-4)
    explicitly establishes that each species was inoculated at ca. 5 × 10^6 cells/mL (total 1.6 × 10^7
    cells/mL) and that in direct physical contact at 12 h ''S. cerevisiae reached maximum cell numbers
    of 3.7 × 107 cells/mL, while both non-Saccharomyces species reached ca. 2.5 × 107 cells/mL (Fig. 3
    b)'', establishing sole numerical dominance of S. cerevisiae in the direct-contact consortium (whereas
    in indirect contact, T. delbrueckii showed rapid growth and early numerical dominance before T. delbrueckii
    and S. cerevisiae both reached ca. 3 × 10^7 cells/mL compared to ca. 1 × 10^7 cells/mL for L. thermotolerans).
    Setting abundance_level: DOMINANT on taxonomy[0] (anchored to the direct physical contact consortium
