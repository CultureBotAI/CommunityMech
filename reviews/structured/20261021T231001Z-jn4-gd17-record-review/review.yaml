limitations:
- Whole 55,171-character 2019 projection, all 49 references, seven main figures, three
  SI figures and complete primer table were read. The 2016 hydrogen paper remains
  abstract-only; the 2008 publication has bounded metadata/indexed abstract/Introduction
  coverage, not a full-body review.
- 2016 article/PDF requests returned Client Challenge HTML, not full text. The 2008
  API returned bibliographic coredata only. Bounded public discovery/access projections
  did not recover a body; no paid access, contact or challenge bypass was attempted.
- The 2019 reference 19 incorrectly attaches the 2016 PMID to the 2008 DOI; canonical
  identities already separate them. S1 lane-G caption name and repeated licB primer
  rows are source irregularities, not new community members or validated sequence
  deposits.
- Community products, independent monoculture conversion, genomic proportions, protein-derived
  biomass and transcription are distinct assays. No numerical, sequence or raw-image
  reanalysis establishes partner-specific flux, viable counts or selective stimulant
  causality.
- Direct CGMCC catalogue entries were not resolved in bounded searches. Source-reported
  collection identifiers and current species mappings remain valid at their declared
  scopes; no global stock/strain absence or culture-protocol equivalence is claimed.
- Lead and root complete-source scopes are recorded separately from child selected-section
  authority reading and sibling complete-cache/current-issue reading. Optional adapter
  discovery is explicitly reused with current runtime compatibility; no other-checkout
  execution or later-record assessment.
