evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Clostridium_Thermoanaerobacterium_JN4_GD17_Cellulosic_Biofuel_Coculture.yaml
  locator: Whole maintained YAML
  summary: The defined JN4–GD17 pair has three untyped interaction nodes, two qualified
    arrows and explicit limits on inferred carbon flux, estimated biomass and stimulant
    perturbations.
  support: supports
  accessed_at: '2026-10-21T23:10:01.812969Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Materials and Methods → Strains and Chemicals, paragraph 1; Results → Enhanced
    End-Product Formation in C. thermocellum JN4-T. thermosaccharolyticum GD17 Coculture,
    paragraph 1
  summary: The paper identifies JN4 as CGMCC 1.5210 and GD17 as CGMCC 1.5209. The
    reconstructed consortium starts at a 1:1 cell ratio and is passaged at least five
    times. Natural co-isolation history does not negate the engineered experimental
    pair. Penicillium cellulase is an analytical reagent, not a third member.
  support: supports
  accessed_at: '2026-10-21T23:10:01.813237Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: recipe
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Materials and Methods → Bacterial Growth, sole paragraph
  summary: 'The CTFUD formulation lists per liter: sodium citrate tribasic dihydrate
    3.0 g; ammonium sulfate 1.3 g; potassium phosphate monobasic 1.5 g; calcium chloride
    dihydrate 0.13 g; L-cysteine-HCl 0.5 g; MOPS sodium salt 11.6 g; magnesium chloride
    hexahydrate 2.6 g; ferrous sulfate heptahydrate 0.001 g; cellobiose 5.0 g; yeast
    extract 4.5 g; resazurin 0.5 mL. The resazurin stock strength is unstated. Substrate
    substitutions must be represented as assay arms, not as all three substrates jointly
    supplied.'
  support: supports
  accessed_at: '2026-10-21T23:10:01.813834Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: growth
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Materials and Methods → Bacterial Growth, sole paragraph
  summary: JN4, GD17 and their reconstructed coculture are grown anaerobically in
    tubes/serum bottles at 60 °C without agitation. Carbon source is 0.5%; Avicel
    plus dextrin or sucrose treatments contain 0.5% of each. Seed inoculum is 10%
    v/v. These facts do not explain why static operation was selected, specify headspace
    composition or establish culture pH.
  support: supports
  accessed_at: '2026-10-21T23:10:01.813933Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
  quote: without agitation
- evidence_id: volumes
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Materials and Methods → Analytical Methods, paragraph 3
  summary: Cellulose-grown JN4 monocultures and cocultures use 80 mL, inoculated with
    10% cellulose-grown seed. Glucose/cellobiose conversion comparisons use 50 mL
    member monocultures and matching sugar-grown seed. The statement that no working
    volume is reported is false; neither volume is a universal container capacity
    or all-experiment volume.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814008Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: analytical
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Materials and Methods → Strains and Chemicals, paragraph 2; Analytical
    Methods, paragraphs 1–2
  summary: Glucose, cellobiose, lactate, acetate and ethanol are measured by HPLC
    in this paper. Residual cellulose uses acid or enzymatic analysis. Citrate buffer
    pH 4.8, 45 °C hydrolysis for six days, 105 °C drying and 200 rpm corncob milling
    are preparation/analysis conditions, not cultivation settings.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814076Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: products
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Results → Enhanced End-Product Formation in C. thermocellum JN4-T. thermosaccharolyticum
    GD17 Coculture, paragraph 2; Surprisingly Unchanged Cellulose Utilization in Coculture
    versus Monoculture; Figures 1 and 3
  summary: Lactate, acetate and ethanol formation increases in the cellulose coculture
    relative to JN4 alone, while overall cellulose utilization does not improve. This
    supports ecological_interactions[0] as a community output with both participants;
    cellulose remains upstream feedstock, not a demonstrated donated currency.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814147Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: sugar-model
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Results → Derepression of Lignocellulose Degradation-Related Genes in Coculture
    Compared With Monoculture; Competitive Metabolic Advantage of T. thermosaccharolyticum
    GD17 Over C. thermocellum JN4; Figures 2 and 5
  summary: Lower soluble sugar pools, transcription and faster separate GD17 monoculture
    conversion support the proposed resource-competition model. They do not directly
    trace JN4-to-GD17 carbon or isolate its contribution to community products. Retain
    ecological_interactions[1] and its downstream[0] PARTIAL qualification; the literal
    COMPETITION enum requires both negatively affected, which these assays do not
    establish.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814215Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: biomass
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Materials and Methods → Relationship Between OD600 and Intracellular Protein
    Content; Biomass and Bacterial Ratio Determination; Results → T. thermosaccharolyticum
    GD17 Significantly Hampers the Growth of C. thermocellum JN4 on Cellulose and
    Corncob; Figure 4
  summary: JN4 biomass is estimated from total intracellular protein, an OD/protein
    relation and genomic taxon proportions. 16S rDNA composition is measured at 24
    h for cellulose/corncob but 12 h for stimulant conditions. These estimates are
    not direct viable-cell counts or a complete species-resolved growth curve. Existing
    ecological_interactions[2] limits are appropriate.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814282Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: stimulants
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Results → Re-balancing the Synthetic Microbial Consortium Comprising C.
    thermocellum JN4 and T. thermosaccharolyticum GD17 for Modulating Cellulosic Conversion;
    Figure 7; Supplementary Figure S3
  summary: Dextrin/sucrose support much stronger GD17 growth, lower the JN4 genomic
    fraction and nearly stop cellulose degradation. Added substrates also supply carbon,
    and sampling times differ. Retain ecological_interactions[2].downstream[0] as
    a partial constraint on cellulose-derived contribution, not a measured reduction
    in total products or a selective mediator intervention.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814353Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: xylose
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Results → T. thermosaccharolyticum GD17 Significantly Hampers the Growth
    of C. thermocellum JN4 on Cellulose and Corncob, paragraph 2; Figure 6B; reference
    3
  summary: Weak GD17 corncob growth accompanies an explicitly proposed hemicellulose-to-xylose
    benefit. Figure 6 is a tentative model. Reference 3 concerns Thermoanaerobacterium
    strain NOI-1, not GD17. The source does not directly quantify GD17 xylose release
    or transfer to JN4; qualify related_ingredients[3] without asserting impossibility.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814520Z'
  snapshot_sha256: 8c035478025c2fad39825a1f810184b58eb435cf92e628ac1af912ce37404e10
- evidence_id: hydrogen
  kind: primary_source
  reference: PMID:27538932; DOI:10.1007/s00253-016-7776-1
  locator: Fresh Europe PMC abstract, hydrogenase/transcription and metabolic comparison
  summary: The abstract reports a four-to-twelvefold higher hydrogen production rate
    for T. thermosaccharolyticum and suggests its changes account for coculture improvement.
    Genomic hydrogenase inventory, transcription and metabolic measurements are distinct
    methods. Full-body assay conditions and causality remain inaccessible; no new
    partner-resolved flux or recipe is certified.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814619Z'
  snapshot_sha256: 39ec98c5cdf58ed5a4b62accf97927df68379e6d629f25e9e4eb22352adefa8a
- evidence_id: bibliography
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
  locator: Reference 19, compared with fresh 2016 MED identity and 2008 bibliographic
    coredata
  summary: The 2019 reference attaches PMID 27538932 to Liu’s 2008 DOI 10.1016/j.ijhydene.2008.04.004,
    although that PMID identifies the separate 2016 hydrogenase paper. Canonical resources
    already distinguish the works. Preserve this source bibliography conflict and
    avoid transferring the 2008 product profile to the 2019 experiment.
  support: supports
  accessed_at: '2026-10-21T23:10:01.814781Z'
  snapshot_sha256: 4444e9f62bcd84b793428b176679390c7c52ff8d9f87e7d5610a3c167d3b8312
- evidence_id: supplement
  kind: primary_source
  reference: PMID:31551972; DOI:10.3389/fmicb.2019.02035
