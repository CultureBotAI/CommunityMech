    adds A at 1 g/L, then B at 3 g/L after 12 h. Triple adds C at 1 g/L for 12 h aerobic
    hydrolysate pretreatment at 30 °C/200 rpm, then A at 1 g/L at 50 °C/150 rpm anaerobically
    and B at 3 g/L another 12 h later. Distinguish the separate 12-h LB starter. pH
    7.2 is initial formulation, with CaCO3 at 0.5 g/g sugar for regulation. Broad
    ENVO bioreactor is compatible; make the actual shake-flask setting explicit rather
    than infer an instrumented reactor.
