limitations:
- Completed scientific scope covers the currently encoded claims using the current
  main, complete scientific DOCX supplement and all eleven figures. Both downloaded
  video-abstract variants were not viewed. Lead did not exhaustively read the main
  bibliography or all 70 raw archive metadata records; sibling audited the latter.
  No raw sequencing or statistical reproduction occurred.
- The accepted manuscript was checked only at selected pages for quotation/version
  provenance. Lead viewed pages 9, 10, 19 and 21; root also viewed page 18. Watermark-interleaved
  extraction and internal acronym spacing are explicit projections, not strict global
  whitespace equality.
- 'Current source accounting is 23 excerpt occurrences: 13 strict XML/DOCX matches,
  nine typography/range projections and one differently worded final data statement
  with verified accepted-version support. All 23 match their appropriate selected
  caches. This is not 23 strict current-XML matches. Eight native supplement-routing
  errors remain failed.'
- Equal OD/equal-ratio preparation does not establish equal viable cell fractions
  or endpoint ecological dominance. Targeted V3–V4 ASVs do not uniquely identify viable
  persistent isolates. The existing three-member detection in LAV and no detection
  in HAV must remain separate from known five-member inoculum composition.
- Residual-DEHP disappearance is not complete mineralization. Pot soil and plant concentrations
  do not isolate biodegradation, strain contribution, complementarity or causal mediation.
  Compatible colonies do not demonstrate mutualism, and Gordonia lacks marked significance
  in the individual chemotaxis panel.
- Current Methods and Results retain ten-day versus two-week endpoints. Figure 4A
  is SynLAV and 4B SynHAV despite occasional prose cross-reference confusion. Source
  S2/S4 phylum mistakes must not be silently corrected inside quotations or imported
  into ontology IDs.
- Isolation, pairwise screening, OD normalization, pot inoculation, discovery soil
  characterization, Biolog and chemotaxis are distinct stages. Field-soil pH is not
  controlled culture pH; discovery root-bag dimensions and 45-day sampling are not
  established focal cross-inoculation settings.
- GTDB candidates are genus aggregates, not study-strain genomic classifications.
  PRJNA1263734 spans both experiments and SynComs; archive counts and generic library-source
  labels do not establish isolate genomes or experimental replicate counts.
- Native schema/strict/term/GTDB/domain/history/cache-name checks passed; references
  failed. Broader batch 11 corpus diagnostics retain their actual nonzero results.
  Completeness 80 and capped quality 100/raw 127 do not override evidence limitations
  or failed gates. No paid request, external contact, later-record assessment or canonical
  mutation occurred.
notes:
- All 30 official inputs remain unchanged; separately discovered README/loader process
  context is explicitly pinned without replacing inspect.
- Initial/final native summaries and preliminary/final support use distinct immutable
  files. The exact source-selector clarification preserves original source receipt
  bytes.
- Zero major and four minor findings; completeness 80, quality 100/raw 127. Root and
  sibling whole-candidate checks precede persistence.
