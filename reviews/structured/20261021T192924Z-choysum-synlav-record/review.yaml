evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Choysum_SynLAV_DEHP_Rhizobacterial_SynCom.yaml
  locator: Entire maintained YAML
  summary: Five genus-level SynLAV isolates, two qualified community outcome nodes
    and one hypothetical arrow; MSM screening medium, pot inoculation design and one
    amplicon project are encoded. The host remains outside microbial membership.
  support: supports
  accessed_at: '2026-10-21T19:29:24.451599Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Results: Construction of the variety-specific rhizobacterial SynCom; Supplementary
    Table S2; Figure 6'
  summary: The focal prepared consortium contains Flavobacterium L11, Pseudomonas
    L29, Sphingomonas L75, Rhodococcus L44 and Gordonia L115 from the low-accumulation
    choysum rhizosphere. SynHAV is a comparator and does not expand focal membership.
    Five genera were deliberately selected from cultured isolates; strain codes are
    study-local, not collection or species identifiers.
  support: supports
  accessed_at: '2026-10-21T19:29:24.451665Z'
  snapshot_sha256: 942d12a1472eae571113fb8d7f1c66379a56750f2e62fe38c850e0f10c7e5153
- evidence_id: isolate-roles
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Materials and methods: Isolation and functional characterization of rhizosphere
    bacteria; Supplementary Tables S1 and S2'
  summary: Individual residual-DEHP assays used 100 mg/L in MSM at 28 C and 180 rpm
    for 72 hours, in triplicate. Table S2 reports L11/L29/L75/L44/L115 at 22/46/37/54/42
    percent, respectively. These support source-attributed degrader roles without
    establishing complete mineralization, pathways, community complementarity or the
    strains responsible for pot disappearance.
  support: supports
  accessed_at: '2026-10-21T19:29:24.451920Z'
  snapshot_sha256: 942d12a1472eae571113fb8d7f1c66379a56750f2e62fe38c850e0f10c7e5153
- evidence_id: roster-table
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: Supplementary Table S2, all ten isolate rows and footnotes
  summary: All five SynLAV and five comparator rows were read. Source phylum assignments
    for Flavobacterium and Sphingomonas are incorrect and must remain attributed quoted
    cells rather than ontology facts. L11 has IAA, L29 P, L75 P/NF entries; no mandatory
    additional PGP roles are inferred from these assay annotations.
  support: supports
  accessed_at: '2026-10-21T19:29:24.452016Z'
  snapshot_sha256: b2bb1b0ef8add159b8e4d542e419cdd6c8442edd37633ecb6661fae9091ae937
- evidence_id: assembly
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Materials and methods: Construction of synthetic communities and their
    functional evaluation; Supplementary Figure S4'
  summary: LB suspensions for the non-antagonism screen were adjusted to OD600 1.0;
    0.5 microlitre spots at 0.6 or 1.2 cm were compared after 2–4 days. Compatible
    colony growth is not reciprocal benefit. Selected suspensions were normalized
    in PBS to OD600 0.5 and combined in equal ratios. This supports co-equal prepared-design
    prominence, not measured equal viable-cell fractions.
  support: supports
  accessed_at: '2026-10-21T19:29:24.455219Z'
  snapshot_sha256: 942d12a1472eae571113fb8d7f1c66379a56750f2e62fe38c850e0f10c7e5153
  quote: mixing the isolates in equal ratios
- evidence_id: pot-protocol
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Materials and methods: Cross-inoculation experiment and validation of
    chemotactic preference; Design of pot experiments; Supplementary Figure S2'
  summary: Two-week seedlings were transferred to 100 mg/kg DEHP soil and received
    5 mL final OD600 0.2 suspension in PBS; the paper approximates 10^5 CFU/mL without
    a strain-specific viability calibration here. PBS controls and triplicate treatments
    were used. The explicit greenhouse cross-reference supplies 25–32 C, 60 percent
    relative humidity and natural day/night. Methods says ten days; Results says two
    weeks, including the final published version.
  support: supports
  accessed_at: '2026-10-21T19:29:24.455335Z'
  snapshot_sha256: 942d12a1472eae571113fb8d7f1c66379a56750f2e62fe38c850e0f10c7e5153
- evidence_id: discovery-stage
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Materials and methods: Design of pot experiments; Supplementary Text S1
    and Figure S1'
  summary: The preceding discovery experiment used 0, 20 and 100 mg/kg DEHP, two varieties
    and unplanted controls, root bags, five replicates and 45-day sampling. Its root-bag
    dimensions and soil masses are not established for the later cross-inoculation
    experiment. Supplement Text S1 soil pH 5.47 and carbon/N/P characterize sampled
    field soil, not controlled community culture pH.
  support: supports
  accessed_at: '2026-10-21T19:29:24.455430Z'
  snapshot_sha256: 942d12a1472eae571113fb8d7f1c66379a56750f2e62fe38c850e0f10c7e5153
- evidence_id: media
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Supplementary Table S1, all nine media rows; Materials and methods: Isolation
    and functional characterization of rhizosphere bacteria'
  summary: MSM per litre contains K2HPO4 1.5 g, KH2PO4 0.5 g, (NH4)2SO4 0.5 g, MgSO4·7H2O
    0.2 g and NaCl 1.0 g, pH 7. Existing canonical values are correct for isolate
    screening. R2A/TSA/LB isolation at 28 C, subsequent R2A streaking and other PGP
    assay media are distinct stages. The source-named LB formulation is casein 10
    g, yeast extract 5 g and NaCl 10 g per litre, pH 7.2; no exact cross-Mech recipe
    equivalence is inferred.
  support: supports
  accessed_at: '2026-10-21T19:29:24.455529Z'
  snapshot_sha256: b2bb1b0ef8add159b8e4d542e419cdd6c8442edd37633ecb6661fae9091ae937
- evidence_id: outcomes
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Results: Consequences of SynCom inoculation in two choysum varieties;
    Figure 4A; Materials and methods: Extraction and determination of DEHP in plant
    and soil'
  summary: 'Figure 4A is the focal SynLAV treatment: soil residual concentration and
    plant concentration decrease relative to PBS controls in both varieties. Plant
    units are mg/kg, not total accumulated mass. The source prose occasionally points
    to panel A while discussing comparator SynHAV, but image labels distinguish A
    from B. Existing graph qualifications correctly avoid assigning mineralization,
    individual strain contribution or a demonstrated soil-to-plant mediator.'
  support: supports
  accessed_at: '2026-10-21T19:29:24.458014Z'
  snapshot_sha256: 942d12a1472eae571113fb8d7f1c66379a56750f2e62fe38c850e0f10c7e5153
- evidence_id: presence
  kind: primary_source
  reference: PMID:42482240; doi:10.1186/s40168-026-02470-1
  locator: 'Results: Consequences of SynCom inoculation in two choysum varieties;
