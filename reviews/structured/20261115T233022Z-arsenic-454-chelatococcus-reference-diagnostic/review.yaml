limitations:
- Partial technical diagnostic with scientific_review:false. Native checks do not
  establish full scientific review, measured snippet validation, current generated
  products, aggregate QC or campaign completion.
- Coverage is the complete retained PMID42468699 abstract, whole canonical record
  and historical batch120/C8S5 source context. No new full article, supplementary
  materials, original NanoSIMS image, raw isotope measurement, experimental assembly
  or complete cultivation recipe was audited. Historical access limitations are not
  a fresh exhaustive claim of absence.
- The exact NCBI3034027 route supplies total_genomes1 and majority_fraction1.0 without
  an explicit support_genomes numerator. It is not a measured replicate count, abundance
  fraction or independently verified XZ-Ab1 genome. GTDB Chelatococcus_A sambhunathii
  is reference correspondence, not a formal species identification asserted by the
  primary abstract.
- Preserve Chelatococcus sp. XZ-Ab1 and the quoted source identity Thermoleptolyngbya
  sichuanensis XZ-Cy5. The unselected NCBI3031812 descriptor retains its native null/UNRESOLVED
  state. Missing crosswalk correspondence neither proves organism absence nor negates
  the positive carbon-tracer or reciprocal-growth results.
- Both DOMINANT abundance labels retain ordinal co-equal prominence, not measured
  percentages or a biomass ratio. Both stocks, two pairwise ecological nodes, zero
  downstream arrows, descriptions, evidence and two OPEN knowledge gaps remain unchanged.
- The abstract reports direct photoautotroph-derived carbon transfer after13CO2 NanoSIMS
  tracing. Preserve that result without naming an exchanged molecule, tracing nitrogen,
  or claiming demonstrated cyanobacterial oxygen supply. Supplemented heterotroph
  monoculture and genomic interpretation are distinct from route-specific coculture
  measurements.
- The5mM arsenite exposure refers to growing cyanobacterial monoculture, not an established
  coculture concentration series. Exact medium, temperature, light, inoculum densities
  and time points remain unresolved in the retained culture-conditions discussion.
- Closed issues1931 and2514 document earlier graph and abundance repairs, respectively.
  Their closure does not close the two current scientific discussions or certify this
  new mapping. Actual issue snapshots remain captured source inputs.
- Actual staging, application and all eight native commands ran at frozen M5 bfef6b2a7684bfc4bb4a22fb1b1234faf797536b
  with Python3.13.2. Eight free plans preceded eight serial actual gates. The CLI
  visited two descriptors but the native status event records one changed entry; the
  unselected descriptor stayed exact.
- Crosswalk761 identifies bytes with an unestablished release. NCBI authority provenance
  is file identity/stat rather than a full database digest. Preserve batch120's original
  bc09-to-C8S5a16d chain, its supersedes_review assertions, the independent106 C14S5
  chain and all other current biological predicates. Full checkpoints precede caller
  changes.
