  selected 19-isolate community and positive treatment outcomes. Two major findings
  concern graph direction/causation and non-graph role, metabolite-origin and endpoint
  scope. Three minor findings concern protocol/member traceability, GTDB grounding/provenance
  and data resources. All eight focused native checks pass; literal completeness 70
  and capped quality 100 do not certify a clean biological record.
