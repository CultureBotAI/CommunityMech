evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Cucumber_Low_Phosphorus_Cross_Kingdom_Biocontrol_SynCom.yaml
  locator: Whole maintained YAML
  summary: The record represents 13 bacterial and six fungal isolates through six
    genus descriptors, with three typed interaction nodes and two downstream arrows.
    Positive community outcomes are supported, while pair direction, causal scope
    and several non-graph claims require repair.
  support: supports
  accessed_at: '2026-10-22T02:14:09.739816Z'
- evidence_id: membership
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Results / Exploring low phosphorus-mediated rhizosphere cross-kingdom interactions
    and disease suppression, paragraph 1; Figure 6A–B; Supplementary Table S9 and
    Figure S9
  summary: The final community contains six Bacillus, three Cupriavidus, two Sphingopyxis,
    two Devosia, five Aspergillus and one source Amesia isolate. Final bacterial codes
    are B1, B2, B3, B4, B9, B10, B11, B12, B13, B16, B17, B18 and B19; fungal codes
    F2, F3, F4, F5, F7 and F8. Table S9 contains 28 screened marker sequences and
    nearest-match names, not 28 final members or independently verified species/collection
    identities.
  support: supports
  accessed_at: '2026-10-22T02:14:09.739885Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: voc-methods
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Materials and methods / Characterization of fungal-bacterial interactions
    within SynCom, direct paragraph 2
  summary: The bidirectional VOC assay places fungal and bacterial inocula in opposite
    compartments of a bipartite Petri dish, with single-strain controls. After 48
    hours at 28 °C, bacterial biofilm and fungal colony diameter are measured and
    normalized to the corresponding control. This supports assay-specific responses,
    not physical hyphal contact, direct metabolite uptake or root colonization.
  support: supports
  accessed_at: '2026-10-22T02:14:09.740383Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
  quote: central divider
- evidence_id: pair-results
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Results / Exploring low phosphorus-mediated rhizosphere cross-kingdom interactions
    and disease suppression, paragraph 1; Figure 6C
  summary: F7/B2 is explicitly reported to show mutual promotion. The Results lists
    F3/B12 and F5/B12 as unordered pairs under unidirectional facilitation, without
    naming the benefiting partner. The canonical record and historical follow-up infer
    Aspergillus-to-Cupriavidus direction; that inference must be checked against the
    data.
  support: supports
  accessed_at: '2026-10-22T02:14:09.740473Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: pair-data
  kind: primary_source
  reference: 10.6084/m9.figshare.30356206.v1; otherdata.xlsx
  locator: 'F6.C: A1:G15 bacterial biofilm block and A18:O25 fungal diameter block;
    B14/D14/D23/D24 and G10/G20'
  summary: The source matrix records F5-to-B12 biofilm 0.029 and B12-to-F5 diameter
    1.64, whereas F3-to-B12 biofilm is 2.428 and B12-to-F3 diameter 1.07. F7-to-B2
    biofilm is 2.417 and B2-to-F7 diameter 2.23. These normalized values support keeping
    the pairs distinct; the displayed sheet does not supply cell-specific significance
    tests. The fungal-diameter block also contains an additional B14 column outside
    the final community, retained as a source-label inconsistency.
  support: supports
  accessed_at: '2026-10-22T02:14:09.740552Z'
  snapshot_sha256: 300135dd057f65cb10da5e72e03816ce051a4d78a15e1d24cdc319dbfafadc65
- evidence_id: antagonism
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Results / Functional verification of specific microbial taxa and distinguished
    metabolites, paragraph 2; Figure 5C; Materials and methods / In vitro assessment
    of antagonistic capacity of microbial isolates against FOC pathogen; Figshare
    F5.C
  summary: Individual pathogen inhibition and competitive advantage are separate measurements.
    Source prose calls five bacterial isolates strongly antagonistic and emphasizes
    fungal competitive advantage; the workbook nevertheless contains weak nonzero
    fungal inhibition ratios. Neither zero fungal antagonism nor universal strong
    direct antagonism should be asserted. Full-community protection does not establish
    syntrophic metabolism in every member.
  support: supports
  accessed_at: '2026-10-22T02:14:09.740816Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: metabolite-origin
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Materials and methods / Rhizosphere metabolite collection and metabolic
    analysis; Results / Exploring the key metabolites involved in the cucumber disease
    occurrence under different phosphorus levels; Results / Functional verification
    of specific microbial taxa and distinguished metabolites
  summary: Metabolomics samples rhizosphere material and identifies compounds enriched
    under different phosphorus treatments. Growth, chemotaxis and amendment experiments
    support effects of added LPDRMs. These measurements do not isolate cucumber root
    exudation as the origin of each compound or establish the same recruitment mechanism
    for every member.
  support: supports
  accessed_at: '2026-10-22T02:14:09.740897Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: endpoints
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: 'Abstract / Results; Results / Exploring low phosphorus-mediated rhizosphere
    cross-kingdom interactions and disease suppression, paragraph 2; Figure 6D–E;
    Materials and methods / Characterization of fungal-bacterial interactions within
    SynCom, paragraph 3; Greenhouse experiment: suppression of cucumber Fusarium wilt
    by SynCom and LPDRM'
  summary: The abstract reports 85% pathogen reduction with SynCom plus LPDRMs; the
    detailed Results reports 99% reduction versus HP control in the soil assay. Separate
    greenhouse disease-incidence reductions are reported as 50.18% and 55.1%. Keep
    each statement attributed to its source, treatment and endpoint rather than an
    interchangeable 85–99% range. Figure 6E shares b/bc group letters between SynCom
    arms, so it does not establish a significant incremental LPDRM benefit. No percentage
    is independently recomputed from log10 CFU values.
  support: supports
  accessed_at: '2026-10-22T02:14:09.740970Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: plant-protocol
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: 'Materials and methods / Plants and growth conditions, paragraphs 1–2;
    Greenhouse experiment: effects of phosphorus supply on cucumber Fusarium wilt,
    sole paragraph; Supplementary Tables S1–S2'
  summary: 'Cucumber grows in a 10% soil/90% vermiculite substrate, 100 g per cell,
    with Johnson nutrient solution and distinct KH2PO4 treatments of 500 µM, 1 mM
    and 2 mM. These solution doses differ from measured available substrate P: 20.80,
    55.66 and 110.23 mg/kg in S2. Original soil pH 5.58 and available P 3.39 mg/kg
    in S1 are measurements, not controlled culture set points. The source supplies
    plant temperature, light, humidity, nutrient recipe and challenge timing.'
  support: supports
  accessed_at: '2026-10-22T02:14:09.741042Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: culture-protocol
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Materials and methods / Isolation of distinctive microbes; Comprehensive
    in vitro characterization of selected microbes, paragraphs 1–3; Assessment of
    microbes colonization fitness in soil; Characterization of fungal-bacterial interactions
    within SynCom, paragraphs 1–3
  summary: The source distinguishes bacterial/fungal isolation, revival in half-strength
    LB/PDB, metabolite growth and chemotaxis assays, VOC-divider tests, soil colonization
    and pathogen challenge. Soil colonization uses distinct pooled stocks and doses;
    the construction paragraph reports fungal spores/µL while the colonization paragraph
    uses spores/mL. Recover stage-specific conditions without silently merging inocula,
    durations or media.
  support: supports
  accessed_at: '2026-10-22T02:14:09.741111Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: phosphate-assay
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Materials and methods / Phosphate solubilization assay of SynCom-strains;
    Supplementary Figure S9
  summary: Individual final strains have phosphate-solubilization assay results, using
    NBRIP-based plate and broth assays. Plant Pi differs between living and sterile
    soil under the tested treatments. Neither observation demonstrates cross-feeding
    or that an exact VOC pair is necessary for whole-community disease protection.
  support: supports
  accessed_at: '2026-10-22T02:14:09.741180Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: declarations
  kind: primary_source
  reference: PMID:41882811; DOI:10.1186/s40168-026-02381-1
  locator: Data availability, sole paragraph
  summary: The source declares CRA028919 rhizosphere community amplicons, OMIX012408
    metabolomics, the liuxy145/P-related analysis repository and versioned Figshare
    data. These declarations and independent metadata support resource traceability;
    they do not assign exact isolate genomes.
  support: supports
  accessed_at: '2026-10-22T02:14:09.741250Z'
  snapshot_sha256: 72dbdbcd04f7639a495fd4b89c2820e212a1ceee851d162ad79e55fbc97c7b93
- evidence_id: ontology
  kind: authority
  reference: /private/tmp/cm-review-session/batch-14/000477/ontology-authority.json
