assessments:
- assessment_id: identity
  area: identity
  topic: Defined two-member photohydrogen system
  outcome: supported
  summary: Retain the source-defined two-member system and source/current-name distinction.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - identity
  - strains-medium
  - strain-authority
  - ontology
  dimensions:
  - name: cellulolytic_member
    value: Cellulomonas sp. ATCC 21399
    definition: Source and catalogue genus-level identity; no species promotion from
      a linked gene.
    evidence_ids:
    - identity
    - strain-authority
  - name: phototroph
    value: Rhodopseudomonas capsulata B100 and derived ST410
    definition: Historical source name with current Rhodobacter capsulatus label;
      genotype-specific assays.
    evidence_ids:
    - identity
    - strains-medium
  - name: setting
    value: Defined anaerobic illuminated culture
    definition: Experimental pair, not a natural population or a carbon-fixing community.
    evidence_ids:
    - strains-medium
- assessment_id: origin-state
  area: scope
  topic: Origin, state and category
  outcome: supported
  summary: ENGINEERED state, SYNTHETIC origin and LIGNOCELLULOSE category fit deliberate
    cellulose-fed assembly.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - identity
  - strains-medium
  - schema
  details: The category does not establish lignin degradation or testing every lignocellulose
    fraction. Optional ecological-state scope is distinct from origin; no equilibrium
    claim or replacement state is required.
- assessment_id: taxonomy
  area: identity
  topic: Taxon rank, exact codes and GTDB correspondence
  outcome: supported
  summary: The broad genus/species identities are compatible with source and authority;
    add the recoverable phototroph codes without inventing catalogue aliases.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - identity
  - strain-authority
  - gtdb
  details: Preserve the disclosed species-name fallback and avoid asserting B100/ST410
    strain-genome placement in capsulatus_B. The current genus weighting was not independently
    recomputed from raw row counts. No separate taxonomic mismatch finding is justified.
- assessment_id: roles
  area: evidence
  topic: Donor recipient-role and phototroph carbon-fixer assignments
  outcome: concern
  summary: 'Two flat roles exceed the assay evidence: Cellulomonas CROSS_FEEDER and
    Rhodobacter PRIMARY_PRODUCER.'
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - schema
  - acids
  - acid-interpretation
  - net-hydrogen
  - semantics
  details: Cellulomonas exports acids; observed growth benefit from coculture does
    not establish uptake of metabolites provided by the phototroph. R. capsulata uses
    organic substrates under the focal conditions; general photoautotrophic capability
    is not evidence for focal carbon fixation. Retain Cellulomonas PRIMARY_DEGRADER
    and Rhodobacter CROSS_FEEDER. Do not invent an obligacy requirement or conclude
    no other metabolism is possible.
- assessment_id: abundance
  area: scope
  topic: Ordinal abundance versus condition-specific CFU
  outcome: supported
  summary: ABUNDANT can remain with narrow Table 1 evidence and condition/time scope.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - growth-abundance
  - schema
  details: Both organisms are substantial members, but their ratios change between
    1 and 15 mM ammonium at 90 hours. CFU, optical density and dry mass are distinct
    readouts; no equal, permanent or biomass-specific fraction is inferred.
- assessment_id: medium
  area: completeness
  topic: Recoverable medium and physical setup
  outcome: concern
  summary: The current abstract-only medium omits explicit source recipe and setup
    information.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - strains-medium
  - medium-components
  - measurement
  details: Represent focal 20 mL culture in 60 mL vessels, argon, 33 °C and illumination
    separately from routine propagation and analytical plating. Preserve the two buffer
    pH descriptions rather than assert an unreported final pH; no shaker speed or
    calibrated light flux is invented.
- assessment_id: design-environment
  area: scope
  topic: Genotype perturbation and environment wording
  outcome: concern
  summary: Keep wild-type/mutant comparison in engineering_design and describe the
    ENVO term accurately.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - strains-medium
  - schema
  - semantics
  details: The already encoded genotype environmental factor duplicates experimental
    design, not a physical condition. ENVO:01001405 is laboratory environment, not
    a specific bioreactor term. Defined flasks are supported separately by Methods.
- assessment_id: node-0
  area: evidence
  topic: Cellulose Fermentation to Organic Acid Cross-Feeding
  outcome: supported
  summary: Retain Cellulomonas-to-Rhodobacter organic-acid handoff and update the
    former acid-class knowledge gap.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - acids
  - acid-figure
  - acid-interpretation
  details: HPLC and the Discussion support lactate/acetate coupling; retain source-attribution
    and concentration-versus-flux limits. Small succinate production alone does not
    establish its transfer. Results/Discussion formate wording conflicts and sugar
    identity is tentative. Class-level CHEBI remains valid if retained; any specific
    additions need freshly verified terms and evidence.
- assessment_id: edge-0-1
  area: evidence
  topic: Organic-acid provision to net photohydrogen
  outcome: supported
  summary: Retain the directed substrate-supply connection and explicit lack of proven
    reciprocal product-removal dependence.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - acids
  - acid-interpretation
  - net-hydrogen
  details: The source links cellulose fermentation products to phototrophic hydrogen.
    Table 1 growth benefits do not establish the proposed acid-removal mechanism,
    obligacy or an unmeasured reverse nutrient-transfer edge. No new arrow is required.
- assessment_id: node-1
  area: evidence
  topic: Nitrogenase-Dependent Net Photohydrogen Yield
  outcome: supported
  summary: Retain source-attributed nitrogenase-associated net hydrogen evolution.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - identity
  - growth-abundance
  - net-hydrogen
  details: Low ammonium dependence indicates nitrogenase in the source interpretation.
    The argon/light assay and net gas accumulation do not measure nitrogen fixation,
    carbon fixation or gross production. No fixation GO term should be restored.
- assessment_id: node-2
  area: evidence
  topic: Uptake Hydrogenase Loss Increases Hydrogen Yield
  outcome: supported
  summary: Retain the genotype comparison, with source-condition limits rather than
    universal superiority.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - mutant
  - net-hydrogen
  - fresh-metadata
  details: The abstract reports 4.6–6.2 versus 1.2–4.3 mol hydrogen per glucose equivalent
    for mutant and wild type. Figure 3 varies ammonium and does not support a mutant
    advantage at every plotted condition. The Discussion describes the effect as usual;
    keep those boundaries without recalculating figure values.
- assessment_id: edge-2-1
  area: evidence
  topic: Reduced uptake to net hydrogen output
  outcome: supported
  summary: Retain uptake-loss as the source-interpreted change in hydrogen recycling.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - strains-medium
  - mutant
  - net-hydrogen
  details: Reduced consumption can increase net accumulation without increasing gross
    nitrogenase turnover. The experiment does not supply a separate production/consumption
    flux decomposition or universal genotype effect across all nitrogen regimes.
- assessment_id: ingredients
  area: evidence
  topic: Acid identities and possible sugar contribution
  outcome: concern
  summary: The ingredient prose treats acids and sugars as established transferred
    substrates more categorically than the measurements allow.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - acids
  - cellobiose-control
  - acid-interpretation
  details: Lactate/acetate coupling is explicitly interpreted by the source. A tentative
    reducing disaccharide and separate cellobiose growth assay support a possible
    sugar contribution, not proven transfer identity or magnitude. Qualify rather
    than declare all sugar contribution absent.
- assessment_id: source-gap
  area: provenance
  topic: Historical access and mechanistic gaps
  outcome: concern
  summary: The discussion says full Methods remain unread, while this review has directly
    inspected all six scans.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - lead-read
  - source-inventory
  - source-scope
  - history
  details: Resolve only the now-answerable strain/medium/acid questions. Gross-versus-net
    flux and precise transfer routes remain limited. The committed cache remains an
    abstract; retrieved scans do not change its content type. Any future source-text
    extension must preserve scan-page provenance and verbatim transcription.
- assessment_id: resources
  area: provenance
  topic: Publication versus phenotype collection
  outcome: concern
  summary: The PubMed article landing page is misclassified as an associated PHENOTYPE
    dataset.
  target_ids:
  - CommunityMech:000265
  evidence_ids:
  - resources
  - bibliography
  - schema
  details: Preserve its publication link in external_resources and remove the bibliographic
    dataset entry. A specifically identified table/figure data collection may be represented
    with an accurate locator; no independent accession or global absence of data is
    inferred.
- assessment_id: validation
  area: schema
  topic: Native validation and review scope
  outcome: supported
  summary: Eight focused checks pass; scientific findings remain despite valid syntax
