  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1305: Acknowledgments and Literature Cited'
  summary: The final page is acknowledgments and bibliography. Cited precursor methods
    and broader claims were not exhaustively followed; this review does not certify
    those papers independently.
  support: supports
  accessed_at: '2026-10-21T16:46:22.018446Z'
