limitations:
- Completion concerns the current record using the entire six-page scanned scientific
  paper, all four figures and both tables. The failed fullTextXML response and HTML
  challenge named main.pdf were not read as article text. No OCR, raw data reanalysis
  or statistical test was performed.
- 'All 21 canonical excerpts match fresh PubMed/EPMC and the abstract cache: 19 abstract
  excerpts and two publication-title excerpts. These lexical matches do not imply
  body-only or OCR matching; separate visual reading supports the full-text assessments.'
- Methods identify R. capsulata B100 and its uptake-hydrogenase-negative derivative
  ST410. The repeatedly named Cellulomonas ATCC 21399 remains the source and direct
  catalogue identity; one inoculum sentence has an inconsistent numeric code. No alternative
  strain is substituted from that isolated source discrepancy.
- Source and direct catalogue retain Cellulomonas sp.; a catalogue gene cross-reference
  does not establish a species assignment. The name-group GTDB Rhodobacter capsulatus_B
  mapping is reference-species correspondence rather than an authenticated B100/ST410
  genome assignment. Genus weighting and raw crosswalk-row counts are different quantities.
- Cellulomonas monocultures accumulated formate, acetate, lactate and a small amount
  of succinate. Coculture acetate was lower and lactate trace; the Discussion attributes
  coupling to lactate and acetate. Formate accumulated and Results call it unutilized,
  while Discussion entertains possible minor utilization. Do not assert established
  formate handoff or a precise substrate flux.
- The reducing compound was tentatively assigned as a disaccharide, probably cellobiose,
  from the hydrolysis response. Its depletion and a separate pure-phototroph cellobiose
  assay support possible sugar contribution, not chemically verified interspecies
  sugar transfer. Do not claim no sugar evidence or an established sugar flux.
- Table 1 shows both partners increased CFU in mixture versus monoculture at 90 hours
  under 1 and 15 mM ammonium; proportions change with condition. This can ground ordinal
  abundance and growth benefit, not stable fractions or proof of the proposed acid-removal/ATP
  mechanism. No reciprocal nutrient provision to Cellulomonas is established.
- Nitrogenase involvement is source-attributed and indicated by low ammonium dependence.
  Net gas accumulation is not gross nitrogenase flux, nitrogen fixation or carbon
  fixation. ST410 usually outperforms B100; Figure 3 does not support universal mutant
  superiority at every ammonium concentration. The published abstract ranges remain
  condition-specific summaries.
- 'Keep ammonium ion versus ammonium sulfate concentrations distinct: Tables 1–2 use
  1 and 15 mM ammonium; Figure 1 uses 7.5 mM ammonium sulfate; Figure 4 is the separate
  pure-phototroph 10 mM cellobiose assay with 1 mM ammonium sulfate. Table 2 explicitly
  reports a 200-hour hydrogen endpoint, not a universal incubation time or a timing
  assignment for every table measurement.'
- Focal coculture medium and 33 °C illumination are distinct from routine RCV/glucose-nitrate
  propagation, 32 °C YPS colony enumeration and analytical GC/HPLC conditions. The
  two buffer component pH values are not an explicitly reported single final medium
  pH. Lamp rating and distance are not calibrated irradiance; no shaker RPM is supplied
  in the inspected Methods.
- The encoded PMID landing page identifies the publication rather than a separately
  scoped phenotype dataset. Current paper figures and tables could be represented
  explicitly with accurate locators, without inventing an independent accession. No
  data-absence, exact reusable-medium or undisclosed genome-accession inference is
  made.
- Review is read-only for canonical records, cache, history and generated artifacts.
  No paid provider, author contact, culture experiment, model execution or later-target
  assessment occurred.
notes:
- All 23 official inputs remain unchanged. No canonical record, source cache, history,
  generated product or earlier saved review is edited.
- Root and lead independently read all six scans. Child read its stated two Methods
  pages and authority records; supporting resource checks concern metadata and excerpt
  identity.
- Native completeness 95 and quality 100/raw 119 are mechanical rubric values, not
  scientific certification. No unsupported role or dataset classification is retained
  to increase scores.
- The official page images provide full scientific access even though XML failed and
  the PDF route returned an HTML challenge. Current maintained cache content remains
