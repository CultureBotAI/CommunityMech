evidence:
- evidence_id: record
  kind: record_content
  reference: kb/communities/Cellulomonas_Rhodobacter_Cellulose_Photohydrogen_Coculture.yaml
  locator: Whole maintained record; both taxa, three interaction nodes and two arrows
  summary: The intended system is the defined Cellulomonas ATCC 21399–R. capsulata
    cellulose photohydrogen coculture. The graph already distinguishes substrate provision
    and uptake loss from nitrogen fixation, carbon fixation, gross hydrogen flux and
    obligate thermodynamic dependence.
  support: supports
  accessed_at: '2026-10-21T16:46:22.016840Z'
- evidence_id: identity
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1300: Abstract; Introduction; Materials and Methods,
    opening strain sentence'
  summary: The paper names Cellulomonas sp. ATCC 21399 and the historical Rhodopseudomonas
    capsulata. B100 is the nutritional wild type. The introduction describes several
    general phototroph capabilities; these are distinct from the focal anaerobic photoheterotrophic
    culture.
  support: supports
  accessed_at: '2026-10-21T16:46:22.016910Z'
  snapshot_sha256: 174128ba215f5efbfa3ca8d4e353a65a184afe7e2b16d0c6c1a8504e62cae69d
- evidence_id: strains-medium
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1301: Materials and Methods, continuation through
    inoculation and illumination'
  summary: ST410 is an uptake-hydrogenase-negative B100 derivative selected after
    mutagenesis. The focal experiment uses 100 mg finely divided Whatman No. 1 filter
    paper in 20 mL medium in 60 mL serum-stoppered Erlenmeyer flasks. Argon, 33 °C,
    a shaker bath, five 40 W incandescent bulbs at 16.5 cm and 0.2 mL of each appropriate
    parent culture are specified. The repeatedly used ATCC 21399 is inconsistent with
    one inoculum-line numeric code; no different strain is inferred.
  support: supports
  accessed_at: '2026-10-21T16:46:22.017183Z'
  snapshot_sha256: 80dd13aab429695f7bad4bb9dd6e83cac9f7befcff63d0ffb71d0f79572edc3d
- evidence_id: medium-components
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1301: Materials and Methods, liquid Cellulomonas/coculture
    medium paragraph'
  summary: The reported medium contains 75 mM HEPES component at pH 7.5, 9.6 mM phosphate
    buffer at pH 6.8, magnesium, calcium, iron, manganese, borate, copper, zinc and
    molybdate salts plus thiamine and biotin. Ammonium sulfate supplies the varied
    nitrogen. Two component pH values do not establish a single measured final-medium
    pH. Routine RCV and glucose–nitrate propagation media are separate.
  support: supports
  accessed_at: '2026-10-21T16:46:22.017420Z'
  snapshot_sha256: 80dd13aab429695f7bad4bb9dd6e83cac9f7befcff63d0ffb71d0f79572edc3d
- evidence_id: measurement
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1301: Determination of growth; Determination of
    cell mass, cellulose, and cellobiose; Determination of hydrogen and organic acids'
  summary: OD660 follows settling of cellulose. Pink/yellow colonies on YPS enumerate
    the two partners at 32 °C; this is not the focal growth medium. Dry mass and solubilized
    cellulose glucose equivalents, a hydrolysis-based reducing-sugar assay, gas chromatography
    and acid HPLC are separate measurements. The GC temperature of 25 °C is an instrument
    setting, not culture temperature.
  support: supports
  accessed_at: '2026-10-21T16:46:22.017488Z'
  snapshot_sha256: 80dd13aab429695f7bad4bb9dd6e83cac9f7befcff63d0ffb71d0f79572edc3d
- evidence_id: growth-abundance
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1302: Results: Growth characteristics, continuation;
    Table 1; Table 2'
  summary: At 90 hours both species have higher CFU in coculture than in monoculture
    at 1 and 15 mM ammonium, with condition-dependent ratios. Table 1 reports one
    experiment typical of four. Table 2 reports cellulose solubilization and dry-mass
    outcomes, with accumulated hydrogen explicitly measured at 200 hours, with a low-ammonium
    dark control and no hydrogen at high ammonium. Growth benefit is observed, but
    its mechanistic explanation is not directly perturbed.
  support: supports
  accessed_at: '2026-10-21T16:46:22.017555Z'
  snapshot_sha256: cba6a53cb0034a34a46967d6bfe46707d6c6ac841f41ceee3c28aa03bf640c05
- evidence_id: acids
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1302: Results: Cellulose fermentation products'
  summary: Pure Cellulomonas cultures accumulate formate, acetate, lactate and small
    succinate. Coculture contains trace lactate and reducing compound and roughly
    threefold less acetate, while formate accumulates more. Results describes formate
    as not utilized. The reducing compound at 168 hours was tentatively interpreted
    as a disaccharide, probably cellobiose; it was not structurally identified.
  support: supports
  accessed_at: '2026-10-21T16:46:22.017771Z'
  snapshot_sha256: cba6a53cb0034a34a46967d6bfe46707d6c6ac841f41ceee3c28aa03bf640c05
- evidence_id: acid-figure
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1303: Figure 2 and caption'
  summary: Figure 2 separately plots formate, acetate, lactate and hydrogen in 20
    mL pure Cellulomonas and B100 cocultures, with acid analysis of filtered samples.
    Concentration trajectories support the handoff interpretation but are not donor-resolved
    uptake fluxes or carbon-balance proof for each acid.
  support: supports
  accessed_at: '2026-10-21T16:46:22.017829Z'
  snapshot_sha256: 1f5addb27f42e6472cd91163ced21ace4f4f06dc12f0433b65c45d866960fba2
- evidence_id: mutant
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1303: Figure 3 and caption; Results paragraph on
    hydrogen stoichiometry'
  summary: Figure 3 compares B100 and ST410 across 0.5–6 mM initial ammonium. ST410
    generally gives higher yield, but the high-ammonium endpoint does not justify
    a universal mutant advantage. The inoculum ratio has little reported effect; transfer
    history affects efficiency. The abstract ranges remain source-reported summaries
    rather than every-condition bounds.
  support: supports
  accessed_at: '2026-10-21T16:46:22.018035Z'
  snapshot_sha256: 1f5addb27f42e6472cd91163ced21ace4f4f06dc12f0433b65c45d866960fba2
- evidence_id: cellobiose-control
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1303: Photoproduction of hydrogen from cellobiose;
    Figure 4 and caption'
  summary: A separate pure-phototroph assay replaces cellulose with 10 mM cellobiose
    and adds 1 mM ammonium sulfate. It supports cellobiose utilization and net hydrogen
    production, not direct interspecies sugar tracking. The reported 2.4 versus 1.8
    mol hydrogen per mol glucose for ST410/B100 belongs to this separate assay.
  support: supports
  accessed_at: '2026-10-21T16:46:22.018086Z'
  snapshot_sha256: 1f5addb27f42e6472cd91163ced21ace4f4f06dc12f0433b65c45d866960fba2
- evidence_id: acid-interpretation
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1304: Discussion, cellulose coupling and growth-synergism
    paragraphs'
  summary: The authors explicitly interpret cellulose coupling through lactate and
    acetate. They propose that acid removal may benefit Cellulomonas, with possible
    ATP/ammonium competition effects. Minor formate utilization is entertained despite
    the Results nonutilization wording; preserve that uncertainty. Observed reciprocal
    growth benefit does not establish reverse nutrient provision or obligate product-removal
    dependence.
  support: supports
  accessed_at: '2026-10-21T16:46:22.018135Z'
  snapshot_sha256: c41bf4d936c0027d29d18585b60b6e0b5624d298c94cd515c79e08e244acceae
  quote: via lactate and acetate
- evidence_id: net-hydrogen
  kind: primary_source
  reference: PMID:16346269
  locator: 'Original scanned page 1304: Discussion, nitrogenase involvement and hydrogen
    recycling paragraph'
  summary: The low-ammonium requirement indicates nitrogenase involvement in the authors’
    interpretation. Usually higher ST410 output is attributed to absence of hydrogen
    recycling. Net accumulated hydrogen does not quantify gross nitrogenase turnover,
    nitrogen fixation or focal autotrophic carbon fixation.
  support: supports
  accessed_at: '2026-10-21T16:46:22.018366Z'
  snapshot_sha256: c41bf4d936c0027d29d18585b60b6e0b5624d298c94cd515c79e08e244acceae
  quote: the absence of hydrogen recycling
