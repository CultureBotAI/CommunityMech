limitations:
- Full Methods, Results, figures, tables, confirmed SI and the complete 25-reference
  bibliography were unavailable. Direct publisher requests returned 403, anonymous
  API supplied coredata only and the institutional detail link failed. Indexed sections
  are not whole primary-body access.
- The indexed seed paragraph truncates at glucose addition. Its20 mL BHI,37 g/L powder,91
  g/L sorbitol,1 mL transfer and24 h details do not establish the anaerobic production
  recipe, temperature, pH,volume, mixing, gas regimen or exact inoculation ratio.
- Exact parent ATCC13032 and MR-1 stock names are indexed-source context with local
  authority confirmation. They do not establish a dedicated K1 taxonomy node or every
  experiment’s genotype. No culture catalogue or reference-protein evidence was imported
  as a focal mechanism.
- Abstract production gains, additive response and transcript interpretation do not
  resolve directed electron flux, endogenous riboflavin secretion or causal mediation.
  Indexed Highlights and Abstract attribute45.65% differently; preserve their actual
  comparator scopes. The indexed36 h Conclusion is not a full time-course review.
- No concrete focal archive was exposed in the available text. This is a bounded search
  result, not proof that transcriptomic data or supplementary materials do not exist.
  The sole undeclared mmc1 probe 404 is preserved without an absence inference.
- Both mapping cores remain valid. Snapshot hash/mtime do not establish a GTDB release
  or build date, and optional strain-row counts differ from species aggregates. Capped
  metrics and structural network completeness do not remove the scientific access
  limit.
