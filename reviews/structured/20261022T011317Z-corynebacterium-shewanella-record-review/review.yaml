  summary: The optimized coculture reaches 0.169 g/g succinic acid, 45.65% above monoculture,
    without markedly altering glucose consumption. The qualifier does not establish
    exact invariance. This comparison is distinct from the later K1 result and the
    subsequent additive screen.
  support: supports
