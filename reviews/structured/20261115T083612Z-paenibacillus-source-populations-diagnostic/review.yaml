summary: Two actual guarded M5 transitions clarify the Paenibacillus source populations
  and retain exactly the pinned native descriptor's three alternatives. The note-only
  intermediate distinguishes the native ncbi_name correspondence with no exact NCBI1406
  rows, the verified R226 five-bin name population and the separate six-taxon NCBI
  correspondence population. The subsequent unchanged status-only engine removes only
  the unsupported-for-this-native-route D/E alternatives. Neither transition selects
  a study-stock GTDB species; every other biological claim, neighboring descriptor
  and old history entry is preserved.
