  No species choice, candidate probability, denominator or stock alias is invented.
- Source-population judgments rely on the exact retained official-source extraction
  and additive verification artifacts. This assessment did not reacquire those sources
  or rerun their original capture helpers. The earlier workbook capture race and its
  separate successful retained-byte verification remain transparently recorded under2870.
