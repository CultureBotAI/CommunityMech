assessments:
- assessment_id: identity
  area: identity
  topic: Two-member HT versus C2 and fungal-conditioning populations
  outcome: supported
  summary: HT is the RW5/RW8 pair; C2, the fungal-conditioning phase, host and pathogen
    are distinct scopes.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - membership
  - figure4
  - record
  - ontology
  dimensions:
  - name: community_scope
    value: Engineered two-Bacillus rhizosphere SynCom HT
    definition: HT simplifies C2; the conditioning fungus is not part of the defined
      HT inoculum.
    evidence_ids:
    - membership
    - record
  - name: source_strain
    value: B. siamensis RW5 and B. vallismortis RW8
    definition: Paper names/figure labels establish the intended roster; live 16S
      archive labels H4/TK2 require alias reconciliation without changing source strain
      names.
    evidence_ids:
    - membership
    - figure4
    - datasets
  - name: environment
    value: Masson pine rhizosphere and controlled pot challenge
    definition: The initial substrate is a sterilized forest-topsoil/potting-soil/vermiculite
      mixture; original conditioning and final SynCom treatments remain separate.
    evidence_ids:
    - cultivation
    - ontology
  - name: medium
    value: LB Miller agar and defined source pot-substrate mixture
    definition: Culture and plant-substrate conditions are recoverable; no unique
      CultureMech identity or unreported bacterial incubation temperature is inferred.
    evidence_ids:
    - cultivation
  - name: experimental_setting
    value: Plate inhibition and HT+Fusarium seedling challenge
    definition: HT assembly is 1:1 volume ratio; assay controls and 30/60-day source
      inconsistency need explicit treatment-specific reporting.
    evidence_ids:
    - cultivation
    - outcomes
    - figure5
  - name: evidence_tier
    value: Measured inhibition/host physiology plus treatment-specific transcriptomics
    definition: Expression and enrichment are not pathway-necessity interventions;
      C2 gene panels cannot be assigned to HT without additional evidence.
    evidence_ids:
    - isolate-activity
    - physiology
    - genes
    - figure7
  - name: grounding_status
    value: Six matched pairs; strain-level archive alias unresolved
    definition: Historical GTDB statistics/status were not recomputed; 16S species
      support does not establish a unique strain genome or GTDB placement.
    evidence_ids:
    - ontology
    - datasets
    - adapter
- assessment_id: taxonomy
  area: grounding
  topic: Both member roles, abundance and strain provenance
  outcome: concern
  summary: Both pathogen-antagonist roles are supported by individual assays, but
    their local evidence and accession notes need precise provenance.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - isolate-activity
  - membership
  - figure4
  - datasets
  - schema
  details: DOMINANT can describe the coequal two-member formulation; equal-volume
    assembly is not proof of rhizosphere persistence or relative cell abundance. Sequence-label
    snippets establish paper identity, not individual inhibition. Source RW5/RW8 and
    archive H4/TK2 aliases remain unresolved; no species contradiction is asserted.
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: HT SynCom Suppression of Fusarium oxysporum'
  outcome: supported
  summary: Retain community-level HT-to-pathogen inhibition with its explicit limits
    on reciprocal harm and mediation.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - membership
  - isolate-activity
  - figure4
  - schema
  details: HT is RW5+RW8, F. oxysporum is the external target. Plate and spore-germination
    assays support inhibition; HT is weaker than C2 in Fig. 4e. No arrow from plate
    inhibition to seedling protection is required, and no mutualism or specific bacterial
    metabolite is established.
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: HT SynCom Masson Pine Damping-Off Protection'
  outcome: concern
  summary: Preserve HT protection/growth direction but qualify numerical values, comparator
    and timing conflicts.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - outcomes
  - figure5
  - cultivation
  details: The external recipient is Pinus massoniana under pathogen challenge. Abstract
    and main Results disagree on HT disease reduction; the height percentage is not
    explicitly anchored to FO, while CK is distinct. No direct bacterial fitness benefit
    or protection-to-defense-expression direction is demonstrated.
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Protective Enzyme and Resistance-Gene Activation'
  outcome: concern
  summary: Retain HT physiological effects; separate them from C2-specific named-gene
    panels and conflicting CAT1 direction.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - physiology
  - genes
  - figure7
  - transcriptome
  details: The recipient is the host. HT and C2 both have physiological outcomes and
    transcriptomic comparisons, but Fig. 7c/d displays C2/FO only. The existing PARTIAL
    pathway-necessity caveat does not resolve treatment attribution. Preserve zero
    downstream arrows; total catalase activity is not CAT1 transcript activation.
- assessment_id: conditions
  area: completeness
  topic: Recoverable cultivation and environmental conditions
  outcome: concern
  summary: Main Methods provide actionable culture and pot conditions absent from
    the record.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - cultivation
  - outcomes
  - source-scope
  details: Distinguish seed germination/tray temperatures, bacterial preparation and
    final challenge. Initial pH is not a treatment-time trajectory. Discussion 4.1
    mentions 25°C and 60% soil moisture in the conditioning context; do not automatically
    treat these as verified HT settings. Unavailable supplementary methods are not
    silently filled by generic protocols.
- assessment_id: resources
  area: completeness
  topic: Sequence metadata and host transcriptome resource
  outcome: concern
  summary: Encoded sequence species resolve, but source aliases are unverified; a
    concrete source-linked host transcriptome can be represented.
  target_ids:
  - CommunityMech:000347
  evidence_ids:
  - datasets
  - transcriptome
  - source-scope
  details: OQ996945.1 and OQ996934.1 are partial 16S sequences, not complete genomes.
    PRJNA1166410 is host RNA sequencing, not a bacterial SynCom genome or the conditioning
    microbiome project. No raw reads, source Table S1 aliases or archive sample enumeration
    were analyzed.
- assessment_id: provenance
