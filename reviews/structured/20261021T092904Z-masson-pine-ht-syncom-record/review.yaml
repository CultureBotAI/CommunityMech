  issue_key: cm-000347-ht-gene-attribution
  category: evidence
  severity: major
  native_severity: P2
  normalization_reason: 'P2 major: treatment attribution or quantitative efficacy
    interpretation materially changes the reported biological result.'
  rule_id: review-checklist.experimental-scope
  status: open
  certainty: confirmed
  title: Separate HT physiology from C2 named-gene evidence
  description: The description assigns activation of PR1, FLS2 and CAT1 to HT, and
    node 2 groups both treatments. The abstract supports that broad wording, but Results
    3.7 and Fig. 7c/d establish named-gene panels for C2 only; Discussion 4.3 also
    describes CAT1 downregulation. A pathway-necessity caveat alone does not repair
    this treatment/direction conflict.
