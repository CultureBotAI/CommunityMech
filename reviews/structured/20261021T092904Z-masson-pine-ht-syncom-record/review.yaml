limitations:
- Main PMC text and Figs. 4-7 were inspected; other main figure captions were read
  without pixel-level analysis. Supplementary DOCX routes returned HTML challenges
  and EPMC supplementary access returned a non-OA error; no access controls were bypassed.
- Supplement Table S1 strain aliases and other table/method contents remain unread.
  This review does not resolve RW5/H4 or RW8/TK2 equivalence or prove distinct biological
  isolates; no raw sequence or genome analysis was performed.
- The source itself differs between abstract and Results for HT disease reduction,
  between Methods and Results for timing, and between named-gene statements and CAT1
  direction. Exact effects and directions are not silently recalculated or selected.
- The abstract associates 153 isolates with the Trichoderma treatment, whereas main
  Results describes isolation across four treatments. The defined HT roster is explicit,
  but exact original isolate-treatment provenance is not independently resolved from
  unavailable Table S1.
- PRJNA1166410 verifies a host transcriptome project; twelve samples and treatment
  assignments are source-reported, not an independently audited sample inventory.
  Conditioning microbiome datasets and raw reads were not certified.
- Host physiological changes, transcriptomic enrichment, gene direction and pathway
  necessity are distinct. No protein/metabolite exchange, selective pathway perturbation
  or protection-to-expression causal edge is inferred.
- Historical GTDB statistics and strain-level assignments were not recomputed. Same-runtime
  adapter discovery and full-corpus network receipts are transparently reused; three
  external-endpoint warnings do not justify changing the HT roster.
notes:
- Canonical records, caches, history and generated outputs remain unchanged.
- Direct excerpts total 12 words across this publication.
- All 24 repository inputs were pinned before assessment and rechecked; no network-completeness
  bonus is applied.
