  - construct
  - final-construct
  - strain
  details: The final abstract supports the producer construct. Parent stock identity
    is distinct from reporter-bearing experiments. Do not add E. coli or transform
    the record into the earlier WT fusion system. The unavailable final main prevents
    certification of exact construct coverage across all final arms.
- assessment_id: grounding
  area: grounding
  topic: Ontology correspondence and GTDB route
  outcome: concern
  summary: Eight labels match; repair the first mapping-route note only.
  target_ids:
