- evidence_id: final-abstract
  kind: primary_source
  reference: PMID:41831593
  locator: Final published abstract, complete
  summary: The final abstract supports the engineered CACas9 Δhbd-p95ace02_atoB acetone
    producer, acetogen conversion to isopropanol, hydrogen nondetection, density-associated
    yields and a perfusion outcome. Its sole-alcohol statement is explicitly glucose-derived
    and assigned to perfusion. It does not identify a dissolved-hydrogen assay or
    establish every causal step.
  support: supports
