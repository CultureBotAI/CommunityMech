  - gtdb
  - strain
  details: Preserve 1488 exact-ID 1.0/44 and 1538 name-fallback 1.0/4. Species counts
    are mapping support, not experimental population counts. GO formation and glucose
    processes require explicit participant scope; correct labels do not prove a transfer
    mechanism.
- assessment_id: roles
  area: evidence
  topic: Functional roles and ordinal abundance
  outcome: concern
  summary: Attach local role evidence and preserve supported acetate-recipient inference.
  target_ids:
  - CommunityMech:000480
  evidence_ids:
  - schema
  - semantics
  - acetate-return
  - acetate-support
  details: Glucose fermentation does not alone demonstrate complex-substrate degradation.
    SECONDARY_FERMENTER needs fermentation of primary-degradation products, not merely
    any recipient reaction. Retain Cac CROSS_FEEDER with inferred Clj acetate use,
    and broad syntrophic cooperation. Keep DOMINANT if its contextual prominence is
    explained; no percentage threshold or fixed cell fraction is imposed.
- assessment_id: hydrogen-node
  area: graph
  topic: ecological_interactions[0] and downstream[0]
  outcome: concern
  summary: Qualify measured compartment and proposed mechanism.
  target_ids:
  - CommunityMech:000480
  evidence_ids:
  - mechanism
  - alternative-routes
  - final-abstract
  - ontology
  details: Headspace nondetection is observed in the preprint N2-start condition;
    dissolved H2 and direct NADH/Fd transfer were not measured there. Final S3 models
    alternatives. Preserve proposed thermodynamic relief with source-specific uncertainty;
    replace unconditional DIRECTLY IMPLIED prose where the final body has not established
    that exact causal step. H2 biosynthesis belongs to the producer side.
- assessment_id: acetone-node
  area: graph
  topic: ecological_interactions[1] and downstream[0]
  outcome: concern
  summary: Preserve acetone exchange, qualify the carbon-negative downstream outcome.
  target_ids:
  - CommunityMech:000480
  evidence_ids:
  - final-abstract
  - products
  - acetate-support
  details: Cac produces acetone and Clj converts it to isopropanol. Blocked endogenous
    four-carbon synthesis does not mean no butanol from supplied butyrate. The edge
    to process performance also depends on external gas inputs, retention, density
    and time; exchange alone does not demonstrate a universal carbon-negative outcome.
- assessment_id: process-node
  area: graph
  topic: ecological_interactions[2]
  outcome: concern
  summary: Scope product outcome to the reported process, substrate and period.
  target_ids:
  - CommunityMech:000480
  evidence_ids:
  - final-abstract
  - final-preview
  - products
  - final-process
  details: The final abstract restricts sole alcohol to glucose-derived product in
    perfusion. Current prose generalizes to pseudo-perfusion and all alcohol products.
    Retain the reported result with run-specific carbon accounting and evidence; final
    body is needed for exact final interval and revised mechanistic interpretation.
    No compulsory topology expansion is required.
- assessment_id: cultivation
