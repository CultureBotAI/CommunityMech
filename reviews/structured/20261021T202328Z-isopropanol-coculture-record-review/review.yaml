  locator: Table S1; Figure S4; Table S3
  summary: Final S4 explicitly uses C. ljungdahlii p100ptaHALO in a comparison arm;
    Table S1 lists DSM13528 WT background and reporter plasmid separately. The focal
    producer carries CACas9 Δhbd plus p95ace02_atoB; p95ipa01_atoB is a separate comparison
