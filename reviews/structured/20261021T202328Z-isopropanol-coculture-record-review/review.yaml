  quote: sole alcohol produced from glucose
- evidence_id: final-preview
  kind: primary_source
  reference: https://www.sciencedirect.com/science/article/abs/pii/S109671762600042X
  locator: 'Focal first result only: Highlights; Introduction; Section snippets: C.
    acetobutylicum cultivation'
  summary: The final publisher preview expressly includes external CO2 and H2 assimilation.
    It identifies the knockout/acetone construct and source-named Turbo CGMB with
    butyrate and clarithromycin. Only the available Introduction and section beginnings
    were read; following unrelated search results are excluded.
  support: supports
  accessed_at: '2026-10-21T20:23:28.941566Z'
  snapshot_sha256: 13217398443526bdc3aaf6b7b5e96ebeaae37c93dac24526857afa77bc3f41f3
- evidence_id: version
  kind: primary_source
  reference: https://api.biorxiv.org/details/biorxiv/10.1101/2025.07.14.664808
  locator: 'Version 1 metadata: date and published DOI'
  summary: The 2025-07-18 preprint links to the final 2026 article. Reciprocal identity
    establishes related versions, not identical Methods/results. Final SI has seven
    figures and three tables, unlike the preprint embedded supplementary material.
  support: supports
  accessed_at: '2026-10-21T20:23:28.941704Z'
  snapshot_sha256: ca6be39445b612e2a28876adeabb1199b463f2598b81dc2985b13d9dce7e0829
- evidence_id: mechanism
  kind: primary_source
  reference: DOI:10.1101/2025.07.14.664808 version 1, posted 2025-07-18
  locator: MATERIALS AND METHODS, lines 147–153; RESULTS & DISCUSSION, sections 3.2–3.3;
    Figure 2
  summary: The preprint measures headspace H2/CO2 by gas chromatography. Figure 2D
    reports no detected headspace H2 under the N2-start coculture condition. Stoichiometric/thermodynamic
    reasoning allows direct carrier exchange, low local H2 enabling conversion, or
    both. These measurements do not establish zero dissolved H2 or a uniquely demonstrated
    route. Alternatives and their final-version resolution must remain explicit.
  support: supports
  accessed_at: '2026-10-21T20:23:28.941821Z'
  snapshot_sha256: befdf3f295388fc4511776c90d7b39bc359e4a919547f9a2dc878cae17b860ba
- evidence_id: alternative-routes
  kind: primary_source
  reference: DOI:10.1016/j.ymben.2026.03.008 final publisher supplement
  locator: Figure S3; Table S2
  summary: Final S3 contrasts modeled electron donation using H2 versus ethanol; Table
    S2 lists carbon/electron reaction accounting. A schematic and balance do not selectively
    establish actual donor-resolved flux. This changed final-source context makes
    the unavailable final main critical to mechanism review.
  support: supports
  accessed_at: '2026-10-21T20:23:28.942848Z'
  snapshot_sha256: cabd51cecea20ab9f685a59d293c81b5f2ee4198802df1a99d014a3758e08b08
- evidence_id: products
  kind: primary_source
  reference: DOI:10.1101/2025.07.14.664808 version 1, posted 2025-07-18
  locator: RESULTS & DISCUSSION, sections 3.1 and 3.5–3.6; Figures 1, 4 and 5
  summary: The hbd-deleted producer still receives 30 mM butyrate and can make butanol
    from that supplement. Earlier ethanol remains. The first perfusion experiment
    reports sole glucose-derived alcohol at two consecutive points spanning 23 h,
    rather than throughout every run. Its 3C yield combines acetone and isopropanol;
    carbon recovery and external H2 incorporation are balance-based interpretations.
    These earlier-version details are not silently certified as final-paper results.
  support: supports
  accessed_at: '2026-10-21T20:23:28.943569Z'
  snapshot_sha256: befdf3f295388fc4511776c90d7b39bc359e4a919547f9a2dc878cae17b860ba
- evidence_id: final-process
  kind: primary_source
  reference: DOI:10.1016/j.ymben.2026.03.008 final publisher supplement
  locator: 'Figure S7; Supplementary Text Document: Estimating Acetate Accumulation
    for Experimental Design of Coculture Perfusion Experiment'
  summary: Final S7 is a second perfusion experiment with distinct glucose and H2/CO2
    feed periods; carbon recovery remains below 100% and ethanol/butanol are plotted.
    The text calls its acetate calculation an approximate design estimate, includes
    external CO2, and describes 20 g/L glucose, pH setpoint 5.1 and dilution 0.083
    h−1. No lifecycle emissions conclusion follows.
  support: supports
  accessed_at: '2026-10-21T20:23:28.944229Z'
  snapshot_sha256: cabd51cecea20ab9f685a59d293c81b5f2ee4198802df1a99d014a3758e08b08
- evidence_id: acetate-return
  kind: primary_source
  reference: DOI:10.1101/2025.07.14.664808 version 1, posted 2025-07-18
  locator: RESULTS & DISCUSSION, section 3.6; Table 2; Figure 5
  summary: The preprint infers that high acetone/isopropanol yields require assimilation
    of acetogen-produced acetate by C. acetobutylicum. This is source-local recipient
    support, with carbon-balance uncertainty; it is not isotope-resolved transfer.
    Donation of gases alone would not establish a recipient role.
  support: supports
  accessed_at: '2026-10-21T20:23:28.944515Z'
  snapshot_sha256: befdf3f295388fc4511776c90d7b39bc359e4a919547f9a2dc878cae17b860ba
- evidence_id: acetate-support
  kind: primary_source
  reference: DOI:10.1016/j.ymben.2026.03.008 final publisher supplement
  locator: Supplementary Text Document; Figures S3 and S6; Table S2, Eq. T9
  summary: The final supplement describes C. ljungdahlii acetate production and C.
    acetobutylicum capacity to assimilate acetate into acetone. S6 tests exogenous
    acetate feeding to the producer monoculture, supporting capacity and inhibition
    context rather than proving donor flux. Keep CROSS_FEEDER with inferred partner-acetate
    evidence; do not import a different record’s donor-only conclusion.
  support: supports
  accessed_at: '2026-10-21T20:23:28.945166Z'
  snapshot_sha256: cabd51cecea20ab9f685a59d293c81b5f2ee4198802df1a99d014a3758e08b08
- evidence_id: construct
  kind: primary_source
  reference: DOI:10.1101/2025.07.14.664808 version 1, posted 2025-07-18
  locator: MATERIALS AND METHODS, lines 132–146; RESULTS & DISCUSSION, section 3.1
    lines 195–199 and section 3.6; Table 1
  summary: The preprint abstract says WT acetogen, but Methods and Results specify
    p100ptaHALO with clarithromycin, including subsequent coculture experiments. Table
    1 lists the WT parent separately from the reporter plasmid. The source discrepancy
    must be attributed; neither universal WT nor universal reporter status in the
    unavailable final main is established.
  support: supports
