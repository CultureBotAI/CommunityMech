limitations:
- 'Partial scientific review: the final article main remains unavailable. Full preprint
  access and final SI do not resolve final-version electron-transfer alternatives,
  experimental construct coverage or exact outcome intervals. Final abstract and final
  SI are independently assessed, not treated as the missing body.'
- Lead read the whole 37-page preprint text including references/embedded supplementary
  captions and primer table, all five main figures, and all final SI text/three tables/seven
  figures. Root independently read all source text but only the specified preprint
  2/4/5 and final S3/S4/S7 visuals. Transparent figures were shown on white backgrounds
  without altering data.
- The final indexed preview contributes only its focal first result, including highlights,
  Introduction and bounded section starts. Other search hits are unrelated and unused.
  Final public API200 is bibliographic coredata, not full text. The DOI-linked preprint
  and final PII supplement are distinct versions.
- All nine excerpt occurrences strictly match the fresh final abstract and current
  abstract-only cache. Lexical success is not causal support. Draft preprint editorial
  comments are not scientific evidence.
- Headspace nondetection does not measure dissolved/local H2 or gross interspecies
  turnover. Preprint carrier-transfer alternatives and final S3 H2/ethanol models
  require final-body interpretation; no selective mechanistic proof is inferred from
  schematics or balances.
- External gas carbon/electrons, acetone-plus-isopropanol yield, supplied-butyrate-derived
  butanol and selected intervals matter. Preprint first-run performance cannot be
  generalized to final S7 or certified as final revised results; no lifecycle carbon
  benefit is asserted.
- Stock identity differs from reporter constructs. Preprint abstract/Methods conflict
  and 63/70 h inoculation discrepancy remain attributed. OD ratios, RNA-FISH fractions
  and GTDB support counts have distinct meanings. Broad ordinal abundance and syntrophic
  roles are not subjected to invented thresholds.
- No concrete archive identifier was found in bounded acquired text, not a claim of
  global data absence. No raw processing, external code execution, paid access, contact,
  issue mutation or later-record assessment occurred. Optional adapter discovery is
  explicitly reused from 403 with fresh compatibility.
- All26 inspected inputs remain unchanged; initial native and preliminary support
  receipts are immutable. Eight focused checks pass, corpus diagnostics retain nonzero
  outcomes, and high presence/quality scores do not remove the partial source-review
  status.
notes:
- Two major and three minor findings; completeness 70, raw quality 105.66666666666667/cap
  100.
- The final abstract is directly verified. Precursor-only protocol/result details
  retain their version; completion remains partial until critical final-main claims
  can be assessed.
- No canonical mutation or issue posting. Independent whole-candidate audits precede
  any parent save.
