limitations:
- Both species identifications remain source-reported and archive-labeled partial
  16S assignments. Each sequence is 820 bp; no whole-genome taxonomic resolution,
  independent sequence analysis or isolate-specific NCBITaxon was inferred.
- The article describes Illumina sequencing while archive metadata records Sanger.
  The target does not encode a sequencing platform, so this is a source discrepancy
  rather than an additional record finding.
- Consortium-preparation prose says equal volumes and final 5 mL, but Table 1 lists
  3458 uL A1 plus 1560 uL A3, totaling 5018 uL. The record preserves the table values;
  no corrected ratio or final community abundance was invented.
- Figure 8 caption misstates panel meaning; the plotted axes, values and Results identify
  phenanthrene in panel a and naphthalene in panel b, with both growth modes in each.
  No unreported significance test or complete mass balance is certified.
- The source reports 200 mg/g soil loading, distinct from 200 mg/L liquid assays.
  The unusual soil value was retained as reported, not silently converted. Soil pH
  and dissolved-oxygen control are not specified in the inspected protocol.
- The cited MSM recipe authority was not independently audited; no complete salt formulation
  or unique CultureMech recipe is certified. TSB starter OD and distinct preformation
  volumes were assessed without conflating them with final assay volume.
- HPLC parent disappearance does not establish mineralization, exact transfer intermediates,
  reciprocal fitness or field efficacy. The source pathway discussion was not treated
  as measured gene/enzyme evidence.
- Optional structured-adapter discovery was reused with its original same-runtime
  scope. No external runner or strain-module query was executed; unresolved GTDB status
  was not replaced with an inferred mapping.
notes:
- Canonical records, caches, history and generated outputs remain unchanged.
- Direct source excerpts total 21 words for this publication.
- All repository inputs were pinned by official inspect before assessment and rechecked
  during candidate construction.
