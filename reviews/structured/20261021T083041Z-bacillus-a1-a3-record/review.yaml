- assessment_id: taxonomy
  area: grounding
  topic: Both members, roles and ordinal abundance
  outcome: supported
  summary: Membership and individual PAH-removal results support the two source strains
    and phenotype-level degradation role.
  target_ids:
  - CommunityMech:000358
  evidence_ids:
  - identity-source
  - naphthalene
  - phenanthrene
  - schema
  - ontology
  - datasets
  details: The membership-only snippets could be supplemented with the already available
    assay Results for role-level evidence. DOMINANT is interpreted as prominence of
    both defined members, not a measured equilibrium ratio. OD standardization, unequal
    Table 1 volumes and species terms do not establish final cell proportions or exact
    strain taxIDs.
- assessment_id: node-0
  area: graph
  topic: 'ecological_interactions[0]: Consortium 3 naphthalene synergy'
  outcome: supported
  summary: The A1/A3 pair outperforms its two member monocultures at the stated HPLC
    endpoints, with synergy retained as a qualified interpretation.
  target_ids:
  - CommunityMech:000358
  evidence_ids:
  - record
  - naphthalene
  - mechanism
  - ontology
  details: Participants are A1 (NCBITaxon:2026186) and A3 (NCBITaxon:1402), compared
    with each monoculture in the respective seven-day planktonic or biofilm assay.
    The direction is increased parent-naphthalene disappearance by the pair; no metabolite
    donor/recipient direction is established. B8-1 is excluded from membership and
    from the claimed pair-versus-member comparison.
- assessment_id: node-1
  area: graph
  topic: 'ecological_interactions[1]: Lower Consortium Phenanthrene Removal'
  outcome: supported
  summary: The lower phenanthrene-removal phenotype and tentative antagonism interpretation
    are appropriately separated.
  target_ids:
  - CommunityMech:000358
  evidence_ids:
  - record
  - phenanthrene
  - mechanism
  - ontology
  details: A1/A3 Consortium 3 is the subject; both member monocultures are comparators
    under matched planktonic or biofilm modes. The direction is reduced parent removal
    by the combined culture. PARTIAL support does not demonstrate harm to both taxa
    or nutrient competition as the cause.
- assessment_id: node-2
  area: graph
  topic: 'ecological_interactions[2]: Consortium 3 soil naphthalene removal'
  outcome: supported
  summary: The 81.47% seven-day artificial-soil result is supported without field
    or mineralization claims.
  target_ids:
  - CommunityMech:000358
  evidence_ids:
  - record
  - soil
  - conditions
  - ontology
  details: Participants are the preformed A1/A3 attached biofilm and naphthalene in
    5 g artificially contaminated soil within a closed flask. Parent disappearance
    is the endpoint; a no-biofilm negative control is reported. A1-only phenanthrene
    performance is a different substrate test, not a matched member comparator for
    the soil naphthalene result.
