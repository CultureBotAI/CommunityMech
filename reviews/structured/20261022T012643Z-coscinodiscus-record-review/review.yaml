    commercial G9903 f/2 stock and 400 µM silicate; 13°C, 15:9light/dark, 25 µmol
    photons m−2 s−1, 150 mL in T75, no shaking, 3 diatom cells/mL and 10^3–10^4 bacteria/mL.
