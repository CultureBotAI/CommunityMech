limitations:
- Partial technical diagnostic with scientific_review:false. Scoped native passes
  do not establish a complete scientific review, measured quotation coverage, generated-product
  currency, aggregate QC or campaign completion.
- Record 389 represents four separately enriched substrate lines and bacterial V1-V2
  amplicon profiles, not a fifteen-stock synthetic community. Prevotella_1 and Prevotella_7
  remain separate SILVA bins; YAB2003 and RC9 group names remain narrower than their
  encoded family descriptors. Generic reference correspondence does not reclassify
  the source ASVs.
- For 389, Selenomonas-to-Centipeda is 278/482 references, Fibrobacter-to-Hallerella
  is 47/54, and Prevotellaceae-to-Bacteroidaceae is 15757/15757. Rikenellaceae is
  31981/32031. Rounded fractions below one are not unanimity, culture abundance or
  stock confidence. All five ordered Megasphaera alternatives remain without a single
  block or invented denominator.
- The 389 pooled inoculum, G0 versus G1-G10 vessel sizes, 72-hour transfers, three
  community-level nodes, sole PARTIAL selection-to-phenotype direction, three discussions
  and prior issue 1767 disposition remain unchanged. Neither member necessity nor
  hydrogen/methane flux, niche partitioning or interspecies exchange is established
  by this mapping.
- Record 381 retains fifteen distinct bacterial stocks and algal CCAP 646/6. The two
  Alteromonas stocks remain separate despite sharing a 741/754 generic reference population.
  The algal NO_GTDB_EQUIVALENT status is unchanged. Sixteen inoculated members, fourteen
  detected bacteria after the rarity filter, total bacterial density and each stock's
  equal inoculum share remain separate quantities.
- The 381 source names Muricauda/Allomuricauda, Halomonas/Vreelandella and Pseudomonas/Stutzerimonas
  remain separately qualified. Vreelandella alkaliphila and Vibrio diazotrophicus
  use species-name fallbacks with totals 3 and 5 at fraction 1.0; these are not exact-ID
  or stock-genome placements. All ten ordered Stutzerimonas alternatives remain; no
  candidate identifies stock 23-003.
- The 381 primary main-text passages and all fifteen Table S1 stock rows were read
  from separately retained inputs. The supplement is a retained text projection, not
  a newly inspected original workbook or fresh extraction. Stock deposits, origins
  and genome-access statements are not independent assembly placement evidence. No
  new full-paper, sequence, raw-data or figure-pixel review is claimed.
- For 381, conflicting producer attribution under issue 1728, absent detected extracellular
  B12, unresolved release/export/transfer routes and oxic diazotrophy limitations
  remain. The four community-level nodes and sole HYPOTHESIZED carbon-to-benefit arrow
  are preserved without promotion to demonstrated exchange or member-level causation.
- Record 482 receives only the Rhodanobacter term's 15/15 generic reference relation.
  The accessible abstract describes an NMC keystone genus and separately a four-isolate
  SynCom without exposing its complete stock roster. This correspondence cannot establish
  a Rhodanobacter isolate's membership in that SynCom. Both existing Burkholderia
  and Achromobacter blocks remain unchanged.
- 'The prior full-record partial assessment for 482 remains needs_curation with scientific_review:false.
  Issues 2404, 2405 and 2406 remain unresolved: NMC-to-SynCom performance attribution,
  four-stock roster/complex collapse, and unsupported mechanisms. The abstract''s
  97.27/68.00/22.91 percent results belong to the glucose-amended NMC experiment.
  Preserving current biological assertions does not endorse their accuracy.'
- The pinned crosswalk is 761d5537a7edb4b0133e88e7bbc85570cf3cb6f2555b9f9ce6cca3e1056a0ddd;
  its upstream release and chronology are unestablished. NCBI identity/rank evidence
  uses observed database identity/stat, not a whole-database checksum. Public metadata
  includes lookup-row hashes; complete native lookup rows remain captured private
  source inputs.
- Source binding for these three units ran locally at 308081 with Python 3.13.12.
  Actual M5 staging, application and native gates ran at frozen 308081a8cf3f82472c542db87e135a5b96da61be
  with Python 3.13.2 and history provider 23899092a4a2aedf53ff4435c0bdc03ebd79e6be.
  These are working-tree executions with applied canonicals. The retained whole-route
  441 preimage is historical and excluded from each later unit's captured input paths;
  the binder was not rerun after 441 changed.
- Native terms reports Validation passed without an assertion denominator. Complete
  saved-pair persistence, immutable captured-input checkpoints, public proof export
  and strict caller admission remain separately verified steps. Current biological
  predicates and the original batch 96/88/133 ledgers must remain enforceable; historical
  projections may cover only authenticated old byte/event expectations. Other successor
  chains and the separately maintained 471 composite must be preserved during integration.
