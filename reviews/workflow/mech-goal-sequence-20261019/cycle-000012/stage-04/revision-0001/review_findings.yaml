- finding_id: c12s4-000115-aerobic-denitrification-qq-syncom-abundance-levels
  issue_key: c12s4-000115-aerobic-denitrification-qq-syncom-abundance-levels
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: All three constructed denitrifying SMC members in Aerobic_Denitrification_QQ_SynCom
    (CommunityMech:000115) omit abundance_level despite defined three-member synthetic
    community support in PMID:38277828
  description: 'In kb/communities/Aerobic_Denitrification_QQ_SynCom.yaml (CommunityMech:000115),
    Acinetobacter baumannii (taxonomy[0], NCBITaxon:470, functional_role: [CROSS_FEEDER]),
    Pseudomonas aeruginosa (taxonomy[1], NCBITaxon:287, functional_role: [CROSS_FEEDER]),
    and Aeromonas hydrophila (taxonomy[2], NCBITaxon:644, functional_role: [CROSS_FEEDER])
    all omit abundance_level. The cited primary study (PMID:38277828, doi:10.1016/j.watres.2024.121162)
    explicitly establishes that ''To improve denitrification efficiency, a synthetic
    microbial community (SMC) composed of denitrifiers Acinetobacter baumannii N1
    (AC), Pseudomonas aeruginosa N2 (PA) and Aeromonas hydrophila (AH) were constructed.
    The nitrate (NO3--N) reduction efficiency of the SMC reached 97 % with little
    nitrite (NO2--N) accumulation, compared to the single-culture systems and co-culture
    systems.'' Setting abundance_level: DOMINANT on taxonomy[0], taxonomy[1], and
    taxonomy[2] raises the review-communities s_ab abundance_level rubric component
    from 0/5 to 5/5 (0/3 -> 3/3 taxa with abundance_level).'
  target_ids:
  - CommunityMech:000115
  field_paths:
  - taxonomy[0].abundance_level
  - taxonomy[1].abundance_level
  - taxonomy[2].abundance_level
  evidence_ids:
  - ev-completeness-audit
  - ev-aerobic-denitrification-qq-pmid38277828
  rule_id: review-yaml-record:taxonomy-abundance-level-completeness
  native_severity: P2
  normalization_reason: Missing source-backed abundance_level on all three defined
    synthetic microbial community members leaves the review-communities s_ab rubric
    component at 0/5 (Completeness Score 100/100; scripts/audit_completeness.py score
    80/100) and maps to major (P2).
  owner_paths:
  - repository: CultureBotAI/CommunityMech
    path: kb/communities/Aerobic_Denitrification_QQ_SynCom.yaml
    role: canonical_record
  tags:
  - actionable
  - stage5-candidate
  - abundance-level
  - completeness
- finding_id: c12s4-000116-aerobic-denitrification-disturbance-syncom-abundance-levels
  issue_key: c12s4-000116-aerobic-denitrification-disturbance-syncom-abundance-levels
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: All three disturbance-stable denitrifying SMC members in Aerobic_Denitrification_Disturbance_SynCom
    (CommunityMech:000116) omit abundance_level despite defined three-member synthetic
    community support in PMID:40020349
  description: 'In kb/communities/Aerobic_Denitrification_Disturbance_SynCom.yaml
    (CommunityMech:000116), Pseudomonas aeruginosa (taxonomy[0], NCBITaxon:287, functional_role:
    [CROSS_FEEDER]), Acinetobacter baumannii (taxonomy[1], NCBITaxon:470, functional_role:
    [CROSS_FEEDER]), and Aeromonas hydrophila (taxonomy[2], NCBITaxon:644, functional_role:
    [CROSS_FEEDER]) all omit abundance_level. The cited primary study (PMID:40020349,
    doi:10.1016/j.watres.2025.123270) explicitly establishes that ''Here, dibutyl
    phthalate (DBP) and levofloxacin (LOFX) were used as environmental disturbances
    to study their effects on the aerobic denitrification functional stability of
    SMC composed of Pseudomonas aeruginosa N2 (PA), Acinetobacter baumannii N1(AC)
    and Aeromonas hydrophila (AH).'' Setting abundance_level: DOMINANT on taxonomy[0],
    taxonomy[1], and taxonomy[2] raises the review-communities s_ab abundance_level
    rubric component from 0/5 to 5/5 (0/3 -> 3/3 taxa with abundance_level).'
  target_ids:
