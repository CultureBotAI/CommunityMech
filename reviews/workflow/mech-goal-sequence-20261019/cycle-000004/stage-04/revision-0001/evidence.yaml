    omits functional_role: [PRIMARY_DEGRADER] and abundance_level: DOMINANT on both
    engineered specialist strains (Escherichia coli GL10 and Escherichia coli XL12)
    despite verbatim support in PMID:42038008 (doi:10.1016/j.bidere.2026.100072).'
