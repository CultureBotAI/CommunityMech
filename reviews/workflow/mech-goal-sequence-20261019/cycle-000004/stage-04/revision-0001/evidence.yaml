- finding_id: c4s4-000083-smutans-calbicans-roles-metabolites-and-sucrose
  status: open
  summary: 'CommunityMech:000083 (kb/communities/SMutans_CAlbicans_ECC_Biofilm.yaml)
    omits functional_role: [PRIMARY_DEGRADER, CROSS_FEEDER] and abundance_level: DOMINANT
    on Streptococcus mutans, omits functional_role: [SYNTROPHIC_PARTNER, CROSS_FEEDER]
    and abundance_level: ABUNDANT on Candida albicans, omits metabolites exopolysaccharide
    (CHEBI:72813) on ecological_interactions[1], and omits environmental_factors for
    1% (30 mM) sucrose availability despite verbatim support in PMID:24566629.'
- finding_id: c4s4-000357-ecoli-gl10-xl12-roles-and-abundance
