- finding_id: c8s4-000210-zymomonas-ecoli-abundance-levels
  issue_key: c8s4-000210-zymomonas-ecoli-abundance-levels
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Both obligate mutualist partners in Zymomonas_Ecoli_Exometabolomics_Obligate_Mutualism
    (CommunityMech:000210) omit abundance_level despite defined two-member coculture
    support in PMID:26885935
  description: 'In kb/communities/Zymomonas_Ecoli_Exometabolomics_Obligate_Mutualism.yaml
    (CommunityMech:000210), both Zymomonas mobilis (taxonomy[0], NCBITaxon:542, strain
    ZM4 ZMO0748 cysteine synthase mutant, functional_role: [CROSS_FEEDER]) and Escherichia
    coli (taxonomy[1], NCBITaxon:562, strain BW25113 Keio amino-acid auxotrophs proA,
    pheA, and ilvA, functional_role: [CROSS_FEEDER]) omit abundance_level. The cited
    study (PMID:26885935, doi:10.1021/acssynbio.5b00236) explicitly reports that ''Three
    sets of cocultures between the Z. mobilis auxotroph and each of the three E. coli
    auxotrophs were monitored by optical density for growth and analyzed by flow cytometry
    to confirm high cell counts for each species.'' Setting abundance_level: DOMINANT
    on both taxonomy[0] and taxonomy[1] while preserving discussions[0] (zymomonas_sulfur_identity_and_release_routes)
    raises the review-communities s_ab abundance_level rubric component from 0/5 to
    5/5 (0/2 -> 2/2 taxa with abundance_level).'
  target_ids:
  - CommunityMech:000210
  field_paths:
  - taxonomy[0].abundance_level
  - taxonomy[1].abundance_level
  evidence_ids:
  - ev-completeness-audit
  - ev-zymomonas-ecoli-pmid26885935
  rule_id: review-yaml-record:taxonomy-abundance-level-completeness
  native_severity: P2
  normalization_reason: Missing source-backed abundance_level on both obligate mutualist
    coculture partners leaves the review-communities s_ab rubric component at 0/5
    (Completeness Score 98/100; scripts/audit_completeness.py score 85/100) and maps
    to major (P2).
  owner_paths:
  - repository: CultureBotAI/CommunityMech
    path: kb/communities/Zymomonas_Ecoli_Exometabolomics_Obligate_Mutualism.yaml
    role: canonical_record
  tags:
  - actionable
  - stage5-candidate
  - abundance-level
  - completeness
- finding_id: c8s4-000359-pphet-heterotroph-abundance-level
  issue_key: c8s4-000359-pphet-heterotroph-abundance-level
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Non-cyanobacterial WCRM heterotrophs (taxonomy[1]) in PPHET_Hybrid_Photosynthetic_PHB_Microbiome
    (CommunityMech:000359) omit abundance_level despite 16S community-composition
    support in PMID:41559821
  description: 'In kb/communities/PPHET_Hybrid_Photosynthetic_PHB_Microbiome.yaml
    (CommunityMech:000359), Synechocystis sp. PCC 6803 PPT1 (taxonomy[0], NCBITaxon:1148,
    functional_role: [PRIMARY_PRODUCER]) carries abundance_level: DOMINANT, whereas
    its co-cultivated heterotrophic partner fraction non-cyanobacterial WCRM heterotrophs
    (taxonomy[1], NCBITaxon:2, functional_role: [CROSS_FEEDER]) omits abundance_level.
    The cited open-access study (PMID:41559821, PMC12819161, doi:10.1111/1751-7915.70302)
    explicitly reports that ''At the phylum level, both were dominated by Cyanobacteria,
    Proteobacteria, and Bacteroidota, with Cyanobacteria representing ~70% of the
    total community (Figure  2a ).'' Setting abundance_level: ABUNDANT on taxonomy[1]
    (~30% non-cyanobacterial Proteobacteria/Bacteroidota heterotrophic fraction) while
    preserving discussions[0] (DISCUSSION-PPHET-OXYGEN-SCAVENGING) and discussions[1]
    (phb-production-assay-boundaries) raises the review-communities s_ab abundance_level
    rubric component from 2.5/5 to 5/5 (1/2 -> 2/2 taxa with abundance_level).'
  target_ids:
  - CommunityMech:000359
  field_paths:
  - taxonomy[1].abundance_level
  evidence_ids:
  - ev-completeness-audit
  - ev-pphet-hybrid-pmid41559821
  rule_id: review-yaml-record:taxonomy-abundance-level-completeness
  native_severity: P2
  normalization_reason: Missing source-backed abundance_level on the co-dominating
    non-cyanobacterial heterotrophic fraction leaves the review-communities s_ab rubric
    component at 2.5/5 (Completeness Score 94/100; scripts/audit_completeness.py score
    90/100) and maps to major (P2).
  owner_paths:
