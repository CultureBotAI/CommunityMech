- finding_id: c3s4-000280-pinus-syncom-antagonist-roles-and-growth-process
  status: open
  summary: 'CommunityMech:000280 (kb/communities/Pinus_armandii_Endophytic_Biocontrol_SynCom.yaml)
    omits functional_role: [PATHOGEN_ANTAGONIST] on the three verified antagonistic
    SynCom isolates (Paenibacillus terrae RE7, Bacillus velezensis NA3, Bacillus subtilis
    NA11), omits abundance_level: ABUNDANT across all five equal-part SynCom members,
    and omits biological_processes GO:0040007 (growth) on ''Pinus Seedling Growth
    Promotion'' despite explicit support in PMID:42322490.'
- finding_id: c3s4-000434-acidic-nitrification-functional-roles-and-processes
  status: open
  summary: CommunityMech:000434 (kb/communities/Acidic_Nitrification_Minimal_Consortium.yaml)
    omits functional_role and abundance_level on 'Candidatus Nitrosoglobus kelleri'
    and Mycobacterium species and omits biological_processes (GO:0019329 ammonia oxidation,
    GO:0009060 aerobic respiration, GO:0015977 carbon fixation) on 'Acidic Nitrification
    Syntrophic Partnership' despite verbatim support in PMID:38378641.
- finding_id: c3s4-000448-soymilk-starter-roles-and-crossfeeding-participants
  status: open
  summary: CommunityMech:000448 (kb/communities/Soymilk_Mixed_Starter_Metabolic_Division_SynCom.yaml)
