name: label-correspondence

# Phase 2 (enforcing): `just validate-products` is now a BLOCKING gate — an
# id↔label MISMATCH / ID_NOT_FOUND / UNKNOWN_PREFIX in the community YAMLs or
# KGX products fails the build. Curator-accepted residuals stay green via the
# `exceptions:` allow-list in conf/id_label_targets.yaml (OK_EXCEPTION; restored
# in issue #134). The drift report (reports/label_drift.tsv) is still generated
# and uploaded as an artifact for triage, even when the gate passes.
#
# `just validate-terms-all` (the LinkML-native binding gate) IS enabled below,
# as of #277. It was deferred because linkml-term-validator has no exceptions
# mechanism and failed on 34 curator-accepted residuals - obsolete GO:0055114,
# CHEBI mislabels needing minting, taxa absent from the OAK snapshot.
#
# Measured before enabling: 316 of 316 files pass, zero warnings, exit 0. Be
# precise about why. The obsolete-label and mislabel class was genuinely fixed,
# the last of it in #350. But three residuals still resolve to NOTHING in OAK
# (CHEBI:75315, GO:0070812, NCBITaxon:1807132) and are still waived in
# conf/id_label_targets.yaml - this tool passes them because it silently skips
# ids it cannot resolve, not because they were cleaned. So the gate is green
# partly by blindness, and it does not catch a nonexistent CURIE at all (#471).
#
# The risk this carries: nothing pins the ontology release. If the cache is
# evicted and a label changes upstream, this goes red on a PR that changed
# nothing, and there is no waiver to reach for - the tool has none, which is why
# it was deferred in the first place. Fixing the term is the only remedy.
# validate-products survives that case via its `exceptions:` list; this cannot.

on:
  pull_request:
    paths: &trigger_paths
      - "kb/communities/**"
      # Isolates carry ids too, and were outside every
      # validation glob until #350.
      - "data/isolates/**"
      # Taxa were outside every *trigger* until #471 — a subtler version of the
      # same defect. This workflow runs `just validate-terms-taxa`, whose entire
      # input is kb/taxa/*.yaml, and Engine B carries a `taxa_yaml` target; but
      # kb/taxa appeared in NO workflow's paths filter, so a PR touching only a
      # taxon record triggered exactly one check (vendored-sync, the unfiltered
      # one) and nothing validated the record. Verified by opening such a PR
      # (#629, closed unmerged): 1 check, and it read no YAML.
      - "kb/taxa/**"
      - "output/kgx/**"
      - "src/communitymech/schema/**"
      - "scripts/validate_id_label_correspondence.py"
      - "conf/id_label_targets.yaml"
      - ".github/workflows/label-correspondence.yaml"
  push:
    branches: [main]
    paths: *trigger_paths
  workflow_dispatch:

permissions:
  contents: read

# The vendored-sync job used to live here and inherited the `paths:` filter
# above, which is scoped to this workflow's expensive OAK-backed check. That
# filter listed only 2 of the 6 files the drift checker compares, so the guard
# almost never fired (CultureBotAI/TraitMech#198). It now has its own workflow —
# .github/workflows/vendored-sync.yaml — with no paths filter, because it is
# bash + curl and there is nothing to save by filtering it. The filter above is
# correct for THIS job, which needs uv + a cached OAK ontology download.

jobs:
  label-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        # setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen

      # Cache OAK sqlite ontologies (NCBITaxon/ENVO/CHEBI/GO) across runs.
      - name: Cache OAK ontologies
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}-v1

      # Always generate + upload the drift report first, so the triage artifact
      # exists even when the enforce step below fails the build.
      - name: Generate id↔label drift report
        run: just report-label-drift

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-drift-report-${{ github.run_id }}
          path: reports/label_drift.tsv
          if-no-files-found: warn

      # Phase 2 blocking gate: fail on any id↔label error-class verdict
      # (MISMATCH / ID_NOT_FOUND / UNKNOWN_PREFIX / ADAPTER_ERROR /
      # MISSING_COLUMN). Curator-accepted residuals pass as OK_EXCEPTION.
      - name: Enforce id↔label correspondence
        run: just validate-products

      # Engine A (LinkML-native) for the CommonTaxon gene records: enforce that
      # GeneAnnotation.go_terms[].label is the canonical GO label (the
      # go_terms id↔label binding). kb/taxa/ roots are CommonTaxon, not the
      # schema tree_root, so this uses --target-class CommonTaxon.
      - name: Enforce id↔label correspondence (kb/taxa go_terms)
        run: just validate-terms-taxa

      # Engine A over the community records and isolates. Deferred since #134
      # for want of an exceptions mechanism; enabled once the residuals it could
      # see were fixed (#277). If this starts failing, fixing the term is the
      # only remedy - this tool has no waiver, which is the whole reason it was
      # deferred. Dropping the step is how it came to be off for months, so
      # prefer a pinned ontology or an upstream fix over that.
      - name: Enforce id-label correspondence (kb/communities, data/isolates)
        run: just validate-terms-all
