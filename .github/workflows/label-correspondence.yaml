name: label-correspondence

# Phase 2 (enforcing): `just validate-products` is now a BLOCKING gate — an
# id↔label MISMATCH / ID_NOT_FOUND / UNKNOWN_PREFIX in the community YAMLs or
# KGX products fails the build. Curator-accepted residuals stay green via the
# `exceptions:` allow-list in conf/id_label_targets.yaml (OK_EXCEPTION; restored
# in issue #134). The drift report (reports/label_drift.tsv) is still generated
# and uploaded as an artifact for triage, even when the gate passes.
#
# `just validate-terms-all` (the LinkML-native binding gate) IS enabled below,
# as of #277. It was deferred because linkml-term-validator has no exceptions
# mechanism and failed on 34 curator-accepted residuals - obsolete GO:0055114,
# CHEBI mislabels needing minting, taxa absent from the OAK snapshot.
#
# Measured before enabling: 316 of 316 files pass, zero warnings, exit 0. Be
# precise about why. The obsolete-label and mislabel class was genuinely fixed,
# the last of it in #350. But three residuals still resolve to NOTHING in OAK
# (CHEBI:75315, GO:0070812, NCBITaxon:1807132) and are still waived in
# conf/id_label_targets.yaml - this tool passes them because it silently skips
# ids it cannot resolve, not because they were cleaned. So the gate is green
# partly by blindness, and it does not catch a nonexistent CURIE at all (#471).
#
# The risk this carries: nothing pins the ontology release. If the cache is
# evicted and a label changes upstream, this goes red on a PR that changed
# nothing, and there is no waiver to reach for - the tool has none, which is why
# it was deferred in the first place. Fixing the term is the only remedy.
# validate-products survives that case via its `exceptions:` list; this cannot.

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
    paths:
    - justfile
    - scripts/ontology_preflight.py
    - kb/communities/**
    - data/isolates/**
    - kb/taxa/**
    - src/communitymech/schema/**
    - scripts/validate_id_label_correspondence.py
    - conf/id_label_targets.yaml
    - .github/workflows/label-correspondence.yaml
  workflow_dispatch:

permissions:
  contents: read

# This job's body now lives in claw as a reusable workflow shared across the
# fleet (culturebotai-claw#180, Phase 5). TraitMech was the canary; MIM and
# CultureMech followed. This is the fourth and last adopter, and it needed
# three claw changes first, because three things here are this repository's and
# would otherwise have been erased by consolidation:
#
#   rotating OAK cache key claw#302  a fixed key froze the snapshot forever
#                                    (#707). This repository already had the
#                                    fix; claw had the frozen version, so the
#                                    change went the other way for once.
#   extra-enforce-recipes  claw#303  the two Engine A gates below are steps in
#                                    THIS job, and a `uses:` job cannot carry
#                                    steps
#   uv-version             claw#306  all six workflows here pin uv 0.12.5
#
# `report-when` is NOT passed: this job already reports before enforcing and
# uploads with always(), which is the reusable workflow's default. That input
# exists for CultureMech (claw#299), whose enforce pass is 6m14s and which
# therefore pays for the report only on failure. Restating a default here would
# imply a decision this repository has not made.
#
# This repository owns the trigger events and domain inputs above/below.
jobs:
  label-correspondence:
    # Pinned to a claw commit, not a branch: a moving ref would change this
    # gate with no commit in this repository to show for it. This ref is the
    # first that carries all four inputs above.
    uses: CultureBotAI/culturebotai-claw/.github/workflows/label-correspondence-reusable.yaml@cd110848da4d92b39c6ba44b86810d42fd5117c2
    with:
      python-version: "3.10"
      # Pinned in all six workflows here; claw's default lets uv float.
      uv-version: "0.12.5"
      uv-sync-args: "--frozen"
      # output/kgx/ is gitignored, so the export the gate reads does not exist
      # in a fresh checkout. Without building it the kgx_nodes glob matched
      # nothing, the target skipped, and the gate passed without reading the
      # export (#686).
      prepare-recipe: "kgx-export"
      # Named explicitly rather than left to claw's defaults. Both ARE the
      # defaults today, but a gate whose identity lives in another repository's
      # default is a gate this one cannot see: nothing here would change if it
      # moved, and the tests that check "does CI run Engine B" would have
      # nothing to read. Stating them keeps that answer in this file (#716).
      enforce-recipe: "validate-products"
      drift-report-recipe: "report-label-drift"
      # Engine A, over record sets whose roots are not the schema tree_root:
      # kb/taxa/ is CommonTaxon (#471), and kb/communities + data/isolates were
      # deferred since #134 and enabled at #277. Neither has a waiver -- fixing
      # the term is the only remedy, which is why dropping the step is how they
      # came to be off for months. They run after `validate-products`.
      extra-enforce-recipes: |
        validate-terms-taxa
        validate-terms-all
