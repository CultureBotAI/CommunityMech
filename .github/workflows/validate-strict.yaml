name: validate-strict

on:
  pull_request:
    paths: &trigger_paths
      - "kb/communities/**"
      # A prompt-only edit is the one change class that can breach the /goal size
      # budget, and it matched no workflow filter — so the guard added in #358
      # would not have run on it. Same shape as the data/isolates gap below.
      - "prompts/**"
      # data/isolates carries CommunityMech ids too. It was outside every
      # workflow's paths filter, which is half of why four ids ended up used
      # twice (#310) — editing an isolate has to re-run the uniqueness gate.
      - "data/isolates/**"
      # kb/taxa carries CommunityMech:taxon:* ids for exactly the same reason,
      # and `test_id_uniqueness.py` reads it — as do 7 other test modules. It was
      # in no workflow's filter at all, so none of them ran when a taxon record
      # changed (#471). The isolates note above describes this defect one
      # directory over; this is the directory it was still true of.
      - "kb/taxa/**"
      - "src/communitymech/schema/**"
      - "src/communitymech/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "justfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-strict.yaml"
  push:
    branches: [main]
    paths: *trigger_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        # --frozen fails the workflow if uv.lock is stale (don't silently
        # re-resolve in CI). --all-extras keeps parity with the existing
        # network-quality.yml workflow and ensures pytest + optional deps
        # are available for the test step below.
        run: uv sync --frozen --all-extras

      - name: Run validate-strict (closed-schema LinkML validation)
        run: just validate-strict

      - name: Run audit-writers
        run: just audit-writers

      - name: Run tests
        run: uv run pytest tests/ -q --no-cov

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-strict-reports-${{ github.run_id }}
          path: |
            reports/instance_validation_failures.tsv
            reports/pipeline_writers_audit.tsv
          if-no-files-found: warn
