name: Network Quality Check

# Reports network integrity findings (dangling interaction references and
# taxa with no interactions) for changed community records.
#
# This workflow could not be parsed by GitHub until #272 and so had never run.
# It was then reporting-only until #273, because the audit could not distinguish
# a broken reference from an uncurated taxon and the bulk of its findings were
# the latter — failing on those would have reddened `main` on every KB push.
#
# The auditor now carries severity levels, and this workflow gates on them: a
# record naming a taxon, causal-edge target or discussion anchor that does not
# exist fails the job, while DISCONNECTED (a member with no curated interaction
# yet), NAME_MISMATCH (a participant matched by ontology id because its name
# matches no taxonomy entry) and an unresolved participant on a COMMUNITY_LEVEL
# interaction are reported and do not. Error-severity findings currently stand
# at 0 and warnings at 55.
#
# The LLM repair-suggestion job calls the Anthropic API and posts comments, so
# it runs only when explicitly requested via workflow_dispatch — never
# automatically on a push or pull request.
#
# On a pull request this maintains exactly ONE findings comment, keyed by a
# hidden marker and updated in place (#285). It also triggers on changes to
# itself, so an edit here is exercised by the run it produces.

on:
  pull_request:
    paths:
      - 'kb/communities/*.yaml'
      # Isolates are audited too, since #350. Without this an isolate
      # could gain a dangling interaction and no run would look at it.
      - 'data/isolates/*.yaml'
      - 'src/communitymech/network/**'
      - 'src/communitymech/schema/**'
      # Self-triggering, so a change to this workflow is exercised by the
      # workflow itself rather than shipped untested. The sibling
      # label-correspondence.yaml already does this.
      - '.github/workflows/network-quality.yml'
  push:
    branches:
      - main
      - manual-network-curation
    paths:
      - 'kb/communities/*.yaml'
  workflow_dispatch:
    inputs:
      suggest_repairs:
        description: 'Also generate LLM repair suggestions (calls the Anthropic API — incurs cost)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-network:
    runs-on: ubuntu-latest
    name: Audit Network Integrity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # `--report` writes the detailed report *and* signals the outcome through
      # its exit code, so one invocation gives us both the artifact and the
      # verdict. The four outcomes are distinguished by code — `outcome` alone
      # collapses them all to "failure" — and published as `result` for every
      # downstream step. The step itself always exits 0, so nothing here needs
      # `continue-on-error` (which would in turn make `failure()` permanently
      # false).
      - name: Run network integrity audit
        id: audit
        run: |
          mkdir -p reports
          set +e
          uv run communitymech audit-network --report reports/network_audit.txt
          code=$?
          set -e
          case "$code" in
            0) result=clean ;;
            1) result=warnings ;;
            3) result=errors ;;
            *) result=crash ;;
          esac
          # A findings code with no report is a crash whatever the number says.
          # The CLI's own handler always yields 2, but exit 1 is still reachable
          # from outside it — `uv run` failing, or the console script dying at
          # import — and that used to route here and now would not (#323).
          if [ "$result" != "clean" ] && [ ! -s reports/network_audit.txt ]; then
            result=crash
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "audit-network exited $code ($result)"

      - name: Upload audit report
        if: hashFiles('reports/network_audit.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: network-audit-report
          path: reports/network_audit.txt

      # Four outcomes, and three of them are non-zero, so the exit code rather
      # than `outcome` decides which is which:
      #   clean     — exit 0
      #   warnings  — exit 1, DISCONNECTED only     → reported, does not gate
      #   errors    — exit 3, broken references     → fails the job (#273)
      #   crash     — exit 2, no report written     → must be loud
      # A single malformed community YAML is recorded as an UNREADABLE finding
      # against that record (issue #281) and so lands in `errors`, not `crash`;
      # only the auditor failing outright — every file unreadable, or the CLI
      # dying — produces `crash`. Either way it must not be swallowed.
      - name: Write job summary
        if: always()
        run: |
          case "${{ steps.audit.outputs.result }}" in
            clean)
              echo "## Network integrity: no issues found" >> "$GITHUB_STEP_SUMMARY"
              ;;
            errors|warnings)
              if [ "${{ steps.audit.outputs.result }}" = "errors" ]; then
                heading="## Network integrity: broken references"
                note="These fail the build: something the record names does not exist (a taxon, causal-edge target or discussion anchor), an id disagrees with its taxonomy entry, two taxonomy entries share one name, or a record could not be parsed. Only [error] lines gate."
              else
                heading="## Network integrity findings"
                note="Warnings only — a member with no interaction yet, or a participant matched by ontology id rather than by name, or one on a community-level interaction that resolves to no member. Reported, but does not fail the build."
              fi
              {
                echo "$heading"
                echo
                echo "$note"
                echo
                echo '```'
                head -c 60000 reports/network_audit.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              {
                echo "## Network integrity audit failed to run"
                echo
                echo "\`audit-network\` exited ${{ steps.audit.outputs.code }} without writing a"
                echo "usable report, which means it crashed rather than finding issues."
                echo "A single malformed record does *not* do this — that is recorded as"
                echo "an UNREADABLE finding and reported above. See the audit step log."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # Maintains ONE comment per pull request, keyed by a hidden marker, rather
      # than appending a fresh copy of a report that can run to 60 KB on every
      # push (issue #285 — two pushes on #284 produced two identical comments).
      #
      # Left non-fatal on purpose: a pull request from a fork gets a read-only
      # token, and failing to post a comment must not redden a reporting-only job.
      - name: Comment on PR with findings
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          AUDIT_RESULT: ${{ steps.audit.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- network-quality-findings -->';
            const REPORT = 'reports/network_audit.txt';

            const result = process.env.AUDIT_RESULT;

            // Crash: the job already fails loudly, and a stale findings comment
            // is better left untouched than overwritten with something that
            // reads like the findings were resolved.
            if (result !== 'clean' && result !== 'warnings' && result !== 'errors') return;
            if (!fs.existsSync(REPORT) && result !== 'clean') return;

            const hasFindings = result === 'warnings' || result === 'errors';
            const isError = result === 'errors';

            // Paginate — the default page size is 30, and on a long-lived pull
            // request our marker would fall off the first page, so the comment
            // would be missed and a duplicate posted anyway.
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            // Nothing to report and nothing said before: stay silent rather than
            // posting "no findings" on every unrelated pull request.
            if (!hasFindings && !existing) return;

            let body;
            if (hasFindings) {
              const report = fs.readFileSync(REPORT, 'utf8');
              const maxLength = 60000;
              const truncated = report.length > maxLength
                ? report.substring(0, maxLength) + '\n\n... (truncated)'
                : report;
              body = [
                MARKER,
                isError
                  ? '## Network integrity: broken references'
                  : '## Network integrity findings',
                '',
                isError
                  ? 'These fail the build: something the record names does not exist (a taxon, causal-edge target or discussion anchor), an id disagrees with its taxonomy entry, two taxonomy entries share one name, or a record could not be parsed. Only [error] lines gate.'
                  : 'Warnings only — a member with no interaction yet, or a participant matched by ontology id rather than by name, or one on a community-level interaction that resolves to no member. Reported, but does not fail the build.',
                '',
                '```',
                truncated,
                '```',
                '',
                'The full report is attached to the workflow run as an artifact.',
              ].join('\n');
            } else {
              body = [
                MARKER,
                '## Network integrity: no findings',
                '',
                'Findings reported earlier on this pull request are now resolved.',
              ].join('\n');
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # Deliberately after the reporting steps, so the summary and the pull
      # request comment are written before the job goes red.
      #
      # This is the hard gate restored by #273. It was reporting-only while
      # `DISCONNECTED` — a curation-completeness signal, not breakage — was the
      # bulk of the findings and could not be told apart from a genuine dangling
      # reference. Severity levels now separate them, and error-severity
      # findings stand at zero, so gating on them reddens `main` only when
      # something is actually broken.
      - name: Fail on broken references
        if: steps.audit.outputs.result == 'errors'
        run: |
          echo "audit-network found error-severity findings — see the report above." >&2
          echo "Either a record names a taxon or interaction that does not exist, or a" >&2
          echo "record could not be parsed at all (UNREADABLE). The report marks each" >&2
          echo "line with its severity; only [error] lines fail the build." >&2
          exit 1

      - name: Fail if the audit could not run
        if: steps.audit.outputs.result == 'crash'
        run: |
          echo "audit-network exited ${{ steps.audit.outputs.code }} and wrote no usable report." >&2
          echo "That is a crash, not a set of findings — see the audit step log above." >&2
          exit 1

  # LLM-assisted repair suggestions. Manual-only: this calls the Anthropic API
  # and writes PR comments, so it must never be triggered by an ordinary push.
  suggest-repairs:
    runs-on: ubuntu-latest
    needs: audit-network
    # `!cancelled()` rather than a bare condition: a job with `needs:` is skipped
    # when the needed job fails, so once the audit became a hard gate this job
    # could only run when there was nothing for it to repair (#318).
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.suggest_repairs }}
    name: Generate Repair Suggestions

    # `secrets` is not available in a step-level `if`, so surface the presence
    # of the key as a job-level env var and test that instead.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Fail early if the API key is missing
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "ANTHROPIC_API_KEY is not configured for this repository." >&2
          echo "Set the secret before requesting repair suggestions." >&2
          exit 1

      - name: Generate LLM repair suggestions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          uv run communitymech repair-network-batch --report-only \
            --output reports/repair_suggestions.yaml \
            --max-communities 20 \
            --max-issues 3

      - name: Upload repair suggestions
        uses: actions/upload-artifact@v4
        with:
          name: network-repair-suggestions
          path: reports/repair_suggestions.yaml
