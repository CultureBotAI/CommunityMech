name: vendored-sync

# Cross-repo durability guard. General Mech governance files are vendored from
# the canonical CultureBotAI/culturebotai-claw manifest at the full commit in
# scripts/.vendored_canon_ref. scripts/check_vendored_sync.sh fetches that
# pinned manifest and this repository's applicable payloads, so drift fails CI.
#
# DELIBERATELY NO `paths:` FILTER. This job used to live in
# label-correspondence.yaml and inherited that workflow's filter, which listed
# only part of the governed set. Editing another governed payload never fired
# the guard, and neither did editing the checker itself or the pinned ref
# (CultureBotAI/TraitMech#198).
#
# A path list cannot be derived from the pinned claw manifest — GitHub evaluates
# `paths:` from static YAML before checkout, so it cannot read the manifest. Any
# hand-maintained list therefore duplicates the governed set, which is precisely
# the drift this guard exists to prevent.
# Running unconditionally removes the failure class instead of re-syncing two
# lists. The job is a thin Bash launcher plus Python's standard library, with no
# uv/OAK, so there is nothing to save by filtering it; the expensive
# label-correspondence gate keeps its filter.
#
# Authority contract: CultureBotAI/culturebotai-claw/docs/guides/VENDORED_GOVERNANCE.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a ref group and may supersede one another. Every non-PR run
  # gets a unique group so GitHub cannot replace a pending main-commit verdict.
  group: vendored-sync-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vendored-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Preserve the fleet retry contract at the workflow boundary: checker
      # exit 1 is retryable (including public claw fetch failures), while exit 2
      # is a non-retryable local precondition failure.
      - name: Verify governed files match pinned claw revision
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            # Capture the status explicitly. `if cmd; then ...; fi` is NOT usable
            # here: an if-statement whose condition fails and which has no else
            # branch returns 0 itself, so a following `status=$?` reads 0 rather
            # than the command's exit code.
            status=0
            bash scripts/check_vendored_sync.sh || status=$?
            case "$status" in
              0)
                exit 0
                ;;
              1)
                ;;
              2)
                # Local precondition failures are deterministic; another
                # network attempt cannot make the pin or identity valid.
                echo "::error::vendored-sync local precondition failure; inspect checker diagnostics" >&2
                exit 2
                ;;
              *)
                echo "::error::vendored-sync returned unexpected exit $status" >&2
                exit "$status"
                ;;
            esac
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::vendored-sync attempt $attempt failed (exit $status); retrying in 5s" >&2
              sleep 5
            fi
          done
          echo "::error::governed files differ from the pinned claw revision, or claw could not be reached after 3 attempts" >&2
          exit 1
