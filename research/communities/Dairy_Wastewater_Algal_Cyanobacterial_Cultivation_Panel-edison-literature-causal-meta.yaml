  description: 'A bounded non-sterile laboratory panel that compared mono-, co-, and sequential cultures
    of the screened phototrophs Chlorella sorokiniana, Euglena gracilis, Synechocystis sp., and Desertifilum
    tharense during dairy-wastewater treatment. The 12-day experiment grew four monocultures, four 1:1
    dry-weight co-cultures, and four sequential cyanobacterium/microalga cultures in 50% diluted raw dairy
    wastewater in 500 mL bottles with 250 mL working volume. Samples were fractionated into phycosphere-attached
    and free-living bacteria for V3-V4 16S rRNA MiSeq profiling, with raw sequence data deposited under
    NCBI BioProject PRJNA1265442. This is a panel record: the four named taxa were assayed across the
    treatment bottles rather than all co-occurring in every bottle, and indigenous dairy-wastewater bacteria
    were intentionally retained by non-sterile sample handling.'
