  description: A defined two-member engineered yeast-bacterium consortium pairing Komagataella phaffii
    with Escherichia coli for co-inducible relayed biosynthesis of natural products. Low-level glucose-responsive
    and blue-light-responsive transcriptional systems were rebuilt separately for the two hosts so a single
    signal could co-induce compound synthesis in coculture. After pathway redirection, genome mining,
    and rewiring of acyl-donor degradation targets, the living consortium produced the reporter molecule
    simvastatin from a simple carbon source and also supported inducible biosynthesis of (2S)-naringenin.
