query: "# Microbial Community Causal-Graph Research Template\n\n## Target Community\n- **Community name:**\
  \ Komagataella-E. coli Co-inducible Biosynthesis Coculture\n- **Community id:** CommunityMech:000343\n\
  - **Community file:** Komagataella_Ecoli_Coinducible_Biosynthesis_Coculture.yaml\n- **Community category:**\
  \ BIOTECHNOLOGY\n- **Ecological state:** ENGINEERED\n- **Community origin:** SYNTHETIC\n- **Environment:**\
  \ laboratory environment | ENVO:01001405 | The consortium was assayed under selected co-growth conditions\
  \ in a controlled coculture on a simple carbon source.\n- **Description:** A defined two-member engineered\
  \ yeast-bacterium consortium pairing Komagataella phaffii with Escherichia coli for co-inducible relayed\
  \ biosynthesis of natural products. Low-level glucose-responsive and blue-light-responsive transcriptional\
  \ systems were rebuilt separately for the two hosts so a single signal could co-induce compound synthesis\
  \ in coculture. After pathway redirection, genome mining, and rewiring of acyl-donor degradation targets,\
  \ the living consortium produced the reporter molecule simvastatin from a simple carbon source and also\
  \ supported inducible biosynthesis of (2S)-naringenin.\n\n## Existing Record Context\n- **Taxa:** Komagataella\
  \ phaffii | Escherichia coli\n- **Known ecological interactions:** \n- **Environmental factors:** Glucose\
  \ and blue-light induction - low-level glucose- and blue light-responsive transcriptional systems -\
  \ Low-level glucose-responsive and blue-light-responsive transcriptional systems were rebuilt separately\
  \ for the host chassis so a single signal could co-induce compound synthesis in the coculture.\n- **Growth\
  \ media / culture conditions:** Simple-carbon-source biosynthesis coculture - The abstract reports a\
  \ living consortium cultured on a simple carbon source but does not provide medium composition, induction\
  \ schedule, incubation temperature, or inoculation ratios.\n- **Associated datasets / resources:** Primary\
  \ publication - K. phaffii-E. coli co-inducible biosynthesis coculture - PMID:42492893 - https://pubmed.ncbi.nlm.nih.gov/42492893/\n\
  - **Existing evidence:** PMID:42492893: This study explores yeast-bacterium consortium without engineered\
  \ interactions for the co-inducible relayed synthesis of natural products. (Supports the design goal\
  \ of a yeast-bacterium consortium for co-inducible relayed biosynthesis.) | PMID:42492893: Low-level\
  \ glucose- and blue light-responsive transcriptional systems are rebuilt separately for each host, allowing\
  \ single-signal co-induced activation of compound synthesis in coculture. (Supports the separately rebuilt\
  \ induction systems and single-signal coculture activation endpoint.) | PMID:42492893: The Komagataella\
  \ phaffii-Escherichia coli consortium is explored for co-growth under selected conditions. (Identifies\
  \ Komagataella phaffii as the yeast member of the two-species engineered consortium.) | PMID:42492893:\
  \ The Komagataella phaffii-Escherichia coli consortium is explored for co-growth under selected conditions.\
  \ (Identifies Escherichia coli as the bacterial member of the two-species engineered consortium.) |\
  \ PMID:42492893: Low-level glucose- and blue light-responsive transcriptional systems are rebuilt separately\
  \ for each host (Supports glucose and blue light response systems as engineered regulatory inputs in\
  \ the coculture design.) | PMID:42492893: cultured on simple carbon source (Supports the simple-carbon-source\
  \ cultivation condition used for the reporter simvastatin-producing living consortium.) | PMID:42492893:\
  \ Synthetic yeast-bacterium consortium enables co-inducible relayed synthesis of chemicals. (Lists the\
  \ exact primary publication for the K. phaffii-E. coli co-inducible biosynthesis coculture.)\n\n## Research\
  \ Objective\n\nBuild a source-backed **causal interaction graph** for the microbial community\n**Komagataella-E.\
  \ coli Co-inducible Biosynthesis Coculture**, suitable for the `ecological_interactions` block of\n\
  `kb/communities/Komagataella_Ecoli_Coinducible_Biosynthesis_Coculture.yaml`. The graph's **nodes are\
  \ mechanistic\ninteractions** and its **directed edges are causal links** (\"interaction A\nenables\
  \ / drives / suppresses interaction B\"). Extract only relationships the\nprimary literature supports;\
  \ do not infer edges that are not stated or directly\nimplied by an experiment.\n\n## Required Findings\n\
  \n### 1. Interaction nodes (the vertices)\n\nFor each mechanistic interaction, report as a table row:\n\
  \n- **name** — a short, unique interaction name (used as the node id and as the\n  `target` of any causal\
  \ edge that points to it).\n- **interaction_type** — one of: MUTUALISM, COMMENSALISM, CROSS_FEEDING,\n\
  \  COMPETITION, PREDATION, SYNTROPHY, NICHE_PARTITIONING, STRAIN_COMPETITION,\n  COLONIZATION_FACILITATION\
  \ (or state \"OTHER: <describe>\" if none fit).\n- **scope** — PAIRWISE (organism→organism) or COMMUNITY_LEVEL\
  \ (emergent /\n  abiotically driven, e.g. electrolysis-supplied H2). PAIRWISE **must** name a\n  source\
  \ taxon.\n- **source_taxon → target_taxon** — the directed pair (who acts on whom). Give\n  NCBITaxon\
  \ CURIEs + labels where resolvable.\n- **metabolites / biological_processes** — the exchanged compound(s)\
  \ (CHEBI) and\n  process(es) (GO) that mediate the interaction.\n- **direction / sign** — does the source\
  \ **increase (+)** or **decrease (−)** the\n  target's growth/activity? State it explicitly.\n- **evidence**\
  \ — a short **verbatim** snippet + its reference (PMID/DOI).\n\n### 2. Causal edges (the arcs)\n\nThis\
  \ is the graph structure. For every ordered pair of nodes where the\nliterature supports a causal link,\
  \ report a row:\n\n- **from** — upstream interaction name (a node from §1).\n- **to** — downstream interaction\
  \ name (a node from §1).\n- **causal link** — one sentence: *how* the upstream interaction causes /\n\
  \  enables / is required for / suppresses the downstream one (e.g. \"H2 produced\n  by the syntrophic\
  \ oxidation lowers pH2 enough for the acetogen to grow, which\n  in turn supplies acetate to the methanogen\"\
  ).\n- **evidence** — verbatim snippet + reference for the causal claim specifically\n  (not just for\
  \ the two endpoints existing).\n\nPrefer chains that a paper demonstrates by perturbation (knockout,\
  \ substrate\nremoval, inhibitor, co-culture vs mono-culture), and say which experiment shows\neach edge.\
  \ Flag any edge that is hypothesized rather than demonstrated.\n\n### 3. Grounding\n\n- CURIEs where\
  \ available: NCBITaxon (taxa), CHEBI (metabolites), GO (processes),\n  ENVO (environment), PMID / DOI\
  \ (evidence).\n- Do not invent taxa, ontology ids, snippets, accession ids, or citations. If a\n  node\
  \ or edge lacks a citable source, omit it or mark it UNVERIFIED.\n\n## Output Format\n\nReturn a curation-focused\
  \ report with:\n\n1. **Scope summary** — the consortium and the top-level function the causal graph\n\
  \   explains (1–3 sentences).\n2. **Node table** — the interaction nodes (§1 columns).\n3. **Edge table**\
  \ — the directed causal edges (§2 columns: from, to, causal\n   link, evidence).\n4. **Adjacency / DOT\
  \ sketch** — a compact `from -> to` edge list (or Graphviz DOT\n   snippet) so the graph can be eyeballed;\
  \ annotate edges with + / − sign.\n5. **Gaps & controversies** — edges the literature disputes, or plausible\
  \ edges\n   with no direct evidence (candidates for a `Discussion`/knowledge-gap note).\n6. **References**\
  \ — every PMID/DOI cited, once.\n\nEach biological claim (node and edge) must carry a verbatim snippet\
  \ and a\nreference. This report is reviewed by a curator before anything is written to\n`kb/communities/`.\n"
